name: CI

on:
  pull_request:
    branches: [development, main]
  workflow_dispatch:

# Least privilege by default; widen per job only when a job needs it (plan §11.7).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Turbo-free monorepo: every job installs with `npm ci` from the committed lockfile, using npm 11.6.2 (package.json
  # `packageManager`). Node 22 bundles npm 10, which reads the npm 11 lockfile as out of sync (optional wasm32 deps).
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - run: npm run lint
      - name: AGENTS.md references real paths and scripts
        run: npm run check:agents-md

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Integration tests (route wrapper, auth, billing webhooks) create and drop their own databases on this
    # throwaway Postgres; REQUIRE_DB makes them fail instead of skipping if it isn't reachable.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: origins
          POSTGRES_PASSWORD: origins
          POSTGRES_DB: origins_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U origins -d origins_dev" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://origins:origins@127.0.0.1:5432/postgres
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - run: npm test

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - run: npm run knip

  # ── Builds ────────────────────────────────────────────────────────────────────────────────────────────────────
  # Two section profiles (plan §5.1.1): `build` is the production profile (no environment variables at all, which
  # resolves to APP_ENV=production) and `build-preview` sets APP_ENV=preview. Each uploads its .next output so the
  # test jobs below reuse it instead of building again.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/content-dates.mjs reads each article's last-updated date from git.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      # Mermaid diagrams are rendered to SVG at build time in Chromium; rendered diagrams are cached by content hash.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.build-cache/mermaid
          key: mermaid-${{ hashFiles('apps/web/content/**/*.mdx', 'apps/web/src/lib/mermaid-*.mjs', 'package-lock.json') }}
          restore-keys: mermaid-
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The build must not need any environment variables or secrets (pages never touch a database).
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-production
          # The build plus the files prebuild/next.config.ts generate (gitignored): the middleware's route manifests
          # and search index in src/generated (the tests read them too) and the generated public files that
          # `next start` serves from disk. Their common root is apps/web, so jobs download into apps/web.
          path: |
            apps/web/.next
            !apps/web/.next/cache
            !apps/web/.next/standalone
            apps/web/src/generated
            apps/web/public/search-index.json
            apps/web/public/_a
          include-hidden-files: true
          retention-days: 3

  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.build-cache/mermaid
          key: mermaid-${{ hashFiles('apps/web/content/**/*.mdx', 'apps/web/src/lib/mermaid-*.mjs', 'package-lock.json') }}
          restore-keys: mermaid-
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-preview
          # The build plus the files prebuild/next.config.ts generate (gitignored): the middleware's route manifests
          # and search index in src/generated (the tests read them too) and the generated public files that
          # `next start` serves from disk. Their common root is apps/web, so jobs download into apps/web.
          path: |
            apps/web/.next
            !apps/web/.next/cache
            !apps/web/.next/standalone
            apps/web/src/generated
            apps/web/public/search-index.json
            apps/web/public/_a
          include-hidden-files: true
          retention-days: 3

  # ── End-to-end on both profiles ───────────────────────────────────────────────────────────────────────────────
  # The route crawl, section release states, registry contract, content protection and every other Chromium spec
  # except the a11y and leak suites (own jobs below), sharded. EXPECT_APP_ENV makes the specs fail if the build
  # artifact was made with the wrong profile. Chromium only in CI for now; Firefox, WebKit, Pixel 7 and iPhone 15
  # run locally and later on staging.
  e2e-production-profile:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      EXPECT_APP_ENV: production
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=chromium --grep-invert "@a11y|@leak" --shard="$SHARD"
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 14
      # Traces, screenshots and videos of failed tests.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-production-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 14

  e2e-preview-profile:
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    # Local Postgres for the auth, account and newsletter specs (they skip without E2E_DB).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: origins
          POSTGRES_PASSWORD: origins
          POSTGRES_DB: origins_e2e
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U origins" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EXPECT_APP_ENV: preview
      SHARD: ${{ matrix.shard }}
      DATABASE_URL: postgres://origins:origins@127.0.0.1:54329/origins_e2e
      E2E_DB: "1"
      ENABLE_TEST_LOGIN: "1"
      BETTER_AUTH_URL: http://127.0.0.1:3100
      TRUSTED_ORIGINS: http://127.0.0.1:3100
      GOOGLE_CLIENT_ID: e2e-fake-client-id
      GOOGLE_CLIENT_SECRET: e2e-fake-client-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-preview
          path: apps/web
      # The same secrets as the billing job, plus the newsletter's: ENTITLEMENT_SECRET (`<kid>:<base64url key>`)
      # signs the paywall cookie, so the "paywall with real sessions" specs need it.
      - name: Generate per-run test secrets
        run: |
          gen() { node -e "console.log(require('crypto').randomBytes(32).toString(process.argv[1]))" "$1"; }
          ENT="ci:$(gen base64url)"; AUTH="$(gen hex)"; LOGIN="$(gen hex)"; NEWS="$(gen hex)"
          for v in "$ENT" "$AUTH" "$LOGIN" "$NEWS"; do echo "::add-mask::$v"; done
          {
            echo "ENTITLEMENT_SECRET=$ENT"
            echo "BETTER_AUTH_SECRET=$AUTH"
            echo "TEST_LOGIN_KEY=$LOGIN"
            echo "NEWSLETTER_TOKEN_SECRET=$NEWS"
          } >> "$GITHUB_ENV"
      - run: npm run db:migrate -w web && npm run db:seed:test -w web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=chromium --grep-invert "@a11y|@leak" --shard="$SHARD"
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-preview-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 14
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-preview-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 14

  # Paywall, billing, webhooks and the full leak suite (plan §12.2, §12.4) on the preview build, against a throwaway
  # Postgres with the seeded test users and the test login. Every secret here is generated for this run only
  # (never a real key); the Dodo API is a local stub started by billing.spec.ts. One worker: the specs share the
  # seeded users and reseed them.
  e2e-billing:
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: origins
          POSTGRES_PASSWORD: origins
          POSTGRES_DB: origins_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U origins -d origins_e2e" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EXPECT_APP_ENV: preview
      APP_ENV: preview
      DATABASE_URL: postgres://origins:origins@127.0.0.1:5432/origins_e2e
      E2E_DB: "1"
      ENABLE_TEST_LOGIN: "1"
      E2E_PORT: "3100"
      BETTER_AUTH_URL: http://127.0.0.1:3100
      DODO_API_KEY: ci-stub-key-not-real
      DODO_API_BASE_URL: http://127.0.0.1:3178
      E2E_DODO_STUB_PORT: "3178"
      DODO_PRODUCT_PRO_MONTHLY: pdt_test_monthly
      DODO_PRODUCT_PRO_YEARLY: pdt_test_yearly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-preview
          path: apps/web
      - name: Per-run test secrets (random, masked, never stored)
        run: |
          gen() { node -e "console.log(require('crypto').randomBytes(32).toString(process.argv[1]))" "$1"; }
          ENT="ci:$(gen base64url)"; HOOK="whsec_$(gen base64)"; AUTH="$(gen hex)"; LOGIN="$(gen hex)"
          for v in "$ENT" "$HOOK" "$AUTH" "$LOGIN"; do echo "::add-mask::$v"; done
          {
            echo "ENTITLEMENT_SECRET=$ENT"
            echo "DODO_WEBHOOK_SECRET=$HOOK"
            echo "BETTER_AUTH_SECRET=$AUTH"
            echo "TEST_LOGIN_KEY=$LOGIN"
          } >> "$GITHUB_ENV"
      - run: npm run db:migrate -w web && npm run db:seed:test -w web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: >-
          npx playwright test tests/e2e/paywall.spec.ts tests/e2e/billing.spec.ts tests/e2e/webhooks.spec.ts
          tests/e2e/leak.spec.ts tests/e2e/auth.spec.ts tests/e2e/account.spec.ts --project=chromium --workers=1
        working-directory: apps/web
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: billing-e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # Kept under its old name so branch protection that requires `e2e-crawl` keeps working: it passes only when the
  # crawl passed on both profiles.
  e2e-crawl:
    needs: [e2e-production-profile, e2e-preview-profile]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both profiles passed
        env:
          PRODUCTION: ${{ needs.e2e-production-profile.result }}
          PREVIEW: ${{ needs.e2e-preview-profile.result }}
        run: |
          echo "production profile: $PRODUCTION, preview profile: $PREVIEW"
          test "$PRODUCTION" = success && test "$PREVIEW" = success

  # ── Quality gates on the production build ─────────────────────────────────────────────────────────────────────
  # Visual snapshots run in the official Playwright image, the same image `npm run e2e:visual -w web` uses locally,
  # so screenshots match the committed baselines pixel for pixel. Keep the tag equal to @playwright/test's version.
  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web
      - run: npx playwright test --project=visual
        working-directory: apps/web
      # On failure the report holds expected, actual and diff images for every changed screenshot.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  a11y:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=chromium --grep @a11y
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: apps/web/playwright-report/
          retention-days: 14

  # Paywall leak suite (plan §12.4) on the production profile: nothing premium is built, and no canary reaches any
  # surface. The preview-profile run (canary built, Pro sees it) is in e2e-billing.
  leak-scaffold:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=chromium --grep @leak
        working-directory: apps/web
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leak-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # JavaScript budgets per route type (plan §6), from the build manifests. See apps/web/.size-limit.cjs.
  size-limit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web
      - run: npm run size -w web

  # Lighthouse CI (plan §6) on `next start`: 4 pages, mobile, 3 runs, median. Reports are only kept as a workflow
  # artifact (no Lighthouse server, no public upload). Uses the runner's preinstalled Google Chrome.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web
      - run: npm run lighthouse -w web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/web/test-results/lighthouse/
          retention-days: 30

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --verbose .

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed # 1.184.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Open-source registry rule packs only; no Semgrep account or token. Paths to skip are in .semgrepignore.
      - run: >-
          semgrep scan --error --metrics=off
          --config p/javascript --config p/typescript --config p/react --config p/nextjs
          --config p/owasp-top-ten --config p/secrets

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Known, accepted advisories (with reasons and expiry dates) live in osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --lockfile=./package-lock.json
