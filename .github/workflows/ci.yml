name: CI

on:
  pull_request:
    branches: [development, main]
  workflow_dispatch:

# Least privilege by default; widen per job only when a job needs it (plan §11.7).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Turbo-free monorepo: every job installs with `npm ci` from the committed lockfile.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: AGENTS.md references real paths and scripts
        run: npm run check:agents-md

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run knip

  # ── Builds ────────────────────────────────────────────────────────────────────────────────────────────────────
  # Two section profiles (plan §5.1.1): `build` is the production profile (no environment variables at all, which
  # resolves to APP_ENV=production) and `build-preview` sets APP_ENV=preview. Each uploads its .next output so the
  # test jobs below reuse it instead of building again.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/content-dates.mjs reads each article's last-updated date from git.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Mermaid diagrams are rendered to SVG at build time in Chromium; rendered diagrams are cached by content hash.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.build-cache/mermaid
          key: mermaid-${{ hashFiles('apps/web/content/**/*.mdx', 'apps/web/src/lib/mermaid-*.mjs', 'package-lock.json') }}
          restore-keys: mermaid-
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The build must not need any environment variables or secrets (pages never touch a database).
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-production
          path: |
            apps/web/.next
            !apps/web/.next/cache
            !apps/web/.next/standalone
          include-hidden-files: true
          retention-days: 3

  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.build-cache/mermaid
          key: mermaid-${{ hashFiles('apps/web/content/**/*.mdx', 'apps/web/src/lib/mermaid-*.mjs', 'package-lock.json') }}
          restore-keys: mermaid-
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-preview
          path: |
            apps/web/.next
            !apps/web/.next/cache
            !apps/web/.next/standalone
          include-hidden-files: true
          retention-days: 3

  # ── End-to-end on both profiles ───────────────────────────────────────────────────────────────────────────────
  # The route crawl, section release states, registry contract, content protection and every other Chromium spec
  # except the a11y and leak suites (own jobs below), sharded. EXPECT_APP_ENV makes the specs fail if the build
  # artifact was made with the wrong profile. Chromium only in CI for now; Firefox, WebKit, Pixel 7 and iPhone 15
  # run locally and later on staging.
  e2e-production-profile:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      EXPECT_APP_ENV: production
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web/.next
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=chromium --grep-invert "@a11y|@leak" --shard="$SHARD"
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 14
      # Traces, screenshots and videos of failed tests.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-production-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 14

  e2e-preview-profile:
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      EXPECT_APP_ENV: preview
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-preview
          path: apps/web/.next
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=chromium --grep-invert "@a11y|@leak" --shard="$SHARD"
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-preview-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 14
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-preview-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 14

  # Kept under its old name so branch protection that requires `e2e-crawl` keeps working: it passes only when the
  # crawl passed on both profiles.
  e2e-crawl:
    needs: [e2e-production-profile, e2e-preview-profile]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both profiles passed
        env:
          PRODUCTION: ${{ needs.e2e-production-profile.result }}
          PREVIEW: ${{ needs.e2e-preview-profile.result }}
        run: |
          echo "production profile: $PRODUCTION, preview profile: $PREVIEW"
          test "$PRODUCTION" = success && test "$PREVIEW" = success

  # ── Quality gates on the production build ─────────────────────────────────────────────────────────────────────
  # Visual snapshots run in the official Playwright image, the same image `npm run e2e:visual -w web` uses locally,
  # so screenshots match the committed baselines pixel for pixel. Keep the tag equal to @playwright/test's version.
  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web/.next
      - run: npx playwright test --project=visual
        working-directory: apps/web
      # On failure the report holds expected, actual and diff images for every changed screenshot.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  a11y:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web/.next
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=chromium --grep @a11y
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: apps/web/playwright-report/
          retention-days: 14

  # Paywall leak suite (plan §12.4), scaffold until Phase 5 gates premium pages.
  leak-scaffold:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web/.next
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=chromium --grep @leak
        working-directory: apps/web
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leak-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # JavaScript budgets per route type (plan §6), from the build manifests. See apps/web/.size-limit.cjs.
  size-limit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web/.next
      - run: npm run size -w web

  # Lighthouse CI (plan §6) on `next start`: 4 pages, mobile, 3 runs, median. Reports are only kept as a workflow
  # artifact (no Lighthouse server, no public upload). Uses the runner's preinstalled Google Chrome.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-production
          path: apps/web/.next
      - run: npm run lighthouse -w web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/web/test-results/lighthouse/
          retention-days: 30

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --verbose .

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed # 1.184.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Open-source registry rule packs only; no Semgrep account or token. Paths to skip are in .semgrepignore.
      - run: >-
          semgrep scan --error --metrics=off
          --config p/javascript --config p/typescript --config p/react --config p/nextjs
          --config p/owasp-top-ten --config p/secrets

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Known, accepted advisories (with reasons and expiry dates) live in osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --lockfile=./package-lock.json
