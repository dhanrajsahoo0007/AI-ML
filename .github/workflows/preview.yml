name: Preview

# One preview version per PR (plan §7.6), in two workflows so PR code never runs next to the Cloudflare token
# (security review M4):
#
#   1. Preview (this file, `pull_request`): builds the PR with APP_ENV=preview in an unprivileged job (no secrets, no
#      environment, read-only token) and uploads the OpenNext output as an artifact. Everything the PR controls
#      (npm lifecycle scripts, next.config.ts, scripts/*, the lockfile) runs here, where there is nothing to steal.
#   2. Preview deploy (preview-deploy.yml, `workflow_run`): runs the workflow file and the code of the default
#      branch, never the PR's. It downloads that artifact as data and uploads it as a version of the
#      `origins-ai-learn-preview` Worker with the default branch's wrangler.jsonc and pinned wrangler, then
#      smoke-tests it and comments the URL on the PR.
#
# PRs from forks build here but are never deployed (preview-deploy.yml checks the head repository).

on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No `environment` and no secrets: this job runs the PR's code.
    permissions:
      contents: read
    env:
      APP_ENV: preview
      NEXT_PUBLIC_GIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.6.2 && npm ci
      - name: Install Chromium (Mermaid diagrams are rendered at build)
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build for Workers (OpenNext)
        run: npm run cf:build -w web
      # Only the build output. The deploy job treats it as untrusted data: it never executes anything from it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-build
          path: apps/web/.open-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
