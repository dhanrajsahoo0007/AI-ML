name: Preview

# One preview version per PR (plan §7.6): builds with APP_ENV=preview, uploads a version of the
# `origins-ai-learn-preview` Worker with the alias `pr-<number>` (it never takes traffic), smoke-tests it and
# comments the URL on the PR. From Phase 4 a Neon branch per PR is added here.
#
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the `preview` GitHub environment. Until they
# exist, and for PRs from forks (which never get secrets), the job succeeds with a notice and uploads nothing.
# First run: if the preview Worker doesn't exist yet it is created with one `wrangler deploy`.

on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    permissions:
      contents: read
      pull-requests: write # the preview URL comment
    env:
      APP_ENV: preview
      WRANGLER_ENV: preview
      WORKER: origins-ai-learn-preview
      ALIAS: pr-${{ github.event.pull_request.number }}
      NEXT_PUBLIC_GIT_SHA: ${{ github.event.pull_request.head.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "::notice title=Preview skipped::PRs from forks get no secrets, so no preview is uploaded."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Preview skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set for the preview environment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Install Chromium (Mermaid diagrams are rendered at build)
        if: steps.creds.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Build for Workers (OpenNext)
        if: steps.creds.outputs.ready == 'true'
        run: npm run cf:build -w web
      - name: Populate the incremental cache
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare populateCache remote --env "$WRANGLER_ENV"
        working-directory: apps/web

      - name: Create the preview Worker on first use
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER}/deployments")
          if [ "$code" = "404" ]; then
            npx wrangler deploy --env "$WRANGLER_ENV" --message "Create the preview Worker"
          fi

      - name: Upload the preview version
        if: steps.creds.outputs.ready == 'true'
        id: upload
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          set -euo pipefail
          npx wrangler versions upload --env "$WRANGLER_ENV" --preview-alias "$ALIAS" \
            --tag "${NEXT_PUBLIC_GIT_SHA::12}" --message "PR #${{ github.event.pull_request.number }} ${NEXT_PUBLIC_GIT_SHA::7}"
          out=$(jq -c 'select(.type == "version-upload")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)
          {
            echo "version=$(jq -r '.version_id' <<<"$out")"
            echo "url=$(jq -r '.preview_url // ""' <<<"$out")"
            echo "alias_url=$(jq -r '.preview_alias_url // ""' <<<"$out")"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test the preview
        if: steps.upload.outcome == 'success'
        env:
          BASE: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          [ -n "$BASE" ] || { echo "::error::wrangler returned no preview URL (is preview_urls on?)"; exit 1; }
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          code=$(curl -sS -A "$ua" --max-time 20 -o "$RUNNER_TEMP/body" -D "$RUNNER_TEMP/head" -w '%{http_code}' "$BASE/")
          [ "$code" = "200" ] || { echo "::error::/ returned ${code}"; exit 1; }
          grep -qi "^x-app-version: ${NEXT_PUBLIC_GIT_SHA}" "$RUNNER_TEMP/head" || { echo "::error::wrong or missing x-app-version"; exit 1; }
          grep -q "<h1" "$RUNNER_TEMP/body" || { echo "::error::/ has no <h1>"; exit 1; }

      - name: Comment the preview URL
        if: steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
          VERSION: ${{ steps.upload.outputs.version }}
        run: |
          set -euo pipefail
          marker="<!-- workers-preview -->"
          body="${marker}
          **Preview** for \`${NEXT_PUBLIC_GIT_SHA::7}\` (APP_ENV=preview)

          - Stable for this PR: ${ALIAS_URL:-n/a}
          - This commit: ${URL}
          - Worker version: \`${VERSION}\`"
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi
