# Local git hooks. One-time setup: `pipx install pre-commit && pre-commit install` (or `brew install pre-commit`).
# CI runs the same gitleaks scan on every PR, so the hook is a fast early warning, not the only gate.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
