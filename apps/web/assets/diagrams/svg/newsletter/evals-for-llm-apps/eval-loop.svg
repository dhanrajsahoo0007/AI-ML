<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1270" width="1080" height="1270" class="nlf-root nlf-evals"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#3f6f58)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#e4efe8)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#3f6f58)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-evals{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#9fd2b4;--nlf-accent-soft:#1b2c23;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1270" fill="url(#nlf-dots)"/><circle cx="540" cy="630" r="250" class="nlf-f-accent-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">The eval loop</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Five steps. The first three need no tools at all.</text><line x1="64" y1="1080" x2="1016" y2="1080" class="nlf-s-line" stroke-width="2"/><text class="nlf-t nlf-f-accent" font-size="32" font-weight="800" text-anchor="middle"><tspan x="540" y="621.2">the eval</tspan></text><text class="nlf-t nlf-f-accent" font-size="32" font-weight="800" text-anchor="middle"><tspan x="540" y="665.2">loop</tspan></text><g data-step="1"><rect x="390" y="238" width="300" height="164" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="390" y="238" width="300" height="164" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="540" cy="288" r="30" class="nlf-f-blue"/><g transform="translate(523.5 271.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="middle"><tspan x="540" y="345.9">Collect</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="540" y="380.4">real questions, real answers</tspan></text><circle cx="398" cy="246" r="22" class="nlf-f-blue"/><circle cx="398" cy="246" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="398" y="254.4">1</tspan></text></g><g data-step="2"><path d="M667.0 410.1 L708.7 439.7" fill="none" class="nlf-s-blue" stroke-width="5" stroke-linecap="round"/><path d="M723.0 449.9 L698.1 447.0 L712.1 427.3 Z" class="nlf-f-blue"/><rect x="700" y="458" width="300" height="164" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="700" y="458" width="300" height="164" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="850" cy="508" r="30" class="nlf-f-amber"/><g transform="translate(833.5 491.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="middle"><tspan x="850" y="565.9">Read</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="850" y="600.4">pass or fail, and why</tspan></text><circle cx="708" cy="466" r="22" class="nlf-f-amber"/><circle cx="708" cy="466" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="708" y="474.4">2</tspan></text></g><g data-step="3"><path d="M820.9 635.4 L774.3 787.8" fill="none" class="nlf-s-amber" stroke-width="5" stroke-linecap="round"/><path d="M769.1 804.6 L764.0 780.0 L787.1 787.1 Z" class="nlf-f-amber"/><rect x="590" y="818" width="300" height="164" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="590" y="818" width="300" height="164" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="740" cy="868" r="30" class="nlf-f-risk"/><g transform="translate(723.5 851.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="middle"><tspan x="740" y="925.9">Name</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="740" y="960.4">the failure types</tspan></text><circle cx="598" cy="826" r="22" class="nlf-f-risk"/><circle cx="598" cy="826" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="598" y="834.4">3</tspan></text></g><g data-step="4"><path d="M576.0 900.0 L521.6 900.0" fill="none" class="nlf-s-risk" stroke-width="5" stroke-linecap="round"/><path d="M504.0 900.0 L526.0 887.9 L526.0 912.1 Z" class="nlf-f-risk"/><rect x="190" y="818" width="300" height="164" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="190" y="818" width="300" height="164" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="340" cy="868" r="30" class="nlf-f-violet"/><g transform="translate(323.5 851.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="middle"><tspan x="340" y="925.9">Check</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="340" y="960.4">one test per failure</tspan></text><circle cx="198" cy="826" r="22" class="nlf-f-violet"/><circle cx="198" cy="826" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="198" y="834.4">4</tspan></text></g><g data-step="5"><path d="M310.9 804.6 L264.3 652.2" fill="none" class="nlf-s-violet" stroke-width="5" stroke-linecap="round"/><path d="M259.1 635.4 L277.1 652.9 L254.0 660.0 Z" class="nlf-f-violet"/><path d="M357.0 449.9 L398.7 420.3" fill="none" class="nlf-s-accent" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 15"/><path d="M413.0 410.1 L402.1 432.7 L388.1 413.0 Z" class="nlf-f-accent"/><rect x="80" y="458" width="300" height="164" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="80" y="458" width="300" height="164" rx="26" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="230" cy="508" r="30" class="nlf-f-accent"/><g transform="translate(213.5 491.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="middle"><tspan x="230" y="565.9">Run</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="230" y="600.4">on every change</tspan></text><circle cx="88" cy="466" r="22" class="nlf-f-accent"/><circle cx="88" cy="466" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="88" y="474.4">5</tspan></text></g><g data-step-only="1"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1168.6">Collect: save what users really asked and what the app</tspan><tspan x="540" y="1207.7">really answered. Fifty is enough to start.</tspan></text></g><g data-step-only="2"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1168.6">Read: go through them yourself. Mark each one pass or</tspan><tspan x="540" y="1207.7">fail and write one line saying why.</tspan></text></g><g data-step-only="3"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1168.6">Name: group your notes. The same few failure types will</tspan><tspan x="540" y="1207.7">keep coming up. Count them.</tspan></text></g><g data-step-only="4"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1168.6">Check: write one automatic test for each failure type,</tspan><tspan x="540" y="1207.7">starting with the biggest.</tspan></text></g><g data-step-only="5"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1168.6">Run: score every change before it ships. New failures</tspan><tspan x="540" y="1207.7">from real users go back into the set.</tspan></text></g></svg>
