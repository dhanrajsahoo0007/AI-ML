<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1090" width="1080" height="1090" class="nlf-root nlf-evals"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#3f6f58)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#e4efe8)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#3f6f58)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-evals{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#9fd2b4;--nlf-accent-soft:#1b2c23;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1090" fill="url(#nlf-dots)"/><circle cx="410" cy="530" r="280" class="nlf-f-accent-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Three graders</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Use the cheapest one that can tell good from bad.</text><line x1="64" y1="900" x2="1016" y2="900" class="nlf-s-line" stroke-width="2"/><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="410" y="240.8">who grades</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="868" y="240.8">speed · cost</tspan></text><g data-step="1"><rect x="130" y="255" width="560" height="150" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="130" y="255" width="560" height="150" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="192" cy="330" r="34" class="nlf-f-blue"/><g transform="translate(173.3 311.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="start"><tspan x="246" y="323.8">Code</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="246" y="358.5">format, facts, forbidden words</tspan></text><circle cx="138" cy="263" r="22" class="nlf-f-blue"/><circle cx="138" cy="263" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="138" y="271.4">1</tspan></text><rect x="747.2" y="307.2" width="241.6" height="45.6" rx="22.8" class="nlf-f-blue-soft"/><text class="nlf-t nlf-f-blue" font-size="24" font-weight="700" text-anchor="middle"><tspan x="868" y="338.4">instant · free</tspan></text></g><g data-step="2"><rect x="130" y="451" width="560" height="150" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="130" y="451" width="560" height="150" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="192" cy="526" r="34" class="nlf-f-violet"/><g transform="translate(173.3 507.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="start"><tspan x="246" y="519.8">A model judge</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="246" y="554.5">tone, accuracy, helpfulness</tspan></text><circle cx="138" cy="459" r="22" class="nlf-f-violet"/><circle cx="138" cy="459" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="138" y="467.4">2</tspan></text><rect x="740.0" y="503.2" width="256.0" height="45.6" rx="22.8" class="nlf-f-violet-soft"/><text class="nlf-t nlf-f-violet" font-size="24" font-weight="700" text-anchor="middle"><tspan x="868" y="534.4">seconds · cents</tspan></text></g><g data-step="3"><rect x="130" y="647" width="560" height="150" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="130" y="647" width="560" height="150" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="192" cy="722" r="34" class="nlf-f-amber"/><g transform="translate(173.3 703.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="start"><tspan x="246" y="715.8">A person</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="246" y="750.5">sets the standard</tspan></text><circle cx="138" cy="655" r="22" class="nlf-f-amber"/><circle cx="138" cy="655" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="138" y="663.4">3</tspan></text><rect x="732.8" y="699.2" width="270.4" height="45.6" rx="22.8" class="nlf-f-amber-soft"/><text class="nlf-t nlf-f-amber" font-size="24" font-weight="700" text-anchor="middle"><tspan x="868" y="730.4">minutes · costly</tspan></text></g><g data-step-only="1"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="988.6">Code first. If a rule can decide it (valid JSON? right</tspan><tspan x="540" y="1027.7">price? has a link?), write the rule.</tspan></text></g><g data-step-only="2"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="988.6">A model next, for what needs judgement. Ask it one</tspan><tspan x="540" y="1027.7">yes-or-no question, not for a score out of ten.</tspan></text></g><g data-step-only="3"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="988.6">A person last. People are slow, so use them to set the</tspan><tspan x="540" y="1027.7">standard and to check the judge.</tspan></text></g></svg>
