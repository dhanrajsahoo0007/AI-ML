oin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="174" y="359.4">Wrong refund policy</tspan></text><text class="nlf-t nlf-f-muted" font-size="38" font-weight="800" text-anchor="middle"><tspan x="640" y="363.3">9</tspan></text><text class="nlf-t nlf-f-ink" font-size="38" font-weight="800" text-anchor="middle"><tspan x="780" y="363.3">2</tspan></text><rect x="891.0" y="326.3" width="70.0" height="47.5" rx="23.8" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="25" font-weight="700" text-anchor="middle"><tspan x="926" y="358.8">−7</tspan></text><rect x="64" y="438" width="952" height="116" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="438" width="952" height="116" rx="24" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.3"/><circle cx="122" cy="496" r="30" class="nlf-f-blue"/><g transform="translate(105.5 479.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="174" y="505.4">Invented order details</tspan></text><text class="nlf-t nlf-f-muted" font-size="38" font-weight="800" text-anchor="middle"><tspan x="640" y="509.3">6</tspan></text><text class="nlf-t nlf-f-ink" font-size="38" font-weight="800" text-anchor="middle"><tspan x="780" y="509.3">5</tspan></text><rect x="891.0" y="472.3" width="70.0" height="47.5" rx="23.8" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="25" font-weight="700" text-anchor="middle"><tspan x="926" y="504.8">−1</tspan></text><rect x="64" y="584" width="952" height="116" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="6