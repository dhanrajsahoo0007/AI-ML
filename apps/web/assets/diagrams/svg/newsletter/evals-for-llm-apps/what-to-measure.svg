<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1100" width="1080" height="1100" class="nlf-root nlf-evals"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#3f6f58)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#e4efe8)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#3f6f58)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-evals{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#9fd2b4;--nlf-accent-soft:#1b2c23;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1100" fill="url(#nlf-dots)"/><circle cx="380" cy="590" r="290" class="nlf-f-accent-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Grading an agent</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">An agent gives you four things to measure, not one.</text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="380" y="252.8">what you measure</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="858" y="252.8">how to use it</tspan></text><rect x="110" y="272" width="540" height="136" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="110" y="272" width="540" height="136" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="172" cy="340" r="34" class="nlf-f-ok"/><g transform="translate(153.3 321.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="226" y="334.0">The outcome</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="226" y="367.9">is the job really done?</tspan></text><rect x="722.8" y="317.2" width="270.4" height="45.6" rx="22.8" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="24" font-weight="700" text-anchor="middle"><tspan x="858" y="348.4">grade this first</tspan></text><rect x="110" y="440" width="540" height="136" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="110" y="440" width="540" height="136" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="172" cy="508" r="34" class="nlf-f-blue"/><g transform="translate(153.3 489.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M14.5 5.5a4 4 0 0 0-5 5L3.5 16.5a2 2 0 0 0 3 3l6-6a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="226" y="502.0">The steps</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="226" y="535.9">which tools, how many turns</tspan></text><rect x="701.2" y="485.2" width="313.6" height="45.6" rx="22.8" class="nlf-f-blue-soft"/><text class="nlf-t nlf-f-blue" font-size="24" font-weight="700" text-anchor="middle"><tspan x="858" y="516.4">read, don't dictate</tspan></text><rect x="110" y="608" width="540" height="136" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="110" y="608" width="540" height="136" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="172" cy="676" r="34" class="nlf-f-amber"/><g transform="translate(153.3 657.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M14.6 9.6c-.4-.8-1.4-1.300-2.600-1.300-1.400 0-2.400.7-2.400 1.800 0 2.500 5 1.200 5 3.800 0 1.100-1.100 1.900-2.600 1.900-1.300 0-2.300-.5-2.700-1.400"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="226" y="670.0">The cost</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="226" y="703.9">tokens and money per task</tspan></text><rect x="751.6" y="653.2" width="212.8" height="45.6" rx="22.8" class="nlf-f-amber-soft"/><text class="nlf-t nlf-f-amber" font-size="24" font-weight="700" text-anchor="middle"><tspan x="858" y="684.4">set a budget</tspan></text><rect x="110" y="776" width="540" height="136" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="110" y="776" width="540" height="136" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="172" cy="844" r="34" class="nlf-f-violet"/><g transform="translate(153.3 825.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="226" y="838.0">The time</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="226" y="871.9">seconds from start to done</tspan></text><rect x="758.8" y="821.2" width="198.4" height="45.6" rx="22.8" class="nlf-f-violet-soft"/><text class="nlf-t nlf-f-violet" font-size="24" font-weight="700" text-anchor="middle"><tspan x="858" y="852.4">set a limit</tspan></text><rect x="92.5" y="982.3" width="895.0" height="47.5" rx="23.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="1014.8">Run each task several times: agents vary from run to run.</tspan></text></svg>
