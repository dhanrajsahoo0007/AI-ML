c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1010" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Before release, after release</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">The test set grows every time a real user finds a bug.</text><rect x="64" y="330" width="440" height="500" rx="34" class="nlf-f-accent-soft"/><rect x="64" y="330" width="440" height="500" rx="34" fill="none" class="nlf-s-accent" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-accent" font-size="32" font-weight="800" text-anchor="middle"><tspan x="284" y="393.2">Before release</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="284" y="430.8">your test set, on every change</tspan></text><rect x="94" y="468" width="380" height="96" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="94" y="468" width="380" height="96" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="156" cy="516" r="34" class="nlf-f-blue"/><g transform="translate(137.3 497.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d=