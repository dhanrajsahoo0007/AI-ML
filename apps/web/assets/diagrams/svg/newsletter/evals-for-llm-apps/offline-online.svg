rs, every day</tspan></text><rect x="606" y="468" width="380" height="96" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="606" y="468" width="380" height="96" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="668" cy="516" r="34" class="nlf-f-amber"/><g transform="translate(649.3 497.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="722" y="525.5">Watch real traffic</tspan></text><rect x="606" y="584" width="380" height="96" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="606" y="584" width="380" height="96" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="668" cy="632" r="34" class="nlf-f-violet"/><g transform="translate(649.3 613.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="722" y="641.5">Grade a sample</tspan></text><rect x="606" y="700" width="380" height="96" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="606" y="700" width="380" height="96" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="668" cy="748" r="34" class="nlf-f-risk"/><g transform="translate(649.3 729.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="722" y="757.5">Spot new failures</tspan></text><circle cx="284.0" cy="300.0" r="7" class="nlf-f-ok"/><path d="M284.0 300.0 Q540.0 346.0 778.7 303.1" fill="none" class="nlf-s-ok" stroke-width="5" stroke-linecap="round"/><path d="M796.0 300.0 L776.5 315.8 L772.2 292.0 Z" class="nlf-f-ok"/><rect x="340.0" y="208.3" width="400.0" height="47.5" rx="23.8" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="240.8">passes the gate: ship it</tspan></text><circle cx="796.0" cy="862.0" r="7" class="nlf-f-risk"/><path d="M796.0 862.0 Q540.0 816.0 301.3 858.9" fill="none" class="nlf-s-risk" stroke-width="5" stroke-linecap="round"/><path d="M284.0 862.0 L303.5 846.2 L307.8 870.0 Z" class="nlf-f-risk"/><rect x="250.0" y="910.3" width="580.0" height="47.5" rx="23.8" class="nlf-f-risk-soft"/><text class="nlf-t nlf-f-risk" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="942.8">each new failure becomes a test case</tspan></text></svg>
