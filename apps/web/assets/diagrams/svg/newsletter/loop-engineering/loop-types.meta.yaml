title: Four kinds of loop
alt: >-
  Four loops from hands-on to hands-off. Turn-based: you prompt and the agent checks its own work, so you hand over the
  checking. Goal-based: runs until a goal is met, you hand over when to stop. Time-based: runs on a schedule, you hand
  over when to start. Proactive: an event starts it, you hand over the prompt.
caption: "Move down one rung at a time: each kind of loop hands one more decision to the system."
slide: Four kinds of loop. Each one hands a little more of your job to the system.
