<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1160" width="1080" height="1160" class="nlf-root nlf-loop"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#c2412d)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#ffece5)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#c2412d)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-loop{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#ff9a82;--nlf-accent-soft:#3a1f18;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1160" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Four layers of one craft</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Each layer wraps the one before. The loop is the outermost.</text><rect x="64" y="220" width="952" height="880" rx="36" class="nlf-f-accent-soft" filter="url(#nlf-shadow)"/><rect x="64" y="220" width="952" height="880" rx="36" fill="none" class="nlf-s-accent" stroke-width="2.5" stroke-opacity="0.5"/><circle cx="134" cy="295" r="32" class="nlf-f-accent"/><g transform="translate(116.4 277.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></g><text class="nlf-t nlf-f-accent" font-size="31" font-weight="800" text-anchor="start"><tspan x="186" y="284.9">Loop engineering</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="186" y="326.8">decides when the agent runs again, and when it stops</tspan></text><rect x="826.4" y="251.2" width="155.2" height="45.6" rx="22.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="904" y="282.4">mid-2026</tspan></text><rect x="108" y="370" width="864" height="686" rx="36" class="nlf-f-teal-soft" filter="url(#nlf-shadow)"/><rect x="108" y="370" width="864" height="686" rx="36" fill="none" class="nlf-s-teal" stroke-width="2.5" stroke-opacity="0.5"/><circle cx="178" cy="445" r="32" class="nlf-f-teal"/><g transform="translate(160.4 427.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></g><text class="nlf-t nlf-f-teal" font-size="31" font-weight="800" text-anchor="start"><tspan x="230" y="434.9">Harness engineering</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="230" y="476.8">decides what the agent can do, and checks its work</tspan></text><rect x="811.2" y="401.2" width="97.6" height="45.6" rx="22.8" class="nlf-f-teal-soft"/><text class="nlf-t nlf-f-teal" font-size="24" font-weight="700" text-anchor="middle"><tspan x="860" y="432.4">2026</tspan></text><rect x="152" y="520" width="776" height="492" rx="36" class="nlf-f-blue-soft" filter="url(#nlf-shadow)"/><rect x="152" y="520" width="776" height="492" rx="36" fill="none" class="nlf-s-blue" stroke-width="2.5" stroke-opacity="0.5"/><circle cx="222" cy="595" r="32" class="nlf-f-blue"/><g transform="translate(204.4 577.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><rect x="6" y="3" width="13" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/><path d="M9.5 8h6M9.5 11.5h6M9.5 15h4"/></g><text class="nlf-t nlf-f-blue" font-size="31" font-weight="800" text-anchor="start"><tspan x="274" y="584.9">Context engineering</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="274" y="626.8">decides what the model sees on each turn</tspan></text><rect x="767.2" y="551.2" width="97.6" height="45.6" rx="22.8" class="nlf-f-blue-soft"/><text class="nlf-t nlf-f-blue" font-size="24" font-weight="700" text-anchor="middle"><tspan x="816" y="582.4">2025</tspan></text><rect x="196" y="670" width="688" height="298" rx="36" class="nlf-f-amber-soft" filter="url(#nlf-shadow)"/><rect x="196" y="670" width="688" height="298" rx="36" fill="none" class="nlf-s-amber" stroke-width="2.5" stroke-opacity="0.5"/><circle cx="266" cy="745" r="32" class="nlf-f-amber"/><g transform="translate(248.4 727.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></g><text class="nlf-t nlf-f-amber" font-size="31" font-weight="800" text-anchor="start"><tspan x="318" y="734.9">Prompt engineering</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="318" y="776.8">decides how one request is worded</tspan></text><rect x="723.2" y="701.2" width="97.6" height="45.6" rx="22.8" class="nlf-f-amber-soft"/><text class="nlf-t nlf-f-amber" font-size="24" font-weight="700" text-anchor="middle"><tspan x="772" y="732.4">2023</tspan></text><rect x="240" y="836" width="600" height="92" rx="22" class="nlf-f-surface"/><text class="nlf-t nlf-f-ink" font-size="27" font-weight="600" text-anchor="middle"><tspan x="540" y="891.5">“Fix the failing test in parser.ts”</tspan></text></svg>
