<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1260" width="1080" height="1260" class="nlf-root nlf-loop"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#c2412d)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#ffece5)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#c2412d)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-loop{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#ff9a82;--nlf-accent-soft:#3a1f18;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1260" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">One night, 30 failing tests</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">A loop at work, round by round. Green is tests fixed.</text><line x1="112" y1="300" x2="112" y2="1130" class="nlf-s-line" stroke-width="5" stroke-linecap="round"/><circle cx="112" cy="300" r="22" class="nlf-f-blue"/><circle cx="112" cy="300" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="308.4">1</tspan></text><rect x="168" y="230" width="848" height="140" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="230" width="848" height="140" rx="24" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="300" r="30" class="nlf-f-blue"/><g transform="translate(209.5 283.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-blue" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="271.1">22:00 · Start</tspan></text><text class="nlf-t nlf-f-ink" font-size="25" font-weight="800" text-anchor="end"><tspan x="980" y="270.8">30 failing</tspan></text><text class="nlf-t nlf-f-ink" font-size="25" font-weight="500" text-anchor="start"><tspan x="280" y="310.8">Goal: all tests pass. Caps: 25 rounds, $15.</tspan></text><rect x="280" y="334" width="700" height="12" rx="6" class="nlf-f-dot"/><circle cx="112" cy="466" r="22" class="nlf-f-accent"/><circle cx="112" cy="466" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="474.4">2</tspan></text><rect x="168" y="396" width="848" height="140" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="396" width="848" height="140" rx="24" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="466" r="30" class="nlf-f-accent"/><g transform="translate(209.5 449.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></g><text class="nlf-t nlf-f-accent" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="437.1">Rounds 1–4</tspan></text><text class="nlf-t nlf-f-ink" font-size="25" font-weight="800" text-anchor="end"><tspan x="980" y="436.8">12 failing</tspan></text><text class="nlf-t nlf-f-ink" font-size="25" font-weight="500" text-anchor="start"><tspan x="280" y="476.8">Finds one shared date bug behind 18 failures.</tspan></text><rect x="280" y="500" width="700" height="12" rx="6" class="nlf-f-dot"/><rect x="280" y="500" width="420.0" height="12" rx="6" class="nlf-f-ok"/><circle cx="112" cy="632" r="22" class="nlf-f-accent"/><circle cx="112" cy="632" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="640.4">3</tspan></text><rect x="168" y="562" width="848" height="140" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="562" width="848" height="140" rx="24" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="632" r="30" class="nlf-f-accent"/><g transform="translate(209.5 615.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/></g><text class="nlf-t nlf-f-accent" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="603.1">Rounds 5–9</tspan></text><text class="nlf-t nlf-f-ink" font-size="25" font-weight="800" text-anchor="end"><tspan x="980" y="602.8">7 failing</tspan></text><text class="nlf-t nlf-f-ink" font-size="25" font-weight="500" text-anchor="start"><tspan x="280" y="642.8">One fix per round. The suite re-runs each time.</tspan></text><rect x="280" y="666" width="700" height="12" rx="6" class="nlf-f-dot"/><rect x="280" y="666" width="536.7" height="12" rx="6" class="nlf-f-ok"/><circle cx="112" cy="798" r="22" class="nlf-f-risk"/><circle cx="112" cy="798" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="806.4">4</tspan></text><rect x="168" y="728" width="848" height="140" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="728" width="848" height="140" rx="24" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="798" r="30" class="nlf-f-risk"/><g transform="translate(209.5 781.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></g><text class="nlf-t nlf-f-risk" font-size="26" font-weight="800" text-anchor