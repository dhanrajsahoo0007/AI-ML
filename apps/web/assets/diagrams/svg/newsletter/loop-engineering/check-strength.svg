<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1090" width="1080" height="1090" class="nlf-root nlf-loop"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#c2412d)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#ffece5)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#c2412d)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-loop{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#ff9a82;--nlf-accent-soft:#3a1f18;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1090" fill="url(#nlf-dots)"/><circle cx="440" cy="620" r="300" class="nlf-f-ok-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">How strong is your check?</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">A loop is only as good as the evidence it stops on.</text><path d="M110.0 260.0 L110.0 966.4" fill="none" class="nlf-s-ok" stroke-width="5" stroke-linecap="round"/><path d="M110.0 984.0 L97.9 962.0 L122.1 962.0 Z" class="nlf-f-ok"/><text class="nlf-t nlf-f-ok" font-size="26" font-weight="800" text-anchor="middle" transform="rotate(90 76 622)"><tspan x="76" y="631.1">stronger evidence</tspan></text><rect x="170" y="247" width="540" height="126" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="247" width="540" height="126" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="310" r="34" class="nlf-f-risk"/><g transform="translate(213.3 291.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="304.4">The agent says “done”</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="336.6">a claim, not a proof</tspan></text><rect x="798.0" y="286.3" width="160.0" height="47.5" rx="23.8" class="nlf-f-risk-soft"/><text class="nlf-t nlf-f-risk" font-size="25" font-weight="700" text-anchor="middle"><tspan x="878" y="318.8">no check</tspan></text><rect x="170" y="403" width="540" height="126" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="403" width="540" height="126" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="466" r="34" class="nlf-f-blue"/><g transform="translate(213.3 447.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="460.4">It compiles and lints</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="492.6">catches the obvious</tspan></text><rect x="828.0" y="442.3" width="100.0" height="47.5" rx="23.8" class="nlf-f-blue-soft"/><text class="nlf-t nlf-f-blue" font-size="25" font-weight="700" text-anchor="middle"><tspan x="878" y="474.8">weak</tspan></text><rect x="170" y="559" width="540" height="126" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="559" width="540" height="126" rx="26" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="622" r="34" class="nlf-f-teal"/><g transform="translate(213.3 603.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="616.4">The tests pass</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="648.6">certain and repeatable</tspan></text><rect x="813.0" y="598.3" width="130.0" height="47.5" rx="23.8" class="nlf-f-teal-soft"/><text class="nlf-t nlf-f-teal" font-size="25" font-weight="700" text-anchor="middle"><tspan x="878" y="630.8">strong</tspan></text><rect x="170" y="715" width="540" height="126" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="715" width="540" height="126" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="778" r="34" class="nlf-f-violet"/><g transform="translate(213.3 759.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="772.4">A second model reviews</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="804.6">fresh eyes on the work</tspan></text><rect x="798.0" y="754.3" width="160.0" height="47.5" rx="23.8" class="nlf-f-violet-soft"/><text class="nlf-t nlf-f-violet" font-size="25" font-weight="700" text-anchor="middle"><tspan x="878" y="786.8">judgment</tspan></text><rect x="170" y="871" width="540" height="126" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="871" width="540" height="126" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="934" r="34" class="nlf-f-amber"/><g transform="translate(213.3 915.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="928.4">A person signs off</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="960.6">for what can't be undone</tspan></text><rect x="790.5" y="910.3" width="175.0" height="47.5" rx="23.8" class="nlf-f-amber-soft"/><text class="nlf-t nlf-f-amber" font-size="25" font-weight="700" text-anchor="middle"><tspan x="878" y="942.8">final say</tspan></text></svg>
