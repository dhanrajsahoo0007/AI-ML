<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1250" width="1080" height="1250" class="nlf-root nlf-loop"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#c2412d)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#ffece5)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#c2412d)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-loop{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#ff9a82;--nlf-accent-soft:#3a1f18;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1250" fill="url(#nlf-dots)"/><circle cx="540" cy="600" r="260" class="nlf-f-accent-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">The anatomy of a loop</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Four parts. Leave one out and you can't trust the loop.</text><line x1="64" y1="1060" x2="1016" y2="1060" class="nlf-s-line" stroke-width="2"/><g data-step="1"><rect x="280" y="230" width="520" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="280" y="230" width="520" height="140" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="342" cy="300" r="34" class="nlf-f-blue"/><g transform="translate(323.3 281.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="start"><tspan x="396" y="293.8">A goal</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="396" y="328.5">what done looks like</tspan></text><circle cx="288" cy="238" r="22" class="nlf-f-blue"/><circle cx="288" cy="238" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="288" y="246.4">1</tspan></text></g><g data-step="2"><path d="M472.7 380.8 L385.2 485.7" fill="none" class="nlf-s-blue" stroke-width="5" stroke-linecap="round"/><path d="M374.0 499.2 L378.8 474.6 L397.3 490.1 Z" class="nlf-f-blue"/><rect x="100" y="510" width="380" height="180" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="100" y="510" width="380" height="180" rx="26" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="290" cy="560" r="30" class="nlf-f-accent"/><g transform="translate(273.5 543.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M7 4.5v15l12-7.5z"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="middle"><tspan x="290" y="633.9">Act</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="290" y="668.4">the agent works</tspan></text><circle cx="108" cy="518" r="22" class="nlf-f-accent"/><circle cx="108" cy="518" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="108" y="526.4">2</tspan></text></g><g data-step="3"><path d="M494.0 570.0 L568.4 570.0" fill="none" class="nlf-s-accent" stroke-width="5" stroke-linecap="round"/><path d="M586.0 570.0 L564.0 582.1 L564.0 557.9 Z" class="nlf-f-accent"/><path d="M587.2 689.2 Q540.0 799.2 499.8 705.4" fill="none" class="nlf-s-risk" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 15"/><path d="M492.8 689.2 L512.6 704.7 L490.4 714.2 Z" class="nlf-f-risk"/><rect x="397.6" y="777.2" width="284.8" height="45.6" rx="22.8" class="nlf-f-risk-soft"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="700" text-anchor="middle"><tspan x="540" y="808.4">not yet: go again</tspan></text><rect x="600" y="510" width="380" height="180" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="600" y="510" width="380" height="180" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="790" cy="560" r="30" class="nlf-f-ok"/><g transform="translate(773.5 543.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="middle"><tspan x="790" y="633.9">Check</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="790" y="668.4">is the goal met?</tspan></text><circle cx="608" cy="518" r="22" class="nlf-f-ok"/><circle cx="608" cy="518" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="608" y="526.4">3</tspan></text></g><g data-step="4"><path d="M845.6 702.4 L782.0 822.1" fill="none" class="nlf-s-ok" stroke-width="5" stroke-linecap="round"/><path d="M773.8 837.6 L773.4 812.5 L794.8 823.9 Z" class="nlf-f-ok"/><rect x="858.4" y="747.2" width="83.2" height="45.6" rx="22.8" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="24" font-weight="700" text-anchor="middle"><tspan x="900" y="778.4">yes</tspan></text><rect x="280" y="850" width="520" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="280" y="850" width="520" height="140" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="342" cy="920" r="34" class="nlf-f-amber"/><g transform="translate(323.3 901.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8.3 3h7.4L21 8.3v7.4L15.7 21H8.3L3 15.7V8.3z"/><path d="M8.5 12h7"/></g><text class="nlf-t nlf-f-ink" font-size="31" font-weight="700" text-anchor="start"><tspan x="396" y="913.8">Stop</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="396" y="948.5">done, or out of budget</tspan></text><circle cx="288" cy="858" r="22" class="nlf-f-amber"/><circle cx="288" cy="858" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="288" y="866.4">4</tspan></text></g><g data-step-only="1"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1148.6">Goal: say what done looks like in a way a program can</tspan><tspan x="540" y="1187.7">test. “All tests pass”, not “make it better”.</tspan></text></g><g data-step-only="2"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1148.6">Act: the agent takes a turn. It reads files, edits code</tspan><tspan x="540" y="1187.7">and runs commands inside its harness.</tspan></text></g><g data-step-only="3"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1148.6">Check: something other than the agent's own word tests</tspan><tspan x="540" y="1187.7">the result. Not there yet? Round again.</tspan></text></g><g data-step-only="4"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1148.6">Stop: the loop ends when the goal is met, or when a cap</tspan><tspan x="540" y="1187.7">on turns, time or money is hit.</tspan></text></g></svg>
