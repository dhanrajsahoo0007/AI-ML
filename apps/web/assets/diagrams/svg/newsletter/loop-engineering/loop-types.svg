<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1040" width="1080" height="1040" class="nlf-root nlf-loop"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#c2412d)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#ffece5)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#c2412d)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-loop{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#ff9a82;--nlf-accent-soft:#3a1f18;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1040" fill="url(#nlf-dots)"/><circle cx="430" cy="640" r="300" class="nlf-f-accent-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Four kinds of loop</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Each step down, you hand one more job to the system.</text><path d="M110.0 320.0 L110.0 930.4" fill="none" class="nlf-s-accent" stroke-width="5" stroke-linecap="round"/><path d="M110.0 948.0 L97.9 926.0 L122.1 926.0 Z" class="nlf-f-accent"/><text class="nlf-t nlf-f-accent" font-size="26" font-weight="800" text-anchor="middle" transform="rotate(90 76 634)"><tspan x="76" y="643.1">more hands-off</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="430" y="266.8">kind of loop</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="862" y="266.8">you hand over</tspan></text><rect x="170" y="300" width="520" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="300" width="520" height="140" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="370" r="34" class="nlf-f-amber"/><g transform="translate(213.3 351.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="286" y="364.0">Turn-based</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="397.9">you prompt, it self-checks</tspan></text><rect x="755.6" y="347.2" width="212.8" height="45.6" rx="22.8" class="nlf-f-amber-soft"/><text class="nlf-t nlf-f-amber" font-size="24" font-weight="700" text-anchor="middle"><tspan x="862" y="378.4">the checking</tspan></text><rect x="170" y="476" width="520" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="476" width="520" height="140" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="546" r="34" class="nlf-f-ok"/><g transform="translate(213.3 527.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="286" y="540.0">Goal-based</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="573.9">runs until a goal is met</tspan></text><rect x="741.2" y="523.2" width="241.6" height="45.6" rx="22.8" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="24" font-weight="700" text-anchor="middle"><tspan x="862" y="554.4">+ when to stop</tspan></text><rect x="170" y="652" width="520" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="652" width="520" height="140" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="722" r="34" class="nlf-f-blue"/><g transform="translate(213.3 703.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="286" y="716.0">Time-based</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="749.9">runs on a schedule</tspan></text><rect x="734.0" y="699.2" width="256.0" height="45.6" rx="22.8" class="nlf-f-blue-soft"/><text class="nlf-t nlf-f-blue" font-size="24" font-weight="700" text-anchor="middle"><tspan x="862" y="730.4">+ when to start</tspan></text><rect x="170" y="828" width="520" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="170" y="828" width="520" height="140" rx="26" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="232" cy="898" r="34" class="nlf-f-accent"/><g transform="translate(213.3 879.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="286" y="892.0">Proactive</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="286" y="925.9">an event starts it</tspan></text><rect x="755.6" y="875.2" width="212.8" height="45.6" rx="22.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="862" y="906.4">+ the prompt</tspan></text></svg>
