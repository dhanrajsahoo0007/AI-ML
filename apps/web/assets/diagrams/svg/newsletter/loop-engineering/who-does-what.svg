<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1100" width="1080" height="1100" class="nlf-root nlf-loop"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#c2412d)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#ffece5)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#c2412d)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-loop{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#ff9a82;--nlf-accent-soft:#3a1f18;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1100" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Who does what now</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">You stop typing prompts. You start designing the system.</text><rect x="64" y="330" width="440" height="600" rx="34" class="nlf-f-amber-soft"/><rect x="64" y="330" width="440" height="600" rx="34" fill="none" class="nlf-s-amber" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-amber" font-size="32" font-weight="800" text-anchor="middle"><tspan x="284" y="393.2">You</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="284" y="430.8">design the loop, once</tspan></text><rect x="94" y="464" width="380" height="92" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="94" y="464" width="380" height="92" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="154" cy="510" r="32" class="nlf-f-blue"/><g transform="translate(136.4 492.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="206" y="519.5">Write the goal</tspan></text><rect x="94" y="576" width="380" height="92" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="94" y="576" width="380" height="92" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="154" cy="622" r="32" class="nlf-f-ok"/><g transform="translate(136.4 604.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="206" y="631.5">Build the check</tspan></text><rect x="94" y="688" width="380" height="92" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="94" y="688" width="380" height="92" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="154" cy="734" r="32" class="nlf-f-risk"/><g transform="translate(136.4 716.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8.3 3h7.4L21 8.3v7.4L15.7 21H8.3L3 15.7V8.3z"/><path d="M8.5 12h7"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="206" y="743.5">Set the caps</tspan></text><rect x="94" y="800" width="380" height="92" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="94" y="800" width="380" height="92" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="154" cy="846" r="32" class="nlf-f-amber"/><g transform="translate(136.4 828.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="206" y="855.5">Read the result</tspan></text><rect x="576" y="330" width="440" height="600" rx="34" class="nlf-f-accent-soft"/><rect x="576" y="330" width="440" height="600" rx="34" fill="none" class="nlf-s-accent" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-accent" font-size="32" font-weight="800" text-anchor="middle"><tspan x="796" y="393.2">The loop</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="796" y="430.8">runs it, every round</tspan></text><rect x="606" y="464" width="380" height="92" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="606" y="464" width="380" height="92" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="666" cy="510" r="32" class="nlf-f-blue"/><g transform="translate(648.4 492.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="718" y="519.5">Pick the task</tspan></text><rect x="606" y="576" width="380" height="92" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="606" y="576" width="380" height="92" rx="26" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="666" cy="622" r="32" class="nlf-f-accent"/><g transform="translate(648.4 604.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M7 4.5v15l12-7.5z"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="718" y="631.5">Prompt the agent</tspan></text><rect x="606" y="688" width="380" height="92" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="606" y="688" width="380" height="92" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="666" cy="734" r="32" class="nlf-f-ok"/><g transform="translate(648.4 716.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="718" y="743.5">Run the check</tspan></text><rect x="606" y="800" width="380" height="92" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="606" y="800" width="380" height="92" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="666" cy="846" r="32" class="nlf-f-risk"/><g transform="translate(648.4 828.4) scale(1.467)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="718" y="855.5">Stop or repeat</tspan></text><circle cx="284.0" cy="300.0" r="7" class="nlf-f-amber"/><path d="M284.0 300.0 Q540.0 346.0 778.7 303.1" fill="none" class="nlf-s-amber" stroke-width="5" stroke-linecap="round"/><path d="M796.0 300.0 L776.5 315.8 L772.2 292.0 Z" class="nlf-f-amber"/><rect x="235.0" y="208.3" width="610.0" height="47.5" rx="23.8" class="nlf-f-amber-soft"/><text class="nlf-t nlf-f-amber" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="240.8">the goal, the check and the caps go in</tspan></text><circle cx="796.0" cy="962.0" r="7" class="nlf-f-accent"/><path d="M796.0 962.0 Q540.0 916.0 301.3 958.9" fill="none" class="nlf-s-accent" stroke-width="5" stroke-linecap="round"/><path d="M284.0 962.0 L303.5 946.2 L307.8 970.0 Z" class="nlf-f-accent"/><rect x="203.2" y="1009.2" width="673.6" height="45.6" rx="22.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="540" y="1040.4">finished work and flagged problems come back</tspan></text></svg>
