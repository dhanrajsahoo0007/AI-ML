get cap</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="890" y="713.4">max $15 spent</tspan></text><path d="M430.4 785.9 L378.4 850.4" fill="none" class="nlf-s-risk" stroke-width="5" stroke-linecap="round"/><path d="M367.3 864.1 L371.7 839.4 L390.6 854.6 Z" class="nlf-f-risk"/><rect x="155" y="875" width="270" height="170" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="155" y="875" width="270" height="170" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="290" cy="925" r="30" class="nlf-f-risk"/><g transform="translate(273.5 908.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="middle"><tspan x="290" y="990.8">No progress</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="290" y="1023.4">same error 3 times</tspan></text><path d="M649.6 785.9 L701.6 850.4" fill="none" class="nlf-s-blue" stroke-width="5" stroke-linecap="round"/><path d="M712.7 864.1 L689.4 854.6 L708.3 839.4 Z" class="nlf-f-blue"/><rect x="655" y="875" width="270" height="170" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="655" y="875" width="270" height="170" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="790" cy="925" r="30" class="nlf-f-blue"/><g transform="translate(773.5 908.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="middle"><tspan x="790" y="990.8">Needs a human</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="790" y="1023.4">a risky step</tspan></text><circle cx="540" cy="650" r="118" class="nlf-f-accent-soft" filter="url(#nlf-shadow)"/><circle cx="540" cy="650" r="118" fill="none" class="nlf-s-accent" stroke-width="3" stroke-dasharray="1 11" stroke-linecap="round"/><circle cx="540" cy="628" r="42" class="nlf-f-accent"/><g transform="translate(516.9 604.9) scale(1.925)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></g><text class="nlf-t nlf-f-accent" font-size="28" font-weight="800" text-anchor="middle"><tspan x="540" y="715.8">the loop</tspan></text><rect x="145.0" y="1106.3" width="310.0" height="47.5" rx="23.8" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="25" font-weight="700" text-anchor="middle"><tspan x="300" y="1138.8">1 exit for success</tspan></text><rect x="605.0" y="1106.3" width="310.0" height="47.5" rx="23.8" class="nlf-f-risk-soft"/><text class="nlf-t nlf-f-risk" font-size="25" font-weight="700" text-anchor="middle"><tspan x="760" y="1138.8">4 exits for safety</tspan></text></svg>
