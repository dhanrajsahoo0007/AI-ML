<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1210" width="1080" height="1210" class="nlf-root nlf-loop"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#c2412d)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#ffece5)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#c2412d)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-loop{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#ff9a82;--nlf-accent-soft:#3a1f18;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1210" fill="url(#nlf-dots)"/><circle cx="540" cy="650" r="280" class="nlf-f-accent-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Five ways out of a loop</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Decide every exit before the loop starts.</text><path d="M540.0 511.0 L540.0 446.6" fill="none" class="nlf-s-ok" stroke-width="5" stroke-linecap="round"/><path d="M540.0 429.0 L552.1 451.0 L527.9 451.0 Z" class="nlf-f-ok"/><rect x="390" y="245" width="300" height="170" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="390" y="245" width="300" height="170" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="540" cy="295" r="30" class="nlf-f-ok"/><g transform="translate(523.5 278.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="middle"><tspan x="540" y="360.8">Goal met</tspan></text><text class="nlf-t nlf-f-muted" font-size="2