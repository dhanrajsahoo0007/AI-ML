<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 990" width="1080" height="990" class="nlf-root nlf-tuning"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#8a6427)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#f4ead6)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#8a6427)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-tuning{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#e2c48a;--nlf-accent-soft:#2d2414;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="990" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Three ways to change a model</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Same goal, very different cost. Try them in this order.</text><rect x="44" y="250" width="310" height="560" rx="34" class="nlf-f-blue-soft"/><rect x="44" y="250" width="310" height="560" rx="34" fill="none" class="nlf-s-blue" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-blue" font-size="32" font-weight="800" text-anchor="middle"><tspan x="199" y="313.2">Prompt</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="199" y="350.8">a briefing</tspan></text><circle cx="199" cy="450" r="46" class="nlf-f-blue"/><g transform="translate(173.7 424.7) scale(2.108)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><rect x="6" y="3" width="13" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/><path d="M9.5 8h6M9.5 11.5h6M9.5 15h4"/></g><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="199" y="568.4">it changes</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="800" text-anchor="middle"><tspan x="199" y="609.8">what you ask</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="199" y="694.4">time to try</tspan></text><text class="nlf-t nlf-f-blue" font-size="28" font-weight="800" text-anchor="middle"><tspan x="199" y="735.8">minutes</tspan></text><circle cx="56" cy="262" r="22" class="nlf-f-blue"/><circle cx="56" cy="262" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="56" y="270.4">1</tspan></text><rect x="385" y="250" width="310" height="560" rx="34" class="nlf-f-teal-soft"/><rect x="385" y="250" width="310" height="560" rx="34" fill="none" class="nlf-s-teal" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-teal" font-size="32" font-weight="800" text-anchor="middle"><tspan x="540" y="313.2">Retrieval</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="540" y="350.8">a reference binder</tspan></text><circle cx="540" cy="450" r="46" class="nlf-f-teal"/><g transform="translate(514.7 424.7) scale(2.108)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></g><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="540" y="568.4">it changes</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="800" text-anchor="middle"><tspan x="540" y="609.8">what it can read</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="540" y="694.4">time to try</tspan></text><text class="nlf-t nlf-f-teal" font-size="28" font-weight="800" text-anchor="middle"><tspan x="540" y="735.8">days</tspan></text><circle cx="397" cy="262" r="22" class="nlf-f-teal"/><circle cx="397" cy="262" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="397" y="270.4">2</tspan></text><rect x="726" y="250" width="310" height="560" rx="34" class="nlf-f-violet-soft"/><rect x="726" y="250" width="310" height="560" rx="34" fill="none" class="nlf-s-violet" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-violet" font-size="32" font-weight="800" text-anchor="middle"><tspan x="881" y="313.2">Fine-tuning</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="881" y="350.8">weeks of training</tspan></text><circle cx="881" cy="450" r="46" class="nlf-f-violet"/><g transform="translate(855.7 424.7) scale(2.108)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></g><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="881" y="568.4">it changes</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="800" text-anchor="middle"><tspan x="881" y="609.8">the model itself</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="881" y="694.4">time to try</tspan></text><text class="nlf-t nlf-f-violet" font-size="28" font-weight="800" text-anchor="middle"><tspan x="881" y="735.8">weeks</tspan></text><circle cx="738" cy="262" r="22" class="nlf-f-violet"/><circle cx="738" cy="262" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="738" y="270.4">3</tspan></text><rect x="176.8" y="871.3" width="726.4" height="49.4" rx="24.7" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="26" font-weight="700" text-anchor="middle"><tspan x="540" y="905.1">Most problems are solved at step one or two.</tspan></text></svg>
