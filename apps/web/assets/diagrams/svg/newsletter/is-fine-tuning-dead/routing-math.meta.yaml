title: Sorting 2 million messages a month
alt: >-
  A table of four ways to sort bank messages into 77 intents, with score and running cost per month at 2 million
  messages. Claude Opus 5 prompted with 10 examples per intent: 0.898, 30,028 dollars. Claude Haiku 4.5 prompted the
  same way: 0.899, 4,370 dollars. A fine-tuned small model, ModernBERT on one GPU: 0.933, 584 dollars. No language
  model, word counts and a linear classifier: 0.913, 12 dollars. Break-even against Haiku is about 270,000 messages a
  month. Source: Azad Djan, September 2026.
caption: >-
  On one narrow sorting task the small tuned model was the most accurate, and a classifier with no language model beat
  both prompted models.
slide: "2 million messages a month: a prompted model costs $4,370. A small fine-tuned one costs $584 and scores higher."
