<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 990" width="1080" height="990" class="nlf-root nlf-tuning"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#8a6427)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#f4ead6)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#8a6427)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-tuning{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#e2c48a;--nlf-accent-soft:#2d2414;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="990" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">The moving baseline</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Your fine-tune stands still. The models around it don't.</text><rect x="130" y="270" width="4" height="530" rx="2" class="nlf-f-dot"/><rect x="130" y="800" width="880" height="4" rx="2" class="nlf-f-dot"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="start"><tspan x="146" y="298.4">quality on your task</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="end"><tspan x="1010" y="848.4">time</tspan></text><path d="M130 700 H330 V620 H530 V540 H730 V430 H900 V340 H1010" fill="none" class="nlf-s-blue" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="330" cy="620" r="11" class="nlf-f-blue"/><circle cx="530" cy="540" r="11" class="nlf-f-blue"/><circle cx="730" cy="430" r="11" class="nlf-f-blue"/><circle cx="900" cy="340" r="11" class="nlf-f-blue"/><path d="M400 620 V500 H1010" fill="none" class="nlf-s-violet" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 16"/><circle cx="400" cy="500" r="13" class="nlf-f-violet"/><text class="nlf-t nlf-f-violet" font-size="25" font-weight="700" text-anchor="middle"><tspan x="380" y="464.8">you fine-tune here</tspan></text><circle cx="730" cy="500" r="20" fill="none" class="nlf-s-risk" stroke-width="5"/><rect x="772.5" y="536.3" width="175.0" height="47.5" rx="23.8" class="nlf-f-risk-soft"/><text class="nlf-t nlf-f-risk" font-size="25" font-weight="700" text-anchor="middle"><tspan x="860" y="568.8">overtaken</tspan></text><text class="nlf-t nlf-f-blue" font-size="25" font-weight="700" text-anchor="start"><tspan x="330" y="748.8">base models: a new one</tspan></text><text class="nlf-t nlf-f-blue" font-size="25" font-weight="700" text-anchor="start"><tspan x="330" y="782.8">every few months</tspan></text><text class="nlf-t nlf-f-violet" font-size="25" font-weight="700" text-anchor="end"><tspan x="1010" y="474.8">your fine-tune: frozen</tspan></text><rect x="145.0" y="882.3" width="790.0" height="47.5" rx="23.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="914.8">An illustration, not data. The shape is the point.</tspan></text></svg>
