<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1160" width="1080" height="1160" class="nlf-root nlf-tuning"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#8a6427)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#f4ead6)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#8a6427)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-tuning{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#e2c48a;--nlf-accent-soft:#2d2414;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1160" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Should you fine-tune?</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Four questions. Fine-tuning is the last answer, not the first.</text><rect x="64" y="248" width="572" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="248" width="572" height="124" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="310" r="34" class="nlf-f-amber"/><g transform="translate(107.3 291.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-ink" font-size="29" font-weight="700" text-anchor="start"><tspan x="180" y="304.2">Got an eval set?</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="337.3">can you measure better or worse?</tspan></text><path d="M642.0 310.0 L725.7 310.0" fill="none" class="nlf-s-accent" stroke-width="4" stroke-linecap="round"/><path d="M742.0 310.0 L721.6 321.2 L721.6 298.8 Z" class="nlf-f-accent"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="692" y="294.4">no</tspan></text><rect x="760.0" y="287.2" width="256.0" height="45.6" rx="22.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="888" y="318.4">Build one first</tspan></text><path d="M350.0 376.0 L350.0 411.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M350.0 428.0 L338.8 407.6 L361.2 407.6 Z" class="nlf-f-muted"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="394" y="411.4">yes</tspan></text><rect x="64" y="434" width="572" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="434" width="572" height="124" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="496" r="34" class="nlf-f-amber"/><g transform="translate(107.3 477.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-ink" font-size="29" font-weight="700" text-anchor="start"><tspan x="180" y="490.2">Missing facts?</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="523.3">is the knowledge absent or out of date?</tspan></text><path d="M642.0 496.0 L725.7 496.0" fill="none" class="nlf-s-teal" stroke-width="4" stroke-linecap="round"/><path d="M742.0 496.0 L721.6 507.2 L721.6 484.8 Z" class="nlf-f-teal"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="692" y="480.4">yes</tspan></text><rect x="774.4" y="473.2" width="227.2" height="45.6" rx="22.8" class="nlf-f-teal-soft"/><text class="nlf-t nlf-f-teal" font-size="24" font-weight="700" text-anchor="middle"><tspan x="888" y="504.4">Use retrieval</tspan></text><path d="M350.0 562.0 L350.0 597.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M350.0 614.0 L338.8 593.6 L361.2 593.6 Z" class="nlf-f-muted"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="394" y="597.4">no</tspan></text><rect x="64" y="620" width="572" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="620" width="572" height="124" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="682" r="34" class="nlf-f-amber"/><g transform="translate(107.3 663.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-ink" font-size="29" font-weight="700" text-anchor="start"><tspan x="180" y="676.2">Prompt done properly?</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="709.3">clear rules plus a few good examples</tspan></text><path d="M642.0 682.0 L725.7 682.0" fill="none" class="nlf-s-blue" stroke-width="4" stroke-linecap="round"/><path d="M742.0 682.0 L721.6 693.2 L721.6 670.8 Z" class="nlf-f-blue"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="692" y="666.4">no</tspan></text><rect x="767.2" y="659.2" width="241.6" height="45.6" rx="22.8" class="nlf-f-blue-soft"/><text class="nlf-t nlf-f-blue" font-size="24" font-weight="700" text-anchor="middle"><tspan x="888" y="690.4">Fix the prompt</tspan></text><path d="M350.0 748.0 L350.0 783.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M350.0 800.0 L338.8 779.6 L361.2 779.6 Z" class="nlf-f-muted"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="394" y="783.4">yes</tspan></text><rect x="64" y="806" width="572" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="806" width="572" height="124" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="868" r="34" class="nlf-f-amber"/><g transform="translate(107.3 849.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text class="nlf-t nlf-f-ink" font-size="29" font-weight="700" text-anchor="start"><tspan x="180" y="862.2">Narrow and high volume?</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="895.3">one fixed job, thousands of times a day</tspan></text><path d="M642.0 868.0 L725.7 868.0" fill="none" class="nlf-s-blue" stroke-width="4" stroke-linecap="round"/><path d="M742.0 868.0 L721.6 879.2 L721.6 856.8 Z" class="nlf-f-blue"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="692" y="852.4">no</tspan></text><rect x="767.2" y="845.2" width="241.6" height="45.6" rx="22.8" class="nlf-f-blue-soft"/><text class="nlf-t nlf-f-blue" font-size="24" font-weight="700" text-anchor="middle"><tspan x="888" y="876.4">Keep prompting</tspan></text><path d="M350.0 934.0 L350.0 969.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M350.0 986.0 L338.8 965.6 L361.2 965.6 Z" class="nlf-f-muted"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="394" y="969.4">yes</tspan></text><rect x="64" y="992" width="572" height="124" rx="26" class="nlf-f-violet-soft" filter="url(#nlf-shadow)"/><rect x="64" y="992" width="572" height="124" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="1054" r="34" class="nlf-f-violet"/><g transform="translate(107.3 1035.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></g><text class="nlf-t nlf-f-ink" font-size="29" font-weight="700" text-anchor="start"><tspan x="180" y="1048.2">Fine-tune a small model</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="1081.3">and re-test at every new base model</tspan></text></svg>
