<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1070" width="1080" height="1070" class="nlf-root nlf-tuning"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#8a6427)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#f4ead6)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#8a6427)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-tuning{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#e2c48a;--nlf-accent-soft:#2d2414;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1070" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Where fine-tuning still wins</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Five jobs where training beats a longer prompt.</text><rect x="64" y="238" width="952" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="238" width="952" height="124" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="300" r="34" class="nlf-f-blue"/><g transform="translate(107.3 281.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="180" y="294.0">A strict output format</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="327.9">every reply must fit the same schema</tspan></text><rect x="64" y="382" width="952" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="382" width="952" height="124" rx="26" fill="none" class="nlf-s-pink" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="444" r="34" class="nlf-f-pink"/><g transform="translate(107.3 425.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="180" y="438.0">A fixed house style</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="471.9">a voice that a few examples can't pin down</tspan></text><rect x="64" y="526" width="952" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="526" width="952" height="124" rx="26" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="588" r="34" class="nlf-f-teal"/><g transform="translate(107.3 569.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 20V4M4 20h16"/><path d="M8 16l4-5 3 3 5-7"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="180" y="582.0">Narrow sorting at volume</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="615.9">the same labels, millions of times</tspan></text><rect x="64" y="670" width="952" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="670" width="952" height="124" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="732" r="34" class="nlf-f-amber"/><g transform="translate(107.3 713.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="180" y="726.0">A small, cheap, fast model</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="759.9">a small model trained for one job</tspan></text><rect x="64" y="814" width="952" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="814" width="952" height="124" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="876" r="34" class="nlf-f-violet"/><g transform="translate(107.3 857.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="180" y="870.0">Data that must stay in-house</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="903.9">open weights on your own servers</tspan></text><rect x="122.5" y="966.3" width="835.0" height="47.5" rx="23.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="998.8">The common thread: one narrow job, done the same way.</tspan></text></svg>
