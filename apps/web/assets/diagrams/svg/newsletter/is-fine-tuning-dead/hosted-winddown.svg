<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" width="1080" height="900" class="nlf-root nlf-tuning"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#8a6427)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#f4ead6)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#8a6427)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-tuning{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#e2c48a;--nlf-accent-soft:#2d2414;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="900" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">OpenAI is closing self-serve tuning</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Three dates from OpenAI's own deprecations page.</text><text class="nlf-t nlf-f-amber" font-size="31" font-weight="800" text-anchor="middle"><tspan x="130" y="322.9">May 7</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="130" y="360.8">2026</tspan></text><rect x="216" y="264" width="800" height="132" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="216" y="264" width="800" height="132" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="278" cy="330" r="34" class="nlf-f-amber"/><g transform="translate(259.3 311.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 21V5h16v16"/><path d="M4 9h16M9 9v12M15 9v12"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="332" y="324.0">Closed to new organisations</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="332" y="357.9">never fine-tuned before? no access</tspan></text><text class="nlf-t nlf-f-amber" font-size="31" font-weight="800" text-anchor="middle"><tspan x="130" y="494.9">July 2</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="130" y="532.8">2026</tspan></text><rect x="216" y="436" width="800" height="132" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="216" y="436" width="800" height="132" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="278" cy="502" r="34" class="nlf-f-amber"/><g transform="translate(259.3 483.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 21V5h16v16"/><path d="M4 9h16M9 9v12M15 9v12"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="332" y="496.0">Closed to inactive ones</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="332" y="529.9">no tuned-model use in the last 60 days</tspan></text><path d="M130.0 384.0 L130.0 431.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M130.0 448.0 L118.8 427.6 L141.2 427.6 Z" class="nlf-f-muted"/><text class="nlf-t nlf-f-risk" font-size="31" font-weight="800" text-anchor="middle"><tspan x="130" y="666.9">Jan 6</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="130" y="704.8">2027</tspan></text><rect x="216" y="608" width="800" height="132" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="216" y="608" width="800" height="132" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="278" cy="674" r="34" class="nlf-f-risk"/><g transform="translate(259.3 655.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 21V5h16v16"/><path d="M4 9h16M9 9v12M15 9v12"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="332" y="668.0">No new training jobs</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="332" y="701.9">for any customer</tspan></text><path d="M130.0 556.0 L130.0 603.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M130.0 620.0 L118.8 599.6 L141.2 599.6 Z" class="nlf-f-muted"/><rect x="115.0" y="804.3" width="850.0" height="47.5" rx="23.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="836.8">Tuned models run on until their base model is retired.</tspan></text></svg>
