<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1160" width="1080" height="1160" class="nlf-root nlf-tuning"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#8a6427)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#f4ead6)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#8a6427)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-tuning{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#e2c48a;--nlf-accent-soft:#2d2414;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1160" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">The real cost of a fine-tune</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">The training run is the small part you can see.</text><rect x="40" y="430" width="1000" height="610" rx="30" class="nlf-f-blue-soft" opacity="0.6"/><path d="M540 250 L672 430 L408 430 Z" class="nlf-f-surface" filter="url(#nlf-shadow)"/><path d="M540 250 L672 430 L408 430 Z" fill="none" class="nlf-s-accent" stroke-width="3"/><path d="M240 430 L840 430 L990 720 L820 1010 L260 1010 L90 720 Z" class="nlf-f-surface" filter="url(#nlf-shadow)"/><path d="M240 430 L840 430 L990 720 L820 1010 L260 1010 L90 720 Z" fill="none" class="nlf-s-accent" stroke-width="3" stroke-opacity="0.6"/><rect x="40" y="427" width="1000" height="6" rx="3" class="nlf-f-blue"/><text class="nlf-t nlf-f-accent" font-size="30" font-weight="800" text-anchor="start"><tspan x="700" y="330.5">The training run</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="700" y="370.8">the part everyone prices</tspan></text><circle cx="258" cy="520" r="9" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="529.8">Collecting and labelling examples</tspan></text><circle cx="258" cy="616" r="9" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="625.8">Building the eval set</tspan></text><circle cx="258" cy="712" r="9" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="721.8">Hosting the tuned model</tspan></text><circle cx="258" cy="808" r="9" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="817.8">Watching for drift</tspan></text><circle cx="258" cy="904" r="9" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="286" y="913.8">Redoing it for each new base model</tspan></text><rect x="100.0" y="1066.3" width="880.0" height="47.5" rx="23.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="1098.8">Budget for all of it, again, at every base model change.</tspan></text></svg>
