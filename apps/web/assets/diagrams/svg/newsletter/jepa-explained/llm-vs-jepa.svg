<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1120" width="1080" height="1120" class="nlf-root nlf-jepa"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#0b5873)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#dcf0f2)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#0b5873)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-jepa{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#8fd3df;--nlf-accent-soft:#10303a;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1120" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">LLM and JEPA, side by side</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Different training goals, different jobs.</text><rect x="474.8" y="243.4" width="90.4" height="53.2" rx="26.6" class="nlf-f-violet-soft"/><text class="nlf-t nlf-f-violet" font-size="28" font-weight="700" text-anchor="middle"><tspan x="520" y="279.8">LLM</tspan></text><rect x="806.4" y="243.4" width="107.2" height="53.2" rx="26.6" class="nlf-f-teal-soft"/><text class="nlf-t nlf-f-teal" font-size="28" font-weight="700" text-anchor="middle"><tspan x="860" y="279.8">JEPA</tspan></text><rect x="64" y="314" width="952" height="112" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="314" width="952" height="112" rx="24" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.25"/><text class="nlf-t nlf-f-accent" font-size="27" font-weight="800" text-anchor="start"><tspan x="96" y="379.4">Learns from</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="520" y="379.1">text</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="860" y="379.1">images and video</tspan></text><rect x="64" y="448" width="952" height="112" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="448" width="952" height="112" rx="24" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.25"/><text class="nlf-t nlf-f-accent" font-size="27" font-weight="800" text-anchor="start"><tspan x="96" y="513.5">Predicts</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="520" y="496.9">the exact next</tspan><tspan x="520" y="529.4">word</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="860" y="496.9">a summary of the</tspan><tspan x="860" y="529.4">hidden part</tspan></text><rect x="64" y="582" width="952" height="112" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="582" width="952" height="112" rx="24" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.25"/><text class="nlf-t nlf-f-accent" font-size="27" font-weight="800" text-anchor="start"><tspan x="96" y="647.5">Gives you</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="520" y="647.1">text you can read</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="860" y="630.9">numbers for</tspan><tspan x="860" y="663.4">another system</tspan></text><rect x="64" y="716" width="952" height="112" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="716" width="952" height="112" rx="24" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.25"/><text class="nlf-t nlf-f-accent" font-size="27" font-weight="800" text-anchor="start"><tspan x="96" y="781.5">Strong at</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="520" y="764.9">language, code,</tspan><tspan x="520" y="797.4">knowledge</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="860" y="764.9">seeing, physics,</tspan><tspan x="860" y="797.4">planning moves</tspan></text><rect x="64" y="850" width="952" height="112" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="850" width="952" height="112" rx="24" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.25"/><text class="nlf-t nlf-f-accent" font-size="27" font-weight="800" text-anchor="start"><tspan x="96" y="915.5">Today</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="520" y="898.9">in everyday</tspan><tspan x="520" y="931.4">products</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="860" y="898.9">mostly in research</tspan><tspan x="860" y="931.4">labs</tspan></text><rect x="175.0" y="996.3" width="730.0" height="47.5" rx="23.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="1028.8">Not rivals for the same job, at least not yet.</tspan></text></svg>
