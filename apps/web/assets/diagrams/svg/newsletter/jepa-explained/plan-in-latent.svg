t="44" rx="9" class="nlf-f-teal" opacity="0.74"/><rect x="154" y="594" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.35"/><rect x="206" y="594" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.61"/><rect x="50" y="646" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.87"/><rect x="102" y="646" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.48"/><rect x="154" y="646" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.74"/><rect x="206" y="646" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.35"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="150" y="734.4">camera view</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="560" y="298.8">imagine each move</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="700" text-anchor="middle"><tspan x="930" y="298.8">gap to goal</tspan></text><path d="M266.0 550.0 L317.4 434.9" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M324.0 420.0 L325.9 443.2 L305.4 434.1 Z" class="nlf-f-muted"/><rect x="330" y="358" width="460" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="330" y="358" width="460" height="124" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="392" cy="420" r="34" class="nlf-f-risk"/><g transform="translate(373.3 401.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M7 4.5v15l12-7.5z"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="446" y="414.6">Try: move left</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="446" y="445.9">imagined: cup further away</tspan></text><path d="M796.0 420.0 L829.7 420.0" fill="none" class="nlf-s-risk" stroke-width="4" stroke-linecap="round"/><path d="M846.0 420.0 L825.6 431.2 L825.6 408.8 Z" class="nlf-f-risk"/><rect x="896.6" y="395.3" width="86.8" height="49.4" rx="24.7" class="nlf-f-risk-soft"/><text class="nlf-t nlf-f-risk" font-size="26" font-weight="700" text-anchor="middle"><tspan x="940" y="429.1">far</tspan></text><path d="M266.0 590.0 L307.7 590.0" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M324.0 590.0 L303.6 601.2 L303.6 578.8 Z" class="nlf-f-muted"/><rect x="330" y="528" width="460" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="330" y="528" width="460" height="124" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="392" cy="590" r="34" class="nlf-f-amber"/><g transform="translate(373.3 571.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M7 4.5v15l12-7.5z"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="446" y="584.6">Try: move forward</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="446" y="615.9">imagined: hand above the cup</tspan></text><path d="M796.0 590.0 L829.7 590.0" fill="none" class="nlf-s-amber" stroke-width="4" stroke-linecap="round"/><path d="M846.0 590.0 L825.6 601.2 L825.6 578.8 Z" class="nlf-f-amber"/><rect x="873.2" y="565.3" width="133.6" height="49.4" rx="24.7" class="nlf-f-amber-soft"/><text class="nlf-t nlf-f-amber" font-size="26" font-weight="700" text-anchor="middle"><tspan x="940" y="599.1">closer</tspan></text><path d="M266.0 630.0 L317.4 745.1" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M324.0 760.0 L305.4 745.9 L325.9 736.8 Z" class="nlf-f-muted"/><rect x="330" y="698" width="460" height="124" rx="26" class="nlf-f-ok-soft" filter="url(#nlf-shadow)"/><rect x="330" y="698" width="460" height="124" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="392" cy="760" r="34" class="nlf-f-ok"/><g transform="translate(373.3 741.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M7 4.5v15l12-7.5z"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="446" y="754.6">Try: reach down</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="446" y="785.9">imagined: hand on the cup</tspan></text><path d="M796.0 760.0 L829.7 760.0" fill="none" class="nlf-s-ok" stroke-width="4" stroke-linecap="round"/><path d="M846.0 760.0 L825.6 771.2 L825.6 748.8 Z" class="nlf-f-ok"/><rect x="865.4" y="735.3" width="149.2" height="49.4" rx="24.7" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="26" font-weight="700" text-anchor="middle"><tspan x="940" y="769.1">closest</tspan></text><rect x="231.4" y="885.3" width="617.2" height="49.4" rx="24.7" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="26" font-weight="700" text-anchor="middle"><tspan x="540" y="919.1">Do the best move, look again, repeat.</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="540" y="992.4">A sketch of V-JEPA 2's planner. The real one tries 800 moves per step.</tspan></text></svg>
