title: The collapse problem
alt: >-
  Two panels of dots. Healthy: dots of three colours sit in three separate groups, so different inputs land in different
  places. Collapsed: every dot sits on the same spot, which is easy to predict and useless. Two fixes follow. Fix one, a
  slow-moving target encoder, used by I-JEPA and V-JEPA. Fix two, a rule that keeps points spread out, used by LeJEPA.
caption: If every input gets the same summary, prediction is perfect and the model has learned nothing.
slide: "The trap in JEPA training: give every input the same answer and you're never wrong."
