<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1020" width="1080" height="1020" class="nlf-root nlf-jepa"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#0b5873)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#dcf0f2)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#0b5873)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-jepa{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#8fd3df;--nlf-accent-soft:#10303a;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1020" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Two ways to predict</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">One guesses the next word. The other guesses the gist.</text><rect x="44" y="250" width="484" height="590" rx="34" class="nlf-f-violet-soft"/><rect x="44" y="250" width="484" height="590" rx="34" fill="none" class="nlf-s-violet" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-violet" font-size="32" font-weight="800" text-anchor="middle"><tspan x="286" y="313.2">An LLM</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="286" y="350.8">reads text</tspan></text><rect x="90" y="424" width="89" height="52" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><text class="nlf-t nlf-f-violet" font-size="25" font-weight="700" text-anchor="middle"><tspan x="134.5" y="458.8">The</tspan></text><rect x="189" y="424" width="89" height="52" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><text class="nlf-t nlf-f-violet" font-size="25" font-weight="700" text-anchor="middle"><tspan x="233.5" y="458.8">cup</tspan></text><rect x="288" y="424" width="104" height="52" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><text class="nlf-t nlf-f-violet" font-size="25" font-weight="700" text-anchor="middle"><tspan x="340" y="458.8">fell</tspan></text><rect x="402" y="424" width="89" height="52" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><text class="nlf-t nlf-f-violet" font-size="25" font-weight="700" text-anchor="middle"><tspan x="446.5" y="458.8">and</tspan></text><path d="M286.0 494.0 L286.0 562.4" fill="none" class="nlf-s-violet" stroke-width="5" stroke-linecap="round"/><path d="M286.0 580.0 L273.9 558.0 L298.1 558.0 Z" class="nlf-f-violet"/><rect x="176" y="594" width="220" height="76" rx="22" class="nlf-f-violet"/><text class="nlf-t nlf-f-ink" font-size="34" font-weight="800" text-anchor="middle" style="fill:#fff"><tspan x="286" y="643.9">broke</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="286" y="728.4">predicts</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="800" text-anchor="middle"><tspan x="286" y="769.8">the exact next word</tspan></text><rect x="552" y="250" width="484" height="590" rx="34" class="nlf-f-teal-soft"/><rect x="552" y="250" width="484" height="590" rx="34" fill="none" class="nlf-s-teal" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-teal" font-size="32" font-weight="800" text-anchor="middle"><tspan x="794" y="313.2">A JEPA</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="794" y="350.8">watches video</tspan></text><rect x="694" y="370" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.35"/><rect x="746" y="370" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.61"/><rect x="798" y="370" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.87"/><rect x="850" y="370" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.48"/><rect x="694" y="422" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.74"/><rect x="746" y="422" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.35"/><rect x="798" y="422" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.61"/><rect x="850" y="422" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.87"/><rect x="694" y="474" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.48"/><rect x="746" y="474" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.74"/><rect x="798" y="474" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.35"/><rect x="850" y="474" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.61"/><rect x="694" y="526" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.87"/><rect x="746" y="526" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.48"/><rect x="798" y="526" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.74"/><rect x="850" y="526" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.35"/><path d="M794.0 584.0 L794.0 602.4" fill="none" class="nlf-s-teal" stroke-width="5" stroke-linecap="round"/><path d="M794.0 620.0 L781.9 598.0 L806.1 598.0 Z" class="nlf-f-teal"/><rect x="684" y="630" width="220" height="60" rx="30" class="nlf-f-teal-soft"/><rect x="684" y="630" width="220" height="60" rx="30" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.5"/><circle cx="714" cy="660" r="12" class="nlf-f-teal" opacity="1"/><circle cx="754" cy="660" r="12" class="nlf-f-teal" opacity="0.45"/><circle cx="794" cy="660" r="12" class="nlf-f-teal" opacity="0.8"/><circle cx="834" cy="660" r="12" class="nlf-f-teal" opacity="0.3"/><circle cx="874" cy="660" r="12" class="nlf-f-teal" opacity="0.65"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="794" y="728.4">predicts</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="800" text-anchor="middle"><tspan x="794" y="769.8">a summary of what's next</tspan></text><rect x="137.5" y="902.3" width="805.0" height="47.5" rx="23.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="934.8">A JEPA never writes the word or paints the picture.</tspan></text></svg>
