<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 990" width="1080" height="990" class="nlf-root nlf-jepa"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#0b5873)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#dcf0f2)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#0b5873)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-jepa{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#8fd3df;--nlf-accent-soft:#10303a;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="990" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">How an LLM learns</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Four steps, repeated across a huge library of text.</text><rect x="160" y="238" width="840" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="160" y="238" width="840" height="124" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="222" cy="300" r="34" class="nlf-f-blue"/><g transform="translate(203.3 281.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="276" y="294.0">Read the words so far</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="276" y="327.9">“The cup fell and …”</tspan></text><circle cx="100" cy="300" r="22" class="nlf-f-blue"/><circle cx="100" cy="300" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="100" y="308.4">1</tspan></text><rect x="160" y="398" width="840" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="160" y="398" width="840" height="124" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="222" cy="460" r="34" class="nlf-f-violet"/><g transform="translate(203.3 441.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="276" y="454.0">Guess the next word</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="276" y="487.9">broke 61% · rolled 14% · sang 0.1%</tspan></text><circle cx="100" cy="460" r="22" class="nlf-f-violet"/><circle cx="100" cy="460" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="100" y="468.4">2</tspan></text><path d="M100.0 334.0 L100.0 409.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M100.0 426.0 L88.8 405.6 L111.2 405.6 Z" class="nlf-f-muted"/><rect x="160" y="558" width="840" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="160" y="558" width="840" height="124" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="222" cy="620" r="34" class="nlf-f-amber"/><g transform="translate(203.3 601.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="276" y="614.0">Check the real next word</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="276" y="647.9">the text says “broke”</tspan></text><circle cx="100" cy="620" r="22" class="nlf-f-amber"/><circle cx="100" cy="620" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="100" y="628.4">3</tspan></text><path d="M100.0 494.0 L100.0 569.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M100.0 586.0 L88.8 565.6 L111.2 565.6 Z" class="nlf-f-muted"/><rect x="160" y="718" width="840" height="124" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="160" y="718" width="840" height="124" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="222" cy="780" r="34" class="nlf-f-ok"/><g transform="translate(203.3 761.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M14.5 5.5a4 4 0 0 0-5 5L3.5 16.5a2 2 0 0 0 3 3l6-6a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="276" y="774.0">Nudge the weights</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="276" y="807.9">so the right word is likelier next time</tspan></text><circle cx="100" cy="780" r="22" class="nlf-f-ok"/><circle cx="100" cy="780" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="100" y="788.4">4</tspan></text><path d="M100.0 654.0 L100.0 729.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M100.0 746.0 L88.8 725.6 L111.2 725.6 Z" class="nlf-f-muted"/><rect x="107.5" y="882.3" width="865.0" height="47.5" rx="23.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="25" font-weight="700" text-anchor="middle"><tspan x="540" y="914.8">The answer key is free: it's the next word in the text.</tspan></text></svg>
