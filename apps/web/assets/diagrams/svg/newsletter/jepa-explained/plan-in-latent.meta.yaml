title: Planning without painting
alt: >-
  A robot's camera view on the left. Three candidate moves are imagined. Move left: the cup ends up further away, far
  from the goal. Move forward: the hand is above the cup, closer. Reach down: the hand is on the cup, closest, and this
  move is chosen. The robot does the best move, looks again and repeats. It is a sketch of V-JEPA 2's planner, which
  tries 800 moves per step.
caption: The robot imagines the summary each move would lead to and picks the one nearest the goal.
slide: "How a JEPA robot plans: imagine each move, pick the one that lands nearest the goal."
