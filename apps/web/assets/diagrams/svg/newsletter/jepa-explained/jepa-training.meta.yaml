title: How a JEPA learns
alt: >-
  A picture is cut into a grid of patches and some are hidden. An encoder turns the visible patches into a summary,
  drawn as a strip of dots. A predictor uses that summary to guess the summary of the hidden patches. A target encoder
  sees the whole picture and produces the real summary. The guess and the real summary are compared.
caption: A JEPA is graded on how well it predicts the summary of the hidden part, never on the pixels.
slide: "How a JEPA learns: hide part of a picture, then predict the meaning of what's missing."
