<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1210" width="1080" height="1210" class="nlf-root nlf-jepa"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#0b5873)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#dcf0f2)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#0b5873)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-jepa{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#8fd3df;--nlf-accent-soft:#10303a;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1210" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">How a JEPA learns</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Hide a part, then predict its meaning, not its pixels.</text><line x1="64" y1="1020" x2="1016" y2="1020" class="nlf-s-line" stroke-width="2"/><g data-step="1"><rect x="70" y="270" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.35"/><rect x="122" y="270" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.61"/><rect x="174" y="270" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.87"/><rect x="226" y="270" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.48"/><rect x="70" y="322" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.74"/><rect x="122" y="322" width="44" height="44" rx="9" class="nlf-f-dot" opacity="0.55"/><rect x="174" y="322" width="44" height="44" rx="9" class="nlf-f-dot" opacity="0.55"/><rect x="226" y="322" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.87"/><rect x="70" y="374" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.48"/><rect x="122" y="374" width="44" height="44" rx="9" class="nlf-f-dot" opacity="0.55"/><rect x="174" y="374" width="44" height="44" rx="9" class="nlf-f-dot" opacity="0.55"/><rect x="226" y="374" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.61"/><rect x="70" y="426" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.87"/><rect x="122" y="426" width="44" height="44" rx="9" class="nlf-f-teal" opacity="0.48"/><rect x="174" y="426" width="44" height="44" rx="9" class="nlf-f-dot" opacity="0.55"/><rect x="226" y="426" width="44" height="44" rx="9" class="nlf-f-dot" opacity="0.55"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="170" y="248.4">some patches hidden</tspan></text></g><g data-step="2"><path d="M284.0 370.0 L332.4 370.0" fill="none" class="nlf-s-teal" stroke-width="5" stroke-linecap="round"/><path d="M350.0 370.0 L328.0 382.1 L328.0 357.9 Z" class="nlf-f-teal"/><rect x="360" y="312" width="340" height="116" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="360" y="312" width="340" height="116" rx="26" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="422" cy="370" r="34" class="nlf-f-teal"/><g transform="translate(403.3 351.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="476" y="380.5">Encoder</tspan></text><path d="M710.0 370.0 L762.4 370.0" fill="none" class="nlf-s-teal" stroke-width="5" stroke-linecap="round"/><path d="M780.0 370.0 L758.0 382.1 L758.0 357.9 Z" class="nlf-f-teal"/><rect x="790" y="340" width="220" height="60" rx="30" class="nlf-f-teal-soft"/><rect x="790" y="340" width="220" height="60" rx="30" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.5"/><circle cx="820" cy="370" r="12" class="nlf-f-teal" opacity="1"/><circle cx="860" cy="370" r="12" class="nlf-f-teal" opacity="0.45"/><circle cx="900" cy="370" r="12" class="nlf-f-teal" opacity="0.8"/><circle cx="940" cy="370" r="12" class="nlf-f-teal" opacity="0.3"/><circle cx="980" cy="370" r="12" class="nlf-f-teal" opacity="0.65"/><text class="nlf-t nlf-f-teal" font-size="24" font-weight="700" text-anchor="middle"><tspan x="900" y="320.4">summary</tspan></text></g><g data-step="3"><path d="M900.0 410.0 Q834.8 528.7 729.7 582.0" fill="none" class="nlf-s-violet" stroke-width="5" stroke-linecap="round"/><path d="M714.0 590.0 L728.2 569.3 L739.1 590.8 Z" class="nlf-f-violet"/><rect x="360" y="552" width="340" height="116" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="360" y="552" width="340" height="116" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="422" cy="610" r="34" class="nlf-f-violet"/><g transform="translate(403.3 591.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="476" y="620.5">Predictor</tspan></text><path d="M710.0 624.0 L762.4 624.0" fill="none" class="nlf-s-violet" stroke-width="5" stroke-linecap="round"/><path d="M780.0 624.0 L758.0 636.1 L758.0 611.9 Z" class="nlf-f-violet"/><rect x="790" y="594" width="220" height="60" rx="30" class="nlf-f-violet-soft"/><rect x="790" y="594" width="220" height="60" rx="30" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.5"/><circle cx="820" cy="624" r="12" class="nlf-f-violet" opacity="1"/><circle cx="860" cy="624" r="12" class="nlf-f-violet" opacity="0.45"/><circle cx="900" cy="624" r="12" class="nlf-f-violet" opacity="0.8"/><circle cx="940" cy="624" r="12" class="nlf-f-violet" opacity="0.3"/><circle cx="980" cy="624" r="12" class="nlf-f-violet" opacity="0.65"/><text class="nlf-t nlf-f-violet" font-size="24" font-weight="700" text-anchor="middle"><tspan x="900" y="690.4">its guess</tspan></text></g><g data-step="4"><rect x="70" y="760" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.35"/><rect x="122" y="760" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.61"/><rect x="174" y="760" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.87"/><rect x="226" y="760" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.48"/><rect x="70" y="812" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.74"/><rect x="122" y="812" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.35"/><rect x="174" y="812" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.61"/><rect x="226" y="812" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.87"/><rect x="70" y="864" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.48"/><rect x="122" y="864" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.74"/><rect x="174" y="864" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.35"/><rect x="226" y="864" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.61"/><rect x="70" y="916" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.87"/><rect x="122" y="916" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.48"/><rect x="174" y="916" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.74"/><rect x="226" y="916" width="44" height="44" rx="9" class="nlf-f-amber" opacity="0.35"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle"><tspan x="170" y="738.4">the whole picture</tspan></text><path d="M284.0 860.0 L332.4 860.0" fill="none" class="nlf-s-amber" stroke-width="5" stroke-linecap="round"/><path d="M350.0 860.0 L328.0 872.1 L328.0 847.9 Z" class="nlf-f-amber"/><rect x="360" y="802" width="340" height="116" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="360" y="802" width="340" height="116" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="422" cy="860" r="34" class="nlf-f-amber"/><g transform="translate(403.3 841.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="start"><tspan x="476" y="869.5">Target encoder</tspan></text><path d="M710.0 860.0 L762.4 860.0" fill="none" class="nlf-s-amber" stroke-width="5" stroke-linecap="round"/><path d="M780.0 860.0 L758.0 872.1 L758.0 847.9 Z" class="nlf-f-amber"/><rect x="790" y="830" width="220" height="60" rx="30" class="nlf-f-amber-soft"/><rect x="790" y="830" width="220" height="60" rx="30" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.5"/><circle cx="820" cy="860" r="12" class="nlf-f-amber" opacity="1"/><circle cx="860" cy="860" r="12" class="nlf-f-amber" opacity="0.45"/><circle cx="900" cy="860" r="12" class="nlf-f-amber" opacity="0.8"/><circle cx="940" cy="860" r="12" class="nlf-f-amber" opacity="0.3"/><circle cx="980" cy="860" r="12" class="nlf-f-amber" opacity="0.65"/><text class="nlf-t nlf-f-amber" font-size="24" font-weight="700" text-anchor="middle"><tspan x="900" y="926.4">the real summary</tspan></text><path d="M900 722 V820" fill="none" class="nlf-s-risk" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/><rect x="829.6" y="748.2" width="140.8" height="45.6" rx="22.8" class="nlf-f-risk-soft"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="700" text-anchor="middle"><tspan x="900" y="779.4">compare</tspan></text></g><g data-step-only="1"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1108.6">Take a picture and hide some of its patches. The model</tspan><tspan x="540" y="1147.7">sees only what's left.</tspan></text></g><g data-step-only="2"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1108.6">An encoder turns the visible patches into a summary: a</tspan><tspan x="540" y="1147.7">list of numbers called an embedding.</tspan></text></g><g data-step-only="3"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1108.6">A predictor guesses the summary of the hidden patches.</tspan><tspan x="540" y="1147.7">It never draws the pixels.</tspan></text></g><g data-step-only="4"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1108.6">A second encoder sees the whole picture and gives the</tspan><tspan x="540" y="1147.7">real summary. The two are compared.</tspan></text></g></svg>
