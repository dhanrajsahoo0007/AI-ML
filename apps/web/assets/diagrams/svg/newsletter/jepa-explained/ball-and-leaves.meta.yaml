title: Pixels or meaning?
alt: >-
  One clip of a ball rolling under a tree on a windy day, predicted two ways. Predicting the pixels means thousands of
  values, mostly unpredictable: every leaf and every shadow. Predicting the meaning means a few numbers: a ball, rolling
  right, slowing down, with the leaves left out.
caption: Predicting pixels spends effort on leaves; predicting meaning keeps only the ball.
slide: Nobody can predict every leaf in the wind. JEPA doesn't try.
