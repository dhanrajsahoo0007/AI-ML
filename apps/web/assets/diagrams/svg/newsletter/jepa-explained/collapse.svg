<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1090" width="1080" height="1090" class="nlf-root nlf-jepa"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#0b5873)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#dcf0f2)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#0b5873)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-jepa{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#8fd3df;--nlf-accent-soft:#10303a;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1090" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">The collapse problem</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">The lazy way to win: give every input the same summary.</text><rect x="44" y="250" width="484" height="470" rx="34" class="nlf-f-ok-soft"/><rect x="44" y="250" width="484" height="470" rx="34" fill="none" class="nlf-s-ok" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-ok" font-size="32" font-weight="800" text-anchor="middle"><tspan x="286" y="313.2">Healthy</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="286" y="350.8">different inputs, different places</tspan></text><circle cx="166" cy="460" r="15" class="nlf-f-teal"/><circle cx="196" cy="420" r="15" class="nlf-f-teal"/><circle cx="146" cy="410" r="15" class="nlf-f-teal"/><circle cx="216" cy="470" r="15" class="nlf-f-teal"/><circle cx="376" cy="440" r="15" class="nlf-f-violet"/><circle cx="416" cy="480" r="15" class="nlf-f-violet"/><circle cx="356" cy="490" r="15" class="nlf-f-violet"/><circle cx="426" cy="420" r="15" class="nlf-f-violet"/><circle cx="266" cy="590" r="15" class="nlf-f-amber"/><circle cx="316" cy="620" r="15" class="nlf-f-amber"/><circle cx="226" cy="630" r="15" class="nlf-f-amber"/><circle cx="296" cy="560" r="15" class="nlf-f-amber"/><rect x="552" y="250" width="484" height="470" rx="34" class="nlf-f-risk-soft"/><rect x="552" y="250" width="484" height="470" rx="34" fill="none" class="nlf-s-risk" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-risk" font-size="32" font-weight="800" text-anchor="middle"><tspan x="794" y="313.2">Collapsed</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="794" y="350.8">every input, the same place</tspan></text><circle cx="789" cy="514" r="15" class="nlf-f-teal" opacity="0.8"/><circle cx="794" cy="518" r="15" class="nlf-f-teal" opacity="0.8"/><circle cx="799" cy="522" r="15" class="nlf-f-teal" opacity="0.8"/><circle cx="789" cy="526" r="15" class="nlf-f-teal" opacity="0.8"/><circle cx="794" cy="514" r="15" class="nlf-f-violet" opacity="0.8"/><circle cx="799" cy="518" r="15" class="nlf-f-violet" opacity="0.8"/><circle cx="789" cy="522" r="15" class="nlf-f-violet" opacity="0.8"/><circle cx="794" cy="526" r="15" class="nlf-f-violet" opacity="0.8"/><circle cx="799" cy="514" r="15" class="nlf-f-amber" opacity="0.8"/><circle cx="789" cy="518" r="15" class="nlf-f-amber" opacity="0.8"/><circle cx="794" cy="522" r="15" class="nlf-f-amber" opacity="0.8"/><circle cx="799" cy="526" r="15" class="nlf-f-amber" opacity="0.8"/><text class="nlf-t nlf-f-risk" font-size="25" font-weight="700" text-anchor="middle"><tspan x="794" y="638.8">easy to predict, and useless</tspan></text><rect x="64" y="750" width="952" height="120" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="750" width="952" height="120" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="810" r="34" class="nlf-f-amber"/><g transform="translate(107.3 791.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="180" y="804.4">Fix 1: a slow-moving target encoder</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="836.6">I-JEPA and V-JEPA: the target changes more slowly than the learner</tspan></text><rect x="64" y="890" width="952" height="120" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="64" y="890" width="952" height="120" rx="26" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="126" cy="950" r="34" class="nlf-f-teal"/><g transform="translate(107.3 931.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="700" text-anchor="start"><tspan x="180" y="944.4">Fix 2: a rule that keeps points spread out</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="180" y="976.6">LeJEPA: one extra term in the training goal</tspan></text></svg>
