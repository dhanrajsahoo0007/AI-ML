<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1240" width="1080" height="1240" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-on-accent{fill:var(--nlf-on-accent,#ffffff)}.nlf-f-risk{fill:var(--nlf-risk,#c8412f)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fdece8)}.nlf-f-ok{fill:var(--nlf-ok,#2f7d4a)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e5f3e9)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#cbc5b9)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-risk{stroke:var(--nlf-risk,#c8412f)}.nlf-s-ok{stroke:var(--nlf-ok,#2f7d4a)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#4a4740;--nlf-surface:#1f1e1b;--nlf-risk:#ff8a75;--nlf-risk-soft:#3a201b;--nlf-ok:#74d394;--nlf-ok-soft:#1b3324;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-on-accent:#15122e}</style><rect x="64" y="60" width="10" height="56" rx="5" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="94" y="104" font-size="48" font-weight="700">A coding agent fixes a bug</text><text class="nlf-t nlf-f-muted" x="94" y="152" font-size="27" font-weight="500">One task, traced through the harness.</text><line x1="124" y1="270" x2="124" y2="1120" class="nlf-s-line" stroke-width="4"/><circle cx="124" cy="270" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="124" y="278.4">1</tspan></text><rect x="190" y="238" width="260" height="64" rx="22" class="nlf-f-surface nlf-s-ink" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="320" y="279.1">Context</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="500" text-anchor="start"><tspan x="482" y="244.8">Reads the bug report, the</tspan><tspan x="482" y="279.8">failing test and the two files</tspan><tspan x="482" y="314.8">it touches.</tspan></text><circle cx="124" cy="440" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="124" y="448.4">2</tspan></text><rect x="190" y="408" width="260" height="64" rx="22" class="nlf-f-accent-soft nlf-s-accent" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="320" y="449.1">Model</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="500" text-anchor="start"><tspan x="482" y="432.3">Proposes a one-line fix in</tspan><tspan x="482" y="467.3">parser.ts.</tspan></text><circle cx="124" cy="610" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="124" y="618.4">3</tspan></text><rect x="190" y="578" width="260" height="64" rx="22" class="nlf-f-surface nlf-s-ink" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="320" y="619.1">Guardrails</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="500" text-anchor="start"><tspan x="482" y="602.3">The edit stays inside the repo</tspan><tspan x="482" y="637.3">and needs no network: allowed.</tspan></text><circle cx="124" cy="780" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="124" y="788.4">4</tspan></text><rect x="190" y="748" width="260" height="64" rx="22" class="nlf-f-surface nlf-s-ink" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="320" y="789.1">Sandbox</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="500" text-anchor="start"><tspan x="482" y="754.8">Applies the edit and runs the</tspan><tspan x="482" y="789.8">tests in a throwaway</tspan><tspan x="482" y="824.8">container.</tspan></text><circle cx="124" cy="950" r="22" class="nlf-f-risk"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="124" y="958.4">5</tspan></text><rect x="190" y="918" width="260" height="64" rx="22" class="nlf-f-risk-soft nlf-s-risk" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="320" y="959.1">Observe</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="500" text-anchor="start"><tspan x="482" y="942.3">One test still fails: empty</tspan><tspan x="482" y="977.3">input crashes the parser.</tspan></text><circle cx="124" cy="1120" r="22" class="nlf-f-ok"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="124" y="1128.4">6</tspan></text><rect x="190" y="1088" width="260" height="64" rx="22" class="nlf-f-ok-soft nlf-s-ok" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="320" y="1129.1">Model + checks</tspan></text><text class="nlf-t nlf-f-ink" font-size="28" font-weight="500" text-anchor="start"><tspan x="482" y="1094.8">Handles empty input. Tests,</tspan><tspan x="482" y="1129.8">lint and types pass. A human</tspan><tspan x="482" y="1164.8">reviews the PR.</tspan></text></svg>
