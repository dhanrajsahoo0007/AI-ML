<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1240" width="1080" height="1240" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1240" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">A coding agent fixes a bug</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">One task, traced through the harness.</text><line x1="112" y1="290" x2="112" y2="1130" class="nlf-s-line" stroke-width="5" stroke-linecap="round"/><circle cx="112" cy="290" r="22" class="nlf-f-blue"/><circle cx="112" cy="290" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="298.4">1</tspan></text><rect x="168" y="226" width="848" height="128" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="226" width="848" height="128" rx="24" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="290" r="30" class="nlf-f-blue"/><g transform="translate(209.5 273.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><rect x="6" y="3" width="13" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/><path d="M9.5 8h6M9.5 11.5h6M9.5 15h4"/></g><text class="nlf-t nlf-f-blue" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="269.1">Context</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="280" y="300.2">Reads the bug report, the failing test and the two</tspan><tspan x="280" y="334.0">files it touches.</tspan></text><circle cx="112" cy="458" r="22" class="nlf-f-accent"/><circle cx="112" cy="458" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="466.4">2</tspan></text><rect x="168" y="394" width="848" height="128" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="394" width="848" height="128" rx="24" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="458" r="30" class="nlf-f-accent"/><g transform="translate(209.5 441.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-accent" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="437.1">Model</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="280" y="485.1">Proposes a one-line fix in parser.ts.</tspan></text><circle cx="112" cy="626" r="22" class="nlf-f-risk"/><circle cx="112" cy="626" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="634.4">3</tspan></text><rect x="168" y="562" width="848" height="128" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="562" width="848" height="128" rx="24" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="626" r="30" class="nlf-f-risk"/><g transform="translate(209.5 609.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></g><text class="nlf-t nlf-f-risk" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="605.1">Guardrails</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="280" y="636.2">The edit stays inside the repo and needs no</tspan><tspan x="280" y="670.0">network: allowed.</tspan></text><circle cx="112" cy="794" r="22" class="nlf-f-teal"/><circle cx="112" cy="794" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="802.4">4</tspan></text><rect x="168" y="730" width="848" height="128" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="730" width="848" height="128" rx="24" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="794" r="30" class="nlf-f-teal"/><g transform="translate(209.5 777.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></g><text class="nlf-t nlf-f-teal" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="773.1">Sandbox</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="280" y="804.2">Applies the edit and runs the tests in a throwaway</tspan><tspan x="280" y="838.0">container.</tspan></text><circle cx="112" cy="962" r="22" class="nlf-f-pink"/><circle cx="112" cy="962" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="970.4">5</tspan></text><rect x="168" y="898" width="848" height="128" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="898" width="848" height="128" rx="24" fill="none" class="nlf-s-pink" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="962" r="30" class="nlf-f-pink"/><g transform="translate(209.5 945.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text class="nlf-t nlf-f-pink" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="941.1">Observe</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="280" y="972.2">One test still fails: empty input crashes the</tspan><tspan x="280" y="1006.0">parser.</tspan></text><circle cx="112" cy="1130" r="22" class="nlf-f-ok"/><circle cx="112" cy="1130" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="112" y="1138.4">6</tspan></text><rect x="168" y="1066" width="848" height="128" rx="24" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="168" y="1066" width="848" height="128" rx="24" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="226" cy="1130" r="30" class="nlf-f-ok"/><g transform="translate(209.5 1113.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ok" font-size="26" font-weight="800" text-anchor="start"><tspan x="280" y="1109.1">Model + checks</tspan></text><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="280" y="1140.2">Handles empty input. Tests, lint and types pass. A</tspan><tspan x="280" y="1174.0">human reviews the PR.</tspan></text></svg>
