<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1180" width="1080" height="1180" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-on-accent{fill:var(--nlf-on-accent,#ffffff)}.nlf-f-risk{fill:var(--nlf-risk,#c8412f)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fdece8)}.nlf-f-ok{fill:var(--nlf-ok,#2f7d4a)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e5f3e9)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#cbc5b9)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-risk{stroke:var(--nlf-risk,#c8412f)}.nlf-s-ok{stroke:var(--nlf-ok,#2f7d4a)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#4a4740;--nlf-surface:#1f1e1b;--nlf-risk:#ff8a75;--nlf-risk-soft:#3a201b;--nlf-ok:#74d394;--nlf-ok-soft:#1b3324;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-on-accent:#15122e}</style><rect x="64" y="60" width="10" height="56" rx="5" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="94" y="104" font-size="48" font-weight="700">The agent loop</text><text class="nlf-t nlf-f-muted" x="94" y="152" font-size="27" font-weight="500">Every turn passes through the harness, not just the model.</text><line x1="64" y1="990" x2="1016" y2="990" class="nlf-s-line" stroke-width="2"/><g data-step="1"><rect x="409" y="228" width="262" height="124" rx="22" class="nlf-f-surface nlf-s-ink" stroke-width="3"/><g transform="translate(518 246) scale(1.8333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-accent"><rect x="6" y="3" width="13" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/><path d="M9.5 8h6M9.5 11.5h6M9.5 15h4"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="600" text-anchor="middle"><tspan x="540" y="329.8">Gather context</tspan></text><circle cx="415" cy="234" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="415" y="242.4">1</tspan></text></g><g data-step="2"><path d="M684.2 340.8 Q762.7 344.4 785.2 408.2" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M791.2 425.1 L775.9 411.4 L794.5 404.9 Z" class="nlf-f-muted"/><rect x="728.5549894751716" y="435.2949016875158" width="262" height="124" rx="22" class="nlf-f-accent nlf-s-accent" stroke-width="3"/><g transform="translate(837.5549894751716 453.2949016875158) scale(1.8333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--nlf-on-accent,#ffffff)"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></g><text class="nlf-t nlf-f-on-accent" font-size="28" font-weight="600" text-anchor="middle"><tspan x="859.5549894751716" y="537.1">Model proposes</tspan></text><circle cx="734.5549894751716" cy="441.2949016875158" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="734.5549894751716" y="449.7">2</tspan></text></g><g data-step="3"><path d="M852.2 573.2 Q863.3 681.9 800.5 746.3" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M787.9 759.2 L793.4 739.4 L807.6 753.2 Z" class="nlf-f-muted"/><rect x="606.495844770271" y="770.7050983124842" width="262" height="124" rx="22" class="nlf-f-ok-soft nlf-s-ok" stroke-width="3"/><g transform="translate(715.495844770271 788.7050983124842) scale(1.8333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-ok"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="600" text-anchor="middle"><tspan x="737.495844770271" y="872.5">Harness checks</tspan></text><circle cx="612.495844770271" cy="776.7050983124842" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="612.495844770271" y="785.1">3</tspan></text></g><g data-step="4"><path d="M592.5 832.7 L505.5 832.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M487.5 832.7 L505.5 822.8 L505.5 842.6 Z" class="nlf-f-muted"/><rect x="211.50415522972907" y="770.7050983124842" width="262" height="124" rx="22" class="nlf-f-surface nlf-s-ink" stroke-width="3"/><g transform="translate(320.50415522972907 788.7050983124842) scale(1.8333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-accent"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="600" text-anchor="middle"><tspan x="342.50415522972907" y="872.5">Act in a sandbox</tspan></text><circle cx="217.50415522972907" cy="776.7050983124842" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="217.50415522972907" y="785.1">4</tspan></text></g><g data-step="5"><path d="M292.1 759.2 Q216.7 681.9 226.0 591.1" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M227.8 573.2 L235.8 592.1 L216.1 590.1 Z" class="nlf-f-muted"/><path d="M288.8 425.1 Q317.3 344.4 377.8 341.6" fill="none" class="nlf-s-accent" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/><path d="M395.8 340.8 L378.3 351.5 L377.4 331.7 Z" class="nlf-f-accent"/><g transform="translate(506 532) scale(2.8333333333333335)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-accent"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></g><text class="nlf-t nlf-f-accent" font-size="28" font-weight="600" text-anchor="middle"><tspan x="540" y="639.8">repeat</tspan></text><rect x="89.44501052482843" y="435.2949016875157" width="262" height="124" rx="22" class="nlf-f-surface nlf-s-ink" stroke-width="3"/><g transform="translate(198.44501052482843 453.2949016875157) scale(1.8333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-accent"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text class="nlf-t nlf-f-ink" font-size="28" font-weight="600" text-anchor="middle"><tspan x="220.44501052482843" y="537.1">Observe result</tspan></text><circle cx="95.44501052482843" cy="441.2949016875157" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="95.44501052482843" y="449.7">5</tspan></text></g><g data-step-only="1"><text class="nlf-t nlf-f-ink" font-size="30" font-weight="500" text-anchor="middle"><tspan x="540" y="1058.3">Gather: the harness assembles what the model sees: the</tspan><tspan x="540" y="1098.8">task, the right files, earlier results.</tspan></text></g><g data-step-only="2"><text class="nlf-t nlf-f-ink" font-size="30" font-weight="500" text-anchor="middle"><tspan x="540" y="1058.3">Propose: the model suggests the next action, such as a</tspan><tspan x="540" y="1098.8">tool call or an edit. Nothing has run yet.</tspan></text></g><g data-step-only="3"><text class="nlf-t nlf-f-ink" font-size="30" font-weight="500" text-anchor="middle"><tspan x="540" y="1058.3">Check: the harness tests the proposal against schemas,</tspan><tspan x="540" y="1098.8">permissions and rules before anything runs.</tspan></text></g><g data-step-only="4"><text class="nlf-t nlf-f-ink" font-size="30" font-weight="500" text-anchor="middle"><tspan x="540" y="1058.3">Act: the approved action runs in a sandbox, where a</tspan><tspan x="540" y="1098.8">mistake can't hurt real systems.</tspan></text></g><g data-step-only="5"><text class="nlf-t nlf-f-ink" font-size="30" font-weight="500" text-anchor="middle"><tspan x="540" y="1058.3">Observe: output, errors and test results flow back in,</tspan><tspan x="540" y="1098.8">and the loop repeats until the task is done.</tspan></text></g></svg>
