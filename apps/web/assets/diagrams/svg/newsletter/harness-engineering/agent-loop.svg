<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1330" width="1080" height="1330" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1330" fill="url(#nlf-dots)"/><circle cx="540" cy="620" r="250" class="nlf-f-accent-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">The agent loop</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Every turn passes through the harness, not just the model.</text><line x1="64" y1="1140" x2="1016" y2="1140" class="nlf-s-line" stroke-width="2"/><g data-step="1"><rect x="409" y="244" width="262" height="172" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="409" y="244" width="262" height="172" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="540" cy="294" r="30" class="nlf-f-blue"/><g transform="translate(523.5 277.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><rect x="6" y="3" width="13" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/><path d="M9.5 8h6M9.5 11.5h6M9.5 15h4"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="middle"><tspan x="540" y="362.4">Gather context</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="540" y="394.4">by the harness</tspan></text><circle cx="417" cy="252" r="22" class="nlf-f-blue"/><circle cx="417" cy="252" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="417" y="260.4">1</tspan></text></g><g data-step="2"><path d="M684.5 371.5 Q757.9 356.9 770.6 416.8" fill="none" class="nlf-s-accent" stroke-width="5" stroke-linecap="round"/><path d="M774.2 434.0 L757.8 415.0 L781.5 410.0 Z" class="nlf-f-accent"/><rect x="730.4571025077619" y="444.3850716312653" width="262" height="172" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="730.4571025077619" y="444.3850716312653" width="262" height="172" rx="26" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="861.4571025077619" cy="494.3850716312653" r="30" class="nlf-f-accent"/><g transform="translate(845.0 477.9) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="middle"><tspan x="861.4571025077619" y="562.8">Propose</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="861.4571025077619" y="594.8">by the model</tspan></text><circle cx="738.4571025077619" cy="452.3850716312653" r="22" class="nlf-f-accent"/><circle cx="738.4571025077619" cy="452.3850716312653" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="738.4571025077619" y="460.8">2</tspan></text></g><g data-step="3"><path d="M855.4 630.4 Q885.5 713.1 829.5 748.2" fill="none" class="nlf-s-ok" stroke-width="5" stroke-linecap="round"/><path d="M814.6 757.6 L826.8 735.6 L839.7 756.1 Z" class="nlf-f-ok"/><rect x="607.6714152748559" y="768.6149283687348" width="262" height="172" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="607.6714152748559" y="768.6149283687348" width="262" height="172" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="738.6714152748559" cy="818.6149283687348" r="30" class="nlf-f-ok"/><g transform="translate(722.2 802.1) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="middle"><tspan x="738.6714152748559" y="887.1">Check</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="738.6714152748559" y="919.0">by the harness</tspan></text><circle cx="615.6714152748559" cy="776.6149283687348" r="22" class="nlf-f-ok"/><circle cx="615.6714152748559" cy="776.6149283687348" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="615.6714152748559" y="785.0">3</tspan></text></g><g data-step="4"><path d="M593.7 854.6 L503.9 854.6" fill="none" class="nlf-s-teal" stroke-width="5" stroke-linecap="round"/><path d="M486.3 854.6 L508.3 842.5 L508.3 866.7 Z" class="nlf-f-teal"/><rect x="210.32858472514408" y="768.6149283687348" width="262" height="172" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="210.32858472514408" y="768.6149283687348" width="262" height="172" rx="26" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="341.3285847251441" cy="818.6149283687348" r="30" class="nlf-f-teal"/><g transform="translate(324.8 802.1) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="middle"><tspan x="341.3285847251441" y="887.1">Act in a sandbox</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="341.3285847251441" y="919.0">by the harness</tspan></text><circle cx="218.32858472514408" cy="776.6149283687348" r="22" class="nlf-f-teal"/><circle cx="218.32858472514408" cy="776.6149283687348" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="218.32858472514408" y="785.0">4</tspan></text></g><g data-step="5"><path d="M265.4 757.6 Q194.5 713.1 218.5 646.9" fill="none" class="nlf-s-pink" stroke-width="5" stroke-linecap="round"/><path d="M224.6 630.4 L228.4 655.2 L205.7 646.9 Z" class="nlf-f-pink"/><path d="M305.8 434.0 Q322.1 356.9 378.3 368.1" fill="none" class="nlf-s-accent" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 15"/><path d="M395.5 371.5 L371.6 379.1 L376.3 355.3 Z" class="nlf-f-accent"/><circle cx="540" cy="620" r="92" class="nlf-f-accent-soft"/><circle cx="540" cy="602" r="38" class="nlf-f-accent"/><g transform="translate(519.1 581.1) scale(1.742)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></g><text class="nlf-t nlf-f-accent" font-size="27" font-weight="800" text-anchor="middle"><tspan x="540" y="679.5">repeat</tspan></text><rect x="87.54289749223813" y="444.3850716312652" width="262" height="172" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="87.54289749223813" y="444.3850716312652" width="262" height="172" rx="26" fill="none" class="nlf-s-pink" stroke-width="2" stroke-opacity="0.35"/><circle cx="218.54289749223813" cy="494.3850716312652" r="30" class="nlf-f-pink"/><g transform="translate(202.0 477.9) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text class="nlf-t nlf-f-ink" font-size="27" font-weight="700" text-anchor="middle"><tspan x="218.54289749223813" y="562.8">Observe</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="218.54289749223813" y="594.8">by the harness</tspan></text><circle cx="95.54289749223813" cy="452.3850716312652" r="22" class="nlf-f-pink"/><circle cx="95.54289749223813" cy="452.3850716312652" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="95.54289749223813" y="460.8">5</tspan></text></g><g data-step-only="1"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1228.6">Gather: the harness picks what the model sees on this</tspan><tspan x="540" y="1267.7">turn: the task, the right files, earlier results.</tspan></text></g><g data-step-only="2"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1228.6">Propose: the model suggests the next action, such as a</tspan><tspan x="540" y="1267.7">tool call or an edit. Nothing has run yet.</tspan></text></g><g data-step-only="3"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1228.6">Check: the harness tests the proposal against schemas,</tspan><tspan x="540" y="1267.7">permissions and rules before anything runs.</tspan></text></g><g data-step-only="4"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1228.6">Act: the approved action runs in a sandbox, where a</tspan><tspan x="540" y="1267.7">mistake can't hurt real systems.</tspan></text></g><g data-step-only="5"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1228.6">Observe: output, errors and test results flow back in,</tspan><tspan x="540" y="1267.7">and the loop repeats until the task is done.</tspan></text></g></svg>
