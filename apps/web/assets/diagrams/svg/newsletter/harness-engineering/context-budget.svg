<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1120" width="1080" height="1120" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-on-accent{fill:var(--nlf-on-accent,#ffffff)}.nlf-f-risk{fill:var(--nlf-risk,#c8412f)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fdece8)}.nlf-f-ok{fill:var(--nlf-ok,#2f7d4a)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e5f3e9)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#cbc5b9)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-risk{stroke:var(--nlf-risk,#c8412f)}.nlf-s-ok{stroke:var(--nlf-ok,#2f7d4a)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#4a4740;--nlf-surface:#1f1e1b;--nlf-risk:#ff8a75;--nlf-risk-soft:#3a201b;--nlf-ok:#74d394;--nlf-ok-soft:#1b3324;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-on-accent:#15122e}</style><rect x="64" y="60" width="10" height="56" rx="5" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="94" y="104" font-size="48" font-weight="700">What fills the context window</text><text class="nlf-t nlf-f-muted" x="94" y="152" font-size="27" font-weight="500">The space is fixed, so the harness decides what goes in.</text><rect x="90" y="244" width="312" height="772" rx="26" fill="none" class="nlf-s-ink" stroke-width="3"/><rect x="96" y="250.0" width="300" height="62.4" rx="16" class="nlf-f-surface nlf-s-line" stroke-width="2.5"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="246" y="290.3">Instructions</tspan></text><line x1="416" y1="281.2" x2="452" y2="281.2" class="nlf-s-line" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="27" font-weight="500" text-anchor="start"><tspan x="472" y="273.8">Short and stable: who the</tspan><tspan x="472" y="307.5">agent is, the rules</tspan></text><rect x="96" y="318.4" width="300" height="70.0" rx="16" class="nlf-f-surface nlf-s-line" stroke-width="2.5"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="246" y="362.5">Tool definitions</tspan></text><line x1="416" y1="353.4" x2="452" y2="353.4" class="nlf-s-line" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="27" font-weight="500" text-anchor="start"><tspan x="472" y="362.8">Only the tools this task needs</tspan></text><rect x="96" y="394.4" width="300" height="54.8" rx="16" class="nlf-f-accent-soft nlf-s-accent" stroke-width="2.5"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="600" text-anchor="middle"><tspan x="246" y="430.9">Task &amp; plan</tspan></text><line x1="416" y1="421.8" x2="452" y2="421.8" class="nlf-s-line" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="27" font-weight="500" text-anchor="start"><tspan x="472" y="414.4">Restated each turn so it isn't</tspan><tspan x="472" y="448.1">lost</tspan></text><rect x="96" y="455.2" width="300" height="206.8" rx="16" class="nlf-f-accent-soft nlf-s-accent" stroke-width="2.5"/><text class="nlf-t nlf-f-ink" font-size="30" font-weight="600" text-anchor="middle"><tspan x="246" y="569.1">Retrieved files</tspan></text><line x1="416" y1="558.6" x2="452" y2="558.6" class="nlf-s-line" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="27" font-weight="500" text-anchor="start"><tspan x="472" y="551.2">Fetched just in time, not all</tspan><tspan x="472" y="584.9">up front</tspan></text><rect x="96" y="668.0" width="300" height="244.8" rx="16" class="nlf-f-risk-soft nlf-s-risk" stroke-width="2.5"/><text class="nlf-t nlf-f-ink" font-size="30" font-weight="600" text-anchor="middle"><tspan x="246" y="800.9">History &amp; results</tspan></text><line x1="416" y1="790.4" x2="452" y2="790.4" class="nlf-s-line" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="27" font-weight="500" text-anchor="start"><tspan x="472" y="783.0">Grows every turn: summarise it</tspan><tspan x="472" y="816.7">(compaction)</tspan></text><rect x="96" y="918.8" width="300" height="85.2" rx="16" class="nlf-f-ok-soft nlf-s-ok" stroke-width="2.5" stroke-dasharray="6 8"/><text class="nlf-t nlf-f-ink" font-size="30" font-weight="600" text-anchor="middle"><tspan x="246" y="971.9">Free space</tspan></text><line x1="416" y1="961.4" x2="452" y2="961.4" class="nlf-s-line" stroke-width="3"/><text class="nlf-t nlf-f-ink" font-size="27" font-weight="500" text-anchor="start"><tspan x="472" y="970.9">Room to think and to answer</tspan></text><text class="nlf-t nlf-f-muted" font-size="26" font-weight="600" text-anchor="middle"><tspan x="246" y="1069.1">One context window</tspan></text></svg>
