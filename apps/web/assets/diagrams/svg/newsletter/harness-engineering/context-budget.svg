<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1160" width="1080" height="1160" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1160" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">What fills the context window</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">The space is fixed, so the harness decides what goes in.</text><rect x="86" y="226" width="310" height="840" rx="32" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="96" y="236.0" width="290" height="74.0" rx="20" class="nlf-f-violet-soft"/><rect x="96" y="236.0" width="10" height="74.0" rx="5" class="nlf-f-violet"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="700" text-anchor="middle"><tspan x="247" y="282.1">Instructions</tspan></text><line x1="408" y1="273.0" x2="456" y2="273.0" class="nlf-s-violet" stroke-width="3" stroke-linecap="round" opacity="0.6"/><circle cx="486" cy="273" r="26" class="nlf-f-violet"/><g transform="translate(471.7 258.7) scale(1.192)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></g><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="528" y="265.9">Short and stable: the role,</tspan><tspan x="528" y="298.4">the rules</tspan></text><rect x="96" y="318.0" width="290" height="74.0" rx="20" class="nlf-f-amber-soft"/><rect x="96" y="318.0" width="10" height="74.0" rx="5" class="nlf-f-amber"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="700" text-anchor="middle"><tspan x="247" y="364.1">Tool definitions</tspan></text><line x1="408" y1="355.0" x2="456" y2="355.0" class="nlf-s-amber" stroke-width="3" stroke-linecap="round" opacity="0.6"/><circle cx="486" cy="355" r="26" class="nlf-f-amber"/><g transform="translate(471.7 340.7) scale(1.192)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M14.5 5.5a4 4 0 0 0-5 5L3.5 16.5a2 2 0 0 0 3 3l6-6a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></g><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="528" y="364.1">Only the tools this task needs</tspan></text><rect x="96" y="400.0" width="290" height="65.8" rx="20" class="nlf-f-accent-soft"/><rect x="96" y="400.0" width="10" height="65.8" rx="5" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" font-size="26" font-weight="700" text-anchor="middle"><tspan x="247" y="442.0">Task &amp; plan</tspan></text><line x1="408" y1="432.9" x2="456" y2="432.9" class="nlf-s-accent" stroke-width="3" stroke-linecap="round" opacity="0.6"/><circle cx="486" cy="432.9" r="26" class="nlf-f-accent"/><g transform="translate(471.7 418.6) scale(1.192)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="528" y="425.8">Restated each turn so it isn't</tspan><tspan x="528" y="458.3">lost</tspan></text><rect x="96" y="473.8" width="290" height="213.4" rx="20" class="nlf-f-blue-soft"/><rect x="96" y="473.8" width="10" height="213.4" rx="5" class="nlf-f-blue"/><text class="nlf-t nlf-f-ink" font-size="29" font-weight="700" text-anchor="middle"><tspan x="247" y="590.6">Retrieved files</tspan></text><line x1="408" y1="580.5" x2="456" y2="580.5" class="nlf-s-blue" stroke-width="3" stroke-linecap="round" opacity="0.6"/><circle cx="486" cy="580.5" r="26" class="nlf-f-blue"/><g transform="translate(471.7 566.2) scale(1.192)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><rect x="6" y="3" width="13" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/><path d="M9.5 8h6M9.5 11.5h6M9.5 15h4"/></g><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="528" y="573.4">Fetched just in time, not all</tspan><tspan x="528" y="605.9">up front</tspan></text><rect x="96" y="695.2" width="290" height="246.2" rx="20" class="nlf-f-risk-soft"/><rect x="96" y="695.2" width="10" height="246.2" rx="5" class="nlf-f-risk"/><text class="nlf-t nlf-f-ink" font-size="29" font-weight="700" text-anchor="middle"><tspan x="247" y="828.5">History &amp; results</tspan></text><line x1="408" y1="818.3" x2="456" y2="818.3" class="nlf-s-risk" stroke-width="3" stroke-linecap="round" opacity="0.6"/><circle cx="486" cy="818.3000000000001" r="26" class="nlf-f-risk"/><g transform="translate(471.7 804.0) scale(1.192)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></g><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="528" y="811.2">Grows every turn, so summarise</tspan><tspan x="528" y="843.7">it (compaction)</tspan></text><rect x="96" y="949.4" width="290" height="98.6" rx="20" class="nlf-f-ok-soft"/><rect x="96" y="949.4" width="10" height="98.6" rx="5" class="nlf-f-ok"/><text class="nlf-t nlf-f-ink" font-size="29" font-weight="700" text-anchor="middle"><tspan x="247" y="1008.9">Free space</tspan></text><line x1="408" y1="998.7" x2="456" y2="998.7" class="nlf-s-ok" stroke-width="3" stroke-linecap="round" opacity="0.6"/><circle cx="486" cy="998.7" r="26" class="nlf-f-ok"/><g transform="translate(471.7 984.4) scale(1.192)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M4 20V4M4 20h16"/><path d="M8 16l4-5 3 3 5-7"/></g><text class="nlf-t nlf-f-ink" font-size="26" font-weight="500" text-anchor="start"><tspan x="528" y="1007.8">Room to think and to answer</tspan></text><text class="nlf-t nlf-f-muted" font-size="26" font-weight="700" text-anchor="middle"><tspan x="241" y="1119.1">one context window</tspan></text></svg>
