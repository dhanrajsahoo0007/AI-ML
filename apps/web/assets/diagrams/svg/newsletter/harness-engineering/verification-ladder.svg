<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1400" width="1080" height="1400" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-on-accent{fill:var(--nlf-on-accent,#ffffff)}.nlf-f-risk{fill:var(--nlf-risk,#c8412f)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fdece8)}.nlf-f-ok{fill:var(--nlf-ok,#2f7d4a)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e5f3e9)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#cbc5b9)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-risk{stroke:var(--nlf-risk,#c8412f)}.nlf-s-ok{stroke:var(--nlf-ok,#2f7d4a)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#4a4740;--nlf-surface:#1f1e1b;--nlf-risk:#ff8a75;--nlf-risk-soft:#3a201b;--nlf-ok:#74d394;--nlf-ok-soft:#1b3324;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-on-accent:#15122e}</style><rect x="64" y="60" width="10" height="56" rx="5" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="94" y="104" font-size="48" font-weight="700">Checking the work</text><text class="nlf-t nlf-f-muted" x="94" y="152" font-size="27" font-weight="500">Cheap, certain checks first. Costly judgment last.</text><g data-step="1"><line x1="1010" y1="300" x2="1010" y2="828" class="nlf-s-risk" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="600" text-anchor="middle" transform="rotate(90 1040 564)"><tspan x="1040" y="572.4">error goes back to the model</tspan></text></g><g data-step="1"><rect x="170" y="234" width="600" height="132" rx="22" class="nlf-f-surface nlf-s-ink" stroke-width="3"/><g transform="translate(206 272) scale(2.3333333333333335)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-ink"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text class="nlf-t nlf-f-ink" font-size="32" font-weight="700" text-anchor="start"><tspan x="290" y="291.2">Schema &amp; format</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="290" y="334.8">certain · milliseconds</tspan></text><circle cx="174" cy="238" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="174" y="246.4">1</tspan></text><path d="M782.0 300.0 L980.0 300.0" fill="none" class="nlf-s-risk" stroke-width="3" stroke-linecap="round"/><path d="M998.0 300.0 L980.0 309.9 L980.0 290.1 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="600" text-anchor="end"><tspan x="1010" y="278.4">fail</tspan></text></g><g data-step="2"><path d="M470.0 380.0 L470.0 378.0" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M470.0 396.0 L460.1 378.0 L479.9 378.0 Z" class="nlf-f-muted"/><rect x="170" y="410" width="600" height="132" rx="22" class="nlf-f-surface nlf-s-ink" stroke-width="3"/><g transform="translate(206 448) scale(2.3333333333333335)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-ink"><path d="M14.5 5.5a4 4 0 0 0-5 5L3.5 16.5a2 2 0 0 0 3 3l6-6a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></g><text class="nlf-t nlf-f-ink" font-size="32" font-weight="700" text-anchor="start"><tspan x="290" y="467.2">Tests, linters, types</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="290" y="510.8">certain · seconds</tspan></text><circle cx="174" cy="414" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="174" y="422.4">2</tspan></text><path d="M782.0 476.0 L980.0 476.0" fill="none" class="nlf-s-risk" stroke-width="3" stroke-linecap="round"/><path d="M998.0 476.0 L980.0 485.9 L980.0 466.1 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="600" text-anchor="end"><tspan x="1010" y="454.4">fail</tspan></text></g><g data-step="3"><path d="M470.0 556.0 L470.0 554.0" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M470.0 572.0 L460.1 554.0 L479.9 554.0 Z" class="nlf-f-muted"/><rect x="170" y="586" width="600" height="132" rx="22" class="nlf-f-accent-soft nlf-s-accent" stroke-width="3"/><g transform="translate(206 624) scale(2.3333333333333335)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-accent"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></g><text class="nlf-t nlf-f-ink" font-size="32" font-weight="700" text-anchor="start"><tspan x="290" y="643.2">A second model reviews</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="290" y="686.8">judgment · costs tokens</tspan></text><circle cx="174" cy="590" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="174" y="598.4">3</tspan></text><path d="M782.0 652.0 L980.0 652.0" fill="none" class="nlf-s-risk" stroke-width="3" stroke-linecap="round"/><path d="M998.0 652.0 L980.0 661.9 L980.0 642.1 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="600" text-anchor="end"><tspan x="1010" y="630.4">fail</tspan></text></g><g data-step="4"><path d="M470.0 732.0 L470.0 730.0" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M470.0 748.0 L460.1 730.0 L479.9 730.0 Z" class="nlf-f-muted"/><rect x="170" y="762" width="600" height="132" rx="22" class="nlf-f-accent-soft nlf-s-accent" stroke-width="3"/><g transform="translate(206 800) scale(2.3333333333333335)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-accent"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/></g><text class="nlf-t nlf-f-ink" font-size="32" font-weight="700" text-anchor="start"><tspan x="290" y="819.2">A human approves</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="start"><tspan x="290" y="862.8">judgment · costs attention</tspan></text><circle cx="174" cy="766" r="22" class="nlf-f-accent"/><text class="nlf-t nlf-f-on-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="174" y="774.4">4</tspan></text><path d="M782.0 828.0 L980.0 828.0" fill="none" class="nlf-s-risk" stroke-width="3" stroke-linecap="round"/><path d="M998.0 828.0 L980.0 837.9 L980.0 818.1 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="600" text-anchor="end"><tspan x="1010" y="806.4">fail</tspan></text></g><g data-step="4"><path d="M470.0 908.0 L470.0 960.0" fill="none" class="nlf-s-ok" stroke-width="4" stroke-linecap="round"/><path d="M470.0 978.0 L460.1 960.0 L479.9 960.0 Z" class="nlf-f-ok"/><rect x="350" y="978" width="240" height="64" rx="32" class="nlf-f-ok"/><text class="nlf-t nlf-f-on-accent" font-size="28" font-weight="700" text-anchor="middle"><tspan x="470" y="1019.8">accepted</tspan></text></g><line x1="64" y1="1218" x2="1016" y2="1218" class="nlf-s-line" stroke-width="2"/><g data-step-only="1"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1286.6">Is the output even well formed? Valid JSON, the right</tspan><tspan x="540" y="1325.7">fields, a real file path. Free and instant.</tspan></text></g><g data-step-only="2"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1286.6">Does the change work? Run the tests and the type checker.</tspan><tspan x="540" y="1325.7">Still deterministic, still cheap.</tspan></text></g><g data-step-only="3"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1286.6">Is it what was asked? A reviewer model checks intent and</tspan><tspan x="540" y="1325.7">quality that no test can see.</tspan></text></g><g data-step-only="4"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1286.6">Risky or irreversible actions wait for a person. Their</tspan><tspan x="540" y="1325.7">time is the scarcest check, so it comes last.</tspan></text></g></svg>
