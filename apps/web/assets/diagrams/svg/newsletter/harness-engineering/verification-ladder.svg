<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1500" width="1080" height="1500" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1500" fill="url(#nlf-dots)"/><circle cx="500" cy="608" r="320" class="nlf-f-ok-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Checking the work</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Cheap, certain checks first. Costly judgment last.</text><line x1="64" y1="1310" x2="1016" y2="1310" class="nlf-s-line" stroke-width="2"/><path d="M118.0 280.0 L118.0 919.7" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M118.0 936.0 L106.8 915.6 L129.2 915.6 Z" class="nlf-f-muted"/><text class="nlf-t nlf-f-muted" font-size="24" font-weight="700" text-anchor="middle" transform="rotate(90 84 608)"><tspan x="84" y="616.4">cheap and certain  →  costly judgment</tspan></text><g data-step="1"><line x1="980" y1="320" x2="980" y2="896" class="nlf-s-risk" stroke-width="4" stroke-dasharray="1 12" stroke-linecap="round"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="700" text-anchor="middle" transform="rotate(90 1010 608)"><tspan x="1010" y="616.4">the error goes back to the model</tspan></text></g><g data-step="1"><rect x="200" y="250" width="600" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="200" y="250" width="600" height="140" rx="26" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="262" cy="320" r="34" class="nlf-f-teal"/><g transform="translate(243.3 301.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="316" y="314.0">Schema &amp; format</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="316" y="347.9">certain · instant · free</tspan></text><circle cx="208" cy="258" r="22" class="nlf-f-teal"/><circle cx="208" cy="258" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="208" y="266.4">1</tspan></text><path d="M814.0 320.0 L929.7 320.0" fill="none" class="nlf-s-risk" stroke-width="4" stroke-linecap="round"/><path d="M946.0 320.0 L925.6 331.2 L925.6 308.8 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="800" text-anchor="end"><tspan x="905" y="300.4">fail</tspan></text></g><g data-step="2"><path d="M500.0 404.0 L500.0 410.4" fill="none" class="nlf-s-muted" stroke-width="5" stroke-linecap="round"/><path d="M500.0 428.0 L487.9 406.0 L512.1 406.0 Z" class="nlf-f-muted"/><rect x="200" y="442" width="600" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="200" y="442" width="600" height="140" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="262" cy="512" r="34" class="nlf-f-blue"/><g transform="translate(243.3 493.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="316" y="506.0">Tests, linters, types</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="316" y="539.9">certain · seconds · cheap</tspan></text><circle cx="208" cy="450" r="22" class="nlf-f-blue"/><circle cx="208" cy="450" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="208" y="458.4">2</tspan></text><path d="M814.0 512.0 L929.7 512.0" fill="none" class="nlf-s-risk" stroke-width="4" stroke-linecap="round"/><path d="M946.0 512.0 L925.6 523.2 L925.6 500.8 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="800" text-anchor="end"><tspan x="905" y="492.4">fail</tspan></text></g><g data-step="3"><path d="M500.0 596.0 L500.0 602.4" fill="none" class="nlf-s-muted" stroke-width="5" stroke-linecap="round"/><path d="M500.0 620.0 L487.9 598.0 L512.1 598.0 Z" class="nlf-f-muted"/><rect x="200" y="634" width="600" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="200" y="634" width="600" height="140" rx="26" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="262" cy="704" r="34" class="nlf-f-accent"/><g transform="translate(243.3 685.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="316" y="698.0">A reviewer model</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="316" y="731.9">judgment · costs tokens</tspan></text><circle cx="208" cy="642" r="22" class="nlf-f-accent"/><circle cx="208" cy="642" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="208" y="650.4">3</tspan></text><path d="M814.0 704.0 L929.7 704.0" fill="none" class="nlf-s-risk" stroke-width="4" stroke-linecap="round"/><path d="M946.0 704.0 L925.6 715.2 L925.6 692.8 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="800" text-anchor="end"><tspan x="905" y="684.4">fail</tspan></text></g><g data-step="4"><path d="M500.0 788.0 L500.0 794.4" fill="none" class="nlf-s-muted" stroke-width="5" stroke-linecap="round"/><path d="M500.0 812.0 L487.9 790.0 L512.1 790.0 Z" class="nlf-f-muted"/><rect x="200" y="826" width="600" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="200" y="826" width="600" height="140" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="262" cy="896" r="34" class="nlf-f-amber"/><g transform="translate(243.3 877.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="316" y="890.0">A human approves</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="316" y="923.9">judgment · costs attention</tspan></text><circle cx="208" cy="834" r="22" class="nlf-f-amber"/><circle cx="208" cy="834" r="22" fill="none" class="nlf-s-surface" stroke-width="4"/><text class="nlf-t nlf-f-on" font-size="24" font-weight="800" text-anchor="middle"><tspan x="208" y="842.4">4</tspan></text><path d="M814.0 896.0 L929.7 896.0" fill="none" class="nlf-s-risk" stroke-width="4" stroke-linecap="round"/><path d="M946.0 896.0 L925.6 907.2 L925.6 884.8 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="800" text-anchor="end"><tspan x="905" y="876.4">fail</tspan></text></g><g data-step="4"><path d="M500.0 980.0 L500.0 1028.4" fill="none" class="nlf-s-ok" stroke-width="5" stroke-linecap="round"/><path d="M500.0 1046.0 L487.9 1024.0 L512.1 1024.0 Z" class="nlf-f-ok"/><rect x="408.0" y="1047.5" width="184.0" height="57.0" rx="28.5" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="30" font-weight="700" text-anchor="middle"><tspan x="500" y="1086.5">accepted</tspan></text></g><g data-step-only="1"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1398.6">Is the output even well formed? Valid JSON, the right</tspan><tspan x="540" y="1437.7">fields, a real file path. Free and instant.</tspan></text></g><g data-step-only="2"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1398.6">Does the change work? Run the tests and the type checker.</tspan><tspan x="540" y="1437.7">Still certain, still cheap.</tspan></text></g><g data-step-only="3"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1398.6">Is it what was asked? A second model checks intent and</tspan><tspan x="540" y="1437.7">quality that no test can see.</tspan></text></g><g data-step-only="4"><text class="nlf-t nlf-f-ink" font-size="29" font-weight="500" text-anchor="middle"><tspan x="540" y="1398.6">Risky or irreversible actions wait for a person. Their</tspan><tspan x="540" y="1437.7">time is the scarcest check, so it comes last.</tspan></text></g></svg>
