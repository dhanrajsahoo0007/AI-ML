<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1000" width="1080" height="1000" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1000" fill="url(#nlf-dots)"/><circle cx="470" cy="600" r="300" class="nlf-f-amber-soft" opacity="0.85"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">How much freedom?</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Give the agent the least access the task needs.</text><path d="M110.0 270.0 L110.0 880.4" fill="none" class="nlf-s-risk" stroke-width="5" stroke-linecap="round"/><path d="M110.0 898.0 L97.9 876.0 L122.1 876.0 Z" class="nlf-f-risk"/><text class="nlf-t nlf-f-risk" font-size="26" font-weight="800" text-anchor="middle" transform="rotate(90 76 584)"><tspan x="76" y="593.1">more risk</tspan></text><rect x="190" y="250" width="560" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="190" y="250" width="560" height="140" rx="26" fill="none" class="nlf-s-ok" stroke-width="2" stroke-opacity="0.35"/><circle cx="252" cy="320" r="34" class="nlf-f-ok"/><g transform="translate(233.3 301.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="306" y="314.0">Read files</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="306" y="347.9">nothing changes</tspan></text><rect x="759.2" y="297.2" width="241.6" height="45.6" rx="22.8" class="nlf-f-ok-soft"/><text class="nlf-t nlf-f-ok" font-size="24" font-weight="700" text-anchor="middle"><tspan x="880" y="328.4">always allowed</tspan></text><rect x="190" y="426" width="560" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="190" y="426" width="560" height="140" rx="26" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="252" cy="496" r="34" class="nlf-f-teal"/><g transform="translate(233.3 477.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="306" y="490.0">Write in the sandbox</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="306" y="523.9">can be thrown away</tspan></text><rect x="809.6" y="473.2" width="140.8" height="45.6" rx="22.8" class="nlf-f-teal-soft"/><text class="nlf-t nlf-f-teal" font-size="24" font-weight="700" text-anchor="middle"><tspan x="880" y="504.4">allowed</tspan></text><rect x="190" y="602" width="560" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="190" y="602" width="560" height="140" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="252" cy="672" r="34" class="nlf-f-amber"/><g transform="translate(233.3 653.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="306" y="666.0">Call networks and APIs</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="306" y="699.9">leaves the machine</tspan></text><rect x="752.0" y="649.2" width="256.0" height="45.6" rx="22.8" class="nlf-f-amber-soft"/><text class="nlf-t nlf-f-amber" font-size="24" font-weight="700" text-anchor="middle"><tspan x="880" y="680.4">allow-list only</tspan></text><rect x="190" y="778" width="560" height="140" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="190" y="778" width="560" height="140" rx="26" fill="none" class="nlf-s-risk" stroke-width="2" stroke-opacity="0.35"/><circle cx="252" cy="848" r="34" class="nlf-f-risk"/><g transform="translate(233.3 829.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="start"><tspan x="306" y="842.0">Deploy, pay, delete</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="start"><tspan x="306" y="875.9">can't be undone</tspan></text><rect x="744.8" y="825.2" width="270.4" height="45.6" rx="22.8" class="nlf-f-risk-soft"/><text class="nlf-t nlf-f-risk" font-size="24" font-weight="700" text-anchor="middle"><tspan x="880" y="856.4">a human approves</tspan></text></svg>
