<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1020" width="1080" height="1020" class="nlf-root nlf-harness"><style>.nlf-t{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}.nlf-f-ink{fill:var(--nlf-ink,#1d2026)}.nlf-f-muted{fill:var(--nlf-muted,#5f636b)}.nlf-f-surface{fill:var(--nlf-surface,#ffffff)}.nlf-f-on{fill:var(--nlf-on,#ffffff)}.nlf-f-dot{fill:var(--nlf-dot,#d9d3c7)}.nlf-f-accent{fill:var(--nlf-accent,#5b3fd1)}.nlf-f-accent-soft{fill:var(--nlf-accent-soft,#efebff)}.nlf-f-blue{fill:var(--nlf-blue,#2f6fe4)}.nlf-f-blue-soft{fill:var(--nlf-blue-soft,#e8efff)}.nlf-f-amber{fill:var(--nlf-amber,#c27500)}.nlf-f-amber-soft{fill:var(--nlf-amber-soft,#fff1d6)}.nlf-f-teal{fill:var(--nlf-teal,#0d8a7b)}.nlf-f-teal-soft{fill:var(--nlf-teal-soft,#dbf3ef)}.nlf-f-violet{fill:var(--nlf-violet,#6a4bd6)}.nlf-f-violet-soft{fill:var(--nlf-violet-soft,#eeeaff)}.nlf-f-pink{fill:var(--nlf-pink,#c03f8a)}.nlf-f-pink-soft{fill:var(--nlf-pink-soft,#fbe5f1)}.nlf-f-ok{fill:var(--nlf-ok,#2b8a4b)}.nlf-f-ok-soft{fill:var(--nlf-ok-soft,#e2f3e7)}.nlf-f-risk{fill:var(--nlf-risk,#d24b3e)}.nlf-f-risk-soft{fill:var(--nlf-risk-soft,#fde8e5)}.nlf-s-ink{stroke:var(--nlf-ink,#1d2026)}.nlf-s-muted{stroke:var(--nlf-muted,#5f636b)}.nlf-s-line{stroke:var(--nlf-line,#d6d0c4)}.nlf-s-surface{stroke:var(--nlf-surface,#ffffff)}.nlf-s-on{stroke:var(--nlf-on,#ffffff)}.nlf-s-accent{stroke:var(--nlf-accent,#5b3fd1)}.nlf-s-blue{stroke:var(--nlf-blue,#2f6fe4)}.nlf-s-amber{stroke:var(--nlf-amber,#c27500)}.nlf-s-teal{stroke:var(--nlf-teal,#0d8a7b)}.nlf-s-violet{stroke:var(--nlf-violet,#6a4bd6)}.nlf-s-pink{stroke:var(--nlf-pink,#c03f8a)}.nlf-s-ok{stroke:var(--nlf-ok,#2b8a4b)}.nlf-s-risk{stroke:var(--nlf-risk,#d24b3e)}.dark .nlf-harness{--nlf-ink:#ece9e2;--nlf-muted:#aaa59b;--nlf-line:#45423c;--nlf-surface:#23221f;--nlf-on:#141413;--nlf-dot:#34322d;--nlf-accent:#a896ff;--nlf-accent-soft:#2a2350;--nlf-blue:#7aa7ff;--nlf-blue-soft:#1b2740;--nlf-amber:#f5b84a;--nlf-amber-soft:#33270f;--nlf-teal:#4fd1c0;--nlf-teal-soft:#10302c;--nlf-violet:#a896ff;--nlf-violet-soft:#241d45;--nlf-pink:#f18cc4;--nlf-pink-soft:#36192a;--nlf-ok:#6fd394;--nlf-ok-soft:#15301f;--nlf-risk:#ff8a7a;--nlf-risk-soft:#3a1f1b}</style><defs><pattern id="nlf-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" class="nlf-f-dot"/></pattern><filter id="nlf-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1080" height="1020" fill="url(#nlf-dots)"/><rect x="64" y="62" width="12" height="60" rx="6" class="nlf-f-accent"/><text class="nlf-t nlf-f-ink" x="98" y="108" font-size="52" font-weight="800" letter-spacing="-1">Long tasks, short memories</text><text class="nlf-t nlf-f-muted" x="98" y="160" font-size="28" font-weight="500">Files on disk carry the work from one session to the next.</text><rect x="55" y="300" width="290" height="200" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="55" y="300" width="290" height="200" rx="26" fill="none" class="nlf-s-accent" stroke-width="2" stroke-opacity="0.35"/><circle cx="200" cy="350" r="30" class="nlf-f-accent"/><g transform="translate(183.5 333.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="middle"><tspan x="200" y="444.5">Session 1</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="200" y="478.4">sets up the project</tspan></text><rect x="395" y="300" width="290" height="200" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="395" y="300" width="290" height="200" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="540" cy="350" r="30" class="nlf-f-blue"/><g transform="translate(523.5 333.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="middle"><tspan x="540" y="444.5">Session 2</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="540" y="478.4">builds one feature</tspan></text><path d="M359.0 400.0 L364.7 400.0" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M381.0 400.0 L360.6 411.2 L360.6 388.8 Z" class="nlf-f-muted"/><rect x="735" y="300" width="290" height="200" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="735" y="300" width="290" height="200" rx="26" fill="none" class="nlf-s-blue" stroke-width="2" stroke-opacity="0.35"/><circle cx="880" cy="350" r="30" class="nlf-f-blue"/><g transform="translate(863.5 333.5) scale(1.375)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></g><text class="nlf-t nlf-f-ink" font-size="30" font-weight="700" text-anchor="middle"><tspan x="880" y="444.5">Session 3</tspan></text><text class="nlf-t nlf-f-muted" font-size="24" font-weight="500" text-anchor="middle"><tspan x="880" y="478.4">builds the next one</tspan></text><path d="M699.0 400.0 L704.7 400.0" fill="none" class="nlf-s-muted" stroke-width="4" stroke-linecap="round"/><path d="M721.0 400.0 L700.6 411.2 L700.6 388.8 Z" class="nlf-f-muted"/><rect x="174.4" y="223.2" width="731.2" height="45.6" rx="22.8" class="nlf-f-accent-soft"/><text class="nlf-t nlf-f-accent" font-size="24" font-weight="700" text-anchor="middle"><tspan x="540" y="254.4">each session starts with an empty context window</tspan></text><rect x="64" y="640" width="952" height="300" rx="34" class="nlf-f-violet-soft"/><rect x="64" y="640" width="952" height="300" rx="34" fill="none" class="nlf-s-violet" stroke-width="2.5" stroke-opacity="0.45"/><text class="nlf-t nlf-f-violet" font-size="32" font-weight="800" text-anchor="middle"><tspan x="540" y="703.2">Memory on disk</tspan></text><text class="nlf-t nlf-f-muted" font-size="25" font-weight="500" text-anchor="middle"><tspan x="540" y="740.8">read at the start of every session, updated at the end</tspan></text><rect x="83" y="800" width="286" height="100" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="83" y="800" width="286" height="100" rx="26" fill="none" class="nlf-s-violet" stroke-width="2" stroke-opacity="0.35"/><circle cx="145" cy="850" r="34" class="nlf-f-violet"/><g transform="translate(126.3 831.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></g><text class="nlf-t nlf-f-ink" font-size="25" font-weight="700" text-anchor="start"><tspan x="199" y="858.8">Feature list</tspan></text><rect x="397" y="800" width="286" height="100" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="397" y="800" width="286" height="100" rx="26" fill="none" class="nlf-s-amber" stroke-width="2" stroke-opacity="0.35"/><circle cx="459" cy="850" r="34" class="nlf-f-amber"/><g transform="translate(440.3 831.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></g><text class="nlf-t nlf-f-ink" font-size="25" font-weight="700" text-anchor="start"><tspan x="513" y="858.8">Progress log</tspan></text><rect x="711" y="800" width="286" height="100" rx="26" class="nlf-f-surface" filter="url(#nlf-shadow)"/><rect x="711" y="800" width="286" height="100" rx="26" fill="none" class="nlf-s-teal" stroke-width="2" stroke-opacity="0.35"/><circle cx="773" cy="850" r="34" class="nlf-f-teal"/><g transform="translate(754.3 831.3) scale(1.558)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nlf-s-on"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5c0 3-4 3-9.5 5"/></g><text class="nlf-t nlf-f-ink" font-size="25" font-weight="700" text-anchor="start"><tspan x="827" y="858.8">Git history</tspan></text><path d="M160.0 520.0 L160.0 615.7" fill="none" class="nlf-s-violet" stroke-width="4" stroke-linecap="round"/><path d="M160.0 632.0 L148.8 611.6 L171.2 611.6 Z" class="nlf-f-violet"/><path d="M240.0 632.0 L240.0 536.3" fill="none" class="nlf-s-violet" stroke-width="4" stroke-linecap="round"/><path d="M240.0 520.0 L251.2 540.4 L228.8 540.4 Z" class="nlf-f-violet"/><path d="M500.0 520.0 L500.0 615.7" fill="none" class="nlf-s-violet" stroke-width="4" stroke-linecap="round"/><path d="M500.0 632.0 L488.8 611.6 L511.2 611.6 Z" class="nlf-f-violet"/><path d="M580.0 632.0 L580.0 536.3" fill="none" class="nlf-s-violet" stroke-width="4" stroke-linecap="round"/><path d="M580.0 520.0 L591.2 540.4 L568.8 540.4 Z" class="nlf-f-violet"/><path d="M840.0 520.0 L840.0 615.7" fill="none" class="nlf-s-violet" stroke-width="4" stroke-linecap="round"/><path d="M840.0 632.0 L828.8 611.6 L851.2 611.6 Z" class="nlf-f-violet"/><path d="M920.0 632.0 L920.0 536.3" fill="none" class="nlf-s-violet" stroke-width="4" stroke-linecap="round"/><path d="M920.0 520.0 L931.2 540.4 L908.8 540.4 Z" class="nlf-f-violet"/></svg>
