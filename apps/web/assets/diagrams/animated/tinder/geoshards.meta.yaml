title: Cells grouped into shards by load
alt: >-
  A grid of 40 map cells, 8 across and 5 down, each labelled with its active profiles in thousands, shown in three
  steps. Step 1: the cells are walked in snake order and cut into four shards of about equal load; the blue shard 1
  holds 17 country cells and 380 thousand profiles, the teal shard 2 holds the 2 densest downtown cells and 420
  thousand, the green shard 3 holds 4 cells and 390 thousand, and the violet shard 4 holds 17 cells and 320 thousand.
  Step 2: a dashed 40 km circle around a user near the west edge of shard 3 covers 6 cells, 2 in shard 2 and 4 in
  shard 3, so the search queries both shards and merges the top 1,000. Step 3: the user moves one cell west into
  shard 2, so the profile is deleted from shard 3 and inserted in shard 2.
caption: >-
  Shards hold equal load, not equal area: 2 cells downtown, 17 in the country. A search near an edge asks both shards.
tags: [case-studies, tinder, geospatial, sharding]
