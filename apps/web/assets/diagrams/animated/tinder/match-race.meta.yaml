title: "Two likes at once: the lost match and the pair row"
alt: >-
  A sequence diagram in two steps with four lanes: orange users Ana and Ben, a teal swipe service and a violet likes
  store. Step 1: Ana likes Ben and Ben likes Ana at the same moment; the service asks the store whether Ben liked Ana
  and whether Ana liked Ben before either like is saved, both answers are no, both likes are then saved, a note says
  the match is lost, and both users are told there is no match. Step 2: both requests update the same row for the pair
  with one atomic step that sets the caller's flag and returns the row; Ana's sees Ben's flag unset, Ben's sees both
  flags set, so only Ben's request inserts the match, if it is absent, and Ben is told it's a match.
caption: >-
  Check, then write loses the match when both like at once; one atomic row per pair lets exactly one request see both
  likes.
tags: [case-studies, tinder, concurrency, sequence]
