title: "A match reaches Ben: nudge, then fetch"
alt: >-
  A sequence diagram in two steps with six lanes: a teal match notifier, a violet session store, a teal socket gateway
  (gateway 7), a grey mobile push service, Ben's orange app and a teal match API. Step 1: Ben is online; the notifier
  asks the session store where Ben is and hears gateway 7, sends the gateway a nudge, the gateway passes a nudge with
  no data to Ben's app, and the app asks the match API for updates since cursor c41 and receives the match with Ana
  and cursor c42. Step 2: Ben is offline; the session store has no socket, so the notifier sends a mobile push, and
  when Ben opens the app it fetches the same updates since c41.
caption: >-
  The socket only says “something changed”; the app fetches from a cursor, so a lost nudge delays a match but never
  loses it.
tags: [case-studies, tinder, realtime, sequence]
