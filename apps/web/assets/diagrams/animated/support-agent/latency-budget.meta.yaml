title: The support agent's latency budget
alt: >-
  Two request waterfalls on one millisecond scale, built in two steps. Step 1, a question: gateway and case load 30
  milliseconds, a lime intent router of 250 with lime search and rerank of 210 in parallel, 20 to assemble the
  context, a green first token at 400, a green 120-token reply of 1,500 and a lime supervisor check of 300; a dashed
  line marks the reply sent at 2,500 milliseconds, the target. Step 2, the kettle refund with two tools: the same 300
  milliseconds before the model, a green tool call of 775, a teal get_order of 200, a second green tool call of 775
  for request_refund, a lime gate and policy service of 200, a first token of 400, the 1,500 reply and the 300 check;
  a dashed line at 1,075 milliseconds marks the "Checking your order" status, and the reply is sent at 4,450
  milliseconds against a 4,500 target. The working is written underneath.
caption: A question spends most of its 2,500 ms writing the reply; a refund adds two model round trips and two services, and still lands just under 4,500 ms.
