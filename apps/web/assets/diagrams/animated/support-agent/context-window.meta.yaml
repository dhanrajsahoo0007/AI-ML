title: The support agent's context window
alt: >-
  One stacked bar of 6,000 tokens, built in two steps. Step 1: the stable prefix under a bracket marked cached,
  2,700 tokens: grey instructions of 1,200 tokens, teal tool definitions of 1,000 and the grey procedure of 500.
  Step 2: the blocks that change every turn under a second bracket, 3,300 tokens: violet case state of 400, blue
  evidence of 2,000, orange recent turns of 600, blue tool results of 250 and an orange new message of 50. Footer
  lines say the call holds 6,000 tokens, 5,000 on average because evidence comes on half of calls, and that cached
  tokens cost 0.10 instead of 2.00 US dollars per million, 46 percent off a message with no tool call.
caption: Instructions, tools and the procedure come first and never change within a procedure, so 2,700 tokens are read from the cache; the case state, evidence and turns change every call.
