title: "The cracked kettle's turn, call by call"
alt: >-
  A sequence diagram with seven lanes: an orange customer, a neutral orchestrator, a green intent router, a green
  agent model, a teal order API, a teal policy service and a teal supervisor, built in three steps. Step 1: the
  customer sends "Kettle cracked, order 4471" with a photo; the orchestrator loads the case by 30 milliseconds and asks
  the router, which returns damaged_item at 280 milliseconds while retrieval runs beside it; the orchestrator sends the
  agent model a 6,000-token context with the article at 300 milliseconds. Step 2: the model asks for get_order at
  1,075 milliseconds, each tool call taking a 400 millisecond first token plus 30 tokens at 12.5 milliseconds; the
  customer sees "Checking your order"; the orchestrator calls the order API as customer 1847 and gets the delivered
  42 pound kettle back at 1,275 milliseconds; the model asks for request_refund at 2,050 milliseconds; the policy
  service answers at 2,250 milliseconds that 42 pounds is above the 30 pound limit, so the refund is pending approval.
  Step 3: the model writes a 120-token reply by 4,150 milliseconds; the supervisor finds that it cites the article at
  4,450 milliseconds, and the reply is sent.
caption: >-
  The model makes three calls and asks for each tool, but the orchestrator runs every tool as the verified customer:
  the customer sees progress at 1,075 ms and the checked reply at 4,450 ms.
