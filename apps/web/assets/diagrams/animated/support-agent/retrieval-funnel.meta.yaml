title: "Retrieval funnel: 3,600 chunks to 5 passages"
alt: >-
  A funnel of four boxes, revealed one step at a time, with a note beside each. Step 1: a wide blue box, the help
  index of 3,600 chunks, 22 megabytes of vectors plus keyword fields. Step 2: a narrower violet box, hybrid search
  with keyword and vector fields, keeps the top 40 in about 60 milliseconds. Step 3: a lime box, a cross-encoder
  reranker, scores the 40 question-passage pairs in about 150 milliseconds for 0.0005 US dollars a query
  (illustrative). Step 4: a blue box keeps the 5 passages of 400 tokens that fit the 2,000-token evidence budget,
  cited by article. Underneath, a lime gate box reads recall at 5 of at least 90 percent on 300 labelled queries,
  measured with and without the reranker, and a note says search plus rerank, 210 milliseconds, runs in parallel
  with the 250-millisecond router, so it adds no wait.
caption: Hybrid search finds 40 candidates cheaply; the reranker decides which 5 earn a place in the 2,000-token budget, and recall@5 decides whether it stays.
tags: [genai, rag, reranking, case-study]
