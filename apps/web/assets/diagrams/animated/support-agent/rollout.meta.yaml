title: Rollout in three stages
alt: >-
  Three columns, one per rollout stage, filled in one step at a time. Shadow: the agent drafts a reply that is never
  sent, a dashed arrow compares it with the person's reply, and the person replies to the customer as today; the
  lime gate below asks for drafts rated as good or better on 85 percent of 500 graded tickets. Assist: the agent
  drafts every reply, a person approves or edits it and sends it to the customer; the gate asks for 90 percent sent
  without edits for two weeks and no wrong refunds. Autonomous: the agent replies directly to the customer for two
  intents that make up 65 percent of tickets, and hands every other intent to a person, shown by a dashed arrow;
  below, reopen rate and customer satisfaction are watched against people's tickets.
caption: Each stage gives the agent more say only after the stage before it has proved, on real tickets, that it would have been right.
