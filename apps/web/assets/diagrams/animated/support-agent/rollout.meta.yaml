title: "Rollout per intent: shadow, assist, autonomous"
alt: >-
  Three columns, one per rollout stage, filled in one step at a time. Shadow, two weeks: the green agent drafts a
  reply that is never sent, a dashed arrow compares it with the staff reply, and staff reply to the customer as
  today; the lime gate below asks for pass to the power 4 of at least 90 percent on 150 refund scenarios, each run
  four times. Assist: the agent drafts every reply, staff approve or edit it and send it to the customer; the gate
  asks for 90 percent of drafts sent unedited. Autonomous: the agent replies to the customer directly, with refunds
  up to 30 pounds, and staff take hand-offs and refunds over 30 pounds, shown by a dashed arrow; the lime box below
  is a 5 percent canary, 2,500 conversations a day, watching hand-offs, judge scores and refunds. A note says each
  intent climbs on its own.
caption: "An intent earns autonomy on evidence: a simulator gate to leave shadow, unedited drafts to leave assist, and a canary on every release after that."
tags: [genai, agents, evaluation, rollout, case-study]
