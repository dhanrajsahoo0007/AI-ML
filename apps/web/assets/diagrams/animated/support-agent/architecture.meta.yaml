title: Customer support agent architecture
alt: >-
  An architecture diagram in six zones, built up in eight steps. Step 1: the customer, in orange, sends a message
  through the chat gateway to the orchestrator, the dark accented node, which sends a prompt through the LLM gateway to
  the green agent model. Step 2: the orchestrator fetches evidence from a lime retriever that takes the top 40 of 3,600
  chunks from the violet help index, and a blue help-centre sync re-indexes edited articles. Step 3: a lime intent
  router above the orchestrator picks the procedure. Step 4: the agent model asks the teal order tools for get_order,
  and the order tools read the shop's orders and payments APIs as the verified customer. Step 5: the model asks a lime
  policy service for a refund by items and reason; risk signals feed the policy, which locks, sums and records in the
  refund ledger, sends refunds over 30 pounds to a refund workflow for approval, and pays once along the bottom of
  the diagram. Step 6: a lime checks node gates writes and checks every reply. Step 7: the model hands off to the
  helpdesk, where support staff approve and take over, and the orchestrator keeps case state in a case store. Step 8:
  the orchestrator traces every turn into a trace store, which feeds the simulator and evals and the outcomes and
  content-gaps pipeline.
caption: The model decides what to ask for; the orchestrator, the policy service and the ledger decide what happens, and every case can reach a person.
