title: Customer support agent architecture
alt: >-
  An architecture built up in seven steps, in case-study zones. Step 1: the customer, on web chat or email, reaches a
  chat gateway that handles sign-in and limits, then the support agent, the accented core service, which retrieves
  the top 5 chunks from a help index of 3,600 chunks and sends a prompt to the LLM, which writes and cites. Step 2:
  ingestion chunks and embeds edited articles from the help centre of 1,200 articles into the index. Step 3: the
  agent calls account tools, limited to the customer's own orders, which read the order API for status and
  tracking. Step 4: refund calls go through a refund policy service that approves up to 50 pounds automatically and
  then calls the payments API. Step 5: a dashed line lets the agent escalate to a helpdesk of human agents with a
  summary. Step 6: a ticket store keeps every turn and action for the agent. Step 7: an evaluation and
  quality-review service samples tickets for grading.
caption: The model plans and writes, but money moves only through a policy service written in code, and every ticket can reach a person.
