title: "What counts as resolved: the resolution funnel"
alt: >-
  A funnel of four boxes for one day, built in four steps. Step 1: a wide blue box of 50,000 conversations, with a
  dashed arrow to an orange box on the right: 16,000 handed off to a person, 32 percent. Step 2: a blue box of 34,000
  conversations with no hand-off, 68 percent; a note says a "closed" metric would stop here and report 68 percent.
  Step 3: a blue box of 31,500 with no repeat contact about the same order or issue on any channel within 7 days, 63
  percent; 2,500 came back. Step 4: a lime box of 30,000 with the end state confirmed, a settled refund or a found
  order: 60 percent resolved. Under it, two buckets: a green box of 29,300 resolved by the agent alone and an orange
  box of 700 resolved with an approval; a note says 30,000 minus 700 is 29,300 and that resolution is reported in
  three buckets: alone, with an approval, handed off.
caption: The same day reads as 68% "closed" or 60% resolved; only the 7-day, any-channel rule with a confirmed end state measures what customers feel.
tags: [genai, agents, evaluation, metrics, case-study]
