title: The clinician panel, element by element
alt: >-
  A wireframe of the side panel with a note on the right explaining each element, built in four steps. Step 1: an
  orange banner with two placeholder identifiers, a name and a date of birth, female, 82, taken from the EHR context
  and never sent to the model, because the wrong patient is the worst error; then a lime drug chip, apixaban, oral, 5
  mg twice daily, nonvalvular AF, where the dose came from the question text and was confirmed with a tap and the
  indication from the problem list. Step 2: two red alerts rendered by code before any model text, in the EHR's tier:
  first, highlighted, a major interaction with itraconazole, avoid coadministration, evaluated at the label's dose of
  2.5 mg and also shown by the EHR; then a dosing warning, 3 of 3 criteria for age, weight and creatinine, the label's
  dose for patients meeting at least 2 criteria being 2.5 mg twice daily against the intended 5 mg. Step 3: a grey gaps
  line, none for this question, with the note that gaps appear only where a rule could apply, such as no pregnancy gap
  for an 82-year-old; then a green explanation whose first sentence says she meets all three of the label's
  dose-reduction criteria and the label's dose for patients meeting at least two is 2.5 mg twice daily, citing source
  1, and that at that dose the label says to avoid itraconazole, with options only in the label's words and never
  "safe", "start" or "do not start". Step 4: a grey line with data as of 10:41, notes read to 10:30 and unsigned notes
  not read, and what was checked; a violet source line for the Eliquis label section 2, revised 8/2026, with a
  DailyMed link and a collapsed provenance section; and an orange row of actions: flag a sentence, override with a
  reason, and code this fact on note-derived alerts, applied by the EHR only on acceptance.
caption: >-
  The panel shows who and what first, then the alerts from the rules, then the explanation; what was read and when is
  on every answer, and provenance is one click away.
