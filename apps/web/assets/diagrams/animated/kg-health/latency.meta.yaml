title: Latency budget per request type
alt: >-
  Three latency waterfalls, p50, built in four steps. Step 1, the order hook card on its own millisecond scale: TLS and
  JWT 15, entitlements 5, prefetch parse and unit normalisation 5, the slowest of 7 expansions in parallel with
  label-filtered note facts 31, join and phase 2 3, delta cards 5: the card is ready at 64 milliseconds, 87 at p95,
  against targets of 200 and 500. Step 2, the safety question on the encoder route: token, care team and audit 40; the
  classifier alongside the slowest of 6 FHIR reads, 374, in teal; resolving the drug and the slowest of 7 expansions
  93, ending at a dashed alerts marker at 507 milliseconds; passages, rerank and context 150; the green model's first
  token 500 and first sentence of 25 tokens 313; sentence checks 60: the first verified sentence at 1,530
  milliseconds, about 1,562 mixed over both routes with drops, against a target of 2,000. Step 3, the record question
  on the same scale: 40, 374, embedding and chunk search in parallel with the fact query 30, rerank and context 90,
  first token 500, sentence 313 and checks 60: 1,407 milliseconds. Step 4, footer lines: p95 is 87 for the card, 762
  for alerts and 2,247 for the first sentence, all inside their targets, and 677 for the card without prefetch; the
  first-sentence target holds while the vendor's first-token p95 stays under about 1,735 milliseconds, and the
  complete answer's target holds while decode stays above about 70 tokens a second. All stage times are estimates.
caption: >-
  The order card never waits for a model, and alerts are on screen at 507 ms; the model's first token is a third of
  the first-sentence budget, so the vendor's tail is what the release gate watches.
