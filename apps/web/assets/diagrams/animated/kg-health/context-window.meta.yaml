title: One safety answer's context window
alt: >-
  A horizontal context bar of 4,470 tokens, built in three steps. Step 1: the stable prefix of 1,300 tokens, bracketed
  as cached: grey instructions and rules, 900, and the grey output format, 400. Step 2: the changing blocks, 3,170
  tokens, bracketed as changing every question: an orange question, 100; violet patient facts, 590; blue rule results
  and coverage, 340; blue graph paths and rule criteria, 300; blue passage headers, 240; and 8 blue label passages,
  1,600. Footer lines say 250 tokens come out, structured facts are pseudonymised with no name or record number, and
  the call costs 1,300 times 0.10 plus 3,170 times 2.50 plus 250 times 10.00 US dollars per million tokens, about
  0.0106 dollars, or 0.0110 with the planner and restarts. Step 3: a second bar on its own scale shows the whole chart,
  850 coded facts times 25 tokens plus 20 notes times 700, 35,250 tokens, with this call's 4,470 at its start in blue
  and 30,780 grey tokens the rules leave out; the footer says that is 7.9 times the tokens, about 0.062 dollars more a
  call, more PHI sent and the alerts diluted.
caption: >-
  The rules choose what the model sees: 4,470 tokens of facts, rule results and label passages, not a 35,250-token
  chart; the first 1,300 are stable and cached.
