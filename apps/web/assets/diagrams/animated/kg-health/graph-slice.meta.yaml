title: "The apixaban graph slice: two layers, provenance on every edge"
alt: >-
  A layout in two dotted bands, built in four steps. Step 1, the violet knowledge layer, snapshot kg-2026-11-14 with no
  PHI: the highlighted apixaban concept is DESCRIBED_IN the blue Eliquis label section 2, revised 8/2026, and HAS_RULE,
  sourced from section 2, a lime DOSING_RULE for atrial fibrillation: at least 2 of age 80 or over, weight 60 kg or
  less and serum creatinine 1.5 mg/dL or more give the label's dose of 2.5 mg twice daily; the rule's indication edge
  points to the nonvalvular atrial fibrillation concept in SNOMED CT. Itraconazole is IN_CLASS, from the drug-knowledge
  release, of combined P-gp and strong CYP3A4 inhibitors, which INTERACTS_WITH apixaban, sourced from the release and
  label section 2. Step 2, the blue patient layer: itraconazole, active, joins its concept by RxNorm code; a penicillin
  allergy with rash and a negated GI bleed come from a note; atrial fibrillation, active, joins its concept by SNOMED CT
  code; she is 82 and female, weighs 58 kg measured today, has a creatinine of 1.595 mg/dL from 141 micromoles per
  litre at an outside lab on 15 November, and the intended dose is 5 mg twice daily from the question text, confirmed
  by a tap. Step 3: a bracket over the five dosing facts feeds a red Alert 1, dosing warning: 3 of 3 criteria met, the
  label's dose is 2.5 mg twice daily, against the intended 5 mg twice daily. Step 4: Alert 1's criteria dose feeds a
  red Alert 2 from the inhibitor class, evaluated in phase 2: itraconazole with apixaban at 2.5 mg, avoid
  coadministration; on 5 mg it would say reduce by 50 percent. Footer lines name the edge sources and say every edge
  also stores valid_from, valid_to, curated_by and status.
caption: >-
  Each edge names its source, and the dosing rule reads several facts at once; the interaction rule runs on the
  criteria dose 2.5 mg, so it says "avoid", not "reduce by 50%".
