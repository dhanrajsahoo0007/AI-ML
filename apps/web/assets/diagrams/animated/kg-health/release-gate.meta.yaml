title: "The release gate: nine checks, one failing"
alt: >-
  A gate diagram. On the left, a grey knowledge release candidate, vendor-2026.12.1 with its mapping, fans out to nine
  checks in a column, each joined to a result on the right. Eight checks pass, in lime: high-priority interactions, 150
  of 150; every interaction pair entered as orderable products, 3 million cases at 100 percent; patient contexts, 2,000
  of 2,000; the dosing grid, 32 of 32 combinations; assertion F1 0.96, at least 0.95; the clinician-graded set, 96.2
  percent acceptable with 0 major hallucinations; abstention 96 percent and 20 of 20 right-patient cases; and peak-hour
  latency and alert burden. One check fails, in red: the outside-lab units slice, 2 errors in 200. The result is a red
  Block that keeps snapshot kg-2026-11-14. Notes say the units slice allows 0 errors in 200, which bounds the rate
  below 1.9 percent, that one failing check blocks the swap, and that the latency gate needs the vendor's first-token
  p95 under about 1.74 seconds and decode above about 70 tokens a second; measured values are illustrative.
caption: >-
  Every release is run against all nine checks inside the PHI zone; two unit errors in 200 outside-lab results are
  enough to keep the old snapshot live.
