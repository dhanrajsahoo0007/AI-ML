title: "Where PHI may flow, and which model runs where"
alt: >-
  A layout of four dotted regions, built in four steps. Step 1: the teal EHR sends FHIR reads and HL7 v2 feeds into a
  violet region, the PHI zone in the network's own account, which holds the grey gateway that checks the token and care
  team and writes the audit, the grey orchestrator that builds the prompt, green encoders on GPUs for NER, linking,
  reranking and the checker, a violet answers, provenance and audit store, a violet fact store with note chunks whose
  embeddings are PHI too, a lime rules engine with the snapshot in memory, and lime annotation and evaluation sets
  labelled by workforce annotators. Step 2: a green region on the right, the vendor model under a BAA: the orchestrator
  sends a 4,470-token prompt to the answer and planner models, which use covered features only, and a prompt cache
  holds PHI in memory for its time to live. Step 3: a blue region with no PHI, the knowledge build of vocabularies, the
  drug knowledge base, labels, guidelines and crosswalks, ships a versioned snapshot into the rules engine and nothing
  flows back out; along the bottom, a region labelled de-identified only receives copies from annotation through
  Expert Determination with surrogates and date shifts and a residual of about 4 percent, and only then do copies go to
  outside annotators and research. Step 4: an orange, highlighted restricted-notes box inside the PHI zone, carrying
  security labels, with Part 2 records needing consent, and a grey logs and traces box holding ids only, with a
  scanner for names. Footer lines say structured facts are pseudonymised while note text in record prompts goes as is,
  both PHI under the BAA, and self-hosting the answer model would cost about 480 US dollars a day against about 74
  hosted, 6.5 times, for a lower quality tier.
caption: >-
  Patient data stays in the network's account except the prompt, which goes to a vendor model under a BAA with
  covered features only; the knowledge build holds no PHI, and only de-identified copies ever leave.
