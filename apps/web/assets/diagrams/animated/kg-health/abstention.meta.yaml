title: "Abstention and provenance: no alert is not safe"
alt: >-
  A layout in four steps. Step 1: a table of the seven lime templates and the inputs each needs: interaction needs the
  active medications from requests, statements and administrations in the last 72 hours; allergy needs a reviewed
  allergy list or NKDA recorded; drug–disease needs a mapped problem list from ICD-10-CM to SNOMED CT; the AF dosing
  rule needs the indication, a confirmed dose, age, weight and creatinine; duplicate therapy needs active medications
  with ingredient and class expansion; cumulative risk needs the latest QTc and potassium and risk counts; coverage
  needs a template that covers the question type. Step 2: seven input states with what the answer says: present in
  green, the rule runs; stale, "renal input not current"; missing, highlighted, "dose check needs the indication";
  unmapped, a gap, never silence; restricted, "some notes are restricted"; conflicting, both shown with "sources
  disagree"; all in orange; and not covered in red, "no rule covers this question". A line gives the recency windows:
  creatinine within 48 hours for an inpatient or 90 days for an outpatient, weight this admission or within 30 days,
  and an unknown unit is a gap, never a number. Step 3: a grey coverage line lists what was checked, 8 active
  medications, 2 confirmed allergies, 10 conditions and outside medication history read at 10:41, with the data and
  notes times and the snapshot and knowledge-base versions; an orange gap event says the dose check needs the
  indication because AF and VTE treatment have different rules, while the interaction alert still shows for both
  doses; text says 8 percent of safety questions name a gap, 2 percent cannot run the rules, and 1.7 percent of
  explanations are replaced by the rules card. Step 4: two provenance chains: sentence 1 links to the rule
  rule_dose_apx_af in snapshot kg-2026-11-14, then to Eliquis label section 2 revised 8/2026, then to a PROV record;
  the creatinine fact of 1.595 mg/dL links to the stored input content from the outside lab, the AuditEvent and the
  stored answer ans_4f2. A footer says the same facts and snapshot give the same alerts, a claim made for the alerts,
  not for the model's text.
caption: >-
  Each template names the inputs it needs; a stale, missing, unmapped, restricted or conflicting input becomes a named
  gap on the answer, so "no alert found" never reads as "safe".
