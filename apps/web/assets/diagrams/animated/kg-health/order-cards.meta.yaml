title: "Order cards: delta only, within the user's entitlements"
alt: >-
  A layout in four steps. Step 1: a grey order-sign hook call for the draft order set, with the required prefetch of
  medications, allergies and labs, leads to a lime box where context.userId is looked up in the cached entitlements
  table in 5 milliseconds, then to a lime box where note-derived facts are filtered by security label before the join,
  with Part 2 records needing consent. Step 2: two lime runs of the same templates: Run A on coded facts with the EHR's
  local configuration, which is what the EHR already shows, and Run B with the permitted note facts added, so an
  allergy written only in a note joins the facts. Step 3: a lime box says a card is made only for B minus A, never a
  second copy of an EHR alert; it leads to two cards: an orange, highlighted card for an amoxicillin order saying a
  penicillin allergy with rash in 2019 was found only in notes, with a suggestion to add it to the coded allergy list
  if the clinician accepts; and a grey card saying a restricted record may be relevant to this order and to ask
  pharmacy or open the chart with break-the-glass, with no drug, diagnosis, note or quote. Step 4: a lime box limits
  interruptive warning-tier cards to 3 a shift, with critical allergies and contraindicated pairs exempt and the limit
  flagging a type for review rather than demoting a card; an orange feedback box records accepted or overridden with a
  reason, ignored cards from display logs, and reviews a type under 30 percent acceptance. Footer lines: 768 cards a
  day of 51,200 orders, 1.5 per 100, 77 interruptive, 0.15 per 100, 154 Explain clicks and 122,880 hook calls; the
  card is ready in about 64 milliseconds and order-select only warms the cache and shows critical cards.
caption: >-
  The rules run twice, on coded facts with the EHR's own configuration and then with the note facts this user may see;
  only the difference interrupts the prescriber, about 1.5 cards per 100 orders.
