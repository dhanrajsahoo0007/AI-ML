title: Clinical knowledge-graph assistant architecture, built step by step
alt: >-
  An architecture diagram in six zones, built up in eight steps. Step 1: the clinician, in orange, asks from a side
  panel through a grey gateway that checks the token, the patient context and the care team; the gateway passes the
  question to the orchestrator, the dark accented node, which reads the chart from the teal EHR over FHIR and sends a
  prompt to the green answer model down the left gutter. Step 2: in the offline zone, a blue knowledge build writes a
  versioned knowledge snapshot, a violet store, which is loaded in memory by the lime rules engine above the
  orchestrator; the orchestrator hands the rules engine the patient's facts and gets the alerts back. Step 3: signed
  notes, 80,400 a day, run from the EHR down the far left into green note NLP, which writes coded facts with provenance
  to the violet patient fact store. Step 4: a lime drug resolver and planner sits beside the rules engine, the
  orchestrator fetches passages by concept id from the violet passage index, and a lime cross-encoder reranks about 40
  passages. Step 5: lime abstention and checks under the orchestrator apply coverage rules and check every sentence,
  and the orchestrator stores the answer with its 4,470-token context and inputs in the violet answers and audit store.
  Step 6: the EHR's hook calls reach a grey CDS Hooks service on the top line, which runs the same templates on the
  rules engine. Step 7: a lime release gate is placed between the knowledge build and the snapshot, replacing the
  direct line, so every release passes regression before the swap. Step 8: a lime evaluation and review node reads
  answers, flags and overrides from the answers store and feeds the release gate.
caption: >-
  Rules over a versioned snapshot decide every alert on both paths, the question panel and the order hook; the model
  only explains what the rules, facts and passages say. Every zone except the knowledge build and the vendor model
  runs in the network's own account.
