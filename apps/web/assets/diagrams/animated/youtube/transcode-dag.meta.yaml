title: Transcoding as a graph of small tasks
alt: >-
  A layout diagram in four steps. Step 1: a blue 10-minute, 600 MB original is split at keyframes into ten blue
  1-minute chunks. Step 2: a teal grid of 50 encode tasks appears, one per chunk for each of five renditions from 240p
  to 1080p; the notes say each task takes about 60 seconds, so the work takes 50 minutes one after another but about
  60 seconds in parallel. Step 3: the 720p task for chunk 6 gets a red dot: its worker died, the lease ran out and the task
  runs again, writing the same output key. Step 4: its dot turns green, and green package and publish boxes cut
  each rendition into 4-second segments, write the manifests and publish the video at 360p first.
caption: >-
  Fifty small tasks instead of one long job: each chunk and rendition encodes on its own, a lost task runs again into
  the same key, and the video publishes at 360p first.
tags: [case-studies, youtube, transcoding, workflows]
