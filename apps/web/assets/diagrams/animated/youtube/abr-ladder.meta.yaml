title: The bitrate ladder and one switch
alt: >-
  A layout diagram in three steps: a grid of blue cells with five renditions as rows, 1080p at 5.0 Mb/s on top down
  to 240p at 0.4 Mb/s, and twelve 4-second segments as columns from 0 to 48 seconds. Step 1: the note says every
  rendition is cut at the same boundaries. Step 2: green dots joined by a line show the player fetching the first two segments at
  360p, reaching the first frame in 0.8 seconds on a 4 Mb/s link, then six segments at 720p. Step 3: at 32 seconds the
  link falls to 1.2 Mb/s; the next 720p segment gets a red dot because fetching it would take 8.3 seconds, longer than the 4 seconds it plays, so the green path switches down to 360p, which takes 2.7 seconds per segment, for the last four segments.
caption: >-
  Every rung is cut at the same 4 s boundaries, so the player can change rung between any two segments: start low,
  climb, and step down before the buffer runs dry.
