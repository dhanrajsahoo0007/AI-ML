title: Video platform high-level architecture
alt: >-
  An architecture diagram in eight steps across six zones: clients, edge, transcoding core, application services,
  async pipeline and storage. Step 1: a creator uploads a whole file through the API gateway and the upload service
  into the blob store, and a viewer plays that one file back; video rows go to the metadata database. Step 2: the
  creator sends resumable chunks straight to the blob store, with a session from the upload service. Step 3: the
  upload service starts the transcode workflow, drawn solid green, which puts encode tasks on a queue; encode workers
  write renditions back to the blob store. Step 4: the viewer fetches 4-second segments instead of one file. Step 5: a
  CDN serves the segments and reads the blob store only on a miss. Step 6: the watch service reads metadata and
  counts from a cache, and a channel service reads the sharded metadata database. Step 7: the engagement service
  appends view and like events to a log, and a count aggregator writes totals to the cache every 10 seconds. Step 8:
  renditions of rarely watched videos age out of the blob store into a cold tier.
caption: >-
  A video platform: resumable uploads straight to blob storage, a transcoding workflow of small tasks, segments from a
  CDN, and view counts from a stream.
