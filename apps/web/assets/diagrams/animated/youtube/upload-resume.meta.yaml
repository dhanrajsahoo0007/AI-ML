title: "A resumable upload: drop, ask, resume"
alt: >-
  A sequence diagram in two steps with four lanes: an orange creator app, a teal upload service, a violet blob store
  and a green transcode workflow. Step 1: the app starts an upload of 1,200 MB and gets a session URL and a video id;
  it sends chunks 1 to 30, 480 MB, straight to the blob store, and chunk 31 is lost when the link drops, drawn with a
  red bar. Step 2: the app asks the store how many bytes it holds, hears 0 to 480 MB, and sends chunks 31 to 75; the
  store tells the upload service the object is complete, the service starts the transcode workflow and tells the app
  the video is processing.
caption: >-
  The creator’s bytes go straight to the blob store; after a drop the app asks how much arrived and sends only the
  rest.
tags: [case-studies, youtube, upload, resumable]
