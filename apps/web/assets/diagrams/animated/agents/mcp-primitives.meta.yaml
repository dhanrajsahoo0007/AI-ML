title: MCP's three primitives and who decides when each is used
alt: >-
  A table drawn as three columns, one per primitive an MCP server can offer. Tools are actions, and the model decides
  when to use them, a cell that is ringed; their methods are tools/list and tools/call; Brightpost's are get_order and
  create_refund; they can change things. Resources are data to read, and the application decides when to attach them;
  their methods are resources/list and resources/read; Brightpost's example is the "Damaged on arrival" help article;
  they are read-only and named by a URI. Prompts are templates, and the user decides when to use them; their methods
  are prompts/list and prompts/get; Brightpost's example is a "Refund confirmation" email template; they are text the
  user picks.
caption: >-
  The three primitives differ in who pulls the trigger. Only tools are chosen by the model, so only tools need a
  check before they run.
tags: [agents, mcp, tool-use, genai]
