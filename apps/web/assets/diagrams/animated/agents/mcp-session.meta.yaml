title: One MCP exchange, discover, list and call
alt: >-
  A sequence diagram in five steps with three lanes: the model, Brightpost's chat service, which is the host and holds
  the orders client, and the orders MCP server. In step 1 the chat service sends server/discover and the orders server
  replies with its protocol version, 2026-07-28, and that it offers tools. In step 2 the chat service
  sends tools/list and gets two tools, get_order and create_refund, which it may cache for five minutes. In step 3 the
  chat service sends the model the customer's message and four tool definitions, and the model replies with a tool
  call, get_order for order 4471. In step 4 the chat service sends tools/call for get_order; a note says every request
  carries its own metadata because there is no session. The orders server returns a kettle, £42, delivered 12 Nov. In
  step 5 the chat service sends the conversation back to the model with the tool result.
caption: >-
  There is no handshake: each request says which protocol version it speaks, so any request can be the first.
tags: [agents, mcp, tool-use, sequence, genai]
