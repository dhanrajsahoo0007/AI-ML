title: Validate and repair, the error goes back with a retry cap
alt: >-
  An architecture diagram built in seven steps. An extraction service, Brightpost's own code, sits in the middle with
  the model above it, drawn as the solid green accent and marked "no strict mode here". Step 1: the service sends the
  customer's kettle message and the JSON schema to the model. Step 2: attempt 1 comes back, and its stop reason says it
  is complete, not cut off. Step 3: a lime schema check on the left validates it and returns a red error naming the
  bad value "money back" in the wants field. Step 4: the service sends the draft and the error back, and attempt 2
  returns. Step 5: the schema check passes, and a lime rule check on the right calls get_order for order 4471 to
  confirm the order exists and belongs to this customer. Step 6: the valid record, order 4471 with a refund wanted,
  goes down to the refunds workflow. Step 7: a dashed path leads to an orange support queue, where a person takes over
  after 2 failed retries; this run did not need it.
caption: >-
  The validator's message is the retry prompt, the rule check asks a system the schema cannot see, and the cap ends
  the loop at 3 attempts.
tags: [agents, structured-output, validation, retries, json, genai]
