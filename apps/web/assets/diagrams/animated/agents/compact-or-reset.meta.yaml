title: "Clear, compact or reset: cheapest first"
alt: >-
  A decision guide built in three steps, with questions on the left and answers on the right. First question: are old
  tool results most of the window? Yes leads to clearing old tool results, the lightest edit, where the calls stay and
  only their results go. No leads to the second question: is the work at a milestone, with its progress saved outside
  the window? Yes leads to a reset with a handoff note: a fresh window that starts by reading the note and the git
  log. No leads to compaction: a summary plus the recent files, in the same session. A dashed arrow runs from
  compaction up to the reset, labelled "later: refills fast or wraps up early".
caption: >-
  Try the cheapest edit first. Compact mid-task, when the thread still matters; reset at a milestone, or when
  compaction stops helping.
tags: [agents, context-engineering, compaction, genai]
