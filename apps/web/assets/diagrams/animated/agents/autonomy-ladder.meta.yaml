title: The autonomy ladder
alt: >-
  A staircase of five rungs rising from left to right, with illustrative numbers for one Brightpost refund request.
  Single call: 1 call, about 1.5 seconds of model time; your code decides; risk low. Workflow: 3 calls, about 4.5
  seconds; your code decides; risk low. Agent with tools, ringed because the Brightpost agent sits here: 5 calls,
  about 7.5 seconds; the model decides; risk medium. Plans and reflects: 8 calls, about 12 seconds; the model decides;
  risk medium. Multi-agent: 15 calls, about 22.5 seconds; several models decide; risk high. The rungs where code
  decides are grey and the rungs where a model decides are green. An arrow along the bottom reads "more calls, time
  and risk (illustrative)".
caption: Climb only as far as the task needs; each rung buys flexibility with calls, time and risk.
