title: Three layers of grading on one Brightpost refund run
alt: >-
  A layout diagram built in four steps. In the middle is the trace of one run of the Brightpost support agent, one
  row per model call under the headings Tool call and Result: get_order(4471) returns "Kettle, £42, delivered 12 Nov";
  search_help("damaged item refund") returns "Damaged on arrival: full refund"; create_refund(4471, 42.00) returns
  "Approved 10:20, refund R-2291"; send_email(customer, "Your refund") returns "Email sent"; the last row is the
  answer, "Your £42 refund for order 4471 is on its way." Step 2 adds a component grader on the left that checks only
  the create_refund call: is it order 4471 and £42.00? Step 3 adds a tall trajectory grader on the right with an arrow
  from every row: it grades the whole path. Step 4 adds the run's end state in the sandbox, one refund R-2291 for £42
  and one email, and an outcome grader, ringed, that checks whether that end state matches the goal. Tool calls are
  teal, results blue, the answer green and the three graders lime.
caption: >-
  One run, three graders. The outcome grader says whether the refund worked; the trajectory and component graders say
  why, when it did not.
tags: [agents, evaluation, genai]
