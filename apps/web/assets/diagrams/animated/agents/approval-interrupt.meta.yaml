title: Approval interrupt, the Brightpost refund paused for the support agent
alt: >-
  A sequence diagram in six steps with five lanes: the model, the harness, the checkpointer, the create_refund tool
  and the support agent. In step 1 the model asks for create_refund for order 4471, £42.00, and the harness checks its
  policy: £42 is over £30, so it must ask. In step 2 the harness saves checkpoint cp_3 with the pending call and its
  key; a note says the worker may stop because the run is now a database row. In step 3 the harness asks the support
  agent whether to approve £42 for order 4471, and a note says the support agent sees the order, the rule and the
  reason. In step 4 the support agent answers approve at 10:20; a note says the other answers are an edit, such as
  £30, or a rejection with a reason. In step 5 the harness saves checkpoint cp_4, approved, then runs create_refund
  with the saved key and gets refund R-2291. In step 6 the harness sends the tool result, R-2291, to the model, whose
  next step is send_email.
caption: >-
  The pause lives in the harness, not the model: the call is held, the run is saved, a person answers, and the call
  runs with the key saved before the pause.
tags: [agents, human-in-the-loop, approvals, genai]
