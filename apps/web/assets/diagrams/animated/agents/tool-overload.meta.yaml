title: Tool definitions from many MCP servers crowd the context window
alt: >-
  Three stacked bars drawn to the same illustrative 200,000-token context window, revealed one at a time. The first,
  Brightpost alone, uses 2,696 tokens, 1 percent: instructions 2,000 and Brightpost's four tool definitions 696. The
  second adds five popular MCP servers with 58 tools: GitHub 26,000 tokens, ringed as the largest, Slack 21,000, and
  Sentry with two more servers 8,000, for 57,696 tokens, 29 percent, before the customer has said anything. The third
  puts the same tools behind a search tool, so only the search tool and the definitions it finds are loaded: about
  8,250 tokens for the tools and 10,946 in all, 5 percent. Server sizes are from Anthropic's November 2025 post; the
  window and the search figure are illustrative.
caption: >-
  Every connected server's definitions ride along on every request. A search tool loads only the few a task needs.
  Window size and the search figure are illustrative.
tags: [agents, mcp, context-engineering, genai]
