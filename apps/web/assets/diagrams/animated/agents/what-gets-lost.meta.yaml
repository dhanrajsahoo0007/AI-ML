title: "What survives two summary passes, and what does not"
alt: >-
  A table of five facts from a 40-turn Brightpost support thread, revealed column by column. Each row names the fact,
  its kind and the turn it came from, then shows how the thread said it, how summary S1 (after pass 1) says it and how
  summary S2 (after pass 2) says it. Order 4471, an id from turn 1, reads "order 4471" in both summaries. Refund
  R-2291 for £42, an id and a decision from turn 14, reads "R-2291 £42 approved" in both. "Text me from now on", a
  decision from turn 26, is not yet said at pass 1 and becomes "prefers text" in S2. The damage, "crack from spout to
  base" from turn 3, becomes "cracked from spout" in S1 and "arrived damaged" in S2, ringed in red: the detail is gone.
  The photo time, 09:42, is gone from both summaries. Below the table: the summary prompt for both passes, "Keep the
  decisions and the ids.", and in the last step the customer's turn 41: "The courier's claim needs the photo: what did
  I send, and when?"
caption: >-
  The prompt asked for decisions and ids, so ids and decisions survive and details fade one pass at a time. Turn 41
  asks for exactly the two facts the summary dropped.
tags: [agents, memory, summarization, genai]
