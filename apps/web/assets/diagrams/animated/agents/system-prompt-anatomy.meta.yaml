title: "Anatomy of a system prompt: six sections, and the checks in code behind three lines"
alt: >-
  A two-column diagram built in five steps for the Brightpost support agent's system prompt. On the left are its
  sections in the order they are sent, each an XML-tagged block with an excerpt and a token count: role, 40 tokens,
  "You are Brightpost's customer support agent"; task, 120, "Find the order, apply the policy, act, confirm"; rules,
  260, "Refunds over £30 wait for a support agent"; tools, 180, "Call get_order first. Email only the address on
  file"; format, 90, "Plain text, under 80 words"; and examples, 540, three example conversations. Version 1 totals
  1,230 tokens, sent with every model call. On the right are the checks in code that back three lines, joined to them
  by dashed arrows: an approval gate that holds one refund over £30, and an owner check that takes the order and the
  email address from the signed-in session. Step 5 shows version 2: a ringed line added under the rules, "The £30 is
  per order, all refunds summed. Never split one", 45 tokens, backed by a second gate in code that sums refunds per
  order; version 2 totals 1,275 tokens. Token counts are illustrative.
caption: >-
  Six sections, in the order they are sent. Three lines are also enforced in code, because a prompt asks and code
  decides. Step 5 is the fix from the worked example. Counts illustrative.
tags: [agents, prompt-engineering, system-prompt, genai]
