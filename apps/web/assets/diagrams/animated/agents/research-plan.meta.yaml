title: A research plan, one question split into three sub-questions
alt: >-
  A diagram built in four steps. Brightpost's support manager asks, in an orange box, "Why are kettle refunds up this
  month?". The question goes to a green lead agent that plans before it searches. The lead first fixes the scope,
  drawn as a wide green box and ringed: compare 1 to 15 November with 1 to 15 October, and "up" means refunds per 100
  kettles sold. Below it, three orange sub-question cards, one per worker: "Refund rate and reasons, Oct vs Nov?",
  "Did the damage rule change?" and "What do reviews say went wrong?". Under each card a teal box names its tools and
  source (query_refunds on the refund records, search_help on the help centre, web_search and fetch_page on public
  review sites) and a line says when the worker is done: both rates found, edit history read, no new sources. In the
  last step the lead saves the plan to a violet "Plan in memory" box.
caption: >-
  The lead pins down the words in the question before it searches, then gives every sub-question a source and a stop.
  The plan lives in memory, so a long run cannot lose it.
tags: [agents, research, planning, genai]
