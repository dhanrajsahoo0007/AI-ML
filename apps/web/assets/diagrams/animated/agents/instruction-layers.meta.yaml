title: "Instruction layers: a small root file and everything it points to"
alt: >-
  A three-column diagram built in three steps for the bug-fix coding agent. On the left is the repository: a root
  AGENTS.md of 60 lines and 800 tokens, with dashed tree lines pointing to a skills folder holding three skills, a
  scoped src/AGENTS.md of 400 tokens, a web/AGENTS.md of 1,200 tokens and docs/architecture.md of 3,000 tokens; below
  them sit 58 MCP tool definitions, 55,000 tokens, marked deferred. On the right is the context window. At step 1 it
  holds the harness prompt, 900 tokens, the root AGENTS.md, 800, three skill descriptions, 300, and four tools plus a
  tool search tool, 1,500: 3,500 tokens. At step 2 the agent reads src/parser.ts and src/AGENTS.md, 400 tokens, joins
  the window, ringed. At step 3 the model sees that the task matches the run-tests skill and reads its body, 1,500
  tokens. By the end 5,400 tokens are loaded; web/AGENTS.md, the architecture doc, two skill bodies and the MCP
  definitions, 63,200 tokens, never load. Counts are illustrative; the MCP sizes are Anthropic's.
caption: >-
  The root file is small and always loaded; everything else waits for a trigger. For this bug, 63,200 tokens never
  reach the window. Counts illustrative; MCP sizes from Anthropic.
