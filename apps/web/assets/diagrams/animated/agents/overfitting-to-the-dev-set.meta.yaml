title: Overfitting to the dev set, training keeps rising while validation turns
alt: >-
  A line chart in three steps. The horizontal axis lists seven prompt candidates in the order the optimiser wrote them,
  c0 to c6, where c0 is the live prompt v12; the vertical axis runs from 80 to 100 per cent. Step 1: a dashed lime line
  for the 200 training chats rises every round, from 84 per cent at c0 to 98 per cent at c6. Step 2: a solid lime line
  for the 100 validation chats rises from 82 per cent to a ringed peak of 89 per cent at c3, then falls to 84 per cent
  at c6; a dashed vertical guide at c3 reads "picked by validation: c3". Step 3: a second guide at c6 reads "picked by
  train: c6", and a panel headed "Fixed set, read once" shows c3 passing 189 of 200 in a lime box and c6 scoring 181 of
  200, below v12's 184, in a red box. A note gives the floor, 170, and v12's score, 184.
caption: >-
  The training score always rises, because the optimiser learns from those chats. Only the validation split tells you
  when to stop, and the fixed set confirms it. Scores are illustrative except the floor (170) and v12's 184.
tags: [agents, prompt-optimization, evaluation, overfitting, genai]
