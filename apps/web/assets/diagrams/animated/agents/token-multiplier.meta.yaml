title: Tokens used by a chat, one agent and a multi-agent system
alt: >-
  Three horizontal bars on one scale, measured by Anthropic on its research system in June 2025, as multiples of the
  tokens a chat uses. Chat: 1 times, a short grey bar. One agent: about 4 times, a pale green bar. A multi-agent
  system: about 15 times, a long darker green bar, ringed. A line under the bars says what the extra tokens bought in
  that write-up: the multi-agent system did 90.2 percent better than one agent on Anthropic's internal research eval.
caption: >-
  A team spends about 15 times the tokens of a chat, nearly four times a single agent; it pays off only when the task
  is worth that much more.
tags: [agents, multi-agent, cost, genai]
