title: "Last N messages against a summary plus recent messages, at turn 14"
alt: >-
  Three horizontal bars, revealed one at a time, showing the history the Brightpost assistant sends with its request
  at turn 14 under three policies, drawn to one illustrative scale of 1,800 tokens. Full history: messages 1 to 4 at
  290 tokens, the help passages from message 4 at 1,200 tokens in blue, and messages 5 to 13 at 200 tokens, 1,690 in
  all and a 4,386-token request; the facts column reads 4471, £42, email. Last 8 messages: messages 6 to 13, 180
  tokens, a 2,876-token request; the facts column, in red, reads no 4471, £42, or email. Summary plus last 4: a ringed
  violet 120-token summary and messages 10 to 13 at 90 tokens, 210 in all and a 2,906-token request; the facts column
  again reads 4471, £42, email. A violet box prints the summary of messages 1 to 9: order 4471, kettle, £42, arrived
  cracked; wants email, not text; £42 refund held for approval; asked about the white kettle, delivery and price
  match. A scale line notes that every request also carries 2,696 tokens of instructions and tool definitions.
caption: >-
  Both short policies cut the history by close to 90 %, but only the summary keeps the order number, the amount and
  the customer's channel. At 14 messages the full history is still small; the policies earn their keep in long chats.
  Token counts are illustrative.
tags: [agents, memory, context-engineering, genai]
