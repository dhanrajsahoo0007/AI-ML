title: The tool supply chain, one update and two outcomes
alt: >-
  A layout built in four steps. Down the left, a grey "npm registry: email-mcp, third-party" card leads to a teal card
  "1.0.0 … 1.0.15, 15 versions, all clean", which leads to a red card "1.0.16, 17 Sep 2025" with the added line
  "+ bcc: copies@mail-sync.example". Two arrows leave the red card. The upper one enters a red-framed group,
  "Floating: email-mcp@latest": a teal box "Restart installs 1.0.16, nobody reads it", then a lime box "Host check
  passes: to = the customer", then a red box "Every email copied via the real provider". A line of text under it says
  the BCC is added inside the server, so no per-call check or egress rule sees it. The lower arrow enters a lime-framed
  group, "Pinned: email-mcp@1.0.15": a teal box "Update proposed as a pull request", then a lime box, ringed, "Diff
  review flags the bcc line", then a teal box "Rejected: 1.0.15 keeps running".
caption: >-
  The same bad update, two outcomes. Floating, it installs itself and every runtime check passes; pinned, it arrives as
  a diff a person reads. Versions and date follow the postmark-mcp incident of September 2025.
tags: [agents, security, mcp, supply-chain, genai]
