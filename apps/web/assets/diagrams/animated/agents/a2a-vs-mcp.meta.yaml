title: A2A against MCP, across and down
alt: >-
  An architecture diagram in three steps with two dotted zones side by side. On the left, Brightpost: its support
  agent, a green robot, has arrows going down to three teal MCP servers, Orders, Help centre and Email; the middle
  arrow is labelled "MCP: tools/call". In step 2 a two-way arrow labelled "A2A: task, messages, artefacts" runs across
  to the right zone, to Swiftline Couriers' claims agent, another green robot. In step 3 the claims agent's own arrows
  go down, over MCP, to two teal servers, Tracking and Claims system. The right zone is titled "Swiftline: opaque to
  Brightpost": Brightpost sees the courier's agent, never its tools.
caption: >-
  MCP is vertical: one agent and the tools it controls. A2A is horizontal: two agents, two owners, and only the task
  crosses the line between them.
tags: [agents, a2a, mcp, multi-agent, genai]
