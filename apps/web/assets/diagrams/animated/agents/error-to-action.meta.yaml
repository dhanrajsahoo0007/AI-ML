title: From a raw error to what to do next
alt: >-
  Two columns. Left, headed "Raw: 46 lines, about 2,100 tokens": eight lines of test output. The first three are
  blue: "FAIL parser.test.ts > parses an empty file", "Error: empty input has no lines" and "at parseLines
  (src/parser.ts:14:11)". The other five are grey runner frames: parseCsv, the test file, runTest in node_modules,
  processTicks in node internals and "39 more lines". Right, headed "Rewritten: 3 lines, about 90 tokens": a red box,
  "What failed: parses an empty file, Error: empty input has no lines", fed by arrows from the first two lines; a blue
  box, "Where: src/parser.ts:14, parseLines(), inside the loop you edited", fed by the third line; and a ringed teal
  box, "What to try: read lines 10 to 18, fix, then call run_tests() again", which no raw line feeds.
caption: >-
  Three of the 46 raw lines carry what the model needs; the rewrite keeps them and adds the one thing a stack trace
  never says, what to do next. Token counts are illustrative.
