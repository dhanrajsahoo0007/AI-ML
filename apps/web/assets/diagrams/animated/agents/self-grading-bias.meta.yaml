title: Self-grading bias on the round-1 diff
alt: >-
  Two panels grade the same round-1 diff of the bug fix, which changes the loop bound from "< n - 1" to "< n". In the
  left panel, "The generator grades itself", a green self-check ran one test, "keeps the last line", and a red verdict
  says "4 of 4 met: a bug ships". A note reads "same model, same context: it checks what it meant to do". In the right
  panel, "A separate evaluator grades it", a lime evaluator runs all 18 tests; a blue result says 17 passed and 1
  failed, "parses an empty file"; the ringed lime verdict says "3 of 4 met: C2 fails, a critique goes back". Its note
  reads "fresh context, told to doubt: it checks the contract".
caption: >-
  Same diff, two graders. The author checks the test it was fixing and passes itself; a separate evaluator runs every
  test and finds the case the author never thought about.
