title: The planner-generator-evaluator loop on the bug-fix task
alt: >-
  An architecture diagram built in six steps. An orange issue, "last CSV line lost", goes to a green planner, which
  works out what to build and why. The planner sends a spec with acceptance criteria to a green generator, which edits
  src/parser.ts, and sends the same four criteria down and across to the evaluator, drawn as the solid lime accent and
  described as sceptical, with a fresh context. The generator hands the evaluator a diff and a report. The evaluator
  runs all 18 tests in a teal test runner itself. One criterion fails, so a dashed critique arrow goes back up to the
  generator. In round 2 every criterion passes, and the evaluator sends the work on to a "Ready for review" box: 4 of 4
  criteria met.
caption: >-
  Each role hands the next a written contract: the planner a spec with criteria, the generator a diff and a report,
  the evaluator a critique. The evaluator takes its criteria from the planner, never from the generator.
tags: [agents, evaluation, genai]
