title: Context rot, accuracy against input length
alt: >-
  A chart in two steps, labelled "Shape only, after Hong et al. (Chroma, 2025)", of answer accuracy against input
  length, from shorter to longer. First a solid green line marked "needle only" starts high and falls gently as the
  input grows. Then two dashed lines appear below it: a green one marked "one distractor" that starts lower and falls
  faster, and a red one marked "four distractors" that starts lower still and falls fastest. No numbers are shown.
caption: >-
  Shape only, after Hong et al. (Chroma, 2025): accuracy falls as the input grows, and text that looks relevant but is
  not pulls it down faster.
tags: [agents, context, long-context, genai]
