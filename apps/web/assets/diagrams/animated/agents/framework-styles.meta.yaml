title: Three agent framework styles, graph, role and loop, on one refund
alt: >-
  Three strips stacked top to bottom, each building the Brightpost refund for order 4471 with boxes of the same size.
  Graph-based (LangGraph, Agent Framework workflows, ADK graphs): the customer message goes to a green model call that
  reads the request, then to a lime check "Over £30?"; "yes" leads to an orange-outlined approve node and then to a
  grey create_refund node, and "no" skips straight to create_refund along a line underneath. Note: you write every
  node and edge, and the £30 rule is an edge in code. Role-based (CrewAI crews): the refund request goes to a manager
  agent, which hands work to an orders agent and a refunds agent, each with a role and a goal; both feed a person who
  reviews the answer, then the crew result. Note: you write roles, goals and tasks, and a manager model hands out the
  work. Loop-based (OpenAI Agents SDK, Claude Agent SDK, ADK LLM agents): the customer message goes to a green model
  that picks each step; it sends tool calls to a teal box that runs four tools, results loop back to the model along a
  dashed line above, and the tool box waits on an orange-outlined approver for refunds over £30; when the model makes
  no tool call it goes to the reply. Note: you write tools and settings, and the model decides the path at run time.
caption: >-
  The same refund three ways. What changes is who decides the next step: your edges, a manager model, or the model in
  a loop.
