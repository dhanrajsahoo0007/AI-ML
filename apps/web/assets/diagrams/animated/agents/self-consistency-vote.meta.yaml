title: Self-consistency on a small Brightpost sum
alt: >-
  A figure in five steps, read left to right. An orange question box says "£42 kettle + 3 mugs at £8. Kettle
  refunded. What was paid?", sent 5 times at temperature 0.7. Five green boxes are the sampled reasoning paths. Path
  1: "42 + 3 × 8 = 66", which forgets the refund. Path 2: "Mugs 3 × 8 = 24; the kettle nets to 0". Path 3: "Paid 66,
  got 42 back: 66 − 42 = 24". Path 4: "42 + 8 = 50; minus 42 = 8", which counts one mug, not three. Path 5: "Kept only
  the mugs: 3 × 8 = 24". Each path ends in an answer cell: £66 and £8 in red, three £24 cells in green. All five
  answers feed a lime majority-vote box that counts £24: 3, £66: 1, £8: 1. The highlighted final answer is £24, with 3
  of 5 paths agreeing (60 %).
caption: >-
  Three different routes reach £24, so £24 wins. Path 1 alone would have answered £66: one sample can be the bad
  one.
tags: [agents, prompting, self-consistency, genai]
