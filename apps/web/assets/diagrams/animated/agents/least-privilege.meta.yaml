title: One broad key against one scoped token per tool
alt: >-
  Two panels built in three steps. Left, "One broad credential": a grey card, "One service key, never expires, all
  customers, all actions", with arrows to four teal tool cards: get_order, create_refund, send_email and search_help.
  Right, "A scoped token per tool": each tool has its own lime token card: orders:read for customer 1847 for 15
  minutes; refunds:create for customer 1847, with approval over £30; email:send to customer 1847's address only; and
  a grey "no secret" card for search_help, which reads public articles only. In the last step a line reads "A fooled
  model asks for create_refund(5122, …)". Under the broad key a red box says the call runs and the key reaches order
  5122 and every customer's address. Under the scoped tokens a lime box, ringed, says it is refused because 5122 is
  not customer 1847's order, and the token expires in 15 minutes.
caption: >-
  The same fooled call, two outcomes: the broad key does whatever the model asks; each scoped token can only do one
  job for one customer. The 15-minute lifetime is illustrative.
tags: [agents, security, genai]
