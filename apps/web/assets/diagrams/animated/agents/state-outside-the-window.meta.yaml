title: "State outside the window: files, git and a run store"
alt: >-
  An architecture diagram built in five steps. On the left are the developer and the harness, in the middle the
  coding agent, whose window holds only what the current step needs, and on the right a zone called "Outside the
  window" with four stores: the repository brightpost-orders, the git history with one commit per fix, the note
  HANDOFF.md with what is done, the decisions and what is next, and a run store with the step, token count and status.
  Step 1: the developer's task reaches the agent, which the harness runs. Step 2: the agent reads files from the
  repository on demand. Step 3: each finished fix is committed and noted in HANDOFF.md. Step 4: the harness records
  the run at step 9 and 24,000 tokens. Step 5: a new session reads HANDOFF.md and the git log first, and the harness
  resumes the run at step 9 from the run store.
caption: >-
  The window is a working set, not the record. Code, history, progress and run state live outside it, and a new
  session reads back only what it needs.
tags: [agents, context-engineering, state, genai]
