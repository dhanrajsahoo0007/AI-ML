title: The anatomy of a verification loop
alt: >-
  A loop drawn in four build steps. Step 1: an orange box on the left, "Goal: all 18 tests pass". Step 2: an arrow
  from the goal into a ring of stations: "Assemble context" (grey) on the left, "Call the model" (green) at the top and
  "Run the tool" (teal) on the right. Step 3: the ring continues to "Check the work" (lime, ringed) at the bottom.
  Step 4: an arrow labelled "verdict" leads down from the check to a grey "Decide" box (go on, stop or ask). A dashed
  arrow labelled "not met: next round" runs from Decide back up to Assemble context, and three arrows lead right to
  the exits: "Done" (green, the goal is met), "Stop and report" (grey, a budget ran out) and "Ask a person" (orange,
  stuck, or a risky step).
caption: >-
  A loop is a goal, a round of work, a check and a decision. Only the check knows whether the goal is met, so the loop
  is only as good as the check.
