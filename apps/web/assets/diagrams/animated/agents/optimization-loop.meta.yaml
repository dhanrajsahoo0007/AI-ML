title: The prompt optimisation loop, from v12 to a checked candidate
alt: >-
  An architecture diagram built in seven steps, showing DSPy's GEPA optimiser improving Brightpost's refund-reply
  prompt. A neutral optimiser sits in the middle. Step 1: the live prompt, v12, enters a violet candidate pool as
  candidate c0, and an orange validation split of 100 refund chats scores it 82 of 100. Step 2: the optimiser sends
  prompt c0 to a green task model, together with 3 chats from an orange training split of 200 refund chats. Step 3:
  the task model's 3 replies go to a lime metric, which returns a score and feedback; 2 replies fail, and the reasons go
  to the reflection model, drawn as the solid green accent. Step 4: the reflection model writes candidate c1 with a new
  rule and returns it to the optimiser. Step 5: c1 scores 85 of 100 on validation and is kept in the pool. Step 6: the
  loop repeats up to c6, and the best candidate on validation is c3, at 89. Step 7: c3 is checked once on a lime fixed
  set of 200 held-out cases and passes 189 of 200.
caption: >-
  The training split teaches, the validation split chooses, and the fixed set is read once at the end. Scores other
  than the fixed set's floor (170) and v12's 184 are illustrative.
