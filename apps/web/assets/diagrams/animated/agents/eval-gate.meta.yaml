title: The eval gate
alt: >-
  An architecture diagram built in four steps. Step 1: a change to the prompt, tools or model and a violet store of
  test cases (past issues, fixed seeds) both feed a green box, "Run the agent", with the same settings each time.
  Step 2: the outputs go to lime graders (tests or a judge), which send scores to the release gate, the solid lime
  accent, which asks whether the change beats the baseline. Step 3: "yes" leads down to Ship, the new baseline; "no"
  leads up to "Read traces, fix", and a dashed line along the top takes the next change back to the start. Step 4:
  the shipped agent runs live, its production traces feed back, and real failures become new test cases.
caption: >-
  A change ships only if it beats the baseline on the fixed suite, and every production failure becomes a new
  test case.
