title: "Skill loading: names first, the body when a task matches"
alt: >-
  A diagram built in four steps showing the three levels of an Agent Skill for the coding agent's run-tests skill. On
  the left, on disk in .claude/skills, are three SKILL.md frontmatters with a name and description of about 100
  tokens each, the run-tests SKILL.md body of 1,500 tokens, a reference file flaky-tests.md of 2,000 tokens, a script
  failing.sh with 600 tokens of code, and the bodies of two other skills, release-notes and db-migration, 4,000
  tokens. At step 1 the three names and descriptions, 300 tokens, are in the context window from the start. At step 2
  the model sees that the task matches the run-tests description, ringed, and the 1,500-token body loads. At step 3
  the body has the agent run the script; its code never enters the window and only its 40-token output does: 1
  failed, parses an empty file. At step 4 the reference file and the other two skills' bodies are marked as never
  read. In the window: 300 plus 1,500 plus 40 is 1,840 tokens; 6,600 tokens stay on disk. Levels follow the Agent
  Skills docs; counts are illustrative.
caption: >-
  Only names and descriptions are paid for up front. A skill's body costs tokens only when a task matches it, and a
  bundled script costs only its output. Counts illustrative.
