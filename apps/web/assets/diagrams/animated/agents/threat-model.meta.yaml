title: The threat model for the Brightpost support agent
alt: >-
  An architecture diagram built in seven steps. In the middle row, an orange "Customer, signed in" card sends a
  message to the chat service, the host and harness, drawn as the solid neutral accent; a two-way edge joins it to a
  green "Model, reads every word" card. Above the chat service, a grey "Secrets" card holds API keys and tokens. Below,
  a teal zone of MCP servers holds four cards: the orders server (get_order, create_refund), the help centre server
  (search_help and articles), the email server (send_email and templates) and a third-party parcel tracker. Each step
  adds one red way in with a dashed red edge: a pasted note asking to refund order 5122 is pasted in by the customer;
  a planted review on a product page is indexed by the help centre; a courier's free-text note is stored in the order
  record; hidden instructions in a tool description arrive from the parcel tracker with tools/list; and an API key is
  copied out of the secrets into a log. In the last step the edge between the chat service and the model turns red and
  is labelled "all text, one window".
caption: >-
  Five ways in, one destination: every outsider's text reaches the model through the same window, and a leaked key
  skips the model altogether.
