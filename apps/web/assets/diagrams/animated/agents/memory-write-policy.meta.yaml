title: The memory write policy on the Brightpost return visit
alt: >-
  A table revealed in four steps under an orange strip, "Today's chat, 19 Nov". Column 1, Extract, holds three
  candidate facts in pale violet: "prefers text" (semantic), "4471: £42 refund approved" (episodic) and "chased refund
  4471" (episodic). Column 2, Nearest in store, shows what each is compared with: "prefers email", a conflict on the
  same field; "4471: £42 refund approved", a duplicate of the same fact; and "nothing close", new. Column 3, Decide,
  holds lime cells: UPDATE, replace and keep the old (highlighted); DROP, nothing new; ADD, store it. Column 4, inside
  a dotted group "Store, customer 1847", is the store after the write: "prefers text" with email superseded on 19 Nov,
  "4471: £42 refund approved" unchanged since 12 Nov, with no arrow into it, and "chased refund 4471" from this chat.
caption: >-
  Every candidate is compared before it is saved. A conflict replaces the old memory, a duplicate writes nothing, and
  only a new fact adds a row.
tags: [agents, memory, genai]
