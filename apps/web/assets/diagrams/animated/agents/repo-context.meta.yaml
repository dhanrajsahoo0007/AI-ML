title: Search, open, read only what is needed
alt: >-
  A figure in four steps under the orange issue "Order import drops the last line of a CSV file". Left, the repository
  brightpost-orders, 240 files: eight are listed (AGENTS.md, docs/architecture.md, src/AGENTS.md, src/import.ts,
  src/orders.ts, src/parser.ts, src/parser.test.ts, web/checkout.tsx) and 232 more; in full it would be about 410,000
  tokens, and only AGENTS.md, 800 tokens, loads at the start. Middle, the teal tool call search("last line") returns two
  blue matches, src/parser.ts line 17, "// ignore the last line if empty", and src/parser.test.ts line 12, it("keeps the
  last line"), about 100 tokens. Right, the teal call read_file("src/parser.ts") opens that one file, ringed, 3,200
  tokens. Along the bottom: the model reads 800 + 100 + 3,200 = 4,100 tokens, about 1 percent of the repository.
caption: >-
  The agent never loads the repository. A search narrows 240 files to two lines, and the model reads one file of
  240. Sizes are illustrative.
tags: [agents, coding-agents, context-engineering, genai]
