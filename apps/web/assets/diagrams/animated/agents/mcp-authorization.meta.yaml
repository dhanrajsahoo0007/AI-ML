title: MCP authorisation, OAuth 2.1 for a remote server
alt: >-
  A sequence diagram in five steps with four lanes: a Brightpost support agent, a sign-in server, the support agent's
  desktop assistant and Brightpost's remote email server. In step 1 the assistant asks the email server to run
  send_email without a token and gets HTTP 401 with the address of the server's resource metadata. In step 2 the
  assistant fetches that metadata, which gives the sign-in server's address, then fetches the sign-in server's own
  metadata, which lists its endpoints and PKCE support. In step 3 the assistant opens a browser with a PKCE challenge
  and the email server's address as the resource; the support agent signs in and allows the email:send permission,
  and the sign-in server redirects back with a code and its issuer, which reach the assistant. In step 4 the assistant
  sends the code, its PKCE verifier and the resource to the sign-in server and gets a token issued for the email
  server only. In step 5 the assistant repeats the send_email call with the token; a note says the email server checks
  the token's audience and scope; it replies that the email was sent.
caption: >-
  The server never sees a password: it only checks a token that was issued for it, with the scope this call needs.
