title: "Rounds × roles: the cost of one planner-generator-evaluator run"
alt: >-
  A grid of costs from one run of Anthropic's planner-generator-evaluator harness, published 24 March 2026. Rows are
  the roles, columns are three rounds, and a cell's shade grows with its cost. The planner runs once, in round 1:
  $0.46, 4.7 minutes. The generator costs $71.08 (2 h 7 min) in round 1, $36.89 (1 h 2 min) in round 2 and $5.88
  (10.9 min) in round 3, $113.85 in all. The evaluator costs $3.24, $3.09 and $4.06, $10.39 in all, ringed as 8.3 % of
  the total. Round totals are $74.78, $39.98 and $9.94, and the whole run costs $124.70 over 3 h 50 min. A line under
  the grid reads "cost = planner + sum over rounds of (generator + evaluator)".
caption: >-
  Every extra round re-runs the generator, and that is where the money goes; the evaluator was 8.3 % of this run.
  Figures are from one published run, not a benchmark.
tags: [agents, cost, genai]
