title: What fills a coding agent's context window
alt: >-
  Two stacked bars drawn to the same illustrative budget of 32,000 tokens, revealed one at a time. Step 1 uses 3,800
  tokens, 12 percent: instructions 2,000, tool definitions 1,500 and the task 300, with 28,200 tokens free. Step 9
  uses 24,000 tokens, 75 percent: the same 3,800, then files 6,400, history 4,000 and tool results 9,800, ringed as
  the largest slice, with 8,000 tokens free.
caption: >-
  By step 9 tool results are the biggest slice of the window, and they are the first thing compaction trims.
  Token counts are illustrative.
tags: [agents, harness, context-engineering, genai]
