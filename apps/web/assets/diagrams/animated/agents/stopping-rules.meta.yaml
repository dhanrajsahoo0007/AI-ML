title: Stopping rules, budget, saturation and confidence
alt: >-
  A diagram built in four steps. On the left, a bar chart titled "Reviews worker: new sources per search": search 1
  finds 4 new sources, search 2 finds 2, search 3 finds 1 and search 4 finds 0; each of the first three searches is
  followed by one page fetch, the fourth by none. On the right, three lime rules the worker checks after every search:
  Budget, 10 tool calls; Saturation, a search adds nothing new; Confidence, 2 independent sources agree. After search 4
  each rule shows its state: the budget reads 7 of 10 used, not reached; saturation reads "search 4: 0 new, stop" and
  is ringed; confidence reads "all reviews on one site: not met". In the last step a green box says the worker stops
  with 3 calls unspent and reports its claim at medium confidence.
caption: >-
  Saturation stops the search before the budget does, and before confidence is reached, so the worker says how sure
  it is instead of searching on. Counts are illustrative.
