title: Approval fatigue, people catch fewer dangerous commands as prompts pile up
alt: >-
  A chart in three steps of the share of dangerous commands caught, from 0 to 100 percent, against the number of
  permission prompts already seen in a session, from 0 to 60. A note at the top says users approve 97 percent of
  prompts in Claude Code. Step 1: an orange line for people starts at a dot marked about 17 percent early in the
  session and sinks to a ringed dot marked about 5 percent after 50 or more prompts; a label says the line between the
  dots is illustrative. Step 2: a flat green line near the top is the auto mode classifier at 89 percent, flat whatever
  the session length. Step 3: a dashed arrow runs left from 50 prompts to a dashed vertical line at 8 prompts, marked
  sandbox: 84 percent fewer, 50 becomes 8.
caption: >-
  After Anthropic's Claude Code data (2025–2026): people catch about 17 % of planted dangerous commands early in a
  session and about 5 % after 50 prompts, while a classifier stays at 89 %. The curve between the two measured points
  is illustrative.
tags: [agents, human-in-the-loop, approvals, evaluation, genai]
