title: One fix, three edit formats
alt: >-
  Three rows, revealed one at a time, under the headings "Format", "What the model writes for the same fix" and "Breaks
  when". The fix changes the loop bound on line 18 of src/parser.ts, a 128-line file, from "i < lines.length - 1" to
  "i < lines.length". Row 1, ringed: whole file, about 3,200 tokens out; the model re-types lines 1 to 17 unchanged,
  writes the new loop line in teal, then re-types lines 19 to 128; it breaks when files are long, as it is slow and
  costly and lines can go missing. Row 2: unified diff, about 50 tokens out; the lines "--- a/src/parser.ts", "+++
  b/src/parser.ts", "@@ -18 +18 @@", then the removed and the added loop line in teal; it breaks when line numbers or
  context no longer match the file. Row 3: search and replace, about 40 tokens out; "path: src/parser.ts", then "old:"
  with the old loop line and "new:" with the new one, both teal; it breaks when the old text is not found, or is found
  twice.
caption: >-
  The same one-line change costs about 3,200 tokens as a whole file and about 40 as a search-and-replace. Each format
  fails in its own way. Token counts are illustrative.
