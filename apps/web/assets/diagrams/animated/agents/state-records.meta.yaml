title: Durable records, a thread with its runs and their checkpoints
alt: >-
  A diagram of stored records built in four steps. A violet group is the thread th_5e08, customer 1847's chat. In
  step 1 the run run_8f3a, the kettle refund, points to its first checkpoint, and seven checkpoints cp_1 to cp_7 sit
  in a row, each with an arrow back to its parent. In step 2 a second run on the same thread, run_d4b7, the follow-up
  "When will it arrive?", has checkpoints cp_8 and cp_9; a note reads "One thread, many runs. One run, many
  checkpoints. Each checkpoint points to its parent." In step 3 cp_4 is opened into six fields: thread_id th_5e08,
  parent cp_3, values "6 messages so far", next create_refund, pending toolu_03 approved, and key run_8f3a:toolu_03,
  which is ringed. In step 4 two boxes sit outside the thread: a memory store read across threads, holding "prefers
  email", and the payments service, which keeps key run_8f3a:toolu_03 mapped to refund R-2291; a dashed arrow runs
  from the key to the payments service.
caption: >-
  The checkpointer stores runs inside one thread; memory and the side effects' records live outside it. The key
  travels with the call, so the payments service can recognise a repeat.
