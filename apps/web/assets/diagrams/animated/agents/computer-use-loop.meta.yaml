title: The computer-use loop
alt: >-
  A loop of four boxes in five steps. First the harness sends a screenshot of 1280 by 800 pixels, 1,334 tokens, with
  the task to the model. The model answers with one action, a tool_use that says left_click at 812, 604 in screenshot
  pixels; this box is ringed. The harness and its virtual machine multiply the point by 2 to 1624, 1208 on the real
  screen, click and wait. A new screenshot goes back to the model, and the loop repeats. When the model answers with
  no tool call, the loop ends at a Done box. A line underneath reads: claim form, 9 actions plus 1 reply equals 10
  model calls, one screenshot each.
caption: >-
  The model never touches the screen. It sees pixels and answers with one action; the harness scales it, runs it and
  shows the model what happened.
tags: [agents, computer-use, genai]
