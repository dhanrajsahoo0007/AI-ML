title: Context isolation, three sub-agent windows and one lead window
alt: >-
  A layout in three steps with illustrative token counts; every bar is one 200,000-token context window on the same
  scale. Three green sub-agent rows each show a bar holding instructions (2,000), the task (1,000), history (12,000)
  and tool results of 60,000, 48,000 and 70,000 tokens, with the rest free. An arrow from each bar leads to a blue
  summary of 1,500 tokens. Dashed arrows carry the three summaries down to the lead agent, ringed in green, whose own
  bar holds only instructions (3,000), the task (500) and the three summaries (4,500): 8,000 tokens in all. A line
  under the bars says the three windows together hold 223,000 tokens while the lead reads 8,000.
caption: >-
  Each sub-agent spends its own window on the search; the lead reads 8,000 tokens of summaries instead of 223,000
  tokens of raw work (illustrative counts).
