title: The four tool-choice modes
alt: >-
  A table with four columns, one per tool-choice mode in the Claude Messages API, and three rows saying what the
  model may return. Under auto, ringed as the default when tools are sent, the model may answer in words, call zero,
  one or more tools, and call get_order if it picks it. Under any, which OpenAI calls "required", it may not answer
  in words, must call one or more tools, and calls get_order only if it picks it. Under tool with the name get_order,
  it may not answer in words or pick another tool, and always calls get_order, with no words before the call. Under
  none, the default when no tools are sent, it answers in words and calls no tool.
caption: >-
  Most agents run on auto; forcing a call trades the model's judgement for a guaranteed tool call.
tags: [agents, tool-use, function-calling, genai]
