title: Citation tracking, from a worker's note to a checked sentence
alt: >-
  A table built in four steps for the report on why Brightpost's kettle refunds are up. The first column holds blue
  notes from the workers, each with the id of its source: "Nov: 31 refunds, 620 sold" and "26 of 31: arrived cracked"
  from S1, the refund records; "Rule last edited in March" from S2, the help article "Damaged on arrival"; "7 reviews:
  cracked spout, thin box" from S3, a review site's kettle page. An arrow joins each note to the green sentence the lead
  wrote from it, such as "Refunds rose from 1.5 to 5.0 per 100 sold, cites S1". A fifth sentence, "The rise began with
  a new courier on 1 Nov", has no note. In the draft 1 column four lime cells say "supported" and the fifth, ringed and
  red, says "no source". In the last step a new note appears from S4, refunds joined to shipments: "24 of 26 cracked:
  new courier". The fifth sentence now cites it, and the draft 2 column shows all five sentences supported. A line under
  the table names the four sources.
caption: >-
  Sources travel with the claims: a note keeps its source id, a sentence names its notes, and a check reads the two
  together. The one sentence the lead inferred is the one that fails. Counts are illustrative.
tags: [agents, research, citations, genai]
