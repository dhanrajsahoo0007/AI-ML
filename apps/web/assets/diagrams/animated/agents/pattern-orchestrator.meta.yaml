title: "Orchestrator-workers, with the Brightpost task"
alt: >-
  A model call reads a message with two problems, a cracked kettle and a late mug order, and decides at run time which workers it needs (patternTile orchestrator): one worker for order 4471, one for order 4502 and one to search the help centre. A final model call writes one reply from the three results.
caption: "A lead call decides the sub-tasks at run time and merges the results."
