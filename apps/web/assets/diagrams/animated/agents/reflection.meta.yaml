title: Reflection on the Brightpost refund
alt: >-
  Three boxes in a row. A green "Draft 1" reply says "Your refund is done." An arrow leads to a lime "Critique",
  ringed as the subject, which says "Not done: £42 needs approval". Below the critique a blue tool result,
  "create_refund: pending approval", feeds it through an arrow labelled "feedback". An arrow labelled "revise" leads
  from the critique to a green "Draft 2", which says "A colleague approves it today." A dashed arrow labelled "store"
  runs from the critique to a violet "Lesson saved" box under Draft 2: "Over £30: say it needs approval".
caption: The critique is only as good as its signal; here a tool result contradicts the draft, and the lesson outlives the chat.
tags: [agents, reflection, genai]
source: original
