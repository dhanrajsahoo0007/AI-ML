title: "A summary tree: summaries of summaries for a long history"
alt: >-
  A tree built from the bottom up in five steps. At the bottom, 400 turns of one customer's support history in eight
  raw blocks of 50 turns, 6,000 illustrative tokens each. Level 1 has four 400-token summaries, each covering two
  blocks: turns 1 to 100, 101 to 200, 201 to 300 and 301 to 400. Level 2 has two 400-token summaries, turns 1 to 200
  and 201 to 400. At the top, one 400-token root summary covers all 400 turns. In the last step a ringed box shows the
  customer's turn 401, "what did the photo show?", with the note "look in turns 1 to 50": the agent follows the tree
  down to the raw block that holds the answer.
caption: >-
  Each block of turns passes through three summaries, not one per pass, and every level stays on disk, so the agent
  can read the root by default and climb down to the raw turns when a question needs a detail. Token counts are
  illustrative.
tags: [agents, memory, summarization, genai]
