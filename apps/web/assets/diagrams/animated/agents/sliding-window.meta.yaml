title: "Sliding window: the model sees only the last 8 messages"
alt: >-
  Four rows of numbered message cells for the Brightpost kettle chat, revealed one at a time, each row showing what
  the model sees when it writes a reply under a window of the last 8 messages. Customer messages are orange and
  assistant messages green; messages outside the window are pale. At turn 8 the model sees messages 1 to 7, all of
  them. At turn 10 it sees 2 to 9: message 1, with order number 4471, has fallen out, but message 2 still names 4471
  and the £42 price. At turn 12 it sees 4 to 11: the order number, the £42 price and the request to email rather than
  text are all outside the window. At turn 14 it sees 6 to 13: the turn that held the refund for approval is gone, and
  message 6, the white kettle at £44, is ringed in red. A red note says the customer asks for the confirmation, and
  the only price left in view is £44, for a kettle the customer never bought.
caption: >-
  The window slides right as the chat grows. By turn 14 the order number, the refund amount and the customer's
  "email, not text" have all fallen out, and the only price the model can see is the wrong one.
tags: [agents, memory, context-engineering, genai]
