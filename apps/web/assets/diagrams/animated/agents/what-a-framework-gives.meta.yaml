title: What an agent framework gives you, around your own loop
alt: >-
  An architecture diagram built in five steps, with your agent loop as the solid green accent in the centre. Step 1:
  the loop sends a tool call to a teal tools card on the left (by hand: schemas, calls), and the result comes back
  along a dashed line underneath. Step 2: a violet state card on the right (by hand: save and load) receives a
  checkpoint from the loop. Step 3: a grey retries card above the tools (by hand: backoff, keys) retries
  create_refund. Step 4: an orange human approval card under the state card (by hand: pause, resume) receives
  the £42 refund that waits, and sends "approve, resume" back to the loop. Step 5: a grey tracing card above the loop
  (by hand: spans, a viewer) receives spans from the loop.
caption: >-
  Every card round the loop is code you would otherwise write and maintain. The loop in the middle is the part you
  write either way.
