title: The three fences of an agent's sandbox
alt: >-
  A box labelled "Sandbox (container)" holds a teal card, "Agent's commands: run_tests, npm install", joined by a
  two-way "read, write" arrow to a violet card, "Repo copy: brightpost-orders". Three edges leave the commands, one per
  fence. Up and right, a red dashed edge labelled "read: denied" reaches a grey "Home folder" card holding ~/.ssh and
  ~/.aws. Straight right, "every connection" goes to a lime "Network proxy" with an allow-list; from it, "allowed"
  reaches a grey card "registry.npmjs.org, on the list", and a red dashed "blocked" edge reaches a red card
  "paste.example, not on the list". Down and right, "push, scoped token" goes to a lime "Git proxy" that holds the real
  token, which forwards with the real token to a grey "GitHub" card for branch fix/csv-last-line.
caption: >-
  Each fence covers what the others cannot: the file fence keeps secrets unread, the network fence keeps data from
  leaving, and the credential fence keeps the real token out of reach.
tags: [agents, harness, security, genai]
