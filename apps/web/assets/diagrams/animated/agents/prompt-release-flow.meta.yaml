title: A prompt release, from new version to rollback
alt: >-
  An architecture diagram built in seven steps. Step 1: a grey box, v13 drafted with new refund wording, is saved into
  a violet prompt registry whose prod label points at v12. Step 2: the registry sends v13 down to a lime offline gate,
  and a violet fixed evaluation set of 200 single-turn chats sends its cases in; v13 passes 187 of 200 against v12's
  184. Step 3: "pass" leads right to a grey canary box that sends 5 percent of chats, split by chat id, to v13. Step 4:
  live signals flow down to the canary gate, the solid lime accent, which compares v13 with v12 on live traffic. Step 5:
  the gate flags a red box, hand-offs to a person at 19 percent against 8 percent, on return visits. Step 6: "fail"
  runs up the right edge to a grey Roll back box, canary label back to v12 within 60 seconds, which moves the label in
  the registry. Step 7: a dashed line takes 20 new cases from the failing chats back into the fixed evaluation set.
caption: >-
  The offline gate passed v13 because its fixed set had no return visits; the canary gate caught the regression on
  live chats, and the rollback was a label move, not a deploy. Scores and canary counts are illustrative.
tags: [agents, prompts, versioning, evaluation, rollback, genai]
