title: "Vector memory: write a fact as a vector, recall the nearest for one customer"
alt: >-
  A figure revealed in five steps. Write, 12 Nov: the violet fact "4471: £42 refund approved" from customer 1847's chat goes into
  a pink embedding model, which writes a pink record into a violet memory store: the vector [0.12, −0.40, …, 0.07],
  1,536 numbers, with customer_id 1847. The record becomes a pink point, "refund", in a 2-D sketch of the store, labelled
  "nearer means more similar". The store also holds grey points for other customers' memories, one labelled 2210,
  and three more pink points for customer 1847: email, cracked and gift wrap. Read, 19 Nov: the orange message "Has
  my kettle refund gone through?" goes through the same embedding model and lands as an orange point among them. A
  grey filter, customer_id = 1847, is applied inside the search; a note says 2210 is nearer but is another customer's
  memory, so it is skipped. A dashed orange ring marks the nearest points, and a list gives customer 1847's top 3
  with their cosine similarity: "4471: £42 refund approved" 0.82 (highlighted), "kettle arrived cracked" 0.74 and
  "prefers email" 0.61. Gift wrap, 0.20, is not in the top 3.
caption: >-
  One model embeds both the memory and the message, and the customer filter runs inside the search. The nearest
  vector overall belongs to someone else. Cosines are illustrative; the positions are a 2-D sketch.
tags: [agents, memory, embeddings, vector-search, genai]
