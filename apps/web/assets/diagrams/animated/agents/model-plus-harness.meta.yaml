title: Agent = model + harness
alt: >-
  Two dotted groups side by side. On the left, "The model" holds three green boxes: "Reads the context" (only what it
  is shown), "Proposes a step" (a tool call or an answer), ringed as the model's one real decision, and "Says it is
  done" (a turn with no tool call). On the right, "The harness" holds eight boxes in two columns: Context (what it
  sees), Tools (what it can do, teal), Sandbox (where actions run), State (what it keeps, violet), Verification (is
  the work right?, lime), Guardrails (what it must not do, lime), Budgets (when to stop) and Observability (what it
  did). Between the groups, an arrow labelled "context" points from the harness to the model, and an arrow labelled
  "proposal" points from the model to the harness.
caption: The model reads and proposes; the eight parts of the harness decide what it sees, what runs and what counts as done.
