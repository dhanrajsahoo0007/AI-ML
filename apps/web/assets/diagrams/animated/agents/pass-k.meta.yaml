title: pass@k and pass^k for one to eight runs of a task
alt: >-
  Two bar charts side by side for an agent that passes a task on 70 % of runs, with k, the number of runs of the same
  task, from 1 to 8 along the bottom. The left chart, pass@k, asks whether at least one of k runs passes: its bars
  climb from 0.700 at k = 1 to 0.910, 0.973, 0.992 at k = 4, 0.998, 0.999 and then about 1 at k = 7 and 8. The right
  chart, pass^k, asks whether all k runs pass: its bars fall from 0.700 to 0.490, 0.343, 0.240 at k = 4 (ringed),
  0.168, 0.118, 0.082 and 0.058 at k = 8. A dashed line marks 1.0 across both charts.
caption: >-
  Same agent, same 70 % per run. Give it four tries and it almost always passes once (0.992); ask it to pass four
  times in a row and it manages that only 24 % of the time.
