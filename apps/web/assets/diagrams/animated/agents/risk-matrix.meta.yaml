title: Risk matrix, the Brightpost tools placed by undo and impact
alt: >-
  A grid in four steps. Columns are small impact if wrong, large impact if wrong, and out of policy; rows are actions
  that can be undone or change nothing, and actions that cannot be undone. An arrow along the bottom says impact grows
  to the right; an arrow down the left says actions get harder to undo. Step 1: the top-left cell, Run, nothing to
  undo, holds get_order for order 4471 and search_help. Step 2: two Notify cells. The top-middle one, runs and a person
  can undo it, holds none of the four tools; the bottom-left one, runs, logged, loss accepted, holds send_email to the
  customer and create_refund up to £30. Step 3: the bottom-middle cell, Ask, pauses for a person, holds the ringed
  call create_refund for order 4471, £42.00, which the support agent approves before it runs. Step 4: the right
  column, Forbid, code refuses at any size, holds a refund on order 5122, a stranger's order, and a refund for more
  than was paid.
caption: >-
  Most calls should run. Only the cell that is both final and costly waits for a person, and some calls no person
  should be asked about: code refuses them.
tags: [agents, human-in-the-loop, approvals, guardrails, genai]
