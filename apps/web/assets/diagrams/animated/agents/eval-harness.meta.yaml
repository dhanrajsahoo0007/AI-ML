title: The evaluation harness for an agent
alt: >-
  An architecture diagram built in seven steps. A runner loads every task from a versioned eval dataset (tasks and
  their goal states) and the agent version under test (its prompt, tools and model). It runs each task k times inside
  a sandbox that holds a simulated user and mock tools, and stores every run's trace: the steps, tool calls, cost and
  time. Three graders read the traces: an outcome grader (does the end state match the goal?), a trajectory grader
  (tools, order, policy) and a calibrated model judge with a rubric. Their scores go to the release gate, the solid
  lime accent, which asks whether the version beats the baseline. If not, someone reads the failures and a dashed
  line takes the next version back to the start. If so, the version ships to production, where monitoring and sampled
  review turn new failures into new tasks in the dataset.
caption: >-
  The agent never grades itself: a runner replays fixed tasks in a sandbox, graders read the traces, and a gate decides
  what ships.
