title: Resolving a prompt label at runtime, from cache hit to fallback
alt: >-
  An architecture diagram built in six steps. Step 1: an orange refund chat for order 4471, in the canary arm, reaches
  a grey worker, which asks the SDK prompt cache, the solid violet accent below it, for the canary prompt. Step 2: the
  cache answers with v13 from memory, the worker sends v13 rendered to a green model on the right and logs v13 and its
  hash in a violet trace store on the left. Step 3: after the 60 second TTL a dashed refresh line runs from the cache
  to a violet prompt registry while the cache keeps serving its copy. Step 4: a grey Roll back box under the registry
  moves the canary label to v12. Step 5: the next refresh brings v12 back from the registry to the cache. Step 6: on a
  cold start with the registry down, a red dashed fetch fails over the top, and a grey fallback copy of v12 shipped in
  the image, under the cache, feeds the cache instead.
caption: >-
  On a cache hit the worker makes no network call; the rollback reaches it on the next background refresh, about one
  60 s TTL later, and a cold start with the registry down still gets v12 from the fallback copy.
tags: [agents, prompts, versioning, caching, rollback, genai]
