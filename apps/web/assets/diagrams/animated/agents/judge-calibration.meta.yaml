title: A model judge checked against a person on 50 runs
alt: >-
  A two-by-two grid of 50 graded runs of the Brightpost support agent, with illustrative counts. The columns are the
  person's label, fail or pass; the rows are the model judge's verdict. Both say fail on 16 runs and both say pass on
  27, drawn in lime. The judge failed 2 runs the person passed (false alarms, grey) and passed 5 runs the person failed
  (missed failures, red and ringed). Under the grid: 21 failures and 29 passes. Three boxes on the right give the
  arithmetic: agreement 86 %, because 16 + 27 = 43 of 50 agree; failures caught 76 %, 16 of 21; Cohen's kappa 0.71,
  the agreement beyond chance.
caption: >-
  86 % agreement sounds good, but the judge passed 5 of the 21 runs a person failed. Check failures caught, not only
  agreement.
tags: [agents, evaluation, llm-as-judge, genai]
