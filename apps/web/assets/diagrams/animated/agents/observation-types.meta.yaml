title: One button, three observations
alt: >-
  Three columns, revealed one at a time, show the same courier claim form at claims.swiftline.example. Column 1,
  "Screenshot: 1,334 tokens": a drawing of the form with the fields Tracking number, Damage type and Claim value in
  pounds, and a Submit claim button in teal; underneath, the agent acts with "click 812, 604", by pixels. Column 2,
  "Accessibility tree: about 600 tokens": six lines, such as heading "New claim" ref e3, textbox "Tracking number" ref
  e5, combobox "Damage type" ref e7, textbox "Claim value" ref e9, the ringed line button "Submit claim" ref e12, and
  link "Cancel" ref e13; underneath, "click e12", by ref, where the browser finds the element. Column 3, "DOM: about
  15,000 tokens": a fragment of raw HTML with a header div, a script tag, the form, two inputs with short class names,
  a listbox div, the button with class "btn js-s" and the text Submit claim in teal, and an ad slot; underneath, "click
  button.js-s", by selector.
caption: >-
  The same button three ways. The tree names it with a role and a ref at a fraction of the DOM's size; the screenshot
  is all the model gets on a canvas or a desktop app. Tree and DOM token counts are illustrative.
tags: [agents, computer-use, browser-agents, genai]
