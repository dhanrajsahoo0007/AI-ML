title: "A context reset: a fresh window started from a handoff note"
alt: >-
  Three parts revealed one at a time, drawn to an illustrative budget of 32,000 tokens. First, session 1 of the
  bug-fix coding agent at step 9: 24,000 tokens, 75 percent, holding instructions, tool definitions, the task, files
  6,400, history 4,000 and tool results 9,800. Second, before the reset session 1 writes a 600-token note, HANDOFF.md,
  and commits; the note has four sections: done (last line fixed, 18 tests pass), decisions (loop bound less than n;
  empty input returns an empty list), open debt (CRLF line endings not handled) and next (add a CRLF test first).
  Third, session 2 starts with a fresh window of 4,400 tokens, 14 percent: instructions 2,000, tool definitions 1,500,
  the ringed handoff note 600 and the new task 300. Its first actions are to read HANDOFF.md and the git log and to run
  the 18 tests.
caption: >-
  A reset throws the whole window away and keeps only what was written down. The note is a few hundred tokens; the git
  history and the tests hold the rest. Token counts are illustrative.
tags: [agents, context-engineering, compaction, genai]
