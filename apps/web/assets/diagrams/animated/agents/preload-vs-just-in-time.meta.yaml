title: Preloading against just-in-time retrieval
alt: >-
  A layout in two steps comparing two ways to get help-centre knowledge into the context window, over two turns of
  the Brightpost conversation. On the kettle refund turn, the preload row shows the builder searching the customer's
  message, five blue chunks of 2,000 tokens, then one green model call that writes the reply: 1 call, 1.8 seconds. The
  just-in-time row shows a green model call that picks a tool, a teal call search_help("damaged item refund") with the
  model's own query, three blue chunks of 1,200 tokens, then a second model call: 2 calls, 3.3 seconds. On the
  "Thanks, that's all" turn, preload again adds five chunks of 2,000 tokens, ringed and marked "not needed", while just
  in time fetches nothing and makes one call. A line at the bottom totals both turns: preload 2 calls and 4,000 chunk
  tokens, just in time 3 calls and 1,200 chunk tokens; the times are illustrative.
caption: >-
  Preloading pays tokens on every turn and saves a round trip; just in time pays a round trip and loads only what the
  model asks for (illustrative times).
tags: [agents, context, retrieval, genai]
