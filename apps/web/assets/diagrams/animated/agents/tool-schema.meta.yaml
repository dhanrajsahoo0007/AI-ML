title: A tool definition's parts and what they cost
alt: >-
  A diagram of the get_order tool definition in three rows. The name row holds "get_order", which the model uses to
  name the call it writes. The description row, ringed, reads "Look up one of the signed-in customer's orders by its
  number. Returns item, price, date, status." and tells the model when to pick the tool; it is the part the model reads
  most. The input_schema row holds "order_id: string, required", the arguments to fill in, typed so the app can check
  them. Below, a stacked bar shows what every request carries before the conversation starts: a 286-token tool-use
  prompt for Claude Opus 5.5, from the Claude documentation, and four tool definitions of 80, 90, 110 and 130 tokens,
  which are illustrative, 696 tokens in all. Over five model calls that is 3,480 input tokens for the tools alone.
caption: >-
  The description does most of the work, and every definition rides along on every request, used or not.
tags: [agents, tool-use, function-calling, context, genai]
