title: Memory against RAG on the Brightpost support agent
alt: >-
  A diagram revealed in three steps, with two dotted panels side by side above one green Support agent box. Each panel
  has the same read half: a violet store with a "search" arrow down to a blue box of retrieved text, which feeds the
  agent. In the left panel, "RAG: the help centre", blue Help articles written by staff go through a grey Indexing job
  that runs offline when articles change, labelled "embed + store", into a Help-centre index shared by every customer;
  the retrieved passage is "Damaged on arrival". In the right panel, "Memory: this customer", an orange "This chat" box
  feeds, via "extract", the highlighted green Memory writer, which is the agent after every chat; it writes "add,
  update, drop" into a Memory store for customer 1847 only, and the recalled memories are "prefers email" and "4471:
  £42 refund approved". A dashed arrow loops from the support agent back up to This chat, so the memory side is a loop
  while the RAG side runs one way.
caption: >-
  The read half is the same. RAG's store is written ahead of time by people, for everyone; memory's store is written
  by the agent itself, after every chat, for one customer.
tags: [agents, memory, rag, genai]
