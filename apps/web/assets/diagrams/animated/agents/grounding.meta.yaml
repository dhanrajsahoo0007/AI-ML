title: Grounding, from intent to coordinates
alt: >-
  A four-step figure. On the left, the model's intent, "Submit the claim", points at the Submit claim button inside a
  screenshot drawn to scale, 1280 by 800 pixels. Dashed guides from the left and bottom edges mark the button's centre
  at y 604 and x 812, and the model's action, the ringed box "left_click 812, 604", is in screenshot pixels. The
  harness divides by 0.5 to click 1624, 1208 on the 2560 by 1600 display; a note says the full-size screenshot would
  be 5,336 tokens, over the 4,784 limit. In the last step a red cookie banner at the top of the screenshot pushes the
  page down 88 pixels, and a red box says the click lands 88 pixels above the button: nothing happens, so the agent
  must check before going on.
caption: >-
  The model's answer is a point in the screenshot it saw. The harness scales it to the real screen, and the point is
  only right while the page has not moved.
tags: [agents, computer-use, genai]
