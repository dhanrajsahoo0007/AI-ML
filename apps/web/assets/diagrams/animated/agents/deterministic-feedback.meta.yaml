title: Deterministic feedback after every edit
alt: >-
  A green model box proposes step 3, a teal edit to src/parser.ts that changes the loop bound from less than n minus 1
  to less than n. The edit goes into a group labelled "Run by the harness", where three lime checks run one after
  another: 1 Linter, 0 problems in 1 second, which catches style and unused code; 2 Type check, 0 errors in 4 seconds,
  which catches wrong shapes and nulls; 3 Tests, ringed, 17 passed and 1 failed in 6 seconds, which catches wrong
  behaviour. The tests lead to a blue message, "1 failed: parses an empty file", with "src/parser.ts:14, Error: empty
  input has no lines". A dashed arrow takes the message back to the model.
caption: >-
  The harness runs the checks, not the model, and only one short message goes back. Run times are illustrative.
