title: Resume from the last checkpoint
alt: >-
  Two timeline rows, revealed one at a time. First run: grey cells Round 1 and Round 2 (checks pass), a violet
  Checkpoint (commit and log), Round 3 and Round 4 (checks pass), a second violet Checkpoint, ringed, and a red Round
  5 that crashes. Resumed run: a dashed arrow leads down from the second checkpoint to a violet "Load state, from round
  4", followed by a grey "Round 5, again".
caption: >-
  Save state after every round that passes its checks. A crash then costs one round, not the whole run. The run is
  illustrative.
