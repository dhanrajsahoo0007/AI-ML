title: "Parallelization, with the Brightpost task"
alt: >-
  Three calls run at the same time on the same message (patternTile parallel): one drafts the reply, one screens the message for injected instructions and one checks the refund rules. Code combines the three results; the reply is sent only if both checks pass.
caption: "Independent calls run at once; code combines them."
