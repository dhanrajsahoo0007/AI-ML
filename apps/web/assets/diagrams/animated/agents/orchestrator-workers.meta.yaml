title: Orchestrator-workers, a lead agent with three workers and a reviewer
alt: >-
  An architecture diagram built in five steps. Brightpost's support manager asks a lead agent, drawn as the solid
  green accent, "Why are kettle refunds up this month?". The lead splits the question into three sub-questions and
  starts three worker agents, plain green cards with a robot glyph: one reads refund records, one searches the help
  centre with search_help, one reads customer reviews. The workers run at the same time and each sends a short summary
  to a blue Findings box of claims and sources, which goes back to the lead along the top. The lead writes a draft and
  sends it to a lime reviewer, which returns a gap: one claim has no source. Once the gap is closed the reviewer passes
  the report back to the manager.
caption: >-
  The lead plans and writes; workers search in parallel and send back short summaries; a reviewer checks every claim
  before the report goes out.
tags: [agents, multi-agent, genai]
