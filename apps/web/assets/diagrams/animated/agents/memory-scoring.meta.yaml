title: Scoring three memories on recency, importance and relevance
alt: >-
  A table revealed in five steps under today's message, "Has my kettle refund gone through? Text me from now on, not
  email." Three violet rows are stored memories: "4471: £42 refund approved" (episodic), "prefers email" (semantic)
  and "asked about gift wrap" (episodic). Lime cells, shaded by value, give each a raw and a scaled score. Recency,
  0.995 to the power of the hours since last use: 168 hours gives 0.43, scaled to 0.53; 720 hours gives 0.03, scaled
  to 0; 48 hours gives 0.79, scaled to 1. Importance, an LLM rating from 1 to 10: 7, 5 and 2, scaled to 1, 0.60 and 0.
  Relevance, cosine similarity to the message: 0.82, 0.61 and 0.20, scaled to 1, 0.66 and 0. The score column sums
  the three: 2.53 (highlighted), 1.26 and 1.00. A context window with room for two memories then holds "4471: £42
  refund approved" and "prefers email"; a note says gift wrap, 1.00, was left out: recent, but trivial.
caption: >-
  Each term is scaled to 0–1 across the candidates and the three are added. The newest memory loses: recency alone
  cannot make a trivial memory relevant.
