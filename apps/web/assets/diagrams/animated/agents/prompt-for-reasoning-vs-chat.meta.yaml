title: The same agent's prompt, written for a chat model and for a reasoning model
alt: >-
  Two columns of six rows, built in four steps, for the Brightpost refund agent. The left column, "Written for a chat
  model", lists the old prompt in the order it is sent: role and goal, 40 tokens, "You are Brightpost support. Help
  the customer"; a step-by-step recipe, 220 tokens, "1. get_order 2. search_help 3. decide 4. …"; "Think step by
  step", 30 tokens, "Write your reasoning in thinking tags"; three worked conversations, 540 tokens, in green; rules,
  60 tokens, "Refunds over £30 wait for a support agent"; and format, 20 tokens, "Plain text, under 80 words". It
  totals 910 tokens. An arrow on each row leads to the right column, "Written for a reasoning model", and is labelled
  with what happened. Sharpen: goal and what done means, 60 tokens, "Resolve the request: refund or a clear no, by
  email". Replace, the ringed row in lime: success criteria, 70 tokens, "Before replying: amount = order, policy cited,
  email sent". To the API: "effort: medium", a request parameter, not words in the prompt. Cut: no examples to start,
  add one only if the format drifts. Keep: rules, 70 tokens, now also "Only the customer's own orders". Keep: format,
  20 tokens. The new prompt totals 220 tokens, and the model plans the steps itself. Token counts are illustrative.
caption: >-
  Keep what only you know (the goal, the rules, the format), replace the steps with what done looks like, and set
  depth in the API call, not in words. Counts illustrative.
tags: [agents, prompt-engineering, reasoning-models, genai]
