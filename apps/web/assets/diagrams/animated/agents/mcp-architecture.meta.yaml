title: MCP architecture, one host with one client per server
alt: >-
  An architecture diagram built in five steps. A customer writes to the host, Brightpost's chat service, drawn as the
  solid accent; only the host talks to the model. Inside the host application sit three MCP clients, one for each of
  three MCP servers in a teal zone below: an orders server exposing get_order and create_refund, reached over stdio
  because it runs on the same machine; a help centre server exposing search_help and help articles; and an email
  server exposing send_email and message templates, both reached over HTTP. In step 3 each client asks its server
  for its tools with tools/list, and the host sends the messages and all four tools to the model. In step 4 the model
  asks for get_order; the host checks the call and the orders client sends tools/call to the orders server, which
  returns the result. In step 5 the host reads a help article from the help centre server with resources/read and adds
  it to the model's context. The model sees tool definitions, never the servers, and no server sees another.
caption: >-
  The host owns the conversation and the model; each server sees only its own client's requests.
tags: [agents, mcp, tool-use, architecture, genai]
