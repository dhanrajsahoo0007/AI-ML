title: Plan-and-execute on the Brightpost refund
alt: >-
  A diagram revealed in five steps. A green planner writes a three-step plan, drawn as violet rows: 1, look up order
  4471; 2, search "kettle refund"; 3, refund £42 if allowed. A green executor then runs one row at a time, and a
  status cell appears beside each row. Step 1 returns "kettle, £42" in lime. Step 2 returns "no match" in red, and a
  dashed arrow labelled "re-plan" runs from that failure back to the planner, which adds a new row 2′: search
  "damaged item refund", which finds the article "Damaged on arrival". Finally step 3 runs, its status reads "waits
  for approval", and a lime review box asks whether the goal is met.
caption: The plan is data the harness can read, change and resume; a failed step changes the plan, not the whole run.
tags: [agents, planning, genai]
