title: An issue, the agent's patch, and the hidden tests that decide
alt: >-
  A figure in five steps. Left, under "What the agent gets": an orange box, "Issue text: drops the last line of a CSV",
  and a grey box, "Repo at the base commit, the fix's test held back". Both point to a green box, "Agent and its
  harness, any scaffold, any tools", which produces a green "Patch, a diff to src/parser.ts". The patch goes into a
  dotted lime group, "Grader: hidden from the agent": a fresh container applies the patch and adds the tests, then runs
  two lime sets, "FAIL_TO_PASS: keeps the last line, must now pass" and "PASS_TO_PASS: the other 17, must still pass".
  Below, two patches for the same task. Patch A, the first edit only, leads to a red, ringed "Not resolved: parses an
  empty file fails (PASS_TO_PASS)". Patch B, both edits, leads to a lime "Resolved: 1 + 17 = 18 tests pass". At the
  bottom: score = tasks resolved divided by 500 tasks on SWE-bench Verified.
caption: >-
  The agent never sees the tests that grade it. A patch that fixes the issue but breaks one old test scores zero
  for the task.
tags: [agents, coding-agents, evaluation, genai]
