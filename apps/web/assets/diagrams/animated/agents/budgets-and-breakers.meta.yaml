title: Budgets and a circuit breaker
alt: >-
  Two parts, revealed in three steps. Step 1, under the heading "The bug-fix run, checked before every turn": three
  horizontal meters. Turns: 6 of 20, 30 per cent filled in lime. Tokens: 24,000 of 32,000, 75 per cent. Time: 2 of 10
  minutes, 20 per cent. Step 2, under "Variant run: the second fix fails the same way, turn after turn": three red
  boxes in a row, each reading "parses an empty file", labelled turn 6, 1 of 3; turn 7, 2 of 3; turn 8, 3 of 3. Step
  3: an arrow to a ringed red box, "Breaker trips: 3 of 3, same fingerprint", and below it an orange box, "Stop, ask a
  person: state saved, 12 turns unspent".
caption: >-
  Budgets cap how much a loop may spend; the breaker stops it early when more turns would only repeat the same
  failure. The turn cap and the time are illustrative.
tags: [agents, loops, reliability, genai]
