title: "A rolling summary: old turns are folded into a running summary"
alt: >-
  Five bars, revealed one at a time, show the history a Brightpost support agent sends with each model call during a
  40-turn support thread, drawn to one scale of 120 illustrative tokens per turn. At turn 25 the history is turns 1 to
  15 (1,800 tokens) and turns 16 to 25 (1,200), 3,000 tokens, and a tick marks the rule: fold at 25 raw turns. After
  pass 1, turns 1 to 15 are replaced by a ringed 300-token summary, S1, leaving 1,500 tokens. At turn 40 the history is
  S1, turns 16 to 30 (1,800) and turns 31 to 40 (1,200), 3,300 tokens, and the rule fires again. After pass 2, S1 and
  turns 16 to 30 are replaced by a ringed 350-token summary, S2, leaving 1,550 tokens. The last bar shows all 40 turns
  without a summary, 4,800 tokens.
caption: >-
  Each pass folds the oldest block of turns, and the previous summary, into a new summary. At turn 40 the model reads
  1,550 tokens of history instead of 4,800. Token counts are illustrative.
tags: [agents, memory, summarization, genai]
