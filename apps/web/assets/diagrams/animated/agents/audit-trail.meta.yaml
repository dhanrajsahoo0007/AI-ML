title: Audit trail, the record of one Brightpost approval
alt: >-
  Four groups of fields, filled in over four steps. Request: run run_8f3a in thread th_5e08, tool call toolu_03,
  create_refund for order 4471 at £42.00, and the idempotency key run_8f3a:toolu_03. Evidence shown: the order, a
  kettle at £42 delivered 12 Nov; the help rule found, Damaged on arrival; the model's reason, cracked so a full
  refund; and the rule that held the call, refund over £30, with its id refund-over-limit. Decision: the support agent
  sa_31, ringed; asked at 10:14 and decided at 10:20, six minutes; the decision, approve; and no edits to the call.
  Outcome: checkpoint cp_4 saved, refund R-2291 as the create_refund result, and a note that it ran once, with the same
  key on any retry. A line underneath says the log is append-only with one record per decision, and that 10:14 and
  sa_31 are illustrative.
caption: >-
  One record answers the four questions an auditor asks: what the agent wanted to do, what the person saw, who decided
  and when, and what actually happened.
tags: [agents, human-in-the-loop, approvals, observability, genai]
source: original
