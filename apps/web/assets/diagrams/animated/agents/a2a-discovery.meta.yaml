title: Discovery, fetching and reading an agent card
alt: >-
  A diagram revealed in four steps. On the left, a green box for Brightpost's support agent, the A2A client, sends GET
  to https://swiftline.example/.well-known/agent-card.json and gets 200 OK with a cache lifetime of 3,600 seconds. In
  the middle, the courier's agent card is drawn as six blue rows: name and description (Swiftline claims agent);
  skills (damage-claim, File a damage claim), which is ringed; supportedInterfaces (JSONRPC 1.0 at
  agents.swiftline.example); capabilities (streaming and push notifications); securitySchemes (OAuth 2.0 client
  credentials); and signatures (a JWS signed by Swiftline). Step 2 adds notes for the first two rows: is this the
  right agent, and pick the skill to ask for. Step 3 adds: where to send and which binding, and stream or give a
  webhook. Step 4 adds an arrow from the security row to Swiftline's sign-in server, which issues a token with the
  claims:write scope, and a lime box: verify the signature against Swiftline's key.
caption: >-
  One GET tells the client everything it needs before the first task: what the agent does, where to send, what it
  supports and how to sign in. The skills row decides whether to call at all.
tags: [agents, a2a, multi-agent, genai]
