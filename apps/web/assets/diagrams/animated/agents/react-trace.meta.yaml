title: A ReAct trace of the Brightpost refund
alt: >-
  A trace in five rows, revealed one row at a time, under the column headings Thought, Action and Observation. Row 1:
  the thought "I need the order first", the tool call get_order(4471), the result "Kettle, £42, delivered 12 Nov".
  Row 2: "What is the rule for damage?", search_help("damaged item refund"), "Damaged on arrival: full refund". Row 3:
  "Damaged, in time: refund £42", create_refund(4471, 42.00), "Approved 10:20, refund R-2291". Row 4: "Confirm it in
  writing", send_email(customer, "Your refund"), "Email sent". Row 5, spanning all three columns: the answer, "Your
  £42 refund for order 4471 is on its way." Thoughts and the answer are green, tool calls teal and results blue.
caption: Each loop is one thought, one tool call and one result; the loop ends on the first turn with no tool call.
tags: [agents, react, genai]
source: original
