title: Deterministic against model-graded exit criteria
alt: >-
  Two columns, revealed one at a time. Left, "Deterministic check": a blue box, npm test output (18 passed, exit code
  0), an arrow to a lime box, "Exit code is 0" (a script, no model), and an arrow to a lime verdict, "18 passed: met"
  (or not met, nothing else). Under it four grey properties: same answer on every run; seconds, no tokens; checks
  only what the tests encode; fooled by weakened tests. Right, "Model-graded check": a blue box, the transcript and
  summary (what the agent has shown so far), an arrow to a lime "Evaluator model" whose goal is that the summary names
  the empty-file case, and an arrow to a lime verdict, "Met, not yet, or impossible", with a short reason. Under it:
  can differ from run to run; costs tokens on every turn; judges what code cannot; and, ringed, sees only what the
  transcript shows.
caption: >-
  An exit code cannot be argued with, but it checks only what the tests encode. An evaluator model can judge prose,
  but only from what the agent chose to show it.
tags: [agents, loops, evaluation, genai]
