title: "Tool discovery: every definition up front against a search that loads three"
alt: >-
  A diagram built in four steps for the coding agent connected to five MCP servers. Row one, up front: the agent's
  four own tools, 1,500 tokens, GitHub with 35 tools and 26,000 tokens, Slack with 11 tools and 21,000, and Sentry
  with two more servers, 12 tools and 8,000, all in the context window on every call: 56,500 tokens. Row two, behind
  tool search: at step 2 the window holds only the four own tools and the search tool, 1,500 tokens, while the five
  servers' definitions are sent with the request but not loaded. At step 3 the model runs a regex tool search for
  github.*(issue|pull), and the search returns three tool references, names only, ringed. At step 4 the API expands
  them into three full definitions in the window: github_get_issue, github_add_issue_comment and
  github_create_pull_request. In the window: 1,500 plus 3 times 743 is 3,729 tokens, against 56,500. Server sizes are
  Anthropic's from November 2025; the per-tool size is GitHub's average and illustrative.
caption: >-
  Deferred definitions still travel with every request, but the model only reads the few a search returns. Server
  sizes from Anthropic; per-tool size illustrative.
tags: [agents, mcp, tool-use, context-engineering, genai]
