title: "Compaction: the window fills, is summarised, and the work goes on"
alt: >-
  Four stacked bars drawn to the same illustrative budget of 32,000 tokens, revealed one at a time, for the bug-fix
  coding agent. Step 1 uses 3,800 tokens, 12 percent: instructions 2,000, tool definitions 1,500 and the task 300.
  Step 9 uses 24,000 tokens, 75 percent: the same 3,800 plus files 6,400, history 4,000 and tool results 9,800, and a
  tick marks the harness's trigger at 24,000. After compaction the window holds 8,500 tokens, 27 percent: the same
  3,800, a ringed 1,500-token summary in place of the history and tool results, and the file being edited, 3,200.
  After the follow-up task it holds 15,800 tokens, 49 percent: the summary, both files again (6,400), new history
  1,500 and new tool results 2,600.
caption: >-
  Compaction keeps the instructions and the task word for word and swaps 20,200 tokens of files, history and tool
  results for a 1,500-token summary and the file in hand. Token counts are illustrative.
tags: [agents, context-engineering, compaction, genai]
