title: "Prompt chaining, with the Brightpost task"
alt: >-
  Three model calls run in a fixed order with a code check between them (patternTile chaining). The customer's message goes to a model call that finds the order number; a check asks whether a number was found, and if not, a canned reply asks for it. Otherwise a second call drafts the reply and a third polishes the wording before the reply is sent.
caption: "A fixed order of calls, with a check in code between steps."
