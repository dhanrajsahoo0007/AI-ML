title: An A2A task's life, from submitted to completed
alt: >-
  A state diagram revealed in five steps, following Brightpost's damage claim at the courier's agent. Every A2A task
  state is drawn from the start, each with its exact name: Submitted and Working; Input required and Auth required,
  marked as interrupted states where the task waits for the client; and a group of terminal states, Completed,
  Failed, Canceled and Rejected. In step 1 Brightpost's agent sends SendMessage and the task is submitted. In step 2
  it moves to Working, and the courier's agent checks parcel SL-88213 with its own tools. In step 3 an arrow goes down
  to Input required, which is ringed, with the request "Send a photo of the damage". In step 4 an arrow goes back up
  to Working: the photo arrives as a file part on the same task id. In step 5 the task reaches Completed, and an
  artifact, claim CLM-5190 for £42, goes back to Brightpost's agent.
caption: >-
  Input required is a pause, not a failure: the client answers on the same task and work resumes. The four terminal
  states are final; a follow-up becomes a new task in the same context.
tags: [agents, a2a, multi-agent, genai]
