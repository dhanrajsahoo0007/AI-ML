title: Permission tiers for an agent
alt: >-
  Three columns, each a tier, then the tools in it, then the gate in front of them. Left: "Read freely", which
  changes nothing; search and read_file, for example reading src/parser.ts; the gate is "Runs at once", no check
  needed. Middle: "Write with a check", undo with git; edit_file and run_tests, for example editing src/parser.ts;
  the gate is a lime box, "Runs, then checked" by tests, lint and types. Right: "Act outside with approval", hard
  or impossible to undo; merge, deploy and email, for example merging the fix; the gate is an orange box, ringed,
  "Waits for a person" who approves or refuses. An arrow along the bottom reads "harder to undo, so less freedom".
caption: The harder an action is to undo, the more the harness stands between the proposal and the action.
tags: [agents, harness, security, genai]
