title: A mixed agent architecture
alt: >-
  An architecture diagram built in five steps. A customer's message goes to a green router that sorts the request.
  Simple FAQs take a prompt chain (retrieve, answer, check) straight to the reply. Known multi-step tasks take a grey
  workflow of fixed steps in code to the reply. Open-ended tasks take the ReAct agent, drawn as the solid green
  accent, which works in a loop with tools and a budget. In the last step a lime evaluator checks the agent's answer
  against the criteria: on a pass it goes to the reply, on a fail a dashed arrow sends it back to the agent to retry.
caption: Only the open-ended share of traffic pays for an agent loop; everything else takes a cheaper, fixed path.
tags: [agents, workflows, genai]
