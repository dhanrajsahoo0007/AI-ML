title: Errors compound, the chance that every step of a run succeeds
alt: >-
  A line chart in three steps. The horizontal axis is n, the number of steps in a row, from 0 to 20; the vertical axis
  is the chance that all n steps succeed, from 0 to 1.0, with dashed guides at 1.0 and 0.5. The heading reads "Chance
  that a run of n steps has no failed step = p to the n". Step 1: a dashed curve for 95 per cent per step falls from 1.0;
  a point at 10 steps reads 0.95 to the 10th = 0.599. Step 2: the same curve reaches 0.358 at 20 steps, a ringed point
  labelled "95 % per step, 0.95 to the 20th = 0.358". Step 3: a solid curve for 99 per cent per step falls much more
  slowly and ends at 0.818 at 20 steps, labelled "99 % per step, 0.99 to the 20th = 0.818".
caption: >-
  A step that works 95 % of the time sounds reliable, but a 20-step run then finishes cleanly only about one time in
  three. Moving each step to 99 % lifts the same run to 0.818.
