title: Four multi-agent topologies, supervisor, pipeline, peers and hierarchy
alt: >-
  Four small diagrams in a two-by-two grid, every node an agent drawn as a green box of the same size. Supervisor: one
  supervisor agent with arrows down to an orders agent, a refunds agent and an email agent; it delegates and merges.
  Pipeline: a triage agent, an orders agent and a refunds agent in a row, each handing on to the next in a fixed
  order. Peers: a drafter, a critic and a fact-checker joined to each other by plain lines, talking directly with no
  boss. Hierarchy: a lead over a research lead and a writing lead; the research lead directs two searchers and the
  writing lead a writer. Coordinating agents are darker green, workers and peers paler.
caption: >-
  The same agents, wired four ways: who may talk to whom decides how errors travel and who owns the answer.
