title: The verification ladder
alt: >-
  Four checks stacked top to bottom, revealed one at a time, with an arrow down the left labelled "more cost". 1
  Schema and format: certain, instant, free. 2 Tests, lint, types: certain, seconds, cheap. 3 A reviewer model:
  judgement, costs tokens. 4 A person, in orange and ringed: judgement, costs attention. Work moves down only when it
  passes. From every check a dashed arrow labelled "fail" goes right to one tall green model box that reads the
  error and tries again. Passing the last check leads to "Accepted".
caption: >-
  Cheap, certain checks run on everything; costly judgement runs only on what got past them, and every failure goes
  back to the model as an error.
