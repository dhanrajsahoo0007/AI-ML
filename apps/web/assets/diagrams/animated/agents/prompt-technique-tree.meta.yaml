title: Pick the cheapest prompting technique that fits
alt: >-
  A decision tree that starts from an orange "New task" box and asks four questions down the left, each with a Yes
  arrow to the right and a No arrow down to the next question. "Clear, single-step task?" Yes leads to zero-shot with
  a precise format. "Needs a specific style or label set?" Yes leads to few-shot examples. "Multi-step reasoning?" Yes
  leads to chain-of-thought, plus self-consistency if accuracy-critical. "Needs external facts or actions?" Yes leads
  to the highlighted teal box, ReAct with tools or RAG, and No leads to prompt chaining with structured outputs. Every
  technique has an arrow into one tall lime box on the right: evaluate on a labeled set.
caption: >-
  Ask the questions in order and stop at the first Yes: each step down costs more tokens or calls. Whichever technique
  you land on, the labeled evaluation set decides whether it worked.
