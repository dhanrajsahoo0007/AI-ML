title: MCP transports, stdio for a local server and Streamable HTTP for a remote one
alt: >-
  An architecture diagram built in three steps. Inside a zone labelled one machine sit the host, Brightpost's chat
  service, and two MCP clients. In step 1 the host starts the orders server as its own child process on the same
  machine, and the orders client talks to it over the server's standard input and output, one JSON message per line,
  in both directions. In step 2 the second client sends a message to the help centre server, which runs as a remote
  service in its own zone, as an HTTP POST to a single URL ending in /mcp. In step 3 the help centre server replies on
  the same request, shown as a dashed arrow, either with one JSON object or with an event stream for that request.
caption: >-
  Same JSON-RPC messages, two ways to carry them: a child process's standard streams on one machine, or one HTTPS
  POST per message across the network.
