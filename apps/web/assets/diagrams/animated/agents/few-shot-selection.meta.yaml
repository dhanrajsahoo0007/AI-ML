title: Bootstrapping demonstrations, only passing traces become examples
alt: >-
  A three-column diagram built in three steps. Step 1: five orange training chats are listed on the left: t1, a
  cracked kettle at £42; t2, a late toaster at £18; t3, "Did R-2291 go through?"; t4, a broken iron at £36; and t5, a
  kettle and a mug where one is cracked. On the right, a dotted group labelled "Compiled prompt" holds only a neutral
  cell, "Instructions (v12)". Step 2: arrows lead from each chat to a verdict on the teacher's reply. t1, t2 and t3 pass,
  in lime cells. t4 fails in a red cell because the reply said the refund was "on its way" too soon, and t5 fails in a
  red cell because the reply refunded both items. Step 3: arrows copy the three passing traces into the compiled prompt
  as blue cells: "Demo 1: t1, kettle", ringed, then "Demo 2: t2, toaster" and "Demo 3: t3, return visit". A note under
  the group reads "up to 4 bootstrapped, 16 in total".
caption: >-
  The metric is the filter: a trace becomes an example only if the reply already passes. The chats are illustrative;
  the limits are DSPy's defaults.
tags: [agents, prompt-optimization, dspy, few-shot, genai]
