title: One refund at three effort levels
alt: >-
  Three rows, one per effort level, for the same Brightpost refund, built in four steps. Each row has a bar drawn to
  scale of the run's output tokens, green for thinking and grey for tool-call arguments and the reply, then the
  number of tool calls, whether the policy was checked, and the output cost and extra wait. Medium, the default on
  Claude Opus 5.5: 920 thinking plus 400 visible = 1,320 output tokens, 4 tool calls, policy checked with the article
  cited, $0.0264 and 9.2 seconds of extra wait. High: 2,600 thinking plus 430 visible = 3,030 tokens, 4 tool calls,
  policy checked, $0.0606 and 26 seconds. Low: 300 thinking plus 380 visible = 680 tokens, 3 tool calls, and a ringed
  red cell saying the policy was not checked because it skipped search_help; $0.0136 and 3 seconds. A key says cost
  is at $20 per million output tokens, Claude Opus 5.5's list price, and wait is thinking tokens divided by 100 tokens
  per second; tokens and speed are illustrative. The last line says medium and high give the same £42 refund, and high
  costs 2.3 times as much and waits 16.8 seconds longer.
caption: >-
  Effort is a dial on thinking, not on the answer: high buys nothing on a routine refund, and low saves money by
  skipping a step. Tokens, speed and the low-effort skip are illustrative; the price is Claude Opus 5.5's.
