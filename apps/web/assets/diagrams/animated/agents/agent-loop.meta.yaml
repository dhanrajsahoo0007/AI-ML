title: The agent loop, one Brightpost refund step by step
alt: >-
  An architecture diagram built in seven steps. A signed-in customer, number 1847, writes to Brightpost's chat
  service, the harness: "My kettle arrived cracked. It's order 4471. Can I get my money back?". The harness sends the
  messages and the definitions of four tools to the model, drawn as the solid green accent. The model answers with a
  tool call instead of words; the harness runs get_order for order 4471 and sends the result back to the model. The
  model then asks for search_help, which returns the refund rule for damaged items. Next the model asks to refund
  £42; because that is over £30, the harness saves the run state and asks the support agent to approve. The support
  agent approves at 10:20, and the harness runs create_refund for £42.00. Finally the model asks for send_email to
  confirm the refund, then answers without a tool call, so the harness sends the reply to the customer and the loop
  ends. The tools sit in a teal zone on the right; the model never calls them directly.
caption: >-
  The model only ever asks; the harness does every call, keeps the run's state and stops for a person when the
  refund is over £30.
