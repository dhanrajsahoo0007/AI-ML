title: "Interleaved thinking: the model thinks between tool calls, and the blocks travel with the run"
alt: >-
  A trace of the Brightpost refund in five rows, revealed one row at a time, under the headings Thinking, Tool call
  and Result. Row 1: green thinking "I need the order first", 420 tokens, then the tool call get_order(4471), then
  the result "Kettle, £42, delivered 12 Nov". Row 2: thinking "What is the rule for damage?", 180 tokens, then
  search_help("damaged item refund"), then "Damaged on arrival: full refund". Row 3: thinking "Damaged, in time:
  refund £42", 260 tokens, then create_refund(4471, 42.00), then "Approved 10:20, refund R-2291". Under row 3 a
  ringed violet band says the run is paused for approval and saved with its thinking blocks unchanged; resumed at
  10:20, request 4 resends blocks 1 to 3 exactly as received. Row 4: an empty box, "No thinking block, skipped, 0
  tokens", then send_email(customer, "Your refund"), then "Email sent". Row 5: thinking "Done: tell the customer",
  60 tokens, then the reply "Your £42 refund for order 4471 is on its way." Thinking token counts are illustrative.
caption: >-
  The model reasons about each result before its next call, and skips thinking where there is nothing to decide.
  Every thinking block goes back to the API unchanged, even after a pause. Token counts illustrative.
tags: [agents, reasoning-models, thinking, tool-use, genai]
