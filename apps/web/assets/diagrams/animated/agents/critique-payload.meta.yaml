title: What a useful critique contains
alt: >-
  Two panels show the evaluator's round-1 critique of the bug fix. On the left, in red, a vague critique: "Some tests
  fail. Please be more careful." A note under it says it has no test name, no error and no next step, so the
  generator has to guess. On the right, "Useful: six fields", one row per field: criterion "C2: All 18 tests pass" and
  verdict "fail: 3 of 4 met" in lime; evidence, ringed, in blue: 1 failed, "parses an empty file", with the error
  "empty input has no lines"; where: src/parser.ts, empty input, before the loop; suggested fix in green: return []
  for empty input; and keep: C1, C3 and C4 pass, so do not undo the loop bound fix.
caption: >-
  A critique the generator can act on names the criterion, shows evidence it can reproduce, points to the place,
  suggests a fix and says what must not break.
tags: [agents, evaluation, genai]
