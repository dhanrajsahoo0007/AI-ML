title: "Memory decay: recency falls every hour unless the memory is used"
alt: >-
  A line chart of recency, 0.995 to the power of the hours since a memory was last used, from 20 Oct to 26 Nov,
  revealed in three steps. Step 1: the violet curve for "prefers email", last used on 20 Oct, starts at 1 and falls,
  with marks at 1 day (0.89), 7 days (0.43) and 30 days (0.03). Step 2: two more violet curves start at 1 from their
  own last use, "refund 4471" on 12 Nov and "gift wrap" (dashed) on 17 Nov. A dashed orange line marks 19 Nov, the day
  of the customer's new message, and a table row gives the values that day: prefers email 0.03 after 720 hours, refund
  4471 0.43 after 168 hours, gift wrap 0.79 after 48 hours. Step 3: the refund memory is recalled on 19 Nov, jumps
  back to 1 (highlighted) and decays again; gift wrap, not recalled, keeps falling; "prefers email" is superseded on
  19 Nov. A second row gives the values on 26 Nov: refund 4471 0.43, recalled 168 hours ago; gift wrap 0.34 after
  216 hours; prefers email superseded.
caption: >-
  Recency is a clock that every recall resets. A memory nobody uses fades to almost nothing in a month, and one that
  keeps being useful stays fresh. Decay factor from Generative Agents (Park et al., 2023); dates illustrative.
