title: Function calling, one Brightpost tool call round trip
alt: >-
  A sequence diagram in five steps with three lanes: the model, Brightpost's chat service and the get_order tool. A
  note shows the customer writing that the kettle from order 4471 arrived cracked. In step 1 the chat service sends the
  model the message and the definitions of four tools. In step 2 the model replies with a tool call, get_order for
  order 4471. In step 3 the chat service checks the call, adds the
  signed-in customer, number 1847, and runs get_order, which returns a kettle, £42, delivered 12 Nov. In step 4 the
  chat service sends the whole conversation again with the tool result. In step 5 the model reads the result and asks
  for its next tool, search_help; a note says the loop repeats until a reply contains no tool call.
caption: >-
  The model only writes the call; the app checks it, runs it and sends the result back in the next request.
tags: [agents, tool-use, function-calling, genai]
