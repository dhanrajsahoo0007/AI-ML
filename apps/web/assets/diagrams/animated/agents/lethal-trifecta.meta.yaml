title: The lethal trifecta
alt: >-
  Three overlapping circle outlines. The violet circle, top left, is private data: get_order reads customers' orders
  and addresses. The blue circle, top right, is untrusted content: pasted notes and product reviews that anyone can
  write. The teal circle, at the bottom, is a way to send data out: send_email can write to any address. Where all
  three circles overlap sits a green box, ringed as the subject, for the Brightpost agent, labelled "has all three".
caption: >-
  The Brightpost agent sits where all three overlap, so an injected note can read a customer's data and email it out.
  Take away any one circle and that path closes.
tags: [agents, security, genai]
