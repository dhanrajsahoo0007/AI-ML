title: A simulated user tests the Brightpost agent
alt: >-
  A sequence diagram with four lanes, built in five steps: Simulated user, Agent, Sandbox tools and Grader. A note
  gives the persona's script: a refund for order 4471, and give the order number only if asked. The simulated user
  opens with "my kettle arrived cracked, refund?" and no order number. The agent asks "which order is it?" and the
  persona answers "order 4471". The agent calls get_order(4471) against the sandbox, which returns "kettle, £42, 12
  Nov", then search_help("damaged item refund"), which returns "Damaged on arrival": full refund. It calls
  create_refund(4471, 42.00); a note says the mock approver says yes, and the sandbox returns "approved, R-2291". It
  calls send_email and gets "sent", then tells the persona "£42 refund on its way". The persona's goal is met, so it
  says thanks and ends the chat. Finally the grader reads the sandbox's end state, "1 refund, £42, order 4471", sees
  that it equals the goal, and marks the run a pass.
caption: >-
  A model plays the customer from a script; the grader ignores the chat and checks what changed in the sandbox.
tags: [agents, evaluation, genai]
