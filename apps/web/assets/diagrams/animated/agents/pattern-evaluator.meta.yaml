title: "Evaluator-optimizer, with the Brightpost task"
alt: >-
  One model call drafts the reply and a second checks it against the refund policy (patternTile evaluator). If the check fails, its feedback goes back to the drafter along a dashed arrow and the loop repeats; when it passes, the reply is sent.
caption: "A second call grades the draft and sends feedback until it passes."
