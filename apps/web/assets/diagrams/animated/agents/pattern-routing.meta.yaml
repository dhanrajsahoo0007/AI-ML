title: "Routing, with the Brightpost task"
alt: >-
  One model call sorts each request, then code sends it down one of three paths (patternTile routing): an order question is answered from order data by a model call, a refund request goes to the refund workflow, and a complaint is handed to a person. All three paths end in a reply.
caption: "One call sorts the request; code picks the path."
