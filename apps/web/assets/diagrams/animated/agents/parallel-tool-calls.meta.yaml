title: Two tool calls, one after the other or both at once
alt: >-
  A timeline in two steps, with a time axis from 0 to 4 seconds. In the first row the Brightpost agent asks for its two
  lookups one after the other: model call 1 asks for get_order and takes 1.5 seconds, the tool takes 0.3 seconds,
  model call 2 asks for search_help and takes another 1.5 seconds, and that tool takes 0.3 seconds, so the next model
  call starts at 3.6 seconds. In the second row one model call of 1.5 seconds asks for both lookups at once, the app
  runs get_order and search_help at the same time for 0.3 seconds, and the next model call starts at 1.8 seconds. A
  note says the saving is 3.6 minus 1.8, or 1.8 seconds, and the whole refund drops from 8.7 to 6.9 seconds. All times
  are illustrative.
caption: >-
  Independent lookups in one response cost one model call and one tool wait instead of two of each.
tags: [agents, tool-use, parallel-tool-calls, latency, genai]
