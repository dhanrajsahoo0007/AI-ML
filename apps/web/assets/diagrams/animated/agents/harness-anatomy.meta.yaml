title: The anatomy of a harness
alt: >-
  An architecture diagram built in eight steps on a three-by-three grid, with the model as the solid green accent in
  the centre. Step 1: context assembly (instructions, task, files) on the left sends the context to the model. Step
  2: a teal tool layer on the right (search, read, edit, test) receives the model's tool call, and the result goes
  back to context assembly. Step 3: the call runs in a sandbox (a container with a copy of the repo) below the tool
  layer. Step 4: the sandbox's output goes to a lime verification box (tests, lint, types) at the bottom centre
  before anything goes back. Step 5: what passes is saved in a violet state box (plan, progress, diffs), which feeds
  progress back to context assembly; a failure goes back as an error along a dashed line. Step 6: a lime guardrails
  box (permissions, approval) appears above the tool layer, and the model's proposals now pass through it before they
  reach a tool. Step 7: a budgets box (steps, tokens, time) above context assembly decides whether the next turn
  starts. Step 8: an observability box above the model records a trace of every call and its cost.
caption: >-
  The model is one box in the middle; every other box is harness code that decides what it sees, what runs and
  what counts as done.
tags: [agents, harness, genai]
