title: A test-driven agent loop
alt: >-
  Three rows, one per loop round, under the headings Act, Check and Decide, revealed in five steps. Round 0: the tool
  call run_tests(), run by the harness first; the check fails in red, "1 failed: keeps the last line"; the decision is "Not
  met: go on", because the bug is real. Round 1: the edit changing the loop bound from less than n minus 1 to less than
  n, then run_tests(); the check still fails in red, but on a different test, "1 failed: parses an empty file"; the
  ringed decision is "Not met: go on", because a new failure counts as progress. Round 2: the edit "return [] for
  empty input", then run_tests(); the check passes in lime, "18 passed, lint and types clean"; the decision is "Met:
  stop", and the loop opens a pull request.
caption: >-
  The loop reads every check result before it decides. A different failure means the last edit moved the code
  forward; only a passing suite ends the loop.
tags: [agents, loops, coding-agents, genai]
