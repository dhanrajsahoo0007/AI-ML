title: Hand-offs, the Brightpost refund passed from triage to orders to refunds
alt: >-
  A sequence diagram in five steps with five lanes: the customer, a triage agent, an orders agent, a refunds agent and
  the support agent, a person. The customer writes that the kettle in order 4471 arrived cracked. The triage agent
  classifies the intent as a damaged-item refund and hands off to the orders agent with a short summary, not the
  transcript. The orders agent calls get_order(4471), reads "kettle, £42, 12 Nov", and hands off to the refunds agent.
  The refunds agent calls search_help("damaged item refund"), which returns "Damaged on arrival": full refund, then
  asks for create_refund(4471, 42.00). Because £42 is over £30, the run is saved and the support agent is asked to
  approve, while the customer is told a person will check. The support agent approves at 10:20; the refund R-2291 is
  created, send_email confirms it, and the customer hears that the £42 refund is on its way.
caption: >-
  Each specialist owns its own tools; a hand-off passes a short summary and the ids, and the £30 rule still stops the
  run for a person.
tags: [agents, multi-agent, genai]
