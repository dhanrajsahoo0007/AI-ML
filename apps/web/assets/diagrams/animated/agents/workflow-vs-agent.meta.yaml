title: A workflow against an agent on the Brightpost refund
alt: >-
  Two panels with the same customer message and the same four tools. In the left panel, titled "Workflow: your code
  picks each step", the message flows straight down through get_order, search_help, create_refund and send_email to
  the reply, a fixed path that is the same for every message. In the right panel, titled "Agent: the model picks
  each step", the message goes to the model, which has an arrow to each of the four tools; a dashed arrow labelled
  "result" returns from the tools to the model, and an arrow labelled "no tool call" leads from the model to the
  reply.
caption: Same task, same tools. In a workflow your code fixes the order; in an agent the model chooses it, one turn at a time.
tags: [agents, workflows, genai]
