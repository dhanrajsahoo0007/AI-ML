title: One experiment record, what went in and what came out
alt: >-
  A three-step figure. Step 1, a grey wide box at the top reading Run r-0187, one record per training run, written when
  it ends. Step 2, under the heading What went in, five boxes: grey Parameters, LoRA rank 16 and 3 epochs; blue Data
  version, tickets-v3 with 5,000 tickets; grey Code commit, a3f9c1e, train.py; blue Prompt version p12; and grey Base
  model m6 with its revision pinned. Step 3, under the heading What came out, a lime Metrics box, 184 of 200 equals 92
  percent pass, and a violet Artefacts box, model m7 and the evaluation report, joined by an arrow from the inputs,
  with a note that the floor is 85 percent and all values are illustrative.
caption: >-
  A run is reproducible only if its record holds every input that can move the result. Values are illustrative.
tags: [experiment-tracking, mlflow, reproducibility, llmops, genai]
