title: The two numbers users feel
alt: >-
  Two large boxes side by side. The teal box on the left is Time to first token, 400 ms, how long the screen stays
  blank. Three teal boxes hang under it with arrows: queue wait, prompt length of 2,200 tokens to read, and cache hits
  that skip part of prefill. The green box on the right is Tokens per second, 227 tokens per second, which is 1,000 ms
  divided by 4.4 ms per token. Three green boxes hang under it: batch size, model size, and memory speed. A line of
  arithmetic below says end to end equals 400 plus 249 times 4.4 ms, about 1,500 ms. A grey box at the bottom warns not
  to confuse tokens per second with engine throughput: throughput adds up every request on a GPU, tokens per second is
  one reader's speed, and bigger batches raise one and lower the other.
caption: >-
  Time to first token is the wait; tokens per second is the flow. Different parts of the system move each one, so alert
  on them separately. The per-token time is Brightpost's target, not a measurement.
tags: [ttft, tokens-per-second, latency, monitoring, llmops, genai]
