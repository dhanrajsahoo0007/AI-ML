title: Registry lifecycle, four stages and aliases
alt: >-
  A four-step figure. Step 1, four violet boxes in a row joined by arrows: Registered, version 7 linked to its run;
  Staging, offline gate passed; Production, serves live traffic; and Archived, kept for audit. Step 2 adds three lime
  approval boxes under the arrows: an offline gate of 170 of 200 to pass with the model card filled, a canary and
  sign-off by an owner and a risk reviewer, and retirement once the successor is live and baked. Step 3 adds a note
  that in MLflow stages are deprecated since version 2.9.0 and aliases replace them, three green version boxes, version
  5 archived, version 6 live and version 7 the candidate model m7, and two grey alias boxes: champion pointing by a
  dashed arrow at version 6, and challenger pointing at version 7. Step 4 adds a solid arrow from champion to version 7
  with the note promote by repointing champion to version 7.
caption: >-
  A version moves through four stages with an approval at each step. In current MLflow the stage is an alias that you
  repoint, and rolling back means pointing it back. Version numbers are invented.
tags: [model-registry, governance, mlflow, aliases, llmops, genai]
