title: Brightpost's LLM dashboard in four rows
alt: >-
  A four-step figure of a dashboard with one row per step, each row a coloured label box and three tiles. Step 1,
  Traffic, in orange: 2.3 requests a second on average, a peak of 12 requests a second, and 200,000 requests a day.
  Step 2, Latency, in teal: a time to first token p95 target of 400 milliseconds, a full-answer target of 1,500
  milliseconds, and an illustrative decode speed of 227 tokens a second. Step 3, Quality, in lime: a 90 percent pass
  rate on 200 graded answers a week, an 85 percent floor, and a 95 percent range of plus or minus 4 points. Step 4,
  Cost, in grey: 440 million input and 50 million output tokens a day, 1,380 dollars a day at illustrative list
  prices, and 0.0069 dollars a request. Under each row a line says what that row teaches.
caption: >-
  Four rows answer four questions in order. The quality row is the one HTTP status codes cannot show. Prices are
  illustrative.
tags: [dashboards, observability, slo, llmops, genai]
