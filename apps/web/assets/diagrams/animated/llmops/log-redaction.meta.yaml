title: Redact before you store
alt: >-
  A flow along the top: an orange box, Prompt and answer, raw text held in memory only, sends raw text to a lime
  Redactor box, ringed as the highlight, which sends placeholders to a violet Trace store box with 30-day retention.
  Below is a four-row table for one made-up support ticket. The email address sam@example.com is stored as EMAIL_1,
  found by a pattern. The card number 4242 4242 4242 4242 is stored as CARD_1, found by a pattern plus a check-digit
  test. The customer name Sam Jones is stored as NAME_1, found by a name-finder model. The order number 4471 is kept as
  it is, because it is on an allow list. A last line says token counts, timings, versions and a hash of the question are
  also stored, and the raw text never is.
caption: >-
  Redaction happens before the write, so the store never holds the raw text. Match what you keep to what an engineer
  needs: the order number stays, the customer's name and card do not. Values are made up.
tags: [logging, pii, redaction, privacy, llmops, genai]
