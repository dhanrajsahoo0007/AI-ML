title: Spend split by tag, from total to one request
alt: >-
  A four-level tree. At the top, a grey box, All model spend, 1,579 dollars a day. Below it three grey team boxes:
  Support assistant 1,380 dollars a day, Catalogue writer 112, and Labs prototypes 87. An arrow from the total to the
  support box is labelled tag: team. Under the teams, four blue feature boxes: Order questions 828 dollars a day and
  Returns and refunds 552 under support, Product descriptions 112 under the catalogue writer, and Prompt experiments 87
  under labs; the arrow to Order questions is labelled tag: feature. Under Returns and refunds, an orange ringed box,
  One request, 0.0069 dollars, 2,200 tokens in and 250 out, is reached by an arrow labelled request ID. A grey box
  beside it lists the tags the gateway stamps on every request: team, feature, env and request_id. A line at the bottom
  shows the sums: 828 plus 552 is 1,380, and 1,380 plus 112 plus 87 is 1,579.
caption: >-
  Every number is the sum of the level below it, and every level is a tag. If a request arrives without its tags, its
  cost lands in no box. Prices are illustrative.
tags: [cost, attribution, tags, showback, llmops, genai]
