title: What changes from MLOps to LLMOps
alt: >-
  A two-column comparison of classic MLOps in grey and LLMOps in green over five rows. What sets behaviour: trained
  weights, against a prompt, data, tools and a model that is often not yours. How you test: accuracy on a labelled set,
  against rubrics, judges and people on a golden set of 200 tickets. What drifts: input features and labels, against
  queries, documents and the model, which a provider can change under one name. What costs money: training and hosting,
  against tokens on every request, 440 million in and 50 million out a day. What you release: a model file, against a
  bundle of prompt, model and config, each versioned and rolled out by canary.
caption: >-
  The loop is the same; the things inside it differ. Behaviour comes from more places, correctness is graded rather than
  counted, and cost is paid per token.
tags: [mlops, llmops, comparison, brightpost, genai]
