title: One request, four token classes
alt: >-
  A table with four rows for one request that used reasoning. Columns: token class, token count, the Anthropic usage
  field, the OpenAI usage field, and cost. Uncached input, orange, 1,200 tokens: Anthropic input_tokens, which excludes
  the cache; OpenAI input_tokens minus cached_tokens, 2,200 minus 1,000; 0.0024 dollars. Cached input, violet, 1,000
  tokens: Anthropic cache_read_input_tokens; OpenAI input_tokens_details.cached_tokens; 0.0002 dollars. Visible output,
  green, 250 tokens: output_tokens minus thinking_tokens for Anthropic, output_tokens minus reasoning_tokens for
  OpenAI, 310 minus 60; 0.0025 dollars. Reasoning output, green and ringed, 60 tokens, inside output_tokens 310:
  Anthropic output_tokens_details.thinking_tokens, OpenAI output_tokens_details.reasoning_tokens; 0.0006 dollars.
  Footer lines give the total, 2,510 tokens and 0.0057 dollars at illustrative prices, and the OpenTelemetry
  equivalents, input 2,200 including the cache and output 310 including reasoning.
caption: >-
  The same request is reported differently by each provider: Anthropic's input_tokens leaves the cache out, OpenAI's
  includes it. Reasoning tokens are billed as output. Normalise to one meaning before you chart or price anything.
  Prices are illustrative.
