title: Two runs side by side with computed deltas
alt: >-
  A three-step table with a label column and three value columns: run r-0187 with prompt p12, run r-0188 with prompt
  p13, and Delta. Step 1 shows the two rows of inputs: the prompt changed from p12 to p13, and the data version
  tickets-v3 and base model m6 are the same. Step 2 adds four metric rows. Golden-set pass rate is 184 of 200, 92
  percent, against 164 of 200, 82 percent, a delta of minus 10 points shown in red. Refund-limit cases are 12 of 12 in
  both, a delta of 0. Output tokens per answer rise from 250 to 290, plus 40 or plus 16 percent. Cost per answer rises
  from 0.0069 to 0.0073 dollars, plus 0.0004 or 6 percent, at illustrative prices. Step 3 adds a note: the 95 percent
  ranges are plus or minus 3.8 and 5.3 points, so the gap's own range is plus or minus 6.5, and a 10-point gap is
  larger, so the drop is real.
caption: >-
  Compare runs on the same data, base model and golden set, compute the deltas, and check the gap against the noise.
  Counts and prices are illustrative.
