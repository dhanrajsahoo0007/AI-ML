title: A registry entry for an API-based model
alt: >-
  A three-step figure. Step 1, a grey header box, Registry entry brightpost-support, version 42, above five boxes: a
  green Provider model, pinned snapshot id; a blue Prompt p12; a grey Config, temperature 0 and 400 tokens; blue Tool
  schemas t8; and a lime Guardrails g5. Step 2 adds two boxes: a green Pinned box, provider-model-2026-09-01, same
  weights until you move it on purpose, and a red Alias box, provider-model-latest, which the provider moves so answers
  change, with a note that the registry entry still says version 42 and nobody approved the new snapshot. Step 3 adds
  three boxes: a lime Evaluation of 184 of 200 against an 85 percent floor, a grey Approval by owner and risk sign-off,
  and a green Fallback, a second snapshot tested the same way.
caption: >-
  When the model is a provider's API, the registry entry is the bundle of parts around it. Pin a dated snapshot and
  keep the evaluation, approval and fallback with it. Provider ids are invented.
tags: [model-registry, api-models, versioning, governance, llmops, genai]
