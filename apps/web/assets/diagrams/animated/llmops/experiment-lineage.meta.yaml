title: Lineage of a candidate model, inputs to score
alt: >-
  A five-step figure drawn left to right. Step 1, three inputs on the left: a blue dataset tickets-v3 with 5,000
  resolved tickets, a blue prompt p12, and a grey base model m6. Step 2, arrows lead from all three into a teal box,
  Run r-0187, commit a3f9c1e. Step 3, an arrow leads to a green box, Model m7, adapter weights. Step 4, an arrow leads
  to a lime box, Score 184 of 200, 92 percent against an 85 percent floor, with a blue Golden set of 200 fixed tickets
  also feeding it. Step 5 adds a second row below with a new blue prompt p13 feeding a teal Run r-0188 and a green
  Model m8, which leads to a red Score 164 of 200, 82 percent, under the floor; only the prompt differs from the first
  row.
caption: >-
  Because every hop is recorded, a worse score points at the one input that changed. Counts are illustrative.
tags: [experiment-tracking, lineage, versioning, llmops, genai]
