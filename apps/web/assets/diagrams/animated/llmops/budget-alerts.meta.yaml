title: A monthly budget with alerts
alt: >-
  A three-step figure with a growing set of budget meters for one support key, with a monthly budget of 45,000 dollars.
  Dashed lines mark alerts at 50 percent, 22,500 dollars, and 80 percent, 36,000 dollars, and a cap line sits at 45,000.
  Step 1, day 10: a green bar of 13,800 dollars, about a third of the budget; the note says the month is on pace, with a
  forecast of 41,400 dollars, 92 percent. Step 2, day 22: the bar is 36,360 dollars, green with a red 6,000 dollar
  segment labelled loop, just past the 80 percent line; the note says the 80 percent alert fires on day 22 with 8 days
  left and a run-rate forecast would have fired a day earlier. Step 3, day 24: the bar is 45,120 dollars, with a red loop
  segment of 12,000 dollars and a small red part 120 dollars past the cap; the note says a hard cap blocks the key at
  45,000 dollars.
caption: >-
  Percentage thresholds fire after the money is gone. A forecast of the month at the current run-rate fires earlier, and
  a hard cap stops the rest. Amounts are illustrative.
tags: [budget, alerts, cost, forecast, llmops, genai]
