title: "Four places an LLM system drifts"
alt: >-
  A grid of four columns in three steps. The columns are Inputs in orange, Outputs in green, the Provider's model in
  neutral grey and Knowledge in blue. Step 1 says what moves in each: the topics and phrasing of questions, the length and
  tone of answers, the weights behind a model name the vendor updates, and the policies and index. Step 2 gives a
  Brightpost example for each: gift-card questions rising from 5 to 21 percent of tickets, the average answer growing
  from 250 to an illustrative 330 tokens, an alias moving so that the pass rate falls from 90 to an illustrative 84
  percent, and a returns window that is cut while the index still quotes the old one. Step 3 says how to notice each: PSI
  on the intent mix and embedding distance, length and refusal rate and judge score over time, a weekly golden-set run
  with the model version in every trace, and stale-article and grounding checks.
caption: >-
  Drift is not one thing. Inputs, outputs, the provider's model and the knowledge each move for a different reason and
  need a different detector. Examples other than the intent shares are illustrative.
tags: [drift, monitoring, llmops, genai]
