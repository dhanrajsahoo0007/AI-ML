title: Head sampling against tail sampling
alt: >-
  Two horizontal stacked bars show how many of a day's 200,000 Brightpost traces are kept. The top bar, head sampling
  with the coin tossed at the first span at 1 percent, is short: a sliver of red for 40 slow or failed traces and a blue
  block of 1,960 ordinary traces, 2,000 kept in all. The bottom bar, tail sampling that decides when the trace is
  complete, is nearly three times as long: a red block of all 4,000 slow or failed traces and the same blue block of
  1,960 ordinary traces, 5,960 kept. Notes say head sampling keeps 1 percent of the slow or failed traces and needs no
  buffer, while tail sampling keeps 100 times as many of the ones you want but makes the collector hold every trace until
  it ends. The slow or failed share of 2 percent is illustrative.
caption: >-
  The coin at the first span cannot know the outcome, so it drops most failures. Tail sampling keeps every slow or failed
  trace for about three times the storage, and pays with a buffer. The 2 percent share is illustrative.
