title: The cheapest request is not always the cheapest ticket
alt: >-
  A three-step figure comparing option A, a large model, with option B, a model a tenth of the price. Step 1 adds a row
  of two green bars for cost per request: A is 0.0069 dollars and B is 0.00069 dollars, ten times shorter. Step 2 adds a
  row for cost per resolved ticket: A is 0.0158 dollars and B is 0.0020 dollars, still about eight times cheaper. Step 3
  adds a row for cost per ticket counting the people who finish the tickets the assistant cannot. A is 1.21 dollars, of
  which people are 1.20, and B is 1.80 dollars, of which people are 1.80; the green model part is a sliver in both. A red
  note says the small model costs 49 percent more per ticket. A line at the bottom gives the assumptions: 125,000
  tickets a day, A resolves 70 percent, B 55 percent, and a person costs 4 dollars per ticket.
caption: >-
  A model that is ten times cheaper per request but resolves fewer tickets hands more work to people, and people cost far
  more than tokens. All the inputs are illustrative; the lesson is to divide by outcomes. Each row has its own scale.
tags: [cost, unit-economics, cost-per-outcome, llmops, genai]
