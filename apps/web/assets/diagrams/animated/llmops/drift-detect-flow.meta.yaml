title: "A drift check: window, statistic, alert, refresh"
alt: >-
  A three-step figure. Step 1 shows four boxes joined by arrows: a blue Window comparing this week against a baseline, a
  lime Statistic computing PSI on the intent mix, a red Alert when PSI reaches 0.25, and a green Refresh of the evaluation
  set, with a short note under each. Step 2 shows a table of Brightpost's five intents with baseline and this-week
  shares: refunds 40 to 28 percent, delivery 25 to 24, product questions 20 to 18, account 10 to 9, and other, which is
  gift cards, 5 to 21 percent in red. Each row has its PSI term, 0.0428, 0.0004, 0.0021, 0.0011 and 0.2296, and the sum is
  0.276, with the working for the other row. Step 3 shows a scale from 0 to 0.4 in three bands, stable under 0.10 in lime,
  watch from 0.10 to 0.25 in grey, and alert at 0.25 or more in red, with a red marker at 0.276 in the alert band.
caption: >-
  PSI adds up how far each bin's share has moved; one bin, the new gift-card topic, supplies 83 percent of Brightpost's
  0.276. The shares are illustrative; the sum is computed.
tags: [drift, psi, monitoring, evaluation, genai]
