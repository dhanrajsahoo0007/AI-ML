title: "Embedding drift: this month's questions against the baseline"
alt: >-
  A two-dimensional scatter of question embeddings in three steps, all in pink. Step 1 shows fourteen pale pink dots, last
  quarter's questions, forming one cluster inside a dashed ring that reaches the farthest of them. Step 2 adds fourteen
  solid pink dots for this month: eight fall inside the old region and six form a new cluster far to the right, labelled
  gift cards, outside the ring. Step 3 marks the centre of each cloud and draws a dashed arrow between them, noting that
  the centre moved 126 pixels, 1.9 times the ring's radius, and that 7 of the 14 new points sit outside the ring. The points are illustrative and the real space has
  1,536 dimensions.
caption: >-
  Embeddings show drift that a count of topics can miss: a new cluster of questions pulls the centre of the cloud away
  from the baseline. The 2-D points are illustrative.
tags: [drift, embeddings, monitoring, genai]
