title: "A silent model update: an alias moves, a pinned version does not"
alt: >-
  A line chart in three steps of weekly golden-set pass counts out of 200 over twelve weeks, for two deployments of the
  same provider's model. Step 1, weeks 1 to 6: both deployments score about 180, inside a noise band of 175.5 to 184.5, so
  one grey line is drawn. Step 2, week 7: the provider repoints the alias, and the red alias line falls to about 168 and
  stays there, while the grey pinned-version line stays at about 180. Step 3 says the drop is 12 cases, 6 points, outside
  the band of plus or minus 4.5 cases, so the next weekly run raises an alert, and that a pinned version only changes
  when the team moves it, after its own evaluation. All counts are illustrative.
caption: >-
  A model name that the provider can repoint changes your system without a deploy; a pinned version does not. A weekly
  golden-set run with a noise band is what notices. Pass counts are illustrative.
tags: [drift, model-updates, versioning, monitoring, genai]
