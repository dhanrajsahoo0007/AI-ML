title: A model card for Brightpost's model m7
alt: >-
  A three-step grid of nine boxes in three rows, the sections of a model card. Step 1, three grey boxes: Model details,
  m7 fine-tuned from m6 in November 2026; Intended use, answer help questions and draft refunds; and Factors, ticket
  type, language and order value. Step 2, a lime Metrics box, pass rate and refund-limit cases, and two blue boxes,
  Evaluation data, the 200-ticket golden set, and Training data, tickets-v3 with 5,000 resolved tickets. Step 3, a lime
  Quantitative analyses box, 184 of 200 equals 92 percent split by ticket type, and two grey boxes, Ethical
  considerations, tickets hold personal data, and Caveats and recommendations, refunds over 30 pounds need approval. A
  note says the section names follow Mitchell and colleagues, 2019, and the entries are illustrative.
caption: >-
  The nine model-card sections, filled in for one Brightpost model. The section names come from the 2019 paper; the
  entries are illustrative.
tags: [model-card, governance, documentation, llmops, genai]
