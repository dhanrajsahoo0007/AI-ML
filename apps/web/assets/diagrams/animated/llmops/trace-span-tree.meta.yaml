title: One Brightpost request as a trace
alt: >-
  A waterfall chart of one request, with a time axis in milliseconds from 0 to 1,695. The top row is the root span,
  brightpost.request, a grey bar across the whole 1,695 ms. Below it, indented, five child spans run one after another.
  A grey gateway span takes 15 ms. A violet cache lookup takes 20 ms and misses. A blue retrieval span takes 100 ms and
  returns 5 chunks. A large green model call, ringed as the highlight, takes 1,500 ms, with 2,200 tokens in and 250
  out. A lime guardrail span takes 60 ms and passes. A dashed lime line at 535 ms marks the first token the customer sees.
  A caption line says the model call is 88.5 percent of the request.
caption: >-
  A trace is a tree of timed spans. Read it from the top: the model call is nearly nine tenths of the time, so that is
  where a slow request will usually be slow. Only the model call is Brightpost's measured target; the other timings are
  illustrative.
tags: [tracing, spans, opentelemetry, waterfall, llmops, genai]
