title: The mean hides the tail
alt: >-
  A bell-shaped curve, skewed to the right, of end-to-end latency in milliseconds from 0 to 6,000, with the share of
  requests on the vertical axis. The peak is near 1,200 ms. Four marked points sit on the curve. The p50 at 1,500 ms and
  the mean at 1,700 ms, in grey, are close together near the top. The p95 at 3,414 ms and the p99 at 4,800 ms, in red,
  sit far out along the thin right-hand tail. Four boxes on the right repeat the numbers: the median 1,500 ms, the mean
  1,700 ms which is only 200 ms above it, the p95 3,414 ms with 10,000 requests a day slower, and the p99 4,800 ms with
  2,000 requests a day slower.
caption: >-
  The mean sits next to the median and says nothing is wrong. The tail does not: 1 percent of 200,000 requests a day is
  2,000 customers who wait more than 4.8 seconds. The curve is computed from a log-normal model with an illustrative
  spread.
