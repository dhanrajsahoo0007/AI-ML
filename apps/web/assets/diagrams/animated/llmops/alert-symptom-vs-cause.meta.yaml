title: Page on symptoms, ticket on causes
alt: >-
  A three-step figure with two rows. Step 1, a grey header box reading Symptoms, page a person now, and three lime
  boxes: pass rate under 85 percent on the graded sample of the last hour, time to first token p95 over 400
  milliseconds for 10 minutes, and a fast burn of the answer error budget over 1 hour and 5 minutes. Step 2, a second
  row with a grey header, Causes, ticket for the day, and three teal boxes: an index two weeks old because the refresh
  job failed, a cache hit rate that fell from 62 to 31 percent, and provider rate-limit replies rising. Step 3 adds
  three dashed red arrows from each cause to the symptom above it, labelled stale answers, slow first token and failed
  requests, and a note that a cause staying inside the system is a ticket while the same cause reaching customers is a
  page.
caption: >-
  Alert on what customers feel and keep causes on the dashboard to explain the page. The cause readings are
  illustrative.
tags: [alerting, symptoms, causes, on-call, llmops, genai]
