title: Three triggers start a training run; the result goes through the release pipeline
alt: >-
  A six-step figure. Three grey and red boxes sit in a row at the top. Step 1, Schedule: the first of the month, 12
  runs a year. Step 2, Drift alarm, in red: 166 of 200 sampled answers pass, 83 percent, under the 85 percent floor.
  Step 3, New labelled data: 1,000 resolved tickets, which is 20 percent of the 5,000-ticket fine-tuning set. Step 4
  adds a box in the middle, Trigger rule, which any one of the three can start, with arrows from all three, and a
  note that the guard allows at most one run in 7 days and none while one is running. Step 5 adds a row of three boxes
  below: a teal Training run that fine-tunes or re-embeds, a lime Golden-set evaluation on the same 200 tickets and
  85 percent floor, and a violet Candidate bundle that is registered but not live. Step 6 adds a grey Release pipeline
  box with the note that a model never goes straight to production.
caption: >-
  Any of three signals can start a training run, but the output is only a candidate. It must pass the same
  evaluation and release pipeline as a code change. Results are illustrative.
tags: [continuous-training, triggers, drift, llmops, genai]
