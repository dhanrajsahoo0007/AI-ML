title: The LLMOps loop
alt: >-
  A three-step map of the whole LLMOps lifecycle for the Brightpost support assistant. Step 1: along the top, a blue
  Data box of 5,000 tickets leads to a green Fine-tune box, a lime Evaluate box with a golden set of 200, and a violet
  Registry box of model versions. Step 2: along the bottom, an orange User box at 12 requests a second at peak leads
  through a neutral Gateway, a teal Engine on GPUs, and a lime Guardrails box to a green Answer box of 250 tokens, and the
  Registry deploys down into the Engine. Step 3: a blue Traces box on the left collects traces and feedback from the
  serving path along a dashed line, and sends dashed arrows back to Evaluate, labelled evals on real traffic, and to Data.
caption: >-
  The whole track in one picture. The top row builds a model version, the bottom row serves it, and the dashed line
  turns every request into a trace that feeds evaluation and the next round of data.
tags: [llmops, lifecycle, observability, evaluation, registry, brightpost, genai]
