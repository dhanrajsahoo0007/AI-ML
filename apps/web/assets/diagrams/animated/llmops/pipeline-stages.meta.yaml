title: Brightpost's pipeline for an LLM change, from unit tests to promote
alt: >-
  A six-step figure of a release pipeline drawn as five boxes in a row joined by arrows. Step 1, Unit tests, run on
  every push, checking that the prompt renders and tool schemas parse with no model calls, in lime. Step 2, Evaluation
  suite, in lime, with 170 of 200 golden tickets needed to pass; one run sends 440 thousand input and 50 thousand
  output tokens, 0.1 percent of a day's input. Step 3, Build, in teal, makes one pinned, signed release bundle,
  bundle 42, in the registry. Step 4, Canary, in lime, runs shadow traffic and then 1, 10 and 50 percent with quality
  and latency checks. Step 5, Promote, in green, sends 100 percent of traffic to bundle 42 and keeps the old stack warm
  for baking. Step 6 shows a pull request that changes the prompt to p13: its quality check is red at 164 of 200,
  82 percent, under the 85 percent floor, its refund-limit check passes at 12 of 12, and the result is a red Stop,
  so build, canary and promote never run.
caption: >-
  Cheap, fast checks come first and the expensive ones later, so a bad change stops early. Pass counts are
  illustrative; token counts are computed from Brightpost's numbers.
tags: [ci-cd, pipeline, evaluation, llmops, genai]
