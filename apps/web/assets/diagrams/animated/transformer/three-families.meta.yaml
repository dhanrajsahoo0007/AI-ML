title: Three Transformer families
alt: >-
  Three panels side by side, each a small stack read from the bottom up. Encoder-only, such as BERT: all tokens go
  through orange bidirectional self-attention and a blue feed-forward layer and come out as a vector per token; its
  4 by 4 attention pattern is all green, so every token sees every token. Encoder-decoder, such as T5 and the original
  Transformer: an encoder stack of bidirectional self-attention and feed-forward reads the source tokens, and its
  output runs across as keys and values into the orange cross-attention of a decoder stack, which has causal
  self-attention, cross-attention and feed-forward and predicts the next target token; the encoder's pattern is all
  green and the decoder's is a green lower triangle. Decoder-only, such as GPT, Llama and Claude: the tokens so far go
  through causal self-attention and feed-forward to predict the next token; its pattern is a green lower triangle, so
  each token sees itself and earlier tokens. A footnote says each stack repeats N times and that norms, residuals,
  embeddings and output heads are left out.
caption: >-
  The families differ in which blocks they keep and in who can see whom: bidirectional, both with cross-attention, or
  causal only.
