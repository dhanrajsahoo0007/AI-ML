title: Why the scores are divided by √d_k
alt: >-
  Two panels side by side show one query scored against four keys at a head size of 64. In the left panel, titled
  "Raw scores, spread about √64 = 8", four orange cells hold the illustrative scores 16, 8, 0 and minus 8. An arrow
  labelled "softmax" points down to four green bars: the bar for key 1 is full height with the weight 1.00, and the
  other three are flat lines with the weight 0.00. A grey line underneath says the slope of the top weight, p times
  1 minus p, is 0.0003. In the right panel, titled "Divided by √d_k = 8", the same scores divided by 8 are 2, 1, 0 and
  minus 1. The softmax gives four bars of falling height with the weights 0.64, 0.24, 0.09 and 0.03, and a green
  line says the slope of the top weight is 0.23.
caption: >-
  Unscaled, scores 8 apart make the softmax all-or-nothing and its slope almost zero; divided by √64 = 8, the same
  ranking gives weights of 0.64 to 0.03 and a slope about 680 times larger. Illustrative scores.
tags: [transformer, attention, softmax, scaled-dot-product, genai]
