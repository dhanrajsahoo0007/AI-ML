title: Tensor shapes, stage by stage
alt: >-
  The decoder input "<s> Ich liebe" followed from the bottom up, with every tensor drawn as three rows, one per
  position, and widths to scale. Three token ids become a pink 3 × 512 block (embedding plus position). Inside a grey
  dotted group labelled "Decoder layer, × 6", the rows split into eight small orange attention heads of 3 × 64 each,
  merge into a yellow-green 3 × 512 concat block, widen into a blue 3 × 2048 feed-forward inner layer and narrow back
  to a blue 3 × 512 output. A lavender Linear layer then widens each row to 3 × 37,000 logits, drawn cut, and a green
  softmax turns each row into probabilities. The last green row, the position after "liebe", is highlighted: at
  inference only that row is used, and its most likely token is "Tee".
caption: >-
  Every stage keeps one row per position and changes only the width: 512, eight heads of 64, 2048 inside the
  feed-forward network, then 37,000 at the output.
