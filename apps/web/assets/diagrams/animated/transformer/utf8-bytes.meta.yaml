title: "“Tea” in six writings, as UTF-8 bytes"
alt: >-
  Six rows, one per writing of the word "tea", each with its characters on top and their UTF-8 bytes underneath in
  teal cells, and a teal count on the right. English "tea": 3 characters, bytes 74 65 61, 3 bytes. German "Tee": 3
  characters, 3 bytes. Russian "чай": 3 characters, two bytes each, 6 bytes. Hindi "चाय": 3 code points, three bytes
  each, 9 bytes, the largest count, which is ringed. Chinese "茶": 1 character, 3 bytes. A tea emoji: 1 character, 4
  bytes. A note says all 256 byte values are in a byte-level tokenizer's base vocabulary, so nothing is unknown (the
  "y" of "slowly" is byte 79), and that merges learned from the training data join the byte runs it saw often, while
  rare scripts stay near these counts.
caption: >-
  A byte-level tokenizer can read any text, but it starts from one token per byte: the same word costs 3 bytes in
  English and 9 in Hindi before any merge, and only merges learned from the training data close that gap.
tags: [tokenization, bpe, byte-level, multilingual, genai]
