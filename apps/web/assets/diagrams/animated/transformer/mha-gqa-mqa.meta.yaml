title: "MHA, GQA and MQA: query heads sharing key/value heads"
alt: >-
  Three dotted panels side by side: multi-head (MHA), grouped-query (GQA) and multi-query (MQA). Each panel has a
  row of 8 blue query heads at the top and, below them, key/value heads drawn as a teal K cell over a violet V cell,
  with a line from each query head to the key/value head it reads. In MHA there are 8 key/value heads, one straight
  below each query head. In GQA there are 2, and each is shared by a group of 4 query heads. In MQA there is 1,
  shared by all 8. Under each panel, the real model is given: 64 query heads with 64, 8 or 1 KV heads. A bar on one
  shared scale, half teal and half violet, shows the KV cache per token: about 2.62 MB for MHA (2 × 80 × 64 × 128 × 2
  bytes), about 0.33 MB for GQA, 8 times smaller, and about 0.04 MB for MQA, 64 times smaller, where the bar is a
  sliver. Below the panels, an arrow pointing right reads "smaller cache, faster decode" and an arrow pointing left
  reads "more quality".
caption: >-
  Fewer key/value heads mean a smaller cache: GQA shares one key/value head per group of query heads and cuts the
  cache 8× here, with quality close to MHA.
