title: Multi-head attention
alt: >-
  Multi-head attention, read from the bottom up. Values V (lavender), keys K (teal) and queries Q (blue), each a
  512-wide vector per token, enter three lavender Linear blocks. Each Linear is drawn as a stack of offset copies
  because there is one projection per head; each copy maps 512 numbers to 64. The 64-wide queries, keys and values go
  up into an orange Scaled Dot-Product Attention block, also drawn as a stack and marked "× 8 heads": the eight heads
  attend in parallel. Their eight 64-wide outputs are joined in a yellow-green Concat block, 8 × 64 = 512, and a last
  lavender Linear maps 512 to 512 to give the output, MultiHead(Q, K, V). Notes on the right repeat the sizes in words.
caption: >-
  Each of the 8 heads works on its own 64-wide slice, and Concat puts them back together at 512 wide. Adapted from
  Vaswani et al. (2017), Figure 2.
