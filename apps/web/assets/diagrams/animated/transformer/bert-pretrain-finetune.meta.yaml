title: BERT pre-training and fine-tuning
alt: >-
  Two encoder bodies side by side, each read from the bottom up: a row of input tokens, a neutral "Encoder × 12" group
  holding an orange bidirectional self-attention block and a blue feed-forward block, and one output vector per token
  above it. Left, pre-training: the input is "[CLS] the kettle [MASK] [SEP] she poured the [MASK] [SEP]", with sentence
  A and sentence B bracketed and the two [MASK] tokens in pink. Over each masked position a lavender Linear layer
  (768 to 30,000) and a green softmax predict the original word: "boiled" 0.54, "whistled" 0.18, "cooled" 0.05 for the
  first, and "tea" 0.63, "water" 0.17, "milk" 0.05 for the second. A note between them says about 15 percent of tokens
  are chosen; 80 percent become [MASK], 10 percent a random token and 10 percent stay unchanged; the loss is only at
  the masked positions. Over the [CLS] output a second head, Linear (768 to 2) and softmax, gives IsNext 0.97 and
  NotNext 0.03; a note says half the time B is the real next sentence, half the time a random one, and that RoBERTa
  later dropped this objective. Right, fine-tuning: a dashed arrow labelled "copy" joins the pre-training encoder to a
  second encoder that reads one review, "[CLS] tea was great [SEP]"; a new head on its [CLS] output, Linear (768 to 2)
  and softmax, gives positive 0.96 and negative 0.04. A note says fine-tuning starts from the pre-trained weights,
  updates all of them, and adds only the new head. A footnote gives BERT-base: 12 layers, hidden size 768, 12 heads,
  about 110 million parameters.
caption: >-
  BERT pre-trains one encoder with two heads, masked-word prediction and next-sentence prediction, then fine-tunes all
  of its weights with a small new head on [CLS]. Adapted from Devlin et al. (2018), Figure 1.
