title: The LLM training pipeline
alt: >-
  Four dotted bands, read as a snake from top to bottom. Data, left to right: raw corpora (web, code, books) go to a
  filter, deduplicate and mix-domains step, then to a violet Tokenize step that turns text into token ids. An arrow
  labelled "trillions of tokens" drops into the Pre-training band, where a wide pre-training block (next-token
  prediction over the whole corpus) uses most of the compute, thousands of GPUs for weeks or months, and produces a
  blue base model that knows language and facts. The base model drops into the Post-training band: supervised
  fine-tuning on instruction data, then a fork into two routes of preference tuning. The RLHF route trains a reward
  model from human comparisons and then runs reinforcement learning with PPO, maximizing reward under a KL penalty.
  The DPO route applies one loss directly on preference pairs, with no reward model and no RL loop. The two routes
  join and drop into the Release band: safety tuning and evaluations (red-teaming, benchmarks), then the blue released
  assistant model that follows instructions.
caption: >-
  Pre-training on trillions of tokens spends most of the compute and yields a base model; fine-tuning, preference
  tuning (RLHF or DPO) and safety work turn it into an assistant at a small fraction of that cost.
