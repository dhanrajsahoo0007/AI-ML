title: Expert capacity, dropped tokens and the balancing loss
alt: >-
  A batch of 8 grey token cells, t1 to t8, at the bottom feeds a lavender Router bar that picks one expert per token.
  Above it sit 4 blue dotted groups, Expert 1 to Expert 4, each with 2 slots under a blue FFN box. A line from each
  token leads to a slot: Expert 1 gets t1 and t3, Expert 2 gets t4 and t7, Expert 3 gets t2 and t8, and Expert 4 gets
  t6 with one slot left empty. Token t5 also picked Expert 1, but its 2 slots are full, so a red line leads instead to
  a red t5 cell marked "over capacity" outside the group; a dashed red arrow labelled "residual only" carries it past
  the experts to the layer output. The arrows from the slots to the FFNs read "2 of 3 fit", "2 tokens", "2 tokens"
  and "1 token". The FFN outputs go up to a bar reading "Layer output: 7 tokens from experts, t5 from the residual".
  On the right, the layer output feeds a Task loss box, a dashed arrow from the router feeds a Load-balancing loss
  box that sees the share per expert, 3, 2, 2 and 1 of 8 tokens, and the two losses add up into "Update experts and
  router". The formula at the top reads: capacity = 8 tokens divided by 4 experts times capacity factor 1.0 = 2 slots
  per expert. A note says many models also add a router z-loss that keeps the router's logits small.
caption: >-
  Each expert takes at most 2 tokens here, so the third token routed to Expert 1 is dropped from the layer and kept
  only by the residual; the load-balancing loss pushes the router toward an even split.
