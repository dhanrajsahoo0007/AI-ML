title: Training BPE, one merge at a time
alt: >-
  A four-step figure that trains byte-pair encoding on the corpus "low", "lower" and "newest", each word once, with no
  end-of-word marker. Step 1: the three words are split into character cells, and orange cells count every adjacent
  pair: l + o 2, o + w 2, w + e 2, and e + r, n + e, e + w, e + s and s + t once each. Three pairs tie at 2, and the
  tie goes to the pair seen first, so l + o is ringed. Step 2: an arrow leads to a violet new token "lo"; the corpus
  is re-split as lo w, lo w e r, n e w e s t, and the new counts are lo + w 2, w + e 2 and the rest once; lo + w wins
  the tie. Step 3: the new token "low"; the corpus is low, low e r, n e w e s t, and every pair now occurs once, so
  the first one, low + e, wins. Step 4: the new token "lowe"; the corpus is low, lowe r, n e w e s t, and a note says
  training repeats until the vocabulary reaches its target size, and that the ordered merge list (l + o, lo + w,
  low + e) is the tokenizer. Along the bottom, the vocabulary grows from the 8 characters l o w e r n s t by one
  violet symbol per step: lo, low, lowe.
caption: >-
  Each merge fuses the most frequent adjacent pair into one new token, so "lo", then "low", then "lowe" join the
  vocabulary; the ordered merge list is the tokenizer.
