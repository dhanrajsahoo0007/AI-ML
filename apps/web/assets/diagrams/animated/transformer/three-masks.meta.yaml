title: Attention masks side by side
alt: >-
  Three 5 by 5 grids side by side, one row per query token and one column per key token, numbered 1 to 5. Green cells
  mean the query can see that key; grey cells are masked. In the bidirectional grid every cell is green, so every token
  sees every token. In the causal grid only the lower triangle and the diagonal are green, so each token sees itself
  and earlier tokens. In the prefix-LM grid the first three columns are bracketed as "prompt" and the last two as
  "generated": the 3 by 3 prompt block is fully green, and rows 4 and 5 see the prompt plus earlier outputs, as in
  the causal mask. Token 3's row is outlined in blue in each grid: it sees tokens 1 to 5 in the bidirectional grid,
  and tokens 1, 2 and 3 in the causal and prefix-LM grids.
caption: >-
  The same five tokens under three masks: bidirectional sees everything, causal sees only the past, and prefix-LM
  reads the prompt both ways, then generates causally.
tags: [transformer, attention, masking, causal-mask, prefix-lm, bert, gpt, genai]
