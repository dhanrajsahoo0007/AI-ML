title: "Cross-attention: decoder queries read the encoder output"
alt: >-
  On the left, a small copy of the whole Transformer with the decoder's second attention block, cross-attention,
  ringed in orange and marked "you are here". On the right, an orange dotted panel shows that block on the example "I
  love tea" to "Ich liebe Tee". At the top, the encoder output for "I", "love" and "tea" gives each source token a teal
  key vector and a lavender value vector; an arrow labelled "K, V from encoder" points down into a 2 by 3 grid of
  attention weights. On the left, the decoder tokens "Ich" and "liebe" each have a blue query vector; an arrow
  labelled "Q from decoder" points right into the same grid. The grid is a green heatmap with one row per query:
  "Ich" gives 0.75 to "I", 0.14 to "love" and 0.11 to "tea"; "liebe" gives 0.10 to "I", 0.75 to "love" and 0.15 to
  "tea". Each row sums to 1. An arrow labelled "weights × V" leads to two orange output vectors, one per decoder
  token, which go on to Add and Norm.
caption: >-
  Queries come from the decoder and keys and values from the encoder, so "Ich" reads mostly from "I" and "liebe"
  mostly from "love".
