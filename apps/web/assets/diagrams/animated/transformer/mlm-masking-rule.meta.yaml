title: BERT's 80 / 10 / 10 masking rule
alt: >-
  Two panels. Left, "One chosen position, three treatments": three rows show the input "she poured the tea" with its
  last position chosen for prediction, and every row has the same green target, "tea". In the first row, labelled
  80 percent, the chosen token is a highlighted pink [MASK], so the model sees a blank. In the second, labelled
  10 percent, it is the random word "apple", so the model sees a wrong word. In the third, also 10 percent, it is left
  as "tea", so the model sees the real word. Under a dashed line, a fine-tuning row reads "[CLS] tea was great", and a
  note says the input never has [MASK]. Right, "Per 1,000 training tokens": 150 are chosen and get a loss; of those
  120 become [MASK], 15 a random token and 15 stay the same; 850 are not chosen and give no loss; a note says a causal
  language model has a target at all 1,000 positions. A footnote says the loss is minus the log of the probability of
  "tea" in every row, and that the counts are expected values of the rule in Devlin et al. (2018).
caption: >-
  Every chosen position is trained to output the original word, but only 80 % of them show [MASK], so the encoder
  cannot tell which real-looking words it will be asked about; only 150 of every 1,000 tokens give a loss.
