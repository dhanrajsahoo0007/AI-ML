title: A worked training-compute estimate
alt: >-
  A calculation laid out in four rows, long-hand style. Row one: 6 FLOPs per parameter per token, times 7 × 10^9
  parameters N, times 2 × 10^12 tokens D, equals 8.4 × 10^22 FLOPs, the compute C, in a blue box. Row two carries that
  8.4 × 10^22 down and divides it by 4 × 10^14 FLOP/s per GPU, giving 2.1 × 10^8 GPU-seconds; a note says 400 TFLOP/s
  is an effective rate, about 40 percent of an H100's bf16 peak. Row three divides 2.1 × 10^8 GPU-seconds by 3,600
  seconds per hour, giving 58,333 GPU-hours. Row four divides 58,333 GPU-hours by 1,000 GPUs, giving 58.3 hours, about
  2.4 days, in a solid blue box; a note says this assumes one cluster with no failures. A footnote says real runs take
  longer because of failures, restarts and lower utilization, and that 6ND leaves out attention's own FLOPs. A side
  panel titled "Why 6?" shows 2 for the forward pass plus 4 for the backward pass equals 6 FLOPs per parameter per
  token. A second panel, Chinchilla's rule, says about 20 tokens per parameter and compares three models by
  parameters N, tokens D and tokens per parameter: Chinchilla, 70B and 1.4T, 20; Gopher, 280B and 300B, 1.1; this 7B
  model, 7B and 2T, about 286. Chinchilla used about Gopher's compute and won; the 7B model runs 14 times past the
  ratio, which makes it cheaper to serve.
caption: >-
  Multiply 6 by parameters and tokens for the FLOPs, divide by what each GPU really sustains and by the number of
  GPUs: 7B parameters on 2T tokens is about 58,000 GPU-hours, or 2.4 days on 1,000 GPUs.
