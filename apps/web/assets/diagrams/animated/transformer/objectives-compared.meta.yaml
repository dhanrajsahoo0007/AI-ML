title: Three pre-training objectives on one sentence
alt: >-
  Three bands, one per Transformer family, all on the text "the kettle boiled she poured the tea". In each band the
  bottom row is what the model reads and the top row, in green, is what it is trained to output. Encoder-only, BERT's
  masked language model: it reads "[CLS] the kettle [MASK] [SEP] she poured the [MASK] [SEP]", with the two [MASK]
  tokens in pink, and predicts only "boiled" and "tea" above them: 2 targets in 10 positions, or 150 per 1,000
  tokens. Decoder-only, GPT's next-token prediction: it reads "<s> the kettle boiled she poured the" and predicts "the
  kettle boiled she poured the tea", one target above every position: 7 of 7, or 1,000 per 1,000 tokens.
  Encoder-decoder, T5's span corruption: the encoder reads "the kettle <X> she poured the <Y>", with the sentinels in
  pink, and the decoder, linked by a dashed cross-attention arrow, writes "<X> boiled <Y> tea <Z>": 5 tokens, 2 of them
  words; per 1,000 tokens the input is 900 tokens and the target 201. A footnote says the example hides 2 of 7 words
  so the effect shows, where BERT and T5 use 15 percent.
caption: >-
  The same text, three objectives: BERT predicts only its 2 hidden words, GPT predicts every next word, and T5's
  decoder writes back only the dropped spans between sentinels. The hiding rate is illustrative.
tags: [transformer, bert, gpt, t5, pre-training, objectives, genai]
