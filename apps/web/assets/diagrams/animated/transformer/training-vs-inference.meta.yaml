title: Training versus inference
alt: >-
  Two panels. On the left, training in one pass: the true target shifted right, "<s> Ich liebe Tee", goes into the
  decoder as four grey tokens at once. A small causal mask beside the decoder shows a green lower triangle, so each
  position sees only itself and earlier positions. Out of the decoder come four green predictions compared with the
  targets "Ich", "liebe", "Tee" and "</s>", one loss at every position. On the right, inference with one token per
  pass, drawn as three rows. Pass 1 feeds "<s>" and the decoder outputs "Ich". A dashed arrow carries "Ich" down into
  pass 2, which feeds "<s> Ich" and outputs "liebe". Another dashed arrow carries "liebe" into pass 3, which feeds
  "<s> Ich liebe" and outputs "Tee". Generated tokens are green wherever they appear. Each pass uses only the last
  position's distribution. A footnote says that in the encoder-decoder model every pass also reads the encoder's
  output for "I love tea".
caption: >-
  Training scores every position in one pass because the causal mask hides the future; inference has no future to
  hide, so it runs once per new token and feeds each output back in.
tags: [transformer, training, inference, causal-mask, genai]
