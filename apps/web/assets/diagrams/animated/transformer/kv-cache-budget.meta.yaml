title: KV cache at 32,768 tokens and batch 8 on one 640 GB node
alt: >-
  Three horizontal bars on one scale, one each for multi-head attention with 64 KV heads, grouped-query attention with
  8 and multi-query attention with 1, for the page's 80-layer model serving 8 sequences of 32,768 tokens on 8 GPUs of
  80 GB. Each bar starts with a grey 140 GB block for the weights, followed by the KV cache, half teal for keys and
  half violet for values. A dashed tick through every bar marks the node's 640 GB. The MHA bar runs past it: its cache
  is 687.2 GB, the total is 827.2 GB, and the 187.2 GB beyond the node's memory is red, so it does not fit; at most 5
  such sequences would. The GQA bar is short, 85.9 GB of cache and 225.9 GB in total, and fits, with room for 46
  sequences. The MQA bar is shorter still, 10.7 GB of cache and 150.7 GB in total, with room for 372. Under each bar
  the working multiplies 2 by 80 layers, the KV heads, 128, 2 bytes, 32,768 tokens and a batch of 8.
caption: >-
  At 32,768 tokens and a batch of 8, full multi-head attention needs 687 GB of KV cache and does not fit on a 640 GB
  node; 8 KV heads cut it to 85.9 GB and leave room for 46 sequences instead of 5.
