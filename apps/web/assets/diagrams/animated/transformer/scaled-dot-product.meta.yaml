title: Scaled dot-product attention
alt: >-
  On the left, a small copy of the whole Transformer with the encoder's self-attention block ringed in orange, marked
  "you are here". On the right, an orange dotted panel zooms into that block and reads from the bottom up. Queries Q
  (blue) and keys K (teal) enter a lavender MatMul that compares every query with every key. A yellow-green Scale block
  divides the scores by the square root of d_k, which is 8 when d_k is 64. A pink Mask block, marked optional, sets the
  positions a token must not see to minus infinity. A green SoftMax turns each row of scores into weights that sum to
  1. A second lavender MatMul multiplies the weights by the values V (lavender), which climb the right side and enter
  from the side, and gives the output, Attention(Q, K, V).
caption: >-
  Queries are compared with keys, the scores are scaled, optionally masked and turned into weights, and the weights
  mix the values. Adapted from Vaswani et al. (2017), Figure 2.
tags: [transformer, attention, scaled-dot-product, genai]
