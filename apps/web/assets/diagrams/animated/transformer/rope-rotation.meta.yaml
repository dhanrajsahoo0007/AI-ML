title: "RoPE: rotation turns absolute positions into a relative angle"
alt: >-
  Two circles side by side, each with a dashed horizontal axis marked 0 degrees where the vectors start. In the left
  circle, for positions m = 2 and n = 5, a blue query arrow is turned 2 theta, 40 degrees, and a teal key arrow is
  turned 5 theta, 100 degrees. In the right circle, for m = 6 and n = 9, the blue query is turned 6 theta, 120
  degrees, and the teal key 9 theta, 180 degrees, pointing straight left. In both circles an orange arc between the
  two arrows is labelled 3 theta, and under each circle n minus m equals 3. Below, in orange: the angle equals n minus
  m times theta, 3 theta in both, 60 degrees with theta = 20 degrees. A note says the dot product depends only on the
  angle between q and k, so the score depends only on n minus m, and that the figure shows one pair of dimensions
  while real models rotate every pair at its own frequency.
caption: >-
  The absolute angles differ, but the gap n − m = 3 gives the same 3θ between query and key, so the attention score
  is the same.
tags: [transformer, positional-encoding, rope, attention, genai]
