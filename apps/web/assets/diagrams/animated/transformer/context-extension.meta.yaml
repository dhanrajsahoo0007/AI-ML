title: Extending a RoPE context window
alt: >-
  Top panel, "Trained on 4K positions, given 16K". First row, extrapolation: a number line from 0 to 16K with a green
  band from 0 to 4K labelled "trained: 0–4K" and a red band from 4K to 16K labelled "past 4K: slow pairs turn to
  angles never seen". Second row, position interpolation (every position ÷ 4): an upper number line of input positions
  0, 4K, 8K, 12K and 16K, with arrows converging down onto a short lower line, the green trained range, at 0, 1K, 2K,
  3K and 4K; the arrow from 16K to 4K is labelled "÷ 4". A note says every position now lands inside the trained range,
  but neighbours are only a quarter of a step apart. Middle panel, "NTK-aware scaling and YaRN: each frequency scaled
  differently": a bar chart of how much each RoPE dimension pair's positions are divided, for every 4th of 64 pairs.
  Six orange bars on the left, the fast pairs, stay at ÷ 1 (unchanged, local detail kept); six green bars in the
  middle ramp up gradually; four blue bars on the right, the slow pairs, reach the full ÷ 4. A dashed line at ÷ 4
  marks position interpolation, which divides every pair by 4. Bottom: a row of four boxes joined by arrows: rescale
  RoPE (PI, NTK or YaRN), short fine-tune on long documents, check needle-in-a-haystack and long-document QA, serve
  at 32K–128K tokens.
caption: >-
  Extrapolation pushes slow RoPE pairs to angles never seen in training; position interpolation divides every position
  by 4 to stay in range, and NTK-aware scaling and YaRN squeeze only the slow pairs so local detail survives, before a
  short long-document fine-tune.
