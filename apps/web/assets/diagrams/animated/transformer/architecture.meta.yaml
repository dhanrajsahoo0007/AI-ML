title: The Transformer, encoder and decoder
alt: >-
  The Transformer drawn as two columns that read from the bottom up. On the left, the encoder: the English inputs
  "I love tea" pass through a pink input embedding, positional encoding is added at a plus sign, and the result
  enters a block repeated six times that holds orange multi-head self-attention, a yellow-green Add and Norm, a blue
  feed-forward layer and a second Add and Norm, with a residual line around each sub-layer. On the right, the
  decoder: the target so far, "<s> Ich liebe", passes through a pink output embedding with positional encoding into a
  block repeated six times that holds masked multi-head attention, Add and Norm, multi-head cross-attention, Add and
  Norm, feed-forward and Add and Norm. The encoder's output runs across into the cross-attention as keys and values,
  while the queries come from the decoder. Above the decoder, a lavender linear layer and a green softmax give the
  output probabilities, with "Tee" as the next token.
caption: >-
  The encoder reads the whole English sentence at once; the decoder reads it through cross-attention while predicting
  one German token at a time. Adapted from Vaswani et al. (2017), Figure 1.
