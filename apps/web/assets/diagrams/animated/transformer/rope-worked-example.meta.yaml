title: "RoPE worked example: one pair of dimensions"
alt: >-
  A four-step worked example of rotary position embedding on one pair of dimensions, drawn as four dials in a row. In
  each dial a blue arrow is the query of "sat", (1, 1), and a teal arrow is the key of "cat", (0, 2), with an orange
  arc marking the angle between them. Step 1, no position: neither arrow is turned, they are 45 degrees apart and the
  score is 2.00. Step 2, "the cat sat" with sat at position 2 and cat at 1: the query is turned 2 radians and the key
  1 radian, the angle between them closes to 12 degrees and the score is 2.76. Step 3, the same words at positions
  102 and 101: both arrows point in new directions, but they are still 12 degrees apart and the score is 2.76 again.
  Step 4, sat at 3 and cat at 1: the query is turned one radian more, the gap opens to 70 degrees and the score falls
  to 0.99. Text underneath explains each step and says that only the difference between the positions counts. A note
  says the figure shows pair 0, which turns 1 radian per position.
caption: >-
  Moving both words 100 places changes where the arrows point but not the 12° between them, so the score stays 2.76;
  only a change in the gap, here to two places, changes the score.
