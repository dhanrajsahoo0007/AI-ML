title: Generation with a KV cache
alt: >-
  A sequence diagram with three lanes: the user prompt in grey, the decoder stack in orange and the KV cache in teal.
  First, prefill: the prompt sends all its tokens to the decoder stack at once, the stack stores the keys and values
  for every layer in the cache, and the first output token returns to the prompt side, which marks the time to first
  token. Then a decode step: only the newest token goes into the stack, the stack reads the past keys and values from
  the cache and appends the new ones, and the next token comes back; a note on the cache says it grows by one entry
  per layer per token. The decode step then repeats with the token the model just made, until it produces the end
  token.
caption: >-
  Prefill processes the whole prompt once and fills the cache; every decode step feeds one token and reuses the
  cached keys and values.
