title: Path length, recurrence versus self-attention
alt: >-
  Two panels with the same six tokens, x1 to x6. On the left, a recurrent layer: each token feeds a hidden state, and
  each hidden state passes to the next, h1 to h2 and on to h6. The route from token 1 to token 6 is drawn in orange
  through all five hidden-state hops, under a bracket labelled "5 steps": n minus 1 sequential steps, which grows as
  O(n). On the right, self-attention: the six tokens are joined pair by pair with fifteen light grey arcs, and the
  single arc from token 1 to token 6 is drawn in orange and labelled "1 step", so every pair is one step apart, O(1).
caption: >-
  In a recurrent layer, information from the first token reaches the last after n − 1 steps; in self-attention every
  pair is one step apart. After Vaswani et al. (2017), Table 1 (maximum path length).
