title: "Mixtral 8x7B: total vs active parameters"
alt: >-
  Two horizontal bars on one scale from 0 to about 47 billion parameters. The top bar, "Total parameters, about 47B
  (memory)", is a thin grey shared part of about 1.6B (attention, embeddings, routers and norms) followed by 8 equal
  blue cells, Expert 1 to Expert 8, each about 5.6B: the expert's FFN in all 32 layers. Below it: 1.6B shared plus
  8 times 5.6B experts = 46.7B, all held in GPU memory. The bottom bar, "Active per token, about 13B (compute)", has
  the same grey shared part, 2 blue cells marked "picked", and 6 empty outlines. Below it: 1.6B shared plus 2 times
  5.6B experts = 12.9B; the other 6 slots sit idle. A note says memory pays for all 47B while compute per token is
  close to a 13B dense model, and that the total is not 8 times 7B = 56B because only the FFNs are copied.
caption: >-
  Mixtral 8x7B stores about 47B parameters but runs about 13B per token: the shared parts plus 2 of the 8 experts.
tags: [transformer, mixture-of-experts, moe, mixtral, parameters, genai]
