title: The KV cache grows by one entry per token
alt: >-
  A dotted panel titled "One layer, one KV head" shows the cache four times, left to right, joined by arrows. Each
  snapshot is a row of teal key cells over a row of violet value cells, one column per token, labelled k1, v1 and so
  on. After prefill, 4 prompt tokens' keys and values are written at once, so all 4 columns are solid. Decode step 1
  adds a fifth column, step 2 a sixth and step 3 a seventh; in each, only the new column is solid and the earlier
  columns are faint, because they are read again but not recomputed. Below the panel, a row of boxes multiplies 2
  (keys and values) by 80 layers, 64 KV heads (multi-head attention), d_head 128 and 2 bytes per 16-bit value, giving
  about 2.62 MB per token (2.5 MiB). A second row multiplies 2.62 MB per token by 4,000 tokens, giving about 10.5 GB
  for one sequence (9.8 GiB). A note says the weights stay the same size while the cache grows linearly with every
  token and every sequence in the batch.
caption: >-
  Each new token appends one key and one value per layer and KV head, so the cache grows with every token: about
  2.6 MB per token and about 10 GB for one 4,000-token sequence in this 80-layer model.
tags: [transformer, kv-cache, inference, memory, genai]
