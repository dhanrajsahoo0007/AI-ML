title: The tokenizer pipeline
alt: >-
  A column of stage blocks on the left, joined top to bottom by arrows, with the example string at each stage drawn to
  the right. Raw text: "Tokenizers don't split evenly…", ending in a one-character ellipsis. Inside a grey dotted
  group titled Tokenizer: Normalize (Unicode, whitespace) turns the ellipsis into three full stops. Pre-tokenize
  splits the text into word chunks: Tokenizers, space-don, 't, space-split, space-evenly and three dots, where a low
  bar marks a space that starts the next piece. The tokenizer model, in violet, applies BPE merges and gives the
  sub-word pieces Token, izers, don, 't, split, even, ly and three dots (an illustrative split). Token ids gives one
  illustrative number per piece, such as 3963 for Token and 12509 for izers. Special tokens, in teal, adds the <bos>
  token with id 1 at the start, so the sequence has 9 ids. Inside a pink dotted group titled In the LLM, each id
  points down to its own pink embedding vector: one row of the embedding table per id. A note says decoding reverses
  the process, turning ids back into pieces and the space marks back into spaces.
caption: >-
  Follow one string down the pipeline: it is normalized, cut into word chunks, split by BPE into sub-word pieces,
  mapped to ids, given a <bos> token, and finally each id picks one pink row of the embedding table.
tags: [tokenization, bpe, embeddings, genai]
