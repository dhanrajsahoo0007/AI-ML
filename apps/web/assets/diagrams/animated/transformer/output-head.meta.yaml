title: The output head
alt: >-
  Read from the bottom up. The decoder's 512-value output at the last position, after "liebe", enters a lavender
  Linear layer that maps 512 values to 37,000. Its output is a row of logits, one per vocabulary token; five are shown
  with their values (Tee 6.0, Kaffee 4.2, dich 3.6, es 3.1, den 2.8) and a last slot stands for 36,995 more. A green
  softmax turns them into next-token probabilities, drawn as horizontal bars: "Tee" 0.62, highlighted in solid green,
  "Kaffee" 0.10, "dich" 0.06, "es" 0.03, "den" 0.03, and a grey bar of 0.16 for the other 36,995 tokens. To the right,
  a pink embedding table of 37,000 × 512 is joined to the Linear layer by a dashed line labelled "same weights", with
  a note that many models reuse the embedding table as this layer, and that the 2017 paper does too.
caption: >-
  A Linear layer scores every token in the 37,000-token vocabulary and softmax turns the scores into probabilities;
  the paper shares this layer's weights with the embedding tables (§3.4).
