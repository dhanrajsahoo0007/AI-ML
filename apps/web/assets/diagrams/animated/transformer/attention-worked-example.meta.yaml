title: Self-attention, worked through for "the cat sat"
alt: >-
  A four-step worked example of self-attention on the tokens "the", "cat" and "sat". On the left, a panel lists each
  token's two-number query in blue, key in teal and value in violet: "the" has query (1, 0), key (1, 0) and value
  (1, 0); "cat" has query (0, 1), key (0, 2) and value (0, 1); "sat" has query (1, 1), key (1, 1) and value (1, 1).
  Step 1: an arrow labelled "Q · Kᵀ" leads to a 3 by 3 orange grid of raw scores, one row per query and one column
  per key: 1, 0, 1 for "the"; 0, 2, 1 for "cat"; 1, 2, 2 for "sat". Step 2: an arrow labelled "÷ √2" leads to the
  scaled scores, a paler orange grid: 0.71, 0, 0.71; 0, 1.41, 0.71; 0.71, 1.41, 1.41. Step 3: an arrow labelled
  "softmax per row" points down to a green heatmap of attention weights, each row summing to 1: 0.40, 0.20, 0.40 for
  "the"; 0.14, 0.58, 0.28 for "cat"; 0.20, 0.40, 0.40 for "sat". Step 4: an arrow labelled "× V" leads to the three
  new two-number vectors in orange: (0.80, 0.60) for "the", (0.42, 0.86) for "cat" and (0.60, 0.80) for "sat". Text on
  the lower left follows the "sat" row through every step: scores 1, 2, 2; divided by 1.41 they become 0.71, 1.41,
  1.41; the softmax gives 0.20, 0.40, 0.40; and 0.20 × (1, 0) + 0.40 × (0, 1) + 0.40 × (1, 1) = (0.60, 0.80).
caption: >-
  Follow the bottom row: "sat" scores 1, 2 and 2, the scale and softmax turn them into weights 0.20, 0.40 and 0.40,
  and its new vector (0.60, 0.80) is mostly "cat" and itself.
