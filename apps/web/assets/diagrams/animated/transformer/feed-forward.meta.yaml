title: The position-wise feed-forward network
alt: >-
  Three columns, one for each token of "I love tea", inside a blue dotted group labelled "Feed-forward network". In
  each column, read from the bottom up, the token's 512-value vector enters a lavender Linear layer with W1 and b1
  that widens it to 2048 values, then a grey ReLU box, which gives a blue hidden vector where about half of the cells
  are empty because ReLU set them to zero, then a second lavender Linear layer with W2 and b2 that narrows it back to
  a blue 512-value output. Dashed lines labelled "same W1, b1" and "same W2, b2" join the Linear layers across the
  three columns. The formula at the top reads FFN(x) = max(0, xW1 + b1)W2 + b2.
caption: >-
  The feed-forward network transforms each position on its own, with the same weights at every position. After
  Vaswani et al. (2017), §3.3.
tags: [transformer, feed-forward, genai]
