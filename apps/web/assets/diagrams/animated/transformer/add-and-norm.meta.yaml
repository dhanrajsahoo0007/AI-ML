title: Post-LN and Pre-LN
alt: >-
  Two panels, each read from the bottom up. On the left, Post-LN as in the 2017 paper: the input x goes through an
  orange sub-layer (attention or feed-forward), a skip line carries x around it to a plus sign where the two are
  added, and the sum then passes through a yellow-green LayerNorm before it leaves as the output. Below it reads
  LayerNorm(x + Sublayer(x)). On the right, Pre-LN as in most modern LLMs: x first goes through a yellow-green
  RMSNorm or LayerNorm, then the orange sub-layer, and the skip line carries the untouched x around both to the plus
  sign, whose sum is the output. Below it reads x + Sublayer(Norm(x)); the skip path never passes through a norm.
caption: >-
  Post-LN normalises after the residual add; Pre-LN normalises only the sub-layer's input, so the skip path stays a
  clean identity.
tags: [transformer, layer-norm, residual, genai]
