title: Inside one decoder-only block
alt: >-
  One decoder-only block, repeated N times, read from the bottom up. Token vectors from the previous block pass through
  a yellow-green RMSNorm, fan out into queries, keys and values, and enter an orange causal multi-head self-attention
  block that applies rotary position embeddings (RoPE) to the queries and keys. A residual line carries the block's
  input around the norm and the attention to a plus sign. The sum goes through a second RMSNorm and a blue
  feed-forward layer with SwiGLU, and a second residual line adds the sum back at another plus sign. The result goes to
  the next block. Notes say each token reads itself and earlier tokens, the feed-forward layer works on each token on
  its own and holds most of the parameters, and the residual path never passes through a norm.
caption: >-
  A Pre-norm decoder block as in Llama-style LLMs: RMSNorm before each sub-layer, causal attention with RoPE, a
  SwiGLU feed-forward layer, and a residual add after each.
