title: "Attention cost: n tokens make n × n pairs"
alt: >-
  Three orange square grids side by side, bottom-aligned and drawn with the same square size. Each small square is one
  query–key score: rows are queries and columns are keys. The first grid, for n = 4 tokens, is 4 by 4 and is labelled
  16 pairs. An arrow labelled "n × 2", with "pairs × 4" under it, leads to the second grid, for n = 8 tokens: 8 by 8,
  labelled 64 pairs. A second "n × 2" arrow, again with "pairs × 4", leads to the third grid, for n = 16 tokens: 16 by
  16, labelled 256 pairs, four times the area of the second. A note underneath says that doubling n quadruples the
  pairs, so the score-matrix work and memory per head grow four times, while the projections and the feed-forward
  layers only double.
caption: >-
  Every token scores every token, so the score matrix has n × n entries: each doubling of n gives four times the
  pairs, and four times the attention work and memory per head.
tags: [transformer, attention, complexity, long-context, genai]
