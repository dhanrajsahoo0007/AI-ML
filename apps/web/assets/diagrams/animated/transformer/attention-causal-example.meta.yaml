title: The same example with a causal mask
alt: >-
  A four-step worked example of self-attention with a causal mask, on the tokens "the", "cat" and "sat", one row per
  token. Step 1: an orange 3 by 3 grid of scaled scores, one row per query and one column per key: 0.71, 0, 0.71 for
  "the"; 0, 1.41, 0.71 for "cat"; 0.71, 1.41, 1.41 for "sat". Step 2: a pink arrow labelled "+ mask" leads to the
  same grid with minus infinity in grey wherever the key comes after the query, the three cells above the diagonal:
  "the" keeps only 0.71, "cat" keeps 0 and 1.41, and "sat" keeps all three. Step 3: an arrow labelled "softmax" leads
  to a green grid of weights in which every masked key gets 0: 1, 0, 0 for "the"; 0.20, 0.80, 0 for "cat"; 0.20,
  0.40, 0.40 for "sat". Step 4: an arrow labelled "times V" leads to the new two-number vectors in orange: (1.00,
  0.00) for "the", (0.20, 0.80) for "cat" and (0.60, 0.80) for "sat". Text underneath follows the "cat" row: its
  score for "sat" becomes minus infinity, the softmax of 0 and 1.41 gives 0.20 and 0.80, and its new vector is
  (0.20, 0.80) instead of (0.42, 0.86) without the mask. A last line says "sat" is the last token, so its row is the
  same with or without the mask.
caption: >-
  The mask hides every later token, so "the" reads only itself and "cat" no longer reads "sat"; the last row, "sat",
  is the same as without the mask.
