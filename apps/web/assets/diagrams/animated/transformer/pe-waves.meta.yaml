title: Positional encoding waves
alt: >-
  Three sine waves drawn over positions 0 to 7, one above the other, each with its own axis from −1 to +1. The orange
  wave is dimension 0, sin(pos / 1), with a wavelength of about 6.3 positions; it rises, falls below zero and climbs
  again within the eight positions. The green wave is dimension 64, sin(pos / 3.16), with a wavelength of about 19.9;
  it rises to its peak near position 5 and starts to fall. The blue wave is dimension 128, sin(pos / 10), with a
  wavelength of about 62.8; it climbs slowly from 0 to 0.64. A dot marks each wave's value at every whole position,
  and a table below lists those values, shaded by size: for example position 3 is 0.14, 0.81 and 0.30. No two
  positions share the same column of three values. The dimensions are three of the 512 in the original Transformer.
caption: >-
  Each dimension of the sinusoidal encoding is a wave with its own wavelength; reading the values down one column
  gives every position its own code.
tags: [transformer, positional-encoding, genai]
