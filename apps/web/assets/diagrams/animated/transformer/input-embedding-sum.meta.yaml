title: Token to block input
alt: >-
  Three rows, one for each token of "I love tea" at positions 0, 1 and 2. Each token becomes an illustrative token id
  (87, 2104 and 9311), and each id points at one row of a pink embedding table that holds 37,000 rows of 512 values;
  the three looked-up rows are drawn as pink cells, the rest as empty rows. Each looked-up row passes through a times
  sign, multiplied by the square root of 512, about 22.6, giving a pink vector with stronger shading. A plus sign adds
  a grey positional-encoding vector, marked with a sine-wave circle and computed with the paper's sine and cosine
  formula, and an equals sign gives the grey block input that enters the first layer. Every vector shows 8 of its 512
  values.
caption: >-
  Each token id picks a row of the embedding table; the row is scaled by √512 and the sinusoidal position vector is
  added to give the input of the first layer.
tags: [transformer, embeddings, positional-encoding, genai]
