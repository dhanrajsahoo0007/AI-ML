title: BERT input embeddings
alt: >-
  A sentence pair packed into one input: "[CLS] my tea is scald ##ing [SEP]" bracketed in teal as sentence A, then
  "let it cool [SEP]" bracketed in violet as sentence B. Under each of the 11 input tokens are three cells joined by
  plus signs. The first row holds pink token embeddings, one per token. The second row holds segment embeddings:
  teal E A for the seven tokens of sentence A, including [CLS] and the first [SEP], and violet E B for the four tokens
  of sentence B, including the final [SEP]. The third row holds grey position embeddings, E 0 to E 10. The three
  vectors in each column are added to give that token's input to the first encoder layer. A note says the token
  embeddings come from a 30,000-token WordPiece vocabulary and the position embeddings are learned for up to 512
  positions, where the 2017 Transformer used fixed sinusoids.
caption: >-
  BERT adds three learned embeddings per token: what the token is, which sentence it belongs to, and where it sits.
  Adapted from Devlin et al. (2018), Figure 2.
