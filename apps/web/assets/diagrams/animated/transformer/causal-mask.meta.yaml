title: Causal mask and padding mask
alt: >-
  Two rows of 4 by 4 grids, with one row per query token and one column per key token. The top row uses the decoder
  input "<s> Ich liebe Tee" and the causal mask; the bottom row uses the source "I love tea" padded with a [PAD] token
  and the padding mask. Step 1 shows the scaled scores as an orange heatmap with numbers. Step 2 adds a grey mask grid:
  0 where a score is kept and minus infinity where it is removed. In the causal mask the minus infinity cells fill the
  upper triangle, so each token sees only itself and earlier tokens; in the padding mask they fill the [PAD] column,
  so no token reads the padding. The sum is the masked scores grid. Step 3 applies the softmax to each row and shows
  the attention weights as a green heatmap: every removed position gets weight 0 and every row sums to 1. For example,
  "Tee" spreads its attention as 0.11, 0.18, 0.27 and 0.44 over "<s>", "Ich", "liebe" and itself, and "<s>" puts all
  of its weight, 1.00, on itself.
caption: >-
  A mask adds −∞ to the scores a token must not use, so after the softmax those positions get exactly zero weight:
  the causal mask hides the future, the padding mask hides [PAD].
tags: [transformer, attention, masking, causal-mask, genai]
