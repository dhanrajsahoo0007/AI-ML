title: Encoding new words with the learned merges
alt: >-
  A four-step figure that encodes three words the tokenizer never saw in training, "lowest", "newer" and "slowly", with
  the merge list learned from "low", "lower" and "newest". Step 1: each word is split into grey character cells. Step
  2: a violet label "l + o → lo, apply merge 1" starts a new row in which "lowest" becomes lo w e s t, "slowly" becomes
  s lo w l y, and "newer" is unchanged. Step 3: "lo + w → low" turns both lo tokens into low: low e s t and s low l y.
  Step 4: "low + e → lowe" gives lowe s t for "lowest" and changes nothing else. A row of token ids follows: 10, 6, 7
  for "lowest"; 5, 3, 2, 3, 4 for "newer"; 6, 9, 0 and a red "unk" for "slowly", because the letter "y" never
  occurred in training. Counts underneath: 6 characters to 3 tokens, 5 characters to 5 tokens, and 6 characters to 4
  tokens. A note lists the vocabulary in the order it was built, l 0, o 1, w 2, e 3, r 4, n 5, s 6, t 7, lo 8, low 9,
  lowe 10.
caption: >-
  The merges replay in the order they were learned: "lowest" shrinks from 6 characters to 3 tokens, "newer" matches no
  merge and stays at 5, and the "y" in "slowly" has no id at all.
