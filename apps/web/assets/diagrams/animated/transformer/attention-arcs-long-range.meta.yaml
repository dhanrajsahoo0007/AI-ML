title: One attention head links "it" to "server"
alt: >-
  The sentence "The server dropped the request because it was overloaded" is drawn as a row of nine word boxes. The
  word "it" is blue and marked "query". Orange arcs rise from the top of "it" and land on every other word, longer
  arcs for words further away. Each arc's thickness and strength show its attention weight. The arc to "server",
  five words back, is by far the thickest and is labelled 0.52; the arc to "request" is the next strongest, labelled
  0.18; the other arcs are faint. Under the words, a row of green cells lists every weight of the query "it": The
  0.03, server 0.52, dropped 0.04, the 0.03, request 0.18, because 0.04, it 0.08, was 0.03, overloaded 0.05. They
  sum to 1. A note says the weights are illustrative.
caption: >-
  One head lets "it" reach straight back to "server", five words away, in a single step; the weights are
  illustrative and sum to 1. After Vaswani et al. (2017), Figure 3.
tags: [transformer, attention, interpretability, genai]
