title: Top-2 routing in a mixture-of-experts layer
alt: >-
  One token's path through a mixture-of-experts layer. The token vector x, at the bottom, goes to a lavender Router
  box, a Linear layer, which gives one logit per expert, drawn as 8 lavender bars in rows E1 to E8: 0.6, 2.1, 0.3,
  1.1, 1.6, 0.4, 0.2 and 0.8. The two largest, expert 2 at 2.1 and expert 5 at 1.6, have arrows into a tall green
  Softmax box labelled "over top 2", which gives the green mixing weights 0.62 and 0.38; the other 6 experts get
  weight 0. On the right, a blue dotted group holds 8 experts in the same rows. x travels up a line into expert 2 and
  expert 5 only, which are solid blue and marked "FFN, runs"; the other 6 are grey and marked "not run". Green arrows
  carry the two outputs, labelled "times 0.62" and "times 0.38", into a Weighted sum box, which goes into an adder
  where the residual line from x joins it, and on to the next block. The formula at the top reads output = x + 0.62
  times Expert 2 of x + 0.38 times Expert 5 of x.
caption: >-
  The router scores all 8 experts, but only the top 2 run for this token; their outputs are mixed by a softmax over
  the two winning scores and added to the residual stream.
tags: [transformer, mixture-of-experts, moe, routing, genai]
