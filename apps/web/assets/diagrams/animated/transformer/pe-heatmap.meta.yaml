title: Positional encoding heatmap
alt: >-
  A heatmap in shades of blue with 16 rows for positions 0 to 15 and 16 columns for dimensions of the 512-dimensional
  sinusoidal positional encoding: the sine and cosine dimension of the pairs 0 and 1, 64 and 65, 128 and 129, up to
  448 and 449. Column headings give each pair's wavelength, from 6.3 positions on the left to 19,869 on the right.
  Dark blue means +1, a mid shade 0 and pale −1, as a small legend shows. In the leftmost columns the shade changes
  from row to row; moving right the changes slow down, and in the right half the sine columns stay at the mid shade
  and the cosine columns stay dark for all 16 positions. Row 0 alternates mid and dark, because every sine is 0 and
  every cosine is 1 at position 0.
caption: >-
  Fast dimensions on the left change at every step; slow ones on the right barely move, so together they place each
  position both locally and globally.
