title: Where position enters the Transformer
alt: >-
  Three panels, each the same small stack read from the bottom up: a pink token embedding, then an orange attention
  block and a blue feed-forward block inside a dotted container marked "× N" for the repeated layers. In the first
  panel, Absolute, a grey sine-wave circle for the position vector is ringed and feeds a plus sign between the
  embedding and the first layer, outside the repeated container: position is added once, before the first layer. In
  the second panel, Rotary (RoPE), the input to attention splits into Q, K and V; a ringed grey box labelled "rotate"
  sits across the Q and K lines inside the repeated container, and the V line bypasses it with the note "V is not
  rotated": every attention layer, on queries and keys only. In the third panel, Bias (ALiBi, T5), a small 3 by 3
  grid labelled "penalty, minus the distance between i and j" holds 0 on the diagonal, minus 1 next to it and minus 2
  in the corners, shaded darker as the distance grows; an arrow carries it to a ringed plus sign on the attention
  block: on the score matrix in every layer.
caption: >-
  Absolute encodings change the input once; RoPE rotates queries and keys in every attention layer; ALiBi and T5 add
  a distance-based bias to the scores in every layer.
