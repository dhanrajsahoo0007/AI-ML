title: Two attention heads learn different jobs
alt: >-
  The sentence "The server dropped the request because it was overloaded" is drawn twice, once per attention head.
  In the top panel, orange and titled "Head A: resolves the pronoun", the word "it" is blue and marked "query", and
  orange arcs run from it to every other word; the arc to "server" is the thickest, labelled 0.52, the arc to
  "request" is next at 0.18, and the rest are faint. In the bottom panel, teal and titled "Head B: reads the previous
  word", each word from "server" to "overloaded" has one short, thick teal arc with an arrowhead pointing at the word
  just before it, carrying 0.72 to 0.86 of that word's weight. A note says the weights are illustrative and each
  word's weights sum to 1.
caption: >-
  Two heads in the same layer read the same sentence differently: one links the pronoun to its noun, the other looks
  one word back. Illustrative weights; after Vaswani et al. (2017), Figures 4 and 5.
tags: [transformer, attention, multi-head, interpretability, genai]
