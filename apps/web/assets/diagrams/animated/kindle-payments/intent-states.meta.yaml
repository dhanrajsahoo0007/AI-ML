title: The life of one payment intent
alt: >-
  A state machine in two steps, with eight boxes in two rows. Step 1: the forward path along the top row, from a
  neutral Created box (intent and key saved) to a blue Authorising box (sent with the key), a blue Authorised box
  (funds held) and a green Captured box (money moves); a declined authorisation goes down to a neutral Failed box (no
  money moved). Step 2: a timeout drawn as a red dashed arrow takes Authorising down to a red Unknown box; from Unknown,
  dashed arrows go to Authorised when the provider says it was approved and to Failed when it has no record. An
  authorisation whose book grant fails goes down to a neutral Voided box (hold released), and a refund takes Captured
  down to a neutral Refunded box (new ledger entries).
caption: >-
  An intent only moves forward, and a timeout is its own state: only the provider’s answer can move it on.
