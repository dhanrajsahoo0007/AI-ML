title: Facebook Messenger architecture
alt: Messenger's high-level design in eight build steps; a sender's message goes through a load balancer to chat servers, which store it, look up the recipient in a session registry, and deliver it over an open connection or through a push service, then add group fan-out, presence, media and history sync.
