title: Receipts as two pointers per member
alt: >-
  A grid with one column per message, m1 to m8, and one row per group member. Ana's cells are all green (read). Ben's
  cells m1 to m5 are green and m6 to m8 blue (delivered, not read). Cal's cells m1 to m3 are green, m4 to m6 blue and
  m7 to m8 grey (not delivered). On the right of each row a green box shows the only row stored for that member: two
  pointers, last delivered and last read.
caption: >-
  Every cell is derived from two numbers per member, so a 200-member group stores 200 rows, not one per message per
  member.
tags: [case-studies, messenger, data-model, receipts]
