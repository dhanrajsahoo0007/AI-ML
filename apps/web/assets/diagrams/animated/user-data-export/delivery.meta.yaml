title: Releasing an archive only to its owner
alt: >-
  A sequence diagram in two steps with five lanes: the user in orange, the delivery service in teal, re-auth in green,
  and the job database and archive store in violet. Step 1: user 42 opens the link to export 9f3 from the email, is
  asked to sign in again, gives a password and second factor, and re-auth tells the delivery service the session is
  fresh. One update in the job database checks that the owner is 42 and the part was fetched fewer than 5 times, and
  counts this fetch; it changes 1 row, so the service returns a signed URL valid for 15 minutes, and the browser gets
  part 1 of 3, 4 GB, straight from the archive store. Step 2: a forwarded link opened as user 77 runs the same update,
  which changes 0 rows, so the answer is 404 not found; an old signed URL used 16 minutes later gets 403 expired from
  the store.
caption: >-
  Re-authenticate, check the owner and the fetch count in one update, then hand out a 15-minute signed URL: a
  forwarded link or an old URL gets nothing.
tags: [case-studies, user-data-export, sequence, signed-url, privacy]
