title: The life of one export job
alt: >-
  A state diagram in two steps. Step 1: four coloured boxes in a row: a grey Queued box, written on submit with an
  idempotency key; a blue Gathering box with forty checkpointed steps; a teal Packaging box that checks, zips and
  splits once all forty steps are done; and a green Ready box once every file passed the owner check and the email is
  sent. An arrow leads down from Ready to a grey Expired box after 7 days or 5 downloads. Step 2: a red Source failing
  box appears under Gathering when one step errors; it retries with backoff, and after 72 hours an arrow marks the
  source missing and moves the job on to Packaging, while a dashed arrow sends a follow-up job for the gap back to
  Queued.
caption: >-
  An export job only moves forward; a source that keeps failing is marked missing after 72 hours, the rest is delivered,
  and a follow-up job fills the gap.
