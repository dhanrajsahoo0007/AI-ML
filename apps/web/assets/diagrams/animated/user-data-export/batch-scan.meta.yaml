title: Per-user scans against one batched join
alt: >-
  A layout diagram in two steps, in two groups. Step 1, the left group, per user: three blue requester boxes, user 1,
  user 2 and user 20,000, each send a red full-scan arrow to one tall violet table, the 100 TB activity log split into
  365 date partitions; red text adds it up: 20,000 times 100 TB is 2,000 PB read a day, about 10 million dollars a day
  at 5 dollars per TB. Step 2, the right group, one batch: a blue requesters table of 20,000 ids and a row of violet
  date partitions, d1 to d365, both feed a teal box, an inner join on owner_id with one job per date partition, which
  feeds a green box of per-user files sent to staging; green text says 100 TB is read once, about 500 dollars a day or
  2.5 cents an export.
caption: >-
  The log is partitioned by date, not by user: 20,000 separate queries read 2,000 PB a day, one batched join reads
  100 TB.
tags: [case-studies, user-data-export, batching, warehouse, cost]
