title: "Simhash: near-duplicates differ in at most 3 bits"
alt: >-
  A layout of 64-bit fingerprints drawn as rows of 16 hex digits, in two steps. Step 1: page A's fingerprint in pink,
  and page B's below it with three orange digits that differ; the row A xor B has three orange non-zero digits holding
  one bit each, and a green verdict says 3 bits differ, at most 3, so B is a near-duplicate and is not parsed or
  indexed. Step 2: page C's fingerprint differs from A in four orange digits; the row A xor C holds 9 one-bits, and a
  blue verdict says 9 bits differ, more than 3, so C is a different page and goes to the parser.
caption: >-
  Two pages whose simhash fingerprints differ in at most 3 of 64 bits are treated as the same page.
tags: [case-studies, web-crawler, simhash, near-duplicates, fingerprint]
