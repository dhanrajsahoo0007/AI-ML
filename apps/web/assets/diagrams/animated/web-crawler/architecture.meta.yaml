title: Web crawler high-level architecture
alt: >-
  An architecture diagram in eight steps across six zones: clients, fetch edge, crawl core, application services,
  async pipeline and storage. Step 1: seed URLs enter the green URL frontier; a fetcher takes the next URL, downloads
  the page from a website, and the parser sends every link back to the frontier. Step 2: many fetchers share the
  queue, and a red arrow shows 40 of them hitting one host at once. Step 3: the frontier keeps priority queues and one
  queue per host, and leases a URL only when its host is ready. Step 4: links pass a URL-seen test, a Bloom filter,
  and only new URLs reach the frontier. Step 5: fetchers resolve hosts through a DNS cache and check a robots.txt
  cache refreshed at most daily. Step 6: a content-seen test with a hash and a simhash fingerprint drops duplicate
  pages before parsing. Step 7: raw pages go to a page store in 1 GB files, and a page feed carries each fetch record
  to the indexer and the URL metadata store. Step 8: a recrawl scheduler scans URL metadata for pages that are due and
  sends them back to the frontier.
caption: >-
  Web crawler: a frontier that is polite per host, a URL-seen and a content-seen test, pages in 1 GB files, and
  recrawls by freshness.
tags: [case-studies, web-crawler, architecture, frontier, politeness]
