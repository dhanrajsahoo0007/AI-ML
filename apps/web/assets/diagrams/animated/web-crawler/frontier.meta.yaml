title: "The URL frontier: priority in front, one queue per host behind"
alt: >-
  A layout in two steps. Step 1: a teal prioritiser scores each new URL and sends it to one of three blue front
  queues, high, medium and low. A teal router picks from the front queues with a bias to high priority and appends
  each URL to the green back queue for its host: a.com, b.org, c.net and d.io. Under each back queue a lime heap cell
  shows when that host may be contacted next; b.org at 10:00:01.2 is the earliest, the root. Step 2: a teal fetcher
  leases b.org's head URL, the download takes 0.4 seconds, and b.org goes back into the heap 4 seconds later, at
  10:00:05.2, ten times the fetch time; a note says a 429 or 5xx response doubles the gap, never less than 1 second.
caption: >-
  Priority decides which URL comes next; the heap decides when each host may be contacted again, at ten times its
  last fetch time.
tags: [case-studies, web-crawler, frontier, politeness, priority-queue]
