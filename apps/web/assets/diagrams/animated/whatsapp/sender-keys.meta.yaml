title: Pairwise encryption against sender keys for a group
alt: >-
  A layout in two steps comparing two panels for a 256-member group with 384 member devices. Step 1, the blue
  pairwise panel: Ana's phone in orange encrypts the message 384 times and uploads 384 blue ciphertexts, about 115 KB,
  to a neutral server, which forwards each copy to its device. Step 2, the green sender-key panel: Ana's phone first
  sends her sender key to every member device once over the pairwise sessions, drawn as a dashed green arrow; then
  each message is encrypted once and uploaded as one green ciphertext of about 300 bytes, and the server copies it to
  all 384 devices.
caption: >-
  With a sender key the phone encrypts and uploads a group message once and the server makes the copies; the key
  itself travels pairwise, once.
tags: [case-studies, whatsapp, encryption, groups, fan-out]
