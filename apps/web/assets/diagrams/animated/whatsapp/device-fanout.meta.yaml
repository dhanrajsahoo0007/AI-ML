title: One message, one copy per device
alt: >-
  A layout in two steps. Step 1: Ana's phone, in orange, encrypts one blue ciphertext for Ben's phone, and the server
  queues one violet mailbox entry for it. Step 2: Ben links a laptop and a web client and Ana links a laptop, so the
  same message becomes four rows: four pairwise sessions, four blue ciphertexts and four violet mailbox entries, one
  each for Ben's phone, Ben's laptop, Ben's web client and Ana's own laptop, about 1.2 KB uploaded in all.
caption: >-
  With a key per device, the sender's phone encrypts one copy for every device of the recipient and every other
  device of its own account.
tags: [case-studies, whatsapp, multi-device, encryption, fan-out]
