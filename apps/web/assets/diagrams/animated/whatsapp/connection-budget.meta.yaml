title: Memory per connection and the size of the fleet
alt: >-
  A layout in two steps. Step 1: a bar for one chat server with 128 GB of memory, split into blue socket buffers of
  32 GB, a teal 8 GB for one lightweight process per connection, a pink 8 GB of session state, a neutral 16 GB for the
  operating system and a green 64 GB of headroom, so one million connections cost 48 KB each. Step 2: two bars for
  the fleet that holds 500 million connections with twice the headroom: a short green bar of 1,000 hosts at one
  million connections each, and a long neutral bar of 10,000 hosts at 100,000 connections each.
caption: >-
  At 48 KB a connection one host holds a million phones, so 500 million connections need 1,000 hosts with headroom
  instead of 10,000.
tags: [case-studies, whatsapp, connections, capacity]
