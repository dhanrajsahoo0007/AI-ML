title: End-to-end encrypted messaging high-level architecture
alt: >-
  An architecture diagram in eight steps across six zones: clients, edge, real-time messaging, application
  services, async pipeline and storage. Step 1: Ana's phone and Ben's phone hold TCP connections through a layer-4
  load balancer to a chat server, which delivers the message. Step 2: a routing registry tells each chat server which
  server holds a device's connection. Step 3: the chat server stores the ciphertext in the offline queue, the orange
  accent node, which appends it to a mailbox store; for an offline device the push notifier wakes the phone through
  APNs or FCM. Step 4: phones fetch identity keys and one-time prekeys from the key service and its key store. Step 5:
  a group message arrives as one ciphertext; the group fan-out reads the member devices from the account database
  and writes one copy per device into the queue. Step 6: Ben's linked laptop and web client get their own copies, and
  Ana's phone now sends a copy per device. Step 7: the media service hands out upload URLs, the encrypted file goes
  to the blob store and devices download it through the CDN. Step 8: delivered and read receipts travel back to Ana.
caption: >-
  End-to-end encrypted messaging: the server forwards ciphertext it cannot read, keeps it only until each device
  acknowledges it, and hands out the public keys that let phones encrypt for each other.
