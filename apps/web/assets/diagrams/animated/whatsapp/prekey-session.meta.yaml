title: Starting an encrypted session with an offline phone
alt: >-
  A sequence diagram in two steps with five lanes: Ana's phone in orange, a green key service, a teal chat server, a
  violet offline queue and Ben's phone in orange. Step 1: Ben's phone has earlier uploaded its identity key, signed
  prekey and 100 one-time prekeys. Ana's phone asks for Ben's key bundle and receives the identity key, the signed
  prekey and one-time prekey number 17, which the key service deletes. Ana derives the session key on her phone,
  sends message m1 with a setup header, the chat server stores it in the offline queue and acks Ana with one tick.
  Step 2: Ben's phone connects, the chat server reads his mailbox and delivers m1 with the header, Ben derives the
  same key, decrypts and acks, the queue deletes m1, and Ben's phone tops up its one-time prekeys.
caption: >-
  Prekeys on the server let Ana start a session while Ben's phone is off; each one-time prekey is handed out once and
  deleted.
