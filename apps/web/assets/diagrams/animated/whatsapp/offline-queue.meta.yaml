title: "Store and forward: keep it until the device acks"
alt: >-
  A sequence diagram in three steps with five lanes: Ana's phone in orange, a teal chat server, a violet offline
  queue, neutral APNs or FCM, and Ben's phone in orange. Step 1: Ben is offline; the chat server appends ciphertext
  a91 to Ben's mailbox, waits until two of three replicas have it, acks Ana with one tick and asks the push service to
  wake Ben's phone without any message content. Step 2: Ben's phone connects; the chat server reads the mailbox oldest
  first, delivers a91, Ben acks, the queue deletes a91 and Ben's receipt gives Ana two ticks. Step 3: the ack for a92
  is lost, drawn as a red timeout; a92 is delivered again after the reconnect, Ben's phone has already seen that id,
  acks without showing it twice, and the queue deletes it.
caption: >-
  The server keeps ciphertext only until the device acks it; a lost ack means a second delivery, which the phone drops
  by message id.
tags: [case-studies, whatsapp, store-and-forward, idempotency, sequence]
