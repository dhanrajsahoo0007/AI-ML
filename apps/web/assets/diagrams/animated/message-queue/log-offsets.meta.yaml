title: A partition is a log; a consumer group is an offset
alt: >-
  A layout in two steps. Twelve cells show one partition's messages at offsets 0 to 11, grouped into three segment
  files. Offsets 0 to 3 are grey because they are older than the 7-day retention; offsets 4 to 10 are blue because
  every in-sync replica has them; offset 11 is lime because only the leader has it, so no consumer can read it yet.
  Step 1: a teal box for the billing group points at offset 10 and one for the analytics group points at offset 6.
  Step 2: a green box shows analytics resetting its offset to 4 to replay offsets 4 to 10, while billing stays at 10.
caption: >-
  A partition is a log of offsets; each consumer group is one number per partition, so replay means moving that
  number back.
tags: [case-studies, message-queue, offsets, replay]
