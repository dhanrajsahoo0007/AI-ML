title: Distributed message queue high-level architecture
alt: >-
  An architecture diagram in eight steps across six zones: clients, client library, partition leaders, coordinators,
  replication and upkeep, and storage. Step 1: producers append to one broker, which writes a file, and consumers
  fetch from an offset. Step 2: a partitioner in the client library hashes each key to a partition. Step 3: consumer
  groups join a group coordinator, which keeps their offsets in an internal log. Step 4: follower replicas pull from
  the green partition leader and copy its segment files. Step 5: the producer sends with acks=all. Step 6: a
  controller quorum keeps a metadata log of leaders and in-sync sets, and clients find leaders through a bootstrap
  address. Step 7: a log cleaner deletes old segments and compacts keyed topics. Step 8: a transaction coordinator
  gives producers ids, writes commit markers to the partitions and keeps its state in the internal log.
caption: >-
  Distributed message queue: a replicated, partitioned log; producers append by key, consumer groups read from their
  own offsets, and a controller quorum decides who leads.
