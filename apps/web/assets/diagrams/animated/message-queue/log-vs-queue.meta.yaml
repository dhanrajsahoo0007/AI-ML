title: A log keeps messages and offsets; a queue hides and deletes
alt: >-
  Two panels in two steps. On the left, a log of six blue messages, m1 to m6; a teal box for group billing points at
  m5 and one for group analytics points at m2, and nothing is deleted by reading. On the right, a queue of the same
  six messages: m1 is grey because it was acknowledged and deleted, m2 and m4 are lime because workers A and B have
  received them and they are hidden for 30 seconds, and the rest are blue. Step 2: worker A is still busy after 30
  seconds, so m2 becomes visible again and worker C receives it too, drawn as a red arrow.
caption: >-
  A log keeps every message and gives each group an offset; a queue hides a received message for a timeout and
  deletes it on the ack, and a hidden message is not a locked one.
tags: [case-studies, message-queue, visibility-timeout, queue]
