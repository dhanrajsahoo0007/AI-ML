title: The moderation release gate
alt: >-
  A release gate. A grey hate prompt release, with a bug that doubles false alarms in Germany only, fans out to seven
  checks and on to a red result. Six checks pass in lime: the paired hold-out test (worst drop 0.8 points against a
  3.1-point margin), language and market slices (no warnings), the red-team regression set (no injection allowed in
  100), CSEA and NCII never reaching the model (10,000 known hashes replayed, none lost), the shadow action rate within
  10% (hate up 2.1%) and latency and cost (text 97 ms at p95, cost up 0.4%). The seventh, the live replay per market
  and harm family, fails in red: the German hate slice saw 118 and then 124 false actions on 2,000 known-fine
  near-miss units an hour, above the trip line of 84 in two consecutive hours. The red result says block and roll
  back. Notes say about 60 false alarms are expected per slice-hour, a doubling is caught within two hours 99.96% of
  the time, and the global replay saw 21, under its trip line of 35, because a bug confined to German hate trips it in
  only about 0.6% of hours; measured values are illustrative.
caption: >-
  Every classifier, edge, prompt, policy or model change passes seven gates; this hate release passes six, then trips the per-market replay of known-fine near-miss units in Germany and is rolled back.
