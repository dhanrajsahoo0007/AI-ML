title: Measuring what was missed, on views, with calibration in the tails
alt: >-
  An evaluation figure in three steps. Step 1: five boxes in a row: a grey uniform sample of views, 145,000 labels a
  week; a grey snapshot with the policy version and a CSEA hash screen; a green labeller from a different model family
  on 2 GPUs that sees no classifier scores; orange people who confirm every positive, about 290 labels a day; and a
  blue detection rate of 0.864, a sensitivity of 0.90 times the confirmer's 0.96. A note says sensitivity is measured
  on positives other routes found, so it reads high and prevalence low. Step 2: violating views per 10,000 on a rolling
  4-week window, each family with a blue two-sided 95% interval, its point and a red target line. On a 0 to 10 scale:
  spam 6.04 with an interval of 4.62 to 7.86 and a one-sided bound of 7.58 under 9, from 30,000 labels a week; hate
  5.29, 4.03 to 6.83, bound 6.59 under 8, from 35,000. On a 0 to 2 scale: adult and graphic 0.54, 0.20 to 1.05, bound
  0.96 under 1.5; threats and self-harm 0.43, 0.16 to 1.14, bound 1.03; terrorism 0.042, 0 to 1.10, bound 0.89. A note
  says a one-week test would fail 53 to 68% of weeks at the design's own rate, terrorism every week, and that seeing a
  25% rise in hate needs about 137,500 labels a week. Step 3: horizontal bars of calibration labels per score bin at
  each family's lower edge: CSEA 7,668 and NCII 1,522 in orange, labelled only by specialists; terrorism 5,107,
  threats 3,058, graphic 972, hate 354 and spam 240 in blue; about 115,000 labels a quarter, 1,264 a day. A final note
  says every rate is illustrative and CSEA and NCII are measured by hash re-scans, not sampling.
caption: >-
  What was missed, on views: an independent labeller reads a uniform sample, people confirm its positives, and each
  family’s 4-week interval sits under its target; calibration labels per score bin set the band edges. Rates are
  illustrative.
