title: A month of moderation, to scale
alt: >-
  Horizontal bars in US dollars a month, built in two steps. Step 1, on a scale to 7 million: orange people, 6.76
  million for 1,492 full-time staff, dwarf every other line; grey engineering 0.90 million (0.60 to 1.20 million),
  policy staff 0.20 million (0.15 to 0.25 million), legal and compliance 90,000 and infrastructure 60,000; green model
  calls with the labeller 50,530; violet training-label vendors 30,000; green classifiers on 14 GPUs 25,200 and the
  fallback on 8 GPUs 14,400. In all about 8.13 million (7.78 to 12.20 million), about 1.94 US dollars per 1,000 units;
  at ten times the model prices the model line would be about 0.51 million. Step 2, on a scale to 35 million: the
  design all-in at 8.13 million in lime against three red alternatives: the model on every unit with all-small models,
  1.80 million for the model line alone; the model on every unit as designed, 17.22 million; and people on the band in
  place of the model, 33.93 million. Every line but the model prices is illustrative.
caption: >-
  A month to scale: people about 6.76M USD of about 8.13M, models about 50,500; every line but the model prices is
  illustrative.
