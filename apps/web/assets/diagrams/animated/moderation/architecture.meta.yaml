title: The content moderation system, built in eight steps
alt: >-
  An architecture diagram in six zones, built in eight steps. Step 1: orange Kestrel apps, 140 million units a day,
  send every post, comment, edit and image through a grey post API to a dark accent decision engine, which scores it
  with a green text encoder and writes every decision to a violet decision-records store of 28 GB a day. Step 2: a lime
  hash-and-rules card joins to the right of the engine; it calls green PhotoDNA and the vendor CSEA model with a
  timeout and reads violet hash banks. Step 3: a grey check API joins the request inside the post, and a lime
  classifiers card for text, images, OCR and age now calls the text encoder; one global threshold per harm family.
  Step 4: a lime hold-and-band queue holds severity 0 and 1 band units out of view and sends one family a call to a
  green policy model, about 3.68 million calls a day, with a dashed self-hosted fallback beside it; the engine reads
  each family's edges and policy version from a violet policy registry. Step 5: held and escalated units, and vetted
  hash matches, go to lime review queues, which route them by severity and language to orange reviewers, about 1,492
  full-time staff, who work in an orange review app that blurs content until clicked; decisions return to the engine.
  Step 6: a teal enforcement card writes every action to a violet action ledger and CSEA and NCII evidence to violet
  vaults, and orange users, notifiers, victims and authorities send reports and appeals through the post API. Step 7:
  in the offline zone, a lime prevalence card labels samples into violet gold sets, whose hold-out feeds a lime policy
  gate that writes new versions to the policy registry. Step 8: a lime red team takes the misses that prevalence finds
  and adds every successful attack to the gate's regression set.
caption: >-
  Every unit passes hashes and classifiers inside the post request; the worst harms wait out of view for a person, a
  policy-reading model settles most of the uncertain band, and a sample of views measures what all of them missed.
