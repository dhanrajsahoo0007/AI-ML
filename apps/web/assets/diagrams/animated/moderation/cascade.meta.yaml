title: The moderation cascade a day
alt: >-
  A funnel of five stages on Kestrel's illustrative volumes, built in two steps. Step 1: lime hash lists and own banks
  meet all 140 million units and match 548,240 (0.39%); lime classifiers score every unit and remove 201,748 at once
  (0.14%); a lime band of 2.52 million units follows, of which 562,833 are held out of view (0.40%); a green
  policy-reading model reads the 2.52 million band units; orange people get 129,129 items from the cascade. Step 2:
  grey side inputs join with dashed arrows, not as funnel stages: reports routed by reason (940,800 model calls), reach
  re-checks at 1,000 views (193,756 calls) and local law outside the band (18,805 calls) feed the model, for 3.68
  million calls a day, 2.6% of units; reports, notices and legal queues (46,035 items), appeals from users and
  notifiers (63,751) and QA, calibration, prevalence and NCII requests (9,022) feed people, for 247,937 items a day,
  0.18% of units. A note says every volume and per-tier share is illustrative.
caption: >-
  The cascade a day on Kestrel’s illustrative volumes: 140M units narrow to about 2.6% that reach the model and 0.18%
  that reach a person; reports, re-checks, appeals and QA join from the side.
