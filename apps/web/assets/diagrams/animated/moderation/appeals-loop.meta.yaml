title: Appeals and what an overturn changes
alt: >-
  A loop in two steps. Step 1: a teal action with its statement of reasons (ground, scope, whether automation
  decided) leads to an orange user appeal within 6 months, an orange appeal queue of 55,370 a day answered within 72
  hours at p95, and an orange box for a different person, who sees the model's rationale only on request. From that
  person, arrows lead to a grey upheld box, 36,639 a day with a notice, and a red overturned box, 18,730 a day or
  33.8%. Step 2: from the overturned box the loop runs right to left along the bottom through lime boxes: restore the
  post with the strike removed, unbank the hash entry and re-review all its matches, then a violet box that adds a
  near-miss to the gold set for retraining and the next release's gates, with a dashed arrow back up to the action.
  Above, an orange notifier whose report got "no action" files a notifier appeal, 8,381 a day, into the same queue.
  Notes say appeals take about 923 handling hours a day, the model never re-judges its own decision, and the overturn
  rate is illustrative: for hate it is 43.5%, 29.0% or 22.3% if 4%, 8% or 12% of right actions are appealed.
caption: >-
  An appeal goes to a person who did not decide first; an overturn restores the post, removes the strike, unbanks the
  hash entry, re-reviews its matches and adds a near-miss to the gold set.
tags: [genai, moderation, appeals, human-in-the-loop, case-study]
