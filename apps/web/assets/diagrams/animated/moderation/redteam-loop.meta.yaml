title: The red-team loop for a moderation cascade
alt: >-
  A loop in two steps. Step 1: a red list of ten attack families, 100 units each a month: homoglyphs, zero-width
  characters and leetspeak; words split across comments; text inside an image; image edits against the hash; new coded
  terms and paraphrased hate; context flips and counter-speech; instructions aimed at the model; code-switching and
  romanised scripts; fresh accounts probing the oracle; and synthetic media, including AI-generated CSAM. The first
  family feeds a lime box that runs the whole cascade, which leads to a red result: 23 of 100 homoglyph slurs get
  through, 15.8% to 32.2% at 95%. Step 2: a teal box fixes the cause, such as the confusables table or a term rule, in
  hours; a lime re-run finds 3 of 100, 1.0% to 8.5%, and the attack becomes a regression test; a dashed arrow returns
  to the run for next month, and an orange box of misses tagged each week from prevalence, appeals and reports feeds it
  too. Notes say 100 units a family separates families about 15 points apart, rule fixes ship in hours while a
  classifier retrain takes weeks, and the counts are illustrative.
caption: >-
  Ten attack families of 100 units a month run through the whole cascade; a fix turns 23 of 100 successful homoglyph
  slurs into 3, and every success becomes a regression test.
