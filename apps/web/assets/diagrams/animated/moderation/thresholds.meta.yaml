title: Thresholds from the cost of each error, per harm family
alt: >-
  A three-step figure. Step 1: a table of the seven harm families with their severity, the cost of a false alarm and
  of a miss in harm units, the threshold tau in red, the band and what happens while a unit waits. Child sexual
  exploitation costs 50 and 20,000 for tau 0.0025, NCII 10 and 2,000 for 0.0050, terrorism 20 and 2,000 for 0.0099,
  threats and self-harm 5 and 400 for 0.0123; these four are held in orange, for a specialist or for the mid model and
  then a person. Hate costs 8 and 6 for tau 0.571 with a lime band of 0.0417 to 0.942, adult and graphic 3 and 4 for
  0.429 with a band of 0.0156 to 0.936, spam 1 and 0.5 for 0.667 with a band of 0.0602 to 0.970; these three publish
  with limited distribution in green while the small model decides. Step 2: hate on a probability axis from 0 to 1: a
  lime band from 0.0417, where a model "yes" lifts the posterior to tau, to 0.942, where a "no" drops it to tau, with
  the red tau line at 0.571; below the band a unit is allowed and above it removed without a model call. A second
  axis shows the EU local-law withhold apart, in blue, from 0.0161 to 0.858 with tau 0.333, applied in the EU only
  with the legal ground. Step 3: the German comment's raw score 0.02 sits left of the band, allowed; folded, it scores
  0.30, inside the band; a green arrow carries it to a posterior of 0.929 after the model's "yes", above tau, so it is
  removed. A note says costs are harm units, not dollars, and every rate is illustrative.
caption: >-
  Each family’s threshold comes from the cost of its two errors; the band is where the model’s verdict can flip the
  decision, and local law is a separate, market-scoped withhold line.
