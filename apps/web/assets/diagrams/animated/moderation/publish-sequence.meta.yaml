title: A German hate comment and a held threat, message by message
alt: >-
  A sequence diagram with six lanes: an orange user, a grey post API, a teal check service, a green policy model, an
  orange reviewer and teal notices. Step 1: a German comment that hides a slur behind a Cyrillic look-alike reaches the
  check service; the raw text scores 0.02, the folded text 0.30, inside the hate band 0.0417 to 0.942, so the check
  returns "limited" at about 34 milliseconds and the user sees the comment posted but not recommended. The check
  service then sends the hate policy, the German addendum and the thread to the policy model, which answers in about
  1.2 seconds: violates rule H2.3, illegal in Germany. The posterior after that "yes" is 0.929, above the threshold
  0.571. Step 2: the comment is removed worldwide under the terms with a first strike, a statement of reasons reaches
  the user and the DSA database in a 15-minute batch of about 4,487, and the next day the user appeals; a German-pool
  reviewer who did not decide first, and who sees the model's rationale only on request, upholds the removal. Step 3:
  a post reading "tonight I end it, nobody will miss me" scores 0.30, above the release line 0.170, so it is held with
  no model call, only the author sees it, support resources and a helpline appear at once, and the urgent pool in the
  author's language decides within 10 minutes at p95: a welfare referral or a release.
caption: >-
  One German hate comment: limited in about 34 ms, removed after the model’s “yes” in about 1.2 s, a statement of
  reasons in the next DSA batch, and an appeal upheld by a different reviewer; a held threat goes straight to the
  urgent pool.
tags: [genai, moderation, sequence, appeals, trust-and-safety, case-study]
