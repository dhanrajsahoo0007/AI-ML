title: Holds for the worst harms, limited distribution for the rest
alt: >-
  A flow in two steps. Step 1: a lime pre-publish check, about 34 milliseconds at p50 and 97 at p95 for text, sends
  each unit down one of three rows. Clear units, outside every band, wait for nothing and are allowed, nudged or
  removed at once, 201,748 removals a day. Severity 2 and 3 band units (hate, graphic, spam) are published with
  limited distribution, not recommended or searchable, while the small model decides in about 1.2 seconds at p50 and
  4.9 at p95, about 1.99 million units a day, in green. Severity 0 and 1 band units (CSEA, NCII, terrorism, threats)
  are held so that only the author sees them, shown to the author as posted; a model "no" releases them in about 2.0
  seconds at p50 and 6.3 at p95, and anything else goes to a person, 562,833 held units a day, in orange. Step 2: two
  boxes give the reasons. Why hold severity 0 and 1: a threat at P 0.30 risks 0.30 times 400, 120 harm units, if
  shown, while holding it costs 0.70 times 0.05, 0.035, a delay rather than a removal, and the hold line sits below
  every lower edge. Why not hold severity 2 and 3 too: about 1.99 million posts a day would sit pending for seconds to
  avoid errors that cost little, and a hold is no oracle because "under review" shows only once a person holds a unit.
caption: >-
  Three paths after the pre-publish check: severity 0–1 band units are held out of view (the author still sees them as
  posted), severity 2–3 band units publish with limited distribution while the model decides.
tags: [genai, moderation, holds, latency, case-study]
