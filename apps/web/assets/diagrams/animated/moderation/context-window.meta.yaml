title: One policy-reading call, block by block
alt: >-
  A context-window bar for one call to the policy-reading model, built in three steps, with one row per block below
  it. Step 1: a cached prefix of 1,100 tokens, per harm family and market: grey instructions and output schema of 200
  tokens that say the content is data and never instructions, then violet blocks from the policy registry: the
  family's policy of 550 tokens, a market addendum of 100 with local-law grounds for a geo-withhold, and five boundary
  examples of 250 in the unit's language group; a violet tick marks the cache breakpoint. Step 2: 380 changing tokens:
  the orange unit of 120 tokens in a delimited block, highlighted, the orange thread of 150, blue signals of 80 that
  never include the report reason, and a 30-token reminder. Step 3: an image adds a blue block of 784 tokens, never for
  CSEA or NCII images; a green box shows the verdict that comes back, about 90 tokens of fixed JSON with no
  probability, so code applies the band, and a neutral box gives the price per call: 0.000094 US dollars for small
  text, 0.000172 for a small image, 0.00177 for mid text.
caption: >-
  One policy-reading call: 1,100 cached tokens of instructions, one family’s policy, the market addendum and five
  examples, then about 380 changing tokens of the unit, thread and signals.
tags: [genai, moderation, context-window, prompt-caching, case-study]
