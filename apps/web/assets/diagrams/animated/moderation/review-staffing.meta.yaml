title: People are the cost of moderation
alt: >-
  A staffing figure in three steps. Step 1: horizontal bars of handling hours a day by queue, severe queues in red and
  others in grey: appeals 923 hours, threats and self-harm 873 in red, the hate band 400, terrorism 273 in red,
  escalated reports 267, threat reports 219 in red, CSEA 204 in red, CSEA and NCII reports 120 in red, the spam band
  114, the graphic band 109 in red, notifier appeals 105, legal-ground notices 90, QA double review 69 and eight smaller
  queues about 200; about 3,965 handling hours a day, 1,919 of them severe and capped at 4 hours a shift. Step 2: three
  boxes: orange urgent pools staffed per hour by Erlang, with specialist hubs peaking at 20, 12 and 21 reviewers in
  queue and threat pools at 93 across 16 languages; orange 6,282 on-shift hours a day becoming 1,492 full-time staff,
  1,264 reviewers and 228 support, 6.76 million US dollars a month; and a grey sensitivity box: handle times 1.5 times
  longer need 1,897 staff, twice as long 2,303, about 10.48 million US dollars. A note says the 4-hour cap costs no
  extra staff while about 1,066 hours of other work fill the rest of the shift, and people are about 83% of the monthly
  total. Step 3: a table for threats and self-harm: lowering the band's lower edge from 0.02 to 0.00125 lifts recall
  from 65.0% to 83.6% while review hours rise from 576 to 1,555 a day and cost from 22,820 to 63,540 US dollars a
  day; the design row, 0.005, gives 75.9% for 859 hours, highlighted in lime, with the harm units avoided against the
  row above. A final note says harm units are not dollars and every volume and rate is illustrative.
caption: >-
  People are the cost: about 3,965 handling hours a day by queue, severe work in red, staffed from an hourly roster to
  about 1,492 FTE; handle times and volumes are illustrative.
