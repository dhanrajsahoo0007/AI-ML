title: Moderation latency per path, p50 and p95
alt: >-
  Four latency waterfalls in milliseconds, revealed one per step, each on its own scale. Step 1: the text check inside
  the post request: a grey 5 ms hop, lime normalise 2 ms and rules 4 ms, a green features-and-classifier bar of 21 ms
  and a 2 ms decision end at 34 ms at p50 (97 at p95), left of a red 50 ms target line. Step 2: images after upload: a
  25 ms fetch, then three parallel branches, a lime hash and PhotoDNA branch of 158 ms, green image classifiers of 30
  ms and an OCR branch of 80 ms, and a decision at 198 ms (500 at p95) under the red 300 ms target; a dashed line at
  110 ms marks the degraded path when PhotoDNA is down. Step 3: a held threat the mid model clears: a 34 ms check, a 5
  ms enqueue, a 200 ms queue wait, a 1,786 ms mid-model call and a 20 ms release, visible again at 2,045 ms (6,307 at
  p95). Step 4: every path after publish at p95 on one scale, all left of a red 10-second line: held text 6,307 ms,
  held image 7,110, band text on the small model 4,910, band image 5,310 and band units on the mid model 6,210, each
  with its p50 printed after the bar. A note says every stage latency is an illustrative fit.
caption: >-
  Illustrative stage latencies, p50 and p95: the text check fits inside the post request, a held unit the model clears
  is visible again within 10 s, and the PhotoDNA branch sets the image path.
tags: [genai, moderation, latency, waterfall, case-study]
