title: Shipping a policy change in a day
alt: >-
  A timeline in hours from 0 to 18, built in three steps. Step 1: eight bars run one after another: orange writing the
  rule, the term list and five examples, 2 hours; finding 400 new gold items, 1 hour; labelling and adjudicating with
  translations in parallel, 2 hours; a lime comparison of the old and new prompt on the hold-out, about 1 minute; a
  lime shadow on live band traffic, 6 hours; orange experts reading 300 disagreements, 1.25 hours; a teal canary in one
  market, 4 hours; and a teal rollout to all markets, 1 hour, ending at a dashed line marked live everywhere at 17.3
  hours. A green line at hour 0 says a term rule sends every match to the model from the start, 20,000 a day. Step 2:
  four lime gate boxes: new-rule recall 186 of 200, interval 0.886 to 0.958, above 0.85; near-miss fine 190 of 200,
  0.910 to 0.973, above 0.90; 282 of 300 sampled disagreements explained, of 5,070 in the shadow; canary precision
  0.90, 0.838 to 0.940 on 137 labels. Step 3: a violet backfill box: 400,000 matches in the last 30 days become about
  240,000 removals, about 37.6 US dollars, spread over 7 days, highest reach first, with no strikes; a neutral box gives
  the load: about 20,400 appeals, 48.6 appeal hours a day for 7 days, and 73,440 EU statements. Every duration and
  count is illustrative.
caption: >-
  A new coded slur is live in about 17.3 hours: a term rule routes every match to the model on day 0, gates and a
  shadow test it, one market canaries it, and a backfill re-checks 30 days of posts.
