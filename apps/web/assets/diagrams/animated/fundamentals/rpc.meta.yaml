title: A gRPC call from stub to server
alt: A sequence diagram with four lanes, checkout code, client stub, server stub and inventory code; checkout calls a generated function, the client stub encodes the request into 15 bytes and sends a HEADERS frame and a DATA frame on one HTTP/2 stream, the server stub decodes it and calls the inventory handler, the reply returns with grpc-status 0, and in a final step the inventory handler is stuck so the 300 ms deadline fires, checkout gets DEADLINE_EXCEEDED and the client cancels the stream.
tags: [fundamentals, apis, rpc, grpc, system-design]
