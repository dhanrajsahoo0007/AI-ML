title: TLS 1.3 handshake
alt: A sequence diagram with three lanes, a laptop, the cafe Wi-Fi and a ticket server, in which the laptop sends a ClientHello with its key share and the site name that the Wi-Fi can read, the server answers with its own key share and then sends its certificate, a signature and a Finished message encrypted, the laptop checks the certificate chain, and the laptop's Finished message and the GET request travel together so the encrypted page comes back after one round trip while the Wi-Fi sees only sizes and timing.
