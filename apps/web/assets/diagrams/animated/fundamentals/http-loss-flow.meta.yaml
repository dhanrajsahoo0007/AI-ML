title: One lost packet over TCP and over QUIC
alt: A sequence diagram with three lanes, phone browser, network and web server. In the first part, over HTTP/2 on TCP, the server sends three image segments, the second is lost in the network, the third arrives but is held back, the browser reports the gap, and only after the resend are images two and three shown together. In the second part, over HTTP/3 on QUIC, the same loss happens but image three is shown at once and only image two waits for its resend in a new packet.
caption: A lost packet freezes every HTTP/2 stream on a TCP connection; on QUIC only the stream that lost data waits.
tags: [fundamentals, networking, http, quic, head-of-line-blocking, system-design]
