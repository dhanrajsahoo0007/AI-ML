title: API gateway and backends for frontends
alt: A bike-share phone app, an operator web dashboard and partner apps all send HTTPS requests to one API gateway, which checks each token with keys from an auth service, counts requests per key in a shared store, and routes calls over gRPC to rides, bikes, payments and users services; in later steps a mobile backend and a web backend sit between the gateway and the services and each builds its own client's screens, while partner apps keep calling the bikes service through the gateway.
tags: [fundamentals, apis, api-gateway, bff, system-design]
