title: CDN edge with a miss, a hit and a revalidation
alt: Three readers in Mumbai request the same poster photo from a CDN edge server in Mumbai; for the first reader the edge has no copy, so it fetches the photo from the origin server in Virginia, about 200 ms away; the second reader two minutes later gets the stored copy straight from the edge in about 10 ms; the third reader the next day arrives after the copy's TTL has run out, so the edge asks the origin whether the photo changed and gets a small 304 Not Modified reply.
