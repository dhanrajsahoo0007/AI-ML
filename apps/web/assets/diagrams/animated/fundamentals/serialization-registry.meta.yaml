title: Avro with a schema registry
alt: Scooter statuses reach an ingest service that registers its Avro schema with a schema registry, gets id 42 and writes 17-byte messages, the id plus 12 Avro bytes, to a Kafka topic; a battery job polls the topic, fetches schema 42 from the registry to decode the bytes, and in the last step a CI check that changes battery from int to string is refused by the registry with a 409.
tags: [fundamentals, serialization, avro, kafka, schema-registry, system-design]
