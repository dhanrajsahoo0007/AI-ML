title: Data in transit, data at rest, and the keys
alt: A layout drawing built in three steps; first a browser, a load balancer, a shop app and an orders database joined by TLS on every hop, then the database pages and a nightly backup shown as AES-256 ciphertext, and finally a key service holding the master key that unwraps a data key stored beside the data, plus a secrets manager that hands the shop app its database password and API keys at start-up.
