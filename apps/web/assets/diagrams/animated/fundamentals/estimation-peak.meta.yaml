title: Average versus peak traffic over one day
alt: A bar chart of a photo app's uploads per second for each of the 24 hours of a day, low overnight and highest at 21:00, with a dashed line marking the daily average of about 230 uploads a second and a second dashed line marking the busiest hour at about 700 a second, three times the average.
