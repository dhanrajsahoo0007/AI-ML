title: Sidecar proxies between two services
alt: The Orders app sends a plain HTTP call to a sidecar proxy in its own pod, that sidecar sends it over mutual TLS to the sidecar in the Payments pod, which checks the caller's certificate and hands the call to the Payments app as plain HTTP, while a control plane below pushes configuration and certificates to both sidecars.
tags: [fundamentals, networking, proxies, service-mesh, tls, system-design]
