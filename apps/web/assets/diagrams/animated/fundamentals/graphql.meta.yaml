title: GraphQL resolvers calling services
alt: An architecture diagram in three steps in which a phone app sends one query to a GraphQL server whose query engine runs a resolver for each field, Query.me calling the user service once and User.subscriptions calling the show service once, then Show.latestEpisode running once per show and calling the episode service 40 times, and finally a DataLoader collecting the 40 show ids and making one batched call to the episode service instead.
