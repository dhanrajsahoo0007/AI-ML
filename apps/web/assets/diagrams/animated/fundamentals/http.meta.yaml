title: Head-of-line blocking vs multiplexing
alt: A sequence diagram with three lanes, browser, web server and recommendations service. In the first part, on one HTTP/1.1 connection, the browser asks for the next-chapters list, the web server waits about 800 ms for the recommendations service, and only after that reply arrives can the browser ask for image p1 and then image p2. In the second part, on one HTTP/2 connection, the browser sends all three requests at once as streams 1, 3 and 5, the two images come back first, and the slow next-chapters reply arrives last on stream 1.
caption: One slow reply blocks an HTTP/1.1 connection; HTTP/2 lets the other streams pass it.
