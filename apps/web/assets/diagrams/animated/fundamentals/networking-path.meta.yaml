title: One packet's trip and the layers each device reads
alt: A packet leaves a laptop in Chennai, which first asks a DNS resolver for the server's address, then passes a home router in 2 ms, an ISP router in 5 ms, the internet core in 60 ms and a load balancer in Frankfurt in 1 ms before reaching the web server 0.2 ms later, with each box noting which layers that device reads.
