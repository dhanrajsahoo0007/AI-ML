title: Short polling timeline
alt: A sequence diagram with four lanes, order page, API server, orders database and kitchen tablet. At 0 seconds the page asks for order 1042, the API reads the database and answers 200 baking with version v1, and the page waits 5 seconds. At 5 seconds the page asks again, the API reads the database again and answers 304 Not Modified because nothing changed. At 12 seconds the kitchen marks the order out for delivery, but the page only learns it at its next poll at 15 seconds, three seconds after the change.
caption: The page asks every 5 seconds. Most answers say nothing new, and a real change waits for the next poll.
tags: [fundamentals, realtime, polling, http, system-design]
