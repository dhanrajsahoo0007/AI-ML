title: Back-of-the-envelope estimation for a photo app
alt: A left-to-right flow of numbers in five steps in which ten million daily users uploading two photos each become twenty million uploads a day, then about 230 uploads a second, then a peak of about 700 a second, and from those a storage need of ten terabytes a day and an upload bandwidth of about 2.8 gigabits a second.
