title: Server-sent events with reconnect
alt: A sequence diagram with three lanes, the fan's browser, the live server and the match feed. The browser sends one GET and the server answers 200 with the event-stream type and keeps the body open. The feed publishes a goal with id 41 and a card with id 42, and the server writes each one down the open response. The connection is lost while events 43 and 44 are published, and the browser waits 3 seconds. It reconnects with the header Last-Event-ID 42, the server reads the feed's log after 42, replays events 43 and 44, and then sends event 45 live.
caption: One long response carries every event. After a drop, the browser sends the last id it saw and the server replays what it missed.
