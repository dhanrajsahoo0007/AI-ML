title: Home screen with and without a BFF
alt: First the phone app asks the API gateway for its active ride and then, in a second round trip, for nearby bikes, downloading 12 KB and 30 KB; then the phone makes one GET /home call, the gateway passes it to a mobile backend that asks the rides and bikes services at the same time and returns a 4 KB home screen, cutting the time from about 240 ms to about 125 ms.
tags: [fundamentals, apis, api-gateway, bff, aggregation, system-design]
