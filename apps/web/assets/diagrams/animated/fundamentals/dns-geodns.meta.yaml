title: GeoDNS with health checks and failover
alt: Two readers, one in Sydney and one in Paris, look up the same name at a GeoDNS service, which sends the Sydney reader to a Singapore region and the Paris reader to a Frankfurt region; a health checker probes both regions every 10 seconds and reports their status to GeoDNS, and when Singapore fails its probes, GeoDNS sends the Sydney reader to Frankfurt once the cached answer's TTL expires.
tags: [fundamentals, networking, dns, load-balancing, failover, system-design]
