title: Where an API's contract is enforced
alt: An architecture diagram in three build steps. A phone app and a partner's sync script call an Orders API, which reads and writes an orders database. Next, the Orders API checks an idempotency store that maps each idempotency key to the reply it already sent. Last, an API gateway is placed in front of the Orders API, and every client call passes through it so it can check rate limits and route each request to version 1 or version 2.
caption: The Orders API owns resources and verbs, an idempotency store makes retries safe, and a gateway enforces limits and versions.
