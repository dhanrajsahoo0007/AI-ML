title: REST resource model for a pet clinic API
alt: A pet clinic API drawn as resources in three steps; the owner app reads /pets/42 from the /pets collection next to /clinics and /clinics/7, then /pets/42 gains a sub-collection of appointments that links to /appointments/981, which links to its clinic and is built from three database tables, and finally the owner app books with POST to the appointments collection while the clinic desk updates the booking with PATCH.
caption: Resources, the links between them, and the standard methods clients use on them.
tags: [fundamentals, apis, rest, resources, system-design]
