title: Integrating with a bank's SOAP API
alt: A payments service sends a plain JSON call to a single SOAP adapter, which signs the XML with a key from a certificate store, records the raw envelope in a message log, and calls the partner bank's SOAP API over HTTPS, while the adapter's client code is generated from the bank's WSDL contract.
