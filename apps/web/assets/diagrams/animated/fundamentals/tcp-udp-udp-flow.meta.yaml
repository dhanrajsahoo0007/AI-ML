title: UDP send and forget
alt: A sequence diagram with three lanes, phone, internet and game server, showing the phone sending steering input and the server sending race state datagrams every 33 ms with no handshake or acknowledgement, then state 43 lost in the internet while the phone draws state 44 without waiting, then the phone reporting the last state it saw so the server sends only the changes since state 44.
