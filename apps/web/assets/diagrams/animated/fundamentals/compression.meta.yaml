title: Bytes at each hop, before and after compression
alt: A layout drawing in three rows built in three steps; first a 2.4 MB trail list travels from the app through the origin and a CDN edge to a phone on 3G at full size and takes 19 seconds on the last hop, then the origin compresses it once with Brotli to about 260 KB so every later hop carries the small copy and the phone downloads it in about 2.1 seconds, and finally a trail photo goes from 36 MB of raw pixels to a 3.5 MB JPEG to a 150 KB resized WebP, where gzip on top saves under one percent.
