title: Protobuf and Avro bytes in hex
alt: Two rows of hex cells spell out the same scooter status, the first as 15 Protobuf bytes with a tag byte naming fields 1 to 4 and a length byte before the six letters of SC-208, the second as 12 Avro bytes with no tags, where zigzag encoding turns 87 into AE 01 and 1290 into 94 14.
