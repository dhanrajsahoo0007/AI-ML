title: Long-poll fleet
alt: An architecture diagram in which 30,000 open chat widgets each hold one request through a load balancer with a 60 second idle cut to three poll servers that hold about 10,000 requests each. In the second step a chat service saves an agent's reply in a message store and publishes it to a pub/sub topic, which delivers it to the poll server holding that chat's request, and any poll server can read missed messages from the store after a client's cursor.
caption: Holding requests costs memory and sockets on every poll server, and pub/sub gets each message to the one server that holds the waiting request.
tags: [fundamentals, realtime, long-polling, pub-sub, system-design]
