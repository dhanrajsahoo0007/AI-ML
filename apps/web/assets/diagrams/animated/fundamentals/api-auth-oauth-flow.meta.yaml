title: OAuth 2 code flow with PKCE
alt: A sequence diagram with four lanes, the user's browser, the PlanMyWeek app, the Larder login server and the Larder API, in which the app redirects the browser to Larder with a hashed challenge, the user logs in and allows reading recipes, Larder redirects back with a one-time code, the app posts the code and its secret verifier to Larder and receives a 15-minute access token and a refresh token, calls the API with the access token, and later trades the refresh token for a new pair while the old refresh token stops working.
tags: [fundamentals, apis, oauth, pkce, authorization, system-design]
