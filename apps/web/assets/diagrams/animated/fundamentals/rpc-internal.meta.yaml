title: REST at the edge, RPC inside
alt: A mobile app and a browser send JSON over HTTPS to an API gateway, which forwards each order to a checkout service that calls inventory, pricing and payments services; in the first step every internal hop is JSON over HTTP, and in the second step the gateway and the internal services talk gRPC while the public side stays REST.
