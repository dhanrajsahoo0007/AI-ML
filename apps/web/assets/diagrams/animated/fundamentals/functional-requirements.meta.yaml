title: From a vague prompt to numbered functional requirements
alt: A chat app prompt is turned into requirements in three columns; on the left the people who use it (a member, a group admin and a member who is away), in the middle ten candidate flows they mention, and on the right seven numbered requirements F1 to F7 with one-to-one chat first, plus three flows set aside as out of scope (calls, search and payments).
