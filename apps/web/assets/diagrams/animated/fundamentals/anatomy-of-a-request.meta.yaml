title: A request's journey, hop by hop
alt: A sequence diagram with five lanes, browser, load balancer, app server, cache and database, showing nine numbered hops of one first page load from top to bottom, each labelled with its cost in milliseconds, from a 20 ms DNS lookup and two 40 ms handshakes for TCP and TLS, through a 20 ms request, a 1 ms cache miss, an 8 ms database query and 10 ms of work, to a 20 ms response, about 160 ms in total.
tags: [fundamentals, latency, networking, request-lifecycle, system-design]
