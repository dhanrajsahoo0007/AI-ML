title: Sessions on one server vs in a shared store
alt: A browser logs in on server A, which keeps the session in its own memory, so when the next request lands on server B, B does not recognise the cookie and sends the user back to the login page; in the second step server A saves the session in a shared session store, server B reads it from there and returns the user's cart.
caption: Stateful vs stateless app servers
