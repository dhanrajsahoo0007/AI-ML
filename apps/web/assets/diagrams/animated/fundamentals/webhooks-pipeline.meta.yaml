title: Webhook delivery, end to end
alt: An architecture diagram built in two steps; first a payment and its event are saved in one commit, the event is published to a delivery queue, a sender signs it and posts it to the shop's endpoint, which stores it in an inbox table by event id for an order worker to process later, then a failed post goes to a retry timer that puts the job back on the queue after a growing wait and moves it to dead letters after three days.
