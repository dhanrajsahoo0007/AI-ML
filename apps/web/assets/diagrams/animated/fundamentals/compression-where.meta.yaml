title: Where a system compresses
alt: An architecture drawing built in three steps; first the app server compresses JSON with Brotli and a CDN edge keeps the compressed copy and sends about 260 KB to a phone, then the app sends events to a queue in batches compressed with zstd, and finally the database compresses each page with LZ4 and an event archive stores old events as columnar files compressed with zstd.
