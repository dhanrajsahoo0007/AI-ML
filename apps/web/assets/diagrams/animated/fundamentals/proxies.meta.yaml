title: Forward proxy and reverse proxy
alt: Maya's laptop and 399 other office laptops send their web traffic through the office's forward proxy, which carries it over the internet to outside sites; one of those sites is a shop whose reverse proxy receives the HTTPS request, ends the encryption and passes it as plain HTTP to one of three app servers on private addresses.
