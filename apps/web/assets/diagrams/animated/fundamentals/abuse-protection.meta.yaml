title: A rate limiter at the API gateway
alt: Real readers, a login bot spread over 4,000 IP addresses and a buggy seller sync tool all send requests through one API gateway to a login service and a listings service backed by a database; in the second step the gateway asks a rate limiter before routing, the limiter counts requests per key, IP address and account in an in-memory store, and the bot and the sync tool get 429 Too Many Requests answers instead of reaching the services.
tags: [fundamentals, security, rate-limiting, abuse-protection, api-gateway, system-design]
