title: "Push notifications: register, send, clean up"
alt: An architecture diagram in three steps in which a phone gets a device token from APNs or FCM and registers it with the app's token API, which saves it in a token store; then a parcel service event goes to a notify service that looks up the user's tokens, queues one job per token, and push workers send each job to APNs or FCM, which delivers it to the phone; finally the provider answers 410 for a dead token and the worker deletes it from the token store.
