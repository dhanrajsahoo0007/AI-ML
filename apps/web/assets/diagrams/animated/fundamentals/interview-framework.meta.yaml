title: The 45 minutes of a system design interview
alt: A timeline with three lanes, the interviewer, the candidate and the whiteboard, built in five steps; orange banners mark eight phases from clarifying the problem in minutes 0 to 3 through requirements, estimates, the API, the data model, the high-level design and a deep dive to a wrap-up in minutes 41 to 45, with the questions and drawings exchanged in each phase.
