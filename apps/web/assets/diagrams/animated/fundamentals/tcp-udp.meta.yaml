title: IP addresses and ports
alt: A laptop and a phone in a home, with private addresses 192.168.1.20 and 192.168.1.31, send packets through a NAT router with the public address 198.51.100.24 to one server at 203.0.113.7, where the laptop's packets reach the web server on TCP port 443, the phone's reach the game server on UDP port 7777, and the web server talks to a database on TCP port 5432.
