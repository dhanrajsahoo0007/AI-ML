title: A webhook that fails, retries and arrives twice
alt: A sequence diagram with four lanes, payments, webhook sender, shop endpoint and shop inbox, in which a payment event is signed and posted to the shop, the first try times out during a deploy, the second try is verified and stored but its 200 reply is lost, and the third try is recognised by its event id as a duplicate, answered with 200 and ignored, so the order is marked paid once.
tags: [fundamentals, apis, webhooks, retries, idempotency, system-design]
created: 2026-11-09
