title: Short polling at dinner peak
alt: An architecture diagram built in three steps. Twenty thousand open order pages send a request every 5 seconds, about 4,000 a second, through a load balancer to stateless API servers, which at first read the orders database on every poll. In the second step a status cache holding each order's status and version answers the polls, and the database is read only on a miss. In the third step kitchen tablets send status changes through the load balancer, and the API servers write them to the database.
caption: Where 4,000 polls a second land, and how a cache keeps the empty ones away from the database.
tags: [fundamentals, realtime, polling, caching, system-design]
