title: Scaling WebSockets with gateways and pub/sub
alt: An architecture diagram built in three steps. A teacher and thirty students in room 42 connect through a load balancer that keeps each long-lived socket on one of three socket gateways; the teacher lands on gateway 1, twelve students on gateway 2 and eighteen on gateway 3. In the second step the gateways pass every event to a quiz service, which saves answers in a database. In the third step the quiz service publishes each room event to a pub/sub channel for room 42, and the channel delivers one copy to each of the three gateways, which write it to their local sockets.
caption: Gateways hold the sockets, a service holds the logic, and pub/sub gets one room's events to every gateway.
tags: [fundamentals, realtime, websockets, pub-sub, load-balancing, system-design]
