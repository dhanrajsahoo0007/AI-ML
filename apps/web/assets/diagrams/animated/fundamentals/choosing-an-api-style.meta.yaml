title: One system, five API styles
alt: A bike-share system built in five steps, where partner apps read dock data through a REST API gateway, the rider app asks a GraphQL server for each screen, internal services call each other with gRPC, the rider app keeps a WebSocket open to a live gateway during a ride, and a card processor sends webhooks to a webhook receiver that queues them for the billing service.
tags: [api-design, rest, graphql, grpc, websockets, webhooks]
created: 2026-11-09
