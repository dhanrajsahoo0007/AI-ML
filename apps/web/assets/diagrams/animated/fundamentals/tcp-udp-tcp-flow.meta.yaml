title: TCP handshake and retransmission
alt: A sequence diagram with three lanes, laptop, internet and web server, showing the SYN, SYN-ACK and ACK handshake, the server sending numbered byte ranges that the laptop acknowledges, then one segment lost in the internet, the next segment arriving and being held, the laptop repeating ACK 2000, and the server resending the lost bytes after its timer fires so the app receives both ranges together.
