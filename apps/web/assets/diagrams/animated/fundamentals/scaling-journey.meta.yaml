title: From one server to millions of users
alt: A web app grows in seven steps; users first reach one server that also holds the database, then a load balancer goes in front and the database moves to its own machine, the load balancer spreads requests over three identical app servers, a cache answers hot reads, read replicas take the remaining reads while the primary takes writes, a CDN serves images and scripts near the user, and finally the app puts slow jobs on a queue that workers process in the background.
caption: Seven steps from one box to a system for millions of users
