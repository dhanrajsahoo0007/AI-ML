title: Where attacks land
alt: An architecture diagram built in three steps; a patient app sends HTTPS requests through an edge gateway to app servers and a patient database, while a row of attacks underneath shows a bot flood filtered and rate-limited at the edge gateway, a forged request for someone else's record refused by the app servers, and a leaked database password that fails because a secrets vault issues one-hour logins and the database has no route from outside.
