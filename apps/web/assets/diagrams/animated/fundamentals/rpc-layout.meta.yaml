title: Protobuf and JSON byte layout
alt: Two byte strips drawn to the same scale show one request, sku BK-1042, quantity 2 and order id 98765, taking 47 bytes as JSON text, where field names and punctuation fill 32 bytes, and 15 bytes as Protobuf; a third row spells out the 15 Protobuf bytes in hex, a tag byte for each field, a length byte for the string, the seven letters of BK-1042 and a three-byte varint for 98765.
