title: One GraphQL query instead of three REST calls
alt: A sequence diagram with five lanes, a phone app, a GraphQL server, a user service, a show service and an episode service, in which the phone first makes three REST calls over the mobile network one after another and receives about 144 KB in about 600 ms, and then sends one GraphQL query instead, which the GraphQL server answers by calling the three services inside the data center and returning only the requested 7 KB in about 220 ms.
tags: [fundamentals, apis, graphql, rest, system-design]
