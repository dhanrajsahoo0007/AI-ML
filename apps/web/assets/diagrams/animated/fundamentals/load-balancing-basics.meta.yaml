title: Layer 4 and layer 7 load balancing
alt: An architecture diagram in two bands; in the top band a student's laptop opens a TCP connection to a layer 4 load balancer that sees only addresses and ports and hands whole connections to three identical app servers, and in the bottom band a student's phone sends HTTPS to a layer 7 load balancer that ends TLS, reads each request's path and sends pages, homework API calls and video lessons to three separate server pools.
