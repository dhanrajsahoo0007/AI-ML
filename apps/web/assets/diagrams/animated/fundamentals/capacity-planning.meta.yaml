title: "Where it breaks first: an exam-results site"
alt: An exam-results site built in four steps toward a peak of 2,000 page views a second; students reach a load balancer, two app servers and a database, then the app CPU wall adds two more servers, the database connection wall adds a connection pooler that turns 160 connections into 40, and the network wall moves static files to a CDN and compresses the HTML, while a strip at the bottom records each wall in the order it was hit.
tags: [fundamentals, capacity-planning, bottlenecks, system-design]
