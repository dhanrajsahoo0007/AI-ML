title: One notes app under three non-functional targets
alt: The same notes app drawn three times with tighter targets; it starts as one app process writing to one database, gains a load balancer, a cache and a synchronous replica for a 99.9% company tool, then a CDN, an asynchronous replica in a second region and an object store for a 99.99% consumer app with 150 millisecond latency worldwide.
tags: [fundamentals, requirements, availability, latency, durability, system-design]
