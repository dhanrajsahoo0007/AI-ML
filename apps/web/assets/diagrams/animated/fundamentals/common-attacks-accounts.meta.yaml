title: Two attacks on customer accounts
alt: A sequence diagram built in two steps with lanes for an attacker, a customer's browser, an app server, a login statistics store and a database, in which the attacker tries leaked passwords at about 40,000 logins an hour, the app sees the failure rate jump from 5 percent to 95 percent and answers with a bot challenge and then 429 while the real customer signs in with a password and a six-digit code, and then the attacker posts a review containing a script tag that the app stores as plain text and sends back escaped with a Content-Security-Policy header, so the customer's browser shows the tag as text instead of running it.
tags: [fundamentals, security, credential-stuffing, xss, authentication, system-design]
