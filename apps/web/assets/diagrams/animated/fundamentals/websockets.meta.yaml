title: WebSocket lifecycle
alt: A sequence diagram with four lanes, the student's page, the load balancer, the socket gateway and the quiz service. The page sends an HTTP GET asking to upgrade to a WebSocket, the load balancer forwards it, and the gateway answers 101 Switching Protocols. Then the quiz service pushes question 3, the gateway sends it to the page as a text frame, the page answers B with a masked frame on the same connection, and the gateway forwards the answer. Finally the gateway pings every 30 seconds and the page answers pong, until the phone loses signal, a ping goes unanswered, and the gateway closes the socket and tells the quiz service the student is offline.
caption: One HTTP request becomes a two-way connection, carries small frames both ways, and is checked by heartbeats.
