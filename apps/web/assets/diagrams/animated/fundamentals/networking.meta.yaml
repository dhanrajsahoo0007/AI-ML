title: One packet wrapped at each layer
alt: Four rows show the same 400-byte HTTP request growing as it goes down the layers; the transport layer adds a 20-byte TCP header with ports, the network layer adds a 20-byte IP header with addresses, and the link layer adds a 14-byte header with hardware addresses and a 4-byte check, for 458 bytes on the wire.
