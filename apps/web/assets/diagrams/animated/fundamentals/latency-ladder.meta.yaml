title: The latency ladder
alt: A log-scale ladder of twelve typical latencies sorted from fastest to slowest, from an L1 cache hit at about one nanosecond through RAM, SSD reads, round trips inside a data center and a hard disk seek, down to a round trip from Virginia to Sydney at about two hundred milliseconds, with a red dashed line at one hundred milliseconds that only the Sydney bar crosses.
