title: Four real-time methods on one timeline
alt: A sequence diagram with five lanes, four browsers and one app server, showing how short polling, long polling, server-sent events and a WebSocket each learn about the same new bid of 120 dollars that lands on the server at 3 seconds; the polling page asked at 0 seconds and only sees the bid at its next poll at 5 seconds, 2 seconds late, while the held long-poll request, the open event stream and the WebSocket all receive it at 3 seconds, and only the WebSocket client also sends its own bid back on the same connection.
caption: The same bid at t = 3 s, heard four ways. Polling waits for its next tick; the other three hear it at once.
