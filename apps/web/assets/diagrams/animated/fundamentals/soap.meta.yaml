title: A SOAP message, envelope, header and body
alt: An HTTP POST carries one XML envelope; inside it a header holds a WS-Security block with a timestamp, a certificate and a signature, and a body holds the GetBalance operation with an account id and a currency, while the reply on the right comes back in the same envelope as either a GetBalanceResponse or a SOAP fault.
