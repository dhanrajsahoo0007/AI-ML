title: Block, file and object storage in one site
alt: A recipe site's readers reach two web servers; in step one a Postgres database server reads and writes fixed-size blocks on its own block volume; in step two both web servers mount the same shared folder over NFS; in step three recipe photos live in an object storage bucket that readers reach through a CDN, and the servers ship their old log files to the same bucket every hour.
