title: A request's journey as a map
alt: A map of one page load in four zones, your device, the internet edge, the data center and storage, where the browser asks a DNS resolver for the address in 20 ms, spends 100 ms on the TCP and TLS handshakes and the request to the load balancer, which forwards to an app server in 1 ms, which checks a cache in 1 ms and queries a database in 8 ms before the answer travels back to the browser in 20 ms.
