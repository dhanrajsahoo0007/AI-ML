title: Four attacks and the step that stops each
alt: A sequence diagram built in four steps with lanes for an attacker, a customer's browser, an edge with a web application firewall, an app server and a database, in which a flood of 400,000 requests a second is dropped at the edge while the customer's real order reaches the app, a replayed payment message with a valid signature is refused because it is two hours old and its event id was already seen, an injection attempt in the order lookup box finds no rows because the input is sent to the database as a parameter, and a hidden form on the attacker's page makes the customer's browser post a points transfer that the app refuses with 403 because no CSRF token came with it.
tags: [fundamentals, security, ddos, replay-attack, sql-injection, csrf, system-design]
