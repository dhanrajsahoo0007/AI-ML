title: One record in JSON, Protobuf and Avro
alt: Three byte strips drawn to the same scale show one scooter status, id SC-208, battery 87, odometer 1290 km and locked true, taking 69 bytes as JSON text, where field names, quotes and commas fill 51 bytes, 15 bytes as Protobuf with a one-byte tag before each field, and 12 bytes as Avro, which sends only a string length and the values in schema order.
tags: [fundamentals, serialization, json, protobuf, avro, system-design]
