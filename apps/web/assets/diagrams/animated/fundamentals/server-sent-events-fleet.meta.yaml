title: SSE fleet for a live match page
alt: An architecture diagram in three steps. Fifty thousand fans' browsers open a request through an edge proxy with buffering turned off to four live servers, which hold about 12,500 open streams each. A commentator publishes an event to a pub/sub topic, which hands it to every live server, and each server writes it back through the proxy to the fans. Pub/sub also appends each event to an event log kept for ten minutes, and the live servers read that log after a given id to replay events to fans who reconnect.
caption: Fifty thousand open streams, one pub/sub topic, and a log that lets a dropped fan catch up.
tags: [fundamentals, realtime, server-sent-events, fan-out, system-design]
