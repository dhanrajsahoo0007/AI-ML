title: Stateless requests behind a load balancer and a CDN
alt: In the first step the owner app sends each request with its token to a load balancer, which can pass it to any of three API servers that keep no session and share one database; in the second step a CDN sits in front of the load balancer, answers repeat GET requests for the clinic list itself and forwards only misses.
caption: Stateless requests can go to any server, and cacheable GETs can stop at the CDN.
tags: [fundamentals, apis, rest, stateless, caching, system-design]
