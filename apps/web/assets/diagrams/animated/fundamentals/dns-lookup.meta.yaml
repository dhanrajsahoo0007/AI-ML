title: A recursive DNS lookup, with caches
alt: A sequence diagram with five lanes, your laptop, a resolver, a root server, a .com server and the site's authoritative name server, in which the laptop misses its local cache and asks the resolver for recipes.example.com, the resolver misses its cache, gets a referral from the root server to the .com servers and from the .com server to ns1.example.com, receives the address 203.0.113.10 with a TTL of 300 seconds, keeps it for 300 seconds and returns it, so a second lookup two minutes later is answered from the resolver's cache in about 10 ms instead of about 85 ms.
