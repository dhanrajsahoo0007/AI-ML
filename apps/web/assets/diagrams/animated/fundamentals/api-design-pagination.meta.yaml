title: Paging through a list with a cursor
alt: A sequence diagram with four lanes, a partner script, a phone app, the Orders API and the orders database. The partner asks for 50 orders, the API reads 51 rows to learn that more exist, and returns 50 orders with a next cursor c1. The phone app then creates a new order, which sorts above the cursor. The partner sends c1, the API decodes it into a time and an id, reads the 51 rows after that point and returns the next 50 with cursor c2. On the last call only 12 rows come back, so the next cursor is null and the sync ends.
caption: The cursor marks where the last page ended, so a new order cannot shift the next page.
