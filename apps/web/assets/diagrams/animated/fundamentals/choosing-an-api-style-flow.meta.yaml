title: Polling versus a webhook
alt: In the first half the billing service starts a charge and then asks the card processor three times whether it is done, getting pending twice before succeeded; in the second half billing starts the charge once and the card processor sends a charge succeeded webhook to billing as soon as the rider's bank approves, and billing replies 200 OK.
