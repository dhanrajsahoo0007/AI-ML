title: Where the time goes in one request
alt: Three proportional time bars for a web request from London to a server in Virginia; the first visit takes about 300 ms, of which 260 ms is the DNS lookup, the TCP and TLS handshakes and the trip across the ocean, a zoomed bar shows that half of the 40 ms of server work is four database queries run one after another, and a last bar shows the next click on the same connection taking about 120 ms.
