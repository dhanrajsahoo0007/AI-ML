title: Long polling timeline
alt: A sequence diagram with five lanes, customer page, poll server, pub/sub, message store and chat service. The page asks for messages after number 17; the poll server subscribes to the chat's topic, finds nothing in the store and holds the request open for up to 30 seconds. When the agent's reply is saved as message 18 and published, the poll server answers 200 at once and the page immediately asks again. When 30 seconds pass with no news, the server answers 204 No Content and the page asks again. Finally the open request is lost when a server restarts, message 19 is saved while nobody is listening, and the page waits about a second, asks again for messages after 18, and gets message 19 from the store.
caption: The page always has one request waiting. A new message answers it at once; after a timeout or a dropped connection, the page asks again with the last message number.
