title: Where TLS ends
alt: An architecture diagram built in three steps; first a browser in Lisbon connects over HTTPS to a load balancer that holds the certificate and passes plain HTTP to a checkout server, then a CDN edge in Lisbon takes over the handshake and forwards over a warm encrypted connection to the load balancer, and finally the load balancer re-encrypts to the checkout server, which calls a payments service over mutual TLS with certificates signed by an internal certificate authority.
