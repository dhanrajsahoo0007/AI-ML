title: Token checks at the API gateway
alt: An architecture diagram built in five steps in which a web app with a session cookie, a phone app with a JWT and a grocer's server with an API key all call one API gateway that forwards the user id and scopes to the recipes and orders services, and the gateway looks up session ids in a session store, checks JWT signatures with public keys from the auth server, looks up API keys by their SHA-256 hash, and checks a small denylist of revoked token ids that the auth server fills.
