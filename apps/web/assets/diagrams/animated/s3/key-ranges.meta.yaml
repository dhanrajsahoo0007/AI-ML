title: List by prefix wants key ranges, not hashes
alt: >-
  A layout in three steps, one row each, with a neutral label box on the left of every row. Step 1: under hash
  partitioning, the sixteen keys of one date prefix land on all eight violet partitions, two each, so a list of that
  prefix must ask all eight. Step 2: under range partitioning, four violet ranges cover the sorted keys and the whole
  prefix sits in one green range, P3, so a list reads one partition in key order. Step 3: a writer sends 12,000 puts a
  second under one prefix to P3, drawn red because the limit is 3,000; an arrow shows it split by key into four green
  ranges of about 3,000 a second each.
caption: >-
  Hashing spreads one prefix over every partition; ranges keep it in one, at the price of splitting a range when one
  prefix gets hot.
tags: [case-studies, s3, partitioning, metadata]
