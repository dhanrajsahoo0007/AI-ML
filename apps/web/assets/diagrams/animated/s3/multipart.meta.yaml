title: "Multipart upload: parts in parallel, one record at the end"
alt: >-
  A sequence diagram in two steps with five lanes: an orange client, a teal front end, a green upload service, and
  violet storage nodes and metadata index. Step 1: the client creates upload u9, sends parts eight at a time, each part
  is stored as ten data and five parity shards and its ETag is recorded, and the complete call with 1,000 ETags makes
  the upload service write one metadata record listing the parts; the client gets 200 for object version 1. Step 2:
  part 417 fails half way, drawn red; the client retries part 417 alone and gets its ETag, and a note says an upload
  never completed is aborted after seven days and its parts are garbage-collected.
caption: >-
  Multipart upload: parts go in parallel and retry one by one, and the object appears only when one record lists them
  all.
tags: [case-studies, s3, multipart, upload]
