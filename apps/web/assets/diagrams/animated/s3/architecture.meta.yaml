title: Object store high-level architecture
alt: >-
  An architecture diagram in eight steps across six zones: clients, edge, metadata core, request services, background
  work and storage. Step 1: a client reaches a front end through a load balancer, and the front end writes the file
  and a local key map on one storage node. Step 2: a green metadata index, the accent, holds where each object's bytes
  are, and the front end commits a record there after the bytes are stored. Step 3: a placement service picks drives
  and the front end writes three copies in three zones. Step 4: the copies are replaced by ten data shards and five
  parity shards, and an extent sealer erasure-codes small objects. Step 5: a per-zone index cache serves lookups and
  asks a witness whether its entry is the latest version; misses and commits go to the index. Step 6: an upload
  service takes multipart parts and completes the object in the index. Step 7: a scrubber re-reads checksums and
  repair workers rebuild lost shards. Step 8: a lifecycle worker moves cold objects to a dense cold tier and expires
  old versions.
caption: >-
  An object store: metadata apart from data, erasure-coded shards over three zones, a cached index kept exact by a
  witness, and background work that scrubs, repairs and tiers.
