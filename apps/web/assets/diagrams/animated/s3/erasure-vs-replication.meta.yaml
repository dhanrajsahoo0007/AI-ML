title: Three copies against erasure coding over three zones
alt: >-
  A layout in three steps, one row per scheme, across three zone columns A, B and C. Step 1: three blue full copies,
  one per zone, cost 3.0 times the stored bytes, or 200,000 drives for one exabyte, and survive the loss of two copies
  or a zone. Step 2: ten blue data shards and four green parity shards, spread five, five and four over the zones,
  cost 1.4 times, or about 93,000 drives, and survive any four losses, but the red verdict shows that losing zone A
  leaves nine shards, fewer than the ten needed. Step 3: ten data and five parity shards, five per zone, cost 1.5
  times, or 100,000 drives, and survive any five losses or a whole zone, which leaves exactly ten.
caption: >-
  Three copies cost 3.0 ×; 10 + 4 costs 1.4 × but a zone holds five shards; 10 + 5, five per zone, costs 1.5 × and
  survives a whole zone.
