title: The classes of one vending machine
alt: >-
  A class diagram in two steps. Step 1: a VendingMachine box on the left owns an Inventory, a ChangeMaker, a Dispenser
  and an EventLog. The Inventory holds slots by code, each slot holds a product with a count and a price, and the
  ChangeMaker holds coin tubes. Step 2, in green: the machine keeps a current State and uses a PaymentMethod; IdleState,
  HasCreditState, DispensingState and the other states implement State, and CashPayment and CardPayment implement
  PaymentMethod, so a new state or a new way to pay is a new class.
caption: >-
  The machine owns its inventory, change, dispenser and event log, and hands every button press to its current state
  and every payment to a payment method.
tags: [case-studies, vending-machine, object-design, state-pattern]
