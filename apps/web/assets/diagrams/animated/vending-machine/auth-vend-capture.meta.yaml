title: "A card sale: authorise, vend, capture or release"
alt: >-
  A sequence diagram with five lanes: buyer, controller, local log, payment service and card processor, in three
  steps. Step 1: the buyer picks B4 at 1.75 dollars and taps a card; the controller asks the payment service to
  authorise with key m42-v1907; the service places a hold at the processor and answers approved; the controller logs
  the good vend, the item drops, and the controller asks for capture with the same key. Step 2: the next buyer picks
  C2; the hold is approved, but no item drops after a retry, so the controller logs the failure, asks for a release,
  the service cancels the hold and the buyer is not charged. Step 3: after a good vend the capture call gets no answer,
  drawn as a red timeout; 20 minutes later the controller replays it from its log with the same key and the service
  captures once.
caption: >-
  A card sale holds the money first; the controller captures only after the item drops, releases after a stuck vend,
  and replays a lost capture with the same key.
tags: [case-studies, vending-machine, payments, idempotency, sequence]
