title: The vending machine's states
alt: >-
  A state diagram in three steps. Step 1, cash: Idle goes to Has credit when a coin or note goes in, to Dispensing when
  the selection's price is covered, to Settling when the item drops, and back to Idle once change is paid. Step 2,
  card: Idle goes to Authorising when the buyer selects and taps a card, to Dispensing when approved, and back to Idle
  when declined; Settling captures the hold instead of paying change. Step 3, drawn in red: Has credit goes to
  Refunding on cancel or after 60 seconds, Dispensing goes to Refunding when no item drops, and Refunding returns the
  cash or releases the hold and goes back to Idle. A note says a sold-out choice stays in Has credit, a machine short
  of coins shows exact change only, and a fault goes to Out of service after refunding.
caption: >-
  A vending machine is six states: every path that takes money ends either in Settling, which keeps it, or in
  Refunding, which gives it back.
tags: [case-studies, vending-machine, state-machine, object-design]
