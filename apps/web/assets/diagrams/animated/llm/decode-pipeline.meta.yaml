title: One decoding step
alt: >-
  A loop of eight blocks for one decoding step. In the top row, left to right: a gray Decoder stack block, a lavender
  Linear output head whose arrow is labelled "logits", a gray Penalties and logit bias block, and a pink Grammar mask
  block. The path turns down into the bottom row and runs right to left: a yellow-green block that divides by the
  temperature T, a pink Top-k, top-p or min-p block, a green Softmax block whose arrow is labelled "p", and a green
  Sample one token block. The four blocks from Penalties to the truncation block sit in a pink dotted group titled
  "Logits processors (order varies)". From Sample, one arrow goes up to the Decoder stack, labelled "append; KV
  cache", and another goes down to "streamed to the user". A note says each processor edits logits, a removed token
  gets minus infinity so the softmax gives it 0, and greedy decoding skips sampling and takes the arg-max.
caption: >-
  Every generated token runs this loop once: the logits are edited by a chain of processors, turned into
  probabilities, and one token is picked and fed back in.
