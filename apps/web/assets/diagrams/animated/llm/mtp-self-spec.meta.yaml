title: Self-speculative decoding with 4 heads
alt: >-
  A three-step example of self-speculative decoding with the prompt "The meeting moved to". Step 1: a gray block
  "Pass 1: trunk + 4 heads" produces four green token blocks in a row. Head 1, the next-token head, gives "Friday" in
  a solid green block; heads 2, 3 and 4 give the pale green drafts "at", "noon" and "because". Step 2: arrows run down
  from all four tokens into one wide gray block, "Pass 2: run the model on all 4 tokens at once", whose next-token
  head gives the greedy choice at every position. Below it, three gray blocks show the greedy token after "Friday"
  is "at", after "at" is "noon", and after "noon" is "and". Step 3: green ticks under "at" and "noon" say they match
  the drafts; a red cross under "and" says the draft was "because". The output row reads "Friday at noon and", with
  the corrected token "and" highlighted. Notes say 2 of 3 drafts were accepted plus 1 correction, giving 4 tokens from
  2 forward passes where plain decoding gets 2, with exactly the same text as greedy decoding, and that the verify pass
  also runs heads 2 to 4 at "noon", so the tokens after "and" are already drafted.
caption: >-
  The extra heads draft three tokens for free; one verification pass keeps the drafts that match the model's own
  greedy choice and replaces the first wrong one, so two passes yield four tokens with no change to the output.
tags: [llm, multi-token-prediction, speculative-decoding, inference, genai]
