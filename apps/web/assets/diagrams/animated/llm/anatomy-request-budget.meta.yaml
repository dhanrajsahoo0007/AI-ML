title: One refund request, where the milliseconds and the money go
alt: >-
  A two-column bar chart with one row per layer of an LLM application, for the Brightpost refund request; all numbers
  are illustrative. Left, the time each layer adds to the customer's path: gateway 6 ms (key, limits, cache), prompt
  and context 10 ms (5 prompts at 2 ms), retrieval 35 ms (embed and search), model and serving 7,500 ms (5 calls at
  1.5 seconds, the one highlighted bar), tools and agents 900 ms (3 tools at 300 ms), guardrails 30 ms (input and
  output checks), evaluation and observability 0 ms (written after the reply). Total 8,481 ms, of which the model is
  88 percent. Right, the money per request: the model 5 calls at $0.0069, $0.0345; a sampled model judge on 5 percent
  of requests, $0.0004 on average; every other layer $0 per request because it runs on servers paid by the month.
  Total $0.0349, of which the model is 99 percent. The support agent's approval is not counted, because it waits on a
  person.
caption: >-
  The model is 88 % of the time and 99 % of the money; every other layer is cheap per request, which is why it is
  where you add checks (illustrative numbers).
