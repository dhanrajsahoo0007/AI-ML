title: The masked-diffusion training objective
alt: >-
  One training example, read from top to bottom. The clean sentence "Rain fell all night so the river rose" sits in
  8 gray cells. A mask ratio t = 0.5 is drawn, and each token gets a random number u; the four tokens whose u is
  below 0.5, "fell", "night", "the" and "river", are replaced by pink [M] cells in the masked input. The masked input
  enters a wide box, a Transformer with no causal mask, in which every position attends to all 8 positions. Its
  output gives, at each masked position only, the probability of the true token, shown in green cells: fell 0.62,
  night 0.35, the 0.80, river 0.21. Visible positions are marked "no loss". The loss terms, minus the natural log of
  each probability, are 0.48, 1.05, 0.22 and 1.56. A highlighted green box adds them, 3.31, and multiplies by 1/t =
  2 to give a loss of 6.62 for this example. A note says another example may draw t = 0.1 or t = 0.9.
caption: >-
  Masked diffusion training draws a fresh mask ratio t for every example, masks each token with probability t, and
  scores the model only on the masked positions, weighted by 1/t.
tags: [llm, diffusion, training, masked-language-model, genai]
