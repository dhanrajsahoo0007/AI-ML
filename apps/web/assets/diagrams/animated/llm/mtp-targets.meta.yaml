title: Next-token vs multi-token training targets
alt: >-
  Two panels use the sentence "Mira locked the door and went home". In the top panel, titled "Next-token prediction
  (n = 1)", six gray input blocks hold the first six tokens, positions 1 to 6, and under each one a single green target
  block holds the token that follows it: locked, the, door, and, went, home. In the bottom panel, titled "Multi-token
  prediction (n = 3 heads)", the same six inputs each have a column of three green targets, one per head: head 1 the
  next token, head 2 the token after that, head 3 the third token ahead. The input "the" at position 3 is blue;
  its targets are door, and, went. Near the end of the sentence the far heads run out of tokens, so three gray cells
  read "no target". Notes say "the" must predict three tokens, three losses at one position instead of one, and that
  six positions give 6 targets with next-token prediction and 15 with three heads.
caption: >-
  With three heads, every position is trained on the next three tokens instead of one: the same six positions give 15
  training targets instead of 6.
tags: [llm, multi-token-prediction, pretraining, genai]
