title: Grammar-constrained decoding masks invalid tokens
alt: >-
  Two build steps for one decoding step of JSON output. The schema is an object with one boolean field, "rain", and
  the output so far is an open brace followed by "rain" and a colon. Six candidate tokens are listed with their
  lavender logits: Yes 2.6, true 2.1, "yes" in quotes 1.8, false 0.9, a closing brace 0.4 and maybe 0.2. Step 1, in a
  gray dotted column titled "Without a mask", shows green probability bars: Yes 0.41, true 0.25, "yes" 0.18, false
  0.07, the closing brace 0.05 and maybe 0.04; a red note says 0.68 of the mass is on tokens that break the JSON.
  Step 2 adds a pink Grammar mask box, fed by the parser state of the output so far, which allows only true or false
  next. A middle column sets the logit of Yes, "yes", the closing brace and maybe to minus infinity and marks true
  and false as keep. A green dotted column titled "With the mask" shows the renormalized probabilities: true 0.77
  and false 0.23, and 0 for the rest.
caption: >-
  Without a mask, 0.68 of the probability sits on tokens that would break the JSON; the grammar mask sets their logits
  to −∞, so the softmax spreads all the mass over “true” and “false”.
tags: [llm, decoding, constrained-decoding, structured-output, json, genai]
