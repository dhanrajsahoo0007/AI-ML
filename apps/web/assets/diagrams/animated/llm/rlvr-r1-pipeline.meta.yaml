title: How DeepSeek-R1 was trained
alt: >-
  A pipeline in three lanes. The top lane, R1-Zero, runs from a blue DeepSeek-V3-Base box (671B mixture-of-experts,
  37B active) through an orange "RL with GRPO" box using accuracy and format rewards to a blue DeepSeek-R1-Zero box,
  whose AIME 2024 pass@1 rose from 15.6% to 71.0%; a note says long chains and reflection emerge but the text is
  hard to read and mixes languages. A dashed arrow from R1-Zero down to the second lane says it supplies some
  cold-start data. The middle lane, DeepSeek-R1, starts again from DeepSeek-V3-Base and runs through four stages:
  1, a violet cold-start SFT on thousands of long chain-of-thought examples; 2, orange reasoning RL with rule
  rewards plus a language-consistency reward; 3, rejection sampling that keeps only correct answers, producing about
  800k samples (600k reasoning and 200k other), followed by SFT that restarts from V3-Base for 2 epochs; and 4,
  orange RL over all scenarios with rules and preference models. It ends at a blue DeepSeek-R1 box with 79.8% on
  AIME 2024. The bottom lane, distillation, reuses the same 800k samples for SFT only, with no RL, into six dense
  Qwen and Llama students from 1.5B to 70B parameters. A note says R1-Distill-Qwen-32B scores 72.6% on AIME 2024,
  while RL alone on the same Qwen2.5-32B base reaches 47.0%.
caption: >-
  R1-Zero proved that RL with rule-based rewards alone can teach long reasoning; R1 wraps the same RL in cold-start
  and rejection-sampling SFT for readability, and its 800k samples also distill into small models that beat RL run
  on the small model directly.
