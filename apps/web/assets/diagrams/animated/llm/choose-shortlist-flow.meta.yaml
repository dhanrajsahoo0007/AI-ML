title: From requirements to a model shortlist
alt: >-
  A vertical flow in five steps with notes on the right. A grey box at the top, "Task and requirements", lists the
  quality bar, latency, budget and volume; a note says to write the numbers down first, such as a time to first
  token under 1 second. An arrow labelled "12 candidates" enters a red dotted group titled "Hard constraints: pass
  or fail", holding four red blocks: data, privacy and residency; licence and deployment; modality, tools and
  languages; context length and latency. A red arrow points to a note: 7 dropped, for example because data may not
  leave the EU, there is no image input, the window is under 64K tokens, or the model is too slow at the needed
  prompt length. An arrow labelled "5 pass" leads to a blue block, "Quality on your own eval set", with a red note
  that 2 fall below the quality bar whatever their leaderboard rank. An arrow labelled "3 clear the bar" leads to a
  teal block, "Cost and latency at real volume", with a red note that 1 costs 4 times more per month than the next.
  An arrow labelled "2 left" ends at a green block, "Shortlist: a primary and a fallback". A dashed arrow loops from
  the shortlist back to the eval block, with a note: when a new model ships, run it through the same eval and cost
  check.
caption: >-
  Cheap pass-or-fail constraints go first, quality is measured only on the survivors with your own eval set, and cost
  at real volume picks between the models that clear the bar. The counts are an example.
tags: [llm, model-selection, evaluation, cost, genai]
