title: "KV cache per token: MHA, GQA, MLA and MQA to scale"
alt: >-
  Two dotted panels of horizontal bars, drawn to scale, showing how many numbers each attention design caches per
  token in one layer, using DeepSeek-V2's 128 heads of 128 dimensions. In the top panel, multi-head attention (MHA)
  is a long bar, half teal for keys and half violet for values: 32,768 numbers. Grouped-query attention with 8 KV
  heads is a short teal and violet bar of 2,048 numbers, 16 times less. Multi-head latent attention (MLA) is a thin
  pink and teal sliver of 576 numbers, 512 for the latent plus 64 for the RoPE key, 56.9 times less. Multi-query
  attention (MQA) is the thinnest sliver, 256 numbers, 128 times less. The lower panel zooms in 16 times on the three
  small rows: GQA now fills the width, MLA shows a pink block labelled c_KV 512 and a small teal block labelled k_R
  64, and MQA shows one teal K cell and one violet V cell; MHA would be 16 times as long as the GQA bar, so it is left
  off. Under the panels, the whole 60-layer model in 16-bit needs per token: MHA 3.93 MB, GQA 245.8 KB, MLA 69.1 KB
  and MQA 30.7 KB.
caption: >-
  At DeepSeek-V2's 128 heads × 128 dims, MLA caches 576 numbers per token per layer: 57× less than MHA, about 3.6×
  less than 8-head GQA, and the same as GQA with 2.25 groups.
