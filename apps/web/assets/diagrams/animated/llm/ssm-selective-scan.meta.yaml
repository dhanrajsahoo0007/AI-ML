title: The selective scan
alt: >-
  Three time steps, t minus 1, t and t plus 1, sit side by side. In each, a grey token input x at the bottom feeds two
  things: an arrow labelled "times B-bar" up into a teal state box h, and an arrow into a violet projection box that
  computes Delta, B and C from that token. A dashed violet arrow from the projection box into the state box shows
  that these values set this step's update. From each state box an arrow labelled "times C" rises to a grey output
  y. Teal arrows labelled "times A-bar" carry each state to the next one, and the chain continues off both edges.
  Equations at the top read: h of t equals A-bar times h of t minus 1 plus B-bar times x of t; y of t equals C times h
  of t; A-bar equals exp of Delta times A; B-bar equals the zero-order-hold formula. Notes say A is learned and fixed
  while Delta, B and C are computed from each token, which makes the layer selective: a large Delta resets the state
  to take in the token and a small Delta keeps the state and skips it. Inference runs the chain left to right and
  keeps only the latest state; training computes all states at once with a parallel scan.
caption: >-
  Each token sets its own Δ, B and C, so it decides how much of the old state survives and how much of itself is
  written in; A stays fixed. After Gu and Dao (2023), Section 3.
