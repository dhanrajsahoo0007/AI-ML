title: RLHF and RLVR side by side
alt: >-
  Two panels with the same training loop. In each, a blue policy box writes a response, which goes down to a reward
  box; the reward goes down to an orange update box with a KL penalty to a reference model, and an arrow loops back
  up to the policy. In the left, pink panel, RLHF, the reward box is a learned reward model trained on human
  preference pairs, and it sends a real-valued score to a PPO update. A red note pointing at the reward model says
  the policy can find what the reward model over-scores, such as length, tone or flattery, and farm it. In the
  right, green panel, RLVR, the reward box is a verifier, a program that matches answers or runs tests against a
  reference answer or test suite, and it sends a reward of 1 or 0 to a GRPO or PPO update. A red note pointing at
  the verifier says the policy can exploit a loose checker: weak tests, lax parsing or format rewards. Footers say
  RLHF covers open-ended goals but can be fooled, while RLVR is exact but only for tasks a program can check.
caption: >-
  RLVR keeps the RLHF loop and swaps the learned reward model for a program; hacking does not disappear, it moves
  from the reward model's blind spots into the checker's loopholes.
tags: [llm, rlvr, rlhf, reward-hacking, post-training, genai]
