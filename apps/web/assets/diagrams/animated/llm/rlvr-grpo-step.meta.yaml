title: One GRPO update on one prompt
alt: >-
  A four-step diagram of one Group Relative Policy Optimization update. On the left, a grey prompt box reads "3x + 5
  = 20. Find x." and feeds a blue policy box, which samples a group of six answers, o1 to o6, shown as a column of
  boxes: o1 and o4 reach x = 5, o2 gives 25/3, o3 gives 15, o5 says "roughly 5" with no final answer, and o6 gives
  4. In step 2 a verifier column checks whether the final answer equals 5 and gives green 1s to o1 and o4 and red 0s
  to the other four. In step 3 the rewards are normalized inside the group: the mean is 0.33 and the standard
  deviation 0.47, so each correct answer gets a green advantage of plus 1.41 and each wrong answer a red advantage
  of minus 0.71. A note says that if all six were right, or all six wrong, every advantage would be 0 and the prompt
  would teach nothing. In step 4 arrows marked raise and lower show the update direction, a line labelled "gradient
  step on θ" runs back to the policy, and a dashed line labelled "β · KL" ties the policy to a grey frozen reference
  model, which keeps the policy from drifting far.
caption: >-
  GRPO needs no value network: the group's own mean reward is the baseline, so the two correct answers get +1.41,
  the four wrong ones −0.71, and a group that is all right or all wrong gives no signal at all.
