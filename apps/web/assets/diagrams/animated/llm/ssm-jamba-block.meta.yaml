title: One Jamba block
alt: >-
  A stack of 8 layers inside a dotted box titled "One Jamba block (8 layers)", read from bottom to top. Each layer is
  a row of four blocks joined by arrows: a lime RMSNorm, a token mixer, a second lime RMSNorm, and a blue
  feed-forward block. The mixer is a teal Mamba (selective SSM) layer in layers 1 to 4 and 6 to 8, and an orange
  attention layer with 32 heads and 8 key-value heads in layer 5. The feed-forward block is a dense MLP in odd layers
  and a mixture-of-experts layer with 16 experts, 2 active per token, in even layers. An arrow leaves each layer's
  feed-forward block and enters the next layer's first RMSNorm. Notes on the right say: 1 attention layer in 8, a
  ratio of 1 to 7; MoE every second layer; 7 Mamba layers with a fixed state and no KV cache; and Jamba stacks 4 such
  blocks for 32 layers, 4 attention, 28 Mamba and 16 MoE.
caption: >-
  Teal marks Mamba (SSM) layers: seven of every eight layers mix tokens with a fixed-size state, one uses attention,
  and every other MLP is a 16-expert MoE. Residual additions are not drawn. After Lieber et al. (2024), Figure 1.
