title: Lost in the middle
alt: >-
  A line chart of accuracy against the position of the passage that holds the answer, for GPT-3.5-Turbo answering
  questions from 20 retrieved passages of about 4,000 tokens in total. The blue line starts high at 75.8% when the
  answer is in the first passage, falls to 57.2% at position 5, bottoms out at 53.8% at position 10, recovers
  slightly to 55.4% at position 15 and rises to 63.2% at position 20, the last passage: a U shape. A dashed green
  line at 88.3% marks the oracle score, with only the answer passage given. A dashed red line at 56.1% marks the
  closed-book score, with no passages at all. The points at positions 10 and 15 are red because they fall below
  the closed-book line: with the answer buried in the middle, the model did worse than with no passages.
caption: >-
  Accuracy is highest when the answer is first or last and dips below the no-passages baseline in the middle.
  Numbers from Liu et al. (2023), Tables 1 and 6.
