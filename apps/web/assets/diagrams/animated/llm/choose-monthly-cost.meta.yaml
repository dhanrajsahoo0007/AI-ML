title: "Monthly cost: two price tiers and a routed mix"
alt: >-
  A worked cost estimate. The workload is 50,000 requests a day for 30 days, with 2,000 input and 400 output tokens
  each. A line in red says the prices are illustrative, not quotes: the large tier costs $5 per million input tokens
  and $20 per million output tokens, the small tier $0.50 and $2. The formula reads: monthly cost equals requests per
  day times 30 times input tokens times input price plus output tokens times output price, divided by one million.
  Three horizontal bars are drawn to the same scale, each split into a blue input part and a violet output part. Large
  tier only: $15,000 input plus $12,000 output, $27,000 a month or $0.018 per request. Small tier only: $2,700 a month,
  $0.0018 per request. A router that sends 80% of requests to the small tier and 20% to the large tier, in green:
  $7,560 a month, $0.00504 per request. A note says routing 20% of traffic to the large tier costs 28% of large-only,
  72% less, and that whether this is acceptable depends on the quality of the small model's answers on your own eval
  set.
caption: >-
  With illustrative prices 10× apart, sending 20% of traffic to the large tier costs 28% of running everything on it;
  the formula holds for any prices you plug in.
tags: [llm, cost, model-selection, routing, genai]
