title: One next-token distribution at three temperatures
alt: >-
  A chart of the next-token probabilities after "After the rain, the sky turned", for eight candidate tokens listed
  top to bottom with their lavender logits: gray 3.3, blue 3.0, clear 2.4, dark 2.1, pink 1.5, orange 1.1, bright 0.6
  and green minus 0.5. Three panels of green bars show the softmax of the same logits at three temperatures. At
  temperature 0.5 the bars are steep: gray 0.54, blue 0.30, clear 0.09, and the last three tokens round to 0.01 or
  0.00. At temperature 1.0, the plain softmax, gray has 0.36, blue 0.26, clear 0.14, dark 0.11, pink 0.06, orange
  0.04, bright 0.02 and green 0.01. At temperature 1.5 the bars are flatter: gray 0.28, blue 0.23, clear 0.15, dark
  0.13, pink 0.08, orange 0.06, bright 0.05 and green 0.02. The formula at the top reads p sub i equals exp of z sub
  i over T, divided by the sum over j of exp of z sub j over T.
caption: >-
  Dividing the logits by T before the softmax reorders nothing but reshapes everything: at T = 0.5 the top token takes
  0.54 of the mass, at T = 1.5 it keeps only 0.28 and the tail grows.
