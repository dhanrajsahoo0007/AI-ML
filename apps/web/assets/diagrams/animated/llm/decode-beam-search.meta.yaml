title: Beam search with beam width 2
alt: >-
  A tree that grows from left to right in three build steps, starting from the prompt "The sky". Each box shows a
  token and the total log-probability of the sequence so far; each arrow is labelled with the log-probability of the
  token it adds. Kept sequences are green; pruned ones are gray with dashed arrows. At step 1 the candidates are
  "is" (total minus 0.69), "was" (minus 0.92) and "looks" (minus 2.30); "is" and "was" are kept. At step 2 "is"
  grows into "very" (minus 1.61), "gray" (minus 1.74) and "so" (minus 2.08), and "was" grows into "gray" (minus 1.14),
  "dark" (minus 2.81) and "very" (minus 3.91); the two best, "was gray" and "is very", are kept. At step 3 "is very"
  grows into "gray" (minus 2.12), "dark" (minus 2.81) and "bright" (minus 3.91), and "was gray" grows into "today"
  (minus 1.50), "again" (minus 2.75) and "and" (minus 3.44). The best sequence, "The sky was gray today", is
  highlighted with total minus 1.50, probability 0.224. A note compares it with greedy decoding, which picks the top
  token every time and ends at "The sky is very gray", total minus 2.12, probability 0.120.
caption: >-
  Greedy would commit to “is” at step 1; a beam of 2 keeps “was” alive and finds “The sky was gray today”, whose
  total log-probability (−1.50) beats greedy's −2.12.
tags: [llm, decoding, beam-search, greedy, genai]
