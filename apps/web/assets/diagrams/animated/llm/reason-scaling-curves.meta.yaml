title: Accuracy against test-time compute
alt: >-
  Two line charts of accuracy on AIME 2024, a 30-problem math competition, sharing a 0 to 100% scale. Left, in
  violet, "Longer thinking": a 32B s1 variant whose thinking is cut off at a token budget. At an average of 1,024
  thinking tokens it scores 3.3%, one problem out of 30; at 2,048 tokens 30.0%; at 4,031 and 5,664 tokens 33.3%; at
  6,330 tokens 40.0%. Accuracy climbs steeply at first and then slowly. Right, in orange, "More samples": OpenAI o1
  scores 74% with one sample per problem, 83% with a majority vote over 64 samples and 93% when a learned scorer
  re-ranks 1,000 samples, plotted on a log scale of samples per problem. A grey dashed line marks GPT-4o at 12% with
  one sample.
caption: >-
  Both kinds of extra compute raise accuracy, and the first increase buys the most.
  Points from Muennighoff et al. (2025), Table 12, and OpenAI's “Learning to Reason with LLMs” (2024); lines join
  reported points only.
