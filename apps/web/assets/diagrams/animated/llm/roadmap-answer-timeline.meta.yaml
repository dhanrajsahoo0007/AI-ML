title: One 45-minute GenAI design answer, phase by phase
alt: >-
  A timeline of an illustrative 45-minute GenAI system design round for the help-centre assistant, drawn as a strip
  whose segments are as long as their minutes. Clarify takes minutes 0 to 5: users, questions a day, languages,
  freshness and the cost of an error. Baseline takes minutes 5 to 10: retrieve the top articles, put them in a prompt
  and answer with citations. Deep dive, the highlighted and longest segment, takes minutes 10 to 30: chunking, hybrid
  search, re-ranking, the context budget, the model and the hand-off to a person. Evaluate and operate takes minutes
  30 to 40: a golden set, metrics, a judge checked against people, latency, cost and guardrails. Wrap up takes
  minutes 40 to 45: the design in three sentences, the biggest risk and what to build next. A note says the minutes
  are illustrative and that the deep dive is 20 of 45 minutes, 44 percent, spent where the interviewer leans in.
caption: >-
  Almost half the round is the deep dive, so the first ten minutes exist to earn it: numbers first, then the simplest
  system that could work (illustrative minutes).
