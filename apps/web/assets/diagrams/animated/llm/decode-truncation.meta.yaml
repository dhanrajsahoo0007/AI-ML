title: Top-k and top-p truncation of one distribution
alt: >-
  Three build steps over the same eight candidate tokens at temperature 1.0, sorted from most to least likely. Step
  1 shows green probability bars: gray 0.36, blue 0.26, clear 0.14, dark 0.11, pink 0.06, orange 0.04, bright 0.02
  and green 0.01. Step 2 adds a green dotted column titled "Top-k, k = 3": a red dashed cut line sits under the third
  token, the three kept tokens are redrawn after dividing by their kept mass of 0.76, giving gray 0.47, blue 0.34 and
  clear 0.19, and the other five tokens get 0. Step 3 adds a second column titled "Top-p, p = 0.9" with the running
  sum of probabilities, 0.36, 0.62, 0.76, 0.87, 0.93, 0.97, 0.99 and 1.00; the sum first reaches 0.9 at the fifth
  token, pink, so a red dashed cut line sits under pink. The five kept tokens hold 0.93 of the mass and are
  renormalized to 0.38, 0.28, 0.16, 0.12 and 0.06; the last three get 0.
caption: >-
  Top-k always keeps k tokens; top-p keeps as many as it takes to cover p of the mass, here 5. Both then divide the
  kept probabilities by their sum so they add up to 1 again.
tags: [llm, decoding, sampling, top-k, top-p, nucleus, genai]
