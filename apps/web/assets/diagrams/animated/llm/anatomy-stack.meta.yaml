title: Anatomy of an LLM application, one refund request through every layer
alt: >-
  An architecture diagram built in seven steps, one per layer of an LLM application, following one Brightpost
  request: customer 1847 writes "My kettle arrived cracked. It's order 4471. Can I get my money back?". Step 1: the
  message passes through the gateway, which checks the signed-in customer and a limit of 20 messages a minute, and
  reaches the harness, Brightpost's chat service. Step 2: the harness builds the prompt from the system prompt, the
  history and four tool definitions. Step 3: the help-centre index of 3,600 chunks returns the top 5 passages into the
  context. Step 4: the prompt of about 2,200 tokens goes to the model, drawn as the solid green accent, which runs on
  an inference engine and answers with a tool call. Step 5: the harness runs four tool calls; the £42 refund is over
  £30, so create_refund waits for the support agent. Step 6: guardrails check the message on the way in and the reply
  on the way out, and the reply returns through the gateway. Step 7: every span goes to a trace store, and a model
  judge grades 5 percent of them, off the customer's path.
caption: >-
  Seven layers, one request: the model only picks the next step, and every other box is ordinary software you design,
  test and pay for.
