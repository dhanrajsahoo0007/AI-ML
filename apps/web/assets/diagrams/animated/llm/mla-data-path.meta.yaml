title: "The MLA data path: what is cached and what is rebuilt"
alt: >-
  One token's path through multi-head latent attention, built in four steps. On the left, the hidden state h_t, 5120
  numbers, feeds three lavender projection boxes. Step 1: the middle box, Down-project W_DKV, turns h_t into a row of
  8 pink cells, the latent c_KV of 512 numbers, inside a teal dotted group labelled KV cache. Step 2: the bottom box,
  RoPE key W_KR, passes through a RoPE circle with a sine wave and becomes one teal cell, k_R of 64 numbers, also
  inside the KV cache group, which totals 576 numbers per token per layer. Step 3: from c_KV, two arrows lead to
  lavender boxes Up-project W_UV and Up-project W_UK, which produce violet per-head values v_i, 128 heads of 128
  numbers, and teal per-head keys k_i, 128 heads of 128 plus 64; a long arrow labelled "same k_R for every head"
  carries k_R into every head's key. Step 4: the top box, Query path via c_Q, sends a 1536-number query latent, which
  is not cached, to blue per-head queries q_i of 128 plus 64 numbers. Queries, keys and values enter a tall orange
  Attention box, per head, times 128, whose output goes through a lavender W_O box to the output u_t of 5120 numbers.
caption: >-
  MLA caches only the 512-number latent c_KV and the 64-number RoPE key k_R per token per layer; per-head keys and
  values are rebuilt from the latent when attention runs. Based on DeepSeek-V2 (2024), §2.1.
tags: [llm, attention, mla, kv-cache, rope, inference, genai]
