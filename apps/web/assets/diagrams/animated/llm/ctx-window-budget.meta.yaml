title: What fills a context window
alt: >-
  A horizontal bar drawn to scale represents a 128,000-token context window, with a scale marked every 32,000
  tokens. Read left to right, it holds a grey sliver for the system prompt and tool definitions (3,000 tokens), a
  teal block for the conversation history (24,000), a wide blue block for retrieved documents (60,000), an orange
  sliver for the user's new question (1,000), a green block reserved for the model's output (8,000, the max_tokens
  setting), and an empty outlined block of free headroom (32,000). A bracket under the first four parts marks the
  input the model reads, 88,000 tokens or about 66,000 English words; a green bracket marks the output reserve; a
  bracket under the whole bar notes that input and output share the 128,000-token window. A note says every call
  re-sends the whole input, so the history grows each turn unless old turns are trimmed or summarized.
caption: >-
  Instructions, history, retrieved text, the question and the reserved output all share one budget: here 88,000
  tokens of input plus 8,000 reserved for the answer leave 32,000 free.
