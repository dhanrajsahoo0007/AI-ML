title: An induction head completes a repeated pattern
alt: >-
  A row of eight token blocks reads "Dr Ilsen fixed the pump . Later Dr". The first "Dr" is marked [A], "Ilsen" is
  marked [B], and the last "Dr", in blue, is marked [A] again. In step 2, teal arcs under the row show a
  previous-token head in an earlier layer: every token reads the token just before it, and the strongest arc runs
  from "Ilsen" back to "Dr", so a teal tag under "Ilsen" reads "after Dr". In step 3, an orange arc over the row
  shows an induction head in a later layer: the current "Dr" asks which token came after a "Dr" and attends to
  "Ilsen". In step 4, an arrow labelled "copy [B]" leads from the last "Dr" to a green block with the prediction
  "Ilsen", and a note states the rule [A][B] … [A] → [B]: the head copies what followed last time, the same move that
  reuses a pattern from a few-shot example.
caption: >-
  Two heads work as a pair: an earlier one tags each token with its predecessor, and a later one finds the token that
  followed the current one last time and copies it. Schematic, after Olsson et al. (2022).
