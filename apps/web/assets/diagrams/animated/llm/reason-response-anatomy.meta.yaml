title: Anatomy of a reasoning response
alt: >-
  Four panels about one illustrative request. Panel 1, drawn to scale: a blue block for a 1,200-token prompt, then a
  long violet block of 6,000 thinking tokens, then a thin green block for a 400-token answer. Panel 2, what the user
  sees: the prompt, a long grey block saying the raw thinking is hidden and some APIs return a short summary instead,
  and the 400-token answer; a note says there is a long pause unless a summary or progress note streams. Panel 3,
  what you pay at illustrative prices of $2 per million input tokens and $10 per million output tokens: the input
  costs 1,200 × $2/M = $0.0024; the output is 6,000 thinking plus 400 answer tokens, 6,400 tokens × $10/M = $0.064,
  billed whether or not you see the thinking. The total is $0.0664, against $0.0064 for the same 400-token answer
  with no thinking, about 10 times less. Panel 4, how long the user waits at an illustrative 100 output tokens per
  second: after prefill reads the prompt, 6,000 thinking tokens take about 60 seconds before the answer starts to
  stream. A final note says some APIs keep earlier thinking in the context on the next turn and bill it again as
  input tokens.
caption: >-
  Thinking tokens are output tokens: you pay for all of them and wait for all of them, even when you only see a
  summary. Token counts, prices and speed are illustrative.
