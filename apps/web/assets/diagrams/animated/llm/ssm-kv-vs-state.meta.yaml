title: KV cache grows, SSM state stays fixed
alt: >-
  Four tokens, "kites", "fly", "over" and "hills", arrive one at a time from left to right. In the top row, an
  attention layer's cache, drawn in orange, holds one key cell and one value cell per token: one column after the
  first token, two after the second, and four after the fourth, so it grows with every token. In the bottom row, an
  SSM layer's state, drawn in teal, is a grid of 3 by 4 numbers. After each token, a teal arrow carries the old state
  into a new grid of the same size whose shaded numbers have changed, so the state is overwritten rather than
  extended. A note says that after 128,000 tokens the cache would hold 128,000 columns per attention layer while the
  state still holds 12 numbers, so the state must choose what to keep.
caption: >-
  Attention keeps a key and a value for every past token, so its cache grows without end; an SSM layer folds each
  token into a state of fixed size. Toy numbers.
tags: [llm, ssm, mamba, kv-cache, inference]
