title: The study path through the GenAI hub, by tier, with its prerequisites
alt: >-
  The GenAI hub's groups as tiles in four tiers plus a branch, each tier a row read from top to bottom. Tier 1,
  Orientation: Start Here, highlighted, the map to read first. Tier 2, Foundations: LLM Foundations. Tier 3, Building
  blocks: RAG & Knowledge, AI Agents & Engineering, and Fine-Tuning & Adaptation. Tier 4, Running it: Evaluation,
  Inference & Serving, LLMOps & Observability, and Safety, Security & Governance. The branch, taken only if the role
  needs it: Multimodal & Voice, which assumes tiers 2 and 4. Small chips under the tiles name the pages from the
  prerequisites table, and arrows run from the page to read first to the page that needs it: Embeddings to Vector
  Databases and RAG Fundamentals to Agentic RAG inside RAG & Knowledge; Agent Architectures across to Agentic RAG;
  Self-Attention Explained down two tiers to LLM Inference Engine; Fine-Tuning LLMs to LoRA, QLoRA & PEFT; Tool Use &
  Function Calling down to Prompt Injection & Jailbreaks; and LLM Evaluation Fundamentals, in tier 4, up to RAG
  Evaluation in tier 3.
caption: >-
  Tiers set the order, arrows set the exceptions: one tier 4 page (LLM Evaluation Fundamentals) comes before a tier 3
  page (RAG Evaluation), and attention in tier 2 is what the serving engine caches.
