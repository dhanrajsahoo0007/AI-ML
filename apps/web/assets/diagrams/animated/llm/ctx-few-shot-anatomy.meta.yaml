title: Anatomy of a few-shot prompt
alt: >-
  A prompt drawn as a column of blocks, read top to bottom. A grey block holds the instruction: sort each support
  ticket into billing, bug or account. A violet group of three blocks holds the demonstrations, each a ticket and
  its label: a double charge labelled billing, a broken export button labelled bug, and a question about changing
  the sign-in email labelled account. An orange block holds the new ticket, about a wrong VAT number on an
  invoice, followed by an empty "Label:". An arrow labelled "model writes next" leads to a green block with the
  answer, billing. Notes on the right explain each part: zero-shot uses only the instruction and the query, one-shot
  adds one example and few-shot several; the examples mostly teach the label set, the input style and the format;
  the order and balance of examples sway the answer through recency and majority-label bias; after "Label:" the
  model looks back at what followed "Label:" before, the copying that induction heads perform; and no weights
  change, so deleting the examples removes the skill.
caption: >-
  A few-shot prompt is an instruction, a handful of worked examples in one fixed format, and the new input with its
  answer left blank; the model fills the blank without any weight update.
tags: [llm, in-context-learning, prompting, genai]
