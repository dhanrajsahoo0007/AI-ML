title: A two-model cascade and its blended cost
alt: >-
  A flow in four steps. A grey Requests block, 100% of traffic, points to a blue Small model block that answers
  everything first. The small model points to an orange Confidence check block that asks whether the score clears a
  threshold; a note above says the check can be the model's own token probabilities, a verifier, or a small scorer.
  An arrow labelled "80% accept" goes from the check to a green "Answer to user" block. An arrow labelled "20%
  escalate" goes down to a violet Large model block, which also points to the answer. A note says escalated requests
  pay for both models and wait for both. Below, a group titled "Blended cost per request, to scale" compares two
  bars: large model only, $0.0180 per request and $27,000 a month; and the cascade with 20% escalated, a short blue
  "small" segment plus a violet "20% times large" segment, totalling $0.0018 plus 0.2 times $0.0180, which is
  $0.0054 per request, $8,100 a month, 70% less. A footnote says the prices and workload are the illustrative ones
  from the cost chart.
caption: >-
  Every request pays for the small model and only the escalated 20% also pay for the large one, so with these
  illustrative prices the blend costs 30% of large-only, at the price of extra latency on the hard cases.
