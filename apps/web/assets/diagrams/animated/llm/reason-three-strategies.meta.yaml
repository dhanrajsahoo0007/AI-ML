title: Three ways to spend test-time compute
alt: >-
  Three rows, each answering the same toy question: a notebook and a pen cost $1.20 together and the notebook costs
  $1.00 more than the pen; what does the pen cost? The correct answer is $0.10 and the tempting slip is $0.20. Row 1,
  "One long chain of thought": a grey Question box feeds one wide violet box of thinking tokens that first tries
  $0.20, notices the total would be $1.40, writes "Wait", sets up 2p + 1.00 = 1.20 and finds p = 0.10; a green box
  gives the correct answer $0.10. The cost note says it is one sample, but a long one. Row 2, "N samples + majority
  vote (self-consistency)": the question is sampled five times at a temperature above zero. Samples 1, 3 and 5 answer
  $0.20 and are red; samples 2 and 4 answer $0.10 and are blue. An orange Majority vote box counts $0.20: 3 votes and
  $0.10: 2 votes, so the red answer box says $0.20, wrong. Row 3, "N samples + a verifier (best-of-N)": the same five
  samples each get a teal score, the product of per-step scores from a process reward model: 0.23, 0.79, 0.19, 0.69
  and 0.23. The teal Verifier box keeps the best, sample 2, scored 0.95 × 0.90 × 0.92 = 0.79, and the green answer
  box says $0.10, correct. The cost note says five samples plus a verifier pass on each.
caption: >-
  On this toy question the model's most common slip wins the vote, while the verifier, which scores each step,
  keeps a correct sample, and the single long chain catches the slip by checking itself.
tags: [llm, reasoning, test-time-compute, self-consistency, verifier, genai]
