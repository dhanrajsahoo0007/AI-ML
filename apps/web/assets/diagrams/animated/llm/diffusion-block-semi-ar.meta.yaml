title: Block (semi-autoregressive) diffusion
alt: >-
  A 12-token answer, "Boil the water first then add the leaves and wait four minutes", is built in three dotted
  blocks of 4 tokens, one block per build step, with one row per denoising pass. In block 1, pass 1 commits "Boil"
  (0.91) and "water" (0.83) while two positions stay masked; pass 2 commits "the" (0.88) and "first" (0.71). In
  passes 3 and 4 the block 1 tokens turn teal, meaning their keys and values are cached, while block 2 is denoised
  the same way: "add" and "leaves" first, then "then" and "the". In passes 5 and 6 blocks 1 and 2 are teal and block
  3 is denoised: "wait" and "minutes", then "and" and "four". Notes say attention inside a block is bidirectional,
  finished blocks are cached and reused, and generation can stop after any block.
caption: >-
  Block diffusion generates blocks left to right and runs diffusion only inside the current block, so finished
  blocks can be cached like an autoregressive prefix and the output length is not fixed in advance.
tags: [llm, diffusion, block-diffusion, kv-cache, genai]
