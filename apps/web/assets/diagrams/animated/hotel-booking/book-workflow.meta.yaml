title: "Hold, pay, confirm as a workflow, with compensation"
alt: >-
  A sequence diagram in three steps with five lanes: an orange guest, a green booking workflow, a violet inventory
  database, a teal payment service and a grey channel manager. Step 1: the guest pays with key k7; the workflow
  authorises 360 dollars, turns the three held nights into sold and writes booking 8812 in one transaction, captures
  the payment, confirms to the guest and pushes the booking to the channel manager. Step 2: another payment with key
  k8 is declined, drawn red; the workflow's compensation releases the three held nights and the guest is told the
  rooms are free again. Step 3: the guest cancels booking 8812; the workflow frees the three nights, refunds by the
  cancellation policy and pushes the cancellation to the channel manager.
caption: >-
  The workflow records each step, so a crash resumes where it stopped; a failure runs the compensations, and a cancel
  is the same steps in reverse.
tags: [case-studies, hotel-booking, saga, workflows, idempotency]
