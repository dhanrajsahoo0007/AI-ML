title: A three-night stay is three guarded rows
alt: >-
  A layout in two steps under the statement that adds one held room to each night only while held plus sold plus one
  is at most the total plus the overbooking allowance. Step 1: guest A books one double room for Friday, Saturday and
  Sunday; all three night rows pass the guard and are drawn green, Saturday taking its last room, so three rows
  changed for three nights and the transaction commits. Step 2: guest B asks for the same nights a moment later;
  Friday and Sunday change and are drawn grey because they are undone, Saturday is full and drawn red with zero rows
  changed, so two rows changed for three nights and the whole transaction rolls back.
caption: >-
  One transaction updates every night of the stay; if any night is full, the row count comes up short and nothing is
  kept.
tags: [case-studies, hotel-booking, concurrency, reservations]
