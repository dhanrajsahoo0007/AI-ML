title: Two overlapping stays, one last room
alt: >-
  A sequence diagram in two steps with four lanes: orange guests A and B, a teal booking service and a violet
  inventory database. Step 1: guest A asks for Friday and Saturday and guest B for Saturday and Sunday; the service
  reads Saturday as 9 of 10 taken for each, then writes 10 for each, drawn red because eleven guests now hold ten
  rooms, and both are told they are booked. Step 2: each booking is one guarded update of its nights in date order;
  A's changes two rows and commits, B's finds Saturday at 10 of 10, drawn red, rolls back, and B is told Saturday is
  sold out while A's rooms are held until 10:15.
caption: >-
  Reading a count and writing it back lets two overlapping stays take one last room; a guarded update per night lets
  the database pick one.
tags: [case-studies, hotel-booking, concurrency, contention]
source: original
