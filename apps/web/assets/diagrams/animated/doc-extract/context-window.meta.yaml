title: One extraction call's context window
alt: >-
  A single bar for a 13,170-token prompt, built in two steps. Step 1: the stable prefix, bracketed as cached, 1,500
  tokens: grey instructions, 900, and a teal schema, 600. Step 2: the changing blocks, bracketed as 11,670 tokens
  that change every invoice: violet supplier hints, 400, then two wide blue blocks, the two page images at 150 DPI,
  5,670 tokens, and the OCR words with their ids, 5,600. Footer lines say about 1,300 tokens come out; a page is 2,835
  image tokens plus 350 words at 8 tokens each, 2,800; the small vision-language model costs 1,500 times 0.01 plus
  11,670 times 0.10 plus 1,300 times 0.50 US dollars per million, about 0.0018 US dollars, and the mid-size model about
  0.0401; route A drops the images, leaving 6,000 changing tokens, and the tie-break drops the words, 6,070.
caption: >-
  The page arrives twice, as an image for layout and as OCR words with ids the model must cite; only the 1,500-token
  prefix of instructions and schema is stable enough to cache.
tags: [genai, case-study, document-processing, context-window, cost]
