title: "One scanned invoice, field by field"
alt: >-
  A layout in four steps. Step 1: on the left, Harbourline Packaging's scanned two-page invoice INV-20417 drawn as
  pale blue regions: supplier and VAT number, invoice number and date 03/11/2026, bill-to Brightpost UK and PO-7731,
  three lines (shipping boxes 800.00, packing tape 240.00, address labels 200.00), and the totals, net 1,240.00 and
  VAT 248.00, with one digit of the total faint and highlighted; page 2 arrived upside down and was de-rotated; with no
  text layer the invoice takes route B. Step 2: a table of the 11 critical fields with two green columns, the primary
  vision-language model and the second reader, Textract on its own OCR. They agree on ten fields; on the gross total
  the primary copies Azure Read's word 311, 1,438.00, shown red, while Textract reads 1,488.00, and a note says word 311
  had confidence 0.71 and the boxes overlap at IoU 0.90. Step 3: a lime column shows rules passing on ten fields and a
  blind image-only tie-break reading 1,488.00 on the gross; two lines of arithmetic show 800.00 plus 240.00 plus 200.00
  equals 1,240.00, VAT at 20 percent is 248.00, and 1,240.00 plus 248.00 equals 1,488.00, so 1,438.00 would fail.
  Step 4: a lime column gives each field's P(correct) against its family threshold, from 0.9971 against 0.995 on the
  gross to 0.9997 against 0.995 on the currency; a green box says 11 of 11 critical fields pass, so the invoice is
  auto-approved and the outbox posts it once. A note says the P(correct) values are illustrative.
caption: >-
  The model copied a misread digit; a second reader on a different OCR engine disagreed, a blind tie-break and the
  arithmetic settled it, and only then did the calibrated score let the invoice post on its own.
