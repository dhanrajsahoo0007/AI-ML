title: One invoice becomes typed fields with confidences
alt: >-
  On the left, a scanned supplier invoice drawn as pale blue regions: the supplier, Harbourline Packaging Ltd, with
  its VAT number; the invoice number INV-20417; the date printed 03/11/2026; a handwritten purchase order number
  PO-7731; three line items, boxes for 800.00, tape for 240.00 and labels for 200.00; and the totals, subtotal
  1,240.00, VAT at 20 percent 248.00 and total 1,488.00. In step 2 a table of extracted fields appears on the right,
  each with a green value and a lime confidence bar on a scale from 0.5 to 1.0: supplier name 0.99, supplier VAT number
  0.97, invoice number 0.98, invoice date 2026-11-03 at 0.71, purchase order number 0.62, line items, 3 rows totalling
  1,240.00, at 0.93, VAT amount 0.95 and total 0.96. A dashed line marks the 0.90 threshold; the date and the purchase
  order bars fall short of it and are red. In step 3 a note lists the checks that pass: the lines add up to 1,240.00,
  VAT is 20 percent of the subtotal and the total is 1,488.00, and the supplier's VAT number is found in the ERP. A red
  box says 2 of 24 fields are below 0.90, so the invoice goes to the review queue with both fields marked.
caption: >-
  The model proposes every field; the sums and the threshold decide that a clerk checks two fields, not twenty-four.
tags: [genai, document-processing, structured-output, case-study]
