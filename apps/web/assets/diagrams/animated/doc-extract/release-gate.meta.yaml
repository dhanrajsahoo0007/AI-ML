title: The extraction release gate
alt: >-
  A gate diagram in one step. A grey release candidate, a new page classifier, fans out to seven checks run on 2,000
  gold invoices, 300 multi-document files and 200 poisoned documents. Six lime checks pass: critical accuracy paired,
  down 0.2 points against a 0.93-point margin; replayed escapes paired, up 1 against an allowance of 2; calibration at
  the family thresholds, inside each interval; poisoned documents, 0 of 200 changing a value; p95 per route within the
  latency targets and cost up 3 percent; and straight-through rate on the replay, down 0.4 points against a limit of
  1. One red check fails: credit notes as invoices, 1 of 90. All seven feed a red Block box, fix credit notes. Notes
  say 0 of 90 credit notes and statements are allowed, at most 3.3 percent by the rule of three, that one failing check
  blocks the release, that the first two gates are smoke tests followed by a two-week canary on 10 percent of
  suppliers, and that the measured values are illustrative.
caption: >-
  A credit note read as an invoice pays instead of deducting, so kind has its own gate: one of 90 blocks the release,
  however good the accuracy numbers look.
