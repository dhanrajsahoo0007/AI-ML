title: The review queue in staff hours
alt: >-
  Four stacked bars of a day's review hours on one scale from 0 to 65 hours, each with a capacity line for its team
  at 85 percent of 6 productive hours a clerk, built in three steps, with a colour key: field review blue, route C and
  value review orange, business exceptions grey, lines, failures and holds red, and audits, receipts and mail lime.
  Step 1, steady state: a normal day of 1,625 invoices is 29.8 hours of work against 6 clerks' 30.6 hours (83
  percent), mostly exceptions 8.7, flat work 6.9, route C and value review 6.3 and lines, failures and holds 5.5, with
  little field review; a month-end day of 2,800 invoices is 46.4 hours against 10 clerks' 51.0 (77 percent). Step 2,
  at launch: 37.5 hours against 8 clerks' 40.8 on a normal day and 59.8 against 12 clerks' 61.2 at month end, with
  field review grown to 8.4 and 14.6 hours. Step 3: footer lines say the month is about 709 hours of work, about
  21,300 US dollars, but the roster of 6 permanent clerks plus 4 flex for the 5 month-end days is 1,168 paid hours,
  about 35,040 US dollars; one STP point is about 5.6 hours of work, yet money moves in steps of one clerk, about 19
  points or 5,040 US dollars a month; canary audits, about 25 hours a month, are done by the AP-ops owner, not the
  clerks on the roster.
caption: >-
  People are the running cost: 709 hours of review work become a roster of 6 permanent and 4 month-end clerks at 85%
  utilisation, and a better model saves money only when it removes a whole clerk.
