title: Calibration checked where it decides
alt: >-
  Two plots in two steps. Step 1, left: observed accuracy on band labels against the scorer's P(correct) at the
  threshold, with a dashed diagonal for perfect calibration. At each of three family thresholds, lime points sit on the
  diagonal with a lime whisker running down to where a calibrated scorer could land with about 1,817 band labels a
  quarter split by field count: amounts at 0.995 reach down to about 0.989, PO and dates at 0.997 to about 0.991, and
  kind, parties and invoice number at 0.998 to about 0.994, so each family's interval is up to a point of accuracy
  wide. Step 2, right: the pooled band. A lime Poisson curve peaks near 5 errors for a calibrated scorer, expected
  about 5.5 a quarter; a red curve for a band three times worse peaks near 16; a red dashed line marks the alarm at 11
  or more errors. A footer says the alarm is a false alarm in 2.4 percent of quarters and catches a band three times
  worse 93 percent of the time, and that the labels come from a random 2 percent of auto-approved invoices, about 551
  a month, and band samples weighted by one over their selection probability.
caption: >-
  One family's band labels cannot convict the scorer, so the alarm pools the whole band: 11 errors where 5.5 are
  expected fires 2.4% of quarters by chance and 93% of the time when the band is three times worse.
