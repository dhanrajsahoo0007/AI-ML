title: The difficulty router and its three routes
alt: >-
  A layout in three steps. Step 1: five blue signal cells on the left, read in milliseconds without a model: text
  layer present, known template after at least 5 invoices, handwriting on a critical field, mean OCR confidence below
  0.80, and a language Textract reads; each points level into a tall lime router box that applies rules. Step 2: the
  router points to three routes. Route A, lime, 55 percent of invoices, born-digital with a known template, uses a
  small model on the text-layer words with template anchors as the second reader. Route B, lime, 40 percent, a novel
  layout or a scan of print, uses a small vision-language model on the image and the words, and Textract on its own
  OCR. Route C, orange, 5 percent, handwriting, degraded scans or an unsupported language, uses a mid-size model and
  Textract to pre-fill a review task. Step 3: the cost under each reader card: 0.0053 US dollars an invoice for A
  (0.0026 a page), 0.0258 for B and 0.0432 with a tie-break, 0.0641 for C, which is always reviewed; a footer blends
  them to about 0.0178 US dollars an invoice, 0.0089 a page, half of it the second reader.
caption: >-
  Cheap signals send 55% of invoices down a 0.0053 USD path; the expensive readers go only where the page is hard,
  and route C always ends with a person.
