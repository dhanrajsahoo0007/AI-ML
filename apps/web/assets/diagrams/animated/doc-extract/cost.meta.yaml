title: A month of the extraction pipeline in US dollars
alt: >-
  A horizontal bar chart of US dollars a month, bars to scale, for 72,000 documents, in three steps. Step 1: a tiny
  green bar for models and cloud services, 855, about 0.0178 an invoice, and a tiny grey bar for infrastructure, 800.
  Step 2: a long orange bar for the review roster, 35,040, 6 permanent and 4 flex clerks, and a nearly as long blue bar
  for engineering and AP operations, 33,000, 3 full-time equivalents; a line totals about 69,695 US dollars, about 0.97
  a document, with review 50 percent, engineering 47 percent and models 1.2 percent. Step 3: three lines price the
  levers: the mid-size model everywhere adds 1,851 a month and pays only for at least 11 STP points that remove clerks
  or 43 percent fewer escapes; one permanent clerk is 5,040 a month, about 19 STP points; the Batch API would save 120
  but is not taken because it lacks zero data retention; and an AP-automation product wins only below about 0.72 US
  dollars an invoice, since it still needs the same review roster.
caption: >-
  Tokens are about 1% of the bill; the review roster and the engineers are the rest, so every model upgrade is priced
  in clerks removed and escapes avoided.
tags: [genai, case-study, document-processing, cost]
