title: Document extraction pipeline architecture, built step by step
alt: >-
  An architecture diagram built in seven steps, with dotted zones for clients, edge, the core pipeline, finance
  systems, storage, application services and an async pipeline. Suppliers email PDF invoices to an ingest service,
  which keeps the originals in a document store. In step 1 ingest sends each file straight to a solid green extractor,
  a vision-language model that writes JSON, which is posted straight to the ERP. Step 2 adds a classifier that labels
  the document type and splits files, passing on a document id. Step 3 adds an OCR and layout stage between the
  classifier and the extractor that reads words and their boxes. Step 4 adds a schema store, one schema per document
  type, that feeds the extractor. Step 5 adds a validator: the extractor sends it fields with confidence scores, and
  it checks them against the ERP's suppliers and purchase orders before posting. Step 6 adds a review queue beside
  the validator, where clerks check doubtful invoices and send them back corrected, shown as a dashed two-way line.
  Step 7 adds an accuracy monitor that receives every decision from the validator as a dashed line and keeps an
  evaluation set and drift measures.
caption: >-
  The model only proposes values; rules and a confidence threshold decide which invoices post on their own and which
  wait for a clerk.
