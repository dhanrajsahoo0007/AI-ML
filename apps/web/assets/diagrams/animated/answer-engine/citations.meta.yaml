title: Citations are checked before they are shown
alt: >-
  A layout in four steps. Step 1: four blue numbered spans on the left: [1] HTTP/3 maps HTTP onto QUIC, from RFC 9114;
  [2] QUIC runs on UDP, stream by stream, from RFC 9000; [3] on TCP one lost packet stalls all streams, from a CDN
  engineering blog; [4] QUIC's handshake uses TLS 1.3, from RFC 9001. Step 2: four green sentences in the middle, each
  ending with the spans it cites; arrows run from sentence 1 to span 1 and from sentence 2 to spans 2 and 3. Step 3:
  each sentence goes to an outcome on the right: sentences 1 and 2 are shown in green; sentence 3, which cited span 2,
  is re-cited in lime to span 4, which supports it, with a dashed arrow to span 4; sentence 4, HTTP/3 is always twice
  as fast, is dropped in red because no span supports it. A row of four lime boxes shows the check cascade: rules in
  about 1 millisecond, a 0.8B checker on every sentence in 60 milliseconds, a 7B checker on the uncertain 20 percent,
  and copy and harm checks. Step 4: a grey box says generation restarts after sentence 3 with the claim excluded, the
  next token about 300 milliseconds later, never retracting text; a lime box says copying is counted per origin across
  sentences, with a running run of at most 25 words, at most 50 words in total and at most 2 copied sentences in a
  row. A footer says 7.1 percent of sentences are dropped, 0.80 restarts an answer, 4.9 percent of answers end
  low-confidence, and four copied 19-word sentences fail at the second.
caption: >-
  A citation is a claim the system checks: a sentence is shown, pointed at the span that supports it, or dropped and
  regenerated, and copying is counted across the whole answer, not per sentence.
