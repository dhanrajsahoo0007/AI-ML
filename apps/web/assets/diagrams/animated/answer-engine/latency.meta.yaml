title: Latency to the first verified sentence, per path
alt: >-
  A waterfall chart in four steps, p50 in milliseconds. Step 1, the own-index path: edge, screen and cache lookup 30;
  a lime planner 250; a violet own-index query and ranking from 600 to 12 spans, 190, ending at a dashed line, sources
  at 470; assembly 10; a green model first token 500; a green first sentence 313; and lime checks 60, ending at a
  dashed line, first verified sentence at 1,353 milliseconds against a target of 1,500. Step 2, the API-routed path on
  the same scale: edge 30, planner 250, a teal search-API call 513, a teal row for the slowest of 3 fetches plus parse
  430, ranking 110 ending at sources at 1,333, then the same model and check stages, first verified sentence at 2,215
  against a target of 2,400. Step 3: a cache hit returns the whole answer in 50 milliseconds, before the planner would
  have finished at 280. Step 4, on its own scale, multi-hop: edge and planner 280, two green rounds of 1,940 each, and
  the answer stages 1,073, first verified sentence at 5,233 milliseconds, about 5,400 when some rounds call the API,
  against a target of 6,000. Footer notes give the max-of-3 working for fetches and the p95 of each path.
caption: >-
  The own index reaches the first checked sentence about 860 ms sooner than the API path; the slowest of three
  fetches, not the average, sets the API path's budget.
