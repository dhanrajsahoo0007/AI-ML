title: The latency budget to the first answer token
alt: >-
  A waterfall chart on a time axis from 0 to 2,000 milliseconds, marked illustrative. Five bars follow one another:
  an orange bar, understand and rewrite the question, 150 milliseconds; a grey bar, 3 searches in parallel, 300
  milliseconds; a blue bar, fetch and parse 8 pages, 500 milliseconds; a lime bar, chunk and rerank, 150 milliseconds;
  and a green bar, the LLM to its first token, 400 milliseconds. A dashed line at 1,100 milliseconds is labelled
  sources shown, and a dashed line at 1,500 milliseconds is labelled first token. In step 2 a pale blue bar for one
  slow page that takes 3 seconds is labelled dropped at the end of the fetch stage, with a dashed line running on and a
  note that it would end at 3,450 milliseconds. In step 3 a short green bar shows an answer cache hit: 50 milliseconds
  for the whole answer.
caption: >-
  Every stage gets a fixed budget, so one slow page cannot hold the answer hostage; a cache hit skips the lot.
