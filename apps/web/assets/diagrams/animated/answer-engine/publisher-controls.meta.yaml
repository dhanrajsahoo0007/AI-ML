title: Publisher controls become host flags
alt: >-
  A layout in three steps. Step 1: four blue boxes on the left, robots.txt under RFC 9309, Content Signals with
  search, ai-input and ai-train, an RSL licence with ai-index, ai-input and payment terms, and snippet rules such as
  nosnippet and max-snippet, all point at a violet host flags box in the middle holding may_index, may_answer_from,
  max_snippet, the licence and a version. Step 2: the flags point at two lime boxes on the right: the crawler skips
  hosts unless may_index is true, and the retrieval prefilter removes disallowed hosts from both the own index and the
  search-API results; a note says a missing signal means no preference, treated as allowed if robots allows the
  agent. Step 3: the flags point at two red boxes: cached answers are evicted within 1 hour of the flag flip, and spans
  and pages are purged within 48 hours of the publisher's change. Notes say flags for 50 million hosts refresh within
  24 hours and the top 10,000 news hosts hourly, a flip removes the host from retrieval in minutes, and syndicated
  copies inherit the original's flags.
caption: >-
  Robots, Content Signals, RSL licences and snippet rules become one set of per-host flags, checked where pages are
  crawled, where spans are retrieved and in the answer cache.
tags: [genai, rag, safety, publishers, case-study]
