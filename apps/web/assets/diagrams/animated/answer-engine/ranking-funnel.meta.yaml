title: Ranking spans in stages
alt: >-
  A funnel of five boxes narrowing from top to bottom, built in three steps. Step 1: a violet box, retrieved, 600
  spans, from 3 rewrites times 100 lexical and 100 vector results across 100 shards in 80 milliseconds; then a blue
  box, unique, 400 spans, after reciprocal rank fusion merges the three lists. Step 2: a lime prefilter box keeps 300
  spans after removing stale pages, spam, syndicated copies and hosts whose flags forbid answering; a lime cheap
  scorer of gradient-boosted trees keeps 60 in 30 milliseconds. Step 3: a lime cross-encoder keeps 12, reading 13,800
  tokens in 80 milliseconds, with at most 3 spans a domain and 2 a page. Footer lines say the model reads 2,700 tokens
  instead of 16,000 for 8 whole pages, and that a cross-encoder on all 300 spans would take 400 milliseconds, 320 more.
caption: >-
  Cheap scorers cut 600 spans to 60 in about 110 ms; the expensive cross-encoder only ever sees 60, and 12 reach the
  model.
