title: One quick answer, request to done
alt: >-
  A sequence diagram with six lanes: an orange user, a neutral gateway, a neutral orchestrator, violet retrieval, a
  green answer model and teal checks, built in four steps. Step 1: the user asks whether HTTP/3 is faster on mobile;
  the gateway screens it and misses the cache; the orchestrator sends 3 hybrid queries, planned by 280 milliseconds,
  and retrieval returns 12 ranked spans after narrowing 600 to 12; sources reach the user at 470 milliseconds. Step 2:
  the orchestrator sends a 4,105-token prompt; sentence 1 arrives at 1,293 milliseconds citing sources 1 and 2; the
  checks pass support, harm and copying, with a 9-word verbatim run against limits of 25 and 50 words; the first
  verified sentence reaches the user at 1,353 milliseconds. Step 3: sentence 4, always twice as fast, fails support and
  no other span supports it, so it is dropped and never shown, and the model restarts after sentence 3 with the claim
  excluded, its next token about 300 milliseconds later from the cached prompt. Step 4: the answer finishes with 11
  sentences shown and 1 dropped in about 5.1 seconds, and is cached for 24 hours unless a cited span changes.
caption: >-
  Sources arrive before any sentence, and each sentence is shown only after its checks pass; a dropped sentence
  restarts generation instead of being retracted.
tags: [genai, rag, citations, streaming, case-study]
