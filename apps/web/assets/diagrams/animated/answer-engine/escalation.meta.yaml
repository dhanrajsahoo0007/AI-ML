title: When to escalate, and what it costs
alt: >-
  A layout in three columns, built in three steps: orange signals on the left, routes in the middle and research tiers
  on the right. Step 1: a signal of one fact with strong span agreement leads to the green quick route, 80 percent of
  questions, 0.0063 US dollars and 1.35 seconds to the first verified sentence; a signal of dependent hops, such as
  the CEO of the company that bought X, leads to the green multi-hop route, 5 percent, 0.026 US dollars and 5.4
  seconds. Step 2: a confident planner label of at least 3 parts, at least 3 entities or a report leads to the research
  lead, 1.4 percent of questions at 0.45 US dollars on average, which picks one of three tiers: S, a comparison with
  2 subagents of 5 calls, 0.20 US dollars, 46 seconds and 10 searches; M, multi-part with 4 subagents of 8 calls, 0.56
  US dollars, 71 seconds and 32 searches; and L, a report with 6 subagents of 10 calls, 1.04 US dollars, 101 seconds
  and 60 searches. Step 3: a dashed arrow from a low-confidence end, or the research button, offers research within
  quota. Footer lines give the caps per tier, 150 thousand tokens and 0.5 US dollars, 600 thousand and 1 US dollar,
  1.2 million and 2 US dollars, as backstops, say every route uses the same ranker and sentence checks, and that at
  doubled model prices the M tier hits its 1 US dollar cap.
caption: >-
  Most questions take one pass; dependent hops take two rounds, and only about 1.4% of questions pay for research,
  whose tier is set by the planner's label and bounded by token and dollar caps.
