title: AI answer engine architecture, built step by step
alt: >-
  An architecture diagram in six zones, built up in eight steps. Step 1: the user, in orange, asks through the API
  gateway; the gateway passes the question to the orchestrator, the dark accented node, which sends one search to the
  teal search APIs and a prompt to the green answer model, and streams the answer back. Step 2: a lime query planner
  under the orchestrator writes 3 rewrites and picks a route, while the gateway looks up the violet answer cache along
  the bottom of the diagram, where a hit returns the whole answer in about 50 milliseconds. Step 3: a teal fetcher and
  parser reads the top 3 pages within 500 milliseconds and keeps them as spans in the page store. Step 4: a lime
  ranker narrows 400 spans to 60 and a lime cross-encoder narrows 60 to 12. Step 5: a lime sentence-checks node tests
  every sentence for support, copying and harm before it is shown. Step 6: a green research lead sends tasks to
  read-only subagents that search and fetch. Step 7: in the offline zone, a blue crawler and scheduler keeps raw HTML
  in the page store and feeds a blue indexer, which writes spans to the violet span index of 20 billion spans; the
  span index sends 600 spans to the ranker. Step 8: violet host flags send robots and signals rules to the crawler and
  are replicated to the span index, a lime safety screen above the orchestrator screens the query and the spans, the
  orchestrator traces every answer into the answer traces store, and a lime evaluation node grades 1 percent of them.
caption: >-
  The own index serves the common path and a search API joins only on flagged questions; every sentence is checked
  before it is shown, and publisher rules are enforced where spans are retrieved.
