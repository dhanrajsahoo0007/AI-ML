title: AI answer engine architecture, built step by step
alt: >-
  An architecture diagram built in eight steps, with dotted zones for clients, edge, the core request path, application
  services, storage, an async pipeline and the web. A user talks to an API gateway, which passes the question to a
  solid green orchestrator. In step 1 the orchestrator sends one search through a search fan-out service to a search
  API that returns 10 links each, and an LLM writes an answer from the snippets. Step 2 adds a query planner above the
  orchestrator that turns the question into 3 searches. Step 3 adds a fetcher that downloads the top 8 web pages and
  parses them, with a page cache that answers 60 percent of fetches. Step 4 adds a reranker below the fetcher that
  turns 80 passages into the top 10 and hands them to the orchestrator. Step 5 makes the LLM stream its answer back to
  the gateway with numbered citations. Step 6 adds an answer cache below the orchestrator whose time to live depends
  on the topic. Step 7 puts a safety service between the gateway and the orchestrator, so the query, the passages and
  the streamed answer are screened. Step 8 adds an evaluation service that receives every query from the gateway as a
  dashed line.
caption: >-
  The orchestrator plans several searches, reads and ranks the pages, and streams an answer whose every sentence
  points at a numbered source.
