title: The answer engine's release gate
alt: >-
  A gate diagram in one step. A grey release-candidate box, a new answer model, has arrows to seven checks in a column,
  each with an arrow to a red Block box on the right. Six checks are lime and pass: correctness on the 1,000-question
  gold set at 88.9 percent, plus or minus 2.0 points and not lower than the current model; citation recall of at least
  95 percent, measured at 96.1 percent by an independent grader; 0 of 1,000 injection attacks followed; 3 of 3
  copyright tests behaving as specified; freshness of at least 85 percent, measured at 87.3 percent on 400 questions;
  and p95 per path on a live canary, 1,980 and 2,910 milliseconds. One check is red and fails: citation precision of
  at least 90 percent, measured at 88.0 percent. The result is Block, with the note fix citation precision.
caption: >-
  One failing check blocks the release: citation precision is graded by an independent model, never by the checks
  that filter sentences.
