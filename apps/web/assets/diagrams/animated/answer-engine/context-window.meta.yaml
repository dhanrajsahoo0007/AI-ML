title: The context of one quick answer
alt: >-
  A single stacked bar of 4,105 tokens, built in two steps. Step 1: the first two blocks, in grey, are the stable
  prefix of 1,200 tokens under a bracket marked cached: instructions and citation rules 800 and the output format with
  examples 400. Step 2: the changing blocks follow under a bracket of 2,905 tokens: an orange thread summary of 105
  tokens on average, an orange question with planner notes 100, blue span headers 300 and a wide blue block of 12
  ranked spans, 2,400 tokens. Footer lines say the call reads 4,105 tokens and writes 300 in 12 sentences; spans cost
  2,700 tokens where 8 whole pages would cost 16,000; on the mid-size model the call costs about 0.0104 US dollars
  with the whole prompt written to the cache, and a restart about 0.0007; spans are ordered strongest first and last.
caption: >-
  Twelve ranked spans fill most of the window; the 1,200-token prefix is cached, and the whole prompt is written to
  the cache so a restart after a dropped sentence is cheap.
tags: [genai, rag, context-engineering, prompt-caching, case-study]
