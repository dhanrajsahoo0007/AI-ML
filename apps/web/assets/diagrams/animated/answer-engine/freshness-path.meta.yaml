title: From a published story to a fresh answer
alt: >-
  A layout in three steps. Step 1: five boxes in a row joined by arrows: a blue box, story published at time zero; a
  grey box, the next poll, every 5 minutes, so 0 to 5 minutes later; a teal box, fetch, parse and embed into spans and
  vectors; a violet box, the fresh segment, about 1 minute after the poll; and a lime box, retrievable, 3.5 minutes at
  the median. A note says 200,000 fast sources are polled every 5 minutes, so a story waits 2.5 minutes on average
  plus 1 minute of processing, 3.5 minutes at the median and 6 at worst, against targets of 5 and 15 minutes. Step 2:
  three violet answer-cache time-to-live boxes: news 5 minutes, recent 6 hours, evergreen 24 hours; a cached news
  answer lags a story by at most 11 minutes. Step 3: three trigger boxes point at a violet answer cache box that evicts
  every answer that cites or names them: a blue box, a cited span changes, detected by a content hash per span; a blue
  box, news tags an entity the answer names; and a red box, a cited host opts out, evicted within 1 hour.
caption: >-
  A polled story is retrievable in about 3.5 minutes; cached answers expire by freshness class and are evicted early
  when a cited span, a named entity or a host's rules change.
tags: [genai, rag, freshness, caching, case-study]
