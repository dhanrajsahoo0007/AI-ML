title: Own index or search API, priced
alt: >-
  A line chart of cost a day in US dollars, from 100,000 to 500,000, against the search-API price from 0 to 10 US
  dollars per 1,000 calls, built in four steps. Step 1: four straight lines: API only with 3 calls an answer, solid
  teal and steepest; with 2 calls, dashed teal; with 1 call, dashed blue; and the own index with an API call on 25
  percent of quick answers, solid violet and nearly flat, starting near 222,000 a day. Step 2: dotted drops mark where
  each API-only line crosses the own-index line: 2.6 US dollars for 3 calls, 4.0 for 2 calls and 8.1 for 1 call.
  Step 3: at 1 US dollar per 1,000 calls, the 3-call design costs 180,700 a day and the own index 226,200. Step 4: at
  the 5 US dollar list price, the 3-call design costs 308,700, the own index 241,700 and the 1-call design 213,700. A
  footer gives the fixed costs: 222,300 a day for ours including 75,800 for the index, 148,700 for API only.
caption: >-
  On cost alone the index wins only above 2.6 to 8.1 USD per 1,000 calls, depending on how many calls the API-only
  design would send; below that it is bought for latency, control and supplier risk.
tags: [genai, search, cost, build-vs-buy, case-study]
