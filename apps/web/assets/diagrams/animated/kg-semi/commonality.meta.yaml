title: From candidates to a replicated effect
alt: >-
  A layout in four bands, built in four steps; the investigation is invented. Step 1, a step chart of chamber B's
  edge-ring signature rate at step 412 by process day, for a time-matched cohort of 80 lots and 2,000 wafers: a red
  line sits at 4.0% (interval 2.2 to 7.2%) from day −10 to day 0, jumps at a dashed day-0 marker for work order
  WO-55120 (edge ring, new part revision) and stays at 80% (interval 74.6 to 84.5%) to day 10, while a dashed lime line
  shows sister chambers A, C and D flat at 4%. Step 2: three lime boxes in order: within-lot candidates, 5,360 of them
  (chamber at a step or any step, recipe body, maintenance windows) at α 0.04, then 1,680 lot-level candidates (tool
  at a step, batch-tool runs, material lots, test side, reticles) on the residual wafers at α 0.01, then the top 3 pre-registered for held-out lots; a line
  says 10,000 within-lot permutations with max-T keep the family-wise error at or below 0.05 under any dependence, and
  that without it 268 plus 84, 352, of the 7,040 candidates would pass p < 0.05 by chance. Step 3: WET07, a batch wet bench at step
  414: a red box shows that tested alone by lot it ran 28 of 40 bad lots against 12 of 40 and would be flagged because
  it shares the bad lots, not the cause; an arrow labelled "ordered" leads to a lime box: on the residual non-B wafers
  its lots show 4.0%, 33 of 825, against 4.0%, 37 of 925, so it is checked and not supported. Step 4, replicated on 50 held-out lots
  that did not select it, with lot-cluster-adjusted intervals on a 0 to 100% axis: chamber B, 125 wafers, 80% with an
  interval of 70 to 87% in red, and the sister chambers in the same 20 ETCH04 lots, 375 wafers, 4.0% with 1.8 to 8.8% in
  lime. Footers: a risk difference of 76 points, 20 of 20 lots show it, it passes at 0.05 divided by 3, and no p-value
  is shown to the engineer; checked and not supported: WET07, resist lot PR-552 (non-B wafers 4.0% against 4.0%) and
  the probe card (22% of signature wafers against 20% of wafers tested, 0 of 30 recovered on retest).
caption: >-
  The chamber's effect survives every control: within the same lots, the same days and on held-out lots. The wet bench
  that shared its lots does not survive the residual test.
