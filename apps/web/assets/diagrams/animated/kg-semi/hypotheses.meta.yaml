title: Ranked hypotheses, evidence and the verdict
alt: >-
  A layout built in three steps; the investigation is invented. Step 1, a table rendered by code before any model text,
  with no p-value: rank 1 is the highlighted red hypothesis "ETCH04 path B to strip 2, step 412" (an inseparable
  cluster), with a held-out effect of 80% (lot-cluster interval 70 to 87%) against 4.0% (1.8 to 8.8%), 20 of 20 lots,
  a change-point at day 0 with work order WO-55120, and confidence high. A lime row lists what was checked and not
  supported: WET07 (residual 4.0% against 4.0%), resist lot PR-552 (4.0% against 4.0%) and the probe card (22% against
  20%, 0 of 30 recovered on retest); a grey row says the slurry lot is not testable, known for 58% of wafers against an
  80% floor, and is never shown as ruled out. A note says the explanation cannot add, drop or re-rank a row and every
  number it quotes must be in the evidence. Step 2, five evidence boxes behind rank 1, each an id the explanation
  cites: the mechanism path from FMEA row 3311, approved; a sensor shift, DC bias 6.1% higher after the swap; the
  post-PM monitor, which did not measure the edge; past case EXC-2025-031; and, highlighted in orange, the WIP at risk,
  about 10,700 wafer passes through the chamber in the last 29 days, not yet sorted. Step 3: lime confirmation checks
  (the part record, inline edge CD, a split lot) lead to a highlighted orange box for the 8D owner's verdict with
  evidence ids and ranking_seen, which leads to a violet ExcursionCase used for past-case search and the replay set; a
  note says the verdict is confirmed, rejected or inconclusive, and the engineer inhibits in MES while the assistant
  never acts.
caption: >-
  The table says what the evidence supports, with intervals, and what was ruled out; the engineer confirms with
  physical checks and acts in MES, and the verdict becomes a labelled case.
