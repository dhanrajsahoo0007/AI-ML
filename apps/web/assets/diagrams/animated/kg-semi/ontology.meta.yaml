title: The fab ontology for yield root-cause analysis
alt: >-
  Seventeen boxes joined by labelled arrows, built in three steps. Step 1, execution and equipment in violet: a
  highlighted Run (lot, step and tool, with track-in and track-out times) sits in the middle; it points IN_LOT to a Lot
  (split, merge, rework), AT_STEP up to a StepDef that a versioned Product and route reaches through HAS_STEP, ON_TOOL
  to a Tool, and VISITED to a Chamber, an E120 module qualified for about 8 steps, which the tool reaches through
  HAS_CHAMBER; a Wafer with its scribe id and re-ID aliases points IN_LOT to the lot. Step 2: the run also points
  USED_RECIPE_BODY to a Recipe body as downloaded, with its hash, and USED_MATERIAL to a Material lot; the chamber has
  a Part install (revision, part lot) through HAS_PART; Equipment events (E10 state, PM, hold, SPC) point ON the
  chamber; the wafer HAS_SORT a Sort insertion (bins, signature, retest), PROBED_BY a probe card and tester with its
  test program version, and the sort insertion SHOWS a wafer-map Signature. Step 3, approved knowledge in blue: a
  highlighted Failure mechanism, carrying its FMEA row, approver and date, PRODUCES the signature and is TRIGGERED_BY
  equipment events; an Excursion case with its confirmed cause from the 8D report SHOWED the signature; a grey FDC trace
  box is only a reference, matched by context to a wafer and run. Footers: every event and edge carries valid_from,
  valid_to, recorded_at and superseded_at, and a correction is a new version; about 62.7 million nodes, 237.6 million
  edges and 41.1 gigabytes; samples stay in the FDC store, 1.77 × 10¹¹ a day, about 744 times the graph's edges, and
  wafer-to-chamber visits are columnar rows.
caption: >-
  The run is the hub: it ties a lot to a step, a tool, the chambers it visited and the recipe body as downloaded;
  approved knowledge links a signature back to the events that can cause it.
