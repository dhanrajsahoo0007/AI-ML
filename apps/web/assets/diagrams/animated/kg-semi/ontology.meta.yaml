title: A fab ontology for yield root-cause analysis
alt: >-
  Ten boxes joined by labelled arrows. Along the middle row, a violet Lot is PROCESSED_AT a Process step, with a
  timestamp, and the step runs ON_TOOL a Tool or chamber. The step USES_RECIPE a Recipe above it, with the recipe
  version, and USES_MATERIAL a Material batch below it. The tool HAD_EVENT a Maintenance or alarm event above it, with
  a timestamp. Below the lot, the lot CONTAINS Wafers; each wafer HAS_RESULT a Test or yield result and HAS_DEFECT a
  Defect type with a map signature. The defect type has a KNOWN_CAUSE, the highlighted blue Failure mechanism taken
  from FMEA tables and reports, which is ASSOCIATED_WITH the tool, closing the loop.
caption: >-
  A lot's journey runs along the middle row; the failure mechanism, extracted from documents, links a defect back to
  a tool.
