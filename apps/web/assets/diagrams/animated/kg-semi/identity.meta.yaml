title: One chamber, one node
alt: >-
  A layout built in three steps; the names are invented. Step 1: five teal boxes show one etch chamber as five names in
  five systems: ETCH04-B in MES, E04_PM2 in FDC, AST-118832 as a CMMS asset, ETCH04 CH-B in RMS and PM2 as an E90
  module. Step 2: each name runs into a highlighted blue identity map owned by equipment engineering, which resolves
  them to one violet Chamber ETCH04-B node with one master id; an unresolved name goes down a dashed arrow to a grey box
  that holds it for 10 minutes and then quarantines it, so early or unmapped events never enter the graph; a note says
  coverage is checked daily, with 100% of chambers mapped and FDC context matching at least 99.5%. Step 3, in red:
  without the FDC and CMMS mappings the chamber becomes two nodes; ETCH04-B keeps the counts, 80% against 4.0%, so the
  effect size stays, while E04_PM2 gets work order WO-55120 and the traces, so there is no change-point and no 6.1% DC
  bias shift on ETCH04-B; both feed a highlighted red result: confidence drops from high to medium because the timing
  and sensor features vanish from the hypothesis.
caption: >-
  A missing mapping does not make the hypothesis vanish; it quietly strips its timing and sensor evidence, so the
  confidence drops a bin and nobody sees why.
