title: The writer's context window
alt: >-
  A stacked bar of the investigation writer's 6,400-token prompt, built in three steps. Step 1: a grey stable prefix of
  1,300 tokens, instructions 1,000 and the output format with one example 300, bracketed as cached on the server.
  Step 2: the changing blocks, 5,100 tokens chosen by code: an orange scope of 150 (question, lots, cohort rule, metric,
  watermarks), blue populations and coverage 200, three hypotheses 2,700, the "checked and not supported" list 250, six
  passages from FMEA rows and 8D reports 1,500 and evidence headers 300. Footer lines: 6,400 tokens in; out, 80 hidden
  reasoning tokens at low effort plus 540 visible, three hypotheses of 130 and a 150-token summary; every number the
  writer may quote is in an evidence block, and report and FMEA text is quoted data, never instructions. Step 3, on one
  scale where 32,000 tokens is the full width: this call's 6,400 in blue, the whole schema of 13,800 and one lot's raw
  history of 32,000, five times this call, in grey; neither is sent, and generated queries get a 2,500-token schema
  subset.
caption: >-
  Code chooses the evidence, so the writer reads 6,400 tokens instead of a lot's 32,000-token history; the 1,300 stable
  tokens stay in the server's prefix cache.
