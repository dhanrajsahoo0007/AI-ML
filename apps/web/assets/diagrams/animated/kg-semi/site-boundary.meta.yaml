title: The site boundary and on-site models
alt: >-
  A layout of four dotted groups, built in four steps. Step 1: a teal fab network group holds MES with E90 and E10
  events, FDC and SPC, CMMS and RMS, YMS and the test floor, and documents (FMEA, 8D, SOPs); all of them join one line
  into a blue ingest log with identity resolution, read through the bus and exports, inside a violet site data centre
  with no internet route; a note says the fab network is read only and nothing is written back. The data centre also
  holds a grey gateway (fab SSO, scope roles) and orchestrator, and violet and teal stores: the graph and columnar
  store with scoped roles and replicas, the trace read API with FDC samples by reference, the document index filtered
  by scope, and verdicts and audit, where prompts and reasoning are kept. Step 2: a highlighted green on-site model on
  two hosts, open weights at low effort, connected to the orchestrator. Step 3: an intake group under the data centre
  holds a blue box for weights, images and libraries, hash-checked, scanned and approved, with an arrow up to the
  model, and a lime box for SEMI E187 (2022), the fab's precedent. Step 4: a red internet group holds a hosted model
  API, the rejected option, joined to the audit store only by a dashed line labelled no route; a note says no prompts,
  reasoning, embeddings, traces or logs leave the site. Footers: on site, 4 GPUs for 24 hours at 2.5 USD is 240 USD a
  day; hosted like for like is 12.5 USD of tokens plus 120 for two encoder GPUs, 132.5; the GPU premium is about 107.5
  USD a day, 1.1%, and the people to run models on site about 411 more (half an ML engineer, illustrative), about 5%
  of about 9,950 in all; who may see process technology, and where it is processed, is the fab's legal question.
caption: >-
  Fab data comes in, weights come in through intake, and nothing goes out; the GPUs cost about 107.5 USD a day more
  than a hosted API (1.1%), and the people to run them about 411 more, about 5% of the system in all.
