title: One guard chain for both stores
alt: >-
  A layout built in four steps. Step 1: an orange question goes to a lime template box (40 templates, the encoder fills
  80% of slots) for 70% of lookups and to a green generated-query box built from a 2,500-token schema subset for 30%.
  Step 2: both feed a highlighted lime box that links every literal to a master id; a dashed arrow leads to a red box:
  an invented name "ETCH4-B" is stopped with "did you mean ETCH04-B?" and never returns "no rows". Step 3: the linked
  query runs through three lime checks left to right: parse and allow-list (Cypher clauses, or one SELECT), schema and
  value check (labels, types, enums), and bounds with EXPLAIN (at most 4 hops, LIMIT 1,000); a grey box lists what is
  blocked (writes, LOAD CSV, apoc.cypher, apoc.load and dbms procedures) and says a failed check gets one repair with
  the error, then every check again. Step 4: a violet read-only run on a replica with a 5-second and 512-megabyte cap
  feeds a teal table rendered by code with the query and a paraphrase; a wide red box shows the valid but wrong query
  that joins Run to Chamber through ON_TOOL instead of VISITED and returns every chamber of the tool, caught by
  templates first, the query shown and the query-set gate. Footers: the columnar store runs readonly with row policies
  and at most 200 million rows read, at most 100,000 ids cross stores, the EXPLAIN limit of 1 million rows is a
  heuristic; the gates are templates at least 95% on 300, generated at least 80% on 150, 50 misspelled names never
  "no rows" and 0 of 300 bypass attempts executed.
caption: >-
  The guards stop what a query can do (write, scan, leak); only templates, linked names and the query set stop what it
  can get wrong while running fine.
