title: One investigation, end to end
alt: >-
  A sequence diagram with seven lanes, Engineer in orange, Gateway and Orchestrator in grey, Model in green, Columnar
  and Graph in violet and Trace API in teal, built in six steps for the invented question "Why did yield drop on lots
  PX7-1022 to PX7-1031?", typed, at p50. Step 1: the gateway maps the engineer's groups to the yield-eng, etch and PX7
  roles and writes an audit record in 50 milliseconds; the model plans with 80 reasoning tokens and a 60-token plan,
  returning an investigation of 10 lots at 1,750 milliseconds; the graph resolves 2 child lots and 250 wafers; the plan
  with watermarks reaches the engineer at 1,850 milliseconds. Step 2: the columnar store returns a time-matched cohort of
  80 lots and 2,000 wafers from process days 0 to 10 by 2,350 milliseconds; a note says the test side is checked first:
  the largest probe card has 22% of signature wafers against 20% of wafers tested. Step 3: 5,360 within-lot and 440
  lot-level candidates are tested with 10,000 within-lot permutations and max-T, done by 3,350 milliseconds; a gap event
  says the slurry lot is known for 58% of wafers, below the 80% floor. Step 4: in parallel, the graph returns work order
  WO-55120 on day 0, resist lot PR-552, the WET07 bath change and FMEA row 3311, and the trace API returns a DC bias 6.1%
  higher after the swap; the slowest of the six parallel draws takes about 2,745 milliseconds. Step 5: only the top 3
  are confirmed on 50 held-out lots: chamber B 80% with a lot-cluster-adjusted interval of 70 to 87% against 4.0%, 1.8
  to 8.8%, on its sister chambers; WET07's residual wafers show 4.0% against 4.0%; the ranked table with effect sizes and
  no p-value reaches the engineer at 7,075 milliseconds. Step 6: the model gets a 6,400-token evidence context; the first
  hypothesis text arrives at 9,795 milliseconds, every number is checked, the explanation is complete at 13,895
  milliseconds, and the engineer decides in MES.
caption: >-
  The ranked table, with effect sizes and lot-cluster intervals, reaches the engineer at 7.1 s, before the model writes
  a word; the model only plans and explains.
