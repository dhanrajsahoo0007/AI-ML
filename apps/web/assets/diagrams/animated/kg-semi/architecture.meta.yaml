title: Yield root-cause assistant on a fab knowledge graph, built in eight steps
alt: >-
  An architecture diagram in six zones, built in eight steps, every zone inside the fab's site. Step 1: an orange
  engineer app talks to a grey gateway (SSO, scope, audit), which passes the question to the dark orchestrator, the one
  accent; the orchestrator calls a green on-site model on two hosts down the left gutter. Step 2: teal fab systems
  (MES, FDC, YMS and others) send events in order along one line into a blue ingest and identity stage (one log,
  quarantine), which writes the violet knowledge graph of 62.7 million nodes with as-of history; the orchestrator's
  free queries to the graph are shown dashed. Step 3: a lime query guard (linker, caps) replaces the free queries; its
  read-only reads run over the top of the diagram and into the right sides of the knowledge graph and a new violet
  columnar store of 1.92 billion wafer-steps, which the ingest log also writes; green encoders join the models.
  Step 4: a lime statistics engine reads cohort counts from the columnar store and asks a teal trace read API, which
  reads samples by reference from the existing FDC trace store. Step 5: a lime evidence and ranker card reads through
  the guard's templates, and a lime checks card verifies numbers and wording. Step 6: blue document extraction writes
  approved edges to the graph and chunks to a violet document index, from which the evidence card reads passages.
  Step 7: verdicts, ranking_seen and audit records run along the bottom of the diagram into a violet verdicts and
  audit store. Step 8: a lime replay and release gate reads the confirmed cases from it.
caption: >-
  The graph holds relations, the columnar store counts wafers, the samples stay where FDC keeps them; every read goes
  through one guard, and the model plans and explains while code tests and ranks.
