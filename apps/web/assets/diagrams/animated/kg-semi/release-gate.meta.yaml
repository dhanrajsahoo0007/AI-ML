title: The release gate
alt: >-
  A gate diagram with one step. A grey release candidate (a ranker, prompts and ontology version ont-3.2.0) fans out to
  nine checks, which feed a red Block box saying nothing ships. Eight checks are lime and pass: replay of 270 confirmed
  excursions with the true cause in the top 3 for 73% against a 70% target and top 1 for 48% against 45%;
  candidate-kind coverage 93% against 90%; beats the YMS commonality screen by 12 points on paired cases (McNemar);
  seeded faults 92% in the top 3 of 2,000; null replays with a "high" hypothesis on 3.2% of 1,000; the query set by
  route, 96.3% on templates, 82% generated and 0 misspelled names returning "no rows"; bypass and leakage, 0 of 300
  bypass attempts executed and 0 leaks in 200 prompts; calibration with the lower bound at least 50% and latency p95
  per request type. One check is red and fails: the time-confounded slice, 84% against 90% on 500 seeded faults that
  come with a benign change in the same window. Notes say this slice is the one that catches time confounding, that
  replays run on as-of state with knowledge approved before each case, and that the measured values are illustrative.
caption: >-
  The candidate passes the headline replay but fails the slice where a benign change shares the window, so it does not
  ship: time confounding is the failure this gate exists to catch.
