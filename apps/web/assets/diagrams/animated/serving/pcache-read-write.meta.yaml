title: Write, read, expire
alt: >-
  A sequence diagram with three lanes: Brightpost's support app in orange, the provider API in grey and the prompt
  cache in violet. Step 1: the app sends request 1 with a breakpoint after the policy; the provider looks up the
  1,200-token prefix, the cache answers miss, the provider writes the prefix at 1.25 times the price and answers,
  reporting 1,200 tokens written. Step 2: 0.4 seconds later request 2 has the same prefix; the cache answers hit and
  the lifetime restarts, and the answer reports 1,200 tokens read at 0.1 times the price. Step 3: after six quiet
  minutes the entry has expired; request 3 looks up the prefix, the cache answers miss because the entry expired, the provider
  writes the prefix again and answers.
caption: >-
  The first call pays a premium and every later call inside the lifetime gets a discount; a quiet gap longer than the
  lifetime makes the next call pay the premium again.
tags: [prompt-caching, ttl, serving, genai]
