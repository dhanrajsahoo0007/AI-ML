title: Prefill and decode on the H100 roofline
alt: >-
  A log-log roofline chart for the H100 SXM with dense BF16, achievable speed in TFLOPS against arithmetic intensity in
  FLOPs per byte. A violet line rises from 3.35 TFLOPS at an intensity of 1 to 989 TFLOPS at the ridge point of 295
  FLOPs per byte, then a teal line runs flat to the right. Step 1: a green point for decode at batch 1 sits at the far
  left, at about 1 FLOP per byte and 3.4 TFLOPS, which is 0.3 percent of peak. Step 2: a second green point for decode
  at batch 32 sits on the same rising line at about 32 FLOPs per byte and 106 TFLOPS, 10.8 percent of peak. Step 3: an
  orange point for prefill of a 2,200-token prompt sits right of the ridge at about 1,431 FLOPs per byte, on the flat
  roof at 989 TFLOPS. Three pastel cells on the right give each workload's intensity and speed. A footer says the
  matrix is 8,192 by 8,192 in 16-bit.
caption: >-
  Decode at batch 1 moves about 1 FLOP per byte and reaches 0.3 percent of the GPU's peak; batching 32 sequences moves
  it 32 times further right, and a 2,200-token prompt in prefill lands past the ridge.
tags: [gpu, roofline, prefill, decode, inference, genai]
