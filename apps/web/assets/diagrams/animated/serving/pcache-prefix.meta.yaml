title: A stable prefix is cached
alt: >-
  Three rows, one per step, each showing Brightpost's prompt as three blocks in order: instructions, 200 tokens; tools
  and refund policy, 1,000 tokens; and retrieved articles plus the question, 1,000 tokens. Step 1: the first request
  writes the first two blocks, 1,200 tokens, to the cache; they are violet and marked written, and the third block is
  orange and marked new. Step 2: 0.4 seconds later the same two violet blocks are marked read from cache and only the
  1,000 orange tokens are new. Step 3: a date added to the first line makes the instructions block red and marked
  edited, and the two blocks after it red and marked miss, so all 2,200 tokens are processed again. Block widths are
  not to scale.
caption: >-
  Matching runs from the first token and stops at the first difference, so the part that changes belongs at the end.
tags: [prompt-caching, prefix, serving, genai]
