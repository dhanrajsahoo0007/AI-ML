title: Grouping the KV cache by channel or by token
alt: >-
  A layout figure in two panels, each a grid of 8 tokens by 8 channels drawn in blue, where darker cells are larger
  numbers. The left panel is the key cache: two columns, channels 3 and 6, are far stronger in colour than the rest in every
  token. Red scale cells beside each row show grouping by token, where a big channel sets every row's range so the small
  channels get only a few levels. Green scale cells under each column show grouping by channel, which the KIVI paper
  uses for keys, so a big channel stretches only its own scale. The right panel is the value cache, a grid with no
  dark channel. Green scale cells beside each row show grouping by token, which KIVI uses for values, so an error stays
  inside its token. The magnitudes are shape only.
caption: >-
  Keys have a few huge channels, so each channel gets its own scale; values have none, and the attention output is a
  weighted sum of a few tokens, so each token gets its own scale.
