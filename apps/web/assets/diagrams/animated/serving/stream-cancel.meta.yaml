title: Cancelling a stream when the customer leaves
alt: >-
  A sequence diagram with four lanes: the customer's browser in orange, an edge proxy and the LLM gateway in grey,
  and the inference engine in teal. Step 1: the proxy has delivered tokens 1 to 50, and the browser closes the
  connection at 620 milliseconds; a note on the engine says 200 of the 250 tokens are still to go. Step 2: the proxy
  closes its upstream connection to the gateway, and the gateway sends an abort for the request id to the engine.
  Step 3: the engine frees the request's KV-cache blocks 880 milliseconds before the answer would have finished, and
  replies to the gateway that the request was aborted after 50 tokens.
caption: >-
  A closed tab only helps if the close reaches the engine. Passed on hop by hop, it frees the slot 880 ms early;
  dropped at any hop, the GPU writes 200 tokens for nobody (cancel time illustrative).
