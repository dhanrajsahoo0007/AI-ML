title: What the gateway adds to one request
alt: >-
  Two timing charts of one Brightpost support request that misses the cache, with illustrative times. The top chart
  shows the whole request on one millisecond axis: key and limits checks, 3 ms, in grey; a cache lookup, 3 ms, a miss,
  in violet; an input guardrail, 20 ms, in lime; the provider call, 1,500 ms, in green, with a marker for the first
  token at 426 ms; an output guardrail on the last chunk, 10 ms, in lime; and a blue log line of 5 ms written after
  the reply. A marker shows the reply done at 1,536 ms; the title says the gateway adds 36 ms of 1,536, 2.3 percent.
  The bottom chart zooms into the first 26 ms: 3 ms for the key and limits, 3 ms for the cache lookup and 20 ms for
  the input guardrail, which is ringed, before the request is sent to the provider at 26 ms; the title says that is 26
  ms of a 426 ms first token, 6 percent.
caption: >-
  Against the full answer the gateway is a sliver; against the first token it is 6 %, and most of it is the guardrail,
  not the routing.
