title: The cost levers on one Brightpost task, cheapest change first
alt: >-
  A ladder of six cost levers in six steps, each with a to-scale bar of what the Brightpost refund task costs after
  that lever, using illustrative prices. Orange segments are input tokens and green segments are output tokens. A
  starting bar of three large-model calls costs $0.0207. Step 1, shorter prompts, keeps 3 chunks instead of 5, so input
  falls from 2,200 to 1,400 tokens, and the task costs $0.0159, saving 23 %. Step 2, prompt caching, writes the prefix
  once at 1.25 times the input price and reads it twice at 0.1 times, for $0.0116, saving 44 %. Step 3, a smaller model
  for the easy lookup steps, costs $0.0062, saving 70 %. Step 4, batching, has an outlined box and no bar: it does not
  apply to a live task, but the nightly summaries fall from $1,180 to $590. Step 5, quantisation, also has an outlined
  box and no bar: it applies only to a model you host, and an 8-billion-parameter model's weights fall from 16 GB to
  4 GB at 4 bits. Step 6, fine-tune or distil, shows a very short bar of $0.0014, 93 % lower at best, if a tuned small
  model passes the 200-ticket golden set.
caption: >-
  The first three levers need no training and no new hardware, and together take the refund task from $0.0207 to
  $0.0062 (illustrative). Batching and quantisation are real savings, but not for this live task; fine-tuning is the
  ceiling, and it only counts if the evals pass.
tags: [serving, cost, caching, routing, batching, quantization, distillation, genai]
