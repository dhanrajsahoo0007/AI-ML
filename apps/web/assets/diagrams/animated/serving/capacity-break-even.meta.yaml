title: "API bill against a fixed GPU bill"
alt: >-
  A line chart with requests a day, in thousands, from 0 to 220 along the bottom and the monthly bill in dollars from 0
  to 45,000 up the side. Step 1: a straight green line for a mid-size API model rises steeply from zero, and a teal
  staircase for a self-hosted fleet starts at 4,320 dollars for 2 replicas, then steps to 6,480 dollars for 3 replicas
  at about 118,000 requests a day. Step 2: a highlighted point marks the break-even where the green line crosses the
  first teal step, at about 20,870 requests a day, roughly a tenth of Brightpost's 200,000. Step 3: a dashed green line for
  an API model a tenth of the price stays below the teal staircase everywhere, so it never crosses; at 200,000 requests
  a day the three bills are marked: 41,400 dollars for the mid-size API, 6,480 dollars for the fleet and 4,140 dollars
  for the small model API. A panel on the right shows the working. All prices and the GPU hour rate are illustrative.
caption: >-
  Against a model of the same quality as the one you would host, the fleet wins above the break-even volume. Against a
  much cheaper model it may never win at this size. Prices are illustrative.
tags: [capacity-planning, break-even, cost, self-hosting, api, brightpost]
