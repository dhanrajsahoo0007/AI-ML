title: Weight memory at 16, 8 and 4 bits
alt: >-
  Six horizontal bars on a shared scale from 0 to 150 gigabytes, each with a vertical line at the 80 GB limit of one
  GPU. Step 1, left column, a 7 billion parameter model: green bars of 14, 7 and 3.5 GB at 16, 8 and 4 bits, all well
  inside the limit. Step 2, right column, a 70 billion parameter model: at 16 bits the bar is 140 GB, running past
  the limit with a red cell marked plus 60; at 8 bits it is 70 GB, just inside the limit; at 4 bits it is 35 GB, under
  half of it. Step 3 adds a lime note under each bar for the time to read all the weights once at an illustrative 3
  terabytes per second: 4.7, 2.3 and 1.2 milliseconds for the 7 B model and 46.7, 23.3 and 11.7 milliseconds for the
  70 B model. A formula note says gigabytes equal parameters times bits divided by 8.
caption: >-
  Bytes are parameters times bits divided by 8, so halving the bits halves the memory and halves the read that every
  decode step has to make. Weights only: the KV cache needs room too.
