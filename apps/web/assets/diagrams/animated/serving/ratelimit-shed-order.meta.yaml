title: What to drop first under overload
alt: >-
  Four rows, added one per step, each with three boxes joined by arrows, and arrows down the left column between rows.
  Each row names what is dropped, what a customer sees, and what it frees. Row 1, grey: pause batch jobs; nobody
  notices because results arrive later; it frees the whole batch share. Row 2: skip optional retrieval, cutting five
  chunks to two; answers are slightly thinner; a request falls from 2,450 to 1,265 tokens, 48 percent less. Row 3:
  cap answers at 150 output tokens; replies are shorter; each saves 440 milliseconds of decode and a request is
  1,165 tokens. Row 4, with the customer box in red: refuse free-tier chat with a 429 and retry-after; free users wait
  and retry while paid customers are served. A blue note says that after rungs 2 and 3, 720 requests times 1,165
  tokens is 838,800 tokens a minute, down from 1,764,000.
caption: >-
  Shed the least visible work first and the paying customer last. Each rung says what it costs and what it frees.
  The policy is illustrative.
tags: [load-shedding, overload, rate-limiting, degradation, serving, genai]
