title: Speculative decoding draft-and-verify round
alt: >-
  A four-step example of one speculative decoding round. An orange line gives the customer's message about the cracked
  kettle from order 4471. Step 1: a pale green box, the small draft model, makes four quick passes and produces four
  gray draft tokens in a row, "Your", "refund", "is" and "on", each with its draft probability q (0.60, 0.50, 0.40 and
  0.55). Step 2: arrows run down from all four drafts into one wide green box, the large target model, which reads the
  prompt and all four drafts in a single forward pass. Below it sit five pale green boxes with the target's
  probability p for each draft (0.70, 0.45, 0.05 and 0.10) and a fifth next-token distribution used only if every
  draft passes. Step 3: lime boxes test the drafts from left to right. "Your" is kept because p is at least q.
  "refund" is kept because the random draw 0.31 is below p over q, 0.90. "is" is rejected in red because the draw
  0.62 is above p over q, 0.125. "on" is not tested, and the fifth slot is unused. Step 4: the answer row reads
  "Your refund needs", with the highlighted token "needs" resampled from the leftover distribution p minus q. Notes
  say two drafts kept plus one corrected token give three tokens from one large-model pass, where plain decoding gets
  one; that if all four drafts had passed the fifth distribution would add a bonus token for five; that the rule keeps
  the output exactly the large model's distribution; and that the probabilities and draws are illustrative.
caption: >-
  Two drafts pass, the third fails, and the large model's own token replaces it: three tokens from one pass of the
  large model, with the same output distribution as decoding with the large model alone.
tags: [speculative-decoding, inference, serving, genai]
