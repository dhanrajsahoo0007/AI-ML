title: "Average against peak: what each one sizes"
alt: >-
  Two orange horizontal bars drawn to the same scale. The short bar is the average, 2.3 requests a second, which is
  200,000 requests a day divided by 86,400 seconds. The long highlighted bar is the peak in a busy hour, 12 requests a
  second, about 5 times the average. In step 2 two boxes appear below: a green box saying the average sets the API bill,
  because you pay per token used, with the working 200,000 times 30 times 0.0069 dollars equals 41,400 dollars a month;
  and a teal box saying the peak sets the fleet, because replicas are paid for every hour, with the working 3 replicas
  times 720 hours times 3 dollars equals 6,480 dollars a month. Both prices are illustrative. In step 3 the rest of the
  long bar, beyond the average, is shaded teal: fleet capacity unused on average, 81 percent, because the fleet carries
  2.3 divided by 12, 19 percent, of the rate it is built for.
caption: >-
  The same traffic feeds two different bills. A pay-per-token API follows the average; a fleet is paid for at the
  size the peak needs, so most of its capacity is idle on average.
