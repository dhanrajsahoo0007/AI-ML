title: "The roofline of one GPU: H100 SXM, dense BF16"
alt: >-
  A log-log chart of achievable speed in TFLOPS, from 1 to 1,000, against arithmetic intensity in FLOPs per byte, from 1
  to 10,000. Step 1: a violet line labelled memory roof starts at 3.35 TFLOPS at an intensity of 1 and rises in a
  straight line, because speed equals 3.35 TB/s times intensity. Step 2: the line reaches 989 TFLOPS at 295 FLOPs per
  byte, marked and highlighted as the ridge point, and a flat teal line labelled compute roof continues to the right at
  989 TFLOPS. A side panel shows the working: 989 times 10 to the 12 divided by 3.35 times 10 to the 12 is 295 FLOPs per
  byte. Step 3: the left region is labelled memory-bound and the right region compute-bound, with notes that speed
  equals bandwidth times intensity on the left and 989 TFLOPS on the right, and that real kernels sit below the roof.
  A footer gives the GPU, H100 SXM with dense BF16, and the date, November 2026.
caption: >-
  Computed from NVIDIA's published peak compute and bandwidth for the H100 SXM (November 2026): a kernel can go no
  faster than the lower of the two lines, and the point where they meet is 295 FLOPs per byte.
