title: Batch against real time, in time and in cost
alt: >-
  A two-part chart. The top part is a time axis on a log scale from 0.1 seconds to 24 hours. An orange bar for real
  time, where a customer is waiting, ends at 1.5 seconds, with the first token at 0.4 seconds and 12 requests a second
  at peak. A blue bar for batch, where nobody is waiting, reaches 1 hour, labelled "most batches finish within 1
  hour", and a dashed blue line continues to 24 hours, where an unfinished batch expires. Two dashed lime lines mark
  the deadlines: the latency SLO at 1.5 seconds and the 24-hour batch window, 57,600 times apart. The bottom part
  compares the cost of one request of 2,200 input and 250 output tokens at illustrative prices of 2 and 10 US
  dollars per million tokens: 0.0069 dollars at list price in real time, and 0.00345 dollars through a batch API at
  50 percent off, as Anthropic and OpenAI document it as of November 2026.
caption: >-
  Batch trades a deadline in seconds for one in hours and pays half; the prices are illustrative, the 50 % discount
  is from the providers' docs (November 2026).
tags: [serving, batch, cost, genai]
