title: Two paths to one model, online and overnight
alt: >-
  An architecture diagram built in seven steps, in two rows. The top row, in an orange zone labelled "Online: a
  person waits", has the customer and the LLM gateway; the gateway sends the question to the inference engine at high
  priority, and the engine sits in a teal zone for Brightpost's GPUs, serving 12 requests a second at peak. In step 2
  the gateway logs every exchange to the conversation logs, 200,000 a day, in a blue zone labelled "Offline: nobody
  waits". In step 3, at 01:00, a nightly batch job reads yesterday's 200,000 rows. In step 4 it sends them to a
  provider batch API, drawn green, in 8 batches, at 50 percent off with results within 24 hours. In step 5 a dashed
  arrow shows the alternative: the same requests go to Brightpost's own inference engine at night, at low priority.
  In step 6 results from both come back and are written to a summaries table keyed by custom_id. In step 7 a dashed
  arrow carries requests that expired or failed from the batch API back to the batch job to be resubmitted.
caption: >-
  One model, two deadlines: the gateway keeps the customer's path at high priority, and the overnight job can use a
  provider's batch API or the GPUs the customers left idle.
