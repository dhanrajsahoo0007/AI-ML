title: Post-training quantisation against quantisation-aware training
alt: >-
  Two lanes of boxes. Step 1, post-training quantisation: a pale green box, the trained model with 16-bit weights,
  sends its weights to a teal box called the quantiser, which lists GPTQ, AWQ and SmoothQuant and is highlighted. A blue
  box above, calibration data of a few hundred real prompts, also feeds the quantiser. The quantiser produces a pale
  green box, the quantised model with 4- or 8-bit weights and scales. A note says there is no training run and that
  GPTQ quantised a 175 billion parameter model in about 4 GPU hours. Step 2, quantisation-aware training: the same
  shape lower down, with the model to adapt and a blue training data box feeding a teal training loop, highlighted,
  labelled forward rounds, backward updates, which produces the quantised model. A note says this is a real training
  run and that gradients pass straight through the rounding.
caption: >-
  Both lanes end with the same kind of model. PTQ spends a few GPU hours and some calibration prompts; QAT spends a
  training run, and in return the weights have learned to live on the coarse grid.
tags: [quantization, ptq, qat, inference, serving, genai]
