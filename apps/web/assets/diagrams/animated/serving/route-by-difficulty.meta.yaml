title: Brightpost's day with and without a router
alt: >-
  A flow in four steps. Step 1: an orange Requests block, 200,000 a day, points to a grey Router block labelled "easy
  or hard?". Two arrows leave the router: "70 % easy" to a green Small model block holding 140,000 requests, and "30 %
  hard" to a green Large model block holding 60,000 requests. Step 2: notes beside the models give the illustrative
  price of one request, $0.00069 on the small model and $0.0069 on the large one. Step 3: a group titled "Cost of one
  day, to scale" compares two bars. Everything on the large model costs $1,380 a day. With the router, a short small
  segment of $96.60 and a longer large segment of $414 add up to $510.60 a day, which saves $869.40 a day, 63 %, about
  $26,082 over 30 days. Step 4: a red dashed arrow from the router leads to a red block saying the router misses 10 %
  of hard questions, so 6,000 a day go to the small model, with a note that nothing downstream notices.
caption: >-
  With illustrative prices, sending the easy 70 % of Brightpost's questions to a model a tenth the price cuts the day's
  bill from $1,380 to $510.60. The saving only holds while the router sends the hard questions to the large model.
tags: [serving, routing, cost, model-selection, genai]
