title: From container started to traffic
alt: >-
  A timeline in seconds, from 0 to 80, built in four steps, with five lanes for one new inference replica whose image is
  already on the node. Step 1: the engine lane shows a blue 16-second weights download, a teal 8-second load into GPU
  memory and a highlighted teal 35-second warm-up, so the engine can answer at 59 seconds. Step 2: a lime startup-probe
  bar runs from 0 to 60 seconds, failing until the engine answers, checked every 10 seconds with a 300-second budget.
  Step 3: after the startup probe passes at 60 seconds, a lime readiness-probe bar runs to 65 seconds, a liveness-probe
  bar starts, and an orange traffic bar begins at 65 seconds; before that, no requests are sent. Step 4 marks, in red,
  what happens without a startup probe: a liveness probe fails three times and the container is restarted at 30
  seconds, half-way through loading. All durations are illustrative.
caption: >-
  The replica can answer at 59 seconds, but traffic starts at 65. The startup probe keeps liveness from killing a
  replica that is still loading. Seconds are illustrative.
tags: [containers, kubernetes, probes, readiness, cold-start, serving, genai]
