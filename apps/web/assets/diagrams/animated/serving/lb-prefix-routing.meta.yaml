title: Prefix-aware routing
alt: >-
  A request box labelled turn 2 request, 2,470 tokens, feeds a router on the left. Three teal replica boxes sit on the
  right, each with a violet prefix-cache box under it; only replica 1's cache is filled, with turn 1. Step 1: a dashed
  arrow sends the request to replica 2, a cache miss, which must prefill all 2,470 tokens, 98.8 milliseconds of GPU
  time. Step 2: a highlighted arrow sends it to replica 1, which has 2,192 tokens cached as 137 whole blocks of 16 and
  prefills only 278 tokens, 11.1 milliseconds. Step 3: a lime box says that if replica 1 is far busier than the rest,
  the router sends the request to the least-loaded replica instead, and a dashed arrow points to replica 3.
caption: >-
  A follow-up carries the whole conversation, so the replica that holds the earlier turns skips almost all of its
  prefill. The router must still watch load, or a popular prefix makes a hot spot. Milliseconds are illustrative.
tags: [load-balancing, prefix-cache, routing, serving, genai]
