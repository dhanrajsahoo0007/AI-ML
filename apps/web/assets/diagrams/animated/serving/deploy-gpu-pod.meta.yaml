title: One GPU node serving an LLM
alt: >-
  An architecture diagram built in six steps. A teal zone labelled "GPU node" holds the pieces that serve a model;
  three nodes sit outside it on the left. Step 1: the device plugin, in grey, tells the scheduler, also grey, that the
  node has 4 GPUs. Step 2: the scheduler places the engine pod, in teal with an accent ring and labelled "limits: 1 GPU",
  onto this node. Step 3: the weights, 16 GB, are copied from object storage, in violet, onto the violet model volume.
  Step 4: the engine loads the weights from the volume into GPU memory, and a dashed two-way link to a violet shared
  memory block shows its worker processes sharing data through slash dev slash shm. Step 5: the readiness probe, in
  lime, asks the engine whether it can answer. Step 6: a passing probe adds the pod to the orange Service, which then
  sends requests, 12 a second at peak, to the engine.
caption: >-
  The pod asks for a GPU, the device plugin makes it schedulable, the volume holds the weights, shared memory lets the
  workers talk, and the probe decides when the Service may send traffic.
tags: [containers, kubernetes, gpu, device-plugin, serving, genai]
