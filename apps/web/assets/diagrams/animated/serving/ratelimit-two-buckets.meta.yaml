title: Two buckets, one key
alt: >-
  Three rows, one per step, each with two horizontal bars. The left bar counts requests per minute against a limit of
  1,000; the right bar counts tokens per minute against a limit of 2,000,000. Step 1, a normal peak minute: 720
  requests, an orange bar at 72 percent, and 1,764,000 tokens, an orange input part of 1,584,000 and a green output
  part of 180,000, at 88 percent. Step 2, five long prompts of 150,000 tokens arrive: requests rise only to 725, but
  a blue part of 751,250 tokens pushes the token bar to 2,515,250, past the limit, with a red cell marked plus
  515,250. Step 3, the same five prompts capped at 32,000 tokens: the blue part shrinks to 161,250 and the token bar
  ends at 1,925,250, back under the limit at 96 percent. The limits are illustrative values set by the gateway.
caption: >-
  Five extra requests move the request meter by under 1 percent and the token meter by 43 percent. Limits are
  illustrative.
tags: [rate-limiting, tokens, throttling, serving, genai]
