title: An LLM gateway, one job at a time
alt: >-
  An architecture diagram built in seven steps. On the left, three Brightpost apps in orange: the support assistant
  with 200,000 requests a day, a nightly catalogue writer and the labs team's prototypes. On the right, green models:
  provider A, provider B and a self-hosted small model. Step 1: each app calls provider A directly with its own copy of
  the provider key. Step 2: an LLM gateway, drawn as the solid accent in the middle, takes every request with a team
  key and sends it on in provider A's or provider B's format. Step 3: the gateway reads and adds to token counts per
  team key in a violet usage-counter store. Step 4: it looks up identical requests in a violet response cache. Step 5:
  easy questions go to the self-hosted small model, and provider B becomes a dashed fallback link. Step 6: a lime
  guardrails service checks the prompt on the way in and the answer on the way out. Step 7: every call is logged, with
  its key, tokens and cost, to a violet log and spend store.
caption: >-
  The apps stop holding provider keys; every limit, cache, route, check and log lives in one place they all call.
tags: [serving, gateway, routing, rate-limiting, genai]
