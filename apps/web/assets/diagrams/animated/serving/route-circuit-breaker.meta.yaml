title: "A circuit breaker: closed, open, half-open"
alt: >-
  A state diagram in four steps with three blocks. Step 1: a grey Closed block, "calls go to provider A", with a note
  that it counts the last 20 outcomes and that a failure is a 429, a 5xx or no first token in 2 seconds. Step 2: an
  arrow labelled "10 of last 20 calls fail" leads to a red Open block, "calls skip A, go to B", with a note that at 12
  requests per second, 360 calls in 30 seconds skip the detour. Step 3: an arrow labelled "after 30 s" leads from Open
  to an orange Half-open block, "3 probe calls to A", with a note that probes are real requests sent one at a time
  while the rest still go to B. Step 4: an arrow labelled "3 probes succeed" returns from Half-open to Closed, and a
  red dashed arrow labelled "a probe fails: open again" returns from Half-open to Open.
caption: >-
  The breaker spends a few failed calls to learn that a provider is down, then stops sending it traffic. After 30
  seconds it tests the provider with three probes before trusting it again.
tags: [serving, routing, circuit-breaker, reliability, genai]
