title: The cost-saving request path
alt: >-
  An architecture diagram built in seven steps. Step 1: Brightpost's customers, in orange, send a question to a violet
  Response cache that holds exact and semantic matches. Step 2: on a hit, a dashed arrow runs over the top straight
  back to the customers with the stored answer. Step 3: on a miss, the question goes to a grey Router, the solid
  accent, which asks whether the question is easy or hard. Step 4: the router sends the easy 70 % up to a green Small
  model that costs a tenth of the price and the hard 30 % down to a green Large model at full price; the shares are
  illustrative. Step 5: the small model's draft goes to a lime Verifier that asks whether it is good enough. Step 6: a
  dashed arrow labelled "fails: escalate" runs from the verifier down to the large model. Step 7: a draft that passes,
  or the large model's answer, flows into a green Answer block; the answer streams back to the customers along the
  bottom, and a dashed arrow labelled "store if reusable" returns it to the cache.
caption: >-
  Most of the saving comes from what never reaches the large model: a cache hit skips both models, the router keeps the
  easy 70 % (illustrative) on the cheap one, and the verifier catches the small model's misses before the customer
  does.
