title: A release is five pinned versions that ship and roll back together
alt: >-
  A four-step figure with rows of five boxes: model, prompt, index, guardrails and tools. Step 1, bundle 41, live:
  model m6 in green, prompt p11 and tools t7 in blue, index i30 in violet, guardrails g5 in lime. Step 2, bundle 42, the
  candidate: model m7, prompt p12, index i31, guardrails g5 and tools t8, with a note that four of five parts changed
  and were tested and released as one. Step 3, a half rollback of the tools only: the model m7, prompt p12, index i31
  and guardrails g5 are as in bundle 42 but tools are back at t7, and the prompt and tools boxes are red because
  prompt p12 calls the refund tool with a reason code field that tool schema t7 does not have, so the call is
  rejected. Step 4, bundle 41 restored: all five parts return to m6, p11, i30, g5 and t7 with one switch.
caption: >-
  Model, prompt, index, guardrails and tool schemas are tested as a set, so they ship and roll back as a set. Roll
  back one part and the rest may no longer fit it. Version labels are invented for the figure.
tags: [deployment, rollback, versioning, serving, genai]
