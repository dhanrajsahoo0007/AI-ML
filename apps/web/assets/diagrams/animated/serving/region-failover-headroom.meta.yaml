title: Spare capacity so the other regions can absorb a failed one
alt: >-
  Bars for Brightpost's peak of 12 requests per second shared between regions, each with a line at the capacity it is
  sized for. Step 1, two regions: when both are up, each bar holds an orange block of 6 requests per second against a
  line at 12. When Region A fails, shown as a red box reading down, Region B holds its own 6 plus 6 from A, which
  fills the bar to its limit of 12, and a pulsing ring marks it. A line says each region is sized for 12 divided by 1,
  which is 1.76 GPUs, so 2 per region and 4 in all. Step 2, three regions: each holds 4 requests per second against a
  line at 6; when Region A fails, B and C each hold their own 4 plus 2 from A, exactly 6, so each is sized for 6, one
  GPU per region and 3 in all. Step 3 shows three lime boxes: one region has 12 requests per second of capacity and 2
  GPUs but no failover; two regions have 24, twice the peak, and 4 GPUs; three regions have 18, one and a half times
  the peak, and 3 GPUs.
caption: >-
  With N regions, each is sized for peak ÷ (N − 1), so the fleet carries peak × N ÷ (N − 1): twice the peak for two
  regions, one and a half times for three. GPU counts are illustrative.
tags: [multi-region, failover, capacity, serving, genai]
