title: Token budgets and a rate limit, per team key
alt: >-
  Four horizontal meters, each a bar filled from the left against a limit line. A legend reads: orange is input
  tokens, green is output tokens, an empty bar is unused budget and red is refused. The first group shows a daily token
  budget per team key, each bar drawn against its own budget. Support assistant, key team-support: 440 million input
  and 50 million output tokens, 490 million of a 600 million daily budget. Catalogue writer, key team-catalogue: 16
  million in and 8 million out, 24 million of 40 million. Labs prototypes, key team-labs: it asked for 45 million
  tokens against a 30 million budget, so the bar is orange up to the budget line and a red part marked plus 15 shows
  15 million tokens refused with 429. The second group shows the per-minute rate limit on the support key at peak:
  12 requests a second times 60 times 2,450 tokens is 1,764,000 tokens a minute, 1,584,000 of them input, against a
  limit of 2,000,000 tokens a minute.
caption: >-
  A daily budget caps what a team can spend; a per-minute limit caps how fast it can spend it. Labs hit its budget, so
  the gateway refused the last third of a runaway script before any provider billed it.
tags: [serving, gateway, rate-limiting, cost, genai]
