title: Round-robin against least tokens in flight
alt: >-
  Two groups of three horizontal bars, one bar per replica, on a shared scale from 0 to 24,000 tokens, each with a
  line at an illustrative budget of 12,000 tokens. Orange blocks inside each bar are requests labelled A to I. Step 1,
  round-robin: replica 1 holds A, D and G for 1,350 tokens, replica 2 holds B, E and H for 1,600, and replica 3 holds
  the three long requests C, F and I for 24,000, which runs 12,000 past the budget as a red block. Step 2, least tokens
  in flight: replica 1 holds A, D and F for 7,900, replica 2 holds B, E, G, H and I for 11,050, and replica 3 holds C
  for 8,000; all three are under budget. Step 3 adds a lime box to each group with the ratio of busiest to quietest
  replica, 17.8 times for round-robin and 1.4 times for least tokens.
caption: >-
  The same nine requests, the same three replicas. Round-robin counts requests, so the three long ones all land on
  replica 3; counting tokens spreads them. Lengths and the budget are illustrative.
tags: [load-balancing, routing, serving, genai]
