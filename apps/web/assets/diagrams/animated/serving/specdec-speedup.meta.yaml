title: Speculative decoding speed-up against acceptance rate
alt: >-
  A line chart of expected tokens per large-model pass, from 0 to 8, against the acceptance rate alpha, from 0.5 to
  0.95. A dashed gray line at 1 marks plain decoding. Step 1: a green curve for a draft length of 4 rises from about
  1.9 at alpha 0.5 to about 4.5 at 0.95, with a highlighted point at alpha 0.8 labelled 3.36 tokens. Step 2: a solid
  gray curve for k = 2 stays below it, reaching about 2.9, and a dashed gray curve for k = 8 sits barely above the
  others at low alpha and climbs to about 7.4 at 0.95. Notes say that at alpha 0.6, k = 8 gives 2.47 tokens and k = 2
  gives 1.96, while at alpha 0.9, k = 8 gives 6.13 and k = 2 gives 2.71. Step 3: a lime table of wall-clock speed-ups
  with an illustrative draft cost of 0.1 target passes. At alpha 0.6: 1.63, 1.65 and 1.37 times for k = 2, 4 and 8.
  At alpha 0.8: 2.03, 2.40 and 2.40 times. At alpha 0.9: 2.26, 2.93 and 3.40 times, the darkest cell. Notes say the
  best k grows with alpha, that at 0.8 a draft of 8 adds nothing over 4, and that speed-up equals tokens per pass
  divided by k times c plus 1.
caption: >-
  Computed from Leviathan et al. (2023): longer drafts only pay when most drafts are accepted, and once each draft
  pass costs something, the best draft length depends on the acceptance rate.
tags: [speculative-decoding, inference, serving, genai]
