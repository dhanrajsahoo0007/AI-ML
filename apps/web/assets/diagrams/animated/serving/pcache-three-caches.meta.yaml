title: Three caches, three things reused
alt: >-
  A table of three rows, one per step, with columns for what a hit reuses, where the cache lives and who controls it.
  Step 1, the violet semantic cache, which skips the model call: it reuses a whole stored answer for a question that
  means the same; it lives in your app or gateway as a vector index and an answer store; you control the similarity
  threshold, lifetime and purge. Step 2, the violet prompt cache, which skips part of the prefill and is billed at a
  discount: it reuses the model's work on an identical prompt prefix while the answer is still fresh; it lives on the
  provider's servers, kept apart per organisation; you control order, breakpoints and the lifetime option, and the
  provider sets the minimum and expiry. Step 3, the teal engine key-value cache, which skips part of the prefill: it
  reuses key-value blocks a replica already computed; it lives in the GPU memory of one replica, in engines such as
  vLLM and SGLang; whoever runs the engine controls flags, block size and routing.
caption: >-
  The semantic cache saves the whole call, the other two save only prefill; the further down the row, the less you
  control, unless you run the engine yourself.
