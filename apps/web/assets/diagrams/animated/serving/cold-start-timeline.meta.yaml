title: Cold start of one replica
alt: >-
  A timeline in seconds, from 0 to 100, with four stages in order for a new inference replica holding 16 GB of weights.
  Step 1, from scratch: a blue bar for pulling the engine image, 40 seconds; a blue bar for downloading the weights, 16
  seconds; a teal bar for loading them into GPU memory, 8 seconds; and a teal bar for warming up and compiling, 35
  seconds, highlighted. A dashed lime line marks the replica ready after 99 seconds. Step 2 adds a second timeline on
  the same scale: the image pull and the download take 0 seconds because the image is already on the node and the
  weights are on a local disk, loading still takes 8 seconds, and warm-up falls to 15 seconds because a compile cache
  is kept, so the replica is ready after 23 seconds. All durations are illustrative.
caption: >-
  Most of a cold start is moving bytes and compiling, not loading the model into the GPU. Moving the slow stages
  ahead of time cuts 99 seconds to 23. Seconds are illustrative; measure your own.
tags: [autoscaling, cold-start, serving, genai]
