title: The latency budget of one answer
alt: >-
  A timeline chart of one Brightpost answer, measured from the moment the request reaches a replica, on an axis from
  0 to 1,500 milliseconds. Step 1: a grey bar for the queue wait runs from 0 to 80 ms, then a teal bar for prefill of
  the 2,200-token prompt runs from 80 to 400 ms. A green dashed line at 400 ms marks the first token. A note reads:
  time to first token equals 80 ms of queue plus 320 ms of prefill, 400 ms. Step 2: a long green bar for decoding 250
  output tokens runs from 400 to 1,500 ms, and a dashed line at 1,500 ms marks the full answer. A second note reads:
  full answer equals 400 plus 250 times 4.4 ms, 1,500 ms, which is 227 tokens per second. The budget is illustrative.
caption: >-
  Two numbers describe every LLM answer: the wait for the first token (queue plus prefill) and the pace after it
  (one decode step per token).
