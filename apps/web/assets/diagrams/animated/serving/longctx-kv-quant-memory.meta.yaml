title: KV cache bytes per token at 16, 8 and 4 bits
alt: >-
  A layout figure in three violet-outlined panels for a model with 80 layers, 64 key-value heads and 128 dimensions per
  head. The first panel shows three bars of cache per token: 2.62 MB at 16 bits, 1.31 MB at 8 bits and 0.66 MB at 4
  bits, each half the one above. The second panel draws three meters against a 200 GB cache budget for one sequence of
  128,000 tokens: 335.5 GB at 16 bits, which runs past the budget by 135.5 GB in a red cell, 167.8 GB at 8 bits, which
  fits, and 83.9 GB at 4 bits, which fits with room to spare. The third panel shows how many tokens of context fit in
  200 GB: 76,293 at 16 bits, 152,587 at 8 bits and 305,175 at 4 bits, with a dashed marker at 128,000 tokens that only
  the 8-bit and 4-bit bars pass. A footnote says the budget is illustrative and that scales add about 0.25 bit per value.
caption: >-
  Halving the bits halves the bytes per token and doubles the tokens that fit: at 16 bits a 128,000-token sequence
  overruns a 200 GB budget, at 8 bits it fits, at 4 bits it leaves room for another.
tags: [serving, kv-cache, quantisation, memory, long-context, genai]
