title: A canary with a quality check and a latency check at every stage
alt: >-
  A four-step figure of Brightpost's candidate bundle 42 moving through a canary release. Each stage is a row with a
  grey candidate box on the left, two check boxes in the middle and a result box on the right. Step 1, 1 percent of
  traffic, 83 requests an hour: quality 92 percent (46 of 50 graded answers, floor 85 percent) and p95 first token 360
  milliseconds against a target of 400 both pass in lime, and the result is a green Go to 10 percent. Step 2, 10 percent,
  828 requests: quality 89 percent (178 of 200) and p95 372 milliseconds pass, with a note that the range 84.7 to 93.3
  percent still holds the floor. Step 3, 50 percent, 4,140 requests: p95 381 milliseconds passes, but quality 81
  percent (405 of 500) is a red box, and the result is a red Roll back to 0 percent. A note says the top of the range,
  84.4 percent, is under the floor. Step 4 adds a box that returns the weight from 50 percent to 0 percent, noting that
  bundle 41 never stopped serving, and a box for the 100 percent stage that was never reached.
caption: >-
  The latency check passes at every stage; only the quality check catches the regression, and only once the sample is
  large enough. Sample sizes, pass counts and latencies are illustrative.
tags: [deployment, canary, rollback, serving, genai]
