title: A batch discount on Brightpost's nightly summaries
alt: >-
  A bar chart built in four steps, at illustrative prices of 2 US dollars per million input tokens and 10 per million
  output tokens. Step 1 shows the night's work: summarising yesterday's 200,000 conversations reads 490 million input
  tokens, 200,000 times 2,450, in an orange box, and writes 20 million output tokens, 200,000 times a 100-token
  summary, in a green box. Step 2 shows the standard API at list price as one bar: 980 dollars of input in orange and
  200 dollars of output in green, 1,180 dollars a night. Step 3 shows the batch API at 50 percent off with results
  within 24 hours: a bar half as long, 490 dollars of input and 100 dollars of output, 590 dollars a night, saving 590
  dollars a night or 17,700 dollars over 30 nights. Step 4 applies the same discount to the 200-ticket golden set:
  1.38 dollars at list and 0.69 dollars in a batch, a saving of 69 cents that is under one pixel at this scale, with
  the note that a result which gates a release should not wait up to 24 hours.
caption: >-
  The discount is the same 50 % on any job; it is worth hundreds of dollars a night at 200,000 conversations and 69
  cents on the golden set. Prices illustrative; discount from provider docs, November 2026.
tags: [serving, batch, cost, genai]
