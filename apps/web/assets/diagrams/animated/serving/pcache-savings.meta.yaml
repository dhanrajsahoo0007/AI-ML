title: What caching saves Brightpost
alt: >-
  Two groups of bars. The top group shows one day of input tokens as cost in millions of input-token equivalents,
  against a line at 440 for no caching. Without caching: 440, a violet fixed part of 240 and an orange changing part of
  200. With caching: 226.76, a violet write part of 3.0 and read part of 23.76 and the orange 200, 48 percent less.
  Broken, with a date in the first line so every request writes: 500, a red write part of 300 and the orange 200, past
  the line with a red overrun of 60. The bottom group shows the first token as a timeline: 312 milliseconds of queue and
  network, then prefill of 2,200 tokens for a first token at 400 milliseconds without caching, or prefill of only 1,000
  new tokens for a first token at 352 milliseconds with a cache hit. Prefill speed is illustrative.
caption: >-
  A hit cuts a day's input cost by 48 percent and the first token by 48 ms; a prefix that changes on every request costs
  14 percent more than no caching at all. Multipliers from provider docs as of November 2026; the miss rate and prefill
  speed are illustrative.
tags: [prompt-caching, cost, ttft, serving, genai]
