title: Retry, then fall back to a second provider
alt: >-
  A sequence diagram with four lanes: Brightpost's support app in orange, the gateway in grey, and providers A and B
  in green. Step 1: the app sends a chat request with its team key; the gateway sends it to provider A in A's format,
  and A answers 429 with retry-after 1 after 50 milliseconds. Step 2: the gateway waits 1 second, as told, and retries
  at 1.05 seconds; A sends no first token within the 2-second timeout, drawn as a red timeout arrow. Step 3: at 3.05
  seconds the gateway sends the same request to provider B in B's format; B's first token arrives at 3.45 seconds and
  the answer streams back to the app, marked as served by B. Step 4: provider A cools down for 30 seconds, so the next
  request from the app goes straight to B.
caption: >-
  The answer still arrives, but its first token comes at 3.45 s instead of 0.4 s: every retry and timeout is paid for
  in the user's wait.
tags: [serving, gateway, fallback, retries, genai]
