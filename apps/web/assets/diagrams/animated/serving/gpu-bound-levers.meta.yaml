title: "Memory-bound and compute-bound: which fix helps which"
alt: >-
  Two columns. Step 1: a violet card on the left reads memory-bound, waiting for bytes, left of the ridge, with the
  Brightpost example of decode at one token per request. A teal card on the right reads compute-bound, waiting for
  FLOPs, right of the ridge, with the example of prefill of a 2,200-token prompt. A line below asks whether the work's
  FLOPs per byte are below or above 295 for the H100 in BF16. Step 2: four violet cards under the memory-bound column
  list the fixes that move fewer bytes: batch more requests, quantise the weights, shrink the KV cache and fuse
  kernels, with a note that more TFLOPS does not help. Step 3: four teal cards under the compute-bound column list
  fixes that do the FLOPs faster or fewer: lower-precision maths with FP8 at 1,979 against 989 TFLOPS, better kernels,
  splitting across GPUs and skipping repeated work such as a cached prompt prefix, with a note that more bandwidth does
  not help.
caption: >-
  A fix helps only if it moves the limit the work is hitting: bytes for decode at small batch, FLOPs for prefill.
tags: [gpu, roofline, optimisation, inference, genai]
