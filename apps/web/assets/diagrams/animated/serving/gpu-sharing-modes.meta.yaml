title: Three ways to share one 80 GB GPU
alt: >-
  Three framed panels side by side, each an 80 GB GPU, revealed one step at a time. Step 1, Whole GPU: one teal pod owns
  all 80 GB and every streaming multiprocessor; notes say the card is yours and idle capacity is still billed. Step 2,
  Time-slicing: four teal pods, A to D, share one memory pool and take turns, drawn as a strip of eight turns A B C D A
  B C D; a red note says there is no isolation for memory or faults. Step 3, MIG: four teal 1g.20gb instances of 20 GB
  each with hard walls between them, and a strip of seven compute slices of which four are teal and three are empty,
  meaning three sevenths of the compute sits idle while all the memory is handed out.
caption: >-
  Whole, time-sliced, partitioned: only MIG puts walls between tenants, and its profiles come in fixed sizes. Four
  1g.20gb instances hand out all the memory but only 4 of 7 compute slices.
tags: [gpu, kubernetes, mig, time-slicing, serving, genai]
