title: Static batching against continuous batching
alt: >-
  A layout figure in two panels, each a grid of four batch slots (rows) by ten iterations (columns), where an
  iteration is one forward pass that adds one token to every running request. Orange cells are requests, labelled A
  to J; each request's first cell is darker because it is the prefill iteration that reads the whole prompt. In the
  top panel, static batching, requests A, B, C and D start together at iteration 1 and run for 3, 8, 4 and 6
  iterations. The slots of A, C and D then show grey "idle" cells until B ends at iteration 8, and the next batch, E
  to H, starts only at iteration 9. A lime box counts 21 of 32 slot-iterations busy (66 percent) in iterations 1 to
  8, 4 answers done by iteration 8, and E starting at iteration 9. In the bottom panel, continuous batching, the same
  requests run, but each slot refills the iteration after it frees: E takes A's slot at iteration 4 (highlighted), F
  takes C's at 5, G takes D's at 7, and H, I and J start at 9. Its lime box counts 32 of 32 busy (100 percent), 6
  answers done by iteration 8, and E starting at iteration 4. Lengths are illustrative.
caption: >-
  The static batch idles three slots while it waits for B; the continuous batch fills every slot and finishes six
  answers in the time the static one finishes four.
