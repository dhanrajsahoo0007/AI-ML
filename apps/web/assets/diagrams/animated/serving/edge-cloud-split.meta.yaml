title: A small model near the user against a large model far away
alt: >-
  Horizontal bars split into three coloured parts: a grey network round trip, a teal prefill and a green decode. Step 1
  times an easy request of 300 tokens in and 60 out on three routes. On the device there is no network, 300 ms of
  prefill and 1,500 ms of decode, 1,800 ms in all. On an edge site 20 ms away with a small model it takes 20 plus 12
  plus 120, 152 ms, with the first token at 34 ms. In the home-region cloud 120 ms away with the large model it takes
  120 plus 12 plus 264, 396 ms. Step 2 repeats the three rows for Brightpost's hard request of 2,200 tokens in and 250
  out on a scale to 9,000 ms: the device needs 8,450 ms, the edge small model 608 ms, and the cloud large model 1,308
  ms. A pulsing ring marks the device's long decode. Step 3 adds a lime box: send each request to the smallest route
  that answers it well; the edge saves 244 ms on the easy request, 100 ms of network and 144 ms of faster decode.
caption: >-
  A nearby small model saves the network trip and, being small, some decode time; a phone cannot run a full request in time. All
  rates are illustrative; the cloud decode speed comes from Brightpost's 1,500 ms target.
tags: [edge, latency, routing, multi-region, serving, genai]
