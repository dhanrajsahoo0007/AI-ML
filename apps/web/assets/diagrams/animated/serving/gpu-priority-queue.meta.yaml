title: Interactive work goes first on a shared GPU
alt: >-
  Three lanes, built one step at a time, showing a queue of blue batch requests and one orange interactive request I
  feeding a teal GPU that serves one request per 100 milliseconds (illustrative). Step 1, first come first served: I is
  at the back behind eight batch requests B8 to B1, so a red note says it waits 8 slots of 100 ms, 800 ms, past the
  400 ms first-token target. Step 2, priority scheduling: I sits next to the GPU, and a lime note says it waits for the
  running slot only, at most 100 ms. Step 3, pre-emption: a strip of eight GPU memory blocks that were all held by batch
  requests B1 to B8; B8's block now holds I, and notes say B8 goes back to the queue and re-runs its prefill later.
caption: >-
  In a first-come queue the interactive request waits for everything ahead of it. Priority puts it first, and
  pre-emption makes room in memory when batch work holds every block. The 100 ms slot is illustrative.
tags: [gpu, scheduling, priority, preemption, serving, genai]
