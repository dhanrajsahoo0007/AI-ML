title: "From users to GPUs for Brightpost"
alt: >-
  A left-to-right chain of five boxes with the working under each, built up in five steps. Step 1, an orange box:
  50,000 users a day, an assumed figure. Step 2, an orange box: 50,000 users times 4 requests each is 200,000 requests a
  day, and 200,000 divided by 86,400 seconds is 2.3 requests a second. Step 3, an orange box: the peak is about 5 times
  the average, 11.6, called 12 requests a second. Step 4, a blue box: at 12 requests a second there are 26,400 prompt
  tokens and 3,000 output tokens every second, and 90 percent of tokens are prompt tokens. Step 5, a teal highlighted box:
  each prompt costs 88 milliseconds of GPU prefill time, so 12 requests a second need 1.06 GPU-seconds every second;
  divided by a 60 percent target that is 1.76, rounded up to 2 replicas, plus 1 spare makes 3. A note says the user
  count, requests per user, the 5 times peak, the 400 TFLOP per second sustained rate and the 60 percent target are
  illustrative.
caption: >-
  Each box feeds the next: users become requests, requests become a peak rate, the peak rate becomes tokens, and tokens
  become GPUs. The fleet is sized by the peak, and by prompt tokens more than output tokens.
tags: [capacity-planning, gpu, tokens, brightpost, serving]
