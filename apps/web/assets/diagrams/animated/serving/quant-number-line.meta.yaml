title: Rounding weights to 4-bit levels
alt: >-
  A two-step number-line figure with a table beside each line. Step 1: a horizontal axis with 15 evenly spaced ticks
  labelled with 4-bit codes from minus 7 to 7. Six blue dots, a to f, hover above the axis at the 16-bit values minus
  0.84, minus 0.47, minus 0.12, 0.09, 0.38 and 0.91. Each has a short arrow down to a green dot on the nearest tick, a
  scale of 0.13 chosen as 0.91 divided by 7. The table shows the codes minus 6, minus 4, minus 1, 1, 3 and 7, the
  values they stand for, and the rounding errors 0.06, 0.05, 0.01, 0.04, 0.01 and 0.00 in lime cells, a mean error of
  0.028. Step 2: a second axis for the same six weights plus an outlier of 2.80. The scale is now 0.40, so the ticks
  are further apart in value and the six small weights bunch together. Weights c and d, minus 0.12 and 0.09, both
  round to code 0, shown by a red dot, and the errors become 0.04, 0.07, 0.12, 0.09, 0.02 and 0.11, a mean of 0.075,
  about 2.7 times larger.
caption: >-
  Four bits give 15 levels, so every weight lands on the nearest level and the gap is the error. One large outlier
  forces a larger scale and wider gaps for everything that shares it.
