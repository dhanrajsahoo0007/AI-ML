title: Where the money goes in one Brightpost task
alt: >-
  A to-scale bar in three steps, with illustrative prices of $2 in and $10 out per million tokens. Step 1: one model
  call for the refund case, order 4471, a cracked kettle for 42 pounds, is drawn as an orange segment for 2,200 input
  tokens costing $0.0044 and a shorter green segment for 250 output tokens costing $0.0025, $0.0069 in all. Two thin
  bars below compare shares: input is 90 % of the tokens but 64 % of the bill, and output is 10 % of the tokens but
  36 % of the bill. A green box adds up a day of 200,000 such calls to $1,380. Step 2: the bar grows to three calls,
  look up the order, check the refund rule and write the answer, each with the same orange and green segments, and a
  grey box gives the task total, 3 calls at $0.0069, which is $0.0207, made of $0.0132 input and $0.0075 output. Step 3:
  three boxes name the lever for each part: for input tokens, trim the prompt and cache the prefix; for output
  tokens, a concise format and a length cap; for the number of calls, fewer steps and a cheaper model per step.
caption: >-
  Input tokens are 90 % of the tokens but 64 % of the bill, and a task that makes three calls pays that bill three
  times. Each part of the bill has a different lever, so find which part is large before pulling any of them
  (illustrative prices).
