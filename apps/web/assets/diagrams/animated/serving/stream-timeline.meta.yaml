title: One answer, streamed and not streamed
alt: >-
  Two timing charts on one millisecond axis from 0 to 1,500. The top chart, inside the engine, has a teal bar for
  queue and prefill from 0 to 400 milliseconds, reading 2,200 input tokens, and a green bar for decode from 400 to
  1,500 milliseconds, writing 250 tokens. A dashed lime line marks the first token at 400 milliseconds and runs down
  through the lower chart; a dashed line marks the answer complete at 1,500 milliseconds. The lower chart shows how
  long the customer's screen stays blank, as orange bars: 1,500 milliseconds when the answer is not streamed, then
  all of it at once; 400 milliseconds when it is streamed, then a token every 4.4 milliseconds; and 532 milliseconds
  when it is streamed through a 30-token guardrail check, then text 30 tokens behind. A footer computes time per
  output token as 1,500 minus 400, divided by 250 minus 1, which is 4.4 milliseconds.
caption: >-
  Streaming does not make the answer finish sooner; it makes the screen stop being blank 1,100 ms sooner. A guardrail
  window gives back 132 ms of that (window size illustrative).
tags: [serving, streaming, latency, genai]
