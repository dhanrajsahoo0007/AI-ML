title: Three ways to get weights next to the engine
alt: >-
  A bar chart in seconds, built in three steps, comparing three ways to give a new inference replica its 16 GB of
  weights. Each bar is split into an image pull in violet, a weights download in blue and a load into GPU memory in
  teal, and ends in a lime total. Step 1, bake the weights into the image: the image is 24 GB, the pull takes 120
  seconds and the load 8 seconds, 128 seconds in all. Step 2, download from object storage at start: an 8 GB image pulls
  in 40 seconds, the 16 GB download takes 16 seconds and the load 8 seconds, 64 seconds in all. Step 3, mount a shared
  volume: the 8 GB image pulls in 40 seconds and the load reads from the volume in 16 seconds, 56 seconds in all. A note
  under each bar gives its main drawback. All rates are illustrative.
caption: >-
  The weights are most of the bytes. Where they live decides how much each new replica moves before it can serve.
  Rates are illustrative; measure your own.
tags: [containers, kubernetes, model-weights, cold-start, serving, genai]
