title: Three ways to load 106 tools
alt: >-
  Three bars of prompt-prefix tokens on one scale, built in three steps. Step 1: loading all 106 tools on every call
  makes a 67,086-token prefix: a neutral stable part of 3,486 tokens and 63,600 tokens of teal tool definitions;
  cached, that is only about 0.0067 US dollars a call, so the cost is tool choice past 30 to 50 tools and a crowded
  context. Step 2: routed lookups and writes, 23 percent of turns, load one entitlement-class bundle: the stable 3,486
  plus one connector's 7,067 tokens, 10,553 in all, one of 31 shared prefixes and 84 percent fewer tokens. Step 3:
  the agent, 5 percent of turns, loads the stable part and a 500-token tool_search tool, 3,986 tokens, and each search
  over the user's entitled tools adds 1,800 tokens of definitions in blue, so a two-search task uses 7,586 tokens, 89
  percent fewer. Footnotes say definitions are pinned by hash, each search adds a model step, and the vendors' 85 and
  98.7 percent savings each come from one example setup.
caption: >-
  Cached, loading every tool is cheap; the reason not to is choosing among 106 tools, so routed turns get one bundle
  and only the agent searches.
