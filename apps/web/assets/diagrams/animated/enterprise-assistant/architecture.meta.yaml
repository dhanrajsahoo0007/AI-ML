title: Enterprise AI assistant architecture, built step by step
alt: >-
  An architecture diagram in six zones, built up in eight steps. Step 1: an orange employee, on the web, Slack or
  Teams, signs in through the API gateway, which passes each message to the orchestrator, the dark accented node; the
  orchestrator sends the prompt down the left side to the green answer model and streams the reply back. Step 2: a
  blue retrieval service to the right of the orchestrator searches the violet search index of 32.1 million chunks,
  filled by blue connectors from five sources, and sends candidates to lime rankers that narrow 160 to 50 to 8; at this
  step the search is labelled unfiltered, because the crawler reads with application rights. Step 3: the connectors
  map every account to its Entra id and write grants to a violet ACL store; the search now runs with the asker's
  principal set inside it, re-checks the ACL store in 5 milliseconds, and searches Slack and mail live as the user
  through a teal live-search node. Step 4: a blue permission-sync pipeline, about 35 seconds by event plus budgeted
  polls, updates the ACL store, which patches the index. Step 5: a lime router picks the path and tool bundle; a teal
  tool gateway checks audience and turns writes into cards, gets the user's token from a lime token broker, and the
  broker's delegated token reaches teal connector tools, 106 tools on MCP servers. Step 6: a green agent loop, capped
  at 10 calls and 60 seconds, calls tools through the tool gateway, which also runs a teal tool search over entitled
  tools only. Step 7: a violet memory store, reached along the bottom, gives at most 5 user-saved items to a prompt.
  Step 8: lime guards screen injection and egress, the orchestrator writes every turn with its acl_version to a violet
  audit and traces store over the top, and a lime evaluation node runs the permission suite and canaries from it.
caption: >-
  Permissions travel with the data and are applied inside the search; every read and write runs as the user through
  one tool gateway; memory holds only what the user saved.
