title: Latency per path, p50
alt: >-
  Waterfall charts of the assistant's p50 latency, built in five steps. Step 1: the indexed answer on one millisecond
  axis: edge, auth and principal set 20 milliseconds, a lime small router 300, a violet bar of embedding, filtered
  search and the ACL re-check 60, a lime personal ranker 10 and a lime cross-encoder 120 that ends with sources at
  510 milliseconds, a lime injection screen and context 35, and a green first token of 600, so the first token
  arrives at 1,145 milliseconds against a 1,500 target. Step 2: a highlighted teal row of live checks starts at 390
  milliseconds, when the personal ranker finishes, and runs 260 milliseconds, overlapping the cross-encoder, so the
  answer waits about 140 milliseconds more: sources at 650 and the first token at 1,285. Step 3: a teal live Slack or
  mail search of 500 milliseconds, with the index search inside it, and the slowest of 3 mail bodies at 275 put the
  first token at 1,880 milliseconds against a 2,200 target. Step 4: on a second scale, a lookup reaches its reply's
  first token at 2,475 milliseconds through a model call, 60 tokens of tool call, the token broker and a 300
  millisecond tool call as the user; a write shows its card at 2,450 milliseconds after 120 tokens of arguments and a
  30 millisecond schema, audience and policy check, and the confirm takes 435 milliseconds. Step 5: on its own scale,
  the agent's budget sums to 11,880 milliseconds: 3,600 of first tokens over six model calls, 7,000 for 560 output
  tokens, 900 for three tool calls and 60 for two tool searches, against a 15,000 target.
caption: >-
  The live check runs alongside the cross-encoder, so a sensitive answer costs about 140 ms, not 260; a live Slack or
  mail search costs about 735 ms, which is why it has its own target.
