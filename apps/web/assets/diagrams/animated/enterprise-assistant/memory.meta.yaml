title: Memory the user can see and correct
alt: >-
  A layout in three steps. Step 1: on the left, an orange message from Tom says he works nights at Leeds and asks for
  the night-shift rota; a green small-model memory extraction, once a conversation for 0.00023 US dollars, proposes a
  chip; a lime code check confirms the text is a span of one of Tom's own messages; and the chip "Works nights at
  Leeds" appears with Save and Dismiss buttons. Step 2: an arrow from Save leads to Tom's memory list on the right,
  three violet items, each with its source line, such as "from your message today", and Edit and Delete buttons; at
  most 5 relevant items, 200 tokens, go into a prompt, at most 50 are kept, and items unused for 180 days expire.
  Step 3: across the bottom, Tom says "forget that I work nights", a lime UI prompt asks him to confirm deleting the
  item, and a violet box says it is gone next turn, purged from backups within 30 days, and audited.
caption: >-
  The model can only propose a memory from the user's own words; the user saves it, sees where it came from, and can
  edit or delete it.
tags: [genai, memory, agents, privacy, case-study]
