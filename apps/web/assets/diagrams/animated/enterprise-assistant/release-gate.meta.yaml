title: The assistant's release gate
alt: >-
  A gate diagram: a neutral release candidate, a new prompt and ranker, sends arrows to eight checks, and each check
  sends an arrow to the result. Seven checks pass in lime: the gold set at 87.1 percent of 1,200 questions, plus or
  minus 2.0 points, against 85; filtered recall at 96.2 percent for the warehouse persona against 95; 0 of 700
  injections followed across 7 egress families; a simulator pass^4 of 88.5 percent on 400 scenarios, plus or minus
  3.1, against 85; router misroutes at 3.4 percent of 1,000 labelled turns against 5; grounding at 96.4 percent of
  sentences supported against 95; and p95 per path on a replay of 1,800, 1,975 and 2,855 milliseconds against 2,500,
  2,500 and 3,500. One check fails in red: the permission suite found 1 leak in 5,600 probes, an org-linked file the
  persona never redeemed. So the result is a red Block: fix the org-link grant. Notes say the department slices, cost a
  turn and the drift audit also gate, zero leaks in 5,600 probes bounds the rate at 0.054 percent a probe for these
  personas, and the measured values are illustrative.
caption: >-
  One leak in 5,600 probes blocks the release, however good the other seven checks are: the permission suite gates
  at zero.
