title: One permission-filtered answer, request to done
alt: >-
  A sequence diagram with six lanes: an orange employee, a neutral gateway, a neutral orchestrator, blue retrieval, a
  teal helpdesk and a green answer model, built in five steps. Step 1: Priya, a support team lead, asks whether she can
  refund order 4471, a cracked 42-pound kettle; the gateway passes her principal set, ps_7f3 with 140 principals, to
  the orchestrator; the router takes 300 milliseconds and picks the answer path with no live search, and a status
  reaches her at 320 milliseconds. Step 2: the orchestrator sends the rewritten query with her principal set inside the
  search; embedding, search, the ACL re-check and the personal ranker finish at 390 milliseconds, when retrieval starts
  a live check of case 4471 in the helpdesk as Priya while the cross-encoder narrows 50 chunks to 8, done at 510
  milliseconds. Step 3: the helpdesk allows the case, the slowest of 3 checks taking about 260 milliseconds; the
  orchestrator waits about 140 milliseconds, inside a 500-millisecond deadline, and sends sources 1 to 3 at 650
  milliseconds. Step 4: the orchestrator sends a 7,876-token prompt with 3,486 tokens cached; the first token arrives
  at 1,285 milliseconds and streams that refunds over 30 pounds need an approver, citing sources 1 and 2; the answer
  is done in about 4.4 seconds and the grounding check passes; the audit keeps the principal set, the chunk ids with
  their acl_version and a cost of 0.0121 US dollars. Step 5: Tom, a warehouse shift lead, asks the same question; his
  principal set has no helpdesk-agents group, so case 4471 is never a candidate.
caption: >-
  The principal set is inside the search from the first query, and the one live check runs alongside the
  cross-encoder, so the sensitive answer still shows its sources at 650 ms.
