title: How long a revoked permission lasts, per path
alt: >-
  Four lanes of boxes joined by arrows, then a budget bar, built in four steps, for the FY27 pay-bands file whose
  org-wide link is removed at 10:00:00 on a Confidential P1 site. Step 1: the typical event path, about 35 seconds:
  the orange link removal at 10:00:00, a blue Graph notification at 10:00:30, a lime box at 10:00:31 where the file is
  marked dirty and live-checked, the blue ACL fetch at 10:00:33 for 5 resource units, and a violet box at 10:00:35
  where its 9 chunks are patched. Step 2: if the notification is lost, which Graph allows for up to 6 hours, the P1
  poll every 10 minutes at 1 unit a call sees the change by about 10:10:05 and the chunks are patched: at most 10
  minutes on P1 sites and 60 elsewhere. Step 3: if a poll is throttled with a 429, the next P1 poll runs about 10:20,
  stretching the bound to 20 minutes, or 120 elsewhere, and after 30 minutes with no reconcile the site drops out of
  results, in red; a fourth lane shows a user removed from a SharePoint site group, caught by the site-group reconcile
  every 10 minutes on P1 sites, which updates the principal store without rewriting any chunk. Step 4: a bar of
  SharePoint's 2,400,000 resource units a day for one Graph app: events, fetches and downloads 139,200 in blue, P1 and
  P2 polls 228,000 in teal, site groups 432,000 in violet, live checks and the drift audit 44,700 in lime, together
  843,900 or 35 percent, plus a neutral reserve of 650,000 or 27 percent for re-enumerating every drive, 624,000 units
  in about 7 hours; a 10-minute poll of all 8,000 drives would have used 48 percent alone.
caption: >-
  Events make a revocation effective in about 35 seconds; budgeted polls bound it at 10 or 60 minutes, and a site that
  cannot prove its bound drops out of the results.
