title: Build or buy, against the size of the build team
alt: >-
  A line chart of monthly cost in US dollars, labelled illustrative, against the number of engineers on the build
  team from 4 to 12, built in three steps. Step 1: a violet line for building this design rises from about 153,000 at
  4 engineers to about 420,000 at 12; a flat teal line for a mixed purchase sits at 238,400, inside a dashed teal band
  from 223,300 to 253,600 for the range of metered warehouse agents. Step 2: the violet line crosses the purchase at
  about 6.6 engineers, marked with a dashed drop. Step 3: this design's 9 engineers are marked: building costs 319,900
  a month, 64 dollars a seat, with the team 94 percent and the model 1.5 percent of it, against 238,400 or 48 dollars
  a seat to buy; the seat breakeven is about 5,200 knowledge workers.
caption: >-
  The team, not the model, decides build or buy: building pays for itself only if it needs fewer than about 6.6
  engineers, or above about 5,200 seated knowledge workers.
