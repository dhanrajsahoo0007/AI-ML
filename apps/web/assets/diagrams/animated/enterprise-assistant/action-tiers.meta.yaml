title: Acting as the user, inside the company
alt: >-
  A table and a flow, built in three steps. Step 1: four tiers by who can see an action's effect. T0, in teal, is a
  read seen only by the user, such as a search or the stock for a SKU, done as the user with no card. T1, teal, is the
  user's own item, such as a Jira issue in an internal project or an internal case note, shown on a card and
  withdrawable within 10 minutes. T2, lime, is visible to named colleagues or internal-only channels, such as an
  internal message or a leave request, on a card with the exact payload, audience and label, checked at execution.
  T3, red, reaches anyone outside or cannot be undone, such as a public case reply, external mail, a guest channel,
  refunds, sharing changes and deletes, and is not a tool at all, only a link to the system's own screen. Step 2:
  Tom raises a ticket, a T1 write, in two rows of boxes joined by arrows: the lime router picks the warehouse class's
  Jira bundle; the green model calls jira_create_issue for WH-LEEDS at High priority; the lime tool gateway checks
  schema, entitlement and audience; an orange step-up consent asks for the write scope on his first write; a lime card
  shows the payload and audience at about 2.45 seconds; Tom confirms, once per card; the lime token broker supplies
  his delegated token; and teal Jira creates WH-1182 as Tom with card_id c_51e, 435 milliseconds after the confirm.
  Step 3: a teal box says a timeout waits 10 seconds and reads Tom's recent issues by REST, not JQL, retrying only if
  the card_id is absent; a red box says a supplier email asking for a reply on case 4471 with the approver's name can
  produce at most an internal case note on a card, because public replies are T3 and not a tool.
caption: >-
  A tool's tier comes from who can see its effect, checked when it runs; Tom's ticket is created once, as Tom, after
  he confirms the card.
