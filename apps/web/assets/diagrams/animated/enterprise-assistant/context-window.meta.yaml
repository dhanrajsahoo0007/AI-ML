title: The assistant's context windows
alt: >-
  Two stacked bars of prompt tokens on one scale, built in three steps. Step 1: the answer call, 7,876 tokens in and
  250 out, starts with a prefix that is the same for everyone and cached: neutral instructions of 1,200 tokens, a
  neutral tool-use system prompt of 286 and teal core tool definitions of 2,000, 3,486 in all. Step 2: the changing
  4,390 tokens follow: an orange turn state of 870 (memory 200, the summary and last 2 turns 600, the question 70)
  and blue sources of 3,520 (8 headers of 40 and 8 chunks of 400); priced at 0.10, 2.00 and 10.00 US dollars per
  million, the call costs 0.0116 dollars, against 0.0183 uncached, so the cache saves 36 percent. Step 3: the lookup
  or write call, 11,423 tokens, keeps the same 3,486 and adds one connector's tool definitions, 7,067 tokens, so
  10,553 tokens are cached per entitlement class, one of 31 prefixes, and only the 870-token orange turn is new; all
  106 tools would make the prefix 67,086 tokens.
caption: >-
  Instructions and tool definitions come first and are identical for everyone in a class, so they are read from the
  cache; only the turn and the sources change.
