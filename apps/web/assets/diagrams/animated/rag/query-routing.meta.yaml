title: Query routing
alt: >-
  An orange question card on the left feeds a neutral accent card, the query router, which condenses the chat and
  labels the question. From the router four routes fan out to the right inside a group titled "Routes", one per step,
  and each route leads on to a green LLM card that answers and cites. Step 2: "How do I reset my password if I lost my
  phone?" goes to violet vector search over the help centre. Step 3: "What does error E1234 mean?" goes to teal keyword
  search, which matches the exact code. Step 4: "Where is my order 1042?" goes to a violet SQL query over the orders
  database. Step 5: "Thanks, that worked!" takes a dashed route marked no retrieval, straight to the LLM.
caption: >-
  One front door, four back ends: the router decides what a question needs before anything is searched.
tags: [rag, retrieval, query-routing, genai]
