title: Chunk size trade-off
alt: >-
  Three columns compare chunk sizes for the 1,200-article help centre. 100-token chunks give 13,200 chunks, 11 per
  article, and the top 5 put 500 tokens of context in the prompt; in red, they match "backup code" exactly but lose
  the steps around it. 400-token chunks, highlighted, give 3,600 chunks, 3 per article, and 2,000 tokens of context;
  they hold one instruction with its context. Whole articles give 1,200 chunks and 5,500 tokens of context; in red,
  the step is 30 of 1,100 tokens, so the vector mostly means account help.
caption: Small chunks are precise but thin, whole articles are complete but blurred; pick the size that holds one answer.
