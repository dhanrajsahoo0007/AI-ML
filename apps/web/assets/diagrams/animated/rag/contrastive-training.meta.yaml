title: Contrastive training with a hard negative
alt: >-
  A layout figure in two panels, built in three steps. Each panel is a small embedding space with the question as an
  orange point in the middle and four pink points around it. In the left panel, titled "Today: the near miss is
  closest", the hard negative "Change your password" sits nearest the question at cosine 0.82, the positive "Lost
  phone: use a backup code" is a little farther at 0.77, and two easy negatives, "Track a parcel" at 0.30 and "Return
  an item" at 0.25, are far away. In step 2 lime arrows pull the positive towards the question and push the hard
  negative away, a note says the easy negatives get almost no push, and the loss reads 1.31. In step 3 the right
  panel, "After training on such examples", shows the positive nearest at 0.85, the hard negative pushed out to 0.60,
  the easy negatives where they were, and the loss at 0.01. Boxes underneath name the anchor question, the positive
  chunk, the hard negative and the easy negatives.
caption: >-
  Easy negatives teach almost nothing; the near miss is where the loss, and the learning, comes from.
tags: [rag, embeddings, contrastive-learning, genai]
