title: Semantic cache invalidation
alt: >-
  A table of five semantic cache entries, built in four steps. Each row has the cached question, the tenant, the
  article versions the answer was built from in blue, the time to live, and a status column. The rows are: how do I
  reset my password, Brightpost, reset v7, 24 hours; lost phone, can't sign in, Brightpost, reset v7 and 2FA v3, 24
  hours; is the winter sale still on, Brightpost, sale v2, 1 hour; where is my parcel, Brightpost, parcels v5, 24
  hours; and how do I reset my password for Tenant B, b-reset v4, 24 hours. Three event boxes sit under the table. In
  step 2, 1 hour passes and the sale entry's status reads expired. In step 3 the event reset article v7
  to v8, busts both entries built from reset v7, whatever their wording. In step 4 Tenant B asks for a purge and its
  entry is purged, and the parcel entry, untouched by all three, is still served. Versions and times are
  illustrative.
caption: >-
  Store what an answer was built from, and an article edit can find every cached answer it makes wrong.
tags: [rag, caching, semantic-caching, freshness, genai]
