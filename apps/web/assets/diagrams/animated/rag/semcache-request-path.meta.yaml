title: Semantic cache request path
alt: >-
  An architecture diagram in two lanes, built in seven steps. In the top lane, titled every question: look up first,
  the user's question about resetting a password goes to a normalise step that adds a tenant key, then to a pink
  embedding model with 1,536 dimensions, then to the semantic cache, the solid violet accent, which finds the nearest
  cached question at similarity 0.97. Because 0.97 is above the threshold of 0.92, a cache-hit card returns the stored
  answer in about 25 milliseconds. In step 5 a dashed edge labelled miss, below 0.92, runs down to the bottom lane,
  on a miss: RAG and the LLM, where retrieval fetches the top 5 chunks, the LLM answers in about 1.5 seconds in all,
  and the answer cites its articles. In step 6 an edge from the LLM back up to the cache stores the answer with a
  24-hour TTL and the versions of the articles it used. In step 7 a red edge labelled 0.94 at or above 0.92 leads
  from the cache to a red false-hit card: a question about changing a password got the cached answer for resetting
  one. Timings and scores are illustrative.
caption: >-
  A hit skips retrieval and the LLM; the threshold is the only thing standing between a hit and a wrong answer.
