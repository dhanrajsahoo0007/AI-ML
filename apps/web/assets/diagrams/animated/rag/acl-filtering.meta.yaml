title: Access control inside retrieval
alt: >-
  A sequence diagram with six lanes: customer, support agent, RAG app, identity provider, retriever and LLM. Step 1: a
  customer asks how to unlock a locked account; the app asks the identity provider for the user's groups and gets back
  customers. Step 2: the app searches with the filter customers; the retriever returns the top 5 chunks, all public,
  and the app answers the customer from public articles. Step 3: a support agent asks how to unlock a customer; the
  identity provider returns support-staff, the app searches with that filter, the retriever returns the top 5 with the
  runbook first, and the agent gets the steps with a citation to the runbook. Step 4, the failure: the app runs the
  customer's search with no filter, the runbook comes back first, the prompt holds it, the LLM's answer repeats its
  steps, and a note says the output check is too late because it drops the citation but not the copied steps. The
  customer receives staff-only steps without a link.
caption: >-
  The filter comes from the user's groups and runs inside the search; checking the answer afterwards cannot take back
  what the model has read.
