title: A layered answer flow against hallucination
alt: >-
  An architecture diagram built in eight steps. On the main line, a customer asks how to reset a password after losing
  a phone; a violet retriever fetches the top 5 chunks from the help centre; a lime evidence check asks whether the
  best chunk scores at least 0.70. If it does not, a dashed arrow leads up to a green Abstain card that says "I don't
  know" and returns to the customer without a guess. If it does, a green card drafts an answer that cites chunks [1]
  and [2], and a solid lime accent card checks each claim against the chunks. A red dashed arrow labelled 1 of 4
  unsupported leads up to a red Revise card that drops the claim and sends the draft back to be checked again.
  Supported answers go down to a Human review card for high-stakes topics, then to a green Answer card with 2 links,
  which is shown to the customer with its sources. A dashed arrow from the answer leads to a Measure card that logs
  and samples answers.
caption: >-
  Each layer catches what the one before it lets through: no evidence means no answer, and no claim leaves without a
  chunk behind it.
tags: [hallucination, rag, verification, genai]
