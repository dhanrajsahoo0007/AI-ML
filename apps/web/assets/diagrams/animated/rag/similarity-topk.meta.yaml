title: Similarity search and the top 5
alt: >-
  On the left, a two-dimensional sketch of the embedding space: pink points are chunks, and the orange point in the
  middle is the question. Ten nearby chunks are numbered 1 to 10 by rank, farther away as their similarity falls;
  ranks 2, 4 and 7 are shaded because they are relevant, and a few unrelated chunks sit in the corners. In step 2 a
  dashed orange ring around the question holds exactly ranks 1 to 5, and on the right a list shows the ten nearest
  chunks with their cosine similarity, from "Change your password" at 0.82 down to "Contact support" at 0.61, with a
  dashed line after rank 5 marked top 5. In step 3 red notes point out that rank 7, "No backup codes: verify your
  ID" at 0.69, is relevant but falls just outside the ring and the top 5.
caption: Near is not the same as needed; one chunk the answer needs is ranked 7th and is left out.
