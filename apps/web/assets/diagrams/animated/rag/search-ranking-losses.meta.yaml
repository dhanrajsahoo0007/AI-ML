title: Pointwise, pairwise and listwise ranking losses
alt: >-
  One query, "running shoes for flat feet", and three products: A, a stability running shoe with human label 2 and
  model score 1.2; B, a neutral running shoe with label 1 and score 1.5; C, running socks with label 0 and score 0.3.
  Below are three panels, one per step. Pointwise: each product's label and score with its squared error, 0.64, 0.25
  and 0.09, mean 0.33; the note says each item is fitted alone and the loss never checks the order. Pairwise: three
  pairs; A above B is marked wrong and highlighted because 1.2 is less than 1.5, while A above C and B above C are
  right; one of three pairs is out of order. Listwise: the model's ranking B, A, C with gains 1.00, 1.89 and 0.00;
  nDCG at 3 is 2.89 divided by 3.63, or 0.80, and swapping A and B would add 0.20, which is how LambdaMART weights
  each pair.
caption: >-
  The same mistake, B above A, looks small to a pointwise loss, is one wrong pair to a pairwise loss, and costs 0.20
  of nDCG to a listwise one.
tags: [search, ranking, learning-to-rank, ml-system-design]
