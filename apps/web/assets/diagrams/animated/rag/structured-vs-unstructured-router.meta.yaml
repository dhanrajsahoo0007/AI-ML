title: Routing between documents and data
alt: >-
  Three orange question cards stand on the left, one per step, and each feeds a neutral accent card in the middle,
  the router, which labels a question as docs, data or both. From the router two routes lead right: up to a teal help-centre card that runs hybrid search, and down to a violet text-to-SQL card that
  is read-only. Both routes lead on to a green LLM card on the right that writes one answer. Step 1: "What does error
  E1234 mean?" goes to the help centre, which passes passages to the LLM. Step 2: "How many orders were refunded last
  week?" goes to text-to-SQL, which passes rows and the SQL to the LLM. Step 3: "How many customers hit error E1234
  last week, and how do they fix it?" enters the router and uses both routes, so the LLM combines the count with the
  fix.
caption: >-
  Documents explain, databases count; the router decides which one a question needs, and a mixed question needs both.
tags: [rag, text-to-sql, query-routing, structured-data]
