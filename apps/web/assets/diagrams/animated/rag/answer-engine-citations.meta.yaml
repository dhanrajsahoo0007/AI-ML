title: Citations tie each sentence to a numbered passage
alt: >-
  At the top, an orange question box: what changed between HTTP/2 and HTTP/3? On the left, a group of four blue
  passages, numbered: [1] HTTP/3 maps HTTP onto QUIC, from RFC 9114; [2] QUIC is a UDP-based, multiplexed transport,
  from RFC 9000; [3] on TCP, one lost packet stalls every stream, from a CDN engineering blog; [4] QUIC's handshake uses
  TLS 1.3, from RFC 9001. In step 2 a group of green answer sentences appears on the right, each with an arrow to the
  passages it cites: "HTTP/3 carries HTTP over QUIC, not TCP" points to [1]; "QUIC runs on UDP with separate streams,
  so a lost packet stalls only its stream" points to [2] and [3]; "Encryption is built in: QUIC uses TLS 1.3" points
  to [4]. In step 3 a red fourth sentence, "HTTP/3 is always twice as fast as HTTP/2", has no arrow and is marked: no
  passage supports it, removed. A note says each finished sentence is checked against the passages it cites before it
  is shown, and 3 of 4 sentences are supported.
caption: >-
  A citation is a promise that the numbered passage says this; a sentence with no passage behind it does not ship.
tags: [rag, genai, citations, hallucination, case-study]
