title: Prompt, then retrieval, then fine-tuning
alt: >-
  An architecture in two lanes, built up in three steps. Step 1: in the online lane, the user's question goes into
  a versioned prompt, then to the LLM, then to an answer; an eval set of 200 questions in the offline lane gates
  every change to the prompt. Step 2 adds retrieval: the help centre of 1,200 articles is indexed offline into a
  vector index of 3,600 chunks, and each question also goes to a retrieve step that pulls the top 5 chunks from the
  index into the prompt. Step 3 adds fine-tuning: a training set of 3,000 graded replies feeds a fine-tuning job,
  LoRA, taking hours, whose tuned weights replace the base model behind the same prompt. The LLM is the accent; the
  answer cites the articles.
caption: Each lever is added only when the eval set shows the gap it closes, and each plugs into a different place.
