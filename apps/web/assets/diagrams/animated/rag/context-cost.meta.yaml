title: Tokens, latency and upkeep compared
alt: >-
  A table of four rows with a bar chart in the middle column, on a log scale with ticks at 100, 10 thousand and 1
  million tokens. Prompt only, in orange: 215 input tokens, no added latency, and an article change means editing
  the prompt. Fine-tuned model, in green: 65 tokens, no added latency, but an article change means training again.
  RAG with the top 5 chunks, in violet: 2,215 tokens, 35 milliseconds added for embedding and search, and an
  article change re-embeds its 3 chunks. The whole help centre pasted into the prompt, in red: 1.32 million tokens,
  more than a 1-million-token window, so it does not fit, although there would be nothing to rebuild.
caption: RAG pays a few thousand tokens and tens of milliseconds to keep facts editable; pasting everything does not even fit.
tags: [rag, fine-tuning, genai]
