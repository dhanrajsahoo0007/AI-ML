title: Fine-tuning loop for an embedding model
alt: >-
  An architecture diagram in two rows, built in seven steps. In step 1, in the top row, training: offline, blue search
  logs of clicked and solved questions feed a pastel blue card of training pairs, question and chunk. In step 2 a
  card in the bottom row, synthetic questions written by an LLM for every chunk, also feeds the pairs. In step 3 the
  pairs go to a lime card, negatives, mined and denoised, which also receives the top 30 candidates per question from
  index v1, built with the current model, along a dashed edge. In step 4 the negatives feed the fine-tuning job, a
  pink embedding model and the solid accent, trained with a contrastive loss. In step 5 the trained model is scored
  on a held-out set in a lime evaluate card, recall at 5 and nDCG. In step 6, only if it beats v1, a pink re-embed
  job reads 1.44 million tokens and writes all 3,600 chunks into index v2 in the rollout zone. In step 7 index v2 goes
  through a shadow test and then switches, and a dashed edge returns to index v1: the new index becomes the current
  one for the next round.
caption: >-
  Training is the short part; the gate that compares against the current model and the full re-index are what make
  a new embedding model safe to ship.
