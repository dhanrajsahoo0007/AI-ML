title: Reciprocal rank fusion
alt: >-
  On the left, two ranked lists of seven chunks for the same question. The teal BM25 ranking, marked illustrative, has
  "Reset a forgotten password" first, "No backup codes: verify your ID" second and "Lost phone: use a backup code"
  third. The violet vector ranking has "Change your password" first and "No backup codes: verify your ID" seventh. The
  three relevant chunks are shaded in both lists. In step 2 a lime box gives the formula: the RRF score is the sum over
  the lists of 1 over 60 plus the rank; for "No backup codes" that is 1 over 62 plus 1 over 67, which is 0.0161 plus
  0.0149, or 0.0311. In step 3 the fused ranking lists eight chunks with their working: "Reset a forgotten password"
  0.0325, "Change your password" 0.0320, "Lost phone: use a backup code" 0.0315, "No backup codes: verify your ID"
  0.0311, highlighted, and "Update your phone number" 0.0308, with a dashed line after rank 5. Below the line come
  "Locked out after failed sign-ins" 0.0303 and two chunks found by only one list at 0.0154. A note says the chunk moved
  from vector rank 7 to fused rank 4 because BM25 ranked it 2, and 3 of 3 relevant chunks are now in the top 5.
caption: >-
  Only ranks count: a chunk both lists place fairly high beats a chunk one list loves and the other misses.
