title: Filter after search against filter during search
alt: >-
  At the top, an orange box for a customer's question about resetting a password after losing a phone, plus a teal
  filter box: visible to customers. In step 2, the left panel, filter after search, lists the 5 nearest chunks with
  their similarity: a staff runbook at 0.83, Change your password at 0.82, a staff note on resetting a customer's
  two-factor at 0.81, Reset a forgotten password at 0.80, and a staff note on verifying a caller's ID at 0.79. The three
  staff-only rows are red and marked dropped, and a red box below says 2 chunks are left, not 5, so the answer misses
  the backup-code step. In step 3, the right panel, filter during search, lists the 5 nearest chunks that pass the
  filter, from Change your password at 0.82 down to Set up two-factor sign-in at 0.74, with Reset a forgotten password
  and Lost phone: use a backup code shaded as relevant; a teal box says 5 permitted chunks, including both articles
  the answer needs.
caption: >-
  Filtering after the search throws away 3 of 5 results; filtering inside the search keeps looking until it has 5.
tags: [rag, vector-search, access-control]
