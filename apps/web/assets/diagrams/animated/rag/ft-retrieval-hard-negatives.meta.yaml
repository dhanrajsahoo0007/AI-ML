title: Hard-negative mining
alt: >-
  A ranked list and three columns, built in four steps. Across the top, the orange training question: how do I
  reset my password if I lost my phone. Below it, the current model's top 8 chunks with their similarity: 1 Change
  your password 0.82, 2 Reset a forgotten password 0.80, 3 Update your phone number 0.78, 4 Lost phone: use a backup
  code 0.77, 5 Set up two-factor sign-in 0.74, 6 Locked out after failed sign-ins 0.71, 7 No backup codes: verify your
  ID 0.69, and 8 Delete your account 0.66. Ranks 2, 4 and 7 are shaded blue. In step 2 a role column marks those three
  as positive. In step 3 ranks 1, 3, 5 and 6 are marked hard negative in lime. In step 4 a cross-encoder column scores
  the four candidates 0.04, 0.06, 0.09 and 0.62, and a verdict column, keep if below 0.1, keeps ranks 1, 3 and 5 as
  negatives and marks rank 6 in red: drop, it may answer the question. A last line says the training example is the
  question, positives at ranks 2, 4 and 7, and hard negatives at ranks 1, 3 and 5. Cross-encoder scores are
  illustrative.
caption: >-
  The best negatives are the current model's own wrong answers, and the ones it ranks highest are also the most
  likely to be unlabelled right answers.
