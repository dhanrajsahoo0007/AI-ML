title: Product quantisation of one vector
alt: >-
  At the top, one chunk's vector drawn as a pink strip of 96 cells: 1,536 numbers times 4 bytes equals 6,144 bytes. In
  step 2, below it, sub-vectors 1 to 4 and 94 to 96 are drawn as pink boxes with their dimension ranges, 1 to 16 up
  to 1,521 to 1,536, with 89 more elided. In step 3 a zoom panel shows sub-vector 1 compared with its codebook of 256
  violet centroids, numbered 0 to 255; centroid 37 is the nearest and is highlighted, so the code stores 37, one byte.
  In step 4 every sub-vector has a violet one-byte code under it, such as 37, 201, 5 and 142, and two boxes give the
  sums: per vector 6,144 bytes become 96 bytes, 64 times smaller; for the index 3,600 times 96 bytes equals 345,600
  bytes, about 0.35 megabytes, against 22 megabytes of raw vectors.
caption: >-
  Each 16-number piece is replaced by one byte that names its nearest centroid, so a vector shrinks 64-fold.
