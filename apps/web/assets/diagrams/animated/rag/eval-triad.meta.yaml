title: The RAG evaluation triad
alt: >-
  A triangle built in four steps. At the top sits an orange box for the question, how to reset a password after
  losing a phone; at the bottom left a blue box for the retrieved context, the top 5 chunks; at the bottom right a
  green box for the answer, which cites two articles. In step 2 a lime box on the left side of the triangle, joined to
  the question and the context, names context relevance: is the context on topic, scored as the needed sentences
  divided by all sentences. In step 3 a lime box on the bottom side, joined to the context and the answer, names
  faithfulness: is every claim backed by the context, scored as backed claims divided by all claims. In step 4 a lime
  box on the right side, joined to the question and the answer, names answer relevance: does the answer address the
  question, scored with questions rebuilt from the answer. A note says each check is a score from 0 to 1 and an LLM
  does the reading.
caption: >-
  Three things, three checks: one about retrieval and two about generation, each comparing two of the three.
tags: [rag, evaluation, genai]
