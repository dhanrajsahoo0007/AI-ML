title: Condensing a follow-up question
alt: >-
  Left, a group titled "The chat so far" holds three messages: the customer's orange question "How do I reset my
  password if I lost my phone?", the assistant's green reply "Sign in with a backup code, then reset your password",
  and the customer's highlighted follow-up "And if I don't have backup codes?". A note says turn 2 has no subject of its
  own: whose password, which phone? In step 2, under "Searched as typed", the follow-up goes to search unchanged and
  finds a red result, "Set up two-factor sign-in", an article about making backup codes, not about having none. In step
  3, under "Condensed with the chat", an LLM reads turns 1 and 2 and rewrites the follow-up as the standalone orange
  question "How do I reset my password if I lost my phone and have no backup codes?". In step 4 that question finds the
  shaded blue chunk "No backup codes: verify your ID", the step the customer needs.
caption: >-
  A follow-up only makes sense with the turn before it, so rewrite it before it reaches search.
tags: [rag, retrieval, query-rewriting, conversation, genai]
