title: Keyword search and vector search
alt: >-
  A table with three questions down the left and two columns of results: a teal header, BM25 keyword search, which
  matches words, and a violet header, vector search, which matches meaning. Step 1: "How do I reset my password if I
  lost my phone?" Both columns find the shaded blue chunk "Reset a forgotten password": BM25 at rank 1 through shared
  words, vector search at rank 2 through the same meaning. Step 2: the paraphrase "Can't log in, phone was stolen".
  BM25 returns a red, wrong result, "Update your phone number", because it shares only the word phone; vector search
  finds the shaded chunk "Lost phone: use a backup code". Step 3: "What does error E1234 mean?" BM25 finds the
  highlighted chunk "Error E1234: session expired" by the exact code; vector search returns a red, wrong result,
  "Error E1243: card declined", a code that looks alike. A note says each method misses a question the other finds, so
  hybrid search runs both and fuses the lists.
caption: >-
  Each search misses a question the other finds: vectors miss the exact code, keywords miss the paraphrase.
tags: [rag, hybrid-search, retrieval, bm25, genai]
