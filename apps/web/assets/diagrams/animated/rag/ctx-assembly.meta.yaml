title: A context builder for a support agent
alt: >-
  An architecture built in five steps around a context builder, drawn as the accent in the centre. Step 1: the
  customer's message and a versioned set of instructions flow into the context builder, which sends the assembled
  context to the LLM. Step 2: a vector index of 3,600 help-centre chunks sends the top 5 chunks into the builder.
  Step 3: the LLM makes a tool call to the tools, such as get_order, and the results come back into the builder
  rather than straight to the model. Step 4: a memory store of facts about this customer feeds the builder, and the
  builder reads from and appends to a history store of every turn. Step 5: when the context passes 80 percent of the
  budget, the builder hands it to a compactor, which writes a summary back to the history store.
caption: Every source reaches the model through one builder, so one place decides what fits in the window.
tags: [context-engineering, agents, genai]
