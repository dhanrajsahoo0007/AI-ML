title: Corrective RAG loop
alt: >-
  A sequence diagram with five lanes: customer, RAG app, retriever, grader and LLM. Step 1: the customer asks how to
  reset a password after losing a phone; the app searches the retriever, gets the top 5 chunks, and asks the grader
  whether they are relevant; the grader answers weak, 2 of 5 relevant. Step 2: the app asks the LLM to rewrite the
  query, gets back "lost phone, no backup codes", searches again and gets 5 new chunks; the grader answers pass, 3 of 5
  relevant. A note says that if results are still weak after 2 tries, the app searches another source or says not
  found. Step 3: the app sends the LLM a prompt with the 3 passing chunks and the question and gets back a draft with 2
  citations. Step 4: the app asks the grader whether each claim is in a chunk; the grader answers supported, and the app
  sends the customer the answer with 2 links. A note says an unsupported claim is dropped, or the query is rewritten
  and retried.
caption: >-
  Nothing reaches the customer until the chunks pass one check and the answer passes another.
tags: [rag, corrective-rag, evaluation, genai]
