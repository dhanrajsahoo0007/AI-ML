title: IVF cells and probing
alt: >-
  On the left, a two-dimensional sketch of the vector space cut into 16 irregular cells by grey borders, standing for
  the 60 cells of the real index. Each cell has a violet centroid marked with a cross and a few pink points, the
  vectors filed under it. In step 2 an orange dot, the question, appears near where four cells meet. In step 3 the 4
  cells whose centroids are nearest the question get thick orange borders, with dashed orange lines from the question
  to those 4 centroids. In step 4 a red ring marks a pink point on the far side of a border, in a fifth cell: it is the vector
  nearest the question, and it is never compared. On the right, boxes give the numbers: k-means makes 60 cells of
  about 60 vectors each; search part 1 compares the question with all 60 centroids; part 2 opens the nearest 4 cells,
  4 times 60 equals 240 comparisons; 300 of 3,600 vectors compared, 8 percent; and a red box says a near vector over a
  border is missed, and raising nprobe trades more work for more recall.
caption: >-
  The question is closest to a vector in a cell it never opens: probing more cells is the fix, and the cost.
