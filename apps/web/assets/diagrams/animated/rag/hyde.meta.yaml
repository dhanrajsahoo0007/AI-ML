title: HyDE, hypothetical document embeddings
alt: >-
  Left, a flow from top to bottom; right, a two-dimensional sketch of the embedding space with pink points for chunks.
  In step 1 the orange question "How do I reset my password if I lost my phone?" is embedded and searched as typed:
  its orange point lands near "Change password" and "Update phone", articles that share its words but do not help.
  In step 2 an LLM writes a guessed answer in an orange box: sign in with a backup code, then reset your password; no
  codes, verify your ID with support. It is marked as a hypothetical answer that may be wrong. In step 3 a pink box
  embeds the guess into a row of pink cells, 1,536 numbers, and an arrow places the guess as a second orange point in
  the space, among the three shaded chunks the answer needs: "Reset password", "Backup code" and "ID check". In step 4
  a dashed orange oval around the guess holds those three chunks, and a note says search returns the real
  chunks near the guess, never the guess itself. Positions are illustrative.
caption: >-
  The guess may be wrong in its details; it only has to land in the right neighbourhood.
