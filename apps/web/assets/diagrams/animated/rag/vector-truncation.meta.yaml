title: Shortening an embedding
alt: >-
  A pink strip of 48 cells stands for a 1,536-dimension vector of 6,144 bytes, shaded darker at the start. In step 2
  a dashed line cuts it after 256 dimensions, and the first 8 cells become a short vector of 1,024 bytes, six times
  smaller, re-normalised to length 1. A line says the index for 3,600 chunks shrinks from about 22 MB to about 3.7 MB,
  and a red warning says this only works for models trained to be cut, such as Matryoshka models.
caption: A Matryoshka-trained vector can be cut short and still work; the index shrinks six times.
