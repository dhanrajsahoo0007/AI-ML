title: Index freshness, one edit from save to searchable
alt: >-
  An architecture diagram in two lanes, built in six steps. The top lane, the update path, is titled about 35 seconds
  from save to searchable, illustrative. An edit to a blue help article is saved at 0 seconds; a change event is
  queued at 1 second; a worker re-chunks the article, done at 32 seconds; a pink embedding model re-embeds its chunks,
  done at 34 seconds; the new vectors are upserted into the vector index, the solid violet accent, live at 35
  seconds. The bottom lane, the read path, shows a customer question asked before 35 seconds going to retrieval of
  the top 5 chunks; a dashed line from the index says it still returns the old 3 chunks of "Reset a forgotten
  password", and retrieval leads, inside the window, to a red stale answer with the old steps.
caption: >-
  An edit is not live when it is saved; until the new vectors land, every question gets the old article.
