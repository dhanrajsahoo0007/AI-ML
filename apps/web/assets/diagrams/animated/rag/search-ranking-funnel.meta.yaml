title: The search ranking funnel
alt: >-
  A funnel built in six steps. At the top, an orange box holds the shopper's query, "comfy running shoes for flat
  feet", and a blue box holds the catalog of 10,000,000 products; a note says the query is first corrected and parsed
  for synonyms, category and attributes. Both feed a wide violet box, retrieval with BM25 and dense embeddings fused
  together, which keeps about 1,000 candidates. Below it a narrower, highlighted lime box, learning to rank, keeps the
  top 100 using many features. A narrower lime box, the cross-encoder, reads query and product together and keeps the
  top 20. A grey box, business rules, applies diversity, stock, ads and de-duplication and fills a first page of 10.
  In the last step a dashed arrow runs from the business rules back up to the learning-to-rank box, labelled clicks
  and purchases retrain it. A footer says widths are on a log scale and the catalog and page sizes are illustrative.
caption: >-
  Each stage scores fewer products with a costlier model, so the precise models only ever see a few hundred.
tags: [search, ranking, learning-to-rank, ml-system-design]
