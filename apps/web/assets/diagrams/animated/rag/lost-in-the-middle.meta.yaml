title: Lost in the middle
alt: >-
  A U-shaped green curve on a chart of answer accuracy against where the relevant chunk sits in the prompt. Accuracy
  is higher when the chunk is at the start or at the end, labelled "used well", and lowest in the middle, labelled in
  red "used least". Under the axis, the prompt's five chunk slots are drawn in blue with the middle one, chunk 3, in
  red. A label says the chart shows the shape only, after Liu et al. (2023).
caption: Shape only, after Liu et al. (2023); the same chunk helps more at the edges of the prompt than in its middle.
