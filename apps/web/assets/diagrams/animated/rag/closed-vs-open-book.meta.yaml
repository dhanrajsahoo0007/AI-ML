title: Closed book and open book
alt: >-
  Two panels side by side. On the left, closed book: the question "How do I reset my password if I lost my phone?"
  goes straight to the LLM, which only has its training data, and the answer in red is generic steps from other
  sites, maybe out of date, with no source. On the right, open book: the same question goes to the same model
  together with three retrieved passages from Brightpost's help centre, "Reset a forgotten password", "Lost phone:
  use a backup code" and "No backup codes: verify your ID", numbered 1 to 3; the highlighted green answer gives
  Brightpost's own steps, use a backup code, citing passage 2, or else an ID check, citing passage 3.
caption: The model does not change; what changes is the evidence on the desk when it answers.
