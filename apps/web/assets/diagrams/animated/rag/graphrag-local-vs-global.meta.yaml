title: GraphRAG local and global search
alt: >-
  Two panels in two steps. Step 1, local search: the orange question "Why are backup codes rejected after a phone
  change?" leads to a violet node, backup code, the entity the question names. Arrows fan out from it to four boxes:
  two related entities, two-factor and new phone; ticket 5120, which mentions backup codes; and the summary of its
  community, C1. All four feed a grey box, rank and fit into one context window, which leads to a green answer: codes
  fail after a phone change, citing ticket 5120. Step 2, global search: the orange question "What are the most common
  reasons customers get locked out?" fans out to four green community summaries, C1 phone and two-factor, C2 sign-ins,
  C3 security and C4 billing. Each produces a partial answer with an illustrative score: 85, 90, 60 and 0; the
  billing one, scored 0, is dropped. The other three feed a grey box, sort by score and fill one context, which leads
  to the highlighted green answer: failed sign-ins, phone changes and security holds, in that order.
caption: >-
  Local search starts from the entities a question names; global search reads every community summary, so it can
  answer questions no single chunk or entity holds.
tags: [rag, graphrag, knowledge-graph, genai]
