title: Select, order and compress one turn's context
alt: >-
  Four rows of labelled blocks, one per build step, each showing the context for the same turn of Brightpost's
  support agent, when the customer asks about a cracked kettle on order 4471. Row 1, gather, holds 12,420 tokens in
  the order the pieces arrived: instructions, five old chunks about a password reset, twelve turns of history,
  memory, four tool definitions, five chunks about refunds, the full order record and the new message. Row 2,
  select, drops the five password chunks and the two weakest refund chunks, leaving 9,620 tokens. Row 3, order,
  keeps the same blocks but puts the stable parts first (instructions, tools, memory, history) so they can be cached,
  and the order record and the three refund chunks right before the message. Row 4, compress, turns the old history
  into a summary plus the last two turns and cuts the order record to four fields, leaving 5,140 tokens.
caption: The same turn costs 12,420 tokens as gathered and 5,140 after select, order and compress.
tags: [context-engineering, agents, genai]
