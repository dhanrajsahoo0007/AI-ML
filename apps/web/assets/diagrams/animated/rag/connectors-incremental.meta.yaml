title: Full sync against incremental sync with a cursor
alt: >-
  Three rows, revealed in three steps. Row 1, full sync every night: a strip of 24 shaded cells standing for all 1,200
  help articles, labelled 1,200 fetched a night, and under it, 7 nights times 1,200 equals 8,400 fetches a week. Row
  2, incremental from a cursor: a one-week timeline with eight dashed ticks, each the cursor saved by one night's run,
  and 12 blue dots for the articles that changed during the week; labelled 12 fetched a week, 12 of 1,200 articles
  changed this week, 1 percent, and only they are fetched. Row 3, in red, a deleted article with no row left to
  report: "changed since the cursor" never returns it, so its 3 chunks stay in the index. The fix: delete events
  (tombstones), or listing all 1,200 ids now and then and diffing.
caption: >-
  A cursor cuts a week's work from 8,400 fetches to 12, but it only sees rows that still exist; deletes need their
  own path.
tags: [rag, connectors, freshness, data-engineering]
