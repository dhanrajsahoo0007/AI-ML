title: Choose the lever from the gap
alt: >-
  A decision flow. At the top, an orange box: the best prompt you can write plus an evaluation set, "measure before
  choosing". An arrow leads to a question, "What is still wrong?", which branches four ways. Nothing
  left: ship the prompt, for example answers that were too long and a length rule fixed. Facts the model lacks: add
  RAG, in violet, for example the lost-phone question that needs two Brightpost articles. Format or behaviour:
  fine-tune, in green, for example tagging every ticket with one of 40 types in strict JSON. Both: RAG plus
  fine-tuning, for example citing the articles in Brightpost's house style.
caption: The lever follows the gap, and you only know the gap after you have measured the best prompt.
tags: [rag, fine-tuning, genai]
