title: Advanced RAG, one stage at a time
alt: >-
  An architecture diagram built in seven steps. Step 1 is basic RAG: a customer's question goes to a violet vector
  search, the top 5 chunks go to the LLM, and the answer with citations is shown back to the customer. Step 2 puts an
  orange rewrite stage between the question and the search; it writes several search queries and one hypothetical
  answer. Step 3 adds a teal BM25 keyword search under the vector search, fed by the same rewrites, and a lime RRF
  fusion stage, with k equal to 60, merges the two result lists. Step 4 adds the reranker, drawn as the solid lime
  accent: it reads the top 100 fused candidates and keeps 5. Step 5 adds a lime grade stage that checks whether the 5
  chunks are relevant; a dashed loop runs from the grader along the top of the figure back to the rewrite stage,
  labelled weak, rewrite and retry. Step 6 adds a lime compress stage that trims the chunks and puts the best first
  before the LLM. Step 7 adds a faithfulness check between the LLM and the answer, with a dashed arrow back to the
  rewrite stage labelled unsupported.
caption: >-
  Each stage closes one gap in the stage before it; the reranker is the step most systems get the most from.
tags: [rag, retrieval, reranking, genai]
