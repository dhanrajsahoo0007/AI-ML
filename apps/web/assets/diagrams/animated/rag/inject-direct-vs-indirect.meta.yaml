title: Direct and indirect prompt injection
alt: >-
  An architecture in two steps around Brightpost's support assistant, drawn as the accent, which can call a
  create_refund tool for any order. Step 1, direct injection: an attacker types the attack straight into the chat,
  and the assistant calls the refund tool; both arrows are red. Step 2, indirect injection: an honest customer asks
  a question, and to answer it the assistant reads three pieces of content, a web page, a customer email and a help
  article. The attacker never talks to the assistant; they plant hidden text in the web page, drawn in red. The
  assistant obeys the hidden text and calls the refund tool, again along red arrows, while the email and the help
  article feed it normally.
caption: In indirect injection the attacker never speaks to the assistant; the attack rides in on content it reads.
tags: [security, prompt-injection, agents, genai]
