title: Four kinds of agent memory
alt: >-
  Two groups side by side, built in four steps. The left group, short-term for this session, holds a green Support
  agent box above a violet Working memory box, the context window, holding order 4471 and the cracked kettle; an arrow
  shows the agent reading it. The right group, long-term across sessions, holds three violet boxes, each with a grey
  stored-as cell beside it. Semantic memory holds facts such as "prefers email" and is stored as a profile record.
  Episodic memory holds what happened, such as "12 Nov: £42 kettle refund approved", and is stored as an event log
  with vectors. Procedural memory, highlighted, holds how to act, such as "damaged item: ask for a photo first", and
  is stored in the prompt or a rules file. Arrows run from working memory to semantic memory, labelled save facts, and
  to episodic memory, labelled log outcomes, and from episodic to procedural memory, labelled distil a lesson.
caption: >-
  Each memory type answers a different question, so each needs its own store and its own rules for writing and
  forgetting.
