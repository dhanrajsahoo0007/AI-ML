title: The context window as a budget
alt: >-
  Five stacked horizontal bars, one per turn of Brightpost's support agent, on a scale where the full width is a
  32,000-token window. Each bar starts with the same fixed parts: 1,200 tokens of instructions, 1,000 of tool
  definitions, 600 of memory about the customer and 2,000 of retrieved chunks. After them come the conversation
  history, growing by 300 tokens a turn, and tool results, growing by 1,200 a turn. Turn 1 uses 6,300 tokens, turn 7
  uses 15,300 and turn 14 uses 25,800, which passes a dashed line at 80 percent of the window marked "compact". A
  fourth bar shows turn 19 without compaction at 33,300 tokens, running past the window edge with the overflow in
  red. The last bar shows turn 14 after compaction: the history becomes a 400-token summary plus the last two turns,
  only the latest tool result is kept, and the total falls to 7,000 tokens.
caption: The fixed parts barely move; history and tool results grow every turn until compaction resets them.
