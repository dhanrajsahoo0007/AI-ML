title: Isolating context with sub-agents
alt: >-
  An architecture in two steps for a customer who disputes charges. In step 1, a lead agent with a 32,000-token
  budget reads three sources itself, the orders database, the help centre of 3,600 chunks and the customer's past
  tickets, along red dashed lines labelled 60,000 tokens into one window, which does not fit. In step 2, three
  sub-agents appear in a zone labelled "own windows": an orders agent, a policy agent and a tickets agent. Each reads
  about 20,000 tokens from its own source and sends a summary of about 1,500 tokens back to the lead agent, which is
  drawn as the accent.
caption: Each sub-agent spends its own window exploring; the lead reads 4,500 tokens of findings instead of 60,000.
tags: [context-engineering, agents, multi-agent, genai]
