title: Parsing a help article into typed elements
alt: >-
  On the left, the help article "Recover two-factor access" as an HTML page, drawn as seven blocks: a menu, the title,
  the heading "If you lost your phone", a two-sentence paragraph, a two-step numbered list, a table and a footer. In
  step 2 the menu and the footer are marked dropped. In step 3 arrows map the five remaining blocks to typed elements
  on the right, title, heading, paragraph, list kept whole and table whose rows keep their header, and each element
  gets a teal metadata cell: the URL and updated date for the title, and the section number for the rest.
caption: Parsing decides what the chunker can see; drop the boilerplate and keep lists and tables whole.
tags: [rag, parsing, chunking]
