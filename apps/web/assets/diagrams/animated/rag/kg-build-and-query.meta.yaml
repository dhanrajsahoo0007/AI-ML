title: Knowledge graph, built offline and walked per question
alt: >-
  An architecture diagram in two lanes, built in eight steps. In the top lane, offline, Brightpost's engineering
  documents, such as incident notes and the service catalogue, go to a green LLM that extracts entities and relations
  using the ontology; a resolve stage merges duplicate entities; a validate stage checks every fact against the
  ontology rules; the facts land in the graph store, drawn as the solid violet accent. In the bottom lane, per
  question, the orange question "Which team owns the service that failed in last week's incident?" goes to entity
  linking, which finds the incident INC-311 in the graph; the graph walk follows two edges from the incident, read
  from the graph store; the path and the chunks it came from are built into the context; the green LLM answers
  "Payments team", citing the path, and the answer is shown to the user with the path.
caption: >-
  The graph is built once from documents; each question starts at a node it names and follows edges, not similarity.
