title: A connector's five duties
alt: >-
  An architecture diagram in three zones, built in seven steps. On the left, four blue sources: the help centre CMS
  with its articles, a ticketing system with solved tickets, the internal wiki with runbooks, and a shared drive of
  PDFs and slides. Arrows from all four meet at a dark connector card, the fetch loop, in the middle zone, titled
  connector, one per source. Dashed spokes from the connector lead to its five duties: auth with a scoped token,
  incremental sync since a cursor, rate limits with back-off on HTTP 429, deletes recorded as tombstones, and, in
  teal, permissions captured as an ACL per document. An arrow labelled text plus metadata leads to the output zone:
  a blue normalised document in one format, which flows down into the ingestion pipeline, parse to index.
caption: >-
  Every source speaks its own API; the connector absorbs the differences so ingestion sees one document format with
  permissions and deletes already attached.
