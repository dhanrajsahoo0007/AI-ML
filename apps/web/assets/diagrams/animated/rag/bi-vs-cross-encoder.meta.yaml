title: Bi-encoder and cross-encoder
alt: >-
  Two panels. Left, the bi-encoder used for retrieval: the orange question, lost my phone, goes through a pink encoder
  and becomes a row of pink vector cells; separately, the blue chunk "No backup codes" goes through its own pink
  encoder, once and offline, and its vector is kept in the index. Arrows from both vectors meet in a lime cell, cosine
  0.69. A note says the 3,600 chunk vectors are made once, at ingestion, and a question costs one encoding and one
  index search. Right, in step 2, the cross-encoder used for reranking: the question and the chunk sit side by side as
  one input and both arrows go into a lime cross-encoder that reads both at once and outputs a score of 0.91. A note
  says it is one model run per pair, and 100 pairs take about 120 milliseconds, illustrative.
caption: >-
  The bi-encoder never sees the question and the chunk together; the cross-encoder does, which is why it ranks better
  and costs more.
