title: Lineage of one RAG answer
alt: >-
  Four columns built left to right in four steps, joined by arrows, each with a question above it. Step 1, what did
  the user see: a green answer asked on 14 November 2026, with trace id t-8c1f, citation 2 pointing at chunk a-0412#2,
  and prompt version 14. Step 2, which text did the model read: a blue cited chunk a-0412#2 covering tokens 350 to
  750, a pink cell saying it was embedded by embed-v2, and a violet cell saying index snapshot 2 served it. Step 3,
  which version of the article: a blue document version, a-0412 version 7, with content hash 4b7e, highlighted,
  updated on 2 October 2026 and included in corpus c42. Step 4, where did it come from: a violet source record in the
  help-centre CMS, article 412 revision 7, edited by the support team, readable by the public. A note says every hop
  is an id stored when the data was written, so tracing is a lookup.
caption: >-
  An answer is traceable only if every hop was written down at the time: chunk id, model, snapshot, content hash,
  source revision.
tags: [rag, lineage, versioning, governance, genai]
source: original
