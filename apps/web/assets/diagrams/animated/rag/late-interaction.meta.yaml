title: Late interaction and MaxSim
alt: >-
  A layout figure built in three steps. A grid compares six question tokens, written in orange down the left (how,
  reset, password, if, lost, phone), with eight chunk tokens, written in blue across the top (lost, phone, sign, in,
  backup, code, reset, password) from the chunk "Lost phone: use a backup code". Each pink cell holds the similarity
  of one pair, shaded darker when higher; the strongest are reset with reset 0.92, password with password 0.95, lost
  with lost 0.90 and phone with phone 0.94. In step 2 a lime MaxSim column lists each question token's best match:
  0.35, 0.92, 0.95, 0.30, 0.90 and 0.94. In step 3 a bracket gathers them into a highlighted lime box, the sum of
  MaxSim equals 4.36 over six query tokens, and below it a grey box gives the one-vector bi-encoder cosine for the
  same chunk, 0.77, on a different scale.
caption: >-
  Each question word finds its own best match in the chunk; the score is the sum of those best matches.
