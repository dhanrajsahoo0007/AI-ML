title: Re-embedding migration with two indexes
alt: >-
  An architecture diagram built in six steps. In step 1, changed chunks from ingestion are written to index v1, built
  with the old model, and live questions reach v1 through an alias called help-search. In step 2 a second index, v2,
  built with the new model and drawn as the solid violet accent, appears below v1, and the changed chunks are dual
  written to it. In step 3 a backfill job re-embeds every chunk, 1.44 million tokens, into v2. In step 4 a lime shadow
  compare card receives a copy of each question, queries v2, and compares the results on a golden set. In step 5 the
  alias switches from v1 to v2. In step 6 a retire card deletes v1 after the rollback window; the full view shows only
  the end state, with the alias pointing at v2.
caption: >-
  The old index keeps serving until the new one has every chunk and has matched it on real questions; the switch is
  one alias flip, and so is the rollback.
