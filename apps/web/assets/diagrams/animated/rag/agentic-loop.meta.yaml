title: Agentic RAG loop
alt: >-
  A sequence diagram with four lanes: customer, agent (an LLM), search tool and index. Step 1: the customer asks how
  to reset a password after losing a phone, and the agent writes itself a plan: find the reset steps, then two-factor
  recovery. Step 2: the agent calls the search tool with "reset password"; the tool embeds the query, takes the top 5
  from the index and returns 5 chunks with their titles. Step 3: the agent reads them, notes that 2 of the 5 are
  useful, and spots a gap: what if the customer has no backup codes? Step 4: the agent searches again for "no backup
  codes"; the tool queries the index again and returns the article "No backup codes: verify your ID". Step 5: the
  agent decides three sources cover the question, stops, and sends the customer an answer with 3 citations. A note
  says the budget is at most 3 searches, then answer or hand over to a person.
caption: >-
  The model decides what to search for and when to stop; the second search exists only because it read the first
  results and found a gap.
