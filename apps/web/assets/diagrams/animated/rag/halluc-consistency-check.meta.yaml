title: A sampling consistency check for hallucinations
alt: >-
  A grid built in four steps. On the left, an orange box holds the question "How do I reset my password if I lost my
  phone?", asked with no retrieved chunks. An arrow leads to the main answer, split into three green claims: Choose
  'Forgot password', Enter a backup code, and Call 020 7946 0321. To the right, four columns labelled S1 to S4 are
  four more answers sampled at temperature 1, and each cell says whether that sample supports the claim. The first
  claim gets yes in all four, the second gets yes in three and no in one, and the phone number gets no in all four. A
  score column gives the share of samples that disagree: 0.00 and 0.25 in lime, and 1.00 in red. A red dashed frame
  surrounds the phone-number claim, with the note that each sample made up a new number; a line under the grid says
  the score is the share of samples that disagree and claims at 0.5 or more are flagged.
caption: >-
  A fact the model knows comes back in every sample; a detail it invents changes each time.
tags: [hallucination, selfcheckgpt, evaluation, genai]
