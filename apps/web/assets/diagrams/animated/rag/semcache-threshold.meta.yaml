title: Semantic cache threshold
alt: >-
  A dot plot of nine pairs of support questions, each a new question and the nearest cached question, placed on a
  similarity axis from 0.85 to 1.00. The top group, same answer, a hit is right, holds five orange dots: how do I
  reset my password against how can I reset it at 0.97, cancel my order against how do I cancel an order at 0.96, I
  forgot my password against reset my password at 0.95, phone was stolen against lost my phone at 0.91, and where is
  my parcel against track my order at 0.88. The bottom group, different answer, a hit is wrong, holds four dots:
  change my password against reset my password at 0.94, shown in red and highlighted, cancel my order against cancel
  my subscription at 0.90, refund to my card against refund as store credit at 0.89, and update my phone number
  against update my email at 0.87. In step 2 a dashed lime line at 0.92 gives 3 of 5 hits and 1 false hit of 4, the
  password change. In step 3 a second line at 0.96 gives 2 of 5 hits and no false hits. The numbers are illustrative.
caption: >-
  The two groups overlap, so every threshold trades hits for false hits; “change” against “reset” sits above
  pairs that really mean the same thing.
