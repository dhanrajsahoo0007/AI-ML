title: Incremental re-indexing with content hashes
alt: >-
  A table and two bars, built in three steps. The table shows 5 of Brightpost's 1,200 help articles with two hash
  columns, the stored hash from the last indexing and today's hash. Four articles have equal hashes and get "no" in
  the re-embed column; "Reset a forgotten password" has different hashes, is shaded blue, and gets "yes, 3 chunks" in
  pink. A line under the table says 12 of 1,200 articles changed this week. Below, two bars on one scale compare the
  chunks sent to the embedding model: a full-width bar for re-embedding everything, 3,600 chunks, and a highlighted
  sliver one hundredth as long for the hash-changed articles, 12 times 3 equals 36 chunks, 1 percent.
caption: >-
  Comparing hashes finds the 12 changed articles, so the embedder sees 36 chunks instead of 3,600.
tags: [rag, freshness, embeddings, genai]
