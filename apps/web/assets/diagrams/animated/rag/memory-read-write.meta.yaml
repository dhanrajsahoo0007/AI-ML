title: Agent memory read before the model call and written after it
alt: >-
  An architecture diagram built in six steps. Along the top, a customer writing a week after a kettle refund sends a
  message that joins the violet Recent turns card, short-term memory, which feeds a Build context card. Below, an arrow
  labelled latest takes the message to a pink Embed card, which searches the solid violet accent Memory store, kept
  per customer; the store returns its top 3 memories up to Build context. Build context feeds the green Support agent,
  the LLM, whose reply, refunded, returns to the customer along the top. After the reply, the agent passes the
  conversation to a green Memory writer that extracts facts; the new fact, prefers text, goes down to a violet Check
  and save card that looks for duplicates and conflicts, and an arrow labelled replaces email saves it into the store.
  At the bottom, a User controls card has a two-way arrow to the store labelled view, edit, delete.
caption: >-
  Memory is two pipelines around one model call: recall before it, write after it, with a check before anything is
  saved.
