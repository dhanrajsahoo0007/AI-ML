title: Measuring retrieval and generation
alt: >-
  On the left, the ten results for one question with their similarity scores; ranks 2, 4 and 7 are shaded as
  relevant, and an orange dashed line after rank 5 is marked k equals 5. In step 2 three lime boxes compute the
  retrieval metrics from that list: recall at 5 equals 2 of 3, which is 0.67; MRR equals 1 over 2, which is 0.5,
  because the first relevant chunk is at rank 2; and nDCG at 10 equals 1.39 over 2.13, which is 0.65, rewarding
  relevant chunks near the top. In step 3 two green boxes name the generation checks: faithfulness, whether every
  claim is backed by a chunk, and answer relevance, whether the answer answers the question.
caption: Score retrieval and generation separately; one ranked list gives three different retrieval numbers.
