title: In-batch contrastive loss
alt: >-
  A score matrix built in three steps. Three orange question boxes form the rows: reset password, lost phone; where
  is my parcel; and return a gift. Three blue passage boxes form the columns under the title passages in the batch:
  Lost phone: backup code, Track a parcel, and Return an item. In step 1 only the diagonal is filled, in pastel lime,
  each question with its own passage: 0.77, 0.74 and 0.71. In step 2 the other cells appear in neutral, each
  question's similarity to the other questions' passages, between 0.19 and 0.35, and a line reads in-batch negatives
  only: loss 0.0004. In step 3 three more columns appear under the title mined hard negatives: Change your password,
  Change address and Exchange an item. For the first question, Change your password scores 0.82, higher than its
  positive at 0.77, and that cell is highlighted; the other two questions score their hard negatives at 0.66 and
  0.63. A line reads with hard negatives: loss 0.56, row 1: 1.31. Scores other than 0.77 and 0.82 are illustrative.
caption: >-
  Every other passage in the batch is a free negative, but an easy one; the mined column that outscores the positive
  is where the loss comes from.
tags: [rag, embeddings, contrastive-learning, fine-tuning, genai]
