title: A minimal ontology for incidents, services and teams
alt: >-
  Five boxes joined by labelled arrows. Across the top are three violet entity types: Incident, with an id, date and
  severity; Service, with a name and tier; and Team, with a name and on-call rota. An arrow labelled AFFECTED runs
  from Incident to Service, and one labelled OWNED_BY runs from Service to Team. Below, the highlighted blue box
  Document chunk, holding text and a vector, receives two arrows labelled MENTIONED_IN, one from Incident and one from
  Service. An arrow labelled FROM_SOURCE runs from the chunk to a grey Source box holding the URL, date and confidence.
caption: >-
  Types and relations are the schema; the MENTIONED_IN links to chunks are what let the graph and the vector index
  work together.
tags: [rag, knowledge-graph, ontology, genai]
