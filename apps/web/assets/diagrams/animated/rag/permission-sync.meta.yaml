title: Permission sync, one ACL change from source to index
alt: >-
  An architecture diagram in two lanes, built in six steps. The top lane, the sync path, is titled up to 15 minutes
  from change to enforced, illustrative. The runbook's ACL is edited in the wiki at 0 minutes; a connector that syncs
  permissions every 15 minutes picks the change up; wiki users and groups are mapped to identity-provider group ids;
  only the ACL metadata of the runbook's 3 chunks is patched; the vector index, the solid violet accent, serves the
  new ACL. The bottom lane, the read path, shows a customer asking about a locked account within the window. The
  request goes to retrieval as a customer; a dashed line from the index says the old ACL on "Runbook: unlock a locked
  account" is still everyone, and retrieval leads, because the chunk passes the filter, to a red node: the runbook
  leaks.
caption: >-
  A permission change is not enforced when it is saved; until the connector syncs it, retrieval filters with the old
  ACL.
