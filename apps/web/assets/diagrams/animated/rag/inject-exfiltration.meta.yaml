title: The lethal trifecta and two exfiltration paths
alt: >-
  An architecture in four steps with three zones, one for each leg of the lethal trifecta. On the left, an untrusted
  web page with hidden text, in red, sends instructions to the assistant, drawn as the accent in the middle, and the
  customer's account, private data in violet, is read by the same assistant. On the right, in a zone of outbound
  channels, are a chat window that renders markdown and a send_email tool. Further
  right is the attacker's server. Step 2 shows path A in red: the assistant's reply contains an image URL carrying
  the customer's data, and the chat window fetches it from the attacker's server. Step 3 shows path B in red: the
  assistant calls send_email with the data, addressed to the attacker. Step 4 cuts the outbound leg: the chat window
  loads images only from the shop's own domains and send_email writes only to the signed-in customer, so both
  routes to the attacker are marked blocked.
caption: Any one leg of the trifecta is safe; together they leak data, so cut the outbound leg first.
tags: [security, prompt-injection, agents, genai]
