title: The RAG evaluation loop and release gate
alt: >-
  An architecture diagram built in seven steps. In step 1 an orange card holds the golden set of 200 labelled
  questions. In step 2 the candidate pipeline runs on every question. In step 3 its retrieved chunks go up to a lime
  card that scores retrieval with recall at 5 and MRR. In step 4 its answers go down to a green LLM judge that scores
  faithfulness, and a card of 50 answers graded by people feeds the judge with a dashed calibrate line. In step 5 both
  scores meet in a dashboard that compares the change with the baseline. In step 6 the dashboard feeds a release
  gate, drawn as the solid accent, which sends a change that drops nothing up to ship, where it becomes the new
  baseline. In step 7 the gate sends a change whose recall at 5 fell down to a red blocked card.
caption: >-
  Every change runs the same golden questions; retrieval and answers are scored separately, and a drop in either stops
  the release.
