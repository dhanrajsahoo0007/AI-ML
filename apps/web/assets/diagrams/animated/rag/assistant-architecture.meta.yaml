title: Enterprise AI assistant architecture, built step by step
alt: >-
  An architecture diagram built in eight steps, with dotted zones for clients, edge, the core request path, application
  services, storage, the async pipeline and company systems. A signed-in employee talks to an API gateway. In the core
  request path, a solid green orchestrator sends a prompt to the LLM; at first the gateway calls the orchestrator
  directly and the LLM's answer goes straight back to the gateway. Step 2 adds a retriever that searches a search index
  of chunks and their access lists. Step 3 adds connectors that copy company documents from wikis and drives into the
  index, with their permissions. Step 4 adds an intent router above the orchestrator, with a dashed path to a human
  handoff. Step 5 adds a tool agent that calls company APIs for tickets and HR, and asks the employee to confirm first.
  Step 6 adds a memory store of chat history and preferences that feeds the orchestrator. Step 7 puts guardrails
  between the gateway and the orchestrator, so the input is checked on the way in and the LLM's draft is checked on
  the way out. Step 8 adds an observability service that receives every turn from the gateway as a dashed line.
caption: >-
  One orchestrator routes each message to a cited answer, a confirmed action or a person, and guardrails sit on both
  sides of it.
