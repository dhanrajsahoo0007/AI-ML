title: Vector search against a graph walk on a multi-hop question
alt: >-
  A comparison in three steps under one orange question: "Which team owns the service that failed in last week's
  incident?" On the left, vector search returns the three nearest chunks as blue boxes with illustrative similarity
  scores: the INC-311 postmortem saying checkout-api timed out (0.81), the checkout-api runbook on how to restart it
  (0.78), and the incident review process saying who writes the postmortem (0.74). Red text under them says no chunk
  says who owns checkout-api, so the model guesses the team. On the right, the question links to the violet node
  INC-311, an Incident; an arrow labelled AFFECTED leads to checkout-api, a Service; an arrow labelled OWNED_BY leads
  to the highlighted node Payments team, a Team. Text under it says the last node is the answer.
caption: >-
  Each chunk is similar to the question, but the answer lies in the link between two facts; only the graph walk
  follows it.
tags: [rag, knowledge-graph, retrieval, genai]
