title: Embedding batch pipeline
alt: >-
  An architecture diagram built in six steps. Along the top, a blue card of changed chunks, 36 this week, goes to a
  durable queue and then to a batcher that sends 100 chunks per call. The batcher hashes each chunk and checks a
  violet hash cache keyed by the text and the model. Cache hits go straight to the vector index, the solid violet
  accent, which upserts by chunk id. Misses only go down to the pink embedding model, 1,536 dimensions, whose new
  vectors also go to the index. When the model call fails, a red card for a 429 or a timeout says wait and retry, and
  a dashed line puts the batch back on the queue.
caption: >-
  Only text the cache has never seen reaches the model, and a retried batch overwrites by chunk id instead of
  duplicating.
