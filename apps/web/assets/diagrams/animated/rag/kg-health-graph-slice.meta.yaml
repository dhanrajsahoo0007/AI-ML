title: A slice of a medical knowledge graph
alt: >-
  Seven boxes joined by labelled arrows. Drug A, on the left, INTERACTS_WITH, with major severity, the highlighted Drug
  B in the middle, and Drug B is CONTRAINDICATED_IN Renal impairment on the right. Above renal impairment, a Lab eGFR
  result, with its LOINC code and value, INDICATES it. Above Drug A, a Gene variant AFFECTS_METABOLISM_OF it, and a
  blue Guideline section RECOMMENDS it. Below Drug A, Drug A TREATS a Condition. Drugs carry RxNorm codes and
  conditions SNOMED CT codes.
caption: >-
  Two paths end at Drug B, one through an interaction and one through a lab result; each path is one safety rule.
