title: Text-to-SQL flow
alt: >-
  An architecture diagram in six steps for the question "How many orders were refunded last week?". Step 1: an orange
  question card on the top left goes to a violet schema lookup card, which picks 2 of 40 tables with help from a
  schema catalog card below it that holds table and column notes. Step 2: a green LLM card to the right writes one
  SELECT from the question and the schema. Step 3: the SQL goes to the validator, a neutral accent card with a shield
  inside a group titled "Guarded execution", which runs four checks. Step 4: a red edge marked "unsafe" leads from the
  validator to a red "Rejected" card under the LLM, and a dashed edge marked "retry once" returns the error to the
  LLM. Step 5: approved SQL goes down to a violet read replica card with a 5-second timeout. Step 6: the rows go left
  to a green "Answer + SQL" card that reports 312 refunds and shows the SQL that ran.
caption: >-
  The model only proposes SQL; a validator decides whether it runs, and the answer shows the query so a person can
  check it.
