title: Hybrid search with fusion and reranking
alt: >-
  An architecture read left to right. An orange question card on the left sends the same query up to a teal BM25
  search over an inverted index and down to a violet vector search over 3,600 vectors, in parallel. In step 2 each
  search passes its top 100 to a lime card, RRF fusion with k = 60, which merges the two lists by rank. In step 3 the
  fused list goes to the accent card, a lime cross-encoder reranker that keeps 5 of the 100, and on to a neutral card,
  the top 5 chunks, 2,000 tokens. In step 4 a teal filter card for tenant and access sits between the two searches;
  dashed lines from the question to the filter and from the filter to both searches show that both lists come from
  the same permitted chunks.
caption: >-
  Two searches find different chunks; fusion merges them by rank and the reranker decides the final order.
tags: [rag, hybrid-search, reranking, retrieval, genai]
