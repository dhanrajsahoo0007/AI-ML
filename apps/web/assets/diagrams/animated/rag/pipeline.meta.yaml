title: The RAG pipeline, offline ingestion and online answering
alt: >-
  An architecture diagram in two lanes, built in eight steps. In the top lane, offline ingestion, Brightpost's help
  centre of 1,200 articles is parsed from HTML into clean text, split into chunks of 400 tokens each, and each chunk
  is turned by a pink embedding model into a vector of 1,536 numbers; the 3,600 vectors and their metadata go into the
  vector index, drawn as the solid violet accent. In the bottom lane, online answering, a signed-in user asks how to
  reset a password after losing a phone; the same embedding model turns the question into a vector; the retriever
  fetches from the index the 5 nearest chunks the user is allowed to see; the chunks and the question are combined
  into one prompt of about 2,200 tokens; the green LLM writes the answer, which cites two articles and is shown to the
  user with links.
caption: >-
  Two pipelines share one index and one embedding model: ingestion runs ahead of time, answering runs per question.
tags: [rag, retrieval, embeddings, genai]
