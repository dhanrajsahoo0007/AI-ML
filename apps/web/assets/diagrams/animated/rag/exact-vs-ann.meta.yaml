title: Exact search against an ANN index
alt: >-
  Two panels, each with an orange question vector above a grid of 60 tiles, where one tile stands for 60 of
  Brightpost's 3,600 vectors. On the left, exact search, every tile is pink because the question is compared with all
  3,600 vectors: 3,600 comparisons of 1,536 numbers each, 5,529,600 multiply-adds, with 100 percent recall. On the
  right, an IVF index, the tiles are its 60 cells; only a block of 4 tiles is pink, because the question is compared
  with the 60 cell centroids and then with the vectors in the 4 nearest cells: 60 plus 4 times 60 equals 300
  comparisons, 460,800 multiply-adds, 12 times less work. One tile next to the block is outlined in red, and a red
  note says a true neighbour in a fifth cell is missed.
caption: >-
  The index buys a 12-fold cut in work by never looking at most vectors, which is also how it can miss one.
