title: Three levers on one model call
alt: >-
  In the middle, one model call drawn as a stack: an orange box of instructions and examples of about 200 tokens, a
  blue box of retrieved passages, five of 400 tokens each, 2,000 tokens in all, and an orange box for the 15-token
  question, all feeding a green box for the LLM's weights. On the left, three levers appear one per step. Prompt
  engineering points at the instructions, and the note on the right says it can change any time with no training.
  The vector index holds 3,600 help-centre chunks and fills the passages box; the note says this
  happens on every request. Fine-tuning trains on examples and points at the weights; the note says they change
  once per training run.
caption: Prompting changes the words, RAG changes the evidence, fine-tuning changes the model; each changes at a different speed.
tags: [rag, fine-tuning, genai]
