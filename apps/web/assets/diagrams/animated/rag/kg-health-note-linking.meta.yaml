title: Linking a clinical note to the patient graph
alt: >-
  A flow from left to right. A blue note reads "Pt started on warfarin, no hx of bleeding". Two arrows lead from it to
  teal mentions: "bleeding", linked to a SNOMED CT finding and marked negated, and "warfarin", linked to an RxNorm drug.
  The bleeding mention leads to the highlighted violet fact "Patient NOT_HAS bleeding", a history taken from this note;
  a dashed arrow leads to a red box, "Patient HAS bleeding", the fact written if the word "no" is dropped. The warfarin
  mention leads to the violet fact "Patient TAKES warfarin", with the start date from the note, which feeds an
  interaction check against new prescriptions.
caption: >-
  The negation cue decides which fact lands in the graph; drop it and the chart says the opposite of the note.
tags: [rag, knowledge-graph, clinical-nlp, case-study, healthcare, genai]
