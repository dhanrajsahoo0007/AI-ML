title: Four ways to chunk the same article
alt: >-
  The 1,100-token article "Recover two-factor access" is split four ways on one token axis, one row per strategy.
  Fixed size cuts at 400 and 800 tokens, and a red bracket shows the key sentence split at token 400. By structure
  gives one chunk per section, intro, "Lost your phone", "No backup codes" and help, and the sentence stays whole in
  its section. Semantic chunking cuts where the meaning shifts, at about 260 and 600 tokens. Parent and child keeps
  the whole "Lost your phone" section as a parent and splits it into four children of 110 tokens; the note says the
  children are searched and the 440-token parent is sent to the model.
caption: The cut points decide whether the key sentence survives; structure-aware cuts follow the author's own sections.
