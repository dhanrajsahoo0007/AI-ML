title: Contextual chunks
alt: >-
  A blue chunk reads "If you lost your phone, use one of your backup codes to sign in", with a note that on its own
  it does not say which account, app or product. In step 2 a green box shows a 50 to 100 token context written by an
  LLM, "Brightpost help, Recover two-factor access", which is joined in front of the chunk; the joined text is
  embedded and indexed for BM25. In step 3 four red bars show Anthropic's measured top-20 retrieval failure rate:
  5.7 percent at baseline, 3.7 percent with contextual embeddings, 2.9 percent adding contextual BM25 and 1.9 percent
  adding reranking.
caption: A sentence of document context makes a chunk findable on its own; Anthropic measured a third fewer misses from it.
tags: [rag, chunking, contextual-retrieval]
