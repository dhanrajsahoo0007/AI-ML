title: A vector database, write path and read path
alt: >-
  An architecture diagram in two lanes, built in eight steps. In the top lane, the write path, Brightpost's 3,600
  chunks are turned by a pink embedding model into vectors of 1,536 numbers; each vector is upserted with its
  metadata, such as its article and who may read it; the write log records the write so it survives a crash; and the
  ANN index, drawn as the solid violet accent, makes the 3,600 vectors searchable. In the bottom lane, the read path, a
  customer's question about a lost phone is embedded by the same model. From the same question, the user's groups go
  down to a teal filter that says what this user may read. The ANN search takes the question vector and the filter,
  walks the index, and returns the top 5 chunk ids with their scores, which go on to the prompt builder of the RAG
  pipeline.
caption: >-
  Writes and reads meet at one index; the filter is part of the search, not a step after it.
