title: HNSW search, layer by layer
alt: >-
  Three horizontal violet bands, one per layer of an HNSW graph, with pink points joined by grey links. Layer 2 at
  the top has 3 points drawn and is labelled about 14 points with long hops; layer 1 has 8 points drawn and is
  labelled about 225 points; layer 0 at the bottom has all 21 drawn points and is labelled all 3,600 points with short
  links. An orange dot marks the question in every layer. In step 2 an orange arrow runs in layer 2 from the entry
  point to the point nearest the question. In step 3 a dashed arrow drops to the same point in layer 1, and two more
  arrows hop closer to the question. In step 4 a dashed arrow drops to layer 0, and small orange rings mark 8 points
  the beam looks at, standing for ef equals 64. In step 5 a dashed orange circle around the question holds the 5
  nearest points: the top 5. A footer says M equals 16 links per point, 32 in layer 0.
caption: >-
  The upper layers get the search near the question in a few long hops; only the bottom layer is searched carefully.
