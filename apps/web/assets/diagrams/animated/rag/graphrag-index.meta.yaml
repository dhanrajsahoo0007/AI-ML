title: GraphRAG indexing
alt: >-
  A four-step figure read left to right. Step 1: a column of blue boxes, five of Brightpost's support tickets, each
  one chunk, such as ticket 4812 "new phone, codes fail" and ticket 6007 "locked after many tries"; a note says 6,000
  tickets, one chunk each. Step 2: an arrow leads to a graph of nine violet entity boxes joined by lines: new phone,
  two-factor and backup code; failed sign-ins, account lock and password reset; suspicious login, security hold and ID
  check. Two lines join the groups, both ending at account lock. A note says one LLM call per chunk. Step 3: dashed
  outlines group the entities into three communities, labelled community 1, 2 and 3, and a note says Leiden finds
  densely linked groups. Step 4: an arrow from each community leads to a green summary box: community 1 says a new
  phone breaks codes and backup codes fix most cases; community 2 says repeated failed tries lock the account;
  community 3 says odd sign-ins cause a hold and an ID check lifts it. A note says one LLM call per community.
caption: >-
  Two LLM passes make the index: one reads every chunk, one summarises every community; the summaries are what
  global questions read.
tags: [rag, graphrag, knowledge-graph, genai]
