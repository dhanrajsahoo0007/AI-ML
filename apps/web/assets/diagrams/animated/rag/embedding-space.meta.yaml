title: Embedding space
alt: >-
  A two-dimensional sketch of an embedding space in which Brightpost's help articles appear as pink points in three
  clusters labelled account and sign-in, orders and delivery, and returns and refunds. Two shaded points in the
  sign-in cluster are the articles "Reset a forgotten password" and "Recover two-factor access". In step 2 an orange
  point for the question "How do I reset my password if I lost my phone?" lands between those two articles. In step
  3 a second orange point for "Can't log in, phone was stolen", which shares almost no words with the question, lands
  right next to it.
caption: Meaning sets the position; a paraphrase with other words lands in the same neighbourhood.
