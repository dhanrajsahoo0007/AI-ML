title: Chunking with overlap
alt: >-
  The 1,100-token help article "Recover two-factor access" is drawn as a strip of 22 cells of 50 tokens each, with
  its key sentence "If you lost your phone, use a backup code" marked at tokens 385 to 415. In step 2 the article is
  cut every 400 tokens into chunks at 0 to 400, 400 to 800 and 800 to 1,100, and a red bracket shows the sentence
  split, half in chunk 1 and half in chunk 2. In step 3 a 400-token chunk starts every 350 tokens: chunk 1 covers 0 to
  400, chunk 2 covers 350 to 750 and chunk 3 covers 700 to 1,100; chunk 2 is highlighted and holds the whole
  sentence. A note says chunk 2 repeats tokens 350 to 400 and 700 to 750, and that 1,200 articles times 3 chunks gives
  3,600 chunks.
caption: Watch the sentence at token 385; the overlap is what keeps it whole.
