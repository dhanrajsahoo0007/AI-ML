title: Three ways to isolate tenants in a vector store
alt: >-
  A three-column comparison. Column 1, index per tenant: three separate violet indexes for Brightpost (3,600 vectors),
  Tenant B and Tenant C. Column 2, namespace per tenant: one index drawn as a dotted group holding three namespaces,
  brightpost, tenant-b and tenant-c. Column 3, shared index plus filter: a teal filter box reading tenant_id equals
  brightpost above one shared index whose chunk cells are mixed, labelled BP, B and C; the BP cells are shaded. Below,
  four rows of trade-offs. Isolation: strongest, a query cannot reach another index; strong, the engine scopes every
  query; and, in red, as strong as every filter, one missing filter returns all. Cost at scale: overhead per index;
  one index to run; lowest, but tiny tenants make filters selective. Deleting a tenant: drop the index; drop the
  namespace; delete by filter, then prove nothing is left. Fits: few large or regulated tenants; many tenants on one
  engine; many small tenants, plus cross-tenant admin search.
caption: >-
  Moving from separate indexes to one shared index lowers cost and moves the isolation guarantee from the
  infrastructure into every query.
tags: [rag, multi-tenancy, vector-search, security]
