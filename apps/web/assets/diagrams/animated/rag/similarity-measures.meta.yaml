title: Cosine, dot product and distance
alt: >-
  On the left, three arrows from the origin: an orange question vector a at 3, 4, a pink chunk vector b at 4, 3, and a
  dashed pink chunk vector c at 6, 8, which points the same way as a but is twice as long. On the right, a table
  compares a with b and a with c: cosine 0.96 and 1.00, dot product 24 and 50, Euclidean distance 1.41 and 5.00.
  Notes say cosine ignores length so c counts as identical to a, distance and dot product care about length, and
  normalising every vector to length 1 makes all three agree.
caption: Cosine reads direction only; length changes the dot product and the distance.
