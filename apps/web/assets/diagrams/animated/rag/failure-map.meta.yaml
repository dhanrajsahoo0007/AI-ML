title: Where RAG fails
alt: >-
  Six grey pipeline stages run across the top: Parse, Chunk, Index, Retrieve, Prompt and Generate. In step 2 a red
  failure box appears under each stage: tables and headings lost under Parse, a key fact split across chunks under
  Chunk, a stale index after edits under Index, words that differ from the article under Retrieve, a key fact lost in
  the middle under Prompt, and an answer from memory under Generate; Retrieve has a second failure, the relevant chunk
  at rank 7. In step 3 a green fix appears under each failure: a layout-aware parser, structure-aware chunks with
  overlap, re-indexing changed articles, hybrid search and query rewriting, reranking 100 candidates and keeping 5,
  fewer and better-ordered chunks, and grounding with citations and saying "I don't know". A note says Retrieve breaks
  in two ways and most failures start there.
caption: Every failure has a stage and a fix; two of the seven happen at retrieval.
