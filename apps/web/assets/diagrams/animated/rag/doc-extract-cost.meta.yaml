title: Cost per 1,000 supplier invoices
alt: >-
  A horizontal bar chart of US dollars per 1,000 invoices, marked illustrative. In step 1 two tiny bars show the
  models: OCR and layout for 2 pages, blue, 3.00; and LLM extraction, green, 6.40. In step 2 a long grey bar shows
  clerk review of 30 percent of invoices at 225.00, and a line adds them up: 3.00 plus 6.40 plus 225.00 is 234.40 at a
  70 percent straight-through rate. Another line says manual entry today, 6 minutes at 30 dollars an hour, costs
  3,000.00, about 13 times the pipeline. In step 3 a fourth bar, clerk review of 15 percent of invoices, is half as
  long at 112.50, and a last line gives the total at 85 percent straight-through: 121.90.
caption: >-
  The models cost less than ten dollars per thousand invoices; the people who check them cost over two hundred, so
  the straight-through rate is the number to move.
tags: [genai, document-processing, cost, case-study]
