title: Query rewriting and HyDE
alt: >-
  At the top, the orange question "How do I reset my password if I lost my phone?" fans out into four orange boxes. In
  step 1 three are search queries written by an LLM: Q1 "reset forgotten password", Q2 "lost phone two-factor" and Q3
  "sign in without my phone". In step 2 the fourth box is a HyDE answer, a short guessed answer: sign in with a backup
  code and reset your password; no codes, verify your ID. In step 3 arrows from all four boxes meet in a lime box,
  merge the 4 result lists with RRF, which feeds a merged top 5, marked illustrative. The list shows which queries
  found each chunk: "Lost phone: use a backup code" by Q2, Q3 and H; "Reset a forgotten password" by Q1 and H; "No
  backup codes: verify your ID" by Q2 and H; then "Change your password" and "Set up two-factor sign-in". The three
  relevant chunks are shaded. A note says 3 of 3 relevant chunks reach the top 5, where the question alone found 2 of 3.
caption: >-
  No single rewrite finds every chunk; together they put all three relevant chunks in the top 5.
tags: [rag, retrieval, query-rewriting, genai]
