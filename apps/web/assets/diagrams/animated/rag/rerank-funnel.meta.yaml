title: Retrieve wide, rerank narrow
alt: >-
  A funnel of three stages, top to bottom, revealed one per step. A wide blue box holds all 3,600 chunks in the index,
  made offline. A narrower violet box, vector search, keeps the top 100; the note beside it says about 15 milliseconds
  for one index lookup. A lime box, the reranker, keeps the top 5; the note says about 120 milliseconds for the
  cross-encoder to read 100 question-chunk pairs. A line underneath says reranking all 3,600 chunks would take about
  4.3 seconds at 1.2 milliseconds per pair, and the 5 kept chunks are 5 times 400, or 2,000 tokens of context. Timings
  are illustrative.
caption: >-
  The cheap stage narrows 3,600 chunks to 100 so the expensive stage only has to read 100.
tags: [rag, reranking, retrieval, genai]
