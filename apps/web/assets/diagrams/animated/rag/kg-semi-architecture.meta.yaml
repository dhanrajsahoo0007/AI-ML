title: Semiconductor yield knowledge graph, built in six steps
alt: >-
  An architecture diagram in five columns, built in six steps. On the left, grey fab systems: lot history from the
  manufacturing execution system, equipment sensor logs, metrology inspection, test and yield per wafer, and past
  reports such as FMEA tables and notes. The four structured sources join one line into an orange ingest stage that
  resolves tool, chamber and parameter names and writes a violet knowledge graph of lot paths. Past reports go to an
  orange extraction stage, where an LLM pulls out cause-and-effect relations for the graph and embeds the text into a
  violet report index of past excursions. In the green investigation column, the solid green Commonality stage reads
  lot paths from the graph and compares failing lots with passing lots; below it, the LLM assistant takes the
  engineer's question, queries the graph, runs the commonality test and searches the report index for similar
  reports. It returns ranked suspects with evidence to the engineer, who makes the decision.
caption: >-
  The statistics run in code; the LLM turns the engineer's question into queries and explains the evidence.
