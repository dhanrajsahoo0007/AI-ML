title: Index snapshots and a rollback
alt: >-
  An architecture diagram built in four steps. Across the top, inside a group titled index snapshots, never changed
  in place, violet cards stand in time order. In step 1 there are two: snapshot 1 from 1 September, built with
  embedding model embed-v2 from corpus version c41, and snapshot 2 from 6 October, embed-v2 and corpus c42. Below,
  live questions go to a live alias called help-search, drawn as the solid accent, which points up at snapshot 2. In
  step 2 snapshot 3 appears on 3 November, built with a new model, embed-v3, from the same corpus c42, and the alias
  points at it instead. In step 3 a dashed golden-set line runs from snapshot 3 to a red card: recall at 5 drops from
  0.84 to 0.71. In step 4 the alias points back at snapshot 2, labelled rollback, while snapshot 3 stays in place for
  debugging.
caption: >-
  A snapshot that is never changed in place can be returned to in one move; the alias is the only thing that changes.
tags: [rag, versioning, indexing, rollback, genai]
