title: Multimodal ingestion
alt: >-
  Three dotted groups from left to right. On the left, a help-centre page, "Recover two-factor access", drawn as four
  blocks: the title, a sentence telling the reader to use a backup code if they lost their phone, a table of recovery
  options and how long each takes, and a screenshot of the sign-in screen with Email, Password and a "Use a backup
  code" link. In step 2 arrows split the page into blue parsed elements in the middle: one text chunk that keeps the
  title as context, two table rows that each keep the table header, and an image element that keeps its heading and
  alt text. The right group, "Three ways to index the image", fills in one row per step from a trunk line leaving the
  image. Step 3: a green vision model writes a caption, "Sign-in screen with a 'Use a backup code' link", which is
  embedded as text. Step 4: a neutral OCR box reads the words on the screen into a teal keyword cell. Step 5: a pink
  image embedder turns the picture into one vector, drawn as a row of pink cells, in a space shared with text.
caption: >-
  A screenshot is invisible to a text index until you give it words or a vector; the three ways differ in what they
  keep.
tags: [rag, multimodal, parsing, embeddings]
