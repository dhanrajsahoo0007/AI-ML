title: Basic RAG against an agent with three search rounds
alt: >-
  A comparison in three rows, each with a bar for basic RAG and a bar for an agent that takes three search rounds.
  Row 1, model calls and searches: basic RAG makes one violet search and one green LLM call; the agent alternates LLM
  call and search three times and then makes a fourth LLM call, four model calls in all. Row 2, time to the full
  answer, illustrative: basic RAG is a thin search slice and a 1,500 ms answer, about 1.5 seconds; the agent's bar
  has three 400 ms model calls, each followed by a thin search slice, then the same 1,500 ms answer, about 2.8
  seconds. The searches are slivers; the model calls take the time. Row 3, input tokens the model reads: basic RAG
  reads 2,215 tokens once; the agent's four calls read 215, 2,215, 4,215 and 6,215 tokens because each call re-reads
  everything so far, 12,860 tokens in all, 5.8 times as many.
caption: >-
  Searches are cheap; the extra model calls and the context each one re-reads are what make the agent slower and
  costlier.
