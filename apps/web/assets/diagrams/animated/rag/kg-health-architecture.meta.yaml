title: Clinical knowledge-graph assistant, built in seven steps
alt: >-
  An architecture diagram built in seven steps. On the left, grey source systems: the electronic health record over
  FHIR, clinical notes, guidelines and literature, and vocabularies such as UMLS and SNOMED CT. Health records go to an
  orange normalize stage that maps them to codes, and notes go to an orange clinical NLP stage that handles negation
  and time; both feed a violet patient graph, a timeline per patient. Vocabularies and guidelines build a violet
  medical graph of drugs and diseases, and guidelines also fill a violet passage index. On the right, a signed-in
  clinician asks a question through a blue access check that verifies role and purpose and writes every access to a
  violet audit log. The solid green assistant reads the patient graph, sends the new drug and the current medications
  to teal safety rules, which look up interactions in the medical graph and return alerts, and retrieves guideline
  passages from the index. A green LLM writes the cited answer back to the clinician.
caption: >-
  Safety checks are rules over the graphs; the LLM only explains what the rules and records say, with citations.
