title: A shared embedding space for text and images
alt: >-
  Two panels. On the left, a group titled "Training (CLIP-style)" shows a three-by-three grid: three pictures as rows
  (a sign-in screen, a parcel tracker, a returns label) against three captions as columns (sign-in, tracking,
  returns). The three diagonal cells, where a picture meets its own caption, are strong pink and say "pull"; the six
  other cells are pale and say "push". A note says CLIP trained on 400 million image-caption pairs this way. On the
  right, a dashed frame sketches the shared space. In step 2 pink circles, the text chunks, gather in three clusters:
  sign-in and account at the top left, orders and delivery at the top right, returns and refunds at the bottom. In
  step 3 pink squares, the images, land inside the cluster about the same topic: the sign-in screenshot among the
  sign-in chunks, the parcel tracker among the orders chunks, the returns label among the returns chunks. In step 4 an
  orange dot, the question "Where is the backup code button?", lands in the sign-in cluster, and a dashed orange ring
  around it holds the sign-in screenshot and the chunk "Lost phone: use a backup code".
caption: >-
  Because pictures and text share one space, a typed question can retrieve a screenshot with no caption in between.
