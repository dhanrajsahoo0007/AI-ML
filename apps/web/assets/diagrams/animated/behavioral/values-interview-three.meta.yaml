title: "Values questions at LinkedIn, Salesforce and Atlassian"
alt: "Three columns. LinkedIn, as reported: a one-hour behavioral round in the onsite, five values on the careers site, ad hoc questions tied to the values, and a hiring committee that is reported and not confirmed. Salesforce, from its official pages: values questions asked by several interviewers with no separate round named, five values on the company values page, tell us about a time when questions on five themes, and no published decision process. Atlassian, from its official guide: a 45-minute values interview often run by someone outside the team, five values, a set of behavioral questions with examples in the guide, and a hiring committee independent of the interviewers."
caption: "All three publish five values. Only Atlassian publishes how its values interview is run and who makes the final review."
