title: "An hour on one project: the project defense round"
alt: "Two reported rounds, Uber's bar raiser round and DoorDash's hiring manager screen, each spend about an hour on one past project. The candidate gives a two-minute overview. The interviewer then probes the candidate's own part, the decisions and their alternatives, and what went wrong and which part was the candidate's. The round is reported to judge depth and level."
caption: "Uber and DoorDash are both reported to spend an hour on one of your projects. The probes go from your part, to your decisions, to what went wrong."
