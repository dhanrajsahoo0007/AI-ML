title: "The same signal at three levels: how far the change reached"
alt: "Three bars of growing width. Mid level: a change inside your own area, done mostly alone. Senior: a change across your whole team, done by three or more people. Staff: a change across your org, done by two or more teams."
caption: "Interviewers hear the same signals at every level. What they grade is how far the change in your story reached."
