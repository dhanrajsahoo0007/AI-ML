title: "A feedback conversation in five moves"
alt: "A dialogue between you and a teammate. You state an observation: two hotfixes merged with no test. You state the effect: a Sunday page took three hours to fix. You ask what makes the tests hard to add, and the teammate says the test harness takes 18 minutes to start. You agree to help make the harness fast and the teammate agrees to ship no hotfix without a test. Thirty days later you check back and hear about one slip in a deadline week."
caption: "Feedback that lands has a fixed order: what happened, what it cost, a question, an agreement and a check a month later."
