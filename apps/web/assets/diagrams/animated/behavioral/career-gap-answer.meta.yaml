title: "Explaining a gap, a layoff or a switch in three sentences"
alt: "Three boxes joined by arrows. One, what happened: one sentence, as a fact, about 5 seconds. Two, what you did: a project, a course or care for someone, about 10 seconds. Three, why now: what you want from this role, about 10 seconds. Under 30 seconds in all, then stop."
caption: "Three sentences and under half a minute. The last sentence turns the answer back to the job."
