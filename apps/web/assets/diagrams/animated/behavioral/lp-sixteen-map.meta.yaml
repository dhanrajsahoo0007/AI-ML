title: "Amazon's 16 Leadership Principles in six groups"
alt: "Sixteen principles in six groups. Customer and ownership: Customer Obsession, Ownership. Action, results, standards: Bias for Action, Deliver Results, Insist on the Highest Standards. Depth and judgment: Dive Deep; Are Right, A Lot. Candour and trust: Have Backbone, Disagree and Commit; Earn Trust. Invention and cost: Invent and Simplify, Think Big, Frugality. People and responsibility: Learn and Be Curious, Hire and Develop the Best, Strive to be Earth's Best Employer, Success and Scale Bring Broad Responsibility."
caption: "The 16 principles in the six groups this site uses. The grouping is ours, to make them easier to prepare; Amazon lists them as 16 separate principles."
