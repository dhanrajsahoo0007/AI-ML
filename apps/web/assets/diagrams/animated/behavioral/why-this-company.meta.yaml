title: "A reason for wanting the job: their work, your work, and the link"
alt: "Two boxes at the top: their work, one problem this team has, and your work, the closest thing you have done. Both point to a box in the middle, the link: what you want to do next. Below, a red box, away from a complaint such as my manager or the pay, with an arrow to a green box, toward the same link: I want more of this, and you have it."
caption: "A good reason joins one thing they do to one thing you have done. The same link answers why you are leaving."
