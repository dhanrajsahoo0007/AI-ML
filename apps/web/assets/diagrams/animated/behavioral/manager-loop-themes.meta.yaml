title: "The themes a manager loop asks about"
alt: "One box for you as the manager, with six themes below it: underperformance, which is reported most often; growing and keeping people; hiring; disagreeing upward with your manager or leadership; conflict inside the team or between teams; and delivery and change, such as a late project or a reorg."
caption: "Six themes cover most of the manager prompts candidates report. Underperformance is reported most often."
