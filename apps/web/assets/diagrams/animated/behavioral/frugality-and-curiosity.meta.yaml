title: "Frugality and Learn and Be Curious, with one example of each"
alt: "Two columns. Frugality is shown by keeping only 12 hours of logs on fast disks, which takes a cluster from 38 thousand to 14 thousand dollars a month. Learn and Be Curious is shown by a backend engineer who learns phone audio code in two days and cuts battery drain from 4.8 percent to 0.6 percent an hour. They pull apart because learning costs time and money, and resolve into a small, bounded study with a measured gain."
caption: "Frugality asks you to spend less. Curiosity asks you to spend time learning. A strong story bounds the learning and measures what it paid back."
