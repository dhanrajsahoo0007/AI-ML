title: "Inside Meta's 45-minute behavioral round"
alt: "A 45-minute bar split into 5 minutes of introductions, 35 minutes of questions about past work and 5 minutes for the candidate's questions. Below it are eight focus areas: motivation, proactive, unstructured work, perseverance, conflict, empathy, growth and communication."
caption: "Eight focus areas, as described by a former Meta interviewer. Prep guides often group them into five."
