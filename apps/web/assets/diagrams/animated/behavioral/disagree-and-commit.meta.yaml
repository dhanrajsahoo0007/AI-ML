title: "Disagree, lose the decision, commit, and earn trust"
alt: "A dialogue between an engineer, a decision owner and the engineer's team. The engineer tells the decision owner that losing a cache node drops 8 percent of carts and offers a four-day bridge. The owner decides to keep the old cache and ship early because a partner date outweighs the risk. The engineer tells the team the decision as their own and adds a cookie fallback. In week two a cache node fails and 99.7 percent of checkouts are kept. The owner asks the engineer to lead the later migration."
caption: "Backbone is the first two arrows. Commitment is what you do after the answer is no."
