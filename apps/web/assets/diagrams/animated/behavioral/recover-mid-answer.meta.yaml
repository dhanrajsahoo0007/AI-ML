title: "Recovering in the middle of an answer"
alt: "Six boxes in order. The drift: 90 seconds in and still on background. Notice: there is no 'I did' in the answer yet. Name it: one sentence, with no apology. Restart from the action: the first thing you did, and why. Land it: the result, the learning, then stop. What gets written down: your action and your result."
caption: "Notice, name it, restart from the action. The interviewer can only write down an action and a result once you give them one."
