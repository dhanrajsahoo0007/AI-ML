title: "How far a story reaches at senior, staff and principal level"
alt: "Three boxes in a row: a senior story changes one whole team of about three or more people, a staff story changes two or more teams, and a principal story changes how a large part of the organisation works. Below them, four kinds of story a staff loop asks for: setting a direction across teams without authority, stopping a project or retiring a system, saying no to leadership with evidence, and growing a senior engineer into a lead the team follows."
caption: "Staff loops often reuse senior questions and listen for wider reach. The four boxes are the story types reported most often for staff roles."
