title: "A Netflix engineering loop, as candidates report it"
alt: "Flow from a recruiter screen of about 30 minutes that includes culture memo questions, to a hiring manager screen of 30 to 45 minutes about a past project, to a technical screen or take-home. The onsite has about 4 to 8 interviews: technical rounds, a hiring manager round, a director or senior manager round and an HR partner round on the culture memo. Each interviewer gives a pass or fail, a live discussion aims for consensus, and the recruiting partner brings the outcome."
caption: "Netflix publishes no interview steps. This shape comes from candidate reports and varies by team."
