title: "How a two-minute answer should sound"
alt: "A row of six blocks in time order. A pause of two to three seconds, a one-sentence headline, the setup followed by a breath, what I did in three steps, the result with one number, then stop and wait. Below: signposts such as the situation was, what I did, the result. Aim for about 140 words a minute and slow down on numbers and names."
caption: "A pause, a headline, three signposted parts and a clear stop. The pauses are part of the answer."
