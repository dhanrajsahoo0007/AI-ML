title: "Invent and Simplify and Think Big, with one example of each"
alt: "Two columns. Invent and Simplify is shown by three services replaced with one snapshot file, removing 14,000 lines of code and a cache. Think Big is shown by one data deletion tool for eight teams in place of eight separate ones. They pull apart because a bigger idea adds parts to maintain, and resolve into a large direction with a small start: the first team live in five weeks."
caption: "One principle removes parts and the other adds reach. A strong story sets a large direction and ships a small, simple first step."
