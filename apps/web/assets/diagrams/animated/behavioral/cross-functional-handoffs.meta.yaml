title: "What each partner needs from an engineer"
alt: "An engineer in the centre holds the cost, the limits and the risk of a request. Four arrows lead out. The product manager needs options with a cost and receives three options. The designer needs the limits early and is told what is slow. Security and legal need the data flow in writing and receive a data map. Support and customers need plain words and a date and are told what they will see."
caption: "Each partner needs a different thing from you. Give the product manager choices, the designer limits, security and legal a data map, and support plain words."
