title: "The loops at Databricks, Snowflake and Datadog"
alt: "Three columns. Databricks, from its official guide: a 30-minute recruiter screen and a one-hour technical screen, team matching, a panel of four to six one-hour interviews including a hiring manager interview run by an engineering leader, then a hiring committee and references before the offer. Snowflake, as reported: a recruiter call, a two-hour phone screen, an onsite of about four hours that opens with a 30-minute project talk and includes a one-hour behavioral round, then a meeting of the interviewers. Datadog: its official page lists a recruiter or manager screen, interviews with one step in person, a take-home for some roles and a decision by the interviewing team; a one-hour behavioral round with a manager or director is reported."
caption: "Databricks publishes its loop in detail. Datadog publishes the stages only, and Snowflake's loop is known from reports."
