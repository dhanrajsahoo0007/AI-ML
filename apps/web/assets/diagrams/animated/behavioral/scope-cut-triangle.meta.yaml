title: "When the date is fixed: kept, cut and written down as debt"
alt: "A fixed date three weeks away with six weeks of estimated work splits the work into three groups. Kept in full: the audit ledger, tests and rollback. Cut for now: the merchant report screen. Written down as debt: disputes approved by hand. The debt is paid back on day 18, when an automatic worker replaces the manual step on the same queue, on a date agreed before launch."
caption: "A fixed date sorts the work into three groups: what is kept in full, what is cut for now, and what is taken as debt with a payback date."
