title: "A 90-second introduction: now, before, next"
alt: "A bar split into three parts. Now, about 20 seconds: your role, team and what you own. Before, about 45 seconds: two pieces of work, each with a result. Next, about 25 seconds: why this role at this company. Each part leaves the interviewer one thing to ask about: your scope, your best piece of work, and your reason for being there."
caption: "Each part of the introduction leaves the interviewer something to ask about. The middle part is the one you choose on purpose."
