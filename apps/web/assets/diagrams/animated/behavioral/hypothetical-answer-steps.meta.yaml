title: "Answering a hypothetical question in five moves"
alt: "Five boxes joined by arrows. One, clarify: ask once, then assume. Two, your first move: I would start by. Three, why: the two things you weigh. Four, what would change it, and when you would escalate. Five, a real example: one sentence from your work. About 90 seconds in all."
caption: "A hypothetical answer states a position early, gives the reasons, and ends on something you have really done."
