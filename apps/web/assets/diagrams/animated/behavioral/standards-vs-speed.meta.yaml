title: "Insist on the Highest Standards against a launch date"
alt: "A defect is found three days before launch: stock is oversold in 0.4 percent of reservations when a cache node fails. One path favours speed and ships on Monday with the defect. The other favours the standard and delays two weeks. A strong answer lets speed decide the scope, moving bulk reservation to next month, lets the standard decide what must hold, and ships on Monday with a write check that closes the defect."
caption: "Speed decides how much you ship. The standard decides what must be true of whatever ships."
