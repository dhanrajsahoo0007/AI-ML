title: "A project deep dive, layer by layer"
alt: "Five stacked layers, each narrower than the one above. The two-minute overview covers the problem, the scale and your part. Below it is the design in four boxes, with three topics offered. Then a decision you made, with the options and what you rejected. Then what broke, how you found out and what you did. Last, what you would change with what you know today."
caption: "A deep dive starts wide and gets narrower. Each layer down is about a smaller part of the system and more about your own choices."
