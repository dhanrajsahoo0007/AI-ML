title: "Hire and Develop the Best and Strive to be Earth's Best Employer"
alt: "Two columns. Hire and Develop the Best is shown by coaching a teammate without taking over, so that by the third task she works alone. Strive to be Earth's Best Employer is shown by cutting night pages from 19 a week to 1 after finding that 58 percent of them needed no action. They pull apart because a high bar can wear people down, and resolve into a high bar with support: a clear standard and help to reach it."
caption: "One principle raises the bar and the other looks after the people who must clear it. A strong story does both."
