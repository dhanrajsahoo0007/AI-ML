title: "Meta's software engineer loop, from first call to decision"
alt: "Flow from a recruiter call to a 45-minute technical screen, then a full loop of coding, design and behavioral rounds of 45 minutes each. Each interviewer writes feedback, the interviewers hold a debrief, and the recruiter brings the result."
caption: "The behavioral round is one 45-minute slot in the full loop, and its feedback carries a level as well as a hire or no-hire call."
