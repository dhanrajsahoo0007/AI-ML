title: "The arc of a customer pilot story"
alt: "Six boxes in order. The ask: what the customer says they want. Watch the work: what the users really do. A small first version, built in days on their real data. Something breaks: what you tell the customer and when. The pilot result: a number the customer cares about. Back to the product: what became reusable, or a clear no to a custom fork."
caption: "A customer story is scored twice: once on what the customer got, and once on what your own product kept."
