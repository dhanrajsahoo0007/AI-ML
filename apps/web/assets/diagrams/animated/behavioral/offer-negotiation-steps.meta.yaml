title: "From a verbal offer to a decision"
alt: "Five steps in a row. One, the offer arrives: thank them and do not answer yet. Two, get it in writing, every part. Three, check the level is the right one. Four, make one counter with a reason. Five, decide by the date you gave. Below, the four parts of an offer: base pay paid every month, bonus as a target and not promised, equity with its amount and vesting, and a one-time sign-on payment."
caption: "Five steps from the call to the decision. The level is checked before any number is discussed."
