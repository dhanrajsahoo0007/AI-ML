title: "The values question at an AI lab, and the follow-ups candidates report"
alt: "The interviewer asks about a time your values were tested. The answer is one real event in three parts: the pressure, what you did, and what it cost. The reported follow-up questions are how you felt at the time, how you feel about it now, and what you would change."
caption: "The best-attested prompt in an AI lab values round, with the follow-ups two candidates reported."
