title: "Dive Deep and Are Right, A Lot on one investigation"
alt: "A dashboard shows 99.94 percent success while support has three reports from Brazil of customers who cannot pay. On the Dive Deep side the engineer slices the metric by region and payment method, finds 31 percent of instant payments in Brazil failing, and reads raw responses that return 200 OK with an error in the body. On the Are Right, A Lot side the first belief, that the customers' network is at fault, is tested and dropped. The two meet where depth costs time, and resolve in a cause found in 30 minutes: an expired certificate on one proxy."
caption: "Go down a layer until you can explain both the green dashboard and the customer's report, and test your first belief on the way."
