title: "Success and Scale Bring Broad Responsibility: one debug log at two scales"
alt: "A debug log of raw prompts helps fix bad summaries. At 50 users a 0.01 percent case happens about once a year. At 100 million requests an hour the same case happens 10,000 times an hour, and the log holds card numbers that 400 people can read. The launch is four days away, which pulls towards shipping as it is. A strong answer keeps the log and adds the guard: values redacted, 12 readers and deletion after seven days."
caption: "The same feature at two scales. What was a rare case becomes an hourly one, and it reaches people who never chose to be in the log."
