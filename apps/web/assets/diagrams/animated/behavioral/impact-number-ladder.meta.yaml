title: "The impact ladder: from an adjective to a result that can be scored"
alt: "Five rungs rising from left to right. The lowest is an adjective: it got much faster. The next is a number with no baseline: it got 80 percent faster. The third adds a baseline and a unit: p99 fell from 480 ms to 95 ms. The fourth adds the scale: at 6,500 requests a second. The top rung adds a period and what stayed the same: for 30 days, with errors flat."
caption: "Each rung adds one thing to the same result: a number, a baseline with a unit, the scale, then a period and what did not get worse."
