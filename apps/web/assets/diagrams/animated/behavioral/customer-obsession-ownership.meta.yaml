title: "Customer Obsession and Ownership on one incident"
alt: "Two columns. Customer Obsession leads to stopping failed data syncs today for 3 percent of clients. Ownership leads to fixing the cause in another team's SDK. The two meet at a tension, that a quick patch can become permanent, and resolve into one answer: a patch within 40 minutes and the SDK fix with the patch removed in 60 days."
caption: "One incident, two principles: relief for the customer today and the lasting fix in the right place."
