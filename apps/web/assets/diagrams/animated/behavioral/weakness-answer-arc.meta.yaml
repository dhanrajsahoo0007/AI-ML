title: "The four parts of a weakness answer"
alt: "Four boxes in a row joined by arrows. One, name it: plain words, one sentence. Two, the cost: one time it hurt the work, two sentences. Three, the change: a habit you can describe, most of the answer. Four, where it stands: better and not finished, one sentence. About 60 seconds in all."
caption: "A weakness answer takes about a minute, and most of it is the habit you changed."
