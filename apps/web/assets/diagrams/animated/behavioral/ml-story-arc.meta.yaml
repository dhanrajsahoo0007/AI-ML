title: "The arc of a machine learning story: offline, online, the gap, the change"
alt: "An offline result, a ranking score up 4.8 percent, is followed by an online result, an A/B test that stayed flat after two weeks. The gap between them leads to three checks: a mismatch between training and serving features, added latency of 185 ms at p95, and biased labels from clicks on old top results. Latency is the cause. The change is a smaller, faster model. The second test is up 1.1 percent, and a latency limit is added to every test."
caption: "A strong machine learning story has four parts: the offline result, the online result, the gap between them and what you changed."
