title: "Which question for which interviewer"
alt: "Four interviewers, each with what they know best and one question to ask. The recruiter knows the process, level and pay: ask what the next steps are and which level is in mind. A peer engineer knows the daily work and on-call: ask what slows them down most and why it is not fixed yet. The hiring manager knows the team and its gaps: ask what the team is missing that this hire should bring. A senior leader knows the direction: ask what the one big bet is for the next twelve months. A final bar says to ask two people the same question and compare the answers."
caption: "Ask each interviewer about the thing only they can tell you, and ask one question twice to see whether the answers match."
