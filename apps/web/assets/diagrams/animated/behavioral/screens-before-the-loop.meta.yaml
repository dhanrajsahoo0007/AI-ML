title: "The conversations around the loop, and what each one decides"
alt: "Four stages in a row. The recruiter screen, 20 to 30 minutes, decides role, level and pay range. The hiring manager screen, 30 to 45 minutes, decides on your work and your reasons. The loop of scored interviews decides hire or not, and the level. After the loop, the recruiter returns for team match at some companies, then the numbers and the start date."
caption: "Each conversation decides something different. The first one sets the level and the range that the last one works inside."
