title: "Where a student finds stories, and which questions each one answers"
alt: "On the left, four sources of material: a team course project, an internship, your own project, and a job, club or teaching role. On the right, four kinds of question: teamwork and conflict, failure and feedback, learning something fast, and initiative. Arrows show that team projects and jobs answer teamwork questions, internships and team projects answer failure and feedback questions, and your own project and other roles answer learning and initiative questions."
caption: "Four places a student has stories, and the questions each can answer. One source usually answers two kinds of question."
