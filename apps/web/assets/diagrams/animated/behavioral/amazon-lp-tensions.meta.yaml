title: "Four pairs of Leadership Principles that pull against each other"
alt: "Architecture diagram illustrating the four classic tension pairs among Amazon Leadership Principles: Speed vs Standards, Customer Obsession vs Frugality, Dive Deep vs Think Big, and Disagree vs Commit."
caption: "Following one principle is easy. A strong story shows what you did when two of them pulled in opposite directions. The pairing is this site's own."
