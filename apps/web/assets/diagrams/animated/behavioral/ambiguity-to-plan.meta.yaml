title: "From a one-line goal to a plan"
alt: "A one-line goal, make the dashboard faster, becomes one page written in two days with three parts: a goal with a number (Monday p99 under 1.5 seconds), a thing not being done (no rewrite of six services) and the biggest unknown (whether totals can be built ahead). The biggest unknown leads to a two-day test, then a first milestone in week two with one customer end to end, then a check-in to keep going, change direction or stop."
caption: "A vague goal becomes a plan in four moves: write down what you assume, test the biggest unknown, ship something small and check in."
