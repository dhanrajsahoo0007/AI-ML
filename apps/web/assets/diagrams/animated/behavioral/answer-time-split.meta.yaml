title: "Where two minutes go: a first try and the STAR+L budget"
alt: "Two bars of the same length. The first, a common first try, is 55 percent backstory, 25 percent action and 20 percent result. The second, the STAR+L budget, is 15 percent setup, 60 percent action, 15 percent result and 10 percent learning."
caption: "The answer is the same length both times. What changes is how much of it the interviewer can score."
