title: "An Apple team's interview loop, as candidates report it"
alt: "Flow from a recruiter screen to one to three phone or video screens, often including the hiring manager, and for some roles a presentation, case study or coding exercise. The onsite has four to eight rounds set by the team: technical rounds of 45 to 60 minutes with one or two interviewers, a manager round on past work, motivation and conflict, and behavioral questions inside technical rounds. The team discusses the candidate after the loop, the hiring manager has the most say, and the recruiter brings the outcome."
caption: "Apple publishes no fixed format. Each team runs its own loop, so this shape is typical and not guaranteed."
