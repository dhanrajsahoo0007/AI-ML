title: "Microsoft's interview process, as its careers pages describe it"
alt: "Flow from an optional short screening conversation, with a coding exercise or work samples for some roles, to two to four conversations of up to an hour each with potential teammates, cross-functional colleagues and the hiring manager. A final interview with a more senior person, once called the as appropriate interview, comes last. Feedback practice varies by group and Microsoft does not publish who makes the decision."
caption: "The conversations come from Microsoft's careers pages. The final interview's history comes from a 2023 post on Microsoft's developer blog."
