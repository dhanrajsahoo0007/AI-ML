title: "The values round at Stripe and at Airbnb, side by side"
alt: "Two columns. Stripe, as reported: a one-hour behavioral round run by a hiring manager or a Leveler, with past-experience questions or scenarios for manager roles, judged against Stripe's six operating principles, followed by written feedback and a meeting. Airbnb, as reported: one or two core values interviews, often run by non-engineers, with questions on why Airbnb and past stories, heard against the four core values, followed by team matching."
caption: "Both companies publish their list of principles or values. Neither publishes how the round is run, so the rest is reported."
