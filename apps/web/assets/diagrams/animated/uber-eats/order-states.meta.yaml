title: The order state machine
alt: >-
  A state diagram of one food order in two steps. Step 1: a grey Placed box, where the card is authorised, leads to a
  teal Accepted box, where the restaurant accepts. From there two parts run in either order inside a dotted group: a
  teal Ready box when the kitchen finishes the food, and a blue Courier assigned box when a courier takes the offer.
  Both lead to a blue Picked up box, which needs both parts, and then to a green Delivered box, where the card is
  captured. Step 2: a red Cancelled box appears under Accepted, where the authorisation is voided; a dashed arrow from
  Placed is labelled rejected or silent (no answer in 5 minutes), and a dashed arrow from Accepted is labelled cancel before pickup.
caption: >-
  Food and courier move in parallel and meet at pickup; every cancel before pickup voids the card hold instead of refunding.
