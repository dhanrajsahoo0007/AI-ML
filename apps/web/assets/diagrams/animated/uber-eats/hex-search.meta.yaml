title: "Nearby by delivery time: hexagons, buckets and shard edges"
alt: >-
  A layout of 37 hexagonal map cells in three steps. Step 1: a teal restaurant R sits in the middle cell; every other
  cell shows the minutes to deliver there from R by road. Cells west of a grey river take 10, 15 or 20 minutes and
  cells east of it take 22, 27 or 32 minutes because the bridge is a 12-minute detour; cells up to 15 minutes are
  green, 16 to 30 minutes blue, and over 30 minutes grey and not indexed for R. Step 2: an orange customer C sits in a
  22-minute cell east of the river; the search service reads three lists for that cell in parallel, green 0 to 15
  minutes, blue 15 to 30 minutes, which contains R, and grey 30 to 45 minutes. Step 3: a thick dashed shard edge runs
  just west of R, with shard B to the left and shard A to the right; because R's delivery reach crosses the edge, a
  teal box says R is indexed in shard A and shard B, a buffer zone at the edge.
caption: >-
  A cell across the river is close in metres but far in minutes; search reads lists by cell and delivery-time bucket, and edge stores live in both shards.
tags: [case-studies, uber-eats, geospatial, search]
