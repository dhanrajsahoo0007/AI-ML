title: Uber Eats architecture
alt: >-
  An architecture diagram of a food delivery service in five build steps, with pastel blocks for services and glyphs
  for stores. Step 1: the customer app calls a blue API gateway, which routes to a teal search service that queries a
  search index and a teal restaurant service that reads the restaurants database. Step 2: the green order service, the
  accent, asks the payment service to authorise the card and writes the order as placed to the violet orders database.
  Step 3: order events go onto an orange event bus; an orange notifier pushes them through a blue socket gateway to the
  restaurant app, which accepts, and to the customer app. Step 4: the courier app sends GPS through the socket gateway
  to a green location service, which writes the latest position to a red in-memory geo index; a green dispatch service
  reads accepted orders from the bus and asks the location service for nearby free couriers. Step 5: the location
  service publishes positions to the bus for live tracking and calls a green ETA service.
caption: >-
  Uber Eats architecture: browse, order and pay, notify, dispatch, track. Use the numbers to replay the build.
