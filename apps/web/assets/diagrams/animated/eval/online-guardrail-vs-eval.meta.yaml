title: "Blocking a request against observing it"
alt: >-
  A figure with two lanes in three steps. Step 1, the guardrail lane: an orange request goes to a green model, which
  writes a draft that goes to a lime guardrail on the request path. If it passes, the orange customer sees the answer; if
  it blocks, a neutral safe reply is sent instead. A note says the guardrail adds about 50 milliseconds to every
  request, an illustrative figure. Step 2, the evaluation lane: the same request and model, but the customer is answered
  at once with zero milliseconds added, and a dashed copy goes to a sampler that keeps 5 percent, then to a lime judge,
  then as a score to a lime dashboard. Step 3 adds that a judge call takes about 2,000 milliseconds, longer than the whole
  1,500 millisecond answer budget, so it cannot sit on the path; its score arrives minutes later and shapes the next
  release, not this answer.
caption: >-
  A guardrail can stop a bad answer but costs time on every request; an evaluation costs the customer nothing but only
  sees the answer after it has gone. The 50 ms and 2,000 ms figures are illustrative.
tags: [online-evaluation, guardrails, latency, genai]
