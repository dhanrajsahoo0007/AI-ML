title: From a thumbs-down to a test case
alt: >-
  An architecture diagram in five steps. Step 1: an orange customer who asked about order 4471, a cracked kettle for 42
  pounds, saw a green assistant answer saying the refund is on its way, and clicks thumbs-down; the click goes to a violet
  feedback log, and a dashed line carries the trace id from the answer to the log. Step 2: a daily batch goes to a grey
  triage step that redacts personal data and groups duplicates. Step 3: 20 cases a day go to an orange reviewer who
  labels them. Step 4: the labelled case joins the solid blue golden set, which grows from 200 to 201 tickets. Step 5: the
  golden set feeds a lime evaluation gate that runs on every change and blocks a release that fails.
caption: >-
  A thumbs-down on its own is only a count; with its trace, a redaction step and a reviewer it becomes a labelled
  ticket that fails the next release that repeats the mistake.
