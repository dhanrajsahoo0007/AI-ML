title: Explicit and implicit feedback
alt: >-
  Six rows, one per feedback signal, each with an orange box naming the signal, a blue bar for how many requests a day
  carry it out of 200,000, and a note on what it means. Explicit signals: thumbs up or down, 4,000 a day, clear direction
  but no reason; a written reason, 400, says why but is very rare; an agent's edit of a draft, 1,500, is the fix itself and
  the best label. Implicit signals: a retry or rephrase, 8,000, often means the first answer missed; a copy, 60,000, is
  ambiguous; a hand-off to a person, 10,000, is strong because the assistant could not finish. A box at the bottom says
  explicit signals total 5,900 a day and implicit 78,000, about 13 times as many.
caption: >-
  The clearest signals are the rarest; the bar for a written reason is almost invisible, while copy events are common and
  ambiguous. Counts are illustrative.
