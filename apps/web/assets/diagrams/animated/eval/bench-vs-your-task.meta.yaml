title: Public ranking against Brightpost's own ranking
alt: >-
  Two columns of green bars for three hypothetical models, with illustrative scores. On the left, the public
  benchmark ranks Model A first at 88 percent, Model B second at 85 and Model C third at 79. On the right, Brightpost's
  200-ticket golden set ranks Model C first with 168 of 200 correct, 84.0 percent plus or minus 5.1 points, Model A
  second with 150 of 200, 75.0 percent plus or minus 6.0, and Model B third with 136 of 200, 68.0 percent plus or
  minus 6.5. Grey arrows join each model's two bars and cross, because the order changes. Model C is ringed.
caption: >-
  The model that is last on the public benchmark is first on Brightpost's tickets, by 9 points, more than the
  interval. All scores are illustrative.
