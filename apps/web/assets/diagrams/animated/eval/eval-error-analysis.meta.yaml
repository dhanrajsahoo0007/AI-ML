title: Error analysis on fifty Brightpost traces
alt: >-
  A four-step diagram. Step 1: a grid of fifty small blue cells, each one a trace the team reads by hand. Step 2: seven
  named failure modes appear in a list, lettered A to G: refund over 30 pounds with no approval, invented a policy,
  wrong order id in a tool call, did not hand off to a person, tone or length off, right article not retrieved, other
  or unclear. Step 3: a bar beside each mode shows how many of the fifty traces it explains, 14, 9, 8, 7, 5, 4 and 3,
  which sum to 50; the largest bar is red. Step 4: an arrow from the largest mode leads to a lime test card: a refund
  over 30 pounds must call the approval tool, 14 cases, a code check. The counts are illustrative.
caption: >-
  The test you write is the one for the biggest bar, 28 percent of the sample, not the one that was easiest to think
  of. Counts are illustrative.
tags: [evaluation, error-analysis, traces, genai]
