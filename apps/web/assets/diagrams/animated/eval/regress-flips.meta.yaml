title: "Of 200 golden cases: fixed, broken and unchanged"
alt: >-
  A three-step figure with one wide bar standing for the 200 golden tickets, split into four segments by what happened
  between the live prompt p11 and the candidate p12. A green segment of 10 cases was fixed, a red segment of 6 cases
  broke, a neutral outlined segment of 10 still fails, and a long neutral segment of 174 still passes; the counts add
  to 200. Step 2 adds the arithmetic: p11 passes 180 and p12 passes 184, a net gain of 4 from 10 fixed minus 6 broken,
  but 16 cases changed and 184 did not. Step 3 compares the 16 changed cases with about 10 cases that change on their
  own when the same prompt is run twice, so only 6 are above noise, and says to read the 6 broken ones.
caption: >-
  A net gain of 4 hides 16 changed cases, 6 of them broken. Counts are illustrative; the 10 noise flips come from the
  run-to-run spread on the noise-band figure.
tags: [regression-testing, evaluation, flips, genai]
