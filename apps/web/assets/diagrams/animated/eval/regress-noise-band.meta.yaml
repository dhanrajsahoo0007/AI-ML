title: "The noise band: run the same prompt five times"
alt: >-
  A three-step number line of golden-set pass counts from 170 to 195 out of 200. Step 1 shows five neutral dots, one for
  each run of the same unchanged prompt p11, at 177, 179, 180, 181 and 183 passes, with a dashed line at the mean of 180,
  which is 90 percent. Step 2 shades a lime noise band from 175.5 to 184.5, the mean plus or minus two spreads, and works
  it out: variance 5, spread 2.24 cases, a band of plus or minus 4.5 cases or 2.2 points; five runs cost 2.2 million input
  tokens, half a percent of a day. Step 3 adds two green candidate dots: p12 at 184, a gain of 4 that sits inside the
  band, so it is not shown to differ, and p14 at 190, a gain of 10 that is outside the band and counts as a change.
caption: >-
  Re-running an unchanged prompt moves the score by a few cases, so a gain smaller than the band is not evidence.
  Pass counts are illustrative; the band is computed from them.
tags: [regression-testing, noise, evaluation, statistics, genai]
