title: "Requests per arm to detect a lift"
alt: >-
  A curve with the lift to detect, in percentage points from 2 to 10, along the bottom, and the requests needed in each
  arm up the side, from a 70 percent baseline resolution rate at a significance level of 0.05 and power of 0.8. Step 1:
  a lime curve falls steeply: 8,077 requests per arm for a 2-point lift, 1,248 for 5 points and 291 for 10 points, so
  halving the lift needs about four times the requests. Step 2: the formula, n equals 7.849 times p1 q1 plus p2 q2,
  divided by the lift squared, worked for 5 points. Step 3: a dashed green curve above it shows that a judge flipping
  10 percent of its verdicts at random shrinks a 5-point lift to 4 points and raises the need to 2,131 requests per arm.
caption: >-
  A 5-point lift needs 1,248 requests per arm; a 2-point lift needs 8,077. A noisy judge makes every lift look smaller
  and the test longer. The 10 percent flip rate is illustrative.
