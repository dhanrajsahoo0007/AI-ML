title: The anatomy of a benchmark
alt: >-
  A flow from left to right. A blue Tasks box (questions and answer keys) and a green Model under test box both feed a
  neutral, ringed Harness box that prompts, calls the model, extracts the answer and grades it. The harness feeds a
  lime Scores box (per task, then averaged), which feeds a violet Leaderboard box. A note says the harness is where
  scores quietly differ: prompt wording, number of worked examples, sampling settings and answer extraction. Below,
  three blue boxes name real task sets with sizes from their papers: MMLU with 15,908 questions in 57 subjects, GPQA
  Diamond with 198 expert-written questions, and SWE-bench Verified with 500 software tasks where tests decide.
caption: >-
  A leaderboard number is tasks plus harness plus scoring rule; change any of the three and the number moves.
tags: [benchmarks, evaluation, mmlu, gpqa, swe-bench, genai]
