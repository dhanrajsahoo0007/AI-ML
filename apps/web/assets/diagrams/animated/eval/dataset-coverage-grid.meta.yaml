title: The golden set as an intent by difficulty grid
alt: >-
  A table in three steps with five intents as rows and easy, medium and hard as columns. Step 1: each cell holds a
  count in blue, darker for larger counts, except the red refunds or returns hard cell; for example order status has 24, 14 and 8, and refunds or returns has 16, 14
  and 4. Step 2: row totals 46, 40, 36, 44 and 34 and column totals 90, 70 and 40 appear, and both add to 200. Step 3:
  a red note about the refunds or returns hard cell, which is red from step 1, explains that it holds only 4 cases, so one wrong answer
  moves that cell by 25 points, and refunds are where money leaves the shop. The counts are illustrative.
caption: >-
  A total of 200 hides the shape of the set: the hard refund cell holds four cases, so its pass rate moves 25 points
  per answer. Counts are illustrative.
