title: Three judge biases
alt: >-
  Three stacked panels, one per bias, each with red bars for three judge models. Position bias: the share of answers where
  the judge preferred the first position is 30.0 percent for GPT-4, 50.0 for GPT-3.5 and 75.0 for Claude-v1; the fix is to
  judge each pair twice with the order swapped. Verbosity bias: the failure rate on 23 answers padded with a repeated list
  is 8.7 percent for GPT-4 and 91.3 percent for both GPT-3.5 and Claude-v1; the fix is to control for length and test with
  a padded copy. Self-preference: GPT-4 wins about 10 points more often for its own answers, GPT-3.5 shows none and
  Claude-v1 about 25 points; the fix is to use a judge from a different model family.
caption: >-
  Numbers are from one study of 2023-era judges (Zheng et al., Tables 2 and 3 and section 3.3); the size changes with
  the judge, the bias does not go away, and each has a cheap test you can run on your own judge.
