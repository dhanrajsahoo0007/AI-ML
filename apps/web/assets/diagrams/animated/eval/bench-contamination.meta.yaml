title: How leaked test items inflate a benchmark score
alt: >-
  A four-step diagram with illustrative numbers. Step 1: a grid of forty blue squares, a public test set. Step 2: a
  second grid of the same forty items in which the first eleven are red, the items an n-gram overlap check found in a
  training corpus. Step 3: a score card shows the model at 80.0 percent on all forty items, 75.9 percent on the 29
  clean items and 90.9 percent on the 11 leaked items, so the headline is 4.1 points above the clean score. Step 4:
  three lime cards give the fixes: a private held-out split that is never published, reporting the clean subset, and a
  canary string in the data.
caption: >-
  Eleven leaked items out of forty lift the headline by 4.1 points; the clean subset is the score to trust. All numbers
  are illustrative.
tags: [benchmarks, contamination, evaluation, genai]
