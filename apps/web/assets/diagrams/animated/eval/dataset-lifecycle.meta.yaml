title: The life of a golden set
alt: >-
  Five stages stacked top to bottom, joined by arrows, each with two lines of detail on the right. Stage 1, sample, in
  blue: candidates from 30 days of logs, personal data removed, plus expert and synthetic cases, 200 in all. Stage 2,
  label, in lime: two annotators write the reference answer and rubric ticks, 200 cases times 2 is 400 labelled copies.
  Stage 3, adjudicate, in lime: they disagree on 22 of 200 cases and a lead settles each, so agreement is 178 of 200,
  89 percent. Stage 4, version, in violet: freeze as golden-v1 with a hash, rubric version, owner and date. Stage 5,
  refresh, in blue: each month retire 12 cases and add 12 from new failures to make golden-v2, still 200, with a dashed
  arrow back to stage 1. Numbers are illustrative.
caption: >-
  A golden set is a versioned artefact with an owner, not a spreadsheet: it is sampled, double-labelled, adjudicated,
  frozen and refreshed on a schedule. Numbers are illustrative.
tags: [evaluation, golden-set, annotation, versioning, brightpost]
