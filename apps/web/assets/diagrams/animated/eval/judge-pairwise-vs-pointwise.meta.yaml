title: Pointwise against pairwise judging
alt: >-
  Step 1: two lime boxes side by side. Pointwise grades one answer against a rubric and returns pass or fail; it costs
  one call per answer, gives a score that means something, works as a release gate and is weak at separating two good
  answers. Pairwise picks the better of two answers; it costs one call per pair, two with the order swapped, needs no
  absolute scale, suits choosing between two prompts and grows with the square of the candidates. Step 2: a table of
  judge calls on 200 tickets. Pointwise needs 400, 600, 1,000 and 2,000 calls for 2, 3, 5 and 10 candidates; pairwise
  with both orders needs 400, 1,200, 4,000 and 18,000, with the 4,000 cell ringed.
caption: >-
  Pairwise matches pointwise at two candidates and falls behind fast: five candidates need four times the calls, ten
  need nine times.
