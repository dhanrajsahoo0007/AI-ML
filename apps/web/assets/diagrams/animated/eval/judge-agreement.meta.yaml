title: Judge against human on 200 tickets
alt: >-
  A two-by-two table of counts for Brightpost's 200-ticket golden set. Rows are the human verdict, fail with 60 tickets
  and pass with 140; columns are the judge's verdict. The judge and the human both said fail on 46 tickets and both said
  pass on 130, shown in lime. The judge passed 14 tickets the human failed and failed 10 the human passed, shown in soft
  red. Beside the table are agreement 88 percent, failures caught 77 percent and Cohen's kappa 0.71. Below, a judge that
  always says pass would agree 70 percent of the time but have a kappa of zero.
caption: >-
  Agreement is the diagonal, 176 of 200; kappa removes the agreement that luck would give, and the 14 missed failures
  are the cell to read first. Counts are illustrative.
tags: [llm-as-judge, cohen-kappa, agreement, evaluation, genai]
