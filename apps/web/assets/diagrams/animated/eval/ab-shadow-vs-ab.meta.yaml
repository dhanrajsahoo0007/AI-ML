title: "Shadow traffic against a live A/B test"
alt: >-
  An architecture diagram in two steps with the same six nodes: an orange customer, a neutral traffic router, a green
  live Prompt A, a green candidate Prompt B, an orange reply seen by the customer, and a lime judge and metrics node.
  Step 1, shadow traffic: every request goes to Prompt A, and only A's answer reaches the customer. A dashed copy of the
  request also goes to Prompt B, whose answer goes to the judge and is never shown, while A's answer is also scored, so
  the two are compared on the same requests. Step 2, live A/B: the router sends half of the users to each prompt, both
  answers reach customers, and what the customers do next flows into the metrics as an outcome.
caption: >-
  In shadow mode the candidate is judged on real requests but no customer sees it, so there is no risk and no outcome
  data; in an A/B test customers see it, so you learn what they do and the risk is real.
