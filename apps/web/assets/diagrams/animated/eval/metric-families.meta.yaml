title: Four families of quality metric
alt: >-
  Four columns revealed one per step, each with a header box and three boxes below it for what the metric needs, what it
  costs and what it is blind to. Step 1, blue, reference-based metrics such as exact match, BLEU and ROUGE: they need a
  reference answer, cost only string arithmetic and are blind to a right answer in other words. Step 2, pink,
  embedding-based metrics such as BERTScore and cosine similarity: they need a reference and an encoder, cost one small
  model pass and are blind to a flipped number or a no. Step 3, green, judge-based rubric scores from an LLM: they need a
  rubric, cost one model call per score and carry length and order bias. Step 4, teal, task-based metrics: they need an
  outcome you can check, cost a test harness or a label and say nothing about why a case failed. Step 5: an arrow under
  all four columns reads usually closer to what the customer wants, and costlier to run. No numbers are drawn.
caption: >-
  Four ways to score an answer, from cheap word matching to checking the outcome. Each is blind to something the next
  one sees.
tags: [evaluation, metrics, bleu, rouge, bertscore, llm-judge]
