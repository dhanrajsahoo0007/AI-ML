title: "A regression gate in CI for a prompt change"
alt: >-
  A three-step figure. Step 1 shows four boxes joined by arrows: a neutral Prompt change pull request, a lime Suite runs
  box for the 200 golden tickets, a violet Compare box holding the stored baseline of 180 of 200, and a green Allow or
  block box. A note says one run sends 440,000 input tokens, 0.1 percent of a day's input, and that the gate has three
  rules: a floor, no drop beyond the noise band, and no broken must-pass case. Step 2 shows prompt p12 meeting three
  lime checks and a green Allow: 184 of 200 against a needed 170, a gain of 4 cases which sits inside the noise band of
  175.5 to 184.5, and 12 of 12 refund-limit cases. Step 3 shows prompt p13 with two red checks and a red Block: 164 of
  200 is under the floor and 16 cases below the baseline, far outside the band, although its 12 must-pass cases pass.
caption: >-
  The suite runs on every prompt change and the gate applies three rules; a change must clear the floor, must not fall
  outside the noise band around the baseline, and must not break a must-pass case. Pass counts are illustrative.
tags: [regression-testing, ci, evaluation, gate, genai]
