title: The map of LLM evaluation
alt: >-
  A grid of two rows and three columns. The columns say what is graded: a single output, a path (the steps taken), and
  the whole system. The top row, in lime, is offline evaluation before release: the golden set of 200 tickets graded
  against references, a scripted refund run that checks tool order and approval at 42 pounds, and a release regression
  suite on the whole pipeline. The bottom row, in orange, is online evaluation on real traffic: a judge on live
  samples, trace checks that approval ran on refunds over 30 pounds, and outcome signals such as thumbs-down,
  hand-offs and A/B tests. A dashed arrow runs from the online output cell up to the golden set cell: a failure found
  live becomes a test case. A small map of the whole lifecycle at the top right rings the Evaluate stage.
caption: >-
  Evaluation is a grid, not a number: every cell needs its own check, and failures found in the bottom row feed the
  golden set at top left.
