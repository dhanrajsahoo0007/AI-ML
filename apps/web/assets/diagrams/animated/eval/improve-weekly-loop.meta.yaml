title: "One week of the improvement loop at Brightpost"
alt: >-
  A five-step diagram with one column per weekday, built up day by day. Monday, in blue: 50 thumbs-down traces are read
  and 14 of them, 28 percent, are a refund over 30 pounds sent with no approval. Tuesday, in blue: the 14 failures
  become test cases, so the set grows from 200 to 214 cases. Wednesday, in green: the rule moves into a code check in
  the refund tool, and the offline pass rate rises from 80.4 to 87.4 percent. Thursday, in lime: three broken cases are
  read and fixed, then a 5 percent canary carries 10,000 requests a day. Friday, in orange: the change is promoted to
  25 percent and then 100 percent, and the next Monday's sample holds 3 such failures out of 50, down from 14. A long
  arrow at the bottom says that the next Monday's traces start the next loop.
caption: >-
  A week is enough for one targeted change: every day produces something checkable. All counts are illustrative.
tags: [evaluation, continuous-improvement, worked-example, genai]
