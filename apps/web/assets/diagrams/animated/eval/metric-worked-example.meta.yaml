title: One Brightpost answer scored four ways
alt: >-
  A figure in six steps. Step 1 shows three rows: the customer's question about order 4471, a cracked kettle and a refund
  of 42 pounds; the golden-set reference answer in blue, which sends the refund for approval because refunds over 30
  pounds need it; and answer A in green, which says the 42 pounds has been refunded to the card. Step 2, token overlap:
  9 shared tokens, precision 9 over 13 equals 0.69, recall 9 over 19 equals 0.47, F1 equals 0.56, exact match 0 and BLEU
  0.21. Step 3, embedding similarity: cosine 0.96, while two off-topic sentences score 0.54 and 0.59. Step 4, judge
  rubric: acknowledges the damage yes, states 42 pounds yes, sends for approval no, so 2 over 3 equals 0.67. Step 5, task
  success: 42 is over 30 and no approval was requested, so the score is 0. Step 6: a red highlighted box says answer A
  is wrong because it promises 42 pounds with no approval, and a second line says three metrics score it 0.56 to 0.96 while only the task check gives 0. The embedding cosines were
  measured with a small open model and the judge verdicts are illustrative.
caption: >-
  A wrong answer that sounds right scores 0.56, 0.96 and 0.67 on three metrics and 0 on the one that checks the
  outcome. Judge verdicts are illustrative.
tags: [evaluation, metrics, bleu, rouge, embedding, llm-judge, task-success, brightpost]
