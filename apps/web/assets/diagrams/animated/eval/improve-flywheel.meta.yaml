title: "The improvement flywheel"
alt: >-
  An architecture diagram built in seven steps, forming a loop. Step 1: an orange Production node, which answers
  customers, logs every request into a blue Traces node. Step 2: a neutral failure-mining node reads 50 of the traces
  and names the failures. Step 3: the failures become 14 new cases added to a blue test set that starts at 200 tickets.
  Step 4: one change, in green, is aimed at the biggest failure. Step 5: a lime offline evaluation runs the candidate
  on the whole set, and a dashed link shows it using the test set. Step 6: a lime canary shows the candidate to 5
  percent of traffic. Step 7: the canary promotes the change into production, and the loop closes because production
  writes the next traces.
caption: >-
  Each stage hands the next one something concrete: traces, then named failures, then test cases, then a candidate,
  then evidence. Nothing reaches all customers without passing both an offline and a live check. Counts are illustrative.
tags: [evaluation, continuous-improvement, flywheel, genai]
