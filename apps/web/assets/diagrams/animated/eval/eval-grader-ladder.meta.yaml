title: The grader ladder
alt: >-
  Three columns, one per way to grade an answer. A lime code check, a green model judge with a ring, and a neutral
  person, joined by arrows labelled too rigid and check it. Under them, blue cost cards with illustrative
  prices: the code check costs nothing; the judge costs about 0.009 dollars per grade, 1.77 dollars for the 200-ticket
  golden set; a person costs 1.50 dollars per grade, 300 dollars for the set. Under those, what each can be trusted
  for: the code check is exact but narrow, the judge broad but biased, the person the reference but slow. A long arrow
  underneath says cost and nuance rise together, so use the cheapest rung that can tell the difference.
caption: >-
  A person costs about 170 times a judge per grade, and a judge costs next to nothing beside a person; prices and wages
  are illustrative.
tags: [evaluation, graders, llm-as-judge, cost, genai]
