title: "Sticky user buckets: one user, one prompt"
alt: >-
  An architecture diagram built in four steps. Step 1: an orange customer node, user 8812, sends a request among
  Brightpost's 200,000 a day. Step 2: a neutral assignment layer, the accent, hashes a salt plus the user id and takes
  the remainder after dividing by 100; the example user lands in bucket 37, so the request goes to a green Prompt A,
  the current prompt for buckets 0 to 49, while buckets 50 to 99 go to a green Prompt B, the new prompt. Step 3: the
  assignment layer writes the arm to a violet exposure log before the answer is made. Step 4: both arms' answers are
  scored and joined to the log by user in a lime metrics node that reports resolution, cost and p95 latency per arm.
caption: >-
  The same user always lands in the same bucket, so a customer never sees the prompt change mid-conversation, and the
  log records who was exposed before anything is measured. Bucket 37 is an example value.
