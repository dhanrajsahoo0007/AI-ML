title: Two annotators against each other
alt: >-
  A two-by-two table of counts for 200 tickets labelled by two annotators. Rows are annotator A, fail with 62 tickets and
  pass with 138; columns are annotator B. Both said fail on 52 and both said pass on 126, shown in lime; they differ on 10
  and 12, shown in soft red. Beside the table: agreement 89 percent, 22 tickets differ, Cohen's kappa 0.75. Below, two blue
  boxes show the final labels after the adjudicator settles the 22 differences: 60 fail, made of 52 agreed and 8
  adjudicated, and 140 pass, made of 126 agreed and 14 adjudicated.
caption: >-
  Agreement and kappa say whether the rubric is clear before the labels are trusted; the 22 disagreements are the only
  tickets an adjudicator reads. Counts are illustrative.
tags: [human-evaluation, cohen-kappa, inter-annotator-agreement, adjudication, genai]
