title: "What offline and online evaluation each catch"
alt: >-
  A matrix in three steps. Five kinds of failure run down the left: a prompt edit that breaks a known refund case, a new
  kind of question such as gift cards, a provider changing the model behind an alias, a stale help article, and a rare
  failure of 1 request in 5,000. Step 1 fills the offline column: the golden set catches the known refund case before
  release in solid lime, catches a model change only at the next nightly run in pale lime, and misses the other three in
  outlined neutral boxes, expecting 0.04 cases of the rare failure in 200 tickets. Step 2 fills the online column: the
  sample catches the refund case late, in pale lime, and catches the other four in solid lime, seeing 2 of the 40 daily
  rare failures. Step 3 says offline blocks known problems, online finds unknown ones, and every online find should
  become an offline case.
caption: >-
  Offline evaluation blocks what you already know about, before release; online evaluation finds what you did not,
  after it. The 1-in-5,000 rate is illustrative; the other numbers are computed from Brightpost's traffic.
tags: [online-evaluation, offline-evaluation, coverage, genai]
