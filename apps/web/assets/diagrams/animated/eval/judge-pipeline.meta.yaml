title: A model judge, step by step
alt: >-
  An architecture diagram in five steps. Step 1: three inputs on the left: the customer's question about order 4471, a
  cracked kettle, in orange; the assistant's answer in green; and the rubric in blue. Step 2: all three flow into one
  grey judge prompt, which makes a single call to the green judge model. Step 3: the judge model returns a lime verdict
  as JSON, a reason first and then pass or fail. Step 4: the verdict is saved in a violet results store, one per
  ticket, 200 tickets per run. Step 5: a dashed arrow carries a sample from the results store to a person who reads it.
caption: >-
  The judge sees the question, the answer and the rubric in one prompt, writes its reason before its verdict, and a
  person checks a sample of what it says.
tags: [llm-as-judge, evaluation, rubric, genai]
