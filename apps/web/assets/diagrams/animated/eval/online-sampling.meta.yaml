title: "Online evaluation: sample, judge asynchronously, show, alert"
alt: >-
  An architecture diagram in six steps. Orange customers, at up to 12 requests a second, ask the green support assistant
  and get their answer on the normal path (step 1). After the answer, a dashed copy of the trace goes to a neutral
  sampler (step 2), which keeps 5 percent and puts about 10,000 traces a day on a neutral queue (step 3). Lime judges
  read the queue later and write scores to a violet score store, off the request path (step 4). A lime dashboard reads the
  store and shows the pass rate by hour (step 5), and a lime alert rule watches the dashboard for a pass rate below the
  floor (step 6).
caption: >-
  The customer answer never waits for a judge. A copy of the trace is sampled at 5 percent, graded later, stored,
  charted and watched by an alert rule.
tags: [online-evaluation, sampling, llm-judge, monitoring, genai]
