title: Three sources fill the golden set
alt: >-
  A diagram in four steps. Step 1: a blue box, production logs, with an arrow labelled 120 to a lime box on the right,
  the golden set. Step 2: a grey box, expert-written cases, adds an arrow labelled 50. Step 3: a green box, synthetic
  cases checked by a person, adds an arrow labelled 30. Step 4: a bar under the boxes shows the three sources drawn to
  scale, 120 blue, 50 grey and 30 green, and the golden set box reads 120 plus 50 plus 30 equals 200. The split is
  illustrative.
caption: >-
  Logs give the real mix, experts add the cases logs rarely hold, and synthetic cases fill what is still thin. The split
  is illustrative.
