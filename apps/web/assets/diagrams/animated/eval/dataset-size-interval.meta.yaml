title: How the interval on a pass rate shrinks with the test set
alt: >-
  A line chart with the number of test cases from 0 to 1,000 along the bottom and the half-width of a 95 percent
  confidence interval, in percentage points, up the side from 0 to 12, for a pass rate of 80 percent. Step 1: a lime
  curve falls steeply from about 11 points at 50 cases and flattens. Step 2: a highlighted point at 200 cases reads plus
  or minus 5.5 points, so a measured 80 percent means the true rate is roughly 74.5 to 85.5 percent. Step 3: a point at
  800 cases reads plus or minus 2.8, half as wide, because four times the cases halves the width. A panel on the right
  shows the formula and the working, and notes that one intent with 34 cases has plus or minus 13.4. Every point is
  computed from the normal approximation.
caption: >-
  At 200 tickets a pass rate of 80 percent carries about plus or minus 5.5 points; halving that costs four times the
  cases. Computed with the normal approximation.
