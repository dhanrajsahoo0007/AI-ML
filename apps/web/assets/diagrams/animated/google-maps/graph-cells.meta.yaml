title: Cells, boundary nodes and shortcuts
alt: >-
  Three dotted cells of a road graph side by side, with grey junctions joined by grey roads. Step 1: green boundary
  nodes sit where roads cross from one cell to the next, and a caption says the split of 500 million nodes into 50,000
  cells changes only when the map does. Step 2: green dashed shortcuts join each entry and exit boundary node of the
  middle cell, two labelled 4.0 and 6.5 minutes, and a caption says all cells are recomputed from live speeds in about
  5 seconds on 100 cores. Step 3: an orange route from S in the first cell follows roads to a boundary node, crosses
  the middle cell on one shortcut, and follows roads to T in the third cell; the caption says the query visits about
  70,000 nodes in about 7 milliseconds, against about 2 seconds for plain Dijkstra.
caption: >-
  The road layout is split once; live traffic only changes the shortcut weights, and a query searches two cells plus
  the shortcuts between them.
tags: [case-studies, google-maps, routing, graph, partitioning]
