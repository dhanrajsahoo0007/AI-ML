title: From location fixes to a new road weight
alt: >-
  A sequence diagram with six lanes: an orange phone, a grey report ingest, a blue report stream, a teal traffic
  processor, a violet live-speeds store and a teal customizer. Step 1: the phone sends batch b17 of five fixes; the
  ingest appends it to the stream keyed by map cell and acknowledges; the processor matches the fixes to road segment
  s88, adds them to its one-minute window and writes a median of 24 kilometres an hour to live speeds; the customizer
  picks up the changed segment and recomputes the weights of its cell. Step 2: the acknowledgement is lost, drawn as a
  red timeout, so the phone resends b17; the stream holds it twice and the processor drops the copy by batch id. A
  batch from a tunnel arrives three minutes late, after its window closed, and goes to the history only.
caption: >-
  Fixes become one median speed per road segment each minute; a resent batch is dropped by its id, and a late one only
  reaches the history.
