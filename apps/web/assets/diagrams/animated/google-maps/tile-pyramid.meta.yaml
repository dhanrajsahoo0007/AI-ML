title: The tile pyramid
alt: >-
  Three square blue grids side by side. Step 1: zoom 0 is one tile labelled 0/0/0, zoom 1 is four tiles labelled by
  zoom, x and y, and zoom 2 is sixteen tiles. Step 2: violet boxes on the right give the arithmetic: zoom z holds 4 to
  the power z tiles; zoom 16 holds about 4.3 billion, and zoom 0 to 16 about 5.7 billion; if about 30 percent hold
  data, that is about 1.7 billion tiles, or about 34 terabytes at 20 kilobytes each. Step 3: an orange dot marks one
  edited point, and a green line under each grid names the one tile holding it: 0/0/0, 1/1/0 and 2/2/1; a green box says one edit re-cuts one tile per
  zoom, 17 in all, under a new version, and a line under the grids shows the key tiles/v43/z/x/y, so a new version
  is a new URL and cached tiles can live for a year.
caption: >-
  Each zoom splits every tile into four, so zoom 16 alone is 4.3 billion tiles; one edit re-cuts one tile per
  zoom under a new version.
