title: The sliding window counter's estimate
alt: >-
  A layout in three steps on a time axis from 10:00 to 10:02 for key k42, limited to 100 requests a minute. Step 1:
  two grey boxes show the two counters the store keeps: 80 requests from 10:00 to 10:01 and 30 so far from 10:01 to
  10:02. Step 2: a dashed line marks now, 10:01:15; the last 60 seconds start at 10:00:15, so the first 15 seconds
  of the previous minute are dropped, the green 45-second overlap counts 80 times 45 sixtieths, which is 60, and the
  blue current count is 30. Step 3: a green box adds 60 and 30 to make 90, and a lime box says 90 of 100 leaves room
  for 10 more requests, so request 11 gets a 429.
caption: >-
  Two counters per key: weight the previous minute by how much of it is still inside the last 60 seconds, then add the
  current count.
