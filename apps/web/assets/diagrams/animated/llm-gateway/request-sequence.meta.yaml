title: One support call through the gateway
alt: >-
  A sequence diagram with six lanes: an orange support service, a neutral gateway, violet counters, a teal redactor,
  green provider A and a blue meter, built in three steps. Step 1: while support loads the case it posts the new
  message to the scan endpoint, and the CPU name scanner maps "Sarah Collins" to a person placeholder in 13.5
  milliseconds; the call arrives with an idempotency key; identity and the deny-list are checked by 2 milliseconds and
  20,000 bytes are counted; the gateway reserves 0.05512 US dollars plus 5,000 input and 512 output tokens a minute
  in one Redis call; the regex and dictionary pass returns the same placeholders with no name scan; the request leaves
  at 5.6 milliseconds, sticky to the support workspace. Step 2: the first token arrives at 400 milliseconds, of which
  provider A's own share is 394.4; an order lookup tool call goes back to support with its email restored, because
  that field is allow-listed and never inside a URL; usage of 2,700 cache-read, 2,300 cache-write and 30 output tokens
  settles at 0.00632 US dollars with 0.0488 refunded, and the meter gets one row. Step 3: the caller disconnects; the
  gateway aborts the upstream call, settles from its own count of streamed tokens, since input is billed once
  processing starts, and writes a cancelled row.
caption: >-
  The gateway’s work fits in the first 5.6 ms: the name scan already ran during the case load, the reservation is one
  Redis call, and the 0.0488 USD over-reservation comes back at settle.
