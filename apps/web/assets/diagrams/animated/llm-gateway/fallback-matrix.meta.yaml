title: Fallback and what it breaks
alt: >-
  A layout in three steps. Step 1: a table of four moves against six properties, red where the move breaks something,
  lime where it holds once verified and grey where it does not apply. A to B, the same model on Bedrock EU, misses the
  prompt cache and has no server-side refusal fallback, but keeps the schema once each feature is verified, keeps
  thinking signatures once verified with stateful features blocked, stays in the EU profile and is sized for T0 cold.
  A to C, another family, misses the cache and breaks the schema dialect, ids and arguments, thinking blocks and
  safety classifiers; its residency holds per provider. A to S, labs only, misses the cache and has no constrained
  decoding, and stays in London. Any move to another geography misses the cache and is not allowed for UK-or-EU
  aliases. Step 2: two green meters: B needs 9.23 million mid tokens a minute to carry support and voice with no cache
  (8.64 million at a 5 times burndown) against 11.1 million requested, and 7.56 million small against 9.1 million
  requested. Step 3: the error classifier: a 529, a 5xx, a timeout or a T0 first token later than 800 milliseconds
  counts toward the provider breaker, 10 of 20 or more than 10 percent slow in a minute, open 30 seconds, 3 probes; a
  429 from a team's workspace limit moves only that tenant; a ramp 429 slows that tenant; a spend-cap 429 stops and
  pages, never retried; a refusal is a success, recorded and never retried.
caption: >-
  Every move to another provider loses the cache and more; only the same model on Bedrock keeps schemas and safety, and
  only if its quota covers T0 with cold caches.
