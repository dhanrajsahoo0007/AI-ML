title: The support call as the gateway sees it
alt: >-
  One stacked bar of the support agent's first call, 5,000 tokens on average, built in two steps, with a table of what
  the gateway does to each block underneath. Step 1: the cached prefix of 2,700 tokens under a bracket marked never
  touched: teal tool definitions of 1,000 passed through and never re-serialised, grey instructions of 1,200 and the
  grey procedure of 500, untouched, ending at a violet cache-breakpoint tick. Step 2: the 2,300 tokens redacted on every
  call: violet case state of 400 and blue evidence of 1,000 through regex and the dictionary, orange recent turns of 600
  where the dictionary turns "Hi Sarah Collins" into a person placeholder, blue tool results of 250 with field rules,
  and an orange 50-token new message, highlighted in lime as the only block the CPU name scanner reads, pre-scanned.
  Footer lines say the scanner reads 50 tokens, about 200 characters, of about 20,000, the rest is exact-match work of
  about 0.1 milliseconds, and the gateway adds nothing to the prompt, so the same text gives the same bytes on every
  replica.
caption: >-
  The gateway never touches the 2,700 cached tokens; it redacts only the changing blocks, and the name scanner reads
  one 50-token message out of 5,000.
tags: [genai, llm-gateway, context, prompt-caching, redaction, case-study]
