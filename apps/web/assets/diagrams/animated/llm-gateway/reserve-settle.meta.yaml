title: Reserve the upper bound, settle from usage
alt: >-
  A layout in three steps. Step 1: a stage strip starts with a grey count-bytes box, 20,000 bytes, and a lime reserve
  box, 0.05512 US dollars; below it a bar on one money scale shows the reservation as a violet block of 20,000 bytes
  times 2.50, 0.0500, plus a green block for 512 max tokens times 10.00, 0.00512. Step 2: the strip continues with
  green send, leaving at 5.6 milliseconds, blue usage from the message delta, and lime settle and refund, 0.00632;
  a second bar shows what was settled, a small blue cache-read, violet cache-write and green output block adding to
  0.00632, and the rest of the reservation on paper, refunded 0.0488 US dollars; the rate was an estimate, 5,000 input
  and 512 output tokens a minute held, settled to 2,300 and 30. Step 3: overshoot on labs' 84-dollar day with 20 calls
  in flight: charging after the response overshoots 1.69 dollars, 2.0 percent, in red; with a 20-second-stale check,
  2.98 dollars, 3.5 percent, in red; reserving the upper bound, 0, in green. A note says the price is held budget:
  labs' last 6.81 dollars, 8.1 percent of its day, is refused until calls settle.
caption: >-
  Reserving what a call could cost and refunding the rest makes overshoot zero; gateways that charge after the
  response overshoot by everything in flight.
tags: [genai, llm-gateway, budgets, rate-limiting, cost, case-study]
