title: The gateway's release gate
alt: >-
  A gate diagram in one step. A grey gateway release, a tracing build, fans out to eight checks and on to a red Block
  box that says to take the id out. Six checks pass in lime: overhead p95 of 8.9 and 34.2 milliseconds at 100 requests
  a second a pod against 20 and 60; budget overshoot of 0 US dollars under a labs-shaped loop of 20 calls in flight;
  redaction lower bounds of 99.4 and 96.2 percent with no raw values carried over; fallback target B 1.5 points lower
  on the gold set, inside a minimum detectable difference of 4.4; a 10-minute drill of a T0 alias on B with 99.6
  percent good calls; and a 0.4 percent reconciliation gap. Two fail in red: determinism, with byte diffs on 8 of 16
  pods because the request id went into the prompt, and the cache replay, 34 points under direct. Notes say canaries
  keep running after release, 50 prompts every 10 minutes a target, 7,200 a day, catching large shifts only, and that
  measured values are illustrative.
caption: >-
  The release fails determinism, and the cache replay with it: a tracing build put the request id into the prompt on
  half the replicas, so the same input stopped producing the same bytes.
