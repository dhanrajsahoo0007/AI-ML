title: The LLM platform and gateway, built in eight steps
alt: >-
  An architecture diagram in six zones, built in eight steps. Step 1: orange team services send an alias with their
  workload identity to a dark accent gateway replica, which takes the provider key from a violet key vault and calls
  green provider A, the Anthropic API; a grey control plane issues the keys. Step 2: a lime quota and budget card joins
  under the replica, reserves each call in a violet counter store before the call leaves, and settles it afterwards.
  Step 3: a lime router with breakers joins the pipeline and adds provider B, the same model on Bedrock EU for T0 only,
  and provider C, a second family for the assistant only. Step 4: a stickiness card hangs off the replica, and a
  self-hosted pool of 2 GPUs for labs joins the providers. Step 5: a lime redactor joins between quota and router and
  keeps a violet conversation dictionary, used on every turn. Step 6: a teal stream relay takes events from the router,
  un-redacts through the redactor and streams the answer back to the team services. Step 7: a blue meter writes one
  row a call along the bottom into a violet metering and audit store of 1.58 million rows a day, which a lime
  reconcile card reads. Step 8: a grey cell router sits between the team services and the replica; the control plane
  writes a signed config snapshot and deny-list that the replica reads as last-known-good, and a lime evaluation card
  feeds the control plane's gates.
caption: >-
  Every model call passes one gateway: identity and budgets first, then redaction and a cache-preserving route to a
  tested target, with every call metered and each tenant group in its own cell.
