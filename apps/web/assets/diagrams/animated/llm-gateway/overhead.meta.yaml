title: The gateway's own latency, and what a fallback costs
alt: >-
  Three waterfalls built in three steps. Step 1: the plain path, seven grey, violet and lime bars from the hop to the
  cell router through workload identity, parsing, a 2-millisecond Redis reservation, the regex and dictionary pass and
  routing; the request leaves for the provider at 5.6 milliseconds at p50, with p95 at 9.3 and the p95 target at 20.
  Step 2: the same spans with a highlighted 13.5-millisecond CPU name scan inserted before routing, so the request
  leaves at 19.1 milliseconds, p95 36.0; support and voice pre-scan instead. Step 3: five first-token bars against a red
  800-millisecond SLI line on a second scale: normal 400, breaker open and straight to B 550, voice going to B at once
  600, all green; a silent provider A costing the 800-millisecond deadline then B, 1,350, and the first unlucky call
  before the breaker opens, 3,450, both red. A footer gives p95 as p50 plus the root-sum-square of the spreads and says
  provider A keeps 394.4 of the tenants' 400 milliseconds.
caption: >-
  The gateway’s own spans add 5.6 ms at p50; an inline name scan would more than triple that, and a fallback costs far
  more than either until the breaker opens.
