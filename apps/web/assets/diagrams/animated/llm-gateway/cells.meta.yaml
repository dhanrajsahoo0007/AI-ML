title: Not becoming the outage
alt: >-
  A layout in three steps. Step 1: orange callers, the support agent, the voice agent and the assistant with AP and
  labs, each go to their own cell in a London Region group: a green support cell and a green voice cell of 3 pods each
  and a grey other cell of 2 pods, each able to carry its traffic alone; an Ireland group, active-active, holds the
  same three cells; above them a grey control plane sends signed snapshots to both Regions and a violet deny-list in
  object storage is pulled by both Regions every 10 seconds. Step 2: a table of what happens when a dependency is
  down: for the support and voice cells, all in lime, the counter store fails open on local counters for up to 15
  minutes with a page, the budget ledger fails open with a page at about 18.8 US dollars per 15 minutes, the name
  scanner falls back to regex and the dictionary for up to 4 hours then people, a dictionary miss is a chunked scan
  of about 57 milliseconds, the control plane's loss leaves last-known-good routes and the deny-list, metering spools
  to a local queue, and provider A's loss sends voice first then support to B; for the other cell the counter store,
  ledger, scanner and dictionary close in red, and provider A's loss sends the assistant to C and labs to S or closed.
  Step 3: bad minutes a month for T0: 2 for the cells, 8.6 for A down times 0.2, 1 for detection, 7.5 for brownouts
  and 0.1 for the scanner add to 19.2, 99.955 percent, against a 43.2-minute 99.9 percent budget and a 21.6-minute
  99.95 percent line; a month like December 2024, 262 minutes down on one provider, adds to 63, 19.8 over the budget.
caption: >-
  Three cells in two Regions keep one tenant’s failure away from the others; the bad minutes, brownouts included, sum
  to 19.2 against a 43.2-minute budget.
