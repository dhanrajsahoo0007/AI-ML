title: The voice latency budget
alt: >-
  Two timing charts on one millisecond axis, each with five stages in a row. The top chart is a tuned phone agent: a
  300 millisecond wait for the end of the caller's turn in lime, an 80 millisecond speech-recognition tail in violet, a
  400 millisecond wait for the model's first token in green, 120 milliseconds for the first speech-synthesis audio in
  violet and 100 milliseconds of telephony and network in grey, so the reply starts 1,000 milliseconds after the caller
  stops. The bottom chart changes only the wait to 800 milliseconds, the documented default of one live voice API, and
  the reply starts at 1,500 milliseconds. A footer shows both sums and says all stage times are illustrative except
  the model's 400 milliseconds.
caption: >-
  The wait for the end of the turn is the biggest lever. Stage times are illustrative; the 400 ms model time is
  Brightpost's target and the 800 ms default is Gemini Live's documented server default (read 16 November 2026).
