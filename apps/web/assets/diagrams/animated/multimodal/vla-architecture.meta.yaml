title: Two VLA designs, action tokens and an action expert
alt: >-
  A two-step figure with two rows of blocks. Step 1, OpenVLA: a blue image and instruction box, then green SigLIP and
  DinoV2 vision encoders, a grey two-layer MLP projector, a green Llama 2 language model of 7 billion parameters, an
  orange block of action tokens, seven per action, highlighted, and a teal action of seven numbers. Notes say 970
  thousand robot episodes, 256 bins per dimension, 15 gigabytes in bfloat16 and about 6 actions a second, 167
  milliseconds each, on one RTX 4090. Step 2, pi0: a blue images and instruction box with robot state, a green
  PaliGemma vision-language model of 3 billion parameters, a highlighted green action expert of 300 million new
  parameters a grey flow-matching block of 10 steps and a teal action chunk of 50 actions.
  Notes say 3.3 billion parameters in all, control up to 50 hertz, and 73 milliseconds per chunk on an RTX 4090.
caption: >-
  OpenVLA predicts an action one token at a time, so it is as slow as a language model. pi0 adds a small expert that
  makes 50 actions in one flow-matching pass, which is how it reaches fast, smooth control.
tags: [robotics, vla, openvla, pi0, flow-matching, multimodal]
