title: Every modality becomes tokens in one sequence
alt: >-
  A left-to-right figure with four rows. Row 1, orange: the text question "Where is my refund?" goes through a
  tokenizer and becomes 15 tokens. Row 2, blue: the photo of the cracked kettle goes through a vision encoder and
  becomes 576 tokens, a 24 by 24 grid of patches. Row 3, violet: the phone call goes through an audio encoder and
  becomes 1,500 positions for a 30-second window. Row 4, blue: a 10-second unboxing clip goes through a frame encoder
  and becomes 5,760 tokens, 10 frames of 576 each, illustrative. The four token boxes sit inside a dotted group labelled
  one token sequence, and all four arrows end at one green box, the language model, which reads one sequence.
caption: >-
  Encoders differ by modality; after them the language model sees only vectors in a sequence. Colour marks the
  modality, and the token counts show why video and audio cost far more than text.
