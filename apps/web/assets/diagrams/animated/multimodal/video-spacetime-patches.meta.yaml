title: From a clip to spacetime patches
alt: >-
  A four-step figure. Step 1: a blue box for an illustrative video clip of 81 frames of 480 by 832 pixels, with a row
  of blue cells under it standing for frames. Step 2: a green video VAE that makes the clip 4 by 8 by 8 smaller feeds a
  blue latent video of 21 frames by 60 by 104 by 16 channels, where 21 equals 1 plus 80 divided by 4. Step 3: a green
  patchify box cuts 1 by 2 by 2 patches, giving a strip of pink tokens and the count 21 times 30 times 52 equals 32,760
  tokens. Step 4: two bars on one scale compare 256 tokens for one 256 by 256 image in a diffusion transformer with
  32,760 tokens for the clip, which is 128 times as many tokens and about 16,000 times as many attention pairs.
caption: >-
  A few seconds of video becomes tens of thousands of tokens after compression, and attention cost grows with the
  square. The clip size is illustrative; the compression rules are from the Wan 2.1 report.
tags: [video-generation, spacetime-patches, diffusion-transformer, tokens, multimodal]
