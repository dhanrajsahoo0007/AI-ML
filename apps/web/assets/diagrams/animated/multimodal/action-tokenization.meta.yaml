title: Actions as tokens
alt: >-
  A three-step figure. Step 1: a number line from minus 0.02 to plus 0.02 metres with a teal dot at plus 0.012 metres,
  the sideways movement of a warehouse arm's gripper in one step (illustrative). Step 2: the line cut into 256 equal
  bins, each 0.156 millimetres wide, numbered 0 to 255; a strip shows bins 196 to 211 with bin 204 shaded, because 0.012
  plus 0.02 divided by 0.04 times 256 is 204.8. The robot gets back the bin centre, an error of at most 0.078
  millimetres. Step 3: seven orange token cells for the seven action dimensions, delta x, y, z, roll, pitch, yaw and
  grip, holding bins 204, 102, 32, 128, 140, 192 and 255. Notes say seven tokens at six actions a second is 42 tokens a
  second, and that RT-2 uses the same 256 bins at 1 to 3 hertz for its 55 billion parameter model.
caption: >-
  Each dimension of the movement is rounded to one of 256 bins and written as a token, so the language model can
  predict an action the way it predicts a word. Values and ranges are illustrative; the 256 bins are RT-2's and OpenVLA's.
tags: [robotics, vla, action-tokens, quantisation, multimodal]
