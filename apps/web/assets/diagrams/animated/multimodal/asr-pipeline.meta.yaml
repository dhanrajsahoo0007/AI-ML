title: Speech recognition, from waveform to text
alt: >-
  A five-step left-to-right flow of the Whisper recipe. Step 1: a violet box, the waveform, with a note that 16,000
  samples a second for 30 seconds make 480,000 numbers. Step 2: a violet box, the log-mel spectrogram, cut with 25
  millisecond windows every 10 milliseconds, giving 3,000 frames of 80 bins, 240,000 numbers. Step 3: a green box, the
  encoder, whose second convolution halves the time axis so 3,000 becomes 1,500 positions. Step 4: a green box, the
  decoder, which reads the encoder output, starts with special tokens for language and task and writes one token at a
  time. Step 5: an orange box of text tokens with the sentence "i want a refund for order four four seven one", and a
  dashed arrow that feeds each new token back into the decoder.
caption: >-
  Sound becomes numbers, numbers become a grid, the grid is encoded once, and the decoder writes the transcript one
  token at a time. Sizes are Whisper's: 16 kHz, 30 s, 25 ms windows, 10 ms steps, 80 bins.
tags: [speech, asr, whisper, encoder-decoder, multimodal]
