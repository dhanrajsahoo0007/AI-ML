title: A cascade against a speech-to-speech model
alt: >-
  Two rows. The top row, the cascade, shows seven blocks in a line: violet audio in, a green recogniser, orange text, a
  green language model, orange text, a green speech-synthesis model and violet audio out, so three models and two text
  hops. Notes say it is easy to log, test and guard because every hop is text and each stage can be swapped, but the
  times add up and tone, hesitation and laughter are lost at the text hop. The bottom row, speech to speech, shows
  violet audio in, one wide green speech-to-speech model and violet audio out. Notes say it has one hop, so no waiting
  between stages and it hears how something is said, but it is harder to inspect and guard, tools still work, and the
  choice of model is the vendor's.
caption: >-
  The cascade gives control and a text trail at the cost of added latency; a speech-to-speech model gives one hop and a
  richer voice at the cost of visibility.
tags: [voice, cascade, speech-to-speech, architecture, multimodal]
