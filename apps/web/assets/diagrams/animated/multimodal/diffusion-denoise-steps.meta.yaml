title: From noise to an image
alt: >-
  Five eight-by-eight grids of blue cells, left to right, drawn as a toy picture of a kettle at five steps of the
  diffusion noise schedule. At t equals 1000 the cells are random shades and the signal share is 0.01. At t equals 500
  a faint rounded shape begins to show (signal 0.28). At t equals 300 the body and lid are clear (signal 0.63). At t
  equals 150 the shape is nearly clean (signal 0.89). At t equals 0 the grid is the clean kettle shape. Arrows run left
  to right between the grids, and a formula at the top gives how each snapshot is a mix of signal and noise. A note
  says generation runs the path backwards, a network predicting the noise and a sampler removing some of it.
caption: >-
  Every panel is the same picture mixed with the same noise in a different proportion. Training teaches a network to
  predict the noise; generation removes it step by step. Five snapshots, not five sampler steps.
tags: [diffusion, image-generation, ddpm, noise-schedule, multimodal]
