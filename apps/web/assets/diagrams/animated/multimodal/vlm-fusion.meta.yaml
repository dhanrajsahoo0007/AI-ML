title: Two ways to feed an image to a language model
alt: >-
  Two panels side by side. Step 1, left panel: a blue photo box feeds a green vision encoder and projector, which
  produces 576 pink visual tokens. Next to them sit pink question tokens. Both arrows go into one orange
  self-attention block over all tokens, followed by a blue feed-forward block, inside an LLM whose same blocks repeat N
  times. A note says the cost is 576 extra positions in every layer. Step 2, right panel: a blue image box feeds a
  green vision encoder, which feeds a pink Perceiver Resampler producing 64 visual tokens. Separately, pink text tokens
  climb through a stack of grey frozen LM blocks alternating with two orange gated cross-attention blocks marked new.
  Arrows labelled keys and values carry the 64 visual tokens into each cross-attention block. Notes say only the new
  layers train and the text length is unchanged.
caption: >-
  Both designs end with the language model reading an image. The projector makes images longer sequences; the
  cross-attention design keeps the sequence short and adds layers instead.
tags: [vision-language, vlm, cross-attention, flamingo, llava, multimodal]
