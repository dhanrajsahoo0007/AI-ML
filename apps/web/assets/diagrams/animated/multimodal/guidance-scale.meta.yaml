title: Classifier-free guidance with numbers
alt: >-
  Five rows of four numbers each, standing for four latent cells, with made-up values. Step 1: a blue row for the
  denoiser's noise prediction without the prompt (0.10, minus 0.20, 0.30, 0.00) and an orange row with the prompt (0.30,
  minus 0.10, 0.20, 0.40). Step 2: a grey row for their difference, what the prompt adds (0.20, 0.10, minus 0.10, 0.40).
  Step 3: a green row for guidance scale 1, which equals the conditional prediction. Step 4: a green row for guidance
  scale 7.5 (1.60, 0.55, minus 0.45, 3.00), which steps 7.5 times as far along the difference. Notes on the right give the
  formula, epsilon equals epsilon-uncond plus w times the difference, say two denoiser passes run per step, and say a
  higher scale matches the prompt more strongly with less variety.
caption: >-
  Guidance is one line of arithmetic: take the prompt's pull and multiply it by w. At w = 7.5 the first cell is 1.60,
  more than five times its conditional value of 0.30. The numbers are illustrative.
tags: [diffusion, classifier-free-guidance, guidance-scale, image-generation, multimodal]
