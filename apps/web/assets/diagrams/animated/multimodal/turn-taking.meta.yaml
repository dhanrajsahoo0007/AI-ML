title: Turn-taking on a phone call
alt: >-
  A five-step timeline from 0 to 7 seconds with three lanes: caller, turn detector and agent. Step 1: the caller speaks
  from 0 to 2.4 seconds, in violet, and the lime turn detector hears speech for the same span. Step 2: a 300
  millisecond wait of silence, then a dashed line at 2.7 seconds marks the end of the turn. Step 3: the agent thinks in
  green from 2.7 to 3.4 seconds and starts speaking in violet at 3.4 seconds, 1,000 milliseconds after the caller
  stopped. Step 4: the caller speaks again at 4.6 seconds and the turn detector marks barge-in. Step 5: the agent stops
  at 4.7 seconds; the last part of its reply, up to 6.0 seconds, is shown pale as never played. A note says the caller
  heard 1.3 seconds of a 2.6 second reply and that only what was heard should be saved to the transcript. Times are
  illustrative.
caption: >-
  The end of a turn is a guess made after a wait. The agent's stop is another guess made in 100 ms. What the caller
  actually heard decides what goes into the conversation history. Times are illustrative.
tags: [voice, turn-taking, barge-in, vad, timeline, multimodal]
