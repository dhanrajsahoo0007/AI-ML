title: Text to speech, from text to a waveform
alt: >-
  A six-step left-to-right flow. Step 1: an orange box, the reply text "Refund of 42 pounds for order 4471 approved".
  Step 2: a grey box, normalise, which writes 42 pounds as forty-two pounds and 4471 as four four seven one. Step 3: a
  green box, the acoustic model, which decides pitch, pace and stress. Step 4: a violet box of acoustic frames, one
  every 10 milliseconds, 100 a second. Step 5: a green box, the vocoder, which turns each frame into 240 samples
  (24,000 divided by 100). Step 6: a violet box, the waveform, 24,000 numbers for each second, sent to the caller. A
  footer says the settings are illustrative and that another design has a language model write audio-codec tokens that
  a codec decoder turns into the waveform.
caption: >-
  Text is written out as words, planned as a compact sound picture, then drawn as a waveform. The numbers (24 kHz,
  10 ms frames) are illustrative settings.
tags: [speech, tts, vocoder, audio, multimodal]
