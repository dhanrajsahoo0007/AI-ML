title: The vision-language-action loop
alt: >-
  An architecture diagram built in five steps for a warehouse picking arm. Step 1: an orange instruction box, "pick the
  kettle, order 4471", and a blue camera showing the shelf both send to a green VLA model. Step 2: the model returns one
  action as seven numbers. Step 3: a teal robot controller turns the action into joint targets for a teal picking arm.
  Step 4: the arm moves and grips, the blue warehouse shelf changes, and the camera sends a new image back to the model.
  Step 5: a control-rate clock asks the model again, about six times a second, 167 milliseconds apart, the published
  rate of one open VLA model on one consumer GPU.
caption: >-
  A VLA model is called in a loop. Every pass sees a fresh image, so the robot can correct itself, and the time between
  passes (here 167 ms) limits how fast and fine the movement can be.
tags: [robotics, vla, control-loop, warehouse, multimodal]
