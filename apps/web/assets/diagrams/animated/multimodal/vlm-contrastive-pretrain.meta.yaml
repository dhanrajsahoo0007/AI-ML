title: Contrastive pre-training on a batch
alt: >-
  Step 1: four blue photo boxes down the left (cracked kettle, parcel label, order receipt, delivery box) and four
  orange caption boxes across the top, one caption per photo, in a batch of four pairs; CLIP uses 32,768. Step 2: a
  four by four grid of pink cells shows the cosine similarity of each photo with each caption. The four diagonal cells,
  where a photo meets its own caption, are strongest at 0.98; the other twelve are between 0.75 and 0.82. Step 3: for
  row 1, four pink bars show the probability of each caption at temperature 0.07, about 0.87 for the right caption and
  between 0.03 and 0.06 for the others, so the loss is minus the natural log of 0.87, about 0.14. Notes say training
  pushes the diagonal up and the twelve other cells down, and that the columns give the same loss the other way.
caption: >-
  The only label is the pairing. Raise the diagonal, lower everything else, and photos and captions about the same
  thing land close together. The vectors are illustrative.
tags: [vision-language, clip, contrastive-learning, embeddings, multimodal]
