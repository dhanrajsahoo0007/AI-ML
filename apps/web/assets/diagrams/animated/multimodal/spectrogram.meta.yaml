title: From a waveform to a spectrogram
alt: >-
  A three-step figure in violet, the colour of audio. Step 1: a waveform of 1,600 samples, 0.2 seconds at 8,000 hertz,
  that wiggles slowly for the first half (a 500 hertz tone) and fast for the second half (a 2,000 hertz tone). Step 2:
  three overlapping 25 millisecond windows below the wave, each starting 10 milliseconds after the last, 18 windows in
  all. Step 3: a grid of 8 frequency bands by 18 windows, darker where there is more energy; the dark cells sit in a low
  band for the first half and jump to a higher band for the second half. A note says the toy uses 8 kilohertz and 8
  bands while Whisper uses 16 kilohertz and 80 bands.
caption: >-
  A spectrogram is a grid of how much energy sits in each frequency band at each moment. The toy signal is computed in
  the spec; Whisper uses the same recipe with 80 bands.
tags: [speech, asr, spectrogram, audio, multimodal]
