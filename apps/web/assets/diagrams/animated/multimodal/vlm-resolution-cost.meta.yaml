title: What the kettle photo costs in tokens
alt: >-
  A five-step figure using one provider's tile rule for its gpt-4o and gpt-4.1 models, read on 15 November 2026. Step
  1: a blue rectangle for a phone photo of 4032 by 3024 pixels. Step 2: a smaller rectangle of 2048 by 1536 after
  fitting inside 2048 by 2048. Step 3: a smaller one again, 1024 by 768, after shrinking the shortest side to 768.
  Step 4: a two by two grid of four blue tiles of 512 pixels, each worth 170 tokens, so 85 plus 4 times 170 equals 765
  tokens. Step 5: three bars on one scale compare the 2,200-token Brightpost text prompt with the photo at high detail
  (765 tokens) and at low detail (85 tokens); a note says the photo adds 35 percent to the prompt and costs about
  0.0019 dollars at an illustrative price of 2.50 dollars per million tokens.
caption: >-
  Pixels become tokens in steps: resize, count tiles, multiply. The kettle photo costs 765 tokens, about a third of a
  whole text prompt. Rule dated 15 November 2026; the price is illustrative.
tags: [vision-language, image-tokens, cost, tiles, multimodal]
