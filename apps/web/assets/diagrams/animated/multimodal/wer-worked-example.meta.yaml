title: Word error rate, computed on one sentence
alt: >-
  A four-step figure with a table of eleven columns. Step 1: two rows of words. The caller said "i want a refund for
  order four four seven one", ten words; the recogniser wrote "i want refund for order for four seven one please". Step
  2: a verdict row aligns them: eight columns are ok in green, and three are errors in red: the word "a" is missing (a
  deletion), the first "four" became "for" (a substitution), and "please" was added (an insertion). Step 3: three red
  counters, one substitution, one deletion and one insertion, against ten words said. Step 4: the formula, substitutions
  plus deletions plus insertions divided by words said, is 1 plus 1 plus 1 over 10, which is 30 percent; a note says the
  error that matters is the order number, which reads 471 instead of 4471.
caption: >-
  WER counts edits, not meaning. Three edits in ten words is 30 percent, yet the one that would break the refund is the
  lost digit in the order number.
