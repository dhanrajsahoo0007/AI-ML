title: The latent diffusion stack
alt: >-
  A four-step flow. Step 1: an orange prompt box ("a kettle on a white shelf") feeds a green text encoder, which
  produces pink text embeddings, one vector per token. Step 2: a blue box holds a 64 by 64 by 4 noise latent and feeds
  a green denoiser; an arrow labelled cross-attention carries the text embeddings into the denoiser. Step 3: the
  denoiser loops, predicting the noise and removing some each time, and produces a clean 64 by 64 by 4 latent. Step 4:
  a green VAE decoder turns the clean latent into a 512 by 512 by 3 image. Notes give the arithmetic: 786,432 pixel
  values against 16,384 latent values is 48 times fewer values to denoise, with a downsampling factor of 8 and 4 latent
  channels as in Stable Diffusion v1.
caption: >-
  The expensive loop runs on 16,384 numbers, not 786,432. The text steers it through cross-attention; the decoder
  runs once at the end.
