title: The voice pipeline, one turn and an interruption
alt: >-
  An architecture diagram built in seven steps. Step 1: a caller on the phone, in violet, streams audio to a lime turn
  detector. Step 2: the turn detector finds speech and the end of the turn and passes the speech on. Step 3: a violet
  recogniser turns audio into text and sends it to the green language model. Step 4: the model calls a tool, get_order,
  and gets the order back. Step 5: the model's first clause goes down to a violet speech-synthesis box. Step 6:
  synthesised audio chunks go into a playback buffer on the left, and from there as the reply to the caller. Step 7:
  the caller interrupts. The turn detector hears new speech and two dashed arrows appear: one down to the playback
  buffer, "stop playing", and one along the top to the model, "cancel the reply".
caption: >-
  A cascaded voice agent is a relay of five stages. The turn detector sits at the front and also holds the way out: when
  the caller speaks over the agent, it tells the buffer to stop and the model to cancel.
