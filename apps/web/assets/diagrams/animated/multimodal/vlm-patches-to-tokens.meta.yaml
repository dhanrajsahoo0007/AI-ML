title: From a photo to visual tokens
alt: >-
  A five-step flow. Step 1: a blue 24 by 24 grid shows the cracked-kettle photo, resized to 336 by 336 pixels. Step 2:
  each cell is one 14 by 14 pixel patch, and the note says 24 times 24 equals 576 patches. Step 3: a green box, the
  vision encoder (CLIP ViT-L/14), turns the patches into 576 pink patch vectors, one each. Step 4: a green box, the
  projector (a two-layer MLP in LLaVA-1.5), maps each vector to the language model's width so it reads like a word
  embedding. Step 5: along the bottom, a pink block of 576 visual tokens is followed by an orange block of question
  tokens, and both feed a green LLM box that reads the whole sequence.
caption: >-
  The patch count is plain arithmetic: 336 ÷ 14 = 24 patches a side, so 24 × 24 = 576 tokens, whatever the photo shows.
  Those 576 positions are spent before the first word of the question.
tags: [vision-language, vlm, patches, llava, multimodal]
