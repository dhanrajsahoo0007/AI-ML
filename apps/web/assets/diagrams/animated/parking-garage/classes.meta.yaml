title: The classes of one parking garage
alt: >-
  A class diagram in two steps. Step 1: a violet ParkingGarage box at the top has one or more violet Level boxes and
  one or more teal Gate boxes; a level has one or more violet ParkingSpace boxes; a gate issues an orange Ticket, which
  is for an orange Vehicle and points to the space it parks in; a dashed arrow shows an orange Reservation becoming a
  ticket on arrival. Step 2: the garage uses two green strategy interfaces, SpaceAllocator with pick by vehicle type
  and PricingPolicy with fee for a ticket; green implementation boxes below them (SmallestFit, NearestLift and EvFirst;
  Hourly, DailyMax and EventFlat) point up to their interfaces with dashed implements arrows.
caption: >-
  The garage owns levels, spaces and gates; allocation and pricing are strategies, so a new rule is a new class.
tags: [case-studies, parking-garage, object-design, strategy]
