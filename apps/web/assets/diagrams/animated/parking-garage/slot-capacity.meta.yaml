title: Capacity per 15-minute slot
alt: >-
  A layout in two steps showing eight 15-minute slots from 09:00 to 10:45 for car spaces in one garage, each sellable
  up to 180. Step 1: the grey before row reads 171, 175, 178, 179, 179, 176, 172 and 168; a green arrow for driver A,
  09:00 to 11:00, adds one to all eight rows in one transaction, and the green after row reads 172, 176, 179, 180,
  180, 177, 173 and 169, with 09:45 and 10:00 marked full. Step 2: a red arrow for driver B, 09:30 to 10:30, covers
  four slots, but only two of the four rows can change, so the transaction rolls back, nothing is kept and B gets a
  409 saying 09:45 is full.
caption: >-
  A reservation takes one unit in every 15-minute slot of its window in one transaction, or none.
tags: [case-studies, parking-garage, reservations, concurrency]
