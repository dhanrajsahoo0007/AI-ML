title: The life of a reservation and a ticket
alt: >-
  Two rows of state boxes. The top row is a reservation: an orange Booked box (slots taken) goes left to a grey
  Cancelled box (all slots released) when the driver cancels, and right along a dashed arrow to a grey No-show box
  (rest released) when the driver is 30 minutes late. An arrow from Booked down to the ticket row is labelled arrives,
  code or plate. The bottom row is a ticket: a drive-up driver with no booking also enters a blue Active box (car
  inside), which goes to a green Paid box (15 minutes to leave) on payment and to a grey Exited box (ticket closed) at
  the exit gate. A dashed arrow under the row runs from Paid back to Active when 15 minutes pass and the driver owes
  the extra time. A note says a lost ticket pays the daily maximum and an exit taken offline uploads later under the
  same event id.
caption: >-
  A booking becomes a ticket on arrival; a ticket is paid, then closed at the exit, and a paid ticket that lingers
  owes the extra time.
