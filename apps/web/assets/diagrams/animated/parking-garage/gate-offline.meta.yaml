title: The exit gate online and offline
alt: >-
  A sequence diagram in two steps with five lanes: an orange driver, a teal garage controller, a violet local log, a
  green sync service and a violet garage database. Step 1: the plate is read and the card taken; the controller
  appends exit event e-9041 to its local log and syncs it to disk, tells the driver 12 dollars are paid and opens the
  barrier; afterwards it uploads the event, the sync service inserts it only if it is new, and acknowledges up to
  9041. Step 2: the same exit happens while the link is down; the controller appends e-9042 with the card stored and
  opens the barrier; its upload gets no answer, drawn red; 40 minutes later it replays events 9042 to 9101, the sync
  service inserts the new ones and skips ids it has seen, and acknowledges up to 9101.
caption: >-
  The gate decides from local data and logs before it opens; uploads happen after, and a replay is safe because each
  event id is applied once.
tags: [case-studies, parking-garage, offline, idempotency]
