title: Where a redirect is answered
alt: >-
  Three boxes from left to right joined by arrows labelled miss. A teal box, server memory, holds the hottest 10,000
  codes: 10,000 times 250 bytes is 2.5 megabytes, it serves viral links with no network hop, and entries live 5
  seconds. A highlighted violet box, the link cache, holds codes clicked recently: 50 million times 250 bytes is 12.5
  gigabytes, 0.8 percent of links answering about 95 percent of clicks, with a time to live of at most an hour and
  never past the link's expiry. A violet box, the link store, holds every link ever made: 6 billion times 500 bytes
  is 3 terabytes, it sees about 195 reads a second, 5 percent of 3,900, and keeps each link until its expiry.
caption: >-
  A few gigabytes of cache answer almost every click; the 3 TB store only sees the misses.
tags: [case-studies, url-shortener, caching, long-tail]
