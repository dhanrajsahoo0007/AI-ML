title: "One click: cache hit, cache miss, and a 301"
alt: >-
  A sequence diagram with five lanes: an orange browser, a teal redirect server, a violet link cache and link store,
  and a blue click log. Step 1, a cache hit: the browser asks for the short code, the redirect server reads it from
  the cache in about 1 ms, answers 302 with the long URL, and only then sends a click event to the click log without
  waiting. Step 2, a cache miss: the redirect server reads the link store in about 5 ms, puts the entry in the cache
  with a time to live no later than the link's expiry, answers 302 and logs the click. Step 3: the server answers
  301 instead, the browser keeps the redirect, and its next click, drawn as a red arrow, never reaches the server, so
  it goes straight to the long URL and is never counted.
caption: >-
  A 302 brings every click back to us to be counted; a 301 lets the browser keep the answer, and the click is lost.
tags: [case-studies, url-shortener, caching, redirects, analytics]
