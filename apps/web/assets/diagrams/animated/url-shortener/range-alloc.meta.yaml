title: A block of 1,000 ids per link server
alt: >-
  A sequence diagram with five lanes: an orange creator, two teal link servers A and B, and a violet counter database
  and link store. Step 1: server A asks the counter database to add 1,000 to the next id and gets ids 1,000,000 to
  1,000,999; server B does the same and gets 1,001,000 to 1,001,999, so the blocks never overlap. Step 2: the creator
  posts a new link to server A, which takes id 1,000,000 from memory, scrambles it to the code FkFnj3r, inserts it
  into the link store only if absent, and returns the short link. Step 3: server A crashes, so the next create times out, drawn as a red arrow, and
  on restart takes a fresh block from 1,002,000; the 999 unused ids of its old block are a gap that is never filled.
caption: >-
  One counter call buys 1,000 creates; a crash wastes the rest of a block but never hands out an id twice.
tags: [case-studies, url-shortener, unique-ids, ranges]
