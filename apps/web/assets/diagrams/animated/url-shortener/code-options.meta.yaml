title: Three ways to make a short code
alt: >-
  Three green columns compare ways to make a short code on five questions, with counter plus blocks highlighted. Hash
  and retry gives 7 characters, collides about once in 590 inserts at 6 billion links and retries with a new salt,
  needs no coordination, is not guessable, and breaks, drawn in red, when the store has no insert-if-absent, so two links share a code. Counter
  plus blocks gives 7 characters, about 3.5 trillion codes or 2,900 years, never collides, needs one counter call per
  1,000 ids, is guessable unless the id is permuted before base 62, and breaks, in red, when the counter database
  rolls back and ids repeat. A time-based id needs up to 11 characters, drawn in red, never collides, needs a node id
  at start-up, partly leaks time order, and breaks, in red, when the clock runs back and ids can repeat.
caption: >-
  Each generator pays somewhere: a retry, a counter to protect, or four extra characters.
tags: [case-studies, url-shortener, unique-ids, base62, comparison]
