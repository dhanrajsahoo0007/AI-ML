title: URL shortener high-level architecture
alt: >-
  An architecture diagram in seven steps across six zones: clients, edge, redirect path, application services, async
  pipeline and storage. Step 1: a creator calls the API gateway and the link service inserts a code into the link
  store only if it is absent; a clicker reaches the redirect service, drawn as the solid green accent, through a
  layer-7 load balancer, and it reads the code from the link store. Step 2: every create takes the next id from one
  counter database. Step 3: an ID allocator hands each link-service instance a block of 1,000 ids. Step 4: the
  redirect service reads a link cache first and the link store only on a miss. Step 5: each redirect writes a click
  event to a click log; a click counter rolls clicks up per minute into a click store, which a stats API reads.
  Step 6: the link service deletes the cached entry when a link expires or is disabled. Step 7: an abuse check tests
  every new destination against a blocklist.
caption: >-
  URL shortener: codes from blocks of a counter, redirects from a cache, and clicks counted off the hot path.
