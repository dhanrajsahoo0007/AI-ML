title: "Cardinality: labels multiply series"
alt: >-
  A layout in three steps. Step 1: a grey box for one request counter is multiplied by four grey label boxes, method
  with 4 values, status with 5, route with 25 and pod with 40, giving a violet box of 20,000 series, about 80 MB in
  memory. Step 2: a dashed arrow carries the 20,000 series down a row, where they are multiplied by a red user_id
  label with 100,000 values, giving a highlighted red box of 2 billion series, about 8 terabytes in memory. Step 3:
  three green guardrail boxes: a tenant limit of 500,000 series, about 2 GB; a per-metric limit of 50,000 series; and
  user_id kept as a log field, never a label. A line underneath says series 500,001 is refused with a 429 and
  counted while the existing series keep flowing.
caption: >-
  Every label multiplies the series count; one label with a value per user turns 20,000 series into 2 billion.
tags: [case-studies, metrics-and-logging, cardinality, limits]
