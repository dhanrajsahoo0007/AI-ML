title: "The cost of a point: delta of delta and XOR"
alt: >-
  A grid of five points from one series, built in three steps. Step 1: grey cells show each raw timestamp, from
  10:00:00 to 10:00:41, and each value, 12.0 three times then 12.5 twice, at 8 bytes each, 80 bytes in all. Step 2: a
  blue row stores the first timestamp whole in 64 bits, the first 10-second delta in 14 bits, then the change in the
  delta: 0 in one bit, 0 in one bit, and plus 1 in 9 bits. Step 3: a green row XORs each value with the previous: the
  first is stored whole, equal values take one bit, and the change from 12.0 to 12.5, highlighted, flips one bit and
  takes 14 bits. The total is 170 bits, about 21 bytes, and points 2 to 5 take about 1.3 bytes each.
caption: >-
  Most points repeat their neighbour's interval and value, so delta of delta and XOR store them in a bit or two.
