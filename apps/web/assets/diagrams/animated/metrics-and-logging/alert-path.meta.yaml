title: The alerting path, and who watches the monitor
alt: >-
  A sequence diagram with six lanes: an orange host agent, violet ingesters, teal alert rules and notifier, an orange
  on-call engineer and a grey outside watcher. Step 1: the agent's batch lands at 10:00:10; the alert rule asks the
  ingesters at 10:00:15 whether errors exceed 5 percent and gets 7.2 percent, pending; at 10:00:30 it gets 7.5 percent
  for 15 seconds, firing; the notifier waits 10 seconds to group alerts and pages on-call at 10:00:40. Step 2: with
  dashboards shed and object storage down, the rule still reads the ingesters' memory in the same zone and the page
  still goes out; then the notifier's heartbeat to the outside watcher stops, drawn red, and after 3 silent minutes the
  watcher pages on-call itself.
caption: >-
  Alerts read recent data straight from memory in the same zone, and a watcher outside the system pages when the
  monitor itself goes quiet.
