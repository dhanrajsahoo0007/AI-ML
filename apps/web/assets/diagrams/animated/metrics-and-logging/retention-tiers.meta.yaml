title: "Retention tiers: raw, 1-minute, 1-hour"
alt: >-
  Three violet tier boxes in a row joined by arrows labelled compact: raw points every 10 seconds kept 15 days at
  118 GB a day, 1-minute rollups kept 90 days at 79 GB a day, and 1-hour rollups kept 2 years at 1.3 GB a day. Under
  each is a blue total: 1.8 TB, 7.1 TB and 0.96 TB. A note above says each rollup keeps min, max, sum and count.
  Below, a grey box says keeping everything raw for 2 years takes 86 TB, and a highlighted green box says the tiered
  layout takes 9.8 TB, about 9 times less.
caption: >-
  Raw points for two weeks, then rollups: the same two years of history in 9.8 TB instead of 86 TB.
tags: [case-studies, metrics-and-logging, retention, downsampling]
