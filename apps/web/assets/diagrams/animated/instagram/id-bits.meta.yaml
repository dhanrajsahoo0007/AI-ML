title: "A 64-bit post id: 41 bits of time, 13 of shard, 10 of sequence"
alt: >-
  A bar of 64 bits built in four steps. Step 1: the left 41 bits, in pink, hold milliseconds since 1 January 2026
  from the database clock; 2 to the 41 milliseconds is about 69.7 years, or 34.8 years if the id must stay positive
  as a signed integer. Step 2: the next 13 bits, in violet, hold the author's logical shard, user id mod 8,192.
  Step 3: the last 10 bits, in green and highlighted, hold the shard's sequence mod 1,024, so each shard makes 1,024
  ids a millisecond. Step 4: in blue, one post id taken apart: 27,682,200,000 milliseconds, shard 6,765 for author
  31,341, sequence 905, which combine into 232,215,124,384,528,265; shifting and masking the id gives shard 6,765,
  which lives on database 52 of 64.
caption: >-
  The id sorts by time and names its own shard: any service can find a post's database from the id alone.
tags: [case-studies, instagram, unique-ids, sharding]
