title: Offset against cursor when a post arrives between pages
alt: >-
  Four rows of post cells, P11 on the left to P1 on the right, built in four steps. Step 1: page 1 shows P10 to P7 in
  green. Step 2: a new post P11 arrives, in blue; page 2 asked by offset 4 returns P7, P6, P5 and P4, and P7 is red
  because the reader sees it twice. Step 3: page 2 asked by cursor, after P7, returns P6 to P3 in green; P11 waits for
  the next refresh. Step 4: P5 has been deleted; the cursor still starts after P7, skips P5 and fills the page with
  P6, P4, P3 and P2.
caption: >-
  An offset counts positions, so one new post on top repeats a post on page 2; a cursor names the last post seen, so
  inserts and deletes above it change nothing.
tags: [case-studies, instagram, pagination, feeds]
