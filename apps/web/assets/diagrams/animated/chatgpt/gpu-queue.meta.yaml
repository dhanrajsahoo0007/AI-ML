title: Arrivals against GPU capacity at the peak
alt: >-
  Horizontal bars drawn to one scale, built in three steps, with a dashed vertical line at the fleet's capacity of
  32,000 prompts a second. Step 1: the arrivals bar is split into blue paid traffic, 10,500 a second, and orange free
  traffic, 24,500 a second, and it runs past the line; under it a teal bar shows the large fleet, 5,000 replicas times
  64 slots divided by 10 seconds, ending at the line. Step 2: a first-come queue serves 32,000 a second in arrival
  order, and a red block of 3,000 a second sticks out past the line; after 60 seconds 180,000 prompts wait, adding 5.6
  seconds before every first token, paid included. Step 3: with priority lanes, blue paid traffic goes first with no
  wait, orange free traffic fills the remaining 21,500 a second on the large model, and a green block sends the extra
  3,000 a second to a small model, about 118 replicas.
caption: >-
  Arrivals at the peak run 3,000 a second past what the GPUs can start; a single queue makes everyone wait, while
  priority lanes keep paid users at zero wait and send the overflow to a smaller model.
tags: [case-studies, chatgpt, layout, capacity, queueing]
