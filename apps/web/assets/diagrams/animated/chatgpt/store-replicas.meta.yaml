title: One primary, many replicas, and the write-heavy table moved out
alt: >-
  A layout figure in three steps. Step 1: a teal chat service box sends 350,000 reads a second to a violet cache that
  answers 90 percent of them; the 35,000 misses a second go through a grey connection-pool box, which turns 40,000
  client connections into about 300 per replica, and fan out to three violet boxes, regions A, B and C with 4 replicas
  each, about 2,900 reads a second per replica. Step 2: the chat service sends 9,000 writes a second to one violet
  primary, highlighted, which keeps a hot standby in sync and ships its write-ahead log to the replicas. Step 3: the
  chat service sends message bodies, 70,000 writes a second, to a green message store sharded by conversation; red
  text notes that left on the primary they would make 79,000 writes a second, 9 times the metadata writes.
caption: >-
  Reads scale out through a cache and replicas; writes do not, so the one table that writes 70,000 rows a second
  leaves the primary for a sharded store.
