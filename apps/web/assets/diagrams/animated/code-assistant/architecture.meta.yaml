title: The code assistant, built in eight steps
alt: >-
  An architecture diagram in six zones, built in eight steps. Step 1: an orange IDE plugin sends the code before and
  after the cursor to a grey gateway, which sends it down to a green FIM model that we serve on 355 GPUs; the first
  line comes back as ghost text. Step 2: a dark accent card, the context assembler, joins beside the gateway on a
  dashed line, because its completion layout runs in the plugin, and the FIM line now carries 490 new tokens a request
  instead of 2,000. Step 3: a violet local index of grep and symbols in the clients column sends changed hashes to a
  grey sync service, which sends changed chunks to a violet embeddings arm, only in an A/B test. Step 4: the gateway
  line to the assembler becomes a chat flow, and the assembler sends a 12,000-token prompt to a green hosted mid-size
  model. Step 5: a grey orchestrator joins beside the assembler, sends exploration to a green hosted small model down
  a trunk on the right, and writes steps, tokens and cost to a violet sessions and audit store. Step 6: the gateway
  sends sketches to a green apply model that rewrites a region. Step 7: a lime policy engine checks every tool call
  from the orchestrator and runs commands in a teal local sandbox with no network; teal MCP servers from an allow-list
  and a teal cloud microVM with a git proxy and registry mirror hang off the trunk; a grey snapshot builder writes
  violet environment snapshots, which reach the cloud microVM without secrets; the cloud task's pull request goes to an
  orange reviewer. Step 8: violet offline suites and violet telemetry with retained characters feed a lime evaluation
  gate.
caption: >-
  Two clocks share one plugin: completion runs on our own small model in milliseconds, while chat and the agent run on
  hosted models behind a policy engine and a sandbox, with search kept on the developer's machine.
