title: What a seat costs to serve
alt: >-
  Bar charts of seat economics, built in two steps, all illustrative at list prices. Step 1: the mean seat a month as
  one stacked bar costing 31.35 US dollars: teal completion 5.20 and other fixed servers 0.35, a green agent-task
  segment of 22.40, blue chat 3.28 and teal cloud VMs 0.12; a lime marker further right shows revenue of 46.25 US
  dollars. Fixed cost is 5.55 and usage 25.80; the agent is 71% of the cost and the margin is 32%. Step 2: at 39 US
  dollars a seat with a 20-dollar pooled allowance and usage above it billed at list price times 1.25, three
  organisations of one kind of seat each: all light seats cost 12.58 against revenue of 39.00, a 68% margin; all
  median seats 31.19 against 46.06, 32%; all heavy seats 144.41 against 187.58, 23%. A last line: however heavy the
  organisation, the mark-up holds the margin above 20%, and at a 30-dollar seat the mean organisation's margin falls to
  about 16%.
caption: >-
  The mean seat costs ≈ 31.3 USD at list prices, 71% of it the agent; the pooled allowance and a 1.25 mark-up keep
  margin at 23% even for an all-heavy organisation.
