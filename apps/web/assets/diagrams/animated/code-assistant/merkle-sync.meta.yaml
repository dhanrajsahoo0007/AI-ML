title: Merkle sync of a changed file
alt: >-
  A tree of file hashes and three boxes, built in two steps. Step 1: under the heading "50,000 files, fan-out 20: 4
  levels; one saved file changes one path", an orange root hash that differs sits over four rows of grey hash cells,
  six of the 20 children shown in each row; in each row one orange cell has changed, and arrows step down from it to
  the changed cell in the next row, ending at the saved file, parser.ts, ringed. Notes on the right: the same root
  means nothing to sync with one compare; each of the four rounds compares 20 hashes of 64 bytes, 1.28 kilobytes.
  Under the tree: 4 times 20 times 64 bytes is about 5.1 kilobytes in 4 round trips, about 200 milliseconds at a
  50-millisecond round trip, against 3.2 megabytes to re-upload the tree. Step 2: three boxes under "What leaves the
  machine, and when": violet, local grep and symbols are updated within 1 second of a save and nothing leaves the
  machine; teal, a cloud task started from uncommitted work gets only the changed files, secret-scanned on the client;
  pink, the embeddings arm, in an A/B test only, gets changed chunks with HMAC-keyed paths, embedded within 2 minutes at
  p95. A last line: sync runs 30 seconds after the last save, on a branch switch and before a cloud task, and a new
  clone builds its 120-megabyte index in about 8 seconds, using ripgrep until then.
caption: >-
  One saved file changes one path of hashes: the client compares about 5.1 KB in 4 round trips and uploads only that
  file, and only for cloud tasks and the embeddings arm.
