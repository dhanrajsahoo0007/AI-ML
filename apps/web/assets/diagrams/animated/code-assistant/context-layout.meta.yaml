title: Three context layouts, one per path
alt: >-
  Three stacked token bars, one per path, built in three steps, each bar on its own token scale with brackets above it.
  Step 1: a completion of 2,000 tokens: grey path and language 50, blue signatures 200 and snippets 350, orange recent
  edits 150, all frozen for 30 seconds (750 tokens, a violet bracket); orange code before the cursor 950, cached up to
  the last request; and orange code after the cursor 300, recomputed every request. Under it: 310 new tokens between
  refreshes and 1,750 on a refresh, one request in eight, so 490 new on average and 1,510 reused from the KV prefix.
  Step 2: a chat turn of 12,000 tokens: grey instructions and tools 3,200 and repo rules 800 under a violet prompt-cache
  bracket of 4,000 that 30% of turns miss; blue open file 2,000 and retrieved code 5,400 and an orange question of 600,
  not cached: 8,000. Step 3: an agent's first step of 5,300 tokens: grey instructions with AGENTS.md 2,000 and teal
  tools 1,500 as a hot prefix of 3,500, then an orange task of 300 and a blue repo map of 1,500, cached from step 2;
  below it, the same task on a 100,000-token scale: 5,300 at step 1 plus 2,500 a step reaches 52,800 at step 20,
  averaging 29,050, and at 100,000 the context compacts to a 3,000-token summary and a 2,000-token file list.
caption: >-
  Each path has its own budget: 2,000 tokens for a completion with the stable blocks first, 12,000 for a chat turn,
  and 5,300 at an agent's first step that grows 2,500 a step.
tags: [genai, code-assistant, context, prompt-caching, case-study]
