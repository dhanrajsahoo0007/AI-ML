title: Applying an edit fast and exactly
alt: >-
  A strip of line cells and a bar chart, built in two steps. Step 1: the enclosing 40-line region of 400 tokens as 40
  grey cells with lines 18 to 20 in orange: a bracket under the grey lines on each side says they are drafted from the
  original, 16 tokens a step, and verified; the orange lines are the ones the apply model writes. A note: 1,000 tokens a
  second with speculative edits against about 77 without, 13 times, a vendor figure from 2024, so this region takes 0.4
  seconds and a 2,000-line file 20 seconds instead of 260. Step 2: four bars on one seconds scale for the same edit, end
  to end from the agent's step to the diff: an exact search-and-replace 11.2 seconds; a sketch plus a region fast apply
  12.8 seconds, a green agent step with a thin teal apply segment; the agent model rewriting a 400-line file 60.4
  seconds; and a 2,000-line file 260.4 seconds.
caption: >-
  Most of an edited region is copied from the original, so a fast-apply model drafts it and verifies in long runs; an
  exact search-and-replace still wins at 11.2 s.
tags: [genai, code-assistant, fast-apply, speculative-decoding, case-study]
