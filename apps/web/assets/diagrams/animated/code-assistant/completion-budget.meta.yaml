title: "Completion latency budget: ten stages, a proxy and the debounce curve"
alt: >-
  A latency waterfall in three blocks on one millisecond scale, built in four steps. Step 1: ten stages from the last
  keystroke to ghost text: a grey 75-millisecond debounce, 15 for gathering context and the gate on the client, 25 to
  the region, 5 at the gateway, 3 in the queue at 41% busy, 12 to prefill 490 new tokens, 50 for a first line of 12
  drafted tokens, 5 to show or suppress, 25 back and 10 to render: 225 milliseconds at p50, about 308 at p95, with each
  stage's p95 spread printed beside it. Step 2: bars for every suggestion against a p50 target line at 300 and a p95
  target line at 500: direct 225 and 308, with an upper bound of 400; behind a corporate proxy that adds 40, 265 and
  367, with an upper bound of 500, all green. Step 3: a typed-through key takes about 10 milliseconds with no request,
  and a developer 150 milliseconds from a region reaches 325 at p50, in red, outside the requirement's scope. Step 4:
  the debounce curve: 50 milliseconds gives a 200 p50 and 3,641 full-request equivalents a developer-day; the chosen
  75 gives 225 and 3,276; 150 gives 300, on the target line, and 1,981; 250 gives 400 and 1,280.
caption: >-
  Every suggestion waits the same 75 ms and lands at 225 ms (≈ 308 at p95); a proxy adds 40 ms and p95 stays under
  500, while a longer debounce saves GPU work only by spending p50.
tags: [genai, code-assistant, latency, waterfall, completion, case-study]
