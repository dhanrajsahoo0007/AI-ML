title: Retained characters, not acceptance, and the release gate
alt: >-
  Paired bars and a release gate, built in two steps. Step 1, labelled an illustration and not evidence: two
  completion models in an A/B, with blue bars for model A and teal bars for model B. Suggestions shown: A 400, B 300.
  Acceptance rate: A 30%, B 36%, with a lime verdict that acceptance ships B. Characters kept per shown suggestion: A
  9.6, B 9.8. Retained characters after 10 minutes: A 3,840, B 2,938, with a ringed lime verdict that retained
  characters ship A. The working underneath: 400 times 30% times 40 characters times 80% kept is 3,840, and 300 times
  36% times 32 times 85% is about 2,938; showing less raises acceptance. Step 2: a release gate for every model and
  prompt version: a grey change box fans out to six lime checks, all passing: retained characters with no 5% drop at a
  10% arm, whose clustered minimum detectable change is about 4.3%; p95 at most 500 milliseconds and no 50-millisecond
  regression in any region; the FIM set, exact match and execution on held-out repositories and commits; chat recall at
  10 and citation validity on 300 questions with gold files; 300 past issues run 3 times and compared in pairs, plus or
  minus 5.5 points a run, about 327 US dollars; and a red team with no escapes and no leaks. They lead to a green roll
  out box: 1%, then 10%, then 50%. A note: public SWE-bench scores only shortlist, since at least 16.4% of Verified's
  500 tasks have flawed tests, and pinned organisations opt in after 14 days.
caption: >-
  Model B shows fewer suggestions and wins on acceptance, yet keeps fewer characters in the code: the metric that
  ships A is retained characters, not raw acceptance (an illustration).
