title: Three agent tool calls, decided in code
alt: >-
  A sequence diagram with five lanes: a green agent model, a neutral orchestrator, a teal policy engine, a blue sandbox
  and a violet package mirror, built in three steps. Step 1: the model asks to run npm test; the orchestrator checks it
  with the policy engine, which applies deny, then ask, then allow, from managed settings only, and allows it in the
  sandbox; the orchestrator takes a snapshot and runs the tests; a test helper's call to a telemetry host is refused,
  because the sandbox has no network and no resolver; 18 tests run and 1 fails, and the output goes back to the model
  marked as data. Step 2: the model asks to install "left-padd"; the policy engine puts install in the ask tier with
  the mirror checking first; the read-only mirror, with install scripts off, finds no such package and refuses, so the
  failed check never reaches the developer and the model is told the package is not in the mirror. Step 3: the model
  asks to write .vscode/settings.json; the policy engine denies it, because IDE, harness, MCP, hook and permission
  files are denied by a managed rule.
caption: >-
  Three tool calls, three outcomes decided in code: the test run is allowed with no network, a typo-squatted package
  fails the mirror's checks, and a write to the IDE's settings is denied.
