title: Ticket booking high-level architecture
alt: >-
  An architecture diagram in eight steps across six zones: clients, edge, booking core, application services, async
  pipeline and storage. Step 1: a fan browses through the API gateway and a CDN; the event service reads events from
  the catalog and seat status from the inventory database. Step 2: the booking service holds a seat by reading, then
  writing, drawn red because two fans can get the same seat. Step 3: the hold becomes one conditional update. Step 4:
  the payment service charges the card processor with an idempotency key. Step 5: a hold-expiry worker releases unpaid
  holds. Step 6: fans join a waiting room and are admitted to the gateway with a token at a set rate. Step 7: the
  inventory database's changes flow through an availability stream into a seat-map cache that the event service
  reads. Step 8: the ticket service issues tickets from confirmed orders and serves the fan's tickets.
caption: >-
  Ticket booking: browse from caches, hold with one conditional update, pay once, release on expiry, and meter the
  crowd through a waiting room.
