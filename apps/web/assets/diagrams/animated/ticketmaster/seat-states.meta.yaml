title: The life of one seat
alt: >-
  Three state boxes in a row joined by arrows: a grey Available box (on the seat map), a lime Held box (one fan, 10
  minutes) and a green Sold box (order written). The arrow from available to held is labelled hold, from held to sold
  pay. A dashed arrow above runs from held back to available, labelled expired or cancelled: release. Under each box
  is the statement that moves a seat into that state: created with the event, an update that only applies while the
  seat is available, and the claim written with the order in one transaction.
caption: >-
  A seat only moves forward through one conditional statement, and an unpaid hold falls back to available.
tags: [case-studies, ticketmaster, state-machine, data-model]
