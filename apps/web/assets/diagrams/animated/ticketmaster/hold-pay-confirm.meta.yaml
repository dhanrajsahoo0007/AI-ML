title: "Hold, pay, confirm: authorise, claim, then capture"
alt: >-
  A sequence diagram in two steps with five lanes: an orange fan, teal booking and payment services, a violet
  inventory database and a neutral card processor. Step 1: the fan pays for seat A12 with idempotency key k9; the
  payment service authorises the card; the booking service claims the seat and writes the order in one transaction
  while the hold is still the fan's, gets order 5521, then captures the payment and confirms. Step 2: the fan pays at
  10:11, after the hold expired at 10:10; the card is authorised but the claim changes no rows, drawn red, so the
  authorisation is voided and the fan is asked to pick again.
caption: >-
  Authorise first, claim the seat, then capture: a hold that expires mid-payment costs the fan nothing.
tags: [case-studies, ticketmaster, payments, idempotency, saga]
