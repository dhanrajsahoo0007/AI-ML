title: A waiting room admits fans at the rate checkout can take
alt: >-
  A sequence diagram in two steps with four lanes: an orange fan, a green waiting room, a neutral API gateway and a
  teal booking service. Step 1: the fan arrives at 09:50 and waits in the pre-queue; at 10:00 the waiting room
  shuffles the pre-queue and assigns positions; the fan is told position 812,345, about 27 minutes; at their turn,
  admitted at 500 a second, they get a signed token valid for 10 minutes; the gateway checks the signature and expiry
  and passes the hold request to the booking service. Step 2: a request without a token is redirected back to the
  waiting room.
caption: >-
  Arriving early gives no head start, and nobody reaches the booking service faster than checkout can serve them.
tags: [case-studies, ticketmaster, waiting-room, back-pressure]
