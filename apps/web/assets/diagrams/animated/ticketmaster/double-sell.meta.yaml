title: "Two fans, one seat: the race and the conditional update"
alt: >-
  A sequence diagram in two steps with four lanes: orange fans A and B, a teal booking service and a violet inventory
  database. Step 1: both fans ask to hold seat A12; the service reads the seat as available twice, writes held by A,
  then writes held by B, drawn red because B's write overwrites A's, and both fans are told the seat is held. Step 2:
  each request is one conditional update that changes the seat only while it is available; A's update changes one
  row, B's changes none, so A holds the seat until 10:10 and B is asked to pick another.
caption: >-
  Read, then write lets two fans win the same seat; one conditional update lets the database pick exactly one winner.
tags: [case-studies, ticketmaster, concurrency, contention]
