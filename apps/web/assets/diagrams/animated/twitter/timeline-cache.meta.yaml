title: "The timeline cache: ids only, bounded, active users only"
alt: >-
  A layout in four rows, built in four steps. Step 1: one entry is two pink boxes, an 8-byte post id and an 8-byte
  author id, 16 bytes, with no post body. Step 2: one reader's list under the key tl:42 is a row of green cells; a new
  id goes in at the front and the list is trimmed to 500 entries, so 500 times 16 bytes is 8,000 bytes, about 8 KB.
  Step 3: four violet boxes joined by arrows: 400 million users active in 30 days, times 8 KB is 3.2 TB, times 1.5 for
  overhead and 2 copies is 9.6 TB, which is 150 nodes of 64 GB, ringed. Step 4: two red boxes show what is not cached:
  a list for every one of 1.5 billion users would be 12 TB, and whole posts of 1 KB would be 200 TB, 62.5 times the
  ids; a green box says inactive users are rebuilt on a miss in about 300 ms, once.
caption: >-
  Ids only, 500 per reader, active readers only: 9.6 TB on 150 nodes, against 200 TB if the cache held whole posts.
tags: [case-studies, twitter, cache, memory, fan-out]
