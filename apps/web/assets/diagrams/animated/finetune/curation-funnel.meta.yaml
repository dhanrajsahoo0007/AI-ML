title: From 40,000 raw tickets to the 5,000-ticket fine-tuning set
alt: >-
  A funnel of five blue boxes, each narrower than the one above. Raw tickets: 40,000 from 90 days of logs. Resolved
  with an approved reply: 11,500, after dropping 28,500 with no agent-approved reply. PII removed and policy-checked:
  9,800, after dropping 1,700 with a card number or a wrong refund rule. Near duplicates removed: 6,900, after
  dropping 2,900. Balanced with the golden set taken out: 5,000, after dropping 1,900, and ringed as the final
  fine-tuning set. A note says 12.5 percent of the raw tickets survive. All counts are illustrative.
caption: >-
  Most raw data does not survive: the arithmetic shows 28,500 of the 35,000 dropped tickets leave at the first
  gate. Counts are illustrative; only the 5,000 at the bottom is Brightpost's own constant.
tags: [data-curation, funnel, filtering, dedupe, brightpost, genai]
source: original
