title: Synthetic tickets, collapsed against covering the topic space
alt: >-
  Two square scatter plots of pink dots in a made-up topic space cut into a four by four grid, labelled shape only.
  In the left plot, headed One prompt, repeated, the 24 open pink generated tickets sit in one tight clump near the
  upper left, while six tinted pink seed tickets are spread across the space; only 2 of the 16 cells hold a generated
  ticket. In the right plot, headed Prompt names a topic and a customer type, the 24 generated
  tickets sit in clusters around all six seeds and fill 10 of the 16 cells.
caption: >-
  Same count of tickets, very different coverage. Repeating one prompt piles the output in one place; naming a topic
  and a customer type each time spreads it. Shape only: the positions are illustrative, not a real embedding.
tags: [synthetic-data, diversity, model-collapse, coverage, genai]
