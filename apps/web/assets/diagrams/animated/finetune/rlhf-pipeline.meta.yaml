title: RLHF in three stages
alt: >-
  A three-step diagram, one row per step. Step 1: blue Demonstrations written by labellers feed a green SFT model.
  Step 2: blue Comparisons, where answer A beats answer B, feed a lime Reward model, trained so the winner scores above
  the loser. Step 3: an orange Policy that starts as the SFT model produces an answer, which a frozen lime Reward model
  scores. A neutral Total reward box combines the score with a KL penalty from a frozen neutral Reference model, the SFT
  model; the total is the score minus beta times KL. An orange PPO update then raises the probability of high-reward
  answers and returns to the policy. An illustrative line works the total: a score of 2.4 minus 0.1 times 9, which is
  0.9, gives 1.5.
caption: >-
  Orange is the weights being trained; neutral is frozen. The reference model keeps the policy close to the supervised
  model so it cannot drift into text the reward model over-scores. The numbers are illustrative.
tags: [rlhf, ppo, reward-model, kl-penalty, preference, genai]
