title: Where Brightpost's preference pairs come from
alt: >-
  Three blue source boxes on the left feed a violet Pair store. Agent edits give 2,000 pairs where the edited reply
  beats the draft. Thumbs give 6,000 pairs where the liked answer beats the disliked one. A judge model gives 4,000
  pairs where a rubric picks the winner. The store holds 12,000 pairs and passes them to a lime Filter that drops 3,000
  ties, disagreeing signals and answers that break the refund rule, leaving a ringed blue Training set of 9,000 pairs.
  A line of arithmetic shows 2,000 plus 6,000 plus 4,000 is 12,000, minus 3,000 is 9,000, 25 percent dropped. All
  counts are illustrative.
caption: >-
  A preference pair is always the same shape, a better and a worse answer to one prompt, whatever its source. The
  sources differ in cost and noise, so a filter sits before training. Counts are illustrative.
