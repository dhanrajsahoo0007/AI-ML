title: A frozen weight with a low-rank update
alt: >-
  A three-step figure of one attention matrix and LoRA's update. Step 1: an input of 4,096 numbers feeds a grey frozen
  matrix W of 4,096 by 4,096, which is 16,777,216 numbers, and its result goes to an output. Step 2: a second path
  runs the same input through two orange trained matrices in a row, A of 8 by 4,096 and B of 4,096 by 8, labelled rank
  8, multiplies the result by a scale of 2 (alpha 16 divided by rank 8, illustrative) and adds it to the output of W
  at a plus sign. Step 3 counts the trained numbers: 32,768 plus 32,768 is 65,536, which is 0.39 percent of the
  matrix. A starts random and B starts at zero, so at the start the output equals W times the input. The figure is not
  to scale.
caption: >-
  Only the orange pair is trained. The frozen matrix holds 16,777,216 numbers; the pair holds 65,536, and because B
  starts at zero the model begins exactly where the base model was.
