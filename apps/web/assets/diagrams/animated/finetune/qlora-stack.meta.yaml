title: The QLoRA stack and its memory
alt: >-
  A four-step figure. Step 1 stacks two blocks: a grey frozen base stored in 4-bit NormalFloat, with an arrow up to
  orange 16-bit LoRA adapters, with a note that each layer unpacks a block to 16 bits, multiplies and drops it, and
  that gradients reach the adapters only. Step 2 adds double quantisation: the constants cost 0.5 bit per weight, and
  quantising them again brings that to 0.127 bit, a saving of 0.373 bit per weight or about 3 GB on a 65 billion
  parameter model. Step 3 adds a table of memory to fine-tune, in gigabytes, for a 7 billion and a 65 billion
  parameter model under three set-ups. Full 16-bit fine-tuning needs 84 and 780 GB; LoRA on a 16-bit base needs 15.9
  and 139.6 GB; QLoRA needs 5.5 and 43.1 GB. Cells that exceed one 48 GB GPU are red; the 65 billion QLoRA cell is
  highlighted and fits with about 5 GB left. Step 4 adds a GPU memory block and a CPU memory block joined by a dashed
  two-way arrow: optimiser pages move to CPU memory during a spike.
caption: >-
  The 4-bit base is frozen and stored small; only the orange adapters carry gradients and optimiser state. That moves a
  65 B fine-tune from 780 GB to about 43 GB. Activations are extra, and paged optimisers absorb the spikes.
