title: The forgetting check, the old suite must still pass
alt: >-
  Two gates stacked. In the first, an orange candidate A trained on new data only has two checks. The new golden set
  passes, 188 of 200 or 94 percent, in lime. The old suite fails in red, 99 of 120 or 82.5 percent, below a floor of
  112, and the result is a red Block, forgot old cases. In the second, an orange candidate B trained on new data plus
  700 replayed old tickets passes both checks in lime, 184 of 200 or 92 percent and 113 of 120 or 94.2 percent, and the
  result is a green Promote to the registry. A line at the bottom works the floor, 114 over 120 minus 0.02 times 120 is
  111.6, rounded up to 112. All counts are illustrative.
caption: >-
  Candidate A scores higher on the new set and still fails, because it forgot. Candidate B gives up two points on the
  new set and keeps the old behaviour. Without the old suite, A would ship. Counts are illustrative.
tags: [retraining, forgetting, regression, gate, replay, brightpost, genai]
