title: Training and validation loss
alt: >-
  A line plot, shape only, with epochs on the horizontal axis and loss on the vertical axis. An orange training curve
  falls steadily and flattens near the bottom. A lime validation curve falls with it at first, reaches a lowest point
  marked best checkpoint between the second and third epoch, then rises again. The gap between the two curves after that point
  is overfitting. Three boxes on the right explain the curves: training loss keeps falling as the model memorises,
  validation loss bottoms out and then rises, and overfitting is the gap after the best checkpoint, shown in red.
caption: >-
  Shape only, not a measurement. Stop at the lowest validation loss and keep that checkpoint; training loss alone
  would tell you to keep going.
tags: [fine-tuning, overfitting, validation, loss, genai]
