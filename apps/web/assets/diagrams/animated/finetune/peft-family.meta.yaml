title: Where each PEFT method sits in a decoder block
alt: >-
  A five-step figure of one decoder block, read from the bottom up: frozen grey token embeddings, a frozen attention
  block with the four matrices Wq, Wk, Wv and Wo, a frozen feed-forward block, and an output to the next block, with a
  dotted group around the block marking that it repeats N times. Each step adds orange trained pieces and a note on the
  right. Step 1, prompt tuning: three orange learned vectors feed the embeddings at the input only. Step 2, prefix
  tuning: an orange key and value prefix feeds the attention of every layer. Step 3, adapters: an orange small down and
  up block takes the attention output and passes it on to the feed-forward block. Step 4, LoRA: an orange block of two
  thin matrices sits beside Wq and Wv and is merged into them after training. Step 5, DoRA: an orange magnitude vector
  joins the LoRA block.
caption: >-
  The grey base never changes. Each method differs in where its orange parameters attach: at the input, inside
  attention, after a sub-layer, or beside a weight matrix. Norms and residual adds are left out.
tags: [peft, lora, adapters, prefix-tuning, prompt-tuning, dora, genai]
