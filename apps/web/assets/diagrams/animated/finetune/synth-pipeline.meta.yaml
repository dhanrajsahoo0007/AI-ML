title: A synthetic-data pipeline for Brightpost's rare cases
alt: >-
  A five-step left-to-right pipeline. A blue Seed box holds 150 real tickets, none from the golden set. A green
  Generate box shows a teacher writing 8,000 candidates. A neutral Deduplicate box drops 1,800 near copies and leaves
  6,200. A lime Filter and judge box drops 2,000 that fail the format check, the refund rule or the judge and keeps
  4,200. A lime Spot check box shows a person reading 100 examples and finding 3 bad. A line of arithmetic under the
  boxes shows 8,000 minus 1,800 is 6,200, minus 2,000 is 4,200, a kept share of 52.5 percent. All counts are
  illustrative.
caption: >-
  Each stage removes something and says how many. The counts are illustrative; the kept share is arithmetic from them.
  Watch the last step: a person still reads a sample.
tags: [synthetic-data, pipeline, dedupe, judge, brightpost, genai]
