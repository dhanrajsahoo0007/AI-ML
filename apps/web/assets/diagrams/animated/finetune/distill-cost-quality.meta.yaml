title: Daily cost on the teacher and on the student
alt: >-
  A three-step figure. Step 1: two horizontal bars for the daily cost of Brightpost's 440 million input and 50 million
  output tokens, at illustrative prices. A long green bar for the teacher is 2,070 dollars, worked as 440 times 3 plus
  50 times 15, which is 1,320 plus 750. A very short orange bar for the student is 96 dollars, worked as 440 times 0.15
  plus 50 times 0.60, which is 66 plus 30. Step 2 adds a line: 21.6 times cheaper a day, and over a year 755,550
  dollars against 35,040 dollars. Step 3 adds two lime bars for the illustrative pass rate on the 200-ticket golden
  set: the teacher passes 184 of 200, 92 percent, and the student 176 of 200, 88 percent, with a note that the teacher
  labels the 5,000 training prompts for a one-off 51.75 dollars plus the training run.
caption: >-
  Prices and pass rates are illustrative. The cost gap is arithmetic from the traffic; the quality gap is the number to
  measure on your own golden set before deciding it is acceptable.
tags: [distillation, cost, small-models, brightpost, genai]
