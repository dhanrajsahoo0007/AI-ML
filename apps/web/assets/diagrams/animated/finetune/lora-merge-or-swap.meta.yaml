title: Merge the adapter, or keep it separate
alt: >-
  A three-step figure comparing two ways to serve a LoRA adapter. Step 1, on the left: a grey base weight W of 14 GB
  and an orange adapter B times A of about 40 MB both feed a green merged weight W prime, which is 14 GB and one model
  per task, with a note that it has the shape of W and adds no latency. Step 2, on the right: a grey router picks an
  adapter by name and sends the request to a teal GPU engine zone holding one grey base weight loaded once and three
  small orange adapters A1, A2 and A3 of 40 MB each; a note says S-LoRA reports thousands of adapters on one GPU and up
  to four times the throughput of naive vLLM and PEFT serving. Step 3 counts memory for a hundred tasks: merged, a
  hundred copies of 14 GB is 1,400 GB, in red; swapped, 14 GB plus a hundred adapters of 0.04 GB is 18 GB.
caption: >-
  Merging gives the fastest single model but one 14 GB copy per task. Swapping keeps one base in memory and costs
  about 40 MB per adapter, which is why multi-tenant serving uses it.
