title: Distilling a teacher into a student with synthetic data
alt: >-
  A four-step flow. Step 1: blue questions, 5,000 past tickets, go to a green teacher model, and its 5,000 answers
  are stored as a blue dataset. Step 2: a lime filter that checks format, the refund rule and a judge takes all the
  answers and passes 4,300 of them (an illustrative count) into a blue kept-answers set. Step 3: the kept answers
  feed an orange student training run, which produces an orange student model. Step 4: a lime comparison box receives
  the student's answers and answers to the same 200 held-out golden tickets, to compare the student with the teacher
  on one rubric.
caption: >-
  The student never sees the teacher's internals, only its filtered answers. The golden set stays out of every earlier
  step. The kept count is illustrative.
tags: [distillation, synthetic-data, student, teacher, brightpost, genai]
