title: An automated retraining run, from trigger to canary
alt: >-
  A six-step architecture diagram. Step 1: a neutral Trigger box, a 20 percent new-data counter, sends 1,000 new tickets
  to a blue Collect box. Step 2: a neutral Curate box that removes personal data and duplicates and balances the set
  keeps 700. Step 3: a teal Train box fine-tunes a LoRA candidate on a mix of 1,400 examples, the 700 new and 700
  replayed old ones. Step 4: a lime Gate box checks the candidate on the new golden set and the old suite; a dashed red
  edge labelled fail leads to a red Stop box that opens a ticket. Step 5: a pass, 92 percent on the golden set, sends the
  candidate to a violet Registry box, not live. Step 6: the registry sends bundle 42 to a neutral Canary box, which
  compares it with a green Champion, the live bundle, at 1, 10 and 50 percent of traffic.
caption: >-
  The run is a chain with one gate. A candidate that fails the gate stops; one that passes is registered, never pushed
  straight to production, and meets live traffic through a canary against the champion. Counts are illustrative.
tags: [retraining, pipeline, gate, registry, canary, brightpost, genai]
