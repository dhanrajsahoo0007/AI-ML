title: The fine-tuning lifecycle
alt: >-
  A six-step architecture diagram of the fine-tuning lifecycle. Step 1: a neutral Decide box, a strong prompted baseline
  and the 200-ticket golden set, has a dashed arrow labelled knowledge to a neutral Use RAG box, because a missing fact
  is not fixed by training. Step 2: for a behaviour gap the arrow labelled behaviour leads to a blue Data box of 5,000
  tickets. Step 3: the train split goes to an orange Train box that trains a LoRA adapter. Step 4: the adapter goes to a
  lime Evaluate box that compares it with the baseline on the golden set. Step 5: if it is better, a green Deploy box
  merges or swaps the adapter. Step 6: a blue Monitor box watches live traces and drift, and an arrow labelled new
  tickets feeds fresh resolved tickets back into Data.
caption: >-
  Fine-tuning is a loop, not a step. The first box can send you away from it (to RAG); the last box feeds the first
  data box again.
