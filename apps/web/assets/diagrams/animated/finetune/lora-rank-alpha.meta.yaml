title: What rank and alpha change
alt: >-
  A three-step figure for one 4,096 by 4,096 matrix. Step 1: four orange bars show trained numbers for ranks 4, 8, 16
  and 64: 32,768 (0.20 percent), 65,536 (0.39 percent), 131,072 (0.78 percent) and 524,288 (3.13 percent); each
  doubling of rank doubles the bar. Step 2 adds a column of scales for alpha fixed at 16 (illustrative): 4, 2, 1 and
  0.25, with the rank 64 value highlighted. Step 3 adds a column for alpha equal to twice the rank: the scale is 2 at
  every rank.
caption: >-
  The rank sets how much the adapter can learn and how many numbers it costs. Alpha sets how loudly the update speaks;
  with alpha fixed, raising the rank quietens it, so many recipes tie alpha to the rank.
tags: [lora, rank, alpha, peft, genai]
