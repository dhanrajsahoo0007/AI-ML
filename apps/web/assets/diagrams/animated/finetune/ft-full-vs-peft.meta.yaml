title: Which weights change
alt: >-
  A three-step figure comparing full fine-tuning with LoRA on a 7-billion-parameter decoder drawn as four blocks:
  embeddings, attention, feed-forward and output head. Step 1: in full fine-tuning all four blocks are orange, meaning
  every weight is trained. Step 2: with LoRA the same four blocks are grey and frozen, and two small orange adapter
  boxes sit beside the attention and feed-forward blocks with arrows into them. Step 3 counts the cost. Full
  fine-tuning trains 6.74 billion numbers at 12 bytes each, 80.9 gigabytes, and stores a 13.5 gigabyte copy per task.
  LoRA at rank 16 trains 39,976,960 numbers, 0.59 percent, and stores an 80 megabyte adapter per task.
caption: >-
  Orange is what training changes. Full fine-tuning changes everything and stores a full copy per task; LoRA changes
  0.59 percent and stores a file of 80 MB.
