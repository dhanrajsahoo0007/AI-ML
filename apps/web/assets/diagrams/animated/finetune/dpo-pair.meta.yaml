title: A DPO training pair on the refund question
alt: >-
  A three-step diagram. Step 1: an orange Customer box asks about order 4471, a cracked kettle, 42 pounds, and whether
  money can be refunded. Two answers follow. A green Preferred answer says the 42 pound refund has been sent to an agent
  to approve. A red Rejected answer says it is done and the refund is on its way, with a note that this breaks the rule
  that refunds over 30 pounds need approval. Step 2: two neutral boxes show the illustrative log-ratio of each answer
  against a frozen reference model, plus 2.0 for the preferred answer and minus 3.0 for the rejected one. Step 3: both
  feed a lime DPO loss box that works the loss: minus the log of sigmoid of 0.1 times 5.0, which is 0.5, giving 0.47.
  A note says the loss at the start, with both ratios zero, is 0.693.
caption: >-
  DPO trains on the pair directly. It raises the preferred answer's probability against a frozen reference and lowers the
  rejected one's; there is no reward model and no sampling. Log-ratios and the loss value are illustrative.
tags: [dpo, preference, loss, reference-model, brightpost, genai]
