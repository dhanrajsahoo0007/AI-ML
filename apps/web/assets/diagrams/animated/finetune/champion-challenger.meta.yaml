title: Champion against challenger at a 10 percent canary
alt: >-
  An orange Traffic box at 2.3 requests per second feeds a neutral Router that sends 10 percent to a green Challenger,
  bundle 42, which receives 828 requests an hour, and 90 percent to a green Champion, bundle 41, the live model, with a 90
  percent baseline pass rate. Both models feed a lime Graded samples box that grades 200 answers from each on one rubric.
  The challenger passes 178 of 200, 89 percent. A note says the 95 percent interval of plus or minus 4.3 points runs from
  84.7 to 93.3 and holds the 85 percent floor, so the canary widens to 50 percent instead of promoting yet.
caption: >-
  Both models answer real traffic and the same judge grades them. At 200 samples the challenger's interval still holds the
  floor, so the check cannot rule out a drop. Pass counts are illustrative.
tags: [champion-challenger, canary, evaluation, interval, brightpost, genai]
