title: How golden-set tickets reach the training set
alt: >-
  A left-to-right chain of five boxes. A blue Golden set of 200 tickets is joined by a red arrow to a blue Seed pool of
  150 seeds, 20 of which were copied from the golden set. Neutral arrows lead to a green Generate box with 8,000
  candidates, then to a blue Training set of 4,200 examples, about 560 of them near copies of golden tickets (13.3
  percent), then to an orange Student. A red dashed line returns from the Student to the Golden set, with a note that
  the student is graded on tickets it has seen, 20 of 20, where an honest 88 percent would be 17.6, so the score is
  inflated by 1.2 points. A lime box below, the guard, says to split the golden set off first and drop any candidate
  with ROUGE-L 0.7 or more to a golden ticket. All counts are illustrative.
caption: >-
  Red marks the leak: 20 golden tickets used as seeds become about 560 training examples, and the student is then
  graded on the tickets it has seen. The lime guard at the bottom is the fix. Counts are illustrative.
tags: [synthetic-data, leakage, contamination, golden-set, brightpost, genai]
