title: Soft labels with temperature
alt: >-
  A three-step figure of four candidate first words for a refund reply: Refund, Replace, Escalate and Decline. Step 1:
  green bars for the teacher at temperature 1 give probabilities 0.865, 0.117, 0.016 and 0.002, nearly all on Refund.
  Step 2: a second column of green bars for the teacher at temperature 4 gives 0.455, 0.276, 0.167 and 0.102, a much
  flatter spread in which the runners-up are visible. Step 3: an orange column for a student part-way through training
  at temperature 4 gives 0.325, 0.325, 0.197 and 0.153, and a lime note says the KL divergence from teacher to student
  is 0.039, which times the temperature squared of 16 is 0.63, with the loss formula underneath. The logits are
  illustrative.
caption: >-
  A high temperature turns the teacher's answer into a full distribution, so the student learns that Replace is a far
  better runner-up than Decline, not only that Refund is correct.
tags: [distillation, soft-labels, temperature, kl-divergence, genai]
