title: First token against prefill load
alt: >-
  A line chart in two steps. The x axis is the offered load on one prefill unit, rho, from 0.3 to 0.9, with the
  measured busy fraction in brackets; the y axis is the 95th-percentile time to first token in milliseconds, at the
  reserved hit mix where 90 percent of follow-ups hit. Step 1: a green line for fast turns rises from 365 milliseconds
  at rho 0.3 to 709 at 0.9 and crosses the dashed green 600-millisecond target near rho 0.76; a lime point marks the
  chosen rho 0.6 at 454 milliseconds and an orange point marks rung 2 of the degradation ladder at rho 0.8, 629
  milliseconds. Step 2: a red line for misses rises from 584 to 1,329 milliseconds and crosses its dashed red
  1,200-millisecond target between 0.8 and 0.9; it is 733 at the chosen point and 1,062 at rung 2. Notes say that
  small jobs first keeps hits fast while misses wait behind each other, and that rung 2 is a stated degraded mode.
caption: >-
  Small jobs first keeps hit turns fast as load rises and misses take the wait: at the chosen ρ 0.6 the fast p95 is
  454 ms; the 600 ms target is crossed near ρ 0.76. Stage times are illustrative.
