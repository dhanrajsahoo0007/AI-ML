title: What the model reads on turn 50
alt: >-
  A layout of context-window bars, built in three steps. Step 1: turn 50's window of 14,150 tokens as one bar in prompt
  order: a grey system prompt with tool definitions of 2,500 tokens shared by all users; a violet user header of 700
  for this user; then, for this conversation, an orange summary of turns 1 to 40 of 1,500, orange turns 41 to 49 word
  for word of 5,400, blue search results from turn 47 of 2,000 and blue file chunks of 1,600; and, new each turn, a
  violet recall block of 300 and the orange message of 150. A note says a prefix hit reads 13,700 tokens from cache and
  computes 450. Step 2: the same chat kept whole is 60,050 tokens, 4.2 times larger; a second bar shows the 14,150
  window and the 45,900 tokens removed: 22,500 folded into the summary, 10,000 of old search results, and 13,400
  because the file is sent as chunks, not whole. At turn 100 the window is 16,006 tokens against 96,550, and kept
  whole the chat passes a 200,000-token window at turn 211. Step 3: turn 56 reads 17,750 tokens; after it a background
  job folds turns 41 to 48, with the search and the file, into the summary and pre-fills 6,600 tokens on the home unit,
  so turn 57 reads 10,250 tokens and hits; across all chats a fold computes about 9,300 tokens off the critical path.
caption: >-
  Turn 50 reads 14,150 tokens, not 60,050, in an order that keeps 13,700 of them cached; the window grows between folds
  and each fold is pre-filled in the background. Block sizes are illustrative.
