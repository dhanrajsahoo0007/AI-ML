title: Pricing the router's mistakes
alt: >-
  A layout in two steps. Step 1: a lime turn router sends turns either to green fast racks, at 0.426 GPU-seconds a turn
  and 60 tokens a second, or to teal reasoning racks, at 1.404 GPU-seconds and 20 seconds of thinking. Below, two red
  cards name the mistakes: a missed hard turn, a false negative, keeps a weaker answer or leads to a regenerate, 35
  percent of the time, that pays for both turns; needless thinking, a false positive, costs 3.30 times the GPU time
  and 20 seconds of waiting. Step 2: a table for 1,000 auto turns, 60 of them hard, at three thresholds. Point A,
  recall 0.60 and a 0.5 percent false-positive rate: 40.7 reasoning turns, 24 missed, 4.7 needless, 15.6 weaker answers
  kept, 1,121 fast-turn equivalents of GPU. Point B, chosen and lime, recall 0.80 and 2 percent: 66.8, 12, 18.8, 7.8
  and 1,167. Point C, recall 0.95 and 10 percent: 151, 3, 94, 1.95 and 1,350. Notes say B halves A's weaker answers for
  4.1 percent more GPU, while C keeps 5.9 fewer for 15.7 percent more and 1,880 seconds of needless thinking.
caption: >-
  Both mistakes have a price: needless thinking costs 3.30× the GPU time and 20 s of waiting, a missed hard turn costs
  a weaker answer. Point B halves A's weaker answers for 4.1% more GPU. Router rates are illustrative.
