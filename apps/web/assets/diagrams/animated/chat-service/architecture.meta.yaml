title: The consumer chat service, built in eight steps
alt: >-
  An architecture diagram in six zones, built in eight steps. Step 1: an orange user sends a message through a grey API
  gateway to a dark accent orchestrator, which sends the whole history to a green fast decode pool and streams tokens
  back. Step 2: the orchestrator writes each message to a violet conversation store before the reply is done, and keeps
  a conversation cache and a resume buffer in a violet hot state store. Step 3: a blue assembler builds the window;
  teal tools for search, code and files reach a violet file index for chunks, and grey background jobs fold old turns
  into summaries in the conversation store. Step 4: the orchestrator sends the conversation id to a lime inference
  router, which picks the conversation's home unit in a green prefill pool of 1,113 units of 8 GPUs; prefill swaps
  prefix blocks with a violet KV store of 8 petabytes of NVMe a region and sends the KV cache over RDMA to the fast
  decode racks, whose tokens return up a trunk to the orchestrator. Step 5: a lime turn router joins the path and
  decides the effort, and green reasoning racks at 100 tokens a second take the hard turns, the fast racks running at
  60. Step 6: a blue memory service reads 20 saved memories and recall snippets from a violet memory store, which
  background jobs write from user text only. Step 7: lime safety screens check the input and the stream. Step 8: a
  lime rate limiter counts tokens per 5-hour window, a green small model takes fallback turns, the meter writes usage
  to a violet traces store, and a lime evaluation card reads the traces for gates and canaries.
caption: >-
  Every turn re-reads its conversation, so the design decides what the window holds, keeps the work already done on
  the conversation's home prefill unit or in the regional KV store, and sends only hard turns to the reasoning racks.
  Volumes are illustrative.
