title: The conversation tree and its deletion
alt: >-
  A layout in two steps. Step 1: a row of message boxes after a grey summary of turns 1 to 40: orange user turns and
  green replies from turn 46 to turn 49. A dashed arrow from turn 49's user message adds a pale green regenerated reply
  beside the first one, a sibling. From turn 46's reply a second branch drops to an orange edited turn 47b and its
  green reply, and a lime current_leaf box, moved by a conditional update, points at that reply. A note says each
  conversation is one partition, 17.4 kilobytes on average and 145 at turn 50, and a branch forking before the last
  fold uses the older summary. Step 2: a grey deleted event fans out to seven violet stores, each with an action and a
  deadline: caches, the stream buffer, the sidebar and cached data keys are purged within 1 minute; KV blocks on the home unit and in the
  KV store are dropped by the conversation's salt within 15 minutes; recall and file indexes and shared links within 1
  hour; messages, summaries and files are soft-deleted now and hard-deleted within 30 days; backups become unreadable
  to the service because the conversation's data key is destroyed now, in lime, while KMS backups of the key age
  out within 30 days; memories from the chat are kept but marked source
  deleted and the user is told; and a legal hold, set only by legal, in orange, suspends hard deletion while it lasts.
caption: >-
  Edits and regenerations are siblings in a tree, so nothing is overwritten; deleting a chat is one event that every
  store acts on by its own deadline, and backups become unreadable to the service. Sizes are illustrative.
tags: [genai, chat-service, storage, deletion, privacy, case-study]
