title: From one zone to two zones, the edge and a second region
alt: An architecture diagram built in five steps in which an app server and its database first run in one zone of a home region near London, a second zone then gets another app server and a standby copy of the database kept in sync while a load balancer that spans both zones takes every request, zone A then loses power so the load balancer gets no answer from it and sends all traffic to zone B where the standby becomes the primary, an edge site near Sydney then serves copies of product photos to far customers in 10 milliseconds and asks the home region only on a miss, and finally a second region is previewed with a database copy a few seconds behind and a small fleet of standby servers.
caption: Brightpost from one zone to two zones, the edge and a second region
