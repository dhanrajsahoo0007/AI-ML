title: Brightpost's data map, every kind of data in the store that fits it
alt: An architecture diagram built in seven steps in which Brightpost's app servers first keep their operating system and code on each server's own disk while orders go to a managed database that writes a nightly export file into a bucket beside the product photos, customer export files are then saved on the server disks and are lost when the scaling rule removes servers, the export files move to their own bucket that deletes them after seven days, a cache for baskets and a search index fed with product changes are added, click events go to an event stream and a printing partner's status updates go to a key-value tracking table while a file share stays unused, a warehouse takes the events and a nightly copy of the database, and the nightly backup is kept in a vault in the separate audit account.
caption: Where each kind of Brightpost's data lives, and why
