title: IOPS, throughput and latency
alt: A three-row drawing. In the first row a review database sends many small 8 KB reads to a volume, 1,200 a second, which moves under 10 MB a second, so the number of reads is the limit. In the second row a backup job sends a few 1 MB reads, 125 a second, which moves 125 MB a second, so throughput is the limit. In the third row one read takes about 0.1 ms on a laptop SSD, about 1 ms on a network SSD volume and several milliseconds on a network HDD volume, and reads beyond the limit wait in a queue.
caption: The three numbers of a volume
