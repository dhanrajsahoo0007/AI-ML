title: "FinOps: see, decide, act"
alt: A layout of three columns joined left to right. The first column, the cloud's tools, says see where the money goes through cost reports by account and tag, a daily billing export, forecast and spike alerts, and rightsizing and storage advice. The second, a monthly team habit, says decide what to change in a 45-minute review with an owner per line, cost per order and three actions picked by size. The third, the owners, says act by switching off idle resources, rightsizing, cleaning up storage and fixing tags. A dashed arrow runs back under the columns from act to see, because next month's numbers show the result.
caption: FinOps is a loop that runs every month, not a report
tags: [cloud, operations, finops]
