title: From one VM set up at boot to a fleet built from a baked image
alt: An architecture diagram built in five steps. One app server boots from a plain operating system image and downloads the shop's packages from a public package mirror. Then a VM group copies a VM template into one server in each of three zones of the London region, behind a load balancer that spans the zones. On sale day at 9:02 the group adds 5 servers, each one waits on the slow mirror for 11 minutes, and the load balancer keeps them out of service. An image build then installs the packages once into golden image v12 and the template points to it. Finally new servers boot from that image and join the load balancer at 9:05, about 3 minutes after they were added.
caption: Brightpost's fleet, from set up at boot to a baked image
