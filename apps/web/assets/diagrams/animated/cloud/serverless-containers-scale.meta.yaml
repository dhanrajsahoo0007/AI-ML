title: Serverless containers, revisions and traffic splits
alt: An architecture diagram built in six steps around Brightpost's card maker. First the team hands a container image to the platform, which gives back an HTTPS front door that sends every customer request to revision v1. Then an autoscaler adds copies of v1, from 1 to 3, as requests in flight grow. Then the failure, revision v2 with a 5 MB upload limit takes 100% of traffic at once. Then traffic moves back to v1 in seconds and v2 stays with 0%. Then the fixed revision v3 gets 10%, then 50%, then 100% of traffic while an alert watches errors per revision. Last, v3 reaches the private orders database through a link into the company network.
caption: Brightpost's card maker on a serverless container platform
