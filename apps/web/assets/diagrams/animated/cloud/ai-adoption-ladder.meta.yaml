title: Four ways to use AI on a cloud
alt: A ladder of four rungs. On the first, you send your data to a ready-made AI service and run nothing. On the second, you send a prompt to a hosted model through one API and pay per token. On the third, you add your own documents or labelled examples to a provider's model through retrieval or tuning. On the fourth, you bring data, code and GPUs and train, register and serve your own model. Each rung gives more control and needs more work.
caption: Four rungs, from renting a finished AI service to running your own model
tags: [cloud, operations, ai-ml]
