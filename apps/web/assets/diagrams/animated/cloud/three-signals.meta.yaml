title: One request, three signals, three questions
alt: A layout in four steps showing one slow Pay request with trace id 4bf9 leaving three signals. A metric value of 9.3 seconds lands in the metrics store and answers whether something is wrong. A log line saying an A1 print file was built lands in the log store and answers what exactly happened. A span of 9.0 seconds for the print service lands in the trace store and answers where the time went. A closing note says the same trace id is written into the log line and the span, so one search finds both.
caption: One Pay request leaves a metric, a log line and a span, and each answers a different question
tags: [cloud, operations, observability]
