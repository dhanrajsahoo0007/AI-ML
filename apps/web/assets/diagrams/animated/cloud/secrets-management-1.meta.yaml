title: Rotating an API key with two valid keys
alt: A sequence diagram with four lanes, the rotation job, the secret store, an app server and the payment API, in which the job creates a second key v2 at the payment provider on Monday at 10:00 while v1 stays valid and saves v2 in the store as the current version with v1 kept as the previous one, the app server picks up v2 at its hourly re-read and charges with it without a restart, the job revokes v1 on Tuesday at 10:00 after reads of v1 have stopped, and a server that still held v1 is refused once, re-reads the store, retries with v2 and the charge is paid.
caption: Two valid keys during a rotation, and a refresh when a key is refused
tags: [cloud, resilience, secrets]
