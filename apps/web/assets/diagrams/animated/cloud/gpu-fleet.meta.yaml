title: A GPU kept busy by a queue
alt: An architecture diagram built in three steps in which a notebook first holds one GPU machine for all 168 hours of a week while a busy-time meter reads 15 percent, then a tagging job and the notebook submit work to one job queue and a shared GPU runs the jobs back to back so the meter reads about 80 percent, and last training runs that save progress every 30 minutes join the same queue while a batch service watches the queue length and runs between zero and two GPUs.
caption: A GPU is billed while it is on, so a queue in front of it keeps it busy
tags: [cloud, compute, gpu]
