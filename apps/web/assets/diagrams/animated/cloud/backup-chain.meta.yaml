title: "From snapshots beside the disk to a locked, tested copy in another account"
alt: An architecture diagram built in six steps in which a review disk in the shop account is snapshotted every night into the same account while the orders database's nightly backup is copied to a backup vault in a separate audit account, an attacker with a stolen admin session in the shop account then deletes the review disk and all 34 of its snapshots but its delete on the vault is refused, a backup policy set at the organisation then backs up every data store unless a tag opts it out so the review disk reaches the vault too, a vault lock stops anyone deleting a backup before 35 days, each backup is copied to a second region inside the audit account, and a monthly drill restores from that far copy into the test account and checks the data.
caption: Brightpost's backups, from snapshots beside the disk to a locked and tested copy in another account
tags: [cloud, resilience, backups]
