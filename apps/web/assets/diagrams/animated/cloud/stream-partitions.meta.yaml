title: Partitions, consumer groups and offsets
alt: An architecture diagram built in three steps in which a stock stream has three partitions, each read by exactly one worker of the stock group at its own offset, with the offsets saved in an offset store, then a fourth worker joins the group and gets no partition so it waits idle, and finally an analytics worker in a second consumer group reads all three partitions at its own much earlier offsets.
caption: One stream, two consumer groups, an offset per partition for each group
