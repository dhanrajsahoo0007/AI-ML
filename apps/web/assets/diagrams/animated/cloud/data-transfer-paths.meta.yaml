title: The data transfer map, free and billed paths
alt: A map built in five steps. Inside Region A, an app server and a database in zone A talk for free. An app server in zone B calling the database in zone A crosses zones, which some clouds bill. Customers on the internet send data in for free, and data sent out to them is billed. The zone B server reaches the provider's storage service in the same region through a private endpoint with no NAT meter, while the same traffic through a NAT is billed per gigabyte. Copying a bucket to a replica in Region B is billed per gigabyte. A note says real rates differ by cloud and change over time.
caption: Which data paths are free and which are billed
