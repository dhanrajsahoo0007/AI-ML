title: From a payment call over the internet to a private endpoint
alt: An architecture diagram built in five steps in which an app server looks up the payment provider's API name, gets a public address and calls it through a NAT gateway and the internet, then a private endpoint with the address 10.0.31.10 appears in the shop network but carries nothing while the provider refuses calls from the internet, then a private DNS zone answers the same name with the endpoint's address so card checks take the private path, then the provider's side is shown as a published service in front of an internal load balancer in a network that uses the same 10.0.0.0/16 range, and finally a storage endpoint with a policy lets the app reach Brightpost's own buckets and refuses a bucket in another account.
caption: Brightpost's payment calls move from the internet to a private endpoint, once DNS points the name at it
