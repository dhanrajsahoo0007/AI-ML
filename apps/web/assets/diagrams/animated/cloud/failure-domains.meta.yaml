title: What fails together on Brightpost's order path
alt: Brightpost's order path drawn by failure domain, built in six steps. Shoppers reach a provider-wide CDN, then a load balancer that spans three zones of a London region, with one app server in each zone; one order is followed through the server in zone A to a session cache that has a single node in zone B, to the orders database in zone B with a synchronous standby in zone C, and to a card-payment provider outside the cloud. In the failure step the payment provider stops answering for 3 hours while every cloud part stays healthy. Later steps add a second payment provider that takes over when the first does not answer, a copy of the session cache in zone C, a deploy pipeline that sends a new version to zone C first, then zone B, then zone A, and a provider health feed that holds deploys during a cloud incident.
caption: What fails together on Brightpost's order path
