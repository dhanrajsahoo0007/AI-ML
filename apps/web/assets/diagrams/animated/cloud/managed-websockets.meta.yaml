title: A managed connection service holds the sockets and calls your code by connection id
alt: An architecture diagram built in three steps in which 1,600 shoppers' pages hold their open connections to a managed connection service that answers the pings, the service then tells a short-lived function that connection 7f3 has joined and the function saves that 7f3 watches poster 18 in a connection list, and when the orders database reports that poster 18 has 13 left the function asks the service to send that message to connection 7f3.
caption: A managed connection service holds the sockets; your code sees only connection ids
