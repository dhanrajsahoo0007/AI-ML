title: From one rented server to capacity that follows demand
alt: An architecture diagram built in six steps in which shoppers first reach one rented app server sized for an ordinary day, then on sale day 2,000 shoppers arrive at once and about 1,200 orders are lost when the server times out, then one request to the provider's API swaps the server for one four times bigger that serves 800 of the 2,000 shoppers, then a load balancer shares every shopper between the server and up to nine extra servers, then a scaling rule that keeps processor use near 60 percent asks the API to add servers when busy and remove them when quiet, and finally a usage meter counts only the minutes each server ran.
caption: Brightpost's sale day, from one fixed server to capacity that follows the shoppers
