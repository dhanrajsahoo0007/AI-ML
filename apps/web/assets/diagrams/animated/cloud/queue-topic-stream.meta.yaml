title: Queue, topic and stream for Brightpost's order events
alt: An architecture diagram built in six steps in which the shop app puts one message per order on an email queue that hands each message to one of two workers, worker A then crashes before confirming order 1042 so the queue hands the same order to worker B which sends a second email, every worker then checks a sent-email table before sending so the second email is skipped, a message that fails five times moves to a dead-letter queue, the shop then publishes each order once to a topic that copies it to the email queue and to a stock worker, and finally the shop appends every order event to a stream that an analytics reader and a new report read at their own positions, the report replaying from the first event.
caption: Brightpost's order events through a queue, a topic and a stream
