title: A deadline passed along three hops
alt: A sequence diagram with four lanes, the shop app, the order service, the print service and the poster files, in which the shop's Pay step gives the call chain 3 seconds, the order service passes 2.8 seconds on to the print service and the print service passes 2.7 seconds on to the file read, then a first try to a busy print server is cut at its 1 second limit, one retry with 1.7 seconds left lands on the other print server and the order is saved after 1.3 seconds, and finally, when retries already make up a tenth of recent calls, the order service does not retry but saves the order and books the print later, so Pay still answers within 3 seconds.
caption: One deadline for the whole chain, a per-try limit, one retry and a retry budget
tags: [cloud, networking, service-to-service]
