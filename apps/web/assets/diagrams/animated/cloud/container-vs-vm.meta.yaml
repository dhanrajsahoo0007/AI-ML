title: Virtual machines and containers on one server
alt: Two stacks drawn on the same physical server. On the left a hypervisor splits the server into three virtual machines, each with its own guest operating system and kernel, its libraries and its app. On the right one host operating system with one kernel and a container runtime hold three containers that carry only libraries and an app. A second step adds two rows. A new virtual machine boots a whole operating system in one to three minutes, while a new container starts a process in seconds; and the wall between virtual machines is a kernel of their own, while every container shares one kernel, so a kernel flaw can reach all of them.
caption: Three VMs carry three kernels; three containers share one
