title: Cold start, warm start, and a second copy
alt: The first photo finds no copy of the resize function, so the platform starts one, which opens a database connection and finishes after 1 second of start-up and 2 seconds of work. The second photo reuses the warm copy and its connection and takes 2 seconds. Two photos at once make the platform start a second copy with its own connection. After a quiet night both copies are gone and the next photo starts cold again.
caption: A cold start, a warm start, and a second copy with its own database connection.
