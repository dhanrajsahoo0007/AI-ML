title: "A block volume: burst credits, a steady disk type, a snapshot chain and a restore"
alt: An architecture diagram built in seven steps in which app servers ask a review server for product reviews and its self-run database reads about 80 blocks a second from a general-purpose volume with burst credits, on sale day the database asks for 1,200 reads a second and at 9:50 the credits run out so the volume serves only 300 and pages wait about 7 seconds, the volume then moves to a type with 2,000 IOPS set and no credits, a first snapshot copies all 40 GB in use, later nightly snapshots copy only the changed blocks and reuse the rest, the newest snapshot becomes a new volume in a second zone attached to a spare server, and a weekly copy goes to a second region.
caption: Brightpost's review volume, from running out of burst credits to snapshots restored in another zone
