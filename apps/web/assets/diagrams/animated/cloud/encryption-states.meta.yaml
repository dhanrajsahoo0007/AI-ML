title: Data at rest, in transit and in use
alt: Three columns show the same customer order in three places. At rest, on a disk or in a bucket, encryption at rest turns it into scrambled bytes and stops a stolen disk or copy, with the key held in the key service by the provider or by you. In transit, on the wire from a phone to the load balancer, TLS seals each connection and stops a listener, with a key made for that connection that is gone when it closes. In use, in memory while the processor works on it, confidential computing has the chip encrypt memory so the host cannot read it, with the key held inside the processor where nobody can export it.
caption: Three states of data, the control for each, and who holds each key
tags: [cloud, resilience, encryption]
