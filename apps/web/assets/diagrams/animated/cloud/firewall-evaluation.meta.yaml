title: Two layers of rules, there and back
alt: A sequence diagram with four lanes, the app server, the data subnet's list, the database's own rules and the database, in which at 09:14:02 the app opens a connection on port 5432, the subnet list allows it by its in rule 100 and the database's rules allow it because it comes from the app group and remember the connection, the reply passes the database's rules as a known connection but is checked again by the subnet list's out rule 100, and in a second call at 09:20:00 on a list with no out rule the reply is dropped and the app times out.
caption: A connection passes the subnet list and the database's rules, and only the list checks the reply again
