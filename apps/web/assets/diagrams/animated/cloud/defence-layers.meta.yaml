title: "Defence in depth: six layers around the customer records"
alt: Six nested rings around Brightpost's customer records, from the outside in, edge, identity, network, host, app and data, each with one control such as a web firewall, sign-in with MFA and a device check, segments that accept one caller, patched servers with no admin port, a role check in the tool and a narrow database identity; a second step adds, for each ring, what an attacker gets if that control fails and which inner ring still stands.
caption: Six layers, each with its own control, around 90,000 customers' records
tags: [cloud, resilience, zero-trust]
created: 2026-11-13
