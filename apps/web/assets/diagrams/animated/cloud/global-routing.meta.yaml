title: Two regions, from DNS routing to one writer and a global front door
alt: An architecture diagram built in seven steps in which UK and Sydney shoppers first all reach a shop app and orders database in London with about 250 milliseconds per round trip from Sydney, a second stack near Sydney is then added with DNS routing that health-checks both regions and answers each shopper with the nearest one, a trial lets both databases take writes and copy each other both ways, the last poster in stock then sells twice, once in each region 0.4 seconds apart, the fix makes London the only writer so Sydney sends order writes there and reads its own copy about one second behind, a global front door on one anycast address then replaces DNS steering, and finally both regions share one identity service while each keeps its own copy of the secrets.
caption: Brightpost's second region, from DNS steering and two writers to one writer behind a global front door
