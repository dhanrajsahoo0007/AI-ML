title: From edge to service, what each layer owns
alt: A stack of five layers that a call passes in order, edge cache, web application firewall, load balancer, API gateway and service, each beside a box that says what it owns. The edge cache owns public copies close to the caller, the firewall owns traffic that looks like an attack, the load balancer owns healthy servers and an even spread but cannot tell one shop from another, the highlighted API gateway owns who is calling and what they may call, and the service owns the business rules such as whether shop 64 may open invoice 9031. A note says some designs put the balancer behind the gateway.
caption: Five layers, five questions. Only the gateway knows which shop is calling.
