title: Who runs each layer, VM fleet, serverless containers and a code platform
alt: A grid with three columns, a VM fleet for comparison, serverless containers and a code platform, built in three steps. Rows run from your code through libraries, language runtime, build, operating system, machines and scaling, to HTTPS and releases. On the VM fleet the team runs every row. With serverless containers the team runs the code, libraries, runtime and build inside the image, and the provider runs the operating system, scaling, HTTPS and revisions. On the code platform the provider also owns the language runtime and the build. The last step adds what each costs while idle and where background work can run.
caption: Who runs each layer when you hand over a machine image, a container image or your code
