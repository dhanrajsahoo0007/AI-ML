title: From patching a hand-kept list to an image pipeline and a managed fleet
alt: An architecture diagram built in seven steps in which an engineer first patches four listed servers over SSH from a list kept by hand while two hand-built servers are on no list, a flaw scanner switched on for running servers finds the flaw still on those two servers on day 21, an agent on every server then reports to a fleet manager that sees nine of nine servers and feeds the scanner, a patch baseline with a Tuesday 02:00 window tells the fleet manager what to install, an image pipeline bakes the newest base image with patches and the agent, tests it and stores version 14, the shop's scaling group replaces its servers from version 14 one at a time, and config rules check every hour that the servers still match.
caption: Brightpost's fleet, from a hand-kept patch list to images, an agent and rules
