title: Three learning paths over the same hubs
alt: A grid with the seven Cloud hubs as columns, Start here, Fundamentals, Networking, Compute, Data, Resilience and Operations, and one row per reading path; each cell says when the path enters that hub and how many pages it reads there; the from-zero path visits every hub left to right and returns to Start here for the practice page; the interview path starts with the decision guides, then reads Resilience, Data, Networking and Fundamentals and ends with the practice pages; the certification-minded path has three rows, foundation reading Start here and six Fundamentals pages, associate reading Networking, Compute, Data, Resilience and Operations, and professional returning to Fundamentals, Networking, Resilience, Data and Operations for the multi-account, multi-region and migration pages.
caption: Same pages, different order
