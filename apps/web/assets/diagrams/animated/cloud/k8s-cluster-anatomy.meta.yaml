title: Inside a Kubernetes cluster
alt: An architecture diagram of one Kubernetes cluster in which a person or a deploy pipeline sends a request for three copies to the API server, the API server saves it in the state store, the controllers and the scheduler watch the API server and write back their decisions, and the API server tells the kubelet on each of three nodes in three zones which pods to run, so each node starts one shop-web pod next to a checkout or search pod.
caption: The control plane holds what you want; the nodes run what actually exists
