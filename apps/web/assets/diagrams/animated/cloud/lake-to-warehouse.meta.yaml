title: From questions on the orders database to a lake, a query engine and a warehouse
alt: An architecture diagram built in seven steps in which the finance lead first asks questions of the orders database's read copy while click events sit in a stream for seven days, the day's clicks and orders then land every night as raw JSON files in a lake bucket, a query engine reads those files in place after asking a catalog which files make a table, a sales dashboard's six charts refresh every fifteen minutes and each one scans all eighteen gigabytes of raw JSON, a nightly job converts the raw files to columnar files split by date so a chart reads about twenty megabytes, a warehouse loads the curated tables and serves the dashboard a summary table while the finance lead keeps the query engine for one-off questions, and access rules hide customer names and addresses in both the catalog and the warehouse.
caption: Brightpost's sales dashboard, from a full scan of raw files to a summary table
