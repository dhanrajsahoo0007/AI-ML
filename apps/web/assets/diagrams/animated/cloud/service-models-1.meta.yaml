title: Brightpost climbs the ladder, one part at a time
alt: An architecture diagram built in five steps in which customers send orders to an app server on a virtual machine that also runs the orders database, with the engineer Asha patching the machine and running the database; at 3:10 a.m. the database disk fills, orders fail and the alert goes to Asha; the database then moves to a managed engine that the provider's operations team patches and backs up while Asha only picks its size; next, each new product photo in the photo buckets starts a resize function that the provider runs and scales, and writes a thumbnail back; finally a support agent answers customer emails in a rented help desk that a vendor runs end to end.
caption: Brightpost hands one part at a time to the provider
