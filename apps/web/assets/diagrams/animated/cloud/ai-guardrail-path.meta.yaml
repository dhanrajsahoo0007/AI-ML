title: A support chatbot with guardrails, scoped tools and human approval
alt: An architecture diagram built in seven steps in which a chat service first sends each customer message to a language model that may look up any order and refund any order, a pasted note then makes the model read and refund a stranger's order 5122, a guardrail is added that checks every prompt and reply and blocks the note, help articles and product reviews are retrieved as data through the same check, the tools then run as a tool identity limited to the signed-in customer so order 5122 is refused, refunds move to a workflow that asks the support agent about any refund over 30 pounds before paying, and finally every turn and decision is written to an audit log with personal data masked while each customer may send 20 messages a minute.
caption: Brightpost's support chatbot, from open tools to guardrails, scoped tools and a person for big refunds
tags: [cloud, resilience, ai-security]
