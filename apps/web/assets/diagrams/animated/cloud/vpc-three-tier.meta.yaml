title: From two public machines to a private three-tier network across three zones
alt: An architecture diagram built in five steps inside a private network with the address range 10.0.0.0/16 in a London region. First an app server and the orders database each have a public address, so customers reach the server directly and scanners on the internet reach the database. Then a public subnet holds a load balancer with the only public address, the server and database keep private addresses, and the scanners find nothing to reach. Next the app tier and the data tier run in three zones, with an app server in each zone and a standby copy of the database in zone B kept in sync. Then an internet gateway sits in the network's wall, the public route table sends every outside address to it, and the private route table keeps traffic local. Finally zone A is lost; the load balancer gets no answer from server A and shares the traffic between the servers in zones B and C, and the standby becomes the primary.
caption: Brightpost's network, from two public machines to three tiers in three zones
