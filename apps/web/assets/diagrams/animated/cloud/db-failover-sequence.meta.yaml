title: A database failover, seen from the app
alt: A sequence diagram with four lanes, the app server, the database endpoint name, the primary in zone A and the standby in zone B, in which the app looks up the name, writes an order to the primary, which copies it to the standby before it confirms, then at 06:00 the primary stops and the next write times out while the app retries with waits of 1, 2 and 4 seconds, at 06:01:40 the standby is promoted and the name is pointed at it, and at 06:02 the app looks up the name again and retries the same order with the same idempotency key, so it is saved once.
caption: A database failover seen from the app, during Brightpost's 06:00 drill
tags: [cloud, resilience, high-availability]
created: 2026-11-13
