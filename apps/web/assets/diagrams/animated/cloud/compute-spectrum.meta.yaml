title: The compute spectrum, what each place gives and takes
alt: A grid with five columns, virtual machines, containers on your own virtual machines, managed Kubernetes, serverless containers and functions, built in four steps; first what you hand over and what you still run, from the operating system and the fleet on the left to only your code on the right; then how fast a new copy is ready, from minutes for a virtual machine to under a second for a warm function, and how long one run may last, with no limit on the left and a hard limit in minutes for functions; then how each one scales and whether local files survive; and last the cost shape, with virtual machines paid every hour whether busy or not and cheapest when busy all day, and functions costing nothing while idle and most when busy all day.
caption: Five places to run code, and what each one gives and takes
tags: [cloud, compute, compute-spectrum]
