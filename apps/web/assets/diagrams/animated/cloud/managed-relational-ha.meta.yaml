title: A managed database with a standby, a read replica, a proxy and a failover
alt: An architecture diagram built in six steps in which the shop app first sends every query to a managed PostgreSQL primary in zone A that copies each write synchronously to a standby in zone B and backs up to a nightly snapshot and change log, a read replica in zone C then takes the order page, on sale day the replica falls 40 seconds behind so shoppers who have just paid read payment pending and about 130 pay twice, reads that must show a shopper's own write then go to the primary while an alarm watches the lag, a connection proxy then shares the database's connections between the app servers and the resize function, and in a failover drill the standby takes over and the proxy re-points to it.
caption: Brightpost's orders database, from one primary to a standby, a replica, a proxy and a tested failover
