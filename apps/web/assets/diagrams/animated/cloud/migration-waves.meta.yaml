title: Moving the framing shop in waves
alt: An architecture diagram built in six steps in which an assessment tool first receives the list of six virtual machines from the framing shop's VMware manager in its back office; a landing zone and a private VPN link to the cloud region are set up next; in wave one a replication service copies the order app's disk blocks and launches it in the cloud, the shop's DNS name is pointed at the copy, and the copy still reads the old database over the link; then an old ticket PC under the workshop bench, missing from the inventory, asks the switched-off old server for the day's orders at 02:00 and gets nothing; a dependency map built from 35 days of traffic finds that flow, the PC is kept and reads its export over the link, and wave two moves the order database into a managed engine; finally a rebuilt price service reads the managed database.
caption: The framing shop's move, from inventory to a rebuilt price service
