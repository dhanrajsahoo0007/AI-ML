title: The storage-class ladder, cheaper to keep and dearer to read
alt: A grid of four storage classes, hot, cool, cold and archive, over five rows, built in five steps; moving from hot to archive, the cost to keep a gigabyte falls from highest to lowest, the fee to read a gigabyte back rises from none to largest, the first byte arrives in milliseconds on the first three rungs and in hours on most clouds for archive, the minimum stay billed grows from none to about 30 days, about 90 days and 180 days or more, and each rung pays off for data read every day, about monthly, about quarterly or under once a year; a last row shows Brightpost's thumbnails in hot, original photos after 30 days in cool, order exports after 90 days in cold and audit logs after one year in archive.
caption: Four storage classes, from hot to archive
tags: [cloud, data, object-storage]
