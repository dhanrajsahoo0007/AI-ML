title: Giving every line of the bill an owner
alt: An architecture diagram built in six steps in which Brightpost's shop servers, orders database and wholesale servers all meter into the provider's billing data and the finance lead receives one invoice, a GPU test cluster with no tags then runs for three weeks and the bill grows 40% with no owner, a tag policy then refuses untagged resources while the billing data splits into a shop view, a wholesale view and an unallocated line, a daily export fills a cost warehouse that divides cost by 12,000 orders, budget and anomaly alerts read the daily spend and point at the cluster on its first day, and rightsizing advice flags the cluster as idle after its two-day job.
caption: Brightpost's bill, from one number to a line per owner
