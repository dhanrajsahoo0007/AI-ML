title: The nines ladder
alt: A table of five availability targets built in three steps. 99% allows 3.65 days of downtime a year or 7.2 hours a month and is usually one server in one zone fixed by hand; 99.9% allows 8.8 hours a year or 43 minutes a month and usually needs copies in two or three zones with managed failover; 99.95% allows 4.4 hours or 22 minutes and needs no single-zone part on the path; 99.99% allows 53 minutes or 4.3 minutes and needs every part in parallel and a second region; 99.999% allows 5.3 minutes or 26 seconds and needs active-active regions. The last step marks Brightpost's order path at about 99.7%, about 2 hours a month, against the 99.99% its contract promised, 4.3 minutes a month, a gap of about 28 times.
caption: Each rung of nines, the downtime it allows and what usually earns it
tags: [cloud, resilience, availability]
