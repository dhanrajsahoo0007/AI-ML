title: An error budget, spent fast and slow
alt: A line chart of error budget left over 30 days, built in four steps. A dashed line marks burn rate 1, which spends the whole budget in exactly 30 days. On day 9 a fast burn drops the budget from 85% to 63%; the page fires after 10 minutes and the fix lands by minute 20. From day 16 a slow leak at 4 times the safe rate takes the budget from 51% to 11% by day 19; a ticket opens on day 17. At the normal rate the budget reaches zero on about day 26, and a box says risky changes freeze and only fixes ship until it recovers.
caption: Brightpost's 30-day checkout budget with a fast burn, a slow leak and a freeze
