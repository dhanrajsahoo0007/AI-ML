title: Brightpost's stock events, from a stream to a refund workflow
alt: An architecture diagram built in six steps in which the shop app puts every basket change and order on a stock stream of three partitions keyed by product id, with one worker per partition writing stock counts that the product page shows, then on sale day every hero poster event lands on partition 2 so its worker falls six hours behind and the page shows a wrong stock count that lets 380 extra orders through, then a lag alarm watches each partition with a five minute threshold, then the key becomes the product id plus a slot so the hot product spreads over all three partitions and each worker writes once per 500 events, then the shop sends order events to an event bus whose rule routes cancellations to a refund workflow, and finally the workflow refunds the payment with retries and waits for a support agent to approve large orders.
caption: Brightpost's stock events through a stream, a lag alarm, an event bus and a refund workflow
