title: Brightpost's tracking page on serverless containers
alt: An architecture diagram built in five steps. First the shop's customers use one fleet of 2 to 10 virtual machines for orders and order tracking, in front of the managed orders database. Then the tracking page moves to a serverless container platform with a minimum of zero copies, pulling a 1.1 GB image from a registry and reading order status from the database. Then the failure, after a quiet night no copy is running, so the first shopper at 07:05 waits about 8 seconds while one starts. Then one warm copy that is always on answers in 0.3 seconds, and a 180 MB image lets extra copies start faster. Last, slow replies raise an alert in the monitoring service.
caption: Brightpost's tracking page, from the VM fleet to serverless containers
