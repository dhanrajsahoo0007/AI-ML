title: Reading your own write from a lagging replica
alt: A sequence diagram with four lanes, the shopper, the shop app, the primary database and a read replica, in which the shopper pays for order 5121 at 9:42:00 and the primary commits the payment while the replica is still replaying changes from 9:41:20, the order page one second later reads the replica and shows payment pending, the shopper pays again and the primary records a second payment, and in the fix the app sends that shopper's reads to the primary for 60 seconds after a write so the page shows the order as paid.
caption: A write lands on the primary; a read from a replica 40 seconds behind does not see it
tags: [cloud, data, databases]
