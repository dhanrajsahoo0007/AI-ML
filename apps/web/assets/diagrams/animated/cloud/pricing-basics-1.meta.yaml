title: Brightpost's cloud bill, built meter by meter
alt: An architecture diagram built in seven steps in which customers send orders to two app servers billed by the hour, a database and buckets are added and billed for what they hold and for each request, a CDN sends product photos to customers and is billed per gigabyte that leaves, every request writes logs billed per gigabyte, a copy of the shop made for a load test is never switched off and doubles the bill, then tags, cost reports, a budget alert and a switch-off schedule catch and stop it, and finally a commitment covers the two steady servers while the image-resize worker moves to spot capacity.
caption: One month of Brightpost's bill, from the first meter to the fix
