title: Three places the writes can go
alt: Three panels compare where writes go in a two-region shop. With one writer, London takes every order and Sydney holds a read copy about one second behind, so there is one answer for every order but Sydney orders pay about 250 milliseconds. With a writer per region, both regions take orders and copy each other, so writes are fast but the two copies can disagree, as when the last poster sold twice. With one global database, both copies vote on every write, so every read is current but every write waits about 250 milliseconds and a third site breaks ties.
caption: One writer, a writer per region, or one global database, each with its promise and its cost
tags: [cloud, resilience, multi-region]
