title: "Backoff and jitter: wait longer, and not all at once"
alt: A sequence diagram in which an email worker copy is refused by a rate-limited email service, retries after one, two and four seconds and is sent on the fourth try, then three copies that each wait exactly one second retry at the same instant and are all refused, and finally three copies that each wait a random time retry at different moments and are all sent.
caption: Exponential backoff with jitter against three copies retrying in step
tags: [cloud, resilience, retries]
