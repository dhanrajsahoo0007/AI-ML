title: The seven Rs, with the framing shop's example for each
alt: A layout in four steps in which one box for the framing shop fans out to seven strategies ordered from least to most work; retire switches off the stock tracker and retain keeps the ticket PC beside the workshop printer; rehost copies the order app server block by block and relocate, not chosen, would move both VMware hosts onto the provider's VMware service; replatform moves the order database into a managed SQL Server engine and repurchase replaces the accounting package with a rented software service; refactor rebuilds the price calculator as a small service in month nine, after the move.
caption: Seven things you can do with each application, from least to most work
tags: [cloud, operations, migration]
