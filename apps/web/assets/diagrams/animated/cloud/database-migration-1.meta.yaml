title: The cutover window of a database migration
alt: A sequence diagram in four steps across the wholesale app, the MySQL source, the replication task and PostgreSQL. At 06:00 the app stops writes and the last order is 110,214. The task applies the last changes, lag reaches 0 at 06:02 and the counts match. The sequences are set to 110,215, the reverse copy starts at 06:04, the app switches to the new address at 06:05 and a test order is saved as 110,215. At 06:09 writes open on PostgreSQL and each change is copied back to MySQL, so a rollback stays possible for 7 days.
caption: Freeze, drain, reset sequences, switch, test and reopen, with a reverse copy running
