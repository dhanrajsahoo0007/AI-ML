title: TLS at the load balancer, then again to the backend
alt: A sequence diagram in four steps. The certificate service checks that Brightpost owns its domain and gives the load balancer a certificate. A shopper's phone says hello, the balancer answers with the certificate and a key share, the phone checks the name and issuer, and both agree session keys. The phone sends an encrypted request for an invoice; the balancer decrypts it, reads the path and opens a new TLS connection to the app server, and the encrypted answer returns the same way. On day 60 the certificate service renews the certificate without a restart.
caption: The balancer ends TLS with a managed certificate and encrypts again to the server
