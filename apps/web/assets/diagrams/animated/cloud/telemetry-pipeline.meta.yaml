title: From six log files to one telemetry path
alt: An architecture diagram built in six steps. First a shopper's Pay request crosses Brightpost's shop app, order service and print service, each on two servers with its own log file, and Asha reads the files over SSH. Then Pay takes 9 seconds for some shoppers, a support agent forwards complaints, and matching lines in three formats with no shared id takes Asha 2 days. Next an agent on each server sends metrics through a collector to a managed metrics store that a dashboard charts, structured logs go to a central log store kept for 30 days, a trace id travels with Pay from service to service while spans land in a trace store, and finally an alert rule on p99 Pay time pages Asha.
caption: Brightpost's telemetry, from six log files read by hand to metrics, logs and traces in managed stores
tags: [cloud, operations, observability]
