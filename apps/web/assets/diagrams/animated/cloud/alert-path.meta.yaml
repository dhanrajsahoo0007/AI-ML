title: From machine alarms to SLO alerts that page a person
alt: An architecture diagram built in seven steps. First, two app servers send metrics to the cloud's monitoring service, 140 machine alarm rules watch CPU, disk and every server error, and 140 alerts a week reach the on-call engineer through a chat channel. Then half of all payments fail and the alert lands in a muted channel, unseen for 3 hours. Next a checkout SLI counts good and bad checkouts, an SLO of 99.9% feeds a burn-rate alert with a 1-hour and a 5-minute window, and alert routing sends a fast burn to a paging tool and a slow burn and 6 kept machine alarms to a ticket queue. The paging tool calls the on-call engineer, who opens the runbook for that alert, and a blameless incident review writes the timeline and updates the runbook.
caption: Brightpost's alerts, from 140 machine alarms to a page on the burn rate
