title: Envelope encryption and a deleted key
alt: An architecture diagram built in six steps. The shop app asks the key service for a data key and receives a plain copy and a copy wrapped by a root key that never leaves the service. It encrypts the export file with the plain copy, discards it and stores the wrapped copy beside the file in the orders bucket. To read, it sends the wrapped key back to be unwrapped and then decrypts. A contractor's clean-up script schedules the key for deletion in 7 days, after which every unwrap is refused and every file is unreadable. A key policy then separates key managers from key users so the script's delete is denied, and every use of the key is written to an audit trail that raises an alarm when a key is scheduled for deletion.
caption: A small data key per file, wrapped by a root key in the key service
