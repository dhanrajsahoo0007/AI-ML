title: "Service-to-service calls: a private name, one HTTP/2 connection, per-call balancing and service identity"
alt: An architecture diagram built in five steps in which two order servers look up the print service by a private DNS name that answers with an internal balancer's address, JSON calls open a new connection each so a layer 4 balancer spreads them over two print servers, the order service then switches to gRPC and keeps one long-lived HTTP/2 connection per server, after a restart both connections land on print server A, which runs at 100 per cent while server B sits idle at 3 per cent and the callers wait 9 seconds and retry, a layer 7 balancer then picks a print server for every call while each call carries a deadline and at most one retry, and finally a service identity gives the order service a short-lived credential that the print service verifies on every call.
caption: Brightpost's order service calling its print service, from a private name to per-call balancing and service identity
