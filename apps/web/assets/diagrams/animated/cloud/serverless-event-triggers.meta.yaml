title: A function between events
alt: Brightpost's resize function starts when a photo lands in the uploads bucket, writes a thumbnail and saves its address in the shop database. A bulk upload of 1,500 photos starts about 300 copies that take every database connection, so the shop's servers are refused. A cap of 20 copies, a connection pool and a queue with a dead-letter queue repair it, and a nightly schedule and an HTTPS endpoint are shown as two more kinds of trigger.
caption: One function, five kinds of trigger, and the burst that emptied the database.
