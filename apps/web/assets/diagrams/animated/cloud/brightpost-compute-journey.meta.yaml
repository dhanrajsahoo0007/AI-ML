title: Where Brightpost runs each workload
alt: An architecture diagram built in six steps in which customers reach a fleet of two to ten virtual machines in front of a managed orders database, uploaded photos start a resize function, a nightly scheduler then starts a forty-minute recommendation job as a function and the platform stops it at fifteen minutes before it writes anything, the job moves to a container platform that pulls its image from a registry and runs it to the end before writing the picks to the database, an alert fires when the job fails or is late, and finally the shop app is packed into an image in the same registry so it can move later.
caption: Brightpost's workloads, each on the place its three facts point to
