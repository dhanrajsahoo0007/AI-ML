title: From print orders over the internet to a private line with a VPN behind it
alt: An architecture diagram built in six steps in which the shop's print API first sends print orders through a NAT gateway and across the public internet to the printing partner's factory, then one encrypted tunnel joins the cloud's VPN gateway to the factory router, that single tunnel drops for two hours and fifteen minutes on a sale day while 1,100 print jobs wait, two tunnels with BGP sessions replace it, a private line through a meeting site 40 km from the factory becomes the preferred path while the tunnels stay as a dashed backup, and finally DNS lookups are forwarded both ways between the factory's DNS server and the cloud's resolver.
caption: Brightpost's link to the printing partner, from the open internet to a private line with a VPN behind it
