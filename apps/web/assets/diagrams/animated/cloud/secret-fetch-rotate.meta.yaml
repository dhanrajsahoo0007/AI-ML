title: A secret store, a hand rotation that broke checkout, and the fixes
alt: An architecture diagram built in six steps in which Brightpost's app servers prove who they are with an attached service identity and read the payment provider's API key from a secret store, then Asha rotates the key by hand on the sale day and revokes the old version at once so three servers that missed the restart have every charge refused, then a rotation job makes the new key and keeps the old one valid for a day, a server whose key is refused re-reads the store and retries once, the same job changes the orders database password every 30 days, and every read of the store is written to an audit trail.
caption: Brightpost's payment key, from a hand rotation that broke checkout to a rotation nobody notices
