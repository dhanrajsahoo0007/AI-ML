title: From the internet to a pod, and what a rollout needs
alt: An architecture diagram built in seven steps in which a Deployment keeps three shop-web pods on three nodes, a Service gives them one stable address, shoppers reach the Service through a load balancer made from an Ingress, a rolling update with no readiness check sends shoppers to pods that are still warming up and causes page errors, a readiness check then puts only warm pods on the Service's ready list while the rollout replaces one copy at a time, the pod autoscaler raises three copies to five, and the node autoscaler adds a fourth node for the two pods that were left Pending.
caption: Brightpost's shop on Kubernetes, from one Deployment to a fourth node
