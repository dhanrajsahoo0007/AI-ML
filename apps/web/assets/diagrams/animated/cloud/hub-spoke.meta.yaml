title: From one peering to a transit hub
alt: An architecture diagram built in six steps in which the shop network is first peered with the printing partner's network and print jobs cross that peering, the new wholesale network is then peered with the shop network but its print jobs stop at the shop network because a peering does not pass traffic on, a mesh of six peerings joins four networks one pair at a time, a transit hub in the network account then replaces the mesh with one attachment per network and one link to the partner, a firewall in the hub inspects traffic between networks, and finally a test network attaches to its own route table in the hub and has no route to the shop network.
caption: Brightpost's networks, from one peering to a hub every network attaches to once
