title: Object storage, from uploads through the app to a locked copy
alt: Brightpost's product photos in six steps; first, staff upload each 20 MB original through the app server, which writes it to the uploads bucket by key; second, a thumbnail rebuild script pointed at the wrong bucket writes small thumbnails over 900 originals, and with versioning off nothing older is kept; third, versioning is on, so the same write only adds a version and the 900 originals are restored from the old versions; fourth, the app server only hands the browser a signed URL, the browser uploads straight to the bucket, and the bucket's new-photo event starts a resize worker that writes the thumbnail to the thumbnails bucket; fifth, a lifecycle rule moves originals to a cool class after 30 days; sixth, every new version is copied to a locked bucket in a second region, inside the audit account, where nobody can delete it for 30 days.
caption: Brightpost's photo bucket, from uploads through the app to a locked copy
