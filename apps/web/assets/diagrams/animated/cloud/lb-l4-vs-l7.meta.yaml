title: "Managed load balancers: layer 7 at the front, draining on deploy, layer 4 inside, global at the edge"
alt: An architecture diagram built in six steps in which shoppers reach one public layer 7 load balancer that shares them between two app servers, a deploy script then stops server A at once so its open requests are cut while the balancer keeps sending it new ones, the script is changed to deregister the server, let the balancer drain it for at most 60 seconds and only then stop it, the balancer ends TLS with a certificate the cloud renews and sends blog pages to a separate blog server, both app servers call a private print service through an internal layer 4 balancer, and finally a global front door with one anycast address takes shoppers in the UK and in Australia at a nearby edge site and carries them to the London balancer.
caption: Brightpost's load balancers, from one front door to a drained deploy, an internal tier and a global address
tags: [cloud, networking, load-balancing]
