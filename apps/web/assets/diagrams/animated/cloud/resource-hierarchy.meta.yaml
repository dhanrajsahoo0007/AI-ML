title: From one account for everything to a tree with rules on it
alt: An architecture diagram built in six steps in which one shop account first holds both the live orders database and a test copy, a clean-up script meant for the test copy deletes the live database because the account allows it, the shop then gets an organisation root with three folders for non-production, production and security and one account under each so the same script is refused at the account wall, a guardrail set on the root reaches every account and an admin of the shop account cannot switch it off, tags label the shop's workload group while a budget alert watches the whole organisation's spend, and a delete lock on the live database stops deletion even by an admin.
caption: Brightpost's accounts, from one container for everything to a tree with rules that flow down
tags: [cloud, fundamentals, governance]
