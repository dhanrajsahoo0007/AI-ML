title: From one copy of everything to a tier that can lose a zone
alt: An architecture diagram built in seven steps in which shoppers first reach one app server and one orders database in zone A, then a load balancer shares them between stateless app servers in zones A, B and C, the database gets a synchronous standby in zone B, a network fault cuts zone B off on sale day so the balancer gets no answer there and the servers in zones A and C run at 120 percent, each zone then runs 4 servers at 60 percent so two zones could carry the load, the health check asks a readiness path that tests the database, and every call to the printing partner's API gets an 800 millisecond timeout while a feature flag can switch the extras off.
caption: Brightpost's shop, from one copy of everything to a tier that can lose a zone
tags: [cloud, resilience, high-availability]
