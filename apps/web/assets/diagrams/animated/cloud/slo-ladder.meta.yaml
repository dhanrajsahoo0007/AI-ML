title: SLI, SLO and SLA
alt: Three rungs built in three steps. The SLI is what was measured, 99.96% of checkouts good this month. The SLO is the internal target of 99.9%, about 43 minutes a month, where the team acts with alerts, freezes and reviews. The SLA is the contract's promise of 99.5%, about 3.6 hours a month, below which credits are owed. The margin between the SLO and the SLA is about 2.9 hours a month, time to fix a problem before any credit is owed.
caption: Measure, target and promise, with the promise set lowest
tags: [cloud, operations, slo]
