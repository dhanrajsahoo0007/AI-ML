title: A virtual machine, opened up
alt: An architecture diagram in two steps. First, one physical host in which a hypervisor cuts the machine into three virtual machines, Brightpost's app server with 4 virtual processors and 16 GB of memory, another tenant's machine and a noisy neighbour that shares the same hardware. Second, Brightpost's machine opened up into four virtual processors, 16 GB of memory that is wiped when the machine stops, a network card with a private address, a data disk that can move to another machine, a 30 GB boot disk copied from an image, and a fast local disk that is erased on stop.
caption: One host, several tenants, and the parts of one VM
