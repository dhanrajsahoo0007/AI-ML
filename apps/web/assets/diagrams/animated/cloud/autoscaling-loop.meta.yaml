title: Autoscaling as a control loop
alt: An architecture diagram built in seven steps. Two app servers behind a load balancer report processor use every minute to a metrics service, and an autoscaler compares the average with a 60 percent target. The autoscaler then adds four servers that boot from a server image and take shoppers after warm-up. In the failure step the autoscaler removes those four servers two minutes after the wave of shoppers fades, without draining them, so the next wave at 18:15 meets only two servers. The fix waits through quiet time, drains each server for 60 seconds and removes one at a time, so the next wave meets six servers. A schedule and a forecast then raise the floor ahead of known rushes, a warm pool of four stopped servers joins in about a minute, and a separate group of receipt workers scales on the backlog of an order queue instead of on processor use.
caption: Brightpost's newsletter evening, as one autoscaling loop
