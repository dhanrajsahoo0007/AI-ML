title: Brightpost's cost levers, from all on demand to a commitment sized on the floor
alt: An architecture diagram built in six steps. Customers send orders to two app servers that query a database, all billed on demand. A usage history counts the servers running each hour and finds a floor of 2 and a peak of 10. A three-year commitment sized on the sale week covers 4 machines while the fleet uses 2.4 in an average hour, and the image-resize worker, now a serverless function billed per request, is not covered at all. The fix commits only to the 2 always-on servers and lets extra servers on busy days run on demand. A nightly export job runs on spot capacity, is retried if the machine is taken back, and writes one file a night to the orders bucket. A lifecycle rule moves export files older than 90 days to a colder storage class.
caption: Brightpost's purchasing levers, step by step
