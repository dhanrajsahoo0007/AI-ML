title: Where the provider's security work ends and yours begins
alt: An architecture diagram built in five steps that shows three stacks of the same six layers, from data at the top to the host and building at the bottom, each split into the layers Brightpost secures and the layers the provider secures. First the orders database on a virtual machine, where Brightpost owns everything down to the operating system; then a scanning bot on the internet that comes in through the open database port, uses an operating-system flaw nobody patched and locks the data; then the image-resize worker as a function, where the runtime and operating system move to the provider; then the orders database on a managed database service, where the engine moves to the provider too; and finally a posture check that reads the settings of all three services.
caption: Brightpost's three workloads and where the line falls on each
