title: From a tree built by hand to a landing zone that vends accounts
alt: An architecture diagram built in six steps in which Brightpost's organisation root, with a guardrail against public buckets and single sign-on, holds three folders for non-production, production and security with a test account, a shop account and a log archive, the shop account sending its logs to the archive; a second team's wholesale account is then made by hand outside the tree, its bucket is public so anyone online downloads the trade orders and no logs reach the archive; the account joins the production folder so the guardrail reaches it and the public read is refused; a security tooling account collects findings while the wholesale account's audit logs flow to the archive; the wholesale account attaches to a shared network hub with one link to the printing partner; and account vending creates a wholesale test account in the non-production folder with the same baseline.
caption: Brightpost's estate, from a tree built by hand to a landing zone that vends every new account
