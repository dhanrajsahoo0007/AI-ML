title: Sending a webhook with retries and backoff
alt: A sequence diagram with three lanes, the outbox, Brightpost's delivery worker and a gift shop's API, in which the worker takes an unsent shipped event from the outbox at 16:00, posts it signed and gets a 200 in 0.4 seconds, then for a second event gets a server error, waits about a minute plus a random extra and succeeds on the retry, then for a third event gets no reply within 5 seconds on each try while the waits double from 16:00 to 16:07 to 18:07, and finally after 24 hours marks the row failed and parked while the shop is told it can ask for a replay.
caption: A delivery worker retries with growing waits and gives up after 24 hours
tags: [cloud, networking, webhooks]
