title: Moving a live database with full load, change data capture and cutover
alt: An architecture diagram built in seven steps in which about 60 gift shops order through a wholesale app that reads and writes a 60 GB MySQL database on one virtual machine, a first try that dumps and restores the data into a managed PostgreSQL engine freezes writes from 20:00 to 07:30 and is rolled back, a converter then creates the PostgreSQL schema, a replication task copies every table in 3 hours while the app keeps writing, the same task then replays the MySQL change log so the lag falls to 4 seconds, validation compares row counts and checksums on both sides, and at cutover the app points at the new address while a reverse copy keeps MySQL current for a rollback.
caption: Brightpost's wholesale database, from a failed dump and restore to a cutover of minutes with a rollback path
