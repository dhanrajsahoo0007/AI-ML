title: One gateway that checks every token before three services
alt: An architecture diagram built in six steps in which about 300 gift shops' tills call one API gateway that checks only each shop's key while three services, orders, stock and invoices, each check the sign-in token in their own code, a till stolen from shop 64 then uses an expired token that the invoices service accepts because its check skips the expiry time, a sign-in service issues the tokens and the gateway checks every token once and refuses the stolen till, a second version of the order API runs beside the first while the gateway routes /v1 and /v2 and tells /v1 callers the end date, partner apps sign up on a developer portal and call on a plan of their own, and the gateway logs every call per API and per key.
caption: Brightpost's wholesale API, from three token checks in three services to one gateway that checks, routes and logs every call
tags: [cloud, networking, apis]
