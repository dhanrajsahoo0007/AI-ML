title: From console clicks to a reviewed template applied by a pipeline
alt: An architecture diagram built in six steps in which a developer first builds a test copy and the shop's scaling group by clicking in the web console, whose clicks become calls to the cloud API, then lowers the shop's server maximum from 10 to 3 by hand so the two copies differ and 1,800 sale-day shoppers meet 3 servers, then writes the setup as a template in a repository and keeps the console read only, then an infrastructure engine compares the template with what is live, shows a plan with one change from 3 to 10 and applies it through the API, then a CI pipeline started on each merge gets a one-hour token from the identity service and runs the plan and the apply with no stored key, and finally the engine keeps its state in one remote store that it locks during each run.
caption: Brightpost's server setup, from console clicks to a template applied by a pipeline
