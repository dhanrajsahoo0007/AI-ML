title: From one shared NAT to a way out in every zone
alt: An architecture diagram built in seven steps in which an app server with only a private address in zone A calls a payment provider through a NAT gateway in a public subnet while a stranger's inbound call is refused, app servers in zones B and C send their calls across to the same NAT, a fault takes zone A down for 50 minutes so zones B and C lose their only way out, each zone then gets its own NAT gateway, eight in ten gigabytes through the NATs turn out to go to the cloud's own storage service, a private endpoint then carries that storage traffic so it never touches the NAT, and an egress filter lets calls reach a printing partner that lists Brightpost's fixed addresses while blocking a call to an unknown site.
caption: Brightpost's way out of its private network, from one shared NAT to one per zone, a private endpoint and an allow-list
