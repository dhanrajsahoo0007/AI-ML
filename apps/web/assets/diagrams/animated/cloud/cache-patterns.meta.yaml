title: "A managed cache: cache-aside, a stampede, a rebuild lock, a replica and shards"
alt: An architecture diagram built in seven steps in which app servers first read every product page from the orders database while baskets come from a cache, then read the hero poster's page from one cache key with a five-minute time to live and query the database only on a miss, then the key expires at nine o'clock and 1,200 requests miss together and run 1,200 queries, then a rebuild lock lets one request rebuild while the others get the old copy and the key is refreshed early, then a replica in a second zone copies the cache and takes over if the first zone fails, then cluster mode moves some key slots to two more shards, and finally the cache reports misses, evictions and memory use to monitoring.
caption: Brightpost's cache, from every view on the database to a guarded, replicated, monitored cache
