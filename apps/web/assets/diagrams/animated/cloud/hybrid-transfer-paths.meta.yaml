title: "Moving a photo archive into the cloud: online, by courier and through a gateway"
alt: An architecture diagram built in six steps in which a copy script sends 12 terabytes of photos from a NAS in Brightpost's office to a photo bucket over the office's one 100 megabit line, the full line then makes the staff's help desk time out while the script silently skips 4,000 files, a transfer agent beside the NAS then copies with a speed cap in working hours and a checksum for every file, the 100 terabytes of raw files are copied onto a transfer appliance and sent by courier into the bucket, a storage gateway then keeps the office's file share working by caching hot files and syncing changes to a share in the cloud, and finally a photographer uploads new photos to a managed SFTP endpoint that writes each file into the bucket.
caption: The photographer's archive, from a copy script on a shared line to a capped transfer, a courier and a gateway
tags: [cloud, data, transfer]
