title: A six-question review of Brightpost's shop
alt: An architecture diagram built in eight steps. It starts with Brightpost's shop as it stands, where customers reach app servers through a load balancer, orders go to a database with a standby and a nightly backup, an export job writes one file a night to an orders bucket and a printing partner downloads it. Six review cards then appear one at a time, each pointing at a weakness. Operations finds that the export job crashed for three nights with no alert. Security finds that the partner can read all 730 files. Reliability finds that no backup has ever been restored. Performance finds that a new server takes four minutes to start. Cost finds a database ten percent busy all year. Sustainability finds a resize worker that redoes 3,600 photos a night. The last step replaces every weakness with its fix and adds an on-call alert that fires when no file has arrived by 02:00.
caption: Brightpost's shop, reviewed one pillar at a time
tags: [cloud, fundamentals, well-architected]
