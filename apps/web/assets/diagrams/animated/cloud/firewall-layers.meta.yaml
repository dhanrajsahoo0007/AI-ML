title: Firewall rules on the resource, at the subnet and above every team
alt: An architecture diagram built in seven steps in which shoppers reach a load balancer on port 443 and one wide rule lets anything inside a private network reach anything, a contractor's admin server with port 22 open to anyone lets a stranger's script in and on to the orders database port, the wide rule is then replaced by rules on each resource that name a group so the app servers accept port 8080 only from the load balancer's group and the database accepts port 5432 only from the app group while the stranger is refused, the database's reply returns without a rule of its own because the rules are stateful, a stateless subnet list at the data subnet checks traffic in and out separately, the contractor reaches the admin server through an identity-checked remote access service with no port open to the internet, and an organisation firewall policy checked before every team's rules forbids port 22 from anyone.
caption: Brightpost's firewall rules, from one wide rule to groups, layers and a policy above every team
