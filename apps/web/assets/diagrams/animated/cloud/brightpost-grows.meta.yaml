title: Brightpost grows
alt: An architecture diagram built in eight steps. Shoppers first reach one rented app server that runs the whole shop. On the first sale day 2,000 shoppers arrive at once, the server times out and about 1,200 orders are lost. A load balancer then shares shoppers between app servers in three zones of a region near London, with a scaling rule that runs 1 to 10 servers. The orders database moves to a managed service with a standby in a second zone. Photos go to a bucket, a function makes thumbnails, and an edge cache keeps copies near far-away shoppers. One organisation holds separate accounts, staff sign in once with MFA, and every call is copied to an audit account. Budget alerts watch the spend by tag, and a second region is shown as a preview.
caption: Brightpost's journey from one rented server to a shop ready for a second region
