title: A managed edge in front of a bucket and an app
alt: An architecture diagram built in five steps in which customers reach an edge cache that serves photos from a private bucket and passes pages and checkout to a load balancer and app servers, a scraper with 400 addresses then sends 900 product-page requests a second through the edge until all 10 app servers are busy, an always-on flood absorber at the edge drops a burst of junk packets while the scraper's valid requests still pass, a web firewall attached to the edge blocks any address sending more than 300 requests in 5 minutes, and an origin lock refuses the scraper when it tries the load balancer's own address.
caption: Brightpost's edge on sale day, from a plain cache to rules and a locked origin
