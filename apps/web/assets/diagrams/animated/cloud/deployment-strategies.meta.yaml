title: All at once, rolling, blue/green, canary and flags on one fleet
alt: An architecture diagram built in seven steps around one load balancer, a fleet running the current version and a fleet running the new version, an orders database, a registry and a CI/CD pipeline. First the pipeline builds one image and all three servers are replaced at once. Then a rolling deploy replaces one server at a time while both versions take traffic. Then a migration job run before the rollout renames a database column and every write from the old servers fails. Then the migration only adds the new column, the old servers keep working and the new version writes both columns. Then a blue/green deploy flips all traffic to the new fleet and keeps the old one warm. Then a canary sends 5% of traffic to the new version while an alarm watches its error rate and can roll the traffic back. Finally a flag service keeps the new checkout switched off inside the deployed code.
caption: One fleet, five ways to ship a new version, and the rename that broke the old servers
