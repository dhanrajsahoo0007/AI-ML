title: A NoSQL table, from partition key to a second region
alt: An architecture diagram built in six steps in which a printing partner's status updates and the shop's reads by order id reach a managed NoSQL table that hashes each key to one of four partitions, two thousand sale shoppers then make the shop add one to a single counter item four hundred times a second so that every write lands on partition three and is throttled, the counter is then split into ten keys that spread over all four partitions while a banner reader reads the ten items and adds them up, a status index kept up to date on every write lets a support agent find stuck parcels, a change stream carries every write to an email sender that tells the customer when a parcel is delivered, and a replica table in a second region accepts writes with changes copied both ways.
caption: Brightpost's NoSQL tables, from one hot key to a second region
