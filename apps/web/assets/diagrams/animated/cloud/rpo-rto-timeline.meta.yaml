title: "RPO and RTO on one timeline"
alt: A timeline with three moments. The last good copy reaches the recovery region at 13:45, the region is lost at 14:00, and the shop takes orders again at 16:00. The 15-minute gap before the disaster is labelled RPO, the data you lose, and the 2-hour gap after it is labelled RTO, the time you are down. A last step shows that copying data more often shrinks the RPO, while keeping more running in the second region shrinks the RTO.
caption: RPO looks back from the disaster; RTO looks forward
tags: [cloud, resilience, disaster-recovery]
