title: The lag between demand and capacity
alt: A timeline from 18:00 to 18:07. A wave of 700 shoppers arrives at 18:00 when there is room for 400. The metric needs one minute, the decision to add four servers takes half a minute, and the new servers need about four minutes to start, boot and warm up, so six servers serve only from 18:05:30. A second row shows a schedule that had six servers running since 17:55, so there is no wait. A third row shows a warm pool that hands over stopped servers in about one minute, so six servers serve from 18:02:30.
caption: Why a reactive rule runs minutes behind a wave
tags: [cloud, compute, autoscaling]
created: 2026-11-13
