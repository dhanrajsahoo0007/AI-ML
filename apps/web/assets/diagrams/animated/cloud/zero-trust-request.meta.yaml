title: From a trusted VPN to checking every request
alt: An architecture diagram built in seven steps in which a support agent's laptop first signs in to the office VPN and any VPN address may open the admin tool, which has full access to the orders database; a contractor's personal laptop with malware then joins the same VPN, opens the admin tool with no login and exports 18,000 customer records; an identity-aware proxy replaces the VPN, asks the company directory for a sign-in with MFA and passes a signed identity to the tool; a device check makes the proxy refuse the unmanaged laptop; an access policy limits each person to the apps they need; the admin tool accepts only traffic from the proxy and reads the database with its own narrow identity; and every allow, deny and query is written to an audit log.
caption: Brightpost's admin tool, from behind a VPN to behind an identity-aware proxy
