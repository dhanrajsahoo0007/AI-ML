title: From a build to a running container, by digest
alt: An architecture diagram built in seven steps in which a build pipeline first pushes the shop image tagged latest to one image registry and three app servers pull latest when they start; a half-tested build is then pushed under the same tag, so servers two and three run the test build while server one still runs version 1.4; every build then gets a version tag and a digest and all three servers pull the same digest; the registry scans each push for known flaws; builds land in a test registry and only a tested, clean digest is promoted unchanged to the registry production pulls from; the pipeline signs the digest and a signature check lets only signed images run; and last a lifecycle rule expires old test builds while a replica keeps the production images in a second region.
caption: Brightpost's shop image, from pushed as latest to promoted, signed and pinned by digest
