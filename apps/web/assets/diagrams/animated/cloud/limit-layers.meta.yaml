title: Three ways a cloud says no
alt: Three nested rings of limits with examples in each. The outer ring is account quotas, how many of a thing an account may run, such as thirty-two processor cores per region for the shop and four servers for the test account. The middle ring is API rate limits, how fast you may ask the cloud to start or list servers, a budget shared per account or caller. The inner ring is resource throughput, how much one database, one table partition or one queue or function can serve. A final column says how each is lifted, by asking ahead, by calling less and backing off, or by buying bigger or spreading the load.
caption: Account quotas, API rate limits and resource throughput
