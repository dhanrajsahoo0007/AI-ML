title: A short-lived credential, from request to expiry
alt: A sequence diagram with four lanes, the app server, a local endpoint on that server, the identity service and the orders bucket, in which the app asks the local endpoint for a credential at 10:00, the identity service returns a signed token that expires at 11:00, the app sends the token with a read of one order file and the bucket checks the signature, the expiry and the policy before it answers 200, the app renews the token at 10:50 without anything being typed or stored, and a copy of the first token used at 11:30 is refused because it has expired.
caption: A workload gets a short-lived credential, uses it and renews it
