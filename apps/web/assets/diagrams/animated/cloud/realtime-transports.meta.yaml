title: "Live updates on the cloud: from polling to sockets that survive a deploy"
alt: An architecture diagram built in six steps in which 1,600 shoppers' sale pages first ask the load balancer every 5 seconds for news, about 160 requests a second to each pair of app servers, then each page holds one open connection kept alive by a ping every 25 seconds under the balancer's 60 second idle limit, a purchase on servers 3 and 4 is published on a shared pub/sub channel that every server listens to, a deploy then drains servers 1 and 2 and cuts 800 connections at once so 800 browsers reconnect in the same second and fill the database's connection pool, the repair closes connections slowly during the drain while browsers wait a random 1 to 30 seconds so about 27 reconnect each second, and finally an autoscaler adds a server when the connection count passes 600 per server instead of watching processor use.
caption: Brightpost's live stock counter, from polling to connections that survive a deploy
