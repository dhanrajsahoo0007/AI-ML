title: A lookup from inside a cloud network
alt: A sequence diagram with four lanes, a server, the network's built-in resolver, a private zone and public DNS, in which the app server asks for the database's private name at 10:00 and the resolver reads the linked private zone, which answers 10.0.21.5 with a 60-second TTL, then a public name is sent out to public DNS and answered with the load balancer's address and a 300-second TTL, the same public question two minutes later is answered from the resolver's cache without leaving the network, and finally the export job asks the database's private name at 03:30 from the jobs network, where no zone is linked, so the resolver asks public DNS and gets back no such name.
caption: The built-in resolver checks linked private zones first, then asks outside
