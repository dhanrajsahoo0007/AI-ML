title: "Disaster recovery: from backups to active-active"
alt: An architecture diagram built in six steps across two regions. First the whole shop runs in region A, London, with its database backups kept there and only photos and logs copied, locked, to region B. A game day then switches London off and finds region B holds no orders and the backups live only in London. Next, backups and the change log are copied to region B every 15 minutes, templates can build any region and a DNS record points at region A. Then a database replica runs in region B a few seconds behind while its servers stay off, then a small load balancer and one app server run there and take test traffic, and finally both regions serve shoppers by health and write to one multi-region database.
caption: Four disaster recovery tiers, from backup and restore to active-active, on Brightpost's two regions
tags: [cloud, resilience, disaster-recovery]
