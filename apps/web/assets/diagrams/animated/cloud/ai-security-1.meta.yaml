title: A chatbot refund with a human approval step
alt: A sequence diagram in four steps across a customer, the chat service, a refund workflow, the support agent and the payment provider, in which a 12 pound refund is paid at once, a 42 pound refund pauses until the support agent approves it at 10:20 and is then paid, and a request to refund order 5122 for a customer who does not own it is refused by the workflow before anything reaches payments.
caption: The chat service asks; the workflow checks the owner and the amount, and a person approves big refunds
tags: [cloud, resilience, ai-security]
created: 2026-11-13
