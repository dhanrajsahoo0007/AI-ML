title: From one shared app to a gateway in front of its own API service
alt: An architecture diagram built in seven steps in which shoppers and about 300 gift shops first reach the same shop app servers through one load balancer, one gift shop's retry bug then floods that shared door with about 4,000 calls a minute, the order API moves to a container service of its own behind the load balancer, an API gateway in front checks each shop's key and tells the buggy shop to slow down, a custom domain with a TLS certificate is attached to the gateway, an edge cache answers catalogue reads and sends only misses to the gateway, and a GraphQL service for the shop owners' app resolves one query by calling the order API and reading the orders database.
caption: Brightpost's wholesale order API, from extra routes on the shop's servers to a gateway in front of its own service
