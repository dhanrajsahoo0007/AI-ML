title: Where the offset is saved decides what a crash does
alt: A sequence diagram with four lanes, the stock stream, the stock worker, an offset store and the stock counts, in three steps; first the worker saves offset 1,500 before applying a batch of 500 events and crashes, so after the restart it reads from 1,500 and those 500 events are never counted; then the worker applies the batch before saving the offset and crashes, so after the restart it reads from 1,500 again and applies the same 500 events twice; finally the worker saves the counts and offset 2,000 in one database commit, crashes after the commit, asks the database where it stopped, gets 2,000 and carries on, so each event is counted once.
caption: At most once, at least once, and an effect that happens once
