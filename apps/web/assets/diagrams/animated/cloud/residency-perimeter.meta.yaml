title: Keeping customer data in its allowed regions
alt: An architecture diagram built in six steps in which Brightpost's orders database near London is copied to a read copy near Sydney while card numbers stay with the payment provider, a rented analytics tool then copies each nightly export from the orders bucket to a third region, a data perimeter refuses that reader because it sits outside Brightpost's organisation, the tool moves into Brightpost's own account where a region guardrail allows only London and Sydney, the bucket is encrypted with a key Brightpost holds, and an audit trail, an evidence collector and the provider's own audit reports give the auditor proof.
caption: Brightpost's customer data, from an unlisted copy in a third region to two allowed regions with proof
tags: [cloud, resilience, compliance]
