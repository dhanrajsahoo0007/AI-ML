title: A sale-day quota, a retry storm, and safe retries
alt: An architecture diagram built in six steps in which shoppers reach app servers through a load balancer while an autoscaler is told to start ten servers for a sale, the regional quota of thirty-two processor cores refuses servers nine and ten and the checkout page retries Pay four times with no wait, the quota is then raised and watched by an alert at eighty percent, the page retries once after a random growing wait, each Pay carries an order key that the servers check against a table of keys, and confirmation emails move to a queue whose worker backs off when the rented email service slows it, with a dead-letter queue for messages that fail five times.
caption: Brightpost's spring sale, from a quota nobody checked to safe retries
tags: [cloud, resilience, quotas]
