title: Brightpost's data, one store per access pattern
alt: An architecture diagram built in five steps in which shoppers use the shop app and fetch product photos straight from a bucket while one managed PostgreSQL database serves orders, baskets and product search, then on a sale day forty slow search queries a second fill the database and checkout waits nine seconds so about three hundred and ten orders are lost in seventy-five minutes, then product search moves to a search engine that the database keeps up to date, baskets move to an in-memory cache kept for seven days, and finally the finance lead's monthly report reads a copy of the database that trails it by a few seconds.
caption: Brightpost's data, with one store for each way the shop uses it
