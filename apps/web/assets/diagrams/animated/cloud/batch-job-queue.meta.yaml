title: From one long script on spot to a queue of small jobs
alt: An architecture diagram built in six steps in which one script on one spot machine reads 2,000 product photos from the uploads bucket and plans to upload all new sizes at the end, the cloud provider takes the machine back after five hours and the unsaved work is lost, the work is then split into 200 small jobs of ten products each in a job queue, a batch service sees the waiting jobs and starts 20 spot machines, each job saves six sizes per product to the thumbnails bucket as it goes so a reclaim loses under two minutes of work and the job goes back in the queue, and jobs that fail three times are set aside while a final publish job runs only after all 200 have succeeded.
caption: Brightpost's month-end re-render, from one long script to a queue of small jobs
