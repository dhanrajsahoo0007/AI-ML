title: One shop translated to another cloud
alt: An architecture diagram built in four steps. Brightpost's shop is copied to a second cloud box by box, with test shoppers, a load balancer, a private network, a server group, app servers and an orders database with a standby in another zone, but the server group starts all three servers in zone A. A drill cuts zone A off for 15 minutes, nothing answers the load balancer and every test shopper gets errors. A zone-spread setting is then put where this cloud keeps it, so the group starts one server in each of zones A, B and C, and when the drill runs again the servers in zones B and C keep selling.
caption: The same shop on another cloud, and the one setting that did not come along
