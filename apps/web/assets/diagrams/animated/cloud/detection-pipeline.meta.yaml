title: From a record of every call to a finding that wakes someone up
alt: An architecture diagram built in seven steps in which each call engineers make is written to an audit trail with a locked copy in a log archive, the test machines' flow logs and DNS logs join as sources, a threat detector reads all three and raises findings in one findings hub that sends a weekly email, a posture check and a vulnerability scan add their own findings, a stranger with a leaked test key starts four GPU machines and the high finding raised at 02:10 waits in the weekly email until Monday, an alert rule then sends high findings to the on-call engineer's phone while low ones stay in the weekly email, and finally the same rule runs a response function that disables the key and isolates the machines so the stranger's key is refused.
caption: Brightpost's detection pipeline, from audit trail to automatic response
tags: [cloud, resilience, threat-detection]
