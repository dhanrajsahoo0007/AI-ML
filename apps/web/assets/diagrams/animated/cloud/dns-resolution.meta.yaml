title: Public zones, private zones and a health-checked answer
alt: An architecture diagram built in five steps in which a customer's phone asks its resolver for the shop's name and Brightpost's public zone answers with the load balancer's address and a 300-second TTL, the app server inside the shop network looks up the database's private name in a private zone linked to that network and connects to 10.0.21.5, the nightly export job in a new jobs network asks the same question and gets no such name because the private zone is not linked to that network, the zone is then linked to the jobs network so the job gets 10.0.21.5 and reaches the database over the peering, and finally a health check probes the load balancer every 30 seconds so the public zone answers with the load balancer while it is healthy and with a back-soon page in a bucket when it is not, with a 60-second TTL.
caption: Brightpost's names, from one public zone to a private zone and a health-checked answer
