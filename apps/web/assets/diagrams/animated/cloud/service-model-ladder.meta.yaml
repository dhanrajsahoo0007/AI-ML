title: The service-model ladder, who runs each layer
alt: A grid with five columns, on-premises, IaaS, PaaS, functions and SaaS, over seven layers from your data and users at the top down to the building and hardware at the bottom, built in six steps; on-premises leaves every layer to you, IaaS hands the virtual machines and hardware to the provider, PaaS also hands over the operating system while you set scaling and the runtime version, functions also hand over scaling, and SaaS leaves only your data and users with you; a last row lists what each rung takes away, from fixing everything yourself, to no say over hardware, no access to the operating system, cold starts and time limits, and no changes to the code.
caption: Five ways to run an app, and who runs each layer
tags: [cloud, fundamentals, service-models]
