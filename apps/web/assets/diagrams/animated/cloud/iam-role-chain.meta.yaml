title: From a key in the code to roles and short-lived credentials
alt: An architecture diagram built in seven steps in which an app server first reads an orders bucket with a static key from its code, a stranger outside who found that key reads the same bucket, the key is then deleted and a service identity attached to the server receives a one-hour token from the identity service while the stolen key is refused, a policy limits that identity to reading one bucket so a write is denied, developers sign in through single sign-on with a second factor and get a role through their group, a writer role in a separate audit account trusts the shop app under an organisation guardrail, and an audit trail records each call into a log archive.
caption: Brightpost's storage key, from pasted in the code to no key at all
