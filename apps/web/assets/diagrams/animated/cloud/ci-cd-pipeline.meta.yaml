title: From one commit to production, building once
alt: A pipeline drawn in four steps. A commit is built into one image and unit tested, then the image is scanned for known flaws, signed with the pipeline's key and stored in the registry as version 1.9 with one digest. That same digest goes to staging in the test account, passes a smoke test that places one test order, waits for approval from a second engineer and is deployed to production as a canary and then to all traffic. A rollback redeploys the previous digest from the registry, and during a change freeze in sale week the approval gate stays shut.
caption: Build once, then promote the same digest from staging to production
