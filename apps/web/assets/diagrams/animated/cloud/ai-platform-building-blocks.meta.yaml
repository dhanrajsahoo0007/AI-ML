title: From a tuned model on its own GPU to a hosted model with retrieval
alt: An architecture diagram built in seven steps in which a support agent asks a reply drafter for a draft and the drafter calls a model tuned on old support emails that runs on a GPU machine kept on all day but busy two hours, the help article then changes the Christmas date but nothing carries the change into the tuned model so replies keep the old date, the endpoint is deleted and the drafter calls a hosted model through one API, an index job turns each edited article into a vector index that the drafter searches first, an evaluation set tests every change, a usage monitor counts tokens while calls stay private in the UK region, and finally a training pipeline for the one model Brightpost owns runs on the GPUs and registers versions that pass the tests.
caption: Brightpost's reply drafter, from a tuned model on its own GPU to a hosted model with retrieval
