title: "Object, block and file storage: from a private disk to a shared folder and a bucket"
alt: An architecture diagram built in five steps in which an order service sends print jobs through an internal balancer to two print servers that each save the print file on their own attached disk and send it to a printing partner, the partner is then down and the retry lands on the second server, which cannot find the file because it sits on the first server's disk, both servers then mount one shared file share so the retry finds the file, print files then move to a bucket that each server writes by key and the partner downloads with a signed link, and finally disk snapshots, a share backup and object versions are copied to a backup vault.
caption: Brightpost's print files, from a private disk to a shared folder and a bucket
