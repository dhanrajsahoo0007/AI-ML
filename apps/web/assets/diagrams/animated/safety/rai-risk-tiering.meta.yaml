title: Risk tiering by impact and reversibility
alt: >-
  A two by two grid. Columns are impact if wrong, low on the left and high on the right; rows are easy to undo on top
  and hard to undo below. Top left, a grey box says automated checks plus a weekly sample, for summarising a help
  article. Top right, a lime box says a person approves before it goes, for drafting a reply about a 42 pound refund.
  Bottom left, a lime box says template and pre-send checks plus a weekly spot check, for sending an order-status
  email. Bottom right, a highlighted lime box says approval, audit log, red team and sign-off by a named owner, for
  issuing a refund over 30 pounds. The use cases are blue boxes under each review.
caption: >-
  Two questions place a use case: how bad is a wrong output, and can the effect be undone. The answer sets the review.
tags: [responsible-ai, risk, governance, release-gates, brightpost]
