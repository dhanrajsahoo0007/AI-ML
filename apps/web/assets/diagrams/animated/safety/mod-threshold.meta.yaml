title: One classifier at two thresholds
alt: >-
  Two small tables side by side, built in three steps, for a made-up test set of 1,000 messages of which 100 are harmful
  and 900 are fine. The left table is the classifier blocking at a score of 0.5 or more: 90 harmful messages blocked and
  10 let through, 72 fine messages blocked and 828 allowed, giving precision 0.56, recall 0.90 and a false-positive rate
  of 0.08. The right table is blocking at 0.8 or more: 70 harmful blocked and 30 let through, 9 fine blocked and 891
  allowed, giving precision 0.89, recall 0.70 and a false-positive rate of 0.01. Agreeing cells are lime and the two
  error cells are soft red and ringed. A lime box underneath says raising the threshold blocks 63 fewer fine messages
  and lets 20 more harmful ones through.
caption: >-
  The same classifier, two cut-off points. A higher threshold wrongly blocks 63 fewer customers and misses 20 more
  harmful messages. Counts are illustrative.
