title: Three checks on a draft, then pass, repair or block
alt: >-
  A left-to-right pipeline in five steps. A green box, the model draft, a refund of 42 pounds, feeds three lime boxes
  in a row: a schema check that asks for valid JSON, a policy check against the 30 pound limit, and a grounding check
  against the evidence, which is the highlighted dark lime box. From the grounding check three arrows leave to three
  outcomes on the right: an orange box, pass, labelled all pass, which sends the answer to the customer; a grey box,
  repair, reached by a dashed arrow labelled fixable, which sends the error back to the model; and a red box, block,
  reached by a red arrow labelled unsafe, which sends a safe reply and hands off to a person.
caption: >-
  Cheap checks run first. A failing draft is either repaired, when the error is fixable, or blocked, when it is unsafe.
tags: [guardrails, output-validation, schema, policy, grounding, brightpost]
