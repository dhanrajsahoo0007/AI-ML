title: Three ways to catch a hallucination
alt: >-
  A grid in four steps. Three lime column headings are the methods: grounding check, an NLI model per claim;
  self-consistency, sample again and compare; and token uncertainty, read the probabilities. Step 2 adds two grey
  rows. What each needs: retrieved passages; nothing but sampling; token probabilities. The signal each gives:
  entailed, neutral or contradicted; the share of samples that disagree; low-probability numbers and names. Step 3
  adds the cost: one small call per claim; four extra samples, which is five times the output; and about free because
  it comes from the same pass. Step 4 adds a red row of what each is blind to: the wrong passage, retrieved; the same
  mistake every time; and a confident wrong answer.
caption: >-
  Each method needs something different and fails differently, so a design uses two that fail in different ways.
tags: [hallucination, nli, self-consistency, selfcheckgpt, uncertainty, detection]
