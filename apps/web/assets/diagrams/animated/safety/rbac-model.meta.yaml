title: A role decides which models, tools and data a user may reach
alt: >-
  A table drawn in four steps, one row per user. Step 1: three orange user boxes, Customer 1847, Support agent and
  Support lead, each with an arrow to a grey role box: customer, agent and lead. Step 2: green boxes list the models
  each role may call, from the small assistant model for the customer up to all models including the judge for the
  lead. Step 3: teal boxes list the tools: the customer may read orders and help articles and create refunds up to 30
  pounds, the agent has all four tools and approves refunds over 30 pounds, the lead approves any amount and changes
  the limits. The customer's refund cell is highlighted. Step 4: blue boxes list the data: the customer's own orders,
  the orders in the ticket queue, and all orders plus the audit log. Notes at the bottom say that anything not listed
  is refused and that the model gets the tools of the user's role, never more.
caption: >-
  The role is a row of permissions on three axes: models, tools and data. Illustrative roles; the 30 pound refund limit
  is Brightpost's rule.
tags: [rbac, access-control, roles, least-privilege, brightpost]
