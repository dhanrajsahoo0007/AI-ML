title: "A hold-back window lets a check run before text is shown"
alt: >-
  A figure in four steps. Step 1: a row of 20 green token cells, one token every 4.4 milliseconds. Step 1 also shows a dotted
  lime group labelled held back, 12 tokens, surrounds tokens 9 to 20, and an orange row below shows that the customer
  has seen tokens 1 to 8; a note says the window is the check time of 50 milliseconds divided by 4.4, rounded up, which
  is 12 tokens, and the delay is about 53 milliseconds. Step 3: a lime box, a check on the held tokens that takes 50
  milliseconds, receives an arrow from the held tokens, passes, and token 9 moves to the customer's row. Step 4: the
  check fails, so a highlighted red box says drop the held tokens and stop the stream, and a grey box shows the
  customer sees a hand-off message.
caption: >-
  Holding back 12 tokens costs about 53 ms and means the check can still stop text the customer has not seen.
tags: [guardrails, output-validation, streaming, latency, brightpost]
