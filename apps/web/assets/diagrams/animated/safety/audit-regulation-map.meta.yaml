title: Which rule asks for which control
alt: >-
  Four columns, one per rule, each with a grey header, grey provision boxes and a bottom box that says whether the rule
  binds Brightpost's support assistant. EU AI Act, Regulation 2024/1689: Article 12, high-risk systems allow automatic
  event logs; Articles 19 and 26(6), keep the logs at least six months; applies only if the system is high-risk, with
  Annex III duties from 2 December 2027. GDPR: Article 30, a record of processing; Article 22, contest a solely automated
  decision with human review; the bottom box is lime, yes today, because tickets hold personal data. SOC 2: CC6.1 restrict
  access, CC7.2 monitor for anomalies, CC8.1 authorise and record changes; applies if a buyer asks. ISO/IEC 42001 from
  2023: A.6.2.8 event logs while the system is in use, and a management system; applies if you certify. A note says it was
  checked on 16 November 2026.
caption: >-
  Only GDPR binds Brightpost's assistant today. The AI Act's logging duty targets high-risk systems; SOC 2 and ISO 42001
  are voluntary. Checked 16 November 2026.
tags: [compliance, eu-ai-act, gdpr, soc2, iso-42001, audit-log]
source: original
