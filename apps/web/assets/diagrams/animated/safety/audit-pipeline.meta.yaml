title: "Audit pipeline: redact, append, expire by age, read by role"
alt: >-
  An architecture diagram built in five steps. Step 1: two grey boxes on the left, the chat app and the tool gateway,
  which emit an event for each decision. Step 2: both send events into a lime box, redact and hash, which removes card
  numbers and email addresses. Step 3: it passes a hashed record to a violet box, an append-only store that is written
  once and hash-chained. Step 4: a grey retention job below sends a dashed arrow labelled drop raw after 30 days into
  the store; the record itself is kept 13 months, both ages illustrative. Step 5: in a read path on the right, an
  orange auditor queries a grey read-only, logged read API that reads the store, and an orange engineers box sends a red
  dashed arrow labelled write refused to the store, because no one can write or delete.
caption: >-
  Redact before storing, store append-only, expire by age, and give read access to a named role. The ages shown are
  illustrative.
