title: The red-team loop
alt: >-
  A loop in six steps. A blue Attack library box of 40 attacks, which is illustrative, feeds a teal Run box that
  sends the attacks to the assistant. The replies go to a lime Score box, highlighted, which finds 6 of 40 got through.
  The failures go to a grey Fix box for a prompt, filter or tool-limit change. The fixed cases go down to a violet
  Regression suite box that is kept for every release, and a dashed arrow runs back from the suite along the bottom to
  the library, so new attacks join the library and the loop repeats on each release.
caption: >-
  A red-team finding is only fixed when it becomes a test. The suite feeds the library, and every release re-runs it.
  The 40 attacks and 6 failures are illustrative.
tags: [red-teaming, regression, attack-library, loop, brightpost]
