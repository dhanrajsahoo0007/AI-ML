title: Where bias gets in, four sources
alt: >-
  Four columns, revealed one per step, joined at the top by grey arrows from left to right. Each column has a coloured
  header and three boxes below it for an example, a check and a fix. Data, in blue: web text over-represents some voices;
  count examples by group and topic; rebalance, filter and add examples. Model, in green: repeats a stereotype when the
  context is vague; run question tests such as BBQ and toxicity prompts; use preference tuning and refusal examples.
  Prompt, in orange: a persona or sample answers tilt the reply; test counterfactual pairs that swap one attribute; use
  neutral wording and re-test every edit. Evaluation, in lime: a classifier or judge that favours one style of text;
  split error rates by group; use varied raters and audit the classifier.
caption: >-
  Bias can enter at four points, and each needs its own check. Fixing the model alone leaves the prompt and the
  evaluation untouched.
tags: [bias, data, model, prompt, evaluation, fairness]
