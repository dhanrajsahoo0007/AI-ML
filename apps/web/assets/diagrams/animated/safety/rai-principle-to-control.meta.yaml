title: Principle, control, evidence
alt: >-
  A figure in four steps with three rows, one per principle, read left to right. Column one, in grey, holds the
  principle; column two, in lime, the control; column three, in blue, the evidence that the control ran. Row one:
  accountability, a named person owns each decision, becomes an approval queue where refunds over 30 pounds wait for a
  person, which leaves an approval log showing every large refund has an approver. Row two: fairness, the same help
  whatever the name or language, becomes a counterfactual test that swaps one attribute in the same ticket, which
  leaves the gap per group on the golden set before release. Row three: transparency, people know it is an AI, becomes
  a disclosure banner plus an ask-for-a-person button, which leaves a release checklist and a tracked hand-off rate. A
  highlighted lime box at the bottom says a principle without a control is a slogan and a control without evidence is a
  hope.
caption: >-
  Every principle needs two things beside it: a control that someone built, and evidence that the control ran.
tags: [responsible-ai, governance, controls, brightpost]
