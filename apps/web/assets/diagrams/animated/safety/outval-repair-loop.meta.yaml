title: "The repair loop: error back, retry, fallback"
alt: >-
  A figure in four steps. Step 1: a green box, attempt 1, whose amount is the text "42 pounds". Step 2: a lime schema
  check box says the amount must be a number, and a highlighted red box says the error, expected number, got text.
  Step 3: an arrow labelled error added to the prompt leads from the red box to a green box, attempt 2, whose amount
  is the number 42; a second schema check passes, and an orange box says the answer goes on to the policy check. Step
  4: a dashed arrow labelled still invalid after 2 retries leads to a highlighted grey fallback box, a safe template
  that hands off to a person. A note says the cap is 2 retries and that if each attempt takes the full 1,500
  milliseconds, the worst case is 3 times 1,500, which is 4,500 milliseconds, before the fallback.
caption: >-
  The validator's error is the retry prompt. A cap and a fallback keep a stubborn failure from looping.
tags: [guardrails, output-validation, retry, repair, brightpost]
