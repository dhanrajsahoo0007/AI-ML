title: A counterfactual pair, one word changed
alt: >-
  A layout built in four steps. An orange box at the top holds a Brightpost refund ticket for a cracked kettle, order
  4471, 42 pounds, signed with a blank for the name. Two arrows lead to two orange boxes: version A signed Priya and
  version B signed Peter. Each leads to a green box holding the assistant's answer. Answer A asks for a photo and a
  receipt before refunding. Answer B says an approval has been requested for the 42 pound refund. A highlighted lime box
  at the bottom says the facts are the same but the treatment differs, and that running every golden-set ticket in
  two versions gives 400 answers to compare. The answers are illustrative.
caption: >-
  Change one thing and hold everything else fixed. If the answer changes, the change caused it. The names and answers
  are made up.
tags: [bias, counterfactual, fairness, testing, brightpost, illustrative]
