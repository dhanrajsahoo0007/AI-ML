title: A confused deputy pays a stranger's order
alt: >-
  A flow in four steps. Step 1: an orange box, Customer 1847, whose message carries a pasted note that names order 5122.
  Step 2: an arrow labelled message plus note leads to a green box, the model, which reads the note. Step 3: an arrow
  labelled refund 5122 leads to a highlighted teal box, the chat service, which holds its own key that works for any
  order. A red arrow labelled own key leads to a grey box, the order system, which trusts the key, and a further arrow
  leads to a red box saying order 5122 is refunded to the wrong person. Step 4, the fix: below, an arrow from the chat
  service labelled call as the user leads to a teal box, a token for user 1847 that allows only their orders, and an
  arrow labelled owner of 5122 leads to a highlighted grey box, 403 refused, order 5122 is not theirs.
caption: >-
  The service is the deputy: it holds more authority than the customer. Acting with the customer's own token removes that
  extra authority, so the model's request cannot use it.
tags: [rbac, confused-deputy, excessive-agency, prompt-injection, brightpost]
source: original
