title: Two classifiers around one model call
alt: >-
  An architecture diagram in seven steps. An orange Customer box sends a message to a lime Input check box, the
  highlighted dark one. A clear violation goes down along a red arrow labelled block to a red Safe refusal box that
  makes no model call. Everything else goes along an arrow labelled allow to a green Model box that writes a draft. The
  draft goes to a second lime box, the Output check. From there a clean draft goes to an orange Reply sent box, a
  second red arrow sends an unsafe draft to the same refusal box, and a dashed arrow labelled unsure sends a borderline
  draft to a grey Review queue box where a person decides. The queue sends labels to a violet box, Thresholds and
  tests, which tunes both checks.
caption: >-
  Every message is scored twice, once before the model and once after. Clear cases are handled by the classifiers;
  only the unsure ones reach a person, and their labels tune the thresholds.
tags: [moderation, classifier, human-review, thresholds, brightpost]
