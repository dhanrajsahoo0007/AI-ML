title: "The action ladder: cite, flag, abstain, hand off"
alt: >-
  A four-rung ladder, one rung per step, each read left to right: a blue box with what the check says, an arrow, a box
  with the action, and a grey example. Rung 1: every claim supported, faithfulness 1.00, so cite, answering with a
  source link; example, returns within 30 days with the help article. Rung 2: some claims weak and nothing at stake,
  0.80 to 0.99 as an illustrative range, so flag, sending the answer marked unverified and logging it. Rung 3: a low
  score or no passage found, under 0.80 as an illustrative threshold, so abstain, saying it cannot confirm and linking
  the help page. Rung 4: the answer moves money or sets policy, whatever the score, so hand off to a person with the
  ticket and the evidence, shown as a highlighted orange box; example, a 42 pound refund when the limit is 30 pounds.
caption: >-
  The action depends on the score and on what is at stake. Money and policy always go to a person. Thresholds are illustrative.
tags: [hallucination, abstention, human-in-the-loop, escalation, brightpost]
