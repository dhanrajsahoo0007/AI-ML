title: The same classifier, two groups
alt: >-
  Two small tables side by side, built in three steps, each for a made-up group of 1,000 messages of which 100 are toxic
  and 900 are fine, with the classifier's flagged or passed result across the top. Group A, standard English: 80 toxic
  messages flagged and 20 passed, 36 fine messages flagged and 864 passed, giving precision 0.69, recall 0.80 and a
  false-positive rate of 0.04. Group B, a regional dialect: 82 toxic flagged and 18 passed, 90 fine flagged and 810
  passed, giving precision 0.48, recall 0.82 and a false-positive rate of 0.10. The ringed red cells are the fine
  messages wrongly flagged. A highlighted red box underneath says the false-positive gap is 0.10 minus 0.04, which is
  0.06, so fine messages in group B are flagged 2.5 times as often, while recall is nearly equal at 0.80 and 0.82.
caption: >-
  Recall is almost the same for both groups, so one overall number looks fine. The false-positive rate shows group B's
  fine messages being flagged 2.5 times as often. Counts are illustrative.
tags: [bias, fairness, toxicity, false-positive-rate, confusion-grid, illustrative]
