title: "A claim check: each claim against the passages"
alt: >-
  A figure in four steps with three columns. Step 1: five green claim boxes from one Brightpost answer: returns accepted
  within 30 days; return postage is free for faulty items; refunds go to the original card; refunds arrive within 2
  days; cracked kettle, refund 42 pounds, no approval. Step 2: blue boxes show the retrieved passages, which are
  illustrative help-centre sentences: returns accepted within 30 days of delivery; faulty items, return postage is
  free; refunds go to the original payment method; and refunds over 30 pounds need approval. Step 3: a verdict for
  each claim. The first three are lime and say supported, with arrows to their passages. The fourth is red and says
  unsupported, with the note that no passage says so. The fifth is red and says contradicted, with an arrow to the
  passage that refunds over 30 pounds need approval. Step 4: a highlighted lime bar says faithfulness equals supported
  over total, 3 over 5, equals 0.60, and that two claims lack support, so flag or block the answer.
caption: >-
  Three of five claims are supported, so faithfulness is 3 ÷ 5 = 0.60. Passages are illustrative.
tags: [hallucination, faithfulness, claim-check, nli, ragas, brightpost]
