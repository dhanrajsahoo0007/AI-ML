title: The user's identity travels to retrieval and tools
alt: >-
  A sequence diagram with six lanes: customer, chat app, retriever, LLM, tool gateway and orders. Step 1: the
  customer sends a message with a session token; a note says the app checked the token and found user 1847 with the
  customer role; the app searches with the filter customers and the retriever returns the top 5 public chunks. Step
  2: the app sends the model a prompt with only the customer role's tools, and the model returns a refund call for
  order 4471 for 42 pounds. Step 3: the app calls the tool gateway with user 1847; the gateway asks the order system
  who owns order 4471, gets a match, and answers that 42 pounds is over the 30 pound limit so the refund is held for
  approval. Step 4: the model returns a refund call for order 5122; the gateway asks the order system, which says the
  order belongs to someone else, and the gateway answers 403, not this user's order. A note says the model's words cannot
  change who the user is.
caption: >-
  The chat app fixes the identity once and attaches it to retrieval and to every tool call. The model only proposes; the
  gateway decides.
