title: "One audit record: who, what, when, which model and prompt, and the decision"
alt: >-
  A record drawn as six boxes and a strip, in four steps. Step 1: three boxes in a row, an orange box Who (user 1847,
  role customer, chat), a teal box What (create_refund, order 4471, 42 pounds) and a grey box When (16 November 2026,
  10:08:41 UTC, request id req-7f3a). Step 2: a green box Which model, which prompt (assistant-small, prompt version
  support-v14). Step 3: a highlighted lime box Decision (held, over 30 pounds, needs approval). Step 4: a grey box
  Evidence, by reference (passage ids and an input hash, no raw text) and a wide grey strip saying the record links to the
  one before it by a previous hash, so an edit or deletion shows up. A note says ids, timestamp, model name and prompt
  version are illustrative.
caption: >-
  Six facts are enough to replay a decision. The record keeps references and hashes, not the customer's words or card
  number.
tags: [audit-log, compliance, record, brightpost]
source: original
