title: Five places personal data can rest
alt: >-
  A table of five rows built in three steps, each row coloured by what it is. Prompt log, blue: holds the raw question
  and answer, controlled by redacting before the write, kept 30 days as an illustration. Trace store, violet: holds
  spans and tool arguments, controlled by placeholders and role-based access, kept 30 days as an illustration. Semantic
  cache, violet: holds past answers by meaning, controlled by redacting first and keying by tenant, kept 24 hours as an
  illustration. Fine-tuning set, blue: holds 5,000 resolved tickets, controlled by scrubbing before training, kept until
  the model retires. Model provider, grey: holds every prompt sent, controlled by zero-retention terms, kept as the
  contract says. The control column is lime.
caption: >-
  A ticket's words do not vanish after the reply. Each store is a place to redact, limit access and set a retention
  period. Brightpost's periods are illustrative; the provider's come from its terms.
tags: [privacy, pii, retention, logs, cache, fine-tuning, illustrative]
