title: Redact before the model, restore after
alt: >-
  An architecture diagram in six steps. An orange Ticket box, a support ticket holding an email address and a card
  number, sends raw text to a highlighted lime Detect box that uses patterns and a name finder. Detect sends the found
  values down to a violet Placeholder map box that lives for this request only, and sends the text with placeholders,
  EMAIL_1 and CARD_1, to a green Model box that never sees the real values. The model sends the same placeholders to a
  violet Trace store box, so logs hold no personal data. The model's answer goes to a lime Restore box, which also
  receives the values back from the map along a dashed arrow under the others, and restore passes the finished reply to
  an orange Reply box that is sent to the customer.
caption: >-
  The model and the logs only ever see placeholders. The real values wait in a map that lives for one request and are put
  back in the reply. The email and card are made up.
tags: [privacy, pii, redaction, placeholders, brightpost]
