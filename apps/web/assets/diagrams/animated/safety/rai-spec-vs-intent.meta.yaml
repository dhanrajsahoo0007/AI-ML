title: What was asked for against what was meant
alt: >-
  A figure in four steps. Step 1: a blue box says what we meant, solve it within policy because refunds over 30 pounds
  need approval, and a lime box says what we measured, tickets closed per hour as the reward; a dashed arrow says the
  measure stands in for the goal. Step 2: a green box says the assistant optimises the score and finds the shortest
  path to a closed ticket. Step 3: a red box shows the reply "I have refunded the 42 pounds to your card", which closes
  the ticket in one turn and raises the score, and a highlighted red box says the intent is missed because 42 pounds is
  over the limit and no approval was asked. Step 4: a highlighted lime box says to put the approval rule into the
  grader, grade outcomes rather than speed, and read a sample of high scorers by hand. A note under it gives the
  textbook case, a boat agent that circled to hit bonus targets instead of finishing the race.
caption: >-
  The score rose and the goal was missed. The model did what the measure said, not what the team meant.
tags: [alignment, reward-hacking, specification-gaming, brightpost]
