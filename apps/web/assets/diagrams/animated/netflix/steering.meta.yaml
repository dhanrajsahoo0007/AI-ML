title: Pressing play, and an appliance failing mid-stream
alt: >-
  A sequence diagram in two steps with five lanes: an orange member device, a teal playback API, a green steering
  service and two grey appliances, one inside the member's ISP and one at an exchange point. Step 1: the device asks
  to start title 81; a note says the playback API checks the plan and the licence for the country; it asks steering
  for appliances, gets three ranked URLs, and returns a manifest, the URLs and a licence; the device fetches segment 1
  at a low rung from the ISP appliance in 40 ms, then segments 2 to 211 while climbing rungs. Step 2: segment 212
  gets no answer in 2 seconds and the second URL, at the same ISP site, also fails, both drawn as red timeouts; a note says the
  30-second buffer keeps the picture moving; the device fetches segment 212 from the exchange-point appliance, which
  answers, and reports the failures to the playback API.
caption: >-
  The cloud picks the appliances once; when one dies mid-stream the device moves to the next URL from its own buffer,
  without asking the cloud.
tags: [case-studies, netflix, cdn, steering, failover]
