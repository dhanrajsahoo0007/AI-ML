title: A ladder per title
alt: >-
  A layout in three steps with two side-by-side panels, an animated film on the left and an action film on the
  right, each with five rungs from 1080p down to 240p. Step 1: blue bars show one fixed ladder for both films, 5.0
  Mb/s at 1080p down to 0.4 Mb/s at 240p; the animated film scores 97 at 1080p, more than it needs, and the action
  film scores 86, written in red because it looks blocky. Step 2: green bars under each blue one show each film's own
  ladder, sized so 1080p reaches the target score of 93: 2.0 Mb/s for the animated film and 7.0 Mb/s for the action
  film. Step 3: a note says a two-hour view at 1080p takes 4.5 GB on the fixed ladder, 1.8 GB for the animated film
  (60% less) and 6.3 GB for the action film, and that on a 3 Mb/s link the animated film now plays at 1080p instead
  of 480p.
caption: >-
  One ladder for every title wastes bits on simple films and starves complex ones; a ladder per title spends bits
  where the picture needs them.
tags: [case-studies, netflix, encoding, bitrate-ladder, video]
