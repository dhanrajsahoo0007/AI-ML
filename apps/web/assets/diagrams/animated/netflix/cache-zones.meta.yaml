title: A full cache copy per zone, best effort across regions
alt: >-
  A layout in three steps. Region A has three zones side by side; each has teal browse servers reading 3.3 million
  objects a second from their own violet cache copy of 2.5 TB holding every key, and a blue row writer under them
  sets all three copies. Step 2: a red note above zone b's copy says it is lost, and a green arrow shows zone b's servers reading
  zone a's copy instead; a note says the two remaining zones each take 1.65 million more reads a second, so each is
  sized for 5 million, while one sharded copy would have turned 3.3 million reads a second into misses. Step 3: a
  dashed green arrow sends changes to region B's cache copies asynchronously, and a note says there is no guarantee:
  a lost update is fixed by the time-to-live or the next write.
caption: >-
  Three full copies cost three times the memory, and buy local reads and no miss storm when a zone fails; other
  regions converge on a best-effort basis.
