title: Subscription video service high-level architecture
alt: >-
  An architecture diagram in eight steps across six zones: clients, edge and own CDN, playback control plane,
  application services, async pipeline and storage. Step 1: a member's device asks the API gateway to play, the playback
  service checks the account and licence in the metadata database, and the device streams one file from the origin
  store. Step 2: a studio sends a master through the ingest service to an encode pipeline, which writes every rung of
  the title's ladder to the origin store. Step 3: the playback service asks a steering service, drawn solid green, to
  pick appliances; appliances report health and files to it, and the device fetches segments from an appliance inside
  its ISP. Step 4: a popularity forecast gives steering a fill plan; the exchange-point appliance copies new files from
  the origin at night and the ISP appliance copies from it. Step 5: a region DNS sends the device to a healthy one of
  three regions. Step 6: a browse service reads personalised rows and title data from a catalogue cache. Step 7: the
  device has a dashed fallback to the exchange-point appliance, and a failure-injection tool kills service instances.
  Step 8: heartbeats go through a resume service to a wide-column viewing store, whose watch history feeds the
  popularity forecast.
caption: >-
  A subscription video service: a cloud control plane authorises and steers, appliances inside ISPs hold the
  catalogue before anyone asks, and caches keep browsing cheap.
