title: Filling appliances while nobody watches
alt: >-
  A layout in three steps. Step 1: a blue curve shows one ISP site's demand over a day, a shape only, rising to an
  evening peak of 2 Tb/s at 21:00 and falling to a trough of 400 Gb/s at 04:00. Step 2: a green strip on the time axis marks the fill
  window from 02:00 to 06:00, and a note says the night's 5 TB of new and re-placed files take 2.8 Gb/s for four
  hours, 0.7% of the trough, so nothing competes with the evening. Step 3: a row of boxes shows tiered fill: a violet
  origin store fills 50 green exchange-point hubs, which fill 1,000 ISP sites; notes say the origin sends 250 TB a
  night, 139 Gb/s for four hours, instead of 5 PB if every site pulled from it.
caption: >-
  A fixed catalogue and a predictable audience let the night do the work: new files reach every appliance before
  the evening peak, and the origin sends one copy per hub.
tags: [case-studies, netflix, cdn, fill, capacity]
