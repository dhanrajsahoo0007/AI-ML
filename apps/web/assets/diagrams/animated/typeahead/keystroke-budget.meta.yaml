title: Where one keystroke's 100 ms goes
alt: >-
  Three waterfall charts on the same millisecond axis, each with a dashed line at the 100 ms budget. Step 1, a cache
  miss: an orange 30 ms wait for a pause in typing, grey network legs of 10 and 15 ms each way through the edge to the
  region, a highlighted teal 3 ms in the suggest service for the index and the trending layer, a lime 1 ms merge and
  filter, and an orange 8 ms to draw the list: 93 ms in all. Step 2, a hit at the edge: the same wait and the 10 ms
  legs to the edge and back, a green 1 ms cache hit and the draw: 59 ms. Step 3, a hit in the browser: a green 1 ms
  local cache read and the 8 ms draw: 9 ms.
caption: >-
  The server’s own work is 4 ms of 93: the network and the debounce set the latency, so the caches near the user pay
  most.
tags: [case-studies, typeahead, latency, waterfall]
