title: Three prefix structures compared on 10 million queries
alt: >-
  A comparison of three structures in three columns. The green trie with the top five stored at every node, ringed as
  our choice, needs about 1.5 GB and answers a prefix with three steps down and one list read; it matches only the
  start of a query and is rebuilt daily. The violet finite state transducer needs about 0.15 GB, walks three arcs and
  then runs a best-first search for the top five; it is immutable and rebuilt from sorted input. The blue prefix
  inverted index needs about 1.0 GB, reads the list for the prefix and keeps the first five; it matches the start of
  any word. A line underneath says all three fit in one 64 GB server, so lookup cost decides, not memory.
caption: >-
  All three fit in memory; the trie with stored lists wins on lookup cost, the transducer on size, the inverted index
  on matching any word.
