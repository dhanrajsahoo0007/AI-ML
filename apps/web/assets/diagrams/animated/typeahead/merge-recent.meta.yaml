title: Merging the base index and the trending layer
alt: >-
  A sequence diagram with five lanes: an orange browser, a teal suggest service, the violet trie index and trending
  layer, and a green blocklist. Step 1: the browser asks for suggestions for "ele"; the suggest service asks the trie
  index for its top 10 and the trending layer for its list at the same time; the index returns electric car at 300
  searches an hour and the trending layer returns election results at 5,400 an hour; the service checks 11 candidates
  against the blocklist, drops one and returns five with the trending query first. Step 2: for "elec" the trending
  layer does not answer within 10 ms, drawn as a red timeout, and the service returns the top five from the base
  index alone.
caption: >-
  The suggest service asks both layers at once, ranks them on one scale and filters; a slow trending layer is skipped,
  not waited for.
