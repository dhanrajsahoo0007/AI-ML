title: Pins or counts, by zoom level
alt: >-
  Three map panels side by side, one per step. Step 1: at zoom 9, about 5,800 listings match, so the panel is a grid of
  blue cells, each showing a count and shaded darker where the count is higher, up to 1.5 thousand. Step 2: at zoom 11,
  1,800 listings match, still over 500, so the panel again shows counts per cell, up to 420. Step 3: at zoom 14, about
  110 listings match, so the panel shows one blue pin per listing. A line underneath gives the rule: over 500 matches,
  counts per cell at two zoom levels finer, about 250 cells; otherwise one pin per listing.
caption: >-
  Zoomed out, the search returns a count per cell; zoomed in past 500 matches, it returns one pin per listing.
tags: [case-studies, zillow, geo-search, aggregation]
