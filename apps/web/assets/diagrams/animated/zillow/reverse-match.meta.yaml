title: One new listing against ten million saved searches
alt: >-
  A funnel in three steps. A blue box on the left, new listing 912 at 480 thousand dollars with 3 beds in one map
  tile, points to a grey box of 10,000,000 saved searches stored as queries. Step 1: an arrow labelled by tile term
  leads to a violet box of 2,000 candidates tagged with the listing's tile. Step 2: an arrow labelled run filters leads
  to a teal box of 100 matches. Step 3: a note says a search and listing pair already sent is skipped, and the matches
  split into two green boxes: 30 instant pushes within minutes and 70 for the daily digest email.
caption: >-
  A new listing is matched against stored searches, not the other way round: the tile cuts ten million searches to
  two thousand candidates before any filter runs.
tags: [case-studies, zillow, alerts, percolator]
source: original
