title: "One map pan: tiles from the cache, one query for the rest"
alt: >-
  A layout in three steps. Step 1: a grey grid of 6 by 5 map tiles, titled as the viewport at zoom 13 covering 30
  tiles. Step 2: violet dots mark the 20 tiles in the four left columns, which come from the cache in one multi-get.
  Step 3: a dashed teal outline surrounds the 10 new tiles in the two right columns; an arrow leads to a teal box, one
  query for the box of 10 tiles with the filters for sale, under 600 thousand dollars and 3 or more beds, then to a
  violet search index box, then to a green box of 150 listings split by tile and written back for 60 seconds.
caption: >-
  After a pan, the tiles already seen come from the cache; only the new tiles cost one query, with the filters, to the
  search index.
tags: [case-studies, zillow, geo-search, caching]
source: original
