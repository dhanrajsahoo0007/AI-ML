title: TrueTime uncertainty and commit wait
alt: >-
  A time axis from 0 to 20 milliseconds, built in three steps. Step 1: a pink interval 8 milliseconds wide shows that
  when the clock says t, true time is somewhere between t minus 4 and t plus 4. Step 2: the transaction's commit
  timestamp is set at the upper edge, t plus 4. Step 3: a lime bar shows a commit wait of 8 milliseconds, after which
  the earliest possible time has passed the commit timestamp and the locks are released.
caption: >-
  With a clock that is only known to within ±4 ms, a commit stamps the latest possible time and waits until that time is
  certainly past.
tags: [patterns, clocks, truetime, spanner]
