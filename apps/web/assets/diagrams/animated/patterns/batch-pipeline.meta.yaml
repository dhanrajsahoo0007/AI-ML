title: Three round trips, or one
alt: >-
  A sequence diagram with a teal app server and violet Redis. Step 1: the app sends GET price:kettle and waits for
  42.00, then GET stock:kettle and waits for 9,712, then GET rating:kettle and waits for 4.6: a note says three round
  trips. Step 2, pipelined: the three GETs go out back to back as dashed arrows and the three answers come back
  together; a note says one round trip.
caption: >-
  Pipelining sends the next request before the last reply arrives, so three reads cost one round trip.
tags: [patterns, pipelining, redis, latency]
source: original
