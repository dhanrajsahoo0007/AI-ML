title: A 16-bit Bloom filter with three hashes
alt: >-
  A row of 16 bit cells numbered 0 to 15, in front of a product database, shown in five steps. Step 1: every bit is 0
  and grey. Step 2: the blue product kettle is added; its three hashes point to bits 1, 4 and 6, which turn green and
  read 1. Step 3: the blue product toaster is added and sets bits 9, 12 and 14. Step 4: an orange lookup for mug
  checks bits 1, 3 and 6; bit 3 is still 0, so the green verdict says mug was never added and the database read is
  skipped. Step 5: an orange lookup for lamp, never added, checks bits 6, 9 and 12; all three were set by kettle and
  toaster, so the red verdict says the filter answers maybe and the database read finds nothing, a false positive.
caption: >-
  A 0 in any checked bit proves the key was never added; three 1s set by other keys give the one wrong answer, a
  false positive.
