title: Splitting writes from reads
alt: >-
  An architecture diagram built in four steps, laid out as a U. Step 1: an orange shop app sends place order to a teal
  order service, which both writes and reads a violet orders database with normalised tables. Step 2: every committed
  write is published to a neutral order-events topic. Step 3: a green projector, drawn as the solid accent, reads the
  events and upserts rows into a violet my-orders view with one row per order. Step 4: the order service now only
  writes to the orders database, and the app lists its orders through a teal query API that reads the view.
caption: >-
  Commands change the write model; events carry the change; a projector shapes a view for each kind of read.
tags: [patterns, cqrs, event-driven, read-models]
