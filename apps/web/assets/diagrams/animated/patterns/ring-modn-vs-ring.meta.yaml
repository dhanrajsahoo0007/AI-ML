title: hash % N against a hash ring
alt: >-
  A layout in four steps showing twenty keys with hash values 0 to 19, each drawn as a cell labelled with the node
  that owns it. Step 1: with hash mod 4 the keys cycle through nodes A, B, C and D. Step 2: with a fifth node, hash mod
  5 gives 16 of the 20 keys a different owner; those cells are red. Step 3: on a ring with nodes at positions 4, 9, 14
  and 19, keys 0 to 4 belong to A, 5 to 9 to B, 10 to 14 to C and 15 to 19 to D. Step 4: node E joins at position 18
  and takes keys 15 to 18 from D; only those 4 of 20 keys move, drawn in green.
caption: >-
  Modulo hashing reshuffles almost every key when a node joins; on a ring only the new node's slice moves.
tags: [patterns, consistent-hashing, sharding]
