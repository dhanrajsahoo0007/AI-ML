title: Defending one hot key
alt: >-
  An architecture diagram built in four steps. Step 1: 40 teal app servers read the kettle's key 690 times a second,
  all from violet cache node 1. Step 2: a green in-process cache with a 1-second TTL on each server, drawn as the solid
  accent, answers most reads, so at most 40 reads a second reach cache node 1. Step 3: the key is salted into copies
  kettle#1 to kettle#4 on four violet cache nodes, at most 10 reads a second each. Step 4: for the kettle's stock count,
  each server adds orders to a green counter buffer and flushes it once a second, so the violet stock row takes 40
  flushes a second of minus 7.5 instead of 300 single writes.
caption: >-
  Each defence cuts the load on one place: a local cache cuts reads, salting spreads them, a buffer batches writes.
