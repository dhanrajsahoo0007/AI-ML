title: "SWIM: a missed ping, indirect probes, suspect, then dead"
alt: >-
  A sequence diagram with five lanes: nodes A, C and D in teal, node B in red because it has crashed, and the other
  nodes in grey. Step 1: A pings B and gets no ack within 500 milliseconds, drawn as a timeout. Step 2: A sends
  ping-req messages to C and D, each pings B, and both time out; a note says A's 1-second protocol period ends with
  no ack. Step 3: A marks B suspect and the suspicion rides on the pings and acks it sends anyway, reaching C and then
  the other nodes; each node starts a 12-second suspicion timer. Step 4: after 12 seconds with no refutation from B,
  A declares B dead and that news spreads the same way through D to the other nodes.
caption: >-
  A missed ping alone proves little, so SWIM asks two other nodes to try, then suspects B before it declares B dead.
tags: [patterns, gossip, swim, failure-detection, membership]
