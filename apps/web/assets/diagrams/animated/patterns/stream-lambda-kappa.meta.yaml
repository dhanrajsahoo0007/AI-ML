title: Lambda and Kappa for the trending counts
alt: >-
  Two pipelines stacked. The top one, Lambda, sends a violet view log to two teal jobs: a nightly batch job written as
  code A, which fills an exact but day-old batch view, and a live stream job written as code B, which fills a live view;
  a grey query merges both views. Red text under it says the same counting logic is written and kept in step twice. The
  bottom one, Kappa, keeps the view log for 30 days and runs one stream job: v1 fills table v1 for the app, while a
  green v2 job replays the log from offset 0 into table v2; the app switches to v2 once it has caught up and v1's table
  is dropped. Green text says there is one code base and reprocessing is a replay of the log.
caption: >-
  Lambda runs the same logic twice, in batch and in stream; Kappa keeps one stream job and reprocesses by replaying the
  log into a new table.
