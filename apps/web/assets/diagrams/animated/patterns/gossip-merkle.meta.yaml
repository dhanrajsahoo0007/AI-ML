title: Two replicas find the one differing leaf in log n steps
alt: >-
  Two Merkle trees of the same key range, one on node 12 and one on node 87, each with a root, two children, four
  grandchildren and eight pink leaf hashes. Step 1: the roots are compared and differ, shown red. Step 2: of the two
  children, the left pair matches, shown lime, so that half is skipped, and the right pair differs, shown red. Step 3:
  under the differing child the same happens again. Step 4: at the leaves one pair matches and the sixth leaf differs,
  b9 against c5. The note says 7 comparisons find the one differing leaf and only its keys are sent, and that for
  1,000,000 products at depth 20 it takes 1 + 2 × 20 = 41 comparisons instead of 1,000,000 hashes.
caption: >-
  Compare the roots, then only the children that differ: 7 comparisons find the one bad leaf of 8, and 41 would find
  it among 1,000,000 keys.
