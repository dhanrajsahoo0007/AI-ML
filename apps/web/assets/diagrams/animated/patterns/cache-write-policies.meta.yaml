title: Cache-aside, write-through and write-back
alt: >-
  Three green write policies compared on four questions. Cache-aside, highlighted as the default, writes the database
  and deletes the cache key, so the write waits only for the database, the next read misses once and then reads fresh
  data, and a dead cache node loses nothing because reads fall back to the database. Write-through writes the cache and
  the database in one step, so writes wait for both stores, the next read is a fresh hit, unread data is cached too,
  and nothing is lost. Write-back writes only the cache and flushes to the database later, so writes are fastest and
  reads are fresh hits, but when the cache node dies the unflushed writes, up to one flush interval of them, are lost:
  the one cell drawn in red.
caption: >-
  The three policies differ in what a write waits for and in what a dead cache node takes with it.
