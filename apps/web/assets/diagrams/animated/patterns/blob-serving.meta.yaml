title: "Brightpost's media path: upload direct, read through the CDN"
alt: >-
  An architecture diagram built in five steps. Step 1: an orange seller app sends an 800 MB video through the teal
  upload API, which stores the bytes in rows of the violet metadata database. Step 2: the bytes move to a green object
  store, drawn as the solid accent: the app asks the API for URLs, the API writes a pending row, and the app sends the
  parts straight to the store. Step 3: the store emits an object-created event to a teal media worker, which makes
  thumbnails and marks the row ready. Step 4: orange shoppers, 2,300 pages a second, request 11,500 images a second
  from a neutral CDN with 95 % hits, so 575 misses a second reach the store. Step 5: a dashed lifecycle edge moves old
  originals from the store to a green archive class after 180 days.
caption: >-
  The database keeps the facts about each file, the object store keeps the bytes, and the CDN means only 1 image
  request in 20 reaches the store.
tags: [patterns, blob-storage, cdn, object-storage, lifecycle]
