title: Round robin, least connections and two random choices
alt: >-
  Three green balancing algorithms compared on four questions, with least connections highlighted. Round robin sends
  each request to the next server in turn and needs no load data; when one of 40 servers turns slow it still gets 57.5
  requests a second, so 2.5 % of all requests are slow, a cell drawn in red; many balancers using it still spread
  evenly. Least connections picks the server with the fewest open requests and needs the count for every server; the
  slow server's share falls to about 5.9 requests a second; but many balancers can all pick the same emptiest server,
  a herd drawn in red. Two random choices picks the better of two random servers, needs the count for only two, comes
  close to least connections (illustrative), and its randomness breaks the herd.
caption: >-
  Round robin keeps feeding a slow server; least connections starves it; two random choices does almost as well with
  far less information.
