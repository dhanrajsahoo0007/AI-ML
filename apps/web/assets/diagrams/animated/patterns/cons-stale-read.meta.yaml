title: A stale read from a follower, and read-your-writes
alt: >-
  A sequence diagram with four lanes: an orange shopper, a teal app server, and a violet leader and violet follower
  database. Step 1: the shopper saves a new address; the app updates the leader, which answers ok at log position 4471
  and replicates to the follower with a two-second lag. One second later the shopper reloads, the app reads from the
  follower, and the follower, two seconds behind, returns the old address. Step 2: the reload carries a token with log
  position 4471; the app asks the follower whether it has replayed past 4471, the follower says not yet, so the app
  reads from the leader and gets the new address.
caption: >-
  A follower two seconds behind shows a shopper their old address; carrying the write's log position lets the app read
  from the leader until the follower catches up.
tags: [patterns, consistency, read-your-writes, replication]
