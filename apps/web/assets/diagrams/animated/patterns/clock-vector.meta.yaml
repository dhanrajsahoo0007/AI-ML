title: "Version vectors: ordered or concurrent"
alt: >-
  Three pink boxes holding version vectors in the order London, Frankfurt, Dublin. A, written at London, is 1, 0, 0.
  B, written at Frankfurt after it received A, is 1, 1, 0. C, written at Dublin after it received A but not B, is 1, 0,
  1. Arrows say A happened before B and A happened before C. A dashed lime line between B and C says they are
  concurrent and must be merged, because neither vector is greater than or equal to the other in every entry.
caption: >-
  A vector says what each write had seen: B and C each saw A, but not each other, so they are concurrent.
