title: Daily reconciliation against the provider's file
alt: >-
  An architecture diagram built in four steps. Step 1: two violet records of the same day, our ledger with 200,000
  payments and the card provider's daily settlement file. Step 2: a green matcher, drawn as the solid accent, joins them
  by payment id and amount. Step 3: 199,900 matched pairs go to a lime matched box and are closed. Step 4: two red
  kinds of mismatch, 60 payments only in the provider's file, perhaps a lost event, and 40 only in our ledger, perhaps
  settling tomorrow, go by dashed lines to a neutral review queue of 100 items a day.
caption: >-
  Every payment must appear on both sides; the few that do not become a short, daily list for a person to check.
tags: [patterns, ledgers, reconciliation, payments]
