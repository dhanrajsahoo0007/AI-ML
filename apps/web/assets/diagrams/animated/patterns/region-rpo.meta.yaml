title: Replication lag at the cut is the data lost
alt: >-
  A timeline from minus 6 seconds to plus 1 second, in three steps. Step 1: a row of blue cells shows London
  committing orders, 300 a second, each half-second cell holding 150 orders; under it violet cells show Frankfurt has
  applied orders only up to minus 2 seconds, and a grey box marks the last 2 seconds as in flight. Step 2: a red
  dashed line at 0 seconds marks London failing, and a red box under the in-flight span reads 600 orders lost, with
  the note that RPO equals the lag at the cut, 2 seconds times 300 a second. Step 3: a row of green cells for a
  synchronous copy runs right up to the cut, with the note that nothing is in flight, so RPO is 0, but every commit
  waits a cross-region round trip.
caption: >-
  With asynchronous replication, the lag at the moment of failure is the data you lose: 2 s at 300 orders a second
  is 600 orders.
tags: [patterns, multi-region-and-failover, rpo, replication-lag]
