title: An online migration in four phases
alt: >-
  An architecture diagram built in six steps. Step 1: a teal order service reads and writes only a violet old store.
  Step 2: a violet new store with 8 shards appears and new writes also go to it, shown as a dashed dual-write line.
  Step 3: a green backfill job, drawn as the solid accent, scans the old store by id and upserts rows into the new store
  only if they are newer. Step 4: the service reads from both stores and a lime comparer logs mismatches. Step 5:
  reads move to the new store while writes still go to both. Step 6: the service reads and writes only the new store,
  and the old store is kept, linked by a dashed line, for rollback.
caption: >-
  Each phase is small and reversible: write to both, copy history, compare, move reads, then move writes.
tags: [patterns, migrations, dual-write, backfill]
