title: Folding events into state, with a snapshot
alt: >-
  A layout in three steps for order 4471. Step 1: six blue events in an append-only stream, versions 1 to 6:
  OrderPlaced, PaymentTaken, StockReserved, CourierBooked, DamageReported and RefundIssued. Step 2: under each event a
  violet box shows the state after folding it in: placed for 42 pounds, paid 42 pounds, paid and reserved, shipping,
  damage claim, refunded 42 pounds, with arrows carrying the state from one to the next. Step 3: a green snapshot of the
  state at version 4 sits under the fourth event, and a note says a reload loads the snapshot and replays only versions
  5 and 6.
caption: >-
  State is a fold over the events; a snapshot lets a reload skip the events it already summarises.
tags: [patterns, event-sourcing, snapshots]
