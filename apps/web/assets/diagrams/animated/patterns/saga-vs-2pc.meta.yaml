title: Two-phase commit blocks; a saga compensates
alt: >-
  A sequence diagram with a neutral coordinator, a violet payments database and a violet stock database. Step 1: the
  coordinator asks each database to prepare; both vote yes and keep their locks. Step 2: the coordinator dies before
  sending commit, drawn as a red arrow that is never sent, and a note says both databases are in doubt with rows
  locked. Step 3, a saga instead: the coordinator has the payments database charge 42 pounds and commit at once, then
  asks the stock database to reserve the kettle, which fails with out of stock, drawn in red, so the coordinator sends a
  compensating refund of 42 pounds to the payments database.
caption: >-
  Two-phase commit leaves participants locked when the coordinator dies; a saga commits each step and undoes it with a
  compensation.
tags: [patterns, saga, two-phase-commit, transactions]
