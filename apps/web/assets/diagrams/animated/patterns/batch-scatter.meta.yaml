title: Scatter-gather with a deadline
alt: >-
  An architecture diagram built in four steps. Step 1: an orange shopper's search for kettle goes to one violet index.
  Step 2: a green coordinator, drawn as the solid accent, sends the query to 20 violet index shards, shown as shards 1,
  2, 3 and 20. Step 3: each shard returns its top 10 and a green merge step picks the overall top 10 from 200
  candidates. Step 4: a lime 80 millisecond deadline makes the coordinator answer with the 19 shards that replied; shard
  20, slow today, arrives late and is dropped, shown as a dashed arrow.
caption: >-
  A search waits for the slowest of 20 shards, so it sets a deadline and answers with the shards that made it.
tags: [patterns, scatter-gather, tail-latency, search]
