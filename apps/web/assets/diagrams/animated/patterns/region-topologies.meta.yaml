title: Active-passive, home regions and write-anywhere
alt: >-
  A comparison table of three green column headers: active-passive, active-active with home regions (highlighted)
  and active-active where any region writes any row. Rows compare who takes writes (London only; each shopper's home
  region; both regions for any row), the cross-region copy (asynchronous London to Frankfurt; asynchronous both
  ways; asynchronous both ways), two writes to the same cart (cannot clash; cannot clash because a cart has one home;
  last writer wins, shown in red because one write is silently dropped), losing a region (promote Frankfurt and lose
  the writes in flight; rehome that region's shoppers and lose its in-flight writes; the other region carries on and
  the failed region's unsent writes wait or vanish), and what the second region does (idle standby; serves its own
  shoppers; serves anyone).
caption: >-
  Home regions keep two serving regions without write clashes: each cart has exactly one region that may write it.
