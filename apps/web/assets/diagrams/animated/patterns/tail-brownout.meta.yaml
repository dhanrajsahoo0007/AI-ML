title: Switching off optional panels as load rises
alt: >-
  An architecture diagram built in four steps. An orange shopper sends 2,300 product pages a second to a teal page
  service, which calls six teal panel services: four optional ones on top (recommendations with 20 services, recently
  viewed with 7, questions with 8, reviews with 5) and two core ones at the bottom (product details with 4, price and
  stock with 6). Step 1: every panel is called, 50 calls a page. Step 2: load passes 70 %, a green brownout switch,
  the solid accent, appears above the page service and turns recommendations off, drawn as a green dashed line in
  place of the call. Step 3: at 80 % it turns off recently viewed and questions. Step 4: at 90 % it turns off reviews,
  and only the two core panels are still called, 10 calls a page.
caption: >-
  A degradation ladder: as load rises the switch turns off the costliest optional panels first, and price and stock
  always render.
tags: [patterns, tail-latency, brownout, degradation]
