title: A timeout, a retry and two charges
alt: >-
  A sequence diagram with three lanes: the shopper's app in orange, the order service in teal and a neutral payment
  provider. Step 1: the app posts a payment for order 4471, the order service asks the card provider to charge 42 pounds,
  and the app gives up after 2 seconds, drawn as a red timeout arrow, while the card provider's ok arrives at 2.4 seconds.
  Step 2: the app retries, the order service charges 42 pounds again, drawn in red, the card provider says ok, and the app
  gets 200 paid. A note on the card provider says 84 pounds were taken.
caption: >-
  A timeout does not mean the work failed; retrying a non-idempotent call does it twice.
tags: [patterns, idempotency, retries, payments]
