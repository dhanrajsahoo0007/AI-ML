title: Sharding orders, then splitting a shard online
alt: >-
  An architecture diagram built in five steps. Step 1: a teal order service taking 200,000 orders a day writes every
  order to one violet database. Step 2: a green shard router, drawn as the solid accent, hashes the customer id and
  sends hash values 0 to 50 % to shard 1 and 50 to 100 % to shard 2, looking the ranges up in a violet shard map.
  Step 3: a third violet shard is added and the router dual-writes the range that will move to it, shown dashed.
  Step 4: shard 2 backfills its 75 to 100 % history into shard 3. Step 5: after the copies are compared, the router
  sends the 75 to 100 % range to shard 3 for reads and writes.
caption: >-
  Sharding adds a router and a map; splitting a shard later is dual write, backfill, compare, then cut over.
tags: [patterns, sharding, resharding, migrations]
