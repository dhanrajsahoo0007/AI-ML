title: From linearizable to eventual
alt: >-
  Four green consistency models side by side, strongest on the left, compared on four questions; read-your-writes is
  highlighted. Linearizable: a read sees the latest write, nothing stale is allowed, it costs a leader or quorum read,
  and Brightpost uses it for stock at checkout. Causal: causes are seen before their effects, unrelated writes may be
  reordered, it costs tracking dependencies, and it is used for reviews and their replies. Read-your-writes: you see
  your own writes, other people's data may be stale, it costs a session token, and it is used for my address and my
  basket. Eventual: a read sees some past value and may be stale and out of order, the one cell drawn in red, it costs
  almost nothing, and it is used for view counts.
caption: >-
  Each step to the right is cheaper and allows one more surprise; pick the weakest model each feature can live with.
