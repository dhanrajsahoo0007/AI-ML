title: A watermark closing one 5-minute window
alt: >-
  A layout in five steps for the window from 12:00 to 12:05. Step 1: eight blue cells show the event times of views in
  the order they arrive, out of order: 12:04:51, 12:04:48, 12:04:58, 12:04:55, 12:05:12, 12:04:40, 12:07:20 and
  12:04:30. Step 2: a pink row under them shows the watermark after each arrival, the largest event time seen so far
  minus 10 seconds: 12:04:41, 12:04:41, 12:04:48, 12:04:48, 12:05:02, 12:05:02, 12:07:10, 12:07:10. Step 3: after the
  fifth arrival the watermark passes 12:05:00 and a green box shows the window firing with a count of 4. Step 4: the
  sixth arrival, 12:04:40, is late but within the 2 minutes of allowed lateness, so a second green box shows the window
  firing again with a count of 5. Step 5: the seventh arrival moves the watermark past 12:07:00, so a grey box shows the
  window's state deleted, and the eighth arrival, 12:04:30, goes to a red side output and is not counted.
caption: >-
  The window fires when the watermark passes its end; a late event inside the allowed lateness fires it again, and one
  after that goes to a side output.
tags: [patterns, stream-processing, watermarks, allowed-lateness]
