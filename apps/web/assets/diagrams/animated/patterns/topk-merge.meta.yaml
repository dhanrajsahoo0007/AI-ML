title: "Top 10 across shards: partition by key, local top 10, merge"
alt: >-
  An architecture diagram built in four steps. Step 1: orange product views, 2,300 a second at peak, flow into a grey
  event log keyed by product id, which sends about 575 views a second to each of four teal counter shards, each
  holding 250,000 products. Step 2: each shard feeds a green “Top 10” list of its own products. Step 3: the four
  lists flow into a solid green merger, the accent, which turns 40 candidates into one top 10. Step 4: the merger
  writes the list every 10 seconds into a violet top-10 cache that the home page reads.
caption: >-
  Partitioning by product id keeps each product’s whole count on one shard, so merging four local top-10 lists gives
  the exact global top 10.
