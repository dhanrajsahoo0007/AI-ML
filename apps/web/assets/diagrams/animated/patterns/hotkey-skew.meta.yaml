title: One hot key puts one shard over its limit
alt: >-
  Four bars, one per shard of the product store, each against an illustrative limit of 1,000 reads a second. Shard 1
  holds the kettle: an orange part of 690 reads a second for the kettle alone plus a neutral part of 403 for other keys
  takes it to 1,093, and the 93 past the limit is red. Shards 2, 3 and 4 each carry 403 reads a second of other keys
  and have most of their capacity free.
caption: >-
  Hashing spread the keys evenly, but not the traffic: one key puts one shard over its limit while three sit at 40 %.
tags: [patterns, hot-keys, skew, sharding]
