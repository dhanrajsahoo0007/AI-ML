title: A backfill cursor racing live writes
alt: >-
  Two rows of 16 cells, ids 1 to 16: the old store above and the new store below, built in three steps. Step 1: the
  backfill has copied ids 1 to 8 into the new store, shown green, and a dashed cursor arrow points at id 9. Step 2:
  live dual writes, shown blue and labelled version 7, update id 4 behind the cursor and id 12 ahead of it in both
  stores. Step 3: when the backfill reaches id 12 it holds the older version 6, and a lime box says the new store
  already has version 7, so the copy is skipped.
caption: >-
  The backfill and the live writes race; copying "only if newer" makes the order in which they land not matter.
tags: [patterns, migrations, backfill, idempotency]
