title: "Keeping a view fresh: on write, by stream, by timer"
alt: >-
  Three green refresh strategies for a view compared on four questions; the change stream is highlighted. On write:
  the view is updated in the same transaction, so it is never stale, but every write does more work and must reach the
  view, drawn in red, and rebuilding it is a one-off backfill. Change stream: a projector applies changes, staleness is
  about one second (illustrative), the write path pays nothing, and the view is rebuilt by replaying the stream. Timer:
  the view is recomputed every 5 minutes, so it can be up to 5 minutes stale, 150 seconds on average, drawn in red; the
  write path pays nothing and every refresh is a rebuild.
caption: >-
  Freshness moves cost: on write charges every write, a stream costs a second of lag, a timer costs minutes.
tags: [patterns, materialized-views, staleness, comparison]
