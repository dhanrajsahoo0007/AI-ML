title: Bounded queue, rejection, priority and fairness
alt: >-
  An architecture diagram built in four steps. Step 1: orange shoppers send 300 orders a second straight into a neutral
  checkout queue that a teal order service drains at 250 a second, so the queue grows by 50 a second, drawn in red.
  Step 2: a lime admission-control block, the solid accent, caps the queue at 2,500 orders, 10 seconds of work, passes
  250 a second and answers the other 50 a second at once with a red 429 and Retry-After. Step 3: sheddable work, such
  as receipt emails and order history, goes to a separate queue that the order service reads only when idle. Step 4:
  an orange seller bulk import passes through admission control with a quota of 5 percent.
caption: >-
  A bound turns overload into fast answers, priority decides who those answers go to, and a quota stops one tenant
  taking the whole queue.
tags: [patterns, back-pressure, load-shedding, admission-control]
