title: A circuit breaker's three states
alt: >-
  A state diagram built in four steps around Brightpost's call to its card provider. Step 1: a green Closed state;
  calls go to the provider and the breaker records the result of each of the last 100 calls. Step 2: a red arrow
  labelled 50 per cent or more failed leads to a red Open state; no calls are sent, calls fail at once in under a
  millisecond and the fallback runs. Step 3: an arrow labelled after 60 seconds leads to a lime Half-open state, which
  lets 10 trial calls reach the provider while the rest still fail fast. Step 4: a green arrow labelled trials pass
  returns to Closed, and a dashed red arrow labelled trials fail returns to Open for another wait.
caption: >-
  Closed counts failures, open fails fast without touching the provider, and half-open lets a few trial calls decide
  which way to go.
