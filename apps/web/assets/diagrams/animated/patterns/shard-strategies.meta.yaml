title: Range, hash and directory sharding
alt: >-
  Three green sharding strategies compared on five questions, with hash highlighted. Range sharding picks the shard by
  the range a key falls in, so a range scan hits one shard, but with time-ordered keys the newest range runs hot, a
  cell drawn in red; adding a shard means splitting one range, and it needs a range map. Hash sharding picks the shard
  with hash of the key, so a range scan hits every shard through scatter-gather, load is even, a ring moves about one
  Nth of the keys when a shard is added, and there is no extra moving part. Directory sharding uses a lookup table, so
  scans and load depend on how you place keys, any key can move by updating the map, but the directory is on every
  call and when it is down everything is down, a cell drawn in red.
caption: >-
  Range keeps neighbours together, hash spreads them evenly, a directory lets you place anything anywhere at the cost of
  one more critical service.
