title: Gossip doubles the informed nodes every round
alt: >-
  Sixteen teal nodes sit on a ring, numbered 0 to 15, with a round counter on the right. Step 1, round 0: only node 0
  is green, meaning it knows the update. Step 2, round 1: node 0 tells node 8 across the ring, so 2 nodes are green.
  Step 3, round 2: nodes 0 and 8 tell nodes 4 and 12, so 4 are green. Step 4, round 3: each green node tells a
  neighbour, so 8 are green. Step 5, round 4: each tells its other neighbour and all 16 are green. The counter's bars
  read 1, 2, 4, 8 and 16; the note under them says 16 nodes need log2 16 = 4 rounds, and 1,000 nodes need about 10
  rounds, about 10 seconds at one round a second.
caption: >-
  In the best case every node that knows tells one that doesn’t, so the count doubles: 16 nodes in 4 rounds, 1,000 in
  about 10.
