title: A 15 s lease against a clock that runs fast
alt: >-
  A timeline from 0 to 20 seconds of real time, built in two steps, using the Kubernetes client-go default lease
  settings. Top row: a green bar shows the leader acting from its last renewal at 0 seconds until it gives up at 12
  seconds, one 2-second retry period plus its 10-second renew deadline. Second row: a candidate whose clock runs at
  the same rate waits out a 15-second lease in a lime bar, then takes over in a green bar; between 12 and 15 seconds
  nobody leads, a 3-second safety margin. Step 2 adds a third row: a candidate whose clock runs twice as fast sees its
  15 seconds pass in 7.5 seconds of real time and takes over, while the leader still acts until 12 seconds, so a red
  bar marks 4.5 seconds with two leaders.
caption: >-
  A lease is safe only while the gap between “the leader gives up” and “the others take over” is wider than the
  clocks can drift apart.
