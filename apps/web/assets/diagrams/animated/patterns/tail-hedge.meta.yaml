title: A hedged call and a tied call
alt: >-
  A sequence diagram with three lanes: the orange product page and two teal replicas of the price service, A and B,
  built in three steps. Step 1: the page asks replica A for the kettle's price; A stalls in a 400 ms garbage-collection
  pause, and the reply arrives 400 ms later. Step 2: the page asks A again, gets no
  answer by the service's 95th-percentile latency of 20 ms, and sends the same call to B; B answers £42 in 8 ms, and
  the page cancels the call to A. Step 3: the page sends the call to both replicas 1 ms apart, each tagged with the
  other; B starts first and tells A to drop its copy, then answers £42.
caption: >-
  A hedge waits for the p95 before sending a second copy, so it adds about 5 % load; a tied request lets the replicas
  cancel each other.
tags: [patterns, tail-latency, hedged-requests, tied-requests]
