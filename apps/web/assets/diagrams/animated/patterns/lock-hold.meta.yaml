title: A timed hold during the flash sale
alt: >-
  An architecture diagram built in four steps. Step 1: an orange shopper, one of 500,000, adds a kettle to the basket;
  the teal checkout service, drawn as the solid accent, takes one kettle from a violet stock store of 10,000 only if
  stock is above zero, and places a 10-minute hold in a violet holds store using SET NX EX 600. Step 2: checkout charges
  42 pounds through a neutral card provider within the hold. Step 3: checkout confirms by writing order 4471 to a violet
  orders store. Step 4, the other path: the hold expires without payment, and a lime expiry job puts the kettle back,
  stock plus one.
caption: >-
  A hold takes the kettle off sale for 10 minutes; payment confirms it, and expiry puts it back without anyone
  cleaning up.
tags: [patterns, concurrency, reservations, flash-sale]
