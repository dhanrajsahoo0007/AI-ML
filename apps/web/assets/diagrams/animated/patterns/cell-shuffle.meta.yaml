title: Plain sharding against shuffle sharding on 8 workers
alt: >-
  A two-step layout of eight workers, W1 to W8. Step 1, plain sharding: the workers form four shards of two. Shopper
  A's poison request kills W1 and W2, drawn in red, so all of shard 1 is down: one shopper in four, 25 %. Step 2,
  shuffle sharding: every pair of the eight workers is a shard, drawn as the upper triangle of an eight-by-eight grid,
  28 cells in all. Shopper A is on W1 and W4, and only that one cell is red: 1 in 28, 3.6 % of shoppers. Twelve
  neutral cells share one worker with A and retry on their other worker; fifteen green cells share no worker with A.
  The comparison reads 25 % down before and 3.6 % now, seven times fewer shoppers.
caption: >-
  On the same 8 workers, plain sharding loses 1 shopper in 4 to a poison request; shuffle sharding loses 1 in 28.
