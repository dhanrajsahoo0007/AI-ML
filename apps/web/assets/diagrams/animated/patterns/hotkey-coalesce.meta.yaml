title: 500 misses, one query
alt: >-
  A sequence diagram with four lanes: orange requests, a teal app server, a violet shared cache and a violet database.
  Step 1, without coalescing: 500 requests for the kettle reach the app server, 500 cache lookups miss, and 500
  database queries follow, drawn as a red timeout arrow. Step 2, with single flight: the same 500 requests arrive, the
  app server makes one of them the leader and the other 499 wait; one cache lookup misses, one database query returns
  the row, and all 500 requests get the same result.
caption: >-
  Single flight turns a burst of identical misses into one query; the waiters share its answer.
tags: [patterns, hot-keys, request-coalescing, single-flight]
