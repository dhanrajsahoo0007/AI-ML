title: Partitions, a consumer group and offsets
alt: >-
  An architecture diagram built in four steps. Step 1: a teal checkout service sends 300 order events a second, keyed
  by order id, into a violet topic with six partitions, 50 events a second each. Step 2: a consumer group of three
  teal consumers; each owns two partitions and reads 100 events a second. Step 3: each consumer commits the offset it
  has processed to a violet offsets store, per partition. Step 4: consumer 2 stops heartbeating; after a 45-second
  session timeout, shown in red, the group rebalances and partitions 2 and 3 move to consumers 1 and 3, drawn as red
  arrows.
caption: >-
  The key picks the partition, the group gives each partition one owner, and a dead consumer's partitions wait for the
  rebalance.
tags: [patterns, message-queues, kafka, partitions]
