title: Two bursts at a window boundary, three algorithms
alt: >-
  A timeline from 0:58 to 1:02 with a dashed window boundary at 1:00, built in three rows. One key, limited to 100
  requests a minute, sends 100 requests in the second before 1:00 and 100 in the second after it. In every row the
  first 100 are allowed, drawn blue. Row 1, fixed window with one counter per key: the counter resets at 1:00, so the
  second 100 are also allowed, drawn red: 200 in 2 seconds, twice the limit. Row 2, sliding window counter with two
  counters per key: at 1:01 the previous minute's 100 still count for 59/60, an estimate of 98.3, so 1 more request
  is allowed and 99 are rejected, drawn lime. Row 3, token bucket with two numbers per key: the bucket of 100 refills
  1.67 tokens a second, so 1 token is back by 1:01, 1 request is allowed and 99 are rejected.
caption: >-
  A fixed window forgets everything at the boundary and lets twice the limit through; the sliding counter and the
  token bucket still remember the first burst.
tags: [patterns, rate-limiting, token-bucket, sliding-window]
