title: Fifty single writes against batches after a 5 ms linger
alt: >-
  A time axis from 0 to 50 milliseconds with a producer making one write every millisecond. Step 1: each of the 50
  writes is sent as its own blue request, so 50 requests and 50 round trips, with no added wait. Step 2: the writes are
  collected in 5-millisecond windows and each window is sent as one green batch of 5, so 10 requests; each write waits
  up to 5 milliseconds, about 2.5 on average.
caption: >-
  A 5 ms linger cuts 50 requests to 10; the price is up to 5 ms of waiting for each write.
tags: [patterns, batching, latency, throughput]
