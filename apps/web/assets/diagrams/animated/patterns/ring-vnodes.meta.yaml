title: Ring share per node with 1 and with 100 virtual nodes
alt: >-
  Two horizontal bars, each split into four segments whose widths show how much of a hash ring nodes A, B, C and D
  own. With one virtual node each the split is lopsided: A 25.1 %, B 15.2 %, C 54.6 % and D 5.1 %, and C's segment is
  red because it holds more than twice its fair share. With 100 virtual nodes each the four green segments are nearly
  equal: A 27.8 %, B 25.1 %, C 22.4 % and D 24.8 %, against a fair share of 25 % each.
caption: >-
  With one point each, one node can own half the ring; with 100 points each, every node lands within a few points of
  its fair share.
tags: [patterns, consistent-hashing, virtual-nodes]
