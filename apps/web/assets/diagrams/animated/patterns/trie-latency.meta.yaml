title: Where one suggestion’s 150 ms goes
alt: >-
  A waterfall chart on a millisecond axis from 0 to 150, one row per stage of a single suggestion. An orange bar: the
  browser waits 100 ms for a pause in typing (the debounce), and a dashed line marks the request being sent at 100 ms.
  A grey bar: 20 ms across the network to London. A teal bar, highlighted and barely visible: the trie lookup takes
  2 ms. A grey bar: 20 ms back. An orange bar: 8 ms to draw the list. A dashed line at 150 ms marks the list on
  screen.
caption: >-
  The trie lookup is 2 ms of 150: the debounce and the network set the latency, so that is where caching pays.
tags: [patterns, typeahead, latency, debounce]
