title: A radix trie of six search queries
alt: >-
  A tree diagram of a radix trie holding six Brightpost search queries. From the root, one node "k" splits into "e"
  and "itchen scale" (kitchen scale, 1,200 searches). Under "e", node "t" leads to "tle" (kettle, 4,100), which has
  a child "bell" (kettlebell, 1,800), and to "chup" (ketchup, 900); node "y" leads to "board" (keyboard, 2,400) and
  "ring" (keyring, 700). The path a shopper types, root to k to e, is orange, with a note that 5 of the 6 queries sit
  below "ke". Nodes that end a query are violet and hold its count; inner nodes are plain. A line underneath says a
  plain trie would need 36 nodes, one per letter, where this radix trie needs 10.
caption: >-
  Every query that starts “ke” sits under one node, and the radix trie stores 10 nodes where a letter-by-letter trie
  stores 36.
tags: [patterns, trie, radix-trie, typeahead]
