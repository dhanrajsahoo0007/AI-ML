title: A windowed counter for trending products
alt: >-
  An architecture diagram built in six steps. Step 1: teal web servers append 463 product views a second to a violet
  view log keyed by product. Step 2: a green window counter, drawn as the solid accent, reads the log by product id and
  counts 138,900 views per 5-minute window. Step 3: the counts live in a violet state store beside it, one count per
  product. Step 4: every 60 seconds a checkpoint saves the state and the log offsets together into a violet checkpoint
  store. Step 5: when a window closes, the counter upserts the top 20 products into a violet trending list. Step 6: a
  red worker crash restarts the counter, which restores the last checkpoint and rewinds the log to its offsets.
caption: >-
  The counter keeps its counts in local state, and a checkpoint saves that state with the log offsets, so a crash
  rewinds both to the same point.
