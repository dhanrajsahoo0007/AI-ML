title: Auto-increment, UUID, Snowflake and ranges
alt: >-
  Four green id schemes compared on four questions, with Snowflake highlighted. Auto-increment is 64 bits, in time
  order because one writer counts, needs the database for every insert, and breaks when that one writer is full; its
  ids also leak volume, drawn in red. UUID v4 or v7 is 128 bits; v4 has no time order and v7 starts with a 48-bit
  millisecond prefix; it needs no coordination, and v4 breaks as a B-tree key because random values split pages, drawn
  in red. Snowflake is 64 bits, roughly ordered by millisecond and k-sorted across nodes, needs a node id at start-up
  from config or ZooKeeper, and breaks when the clock runs back or two nodes share an id, drawn in red. Ranges are 64
  bits, ordered only within a block, need one call per block of 1,000 ids (illustrative), and leave a gap when a
  server restarts and loses the rest of its block, drawn in red.
caption: >-
  Each scheme pays for uniqueness somewhere: a single writer, 128 random bits, a trusted clock, or gaps.
tags: [patterns, unique-ids, uuid, snowflake, comparison]
