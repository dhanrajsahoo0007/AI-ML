title: One slow call in 100, many calls per page
alt: >-
  A line chart of the share of pages with at least one slow call against the number of calls the page waits for,
  from 0 to 100. The red line, for services that are each slow 1 % of the time, rises steeply and bends: 1 call gives
  1 %, 10 calls give 9.6 %, 50 calls give 39.5 % and 100 calls give 63.4 %, each point marked. A green dashed line, for
  services slow only 0.1 % of the time, stays low and reaches 9.5 % at 100 calls.
caption: >-
  Each service is slow one time in 100, but a page that waits for 50 of them is slow 39.5 % of the time.
tags: [patterns, tail-latency, fan-out, percentiles]
