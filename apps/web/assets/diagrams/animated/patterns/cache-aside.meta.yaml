title: "Cache-aside: check the cache, fall back to the database"
alt: >-
  A sequence diagram with four lanes: an orange shopper, a teal app server, and a violet cache and violet database.
  Step 1, without a cache: the shopper asks for the kettle's product page and the app server reads the product from the
  database, taking 10 ms. Step 2: the app server asks the cache for product:kettle and gets a miss. Step 3: it reads the
  database, writes the row into the cache with a 60-second expiry, shown as an asynchronous arrow and a note that the
  entry expires in 60 seconds, and returns the page. Step 4: the next request finds product:kettle in the cache in 1 ms
  and the database is not touched.
caption: >-
  The first read pays for the miss and fills the cache; every read in the next 60 seconds is a 1 ms hit.
tags: [patterns, caching, cache-aside]
