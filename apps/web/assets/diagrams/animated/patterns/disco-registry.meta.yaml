title: A service registry with leases and watches
alt: >-
  An architecture diagram built in six steps. Step 1: a teal order service calls instance 1 of the product service at
  an address taken from its config. Step 2: three teal product instances register with a green service registry,
  drawn as the solid accent, and keep their entries alive with heartbeats. Step 3: the order service looks up the
  healthy instances in the registry and calls instance 2. Step 4: instance 3 stops sending heartbeats, and a lime
  marker shows its lease expired after 10 seconds, which deletes its entry. Step 5: the registry pushes a watch event,
  instance 3 gone, to the order service. Step 6: the order service keeps the last good list in a violet in-memory cache
  to fall back on if the registry is unreachable.
caption: >-
  Instances prove they are alive by renewing a lease; callers learn about changes from a watch instead of waiting for a
  TTL.
tags: [patterns, service-discovery, coordination, etcd]
