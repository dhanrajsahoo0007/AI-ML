title: Client-side discovery, server-side discovery and DNS
alt: >-
  Three green ways to find an instance compared on five questions, with server-side discovery highlighted. In
  client-side discovery every caller holds the list, there is no extra hop, the caller balances, for example with two
  random choices, callers need a library or a sidecar, and a change reaches them through a watch in about a second. In
  server-side discovery a balancer or proxy holds the list, which adds one hop, the balancer balances, callers need
  only one stable address, and the balancer updates while callers change nothing. With plain DNS, resolvers and caches
  hold the list, there is no extra hop after the lookup, the order of the IP addresses decides the balance, callers need
  nothing extra, and a change reaches them only after the TTL or later, because caches can ignore it: the one cell
  drawn in red.
caption: >-
  The list of instances lives in the caller, in a balancer or in DNS caches, and that decides how fast a dead instance
  disappears.
tags: [patterns, service-discovery, load-balancing, dns, comparison]
