title: 300 orders a second into a service that finishes 250
alt: >-
  A line chart of orders waiting against minutes after 12:00, from 0 to 10 minutes. The red line, an unbounded queue,
  rises by 50 orders a second in a straight line: 3,000 waiting after 1 minute, a 12-second wait, and 30,000 waiting
  after 10 minutes, a 120-second wait. The green line, a queue bounded at 2,500, rises for the first 50 seconds and
  then stays flat at 2,500 while the surplus is rejected.
caption: >-
  When arrivals beat the service rate, an unbounded queue only grows; a bound keeps the wait at 10 seconds and turns
  the surplus into fast rejections.
tags: [patterns, back-pressure, queues, load-shedding]
