title: Walking the subtree against a stored top 3
alt: >-
  The same six-query trie as before, built in four steps, with a panel on the right. Step 1: the shopper types "ke",
  and the orange path root, k, e takes 3 node visits. Step 2: without stored lists, orange numbers 1 to 7 mark the
  nodes below "ke" visited in depth-first order, and an orange box says 7 more visits and a sort of 5 queries. Step 3:
  an arrow from the "ke" node points to a green list stored there: 1. kettle 4,100, 2. keyboard 2,400, 3. kettlebell
  1,800, and a green box says 0 more visits and 1 list read. Step 4: a small green circle on every node shows the length
  of its own list, and the panel says 21 list entries for 6 queries, and that a new count for kettlebell can change 6
  lists, from its node up to the root.
caption: >-
  A list stored at the prefix node turns “walk everything below and sort” into one read, paid for with a list on every
  node.
tags: [patterns, trie, top-k, typeahead]
