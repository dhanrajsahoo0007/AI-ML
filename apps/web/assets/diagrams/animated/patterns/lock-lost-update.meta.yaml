title: Two buyers, one kettle
alt: >-
  A sequence diagram with two teal checkout requests, A and B, either side of a violet stock table. Both read the
  kettle's stock and both get 1. A writes stock equals 0, then B writes stock equals 0 as well, drawn as a red arrow
  because it silently overwrites A's write. Both are told their order is confirmed, and a note says two orders were
  confirmed for one kettle.
caption: >-
  Read, decide, write: two requests that read the same 1 both sell the last kettle.
tags: [patterns, concurrency, lost-update, locking]
