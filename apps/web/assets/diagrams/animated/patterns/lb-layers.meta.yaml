title: Load balancing, one layer at a time
alt: >-
  An architecture diagram built in five steps. Step 1: orange shoppers at 2,300 reads per second send every request to
  a single teal app server. Step 2: a green L7 balancer, drawn as the solid accent, takes each HTTP request and sends it
  to one of 40 teal app servers, shown as servers 1, 2 and 40. Step 3: a lime health-check service probes the servers
  and tells the balancer which ones are in or out of rotation. Step 4: a neutral L4 balancer in front spreads TCP
  connections over the L7 balancers. Step 5: a neutral global DNS service answers the shoppers' lookups with the
  London region first and fails over to a neutral Frankfurt failover region.
caption: >-
  Each layer spreads a different unit: DNS spreads shoppers over regions, L4 spreads connections, L7 spreads requests.
tags: [patterns, load-balancing, health-checks, architecture]
