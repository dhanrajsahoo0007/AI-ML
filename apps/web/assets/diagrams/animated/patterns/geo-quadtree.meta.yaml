title: A quadtree splits only where pick-up points are dense
alt: >-
  A 40 km square of London with 200 blue dots for Brightpost's pick-up points, crowded in the centre and sparse at
  the edges. Step 1: all 200 points sit in one cell, and the rule is to split any cell holding more than 10. Step 2:
  green lines split the square into four 20 km cells, all of which still hold more than 10. Step 3: green lines keep
  splitting only the busy cells, giving 40 leaf cells from 10 km in the suburbs down to 2.5 km in the centre, none
  holding more than 10 points. A note compares this with a fixed grid of 2.5 km cells, which would need 256 cells.
caption: >-
  Cells split only where points crowd: 40 leaves, from 10 km in the suburbs to 2.5 km in the centre.
