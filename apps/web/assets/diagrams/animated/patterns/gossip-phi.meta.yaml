title: "Phi rises with silence; jitter slows it down"
alt: >-
  A chart of the phi suspicion level against seconds since the last heartbeat, from 0 to 5 seconds, with one heartbeat
  expected every second. A dashed lime line at phi 8 is the threshold for declaring a node dead. The green curve, a
  steady network whose heartbeats vary by 0.2 seconds, rises steeply and crosses 8 after 2.1 seconds. The blue curve,
  a jittery network whose heartbeats vary by 0.5 seconds, rises slowly and crosses 8 after 3.8 seconds. A dashed red
  vertical line marks a fixed 2-second timeout: on the jittery network one heartbeat in 44 arrives that late, while
  phi there is only 1.6.
caption: >-
  Phi turns silence into a probability: the same threshold of 8 waits 2.1 s on a steady network and 3.8 s on a
  jittery one, where a fixed 2 s timeout would flap.
tags: [patterns, gossip, phi-accrual, failure-detection, cassandra]
