title: The control plane is down; the data plane keeps serving
alt: >-
  A two-step layout in two bands. The upper, neutral band is the control plane: provision cells, move shoppers and
  write the cell map, which pushes map changes down a dashed arrow to the router. The lower band is the data plane:
  orange shoppers at 2,300 reads a second go to a green cell router holding its own copy of the map, which routes to
  teal cells 1 to 10, each with its own data and capacity. Step 2: a red box marks the control plane as down, so no new
  cells and no moves, and a green line says the router keeps routing from its last map, so 2,300 reads a second and
  300 orders a second carry on.
caption: >-
  When the control plane fails, nothing changes, but nothing stops: the router serves from its last copy of the map.
