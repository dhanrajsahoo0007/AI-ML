title: An 800 ms deadline passed down the chain
alt: >-
  A waterfall chart on a millisecond axis from 0 to 800, with a dashed line at the 800 ms deadline. Each row is one hop
  of a product page request, and its bar runs from when the call reaches that hop to the deadline. Step 1: the grey
  gateway gets 800 ms and spends 20; the teal page service gets 780 ms and spends 60; teal recommendations gets 720 ms
  and spends 200; the violet feature store gets 520 ms, which fits its 150 ms p99. Step 2: a red row for a retry of the
  feature store at 690 ms would get only 110 ms, less than its 150 ms p99, so the retry is skipped.
caption: >-
  Every hop gets the time that is left, not a fresh timeout, and a call that cannot finish in that time is not made.
tags: [patterns, tail-latency, deadlines, grpc]
