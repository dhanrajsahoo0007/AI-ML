title: A paused lock holder and a fencing token
alt: >-
  A sequence diagram with teal client 1, a green lock service, teal client 2 and violet storage. Step 1: client 1
  acquires the lock and gets a lease with token 33. Step 2: a note says client 1 pauses for 30 seconds in garbage
  collection and its lease expires; client 2 acquires the lock with token 34, writes to storage with token 34 and gets
  ok. Step 3: client 1 wakes and writes with token 33, drawn as a red arrow, and storage rejects it because 33 is lower
  than 34.
caption: >-
  A lease can expire while its holder is paused; a fencing token lets the storage refuse the stale holder's write.
tags: [patterns, concurrency, distributed-locks, fencing]
