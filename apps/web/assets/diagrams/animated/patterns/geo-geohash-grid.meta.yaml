title: Geohash cells, the nine-cell search and the meridian edge case
alt: >-
  A grid of 32 pink geohash cells, 8 columns by 4 rows, each labelled with its five-character geohash and each
  3.0 km wide by 4.9 km tall in north-west London. Step 1: all 32 cells start with gcpv, because one more character
  adds 5 bits and splits the parent cell into 32. Step 2: an orange dot marks a shopper in cell gcpvm, and gcpvm and
  its 8 neighbours turn green: a nearby search reads these 9 cells, which finds every point within 3.0 km. Step 3: to
  the east of a dashed line for the Greenwich meridian sits a column of cells starting u10j. Two pick-up points 140 m
  apart sit either side of the line, one in gcpvp and one in u10j0, which is outlined in red: the two geohashes share
  no prefix, so a prefix search on gcpv misses the closer cell.
caption: >-
  Nearby cells usually share a prefix, but not always: 140 m apart across the meridian, gcpvp and u10j0 share none.
