title: Two leaders from a heartbeat, one leader from a majority
alt: >-
  A sequence diagram in two steps with five lanes: orange shoppers 1 and 2 at the edges, teal nodes A and B, and a
  green voter C between them. Step 1: node A sends node B a heartbeat, then the link between them is cut, drawn as a
  red timeout. After 3 seconds of silence node B promotes itself to leader, while A still believes it leads. Shopper 1
  buys the last kettle from A and shopper 2 buys the last kettle from B; both are told the stock is now 0, so one
  kettle is sold twice. Step 2: with three voters, A tries to store shopper 1's sale on voter C, but it is cut off
  (a red timeout), so with 1 vote of 3 it refuses the sale. B asks C for a vote in term 5, gets it, and with 2 of 3
  sells the last kettle to shopper 2 exactly once.
caption: >-
  Failover on a missed heartbeat alone can leave two leaders; requiring a majority of three means the cut-off node
  cannot act and the last kettle sells once.
tags: [patterns, leader-election, split-brain, quorum]
