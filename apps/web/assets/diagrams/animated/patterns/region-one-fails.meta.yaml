title: One region, one outage, everything down
alt: >-
  An architecture diagram in two steps. Step 1: orange shoppers send orders to a grey load balancer inside a London
  region box, which passes them to 40 teal app servers spread over zones A and B; the servers write to a violet
  orders database in zone A, which keeps a synchronous standby copy in zone B. Step 2: a red region outage node
  appears under the app servers with red dashed arrows to the app servers and to the standby, and the shoppers'
  arrow turns red and dashed, labelled 300 orders a second fail: the standby in the second zone goes down with the
  region.
caption: >-
  A standby in a second zone survives a lost building, not a lost region: when London goes down, every order fails.
tags: [patterns, multi-region-and-failover, region-outage, availability-zone]
