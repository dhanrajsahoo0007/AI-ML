title: A Count-Min sketch with a min-heap of the top k
alt: >-
  A layout diagram built in three steps. Step 1: a blue event box “view: kettle” points at a violet grid of 5 rows and
  10 columns of counters (2,000 columns in the worked example). One hash per row picks a column for the kettle:
  columns 3, 7, 1, 8 and 5, and those five cells, drawn green, read 412, 403, 431, 407 and 418; each view adds 1 to
  all five. The other cells hold counts of other products. Step 2: the kettle's five counters are copied into a
  column on the right, and the smallest, 403, is green and leads to a green box “estimate = 403”, noting the true
  count is 400, so the estimate is 3 too high and never too low. Step 3: a min-heap of the top k, with k = 3 drawn,
  has the mug at 380 at the root and the lamp at 466 and the toaster at 512 below it. A dashed arrow runs from the
  estimate to the root, and a note says 403 is larger than 380, so the kettle replaces the mug at the root and sifts
  down; an estimate below the root changes nothing.
caption: >-
  Every view adds 1 to one counter per row; the smallest of a product’s counters is its estimate, never too low, and a
  min-heap of k keeps the leaders.
