title: False-positive rate of a 1.2 MB filter as products are added
alt: >-
  A line chart of the false-positive rate against millions of products added, from 0 to 2.5 million. The green curve
  is a 1.2 MB filter with 7 hashes sized for 1 million products: it is 1.0 % at 1 million, then climbs steeply, with
  red marks at 5.8 % for 1.5 million and 15.7 % for 2 million, reaching about 29 % at 2.5 million. The blue curve is a
  filter with twice the bits, 2.4 MB, which is still 1.0 % at 2 million products.
caption: >-
  Sized for 1 million products, the filter is right at 1 %; at twice that it answers “maybe” wrongly 16 times as
  often.
tags: [patterns, bloom-filter, false-positives, sizing]
