title: A cached address outlives the instance
alt: >-
  A sequence diagram with four lanes: a teal order service, a neutral DNS server, and a teal old instance and teal new
  instance of the product service. Step 1: the order service resolves product-svc and gets 10.0.1.7 with a 30-second
  TTL, then calls that instance and gets 200. Step 2: a note says the old instance was replaced at 12:00:05; two
  calls to the cached address fail, drawn as red timeout arrows, and a note on the order service says the TTL ends at
  12:00:30. Step 3: the order service resolves again, gets 10.0.2.9 and calls the new instance successfully.
caption: >-
  For up to one TTL after a deploy, callers keep sending requests to an address that no longer answers.
tags: [patterns, service-discovery, dns]
