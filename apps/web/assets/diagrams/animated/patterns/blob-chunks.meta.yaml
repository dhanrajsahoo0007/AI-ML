title: A video cut into chunks, hashed, resumed and deduplicated
alt: >-
  A layout diagram in four steps. Step 1: a blue bar for an 800 MB kettle video sits above a strip of 50 blue cells,
  one per 16 MB chunk. Step 2: arrows lead from the first and last chunks to pink hash boxes h1, h2, h3 and h50, and a
  pink blocklist bar lists h1 to h50 in order as the file's recipe kept in metadata. Step 3: a strip shows chunks 1 to
  30 green (stored), chunk 31 red (lost when the link dropped) and chunks 32 to 50 empty; the note says to resend 31
  to 50, 320 MB instead of 800 MB. Step 4: for the same video on a second listing every one of the 50 cells is green
  because every hash is already known, so 0 MB are sent and only a new blocklist row is written.
caption: >-
  Hash every chunk and the file becomes a list of hashes: a drop resends only the missing chunks, and a copy sends
  nothing at all.
tags: [patterns, blob-storage, chunking, deduplication, content-addressing]
source: original
