title: An orchestrated saga for one order
alt: >-
  An architecture diagram built in five steps. Step 1: a green order saga, a state machine drawn as the solid accent,
  records that the saga for order 4471 has started in a violet saga-state store. Step 2: it asks the teal payment
  service to charge 42 pounds. Step 3: it asks the teal stock service to reserve the kettle. Step 4: it asks the teal
  shipping service to book a courier, which ends the happy path. Step 5, the failure path: the stock service is out of
  stock, so the saga sends a compensating refund of 42 pounds to the payment service, drawn as a dashed arrow labelled
  stock failed.
caption: >-
  The orchestrator runs each local step in order, records where it is, and on a failure runs the compensations in
  reverse.
tags: [patterns, saga, orchestration, workflows]
