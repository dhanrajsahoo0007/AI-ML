title: A queue shares the work; a topic copies every event
alt: >-
  Two panels side by side. On the left, a teal checkout producer sends three email jobs into a violet queue, and each
  job goes to exactly one of three teal workers: worker 1 gets job 1, worker 2 gets job 2, worker 3 gets job 3. On the
  right, the same producer sends three order-placed events into a violet topic, and each of three teal subscriber
  groups, payments, email and analytics, gets all three events.
caption: >-
  A queue hands each message to one worker, so workers share the load; a topic gives every subscriber group its own
  copy.
tags: [patterns, message-queues, pub-sub]
