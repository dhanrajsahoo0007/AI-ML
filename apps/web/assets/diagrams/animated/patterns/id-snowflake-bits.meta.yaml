title: "A 64-bit Snowflake id: 41 bits of time, 10 of node id, 12 of sequence"
alt: >-
  A 64-bit id drawn as one bar, built in four steps. Step 1: a grey sign bit of 0 at bit 63, then a pink 41-bit
  timestamp in bits 62 to 22, fed by the server clock as milliseconds since 1 January 2026; 2 to the 41 milliseconds
  is about 69.7 years, so ids last from 2026 to 2095. Step 2: a teal 10-bit node id in bits 21 to 12, claimed once at
  start-up; 2 to the 10 is 1,024 nodes. Step 3: a green, highlighted 12-bit sequence in bits 11 to 0, fed by a counter
  that goes back to 0 each millisecond; 2 to the 12 is 4,096 ids per millisecond per node. Step 4: one Brightpost order
  id taken apart in blue: 28,555,200,000 milliseconds after the epoch (27 November at 12:00 UTC, illustrative), node
  17, sequence 3; shifted and joined they make the id 119,769,189,580,869,635.
caption: >-
  Time in the high bits makes ids sort by when they were made; the node id and the sequence keep two ids from the same
  millisecond apart.
