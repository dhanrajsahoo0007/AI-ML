title: Retries bunched without jitter, spread with it
alt: >-
  A time axis from 0 to 800 milliseconds, split into 25-millisecond slots. Ten checkout servers see the card provider
  fail at 0 milliseconds and each retries three times with a 100-millisecond base delay that doubles. Step 1, no
  jitter: three tall red stacks of 10 retries each at 100, 300 and 700 milliseconds, each far above a dashed lime line
  showing that the provider takes 6 calls a slot. Step 2, full jitter: the same 30 retries drawn as low green stacks
  spread across the axis, none of them above the lime line.
caption: >-
  Without jitter every client retries in the same instant; full jitter spreads the same retries so no slot exceeds
  what the provider can take.
tags: [patterns, retries, backoff, jitter]
