title: Push, pull and hybrid for a seller and a huge account
alt: >-
  A comparison table of three green options: push on write, pull on read, and the hybrid, which is ringed. Rows: a
  seller post with 300 followers costs 300 appends under push and the hybrid, and 1 write under pull. A post by the
  Deals account with 2,000,000 followers costs 2,000,000 appends and 16 MB of ids under push, in red, against 1 write
  under pull and the hybrid. Under push that post lands after 20 seconds at 100,000 appends a second, in red; under
  the others at once. Opening the feed costs 1 list read under push, 50 reads plus a merge on every open under pull, in
  red, and 1 list read plus one read to merge the Deals posts under the hybrid.
caption: >-
  Push breaks on the one huge account and pull breaks on every feed open; the hybrid pays each cost only where it is
  small.
