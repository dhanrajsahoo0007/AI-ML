title: Tumbling, sliding and session windows over one timeline
alt: >-
  A timeline of 10 minutes of event time with eight blue dots, one per click from one shopper, at 0.4, 0.9, 1.5,
  3.6, 4.4, 5.3, 8.0 and 8.4 minutes. Below it the same clicks are cut three ways by green window boxes. Tumbling
  windows of 5 minutes: two boxes side by side, holding 5 clicks and 3 clicks, so every click is in exactly one window.
  Sliding windows of 5 minutes starting every minute: three overlapping boxes drawn, from 0, 1 and 2 minutes, holding
  5, 4 and 3 clicks, so one click is counted in several windows. Session windows with a 1.5-minute gap: three boxes of
  different lengths, holding 3, 3 and 2 clicks, each ending 1.5 minutes after its last click.
caption: >-
  The same eight clicks give different answers: tumbling windows count each click once, sliding windows count it up to
  five times, and sessions follow the shopper’s pauses.
tags: [patterns, stream-processing, windows, event-time]
