title: Three retrying layers turn one payment into 27 calls
alt: >-
  Four boxes in a row: a teal gateway, a teal checkout service and a teal payments service, each labelled 3 tries, and
  a red card provider labelled failing. Step 1: every layer tries three times, so blue squares under each box show the
  calls it receives: 1 request at the gateway, 3 calls at checkout, 9 at payments and 27 at the provider, 3 × 3 × 3.
  Step 2: only payments, the layer right above the provider, retries, so a green row shows 1, 1, 1 and 3 calls: the
  provider sees 3 calls instead of 27.
caption: >-
  Three tries at each of three layers multiply to 27 calls on the provider; retrying at one layer sends it 3.
tags: [patterns, retries, retry-storm, reliability]
