title: Fan-out on write, and on read for a large account
alt: >-
  An architecture diagram built in four steps. Step 1: an orange seller with 300 followers posts to a teal post
  service, which stores the full post once in a violet posts database. Step 2: the post id goes onto a neutral fan-out
  queue; green fan-out workers append it to 300 follower feed lists in a violet feed cache. Step 3: an orange shopper
  opens the feed; the teal feed service reads one list of ids from the feed cache and fetches the posts by id. Step 4:
  the orange Deals account with 2,000,000 followers posts without fan-out; its posts go to a violet recent-posts store,
  which the feed service merges in at read time.
caption: >-
  Ordinary sellers are pushed into each follower's list at write time; the one huge account is pulled and merged when
  a shopper reads.
tags: [patterns, fan-out, feeds]
