title: Row lock, version check and atomic update
alt: >-
  Three green ways to stop a lost update, revealed one per step and compared on four questions; the atomic update is
  highlighted. Row lock: the statement is SELECT for update, the second buyer waits for the lock, the lock is held for
  the whole transaction, about 5 milliseconds, and at a flash sale buyers queue on one row at about 200 sales a second,
  a cell drawn in red. Version check: the update has WHERE version equals 7, the second buyer gets 0 rows and must
  re-read and retry, the lock is held for one statement, and at a flash sale most attempts conflict and retries pile up,
  drawn in red. Atomic update: the update has WHERE stock greater than 0, the second buyer gets 0 rows meaning sold
  out, the lock is held for one statement, under a millisecond, and the flash sale runs at about 2,000 sales a second
  with losers failing fast.
caption: >-
  All three stop the double sale; under a flash sale only the atomic conditional update keeps the hot row moving.
