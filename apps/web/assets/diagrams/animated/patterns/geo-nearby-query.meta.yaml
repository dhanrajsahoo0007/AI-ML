title: "Nearest pick-up point: index by cell, read nine cells, check distance"
alt: >-
  An architecture diagram built in five steps. Step 1: an orange shopper asks a teal app server for the nearest
  pick-up point, and the app server reads all 200 rows from the violet pick-up points database and checks 200
  distances. Step 2: each point is written with GEOADD into a solid green geo index, a sorted set ordered by geohash.
  Step 3: the app server sends the shopper's latitude and longitude to a green cell cover, which turns it into cell
  gcpvm plus its 8 neighbours and asks the geo index for those 9 key ranges. Step 4: the geo index returns 17
  candidate points to a teal distance check, which returns the nearest, 1.2 km away, to the app server. Step 5: a
  dashed edge from the distance check back to the cell cover shows the search widening when no point is within 3.0 km.
caption: >-
  The index cuts 200 distance checks to 17; the exact check after it keeps the answer right, and widening covers an empty area.
tags: [patterns, geospatial, redis, architecture]
