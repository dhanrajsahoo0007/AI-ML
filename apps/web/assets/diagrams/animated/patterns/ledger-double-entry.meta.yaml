title: A payment and a refund in double entry
alt: >-
  A ledger table built in four steps for order 4471. Step 1: a violet box shows a balance column alone, balance 0
  pounds, one number with no history. Step 2: the payment as two blue entries: entry 1 debits the provider receivable
  42 pounds and entry 2 credits order 4471 revenue 42 pounds. Step 3: the refund as two more blue entries, nothing
  edited: entry 3 debits order 4471 revenue 42 pounds and entry 4 credits the provider receivable 42 pounds. Step 4: a
  lime totals row shows debits of 84 pounds equal credits of 84 pounds, and a note says each account nets to zero.
caption: >-
  The balance says where things stand; the entries say why, and they must always balance.
tags: [patterns, ledgers, double-entry, payments]
