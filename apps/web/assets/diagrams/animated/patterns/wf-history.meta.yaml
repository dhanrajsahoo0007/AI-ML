title: A workflow's event history, replayed after a crash
alt: >-
  A layout diagram in four steps. Step 1: a row of blue event boxes, the append-only history of the hold workflow for
  order 4471: 1 started, 2 reserve scheduled, 3 reserved, 4 a 10-minute timer, 5 a signal that the shopper paid 42
  pounds, 6 confirm scheduled. Step 2: a dashed red line after event 6 marks where worker 1 dies. Step 3: teal boxes
  for worker 2's code, reserve, timer, await paid and confirm, each point up to the event it matches, so reserve is not
  run again; two green events, 7 confirmed and 8 workflow ends, are written after the replay. Step 4: a red box says
  that code which reads the local clock takes another branch on replay, the commands no longer match the history, and
  the replay stops with a non-determinism error.
caption: >-
  After a crash the workflow code runs again from the top, and the history answers every call it already made.
tags: [patterns, workflows, durable-execution, temporal, event-history]
