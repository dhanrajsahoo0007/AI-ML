title: "Presence: heartbeats in, status changes out"
alt: >-
  A layout in three rows, one per step. Row 1, heartbeats in: a grey box of 500,000 sockets, one heartbeat every 30
  seconds, divides into a blue box of 16,667 heartbeats a second, which only refresh a 60-second TTL in a violet
  presence store and are never pushed to anyone. Row 2, every change to every watcher: a blue box of 1,667 status
  changes a second, from sessions that last 10 minutes on average, multiplied by 50 watchers gives a red box of 83,333
  pushes a second, most of them never looked at. Row 3: a green box keeps only the watchers who have the person on
  screen, 5 of 50, so 1,667 changes a second become a highlighted green box of 8,333 pushes a second, ten times fewer.
caption: >-
  Heartbeats only refresh a TTL; the cost is in pushing each status change to every watcher, and showing it only to
  watchers who have the person on screen cuts it tenfold.
tags: [patterns, realtime, presence, heartbeats, fan-out]
