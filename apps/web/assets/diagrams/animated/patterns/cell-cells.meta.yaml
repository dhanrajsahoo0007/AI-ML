title: Ten cells behind a thin router
alt: >-
  An architecture diagram built in three steps. Step 1: orange shoppers, 2,000,000 a day, reach a green cell router,
  drawn as the solid accent, which maps each shopper id to one of ten teal cells; each cell is a full copy of the stack
  (app servers and database) serving 200,000 shoppers, 10 % each. Step 2: a red Deploy v2 pipeline sends a bad build
  to cell 1 only, the first wave, so one cell in ten notices. Step 3: a neutral control plane provisions a new cell 11
  for new shoppers only and sends a map update to the router.
caption: >-
  Each cell is a full copy of the stack behind a router that only routes; a bad deploy in wave 1 reaches one cell in ten.
tags: [patterns, cell-architecture, blast-radius, deployment]
