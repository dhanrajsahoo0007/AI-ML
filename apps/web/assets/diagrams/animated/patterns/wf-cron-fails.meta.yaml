title: One cron node dies or runs twice
alt: >-
  An architecture diagram built in two steps. Step 1: teal cron node A runs at 12:11 and scans the violet holds table,
  where 500,000 holds are due. A dashed red arrow shows A dying at row 200,000, and nothing resumes the run, so a red
  box reads 300,000 holds stuck with their kettles off sale. Step 2: a second teal cron node B is added with the same
  schedule for high availability. Both nodes add one kettle back to the violet kettle stock for hold 4471; the second
  arrow is red, and a red box reads released twice: one kettle sold twice.
caption: >-
  One cron node is a single point of failure, and a second copy on the same schedule turns a missed run into a double
  release.
tags: [patterns, workflows, scheduling, cron]
