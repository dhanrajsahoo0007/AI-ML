title: Last-write-wins with a slow clock
alt: >-
  A sequence diagram with four lanes: an orange phone, a teal London server, a teal Frankfurt server and an orange
  laptop. Step 1: the phone adds a kettle to the cart through London, which stamps the write 12:00:00.000; 100
  milliseconds later the laptop removes the kettle through Frankfurt, whose clock is 200 milliseconds slow, so it
  stamps 11:59:59.900. Step 2: the servers replicate; London sends the add stamped 12:00:00.000 and Frankfurt sends the
  remove stamped 11:59:59.900, drawn in red, and a note says last-write-wins keeps the add, so the kettle is back in the
  cart.
caption: >-
  The removal happened 100 ms later, but its server's clock was 200 ms slow, so last-write-wins throws it away.
tags: [patterns, clocks, last-write-wins, replication]
