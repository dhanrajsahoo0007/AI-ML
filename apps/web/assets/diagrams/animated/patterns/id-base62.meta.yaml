title: "Base62: a counter to a short code, and what each length holds"
alt: >-
  Two panels. On the left, the blue product number 1,000,000 is divided by 62 again and again: 1,000,000 is 16,129
  times 62 plus 2; 16,129 is 260 times 62 plus 9; 260 is 4 times 62 plus 12; 4 is 0 times 62 plus 4. Each remainder
  becomes a pink character, 12 becoming c, and read upwards they spell the code 4c92, using the alphabet 0 to 9, then a
  to z for 10 to 35, then A to Z. On the right, one row of pink character cells per code length: 4 characters hold 62
  to the 4, about 14.8 million codes, enough for all 1,000,000 products; 6 characters hold about 56.8 billion, 778 years
  of orders at 200,000 a day; 7 characters, highlighted in green, hold about 3.5 trillion, 48,000 years of orders; 11
  characters hold any 64-bit id, so a Snowflake id needs up to 11.
caption: >-
  Seven base62 characters hold about 3.5 trillion codes; a 64-bit Snowflake id needs up to eleven.
