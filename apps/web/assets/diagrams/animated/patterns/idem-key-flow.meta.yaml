title: An idempotency key, from first request to replay
alt: >-
  A sequence diagram with four lanes: the shopper's app in orange, the order service in teal, a violet key store and a
  neutral payment provider. Step 1: the app posts a payment with key k-4471 and the order service inserts the key into
  the key store as in progress; it is new. Step 2: the service charges 42 pounds once, saves the 200 status and body
  against the key and returns 200 paid. Step 3: a retry with the same key finds it done in the key store and gets the
  saved 200 body without a second charge. Step 4: a duplicate that arrives while the first is still running finds the
  key in progress and gets 409, retry later.
caption: >-
  Reserve the key first, save the response with it, and every repeat gets the first answer instead of a second charge.
tags: [patterns, idempotency, payments, api-design]
