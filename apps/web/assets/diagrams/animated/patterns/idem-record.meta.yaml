title: The life of an idempotency record
alt: >-
  Four states of an idempotency record in a row, joined by arrows. Absent, neutral: no record, and a repeat runs as a
  new request. Inserting the key moves it to in progress, lime: the handler is running, and a repeat gets 409, retry
  later. Saving the response moves it to done, green: the status and body are saved, and a repeat gets the saved
  response. When the TTL ends after 24 hours it becomes expired, neutral, and a repeat runs as new. A dashed arrow goes
  back from in progress to absent: if the handler failed before any side effect, the key is deleted.
caption: >-
  A repeat is answered by the record's state: wait while it runs, replay when it is done, start fresh once it expires.
tags: [patterns, idempotency, state-machine]
