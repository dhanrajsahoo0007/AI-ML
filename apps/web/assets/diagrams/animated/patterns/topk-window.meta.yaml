title: The last hour as the sum of 60 per-minute sketches
alt: >-
  A layout diagram. Along the top, a timeline from 12:00 to 13:00 holds one thin green cell per minute, one Count-Min
  sketch each; the grey 12:00 cell on the left drops out and the 13:00 cell on the right is the newest. A green
  bracket under the 60 green cells reads “the last hour: 60 sketches of 5 × 2,000”. An arrow leads to the query, three
  green boxes in a row: sum 60 sketches cell by cell, with the same w and d; estimate the candidates, each minute's
  top 100; and the top 10 of the hour in a min-heap with k = 10. At the bottom, memory for the hour: a green box says
  60 sketches × 40 kB = 2.4 MB, made of 5 × 2,000 counters of 4 bytes each, and a violet box says 60 exact maps ×
  12 MB = 720 MB, for 1,000,000 products at 12 bytes each before overhead.
caption: >-
  A sliding hour is 60 one-minute sketches added cell by cell: 2.4 MB of counters where exact per-minute maps would
  take 720 MB.
