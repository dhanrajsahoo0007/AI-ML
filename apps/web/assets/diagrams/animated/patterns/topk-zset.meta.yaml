title: A sorted-set leaderboard and the cost of each command
alt: >-
  A layout diagram in two parts. On the left, a violet table shows the sorted set “views” with the highest score first:
  rank 0 kettle 41,200, rank 1 toaster 18,750, rank 2 mug 12,400, rank 3 lamp 9,980 and rank 4 blender 8,310, then
  999,995 more members. A note says that inside it is a skip list kept in score order and a hash table from member to
  score. On the right, four orange command boxes each sit next to their cost: ZINCRBY views 1 kettle costs O(log N),
  one view in about 20 steps; ZRANGE views 0 9 REV costs O(log N + 10) and returns the top 10 already sorted; ZREVRANK
  views kettle costs O(log N) and returns rank 0; ZSCORE views kettle costs O(1), a hash-table lookup. A footer says
  log₂ of 1,000,000 is about 20 steps and a billion members would need 30.
caption: >-
  A sorted set keeps every product in score order, so an update and a top-10 read both cost about log₂ N: 20 steps
  for a million products.
