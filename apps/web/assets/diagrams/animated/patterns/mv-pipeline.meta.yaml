title: A view for the My orders page
alt: >-
  An architecture diagram built in five steps. Step 1: an orange My orders page for customer 1847 joins three teal
  services at read time: 8 queries to the orders service's shards, 20 to items and 20 to shipments. Step 2: each
  service publishes its changes to a neutral change stream. Step 3: a green projector, drawn as the solid accent, folds
  the changes into a violet my_orders view keyed by customer id. Step 4: the page reads the view with one lookup by
  key. Step 5: a violet my_orders v2 view is rebuilt by replaying the stream from the start, and reads swap to it.
caption: >-
  The page stops joining three services on every view and reads one precomputed row set, kept fresh from a stream and
  rebuildable from it.
tags: [patterns, materialized-views, projections, cqrs]
