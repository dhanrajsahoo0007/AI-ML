title: The real-time learning loop
alt: >-
  An architecture diagram of one loop in four steps across three zones: serving (green), client (grey) and learning
  (orange). Step 1: the teal ranker returns a page of 10 to the orange viewer app and logs the features it used to the
  grey event log. Step 2: the viewer watches and swipes; the app sends events in batches to the event collector, which
  appends them to the event log. Step 3: the joiner, the solid green accent node, matches features and actions by
  request id and sends a labelled example to the teal trainer. Step 4: the trainer syncs changed parameters to the
  serving parameter servers every 60 seconds, and the ranker uses the fresh weights on the next request.
caption: >-
  One swipe becomes a labelled example and changes the ranker in about 3 minutes, 7 at worst.
