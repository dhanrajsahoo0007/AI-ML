title: One feed page's latency budget
alt: >-
  A waterfall chart on a millisecond axis from 0 to 250, shown in two steps. Step 1, finding candidates: a grey bar
  for the gateway and auth, 10 ms; a violet bar for the viewer's features and seen filter, 15 ms; a blue bar for
  retrieval from five sources in parallel, 40 ms, set by the slowest source; a green bar for filtering seen and
  blocked videos, 10 ms; 75 ms in all. Step 2, ranking: a violet bar for features of 1,500 videos, 30 ms; a teal light
  ranker, 20 ms; a highlighted teal heavy ranker on 200 videos, 80 ms; a green rerank, 10 ms; a grey hydrate and
  respond, 15 ms. The page is ready at 230 ms, 20 ms under a dashed p99 budget line at 250 ms.
caption: >-
  The heavy ranker takes a third of the budget, so it only ever sees 200 videos; the page is ready at 230 ms of 250.
tags: [case-studies, tiktok, latency, ranking, waterfall]
