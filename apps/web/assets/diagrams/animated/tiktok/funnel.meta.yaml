title: From the corpus to a page of 10
alt: >-
  Six stacked boxes, each narrower than the one above, shown in four steps. Step 1: a grey box of 500,000,000
  eligible videos narrows to a blue box of 2,000 candidates from five retrieval sources in parallel, 40 ms, one kept
  in 250,000. Step 2: a lime box, the seen filter and rules, leaves 1,500 in 10 ms; a teal light ranker of dot
  products keeps 200 in 20 ms. Step 3: a teal heavy ranker makes 4 predictions for each of the 200, 800 in all, in
  80 ms. Step 4: a green box, a rerank by diversity and exploration rules, returns a page of 10 in 10 ms.
caption: >-
  Each stage is more expensive per video and sees fewer videos: 500,000,000 to 2,000 to 200 to a page of 10.
tags: [case-studies, tiktok, recommendation, ranking, layout]
