title: "Prefetch, and a retry that gets the same page"
alt: >-
  A sequence diagram with four lanes, the orange viewer app, the teal feed service, the violet seen filter and the
  grey CDN, in two steps. Step 1: with 3 videos left, the app asks for the page after cursor c7 and sends the ids it
  has shown; the feed service checks 2,000 candidates against the seen filter, drops 500, records the 10 it serves and
  returns page c8; the app fetches the first 1 MB of the next two videos from the CDN, so a swipe plays from the
  buffer. Step 2: the response is lost, shown as a red timeout; the app retries with cursor c7 and gets the same page
  c8, which the feed service kept for 5 minutes.
caption: >-
  The next page is asked for 60 seconds before it is needed, and a retry with the same cursor gets the same 10 videos.
tags: [case-studies, tiktok, prefetch, pagination, sequence]
