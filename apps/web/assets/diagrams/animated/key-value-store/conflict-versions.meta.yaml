title: Two concurrent writes, three resolutions
alt: >-
  A layout in four steps. Step 1: a blue box, a cart holding a book at version A:1, splits into two blue writes: X
  adds a pen through node A, giving version A:2, and Y adds a lamp through node B, giving version A:1, B:1; a note
  says neither saw the other. Step 2: a red box, last write wins, keeps the book and lamp and loses the pen. Step 3:
  a green box, version vectors, keeps both and the application merges them into book, pen and lamp. Step 4: a lime
  box, one leader per key range, rejects Y's conditional write on A:1 and the client retries. A cost line sits under each.
caption: >-
  Two writes that never saw each other: last write wins drops one, version vectors hand both to the application, and
  a leader rejects the second and asks for a retry.
tags: [case-studies, key-value-store, conflicts, version-vectors, last-write-wins]
