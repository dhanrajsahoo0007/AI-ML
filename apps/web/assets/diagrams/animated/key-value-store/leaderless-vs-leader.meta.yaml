title: Leaderless quorums against a leader per range
alt: >-
  Two panels side by side. Step 1, the left panel, leaderless quorums: an orange client writes to three teal replicas
  A, B and C; the text says writes go to all three and finish on any two acks, reads ask any two and compare versions,
  a node that is down causes no pause, and the cost is concurrent writes to resolve. Step 2, the right panel, a leader
  per key range: the client writes to a green leader, which sends log entries to two teal followers; the text says the
  leader orders writes and finishes when two of three persist, strong reads go to the leader while its lease holds,
  and when the leader is down the range takes no writes until a new election, a pause of seconds.
caption: >-
  Both keep three copies and need two to agree; the difference is who orders the writes, and what a failure costs.
tags: [case-studies, key-value-store, replication, consensus, leaderless]
