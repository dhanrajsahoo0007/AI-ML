title: A quorum write with a replica down, then a read that repairs
alt: >-
  A sequence diagram with five lanes: an orange client, a green coordinator and three teal replicas A, B and C. Step
  1: the client puts k equals v2 with W equal to 2; the coordinator sends the write to all three replicas; the write
  to B is a red timeout because B is down; A and C acknowledge, so the client gets OK after two of three acks, and a
  note says a hint for B is kept on the next node. Step 2: B is back but still holds v1; the client reads k with R
  equal to 2; A answers v2 with version A:2 and B answers the stale v1 with version A:1; the coordinator returns v2
  and writes v2 back to B as a read repair.
caption: >-
  W = 2 and R = 2 out of N = 3: the write survives one replica down, and the read set overlaps the write set in A,
  which returns v2 and repairs B.
