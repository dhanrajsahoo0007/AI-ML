title: Replicate first, erasure-code later
alt: >-
  A layout diagram in three steps with three zone groups, A, B and C. Step 1: a new 1 GB bucket of blocks is stored as
  three blue full copies, two in zone A and one in zone B, 3 GB of raw disk. Step 2: once sealed, the bucket is cut
  into six blue data fragments and three green parity fragments of 167 MB each, three per zone, 1.5 GB of raw disk;
  any six of the nine rebuild it. Step 3: zone C, drawn red, goes down with d5, d6 and p3; a green box in zones A and
  B says reads decode d5 and d6 from the six fragments left while storage jobs rebuild the lost three.
caption: >-
  New blocks are copied in full to two zones; sealed buckets are erasure-coded at half the disk, and still readable
  when a whole zone is down.
