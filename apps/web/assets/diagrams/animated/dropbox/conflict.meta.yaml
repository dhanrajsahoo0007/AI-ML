title: "Two devices, one file: a revision check and a conflicted copy"
alt: >-
  A sequence diagram in two steps with four lanes: an orange desktop, an orange laptop, a green metadata service and a
  violet metadata database. Step 1: both devices edited file f42 from revision 7; the desktop commits first and
  becomes revision 8; the laptop's commit with parent 7 is rejected with "409: current is rev 8", so the
  laptop saves its version as a new conflicted-copy file and pulls revision 8. Step 2: the desktop moves f42 to
  /archive, which changes its path but keeps its id; the laptop commits an edit to f42 based on revision 9, and it
  lands at the new path as revision 10.
caption: >-
  A commit names the revision it started from: the second writer gets a conflicted copy instead of overwriting, and
  a stable file id lets an edit follow a move.
tags: [case-studies, dropbox, conflicts, concurrency]
