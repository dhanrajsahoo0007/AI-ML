title: One journal per namespace, one cursor per device
alt: >-
  A layout diagram in three steps. Step 1: a row of blue journal cells numbered 9001 to 9008 for namespace 42, one row
  per commit in commit order; below it, one row per device with green cells for rows it has applied and grey cells
  for rows still to pull, and a cursor box on the right: the desktop at 9008, the laptop at 9005, three behind, and
  the phone at 8740, weeks old. Step 2: the laptop's long poll says changed, it lists the rows after 9005, gets 9006
  to 9008, and a new laptop row shows every cell green with its cursor at 9008. Step 3: a red note says the phone's
  cursor 8740 is older than the oldest kept row 9001, so the server answers reset; the phone lists the namespace's
  current state and then follows the journal from 9008.
caption: >-
  The server keeps one journal per namespace and each device keeps one number: pulling after the cursor is all a
  device needs to catch up.
tags: [case-studies, dropbox, sync, cursor, journal]
