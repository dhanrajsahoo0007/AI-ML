title: Commit the block list, upload only what is missing
alt: >-
  A sequence diagram in two steps with five lanes: an orange desktop client, a green metadata service, a teal block
  service and two violet stores, the object store and the metadata database. Step 1: the desktop commits the block
  list h1, h2, h3 for a 12 MB file based on revision 7 with request key c9; the metadata service asks the block
  service which hashes exist, learns that only h2 does, and replies "need h1, h3"; the desktop uploads those two
  blocks, 8 MB, which are stored by hash; the second commit writes revision 8 and journal row 9006 in one
  transaction. Step 2: the reply is lost, drawn red; the desktop retries with the same key c9, and the metadata
  service returns revision 8 and row 9006 again without writing anything.
caption: >-
  Send the block list first and upload only the blocks the server lacks; a retried commit with the same key returns
  the first result.
