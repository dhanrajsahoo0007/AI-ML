title: Barge-in in the kettle call
alt: >-
  A sequence diagram with five lanes: the caller in orange, the media server in blue, the orchestrator in grey, the
  agent model in green and synthesis in violet, built in six steps. Step 1: the orchestrator sends a sentence that
  passed the gate to synthesis, gets audio and word timings back, and sends audio with playback marks to the media
  server, which plays "I've asked a colleague…" to the caller. Step 2: the caller says "Actually, can I…", the media
  server passes the caller's audio to the orchestrator, and a note says the interruption model checks it is speech,
  not "mm-hmm" or echo. Step 3: the orchestrator cancels the model and synthesis and clears playback; a note says the
  agent's audio stops about 470 milliseconds after the caller starts. Step 4: the media server returns the last
  playback mark, 1,300 milliseconds; notes say the words that ended by then are I've at 350, asked at 750 and a at
  900, while colleague ends at 1,450, so the history keeps "I've asked a…". Step 5: a note says request_refund was
  sent before and the 42 pound refund stays pending approval. Step 6: the orchestrator sends the turn and the
  truncated history to the model, which proposes cancelling and reshipping; the orchestrator asks "Shall I cancel the
  refund and send a new kettle?", the caller says "Yes", and a note says the orchestrator then fires withdraw and
  request_reship.
caption: 'The playback mark and the word timings decide what the caller heard; the history keeps only "I''ve asked a…", and the refund already sent is changed once, after a spoken yes.'
tags: [genai, voice, barge-in, turn-taking, case-study]
