title: Turn detection and the free wait
alt: >-
  A chart of false cut-offs, as a percentage of turns, against the wait after the caller stops speaking, from 0 to
  1,000 milliseconds, built in three steps. Step 1: two detectors measured at 300 and 600 milliseconds, each a pair
  of points joined by a line. The violet audio turn model, LiveKit v1, cuts off 9.9 percent of turns at 300
  milliseconds and 4.5 percent at 600. The blue fused recogniser, Deepgram Flux, cuts off 12.9 percent at 300 and
  9.9 percent at 600. Step 2: a red dashed line marks the target of at most 5 percent of turns; only the audio turn
  model at 600 milliseconds is under it. Step 3: a lime strip across the top from 0 to 900 milliseconds, with a
  dashed line down at 900, says that waits up to 900 milliseconds add no latency, only 50 to 70 percent more model
  calls. A footer says the points are a vendor benchmark from June 2026 and that past 900 milliseconds every
  millisecond of wait is heard.
caption: "The safer 600 ms wait is the only one under 5% cut-offs, and with preemptive generation it costs model calls, not latency, because the reply is not ready until 900 ms anyway."
