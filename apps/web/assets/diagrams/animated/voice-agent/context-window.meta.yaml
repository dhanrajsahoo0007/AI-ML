title: The voice agent's context window
alt: >-
  One bar for 3,600 tokens, split into eight blocks in prompt order and built in two steps. Step 1, bracketed as
  stable per node and cached, 2,000 tokens: grey instructions and voice style 1,000, grey node prompt 400 and teal
  node tools 600. Step 2, bracketed as changing every turn, 1,600 tokens: violet case state 300, orange recent turns
  800, ringed and labelled as heard, blue tool results 300, blue evidence 170 and an orange sliver for the caller's
  turn, 30. Two lines underneath say the call takes 3,600 tokens in and 25 out, that recent turns hold only the words
  the caller heard, and that one mid-size call with the cache costs 0.00365 US dollars, with evidence only on help
  questions.
caption: "Per-node prompts and tools keep the stable prefix at 2,000 cached tokens; the history holds only the words the caller actually heard."
