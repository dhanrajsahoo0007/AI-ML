title: The voice agent's latency budget
alt: >-
  Three timing charts on one millisecond scale, shown one per step, from the end of the caller's speech to audio at
  the caller's ear. Step 1, sequential: a grey 100 millisecond inbound phone leg, a lime 300 millisecond wait for the
  end of the turn with the violet 200 millisecond recognition commit inside it, then a green 400 millisecond wait for
  the model's first token, a green 100 millisecond first clause, violet 200 milliseconds to the first sound of
  synthesis and a grey 100 millisecond outbound leg: heard at 1,200 milliseconds, the p50 target; a dashed line marks
  the concept page's 1,000 milliseconds. Step 2, with preemptive generation: the model starts right after the commit
  while the wait runs in parallel, so the same stages end at 1,100 milliseconds, between the concept page's 1,000 and
  the 1,200 target. Step 3, a tool turn: a short violet filler clip starts when the model's 300 millisecond tool call
  starts and is heard at 850 milliseconds; then a teal 300 millisecond get_tracking call, a second 400 millisecond
  first token, the first clause, synthesis and the outbound leg, so the reply is heard at 2,100 milliseconds. The
  foot shows the three sums.
caption: "Preemptive generation takes the end-of-turn wait off the critical path: 1,100 ms instead of 1,200. A tool turn needs a filler, heard at 850 ms, because the reply takes 2,100."
