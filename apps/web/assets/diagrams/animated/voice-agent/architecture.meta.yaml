title: Voice agent for a call centre architecture
alt: >-
  An architecture built up in eight steps, in six zones. Step 1: the caller's phone reaches a blue SIP trunk on the
  carrier at 8 kHz and a blue media server that handles jitter, echo and playback marks; audio goes to speech
  recognition, whose transcript runs around the right side to the green orchestrator, the accented state machine; the
  orchestrator prompts the agent model, the model's words go to speech synthesis, and synthesis sends audio back
  through the media server and trunk to the caller. Step 2: the media server's audio frames run up to a turn detector
  that commits the end of the turn at about 300 milliseconds, at most 600, and tells the orchestrator. Step 3: an
  interruption handler hears speech while the agent talks and cancels the reply. Step 4: tools behind the shared policy
  service and case store appear; the model's line to them is for reads, writes need a spoken yes first, and the
  orchestrator keeps call state. Step 5:
  the direct line from the model to synthesis goes away; every sentence now passes a sentence gate before synthesis,
  and filler clips play at once while a tool runs. Step 6: the tools can transfer the call to a staff queue, which
  sends the call and a screen-pop of the case to support staff, who handle refunds over 30 pounds. Step 7: the
  orchestrator sends both audio channels to a recorder that delays by 10 seconds, masks digits and stores masked
  recordings. Step 8: the orchestrator writes stage timings to turn traces, and a simulator places simulated and real
  test calls.
caption: "The cascade keeps text at every hop, so a turn detector, a barge-in handler and a sentence gate can sit around one orchestrator, and the policy service is the chat agent's."
