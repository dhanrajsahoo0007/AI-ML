title: The phone path, one way
alt: >-
  Five boxes in a row joined by arrows, with a time range over each arrow. An orange handset sends audio to a grey
  carrier that encodes it as G.711 at 8 kHz, 30 to 80 milliseconds; the carrier passes it to a grey SIP trunk
  carrying SIP and RTP, 10 to 40 milliseconds; the trunk passes it to a blue media server, 10 to 30 milliseconds,
  whose jitter buffer, echo cancellation and playback marks sit underneath; the green agent worker gets 16 kHz PCM
  after another 30 to 50 milliseconds, resampled for recognition and the turn model. A heading says one way takes 80
  to 200 milliseconds, illustrative, and the latency budget uses 100 milliseconds each way. In step 2 a dashed arrow
  labelled SIP REFER goes down from the trunk to an orange staff queue at the contact centre, with a note that the
  call leaves our media server and frees the room and the worker. The foot shows the sums, 80 and 200 milliseconds,
  and says probe calls measure the real offset.
caption: "Two phone legs cost 80–200 ms each way before any model runs; the budget assumes 100 ms each way, and probe calls measure the real figure."
