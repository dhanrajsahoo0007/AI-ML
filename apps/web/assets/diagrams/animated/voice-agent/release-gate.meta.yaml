title: The voice agent's release gate
alt: >-
  A grey release candidate, a new turn model, has an arrow to each of five checks, and each check has an arrow to the
  outcome. Four checks are lime and pass: task success at least 85 percent, 87 percent on 300 simulated calls;
  order-number capture at least 98 percent, 98.6 percent after read-back; p95 per turn type, 1,500, 2,650 and 1,700
  milliseconds on probe calls; and 0 card digits stored, 0 on 100 digit calls. One check is red and fails: false
  cut-offs at most 5 percent, 6.1 percent on 8 kHz calls. The outcome is a red Block box, fix cut-offs. Notes say the
  p95 targets are 1,600, 2,800 and 1,900 milliseconds, that one failing check blocks the release, and that the
  measured values are illustrative.
caption: "A faster or cheaper release still ships only if every gate passes; here a turn model trained on wider-band audio cuts off 6.1% of phone turns and is blocked."
