# Third-party sources used by the site, one entry per pack or source (plan §5.6).
# Validated by src/lib/asset-schema.ts (licensesSchema). An asset whose sidecar says `source: <key>` must
# use a key from this file; `original` means we made it. The /legal/attributions page can be generated
# from this file: `attribution` is the text to show, `trademarks` an extra notice where one applies.
#
# Fields: name, url, license (SPDX id), licenseUrl, copyright, package + version (when it comes from npm),
# usedFor, attributionRequired, attribution, trademarks, changes, licenseFile (full text kept in the repo).

lobehub-icons:
  name: LobeHub Icons
  url: https://github.com/lobehub/lobe-icons
  package: "@lobehub/icons-static-svg"
  version: 1.102.0
  license: MIT
  licenseUrl: https://github.com/lobehub/lobe-icons/blob/master/LICENSE
  copyright: Copyright (c) 2023 LobeHub
  usedFor: [company logos (assets/logos/companies)]
  attributionRequired: true
  attribution: >-
    Company logos from LobeHub Icons, MIT License, Copyright (c) 2023 LobeHub.
    Permission is hereby granted, free of charge, to any person obtaining a copy of this software and
    associated documentation files (the "Software"), to deal in the Software without restriction,
    including without limitation the rights to use, copy, modify, merge, publish, distribute,
    sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is
    furnished to do so, subject to the following conditions: The above copyright notice and this
    permission notice shall be included in all copies or substantial portions of the Software.
    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED.
  trademarks: &logo-trademarks >-
    Company names and logos are trademarks of their respective owners. They are used only to identify
    the companies where questions were publicly reported to be asked, and do not imply any affiliation
    with or endorsement of the site.

simple-icons:
  name: Simple Icons
  url: https://simpleicons.org
  package: simple-icons
  version: 16.36.0
  license: CC0-1.0
  licenseUrl: https://github.com/simple-icons/simple-icons/blob/develop/LICENSE.md
  usedFor: [company logos (assets/logos/companies)]
  attributionRequired: false
  attribution: Company logos from Simple Icons, CC0 1.0.
  trademarks: *logo-trademarks

lucide:
  name: Lucide
  url: https://lucide.dev
  package: lucide-react
  license: ISC
  licenseUrl: https://github.com/lucide-icons/lucide/blob/main/LICENSE
  copyright: Copyright (c) for portions of Lucide are held by Cole Bemis 2013-2022 as part of Feather (MIT). All other copyright (c) for Lucide are held by Lucide Contributors 2022.
  usedFor: [UI icons (src/lib/icons.ts), icons inside animated diagrams]
  attributionRequired: true
  attribution: UI icons by Lucide, ISC License.

mermaid:
  name: Mermaid
  url: https://mermaid.js.org
  package: mermaid
  license: MIT
  licenseUrl: https://github.com/mermaid-js/mermaid/blob/develop/LICENSE
  copyright: Copyright (c) 2014 - 2022 Knut Sveidqvist
  usedFor: [diagrams rendered at build time (mermaid fences and assets/diagrams/mermaid)]
  attributionRequired: false
  attribution: Diagrams rendered with Mermaid (MIT).

excalidraw:
  name: Excalidraw
  url: https://excalidraw.com
  package: "@excalidraw/utils"
  license: MIT
  licenseUrl: https://github.com/excalidraw/excalidraw/blob/master/LICENSE
  copyright: Copyright (c) 2020 Excalidraw
  usedFor: [exporting assets/diagrams/excalidraw to SVG and PNG at build time, Excalifont in exported diagrams]
  attributionRequired: false
  attribution: Some diagrams drawn with Excalidraw (MIT).

excalidraw-libraries:
  name: Excalidraw libraries
  url: https://github.com/excalidraw/excalidraw-libraries
  license: MIT
  licenseUrl: https://github.com/excalidraw/excalidraw-libraries/blob/main/LICENSE
  copyright: Copyright (c) 2020 Excalidraw
  usedFor:
    - "design/excalidraw-libraries: Software Architecture (Youri Tjang), Software Logos (drwnio.polyrand.net),
      Architecture diagram components (Anna Pastushko), Database (Stefan Oehrli), Technology Logos (Matthias Haeussler)"
  attributionRequired: true
  attribution: >-
    Diagram shapes from the Excalidraw libraries by Youri Tjang, drwnio.polyrand.net, Anna Pastushko,
    Stefan Oehrli and Matthias Haeussler, MIT License, Copyright (c) 2020 Excalidraw.
  trademarks: >-
    Product logos drawn in these libraries are trademarks of their owners and are used only to name the
    technology in a diagram.

outcome-school:
  name: AI Engineering Interview Questions Company Wise (Outcome School)
  url: https://github.com/pallavi-shekhar/ai-engineering-interview-questions-company-wise
  version: 8fcbddc4ff69 (2026-10-30)
  license: Apache-2.0
  licenseUrl: https://www.apache.org/licenses/LICENSE-2.0
  licenseFile: content/question-bank/LICENSE-outcome-school.txt
  copyright: Copyright (C) 2026 Outcome School
  usedFor:
    - "interview questions marked `source: outcome-school` in content/question-bank"
    - company interview-loop summaries in content/companies/companies.yaml
  attributionRequired: true
  attribution: >-
    Some interview questions and the company interview-loop summaries are adapted from AI Engineering
    Interview Questions Company Wise by Outcome School, Copyright (C) 2026 Outcome School, licensed under
    the Apache License, Version 2.0.
  changes: >-
    Selected only AI and ML questions; edited some wording for clarity, merged near-duplicates and
    normalised company names; filed every question into our own categories; rewrote the roles and
    interview-loop summaries in our own words; wrote every answer ourselves. "Further reading" links point
    to Outcome School's own articles and videos, which are referenced, not copied.
