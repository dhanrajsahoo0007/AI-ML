# Nav index for this section (plan §5.2): one entry per hub, its categories and cards.
# Read by src/lib/nav-tree.ts for the header and sidebar; checked by scripts/content-check.ts.
# Generated from the hub MDX by scripts/migrate-nav-index.ts; keep it in step with the hub's cards.
hubs:
  - slug: case-studies
    categories:
      - title: Assistants & Agentic Products
        icon: bot
        subtitle: End-to-end conversational, support, coding and voice assistants.
        cards:
          - title: 'Case Study: ChatGPT-Style Chat Service'
            href: /genai-system-design/case-studies/chatgpt-style-chat-service
            icon: message-square
            description: >-
              Design a consumer chat assistant for millions of users: sessions, streaming, history, model routing,
              safety and cost.
            status: outline
          - title: 'Case Study: Enterprise AI Assistant'
            href: /genai-system-design/case-studies/conversational-assistant-design
            icon: bot
            description: An end-to-end copilot with RAG, tools, memory, guardrails and phased rollout.
          - title: 'Case Study: Customer Support Agent'
            href: /genai-system-design/case-studies/customer-support-agent
            icon: users
            description: >-
              Design an agent that resolves support tickets: knowledge retrieval, account tools, escalation to people
              and quality measurement.
            status: outline
          - title: 'Case Study: Code Assistant'
            href: /genai-system-design/case-studies/code-assistant
            icon: code2
            description: >-
              Design a coding assistant: inline completion, chat over a repository, an agent mode, latency targets and
              privacy.
            status: outline
          - title: 'Case Study: Voice Agent for a Call Centre'
            href: /genai-system-design/case-studies/voice-agent-call-centre
            icon: radio
            description: >-
              Design a phone agent that handles calls end to end: telephony, speech pipeline, latency, tools, hand-off
              and compliance.
            status: outline
      - title: Search, RAG & Document Systems
        icon: search
        subtitle: Citation-backed answer engines and large-scale document extraction pipelines.
        cards:
          - title: 'Case Study: AI Answer Engine'
            href: /genai-system-design/case-studies/ai-answer-engine
            icon: search
            description: >-
              Design a search product that answers with citations: search fan-out, retrieval, ranking, synthesis and
              freshness.
            status: outline
          - title: 'Case Study: Document Extraction Pipeline'
            href: /genai-system-design/case-studies/document-extraction-pipeline
            icon: file-text
            description: >-
              Design a pipeline that turns invoices, contracts and forms into structured data, with confidence scores
              and human review.
            status: outline
      - title: Knowledge Graph Case Studies
        icon: network
        subtitle: Domain knowledge graphs combined with LLM reasoning and strict privacy rules.
        cards:
          - title: 'Case Study: Semiconductor Yield Graph'
            href: /genai-system-design/case-studies/kg-semiconductor-case-study
            icon: cpu
            description: A knowledge graph and LLM assistant for root-cause analysis of yield excursions.
          - title: 'Case Study: Healthcare Knowledge Graph'
            href: /genai-system-design/case-studies/kg-healthcare-case-study
            icon: heart
            description: Clinical vocabularies, patient timelines, drug-interaction checks and privacy.
      - title: Platform, Gateway & Safety Systems
        icon: server
        subtitle: Multi-team LLM gateways, governance, moderation cascades and cost controls.
        cards:
          - title: 'Case Study: LLM Platform and Gateway'
            href: /genai-system-design/case-studies/llm-platform-gateway
            icon: server
            description: >-
              Design an internal platform that gives every team model access: gateway, quotas, routing, evals,
              observability and cost control.
            status: outline
          - title: 'Case Study: Content Moderation System'
            href: /genai-system-design/case-studies/content-moderation-system
            icon: shield
            description: >-
              Design moderation for user content at scale: policy, a cascade of classifiers and LLMs, human review and
              appeals.
            status: outline
