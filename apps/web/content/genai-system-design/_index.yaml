# Nav index for this section (plan §5.2): one entry per hub, its categories and cards.
# Read by src/lib/nav-tree.ts for the header and sidebar; checked by scripts/content-check.ts.
# Generated from the hub MDX by scripts/migrate-nav-index.ts; keep it in step with the hub's cards.
hubs:
  - slug: case-studies
    categories:
      - title: Start Here
        icon: compass
        subtitle: The design principles every case study ties back to, and how to run the interview round.
        cards:
          - title: GenAI Design Principles
            href: /genai-system-design/case-studies/design-principles
            icon: compass
            description: >-
              Seventeen rules behind every GenAI system design on this site, each with the page that teaches it and
              the designs that use it.
          - title: GenAI Design Interview Framework
            href: /genai-system-design/case-studies/design-interview-framework
            icon: timer
            description: >-
              How to run a 45-minute GenAI system design round: ten steps in order, the numbers to put on the board,
              the principle each applies and what gets probed.
      - title: Assistants & Agentic Products
        icon: bot
        subtitle: End-to-end conversational, support, coding and voice assistants.
        cards:
          - title: 'Case Study: ChatGPT-Style Chat Service'
            href: /genai-system-design/case-studies/chatgpt-style-chat-service
            icon: message-square
            description: >-
              Design a consumer chat assistant for millions of users: sessions, streaming, history, model routing,
              safety and cost.
            status: outline
          - title: Design an Enterprise AI Assistant
            href: /genai-system-design/case-studies/conversational-assistant-design
            icon: bot
            logo: systems/enterprise-assistant
            description: >-
              A Glean-style assistant for employees: permission-aware retrieval end to end, tools that run as the
              user, confirmed writes and memory people can correct.
          - title: Design a Customer Support Agent
            href: /genai-system-design/case-studies/customer-support-agent
            icon: users
            logo: systems/support-agent
            description: >-
              An agent that resolves support tickets and issues refunds: procedures, grounded answers, a policy service in
              code, hand-off and resolution you can trust.
          - title: Design a Code Assistant
            href: /genai-system-design/case-studies/code-assistant
            icon: code2
            logo: systems/code-assistant
            description: >-
              A coding assistant: sub-300 ms inline completion, chat over a repository, and an agent that edits and
              runs code in a sandbox, with enterprise privacy.
          - title: Design a Voice Agent for a Call Centre
            href: /genai-system-design/case-studies/voice-agent-call-centre
            icon: radio
            logo: systems/voice-agent
            description: >-
              A phone agent for support calls: a per-stage latency budget, turn detection, barge-in, tools without
              dead air and a hand-off to a person.
      - title: Search, RAG & Document Systems
        icon: search
        subtitle: Citation-backed answer engines and large-scale document extraction pipelines.
        cards:
          - title: Design an AI Answer Engine
            href: /genai-system-design/case-studies/ai-answer-engine
            icon: search
            logo: systems/answer-engine
            description: >-
              A Perplexity-style engine that answers from the web with citations: own index or search API, span
              ranking, verified citations and a research mode.
          - title: Design a Document Extraction Pipeline
            href: /genai-system-design/case-studies/document-extraction-pipeline
            icon: file-text
            logo: systems/doc-extract
            description: >-
              Invoices and receipts in, validated fields out: a difficulty router, grounded fields, confidence from
              agreement and rules, review sized in staff hours.
      - title: Knowledge Graph Case Studies
        icon: network
        subtitle: Domain knowledge graphs combined with LLM reasoning and strict privacy rules.
        cards:
          - title: Design a Yield Root-Cause Assistant on a Fab Knowledge Graph
            href: /genai-system-design/case-studies/kg-semiconductor-case-study
            icon: cpu
            logo: systems/kg-semi
            description: >-
              A fab engineer asks why yield dropped on these lots: a fab knowledge graph, read-only validated queries,
              commonality statistics, ranked hypotheses.
          - title: Design a Clinical Knowledge-Graph Assistant
            href: /genai-system-design/case-studies/kg-healthcare-case-study
            icon: network
            logo: systems/kg-health
            description: >-
              A clinician asks if a drug is safe for this patient: a medical knowledge graph joined to the record,
              rules for alerts, cited answers, abstention, PHI limits.
      - title: Platform, Gateway & Safety Systems
        icon: server
        subtitle: Multi-team LLM gateways, governance, moderation cascades and cost controls.
        cards:
          - title: Design an LLM Platform and Gateway
            href: /genai-system-design/case-studies/llm-platform-gateway
            icon: server
            logo: systems/llm-gateway
            description: >-
              Brightpost's internal gateway for every team's model calls: budgets that cannot overspend, safe
              fallback, cache-aware routing, redaction and cells.
          - title: 'Case Study: Content Moderation System'
            href: /genai-system-design/case-studies/content-moderation-system
            icon: shield
            description: >-
              Design moderation for user content at scale: policy, a cascade of classifiers and LLMs, human review and
              appeals.
            status: outline
