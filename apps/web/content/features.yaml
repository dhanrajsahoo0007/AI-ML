# Switches that are not sections (sections live in sections.yaml), in the same per-environment
# format. Validated by src/config/features.ts. Values: on | off.

# Interview categories flagged `mlInterviews` in question-bank/taxonomy.yaml:
# ML Fundamentals, Deep Learning, Statistics & Data Science.
mlInterviews: { local: off, preview: off, staging: off, production: off }

# Paywall and billing (plan §9). On: premium pages show a preview and a paywall to visitors without Pro,
# and "Go Pro" opens checkout once the payment provider is configured (DODO_API_KEY). Off: every page is
# fully free and "Go Pro" shows "Launching soon". Production stays off until the free/premium split is
# decided and the merchant of record (Dodo Payments) has approved the account.
paywall: { local: on, preview: on, staging: on, production: off }

# Interview category flagged `cloudInterviews` in question-bank/taxonomy.yaml: Cloud Architecture.
# Keep it in step with the cloud section's release in sections.yaml.
cloudInterviews: { local: on, preview: on, staging: on, production: off }

# The story builder (/behavioral/practice-lab/story-builder) copies a signed-in reader's stories to their account.
# Off: stories stay in the reader's browser and /api/practice/stories answers 404. Practice ratings (a question id
# and a number) sync either way. Turn it on outside `local` only after the privacy page says that story text is
# stored, and the owner has decided whether accounts with parental consent may store free text.
practiceStories: { local: on, preview: off, staging: off, production: off }
