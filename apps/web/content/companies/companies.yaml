# Company records for the Company-wise section. Roles and loops are our own summaries of
# publicly reported interview experiences compiled by Outcome School (Apache 2.0); they change often.

- slug: anthropic
  name: Anthropic
  group: Frontier AI Labs
  icon: shield-check
  roles: Members of technical staff across product, infrastructure and API serving, research engineers and scientists, applied AI and forward-deployed engineers, inference performance engineers, and product engineers.
  loop: A substantive recruiter screen, then a practical coding assessment that grows over several levels, then about five onsite rounds covering a project deep-dive, coding, system design and a dedicated values round. Some ML loops add a round where you work with Claude and are judged on how well you direct and verify it.

- slug: openai
  name: OpenAI
  group: Frontier AI Labs
  icon: sparkles
  roles: Members of technical staff, software, ML and research engineers, research scientists, applied AI and forward-deployed engineers, solutions architects and data scientists.
  loop: A recruiter screen, a practical technical screen that usually means building something real, then onsite coding and practical rounds, an ML or domain-depth round, system design and a mission-fit conversation. Applied and forward-deployed roles add customer-scenario and solution-design rounds.

- slug: google-deepmind
  name: Google DeepMind
  group: Frontier AI Labs
  icon: globe
  roles: Research engineers and scientists, ML and software engineers working on ML, forward-deployed and applied AI engineers on Google Cloud, and data scientists.
  loop: A recruiter screen and a technical phone screen, then onsite coding, ML breadth, ML system design and a leadership round. Research engineer loops add a research deep-dive, maths and probability, and implementing something from scratch, followed by hiring committee and team matching.

- slug: meta
  name: Meta
  group: Frontier AI Labs
  icon: users
  roles: Machine learning engineers from mid to principal level, research engineers and scientists, AI infrastructure engineers and applied research scientists.
  loop: A recruiter screen, a fast-paced coding screen, then onsite coding, ML system design, ML breadth and a behavioral round. Some recent loops add an AI-assisted coding round where you fix, extend and improve a codebase with an AI tool.

- slug: xai
  name: xAI
  group: Frontier AI Labs
  icon: rocket
  roles: Members of technical staff, AI, infrastructure and research engineers, product engineers on Grok, and engineers building data and RL environments.
  loop: Short, low-process loops. A screen, one or two live coding rounds on data structures and systems, a practical build round such as a timed product build or finishing a module in a real codebase, then a leadership conversation. Shipping speed is weighted heavily.

- slug: mistral-ai
  name: Mistral AI
  group: Frontier AI Labs
  icon: zap
  roles: Research and ML engineers, applied AI engineers, solutions architects and forward-deployed engineers, inference engineers and platform engineers.
  loop: A recruiter screen, a screen on Python and ML fundamentals, a pair-programming round building a small LLM-backed service, a deep-dive on transformer and serving internals, a customer scenario for applied roles, and a culture round. European enterprise and on-premise deployment comes up often.

- slug: cohere
  name: Cohere
  group: Frontier AI Labs
  icon: layers
  roles: Members of technical staff, ML engineers, applied AI engineers, solutions architects and forward-deployed engineers, and platform and inference engineers.
  loop: A recruiter screen, a practical coding screen with streaming or API-style problems, then onsite coding, retrieval and RAG depth, enterprise deployment design, a customer scenario and a values round. Ownership and autonomy are tested directly.

- slug: deepseek
  name: DeepSeek
  group: Frontier AI Labs
  icon: brain
  roles: Research engineers, infrastructure and systems engineers, inference engineers, data engineers and algorithm engineers.
  loop: Strongly research- and systems-focused. Expect a paper deep-dive, implementation rounds in PyTorch, depth on distributed training and low-precision arithmetic, an algorithms round, and direct questions about their published architecture and training work.

- slug: moonshot-ai
  name: Moonshot AI
  group: Frontier AI Labs
  icon: orbit
  roles: Research engineers, infrastructure engineers, inference and serving engineers, and agent engineers.
  loop: Centered on long-context systems. An architecture deep-dive, a distributed serving design round, a PyTorch implementation round and a discussion of agent evaluation.

- slug: zhipu-ai
  name: Zhipu AI
  group: Frontier AI Labs
  icon: compass
  roles: Research engineers, agent engineers, RL infrastructure engineers and applied AI engineers.
  loop: Depth on architecture and post-training, a design round on reinforcement-learning infrastructure, a design round on GUI agents, and an implementation round in PyTorch.

- slug: alibaba
  name: Alibaba
  group: Frontier AI Labs
  icon: cloud
  roles: LLM algorithm engineers, research engineers, inference engineers, multimodal engineers and applied AI engineers on Alibaba Cloud.
  loop: Two or three technical rounds on algorithms and ML depth, a round with a senior manager who probes your work, and an HR round, with questions about the Qwen models' architecture and multilingual training on top.

- slug: sarvam-ai
  name: Sarvam AI
  group: Frontier AI Labs
  icon: globe
  roles: Research engineers in LLMs and speech, ML engineers, applied and forward-deployed engineers, speech engineers, and edge and inference engineers.
  loop: Research and applied rounds side by side, covering Indic-language NLP and tokenizers, speech recognition, implementation, deployment on constrained hardware, and a government or enterprise deployment scenario.

- slug: microsoft
  name: Microsoft
  group: Big Tech AI
  icon: layout-dashboard
  roles: AI engineers, applied scientists, ML engineers, software engineers on AI platforms and Copilot, Azure AI solutions architects and principal applied AI engineers.
  loop: A recruiter screen and a technical phone screen, then four or five onsite rounds with coding, ML and AI depth, AI or low-level system design, and a final round with a senior leader. Azure AI and Copilot roles add a customer architecture round.

- slug: amazon
  name: Amazon
  group: Big Tech AI
  icon: cloud
  roles: Applied scientists, ML engineers, data scientists, software engineers in AI and ML, GenAI solutions architects, and applied AI engineers on Bedrock, Q and SageMaker.
  loop: An online assessment or phone screen, then four to six onsite rounds each tied to the Leadership Principles, typically coding, ML breadth, ML depth or system design, and a bar-raiser. Applied scientist loops add a research presentation.

- slug: apple
  name: Apple
  group: Big Tech AI
  icon: monitor-check
  roles: ML engineers, AI and ML research engineers, on-device ML engineers, software engineers on Apple Intelligence and Siri, and applied scientists.
  loop: A recruiter screen and a technical call with the hiring manager, then four to six team-specific rounds on coding, ML depth, on-device efficiency, system design and behavior. Because of secrecy, you may not be told exactly what you would work on.

- slug: nvidia
  name: NVIDIA
  group: Big Tech AI
  icon: cpu
  roles: Deep learning software engineers in inference and LLM performance, CUDA kernel engineers, ML engineers, solutions architects, applied scientists, and engineers on TensorRT-LLM and Dynamo.
  loop: A recruiter screen and hiring-manager call, then four to six onsite rounds on CUDA, C++ or Python coding, GPU performance and roofline reasoning, LLM inference, ML fundamentals and solution design. Solutions architect loops swap kernel depth for customer scenarios.

- slug: tesla
  name: Tesla
  group: Big Tech AI
  icon: zap
  roles: AI and ML engineers on Autopilot and Optimus, deep learning and computer vision engineers, Autopilot data engineers, and inference and silicon software engineers.
  loop: A recruiter screen and hiring-manager call, then onsite coding in C++ or Python, deep learning depth on vision and training pipelines, a data and infrastructure round, and a hands-on debugging round. Fast loops that favor practical engineering.

- slug: consumer-scale-ml
  name: Consumer-Scale ML
  group: Big Tech AI
  icon: thumbs-up
  roles: ML engineers from senior to staff level, applied scientists, ML platform engineers and GenAI engineers at consumer companies such as Uber, Netflix, LinkedIn, Airbnb, Pinterest and Spotify.
  loop: A similar shape across these companies, with a coding screen, then onsite coding, an ML system design round that usually decides the outcome, ML breadth and depth, and behavior. Most have added GenAI questions since 2024.

- slug: databricks
  name: Databricks
  group: AI Infrastructure
  icon: database
  roles: Software engineers on the ML platform and Mosaic AI, ML engineers, GenAI and delivery solutions architects, and applied AI engineers.
  loop: A recruiter screen and a practical coding screen, often about concurrency or data, then onsite coding, a distributed systems or Spark internals round, a GenAI or ML design round, and a customer scenario for field roles.

- slug: groq
  name: Groq
  group: AI Infrastructure
  icon: zap
  roles: Compiler engineers, runtime and systems engineers, inference engineers, silicon software engineers and solutions architects.
  loop: Deep systems rounds, including roofline and memory-hierarchy reasoning for an SRAM-based chip, compiler intermediate-representation design, host runtime design, debugging, and a customer round on unit economics.

- slug: together-ai
  name: Together AI
  group: AI Infrastructure
  icon: server
  roles: Inference and kernel engineers, ML systems engineers, solutions and forward-deployed engineers, and platform engineers.
  loop: Inference performance depth, a scheduler and serving design round, a streaming server coding round, a distributed training debugging round, and a customer advisory round for field roles.

- slug: hugging-face
  name: Hugging Face
  group: AI Infrastructure
  icon: users
  roles: Open-source ML engineers and maintainers, research engineers, infrastructure engineers, developer advocate engineers and inference engineers.
  loop: A library internals deep-dive, a code review round played as a maintainer, a practical fine-tuning or memory budget round, a Hub systems design round and a culture round. Your public open-source work counts.

- slug: scale-ai
  name: Scale AI
  group: AI Infrastructure
  icon: database
  roles: Software and ML engineers, research engineers on evaluations, forward-deployed engineers, and product engineers on the data engine and RL environments.
  loop: A recruiter screen and practical coding screen, then onsite coding with growing requirements, a data quality and annotation design round, an evaluation design round, and a customer scenario for forward-deployed roles.

- slug: perplexity
  name: Perplexity
  group: AI Infrastructure
  icon: search
  roles: Software engineers on search and infrastructure, AI engineers, research scientists, ML engineers on ranking and retrieval, and product engineers on the Comet browser.
  loop: A recruiter screen and technical screen, then onsite web-scale retrieval and ranking design, an ML or search deep-dive, practical coding, a product craft round and behavior. Your opinion of their own product is explicitly evaluated.

- slug: cursor
  name: Cursor
  group: AI-Native Products
  icon: code2
  roles: Software engineers on product, infrastructure and model serving, ML engineers, research engineers and infrastructure engineers.
  loop: A screen with the hiring manager, one to three technical screens building against Cursor's real codebase, then a two-day onsite project, or a remote equivalent, where you design and ship a feature. Scoping, autonomy and effective use of AI tools are graded.

- slug: cognition
  name: Cognition
  group: AI-Native Products
  icon: workflow
  roles: Members of technical staff, agent engineers, infrastructure engineers, deployed engineers and research engineers on agent reinforcement learning.
  loop: A fast loop centered on building, with a practical agent-building or debugging round, infrastructure design, agent evaluation, and a deployment scenario for customer-facing roles.

- slug: sierra
  name: Sierra
  group: AI-Native Products
  icon: message-circle
  roles: Agent engineers, software engineers, forward-deployed engineers, ML engineers and product engineers.
  loop: A recruiter screen and technical screen, a two-hour build session where any AI tools are allowed, agent design and evaluation rounds, a customer scenario and a founders and values round. Judgment about where guardrails belong is the main signal.

- slug: harvey
  name: Harvey
  group: AI-Native Products
  icon: gavel
  roles: Software engineers, ML and applied AI engineers, forward-deployed engineers and research engineers in the legal domain.
  loop: A recruiter screen, paired coding, an architecture presentation on a legal workflow system, an evaluation design round and a customer or partner scenario. Domain rigor and grounding matter more than algorithm puzzles.

- slug: glean
  name: Glean
  group: AI-Native Products
  icon: search-code
  roles: Software engineers on search and ranking, ML engineers, AI engineers working on agents, forward-deployed engineers and infrastructure engineers.
  loop: A recruiter screen and coding screen, then onsite retrieval and ranking design, a permissions and connectors systems round, practical coding, an evaluation round and behavior.

- slug: character-ai
  name: Character.AI
  group: AI-Native Products
  icon: message-square
  roles: ML engineers on inference, research engineers, software engineers on product and safety, and infrastructure engineers.
  loop: Depth on inference economics and serving, a coding round on prompt construction, a safety system design round, and product rounds on discovery and engagement.

- slug: elevenlabs
  name: ElevenLabs
  group: AI-Native Products
  icon: radio
  roles: Speech research engineers, ML engineers, real-time audio software engineers, forward-deployed engineers and infrastructure engineers.
  loop: A real-time audio systems round, speech model depth, a streaming coding round, a safety round on voice cloning, and a customer deployment round for forward-deployed roles.

- slug: abridge
  name: Abridge
  group: AI-Native Products
  icon: heart
  roles: ML engineers in speech recognition and NLP, research scientists, software engineers on clinical products, and implementation engineers.
  loop: Clinical speech recognition depth, an evaluation design round where there is rarely one correct note, a healthcare integration systems round and a privacy and compliance round.

- slug: figure-ai
  name: Figure AI
  group: AI-Native Products
  icon: bot
  roles: Robotics AI engineers, research engineers on vision-language-action models and manipulation, controls engineers, teleoperation data engineers and deployment engineers.
  loop: Robot learning depth covering vision-language-action models, imitation learning and RL, a data pipeline design round, a sim-to-real round, a safety architecture round and a hands-on numerical implementation round.

- slug: waymo
  name: Waymo
  group: AI-Native Products
  icon: map
  roles: Software engineers on perception, prediction and planning, research scientists, ML infrastructure engineers, simulation engineers and safety engineers.
  loop: A coding screen, then onsite coding that is often numerical, a perception or planning depth round, an ML infrastructure or simulation design round and behavior. Reasoning about safety cases carries a lot of weight for senior roles.

- slug: palantir
  name: Palantir
  group: Forward-Deployed & Enterprise
  icon: network
  roles: Forward-deployed engineers and software engineers, data engineers, deployment strategists and engineers on the AIP platform.
  loop: A recruiter call and technical screen, then three onsite rounds drawn from problem decomposition, learning, coding, re-engineering and system design, and a final hiring-manager round on weaker areas. Decomposing a vague real-world problem is the signature round.
