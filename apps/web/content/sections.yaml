# The section registry: the only place a section is declared (plan §5.1).
# Validated by src/features/sections/registry.ts. Shared code (header, sidebar, home counts,
# route generation, Interview Practice and Company Questions aggregation) only iterates this list.
#
# release: state per environment (APP_ENV = local | preview | staging | production)
#   on     pages built, shown in nav, home counts, sitemap and aggregators
#   hidden pages built, but left out of nav, home, sitemap and aggregators; listed in
#          hidden-routes.json so middleware can admit admins only; noindex
#   off    pages not built (404)
#
# Moving a section to production: change only release.production, in its own PR (plan §5.1.1).
#
# icon: a key from src/lib/icons.ts. navGroup: learn | practice | more (header mega-menu groups).
# tone: the section's tint, one of blue | green | orange | red | violet | teal | neutral (the diagram tones in
#   src/app/globals.css). It colours small elements only (icons, icon tiles, active markers, hover); without it the
#   section keeps the navy accent. A group in `groups` may set its own.
# hub: title and subtitle on the section's index page (docs kind).
# redirects: old URLs that move into this section; `fallback` is used while the section is not on (or while
#   `to` is in a hub that is off).
# hubRelease (docs only): hubs with their own on/off per environment, e.g. a parked hub inside a live section.
# groups (docs only): the section's reading order. Each group names hub categories (titles from the section's
#   _index.yaml) and may draw from more than one hub. It sets the cards on the section index page, the sidebar and
#   the header menu; reorder the list to reorder all three. Categories of a hub that is off are left out.
# glossary: this section owns the <Term> glossary (content/<key>/glossary.yaml, page <href>/glossary); at most one.

- key: ai-system-design
  kind: docs
  label: GenAI & LLM Foundations
  shortLabel: LLM Foundations
  href: /ai-system-design
  icon: sparkles
  tone: violet
  navGroup: learn
  order: 1
  release: { local: on, preview: on, staging: on, production: on }
  access: { default: premium, alwaysFree: [hubs, outlines] }
  questions: true
  owner: dhanraj
  hub:
    title: GenAI & LLM Foundations
    subtitle: Interview deep-dives on transformers, LLMs, RAG, knowledge graphs, agents and production AI systems, with architecture diagrams and practice questions.
  groups:
    - name: Start Here
      icon: compass
      description: "A map of the whole LLM stack and a study plan, so every later topic has a place to sit."
      categories:
        - "Orientation"
    - name: LLM Foundations
      icon: cpu
      description: "Core transformer internals, modern frontier architectures (MoE, MLA, Mamba, Diffusion), training and reasoning."
      categories:
        - "Transformer & Core Mechanics"
        - "Modern & Frontier Architectures"
        - "Training, Reasoning & Decoding"
    - name: RAG & Knowledge
      icon: database
      description: "Grounding models in your own data: ingestion, chunking, embeddings, vector databases, retrieval quality and types of RAG."
      categories:
        - "RAG Foundations & Ingestion"
        - "Chunking & Document Processing"
        - "Embeddings"
        - "Vector Databases"
        - "Retrieval, Querying & Access Control"
        - "Types of RAG"
        - "RAG Evaluation"
    - name: AI Agents & Engineering
      icon: bot
      description: "Agent foundations, prompt, context, harness and loop engineering, plus memory, multi-agent systems and production operations."
      categories:
        - "Agent Foundations"
        - "Prompt Engineering"
        - "Context Engineering"
        - "Harness Engineering"
        - "Loop & Flow Engineering"
        - "Agent Memory & State"
        - "Multi-Agent & Agent Types"
        - "Running Agents in Production"
    - name: Fine-Tuning & Adaptation
      icon: settings
      description: "Changing the model itself: when to fine-tune, how to do it cheaply, and how to build the data for it."
      categories:
        - "Adapting a Model"
    - name: Evaluation
      icon: test-tube
      description: "Measuring whether an LLM system works, before launch and in production, for models, RAG and agents."
      categories:
        - "Evaluation Methods"
        - "Evaluation in Production"
    - name: Inference & Serving
      icon: server
      description: "Running models fast and cheaply: engines, GPUs, traffic management, caching, capacity and deployment."
      categories:
        - "Inference Engine & GPUs"
        - "Traffic & Gateway"
        - "Cost & Capacity"
        - "Deployment"
    - name: LLMOps & Observability
      icon: activity
      description: "Seeing what an LLM system does in production and shipping changes to it safely."
      categories:
        - "Observability"
        - "Release Pipelines"
    - name: Safety, Security & Governance
      icon: shield
      description: "Keeping an LLM system safe, private and compliant: guardrails, attacks, hallucination, privacy and regulation."
      categories:
        - "Guardrails & Model Risks"
        - "Privacy, Access & Compliance"
    - name: Multimodal & Voice
      icon: radio
      description: "Beyond text: models that see, speak, generate images and video, and act in the physical world."
      categories:
        - "Vision, Speech & Robotics"
  # Old ML System Design URLs: its component pages now live in the GenAI hub. The classic ML pages have their
  # own section (ml-system-design, below).
  redirects:
    - { from: /ml-system-design/components, to: /ai-system-design/genai-system-design, fallback: /ai-system-design }
    - {
        from: "/ml-system-design/components/:path*",
        to: "/ai-system-design/genai-system-design/:path*",
        fallback: /ai-system-design,
      }
    - {
        from: "/system-design/ml-system-design/:path*",
        to: "/ai-system-design/genai-system-design/:path*",
        fallback: /ai-system-design,
      }

