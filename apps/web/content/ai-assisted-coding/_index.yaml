      - title: Practice
        icon: timer
        subtitle: A plan to get ready for the round in two weeks.
        cards:
          - title: Two-Week Practice Plan
            href: /ai-assisted-coding/guide/two-week-practice-plan
            icon: target
            description: Fourteen days of practice with the scenarios on this site, from a first timed run to full mock rounds.
            status: outline
  - slug: scenarios
    categories:
      - title: Rules and money logic
        icon: dollar-sign
        subtitle: Build business rules part by part, where every earlier test must stay green.
        cards:
          - title: Payment Rule Engine
            href: /ai-assisted-coding/scenarios/payment-rule-engine
            icon: workflow
            description: >-
              Build a rule engine for payments: equality rules, then AND and OR, then parentheses and numeric
              comparisons, with your own tests.
            status: outline
          - title: Courier Pay Tracker
            href: /ai-assisted-coding/scenarios/courier-pay-tracker
            icon: clock
            description: >-
              Work out courier pay from rates and deliveries: pay up to a time, a 3-hour cap, and rate changes that keep
              their history.
            status: outline
          - title: Invoice Payment Matching
            href: /ai-assisted-coding/scenarios/invoice-payment-matching
            icon: link2
            description: >-
              Match payments to open invoices by memo id, then exact amount and earliest due date, then a tolerance band
              and partial payments.
            status: outline
          - title: Peer Payments App
            href: /ai-assisted-coding/scenarios/peer-payments-app
            icon: share
            description: >-
              Start from a blank repo: agree the scope, build core transfers and a service layer, then add retries and
              reversals.
            status: outline
      - title: Debug and extend a service
        icon: wrench
        subtitle: Find and fix bugs in a service you did not write, then add the feature the interviewer asks for.
        cards:
          - title: Order Refund Service
            href: /ai-assisted-coding/scenarios/order-refund-service
            icon: undo2
            description: >-
              Trace a refund through two services, add refund, close and escalate rules, then make partial refunds safe
              to retry.
            status: outline
          - title: 'Library App: Debug and Extend'
            href: /ai-assisted-coding/scenarios/library-app-debug-and-extend
            icon: book-open
            description: >-
              Clarify vague requirements, build search filters, fix a metric that comes out wrong, and add the tests
              that prove it.
            status: outline
          - title: Watchlist API Bug Hunt
            href: /ai-assisted-coding/scenarios/watchlist-api-bug-hunt
            icon: bug
            description: >-
              Six failing tests across a handler, its routes and middleware: find each bug, fix it, then answer
              concurrency follow-ups.
            status: outline
          - title: Idempotent Reminders
            href: /ai-assisted-coding/scenarios/idempotent-reminders
            icon: bell
            description: >-
              Send due-date reminders and serve holds in FIFO order, then make the jobs survive retries and crashes
              without double sends.
            status: outline
      - title: Review AI-written code
        icon: git-merge
        subtitle: Read a pull request an AI wrote, find what is wrong, and decide whether it ships.
        cards:
          - title: Review the AI Pull Request
            href: /ai-assisted-coding/scenarios/review-the-ai-pull-request
            icon: git-merge
            description: >-
              Triage a large AI-written pull request that adds batching: rank the findings, check its claims, and give a
              verdict.
            status: outline
          - title: Cursor Query Round
            href: /ai-assisted-coding/scenarios/cursor-query-round
            icon: database
            description: >-
              Fix a cursor that skips rows, add limit and ordering, review an AI pull request, then explain duplicates
              under concurrent writes.
            status: outline
      - title: Data and LLM features
        icon: sparkles
        subtitle: Process records and call a model, with the validation, retries and limits that keep it safe.
        cards:
          - title: LLM Categoriser Service
            href: /ai-assisted-coding/scenarios/llm-categoriser-service
            icon: sparkles
            description: >-
              Serve a CSV as JSON, add a category per row from a stubbed LLM, then validate, time out, retry and run
              calls in parallel.
            status: outline
          - title: Record Reconciliation
            href: /ai-assisted-coding/scenarios/record-reconciliation
            icon: combine
            description: >-
              Normalise records, score matches with a review band, group them, and merge with provenance, where a wrong
              merge costs more than a miss.
            status: outline
