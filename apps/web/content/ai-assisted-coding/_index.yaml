            status: outline
      - title: Working with the AI
        icon: bot
        subtitle: How to split the work with the assistant and check everything it writes.
        cards:
          - title: Working With the AI
            href: /ai-assisted-coding/guide/working-with-the-ai
            icon: refresh-cw
            description: >-
              A loop for every change: read the code, plan, send a small prompt, review what comes back, then run the
              tests.
            status: outline
          - title: Prompts That Work
            href: /ai-assisted-coding/guide/prompts-that-work
            icon: message-square
            description: Small prompts that name the files, the contract and the test, next to prompts that waste the round.
            status: outline
          - title: Reviewing AI-Written Code
            href: /ai-assisted-coding/guide/reviewing-ai-written-code
            icon: search-code
            description: >-
              What AI-written code gets wrong, with the study numbers, a review order to follow, and how to check a
