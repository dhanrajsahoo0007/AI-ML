  - slug: fundamentals
    categories:
      - title: Start here
        icon: compass
        subtitle: 'What system design is, how a request travels, the numbers to know, how to estimate and scale, and the interview script.'
        cards:
          - title: 'What system design is'
            href: /system-design/fundamentals/what-is-system-design
            icon: map
            description: 'What system design covers, the four questions every design answers, how this section is laid out, and a short path to start.'
          - title: 'A request''s journey'
            href: /system-design/fundamentals/anatomy-of-a-request
            icon: route
            description: 'Follow one web request from the browser to the database and back, hop by hop, and see where each millisecond of latency hides.'
          - title: 'Latency numbers that matter'
            href: /system-design/fundamentals/latency-numbers
            icon: timer
            description: 'How long common operations take, from a CPU cache hit to a round trip across the planet, and what that means for a 100 ms request.'
          - title: 'Back-of-the-envelope estimation'
            href: /system-design/fundamentals/estimation
            icon: bar-chart
            description: 'Turn users and habits into requests per second, storage and bandwidth with round numbers, worked through for a photo app, a chat app and a URL shortener.'
          - title: 'Scaling from one server to millions of users'
            href: /system-design/fundamentals/scaling-journey
            icon: trending-up
            description: 'How a web app grows from one box to millions of users, and why a load balancer, cache, replicas, CDN and queue each show up when they do.'
          - title: 'Availability, reliability and the nines'
            href: /system-design/fundamentals/availability
            icon: activity
            description: 'What 99.9% and 99.99% mean in minutes, how SLIs, SLOs and SLAs fit together, and how spare servers and failover buy extra nines.'
          - title: 'The system design interview framework'
            href: /system-design/fundamentals/interview-framework
            icon: presentation
            description: 'A 45-minute script for design interviews: clarify, requirements, estimates, API, data, high level, deep dive and wrap-up, and what gets scored.'
      - title: Requirements
        icon: file-text
        subtitle: 'Pin down what the system must do and how well it must do it before drawing boxes.'
        cards:
          - title: 'Functional requirements'
            href: /system-design/fundamentals/functional-requirements
            icon: target
            description: 'How to turn a vague prompt into a short, numbered list of what the system must do, F1 to Fn, with a clear out-of-scope line.'
          - title: 'Non-Functional Requirements'
            href: /system-design/fundamentals/non-functional-requirements
            icon: gauge
            description: 'Turn fast, reliable and cheap into latency, throughput, availability, consistency, durability and cost targets, and see how each one shapes a design.'
          - title: 'Capacity planning and bottlenecks'
            href: /system-design/fundamentals/capacity-planning
            icon: cpu
            description: 'Find the first bottleneck in CPU, memory, disk, network or connections, keep headroom for spikes and growth, and prove it with a load test.'
      - title: Networking
        icon: network
        subtitle: 'The network underneath every design: layers, TCP and UDP, DNS, HTTP, TLS, proxies, CDNs and load balancers.'
        cards:
          - title: 'Networking basics'
            href: /system-design/fundamentals/networking
            icon: network
            description: 'How data crosses a network: packets, the four layers, IP addresses, ports, and why latency and bandwidth are different problems.'
          - title: 'IP, TCP and UDP'
            href: /system-design/fundamentals/tcp-udp
            icon: workflow
            description: 'How IP addresses and ports find a program, how TCP makes delivery reliable and ordered, and when UDP''s send-and-forget is the better choice.'
          - title: 'DNS'
            href: /system-design/fundamentals/dns
            icon: globe
            description: 'How a name like recipes.example.com becomes a server address: recursive lookups, caches, TTLs, record types and DNS-based load balancing.'
          - title: 'HTTP/1.1, HTTP/2 and HTTP/3'
            href: /system-design/fundamentals/http
            icon: link2
            description: 'How a browser and a server talk with HTTP: requests, responses, status codes and caching headers, and how each version cuts the waiting.'
          - title: 'TLS and HTTPS'
            href: /system-design/fundamentals/tls
            icon: lock
            description: 'How TLS encrypts web traffic and proves who the server is: the one-round-trip handshake, certificates, what stays visible, edge termination and mTLS.'
          - title: 'Proxies, reverse proxies and gateways'
            href: /system-design/fundamentals/proxies
            icon: layers
            description: 'Forward and reverse proxies, where TLS ends, sidecar proxies between services, and what an API gateway adds on top of a plain proxy.'
          - title: 'CDNs and edge'
            href: /system-design/fundamentals/cdn
            icon: cloud
            description: 'How a content delivery network keeps copies of your files near readers: origin and edge, hits and misses, TTLs, purges, push vs pull.'
          - title: 'Load balancing basics'
            href: /system-design/fundamentals/load-balancing-basics
            icon: split
            description: 'Why many servers sit behind one address, how layer 4 and layer 7 balancers differ, and what health checks and sticky sessions do.'
      - title: APIs
        icon: link2
        subtitle: 'How clients and services talk to each other, when to pick each style, and how to secure the front door.'
        cards:
          - title: 'API design basics'
            href: /system-design/fundamentals/api-design
            icon: book-open
            description: 'How to design a web API''s contract: resources and verbs, status codes and errors, pagination, idempotency keys, versions and rate-limit headers.'
          - title: 'REST'
            href: /system-design/fundamentals/rest
            icon: globe
            description: 'How a REST API names things as resources, acts on them with HTTP methods, keeps each request self-contained, and what a good one looks like.'
          - title: 'GraphQL'
            href: /system-design/fundamentals/graphql
            icon: git-branch
            description: 'How one GraphQL query replaces several REST calls: schemas, queries, mutations, subscriptions, resolvers, the N+1 problem and DataLoader.'
          - title: 'RPC and gRPC'
            href: /system-design/fundamentals/rpc
            icon: code2
            description: 'How a remote procedure call makes a network request look like a function call, and how gRPC adds Protobuf, HTTP/2 streams and deadlines.'
          - title: 'SOAP'
            href: /system-design/fundamentals/soap
            icon: file-text
            description: 'How SOAP wraps each call in an XML envelope, describes it in a WSDL contract and signs it with WS-Security, plus how to integrate with it.'
          - title: 'Choosing an API style'
            href: /system-design/fundamentals/choosing-an-api-style
            icon: scale
            description: 'How to pick REST, GraphQL, gRPC, WebSockets or webhooks for each conversation in a system, based on who calls and who starts.'
          - title: 'Webhooks and callbacks'
            href: /system-design/fundamentals/webhooks
            icon: share
            description: 'How one server tells another that something happened: a signed POST, retries with backoff, duplicates, ordering and replay protection.'
          - title: 'API gateways and backends for frontends'
            href: /system-design/fundamentals/api-gateway
            icon: server
            description: 'One front door for your API that checks callers, limits them, routes and reshapes calls, plus a small backend for each kind of client app.'
          - title: 'Authentication and authorization for APIs'
            href: /system-design/fundamentals/api-auth
            icon: key
            description: 'How an API knows who is calling and what they may do: session cookies, JWTs, API keys, OAuth 2 with PKCE, scopes, refresh and revocation.'
      - title: Client-Server Communication
        icon: refresh-cw
        subtitle: 'Getting fresh data to clients, from polling to persistent connections and push notifications.'
        cards:
          - title: 'Ajax Polling'
            href: /system-design/fundamentals/ajax-polling
            icon: refresh-cw
            description: 'How short polling asks a server for news on a timer, why most of those calls come back empty, and how to pick an interval that is good enough.'
          - title: 'Long Polling'
            href: /system-design/fundamentals/long-polling
            icon: timer
            description: 'How long polling holds a request open until news arrives, how timeouts and reconnects keep it safe, and what the waiting requests cost a server.'
          - title: 'Server-Sent Events'
            href: /system-design/fundamentals/server-sent-events
            icon: radio
            description: 'How a server streams events to a browser over one open HTTP response, how event ids let a dropped stream resume, and when SSE beats WebSockets.'
          - title: 'WebSockets'
            href: /system-design/fundamentals/websockets
            icon: repeat
            description: 'How one HTTP request upgrades to a two-way connection, what frames and heartbeats do, and how to scale socket servers with gateways and pub/sub.'
          - title: 'Push notifications'
            href: /system-design/fundamentals/push-notifications
            icon: bell
            description: 'How an app server reaches a closed app through APNs and FCM: device tokens, collapsing, badges, silent pushes, and why delivery is best-effort.'
          - title: 'Choosing a real-time method'
            href: /system-design/fundamentals/choosing-realtime
            icon: zap
            description: 'Short polling, long polling, server-sent events, WebSockets and push notifications on one timeline, with rules for picking one.'
      - title: Security basics
        icon: shield
        subtitle: 'Where attacks land, how encryption and hashing protect data, the common attacks, and limits against abuse.'
        cards:
          - title: 'Security overview'
            href: /system-design/fundamentals/security
            icon: shield-check
            description: 'Defence in depth for a web system: the edge, app and data layers where attacks land, least privilege, and how to keep secrets out of reach.'
          - title: 'Encryption, hashing and secrets'
            href: /system-design/fundamentals/encryption-and-hashing
            icon: fingerprint
            description: 'Symmetric and asymmetric encryption, data in transit and at rest, salted password hashing with bcrypt or Argon2, and where to keep the keys.'
          - title: 'Common attacks and defences'
            href: /system-design/fundamentals/common-attacks
            icon: shield-alert
            description: 'DDoS, replay, injection, CSRF, XSS and credential stuffing: what each attack exploits and the defence that stops it.'
          - title: 'Rate limiting and abuse basics'
            href: /system-design/fundamentals/abuse-protection
            icon: shield
            description: 'Why every public API needs limits, where to enforce them, what to count per user or per IP, and the signals that give a bot away.'
      - title: Data formats and storage basics
        icon: archive
        subtitle: 'How records become bytes, where files, blocks and objects live, and how compression trades CPU for bandwidth.'
        cards:
          - title: 'Serialisation: JSON, Protobuf and Avro'
            href: /system-design/fundamentals/serialization
            icon: binary
            description: 'How one record becomes bytes as JSON text, Protobuf or Avro, what each costs in bytes, and how each copes when the record''s shape changes.'
          - title: 'Files, blocks and objects'
            href: /system-design/fundamentals/storage-types
            icon: hard-drive
            description: 'Block, file and object storage: what each one gives you, what it costs, and where databases, logs and photos should live.'
          - title: 'Compression and encoding'
            href: /system-design/fundamentals/compression
            icon: minimize
            description: 'How gzip, Brotli and zstd shrink text, where systems compress (CDN, queues, database pages), the CPU versus bandwidth trade, and how images and video differ.'
