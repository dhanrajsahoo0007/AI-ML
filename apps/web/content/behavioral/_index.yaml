hubs:
  - slug: amazon-leadership-principles
    categories:
      - title: The Bar Raiser & Tension Model
        icon: scale
        subtitle: How Amazon's interviews use the principles, and how to prepare for two that pull against each other.
        cards:
          - title: How Amazon & the Bar Raiser Evaluate the 16 LPs
            href: /behavioral/amazon-leadership-principles/how-amazon-evaluates-lps
            icon: scale
            description: How Amazon's interviews use the 16 Leadership Principles, what the Bar Raiser does, and how to
              tell a story that holds two principles at once.
          - title: "All 16 Leadership Principles: Question Index"
            href: /behavioral/amazon-leadership-principles/leadership-principles-question-index
            icon: table
            description:
              "Every Amazon Leadership Principle in one place: what it asks of you in plain words and the interview
              questions in our bank for each one, by level."
          - title: Customer Obsession & Ownership
            href: /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
            icon: users
            description:
              Working backwards from user pain and stepping across service boundaries when a problem sits between
              teams.
      - title: Execution, Standards & Depth
        icon: zap
        subtitle: Balancing speed on reversible decisions with high standards and deep root-cause investigation.
        cards:
          - title: Bias for Action & Deliver Results
            href: /behavioral/amazon-leadership-principles/bias-for-action-and-deliver-results
            icon: zap
            description: Two-way vs. one-way door decisions, shipping under uncertainty, and recovering milestones when
              dependencies slip.
          - title: Insist on the Highest Standards (Without Blocking Delivery)
            href: /behavioral/amazon-leadership-principles/highest-standards-vs-speed
            icon: shield-check
            description: Hold the line on reliability, testing and API design while still shipping on schedule.
          - title: Dive Deep & Are Right, A Lot
            href: /behavioral/amazon-leadership-principles/dive-deep-and-are-right-a-lot
            icon: search-code
            description:
              Drop down to logs, traces and query plans when metrics look wrong, and seek evidence that disproves
              your own hunch.
      - title: Candor, Simplification & Scale
        icon: git-merge
        subtitle: Challenging decisions with data, simplifying over-engineered systems, and scaling teams responsibly.
        cards:
          - title: Have Backbone (Disagree and Commit) & Earn Trust
            href: /behavioral/amazon-leadership-principles/have-backbone-and-earn-trust
            icon: message-square
            description:
              Challenge senior stakeholders with data, admit your own mistakes early, and commit wholeheartedly
              once a call is made.
          - title: Invent and Simplify & Think Big
            href: /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
            icon: lightbulb
            description: Replace brittle complexity with simpler designs, and connect a small first milestone to a much
              larger direction.
          - title: Frugality & Learn and Be Curious
            href: /behavioral/amazon-leadership-principles/frugality-and-curiosity
            icon: dollar-sign
            description: Turn tight compute, latency or headcount budgets into cleaner designs, and master unfamiliar
              domains fast.
          - title: Hire and Develop the Best & Earth's Best Employer
            href: /behavioral/amazon-leadership-principles/hire-develop-and-best-employer
            icon: user-check
            description: Coach struggling teammates, raise the hiring bar, and fix unsustainable on-call and operational
              load.
          - title: Success and Scale Bring Broad Responsibility
            href: /behavioral/amazon-leadership-principles/broad-responsibility-at-scale
            icon: globe
            description:
              Catch privacy, security, accessibility, fairness and AI safety blind spots before they harm users
              at scale.
