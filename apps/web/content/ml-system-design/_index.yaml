# Nav index for this section (plan §5.2): one entry per hub, its categories and cards.
# Read by src/lib/nav-tree.ts for the header and sidebar; checked by scripts/content-check.ts.
# Generated from the hub MDX by scripts/migrate-nav-index.ts; keep it in step with the hub's cards.
hubs:
  - slug: case-studies
    categories:
      - title: Recommendation & Ranking
        icon: layers
        subtitle: Systems that pick a few items out of millions and put them in order.
        cards:
          - title: Recommendation Systems
            href: /ml-system-design/case-studies/recommendation-systems
            icon: thumbs-up
            description: >-
              Candidate generation, two-tower models, ranking and exploration, with Netflix, YouTube, Amazon and
              Pinterest.
          - title: Search Ranking System
            href: /ml-system-design/case-studies/search-ranking-system
            icon: search
            description: Query understanding, hybrid retrieval, learning to rank, re-ranking and evaluation.
          - title: News Feed Ranking
            href: /ml-system-design/case-studies/news-feed-ranking
            icon: trending-up
            description: >-
              Design the ranked feed of a social network: candidate sources, multi-task ranking, value models, freshness
              and integrity.
            status: outline
          - title: Ads Click Prediction
            href: /ml-system-design/case-studies/ads-click-prediction
            icon: bar-chart
            description: >-
              Design click-through-rate prediction for an ads system: features, model, calibration, auction and online
              learning.
            status: outline
          - title: Visual Search
            href: /ml-system-design/case-studies/visual-search
            icon: eye
            description: >-
              Design search by image for similar products: embedding models, indexing, retrieval, re-ranking and
              evaluation.
            status: outline
          - title: People You May Know
            href: /ml-system-design/case-studies/people-you-may-know
            icon: users
            description: >-
              Design friend recommendations on a social graph: candidate generation from the graph, ranking features and
              privacy limits.
            status: outline
      - title: Prediction & Risk
        icon: shield-alert
        subtitle: Systems that predict a number or a risk and act on it in real time.
        cards:
          - title: Fraud Detection System
            href: /ml-system-design/case-studies/fraud-detection-system
            icon: shield-alert
            description: Real-time features, rules plus ML, graph signals, imbalance and delayed labels.
          - title: ETA Prediction
            href: /ml-system-design/case-studies/eta-prediction
            icon: clock
            description: >-
              Design arrival-time prediction for ride-hailing or delivery: route features, live traffic, model choice
              and serving in milliseconds.
            status: outline
          - title: Dynamic Pricing
            href: /ml-system-design/case-studies/dynamic-pricing
            icon: dollar-sign
            description: >-
              Design surge or dynamic pricing for a two-sided marketplace: demand and supply forecasts, price setting
              and the feedback loops that go wrong.
            status: outline
  - slug: fundamentals
    categories:
      - title: Interview Approach
        icon: presentation
        subtitle: How to run the round and turn a product goal into an ML problem.
        cards:
          - title: The ML System Design Interview Framework
            href: /ml-system-design/fundamentals/ml-system-design-interview-framework
            icon: presentation
            description: >-
              A step-by-step way to run an ML system design interview: problem framing, data, features, model, serving,
              evaluation and monitoring.
            status: outline
          - title: Problem Framing & Metrics
            href: /ml-system-design/fundamentals/problem-framing-and-metrics
            icon: target
            description: >-
              Turning a product goal into an ML task, choosing labels and objectives, and picking offline and online
              metrics that agree.
            status: outline
      - title: Data & Features
        icon: database
        subtitle: Where training data comes from and how features reach the model.
        cards:
          - title: Data & Labelling Pipelines
            href: /ml-system-design/fundamentals/data-and-labelling-pipelines
            icon: database
            description: >-
              Where training data comes from: logs, human labels and weak supervision, and how to keep it clean,
              balanced and free of leakage.
            status: outline
          - title: Feature Engineering & Feature Stores
            href: /ml-system-design/fundamentals/feature-engineering-and-feature-stores
            icon: table
            description: >-
              Designing features for users, items and context, and serving the same values in training and production
              with a feature store.
            status: outline
          - title: Batch vs Streaming Features
            href: /ml-system-design/fundamentals/batch-and-streaming
            icon: git-merge
            description: How data movement shapes ML system design.
      - title: Models in Production
        icon: server
        subtitle: Training, ranking, serving and proving that a model is better.
        cards:
          - title: Training Pipelines & Retraining
            href: /ml-system-design/fundamentals/training-pipelines-and-retraining
            icon: rotate-cw
            description: >-
              How models are trained and kept current: pipelines, validation gates, retraining schedules and online
              learning.
            status: outline
          - title: Candidate Generation & Ranking
            href: /ml-system-design/fundamentals/candidate-generation-and-ranking
            icon: layers
            description: >-
              The multi-stage funnel behind recommendations, search and ads: retrieval, ranking and re-ranking under a
              latency budget.
            status: outline
          - title: Online Model Serving
            href: /ml-system-design/fundamentals/online-serving
            icon: radio
            description: Latency, scaling, and safe rollout for real-time ML.
          - title: Experimentation & A/B Testing
            href: /ml-system-design/fundamentals/experimentation-and-ab-testing
            icon: split
            description: 'Proving a model is better in production: A/B tests, sample size, guardrails, interleaving and bandits.'
            status: outline
