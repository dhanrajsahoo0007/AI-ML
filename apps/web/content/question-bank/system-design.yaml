- id: design-a-system-that-enables-a-large-language-model-to-handl
  q: >-
    Design a system that enables a large language model to handle multiple questions in a single
    thread.
  a: >
    Store the thread as structured history with each question and answer, and build context per turn
    from the system prompt, a running summary of older turns, the most recent turns verbatim and any
    retrieved documents. Rewrite each new question into a standalone query using history so
    references like "what about the second one" resolve correctly.


    When one message contains several questions, detect and split them, answer each, possibly in
    parallel, and combine the results with clear structure. Use prefix caching so the shared history
    is not recomputed, and test with long multi-question threads.
  topic: system-design
  level: Mid
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/agent-memory
  source: outcome-school
- id: design-a-distributed-search-system-for-1-billion-documents-a
  q: Design a distributed search system for 1 billion documents at 1 million QPS.
  a: >
    Shard the index by document across many machines, with replicas of each shard for throughput and
    availability: 1M QPS needs many replicas, since every query fans out to all shards of one
    replica set. Each shard holds an inverted index and, if semantic search is needed, a compressed
    ANN index in memory.


    A query router fans out to one replica of each shard, gathers top-k results, merges them and
    re-ranks the top few hundred centrally. Use caching for popular queries, tiered indexes that
    keep hot documents in memory, incremental indexing pipelines for updates, and tail-latency
    controls such as hedged requests and timeouts.
  topic: system-design
  level: Senior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/vector-databases
  source: outcome-school
- id: design-apis-for-developers-to-access-anthropic-s-models-secu
  q: Design APIs for developers to access Anthropic's models securely and efficiently.
  a: >
    Expose a clear REST API for messages with streaming via server-sent events, tool use and
    structured outputs, versioned so changes do not break clients, with SDKs in major languages.
    Authenticate with scoped API keys or workload identity, support organization and workspace
    separation, and enforce token-based rate limits and spend limits per key.


    For efficiency, offer prompt caching, batch processing for non-urgent work and usage reporting.
    For security, encrypt traffic, log usage for audit, scan for key leaks, and document data
    retention. Return clear errors with retry guidance, and publish limits and pricing.
  topic: system-design
  level: Senior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/llm-serving-inference
