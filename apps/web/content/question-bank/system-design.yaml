- id: design-a-meeting-assistant-recording-diarisation-summary-act
  q: "Design a meeting assistant: recording, diarisation, summary, action items, integrations."
  a: >
    Capture audio with consent notices, run streaming ASR and diarization, map speakers to
    participants through calendar data and voice enrollment, then generate a summary, decisions and
    action items with owners and due dates, each linked to timestamps in the transcript.


    Integrations push action items to task tools and summaries to email or chat, respecting meeting
    permissions. Evaluate faithfulness of decisions and owners, action-item precision and recall
    against human notes, and diarization accuracy, with privacy controls for retention and access.
  topic: system-design
