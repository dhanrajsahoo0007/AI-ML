- id: a-user-says-send-maya-the-photos-from-saturday-s-hike-design
  q: >-
    A user says “send Maya the photos from Saturday's hike.” Design the on-device path from that
    utterance to a structured app action with resolved parameters.
  a: >
    On-device speech recognition produces text; a small language model parses intent and slots
    (action send, recipient "Maya", content photos, time "Saturday", event "hike") into a structured
    action schema. Entity resolution then queries on-device indexes: contacts to resolve Maya, the
    photo library with dates, locations and image understanding to find hike photos from last
    Saturday.


    The system presents the resolved action with a preview for confirmation, especially when there
    are several Mayas or uncertain matches, then calls the messaging app's action API. Everything
    runs on device for privacy, and evaluation covers intent accuracy, resolution accuracy and
    confirmation rates.
  topic: system-design
