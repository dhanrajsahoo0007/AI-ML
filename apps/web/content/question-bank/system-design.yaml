- id: design-the-hugging-face-hub-millions-of-git-repos-where-indi
  q: >-
    Design the Hugging Face Hub: millions of git repos where individual files are tens to hundreds
    of GB.
  a: >
    Git handles metadata and small files, while large files are stored in object storage through a
    large-file system and referenced by pointers in the repository, with content-addressed,
    chunk-level deduplication so near-identical model versions share storage and uploads are
    resumable. Downloads go through a CDN with range requests so tools can fetch only needed files.


    Add metadata indexing for search, access control for private and gated repos, rate limiting, and
    background jobs for security scanning and model cards. Scale storage and bandwidth economics
    through deduplication and caching.
  topic: system-design
  level: Senior
  companies:
    - Hugging Face
  related: /ai-system-design/genai-system-design/llm-serving-inference
  source: outcome-school
- id: design-an-end-to-end-pipeline-producing-rlhf-preference-data
  q: >-
    Design an end-to-end pipeline producing RLHF preference data for a frontier lab: 100k
    prompt-response comparisons a week, with quality guarantees.
  a: >
    Source prompts covering target capabilities and edge cases, generate responses from the lab's
    models, and route comparison tasks to qualified annotators matched by domain. The task UI
    collects preferences, ratings on rubric dimensions and short rationales.


    Quality guarantees: annotator qualification tests, gold tasks with known answers, agreement
    monitoring and overlap on a percentage of items, expert review of disagreements, detection of
    rushed or AI-generated work, and feedback to annotators. Track throughput, cost and quality
    metrics weekly, and deliver data with provenance and quality scores.
  topic: system-design
  level: Senior
  companies:
    - Scale AI
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  refs:
