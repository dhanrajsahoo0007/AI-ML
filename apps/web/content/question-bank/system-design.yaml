- id: design-a-document-intelligence-pipeline-scanned-pdfs-in-stru
  q: >-
    Design a document-intelligence pipeline: scanned PDFs in, structured fields out, at 10M
    documents.
  a: >
    Ingest documents to object storage with a queue, classify document type, run OCR and layout
    analysis for text, tables and key-value regions, then extract fields with a model suited to the
    type: templates or specialized extractors for common forms, a vision-language model or LLM with
    a schema for varied documents. Validate fields with business rules, cross-field checks and
    confidence scores.


    Route low-confidence fields to human review and feed corrections back into training and prompts.
    At 10M documents, process in parallel batches with autoscaling, cache by document hash, track
    cost per page, and measure field-level accuracy per document type on labeled samples.
  topic: system-design
  level: Senior
