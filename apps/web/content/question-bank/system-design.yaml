- id: design-the-serving-stack-for-a-consumer-chatbot-with-real-ti
  q: >-
    Design the serving stack for a consumer chatbot with real-time search over a social-media
    firehose.
  a: >
    Ingest the firehose into a streaming pipeline that filters spam, deduplicates, extracts entities
    and embeds posts within seconds, writing to a real-time index with time-decayed ranking. At
    query time, a router decides when fresh information is needed, retrieves recent posts and
    authoritative sources, re-ranks for relevance, credibility and recency, and the LLM answers with
    citations.


    Handle velocity with in-memory indexes for recent hours and tiered storage for older content,
    guard against misinformation with source-quality signals, and serve with the usual optimized LLM
    stack and streaming.
  topic: system-design
  level: Senior
  companies:
    - xAI
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: design-an-on-prem-deployment-of-an-open-weight-model-for-a-e
  q: >-
    Design an on-prem deployment of an open-weight model for a European bank that cannot send data
    to any external API.
  a: >
    Size hardware for the chosen model and load, deploy an inference engine such as vLLM or
    TensorRT-LLM on the bank's GPUs behind their identity and network controls, and run RAG with
    on-premise vector and keyword indexes over bank documents with permission filtering. All logs,
    prompts and data stay inside the bank's network.


    Address regulation: model risk management documentation, evaluation and validation reports,
    audit logging, data retention, and access controls. Plan for updates delivered as signed
    artifacts, monitoring without external telemetry, and on-site support processes.
  topic: system-design
  level: Senior
  companies:
    - Mistral AI
  related: /ai-system-design/genai-system-design/llm-serving-inference
  source: outcome-school
- id: a-bank-wants-the-whole-stack-model-rag-agents-deployed-air-g
  q: >-
    A bank wants the whole stack (model, RAG, agents) deployed air-gapped on their own GPUs. What
    actually changes versus your SaaS?
  a: >
    Everything that relied on the internet changes: model weights, containers and updates must be
    shipped as signed offline bundles; no hosted evaluation, telemetry or external tools; and
    observability, evaluation and support must run inside their network. You cannot quickly patch
    issues, so releases need more testing and simpler upgrade paths.


    Capacity is fixed by their GPUs, so model choice, quantization and batching matter; identity,
    permissions and audit must integrate with their systems; agents' tools only reach internal
    systems; and your team needs runbooks and possibly on-site access to debug.
  topic: system-design
  level: Senior
  companies:
    - Cohere
  related: /ai-system-design/genai-system-design/llm-serving-inference
  source: outcome-school
- id: design-autoglm-end-to-end-a-cloud-service-letting-users-dele
  q: >-
    Design AutoGLM end to end: a cloud service letting users delegate multi-step phone tasks (“order
    my usual coffee”) to an autonomous agent. Architecture and failure modes.
  a: >
    The user's request goes to a planner that breaks it into steps and resolves preferences ("usual
    coffee") from memory. The task runs on a cloud-hosted virtual phone or on the user's device,
    where a GUI agent perceives screens, acts by taps and typing, and verifies each step, with
    app-specific skills for common apps.


    Failure modes include unexpected screens and pop-ups, app updates changing layouts, logins and
    CAPTCHAs, payment confirmations and wrong orders. Mitigate with verification after every step,
    recovery and replanning, mandatory user confirmation for payments, timeouts and progress
    reporting, and evaluation on many recorded app tasks.
  topic: system-design
  level: Senior
  companies:
    - Zhipu AI
  related: /ai-system-design/genai-system-design/agent-architectures
  refs:
