- id: design-people-you-may-know-job-recommendation-ranking-at-a-p
  q: Design “people you may know” / job-recommendation ranking at a professional network's scale.
  a: >
    People you may know: generate candidates from the graph (friends of friends, shared companies
    and schools, contact imports) with graph embeddings, then rank by predicted connection
    probability and acceptance, with privacy controls and limits on how often someone is suggested.
    Job recommendations: match member skills, experience and preferences to job embeddings, rank by
    predicted apply and hire outcomes, and balance between job seekers and recruiters.


    At scale, precompute candidates offline in batch, refresh with real-time signals, and evaluate
    with acceptance and apply rates in A/B tests, plus fairness checks across groups.
  topic: system-design
  level: Senior
  companies:
    - Consumer-Scale ML
  related: /ai-system-design/genai-system-design/recommendation-systems
