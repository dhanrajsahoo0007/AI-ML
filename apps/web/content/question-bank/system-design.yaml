- id: justify-using-a-neural-network-for-a-given-problem-what-do-y
  q: >-
    Justify using a neural network for a given problem: what do you need to know about the network,
    dataset, timeline and business context?
  a: >
    Know the data: type (images, text and audio favor neural networks; small tabular data often
    favors trees), volume and label quality. Know the constraints: latency, hardware,
    interpretability needs and regulatory requirements. Know the timeline and team skills, and
    whether a simpler baseline already meets the business target.


    Justify a neural network with evidence: a baseline comparison, the expected gain and its
    business value, the cost of training and serving, and a plan for monitoring. If a simpler model
    is within the margin that matters, choose it.
  topic: system-design
  level: Mid
  companies:
    - Google DeepMind
  related: /interviews/ml-fundamentals
  source: outcome-school
- id: design-the-recommendation-system-for-instagram-reels
  q: Design the recommendation system for Instagram Reels.
  a: >
    Candidate sources include two-tower retrieval on user and video embeddings, follow-graph and
    creator affinity, trending and fresh content, and exploration pools for new creators. A
    multi-task ranking model predicts watch time, completion, likes, shares, comments, follows and
    negative signals such as skips and "not interested", combined into a value score.


    Re-ranking adds diversity, creator fairness, freshness and integrity filters. Real-time features
    capture the current session, video understanding embeddings handle cold-start content, and
    evaluation uses online tests on long-term engagement and satisfaction, not just watch time.
  topic: system-design
  level: Senior
  companies:
    - Meta
  related: /ai-system-design/genai-system-design/recommendation-systems
  source: outcome-school
- id: design-a-personalised-news-feed-ranking-system-the-next-post
  q: Design a personalised news-feed ranking system / the “next post” logic for Facebook's feed.
  a: >
    Gather candidates from friends, followed pages, groups and recommended content, then filter for
    eligibility and integrity. A multi-task ranker predicts the probability of meaningful
    interactions such as comments, shares, likes, and negative actions such as hides, combined with
    weights that reflect long-term value. The "next post" is chosen with diversity, freshness and
    integrity re-ranking.


    Two-stage design keeps it efficient: cheap candidate generation, heavy ranking over a few
    thousand items. Use real-time session features, debias training for position, and evaluate with
    A/B tests on long-term engagement and user-reported satisfaction.
  topic: system-design
