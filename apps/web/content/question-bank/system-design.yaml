- id: design-a-fraud-detection-system-with-heavy-class-imbalance-a
  q: Design a fraud-detection system with heavy class imbalance and an adversarial opponent.
  a: >
    Score transactions in real time with rules plus a gradient-boosted model on velocity,
    behavioral, device and graph features, mapping scores to approve, challenge, review or block
    with cost-based thresholds. Handle imbalance with class weights, careful sampling and metrics
    such as PR-AUC and recall at a fixed false-positive rate.


    Against an adversary: retrain frequently on matured labels, use anomaly detection for new
    patterns, keep analysts able to deploy rules quickly, monitor drift and attack patterns, and
    reduce label selection bias with small randomized review samples.
  topic: system-design
  level: Senior
  companies:
    - Consumer-Scale ML
  related: /ai-system-design/genai-system-design/fraud-detection-system
