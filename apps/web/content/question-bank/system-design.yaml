- id: design-the-serving-stack-for-a-consumer-chat-assistant-at-hu
  q: Design the serving stack for a consumer chat assistant at hundreds of millions of users.
  a: >
    Global edge and API gateway for authentication, rate limits and streaming connections; a
    conversation service storing history and user memory; an orchestration layer for routing to
    model tiers, tools, search and safety checks; and regional GPU inference clusters running
    optimized engines with continuous batching, paged KV cache, prefix caching and quantization.


    Route by request difficulty and user tier to different model sizes, cache conversation prefixes,
    autoscale on tokens per second and queue depth, and degrade gracefully at peaks by falling back
    to smaller models. Track latency, cost per conversation, safety metrics and quality with sampled
    evaluation, and roll out models gradually with A/B tests.
  topic: system-design
