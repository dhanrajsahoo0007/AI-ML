- id: an-agent-needs-to-iterate-on-code-run-builds-tests-lints-wit
  q: >-
    An agent needs to iterate on code (run builds, tests, lints) without disturbing what the user
    sees in their editor. Architect that.
  a: >
    Give the agent its own working copy, such as a git worktree or shadow workspace, synced from the
    user's state, where it edits files and runs builds, tests and linters in a sandbox or container.
    The user's editor and files stay untouched while the agent iterates.


    Surface the result as a proposed diff the user can review and apply, rebasing it onto any
    changes the user made meanwhile. Manage resources so builds do not slow the user's machine, for
    example by running them remotely.
  topic: system-design
  level: Senior
  companies:
    - Cursor
  related: /ai-system-design/genai-system-design/harness-engineering
  source: outcome-school
- id: design-the-execution-environment-for-thousands-of-concurrent
  q: >-
    Design the execution environment for thousands of concurrent cloud coding agents. It must
    survive the agent waiting forty minutes for CI.
  a: >
    Run each agent in an isolated, persistent sandbox such as a micro-VM or container with the
    repository, tools and credentials scoped to that task, orchestrated by a scheduler that packs
    many sandboxes per host. Agent state, including files, processes and conversation, must be
    checkpointed so a sandbox can be paused and resumed.


    While waiting forty minutes for CI, suspend the sandbox (snapshot its state and release compute)
    and resume it on a CI webhook or poll, possibly on another host. Add resource limits, network
    egress controls, secret management, cleanup of abandoned sandboxes and per-agent cost tracking.
  topic: system-design
  level: Senior
  companies:
    - Cognition
  related: /ai-system-design/genai-system-design/harness-engineering
  source: outcome-school
- id: devin-runs-asynchronously-in-the-cloud-windsurf-s-cascade-ru
  q: >-
    Devin runs asynchronously in the cloud; Windsurf's Cascade runs in the editor next to the user.
    What actually changes between those two products, technically?
  a: >
    A cloud agent runs long, independent tasks in its own sandbox with its own copy of the code and
    tools, so it needs durable state, task queues, environment setup, CI and PR integration, and
    status reporting, and it is evaluated on end-to-end task completion with little supervision.


    An in-editor agent works alongside the user in their local environment, so it needs low latency,
    awareness of the user's current file and edits, safe application of changes into a live buffer,
    short interactive loops and frequent user steering. The model can be similar; the harness,
    environment and UX differ a lot.
  topic: system-design
  level: Senior
  companies:
    - Cognition
  related: /ai-system-design/genai-system-design/harness-engineering
  source: outcome-school
- id: present-the-architecture-for-a-workflow-reviewing-5-000-cont
  q: >-
    Present the architecture for a workflow reviewing 5,000 contracts against an 18-question
    diligence checklist, returning a review grid.
  a: >
    Ingest and parse all contracts with structure, and run the 18 questions per contract as parallel
    extraction tasks: retrieve relevant clauses per question with clause-level retrieval and
    definition expansion, then have an LLM answer with citations to exact passages and a confidence
    score. Results fill a grid of contracts by questions.


    Scale with batched, parallel processing and rate-limit management, cache repeated templates, and
    verify citations automatically. Lawyers review low-confidence and high-risk cells, and accuracy
    is measured against a lawyer-reviewed sample before relying on the results.
  topic: system-design
  level: Senior
  companies:
    - Harvey
  related: /ai-system-design/genai-system-design/knowledge-graph-systems
  source: outcome-school
- id: design-a-connector-framework-that-syncs-content-and-permissi
  q: >-
    Design a connector framework that syncs content and permissions from 100+ SaaS apps into one
    index.
  a: >
    Each connector implements a common interface: authenticate, list and fetch content
    incrementally, fetch permissions including groups, and handle webhooks or change feeds. A sync
    engine schedules connectors, handles rate limits and retries, normalizes content into a common
    document model with metadata and ACLs, and tracks sync state per source.


    Permissions are synced as carefully as content, including group membership expansion, and
    checked at query time. Monitor freshness and errors per connector, run periodic full
    reconciliations, and isolate connector failures so one broken source does not stall others.
  topic: system-design
  level: Senior
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: glean-s-ranking-leans-on-a-knowledge-graph-of-people-content
  q: >-
    Glean's ranking leans on a knowledge graph of people, content and activity. How would you build
    that graph, and how does it improve retrieval beyond embedding similarity?
  a: >
    Build the graph from signals across tools: people and their teams and roles from directories,
    documents and their authors, editors and viewers, interactions such as views, shares, mentions
    and meetings. Edges are weighted by recency and strength.


    It improves retrieval by adding personalization and authority: documents from people you work
    with, recently active content and documents many relevant colleagues use rank higher, which
    embedding similarity alone cannot capture, especially for ambiguous queries and enterprise
    jargon.
  topic: system-design
  level: Senior
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/knowledge-graph-systems
