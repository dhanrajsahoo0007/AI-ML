- id: tell-me-about-a-model-you-shipped-that-made-a-measurable-bus
  q: >-
    Tell me about a model you shipped that made a measurable business difference, and one that did
    not.
  a: >
    Prepare two honest stories. For the success: the business problem, your role, the model and key
    decisions, how you measured impact (an A/B test with a business metric), and the result in
    numbers. For the one that did not work: what you expected, why it failed, for example metric
    misalignment, offline gains that did not transfer or poor adoption, and what you changed in your
    process afterward.


    Interviewers look for ownership, rigor about measurement and the ability to learn from failure.
  topic: system-design
