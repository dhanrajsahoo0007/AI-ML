- id: design-an-llm-gateway-routing-across-providers-failover-cach
  q: "Design an LLM gateway: routing across providers, failover, caching, budgets and rate limits."
  a: >
    A single API for all applications that authenticates callers, enforces per-team token budgets
    and rate limits, and routes each request to a provider and model by policy: capability needed,
    cost tier, data-residency rules and current health. It normalizes request and response formats
    across providers.


    Add failover with retries and fallback models when a provider errors or slows, response and
    prompt caching, streaming passthrough, logging and tracing with cost attribution, guardrail
    hooks, and dashboards. Keep it stateless and horizontally scalable, with a configuration system
    so routing changes do not need code deploys.
  topic: system-design
  level: Senior
