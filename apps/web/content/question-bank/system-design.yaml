- id: design-the-eta-prediction-system-for-a-ride-hailing-marketpl
  q: >-
    Design the ETA prediction system for a ride-hailing marketplace. What features, what model, how
    do you serve it in <100 ms?
  a: >
    Combine a routing engine's baseline estimate from road segments and current traffic with an ML
    correction model trained on actual trip times. Features include route segments, real-time
    speeds, time of day, weather, events, pickup and drop-off characteristics, and driver behavior;
    gradient-boosted trees or a neural model predict the residual or the full time, often as
    quantiles.


    Serve under 100 ms by precomputing segment features, keeping real-time traffic in a fast store
    and running a compact model, with caching for repeated routes. Evaluate with MAE and lateness by
    segment, and monitor drift during unusual events.
  topic: system-design
  level: Senior
  companies:
    - Consumer-Scale ML
  related: /interviews/ml-system-design-interview
  source: outcome-school
- id: design-a-content-recommendation-system-for-a-streaming-catal
  q: >-
    Design a content recommendation system for a streaming catalogue, including cold-start for new
    titles and new users.
  a: >
    Use a two-stage system: candidates from two-tower retrieval, similar-title lists, trending and
    continue-watching rows; a ranker trained on long-term signals such as watch completion and
    return visits. The home page assembles personalized rows and even personalized artwork.


    New titles get content embeddings from metadata, trailers and synopses plus controlled
    exploration exposure; new users get onboarding preferences, popular and regional titles, and
    fast adaptation from the first plays. Evaluate with A/B tests on retention and viewing hours.
  topic: system-design
  level: Senior
  companies:
    - Consumer-Scale ML
  related: /ai-system-design/genai-system-design/recommendation-systems
