- id: design-semantic-search-over-a-large-product-catalogue
  q: Design semantic search over a large product catalogue.
  a: >
    Embed products from title, description, attributes and images with a model fine-tuned on
    query-product engagement, alongside a keyword index for brands, sizes and model numbers. At
    query time, parse the query for structured filters such as category, price and color, run hybrid
    retrieval with those filters, and re-rank with a learning-to-rank model using relevance,
    popularity, availability and personalization.


    Handle typos, synonyms and multilingual queries, cache popular queries, and evaluate with nDCG
    on judged queries, zero-result rate and online conversion. Keep embeddings fresh as the catalog
    changes.
