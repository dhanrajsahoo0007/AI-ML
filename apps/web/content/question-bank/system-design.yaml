  related: /interviews/ml-system-design-interview
  source: outcome-school
- id: design-a-language-translation-model-service
  q: Design a language translation model / service.
  a: >
    Use a multilingual encoder-decoder or LLM translation model, served with batching and caching of
    repeated segments, with language detection up front and pivoting through a high-resource
    language for rare pairs if needed. Handle formatting, placeholders, glossaries and
    do-not-translate terms through preprocessing and constrained decoding.


    Evaluate with automatic metrics such as COMET plus human evaluation per language pair, monitor
    quality by domain, collect corrections, and fine-tune for domains with enough data. Route
    sensitive or high-stakes content to human translators.
