- id: design-a-real-time-voice-agent-for-a-citizen-helpline-in-hin
  q: >-
    Design a real-time voice agent for a citizen helpline in Hindi and three regional languages,
    targeting sub-250 ms perceived latency over a phone line.
  a: >
    Use telephony integration with streaming ASR trained for phone audio in Hindi and the regional
    languages, including code-mixing, fast language identification, a small fast LLM with RAG over
    scheme documents and a backend for application status, and streaming TTS in each language.
    Deploy in-country, close to the telephony provider.


    Sub-250 ms perceived latency is very tight, so use semantic endpointing, immediate short
    acknowledgments while processing, speculative responses for common intents, and streaming at
    every stage. Add escalation to human agents, verification for personal data, and evaluation with
    native speakers on real calls.
  topic: system-design
  level: Senior
  companies:
    - Sarvam AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
