- id: design-a-text-to-sql-system-over-a-warehouse-with-thousands
  q: Design a Text-to-SQL system over a warehouse with thousands of tables.
  a: >
    The model cannot see thousands of tables at once, so retrieve the relevant schema: index table
    and column descriptions, comments, sample values, popular joins and past validated queries, and
    select the few tables relevant to the question. A semantic layer with curated metrics and
    definitions helps more than raw schemas.


    Generate SQL with the retrieved schema and examples, validate it by parsing, checking tables and
    permissions, running a dry-run with limits and timeouts on a read-only role, and repair errors
    in a loop. Show the SQL and results to the user, and evaluate on a set of questions with known
    correct results, measuring execution accuracy.
