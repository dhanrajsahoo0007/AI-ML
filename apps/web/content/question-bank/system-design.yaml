# Company-reported questions adapted from Outcome School (Apache 2.0); see NOTICE.md. Answers are our own.
- id: design-an-enterprise-rag-assistant-over-10m-documents-with-p
  q: Design an enterprise RAG assistant over 10M documents with per-user permissions.
  a: >
    Connectors ingest from each source with permission sync; documents are parsed layout-aware,
    chunked by structure, embedded and stored in a sharded vector index plus a keyword index, every
    chunk tagged with source, timestamps and access-control lists. Queries are rewritten into
    standalone search queries, run through hybrid search filtered by the user's identity and groups,
    re-ranked, and answered by an LLM with citations and an "I don't know" path.


    Around it: incremental re-indexing from change events, caching of popular queries per permission
    scope, evaluation sets per department with retrieval and faithfulness metrics, tracing and
    feedback, and guardrails against prompt injection in documents. Scale the index by sharding and
    compressing vectors, and keep latency under a few seconds with parallel retrieval and streaming.
  topic: system-design
  level: Senior
  companies:
    - Amazon
    - Databricks
