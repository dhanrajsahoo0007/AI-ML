- id: design-a-copilot-feature-that-answers-questions-over-a-user
  q: >-
    Design a Copilot feature that answers questions over a user's work email, documents and
    meetings, without ever leaking content the user can't access.
  a: >
    Retrieve from email, documents and meeting transcripts through the existing graph and search
    APIs using the user's own delegated permissions, so the system can only see what the user can
    see. Results are ranked across sources, and the LLM answers with citations to the exact items.


    Guard against leaks: no shared caches across users, permission checks at retrieval time and
    again at display time, sensitivity labels honored, prompt injection in emails treated as
    untrusted data, and no training on user content. Test with users of different access levels and
    audit access.
  topic: system-design
  level: Senior
  companies:
    - Microsoft
  related: /ai-system-design/genai-system-design/rag-fundamentals
