- id: design-dynamic-pricing-surge-for-a-two-sided-marketplace-and
  q: >-
    Design dynamic pricing / surge for a two-sided marketplace and describe the feedback loops that
    can go wrong.
  a: >
    Forecast short-term demand and supply per area and time window, then set a price multiplier that
    balances them: enough to bring drivers to busy areas and reduce excess demand, without pricing
    out riders. Models estimate how riders and drivers respond to price, and a controller adjusts
    prices frequently with caps and smoothing.


    Feedback loops can go wrong: surge moves drivers away from other areas, creating new shortages;
    drivers may wait for surge before logging on; oscillations from over-reacting controllers; and
    fairness and regulatory concerns. Test with switchback experiments and simulation, and monitor
    reliability and fairness metrics.
  topic: system-design
  level: Senior
  companies:
    - Consumer-Scale ML
  related: /interviews/ml-system-design-interview
  source: outcome-school
- id: design-a-visual-search-system-user-uploads-an-image-you-retu
  q: >-
    Design a visual search system: user uploads an image, you return visually similar in-catalogue
    items.
  a: >
    Detect and crop the main product in the uploaded image, embed it with a vision model fine-tuned
    on product images, and search an ANN index of catalog image embeddings filtered by category and
    availability. Re-rank with a more precise model and business signals such as stock and price.


    Evaluate with recall at k on labeled pairs of user photos and products, handle cluttered photos
    and different angles with training data that includes them, and measure online engagement and
    purchases from visual search.
  topic: system-design
