- id: design-the-serving-system-for-a-multimodal-assistant-text-im
  q: >-
    Design the serving system for a multimodal assistant (text + image in, streaming text out) at
    hundreds of millions of users.
  a: >
    Separate image processing from text generation: images are uploaded to object storage,
    preprocessed and encoded by a vision encoder service on its own GPU pool, and the resulting
    visual tokens or embeddings are passed to the LLM serving tier, which streams text back. Cache
    encodings by image hash, since users often ask several questions about the same image.


    Budget tokens by resizing images to the needed resolution, batch vision encoding separately from
    decoding, route by request type to different model sizes, and apply safety classifiers to images
    and text. Scale each tier independently based on its own load.
  topic: system-design
  level: Senior
  companies:
    - Google DeepMind
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-a-personalised-recommendation-system-for-rental-listi
  q: >-
    Design a personalised recommendation system for rental listings using demographics, property
    metadata, amenities, price, reviews and location.
  a: >
    Candidate generation filters by hard constraints such as location, dates, price range and
    capacity, then retrieves listings with embedding similarity to the user's search and past
    interactions. A ranking model scores candidates with listing features (price, amenities,
    reviews, photos quality, location), user features and preferences, context such as trip type,
    and predicted booking probability.


    Handle cold start for new listings with content features and boosted exploration, avoid using
    demographics in ways that discriminate, debias for position, and evaluate with offline ranking
    metrics and online booking conversion and host-side fairness.
  topic: system-design
  level: Senior
  companies:
    - Google DeepMind
  related: /ai-system-design/genai-system-design/recommendation-systems
  source: outcome-school
- id: design-a-classifier-that-predicts-the-optimal-moment-to-inse
  q: Design a classifier that predicts the optimal moment to insert a commercial break in a video.
  a: >
    Frame it as scoring candidate moments: segment the video into shots and scenes, extract features
    such as audio silence, scene changes, dialogue pauses, visual motion and narrative cues from
    transcripts, and predict for each candidate point the impact of a break, using labels from
    editors' chosen break points or from viewer retention data around past breaks.


    Optimize for retention and ad completion, not just plausibility, enforce constraints such as
    minimum spacing and no breaks mid-sentence, and evaluate with offline agreement with editors and
    online A/B tests on abandonment and ad performance.
  topic: system-design
  level: Mid
  companies:
    - Google DeepMind
  related: /interviews/ml-system-design-interview
  source: outcome-school
- id: how-would-you-improve-product-search-results-focusing-on-the
  q: >-
    How would you improve product search results, focusing on the fraction of relevant documents
    retrieved (recall)?
  a: >
    Measure recall first with judged queries and analysis of zero-result and low-result queries.
    Improve candidate retrieval: add dense retrieval alongside keyword search, query expansion with
    synonyms and spelling correction, attribute extraction to match structured fields, and
    multilingual handling, then fuse the candidate sets.


    Increase candidate depth before ranking and make sure filters are not too strict. Check that
    improvements in recall do not hurt precision at the top, which the re-ranker should protect, and
    confirm with online metrics such as fewer reformulations and zero-result searches.
  topic: system-design
