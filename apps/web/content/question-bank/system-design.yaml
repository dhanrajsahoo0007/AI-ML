- id: design-a-podcast-search-engine-with-transcript-indexing-desi
  q: >-
    Design a podcast search engine with transcript indexing. / Design a recommendation algorithm for
    type-ahead search.
  a: >
    Transcribe episodes with ASR, diarize and chunk transcripts with timestamps, and index chunks in
    keyword and vector indexes with episode metadata. Search returns episodes and jump-to moments,
    ranked by relevance, popularity and freshness, with snippets from the transcript.


    For type-ahead, build a prefix index of popular queries, titles and entities, ranked by query
    frequency, personalization and recency, served from memory with very low latency, and learn from
    what users select.
  topic: system-design
  level: Mid
