- id: you-have-dozens-of-ranking-signals-and-a-brand-new-tenant-wi
  q: >-
    You have dozens of ranking signals and a brand-new tenant with zero interaction data. How do you
    rank, and how do you improve?
  a: >
    Start with a ranker trained across other tenants on signals that transfer, such as text
    relevance, freshness, authority and graph signals, and avoid tenant-specific features that need
    interaction data. Use sensible priors and the knowledge graph from the new tenant's own
    structure.


    As interactions accumulate, add tenant-specific adaptation, such as fine-tuning or reweighting
    features, with exploration to collect unbiased feedback. Monitor click-through and successful
    search rates from day one to see when the tenant model beats the generic one.
  topic: system-design
  level: Senior
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/search-ranking-system
  source: outcome-school
- id: design-discovery-and-search-across-millions-of-user-created
  q: Design discovery and search across millions of user-created characters.
  a: >
    Index characters by name, description, greeting and tags, plus embeddings of their definitions
    and conversation style, with keyword and semantic search. Discovery uses a recommendation
    system: candidates from user history, similar characters and trending ones, ranked by predicted
    engagement quality, not just clicks.


    Apply safety filtering and age-appropriate rules to what is shown, handle duplicates and spam,
    support cold-start for new characters with content embeddings and exploration, and evaluate with
    search success and retention.
  topic: system-design
  level: Senior
  companies:
    - Character.AI
  related: /ai-system-design/genai-system-design/recommendation-systems
  source: outcome-school
- id: walk-me-through-writing-a-finished-note-back-into-epic-what
  q: Walk me through writing a finished note back into Epic. What goes wrong?
  a: >
    After the clinician signs the note, write it to the correct patient encounter through the EHR's
    supported integration (FHIR APIs or vendor-specific interfaces), mapping sections to the right
    note types and fields and keeping formatting the EHR can display.


    Things that go wrong: wrong patient or encounter matching, API rate limits and outages,
    formatting lost or mangled, duplicate writes on retries, notes edited in the EHR after
    write-back causing conflicts, and permissions or workflow differences between hospitals. Use
    idempotent writes, verification after writing, retries with alerts and per-site configuration.
  topic: system-design
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/kg-healthcare-case-study
  source: outcome-school
- id: design-the-teleoperation-data-pipeline-why-is-data-collectio
  q: >-
    Design the teleoperation data pipeline. Why is data collection the bottleneck in robotics rather
    than compute?
  a: >
    Operators control robots through teleoperation rigs, recording synchronized camera streams,
    joint states, actions and task metadata. Data flows through upload, validation of
    synchronization and completeness, quality scoring, annotation of success and segments, and into
    versioned datasets for training.


    Data is the bottleneck because, unlike text and images, there is no internet-scale corpus of
    robot actions: every demonstration costs real robot time and human operator time, scales
    linearly with effort, and must cover many objects, environments and failure recoveries. Compute
    is comparatively easy to buy.
  topic: system-design
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: you-have-10-hours-of-demonstrations-for-a-new-task-and-budge
  q: >-
    You have 10 hours of demonstrations for a new task and budget for 50 more. How do you decide
    what to collect, and what return do you expect?
  a: >
    Train on the existing 10 hours and evaluate to find where the policy fails: specific object
    variations, positions, lighting or recovery situations. Collect the next 50 hours targeted at
    those failure modes and at diversity, rather than more of what already works, including recovery
    demonstrations from imperfect states.


    Expect diminishing returns: success rate typically rises steeply at first and then flattens, so
    measure after each batch and stop or redirect collection when gains slow.
  topic: system-design
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: you-have-hundreds-of-millions-of-fleet-miles-how-do-you-find
  q: >-
    You have hundreds of millions of fleet miles. How do you find and use the rare scenarios that
    matter?
  a: >
    Mine logs with automated triggers and queries: model uncertainty and disagreement,
    interventions, hard braking, near-misses, rare object classes, and embedding-based similarity
    search for scenarios like a known rare case. Index scenarios by structured attributes and
    learned embeddings so they can be searched.


    Use found scenarios to build targeted training sets, evaluation suites and simulation variants
    that multiply each rare case into many perturbations. Track coverage of the scenario taxonomy
    over time.
  topic: system-design
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-a-system-that-finds-driving-segments-similar-to-a-giv
  q: >-
    Design a system that finds driving segments similar to a given one across the entire fleet
    archive.
  a: >
    Encode each driving segment into embeddings from sensor data and scene representations, such as
    agent trajectories, map context and camera features, using a model trained so similar scenarios
    are close. Store embeddings in a large-scale ANN index with metadata such as location, time,
    weather and road type.


    Queries embed the given segment and search the index with metadata filters, then re-rank with
    finer-grained comparisons of trajectories and interactions. Evaluate with labeled scenario pairs
    and user feedback from engineers.
  topic: system-design
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/vector-databases
  source: outcome-school
- id: you-are-opening-in-a-new-city-structure-the-safety-case
  q: You are opening in a new city. Structure the safety case.
  a: >
    Define the operational design domain for the city: roads, speeds, weather, traffic rules and
    unique features. Show the system handles it: map and validate the area, collect data on local
    behaviors, run simulation with city-specific scenarios, do closed-course and supervised testing,
    and compare safety metrics against human-driver baselines for that area.


    Structure the argument: hazards identified, mitigations, evidence for each, residual risks and
    monitoring after launch, with staged rollout from supervised driving to limited driverless
    service, and engagement with local regulators and first responders.
  topic: system-design
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: your-platform-must-support-multiple-llm-providers-including
  q: >-
    Your platform must support multiple LLM providers, including deployments in restricted
    environments where only some models are available. How do you architect model selection?
  a: >
    Put a model abstraction layer between applications and providers, with a capability registry
    describing each model's features, quality on internal evaluations, cost and which environments
    it is approved for. Workflows declare required capabilities, and a selection policy picks the
    best allowed model per deployment.


    Keep prompts and tools portable, validate every workflow against each allowed model with the
    evaluation suite, and provide fallbacks when the preferred model is unavailable. In restricted
    environments, only approved models are installed and selectable.
  topic: system-design
  level: Senior
  companies:
    - Palantir
  related: /ai-system-design/genai-system-design/cost-latency-optimization
