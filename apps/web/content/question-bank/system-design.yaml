    - NVIDIA
  related: /ai-system-design/genai-system-design/search-ranking-system
  source: outcome-school
- id: design-the-data-engine-fleet-triggers-upload-labelling-retra
  q: >-
    Design the data engine: fleet triggers → upload → labelling → retraining → shadow-mode
    validation → release.
  a: >
    Vehicles run triggers that detect interesting situations: model uncertainty, disagreement
    between models, driver interventions, rare object classes, specific scenario queries. Matching
    clips are uploaded under bandwidth budgets, auto-labeled with large offline models and human
    review for hard cases, and added to curated training sets, balanced toward weak areas.


    Retrained models are evaluated on regression suites and scenario sets, run in shadow mode in the
    fleet to compare predictions without controlling the car, and released gradually when metrics
    improve. The loop repeats, targeting the next weakness.
  topic: system-design
  level: Senior
  companies:
    - Tesla
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
