- id: design-a-recommendation-system-for-facebook-ads-and-an-evalu
  q: Design a recommendation system for Facebook Ads, and an evaluation framework for ads ranking.
  a: >
    Retrieve eligible ads by targeting and budget, then predict click and conversion probabilities
    with deep models over user, ad and context features. Ads are ranked by expected value, bid times
    predicted conversion probability plus a quality score, inside an auction, so calibrated
    probabilities matter.


    Evaluation: offline log loss, calibration and AUC by segment; online A/B tests on advertiser
    value, revenue, user experience metrics such as hides, and long-term effects through holdouts.
    Watch for feedback loops and position bias, and monitor calibration drift after deployment.
  topic: system-design
  level: Senior
  companies:
    - Meta
  related: /ai-system-design/genai-system-design/recommendation-systems
  source: outcome-school
- id: design-the-ml-components-behind-an-instagram-story-feature
  q: Design the ML components behind an Instagram Story feature.
  a: >
    Ranking of the story tray: predict which accounts' stories the user is most likely to view and
    engage with, using relationship strength, past viewing, recency and content features. Within
    stories, models handle content understanding for integrity, sticker and music suggestions, and
    ranking of replies or reactions.


    Add safety classifiers on uploads, notifications ranking, and creative tools such as background
    removal or effects. Evaluate tray ranking with view-through and reply rates, and test changes
    with A/B experiments.
  topic: system-design
  level: Mid
  companies:
    - Meta
  related: /ai-system-design/genai-system-design/recommendation-systems
  source: outcome-school
- id: design-an-end-to-end-classification-pipeline-for-marketplace
  q: Design an end-to-end classification pipeline for Marketplace listings.
  a: >
    Classify listings into categories and policy labels using text from title and description, image
    embeddings and seller signals, with a multimodal model, possibly starting with zero-shot LLM
    labels to bootstrap training data. Training data comes from seller-chosen categories, cleaned
    with human review.


    Serve predictions at listing time to suggest categories and flag violations, route
    low-confidence or high-risk items to review, and retrain on corrections. Monitor per-category
    precision and recall, drift as new product types appear, and seller override rates.
  topic: system-design
