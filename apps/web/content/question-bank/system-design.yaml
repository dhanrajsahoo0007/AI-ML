- id: design-a-code-assistant-repo-indexing-context-assembly-edit
  q: "Design a code assistant: repo indexing, context assembly, edit application, evaluation."
  a: >
    Indexing: parse the repository into files, symbols and a dependency graph, embed chunks at
    function or class level, keep a keyword index for identifiers, and update incrementally on file
    changes. Context assembly: combine the open file and cursor position, recently edited files,
    symbol definitions and references, retrieved similar code, and repository conventions, ranked
    and trimmed to a token budget.


    Edit application: have the model output diffs or targeted replacements rather than whole files,
    apply them with a fast merge that tolerates small mismatches, then run formatters, type checks
    and tests. Evaluation: offline tasks with hidden tests and edit-match metrics, plus online
    acceptance and retention rates of suggestions, latency and user undo rates.
