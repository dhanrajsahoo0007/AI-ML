      url: https://outcomeschool.com/blog/reinforcement-learning-from-human-feedback-rlhf
  source: outcome-school
- id: design-a-private-llm-benchmark-and-leaderboard-seal-style-ho
  q: >-
    Design a private LLM benchmark and leaderboard (SEAL-style). How do you keep it trustworthy as
    labs optimise against it?
  a: >
    Keep test sets private and never released, written by experts, refreshed regularly, and
    evaluated through controlled access so labs cannot see or train on the items. Use rigorous
    grading with expert rubrics and multiple raters, report confidence intervals, and document
    methods.


    To stay trustworthy as labs optimize against it: rotate and expand items, monitor for suspicious
    jumps, limit the number of submissions, test robustness with paraphrased variants, and keep
    governance independent from any lab.
  topic: system-design
  level: Senior
  companies:
    - Scale AI
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: design-an-answer-engine-a-user-types-a-question-and-gets-a-c
  q: >-
    Design an answer engine: a user types a question and gets a cited, streamed answer. Your
    end-to-end budget is 3 seconds to a complete short answer.
  a: >
    Budget: query understanding and rewriting about 100 ms, parallel retrieval from web indexes and
    live search 300–600 ms, fetching and extracting page content about 300 ms, re-ranking 100–200
    ms, then LLM generation with streaming starting around 1.2–1.5 seconds and a short answer
    completing before 3 seconds.


    Stream the answer with citations as it is generated, cache popular queries and fetched pages,
    use a fast model for short answers and a stronger one for complex queries, and verify citations.
    Evaluate answer quality and latency percentiles continuously.
  topic: system-design
  level: Senior
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: design-the-retrieval-pipeline-pulling-from-100b-web-pages-wi
  q: >-
    Design the retrieval pipeline pulling from 100B web pages with sub-second latency and freshness
    guarantees.
  a: >
    Crawl continuously with priorities by page importance and change rate, so news and popular pages
    refresh in minutes while the long tail refreshes slowly. Process pages into text, deduplicate,
    score quality and build a sharded inverted index plus a dense index over a subset or over
    chunks, with tiered storage keeping the most useful content in memory.


    Queries fan out to shards in parallel with strict timeouts, results merge and re-rank, and a
    separate real-time index handles very fresh content. Freshness guarantees are monitored per
    source tier, and latency is controlled with caching and tail-latency techniques.
  topic: system-design
  level: Senior
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/search-ranking-system
  source: outcome-school
- id: design-the-ranking-system-combining-bm25-dense-retrieval-and
  q: >-
    Design the ranking system combining BM25, dense retrieval and LLM reranking across multiple
    indexes.
  a: >
    Retrieve candidates from each index with BM25 and dense retrieval in parallel, merge with
    reciprocal rank fusion or a learned fusion model using features such as scores, source quality
    and freshness, then apply a cross-encoder to the top few hundred and an LLM re-ranker to the top
    few dozen where precision matters most.


    Calibrate scores across indexes, keep latency budgets per stage, use the LLM re-ranker
    selectively based on query difficulty, and train fusion and re-ranking on judged and behavioral
    data. Evaluate with nDCG and answer quality downstream.
  topic: system-design
  level: Senior
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/advanced-rag
  refs:
    - title: How does Hybrid Search work?
      url: https://outcomeschool.com/blog/how-does-hybrid-search-work
    - title: How does a Reranker work?
      url: https://outcomeschool.com/blog/how-does-a-reranker-work
  source: outcome-school
- id: design-comet-s-hybrid-browser-architecture-combining-on-devi
  q: Design Comet's hybrid browser architecture combining on-device privacy with cloud AI assistance.
  a: >
    Keep browsing data, history and page contents local by default, with on-device processing for
    indexing personal history, simple summaries and privacy-sensitive tasks. Send to the cloud only
    what a task needs, with user consent, for heavy reasoning and agentic actions, and avoid
    retaining it.


    The browser agent acts on pages with user-visible actions and confirmations for purchases or
    form submissions, treats page content as untrusted to resist prompt injection, and isolates
    credentials. Evaluate privacy flows, injection resistance and task success.
  topic: system-design
  level: Senior
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: how-does-an-answer-engine-handle-breaking-news-a-query-about
  q: >-
    How does an answer engine handle breaking news: a query about something that happened 20 minutes
    ago?
  a: >
    Detect time-sensitive queries, then query a real-time index fed by news feeds, social posts and
    frequently recrawled news sites, plus live search APIs, rather than the main index. Rank by
    recency and source credibility, and fetch the latest versions of pages.


    The answer should state what is known so far with timestamps, cite multiple credible sources,
    flag uncertainty and conflicting reports, and avoid speculation. Refresh cached answers quickly
    as the story develops.
  topic: system-design
  level: Senior
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: design-cursor-s-tab-next-edit-prediction-system-it-must-feel
  q: >-
    Design Cursor's tab (next-edit prediction) system: it must feel instant (sub-100 ms perceived
    latency) for millions of daily users.
  a: >
    Use a small, specialized model trained on edit sequences to predict the next edit given recent
    edits, cursor position and nearby code. Keep context compact, use speculative decoding with the
    existing code as the draft since most output repeats it, and run on optimized inference near the
    user with high batch efficiency.


    Hide latency with debouncing, prefetching likely next predictions, caching, cancelling stale
    requests and showing suggestions only when confident. Measure acceptance rate, perceived latency
    at p95 and cost per user.
  topic: system-design
  level: Senior
  companies:
    - Cursor
  related: /ai-system-design/genai-system-design/llm-serving-inference
  refs:
    - title: How does Cursor work?
      url: https://outcomeschool.com/blog/how-does-cursor-work
  source: outcome-school
- id: how-would-you-index-a-100k-file-monorepo-so-an-ai-editor-can
  q: >-
    How would you index a 100k-file monorepo so an AI editor can retrieve relevant context, and keep
    the index fresh as the user edits?
  a: >
    Chunk code at function and class boundaries, embed chunks, build keyword and symbol indexes
    (definitions, references, imports) and a dependency graph, stored with file paths and hashes.
    Use a Merkle tree of file hashes so changes are detected quickly and only changed files are
    re-indexed.


    As the user edits, update the local view immediately and re-embed changed chunks in the
    background. Retrieval combines semantic search, symbol lookup and graph expansion from the
    current file, with ranking by recency of edits and proximity.
  topic: system-design
  level: Senior
  companies:
    - Cursor
  related: /ai-system-design/genai-system-design/advanced-rag
  refs:
    - title: How does Cursor work?
      url: https://outcomeschool.com/blog/how-does-cursor-work
  source: outcome-school
- id: the-model-is-streaming-a-multi-file-edit-while-the-user-keep
  q: >-
    The model is streaming a multi-file edit while the user keeps typing in one of those files. How
    do you apply the edits without corrupting the buffer?
  a: >
    Never write the model's output directly into a buffer the user is editing. Express edits as
    patches anchored to content and positions in a known base version, and when applying, rebase
    them onto the current buffer: transform positions through the user's intervening edits, as in
    operational transforms, or re-match anchor text.


    If an edit conflicts with the user's typing in the same region, do not apply it silently; show
    it as a suggestion or conflict to resolve. Apply edits as undoable transactions per file.
  topic: system-design
  level: Senior
  companies:
    - Cursor
