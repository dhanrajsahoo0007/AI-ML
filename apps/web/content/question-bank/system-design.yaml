- id: design-an-agent-that-can-take-actions-in-a-spreadsheet-inser
  q: >-
    Design an agent that can take actions in a spreadsheet (“insert a pivot table of Q3 sales by
    region”): orchestration, tools and failure handling.
  a: >
    Give the agent a structured view of the workbook (sheets, table ranges, headers, data types and
    sample values) and a set of typed tools: read range, create pivot table, add formula, format,
    insert chart. The model plans the operations, calls tools with explicit ranges and fields, and
    the app executes them through the spreadsheet engine's API.


    Handle failures by validating references before execution, previewing changes, applying them as
    a single undoable transaction, and reporting what changed. Ask clarifying questions when columns
    are ambiguous, and evaluate on a suite of real spreadsheet tasks by checking the resulting
    workbook state.
  topic: system-design
  level: Senior
  companies:
    - Microsoft
  related: /ai-system-design/genai-system-design/tool-use-and-mcp
  source: outcome-school
- id: design-a-multi-tenant-inference-platform-that-serves-many-fo
  q: >-
    Design a multi-tenant inference platform that serves many foundation models to thousands of
    customers (Bedrock-shaped).
  a: >
    A control plane manages models, versions, quotas, pricing and customer configuration; a data
    plane runs pools of inference engines per model with continuous batching, autoscaling and
    placement across GPU types. A gateway handles authentication, per-customer rate limits by
    tokens, routing and metering.


    Isolation: customer data is never used for training, requests are encrypted, logs are
    access-controlled, and provisioned throughput gives dedicated capacity to customers who need
    guarantees. Multi-tenancy needs fairness and noisy-neighbor protection, per-tenant cost
    attribution, model lifecycle management and region-level deployment for data residency.
  topic: system-design
  level: Senior
  companies:
    - Amazon
  related: /ai-system-design/genai-system-design/llm-serving-inference
  source: outcome-school
- id: how-would-you-design-a-recommendation-system-to-suggest-book
  q: >-
    How would you design a recommendation system to suggest books to users? How would you model a
    warehouse inventory problem?
  a: >
    Combine item-to-item collaborative filtering ("readers also bought"), content features from
    genre, author and text embeddings for new books, and a ranking model using purchase history,
    ratings and browsing context, with diversity and freshness in re-ranking. Evaluate offline with
    recall and nDCG on held-out purchases and online with conversion.


    For warehouse inventory, model demand per item and location with forecasting (seasonality,
    trends, promotions), then decide stock levels with an inventory policy that balances holding
    costs against stockout costs, often optimizing a service-level target with safety stock based on
    forecast uncertainty and lead times.
  topic: system-design
  level: Mid
  companies:
    - Amazon
  related: /ai-system-design/genai-system-design/recommendation-systems
  source: outcome-school
- id: design-the-routing-layer-that-decides-whether-a-user-request
  q: >-
    Design the routing layer that decides whether a user request is handled on-device, by a
    first-party server model, or by a third-party model.
  a: >
    A small on-device classifier estimates the request's difficulty, privacy sensitivity and
    required capabilities. Simple, private or latency-critical requests stay on device; harder ones
    go to first-party server models in a privacy-preserving cloud; requests needing broad world
    knowledge or capabilities beyond first-party models go to a third-party model only with explicit
    user consent.


    Keep personal context on device where possible and send the minimum needed, fall back gracefully
    when offline, and evaluate routing with quality, latency, cost and privacy metrics on labeled
    requests. Make the routing policy updatable without shipping new models.
  topic: system-design
  level: Senior
