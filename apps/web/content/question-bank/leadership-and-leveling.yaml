# Senior, Staff+, Principal and Engineering Manager behavioral questions. All answers are written by TokensToScale.
- id: leveling-technical-strategy-multi-quarter
  q: Tell me about a time you identified a systemic architectural bottleneck or technical risk before leadership asked you to, and drove a multi-team plan to fix it.
  level: Senior
  category: leadership-and-leveling
  subcategory: technical-direction
  signals:
    - strategy
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
    - /behavioral/leveling-and-tracks/junior-to-senior-leveling
  a: |-
    **What it tests.** Whether you find large problems before they hurt and can move several teams to fix them. The interviewer listens for the evidence you used, a plan in steps and how you helped other engineers do it. It is hardest at staff level, where nobody asked you and you had no authority over the other teams.

    **How to shape the answer.**

    - **Situation and task.** Say what you saw, the data behind it and when it would have failed.
    - **Action.** Describe the written proposal, the staged plan and how you won over each team.
    - **Result.** Give progress in numbers, including what is unfinished.
    - **Learning.** Say what you would do earlier or differently.

    **A strong answer sounds like this.** "Our main database was at 62 percent of write capacity and growing 4 percent a month. I projected we would hit the limit in nine months, before the holiday peak. Nobody had asked. I wrote a proposal that rejected a full rewrite and split the work into four steps, each useful alone. The first moved audit logs out and bought five months. Six teams owned tables, so I built a migration library and held weekly office hours. Fourteen engineers used it. A year on, three steps are done and write load is at 41 percent. The fourth slipped a quarter because I approached one team too late."

    **Watch out for.** A problem your manager handed you, a big rewrite with no value until the end, and a plan where you did all the migration work yourself.
  followUps:
    - q: How did you convince teams that had their own roadmaps?
      level: Senior
      a: |-
        Say what each team gained or avoided, and how you made their part cheap with tools and help. Mention one team that said no at first and what changed their answer. A push from above alone is a weaker story.
    - q: Why not a full rewrite?
      level: Senior
      a: |-
        Explain the risk: a long period with no value, a frozen roadmap and one big cutover. Then say what the staged plan cost in exchange, such as running two paths for a while. Show that you weighed both honestly.
    - q: How did you know your projection was right?
      level: Senior
      a: |-
        Give the data and the assumptions, and say how you checked them against real growth each month. If the forecast was off, say by how much and how the plan changed.
- id: leveling-mentorship-struggling-engineer
  q: Tell me about a time you mentored an engineer who was struggling or helped uplevel a teammate to the next career level.
  level: Senior
  category: leadership-and-leveling
  subcategory: mentorship-hiring
  signals:
    - mentoring
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
    - /behavioral/amazon-leadership-principles/hire-develop-and-best-employer
  a: |-
    **What it tests.** Whether you find out why someone is struggling before you try to fix it, and whether they grew or you just did their work. The interviewer listens for a diagnosis, a plan that hands responsibility back in steps, and proof of change. At senior level the proof is what the person did later without you.

    **How to shape the answer.**

    - **Situation and task.** Say who the person was, what the signs were and your role.
    - **Action.** Give your diagnosis, then the steps: pairing, then review, then stepping back.
    - **Result.** Give evidence of growth, with numbers or a milestone.
    - **Learning.** Say what you changed in how you onboard or coach.

    **A strong answer sounds like this.** "An engineer on my frontend team was six months in, and her pull requests took about nine days to merge. I asked how she worked. She spent two or three days stuck before asking anyone, because she thought asking looked weak. Her skills were fine. We agreed on a rule: 45 minutes stuck, then ask. I paired with her on one feature, reviewed her design before she coded the next, and only reviewed the final code on the third. In three months her merge time fell to three days. She later led our form library upgrade alone. I now give every new joiner that rule in week one."

    **Watch out for.** Taking over the person's tasks, describing them unkindly, and a story that ends with your effort and no change in them.
  followUps:
    - q: How did you find out what the real problem was?
      level: Senior
      a: |-
        Say what you asked and what you looked at, such as their pull requests and how long tasks sat. Separate a skill gap from a habit or a fear. The diagnosis is the main thing the interviewer grades.
    - q: What if the person had not improved?
      level: Senior
      a: |-
        Say you would give clear, written expectations with a time frame, bring their manager in early and stay honest with the person. Some cases do not end well, and saying so with a fair process shows maturity.
    - q: How did you find the time for this next to your own work?
      level: Senior
      a: |-
        Give the hours per week and what you moved to make room. Say that your manager knew. Mentoring that is hidden from your plan tends to stop after two weeks.
- id: leveling-operational-excellence-oncall-burnout
  q: Describe a time when your team was suffering from heavy operational toil, flaky CI/CD, or on-call burnout. How did you turn it around while still shipping product features?
  level: Senior
  category: leadership-and-leveling
  subcategory: team-health-process
  signals:
    - delivery
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
    - /behavioral/competencies/tight-deadlines-and-tech-debt
  a: |-
    **What it tests.** Whether you fix the causes of operational pain with data and still deliver. The interviewer listens for how you measured the toil, what you fixed first and how you agreed on time for it with product. At senior level, adding checklists or asking people to cope is a weak answer.

    **How to shape the answer.**

    - **Situation and task.** Give the pain in numbers: pages per week, failed builds, people affected.
    - **Action.** Show the analysis by cause, the top fixes and the deal you made for time.
    - **Result.** Give the same numbers afterwards, and what happened to feature delivery.
    - **Learning.** Say how you keep it from returning.

    **A strong answer sounds like this.** "I led a team of seven that ran our order service. We had 31 pages a week, 12 of them at night, and two people had asked to leave the rota. I grouped 60 days of pages by cause. Three causes made 74 percent of them: a noisy disk alert, a retry storm from one client and a slow nightly job. We deleted or retuned nine alerts in the first week. I asked product for 20 percent of each sprint for two months and showed what the pages cost in lost days. Pages fell to 9 a week. We shipped one feature fewer that quarter. Nobody left the rota."

    **Watch out for.** More process as the fix, a turnaround with no numbers before and after, and hiding the cost to the roadmap.
  followUps:
    - q: How did you get product to agree to the reliability time?
      level: Senior
      a: |-
        Say you showed the cost in their terms: days lost to interruptions and features delayed. You asked for a fixed share for a fixed period, with a result to check at the end. A bounded request is easier to accept.
    - q: Which alerts did you delete, and how did you know it was safe?
      level: Senior
      a: |-
        Explain the test: an alert stays if someone must act on it now. For each one removed, you checked the last times it fired and whether any action followed. Mention one alert you kept after checking.
    - q: How do you stop the toil from coming back?
      level: Senior
      a: |-
        Name the routine: a weekly review of pages, a target such as fewer than two night pages per shift, and a rule that every new alert links to a runbook. Say who owns the review.
- id: leveling-killing-sunk-cost-project
  q: Tell me about a time you advocated to cancel, pivot, or sunset a project that your team had already invested significant time into.
  level: Senior
  category: leadership-and-leveling
  subcategory: org-alignment
  signals:
    - strategy
    - influence
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
    - /behavioral/competencies/influence-without-authority
  a: |-
    **What it tests.** Whether you can argue to stop work that your own team has invested in. The interviewer listens for the evidence, how you raised it, what you saved from the project and how you treated the people who built it. At senior level the courage is expected. The care with people is what sets an answer apart.

    **How to shape the answer.**

    - **Situation and task.** Say what the project was, how much was spent and what changed.
    - **Action.** Give the evidence, who you took it to and the options you offered.
    - **Result.** Give the decision, what was reused and the time saved or lost.
    - **Learning.** Say what check would have shown it earlier.

    **A strong answer sounds like this.** "My data platform team of four had spent five months building our own pipeline scheduler. We started because no existing tool handled our data-quality gates. In month five an open-source scheduler added that feature. I ran a one-week trial and it covered 80 percent of our needs. Finishing ours needed about six more months. I wrote a two-page comparison and proposed that we stop. Two engineers disagreed strongly, and my director asked for a second trial, which cost three weeks. We switched. Our quality-check library moved over almost unchanged, and the write-up named who built it. I should have set a review date at month two."

    **Watch out for.** A project that was obviously failing, a decision pushed through without hearing the builders, and nothing reused or learned.
  followUps:
    - q: How did the people who built it take the news?
      level: Senior
      a: |-
        Be honest about the reaction. Say what you did: you told them first and in person, credited their work in the write-up and gave them a leading part in the replacement. Do not claim that everyone was happy.
    - q: What evidence would have made you keep going?
      level: Senior
      a: |-
        Name it, for example a trial that covered less than half of your needs, or a migration cost above the cost to finish. This shows that you weighed both options and did not simply prefer the new tool.
    - q: Should the project have started at all?
      level: Senior
      a: |-
        Take a position. Often the start was reasonable with what was known, and the miss was having no checkpoint. Say what you now put in every project plan: a date and a condition for review.
- id: leveling-forward-deployed-and-live-recovery
  q: Tell me about a time a live customer deployment, executive demo, or high-stakes alignment conversation started going off the rails, and how you recovered and generalized the solution.
  level: Senior
  category: leadership-and-leveling
  subcategory: org-alignment
  signals:
    - strategy
    - influence
  topics:
    - /behavioral/leveling-and-tracks/forward-deployed-and-solutions
    - /behavioral/leveling-and-tracks/red-flags-and-recovery
  a: |-
    **What it tests.** Calm under live pressure, and judgment about what to build next. The interviewer listens for how you found the real failure in front of the customer without bluffing, the quick fix, and how you turned a one-off fix into something every customer gets. At senior level the last part matters most.

    **How to shape the answer.**

    - **Situation and task.** Say what was at stake, who was in the room and what went wrong.
    - **Action.** Say what you said in the moment, how you found the cause and the short-term fix.
    - **Result.** Give the outcome for the customer and what went into the core product.
    - **Learning.** Say what you check before the next go-live.

    **A strong answer sounds like this.** "I was on site for the go-live of our routing software at a logistics customer, with their operations director watching. The first import of 40,000 orders failed. I said plainly that I did not know why yet and asked for 30 minutes. I sat with their dispatcher and saw that their export used local date formats and a second address line we had never handled. I wrote an adapter that night, and we went live two days late. Afterwards I proposed import validation with clear error messages for the core product. It shipped six weeks later, and the next five customers used it."

    **Watch out for.** Bluffing in front of the customer, blaming their data, and a custom fix that you still maintain for one customer.
  followUps:
    - q: What exactly did you say to the customer when it failed?
      level: Senior
      a: |-
        Give the words: what happened, what you did not know yet, what you would do next and when you would report back. Then say that you kept to that time. Honesty with a time attached keeps trust.
    - q: How did you decide what went into the core product and what stayed custom?
      level: Senior
      a: |-
        Give your rule, for example that a need seen at two or more customers, or likely at the next ones, belongs in the product. Say how you made the case to the product team with evidence from the field.
    - q: What did the delay cost, and how did you repair the relationship?
      level: Senior
      a: |-
        State the cost honestly: two days, and some lost confidence. Then say what you did: a short written account of the cause, the fix and the new check. Mention any sign that trust returned, such as a renewal.
- id: tell-me-about-a-time-you-mentored-someone-or-improved-your-t
  q: Tell me about a time you mentored someone or improved your team's practices.
  level: Senior
  category: leadership-and-leveling
  subcategory: mentorship-hiring
  signals:
    - mentoring
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Whether your effect goes beyond your own tasks. The interviewer wants to hear what was missing, what you introduced, how you got people to adopt it and what improved. At senior level they expect a change that the team kept using after you stopped pushing it.

    **How to shape the answer.**

    - **Situation and task.** Say what was missing and what it cost the team.
    - **Action.** Say what you introduced, starting small, and how you won people over.
    - **Result.** Give a measure of adoption and a measure of benefit.
    - **Learning.** Say what did not stick and why.

    **A strong answer sounds like this.** "On my team of eight ML engineers, everyone evaluated models on a private test set, so two results could not be compared. Twice we shipped a model that looked better offline and did worse in the A/B test. I built a shared evaluation set of 5,000 examples and a script that prints one report. I used it on my own two projects and showed the reports in review. After six weeks, five engineers were using it, and the team made it a required step before any A/B test. Failed tests fell from about one in three to one in six. My experiment-log template never caught on."

    **Watch out for.** A practice imposed by rule with no agreement, a tool only you used, and no measure of whether the team worked better.
  followUps:
    - q: How did you handle people who did not want to change?
      level: Senior
      a: |-
        Say you asked for their reason first. Often it is cost: the new step slows them down. Describe what you changed to lower that cost, and one person whose objection made the practice better.
    - q: How do you know the improvement came from your change?
      level: Senior
      a: |-
        Compare before and after, and name what else changed in that period. Be modest where you cannot separate the causes. Add a signal such as teammates using the practice without being asked.
    - q: Tell me about one person you mentored through this.
      level: Senior
      a: |-
        Give a short case: what they could not do before, what you did together and what they did alone later. Keep the credit with them. One clear change in one person is stronger than general claims.
- id: how-do-you-ensure-your-work-is-reproducible-and-maintainable
  q: How do you ensure your work is reproducible and maintainable?
  level: Junior
  category: leadership-and-leveling
  subcategory: team-health-process
  signals:
    - delivery
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Working habits. The interviewer wants to know that another person can rerun your work and build on it. For a junior candidate, a few steady habits with one real example are enough: version control, fixed data and settings, tests and a short note on how to run it.

    **How to shape the answer.**

    - **Your habits.** Name three or four: code in version control, settings in a file, data versions recorded, tests for the main logic.
    - **How you check.** Say how you prove it can be rerun, for example from a clean machine.
    - **An example.** One time someone else reran or extended your work.
    - **A limit.** Say what you still find hard.

    **A strong answer sounds like this.** "I keep four habits. All code goes into version control, including notebooks, which I turn into scripts. Every run reads its settings from one file and records the random seed and the date of the data snapshot. I write tests for data loading and the metric code, because errors hide there. And I write a short readme with the exact commands. In my internship I trained a model to detect duplicate listings. Two months after I left, a teammate reran it from the readme in about an hour and got the same F1 score. I am slow at documentation, so I now write the readme first."

    **Watch out for.** A list of tools with no example, results that only run on your laptop, and treating documentation as something to do at the end.
  followUps:
    - q: Has someone failed to reproduce your work? What happened?
      level: Junior
      a: |-
        Tell a real case if you have one: what was missing, such as an unrecorded data filter, and how long it took to find. Then give the habit you added. If it has not happened, describe how you test for it.
    - q: How do you handle data that changes over time?
      level: Junior
      a: |-
        Say you record which snapshot or date range each run used, and keep the query that built the dataset in version control. For large data, you store a version label or a checksum in place of a copy of the files.
    - q: What do you do when a deadline leaves no time for tests?
      level: Junior
      a: |-
        Say you keep the smallest set that protects the result: a check on the data shape and one on the metric. You note what you skipped and return to it. Dropping all checks usually costs more time later.
- id: em-engineer-stayed-below-the-bar
  q: Tell me about an engineer on your team whose work stayed below what the role needed. How did you decide between more coaching and a formal process?
  level: Senior
  category: leadership-and-leveling
  subcategory: people-management
  companies:
    - Netflix
    - Meta
  signals:
    - people-management
    - feedback
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** Whether you deal with low performance early, fairly and with evidence. The interviewer listens for a clear expectation, a real attempt to help, and a decision point you can explain. It gets harder when the person is senior or well liked by the team.

    **How to shape the answer.**

    - **Situation and task.** Give the person's level and the gap, with one or two examples of their work.
    - **Action.** Say what you told them, what support you gave, and the measure and date you set.
    - **Result.** Give the outcome for the person and for the team, even if the person left.
    - **Learning.** Say what you now do sooner.

    **A strong answer sounds like this.** "One of my backend engineers, Arun, needed three or four review rounds on most changes. The team norm was one or two, and two of his projects slipped by three weeks each. I told him plainly in our one-to-one, wrote down what good work looked like, and paired him with a senior engineer for six weeks. Review rounds fell to two, but his estimates were still wrong by half. I then started a formal 60-day plan with two measures. He met one. We agreed a move to the internal tools team. I waited two months too long to be direct."

    **Watch out for.** Calling the person lazy with no examples, a story where you passed the problem to HR and stepped back, and no word on what the team had to carry.
  followUps:
    - q: When did you decide that coaching was not working, and what evidence did you use?
      level: Senior
      companies: [Meta]
      a: |-
        Name the date and the measure. For example, after six weeks of pairing, estimates were still wrong by half on three tasks in a row. The interviewer wants to hear that you set the test before you saw the result, and that the engineer knew what the test was.
    - q: How did it affect the rest of the team?
      level: Senior
      companies: [Netflix, Meta]
      a: |-
        Say what teammates carried, such as extra reviews or rework, and what you did about it. You cannot share the details of a performance process, so explain what you did say. A manager who ignores the cost to the team looks slow to act.
    - q: Tell me about a time your read of a struggling engineer was wrong. What did you miss?
      level: Senior
      companies: [Meta]
      a: |-
        Give a real case. For example, you saw slow delivery as a skill gap, and the cause was unclear requirements or trouble at home. Say how you found out and what you now ask first. Admitting a wrong read shows the judgment the interviewer is checking.
- id: em-let-someone-go
  q: Tell me about a time you let someone go. How did you reach the decision, and how did you handle the day itself?
  level: Senior
  category: leadership-and-leveling
  subcategory: people-management
  companies:
    - Netflix
  signals:
    - people-management
    - feedback
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** Whether you can make and carry out the hardest people decision with care. The interviewer listens for a fair process, a decision you own, and respect for the person on the way out.

    **How to shape the answer.**

    - **Situation and task.** Give the role, the gap and how long it had lasted. Say what the person already knew.
    - **Action.** Say what led to the final decision, whom you involved, and how you ran the conversation.
    - **Result.** Say what happened to the person, to the work and to the team in the weeks after.
    - **Learning.** Say what you would do earlier or differently.

    **A strong answer sounds like this.** "I let go of a mobile engineer, Karan, after five months of missed commitments. He had written goals, weekly check-ins and a 45-day plan, and he met one goal out of four. I made the decision with my director and our HR partner. I told him myself, in a short meeting, with the reason and the terms in the first two minutes. That afternoon I told the team he had left and how his work would be covered. One teammate said it came from nowhere for her. Since then, I tell the team sooner when work is being moved away from someone."

    **Watch out for.** Saying that HR or your manager made the decision, sharing private details about the person, and a story with no warning or support before the exit.
  followUps:
    - q: Did you try to help the person improve first, or did you move straight to an exit?
      level: Senior
      companies: [Netflix]
      a: |-
        Give the timeline in weeks: first direct conversation, written expectations, formal plan, decision. The interviewer checks that the person had a fair chance and that you did not let it run for a year. Say which step you would shorten now.
    - q: How did you tell the rest of the team?
      level: Senior
      a: |-
        Say what you said, when, and what you kept private. A short, factual message on the same day works, with a plan for the open work. Then say how you handled questions in one-to-ones, because that is where people raise their real worries.
    - q: Looking back, could you have saved this person?
      level: Senior
      a: |-
        Answer honestly. Name one thing you could have done sooner, such as clearer goals in the first month, and say whether you think it would have changed the result. The interviewer wants reflection, without regret taking over the answer.
- id: em-closing-a-candidate-you-wanted
  q: Tell me about a candidate you badly wanted to hire. How did you get them to say yes?
  level: Senior
  category: leadership-and-leveling
  subcategory: people-management
  signals:
    - people-management
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Whether you treat hiring as your own job and can win a strong candidate honestly. The interviewer listens for how well you understood what the person wanted, and for whether you told the truth about the hard parts of the role.

    **How to shape the answer.**

    - **Situation and task.** Say what the role was, how long it had been open and why this person stood out.
    - **Action.** Say what you learned about their motives, whom you brought in, and what you told them about the downsides.
    - **Result.** Say whether they joined and how they did in the first year.
    - **Learning.** Say what you changed in how you close candidates.

    **A strong answer sounds like this.** "We had a senior data engineer role open for five months. One candidate, Elena, was clearly right, and she had a second offer that paid about 8 percent more. I asked what she wanted from her next job. She wanted to own a design from the start. So our staff engineer walked her through the streaming redesign we had planned, and I told her plainly that on-call was heavy, about one week in five. I could add 3 percent to the offer and no more. She joined, and she led that redesign within six months. I now ask every finalist that question before the offer."

    **Watch out for.** Winning only by raising pay, overselling the role so that the person leaves within a year, and leaving the whole process to the recruiter.
  followUps:
    - q: What did you tell the candidate about the downsides of the role?
      level: Senior
      a: |-
        Name them: on-call load, old code, an unclear roadmap. Say that you raised them before the offer, and why. People who join with a true picture stay longer, and the interviewer checks that you do not sell a job that does not exist.
    - q: Tell me about a time you had trouble hiring for a key role.
      level: Senior
      a: |-
        Give the role, how long it stayed open and what you changed: the job description, where you looked, or the level. Include what the gap cost the team and how you covered the work. A manager who only waited for the recruiter gives a weak answer.
- id: em-hire-that-was-the-wrong-call
  q: Tell me about a hire you made that turned out to be the wrong one. What did your hiring process miss?
  level: Senior
  category: leadership-and-leveling
  subcategory: people-management
  signals:
    - people-management
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Whether you own a hiring mistake and fix the process that caused it. The interviewer listens for what the interviews failed to test, how fast you acted once you saw the problem, and what you changed for the next hire.

    **How to shape the answer.**

    - **Situation and task.** Say whom you hired, for what, and why you were confident.
    - **Action.** Say when you saw the problem, what you tried with the person, and how you traced it back to the interviews.
    - **Result.** Say how it ended for the person and what it cost the team.
    - **Learning.** Name the change to your process and say whether it has worked.

    **A strong answer sounds like this.** "I hired a senior frontend engineer, Victor, after strong interviews. All four rounds tested solo problem solving. Within two months it was clear that he would not take review comments, and two teammates stopped reviewing his work. I gave him direct feedback three times and set written expectations. Little changed, and he resigned in month seven. We lost about a quarter on the checkout redesign. I had skipped reference calls because we were in a hurry. I added a round where the candidate reviews code with one of us, and I now make two reference calls for every senior hire. The next three hires have worked out."

    **Watch out for.** Blaming the candidate for fooling you, a story where the only fix was to manage the person out, and no change to how you hire.
  followUps:
    - q: What signal did you see in the interviews and ignore?
      level: Senior
      a: |-
        Most hiring mistakes leave a trace. Name it, for example one interviewer's note that the candidate argued with every hint. Say why you set it aside, such as pressure to fill the role, and how you now treat a single strong doubt in a debrief.
    - q: How quickly did you act once you saw the problem?
      level: Senior
      a: |-
        Give dates. Say when you first noticed, when you first told the person, and when you set written expectations. If you waited, say so and say why. The interviewer is checking that you do not let a bad hire sit for a year.
- id: em-conflict-between-two-of-your-engineers
  q: Tell me about a conflict between two people on your team. What did you do as their manager?
  level: Senior
  category: leadership-and-leveling
  subcategory: people-management
  companies:
    - Netflix
  signals:
    - people-management
    - conflict
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Whether you step in at the right time and fix the cause as well as the argument. The interviewer listens for how you heard both people, what you decided yourself, and what you left for them to settle.

    **How to shape the answer.**

    - **Situation and task.** Say who the two people were, what they disagreed about and what it was costing the team.
    - **Action.** Say how you heard each side, what you said to each person, and what you changed in how the work was set up.
    - **Result.** Give the effect on the work and on the working relationship.
    - **Learning.** Say what you watch for earlier.

    **A strong answer sounds like this.** "Two of my ML engineers, Meera and Tomas, fell out over who owned the feature pipeline. Reviews between them took five days, and the team average was one. I met each alone first. Meera felt that Tomas changed her code without asking. Tomas felt blocked by slow reviews. Part of the cause was mine: I had never named an owner. I made Meera the owner, gave Tomas the training jobs, and set a one-day review rule for the whole team. I also told both that the tone of two comments was not acceptable. Reviews are back to about a day. They work together, without much warmth."

    **Watch out for.** Taking one side in the story, telling them to sort it out and calling that a solution, and missing your own part in the cause.
  followUps:
    - q: How did you handle the hard conversation with each of them?
      level: Senior
      companies: [Netflix]
      a: |-
        Describe one conversation in detail: where it happened, the first thing you said, and the example you used. Say how the person reacted and what you did next. Specific words are the proof that you were direct and fair.
    - q: What was the resolution, and has it held?
      level: Senior
      companies: [Netflix]
      a: |-
        Give the state today, with a measure if you have one, such as review time. If the two people are only polite to each other, say so. An honest account of a working relationship that is not a friendship is stronger than a perfect ending.
    - q: What would you have done if it had not improved?
      level: Senior
      a: |-
        Say the next step you had planned: moving one person to other work, or treating the behaviour as a performance issue with written expectations. The interviewer wants to know that your patience has a limit, and that the team's health comes before either person's comfort.
- id: em-reorg-or-layoff-you-had-to-carry-out
  q: Tell me about a re-organisation or a layoff that you had to carry out or explain to your team.
  level: Senior
  category: leadership-and-leveling
  subcategory: people-management
  signals:
    - people-management
    - delivery
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Whether you can lead people through a change you did not choose. The interviewer listens for how honest you were, how you treated the people most affected, and how you kept the work going afterwards.

    **How to shape the answer.**

    - **Situation and task.** Say what changed, how many people it affected and how much say you had.
    - **Action.** Say whom you told first and how, what you could not share, and what you did in the following weeks.
    - **Result.** Say what happened to the people, to trust in the team and to delivery.
    - **Learning.** Say what you would do differently in the first week.

    **A strong answer sounds like this.** "My platform team went from nine people to seven in a company-wide cut. The number was not my choice. How we handled it was. I told the two engineers myself, each in a private call, before any group message. The same day I met the remaining seven and said what I knew and what I did not know. I cut our roadmap from six projects to four, so that nobody had to cover two jobs. Delivery held: we shipped three of the four. Trust did not fully hold. One of my strongest engineers, Hana, left three months later and told me the cut was the reason."

    **Watch out for.** Blaming leadership in front of the team, promising that there will be no more cuts, and a story that skips the people who lost their jobs.
  followUps:
    - q: What would you do if you disagreed with a restructuring you had to carry out?
      level: Senior
      a: |-
        Say that you would argue your case upward first, with numbers, before the decision is final. Once it is final, you carry it out fully, and you do not tell the team that you were against it. Explain the reasons as you understand them.
    - q: How do you keep a team focused when rumours of another re-organisation are going around?
      level: Senior
      a: |-
        Say what you know, what you do not know and when you expect to know more. Do not guess. Then keep goals short, two to four weeks, so that people can finish things. Raise the rumours yourself in one-to-ones before people have to ask.
- id: em-strong-engineer-about-to-leave
  q: Tell me about a strong engineer who was about to leave your team. What did you do, and did they stay?
  level: Senior
  category: leadership-and-leveling
  subcategory: people-management
  signals:
    - people-management
    - mentoring
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Whether you know what keeps your best people, and whether you act before the resignation letter. The interviewer listens for the real reason the person wanted to go, what you could change, and honesty about the result.

    **How to shape the answer.**

    - **Situation and task.** Say who the person was, how you found out and what losing them would have cost.
    - **Action.** Say how you found the real reason, what you changed, and what you could not offer.
    - **Result.** Say whether they stayed and for how long. A person who left later is still a valid story.
    - **Learning.** Say what you now ask people before they start looking.

    **A strong answer sounds like this.** "One of my senior mobile engineers, Priya, told me she had an outside offer. She knew our payments code better than anyone. I asked what the other job gave her. Pay was a small part. She had done maintenance for a year and saw no path to staff. I could not match the title. I gave her the lead on our offline sync project and got her a 6 percent pay correction. She stayed, shipped it in ten months, and then left for a staff role elsewhere. She trained two people before she went. I now ask every engineer twice a year what would make them leave."

    **Watch out for.** A counter-offer of money alone, promises you had no power to keep, and treating a surprise resignation as bad luck.
  followUps:
    - q: How do you keep high performers motivated and challenged?
      level: Senior
      a: |-
        Give your routine with an example. For instance, each strong engineer has one piece of work a level above their current one, and you review it with them monthly. Say how you find that work, and what you do when the team has none to give.
    - q: What would you have done if you could not offer what they wanted?
      level: Senior
      a: |-
        Say that you would tell them the truth and help them leave well: a clear handover, a reference, and an open door. Keeping someone with a promise you cannot keep costs more a year later, for them and for the team.
    - q: Was it the right call to try to keep them?
      level: Senior
      a: |-
        Weigh it out loud. Say what the extra months gave the team, such as a shipped project and two trained engineers, and what the effort cost. Say when you would let a person go without a fight, for example when the role they want does not exist here.
- id: em-disagreed-with-your-own-manager
  q: As a manager, tell me about a time you disagreed with your own manager or with senior leadership about something that affected your team.
  level: Senior
  category: leadership-and-leveling
  subcategory: people-management
  signals:
    - people-management
    - conflict
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** How you handle people who have authority over you, and what your team hears afterwards. The interviewer listens for evidence, the channel you chose, and whether you carried the final decision as your own.

    **How to shape the answer.**

    - **Situation and task.** Say what the decision was, why you disagreed and what was at risk for your team.
    - **Action.** Say what evidence you collected, how and where you raised it, and what you offered as another option.
    - **Result.** Say what was decided and how you explained it to the team.
    - **Learning.** Say what you would change.

    **A strong answer sounds like this.** "My director wanted to lend two of my six search engineers to another group for a quarter. I thought we would miss our relevance launch. I mapped the remaining work to people and showed that with four engineers the launch moved by seven weeks. I sent him a one-page note, and then we talked in person. I offered one engineer, with the launch moving by two weeks. He agreed to one. I told the team the plan as our plan, with the reasons, and I did not say that I had argued against it. We launched two weeks late. The other group got less help than it wanted."

    **Watch out for.** Complaining to your team about the decision, a disagreement raised for the first time in a large meeting, and a story where you were proved right and learned nothing else.
  followUps:
    - q: How did you gather the evidence for your view?
      level: Senior
      a: |-
        Describe the work: the data you pulled, the people you asked, the estimate you made and how rough it was. One page with three numbers is enough. The interviewer checks that you tested your own opinion before you spent your manager's time on it.
    - q: "How did you raise it: in writing, on a call or in person?"
      level: Senior
      a: |-
        Say which and why. A common good pattern is a short written note first, so that the facts are clear, then a private conversation. Avoid making your first challenge in front of your manager's peers or your own team.
    - q: How did you explain the final decision to your team?
      level: Senior
      a: |-
        Say whether you told people one to one or as a group, and what words you used. Present the decision with its reasons and your plan to make it work. If someone asked whether you agreed, say how you answered honestly without undermining it.
- id: em-senior-engineer-asked-how-to-get-promoted
  q: Tell me about a senior engineer on your team who asked you what it would take to reach the next level. What did you do?
  level: Senior
  category: leadership-and-leveling
  subcategory: mentorship-hiring
  signals:
    - people-management
    - mentoring
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Whether you grow people on purpose. The interviewer listens for an honest account of the gap, work you found or created for the person, and how you handled the promotion case. It is harder with a senior engineer, because the next level needs impact beyond your own team.

    **How to shape the answer.**

    - **Situation and task.** Say who the person was, what they were strong at and what the next level asked for.
    - **Action.** Say what you told them about the gap, what work you gave them, and how you built the case.
    - **Result.** Say whether they were promoted and when.
    - **Learning.** Say what you do earlier for the next person.

    **A strong answer sounds like this.** "Daniel, a senior frontend engineer on my team, asked me what staff level would take. His work inside the team was excellent, and nobody outside it knew him. I told him that directly. I gave him the lead on moving four teams to our shared component library, and a staff engineer in another group agreed to review his design documents. After nine months I put his case forward. The committee said no and asked for a longer record across teams. I told him the same day, in their exact words. He was promoted six months later. I now start that conversation a year earlier."

    **Watch out for.** Taking credit for the engineer's work, promising a promotion you do not control, and a growth plan that was only a list of courses.
  followUps:
    - q: Did the engineer know that you were preparing a promotion case?
      level: Senior
      a: |-
        Say yes or no, and why. Most strong answers say yes: the engineer saw the case, knew the gaps and knew the date. If you kept it quiet to avoid disappointment, explain what that choice cost and what you do now.
    - q: What did you do when the first attempt failed?
      level: Senior
      a: |-
        Say how fast you told the person, what feedback you passed on and what you changed in the plan. Own your part, for example a case that went in one cycle too early. The interviewer checks that the engineer still trusted you afterwards.
    - q: How would you decide whether one of your engineers should become a manager?
      level: Senior
      a: |-
        Give your test. For example, the person already spends time on other people's success, gives direct feedback, and wants the job because they like the work itself. Say that you offer a trial first, such as leading a small project team for a quarter.
- id: em-changed-how-your-team-interviews
  q: Tell me about a time you raised the hiring bar or changed how your team interviews. What was wrong before, and what changed afterwards?
  level: Senior
  category: leadership-and-leveling
  subcategory: mentorship-hiring
  signals:
    - people-management
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Whether you treat hiring as a process that you own and measure. The interviewer listens for the evidence that the old process was failing, what you changed, how you brought the interviewers with you, and how you know the new way is better.

    **How to shape the answer.**

    - **Situation and task.** Say what the process was and what told you it was not working.
    - **Action.** Say what you changed, how you trained interviewers, and what you kept.
    - **Result.** Give numbers: offer rate, time to hire, or how new hires did in their first months.
    - **Learning.** Say what you would still fix.

    **A strong answer sounds like this.** "On my backend team, two of our last five hires struggled to debug production problems. Our four interview rounds asked three overlapping algorithm questions. I replaced one round with a debugging exercise built from an old incident. I wrote a scoring guide with four levels for each round, and six interviewers shadowed each other twice. Some of them disliked the guide, so I let them rewrite two sections. Debriefs went from 50 minutes to 30, because people argued from the same scale. All four people we hired in the next year passed their 90-day review. Time to hire did not improve: it stayed near 11 weeks."

    **Watch out for.** A higher bar that only means rejecting more people, no measure before and after, and a change forced on interviewers without their input.
  followUps:
    - q: What is your interview process today, and what do you look for in a candidate?
      level: Senior
      a: |-
        Walk through the rounds in order and say what each one tests. Then name two or three things you look for, such as how a person debugs and how they take a hint. Keep it short and concrete, with one example from a recent hire.
    - q: How do you know the new process is better, and not only different?
      level: Senior
      a: |-
        Compare the same measures before and after: how new hires did at 90 days, how often interviewers disagreed, and how many candidates dropped out. Admit small samples. Four hires is weak evidence, and saying so shows judgment.
- id: em-hard-feedback-to-a-more-experienced-engineer
  q: Tell me about a time you gave hard feedback to someone on your team who had more experience than you.
  level: Senior
  category: leadership-and-leveling
  subcategory: mentorship-hiring
  signals:
    - people-management
    - feedback
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** Whether you can be direct with someone whose skill you respect and may depend on. The interviewer listens for specific examples, respect for the person's experience, and a change in behaviour that lasted.

    **How to shape the answer.**

    - **Situation and task.** Say who the person was, how much more experience they had and what the problem cost.
    - **Action.** Say how you prepared, the exact examples you used, and how you asked for their view.
    - **Result.** Say what changed and how you know.
    - **Learning.** Say what you learned about managing people who know more than you.

    **A strong answer sounds like this.** "In my second year as a manager I had a principal engineer, Farid, with 18 years in databases. I had six. In design reviews he rewrote other people's proposals on the spot, and junior engineers stopped proposing. We had one design document from them in a quarter. I asked for an hour, gave him two examples with dates, and said what it was costing. He disagreed at first and said the designs were weak. I agreed that some were, and I asked how he would teach that. He chose to send questions before each review and to speak last. Next quarter, junior engineers wrote five documents."

    **Watch out for.** Softening the message until it is lost, feedback about style with no cost attached, and letting strong technical work excuse the behaviour.
  followUps:
    - q: How did you prepare for that conversation?
      level: Senior
      a: |-
        Say what you wrote down beforehand: two or three examples with dates, the cost of each, and the change you wanted. Say whom you asked for advice, if anyone. Preparation matters more when the other person can out-argue you on technical ground.
    - q: What would you have done if they had refused to change?
      level: Senior
      a: |-
        Say that you would set a written expectation with a date, the same as for any engineer, and involve your own manager early. Seniority raises the standard for behaviour. Say what you would be ready to lose, including the person.
    - q: Your most productive engineer is dismissive in reviews and is upsetting junior teammates. What do you do?
      level: Senior
      a: |-
        Treat it as a performance problem, because the team's output matters more than one person's. Give direct feedback with examples within a week, set a clear expectation, and follow up. Say that you would not trade three quiet juniors for one fast senior.
- id: em-tech-debt-and-upkeep-against-new-features
  q: How do you set priorities for your team when tech debt and keep-the-lights-on work compete with new features? Give me a recent example.
  level: Senior
  category: leadership-and-leveling
  subcategory: team-health-process
  companies:
    - Netflix
  signals:
    - people-management
    - prioritisation
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
    - /behavioral/competencies/tight-deadlines-and-tech-debt
  a: |-
    **What it tests.** Whether you have a working rule for this trade-off and can defend it to product partners and to your own engineers. The interviewer listens for how you measure the cost of debt, who takes part in the decision, and what you said no to.

    **How to shape the answer.**

    - **Your rule first.** State how you split the team's time and how you rank debt work.
    - **A recent example.** Give one quarter: what was asked, what you chose and what you dropped.
    - **The result.** Give a number for the debt work and say what happened to the feature work.
    - **What you check.** Say how you find out whether the split is still right.

    **A strong answer sounds like this.** "I hold about 20 percent of each quarter for upkeep and debt, and I rank debt items by the hours they cost us each month. Last spring my platform team lost about 30 hours a month restarting a flaky deploy job, and product wanted three new features. I showed the product lead those 30 hours in the same list as the features. We agreed to fix the deploy job first and move the third feature to the next quarter. Failed deploys fell from about 12 a month to 2. We shipped two features, and the third arrived five weeks later than first asked."

    **Watch out for.** A fixed percentage with no reasoning behind it, debt work justified only by how engineers feel about the code, and an example where nothing was given up.
  followUps:
    - q: How do you decide which debt to pay down first?
      level: Senior
      a: |-
        Give your measure: hours lost per month, incidents caused, or how often the code blocks a feature. Rank by cost against effort. Say that some debt is fine to keep, and give one example that you chose to leave alone.
    - q: What do you do when a product partner will not accept the split?
      level: Senior
      a: |-
        Put the debt in their terms: late features, incidents, or support load. Offer a choice between two plans with dates, and let them pick. If you still disagree, raise it together to the person who owns both goals.
- id: em-person-against-the-delivery-plan
  q: Tell me about a time when what was right for one person on your team was bad for the delivery plan. What did you choose?
  level: Senior
  category: leadership-and-leveling
  subcategory: team-health-process
  signals:
    - people-management
    - delivery
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** How you weigh a person against a deadline when you cannot have both. The interviewer listens for a real cost on each side, a decision you made yourself, and how you handled the people who paid for it.

    **How to shape the answer.**

    - **Situation and task.** Say who the person was, what they needed and what the plan needed from them.
    - **Action.** Say what options you looked at, what you chose and whom you told.
    - **Result.** Give the cost to delivery and the effect on the person and the team.
    - **Learning.** Say when you would choose the other way.

    **A strong answer sounds like this.** "Five weeks before a warehouse migration deadline, my lead data engineer, Sofia, asked for six weeks of leave to care for her father. She knew the pipeline better than anyone. I approved the leave the same day. Then I reworked the plan. I cut two of the nine reports from the first release, moved a second engineer onto her work with a three-day handover, and told the finance team the date would move by three weeks. Their director was unhappy and said so to my manager. We shipped three weeks late with seven reports. Sofia came back and still leads that system. Next time I would warn finance sooner."

    **Watch out for.** A story where nothing was lost, hiding the delay from stakeholders, and presenting the person's need as a problem they caused.
  followUps:
    - q: What would you have done if the date could not move?
      level: Senior
      a: |-
        Say what you would cut or whom you would borrow, and what you would ask of the person, if anything. For example, two hours of handover calls a week. State the line you would not cross, such as refusing the leave.
    - q: When would you put delivery first?
      level: Senior
      a: |-
        Give a real case or a clear rule. For example, when the person's need can wait a few weeks and the delay would hurt customers or other teams badly. Say how you would make it up to the person afterwards, with a date.
- id: em-took-over-a-team-that-was-not-delivering
  q: Tell me about a time you took over a team that was failing to deliver. What did you do in your first few months?
  level: Senior
  category: leadership-and-leveling
  subcategory: team-health-process
  signals:
    - people-management
    - delivery
  topics:
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Whether you diagnose before you change things, and whether you can turn a team around without breaking it. The interviewer listens for how you found the real cause, the few changes you made, and what happened to the people.

    **How to shape the answer.**

    - **Situation and task.** Say what the team owned, what it had missed and what you were asked to fix.
    - **Action.** Say how you spent the first weeks, what you found, and the two or three changes you made.
    - **Result.** Give a before and after for delivery, and say who stayed or left.
    - **Learning.** Say what you would change sooner or later next time.

    **A strong answer sounds like this.** "I took over a checkout team of seven that had missed three releases in a row. I changed nothing for three weeks. I met each person and read six months of tickets. The team had 14 pieces of work in progress for seven people, and nothing counted as done until a separate test team signed it off. I cut work in progress to five, moved testing into the team, and set a release every two weeks. Five of the next six releases went out on the planned date. One senior engineer disliked the new limits and left in month four. I should have spent more time with him early."

    **Watch out for.** Blaming the previous manager, changing everything in the first week, and a turnaround with no numbers.
  followUps:
    - q: How did you find out what was really wrong?
      level: Senior
      a: |-
        Name your sources: one-to-ones, the ticket history, incident reports, and people outside the team who depended on it. Say what the first explanation was and why it was incomplete. The interviewer checks that you looked at evidence before you acted.
    - q: What did you decide not to change?
      level: Senior
      a: |-
        Name one or two things that worked, such as the on-call rota or a planning habit, and say why you kept them. A new manager who keeps what works earns trust faster. It also shows that you chose each change with care.
    - q: Tell me about a time your team's project was behind schedule. What was your planning mistake?
      level: Senior
      a: |-
        Pick one mistake that was yours, such as an estimate with no time for integration. Say when you saw the slip, whom you told and what you cut. Then say what you now add to every plan.
- id: staff-decision-across-teams-without-authority
  q: Tell me about a technical decision that affected several teams, none of which reported to you. How did you get it made?
  level: Senior
  category: leadership-and-leveling
  subcategory: staff-principal
  signals:
    - influence
    - conflict
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
    - /behavioral/competencies/influence-without-authority
  a: |-
    **What it tests.** Whether you can get a decision made, and kept, across teams by persuasion. The interviewer listens for how you found the real objection, what you changed in your own proposal, and whether the decision held after the meeting. At staff level the story should cover several teams.

    **How to shape the answer.**

    - **Situation and task.** Say what had to be decided and which teams were affected.
    - **Action.** Say whom you talked to first, what the strongest objection was, and how you changed the proposal.
    - **Result.** Say what was decided, how it was recorded and how far it has been carried out.
    - **Learning.** Say how you would start sooner or smaller.

    **A strong answer sounds like this.** "Four teams shared one orders database, and schema changes broke someone about twice a month. I proposed that each team own its tables and expose them through an interface. Three tech leads agreed. The reporting team did not: 40 nightly reports joined across all the tables. I spent a week with them and learned that the real fear was rewriting those reports. I added a read-only copy for reporting to the plan. Then I wrote the decision down, and all four leads signed it in a review. Three teams finished in nine months. The fourth took fourteen. Breaking schema changes fell to about one a quarter."

    **Watch out for.** Winning by going to a director, a decision that was announced and never carried out, and a story with no real opposition.
  followUps:
    - q: How did you find the real source of the opposition?
      level: Senior
      a: |-
        Say that you asked in private, and that you asked about consequences more than opinions. For example, what work the change would create for their team. The stated objection is often about design, and the real one is often about cost or risk to a roadmap.
    - q: Who was the strongest opposing voice, and what happened to that relationship?
      level: Senior
      a: |-
        Name the role, state their case fairly, and say what you changed because of it. Then describe the relationship today, with an example, such as a later project where they asked for your review.
    - q: How did you make sure the decision held once people went back to their own work?
      level: Senior
      a: |-
        Describe the mechanism: a written record with owners and dates, a check in an existing monthly review, and a tool or test that makes the old way harder. Decisions without a follow-up step fade within a quarter.
- id: staff-technical-direction-for-more-than-a-year
  q: Tell me about a technical direction you set that looked more than a year ahead. How did you write it, and how much of it held?
  level: Senior
  category: leadership-and-leveling
  subcategory: staff-principal
  signals:
    - strategy
    - influence
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Whether you can look past the current roadmap and give many teams a direction they use. The interviewer listens for the problem behind the direction, the choices you ruled out, and an honest account of what held and what did not.

    **How to shape the answer.**

    - **Situation and task.** Say what the organisation lacked and why a direction was needed then.
    - **Action.** Say what you studied, the two or three choices in the document, and how you tested it with other teams.
    - **Result.** Say what changed beyond your own team, with a number, and what you got wrong.
    - **Learning.** Say how you now keep a direction current.

    **A strong answer sounds like this.** "Nine teams each ran their own model serving stack, and a new model took about six weeks to reach production. I wrote a six-page direction for two years: one shared serving layer, one model format, and each team keeps its own feature code. I named what we would not build, including our own training platform. I reviewed drafts with all nine tech leads and changed the rollout order twice. After 18 months, seven teams were on the shared layer and a new model took about eight days. I was wrong about hardware. I assumed demand would stay flat, and we rewrote the capacity section after eight months."

    **Watch out for.** A vision with no trade-offs or exclusions, a document that nobody outside your team read, and a story that is really one project with a long timeline.
  followUps:
    - q: What was the impact at the level of the organisation?
      level: Senior
      a: |-
        Give a result that belongs to several teams: time to launch, incidents, cost, or the number of teams that changed how they work. If the story sounds like one team's project, the interviewer will ask this again, so prepare the wider number.
    - q: Who pushed back hardest, and how did you deal with their concerns?
      level: Senior
      a: |-
        Name the role and the concern, stated fairly. Say what you changed in the direction because of it and what you kept. A direction that met no challenge was probably not read closely.
    - q: How did you decide what to leave out?
      level: Senior
      a: |-
        Say what you excluded and the test you used, such as whether fewer than three teams needed it, or whether an outside tool was good enough. Exclusions make a direction usable, so give at least one that was unpopular.
- id: staff-sponsored-an-engineer-into-a-bigger-role
  q: Tell me about an engineer you sponsored into a bigger role, such as tech lead or staff. What did you do beyond giving advice?
  level: Senior
  category: leadership-and-leveling
  subcategory: staff-principal
  signals:
    - influence
    - mentoring
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Whether you grow other leaders, and whether you understand that sponsoring means spending your own standing on someone. The interviewer listens for an opportunity you gave away, how you stayed out of the way, and what the person did with it.

    **How to shape the answer.**

    - **Situation and task.** Say who the person was, what they were ready for and what stood in their way.
    - **Action.** Say what opportunity you opened, what you said about them to others, and how you supported them without taking over.
    - **Result.** Say what they delivered and what role they hold now.
    - **Learning.** Say what you learned about stepping back.

    **A strong answer sounds like this.** "Lena was a senior frontend engineer on another team, and her designs were better known to me than to our leaders. When our director asked me to lead the move to a new design system across six teams, I proposed Lena and offered to be her reviewer. I showed him two of her documents. I joined her first two reviews and said almost nothing. When a tech lead went around her to me, I sent him back to her. The migration finished in ten months, two months over plan. She was promoted to staff the next year. I corrected her once in public, and I regret it."

    **Watch out for.** Describing code review or weekly chats as sponsorship, staying the real decision maker behind the scenes, and choosing only people who are like you.
  followUps:
    - q: What is the difference between mentoring and sponsoring, in your own practice?
      level: Senior
      a: |-
        Mentoring is advice given in private. Sponsoring is what you do in rooms the person is not in: you name them for work, vouch for them and share the risk. Give one example of each from your last year.
    - q: What did you do when they made a decision you would not have made?
      level: Senior
      a: |-
        Give the decision. Say whether you raised your concern in private or let it run, and why. A useful rule is to step in only when the mistake would be costly and hard to undo. Say what happened.
    - q: How do you choose whom to sponsor?
      level: Senior
      a: |-
        Give your test, such as people whose work is already above their level and who lack visibility. Say how you check your own bias, for example by asking managers in other teams whom they would name. Mention someone outside your reporting line.
- id: staff-said-no-to-a-senior-leader
  q: Tell me about a time you said no to a director or a VP. What happened next?
  level: Senior
  category: leadership-and-leveling
  subcategory: staff-principal
  signals:
    - influence
    - judgment
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Whether you will protect the organisation from a bad call when the person asking has power over you. The interviewer listens for the reasons behind your no, the option you offered, and the state of the relationship afterwards.

    **How to shape the answer.**

    - **Situation and task.** Say who asked, what they wanted and why it mattered to them.
    - **Action.** Say what evidence you brought, how you said no, and what you offered in its place.
    - **Result.** Say what they decided and what happened to the work.
    - **Learning.** Say what you would change about how or when you said it.

    **A strong answer sounds like this.** "A VP of product asked my group to give a large customer a live dashboard in six weeks by reading directly from the production orders database. I said no to the direct read. Reporting queries on that database had caused two incidents the year before, and one took checkout down for 40 minutes. I told him in a private call first, with both incident reports. I offered the same dashboard from a copy of the data, 15 minutes behind, in the same six weeks. He was not pleased, and he asked the customer. They accepted the delay. We shipped in seven weeks. He now asks me before he commits dates."

    **Watch out for.** A no with nothing offered in its place, refusing in public before a private word, and a story where the leader was simply foolish.
  followUps:
    - q: If you could redo it, which decision point would you change?
      level: Senior
      a: |-
        Pick one moment, such as the day you first heard the request, and say what you would do differently there. For example, raise the risk before the leader had promised a date. One precise change is better than a general wish to communicate more.
    - q: What would you have done if the leader had insisted?
      level: Senior
      a: |-
        Say that you would write down the risk and your advice, and ask who accepts the risk. Then you either carry out the decision well, or raise it one level with the leader's knowledge. Say where your line is, such as safety or legal exposure.
- id: staff-work-you-chose-not-to-do
  q: Tell me about important-looking work that you chose not to do. Why did you say no, and what did you do with the time?
  level: Senior
  category: leadership-and-leveling
  subcategory: staff-principal
  signals:
    - strategy
    - prioritisation
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Whether you choose your work by its value to the organisation and can turn down work that looks good. The interviewer listens for how you judged the value, how you said no without leaving a gap, and what the freed time produced.

    **How to shape the answer.**

    - **Situation and task.** Say what the work was, who wanted it and why it was attractive.
    - **Action.** Say how you weighed it, how you said no, and who took it on, if anyone.
    - **Result.** Say what you did in its place and what that delivered.
    - **Learning.** Say what test you now apply to requests.

    **A strong answer sounds like this.** "I was asked to design an in-house feature store. It was interesting work with a director's backing. Before I answered, I asked eight teams whether they would use it. Two said yes. In the same conversations, six teams raised data quality: we had 23 bad-data incidents in the last quarter. I told the director I would not take the feature store, and I showed him both numbers. I proposed checks at the point where data enters the pipelines, and I led that work with three teams. Incidents fell to nine the next quarter. The two teams bought a feature store. One of them still says we should have built it."

    **Watch out for.** Turning work down only because it was dull, leaving the requester with no answer, and a story with no evidence that the other work was worth more.
  followUps:
    - q: How did you say no without damaging the relationship?
      level: Senior
      a: |-
        Say that you answered quickly, gave your reasoning with numbers, and offered something: another owner, a smaller version, or a date to look again. A slow maybe does more harm than a fast, explained no.
    - q: Was the work you dropped ever missed?
      level: Senior
      a: |-
        Answer honestly. If someone still thinks it was a mistake, say so and state their case. Then say what you would need to see to change your mind. This shows that your no was a judgment and that you can still be persuaded.
- id: staff-first-90-days-in-a-new-organisation
  q: You join a new organisation as a staff engineer. What do you do in your first 90 days?
  level: Senior
  category: leadership-and-leveling
  subcategory: staff-principal
  signals:
    - strategy
    - influence
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Whether you know how to build trust and find the right problems before you push your own ideas. The interviewer listens for a plan with stages, for listening before judging, and for one early result that is small and real.

    **How to shape the answer.**

    - **First 30 days.** Say whom you meet, what you read and what hands-on work you do.
    - **Days 30 to 60.** Say how you turn what you heard into a short list of problems and check it with leaders.
    - **Days 60 to 90.** Say what small result you aim for and how you choose your first large problem.
    - **What you avoid.** Name the mistakes you guard against.

    **A strong answer sounds like this.** "I last did this two years ago. In the first month I met 25 people in six teams and asked each the same three questions. I also took two on-call shifts and shipped four small fixes to learn the deploy path. In the second month I wrote two pages on the five problems I heard most and reviewed them with my director and three tech leads. They changed the order. In the third month I fixed the smallest one, a 25-minute test suite that I brought down to 11. Then I agreed my first large project. I proposed no redesign in those 90 days."

    **Watch out for.** Arriving with a plan copied from your last company, criticising existing systems in week two, and 90 days of listening that produce nothing.
  followUps:
    - q: How do you earn trust from engineers who have been there for years?
      level: Senior
      a: |-
        Do some of the unglamorous work: on-call, reviews, a bug nobody wanted. Ask why things are the way they are before you suggest changes, and give credit for what works. Trust comes from small kept promises in the first weeks.
    - q: What would you do if you saw a serious problem in your first week?
      level: Senior
      a: |-
        Separate urgent from important. If it risks data loss or an outage, raise it at once with the owner, in private, with what you saw. Otherwise write it down and test it against what you learn in the next month.
    - q: How do you choose your first large project?
      level: Senior
      a: |-
        Say that you look for a problem that leaders care about, that several teams feel, and where your skills fit. Check it with your manager and two or three tech leads before you commit. Be careful with the problem you solved at your last job: familiarity is a weak reason.
- id: staff-long-term-bet-you-got-funded
  q: Tell me about a long-term technical bet that you argued for. How did you get it funded?
  level: Senior
  category: leadership-and-leveling
  subcategory: technical-direction
  signals:
    - strategy
    - influence
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Whether you can turn a technical belief into an investment case that leaders accept. The interviewer listens for how you sized the cost and the return, how you lowered the risk, and what you gave up to get a yes.

    **How to shape the answer.**

    - **Situation and task.** Say what the bet was, why it would take a year or more, and what it cost.
    - **Action.** Say how you built the case, what small proof you ran first, and who had to agree.
    - **Result.** Say what you were given, what it has returned so far and what is still open.
    - **Learning.** Say what you would ask for differently.

    **A strong answer sounds like this.** "Our two mobile apps had separate code for the same business rules, so features reached one platform about five weeks after the other. I wanted one shared module for that logic, and I asked for three engineers for two quarters. First I ran a six-week pilot on the login flow with one engineer. Login bugs that had to be fixed twice went from nine in a quarter to two. I showed my director the pilot, the cost and the five-week gap. He funded two engineers. After a year, about 60 percent of the logic is shared and the gap is one week. Payments code is still separate."

    **Watch out for.** A case built on engineering taste with no business number, asking for everything at once with no pilot, and reporting only the parts that worked.
  followUps:
    - q: What did you give up to get the funding?
      level: Senior
      a: |-
        Say what was traded: a smaller team, a later start, or another project that moved. Name who lost out and how you handled it with them. Funding is a choice between options, and the interviewer checks that you saw the other side of it.
    - q: How would you have known the bet was failing?
      level: Senior
      a: |-
        Give the measure and the date you set at the start, such as shared code below 30 percent after two quarters. Say who would have made the call to stop. A bet with no stopping rule reads as a personal preference.
    - q: Tell me about a time you persuaded leadership to invest in reducing technical debt.
      level: Senior
      a: |-
        Use the same pattern with a different story. Put the debt in the leader's terms, such as late features or incident hours, show a small proof, and ask for a bounded amount. Give the result as a number the leader cared about.
- id: staff-standard-or-platform-other-teams-adopted
  q: Tell me about a standard or a platform you created that other teams chose to adopt. How did adoption go after the first team?
  level: Senior
  category: leadership-and-leveling
  subcategory: technical-direction
  signals:
    - influence
    - strategy
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
    - /behavioral/competencies/influence-without-authority
  a: |-
    **What it tests.** Whether your technical work spreads beyond your own team because other teams want it. The interviewer listens for how you won the first adopters, how you lowered the cost of switching, and how you dealt with teams that said no.

    **How to shape the answer.**

    - **Situation and task.** Say what problem several teams shared and what you proposed.
    - **Action.** Say how you chose the first team, what you did to make adoption cheap, and how you handled objections.
    - **Result.** Give the adoption number and the effect. Include the teams that did not adopt.
    - **Learning.** Say what you would build or drop sooner.

    **A strong answer sounds like this.** "Eleven backend teams published events in three formats, and each consumer wrote its own parsing code. I wrote a short standard: one schema format, a shared registry and rules for changing a schema. I picked the notifications team first because they had the most pain, and I did their migration with them in two weeks. I used their numbers in a 20-minute talk and wrote a tool that converted old schemas. Eight of the eleven teams adopted it within a year. Events that failed to parse fell from about 30 a week to 4. Three teams never moved. I failed to convince one of them."

    **Watch out for.** Adoption that came from a mandate, counting teams with no measure of benefit, and hiding the teams that refused.
  followUps:
    - q: Walk me through the last technical document you wrote that another team adopted.
      level: Senior
      a: |-
        Say what the document was for, who read it, and how it changed between first draft and final. Name one comment from another team that improved it. Then say what that team did differently afterwards.
    - q: What did you do about the teams that would not adopt it?
      level: Senior
      a: |-
        Say that you asked for their reasons and accepted the valid ones, such as a system near retirement. For the rest, say what you tried and when you stopped. Forcing the last team is rarely worth the cost.
    - q: Would a mandate from leadership have been faster?
      level: Senior
      a: |-
        Probably, in the short term. Explain the cost: teams comply on paper and work around the standard. Say when a mandate is right, such as for security or legal requirements, and that you would still build the migration tooling first.
- id: staff-decision-you-reversed-after-it-was-made
  q: Tell me about a technical decision you made and then reversed after teams had started to act on it.
  level: Senior
  category: leadership-and-leveling
  subcategory: technical-direction
  signals:
    - strategy
    - judgment
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Whether you can admit a wrong call at scale and undo it in an orderly way. The interviewer listens for the evidence that changed your mind, how quickly you acted, and how you treated the teams who had already paid for your first decision.

    **How to shape the answer.**

    - **Situation and task.** Say what you decided, why, and how many teams followed it.
    - **Action.** Say what evidence appeared, how you checked it, and how you told people you were reversing.
    - **Result.** Give the cost of the reversal and the state afterwards.
    - **Learning.** Say what you now test before a decision of that size.

    **A strong answer sounds like this.** "I decided to split our web app into separate pieces, one for each of five teams, so that teams could deploy alone. After five months, three teams had moved. Page load had gone from 2.1 seconds to 2.9, because each piece shipped its own copy of shared code, and builds were harder to debug. I measured it twice to be sure. Then I wrote a short note that said I had been wrong, with the numbers, and proposed one app with enforced module boundaries. The three teams spent about four engineer-months moving back. Page load returned to 2.0 seconds. I now try a decision like that with one team first."

    **Watch out for.** A reversal that someone else forced on you, blaming the teams for how they carried it out, and a small decision that affected nobody.
  followUps:
    - q: What changed your mind?
      level: Senior
      a: |-
        Name the specific evidence and when you saw it. Say what you believed before and why that was reasonable at the time. Then say what you had failed to test. The interviewer wants the reasoning more than the apology.
    - q: How did the teams who had already done the work react?
      level: Senior
      a: |-
        Say what they said, including the anger. Say what you did for them: you joined the work, moved a deadline, or told their managers that the cost was yours. Trust after a reversal depends on who pays for it.
    - q: How do you tell a decision that needs more time from one that is wrong?
      level: Senior
      a: |-
        Give your test. Set a measure and a date when you make the decision. If the measure moves the wrong way twice, and the design itself explains why, the decision is wrong. Slow adoption alone is a weaker sign.
- id: staff-finding-the-most-important-problem
  q: At your level, nobody gives you a task list. How do you decide which problem is the most important one for you to work on?
  level: Senior
  category: leadership-and-leveling
  subcategory: technical-direction
  signals:
    - strategy
    - prioritisation
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Whether you choose your own work well. The interviewer listens for where you get your information, how you compare problems, and whether you check your choice with others before you spend months on it.

    **How to shape the answer.**

    - **Your method first.** Say where you look and how you compare problems.
    - **One example.** Describe the last time you did this and what you found.
    - **What you dropped.** Name an attractive problem you set aside and why.
    - **How you check.** Say who reviews your choice and how often you revisit it.

    **A strong answer sounds like this.** "I look in three places: incident and on-call data, my director's goals, and what tech leads complain about. Last year I read six months of incident reports and spoke to twelve leads. About 40 percent of our incidents came from configuration changes, and nobody owned that. A new service mesh looked more interesting, and only two teams needed it. I wrote one page comparing the two and reviewed it with my director and four leads. I chose configuration safety: validation before deploy and staged rollout. Configuration incidents fell from 17 in a half-year to 6. I repeat the review every six months. Once it told me to stop a project."

    **Watch out for.** Choosing by what is technically interesting, taking whatever the loudest person asks for, and a method with no example behind it.
  followUps:
    - q: How do you know you picked the right problem?
      level: Senior
      a: |-
        Say what you measured afterwards and what you compared it with. Also say who agreed with the choice at the start. If the result was smaller than you expected, say so, and say what you learned about your own estimates.
    - q: What do you do when your view of the most important problem differs from your director's?
      level: Senior
      a: |-
        Say that you first try to understand what they see that you do not, such as a customer or cost pressure. Then show your evidence on one page. If you still differ, they decide, and you say what risk you will keep watching.
    - q: Tell me about a risk you spotted that others had missed.
      level: Senior
      a: |-
        Describe what you noticed, why others missed it, and how you proved it was real before you raised it. Give the outcome with a number. Then say how you made the check routine, so that it does not depend on you.
- id: staff-stalemate-between-two-teams
  q: Tell me about a stalemate between two teams or two organisations that you helped to end.
  level: Senior
  category: leadership-and-leveling
  subcategory: org-alignment
  signals:
    - influence
    - conflict
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Whether you can move two groups that have stopped listening to each other. The interviewer listens for how you found each side's real constraint, what you did yourself, and whether you needed leadership to break the tie.

    **How to shape the answer.**

    - **Situation and task.** Say who the two groups were, what each wanted and how long they had been stuck.
    - **Action.** Say how you learned each side's constraint, what options you put on the table, and how the choice was made.
    - **Result.** Say what was agreed, when it was done and what it unblocked.
    - **Learning.** Say what you look for now when two teams stop talking.

    **A strong answer sounds like this.** "Our platform team wanted every service on the new deploy system by year end. The payments team had refused for a quarter, and the two tech leads no longer met. I was in neither team. I asked each lead to write down what they could not accept. Payments had one hard item: auditors needed a record of who approved each deploy, and the new system did not keep one. Nobody on the platform team knew that. They built the approval record in three weeks. Payments moved in the next quarter, three months after the first date. I did not need to ask our director to decide."

    **Watch out for.** A story where a director decided and you carried the message, describing one team as stubborn, and skipping your own actions.
  followUps:
    - q: What would you have done if one team had refused to move at all?
      level: Senior
      a: |-
        Say that you would write both positions on one page, with the cost of each to the company, and bring both leads to the person who owns both goals. Say that you would tell both teams first. Escalation done in the open is a normal tool.
    - q: Did you escalate to leadership, and how did you frame it?
      level: Senior
      a: |-
        If yes, say what you asked for: a decision between two written options, with both teams in the room. If no, say why you could avoid it. Asking a leader to pick a side without the facts is the weak version.
    - q: What was your part, as opposed to the teams' part?
      level: Senior
      a: |-
        Separate them clearly. For example, you ran the conversations and found the constraint, and the platform team built the fix. Staff-level credit comes from the unblocking, so do not claim the engineering work that others did.
- id: staff-unpopular-technical-position
  q: Tell me about a technical position you held that most of your organisation disagreed with. What changed your mind, or theirs?
  level: Senior
  category: leadership-and-leveling
  subcategory: org-alignment
  signals:
    - influence
    - judgment
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Whether you hold a view for good reasons and can still be moved by evidence. The interviewer listens for how you tested your position, how you treated the majority view, and whether anything changed in your own thinking.

    **How to shape the answer.**

    - **Situation and task.** Say what your position was, who disagreed and why their view was reasonable.
    - **Action.** Say how you tested both views and how you shared the result.
    - **Result.** Say what the organisation did, and which parts of your position won and lost.
    - **Learning.** Say what you changed in your own view.

    **A strong answer sounds like this.** "Most of our ranking group wanted to replace a simple model with a large neural one. I argued that fresher data in the old model would give most of the gain at far lower cost. Three teams and my director disagreed. I proposed a four-week test of both. Fresher data lifted clicks by 1.8 percent. The new model lifted them by 2.1 percent at about six times the serving cost. On long queries the new model was better, which I had not expected. We shipped fresher data everywhere and the new model for long queries only. I was right about cost and wrong about where the new model mattered."

    **Watch out for.** A story where everyone else was wrong, holding the position by repeating it louder, and no test that could have proved you wrong.
  followUps:
    - q: Why not the other option?
      level: Senior
      a: |-
        Give the best case for the option you opposed, as its supporters would put it. Then give the one or two facts that decided it for you. If you cannot argue their side well, the interviewer will doubt that you understood the choice.
    - q: Tell me about a time a design of yours was rejected.
      level: Senior
      a: |-
        Pick a real one. Say what you proposed, why it lost and how you behaved afterwards, including whether you helped the chosen design succeed. Add what you learned about the design or about how you presented it.
    - q: How long do you keep arguing before you let it go?
      level: Senior
      a: |-
        Give your rule. For example, you make your case once in writing and once in person, ask what evidence would change the decision, and then commit. You re-open it only when new data appears.
- id: staff-aligning-executives-who-wanted-different-things
  q: Tell me about a time two or more executives wanted different things from the same teams. How did you get them aligned?
  level: Senior
  category: leadership-and-leveling
  subcategory: org-alignment
  signals:
    - influence
    - prioritisation
  topics:
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Whether you can work at the level where goals conflict and no engineer can settle it alone. The interviewer listens for how you made the conflict visible, the options you framed, and whether the leaders made a real choice.

    **How to shape the answer.**

    - **Situation and task.** Say who wanted what, and why the teams could not do both.
    - **Action.** Say how you put the conflict on one page, what options you offered, and how you prepared each leader.
    - **Result.** Say what they chose and what the teams delivered.
    - **Learning.** Say what you would do earlier.

    **A strong answer sounds like this.** "Our finance lead wanted cloud spend cut by 25 percent in two quarters. Our VP of sales wanted a new region live in the same period, which would add about 15 percent. The same two infrastructure teams had to do both, and each had been told its work came first. I wrote one page with three options, each with cost, date and risk. I spoke to each leader alone before the meeting, so that nobody was surprised. Both cared about the yearly margin target, so I started there. They chose a smaller region launch and a 15 percent cut. We delivered the region on time and a 13 percent cut."

    **Watch out for.** Trying to satisfy both by overloading the teams, a story where you only passed messages between leaders, and options with no costs attached.
  followUps:
    - q: How did you prepare each executive before the meeting?
      level: Senior
      a: |-
        Say that you met each one alone, showed the same page, and asked what they could not accept. Say what you changed afterwards. People rarely change position for the first time in a group, so the private conversations do most of the work.
    - q: What if they had still disagreed after seeing the options?
      level: Senior
      a: |-
        Say that you would name the person who owns both goals, often their shared manager, and help both leaders bring the options to that person together. Meanwhile, give the teams one clear priority for the next two weeks, so that work does not stop.
