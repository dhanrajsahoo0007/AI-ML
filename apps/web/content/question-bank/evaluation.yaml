- id: an-enterprise-customer-reports-that-responses-from-your-depl
  q: An enterprise customer reports that responses from your deployed system have gotten slow. Walk me through the diagnosis.
  a: |
    Quantify it first with traces: which endpoints, since when, and whether time to first token, generation time or total time grew. Then break down the path: client and network, gateway and rate limiting, retrieval and tool calls, queueing at the model, prefill length (prompts may have grown) and output length.

    Common causes are longer prompts or outputs, lost prefix-cache hits, rate-limit backoff, a slow downstream tool, capacity or region changes, and model or configuration updates. Fix the cause, communicate findings and the remediation, and add latency alerts per customer.
