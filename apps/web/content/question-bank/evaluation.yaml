      url: https://outcomeschool.com/blog/llm-as-a-judge
  source: outcome-school
- id: how-do-you-build-an-eval-set-when-there-is-no-labelled-groun
  q: How do you build an eval set when there is no labelled ground truth and experts are expensive?
  a: >
    Start from real usage: sample production or pilot inputs, cluster them to cover the main intents
    and edge cases, and add known failure cases. Write rubrics and reference answers for a small,
    high-value core with experts, and use them to calibrate an LLM judge that scales to the rest.


    Stretch expert time: let models draft answers and have experts edit rather than write, label
    only disagreements between models or judges, use pairwise preferences, which are faster than
    absolute labels, and create synthetic cases for rare scenarios with expert review. Grow the set
    continuously from production failures.
  topic: evaluation
  level: Senior
  companies:
    - Cohere
    - Harvey
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: how-do-you-detect-and-measure-hallucinations-in-a-production
  q: How do you detect and measure hallucinations in a production RAG system?
  a: >
    Offline, use a test set with source documents and break answers into claims; check each claim
    against the retrieved context with an NLI model or calibrated LLM judge, and report the
    unsupported-claim rate and correct abstentions on unanswerable questions.


    In production, run the same faithfulness check on a sample of live answers, track citation
    validity and the share of answers with uncited claims, monitor user feedback and corrections,
    and send flagged answers to human review. Trend the rate by source, topic and model version.
