- id: do-1-million-seattle-ride-trips-suffice-to-build-an-accurate
  q: >-
    Do 1 million Seattle ride trips suffice to build an accurate ETA prediction model? How would you
    decide?
  a: >
    It depends on coverage, not just volume. Check whether the trips cover the variety that matters:
    times of day and week, seasons and weather, routes and neighborhoods, events and unusual
    conditions. A million trips may still have thin coverage for rare but important cases.


    Decide empirically with a learning curve: train on increasing subsets and measure error on a
    time-based held-out set; if error is still falling as data grows, more data helps. Also check
    error by segment, compare with simple baselines, and validate on later months to make sure the
    model generalizes over time.
  topic: evaluation
  level: Mid
  companies:
    - Google DeepMind
  related: /interviews/ml-system-design-interview
  source: outcome-school
- id: how-would-you-build-the-evaluation-system-for-a-meta-ai-assi
  q: >-
    How would you build the evaluation system for a Meta AI assistant before and after each model
    release?
  a: >
    Before release: offline suites covering capability, safety, policy compliance and product
    behavior across languages and surfaces, LLM judges calibrated to human raters, human
    side-by-side comparisons against the previous model, and red-teaming. Gate on no regressions in
    key slices, especially safety and high-traffic intents.


    After release: staged rollout with A/B tests on engagement and satisfaction proxies, sampled
    quality and safety review of live conversations, monitoring of reports, refusals and latency per
    region, and fast rollback. Failures feed back into offline suites.
