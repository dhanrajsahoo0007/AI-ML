- id: what-is-benchmark-contamination-and-how-do-you-guard-against
  q: What is benchmark contamination and how do you guard against it?
  a: |
    Contamination is when benchmark questions or answers appear in training data, so scores reflect memorization rather than ability. It happens easily because benchmarks are published on the web that training corpora scrape.

    Guard against it by deduplicating training data against benchmarks with n-gram or embedding matching, keeping private held-out test sets, using benchmarks created after the training cutoff or regularly refreshed, checking for suspicious gaps between public and private variants, testing with paraphrased or perturbed questions, and reporting decontamination methods.
