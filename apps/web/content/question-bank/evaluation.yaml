- id: build-the-evaluation-harness-for-a-new-frontier-model-releas
  q: Build the evaluation harness for a new frontier model release. What does it need to do?
  a: |
    It must cover capabilities (knowledge, reasoning, math, code, multilingual, long context, tool use and agentic tasks, multimodal), safety (harmful content, jailbreak robustness, dangerous capability thresholds), and product behavior (instruction following, refusals, formatting, latency and cost). Each suite has versioned data, graders, decontamination checks and statistical confidence.

    Operationally it runs automatically on every checkpoint at scale, compares against previous models with slice-level breakdowns, includes human evaluation and red-teaming for qualities automation misses, and produces a release report that gates launch decisions. Results must be reproducible.
