- id: how-do-you-evaluate-a-code-editing-model-before-shipping-it
  q: How do you evaluate a code-editing model before shipping it? Design the offline and online eval story for tab or agent edits.
  a: |
    Offline: build suites from real edit sessions with the actual context available at that moment, measuring exact or functional match of the next edit, whether code compiles and tests pass after applying edits, latency, and the rate of harmful edits. For agent edits, use repository tasks with hidden tests.

    Online: A/B test acceptance rate, retained acceptance (suggestions kept rather than undone), characters or edits saved, time to task completion, and latency, broken down by language and file type. Tune the suggestion threshold so precision stays high, because bad suggestions erode trust quickly.
  level: Senior
