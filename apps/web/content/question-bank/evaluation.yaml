- id: how-would-you-decide-an-llm-powered-assistant-is-ready-to-la
  q: How would you decide an LLM-powered assistant is ready to launch to millions of customers?
  a: >
    Set launch criteria up front with product, legal and safety: task success rates on
    representative tests, maximum rates of harmful, hallucinated or policy-violating outputs,
    latency and cost targets, accessibility and locale coverage. Measure them with offline suites,
    red-teaming and human evaluation.


    Then validate in stages: internal dogfooding, a limited beta with monitoring, and A/B tests
    showing customer benefit, with operational readiness such as monitoring, incident response,
    rollback and support processes. Launch when the criteria hold at each stage, not when a demo
    looks good.
  topic: evaluation
  level: Senior
  companies:
    - Amazon
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: you-re-shipping-notification-summarization-to-hundreds-of-mi
  q: >-
    You're shipping notification summarization to hundreds of millions of users in 30+ locales, and
    you cannot log user content. Design the evaluation and regression-detection story.
  a: >
    Without user content, evaluate offline on synthetic and licensed or donated data that mimics
    real notifications in every locale, written or reviewed by native speakers and covering hard
    cases such as sarcasm, names, numbers and sensitive news. Measure faithfulness and critical
    misstatements, with human review per locale.


    For regression detection in the field, rely on privacy-preserving signals: on-device evaluation
    with aggregated, differentially private metrics, opt-in feedback reports, and user actions such
    as disabling the feature. Gate every model update on the offline suites, and roll out gradually
    by locale.
  topic: evaluation
  level: Senior
  companies:
    - Apple
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: how-do-you-monitor-a-deployed-ranking-model-for-drift-and-wh
  q: How do you monitor a deployed ranking model for drift, and what triggers a retrain?
  a: >
    Monitor input feature distributions and score distributions against a baseline, online
    engagement metrics such as click-through and conversion by segment, and offline metrics
    recomputed on recent labeled data as feedback arrives. Watch for new items, users and markets
    that the model handles poorly.


    Retrain on a schedule matched to how fast behavior changes, often daily or weekly for ranking,
    and trigger extra retraining when drift metrics cross thresholds or performance drops on recent
    data. Every retrained model still passes offline checks and an online test before replacing the
    current one.
  topic: evaluation
  level: Mid
  companies:
    - Consumer-Scale ML
  related: /interviews/mlops-and-deployment
  source: outcome-school
- id: take-a-working-genai-agent-prototype-to-production-for-an-en
  q: >-
    Take a working GenAI agent prototype to production for an enterprise. What's your checklist
    between demo and launch?
  a: >
    The checklist: an evaluation suite from real tasks with success and safety metrics; permissions
    and authentication with the user's own access; guardrails for inputs, outputs and tool actions
    with approvals; tracing and monitoring with cost tracking; error handling, retries and budgets;
    prompt and model versioning with rollback.


    Plus enterprise needs: data governance and residency, audit logs, security review including
    prompt injection testing, load and latency testing, a human fallback, documentation and support
    processes, and a staged rollout with defined success criteria. Most prototypes fail on
    evaluation and permissions, so start there.
  topic: evaluation
  level: Senior
  companies:
    - Databricks
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: your-annotators-have-no-ground-truth-the-tasks-are-subjectiv
  q: >-
    Your annotators have no ground truth: the tasks are subjective preference judgments. How do you
    measure and improve label quality?
  a: >
    Measure agreement rather than accuracy: inter-annotator agreement, each annotator's agreement
    with the consensus and with expert reviewers on a calibration set, and consistency on repeated
    items. Low agreement may mean unclear guidelines rather than bad annotators.


    Improve quality by refining guidelines with examples of hard cases, training and calibrating
    annotators, using gold items with expert-agreed preferences to monitor them, collecting
    rationales, routing disagreements to experts, and weighting annotators by reliability. Track how
    label quality affects the trained model's results.
  topic: evaluation
  level: Senior
  companies:
    - Scale AI
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: how-would-you-benchmark-an-llm-agent-s-tool-use-say-for-ente
  q: >-
    How would you benchmark an LLM agent's tool use, say, for enterprise workflows composing 10+
    APIs?
  a: >
    Build sandboxed mock versions of the APIs with realistic data and errors, and a suite of tasks
    requiring multi-step compositions of 10 or more calls, with known correct end states. Grade
    outcomes by checking the final state of the mock systems, and grade trajectories for correct
    tool selection, argument accuracy, ordering, redundant calls and error recovery.


    Run each task several times to measure consistency, vary API behaviors such as timeouts and
    pagination, include tasks that should be refused or escalated, and report cost and latency. Keep
    a hidden test set to avoid overfitting.
  topic: evaluation
  level: Senior
  companies:
    - Scale AI
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  refs:
    - title: AI Agent Evaluation
      url: https://outcomeschool.com/blog/ai-agent-evaluation
  source: outcome-school
- id: an-eval-pipeline-you-own-suddenly-reports-a-6-point-drop-for
  q: >-
    An eval pipeline you own suddenly reports a 6-point drop for a customer's model between Tuesday
    and Wednesday. The model didn't change. Debug it.
  a: >
    If the model did not change, suspect the pipeline. Diff everything between the two runs:
    evaluation data version and sampling, prompt templates, decoding settings, judge model or judge
    prompt versions (a hosted judge may have been updated), grading code, dependencies, timeouts and
    rate-limit errors counted as failures, and infrastructure differences.


    Rerun Tuesday's exact configuration to reproduce the old score, then bisect changes. Check
    whether the drop is concentrated in particular items or error types, inspect failed examples by
    hand, and add pinned versions and checksums so evaluation runs are reproducible.
  topic: evaluation
  level: Senior
  companies:
    - Scale AI
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: how-would-you-evaluate-answer-quality-for-an-answer-engine-c
  q: >-
    How would you evaluate answer quality for an answer engine, continuously and at scale, with both
    automated and human signals?
  a: >
    Automated signals at scale: citation validity and claim support from a faithfulness checker,
    answer relevance and completeness from calibrated judges, freshness for time-sensitive queries,
    and format quality, run on stratified samples of live traffic daily. Human signals: expert
    raters on side-by-side comparisons for a smaller sample, with clear guidelines.


    Behavioral signals: follow-up questions, reformulations, citation clicks, copy events, thumbs
    ratings and abandonment. Combine them in dashboards by query type, and use human ratings to keep
    the automated judges calibrated.
  topic: evaluation
  level: Senior
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  refs:
    - title: LLM Evaluation
      url: https://outcomeschool.com/blog/llm-evaluation
