  source: outcome-school
- id: how-would-you-evaluate-an-agent-as-opposed-to-a-single-model
  q: How would you evaluate an agent, as opposed to a single model response?
  a: |
    Agents act over many steps in an environment, so evaluate the final outcome in a sandbox, such as the correct database state or passing tests, rather than just text. Also grade the trajectory: tool choice, argument accuracy, wasted steps, policy violations and recovery from errors.

    Run each task several times because agents are non-deterministic, and report consistency (for example pass^k) along with success. Track steps, tokens, cost and latency, test safety cases such as prompt injection, and grow the task suite from production failures. A single benchmark number hides most of this.
