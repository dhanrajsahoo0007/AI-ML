- id: you-re-shipping-notification-summarization-to-hundreds-of-mi
  q: You're shipping notification summarization to hundreds of millions of users in 30+ locales, and you cannot log user content. Design the evaluation and regression-detection story.
  a: |
    Without user content, evaluate offline on synthetic and licensed or donated data that mimics real notifications in every locale, written or reviewed by native speakers and covering hard cases such as sarcasm, names, numbers and sensitive news. Measure faithfulness and critical misstatements, with human review per locale.

    For regression detection in the field, rely on privacy-preserving signals: on-device evaluation with aggregated, differentially private metrics, opt-in feedback reports, and user actions such as disabling the feature. Gate every model update on the offline suites, and roll out gradually by locale.
