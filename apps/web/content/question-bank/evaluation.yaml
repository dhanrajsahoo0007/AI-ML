      url: https://outcomeschool.com/blog/llm-evaluation
  source: outcome-school
- id: how-would-you-evaluate-a-meeting-summarisation-feature-befor
  q: >-
    How would you evaluate a meeting-summarisation feature before shipping it to a hundred million
    users?
  a: >
    Build a diverse test set of meetings: different lengths, languages, numbers of speakers, accents
    and transcript quality, including edge cases. Evaluate faithfulness (no invented decisions or
    owners), coverage of key decisions and action items against human references, attribution of who
    said what, and usefulness through human ratings.


    Use LLM judges calibrated to human raters for scale, measure critical errors separately, test
    privacy and sensitive-content handling, and roll out gradually with feedback and sampled review,
    watching for regressions in specific meeting types before reaching a hundred million users.
