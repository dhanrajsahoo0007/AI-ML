- id: the-space-of-possible-conversations-is-effectively-infinite
  q: >-
    The space of possible conversations is effectively infinite. How do you evaluate a
    conversational agent before launch?
  a: >
    Cover the space systematically rather than exhaustively: build scenario suites from real
    transcripts and policies, covering intents, edge cases, policy boundaries, emotional customers
    and adversarial attempts, and run them with simulated users that have goals and personas, varied
    by an LLM to generate many conversation paths.


    Grade outcomes by checking backend state and policy compliance, use rubric judges for tone and
    resolution, run each scenario many times to measure consistency, and add human review. After
    launch, monitor live conversations and turn new failure patterns into scenarios.
  topic: evaluation
