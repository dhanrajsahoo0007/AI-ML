# Company-reported questions adapted from Outcome School (Apache 2.0); see NOTICE.md. Answers are our own.
- id: design-an-llm-as-judge-evaluation-what-are-its-known-biases
  q: Design an LLM-as-judge evaluation. What are its known biases and how do you correct for them?
  a: >
    Use a strong judge model with a specific rubric per criterion, ask for brief reasoning before a
    score, prefer binary checks or pairwise comparisons over loose 1–10 scales, and give it
    reference answers or source documents when correctness matters.


    Known biases: position bias (favoring the first answer), verbosity bias (favoring longer
    answers), self-preference (favoring its own model family), sensitivity to formatting and
    confident tone, and weak judgment on facts the judge itself does not know. Correct by swapping
    answer order and averaging, length-controlling comparisons, using a different model family or
    several judges, and above all calibrating against human labels on a sample and tracking
    agreement over time.
  topic: evaluation
  level: Mid
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  refs:
