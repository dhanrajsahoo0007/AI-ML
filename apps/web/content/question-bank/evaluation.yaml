- id: design-the-regression-gate-that-decides-whether-a-prompt-or
  q: Design the regression gate that decides whether a prompt or model change ships.
  a: |
    Every change to a prompt, model, retrieval setting or tool runs a versioned evaluation suite in CI with fixed settings and several samples per item. The gate compares against the current production baseline on task metrics per slice, safety and policy tests, format validity, latency and cost.

    Ship only if primary metrics are not worse beyond noise (using confidence intervals), no critical slice or safety test regresses, and cost and latency stay within budget. Large or risky changes then go to a canary or A/B test with online metrics before full rollout, with automatic rollback triggers.
