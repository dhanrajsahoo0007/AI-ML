- id: an-eval-pipeline-you-own-suddenly-reports-a-6-point-drop-for
  q: An eval pipeline you own suddenly reports a 6-point drop for a customer's model between Tuesday and Wednesday. The model didn't change. Debug it.
  a: |
    If the model did not change, suspect the pipeline. Diff everything between the two runs: evaluation data version and sampling, prompt templates, decoding settings, judge model or judge prompt versions (a hosted judge may have been updated), grading code, dependencies, timeouts and rate-limit errors counted as failures, and infrastructure differences.

    Rerun Tuesday's exact configuration to reproduce the old score, then bisect changes. Check whether the drop is concentrated in particular items or error types, inspect failed examples by hand, and add pinned versions and checksums so evaluation runs are reproducible.
  level: Senior
  category: evaluation
  subcategory: llm-eval-methods
  companies:
  - Scale AI
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: how-would-you-evaluate-answer-quality-for-an-answer-engine-c
  q: How would you evaluate answer quality for an answer engine, continuously and at scale, with both automated and human signals?
  a: |
    Automated signals at scale: citation validity and claim support from a faithfulness checker, answer relevance and completeness from calibrated judges, freshness for time-sensitive queries, and format quality, run on stratified samples of live traffic daily. Human signals: expert raters on side-by-side comparisons for a smaller sample, with clear guidelines.

    Behavioral signals: follow-up questions, reformulations, citation clicks, copy events, thumbs ratings and abandonment. Combine them in dashboards by query type, and use human ratings to keep the automated judges calibrated.
