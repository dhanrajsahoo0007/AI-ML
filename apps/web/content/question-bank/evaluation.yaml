- id: a-new-frontier-model-is-released-and-scores-better-on-your-b
  q: A new frontier model is released and scores better on your benchmarks. What happens before it reaches customers?
  a: |
    Benchmarks are only the first filter. Run the full product evaluation suites with your prompts and workflows, check legal-specific quality such as citation accuracy and hallucination rates, review side by side with domain experts, and test safety, data handling, latency and cost.

    Then adapt prompts and tools to the new model's behavior, roll out to internal users and a small set of customers, compare online metrics, and only then expand. Keep the ability to pin customers on the previous model.
