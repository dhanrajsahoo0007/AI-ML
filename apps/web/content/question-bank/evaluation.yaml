- id: how-would-you-build-the-evaluation-system-for-a-meta-ai-assi
  q: How would you build the evaluation system for a Meta AI assistant before and after each model release?
  a: |
    Before release: offline suites covering capability, safety, policy compliance and product behavior across languages and surfaces, LLM judges calibrated to human raters, human side-by-side comparisons against the previous model, and red-teaming. Gate on no regressions in key slices, especially safety and high-traffic intents.

    After release: staged rollout with A/B tests on engagement and satisfaction proxies, sampled quality and safety review of live conversations, monitoring of reports, refusals and latency per region, and fast rollback. Failures feed back into offline suites.
