- id: your-annotators-have-no-ground-truth-the-tasks-are-subjectiv
  q: 'Your annotators have no ground truth: the tasks are subjective preference judgments. How do you measure and improve label quality?'
  a: |
    Measure agreement rather than accuracy: inter-annotator agreement, each annotator's agreement with the consensus and with expert reviewers on a calibration set, and consistency on repeated items. Low agreement may mean unclear guidelines rather than bad annotators.

    Improve quality by refining guidelines with examples of hard cases, training and calibrating annotators, using gold items with expert-agreed preferences to monitor them, collecting rationales, routing disagreements to experts, and weighting annotators by reliability. Track how label quality affects the trained model's results.
