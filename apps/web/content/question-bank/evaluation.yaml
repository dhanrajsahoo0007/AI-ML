- id: how-would-you-evaluate-an-autonomous-software-engineering-ag
  q: >-
    How would you evaluate an autonomous software engineering agent? Explain why SWE-bench pass
    rates mislead.
  a: >
    Use repository-level tasks run in sandboxes, graded by hidden tests and reviewed by humans for
    code quality, plus measures of cost, time, and how often it needs help. Run each task several
    times and report consistency, test on held-out and private tasks, and run real pilots with
    developers measuring merged pull requests and review effort.


    SWE-bench-style pass rates mislead because tests can be weak, so patches pass without being
    right; tasks may be contaminated; the task mix is narrow and mostly Python; harness and
    scaffolding differences dominate comparisons; and a pass says nothing about maintainability,
    collaboration or cost. Tool-agent benchmarks such as tau-bench add consistency over repeated
    runs, which matters for real use.
  topic: evaluation
  level: Senior
