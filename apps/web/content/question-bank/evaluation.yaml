- id: why-do-benchmark-scores-improve-while-users-say-the-system-g
  q: Why do benchmark scores improve while users say the system got worse? Enumerate the reasons.
  a: |
    The benchmark may not reflect real usage: different task mix, easier or cleaner inputs, or single-turn tests while users have long conversations. Benchmarks can be contaminated or overfit through repeated tuning. Automated judges may reward length or style changes that users dislike.

    Real behavior may also have changed in ways no test measures: more verbose or more refusing answers, slower responses, broken formatting, changed tool-use behavior, regressions in rare but important slices, or loss of features users relied on. The fix is evaluation built from production traffic and failures, with user-facing metrics alongside benchmarks.
