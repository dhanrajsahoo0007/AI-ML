- id: your-agent-passes-92-of-eval-tasks-why-might-that-number-be
  q: >-
    Your agent passes 92% of eval tasks. Why might that number be misleading, and what would you
    measure instead?
  a: >
    The test set may be easier than or different from real traffic, overfit through repeated tuning,
    or dominated by common cases while rare high-impact cases fail. A single run hides
    inconsistency: 92% per run can mean far lower odds of succeeding every time. The grader may be
    lenient, and the 8% of failures may include severe ones such as policy violations.


    Measure instead: success weighted by real traffic mix, pass^k consistency, severity-weighted
    failure rates, policy violation rate, escalation appropriateness, cost and latency, and
    production outcomes such as resolution and customer satisfaction.
  topic: evaluation
  level: Senior
  companies:
    - Sierra
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: after-a-foundation-model-version-upgrade-your-production-age
  q: >-
    After a foundation-model version upgrade, your production agent's escalation rate doubles
    overnight. Walk me through your response.
  a: >
    First limit impact: roll back to the previous model version or route traffic back while
    investigating. Then compare traces before and after for the escalated conversations: is the new
    model triggering escalation rules more often, refusing more, misreading tool results, following
    instructions differently, or formatting tool calls in a way the harness rejects?


    Rerun the evaluation suite on both versions to localize the regression, adjust prompts, tool
    descriptions or escalation thresholds for the new model, re-validate, and re-roll out gradually.
    Add the failing conversations to the regression suite and require evaluation before future
    upgrades.
  topic: evaluation
  level: Senior
  companies:
    - Sierra
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: a-new-frontier-model-is-released-and-scores-better-on-your-b
  q: >-
    A new frontier model is released and scores better on your benchmarks. What happens before it
    reaches customers?
  a: >
    Benchmarks are only the first filter. Run the full product evaluation suites with your prompts
    and workflows, check legal-specific quality such as citation accuracy and hallucination rates,
    review side by side with domain experts, and test safety, data handling, latency and cost.


    Then adapt prompts and tools to the new model's behavior, roll out to internal users and a small
    set of customers, compare online metrics, and only then expand. Keep the ability to pin
    customers on the previous model.
  topic: evaluation
  level: Senior
  companies:
    - Harvey
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: design-the-evaluation-framework-for-an-enterprise-ai-assista
  q: >-
    Design the evaluation framework for an enterprise AI assistant when you cannot look at customer
    data.
  a: >
    Evaluate on proxies you can see: realistic synthetic companies with generated documents,
    permissions and questions; public or licensed corpora; and internal dogfooding on your own
    company's data. These cover retrieval quality, answer faithfulness, permission enforcement and
    action success.


    In customer environments, use privacy-preserving telemetry: aggregate metrics such as citation
    clicks, feedback rates, no-answer rates and latency, plus evaluations that run inside the
    customer's tenant and report only scores. Offer customers tools to run evaluations and share
    results voluntarily.
  topic: evaluation
  level: Senior
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: users-complain-that-characters-drift-out-of-persona-after-a
  q: Users complain that characters drift out of persona after a long session. Diagnose it.
  a: >
    In long sessions, the persona definition gets diluted by thousands of tokens of conversation,
    may be truncated or summarized away when context management kicks in, and the model gets pulled
    toward the user's style or toward its generic assistant voice. Lost-in-the-middle effects and
    summarization errors make it worse.


    Diagnose by reviewing long-session transcripts against persona rubrics at different lengths. Fix
    by pinning the persona definition in every context, re-injecting key traits periodically,
    summarizing history without erasing persona-relevant facts, fine-tuning on long in-character
    conversations, and evaluating persona consistency as a function of session length.
  topic: evaluation
  level: Senior
  companies:
    - Character.AI
  related: /ai-system-design/genai-system-design/agent-memory
  source: outcome-school
- id: engagement-metrics-and-wellbeing-metrics-disagree-how-do-you
  q: Engagement metrics and wellbeing metrics disagree. How do you build a system that resolves that?
  a: >
    Treat wellbeing as a constraint, not a tie-breaker. Define wellbeing metrics explicitly with
    experts, such as signs of distress, compulsive use patterns among minors and user-reported
    satisfaction, and make them guardrails that experiments must not worsen even if engagement
    rises.


    Build the system so optimization targets long-term value, such as retention driven by
    satisfaction rather than raw time spent, with safety classifiers, interventions for at-risk
    users, time and break features, and human review of borderline effects. Report both metric
    families together so decisions are visible.
  topic: evaluation
  level: Senior
  companies:
    - Character.AI
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: two-good-clinicians-write-different-notes-for-the-same-visit
  q: >-
    Two good clinicians write different notes for the same visit. So how do you evaluate note
    quality at all?
  a: >
    Evaluate properties rather than matching a single reference: factual faithfulness to the
    conversation (no invented or wrong facts), completeness of clinically important information,
    correct attribution, appropriate organization for the specialty, and absence of critical errors
    such as wrong medications or laterality.


    Use clinician rubric ratings with multiple raters, measure agreement, compare against several
    reference notes, check facts against the transcript automatically, and track critical-error
    rates separately from style preferences. Ultimately, measure what clinicians accept and sign
    after editing.
  topic: evaluation
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: edit-rate-is-the-obvious-measure-of-clinician-trust-what-doe
  q: >-
    Edit rate is the obvious measure of clinician trust. What does it hide, and what would you
    instrument instead?
  a: >
    Low edit rates can mean clinicians are too busy to review carefully, so errors pass unnoticed;
    high edit rates can be style changes rather than corrections. Edit rate treats a typo fix the
    same as fixing a wrong drug, and differs across clinicians' habits.


    Instrument edit types and severity (factual corrections versus stylistic rewrites), which
    sections get edited, time spent reviewing, critical-error detection on audited samples,
    clinician-reported trust and burnout, and downstream outcomes such as billing or care
    corrections. Audit samples where nothing was edited to see whether errors slipped through.
  topic: evaluation
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: how-do-you-evaluate-a-manipulation-policy-when-every-trial-c
  q: >-
    How do you evaluate a manipulation policy when every trial costs robot time and every failure
    has physical consequences?
  a: >
    Do most evaluation in simulation and on offline data first: validate on held-out demonstrations,
    use simulation with domain randomization to screen candidates, and only promote promising
    policies to real robots. Choose a fixed, representative set of physical test scenarios with
    clear success criteria.


    For real trials, use safety-limited settings (speed, force limits, protective setups), allocate
    trials efficiently with statistical stopping rules, record everything for analysis, and track
    failure modes, not just success rate. Correlate simulation results with real results over time
    to learn how far simulation can be trusted.
  topic: evaluation
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: you-ship-a-policy-to-300-robots-it-works-in-the-lab-and-degr
  q: You ship a policy to 300 robots. It works in the lab and degrades in the field. Debug it.
  a: >
    It is likely distribution shift between lab and field: lighting, backgrounds, object variety,
    wear and calibration differences between robots, latency and compute differences, or people and
    clutter not seen in the lab. Use fleet telemetry to find where failures cluster: specific
    robots, sites, times, tasks or objects.


    Replay field logs in simulation or offline evaluation, compare sensor and action statistics with
    lab data, and check calibration and firmware versions. Fix by collecting targeted field data and
    retraining, adding domain randomization, recalibrating, and rolling out fixes gradually with
    monitoring per site.
  topic: evaluation
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: disengagement-rate-is-a-weak-safety-proxy-how-would-you-actu
  q: >-
    Disengagement rate is a weak safety proxy. How would you actually measure whether the Driver is
    safe enough to ship?
  a: >
    Disengagement rate depends on driver behavior, routes and policies, and does not capture how
    severe events would have been. Measure safety through a combination: collisions and near-misses
    by severity per mile, compared with human-driver baselines in the same areas and conditions;
    counterfactual simulation of disengagement events to see whether a crash would have occurred;
    and large scenario-based simulation suites covering rare dangerous situations.


    Add structured scenario testing on closed courses, analysis by operating domain (weather, road
    type, time of day), and statistical confidence about rare events, which needs very large mileage
    or strong simulation. Combine it all into a safety case argued before release.
  topic: evaluation
  level: Senior
  companies:
    - Tesla
    - Waymo
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: how-do-you-build-a-simulator-you-would-trust-to-gate-a-relea
  q: How do you build a simulator you would trust to gate a release?
  a: >
    Validate it against reality: replay logged real-world drives and check that the simulated
    sensors, other agents and vehicle dynamics reproduce what actually happened, and measure how
    well simulated outcomes predict real outcomes for past releases. Model other road users
    realistically with learned behavior models, including reactive responses.


    Cover the scenario space with logged scenarios, mutations of them and synthetic rare events,
    track the simulator's known gaps, and use it as one of several gates alongside closed-course and
    limited road testing. Trust grows when simulation results consistently predict real-world
    performance.
  topic: evaluation
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: two-days-before-a-release-decision-simulation-shows-a-15-inc
  q: >-
    Two days before a release decision, simulation shows a 15% increase in hard-braking events in
    one scenario cluster. Walk me through what you do.
  a: >
    Treat it as real until shown otherwise. Inspect the scenarios: are the hard brakes justified
    responses to genuine hazards, or unnecessary braking that creates rear-end risk? Check whether
    the change is statistically significant and whether that cluster matters for the operating
    domain.


    Trace it to the code or model change responsible, reproduce on logged real-world data, and
    assess risk with safety engineers. If the cause is understood and benign, document it; if not,
    delay the release or ship without that change, rather than letting the deadline decide.
  topic: evaluation
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: how-do-you-evaluate-an-llm-workflow-before-and-after-giving
  q: How do you evaluate an LLM workflow before and after giving it access to production operations?
  a: >
    Before production access: evaluate in a sandbox or on read-only replicas with historical tasks,
    compare proposed actions with what experts actually did, test permissions, edge cases and
    adversarial inputs, and run in shadow mode where the workflow proposes actions that humans
    execute.


    After access: start with human approval on every action, track approval and edit rates, errors
    and incidents, expand autonomy only for action types with consistently high accuracy, keep audit
    logs and rollback, and continue sampling and reviewing outcomes.
  topic: evaluation
  level: Senior
  companies:
    - Palantir
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
