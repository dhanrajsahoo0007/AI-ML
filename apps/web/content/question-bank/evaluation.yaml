- id: how-do-you-manage-prompt-versioning-and-rollbacks-in-product
  q: How do you manage prompt versioning and rollbacks in production?
  a: >
    Store prompts in version control or a prompt registry with ids, never as untracked strings, and
    review changes like code. Tie each version to its evaluation results, deploy with feature flags
    or gradual rollout, and log the prompt version with every request.


    Rollback means switching the active version back, which should be instant and not require a code
    deploy. Pin the model version along with the prompt, since a prompt tuned for one model can
    behave differently on another.
  topic: evaluation
  level: Junior
  companies: []
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: design-online-evaluation-what-do-you-log-what-do-you-sample
  q: "Design online evaluation: what do you log, what do you sample, and what do you A/B?"
  a: >
    Log every request's trace, versions, latency, cost and implicit signals such as copies, edits,
    retries, follow-up questions, escalations and abandonment, plus explicit ratings. Sample a
    stratified slice of traffic, by intent, language and customer, for LLM-judge scoring and a
    smaller slice for human review, with extra sampling of flagged or unusual cases.


    A/B test changes that affect user experience: new models, prompts, retrieval and UI, measuring
    task success and satisfaction proxies, guardrails such as safety and latency, and cost, with
    enough duration and power to detect meaningful differences. Feed failures back into offline
    evaluation sets.
  topic: evaluation
  level: Senior
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: how-would-you-evaluate-an-agent-as-opposed-to-a-single-model
  q: How would you evaluate an agent, as opposed to a single model response?
  a: >
    Agents act over many steps in an environment, so evaluate the final outcome in a sandbox, such
    as the correct database state or passing tests, rather than just text. Also grade the
    trajectory: tool choice, argument accuracy, wasted steps, policy violations and recovery from
    errors.


    Run each task several times because agents are non-deterministic, and report consistency (for
    example pass^k) along with success. Track steps, tokens, cost and latency, test safety cases
    such as prompt injection, and grow the task suite from production failures. A single benchmark
    number hides most of this.
  topic: evaluation
