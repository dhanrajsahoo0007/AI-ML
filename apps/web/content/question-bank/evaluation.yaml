- id: how-do-you-build-an-eval-set-when-there-is-no-labelled-groun
  q: How do you build an eval set when there is no labelled ground truth and experts are expensive?
  a: |
    Start from real usage: sample production or pilot inputs, cluster them to cover the main intents and edge cases, and add known failure cases. Write rubrics and reference answers for a small, high-value core with experts, and use them to calibrate an LLM judge that scales to the rest.

    Stretch expert time: let models draft answers and have experts edit rather than write, label only disagreements between models or judges, use pairwise preferences, which are faster than absolute labels, and create synthetic cases for rare scenarios with expert review. Grow the set continuously from production failures.
