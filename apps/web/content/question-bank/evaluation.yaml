- id: two-good-clinicians-write-different-notes-for-the-same-visit
  q: Two good clinicians write different notes for the same visit. So how do you evaluate note quality at all?
  a: |
    Evaluate properties rather than matching a single reference: factual faithfulness to the conversation (no invented or wrong facts), completeness of clinically important information, correct attribution, appropriate organization for the specialty, and absence of critical errors such as wrong medications or laterality.

    Use clinician rubric ratings with multiple raters, measure agreement, compare against several reference notes, check facts against the transcript automatically, and track critical-error rates separately from style preferences. Ultimately, measure what clinicians accept and sign after editing.
