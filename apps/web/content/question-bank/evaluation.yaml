- id: a-customer-says-the-model-got-worse-after-you-upgraded-model
  q: A customer says “the model got worse” after you upgraded model versions in their deployment. How do you verify and respond?
  a: |
    Gather concrete examples and the customer's success criteria, then rerun their traffic or a representative set on both versions with identical prompts and settings, and compare with their metrics, judges calibrated to their preferences, and side-by-side human review. Check whether differences are in quality, format, verbosity, refusals, latency or tool-use behavior.

    Respond by pinning the old version for them if needed, adjusting prompts for the new model's behavior, and sharing the evidence openly. Then add their cases to the regression suite so future upgrades are tested against what they care about.
