- id: how-would-you-decide-an-llm-powered-assistant-is-ready-to-la
  q: How would you decide an LLM-powered assistant is ready to launch to millions of customers?
  a: |
    Set launch criteria up front with product, legal and safety: task success rates on representative tests, maximum rates of harmful, hallucinated or policy-violating outputs, latency and cost targets, accessibility and locale coverage. Measure them with offline suites, red-teaming and human evaluation.

    Then validate in stages: internal dogfooding, a limited beta with monitoring, and A/B tests showing customer benefit, with operational readiness such as monitoring, incident response, rollback and support processes. Launch when the criteria hold at each stage, not when a demo looks good.
