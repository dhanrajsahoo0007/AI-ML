- id: the-space-of-possible-conversations-is-effectively-infinite
  q: The space of possible conversations is effectively infinite. How do you evaluate a conversational agent before launch?
  a: |
    Cover the space systematically rather than exhaustively: build scenario suites from real transcripts and policies, covering intents, edge cases, policy boundaries, emotional customers and adversarial attempts, and run them with simulated users that have goals and personas, varied by an LLM to generate many conversation paths.

    Grade outcomes by checking backend state and policy compliance, use rubric judges for tone and resolution, run each scenario many times to measure consistency, and add human review. After launch, monitor live conversations and turn new failure patterns into scenarios.
  level: Senior
  category: evaluation
  subcategory: agent-eval
  companies:
  - Sierra
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  refs:
  - title: AI Agent Evaluation
    url: https://outcomeschool.com/blog/ai-agent-evaluation
  source: outcome-school
- id: your-agent-passes-92-of-eval-tasks-why-might-that-number-be
  q: Your agent passes 92% of eval tasks. Why might that number be misleading, and what would you measure instead?
  a: |
    The test set may be easier than or different from real traffic, overfit through repeated tuning, or dominated by common cases while rare high-impact cases fail. A single run hides inconsistency: 92% per run can mean far lower odds of succeeding every time. The grader may be lenient, and the 8% of failures may include severe ones such as policy violations.

    Measure instead: success weighted by real traffic mix, pass^k consistency, severity-weighted failure rates, policy violation rate, escalation appropriateness, cost and latency, and production outcomes such as resolution and customer satisfaction.
  level: Senior
  category: evaluation
  subcategory: agent-eval
  companies:
  - Sierra
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: what-metrics-would-you-track-for-an-agent-in-production
  q: What metrics would you track for an agent in production?
  a: |
    Task completion rate, escalation to humans, user feedback, tool error rates, steps and tokens per task, cost per successful task, latency, guardrail triggers and sampled human review scores, broken down by task type and version.
  level: Mid
  category: evaluation
  subcategory: agent-eval
- id: what-are-agentic-benchmarks-like-swe-bench-and-tau-bench-use
  q: What are agentic benchmarks like SWE-bench and tau-bench used for?
  a: |
    SWE-bench measures whether coding agents can resolve real GitHub issues, graded by the repository's tests. tau-bench measures tool-using customer-service agents against a simulated user, checking final database state and consistency over repeated trials. They help compare models and approaches, but your own task-specific evaluation should decide launches.
  level: Senior
  category: evaluation
  subcategory: agent-eval
- id: how-do-you-test-an-agent-s-tools-in-isolation
  q: How do you test an agent's tools in isolation?
  a: |
    Write unit tests for each tool's behavior and error handling like any other code, then test the model's use of each tool with a set of prompts and expected calls, measuring tool-selection and argument accuracy. Problems found here are cheaper to fix than in end-to-end runs.
  level: Junior
  category: evaluation
  subcategory: agent-eval
- id: what-observability-does-a-production-llm-system-need-traces
  q: 'What observability does a production LLM system need: traces, spans, costs, feedback?'
  a: |
    End-to-end traces per request with spans for retrieval, each model call, tool calls and guardrails, recording inputs, outputs (redacted where needed), prompt and model versions, token counts, latency and cost. Aggregate metrics for latency percentiles, errors, cost per feature and tenant, and cache hit rates.

    Quality signals: user feedback, retries and edits, escalations, sampled LLM-judge scores and human review queues, all linked back to traces. Alerts on cost spikes, error rates, latency and quality drops, and dashboards broken down by version so regressions can be traced to a change.
  level: Mid
  category: evaluation
  subcategory: observability
  related: /ai-system-design/genai-system-design/llmops-observability
  refs:
  - title: AI Agent Observability
    url: https://outcomeschool.com/blog/ai-agent-observability
  source: outcome-school
- id: design-online-evaluation-what-do-you-log-what-do-you-sample
  q: 'Design online evaluation: what do you log, what do you sample, and what do you A/B?'
  a: |
    Log every request's trace, versions, latency, cost and implicit signals such as copies, edits, retries, follow-up questions, escalations and abandonment, plus explicit ratings. Sample a stratified slice of traffic, by intent, language and customer, for LLM-judge scoring and a smaller slice for human review, with extra sampling of flagged or unusual cases.

    A/B test changes that affect user experience: new models, prompts, retrieval and UI, measuring task success and satisfaction proxies, guardrails such as safety and latency, and cost, with enough duration and power to detect meaningful differences. Feed failures back into offline evaluation sets.
  level: Senior
  category: evaluation
  subcategory: observability
  companies:
  - Perplexity
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: take-a-working-genai-agent-prototype-to-production-for-an-en
  q: Take a working GenAI agent prototype to production for an enterprise. What's your checklist between demo and launch?
  a: |
    The checklist: an evaluation suite from real tasks with success and safety metrics; permissions and authentication with the user's own access; guardrails for inputs, outputs and tool actions with approvals; tracing and monitoring with cost tracking; error handling, retries and budgets; prompt and model versioning with rollback.

    Plus enterprise needs: data governance and residency, audit logs, security review including prompt injection testing, load and latency testing, a human fallback, documentation and support processes, and a staged rollout with defined success criteria. Most prototypes fail on evaluation and permissions, so start there.
  level: Senior
  category: evaluation
  subcategory: observability
  companies:
  - Databricks
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: after-a-foundation-model-version-upgrade-your-production-age
  q: After a foundation-model version upgrade, your production agent's escalation rate doubles overnight. Walk me through your response.
  a: |
    First limit impact: roll back to the previous model version or route traffic back while investigating. Then compare traces before and after for the escalated conversations: is the new model triggering escalation rules more often, refusing more, misreading tool results, following instructions differently, or formatting tool calls in a way the harness rejects?

    Rerun the evaluation suite on both versions to localize the regression, adjust prompts, tool descriptions or escalation thresholds for the new model, re-validate, and re-roll out gradually. Add the failing conversations to the regression suite and require evaluation before future upgrades.
  level: Senior
  category: evaluation
  subcategory: observability
  companies:
  - Sierra
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: users-complain-that-characters-drift-out-of-persona-after-a
  q: Users complain that characters drift out of persona after a long session. Diagnose it.
  a: |
    In long sessions, the persona definition gets diluted by thousands of tokens of conversation, may be truncated or summarized away when context management kicks in, and the model gets pulled toward the user's style or toward its generic assistant voice. Lost-in-the-middle effects and summarization errors make it worse.

    Diagnose by reviewing long-session transcripts against persona rubrics at different lengths. Fix by pinning the persona definition in every context, re-injecting key traits periodically, summarizing history without erasing persona-relevant facts, fine-tuning on long in-character conversations, and evaluating persona consistency as a function of session length.
  level: Senior
  category: evaluation
  subcategory: observability
  companies:
  - Character.AI
  related: /ai-system-design/genai-system-design/agent-memory
  source: outcome-school
- id: how-do-you-evaluate-an-llm-workflow-before-and-after-giving
  q: How do you evaluate an LLM workflow before and after giving it access to production operations?
  a: |
    Before production access: evaluate in a sandbox or on read-only replicas with historical tasks, compare proposed actions with what experts actually did, test permissions, edge cases and adversarial inputs, and run in shadow mode where the workflow proposes actions that humans execute.

    After access: start with human approval on every action, track approval and edit rates, errors and incidents, expand autonomy only for action types with consistently high accuracy, keep audit logs and rollback, and continue sampling and reviewing outcomes.
  level: Senior
  category: evaluation
  subcategory: observability
  companies:
  - Palantir
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: how-do-you-observe-and-debug-agents-in-production
  q: Given a failed multi-step agent run, how do you find which tool call went wrong?
  a: |
    Trace every run end to end: prompts, model outputs, tool calls with arguments and results, latency and cost per step, and the final outcome. Group traces by task type and failure category, replay failing traces against new versions, and alert on spikes in errors, loops or cost.
  level: Mid
  category: evaluation
  subcategory: observability

# Original questions from web research, reviewed in "AI Interview Question Expansion: Review Draft" (2026-11).
- id: how-do-you-choose-the-best-llm-for-a-specific-use-case
  q: How do you choose the best LLM for a specific use case?
  a: |
    Shortlist with public benchmarks and constraints: context length, price, latency, data residency, licence, and tool-calling support. Then decide on your own data:

    1. Build an eval set of 100–500 real tasks with scoring.
    2. Run each candidate with a prompt adapted to it.
    3. Compare quality, cost per task and p95 latency together.

    Look at failure categories, not just averages: one model may be better overall but fail on the cases that matter most.

    Consider operations too: rate limits, uptime history, version deprecation policy, and whether you can self-host later. Re-run the comparison when new models ship. Rankings change every few months.
  level: Mid
  category: evaluation
  subcategory: llm-eval-methods
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: why-are-bleu-rouge-and-similar-metrics-a-poor-fit-for-evalua
  q: Why are BLEU, ROUGE and similar metrics a poor fit for evaluating LLM outputs, and what do you use instead?
  a: |
    They score word overlap with a reference answer. A correct answer phrased differently scores low, and a fluent answer with one wrong fact can score high. Most LLM tasks have many valid answers, and the important failures (wrong facts, unsafe content, ignored instructions) are not about overlap.

    Use instead:

    - exact or programmatic checks where possible: tests, schema validation, extracted values
    - rubric-based scoring by human raters or a calibrated LLM judge for open-ended output
    - task outcome metrics in production, such as resolution or acceptance rates

    Overlap metrics still have narrow uses, such as tracking translation regressions against a fixed reference set.
  level: Junior
  category: evaluation
  subcategory: llm-eval-methods
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: how-many-eval-examples-do-you-need-before-you-trust-that-mod
  q: How many eval examples do you need before you trust that model B beats model A?
  a: |
    The standard error of an accuracy score is about √(p(1−p)/n). At 80% accuracy on 200 examples that is about 2.8 points, so the 95% interval is about ±5.5 points. A 3-point difference on 200 examples is noise.

    Use paired comparisons on the same examples: a bootstrap over examples, or McNemar's test for pass/fail. Pairing removes example difficulty from the variance and needs far fewer samples. Detecting a 2–3 point improvement typically needs around a thousand examples, or repeated runs for stochastic outputs.

    Report confidence intervals, not single numbers, and do not slice results into many small segments and celebrate the one that moved.
  level: Senior
  category: evaluation
  subcategory: llm-eval-methods
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: what-success-metrics-would-you-define-for-an-ai-feature-befo
  q: What success metrics would you define for an AI feature before launch?
  a: |
    Tie metrics to the user outcome the feature exists for:

    - **Primary:** task success, such as answers that resolve the question without a follow-up search, accepted code suggestions, or tickets resolved without escalation.
    - **Quality:** eval scores, judge-rated helpfulness and accuracy on sampled traffic, citation correctness.
    - **Guardrails:** hallucination or safety-flag rates, latency p95, cost per request, refusal rate.
    - **Engagement and retention**, read carefully because they can rise for bad reasons.

    Set targets and minimums before launch. Define how each metric is measured, including sampling and labelling. Decide which metric wins in a trade-off, for example accepting a small cost increase for a quality gain but no increase in the hallucination rate.
  level: Mid
  category: evaluation
  subcategory: llm-eval-methods
  companies:
  - Perplexity
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: quality-went-up-after-your-change-but-latency-and-cost-becam
  q: Quality went up after your change, but latency and cost became unacceptable. What do you do?
  a: |
    Find where the gain came from: a bigger model, longer prompts, more retrieved context, or more reasoning or agent steps. Then try to keep the gain more cheaply:

    - Route only the hard requests to the expensive path.
    - Trim context with a reranker.
    - Cache prompt prefixes.
    - Use a smaller model fine-tuned or distilled on the better model's outputs.
    - Lower reasoning effort where evals show no loss.

    Agree the trade-off with product using numbers, for example +4 points of quality for +40% cost and +600 ms p95. Sometimes the right call is to ship the improvement only for a premium tier or a specific task.
  level: Mid
  category: evaluation
  subcategory: llm-eval-methods
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: a-stakeholder-wants-to-ship-an-ai-feature-but-your-evaluatio
  q: A stakeholder wants to ship an AI feature, but your evaluation evidence is weak. What do you say?
  a: |
    State what is known and what is not:

    - what the eval covered, and how big it was
    - the confidence interval
    - the failure types seen
    - the risks that were not tested

    Translate them into user impact, for example "roughly 1 in 20 answers may cite the wrong policy".

    Then offer a path rather than a veto: a limited launch such as an internal beta, one segment or a feature flag, with monitoring, a rollback plan, human review for high-stakes outputs, and a date to decide on wider rollout. Agree in advance which result would stop the launch. Escalate only if the risk is serious, such as safety, legal or customer harm, and document the decision either way.
  level: Mid
  category: evaluation
  subcategory: llm-eval-methods
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: you-have-30-human-labelled-examples-build-an-automatic-faith
  q: You have 30 human-labelled examples. Build an automatic faithfulness judge and show it can be trusted.
  a: |
    1. Write a rubric with a clear definition: every claim in the answer must be supported by the context.
    2. Have the judge list each claim with a supported or unsupported verdict and evidence, then output a score.
    3. Use a strong model different from the one being judged.
    4. Split the labels: tune the prompt on about 15 examples and test on the other 15.

    Measure agreement with the human labels using accuracy, Cohen's kappa, and especially the false-pass rate on unfaithful answers. Thirty labels is small, so report the uncertainty and plan to collect more, prioritizing disagreements. Re-check calibration whenever the judge model or prompt changes, and periodically audit judge decisions on production samples.
  level: Senior
  category: evaluation
  subcategory: llm-as-judge
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: when-should-an-llm-judge-compare-two-answers-side-by-side-an
  q: When should an LLM judge compare two answers side by side, and when should it score each one alone?
  a: |
    **Pairwise** comparison is more reliable for subjective quality and for comparing two model or prompt versions: "which is better" is easier than an absolute score, for models and humans alike. It suffers from position bias, so run both orders and count disagreements as ties. It does not give an absolute quality level.

    **Pointwise** scoring against a rubric suits monitoring a single system over time, pass/fail checks such as faithfulness or policy compliance, and large-scale production sampling.

    A common setup: pointwise checks for hard requirements, pairwise for deciding whether a change is an improvement.
  level: Mid
  category: evaluation
  subcategory: llm-as-judge
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: how-do-you-measure-agreement-between-annotators-and-between-
  q: How do you measure agreement between annotators, and between an LLM judge and humans?
  a: |
    Raw percent agreement overstates reliability when one label dominates. Use chance-corrected statistics:

    - **Cohen's kappa** for two raters.
    - **Fleiss' kappa or Krippendorff's alpha** for more raters or missing labels.
    - **Weighted kappa or correlation** for ordinal scales.

    Roughly, above 0.6 is substantial agreement and below 0.4 means the task or guidelines are unclear.

    Compute judge–human agreement the same way, and compare it to human–human agreement. A judge cannot be expected to agree with humans more than they agree with each other. Low agreement is usually a rubric problem: clarify definitions with examples of edge cases and re-label.
  level: Mid
  category: evaluation
  subcategory: llm-as-judge
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: design-an-evaluation-platform-for-agents-that-catches-regres
  q: Design an evaluation platform for agents that catches regressions whenever a prompt, tool or model changes.
  a: |
    **Components:**

    - **A versioned scenario library** from real conversations and synthetic edge cases, each with a goal and success criteria.
    - **A simulator** that plays the user and mocks or sandboxes tools with recorded responses, so runs are reproducible.
    - **Graders:** programmatic checks on tool calls and final state, plus LLM judges for conversation quality and policy compliance.

    **Every change** to a prompt, tool schema or model version triggers a run across the suite with several seeds. The platform reports pass rates with confidence intervals per scenario category and shows diffs of failing traces against the baseline. Gate deploys on no significant regression in critical categories.

    Feed production failures back into the library, and track cost and latency per scenario alongside quality.
  level: Senior
  category: evaluation
  subcategory: agent-eval
  companies:
  - Cresta
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
- id: you-launched-a-support-assistant-how-do-you-know-it-s-actual
  q: You launched a support assistant. How do you know it's actually helping, not making things worse?
  a: |
    Measure outcomes against a counterfactual. Run a holdout or A/B test where some users get the old flow, and compare resolution rate, time to resolution, repeat contacts within 7 days, escalations, CSAT and churn.

    Look for hidden harm:

    - tickets marked resolved where the user came back
    - wrong answers on sampled conversations, judged by QA staff or a calibrated judge
    - policy violations
    - users giving up, which looks like deflection but is not resolution

    Segment by issue type, because the assistant may help on simple issues and hurt on complex ones. Route those to humans.
  level: Senior
  category: evaluation
  subcategory: observability
  related: /ai-system-design/genai-system-design/llmops-observability
- id: a-customer-s-only-feedback-is-that-your-assistant-seems-unin
  q: A customer's only feedback is that your assistant seems unintelligent. How do you turn that into a fix?
  a: |
    Nothing yet. First turn the vague complaint into specifics. Ask for example conversations, pull their traces, and label what went wrong. Typical causes:

    - failed retrieval, so it did not know the answer
    - lost context, so it forgot what was said
    - over-refusal or vague hedging
    - not taking an action it should have
    - slow responses
    - a generic tone

    Fix the most frequent cause with the cheapest change: retrieval and context assembly fixes usually beat prompt tweaks, and both beat switching models. Add the failing conversations to the eval set, show the customer before-and-after examples, and agree on a measurable signal to track.
  level: Mid
  category: evaluation
  subcategory: observability
  related: /ai-system-design/genai-system-design/llmops-observability
