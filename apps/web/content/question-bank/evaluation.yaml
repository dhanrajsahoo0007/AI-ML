- id: design-the-evaluation-framework-for-an-enterprise-ai-assista
  q: Design the evaluation framework for an enterprise AI assistant when you cannot look at customer data.
  a: |
    Evaluate on proxies you can see: realistic synthetic companies with generated documents, permissions and questions; public or licensed corpora; and internal dogfooding on your own company's data. These cover retrieval quality, answer faithfulness, permission enforcement and action success.

    In customer environments, use privacy-preserving telemetry: aggregate metrics such as citation clicks, feedback rates, no-answer rates and latency, plus evaluations that run inside the customer's tenant and report only scores. Offer customers tools to run evaluations and share results voluntarily.
