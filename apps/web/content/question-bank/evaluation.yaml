- id: what-makes-a-perplexity-answer-great-vs-mediocre-where-does
  q: >-
    What makes a Perplexity answer great vs mediocre? Where does Perplexity lose to traditional
    search, and where does it win? You clearly use it: what's broken, and what would you ship to fix
    it?
  a: >
    A great answer directly addresses the question, is accurate and current, cites authoritative
    sources for each key claim, is concise with the right depth, and helps with natural follow-ups.
    A mediocre one cites weak or irrelevant sources, padding, outdated information or claims the
    sources do not support.


    Answer engines win on synthesis, comparisons and research questions; traditional search wins on
    navigation, local results, shopping and very fresh or highly specific lookups where users want
    the page itself. Bring a concrete product observation and a measurable fix, such as better
    source ranking for a query type or clearer handling of conflicting sources.
  topic: evaluation
  level: Mid
  companies:
    - Perplexity
  related: /ai-system-design/genai-system-design/search-ranking-system
  source: outcome-school
- id: how-do-you-evaluate-a-code-editing-model-before-shipping-it
  q: >-
    How do you evaluate a code-editing model before shipping it? Design the offline and online eval
    story for tab or agent edits.
  a: >
    Offline: build suites from real edit sessions with the actual context available at that moment,
    measuring exact or functional match of the next edit, whether code compiles and tests pass after
    applying edits, latency, and the rate of harmful edits. For agent edits, use repository tasks
    with hidden tests.


    Online: A/B test acceptance rate, retained acceptance (suggestions kept rather than undone),
    characters or edits saved, time to task completion, and latency, broken down by language and
    file type. Tune the suggestion threshold so precision stays high, because bad suggestions erode
    trust quickly.
  topic: evaluation
  level: Senior
  companies:
    - Cursor
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
