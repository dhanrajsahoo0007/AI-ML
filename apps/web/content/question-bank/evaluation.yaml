- id: an-enterprise-customer-wants-to-deploy-your-rag-system-but-h
  q: An enterprise customer wants to deploy your RAG system but has no labelled data. How do you evaluate it before and after launch?
  a: |
    Before launch: generate candidate questions from their documents with an LLM, have their experts review and correct a sample, and collect real questions from a few pilot users. Evaluate retrieval with judge-based relevance labels, answers with faithfulness and correctness checks, and calibrate the judges against the experts' reviews.

    After launch: monitor faithfulness on sampled traffic, citation validity, no-answer rates, user feedback and escalations, and add real failures to the test set. Share the results with the customer regularly so quality is visible.
