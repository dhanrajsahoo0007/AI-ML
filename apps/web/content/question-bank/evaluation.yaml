- id: design-the-regression-gate-that-decides-whether-a-prompt-or
  q: Design the regression gate that decides whether a prompt or model change ships.
  a: >
    Every change to a prompt, model, retrieval setting or tool runs a versioned evaluation suite in
    CI with fixed settings and several samples per item. The gate compares against the current
    production baseline on task metrics per slice, safety and policy tests, format validity, latency
    and cost.


    Ship only if primary metrics are not worse beyond noise (using confidence intervals), no
    critical slice or safety test regresses, and cost and latency stay within budget. Large or risky
    changes then go to a canary or A/B test with online metrics before full rollout, with automatic
    rollback triggers.
  topic: evaluation
  level: Senior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: why-do-benchmark-scores-improve-while-users-say-the-system-g
  q: Why do benchmark scores improve while users say the system got worse? Enumerate the reasons.
  a: >
    The benchmark may not reflect real usage: different task mix, easier or cleaner inputs, or
    single-turn tests while users have long conversations. Benchmarks can be contaminated or overfit
    through repeated tuning. Automated judges may reward length or style changes that users dislike.


    Real behavior may also have changed in ways no test measures: more verbose or more refusing
    answers, slower responses, broken formatting, changed tool-use behavior, regressions in rare but
    important slices, or loss of features users relied on. The fix is evaluation built from
    production traffic and failures, with user-facing metrics alongside benchmarks.
  topic: evaluation
  level: Senior
  companies:
    - Cognition
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: what-is-benchmark-contamination-and-how-do-you-guard-against
  q: What is benchmark contamination and how do you guard against it?
  a: >
    Contamination is when benchmark questions or answers appear in training data, so scores reflect
    memorization rather than ability. It happens easily because benchmarks are published on the web
    that training corpora scrape.


    Guard against it by deduplicating training data against benchmarks with n-gram or embedding
    matching, keeping private held-out test sets, using benchmarks created after the training cutoff
    or regularly refreshed, checking for suspicious gaps between public and private variants,
    testing with paraphrased or perturbed questions, and reporting decontamination methods.
  topic: evaluation
  level: Mid
  companies:
