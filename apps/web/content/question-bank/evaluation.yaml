- id: what-makes-a-perplexity-answer-great-vs-mediocre-where-does
  q: 'What makes a Perplexity answer great vs mediocre? Where does Perplexity lose to traditional search, and where does it win? You clearly use it: what''s broken, and what would you ship to fix it?'
  a: |
    A great answer directly addresses the question, is accurate and current, cites authoritative sources for each key claim, is concise with the right depth, and helps with natural follow-ups. A mediocre one cites weak or irrelevant sources, padding, outdated information or claims the sources do not support.

    Answer engines win on synthesis, comparisons and research questions; traditional search wins on navigation, local results, shopping and very fresh or highly specific lookups where users want the page itself. Bring a concrete product observation and a measurable fix, such as better source ranking for a query type or clearer handling of conflicting sources.
