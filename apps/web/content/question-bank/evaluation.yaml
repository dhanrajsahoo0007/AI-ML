- id: how-would-you-benchmark-an-llm-agent-s-tool-use-say-for-ente
  q: How would you benchmark an LLM agent's tool use, say, for enterprise workflows composing 10+ APIs?
  a: |
    Build sandboxed mock versions of the APIs with realistic data and errors, and a suite of tasks requiring multi-step compositions of 10 or more calls, with known correct end states. Grade outcomes by checking the final state of the mock systems, and grade trajectories for correct tool selection, argument accuracy, ordering, redundant calls and error recovery.

    Run each task several times to measure consistency, vary API behaviors such as timeouts and pagination, include tasks that should be refused or escalated, and report cost and latency. Keep a hidden test set to avoid overfitting.
