- id: design-a-private-llm-benchmark-and-leaderboard-seal-style-ho
  q: Design a private LLM benchmark and leaderboard (SEAL-style). How do you keep it trustworthy as labs optimise against it?
  a: |
    Keep test sets private and never released, written by experts, refreshed regularly, and evaluated through controlled access so labs cannot see or train on the items. Use rigorous grading with expert rubrics and multiple raters, report confidence intervals, and document methods.

    To stay trustworthy as labs optimize against it: rotate and expand items, monitor for suspicious jumps, limit the number of submissions, test robustness with paraphrased variants, and keep governance independent from any lab.
