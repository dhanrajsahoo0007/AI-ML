- id: how-would-you-evaluate-an-indic-llm-properly-why-is-running
  q: How would you evaluate an Indic LLM properly? Why is running translated English benchmarks not enough?
  a: |
    Translated English benchmarks carry English cultural context and phrasing, contain translation errors and unnatural language, and miss what matters locally: code-mixing, transliterated text, regional knowledge and dialects. A model can score well on them and still fail real users.

    Evaluate with natively written tasks per language, including code-mixed and romanized input, local knowledge and culturally grounded questions, speech-to-text-to-answer pipelines where voice matters, and native-speaker human ratings of fluency and helpfulness. Track tokenizer efficiency and cost per language too.
