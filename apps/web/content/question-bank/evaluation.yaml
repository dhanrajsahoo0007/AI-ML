- id: edit-rate-is-the-obvious-measure-of-clinician-trust-what-doe
  q: Edit rate is the obvious measure of clinician trust. What does it hide, and what would you instrument instead?
  a: |
    Low edit rates can mean clinicians are too busy to review carefully, so errors pass unnoticed; high edit rates can be style changes rather than corrections. Edit rate treats a typo fix the same as fixing a wrong drug, and differs across clinicians' habits.

    Instrument edit types and severity (factual corrections versus stylistic rewrites), which sections get edited, time spent reviewing, critical-error detection on audited samples, clinician-reported trust and burnout, and downstream outcomes such as billing or care corrections. Audit samples where nothing was edited to see whether errors slipped through.
  level: Senior
  category: evaluation
  subcategory: llm-eval-methods
  companies:
  - Abridge
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: what-is-perplexity-and-what-does-it-not-tell-you
  q: What is perplexity and what does it not tell you?
  a: |
    Perplexity is the exponential of the average negative log-likelihood per token; lower means the model predicts the text better. It is useful for comparing language models on the same tokenizer and data, but it does not measure helpfulness, factual accuracy, instruction following or safety, so it says little about chat quality.
  level: Mid
  category: evaluation
  subcategory: llm-eval-methods
- id: design-an-llm-as-judge-evaluation-what-are-its-known-biases
  q: Design an LLM-as-judge evaluation. What are its known biases and how do you correct for them?
  a: |
    Use a strong judge model with a specific rubric per criterion, ask for brief reasoning before a score, prefer binary checks or pairwise comparisons over loose 1–10 scales, and give it reference answers or source documents when correctness matters.

    Known biases: position bias (favoring the first answer), verbosity bias (favoring longer answers), self-preference (favoring its own model family), sensitivity to formatting and confident tone, and weak judgment on facts the judge itself does not know. Correct by swapping answer order and averaging, length-controlling comparisons, using a different model family or several judges, and above all calibrating against human labels on a sample and tracking agreement over time.
