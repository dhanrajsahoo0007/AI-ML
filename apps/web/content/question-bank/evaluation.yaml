- id: how-would-you-design-an-experiment-to-test-for-a-specific-em
  q: How would you design an experiment to test for a specific emergent capability or bias in a large language model?
  a: |
    Define the capability or bias precisely and operationally, then build a targeted test set with controlled variations: matched pairs that differ only in the factor of interest (for bias), and difficulty levels that separate genuine capability from shortcuts. Include held-out, freshly written items to avoid contamination.

    Run it across model sizes and training checkpoints to see how the behavior scales, with multiple samples and prompts to measure variance, and compare with appropriate baselines. Use statistical tests and confidence intervals, check robustness to paraphrasing, and validate surprising results with human review or mechanistic analysis.
