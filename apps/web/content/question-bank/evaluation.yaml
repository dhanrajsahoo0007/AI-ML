- id: qwen-ships-open-weights-that-top-public-leaderboards-as-the
  q: >-
    Qwen ships open weights that top public leaderboards. As the release engineer, how do you make
    sure the benchmark numbers are trustworthy and not contaminated?
  a: >
    Decontaminate training data against every benchmark you report, using n-gram and embedding
    matching, and document the method. Evaluate with standard public harnesses and settings so
    others can reproduce results, report variance across seeds and prompts, and include benchmarks
    released after the data cutoff and private held-out sets.


    Cross-check with tests that are hard to game: perturbed and paraphrased versions of benchmark
    questions, human preference evaluations and independent leaderboards. Large gaps between public
    and private or perturbed scores are a red flag to investigate before release.
  topic: evaluation
