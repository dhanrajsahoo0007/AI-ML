- id: how-would-you-design-an-experiment-to-test-for-a-specific-em
  q: >-
    How would you design an experiment to test for a specific emergent capability or bias in a large
    language model?
  a: >
    Define the capability or bias precisely and operationally, then build a targeted test set with
    controlled variations: matched pairs that differ only in the factor of interest (for bias), and
    difficulty levels that separate genuine capability from shortcuts. Include held-out, freshly
    written items to avoid contamination.


    Run it across model sizes and training checkpoints to see how the behavior scales, with multiple
    samples and prompts to measure variance, and compare with appropriate baselines. Use statistical
    tests and confidence intervals, check robustness to paraphrasing, and validate surprising
    results with human review or mechanistic analysis.
  topic: evaluation
  level: Senior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: a-customer-says-the-model-got-worse-after-you-upgraded-model
  q: >-
    A customer says “the model got worse” after you upgraded model versions in their deployment. How
    do you verify and respond?
  a: >
    Gather concrete examples and the customer's success criteria, then rerun their traffic or a
    representative set on both versions with identical prompts and settings, and compare with their
    metrics, judges calibrated to their preferences, and side-by-side human review. Check whether
    differences are in quality, format, verbosity, refusals, latency or tool-use behavior.


    Respond by pinning the old version for them if needed, adjusting prompts for the new model's
    behavior, and sharing the evidence openly. Then add their cases to the regression suite so
    future upgrades are tested against what they care about.
  topic: evaluation
  level: Mid
  companies:
    - OpenAI
  related: /ai-system-design/genai-system-design/llmops-observability
  source: outcome-school
- id: an-enterprise-customer-reports-that-responses-from-your-depl
  q: >-
    An enterprise customer reports that responses from your deployed system have gotten slow. Walk
    me through the diagnosis.
  a: >
    Quantify it first with traces: which endpoints, since when, and whether time to first token,
    generation time or total time grew. Then break down the path: client and network, gateway and
    rate limiting, retrieval and tool calls, queueing at the model, prefill length (prompts may have
    grown) and output length.


    Common causes are longer prompts or outputs, lost prefix-cache hits, rate-limit backoff, a slow
    downstream tool, capacity or region changes, and model or configuration updates. Fix the cause,
    communicate findings and the remediation, and add latency alerts per customer.
  topic: evaluation
  level: Mid
  companies:
    - OpenAI
  related: /ai-system-design/genai-system-design/llm-serving-inference
  source: outcome-school
- id: build-the-evaluation-harness-for-a-new-frontier-model-releas
  q: Build the evaluation harness for a new frontier model release. What does it need to do?
  a: >
    It must cover capabilities (knowledge, reasoning, math, code, multilingual, long context, tool
    use and agentic tasks, multimodal), safety (harmful content, jailbreak robustness, dangerous
    capability thresholds), and product behavior (instruction following, refusals, formatting,
    latency and cost). Each suite has versioned data, graders, decontamination checks and
    statistical confidence.


    Operationally it runs automatically on every checkpoint at scale, compares against previous
    models with slice-level breakdowns, includes human evaluation and red-teaming for qualities
    automation misses, and produces a release report that gates launch decisions. Results must be
    reproducible.
  topic: evaluation
