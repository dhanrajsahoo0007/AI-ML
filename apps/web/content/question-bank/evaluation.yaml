- id: what-observability-does-a-production-llm-system-need-traces
  q: "What observability does a production LLM system need: traces, spans, costs, feedback?"
  a: >
    End-to-end traces per request with spans for retrieval, each model call, tool calls and
    guardrails, recording inputs, outputs (redacted where needed), prompt and model versions, token
    counts, latency and cost. Aggregate metrics for latency percentiles, errors, cost per feature
    and tenant, and cache hit rates.


    Quality signals: user feedback, retries and edits, escalations, sampled LLM-judge scores and
    human review queues, all linked back to traces. Alerts on cost spikes, error rates, latency and
    quality drops, and dashboards broken down by version so regressions can be traced to a change.
  topic: evaluation
  level: Mid
