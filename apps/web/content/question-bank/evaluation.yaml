- id: engagement-metrics-and-wellbeing-metrics-disagree-how-do-you
  q: Engagement metrics and wellbeing metrics disagree. How do you build a system that resolves that?
  a: |
    Treat wellbeing as a constraint, not a tie-breaker. Define wellbeing metrics explicitly with experts, such as signs of distress, compulsive use patterns among minors and user-reported satisfaction, and make them guardrails that experiments must not worsen even if engagement rises.

    Build the system so optimization targets long-term value, such as retention driven by satisfaction rather than raw time spent, with safety classifiers, interventions for at-risk users, time and break features, and human review of borderline effects. Report both metric families together so decisions are visible.
