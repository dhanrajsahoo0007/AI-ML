- id: distinguish-regularization-from-validation-when-is-each-the
  q: 'Distinguish regularization from validation: when is each the right tool?'
  a: |
    Regularization changes how the model is trained, adding a penalty such as L1, L2 or dropout that discourages complexity, to reduce overfitting. Validation measures how well a trained model generalizes, using held-out data or cross-validation, to choose among models and hyperparameters, including the regularization strength itself.

    Use regularization when the model is overfitting and you want a simpler solution; use validation always, to detect overfitting and decide how much regularization helps. They work together: validation picks the regularization amount.
  level: Mid
  category: ml-fundamentals
  subcategory: core-concepts
  companies:
  - Google DeepMind
