- id: when-would-you-choose-q-learning-over-policy-gradients-and-v
  q: When would you choose Q-learning over policy gradients, and vice versa?
  a: |
    Q-learning learns action values and acts greedily; it is sample-efficient through off-policy learning and experience replay and works well with small discrete action spaces, as in classic games. It struggles with continuous or huge action spaces and can be unstable with function approximation.

    Policy gradients optimize the policy directly, handle continuous and large action spaces and stochastic policies naturally, and are what LLM RL uses (PPO, GRPO), at the cost of higher variance and lower sample efficiency, usually reduced with baselines or critics. Actor-critic methods combine the two.
  level: Senior
  category: ml-fundamentals
  subcategory: optimization-rl
  companies:
  - Google DeepMind
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  source: outcome-school
- id: how-is-kl-divergence-loss-different-from-cross-entropy-loss
  q: How is KL divergence loss different from cross-entropy loss? And from contrastive loss?
  a: |
    Cross-entropy H(P, Q) equals the entropy of P plus KL(P‖Q). With fixed targets, such as one-hot labels, the entropy term is constant, so minimizing cross-entropy and minimizing KL give the same gradients; KL is used when the target is itself a distribution, such as in distillation or keeping a policy close to a reference model.

    Contrastive losses such as InfoNCE are different: they compare a positive pair against negatives, pulling matching embeddings together and pushing others apart, which learns representations rather than matching a target distribution, as in CLIP or sentence embeddings.
  level: Mid
  category: ml-fundamentals
  subcategory: optimization-rl
  companies:
