- id: explain-gradient-descent-and-its-variants
  q: Explain gradient descent and its variants.
  a: |
    Gradient descent updates parameters in the direction opposite to the gradient of the loss, scaled by a learning rate. Batch gradient descent uses all data per step, stochastic uses one example, and mini-batch uses a small batch, which is the standard trade-off between noise and efficiency. Momentum, RMSProp and Adam adapt the step to speed up and stabilize convergence.
  level: Junior
  category: ml-fundamentals
  subcategory: optimization-rl
- id: what-happens-if-the-learning-rate-is-too-high-or-too-low
  q: What happens if the learning rate is too high or too low?
  a: |
    Too high and the loss oscillates or diverges because steps overshoot minima. Too low and training is very slow and can stall in poor regions. Learning-rate schedules, such as warm-up followed by decay, and adaptive optimizers help, and a learning-rate range test can find a good starting value.
  level: Junior
  category: ml-fundamentals
  subcategory: optimization-rl
- id: do-1-million-seattle-ride-trips-suffice-to-build-an-accurate
  q: Do 1 million Seattle ride trips suffice to build an accurate ETA prediction model? How would you decide?
  a: |
    It depends on coverage, not just volume. Check whether the trips cover the variety that matters: times of day and week, seasons and weather, routes and neighborhoods, events and unusual conditions. A million trips may still have thin coverage for rare but important cases.

    Decide empirically with a learning curve: train on increasing subsets and measure error on a time-based held-out set; if error is still falling as data grows, more data helps. Also check error by segment, compare with simple baselines, and validate on later months to make sure the model generalizes over time.
  level: Mid
  category: ml-fundamentals
  subcategory: applied-ml
  companies:
  - Google DeepMind
  related: /ml-system-design/components
  source: outcome-school
- id: we-have-two-models-85-and-82-accuracy-which-do-you-pick
  q: We have two models, 85% and 82% accuracy. Which do you pick?
  a: |
    It depends. First check whether the 3-point difference is statistically meaningful given the test set size, and whether accuracy is the right metric: with class imbalance or unequal error costs, precision, recall or business cost may favor the other model.

    Then consider latency, cost, interpretability, robustness across segments, calibration and maintenance. Pick the model that best serves the business goal, and confirm with an online test if the stakes justify it.
  level: Junior
  category: ml-fundamentals
  subcategory: applied-ml
  companies:
  - OpenAI
  source: outcome-school
- id: you-have-a-binary-loan-approval-classifier-and-limited-acces
  q: You have a binary loan-approval classifier and limited access to feature weights. How do you explain a rejection?
  a: |
    Use model-agnostic explanations that only need predictions: SHAP or LIME estimates of which features pushed this applicant toward rejection, and counterfactual explanations such as "approved if income were X higher or debt Y lower", which are actionable and often required for adverse-action notices.

    Make sure explanations are faithful and stable, use features the applicant can understand, avoid exposing protected attributes, and check fairness across groups. In regulated lending, an inherently interpretable model may be preferable to explaining a black box.
  level: Senior
  category: ml-fundamentals
  subcategory: applied-ml
  companies:
  - Google DeepMind
  source: outcome-school
- id: how-do-you-choose-between-models-for-a-new-problem
  q: How do you choose between models for a new problem?
  a: |
    Start from the problem: data size and type, latency and interpretability needs, and the metric that matters. Build a simple baseline first, such as a heuristic or logistic regression, then try stronger models such as gradient-boosted trees for tabular data or pretrained networks for text and images. Compare with proper validation and pick the simplest model that meets the target.
  level: Mid
  category: ml-fundamentals
  subcategory: applied-ml
- id: what-is-feature-importance-and-how-can-it-mislead-you
  q: What is feature importance and how can it mislead you?
  a: |
    It estimates how much each feature contributes to a model's predictions, using impurity-based scores, permutation importance or SHAP values. It can mislead when features are correlated, because importance is split or arbitrarily assigned between them, when impurity-based scores favor high-cardinality features, and because importance shows association with predictions, not causation.
  level: Senior
  category: ml-fundamentals
  subcategory: applied-ml
- id: how-would-you-explain-a-model-s-prediction-to-a-business-sta
  q: How would you explain a model's prediction to a business stakeholder?
  a: |
    Use global explanations to show which factors matter overall, and local explanations such as SHAP to show why one prediction came out the way it did, translated into plain language. Pair them with concrete examples and the model's measured accuracy and limitations. For high-stakes decisions, an inherently interpretable model may be the better choice.
  level: Mid
  category: ml-fundamentals
  subcategory: applied-ml
- id: what-is-concept-drift-and-how-do-you-handle-it
  q: What is concept drift and how do you handle it?
  a: |
    Concept drift is a change over time in the relationship between features and target, as opposed to data drift, a change in the feature distribution alone. It shows up as declining live performance. Handle it by monitoring input distributions and performance against delayed labels, retraining on recent data on a schedule or trigger, and weighting recent data more heavily.
  level: Senior
  category: ml-fundamentals
  subcategory: applied-ml
- id: walk-through-how-you-would-approach-an-end-to-end-ml-project
  q: Walk through how you would approach an end-to-end ML project.
  a: |
    Clarify the business goal and translate it into a measurable ML objective and success metric. Explore the data, check quality and leakage risks, and build a simple baseline. Engineer features, train and compare models with proper validation, and analyze errors. Then deploy with monitoring for data drift and performance, set up retraining, and confirm business impact with an online experiment.
  level: Senior
  category: ml-fundamentals
  subcategory: applied-ml
