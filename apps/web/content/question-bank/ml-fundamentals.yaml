- id: explain-how-linear-regression-works-and-its-key-assumptions
  q: Explain how linear regression works and its key assumptions.
  a: |
    Linear regression fits a weighted sum of features to predict a continuous target, usually by minimizing squared error, which has a closed-form solution or can be solved with gradient descent. Classical assumptions are a linear relationship, independent errors, constant error variance and, for inference, normally distributed errors, plus limited multicollinearity among features.
  level: Junior
  category: ml-fundamentals
  subcategory: linear-models
- id: why-is-logistic-regression-a-classification-model-if-it-has
  q: Why is logistic regression a classification model if it has 'regression' in its name?
  a: |
    It regresses the log-odds of the positive class as a linear function of the features, then applies the sigmoid to turn that into a probability. A threshold on the probability gives a class. It is trained with log loss rather than squared error, and its coefficients are interpretable as changes in log-odds.
  level: Junior
  category: ml-fundamentals
  subcategory: linear-models
- id: explain-how-an-svm-works-and-what-the-kernel-trick-does
  q: Explain how an SVM works and what the kernel trick does.
  a: |
    A support vector machine finds the decision boundary with the largest margin between classes, depending only on the closest points, the support vectors. Soft margins allow some violations, controlled by C. The kernel trick replaces dot products with a kernel function, letting the SVM find nonlinear boundaries as if features were mapped into a higher-dimensional space without computing that mapping explicitly.
  level: Mid
  category: ml-fundamentals
  subcategory: linear-models
- id: what-is-k-nearest-neighbors-and-what-are-its-weaknesses
  q: What is k-nearest neighbors, and what are its weaknesses?
  a: |
    k-NN predicts by looking at the k closest training examples and voting or averaging their labels. It needs no training, but prediction is slow on large datasets, it needs feature scaling, and it suffers from the curse of dimensionality, where distances become less meaningful as the number of features grows.
  level: Junior
  category: ml-fundamentals
  subcategory: linear-models
- id: why-is-naive-bayes-naive-and-why-does-it-still-work
  q: Why is Naive Bayes 'naive', and why does it still work?
  a: |
    It assumes features are conditionally independent given the class, which is rarely true. It still works well for tasks like text classification because it only needs the correct class to have the highest score, not calibrated probabilities, and it is fast, needs little data and is robust to many irrelevant features.
  level: Mid
  category: ml-fundamentals
  subcategory: linear-models
- id: what-is-the-difference-between-parametric-and-non-parametric
  q: What is the difference between parametric and non-parametric models?
  a: |
    Parametric models have a fixed number of parameters regardless of data size, such as linear and logistic regression, so they are fast and data-efficient but limited by their assumptions. Non-parametric models grow in complexity with the data, such as k-NN and decision trees, so they are more flexible but need more data and can be slower.
  level: Mid
  category: ml-fundamentals
  subcategory: linear-models
- id: generative-vs-discriminative-models-what-is-the-difference
  q: 'Generative vs discriminative models: what is the difference?'
  a: |
    Discriminative models learn the boundary or the conditional probability of the label given the features directly, such as logistic regression. Generative models learn how the data is generated, the joint distribution of features and labels, such as Naive Bayes, and can produce new samples. Discriminative models usually classify better with enough data; generative ones can work with less data and handle missing features.
  level: Mid
  category: ml-fundamentals
  subcategory: linear-models
- id: how-do-bagging-and-boosting-differ-what-is-the-computational
  q: How do bagging and boosting differ? What is the computational difference between XGBoost and Random Forest?
  a: |
    Bagging trains models independently on bootstrap samples and averages them, mainly reducing variance; boosting trains models sequentially, each correcting the previous ensemble's errors, mainly reducing bias.

    Computationally, a random forest's trees can be built fully in parallel, are deep, and each split considers a random subset of features. XGBoost builds shallow trees one after another, so trees cannot be parallelized across the ensemble, but each tree's split finding is parallelized over features using pre-sorted or histogram-based data, with second-order gradients, regularization and handling of missing values. Random forests are easier to tune; XGBoost usually reaches higher accuracy with tuning.
  level: Mid
  category: ml-fundamentals
  subcategory: trees-ensembles
  companies:
  - Amazon
  source: outcome-school
- id: explain-strategies-to-combat-overfitting-in-tree-based-class
  q: Explain strategies to combat overfitting in tree-based classification models.
  a: |
    For single trees: limit maximum depth, require a minimum number of samples per split or leaf, prune after growing using validation data or cost-complexity pruning, and limit the number of leaves.

    For ensembles: use bagging and random feature subsets (random forests), and for boosting use a small learning rate with early stopping, row and column subsampling, regularization on leaf weights and shallow trees. Validate with cross-validation and remove leaky or noisy features.
  level: Mid
  category: ml-fundamentals
  subcategory: trees-ensembles
  companies:
  - NVIDIA
  source: outcome-school
- id: how-does-a-decision-tree-decide-where-to-split
  q: How does a decision tree decide where to split?
  a: |
    At each node it tries candidate features and thresholds and picks the split that most reduces impurity in the child nodes, measured with Gini impurity or entropy for classification and variance or squared error for regression. It repeats recursively until a stopping rule such as maximum depth or minimum samples per leaf.
  level: Junior
  category: ml-fundamentals
  subcategory: trees-ensembles
- id: why-do-random-forests-use-random-feature-subsets-at-each-spl
  q: Why do random forests use random feature subsets at each split?
  a: |
    Bootstrap samples alone still produce similar trees because strong features dominate the top splits. Limiting each split to a random subset of features decorrelates the trees, and averaging less correlated models reduces variance much more than averaging similar ones.
  level: Mid
  category: ml-fundamentals
  subcategory: trees-ensembles
- id: how-does-gradient-boosting-work
  q: How does gradient boosting work?
  a: |
    It builds an additive model of shallow trees. Each new tree is fit to the negative gradient of the loss with respect to the current predictions, which for squared error is simply the residuals. Its predictions are added with a small learning rate, and the process repeats. Libraries such as XGBoost, LightGBM and CatBoost add regularization, efficient split finding and handling of categorical features.
  level: Mid
  category: ml-fundamentals
  subcategory: trees-ensembles
- id: why-do-gradient-boosted-trees-often-beat-neural-networks-on
  q: Why do gradient-boosted trees often beat neural networks on tabular data?
  a: |
    Tabular features are heterogeneous, often irregular in their effect, and datasets are moderate in size. Trees handle mixed scales, missing values and sharp thresholds naturally and are robust to uninformative features, while neural networks need more data, careful preprocessing and tuning to match them. Neural networks win when there is a lot of data or rich unstructured inputs such as text and images.
  level: Senior
  category: ml-fundamentals
  subcategory: trees-ensembles
- id: how-do-you-evaluate-a-clustering-model-s-effectiveness-witho
  q: How do you evaluate a clustering model's effectiveness without pre-labelled groups?
  a: |
    Use internal metrics: silhouette score, Davies-Bouldin index and within-cluster versus between-cluster distances, measuring compactness and separation. Check stability by re-running on bootstrap samples or with different seeds and measuring how consistent the clusters are.

    Most importantly, judge usefulness: inspect clusters for interpretability with domain experts, check that they lead to different actions or outcomes, and if possible validate against downstream metrics such as campaign performance per segment.
  level: Mid
  category: ml-fundamentals
  subcategory: unsupervised
  companies:
  - NVIDIA
  source: outcome-school
- id: how-does-k-means-clustering-work-and-how-do-you-choose-k
  q: How does k-means clustering work and how do you choose k?
  a: |
    k-means picks k centroids, assigns each point to the nearest one, recomputes centroids as the mean of their points, and repeats until assignments stop changing. It assumes roughly spherical clusters of similar size and is sensitive to initialization, so k-means++ is used. Choose k with the elbow method, silhouette score, or most importantly what is useful for the business problem.
  level: Junior
  category: ml-fundamentals
  subcategory: unsupervised
- id: what-is-pca-and-when-would-you-use-it
  q: What is PCA and when would you use it?
  a: |
    Principal component analysis finds orthogonal directions of maximum variance and projects the data onto the top few, reducing dimensionality while keeping as much variance as possible. It is used for visualization, noise reduction, speeding up models and handling multicollinearity. It is linear and unsupervised, so the kept components are not guaranteed to be the most predictive, and features should be standardized first.
  level: Mid
  category: ml-fundamentals
  subcategory: unsupervised
- id: compute-the-kl-divergence-given-different-random-variables
  q: Compute the KL divergence given different random variables.
  a: |
    KL divergence from Q to P is the sum over outcomes of P(x) × log(P(x) / Q(x)), or the integral for continuous variables. Example: for coins with P(heads) = 0.5 and Q(heads) = 0.9, KL(P‖Q) = 0.5 log(0.5/0.9) + 0.5 log(0.5/0.1) ≈ 0.51 nats.

    Know its properties: it is always non-negative, zero only when the distributions match, not symmetric (KL(P‖Q) differs from KL(Q‖P)), and infinite if Q assigns zero probability where P does not. For two Gaussians there is a closed form based on their means and variances.
  level: Mid
  category: ml-fundamentals
  subcategory: optimization-rl
  companies:
  - OpenAI
  source: outcome-school
- id: if-the-accuracy-of-a-classifier-is-1-what-is-the-lower-upper
  q: If the accuracy of a classifier is 1, what is the lower/upper bound on the loss function for a single training example?
  a: |
    Accuracy of 1 means the predicted class is always correct, so with cross-entropy the true class has the highest probability. For binary classification that probability is above 0.5, so the per-example loss is above 0 (approached as the probability nears 1) and below −log(0.5) ≈ 0.69. With K classes, the true class's probability can be as low as just above 1/K, so the upper bound is just under log K.

    The point is that accuracy and loss measure different things: a perfectly accurate classifier can still be poorly calibrated and have meaningful loss.
  level: Mid
  category: ml-fundamentals
  subcategory: optimization-rl
  companies:
  - OpenAI
