- id: explain-the-svd-and-give-two-places-it-shows-up-in-modern-de
  q: Explain the SVD and give two places it shows up in modern deep learning.
  a: |
    Singular value decomposition factors any matrix A into U Σ Vᵀ, where U and V have orthonormal columns and Σ is diagonal with non-negative singular values in decreasing order. Keeping the top k singular values gives the best rank-k approximation of A.

    In deep learning it appears in low-rank adaptation and compression (LoRA's premise that weight updates are low rank, and SVD-based initialization or compression of weight matrices), in analyzing and pruning layers, in spectral normalization that controls the largest singular value for training stability, and in PCA for embeddings.
  level: Senior
  category: ml-fundamentals
  subcategory: core-concepts
  companies:
  - Google DeepMind
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  source: outcome-school
- id: explain-the-bias-variance-trade-off-cross-validation-and-the
  q: Explain the bias-variance trade-off, cross-validation, and the curse of dimensionality.
  a: |
    Bias is error from overly simple assumptions, causing underfitting; variance is error from sensitivity to the specific training data, causing overfitting. Expected error decomposes into bias squared plus variance plus irreducible noise, and increasing model complexity typically lowers bias while raising variance, so you look for the complexity with the lowest total error.

    Cross-validation estimates that error on unseen data by training on k−1 folds and validating on the remaining fold, rotating, which guides model selection. The curse of dimensionality means that as features grow, data becomes sparse, distances become less meaningful and far more data is needed, which increases variance unless you reduce dimensions or regularize.
  level: Junior
  category: ml-fundamentals
  subcategory: core-concepts
  companies:
  - Amazon
  - Google DeepMind
  source: outcome-school
- id: what-is-the-difference-between-supervised-unsupervised-and-r
  q: What is the difference between supervised, unsupervised and reinforcement learning?
  a: |
    Supervised learning trains on labeled examples to predict a target, such as price or spam. Unsupervised learning finds structure in unlabeled data, such as clusters or lower-dimensional representations. Reinforcement learning trains an agent to take actions in an environment to maximize cumulative reward, learning from trial and error rather than labels.
  level: Junior
  category: ml-fundamentals
  subcategory: core-concepts
- id: how-do-you-detect-and-fix-overfitting
  q: How do you detect and fix overfitting?
  a: |
    Overfitting shows up as low training error but much higher validation error. Fixes include more or cleaner data, simpler models, regularization (L1, L2, dropout), early stopping, cross-validation for model selection, feature selection, and ensembling methods such as bagging that reduce variance.
  level: Junior
  category: ml-fundamentals
  subcategory: core-concepts
- id: why-does-l1-produce-sparse-weights
  q: Why does L1 produce sparse weights?
  a: |
    The L1 penalty has a constant gradient magnitude regardless of how small a weight is, so it keeps pushing small weights all the way to zero. Geometrically, the L1 constraint region is a diamond with corners on the axes, and the loss contours tend to touch it at a corner, where some weights are exactly zero. The L2 region is round, so solutions rarely land exactly on an axis.
  level: Mid
  category: ml-fundamentals
  subcategory: core-concepts
- id: what-is-data-leakage-give-examples
  q: What is data leakage? Give examples.
  a: |
    Leakage is when training uses information that would not be available at prediction time, so offline scores look great but production fails. Examples include features computed from the target, scaling or imputing with statistics from the full dataset before splitting, random splits on time-dependent data, and duplicate records across train and test. Prevent it with time-aware splits and fitting all preprocessing on training data only.
  level: Mid
  category: ml-fundamentals
  subcategory: core-concepts
- id: how-do-you-deal-with-missing-values
  q: How do you deal with missing values?
  a: |
    Understand why they are missing first. Options are dropping rows or columns when missingness is rare and random, imputing with mean, median, mode or a model, adding a "was missing" indicator because missingness itself can be informative, or using models such as gradient-boosted trees that handle missing values natively. Fit imputers on training data only.
  level: Junior
  category: ml-fundamentals
  subcategory: core-concepts
- id: why-and-when-should-you-scale-features
  q: Why and when should you scale features?
  a: |
    Distance-based and gradient-based models, such as k-NN, SVMs, k-means, linear models with regularization and neural networks, are sensitive to feature scale, so features with large ranges dominate. Standardization or min-max scaling fixes that. Tree-based models split on thresholds and do not need scaling.
  level: Junior
  category: ml-fundamentals
  subcategory: core-concepts
- id: what-are-the-assumptions-of-linear-regression
  q: What are the assumptions of linear regression?
  a: |
    A linear relationship between features and target; independent errors; constant error variance (homoscedasticity); normally distributed errors for valid inference such as confidence intervals; and no perfect multicollinearity among features.

    Check them with residual plots against fitted values, Q-Q plots, autocorrelation tests for time data and variance inflation factors. Violations do not always ruin predictions, but they make coefficients and p-values unreliable.
  level: Junior
  category: ml-fundamentals
  subcategory: linear-models
  companies:
  - Google DeepMind
  source: outcome-school
- id: what-is-the-closed-form-solution-of-linear-regression-and-wh
  q: What is the closed-form solution of linear regression, and when do you use gradient descent instead?
  a: |
    The normal equation gives w = (XᵀX)⁻¹Xᵀy, which minimizes squared error exactly; with L2 regularization it becomes (XᵀX + λI)⁻¹Xᵀy.

    Use gradient descent when there are many features, since inverting a d×d matrix costs about d³; when data is too large for memory or arrives in streams; or when XᵀX is ill-conditioned. In practice, solvers use QR or SVD decompositions rather than explicit inversion for stability.
  level: Mid
  category: ml-fundamentals
  subcategory: linear-models
  companies:
  - Amazon
  refs:
  - title: Math Behind Gradient Descent
    url: https://outcomeschool.com/blog/math-behind-gradient-descent
  source: outcome-school
- id: what-are-the-differences-between-l1-and-l2-regularization-in
  q: What are the differences between L1 and L2 regularization in logistic regression?
  a: |
    L1 adds the sum of absolute weights to the loss, pushing many weights exactly to zero, which performs feature selection and gives sparse, interpretable models. L2 adds the sum of squared weights, shrinking weights smoothly without zeroing them, handling correlated features more gracefully by spreading weight among them.

    In logistic regression both reduce overfitting; L1 suits high-dimensional data with few relevant features, L2 is a good default, and elastic net combines them. Both require standardized features so the penalty treats features fairly.
  level: Junior
  category: ml-fundamentals
  subcategory: linear-models
  companies:
