- id: what-are-the-key-components-of-a-transformer-model-and-why-d
  q: What are the key components of a Transformer model and why does each matter?
  a: |
    Token embeddings turn ids into vectors, and positional information gives order. Each block has self-attention, which lets tokens exchange information, and a feed-forward network, which transforms each token on its own and holds most of the parameters. Residual connections and normalization wrap both sub-layers so deep stacks train stably.

    Masks control what each token may attend to, and a final projection with softmax turns vectors into next-token probabilities. Every piece has a job: remove positions and order is lost, remove residuals and depth becomes untrainable, remove attention and tokens cannot use context.
  level: Junior
