- id: what-is-multi-head-latent-attention-mla-and-why-did-deepseek
  q: What is Multi-head Latent Attention (MLA) and why did DeepSeek introduce it?
  a: |
    Multi-head latent attention compresses each token's keys and values into one small latent vector and caches only that latent. At attention time, per-head keys and values are reconstructed through up-projections, which can be folded into the query and output projections so the full keys and values never need to be materialized. Rotary position information is carried in a small separate decoupled key, because RoPE does not commute with the compression.

    DeepSeek introduced it in DeepSeek-V2 to cut KV cache memory dramatically, which they reported as a reduction of over 90% versus their earlier model, while keeping or improving quality. Compared with GQA, which reduces cache by sharing heads, MLA keeps every head's keys distinct in a compressed space, so it saves similar or more memory with less quality loss, at the cost of extra projection compute and a more complex implementation.
