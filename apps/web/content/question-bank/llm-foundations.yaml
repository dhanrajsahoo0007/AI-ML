- id: explain-swiglu-and-why-gated-activations-replaced-relu-gelu
  q: Explain SwiGLU and why gated activations replaced ReLU/GELU in modern LLM MLP blocks.
  a: |
    SwiGLU replaces the feed-forward block's single activation with a gated product: one linear projection goes through a Swish (SiLU) activation and is multiplied element-wise by a second linear projection, and the result is projected back down. The gate lets the network control, per dimension, how much information passes.

    Gated variants gave consistently better quality per unit of compute in experiments, so modern LLMs adopted them. Because there are three weight matrices instead of two, the hidden size is usually reduced to about two-thirds of the classic 4x width to keep parameter count similar.
