- id: explain-how-a-mixtral-style-sparse-mixture-of-experts-model
  q: Explain how a Mixtral-style sparse mixture-of-experts model works. Why does a ~47B-parameter model run at roughly the cost of a ~13B one?
  a: |
    Mixtral has 8 expert feed-forward networks per layer and a router that sends each token to its top 2 experts, combining their outputs by router weight. Attention and embeddings are shared; only the feed-forward layers are duplicated.

    Adding up all experts gives about 47B parameters, but each token passes through shared layers plus only 2 of 8 experts, roughly 13B active parameters, so compute per token is close to a 13B dense model. Memory still has to hold all 47B, which is the main cost.
  level: Mid
  category: llm-foundations
