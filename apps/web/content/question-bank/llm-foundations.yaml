- id: glm-has-been-bilingual-chinese-english-since-glm-130b-what-c
  q: GLM has been bilingual Chinese/English since GLM-130B. What changes in tokenization, data and evaluation when a model must serve both languages well?
  a: |
    The tokenizer must cover both scripts efficiently, so the vocabulary is trained on balanced bilingual data; otherwise Chinese text costs far more tokens per sentence than English. The pre-training mixture must balance the two languages and include parallel and code-switched text so knowledge transfers across them.

    Evaluation has to be done separately per language with native benchmarks, not translated ones, and include cross-lingual tasks and checks that one language did not regress while the other improved.
