- id: what-are-embeddings-and-how-are-they-used-with-llms
  q: What are embeddings, and how are they used with LLMs?
  a: |
    Embeddings are vectors that represent text so that similar meanings are close together. They power semantic search, RAG retrieval, clustering, deduplication and recommendation. Embedding models are usually separate, smaller encoder models from the generator LLM.
  level: Junior
  category: llm-foundations
  subcategory: tokenization-embeddings
- id: why-do-llms-struggle-with-tasks-like-counting-letters-or-exa
  q: Why do LLMs struggle with tasks like counting letters or exact arithmetic?
  a: |
    They operate on sub-word tokens, so individual letters and digits are often hidden inside larger tokens, and numbers are split inconsistently. The model must infer spelling and digit structure indirectly. Spelling a word out first, or using tools for arithmetic, avoids the problem.
  level: Mid
  category: llm-foundations
  subcategory: tokenization-embeddings
- id: what-is-weight-tying-between-input-embeddings-and-the-output
  q: What is weight tying between input embeddings and the output layer?
  a: |
    Using the same matrix for the token embedding lookup and the final projection to vocabulary logits. It reduces parameters, which matters for large vocabularies, and often improves quality because both directions share one representation of each token.
  level: Mid
  category: llm-foundations
  subcategory: tokenization-embeddings
- id: what-is-a-mixture-of-experts-architecture-and-how-does-it-sc
  q: What is a mixture-of-experts architecture and how does it scale capacity without scaling FLOPs?
  a: |
    An MoE layer replaces the single feed-forward network in a transformer block with many expert networks plus a small router. For each token the router picks the top-k experts, often one or two, runs only those and mixes their outputs by the router weights.

    Total parameters, and therefore capacity, grow with the number of experts, but compute per token depends only on the experts actually used. The costs are memory, since every expert must be loaded, load balancing so experts get used evenly, and all-to-all communication when experts sit on different GPUs.
  level: Mid
  category: llm-foundations
  subcategory: architectures
