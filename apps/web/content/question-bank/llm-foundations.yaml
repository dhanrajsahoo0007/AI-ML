- id: explain-self-attention-what-is-its-computational-complexity
  q: Explain self-attention. What is its computational complexity, and what are your options when contexts get long?
  a: |
    Self-attention lets every token compute a relevance-weighted mix of every other token's values, using query-key dot products and a softmax. Each of n tokens compares with n keys, so compute is O(n²·d) and a naive implementation stores an n×n matrix per head.

    For long contexts the options are: FlashAttention to make exact attention memory-efficient; sliding-window or sparse attention to limit which pairs are computed; GQA, MLA or cache quantization to shrink the KV cache; linear-attention or state-space hybrids; and system-level choices such as retrieval to keep prompts short. Each trades some combination of exactness, recall and engineering complexity.
  level: Mid
  category: llm-foundations
