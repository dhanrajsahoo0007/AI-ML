- id: walk-me-through-what-happens-tensor-by-tensor-in-one-forward
  q: Walk me through what happens, tensor by tensor, in one forward pass of a decoder-only transformer.
  a: |
    Token ids of shape (batch, seq) are looked up in the embedding table to give (batch, seq, d_model). In each layer, the hidden states are normalized, projected into Q, K and V, reshaped to (batch, heads, seq, head_dim), and rotary position embeddings are applied to Q and K. Scores QKᵀ/√d have shape (batch, heads, seq, seq); the causal mask sets future positions to minus infinity, a softmax gives weights, and multiplying by V gives (batch, heads, seq, head_dim), which is merged back to d_model and projected by the output matrix.

    That result is added to the residual stream, normalized again, passed through the feed-forward block that expands to the hidden size and back, and added to the residual again. After the last layer a final norm is applied and the vectors are projected to vocabulary size, giving logits of shape (batch, seq, vocab); training applies cross-entropy at every position, while generation takes the last position's logits.
  level: Senior
  category: llm-foundations
  subcategory: architectures
  companies:
