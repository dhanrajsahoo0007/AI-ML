  source: outcome-school
- id: glm-s-original-pre-training-objective-is-autoregressive-blan
  q: GLM's original pre-training objective is autoregressive blank infilling. How does it differ from BERT and GPT, and why did the team argue it unifies understanding and generation?
  a: |
    GLM masks random spans of the input and trains the model to regenerate each span autoregressively, while the unmasked context is visible bidirectionally. Two-dimensional position encodings tell the model where a span sits in the original text and the position within the span.

    BERT fills single masked tokens independently and cannot generate fluently; GPT generates left to right but sees only past context. By varying span lengths, from short blanks to whole document endings, one objective trains both understanding (bidirectional context) and generation (autoregressive spans), which is why the team argued it unifies the two.
  level: Senior
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - Zhipu AI
  related: /ai-system-design/genai-system-design/encoder-decoder-families
  refs:
  - title: Encoder vs Decoder in Transformers
    url: https://outcomeschool.com/blog/encoder-vs-decoder-in-transformers
  source: outcome-school
- id: how-is-bert-pre-trained
  q: How is BERT pre-trained?
  a: |
    With masked language modeling, where about 15% of tokens are selected and the model predicts them from both directions, and originally with next sentence prediction, which classifies whether two sentences are consecutive. Later work such as RoBERTa showed that dropping next sentence prediction and training longer improves results.
  level: Junior
  category: llm-foundations
  subcategory: pretraining-scaling
- id: what-is-span-corruption-in-t5
  q: What is span corruption in T5?
  a: |
    Random spans of the input are replaced with sentinel tokens, and the decoder is trained to output the missing spans in order. It teaches the model to reconstruct multi-token gaps and fits T5's text-to-text framing.
  level: Mid
  category: llm-foundations
  subcategory: pretraining-scaling
- id: what-are-scaling-laws
  q: What are scaling laws?
  a: |
    Empirical findings that language model loss decreases as a smooth power law as parameters, training tokens and compute increase. They let teams predict the loss of a large run from small ones and choose model size and data size for a budget.
  level: Mid
  category: llm-foundations
  subcategory: pretraining-scaling
- id: how-do-you-estimate-training-compute-for-an-llm
  q: How do you estimate training compute for an LLM?
  a: |
    About 6 floating-point operations per parameter per training token, 2 for the forward pass and 4 for the backward pass. A 7-billion-parameter model on 2 trillion tokens needs about 8.4e22 operations.
  level: Mid
  category: llm-foundations
  subcategory: pretraining-scaling
- id: why-is-teacher-forcing-used-when-training-decoders
  q: Why is teacher forcing used when training decoders?
  a: |
    During training, the decoder is fed the ground-truth previous tokens rather than its own predictions, which lets all positions be trained in parallel and stabilizes learning. The downside is exposure bias: at inference the model conditions on its own possibly wrong outputs, a situation it saw less during training.
  level: Mid
  category: llm-foundations
  subcategory: pretraining-scaling
- id: compare-greedy-beam-search-top-k-top-p-and-temperature-sampl
  q: Compare greedy, beam search, top-k, top-p and temperature sampling. When does each fail?
  a: |
    Greedy decoding always takes the most likely token; it is fast and deterministic but can be repetitive and miss better overall sequences. Beam search keeps several candidate sequences and suits tasks with one right answer such as translation, but in open-ended generation it produces bland, repetitive text.

    Sampling methods add diversity. Temperature rescales logits: low values become near-greedy, high values become random and incoherent. Top-k samples from the k most likely tokens, which fails when the distribution is very flat or very peaked because k is fixed. Top-p samples from the smallest set whose probability exceeds p, adapting to the distribution, but very high p still admits unlikely tokens. Factual tasks favor low temperature; creative tasks favor moderate temperature with top-p.
  level: Mid
  category: llm-foundations
  subcategory: llm-behaviour
  companies:
  - Apple
  - Google DeepMind
  - Perplexity
  related: /ai-system-design/genai-system-design/transformer-architecture
  refs:
  - title: How does Temperature control LLM output?
    url: https://outcomeschool.com/blog/how-does-temperature-control-llm-output
  - title: How do Top-k and Top-p Sampling work?
    url: https://outcomeschool.com/blog/how-do-top-k-and-top-p-sampling-work
  source: outcome-school
- id: what-is-the-lost-in-the-middle-problem-in-long-contexts-and
  q: What is the lost-in-the-middle problem in long contexts and how do you address it?
  a: |
    Studies found that models use information at the beginning and end of a long prompt more reliably than information in the middle, so accuracy dips when the key fact is buried mid-context, even in models that advertise long windows.

    Mitigations: retrieve fewer, better-ranked passages instead of stuffing the context, put the most relevant material at the start or end, repeat the question after long documents, and evaluate with tests that place the answer at many depths. Long-context training with information at varied positions also helps.
  level: Mid
  category: llm-foundations
  subcategory: llm-behaviour
  companies:
  - Moonshot AI
  related: /ai-system-design/genai-system-design/rag-fundamentals
  refs:
  - title: The Lost in the Middle Problem in LLMs
    url: https://outcomeschool.com/blog/lost-in-the-middle-problem-in-llms
  source: outcome-school
- id: what-is-the-effect-of-adjusting-an-llm-s-context-window-size
  q: What is the effect of adjusting an LLM's context window size?
  a: |
    A larger window lets the model use more history, documents or code in one request, but attention compute grows roughly with the square of the length, the KV cache grows linearly, and time to first token rises with longer prompts. Costs per request go up accordingly.

    Quality does not automatically improve: models often use the middle of long contexts poorly, and extending a model beyond its trained length needs position-encoding rescaling and fine-tuning. Shrinking the window cuts cost and latency but forces truncation, summarization or retrieval to fit what matters.
  level: Junior
  category: llm-foundations
  subcategory: llm-behaviour
  companies:
  - OpenAI
  related: /ai-system-design/genai-system-design/efficient-attention
  refs:
