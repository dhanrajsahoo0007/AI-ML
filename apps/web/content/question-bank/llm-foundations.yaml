- id: our-flagship-is-a-sparse-moe-with-10x-more-total-than-active
  q: Our flagship is a sparse MoE with ~10x more total than active parameters. Why is that architecture a good fit for private enterprise deployment, and where does it hurt?
  a: |
    For private deployments, compute per token sets throughput and latency, and an MoE with 10x fewer active than total parameters delivers big-model quality at small-model compute, so a customer gets more quality per GPU-hour.

    It hurts on memory: every expert must sit in GPU memory, so the minimum hardware footprint matches the total parameter count, which is hard on small on-premise clusters. Expert parallelism adds all-to-all communication, load varies between batches, and fine-tuning and quantization are trickier. The fit is best where customers have enough memory but care about throughput.
  level: Senior
  category: llm-foundations
