- id: explain-scaled-dot-product-attention-and-why-the-1-sqrt-d-k
  q: Explain scaled dot-product attention and why the 1/sqrt(d_k) scaling factor matters.
  a: |
    Each token is projected into a query, a key and a value. Attention computes softmax(QKᵀ / √d_k)·V: every query is compared with every key by dot product, the scores are turned into weights with a softmax, and the output is the weighted sum of the values.

    The scale matters because the dot product of two random d_k-dimensional vectors has variance that grows with d_k. Without dividing by √d_k, scores become large, the softmax saturates into a near one-hot distribution, and its gradients become tiny, so training slows or stalls. Scaling keeps the score variance near one.
  level: Junior
  category: llm-foundations
  subcategory: attention
  related: /ai-system-design/genai-system-design/self-attention-explained
