- id: why-did-transformers-displace-rnns-for-language-modelling-an
  q: Why did transformers displace RNNs for language modelling, and what exactly does the KV cache buy you at inference time?
  a: |
    RNNs process tokens one at a time, so training cannot parallelize across the sequence, and information from early tokens fades over long distances. Transformers process all positions in parallel during training and connect any two tokens in one attention step, so they train much faster on GPUs, scale better and handle long-range dependencies.

    At inference, the KV cache stores every past token's keys and values for each layer, so generating a new token only computes that token's projections and attends to the cache, instead of reprocessing the whole sequence. It trades memory for a large reduction in compute per step.
