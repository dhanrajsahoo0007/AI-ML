- id: explain-the-architectural-choices-in-a-llama-class-model-why
  q: 'Explain the architectural choices in a Llama-class model: why grouped-query attention, RoPE and SwiGLU instead of the vanilla 2017 Transformer?'
  a: |
    Llama-class models keep the decoder-only transformer but swap in improvements found after 2017. RoPE gives relative position information that extends better than learned absolute embeddings. Grouped-query attention cuts the KV cache so large models serve long contexts and big batches cheaply. SwiGLU feed-forward layers give better quality per FLOP than ReLU.

    They also use Pre-normalization with RMSNorm for stable deep training, drop bias terms, and train on far more tokens than the original Transformer. None of these change the basic idea; each removes a known bottleneck in quality, stability or inference cost.
