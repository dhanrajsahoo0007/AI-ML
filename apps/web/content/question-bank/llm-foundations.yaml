- id: deepseek-v3-uses-auxiliary-loss-free-load-balancing-what-was
  q: DeepSeek-V3 uses auxiliary-loss-free load balancing. What was wrong with the auxiliary loss, and how does the bias trick work?
  a: |
    The usual auxiliary balancing loss pushes the router toward even expert usage, but it competes with the language-modeling objective: set it strong and quality drops, set it weak and experts collapse.

    DeepSeek-V3 instead adds a per-expert bias to the routing scores used only for choosing the top-k experts, not for weighting their outputs. After each step, the bias of overloaded experts is decreased and of underloaded experts increased by a small fixed amount. Balance is steered without adding a gradient that fights the main loss; a very small sequence-level balance loss is kept only as a safeguard.
  level: Senior
  category: llm-foundations
