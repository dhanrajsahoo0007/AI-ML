- id: qwen-ships-both-dense-and-moe-models-30b-with-3b-active-235b
  q: Qwen ships both dense and MoE models (30B with ~3B active; 235B with ~22B active). When would you pick the 30B-A3B MoE over a 32B dense?
  a: |
    Pick the 30B-A3B MoE when throughput and latency per token matter and you have memory for all 30B parameters: with only about 3B active, it generates much faster and cheaper than a 32B dense model, with quality between a small and a large dense model.

    Pick the 32B dense model when you need the best quality at that size, when memory is tight relative to compute, or when simpler fine-tuning, quantization and serving matter. Dense models are also more predictable under heavy batching.
