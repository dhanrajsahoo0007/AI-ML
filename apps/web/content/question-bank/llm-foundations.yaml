- id: mistral-7b-shipped-with-grouped-query-attention-and-sliding
  q: Mistral 7B shipped with grouped-query attention and sliding-window attention. What does each buy you, and what does each cost?
  a: |
    Grouped-query attention shares key and value heads across groups of query heads, shrinking the KV cache and speeding up decoding at little quality cost. Sliding-window attention lets each token attend only to a fixed window of recent tokens (4,096 in Mistral 7B), so attention cost and cache size stop growing with sequence length, and a rolling buffer can store just the window.

    The cost of GQA is a small loss of expressiveness. The cost of sliding windows is that distant tokens are reachable only indirectly through stacked layers, so precise recall of far-away details can suffer compared with full attention.
