- id: walk-me-through-what-actually-happens-when-someone-calls-aut
  q: Walk me through what actually happens when someone calls AutoModelForCausalLM.from_pretrained(…, device_map=“auto”, torch_dtype=“auto”).
  a: |
    The library resolves the model id, downloads or reads the config, which names the architecture class, and the weight files, usually sharded safetensors with an index. torch_dtype="auto" picks the dtype stored in the config so weights load in, say, bf16 rather than fp32. With device_map="auto", the model is first created with empty weights, then Accelerate measures available GPU, CPU and disk memory and assigns layers to devices to fit.

    Each weight shard is then loaded directly onto its assigned device, and hooks are added so activations move between devices during the forward pass. Layers offloaded to CPU or disk work but are slow, so placement is worth checking after loading.
  level: Senior
  category: llm-foundations
  subcategory: architectures
  companies:
  - Hugging Face
  related: /ai-system-design/genai-system-design/llm-serving-inference
  source: outcome-school
- id: a-community-contributor-opens-a-pr-adding-a-new-model-archit
  q: 'A community contributor opens a PR adding a new model architecture to `transformers`. You''re the reviewing maintainer: what do you check, and how do you handle the interaction?'
  a: |
    Technically, check that outputs match the reference implementation numerically on the same weights and inputs, that the code follows the library's conventions and reuses existing components, that tests cover forward passes, generation, saving and loading, and different dtypes and devices, and that the configuration, tokenizer and documentation are complete with weights hosted correctly.

    On the human side, thank them, review promptly, explain the reasons behind requested changes, point to examples, help with failing tests, and keep the tone welcoming so they stay involved as a contributor.
  level: Mid
  category: llm-foundations
  subcategory: architectures
  companies:
  - Hugging Face
  related: /ai-system-design/genai-system-design/transformer-architecture
  source: outcome-school
- id: what-is-a-large-language-model-in-one-minute
  q: What is a large language model, in one minute?
  a: |
    A large language model is a transformer, usually decoder-only, trained on huge amounts of text to predict the next token. That simple objective at scale teaches grammar, facts, reasoning patterns and code. Instruction tuning and preference tuning then turn the base model into an assistant that follows requests.
  level: Junior
  category: llm-foundations
  subcategory: architectures
- id: compare-encoder-only-decoder-only-and-encoder-decoder-transf
  q: Compare encoder-only, decoder-only and encoder-decoder transformers.
  a: |
    Encoder-only models such as BERT use bidirectional attention and masked-token training, and excel at classification and embeddings. Decoder-only models such as GPT use causal attention and next-token training, and are the basis of most chat LLMs. Encoder-decoder models such as T5 read the input bidirectionally and generate with a causal decoder via cross-attention, which suits translation and summarization.
  level: Junior
  category: llm-foundations
  subcategory: architectures
- id: why-did-decoder-only-models-become-the-standard-for-llms
  q: Why did decoder-only models become the standard for LLMs?
  a: |
    One stack and one objective are simple to scale, and next-token prediction turns every token of text into a training signal. At scale they show in-context learning, and instruction tuning lets them handle almost any task as generation, so a single model can replace many task-specific ones.
  level: Mid
  category: llm-foundations
  subcategory: architectures
- id: why-do-moe-models-need-load-balancing
  q: Why do MoE models need load balancing?
  a: |
    Routers tend to favor experts that are already slightly better, which then get more training and become even more favored, collapsing onto a few experts. An auxiliary balancing loss and per-expert capacity limits keep tokens spread out so all experts learn and hardware stays evenly loaded.
  level: Senior
  category: llm-foundations
  subcategory: architectures
- id: where-are-most-parameters-in-a-transformer-and-where-is-most
  q: Where are most parameters in a transformer, and where is most compute at long context?
  a: |
    In a standard block the feed-forward network holds about two-thirds of the parameters, attention projections about one-third. At short context, compute follows parameters. At long context, the quadratic attention term and the KV cache dominate, which is why long-context work focuses on attention efficiency.
  level: Senior
  category: llm-foundations
  subcategory: architectures
- id: your-pretraining-loss-suddenly-diverges-at-step-300k-of-a-lo
  q: Your pretraining loss suddenly diverges at step 300k of a long run. Diagnose and fix it.
  a: |
    First rule out data and hardware: inspect the batches just before the spike for corrupted, duplicated or unusual data, and check for faulty nodes, NaNs or silent data corruption. Then check training dynamics: gradient norm spikes, growing attention logits or activation magnitudes, optimizer state issues, a learning-rate schedule event, or low-precision overflow.

    Fix by rolling back to a checkpoint before the spike and skipping the bad data, lowering the learning rate, tightening gradient clipping, adding stabilizers such as QK-normalization, z-loss on logits or higher precision in sensitive operations, and adjusting Adam's epsilon or beta2. Keep monitoring so the next spike is caught early.
  level: Senior
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - Google DeepMind
  - xAI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: design-a-deduplication-pipeline-for-a-web-scale-pretraining
  q: Design a deduplication pipeline for a web-scale pretraining corpus. It has to run as a streaming process.
  a: |
    Normalize text first, then deduplicate at several levels. Exact duplicates are removed by hashing normalized documents; near-duplicates are found with MinHash over word shingles and locality-sensitive hashing to bucket similar documents; repeated boilerplate lines or paragraphs are removed within and across documents.

    As a streaming process, keep the LSH buckets and hash signatures in a sharded key-value store, and process documents in order, checking each against existing signatures before inserting. Measure the effect by training small ablation models on deduplicated versus raw samples, and watch for over-deduplication removing legitimately repeated content such as licenses or common code.
  level: Senior
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - xAI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: fp8-training-at-671b-scale-is-hard-what-actually-breaks-in-l
  q: FP8 training at 671B scale is hard. What actually breaks in low precision, and how do you make it stable?
  a: |
    FP8 has very little range and precision, so outliers in activations, weights or gradients either overflow or get crushed to zero, and accumulating many products in low precision loses accuracy. At large scale these errors compound into divergence.

    DeepSeek-V3's approach: fine-grained scaling, with separate scale factors for small tiles of activations and blocks of weights so one outlier does not ruin a whole tensor; accumulating matmul results in higher precision at regular intervals; keeping sensitive components such as embeddings, the output head, normalization and attention in higher precision; and storing optimizer state in higher precision. They validated against BF16 training at smaller scale first.
  level: Senior
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - DeepSeek
  related: /ai-system-design/genai-system-design/gpu-performance-for-llms
  source: outcome-school
- id: deepseek-claims-frontier-class-results-at-a-fraction-of-the
  q: DeepSeek claims frontier-class results at a fraction of the usual training cost. If an interviewer asks “how is that even possible,” what is your structured answer?
  a: |
    Structure it as architecture, numerics, systems and accounting. Architecture: a sparse MoE with about 37B active of 671B parameters and multi-head latent attention, so each token costs far less compute and memory. Numerics: FP8 training. Systems: DualPipe and custom communication kernels that overlap all-to-all traffic with compute, keeping GPU utilization high. Data and objectives: high-quality data and multi-token prediction for denser training signal.

    Accounting: the widely quoted figure covers the GPU hours of the final training run, about 2.8 million H800 hours, not research, ablations, failed runs, data or salaries. So the efficiency is real and comes from many compounding engineering choices, but the full cost of developing the model is higher than the headline number.
  level: Senior
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - DeepSeek
  related: /ai-system-design/genai-system-design/mixture-of-experts
  source: outcome-school
- id: training-a-trillion-parameter-model-attention-logits-can-blo
  q: Training a trillion-parameter model, attention logits can blow up and destabilise the run. What is going on, and how does something like MuonClip address it?
  a: |
    If query and key projection weights grow during training, attention logits, the query-key dot products, become huge, the softmax saturates and gradients spike, which can destabilize or diverge the run. Aggressive optimizers such as Muon make this more likely at large scale.

    MuonClip combines the Muon optimizer with QK-Clip: after each update, if the maximum attention logit for a head exceeds a threshold, the query and key weights for that head are rescaled down so logits stay bounded. It targets the cause directly without changing the architecture, and Moonshot reported training Kimi K2 without loss spikes this way.
  level: Senior
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - Moonshot AI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: you-re-building-a-web-scale-pretraining-corpus-fineweb-style
  q: You're building a web-scale pretraining corpus (FineWeb-style). Walk me through the pipeline and how you decide whether each filter earns its place.
  a: |
    Start from web crawl dumps: URL filtering for spam and adult sites, text extraction from HTML with a good extractor, language identification, quality filtering with heuristics (length, repetition, punctuation and stop-word ratios) and model-based classifiers, near-duplicate removal with MinHash, and removal of personal data.

    Decide whether each filter earns its place empirically: train small ablation models on data with and without the filter, at equal token counts, and compare on a fixed set of benchmarks; keep filters that improve results, and watch for filters that remove too much useful diversity. This is how the FineWeb team made and documented its choices.
  level: Senior
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - Hugging Face
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: what-do-the-chinchilla-scaling-laws-say-and-how-do-they-diff
  q: What do the Chinchilla scaling laws say, and how do they differ from earlier scaling intuitions?
  a: |
    Chinchilla found that for a fixed training compute budget, model size and training tokens should grow in roughly equal proportion, at about 20 tokens per parameter. A 70B model trained on 1.4 trillion tokens beat the 280B Gopher trained with the same compute.

    Earlier work by Kaplan and colleagues suggested putting most extra compute into bigger models with relatively little extra data, so many large models were undertrained. In practice, teams now often train past the Chinchilla ratio on purpose, because a smaller model trained longer is cheaper to serve over its lifetime.
  level: Mid
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - Anthropic
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: explain-the-difference-between-pre-training-supervised-fine
  q: Explain the difference between pre-training, supervised fine-tuning and preference optimisation.
  a: |
    Pre-training teaches language and world knowledge through next-token prediction on trillions of tokens, producing a base model that continues text but does not reliably follow instructions. Supervised fine-tuning trains on curated prompt and response pairs so the model follows instructions and adopts a format.

    Preference optimization then aligns outputs with what people prefer, using comparisons between responses: RLHF trains a reward model and optimizes against it with reinforcement learning, while DPO optimizes directly on preference pairs. Each stage uses far less data than the one before but shapes behavior strongly.
  level: Junior
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - Meta
  - Scale AI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
