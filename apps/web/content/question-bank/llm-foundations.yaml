    url: https://outcomeschool.com/blog/decoding-instructgpt
  - title: Reinforcement Learning from Human Feedback (RLHF)
    url: https://outcomeschool.com/blog/reinforcement-learning-from-human-feedback-rlhf
  source: outcome-school
- id: what-is-the-relationship-between-cross-entropy-kl-divergence
  q: What is the relationship between cross-entropy, KL divergence and perplexity, and why is cross-entropy the training loss for language models?
  a: |
    Cross-entropy between the true data distribution and the model equals the data's own entropy plus the KL divergence from data to model. Since the data entropy is fixed, minimizing cross-entropy is the same as minimizing KL divergence, which is the same as maximizing the likelihood of the training text.

    Perplexity is the exponential of the average cross-entropy per token, roughly how many equally likely choices the model is torn between. Cross-entropy is the training loss because it is the negative log-likelihood of next-token prediction: it is smooth, has simple gradients with a softmax, and directly rewards putting probability on what actually comes next.
  level: Mid
  category: llm-foundations
  subcategory: pretraining-scaling
  companies:
  - OpenAI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  refs:
  - title: Math Behind Cross-Entropy Loss
    url: https://outcomeschool.com/blog/math-behind-cross-entropy-loss
  source: outcome-school
- id: what-is-multi-token-prediction-mtp-and-why-train-with-it
  q: What is multi-token prediction (MTP) and why train with it?
  a: |
    Multi-token prediction trains the model to predict several future tokens at each position, not just the next one. In DeepSeek-V3's version, small extra modules sequentially predict the following tokens while sharing the embedding and output head with the main model.

    It densifies the training signal and encourages representations that plan ahead, which was reported to improve quality. At inference the extra modules can be dropped, or reused as a built-in draft model for speculative decoding, letting the model propose several tokens per step and verify them, which speeds up generation.
