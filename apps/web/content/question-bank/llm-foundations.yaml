- id: kimi-k2-is-a-1t-parameter-moe-with-32b-active-per-token-and
  q: Kimi K2 is a 1T-parameter MoE with ~32B active per token and hundreds of experts. Explain the routing and the systems cost of training it.
  a: |
    Each token is routed by a learned router to a small subset of hundreds of fine-grained experts, typically alongside a shared expert, so only about 32B of the 1T parameters run per token. Quality benefits from the huge total capacity while per-token compute stays near a 32B dense model.

    The systems cost is in memory and communication. Storing a trillion parameters plus optimizer state needs aggressive sharding across many GPUs; expert parallelism requires all-to-all token exchanges every MoE layer, which must be overlapped with compute; load balancing must keep hundreds of experts busy; and training stability at that scale needs careful optimizer and precision choices.
