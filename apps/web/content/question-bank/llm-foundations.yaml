- id: qwen-uses-byte-level-bpe-with-a-151k-vocabulary-augmented-fo
  q: Qwen uses byte-level BPE with a ~151K vocabulary, augmented for multilingual coverage and with digits split into single characters. Why those choices, and what are the trade-offs?
  a: |
    Byte-level BPE guarantees any input can be encoded without unknown tokens. A large vocabulary of about 151K, enriched for many languages, shortens sequences for non-English text, cutting cost and latency and leaving more room in the context. Splitting digits into single tokens makes numbers consistent, which helps arithmetic.

    The trade-offs: a large vocabulary means bigger embedding and output matrices and rarer, less-trained tokens, and single-digit splitting makes numbers longer in tokens.
