- id: why-do-transformers-need-positional-encodings
  q: Why do transformers need positional encodings?
  a: |
    Self-attention is a weighted sum over a set, so it is invariant to token order. Without positional information, sentences with the same words in different orders would produce the same representations. Positional encodings add order, either to the input vectors or inside attention.
  level: Junior
  category: llm-foundations
  subcategory: positional-encoding
- id: how-does-byte-pair-encoding-work-and-what-are-its-failure-mo
  q: How does Byte Pair Encoding work, and what are its failure modes (numbers, code, non-Latin scripts)?
  a: |
    BPE starts from characters or bytes and repeatedly merges the most frequent adjacent pair in the training corpus into a new token until the vocabulary reaches its target size. Encoding new text applies the learned merges in order, so common words become single tokens and rare words split into pieces.

    Failure modes come from that frequency bias. Numbers split inconsistently, which hurts arithmetic unless digits are split individually. Code whitespace and indentation can tokenize poorly. Non-Latin and low-resource scripts get split into many tiny pieces, so the same sentence costs several times more tokens, which raises cost, latency and context usage for those languages.
  level: Junior
