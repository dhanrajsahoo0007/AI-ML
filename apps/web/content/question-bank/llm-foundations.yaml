- id: implement-a-top-k-moe-router-in-pytorch-then-contrast-auxili
  q: Implement a top-k MoE router in PyTorch. Then contrast auxiliary-loss load balancing with a loss-free approach.
  a: |
    The router is a linear layer from hidden size to number of experts. Take a softmax, select the top-k experts with torch.topk, renormalize their weights, dispatch tokens grouped by expert, and combine the weighted expert outputs.

    For balancing, the auxiliary-loss approach adds a term proportional to the product of each expert's token fraction and average router probability, encouraging uniform use but adding a gradient that can hurt quality. The loss-free approach keeps a per-expert bias used only for top-k selection and nudges it after each step toward balance, steering load without interfering with the main objective.
