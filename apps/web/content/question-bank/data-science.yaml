# Interview questions for this category. Entries with `source: outcome-school` are adapted from
# Outcome School (Apache 2.0); see NOTICE.md. All answers are written by TokensToScale.
- id: on-average-how-many-fair-coin-flips-until-you-see-two-heads
  q: On average, how many fair coin flips until you see two heads in a row? Walk me through it.
  a: |
    Six. Let E be the expected number of flips from the start and F the expected number after just seeing one head. From the start, one flip leads to F with probability 1/2 or back to the start with probability 1/2: E = 1 + F/2 + E/2. After a head, one flip finishes with probability 1/2 or resets: F = 1 + E/2.

    Substituting: E = 1 + (1 + E/2)/2 + E/2, so E/4 = 3/2 and E = 6.
  level: Mid
  category: data-science
  subcategory: statistics
  companies:
    - Google DeepMind
  source: outcome-school
- id: what-is-maximum-likelihood-estimation-and-how-does-it-differ
  q: What is Maximum Likelihood Estimation and how does it differ from Bayesian inference?
  a: |
    Maximum likelihood estimation picks the parameter values that make the observed data most probable, giving a single point estimate. Bayesian inference treats parameters as random, combines a prior with the likelihood to get a full posterior distribution, and reports uncertainty through it.

    MAP estimation sits between them: the posterior's mode, equivalent to MLE plus a penalty from the prior, such as L2 regularization corresponding to a Gaussian prior. With lots of data, the prior matters less and MLE and Bayesian answers converge.
  level: Mid
  category: data-science
  subcategory: statistics
  companies:
    - Amazon
  source: outcome-school
- id: what-is-the-difference-between-a-population-and-a-sample-and
  q: What is the difference between a population and a sample, and a parameter and a statistic?
  a: |
    The population is the whole group you care about; a sample is the subset you observe. A parameter describes the population, such as the true mean, and is usually unknown; a statistic, such as the sample mean, is computed from the sample and used to estimate the parameter.
  level: Junior
  category: data-science
  subcategory: statistics
- id: mean-vs-median-when-should-you-use-each
  q: "Mean vs median: when should you use each?"
  a: |
    The mean uses every value and suits symmetric data without extreme outliers. The median is the middle value and is robust to outliers and skew, so it is better for things like income, house prices or response times. Reporting both reveals skew.
  level: Junior
  category: data-science
  subcategory: statistics
- id: what-is-the-difference-between-variance-and-standard-deviati
  q: What is the difference between variance and standard deviation?
  a: |
    Variance is the average squared deviation from the mean; standard deviation is its square root, so it is in the same units as the data and easier to interpret. Sample variance divides by n minus 1 instead of n to correct for estimating the mean from the same sample.
  level: Junior
  category: data-science
  subcategory: statistics
- id: explain-the-central-limit-theorem-and-why-it-matters
  q: Explain the central limit theorem and why it matters.
  a: |
    For independent samples with finite variance, the distribution of the sample mean approaches a normal distribution as sample size grows, whatever the shape of the original distribution, with standard error equal to the standard deviation divided by the square root of n. It justifies normal-based confidence intervals and tests for means, including most A/B test analyses.
  level: Junior
  category: data-science
  subcategory: statistics
- id: what-is-the-law-of-large-numbers
  q: What is the law of large numbers?
  a: |
    As the number of independent observations increases, the sample average converges to the expected value. It explains why estimates stabilize with more data, but it says nothing about the shape of the sampling distribution, which is what the central limit theorem adds.
  level: Junior
  category: data-science
  subcategory: statistics
- id: describe-the-normal-binomial-poisson-and-exponential-distrib
  q: Describe the normal, binomial, Poisson and exponential distributions with an example of each.
  a: |
    Normal: continuous and symmetric, such as measurement errors or heights. Binomial: number of successes in n independent yes-or-no trials, such as conversions out of visitors. Poisson: count of events in a fixed interval at a constant rate, such as support tickets per hour. Exponential: time between Poisson events, such as time until the next ticket, and it is memoryless.
  level: Mid
  category: data-science
  subcategory: statistics
- id: what-is-a-p-value
  q: What is a p-value?
  a: |
    The probability of observing data at least as extreme as what you got, assuming the null hypothesis is true. A small p-value means the data would be surprising under the null. It is not the probability that the null is true, and it does not measure the size or importance of an effect.
  level: Junior
  category: data-science
  subcategory: statistics
- id: what-are-type-i-and-type-ii-errors
  q: What are Type I and Type II errors?
  a: |
    A Type I error is a false positive: rejecting a true null hypothesis, with probability alpha, the significance level. A Type II error is a false negative: failing to reject a false null, with probability beta. Power is 1 minus beta, the chance of detecting a real effect.
  level: Junior
  category: data-science
  subcategory: statistics
- id: what-is-statistical-power-and-what-affects-it
  q: What is statistical power and what affects it?
  a: |
    Power is the probability of detecting an effect when it truly exists. It increases with larger sample size, larger true effect size, lower variance in the metric and a higher significance level. Experiments are sized in advance to reach a target power, commonly 80%, for the smallest effect worth detecting.
  level: Mid
  category: data-science
  subcategory: statistics
- id: how-do-you-interpret-a-95-confidence-interval
  q: How do you interpret a 95% confidence interval?
  a: |
    If you repeated the sampling and interval procedure many times, about 95% of the intervals would contain the true parameter. It does not mean there is a 95% probability that this particular interval contains the true value; in the frequentist view the parameter is fixed. Narrower intervals mean more precise estimates.
  level: Mid
  category: data-science
  subcategory: statistics
- id: when-do-you-use-a-t-test-vs-a-z-test-vs-a-chi-square-test
  q: When do you use a t-test vs a z-test vs a chi-square test?
  a: |
    A z-test compares means or proportions when the variance is known or samples are large. A t-test compares means when the variance is estimated from small samples. A chi-square test checks association between categorical variables or goodness of fit to expected counts. For large-sample proportions, z and chi-square tests agree.
  level: Mid
  category: data-science
  subcategory: statistics
- id: what-are-non-parametric-tests-and-when-would-you-use-one
  q: What are non-parametric tests and when would you use one?
  a: |
    Tests that do not assume a specific distribution, such as Mann-Whitney U for comparing two groups, Wilcoxon signed-rank for paired data, and Kruskal-Wallis for several groups. Use them with small samples, heavy skew, outliers or ordinal data. Bootstrapping is another distribution-free way to get intervals.
  level: Mid
  category: data-science
  subcategory: statistics
- id: what-is-the-multiple-comparisons-problem-and-how-do-you-corr
  q: What is the multiple comparisons problem and how do you correct for it?
  a: |
    Running many tests at alpha 0.05 makes false positives likely: with 20 independent tests, the chance of at least one is about 64%. Corrections include Bonferroni, dividing alpha by the number of tests (conservative), and Benjamini-Hochberg, which controls the false discovery rate and keeps more power.
  level: Mid
  category: data-science
  subcategory: statistics
- id: explain-bayes-theorem-with-an-example
  q: Explain Bayes' theorem with an example.
  a: |
    Bayes' theorem updates the probability of a hypothesis given evidence: posterior equals likelihood times prior divided by the evidence. Example: a disease affects 1% of people and a test is 90% sensitive with a 5% false positive rate. A positive result gives a probability of disease of about 0.009 divided by (0.009 plus 0.0495), roughly 15%, because healthy people vastly outnumber sick ones.
  level: Junior
  category: data-science
  subcategory: statistics
- id: what-is-the-difference-between-frequentist-and-bayesian-stat
  q: What is the difference between frequentist and Bayesian statistics?
  a: |
    Frequentists treat parameters as fixed and probability as long-run frequency, using p-values and confidence intervals. Bayesians treat parameters as uncertain, combine a prior with data to get a posterior distribution, and report credible intervals and direct probabilities, such as the probability that variant B beats A. Bayesian methods need a prior; frequentist results are often misread as Bayesian statements.
  level: Mid
  category: data-science
  subcategory: statistics
- id: what-is-conditional-probability-and-what-is-independence
  q: What is conditional probability, and what is independence?
  a: |
    The probability of A given B is the probability of both divided by the probability of B. Events are independent when knowing one does not change the probability of the other, so the probability of both equals the product of their probabilities.
  level: Junior
  category: data-science
  subcategory: statistics
- id: what-is-the-birthday-problem-and-what-does-it-teach
  q: What is the birthday problem and what does it teach?
  a: |
    With only 23 people, the chance that two share a birthday is just over 50%, because the number of pairs grows quadratically. It teaches that coincidences and collisions, such as hash collisions or duplicate IDs, become likely much sooner than intuition suggests.
  level: Mid
  category: data-science
  subcategory: statistics
- id: what-is-selection-bias-give-examples
  q: What is selection bias? Give examples.
  a: |
    Selection bias occurs when the sample is not representative of the population because of how it was collected. Examples include survivorship bias, such as studying only successful companies, survey non-response, analyzing only users who opted in, and training data that excludes rejected loan applicants.
  level: Mid
  category: data-science
  subcategory: statistics
- id: correlation-vs-causation-how-can-you-establish-causation
  q: "Correlation vs causation: how can you establish causation?"
  a: |
    Correlation shows variables move together, which can be due to confounders, reverse causation or chance. The gold standard for causation is a randomized controlled experiment. With observational data, methods such as difference-in-differences, instrumental variables, regression discontinuity and matching can estimate causal effects under stated assumptions.
  level: Junior
  category: data-science
  subcategory: statistics
- id: what-is-simpson-s-paradox
  q: What is Simpson's paradox?
  a: |
    A trend that appears in several groups reverses or disappears when the groups are combined, because group sizes differ and a confounding variable is unevenly distributed. A classic example is a treatment that looks better in every subgroup but worse overall. The fix is to analyze within the relevant strata.
  level: Mid
  category: data-science
  subcategory: statistics
- id: what-is-a-confounding-variable
  q: What is a confounding variable?
  a: |
    A variable that influences both the supposed cause and the outcome, creating a misleading association. For example, ice cream sales and drowning both rise in summer because of temperature. Randomization or controlling for confounders in analysis addresses it.
  level: Junior
  category: data-science
  subcategory: statistics
- id: how-do-you-interpret-r-squared-and-why-can-it-mislead
  q: How do you interpret R-squared, and why can it mislead?
  a: |
    R-squared is the share of variance in the target explained by the model. It always increases when features are added, even useless ones, so adjusted R-squared penalizes extra features. A high R-squared does not mean the model is correct or causal, and a low one can still be useful for prediction in noisy domains.
  level: Mid
  category: data-science
  subcategory: statistics
- id: how-do-you-interpret-a-coefficient-in-logistic-regression
  q: How do you interpret a coefficient in logistic regression?
  a: |
    Each coefficient is the change in the log-odds of the outcome for a one-unit increase in the feature, holding others constant. Exponentiating it gives an odds ratio: a coefficient of 0.7 means the odds multiply by about 2 for each unit increase.
  level: Mid
  category: data-science
  subcategory: statistics
- id: what-is-bootstrapping
  q: What is bootstrapping?
  a: |
    Resampling the observed data with replacement many times and computing the statistic on each resample to approximate its sampling distribution. It gives standard errors and confidence intervals for statistics without a simple formula, such as medians or ratios, with few distributional assumptions.
  level: Mid
  category: data-science
  subcategory: statistics
- id: how-would-you-detect-outliers-and-should-you-remove-them
  q: How would you detect outliers, and should you remove them?
  a: |
    Use visual checks, the interquartile range rule, z-scores for roughly normal data, or model-based methods for multivariate data. Do not remove them automatically: first find out whether they are errors or real extreme events. Errors should be fixed or dropped; real extremes may matter most, and robust methods can limit their influence.
  level: Junior
  category: data-science
  subcategory: statistics
- id: a-test-result-is-statistically-significant-but-the-effect-is
  q: A test result is statistically significant but the effect is tiny. What do you tell stakeholders?
  a: |
    Statistical significance only means the effect is unlikely to be zero; with large samples, trivial effects become significant. Report the effect size with a confidence interval, translate it into business impact, and compare it with costs and the minimum effect that matters. A significant but negligible effect may not justify a change.
  level: Senior
  category: data-science
  subcategory: statistics
- id: what-is-regression-to-the-mean
  q: What is regression to the mean?
  a: |
    Extreme measurements tend to be followed by values closer to the average, because extremes are partly due to random variation. It can make interventions look effective when applied to the worst performers, such as underperforming stores, which is why control groups are needed.
  level: Mid
  category: data-science
  subcategory: statistics
- id: how-do-you-calculate-the-sample-size-needed-for-a-test
  q: How do you calculate the sample size needed for a test?
  a: |
    Specify the significance level, desired power, baseline variance or rate, and minimum detectable effect, then use the power formula or a calculator. For comparing two means, the size per group is roughly 2 times (z for alpha over 2 plus z for power) squared times the variance, divided by the effect squared. Smaller effects or noisier metrics need much larger samples.
  level: Senior
  category: data-science
  subcategory: statistics
- id: explain-how-you-would-design-and-evaluate-an-a-b-test-what-i
  q: Explain how you would design and evaluate an A/B test. What is a p-value and how do you interpret it here?
  a: |
    Define the hypothesis and primary metric, guardrail metrics and the randomization unit; size the test from the baseline, minimum detectable effect, significance level and power; run it for the planned duration covering weekly cycles; check sample ratio and data quality; then analyze the effect with confidence intervals.

    The p-value is the probability of seeing a difference at least as large as observed if there were truly no effect. A p-value of 0.02 means such a result would be unusual under no effect, but it does not say the probability the change works, nor how big the effect is, which is why you also report the effect size and interval.
  level: Mid
  category: data-science
  subcategory: ab-testing
  companies:
    - Amazon
  source: outcome-school
- id: your-offline-metric-improved-but-the-online-a-b-did-not-enum
  q: Your offline metric improved but the online A/B did not. Enumerate the reasons this happens and how you would tell them apart.
  a: |
    Possible reasons: the offline metric does not match the business goal; offline data reflects the old model's exposure (feedback loop and position bias); training-serving skew in features; leakage in offline evaluation; the gain is concentrated in segments that matter little; novelty or learning effects online; an underpowered or flawed test; or latency changes that hurt engagement.

    Tell them apart by checking feature parity between training and serving logs, recomputing offline metrics on fresh data collected under the new model, analyzing online results by segment and over time, verifying test setup with A/A tests and sample ratio checks, and comparing latency.
  level: Senior
  category: data-science
  subcategory: ab-testing
  companies:
    - Consumer-Scale ML
  source: outcome-school
- id: walk-through-how-you-would-design-an-a-b-test
  q: Walk through how you would design an A/B test.
  a: |
    State the hypothesis and the decision it informs. Choose a primary metric, guardrail metrics and the randomization unit. Compute the sample size from the baseline, minimum detectable effect, significance level and power, and fix the duration, covering whole weekly cycles. Run it, check data quality and sample ratio, analyze the pre-registered metrics, and decide based on effect size, confidence intervals and guardrails.
  level: Junior
  category: data-science
  subcategory: ab-testing
- id: how-do-you-choose-the-primary-metric
  q: How do you choose the primary metric?
  a: |
    It should reflect the goal of the change, be sensitive enough to move within the test duration, and be hard to game. Often a short-term proxy is used for a long-term goal, such as purchases for revenue or sessions for retention, so its link to the long-term outcome should be validated. Define it precisely before the test starts.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: what-are-guardrail-metrics
  q: What are guardrail metrics?
  a: |
    Metrics that must not get worse even if the primary metric improves, such as page latency, error rates, unsubscribes, refunds or revenue. They protect against shipping changes that win locally but harm the business or users.
  level: Junior
  category: data-science
  subcategory: ab-testing
- id: what-is-the-minimum-detectable-effect-and-how-do-you-choose
  q: What is the minimum detectable effect and how do you choose it?
  a: |
    The smallest true effect the test is powered to detect reliably. Choose it from business value: the smallest improvement worth the cost of shipping and maintaining the change. Smaller MDEs need much larger samples, roughly four times the sample to halve the MDE.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: how-do-you-choose-the-randomization-unit
  q: How do you choose the randomization unit?
  a: |
    Randomize at the level where the treatment is experienced and where units do not influence each other: usually users, sometimes sessions, devices, stores or regions. User-level is common for consistency of experience. If the analysis unit differs from the randomization unit, such as randomizing users but measuring per page view, variance must be computed accordingly, for example with the delta method.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: what-is-a-sample-ratio-mismatch-and-why-does-it-matter
  q: What is a sample ratio mismatch and why does it matter?
  a: |
    When the observed split between groups differs significantly from the intended split, such as 50.8 vs 49.2 with millions of users, detected with a chi-square test. It signals a bug in assignment, logging, filtering or redirects, so results are untrustworthy until the cause is found.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: what-is-peeking-and-why-is-it-a-problem
  q: What is peeking and why is it a problem?
  a: |
    Checking results repeatedly and stopping as soon as the p-value crosses 0.05. Each look is another chance for a false positive, so the real false positive rate can be far above 5%. Fix the duration in advance, or use sequential testing methods designed for continuous monitoring.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: what-are-novelty-and-primacy-effects
  q: What are novelty and primacy effects?
  a: |
    A novelty effect is a temporary lift because users try something new; a primacy or change-aversion effect is a temporary drop because users dislike change. Both fade over time. Run tests long enough, look at effects over time and by new versus returning users, and consider holdouts to measure long-term impact.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: what-is-network-interference-and-how-do-you-handle-it
  q: What is network interference and how do you handle it?
  a: |
    When treated users affect control users, such as in social networks, marketplaces with shared supply, or ride-sharing, violating the assumption that units are independent. Handle it with cluster randomization by group or region, switchback tests that alternate treatment over time, or marketplace-specific designs that randomize one side.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: what-is-a-switchback-experiment
  q: What is a switchback experiment?
  a: |
    Treatment and control alternate over time windows within the same unit, such as a city every hour, randomized by window. It is used when users share resources and cannot be cleanly split, as in delivery or ride-sharing marketplaces. Analysis must account for carryover between windows and time correlation.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: what-is-cuped-and-why-use-it
  q: What is CUPED and why use it?
  a: |
    Controlled-experiment Using Pre-Experiment Data adjusts each user's metric using a correlated pre-experiment covariate, typically the same metric before the test. It removes variance that is unrelated to the treatment, often substantially, so tests reach significance with fewer users or less time without biasing the estimate.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: how-do-you-analyze-a-ratio-metric-like-click-through-rate-pe
  q: How do you analyze a ratio metric like click-through rate per session?
  a: |
    When the numerator and denominator are both random and the randomization unit is the user, simple binomial formulas underestimate variance because sessions from the same user are correlated. Use the delta method or bootstrap at the user level to get correct standard errors.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: the-test-shows-no-significant-difference-what-do-you-conclud
  q: The test shows no significant difference. What do you conclude?
  a: |
    Not that there is no effect, only that the test could not detect one at its power. Check the confidence interval: if it rules out effects that matter, the change likely has little impact; if it is wide, the test was underpowered. Also check for implementation problems, sample ratio mismatch, and segment effects that cancel out.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: the-primary-metric-improved-but-a-guardrail-got-worse-do-you
  q: The primary metric improved but a guardrail got worse. Do you ship?
  a: |
    It depends on the size and importance of each change. Quantify both in business terms with confidence intervals, understand the mechanism, and consult stakeholders on the trade-off. Often the right move is to iterate on the design to keep the gain without the harm, or to ship to a subset where the trade-off is favorable.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: why-should-you-be-careful-with-segment-analysis-after-a-test
  q: Why should you be careful with segment analysis after a test?
  a: |
    Slicing results by many segments is multiple testing: some segments will look significant by chance. Pre-register important segments, correct for multiple comparisons, and treat surprising segment findings as hypotheses for a follow-up test rather than conclusions.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: how-long-should-an-experiment-run
  q: How long should an experiment run?
  a: |
    Until it reaches the pre-computed sample size, and at least one or two full weekly cycles to cover day-of-week effects. Longer if novelty effects are expected or the metric is slow, such as retention. Do not stop early because results look good.
  level: Junior
  category: data-science
  subcategory: ab-testing
- id: what-is-an-a-a-test-and-why-run-one
  q: What is an A/A test and why run one?
  a: |
    An experiment where both groups get the same experience. It validates the experimentation system: assignment, logging and statistics should show no significant differences beyond the expected false positive rate. It also measures metric variance for sizing future tests.
  level: Junior
  category: data-science
  subcategory: ab-testing
- id: what-are-multi-armed-bandits-and-when-would-you-use-them-ins
  q: What are multi-armed bandits and when would you use them instead of A/B tests?
  a: |
    Bandits shift traffic toward better-performing variants during the experiment, balancing exploration and exploitation, which reduces the cost of showing losing variants. They suit short-lived decisions, many variants and continuous optimization such as headlines or artwork. A/B tests are better when you need unbiased effect estimates, care about long-term or multiple metrics, or must make a clean ship decision.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: how-do-you-measure-long-term-effects-of-a-change
  q: How do you measure long-term effects of a change?
  a: |
    Keep a long-running holdout group that does not get the change, track retention and other slow metrics over months, and use surrogate metrics that have been validated to predict long-term outcomes. Re-check effects periodically, since short-term lifts can fade.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: what-is-a-holdout-group
  q: What is a holdout group?
  a: |
    A small share of users excluded from a set of launched features for an extended period. Comparing them with everyone else measures the cumulative, long-term impact of many changes together, which individual short tests cannot capture.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: why-might-offline-model-metrics-disagree-with-a-b-test-resul
  q: Why might offline model metrics disagree with A/B test results for an ML model?
  a: |
    Offline data reflects the previous system's exposure and biases, offline metrics such as AUC may not align with the business metric, there can be training-serving skew in features, and users react to the new behavior in ways historical data cannot show. That is why online experiments are the final judge for ML launches.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: how-would-you-test-a-change-to-a-recommendation-algorithm
  q: How would you test a change to a recommendation algorithm?
  a: |
    Randomize at the user level, define a primary metric tied to long-term value such as engaged time or retention proxies, plus guardrails for diversity, latency and complaints. Check for interference if recommendations affect supply. Run long enough to see past novelty, use variance reduction such as CUPED, and consider interleaving for faster, more sensitive ranking comparisons before a full test.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: what-is-interleaving-in-ranking-experiments
  q: What is interleaving in ranking experiments?
  a: |
    Instead of showing each user one ranker's results, results from two rankers are merged into a single list and user clicks are credited to the ranker that contributed each item. Because each user compares both, interleaving detects preference differences with far fewer users than a standard A/B test. It is used as a fast screening step.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: a-test-shows-a-20-conversion-lift-far-more-than-expected-wha
  q: A test shows a 20% conversion lift, far more than expected. What do you do?
  a: |
    Be skeptical and check for errors first: sample ratio mismatch, logging bugs, bot traffic, metric definitions, and whether the treatment broke tracking in the control or treatment. Look at the effect over time and across segments. Twyman's law applies: any figure that looks interesting or different is usually wrong. Rerun if needed before celebrating.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: how-would-you-test-a-new-pricing-page-when-you-can-t-randomi
  q: How would you test a new pricing page when you can't randomize prices fairly?
  a: |
    Options include testing the page design rather than prices, randomizing by region or time with switchbacks, running quasi-experiments such as difference-in-differences across markets, or limited tests with clear legal and ethical review. Be explicit about the assumptions each design needs.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: what-is-the-difference-between-statistical-and-practical-sig
  q: What is the difference between statistical and practical significance in experiments?
  a: |
    Statistical significance means the observed effect is unlikely to be due to chance. Practical significance means the effect is large enough to matter for the business. With large samples, tiny effects become statistically significant, so decisions should use effect sizes and confidence intervals compared with the minimum effect worth shipping.
  level: Junior
  category: data-science
  subcategory: ab-testing
- id: how-do-you-handle-experiments-with-heavy-tailed-metrics-like
  q: How do you handle experiments with heavy-tailed metrics like revenue?
  a: |
    A few big spenders dominate variance, making tests noisy. Use winsorizing or capping at a high percentile, log transforms, variance reduction such as CUPED, longer tests, or non-parametric methods and bootstrap intervals. Report the capping rule and check that conclusions hold with and without it.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: what-is-sequential-testing
  q: What is sequential testing?
  a: |
    Statistical methods that allow results to be monitored continuously and stopped early while controlling the false positive rate, using adjusted boundaries such as alpha spending or always-valid p-values. They let teams stop clearly winning or harmful tests sooner without the inflated error rates of naive peeking.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: how-would-you-prioritize-which-experiments-to-run
  q: How would you prioritize which experiments to run?
  a: |
    Estimate expected impact, confidence in the idea, and cost to build and test, for example with an ICE-style score, and consider traffic limits since tests compete for users. Favor experiments that inform big decisions or test risky assumptions early.
  level: Mid
  category: data-science
  subcategory: ab-testing
- id: how-do-you-avoid-interactions-between-concurrent-experiments
  q: How do you avoid interactions between concurrent experiments?
  a: |
    Use an experimentation platform with layers or namespaces so experiments that touch the same surface are mutually exclusive, while unrelated ones overlap safely. Monitor for interaction effects in important pairs, and coordinate launches on shared components.
  level: Senior
  category: data-science
  subcategory: ab-testing
- id: your-ads-ctr-model-shows-a-2-offline-auc-gain-but-the-online
  q: Your ads CTR model shows a 2% offline AUC gain, but the online A/B is revenue-neutral with worse calibration. What is going on, and what do you do?
  a: |
    AUC measures ranking, but ads auctions use predicted click probabilities directly to compute bids and prices, so calibration errors distort the auction: overpredicting for some ads shifts allocation and pricing even if ranking improved. Offline gains may also come from segments with little revenue, or from feature leakage that does not hold online.

    Recalibrate the model (Platt or isotonic calibration, per segment if needed) and check calibration by segment and position, compare offline metrics such as log loss and normalized entropy that reflect calibration, check for training-serving skew, and rerun the A/B test with revenue and advertiser value as the primary metrics.
  level: Senior
  category: data-science
  subcategory: metrics
  companies:
    - Meta
  source: outcome-school
- id: discuss-precision-recall-and-f1-when-would-you-prioritise-on
  q: "Discuss precision, recall and F1: when would you prioritise one over the others?"
  a: |
    Precision is the share of predicted positives that are correct; recall is the share of actual positives found; F1 is their harmonic mean, high only when both are high.

    Prioritize precision when false positives are costly, such as flagging legitimate transactions or spam filters deleting real email. Prioritize recall when misses are costly, such as disease screening or safety-critical detection. Use F1 when both matter similarly, and tune the threshold to the business cost of each error.
  level: Junior
  category: data-science
  subcategory: metrics
  companies:
    - Amazon
  refs:
    - title: Precision vs Recall
      url: https://outcomeschool.com/blog/precision-vs-recall
  source: outcome-school
- id: explain-the-confusion-matrix
  q: Explain the confusion matrix.
  a: |
    A table of predictions versus actual classes. For binary problems it has true positives, false positives (predicted positive but actually negative), false negatives (missed positives) and true negatives. Most classification metrics are computed from these four counts.
  level: Junior
  category: data-science
  subcategory: metrics
- id: why-is-accuracy-misleading-for-imbalanced-data
  q: Why is accuracy misleading for imbalanced data?
  a: |
    If 99% of transactions are legitimate, a model that always predicts "legitimate" is 99% accurate yet catches no fraud. Accuracy hides performance on the rare class, so use precision, recall, F1, PR-AUC or cost-based metrics instead.
  level: Junior
  category: data-science
  subcategory: metrics
- id: define-precision-and-recall-and-when-you-prioritize-each
  q: Define precision and recall, and when you prioritize each.
  a: |
    Precision is true positives over predicted positives: how many flagged items were right. Recall is true positives over actual positives: how many real positives were found. Prioritize precision when false alarms are costly, such as spam filters removing real email; prioritize recall when misses are costly, such as cancer screening or fraud.
  level: Junior
  category: data-science
  subcategory: metrics
- id: what-is-the-f1-score-and-when-is-it-appropriate
  q: What is the F1 score and when is it appropriate?
  a: |
    The harmonic mean of precision and recall, which is high only when both are high. It is useful as a single number for imbalanced problems when both errors matter similarly. When one error is more costly, use F-beta to weight recall or precision more, or optimize a cost-based metric directly.
  level: Junior
  category: data-science
  subcategory: metrics
- id: what-does-roc-auc-measure
  q: What does ROC-AUC measure?
  a: |
    The area under the curve of true positive rate versus false positive rate across all thresholds. It equals the probability that a randomly chosen positive gets a higher score than a randomly chosen negative, so it measures ranking quality independent of threshold. 0.5 is random and 1.0 is perfect.
  level: Mid
  category: data-science
  subcategory: metrics
- id: roc-auc-vs-pr-auc-which-should-you-use-for-imbalanced-proble
  q: "ROC-AUC vs PR-AUC: which should you use for imbalanced problems?"
  a: |
    PR-AUC, the area under the precision-recall curve, is usually more informative when positives are rare, because ROC-AUC's false positive rate stays small even with many false positives when negatives are abundant, making weak models look good. PR-AUC's baseline equals the positive rate, so it reflects how hard the problem is.
  level: Mid
  category: data-science
  subcategory: metrics
- id: how-do-you-choose-a-classification-threshold
  q: How do you choose a classification threshold?
  a: |
    Base it on the business trade-off, not the default 0.5. Estimate the cost of false positives and false negatives and pick the threshold minimizing expected cost, or meet a constraint such as at least 95% recall or a fixed review capacity per day. Choose it on validation data and monitor it, since score distributions shift.
  level: Mid
  category: data-science
  subcategory: metrics
- id: what-is-log-loss-and-why-use-it
  q: What is log loss and why use it?
  a: |
    Log loss, or cross-entropy, is the average negative log of the probability assigned to the true class. It rewards well-calibrated, confident correct predictions and heavily penalizes confident mistakes. It evaluates probabilities themselves, which matters when downstream decisions use scores directly.
  level: Mid
  category: data-science
  subcategory: metrics
- id: what-is-calibration-and-how-do-you-check-and-fix-it
  q: What is calibration and how do you check and fix it?
  a: |
    A model is calibrated if, among predictions with probability 0.7, about 70% are positive. Check with reliability diagrams and metrics such as expected calibration error or the Brier score. Fix with Platt scaling or isotonic regression fitted on a held-out set. Calibration matters for pricing, risk and any decision that uses probabilities.
  level: Senior
  category: data-science
  subcategory: metrics
- id: macro-vs-micro-vs-weighted-averaging-for-multi-class-metrics
  q: Macro vs micro vs weighted averaging for multi-class metrics?
  a: |
    Macro averaging computes the metric per class and averages them equally, giving rare classes equal weight. Micro averaging pools all predictions, so frequent classes dominate; for single-label problems micro F1 equals accuracy. Weighted averaging weights classes by their frequency. Report macro when performance on rare classes matters.
  level: Mid
  category: data-science
  subcategory: metrics
- id: mae-vs-mse-vs-rmse-when-do-you-use-each
  q: "MAE vs MSE vs RMSE: when do you use each?"
  a: |
    MAE averages absolute errors, is in the target's units and is robust to outliers. MSE averages squared errors and penalizes large errors heavily; RMSE is its square root, back in target units. Use RMSE when large errors are especially bad, MAE when all errors matter proportionally or outliers are noise.
  level: Junior
  category: data-science
  subcategory: metrics
- id: what-are-the-problems-with-mape
  q: What are the problems with MAPE?
  a: |
    Mean absolute percentage error is undefined or explodes when actual values are zero or near zero, penalizes over-forecasts and under-forecasts asymmetrically, and favors models that under-predict. Alternatives include weighted MAPE (WAPE), symmetric MAPE, or scaled errors such as MASE.
  level: Mid
  category: data-science
  subcategory: metrics
- id: what-does-r-squared-tell-you-about-a-regression-model
  q: What does R-squared tell you about a regression model?
  a: |
    The share of variance in the target explained by the model compared with predicting the mean. It can be negative on test data if the model is worse than the mean. It does not tell you whether errors are acceptable in business terms, so pair it with error metrics in target units.
  level: Junior
  category: data-science
  subcategory: metrics
- id: how-do-you-evaluate-a-forecasting-model
  q: How do you evaluate a forecasting model?
  a: |
    Use time-based backtesting with rolling or expanding windows that mimic production, compare against naive baselines such as last value or seasonal naive, and use scale-appropriate metrics such as MAE, WAPE or MASE. For probabilistic forecasts, evaluate prediction interval coverage or quantile loss.
  level: Mid
  category: data-science
  subcategory: metrics
- id: what-metrics-are-used-for-ranking-and-recommendation
  q: What metrics are used for ranking and recommendation?
  a: |
    Precision at k and recall at k, MRR (mean reciprocal rank of the first relevant item), MAP (mean average precision) and nDCG, which uses graded relevance and discounts lower positions. Coverage, diversity and novelty complement accuracy, and online metrics such as engagement and retention decide final success.
  level: Mid
  category: data-science
  subcategory: metrics
- id: explain-ndcg
  q: Explain nDCG.
  a: |
    Discounted cumulative gain sums the relevance of results with a logarithmic discount by position, so relevant items near the top count more. Normalizing by the ideal ordering's DCG gives nDCG between 0 and 1, comparable across queries. It handles graded relevance such as perfect, good and fair.
  level: Senior
  category: data-science
  subcategory: metrics
- id: how-do-you-evaluate-a-clustering-model-without-labels
  q: How do you evaluate a clustering model without labels?
  a: |
    Internal metrics such as the silhouette score, Davies-Bouldin index and within-cluster variance measure compactness and separation. But the most important test is usefulness: whether clusters are stable across samples, interpretable and actionable for the business, which often needs domain review.
  level: Mid
  category: data-science
  subcategory: metrics
- id: how-do-you-evaluate-an-anomaly-detection-model
  q: How do you evaluate an anomaly detection model?
  a: |
    If some labeled anomalies exist, use precision at k, recall at a fixed alert volume and PR-AUC. Without labels, review top-ranked anomalies with experts, inject synthetic anomalies to measure detection, and track alert precision in production. Alert volume must fit the team's capacity.
  level: Senior
  category: data-science
  subcategory: metrics
- id: how-do-you-connect-model-metrics-to-business-metrics
  q: How do you connect model metrics to business metrics?
  a: |
    Map errors to outcomes: each false positive and false negative has a cost, and each correct action has a value. Estimate expected business value at different thresholds, report model performance in those terms, and validate the relationship with experiments. Stakeholders care about money, time saved or risk avoided, not AUC.
  level: Mid
  category: data-science
  subcategory: metrics
- id: how-do-you-get-a-confidence-interval-for-a-model-s-metric
  q: How do you get a confidence interval for a model's metric?
  a: |
    Bootstrap the test set: resample it with replacement many times, compute the metric on each resample, and take percentiles. This shows whether a difference between two models is meaningful or within noise, especially with small test sets.
  level: Mid
  category: data-science
  subcategory: metrics
- id: how-do-you-evaluate-model-fairness
  q: How do you evaluate model fairness?
  a: |
    Compute metrics separately for relevant groups and compare them, using criteria such as demographic parity (similar positive rates), equal opportunity (similar true positive rates) or equalized odds (similar true and false positive rates). These criteria can conflict, so choose based on the application's harms and legal context, and examine data and labels for bias.
  level: Senior
  category: data-science
  subcategory: metrics
- id: how-do-you-evaluate-llm-outputs
  q: How do you evaluate LLM outputs?
  a: |
    Use task-specific checks where possible, such as exact match, schema validity, unit tests for code or retrieval metrics. For open-ended outputs use rubric-based LLM-as-judge calibrated against human ratings, pairwise comparisons and human review samples. Track faithfulness, safety, latency and cost alongside quality.
  level: Mid
  category: data-science
  subcategory: metrics
- id: what-are-bleu-and-rouge-and-why-are-they-weak-for-llm-evalua
  q: What are BLEU and ROUGE, and why are they weak for LLM evaluation?
  a: |
    They measure n-gram overlap with reference texts, BLEU for translation and ROUGE for summarization. Many correct answers use different words, and overlap says nothing about factual accuracy or helpfulness, so they correlate poorly with human judgment for open-ended LLM outputs.
  level: Mid
  category: data-science
  subcategory: metrics
- id: how-do-you-evaluate-a-model-when-labels-arrive-with-a-long-d
  q: How do you evaluate a model when labels arrive with a long delay?
  a: |
    Use proxy metrics that arrive sooner but correlate with the final outcome, monitor input and prediction distributions for drift as an early warning, evaluate on matured cohorts as labels arrive, and report metrics by cohort age. Validate that the proxies track the final metric over time.
  level: Senior
  category: data-science
  subcategory: metrics
- id: what-is-the-brier-score
  q: What is the Brier score?
  a: |
    The mean squared difference between predicted probabilities and actual binary outcomes. Lower is better, and it reflects both calibration and discrimination. It is a common way to compare probabilistic classifiers alongside log loss.
  level: Mid
  category: data-science
  subcategory: metrics
- id: what-is-the-kolmogorov-smirnov-statistic-used-for-in-credit
  q: What is the Kolmogorov-Smirnov statistic used for in credit scoring?
  a: |
    It is the maximum difference between the cumulative score distributions of positives and negatives, measuring how well the model separates the two classes. Credit risk teams use it alongside AUC and Gini, where Gini equals 2 times AUC minus 1.
  level: Senior
  category: data-science
  subcategory: metrics
- id: why-should-you-look-at-metrics-by-segment-not-just-overall
  q: Why should you look at metrics by segment, not just overall?
  a: |
    An overall metric can hide poor performance on important groups, such as new users, certain regions or rare classes, and Simpson's paradox can make overall comparisons misleading. Segment metrics reveal where the model fails, guide data collection and catch fairness issues.
  level: Mid
  category: data-science
  subcategory: metrics
- id: how-would-you-choose-metrics-for-a-medical-screening-model
  q: How would you choose metrics for a medical screening model?
  a: |
    Prioritize sensitivity (recall) so few true cases are missed, while keeping specificity high enough that follow-up tests are manageable. Report sensitivity and specificity at the chosen operating point with confidence intervals, positive and negative predictive values at the real prevalence, calibration, and performance across patient subgroups, validated on external data.
  level: Senior
  category: data-science
  subcategory: metrics
- id: what-is-specificity-and-how-does-it-relate-to-the-false-posi
  q: What is specificity, and how does it relate to the false positive rate?
  a: |
    Specificity is true negatives divided by all actual negatives: the share of negatives correctly identified. The false positive rate equals 1 minus specificity. Sensitivity (recall) and specificity together describe a test's performance on positives and negatives separately.
  level: Junior
  category: data-science
  subcategory: metrics
- id: how-do-you-handle-data-imbalance-collinearity-feature-select
  q: How do you handle data imbalance, collinearity, feature selection and regularization?
  a: |
    Imbalance: use appropriate metrics, class weights, resampling such as SMOTE or undersampling, and threshold tuning. Collinearity: detect with correlation matrices and variance inflation factors, then drop or combine correlated features, use PCA, or use L2 regularization, which handles them stably.

    Feature selection: filter methods such as mutual information, wrapper methods such as recursive feature elimination, and embedded methods such as L1 or tree importances, validated with cross-validation. Regularization: tune L1, L2 or elastic net strength on validation data to balance fit and complexity.
  level: Mid
  category: data-science
  subcategory: feature-engineering
  companies:
    - Amazon
  refs:
    - title: Feature Engineering in Machine Learning
      url: https://outcomeschool.com/blog/feature-engineering
    - title: "Regularization in Machine Learning: L1 vs L2"
      url: https://outcomeschool.com/blog/regularization-in-machine-learning
  source: outcome-school
- id: what-is-feature-engineering-and-why-does-it-matter
  q: What is feature engineering and why does it matter?
  a: |
    Creating, transforming and selecting input variables so a model can learn the signal more easily, such as ratios, aggregates, time since last event or text embeddings. Well-chosen features encode domain knowledge, often improving accuracy more than switching algorithms, and can make simpler, more interpretable models viable.
  level: Junior
  category: data-science
  subcategory: feature-engineering
- id: one-hot-encoding-vs-label-encoding-when-do-you-use-each
  q: "One-hot encoding vs label encoding: when do you use each?"
  a: |
    One-hot creates a binary column per category and suits nominal categories with few values for linear models and neural networks. Label encoding maps categories to integers, which imposes a false order for linear models but is fine for tree-based models, which can split on arbitrary integer codes.
  level: Junior
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-handle-high-cardinality-categorical-features
  q: How do you handle high-cardinality categorical features?
  a: |
    Options include target encoding (replacing each category with a smoothed average of the target, computed out of fold), frequency encoding, hashing into a fixed number of buckets, grouping rare categories into "other", and learned embeddings in neural networks. One-hot encoding thousands of categories creates huge sparse inputs.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: what-is-target-encoding-and-how-do-you-prevent-leakage-with
  q: What is target encoding and how do you prevent leakage with it?
  a: |
    Each category is replaced by the mean target value for that category. Computed naively on the training set, it leaks the row's own label into its feature. Compute it out of fold, with each row's value from other folds, add smoothing toward the global mean for rare categories, and fit only on training data.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: standardization-vs-normalization-what-is-the-difference
  q: "Standardization vs normalization: what is the difference?"
  a: |
    Standardization rescales to zero mean and unit variance and is the default for many linear models, SVMs and neural networks. Min-max normalization rescales to a fixed range, often 0 to 1, which is sensitive to outliers. Robust scaling with the median and interquartile range resists outliers.
  level: Junior
  category: data-science
  subcategory: feature-engineering
- id: when-would-you-apply-a-log-transform
  q: When would you apply a log transform?
  a: |
    For right-skewed positive features such as income, prices or counts, a log transform compresses large values, reduces the influence of outliers and can make relationships more linear. Use log of one plus x when zeros are present. Tree models need it less because they are invariant to monotonic transforms.
  level: Junior
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-create-features-from-timestamps
  q: How do you create features from timestamps?
  a: |
    Extract hour, day of week, month, holidays and weekend flags; use cyclical encoding with sine and cosine for periodic values such as hour; and compute durations such as time since signup or since the last purchase. Make sure the reference time is the prediction time, not today.
  level: Junior
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-build-aggregate-features-without-leakage
  q: How do you build aggregate features without leakage?
  a: |
    Compute aggregates such as "purchases in the last 30 days" using only data available before each example's prediction time, which is called point-in-time correctness. In the feature pipeline, join on time windows that end at the event timestamp. Feature stores with point-in-time joins enforce this automatically for training data.
  level: Senior
  category: data-science
  subcategory: feature-engineering
- id: what-are-lag-and-rolling-features-in-time-series
  q: What are lag and rolling features in time series?
  a: |
    Lag features use the target or other variables from previous time steps, such as last week's sales. Rolling features summarize recent windows, such as a 7-day mean or standard deviation. They capture trends and seasonality, but every window must end before the time being predicted.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-turn-text-into-features-for-a-classic-model
  q: How do you turn text into features for a classic model?
  a: |
    Bag of words or TF-IDF vectors with n-grams, plus simple statistics such as length, punctuation and capitalization. For richer meaning, use pretrained sentence embeddings as dense features. Clean and normalize text consistently between training and serving.
  level: Junior
  category: data-science
  subcategory: feature-engineering
- id: what-are-interaction-features-and-when-are-they-useful
  q: What are interaction features and when are they useful?
  a: |
    Features that combine two or more variables, such as products, ratios or crosses of categories, like price per square meter or city by device. Linear models need them to capture interactions; tree models and neural networks can learn some interactions themselves but still benefit from meaningful hand-made ones.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-handle-missing-values-as-a-feature-engineering-de
  q: How do you handle missing values as a feature-engineering decision?
  a: |
    Decide based on why data is missing. Impute with median, mode or model-based methods, add a binary "is missing" indicator because missingness can be predictive, or use models that handle missing values natively. Avoid imputing with information from the test set or future data.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: what-are-mcar-mar-and-mnar
  q: What are MCAR, MAR and MNAR?
  a: |
    Missing completely at random means missingness is unrelated to anything, so dropping rows only loses data. Missing at random means missingness depends on observed variables, which imputation using those variables can handle. Missing not at random means it depends on the unobserved value itself, such as high earners not reporting income, which biases simple methods and needs domain modeling.
  level: Senior
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-treat-outliers-before-modeling
  q: How do you treat outliers before modeling?
  a: |
    Investigate first: fix or remove data errors, keep genuine extreme values if they matter. To reduce their influence, cap or winsorize, transform with logs, use robust scalers and losses, or choose models less sensitive to them, such as trees.
  level: Junior
  category: data-science
  subcategory: feature-engineering
- id: what-is-feature-selection-and-what-methods-exist
  q: What is feature selection, and what methods exist?
  a: |
    Choosing a subset of features to reduce overfitting, cost and complexity. Filter methods rank features by statistics such as correlation or mutual information; wrapper methods search subsets using model performance, such as recursive feature elimination; embedded methods select during training, such as L1 regularization or tree importances.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-handle-highly-correlated-features
  q: How do you handle highly correlated features?
  a: |
    They can make linear model coefficients unstable and split importance between them. Drop one of each highly correlated pair, combine them, use PCA, or rely on regularization such as ridge. For pure prediction with trees, correlation matters less, but interpretation still suffers.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-validate-data-quality-in-a-pipeline
  q: How do you validate data quality in a pipeline?
  a: |
    Define expectations and check them automatically on every run: schema and types, null rates, value ranges, uniqueness of keys, allowed categories, row counts and freshness, and distribution shifts compared with past runs. Fail or alert on violations before bad data reaches models or dashboards.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-should-you-split-data-for-time-dependent-problems
  q: How should you split data for time-dependent problems?
  a: |
    Split by time: train on the past, validate and test on later periods, mirroring how the model will be used. Random splits leak future patterns into training and overstate performance. For cross-validation, use expanding or rolling windows.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-engineer-features-for-a-fraud-detection-model
  q: How do you engineer features for a fraud detection model?
  a: |
    Combine transaction attributes such as amount, merchant category and channel; velocity features such as transactions per card in the last hour or day; deviations from the user's normal behavior such as distance from usual location or amount versus average; device and network signals; and graph features linking cards, devices and accounts. All must be computable in real time at prediction.
  level: Senior
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-engineer-features-for-churn-prediction
  q: How do you engineer features for churn prediction?
  a: |
    Recency, frequency and monetary features, trends in usage such as activity this month versus last, engagement depth with key features, support tickets and complaints, plan and tenure, payment failures, and seasonality. Define the prediction point and churn window clearly so features only use data before the prediction point.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: what-is-data-augmentation-for-tabular-data-and-does-it-help
  q: What is data augmentation for tabular data, and does it help?
  a: |
    Generating synthetic rows, for example with SMOTE for minority classes, noise injection, or generative models. It can help imbalanced or small datasets, but synthetic rows can blur class boundaries or create unrealistic combinations, so validate on real data only and prefer simpler fixes such as class weights first.
  level: Senior
  category: data-science
  subcategory: feature-engineering
- id: embeddings-vs-hand-crafted-features-when-do-you-use-each
  q: "Embeddings vs hand-crafted features: when do you use each?"
  a: |
    Learned embeddings capture complex patterns in unstructured data such as text, images and user-item interactions, and work well with large data. Hand-crafted features encode domain knowledge directly, are interpretable and data-efficient. Strong systems often combine both, feeding embeddings and engineered features into the same model.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-check-whether-a-new-feature-actually-helps
  q: How do you check whether a new feature actually helps?
  a: |
    Compare validation performance with and without it using the same splits and several seeds, check that the gain is consistent across segments and time periods, verify it cannot leak the target, and confirm it is available at serving time with the same definition. Finally, confirm the improvement online if it matters.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-handle-categories-that-appear-in-production-but-n
  q: How do you handle categories that appear in production but not in training?
  a: |
    Reserve an "unknown" bucket during training, for example by mapping rare categories to it, so the model has learned something for unseen values. Hashing encoders naturally handle new values. Monitor the rate of unseen categories, since a spike can signal upstream changes.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: what-is-binning-and-when-is-it-useful
  q: What is binning, and when is it useful?
  a: |
    Grouping a continuous variable into intervals, such as age bands. It can capture non-linear effects in linear models, reduce noise and make features interpretable, but it loses information within bins and the choice of boundaries matters. Trees effectively learn their own bins.
  level: Junior
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-deal-with-label-noise-in-your-data
  q: How do you deal with label noise in your data?
  a: |
    Estimate it by auditing samples and measuring annotator agreement, then improve labeling guidelines, use multiple annotators with adjudication, and find likely mislabeled examples with confident-learning methods or high-loss examples. Robust losses and regularization reduce its impact during training.
  level: Senior
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-document-features-so-others-can-trust-and-reuse-t
  q: How do you document features so others can trust and reuse them?
  a: |
    Record each feature's definition, source tables, computation logic and time window, owner, freshness, known caveats and the models that use it, ideally in a feature store or catalog. Version definitions, because changing a feature silently changes every model that depends on it.
  level: Mid
  category: data-science
  subcategory: feature-engineering
- id: how-do-you-encode-geographic-data-such-as-latitude-and-longi
  q: How do you encode geographic data such as latitude and longitude?
  a: |
    Raw coordinates work for tree models, but more useful features include distance to key points such as stores or the user's home, clustering locations into regions, geohash or grid-cell ids, and joining area-level statistics such as population density. Use haversine distance for accuracy over large areas.
  level: Mid
  category: data-science
  subcategory: feature-engineering
