- id: the-model-is-streaming-a-multi-file-edit-while-the-user-keep
  q: The model is streaming a multi-file edit while the user keeps typing in one of those files. How do you apply the edits without corrupting the buffer?
  a: |
    Never write the model's output directly into a buffer the user is editing. Express edits as patches anchored to content and positions in a known base version, and when applying, rebase them onto the current buffer: transform positions through the user's intervening edits, as in operational transforms, or re-match anchor text.

    If an edit conflicts with the user's typing in the same region, do not apply it silently; show it as a suggestion or conflict to resolve. Apply edits as undoable transactions per file.
