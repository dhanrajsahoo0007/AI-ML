- id: devin-runs-asynchronously-in-the-cloud-windsurf-s-cascade-ru
  q: Devin runs asynchronously in the cloud; Windsurf's Cascade runs in the editor next to the user. What actually changes between those two products, technically?
  a: |
    A cloud agent runs long, independent tasks in its own sandbox with its own copy of the code and tools, so it needs durable state, task queues, environment setup, CI and PR integration, and status reporting, and it is evaluated on end-to-end task completion with little supervision.

    An in-editor agent works alongside the user in their local environment, so it needs low latency, awareness of the user's current file and edits, safe application of changes into a live buffer, short interactive loops and frequent user steering. The model can be similar; the harness, environment and UX differ a lot.
