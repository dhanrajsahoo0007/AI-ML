- id: design-cursor-s-tab-next-edit-prediction-system-it-must-feel
  q: 'Design Cursor''s tab (next-edit prediction) system: it must feel instant (sub-100 ms perceived latency) for millions of daily users.'
  a: |
    Use a small, specialized model trained on edit sequences to predict the next edit given recent edits, cursor position and nearby code. Keep context compact, use speculative decoding with the existing code as the draft since most output repeats it, and run on optimized inference near the user with high batch efficiency.

    Hide latency with debouncing, prefetching likely next predictions, caching, cancelling stale requests and showing suggestions only when confident. Measure acceptance rate, perceived latency at p95 and cost per user.
