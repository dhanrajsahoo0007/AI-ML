- id: design-the-tool-surface-for-a-coding-agent-which-tools-exist
  q: 'Design the tool surface for a coding agent: which tools exist, what their schemas look like, and how results come back.'
  a: |
    A small, composable set: search (by text and by file name), read file with line ranges, edit file with exact string replacement or patch, create file, run a shell command or tests in a sandbox, and possibly list directories and fetch documentation. Each schema has a few typed parameters, such as path, old and new strings, command and timeout.

    Results come back compact and structured: file contents with line numbers, edit confirmations or precise errors when a match is not unique, and command output truncated with exit codes. Long outputs are summarized or paged, and risky commands require approval.
