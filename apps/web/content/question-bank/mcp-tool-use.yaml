- id: an-agent-needs-to-iterate-on-code-run-builds-tests-lints-wit
  q: An agent needs to iterate on code (run builds, tests, lints) without disturbing what the user sees in their editor. Architect that.
  a: |
    Give the agent its own working copy, such as a git worktree or shadow workspace, synced from the user's state, where it edits files and runs builds, tests and linters in a sandbox or container. The user's editor and files stay untouched while the agent iterates.

    Surface the result as a proposed diff the user can review and apply, rebasing it onto any changes the user made meanwhile. Manage resources so builds do not slow the user's machine, for example by running them remotely.
