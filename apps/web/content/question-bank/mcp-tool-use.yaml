- id: your-agent-model-outputs-an-edited-version-of-a-500-line-fil
  q: Your agent model outputs an edited version of a 500-line file. Applying it verbatim is slow and error-prone. How do you make “apply” fast and reliable?
  a: |
    Have the model output only the changes, such as search-and-replace blocks or diffs with enough context to locate them, instead of the whole file. Apply them with exact matching first, then fuzzy matching tolerant of whitespace or small differences, and fail clearly with feedback to the model if a match is ambiguous.

    Alternatively use a small, fast apply model that merges a sketch of the edit into the full file, using speculative decoding with the original file as the draft, which is fast because most tokens are unchanged. Verify with formatters, syntax checks and tests.
