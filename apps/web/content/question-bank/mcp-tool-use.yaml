- id: design-the-harness-for-an-agent-that-makes-multi-file-change
  q: Design the harness for an agent that makes multi-file changes from a natural-language task. How do you keep it from wrecking a codebase?
  a: |
    Run the agent on a separate branch or working copy in a sandbox. Give it code search and symbol lookup to find relevant files, require a plan before editing, and use precise edit tools that fail on ambiguous matches. After edits, automatically run the formatter, type checker, linter and relevant tests, and feed failures back.

    Protect the codebase: scope which paths it may touch, cap the size of the change, block destructive commands, checkpoint so changes can be reverted, and finish with a clean diff and summary for human review rather than direct commits to the main branch. Evaluate on historical tasks with known correct changes.
