- id: design-an-agent-that-operates-a-web-browser-to-complete-mult
  q: Design an agent that operates a web browser to complete multi-step tasks. How do you make it reliable enough to ship?
  a: |
    Combine a model with browser tools: navigate, click, type, scroll and read, using the accessibility tree or simplified DOM plus screenshots for perception. Keep a plan and state, verify each step's outcome, handle pop-ups, logins, pagination and slow loads, and recover from errors by retrying or re-planning.

    To ship it: run in an isolated browser with scoped credentials, treat page content as untrusted to resist prompt injection, require confirmation before purchases or submissions, set step and time budgets, log every action with screenshots, and evaluate on a large suite of realistic tasks, measuring end-state success across repeated runs.
