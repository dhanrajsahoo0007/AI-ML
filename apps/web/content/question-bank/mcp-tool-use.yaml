- id: you-have-eight-hours-to-build-a-coding-agent-from-scratch-de
  q: You have eight hours to build a coding agent from scratch. Describe what you build and, more importantly, what you cut.
  a: |
    Build the core loop that matters: a strong hosted model, four tools (search, read, edit, run tests or shell in a sandbox), a simple ReAct loop with a step budget, and feedback from test output. Add a small evaluation set of 10–20 real tasks early so every change is measured, and log full traces.

    Cut multi-agent orchestration, fancy UIs, long-term memory, custom models, many tools and broad integrations. Use remaining time on what the evaluation shows is failing, usually context gathering and edit reliability.
