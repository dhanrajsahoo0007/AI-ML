- id: design-autoglm-end-to-end-a-cloud-service-letting-users-dele
  q: 'Design AutoGLM end to end: a cloud service letting users delegate multi-step phone tasks (“order my usual coffee”) to an autonomous agent. Architecture and failure modes.'
  a: |
    The user's request goes to a planner that breaks it into steps and resolves preferences ("usual coffee") from memory. The task runs on a cloud-hosted virtual phone or on the user's device, where a GUI agent perceives screens, acts by taps and typing, and verifies each step, with app-specific skills for common apps.

    Failure modes include unexpected screens and pop-ups, app updates changing layouts, logins and CAPTCHAs, payment confirmations and wrong orders. Mitigate with verification after every step, recovery and replanning, mandatory user confirmation for payments, timeouts and progress reporting, and evaluation on many recorded app tasks.
