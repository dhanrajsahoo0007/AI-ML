- id: what-is-the-difference-between-structured-output-and-functio
  q: What is the difference between structured output and function calling?
  a: |
    Structured output constrains the model's response to a given schema, such as JSON with specific fields, and your code consumes that result directly, for example for data extraction or classification.

    Function calling gives the model a set of tools with schemas and lets it decide whether to call one, which one and with what arguments. Your code executes the call and returns the result, and the model continues. Both rely on schema-constrained generation, but function calling adds tool selection and a multi-turn execution loop.
