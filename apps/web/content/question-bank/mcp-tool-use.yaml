- id: design-agent-orchestration-across-dozens-of-connected-saas-s
  q: Design agent orchestration across dozens of connected SaaS systems. Where is authorization enforced, and why can it not live in the model?
  a: |
    Use a tool layer, often MCP servers or connectors per system, behind an orchestration service that selects relevant tools per request, manages state and calls them on the user's behalf. Authorization is enforced in that layer and in each target system: every call uses the user's delegated token and is checked against policies before execution.

    It cannot live in the model because the model can be wrong, manipulated by prompt injection, or confused about who the user is; it has no reliable notion of identity. Permissions must be deterministic and auditable, so the model only proposes actions, and code decides whether they are allowed.
