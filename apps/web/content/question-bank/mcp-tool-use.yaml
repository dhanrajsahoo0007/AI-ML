- id: how-do-you-handle-tool-call-errors-timeouts-and-retries-in-a
  q: How do you handle tool-call errors, timeouts and retries in an agentic loop?
  a: |
    Validate arguments before execution and return precise, actionable error messages to the model so it can correct them. Retry transient failures such as timeouts and rate limits with exponential backoff and jitter, in code rather than by asking the model, and cap retries.

    Make tools idempotent, or use idempotency keys for writes, so retries cannot double-charge or double-create. Set timeouts per tool, count errors against the step budget, and when a tool keeps failing, let the agent take another path, return a partial result, or escalate to a human. Log every failure for evaluation.
  level: Mid
  category: mcp-tool-use
  subcategory: function-calling
  companies:
  - Cognition
  - OpenAI
