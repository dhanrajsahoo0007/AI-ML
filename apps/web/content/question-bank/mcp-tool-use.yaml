- id: how-many-tools-is-too-many-how-do-you-design-tool-schemas-an
  q: How many tools is too many? How do you design tool schemas an LLM can actually use correctly?
  a: |
    There is no fixed number, but accuracy drops as tools overlap and their descriptions crowd the context; dozens of similar tools reliably cause wrong choices. Keep the set small per task, group related operations, and load tools dynamically by task or let the agent search a tool catalog when there are many.

    Good schemas have a specific name, a description that says when and when not to use the tool, few required parameters with clear types and enums, examples, compact structured outputs, and errors that tell the model how to fix the call. Measure tool-selection and argument accuracy on an evaluation set and fix the worst tools first.
