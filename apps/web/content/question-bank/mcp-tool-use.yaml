- id: autoglm-and-cogagent-operate-real-guis-from-screenshots-over
  q: 'AutoGLM and CogAgent operate real GUIs from screenshots over tens of steps. Design the agent: perception, action space, and error recovery for a 50-step task.'
  a: |
    Perception: a vision-language model reads screenshots, ideally at high resolution, plus the accessibility tree or DOM when available, and grounds elements to coordinates or element ids. Action space: a small set such as click, type, scroll, select, go back and wait, with targets referenced by element ids where possible rather than raw pixels.

    For a 50-step task, keep an explicit plan and progress state, verify each action's effect from the next screenshot, detect being stuck or on an unexpected screen, and recover by backtracking, retrying or re-planning. Checkpoint progress, require confirmation before irreversible steps, and train or evaluate on many recorded trajectories with success measured on the final state.
