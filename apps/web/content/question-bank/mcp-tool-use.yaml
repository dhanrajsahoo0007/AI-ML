- id: design-the-execution-environment-for-thousands-of-concurrent
  q: Design the execution environment for thousands of concurrent cloud coding agents. It must survive the agent waiting forty minutes for CI.
  a: |
    Run each agent in an isolated, persistent sandbox such as a micro-VM or container with the repository, tools and credentials scoped to that task, orchestrated by a scheduler that packs many sandboxes per host. Agent state, including files, processes and conversation, must be checkpointed so a sandbox can be paused and resumed.

    While waiting forty minutes for CI, suspend the sandbox (snapshot its state and release compute) and resume it on a CI webhook or poll, possibly on another host. Add resource limits, network egress controls, secret management, cleanup of abandoned sandboxes and per-agent cost tracking.
  level: Senior
  category: mcp-tool-use
  subcategory: computer-code-agents
  companies:
  - Cognition
