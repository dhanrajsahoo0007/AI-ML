- id: design-a-connector-framework-that-syncs-content-and-permissi
  q: Design a connector framework that syncs content and permissions from 100+ SaaS apps into one index.
  a: |
    Each connector implements a common interface: authenticate, list and fetch content incrementally, fetch permissions including groups, and handle webhooks or change feeds. A sync engine schedules connectors, handles rate limits and retries, normalizes content into a common document model with metadata and ACLs, and tracks sync state per source.

    Permissions are synced as carefully as content, including group membership expansion, and checked at query time. Monitor freshness and errors per connector, run periodic full reconciliations, and isolate connector failures so one broken source does not stall others.
  level: Senior
  category: rag
  subcategory: chunking-ingestion
  companies:
  - Glean
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: describe-the-ingestion-pipeline-of-a-rag-system
  q: Describe the ingestion pipeline of a RAG system.
  a: |
    Collect documents from sources, parse them into clean text while keeping structure such as headings and tables, split into chunks, attach metadata such as source, date and permissions, embed each chunk, and write vectors and metadata to an index. Incremental updates and deletions keep the index in sync with the sources.
  level: Junior
  category: rag
  subcategory: chunking-ingestion
- id: how-do-you-choose-between-a-sparse-retriever-bm25-and-a-dens
  q: How do you choose between a sparse retriever (BM25) and a dense retriever? When do you need both?
  a: |
    BM25 matches exact terms and excels at identifiers, error codes, product names and rare jargon, needs no training and is explainable. Dense retrieval matches meaning, handles paraphrases and natural-language questions, and works across wording differences, but can miss exact tokens and needs a good embedding model for the domain.

    You need both when queries mix the two, which is most enterprise and technical search. Run them in parallel and merge with reciprocal rank fusion, then re-rank. Measure each alone and combined on your query set to confirm the gain.
  level: Mid
  category: rag
  subcategory: vector-search
