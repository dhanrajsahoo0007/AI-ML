- id: how-would-you-chunk-and-embed-heterogeneous-enterprise-conte
  q: >-
    How would you chunk and embed heterogeneous enterprise content: Slack threads, Jira tickets,
    Google Docs, PDFs?
  a: >
    Use source-specific chunking. Slack: group messages into threads or time-windowed conversations
    with channel and participant context. Jira: one chunk per ticket with title, description and key
    fields, and comments as linked chunks. Google Docs: split by headings with document title
    prepended. PDFs: layout-aware parsing by section, keeping tables intact.


    Normalize everything into a common schema with source, author, timestamps, permissions and
    links, add contextual headers to each chunk, and use one embedding model across sources so
    results are comparable, with source-aware ranking features. Evaluate retrieval per source, since
    quality varies widely.
  topic: rag
  level: Mid
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/rag-fundamentals
  refs:
    - title: Chunking Strategies for RAG
      url: https://outcomeschool.com/blog/chunking-strategies-for-rag
  source: outcome-school
- id: why-is-rag-the-right-architecture-for-an-enterprise-assistan
  q: >-
    Why is RAG the right architecture for an enterprise assistant instead of fine-tuning on the
    company's data? Where does RAG break?
  a: >
    Enterprise knowledge changes constantly, is spread across permissioned systems, and answers must
    be traceable. RAG reads current content at query time, enforces each user's permissions, cites
    sources, and updates by re-indexing, while fine-tuning bakes in a snapshot, cannot enforce
    per-user access, does not cite, and memorizes facts unreliably.


    RAG breaks on questions needing aggregation or computation over many records, which need
    structured queries; on poor parsing and chunking; when the right document is not retrieved; on
    contradictory or stale content; and on multi-hop questions without iterative retrieval.
    Fine-tuning can still help with style or domain language on top of RAG.
  topic: rag
  level: Mid
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/rag-fundamentals
