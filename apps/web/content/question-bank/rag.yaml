- id: how-do-embeddings-enable-semantic-search
  q: How do embeddings enable semantic search?
  a: |
    An embedding model maps text to vectors so that texts with similar meaning have nearby vectors. The query is embedded the same way, and the nearest document vectors by cosine similarity or dot product are retrieved, which finds relevant passages even when they use different words from the query.
  level: Junior
  category: rag
  subcategory: vector-search
- id: cosine-similarity-vs-dot-product-vs-euclidean-distance-which
  q: 'Cosine similarity vs dot product vs Euclidean distance: which do you use?'
  a: |
    Use the metric the embedding model was trained with. Cosine similarity ignores vector length and compares direction; dot product includes length, which some models use to encode importance; Euclidean distance is equivalent to cosine for normalized vectors. Many models output normalized vectors, making these choices rank-equivalent.
  level: Mid
  category: rag
  subcategory: vector-search
- id: how-do-you-choose-an-embedding-model
  q: How do you choose an embedding model?
  a: |
    Compare candidates on your own retrieval evaluation set, using public leaderboards such as MTEB only to shortlist. Consider language and domain coverage, maximum input length, vector dimension and storage cost, latency, licensing and hosting. Fine-tuning an embedding model on your domain's query-passage pairs can give large gains.
  level: Mid
  category: rag
  subcategory: vector-search
- id: what-is-a-reranker-when-should-you-use-one-and-what-does-a-c
  q: What is a reranker, when should you use one, and what does a cross-encoder cost you?
  a: |
    A re-ranker rescores a candidate list from the first-stage retriever with a more accurate model. A cross-encoder reads the query and each passage together, so it captures fine-grained relevance that separate embeddings miss.

    Use one when the right passage is usually retrieved but not ranked near the top, or when you can only fit a few passages in the prompt. The cost is latency and compute that grow with the number of candidates, since every pair needs a forward pass: typically tens to hundreds of milliseconds for 50–100 candidates. Limit candidates, use a smaller model, or batch on GPU.
  level: Mid
  category: rag
  subcategory: advanced-rag
