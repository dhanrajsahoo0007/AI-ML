- id: how-would-you-evaluate-the-quality-of-a-rag-pipeline-retriev
  q: "How would you evaluate the quality of a RAG pipeline: retrieval and generation separately?"
  a: >
    Build a test set of real questions with reference answers and the passages that support them.
    Evaluate retrieval on its own with recall at k, MRR and nDCG: did the right evidence reach the
    prompt, and how high was it ranked?


    Evaluate generation separately on faithfulness (every claim supported by the retrieved context),
    answer relevance and correctness against references, using LLM judges calibrated against human
    labels, as in RAGAS. Include unanswerable questions to test abstention, track results per
    question type, and run the suite on every change.
  topic: rag
