# Company-reported questions adapted from Outcome School (Apache 2.0); see NOTICE.md. Answers are our own.
- id: what-chunking-strategy-would-you-use-for-a-large-technical-d
  q: What chunking strategy would you use for a large technical documentation corpus, and why?
  a: >
    Chunk along the documentation's own structure: split by headings and sections, keep code blocks,
    tables and their explanations together, and prepend each chunk with its page title and heading
    path so it makes sense on its own. Aim for a few hundred tokens with small overlap, and never
    split inside a code sample.


    Store small chunks for precise matching but return the parent section for context, attach
    metadata such as product, version and doc type for filtering, and pick final sizes by measuring
    recall at k on a set of real questions rather than by intuition.
  topic: rag
