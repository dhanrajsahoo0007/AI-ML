- id: an-enterprise-wants-semantic-search-over-100m-documents-but
  q: >-
    An enterprise wants semantic search over ~100M documents but is balking at vector-index cost.
    Walk me through embedding compression options and the maths.
  a: >
    Say 100M documents become 300M chunks with 1,024-dimension float32 vectors: 300M × 1,024 × 4
    bytes ≈ 1.2 TB, before index overhead. Int8 quantization cuts that 4x to about 300 GB; binary
    embeddings cut it 32x to about 38 GB; reducing dimensions with Matryoshka-trained models halves
    or quarters it again; product quantization compresses even further.


    The trick is a two-step search: search compressed vectors to get a few hundred candidates fast
    and cheaply, then rescore them with higher-precision vectors or a re-ranker, which recovers most
    of the lost recall. Measure recall at k for each setting and pick the cheapest that meets the
    target.
  topic: rag
