- id: how-do-you-handle-tables-figures-and-multi-column-pdfs-in-a
  q: How do you handle tables, figures and multi-column PDFs in a retrieval pipeline?
  a: |
    Use layout-aware parsing that detects reading order across columns, headers and footers, extracts tables as structured text such as markdown or HTML with their captions, and keeps figure captions with surrounding text. Scanned pages need OCR.

    Chunk tables as whole units with their title and column headers, or convert each row into a self-contained sentence for retrieval. For figures and charts, generate text descriptions with a vision-language model or use multimodal embeddings. Evaluate parsing quality on a sample, because broken reading order silently corrupts everything downstream.
  level: Mid
  category: rag
  subcategory: chunking-ingestion
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: how-do-you-keep-an-index-fresh-when-the-underlying-corpus-ch
  q: How do you keep an index fresh when the underlying corpus changes continuously?
  a: |
    Use change events or frequent incremental syncs from each source, keyed by document id and content hash, so only changed documents are re-parsed and re-embedded, and deletions remove their chunks. Updates should replace a document's chunks atomically so readers never see half-updated content.

    Track freshness lag per source and alert when it grows, run periodic full reconciliations to catch missed events, and fully re-embed when the embedding model changes. For fast-changing facts such as prices or status, query the system of record live instead of indexing it.
  level: Mid
  category: rag
  subcategory: chunking-ingestion
  companies:
  - Cursor
  - Perplexity
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: how-would-you-chunk-and-embed-heterogeneous-enterprise-conte
  q: 'How would you chunk and embed heterogeneous enterprise content: Slack threads, Jira tickets, Google Docs, PDFs?'
  a: |
    Use source-specific chunking. Slack: group messages into threads or time-windowed conversations with channel and participant context. Jira: one chunk per ticket with title, description and key fields, and comments as linked chunks. Google Docs: split by headings with document title prepended. PDFs: layout-aware parsing by section, keeping tables intact.

    Normalize everything into a common schema with source, author, timestamps, permissions and links, add contextual headers to each chunk, and use one embedding model across sources so results are comparable, with source-aware ranking features. Evaluate retrieval per source, since quality varies widely.
  level: Mid
  category: rag
