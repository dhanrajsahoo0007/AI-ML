- id: design-cross-lingual-rag-the-knowledge-base-is-in-english-an
  q: 'Design cross-lingual RAG: the knowledge base is in English and Hindi, but users ask in Tamil, Telugu or transliterated Hinglish.'
  a: |
    Normalize queries first: detect language and script, transliterate romanized text such as Hinglish into native script, and optionally translate the query into English and Hindi. Retrieve with a strong multilingual embedding model plus the translated queries, merge results, and re-rank with a cross-lingual re-ranker.

    Generate the answer in the user's language, citing the original passages. Evaluate with native-speaker queries per language, including code-mixed and transliterated inputs, and watch tokenizer efficiency, since Indic text can be expensive in tokens.
  level: Senior
  category: rag
  subcategory: advanced-rag
  companies:
  - Sarvam AI
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: discuss-reranker-architecture-choices-cross-encoder-colbert
  q: 'Discuss reranker architecture choices: cross-encoder, ColBERT, LLM-based.'
  a: |
    Cross-encoders read query and passage jointly and give the most accurate pairwise scores among small models, but every candidate needs a full forward pass, so they are used on short lists. ColBERT-style late interaction keeps one vector per token, matching query tokens to document tokens with a cheap max-similarity sum; document vectors are precomputed, so it is much faster than a cross-encoder at somewhat lower accuracy, but storage is large.

    LLM-based re-rankers, scoring passages individually or ranking a list, can use world knowledge and instructions and handle nuanced relevance, but are the slowest and most expensive. A common pattern is cheap retrieval, ColBERT or a small cross-encoder for the top 100, then an LLM re-ranker for the top 10 where quality matters.
  level: Senior
  category: rag
  subcategory: advanced-rag
  companies:
  - Perplexity
