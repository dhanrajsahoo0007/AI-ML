- id: for-a-long-context-assistant-when-is-a-1m-token-context-wind
  q: For a long-context assistant, when is a 1M-token context window the right tool, and when should you use retrieval instead?
  a: |
    A huge context window is right when the task needs to reason over a whole body of material at once, such as analyzing one large codebase or a long contract end to end, when the material is used once, and when retrieval would likely miss cross-references.

    Retrieval is better when the corpus is larger than any window, when the same knowledge serves many queries, when cost and latency per query matter, when permissions and citations are required, and when the relevant part is a small fraction of the material. Combining both, retrieving a generous but focused context, is often best.
  level: Mid
