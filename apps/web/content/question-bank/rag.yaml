- id: compare-hnsw-ivf-pq-and-flat-indexes-how-do-you-pick-and-wha
  q: Compare HNSW, IVF-PQ and flat indexes. How do you pick, and what does recall@k cost in latency?
  a: >
    Flat search compares the query with every vector: exact, simple, fine up to roughly a million
    vectors or for building ground truth. HNSW is a layered proximity graph with high recall and low
    latency but large memory use and slower builds. IVF-PQ clusters vectors and compresses them with
    product quantization, so it scales to billions cheaply at some recall loss.


    Pick by size, memory budget and recall target. Higher recall costs latency: in HNSW, raising
    efSearch explores more of the graph; in IVF, raising nprobe searches more clusters. Measure
    recall at k against exact search alongside p95 latency and choose the cheapest setting that
    meets the recall target.
  topic: rag
