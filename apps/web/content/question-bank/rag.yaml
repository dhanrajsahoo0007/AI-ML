- id: design-permission-aware-retrieval-users-must-never-see-conte
  q: 'Design permission-aware retrieval: users must never see content they can''t access in the source system.'
  a: |
    Ingest permissions with the content: connectors sync each document's access-control list, including group memberships, and store them as metadata on every chunk. At query time, resolve the user's identity and groups and apply them as a filter inside the search, so unauthorized chunks are never retrieved, rather than filtering after generation.

    Keep permissions fresh with change notifications and periodic full syncs, fail closed when permission data is stale or missing, apply the same filters to caches and memory, and run automated tests with users of different roles. For highly sensitive sources, check permissions again against the source system just before returning content.
  level: Senior
  category: rag
  subcategory: rag-fundamentals
  companies:
  - Databricks
  - Glean
  - Microsoft
  - Palantir
  related: /ai-system-design/genai-system-design/rag-fundamentals
