- id: long-context-windows-keep-getting-cheaper-why-not-drop-retri
  q: >-
    Long context windows keep getting cheaper. Why not drop retrieval and stuff the whole repo into
    context for every request?
  a: >
    Most repositories are far larger than any window, and stuffing a whole repo into every request
    means paying prefill cost and latency for millions of tokens on every keystroke-driven call,
    even with caching. Models also use the middle of very long contexts less reliably, so irrelevant
    code can distract them and lower quality.


    Retrieval selects the few files and symbols that matter, keeps latency low and costs
    predictable, and scales as the repo grows. Long context still helps by letting you include more
    retrieved material, larger files and full call chains, so the best systems combine good
    retrieval with generous context.
  topic: rag
  level: Mid
