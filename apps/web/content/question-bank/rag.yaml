- id: how-do-you-handle-tables-figures-and-multi-column-pdfs-in-a
  q: How do you handle tables, figures and multi-column PDFs in a retrieval pipeline?
  a: >
    Use layout-aware parsing that detects reading order across columns, headers and footers,
    extracts tables as structured text such as markdown or HTML with their captions, and keeps
    figure captions with surrounding text. Scanned pages need OCR.


    Chunk tables as whole units with their title and column headers, or convert each row into a
    self-contained sentence for retrieval. For figures and charts, generate text descriptions with a
    vision-language model or use multimodal embeddings. Evaluate parsing quality on a sample,
    because broken reading order silently corrupts everything downstream.
  topic: rag
  level: Mid
  companies: []
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: how-do-you-keep-an-index-fresh-when-the-underlying-corpus-ch
  q: How do you keep an index fresh when the underlying corpus changes continuously?
  a: >
    Use change events or frequent incremental syncs from each source, keyed by document id and
    content hash, so only changed documents are re-parsed and re-embedded, and deletions remove
    their chunks. Updates should replace a document's chunks atomically so readers never see
    half-updated content.


    Track freshness lag per source and alert when it grows, run periodic full reconciliations to
    catch missed events, and fully re-embed when the embedding model changes. For fast-changing
    facts such as prices or status, query the system of record live instead of indexing it.
  topic: rag
  level: Mid
  companies:
    - Cursor
    - Perplexity
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: how-do-you-attribute-every-claim-in-a-generated-answer-to-a
  q: How do you attribute every claim in a generated answer to a specific retrieved span?
  a: >
    Give every retrieved passage an id, ask the model to cite ids for each sentence or claim, and
    ideally have it quote the supporting span. Then verify after generation: split the answer into
    claims, check each cited span exists and entails the claim with an NLI model or LLM judge, and
    remove or flag claims that fail.


    Render citations as links to the exact span in the source. Measure citation precision (cited
    spans support the claim) and recall (claims that have a citation) on a test set, and treat
    uncited factual claims as defects.
  topic: rag
  level: Senior
