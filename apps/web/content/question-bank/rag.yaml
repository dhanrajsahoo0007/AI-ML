- id: how-would-you-evaluate-multilingual-retrieval-quality-when-e
  q: >-
    How would you evaluate multilingual retrieval quality when employees query in French and Korean
    over mostly-English documents?
  a: >
    Build test sets of real French and Korean queries written by native speakers, each labeled with
    the relevant English documents, rather than machine-translating English queries. Measure recall
    at k and nDCG per language against an English-query baseline on the same documents, so you can
    see the cross-lingual gap.


    Check failure patterns by language, such as named entities, acronyms and domain terms, and test
    mixed-language queries. Compare options such as multilingual embeddings, query translation
    before retrieval, and cross-lingual re-rankers, and include generation checks that answers come
    back in the user's language.
  topic: rag
  level: Senior
  companies:
    - Cohere
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: a-customer-10x-d-their-indexed-documents-and-reports-answer
  q: >-
    A customer 10x'd their indexed documents and reports answer quality “got noticeably worse.”
    Drive the investigation.
  a: >
    First reproduce it with a fixed set of questions answered before and after, and check whether
    the right passages are still retrieved. With 10x more documents, likely causes are
    near-duplicates and outdated versions crowding the top results, new low-quality or off-topic
    sources, an index whose recall dropped at the larger size, metadata filters missing on new
    content, or permission sync gaps.


    Fix by deduplicating and preferring the latest versions, adding metadata filters and source
    weighting, retuning index parameters for the new scale, adding or strengthening re-ranking, and
    re-evaluating recall at k on the bigger corpus.
  topic: rag
  level: Senior
  companies:
    - Cohere
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: for-a-long-context-assistant-when-is-a-1m-token-context-wind
  q: >-
    For a long-context assistant, when is a 1M-token context window the right tool, and when should
    you use retrieval instead?
  a: >
    A huge context window is right when the task needs to reason over a whole body of material at
    once, such as analyzing one large codebase or a long contract end to end, when the material is
    used once, and when retrieval would likely miss cross-references.


    Retrieval is better when the corpus is larger than any window, when the same knowledge serves
    many queries, when cost and latency per query matter, when permissions and citations are
    required, and when the relevant part is a small fraction of the material. Combining both,
    retrieving a generous but focused context, is often best.
  topic: rag
