- id: when-would-you-put-a-whole-contract-in-the-context-window-in
  q: When would you put a whole contract in the context window instead of retrieving over it? Defend the answer with numbers.
  a: |
    A 100-page contract is roughly 50,000–75,000 tokens, which fits comfortably in modern windows. If a lawyer asks a handful of questions about one contract, full-context processing costs perhaps tens of cents per question at typical prices, gives the model every cross-reference and definition, and avoids retrieval misses, which matter a lot in legal work where missing a clause is costly.

    Retrieval wins when reviewing thousands of contracts, when the same documents are queried thousands of times, when latency must be low, or when documents exceed the window. Prefix caching also changes the math: repeated questions over one contract reuse the cached prefill, making full-context answers much cheaper.
