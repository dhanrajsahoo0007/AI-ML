- id: what-causes-semantic-drift-in-embedding-search-and-how-do-yo
  q: What causes semantic drift in embedding search and how do you detect it?
  a: |
    Semantic drift is when retrieval quality degrades because queries, documents or the embedding space change: new product names and jargon the model never saw, a shift in what users ask, a mix of vectors from different embedding model versions, or growing corpora where near-duplicates crowd out the right results.

    Detect it by monitoring retrieval scores and the share of low-similarity or "no relevant context" queries, tracking query topic distributions, sampling queries for human or LLM-judge relevance checks, and re-running a fixed evaluation set regularly. Fix with re-embedding everything when changing models, hybrid search for new terms, and fine-tuning embeddings on fresh data.
  level: Senior
  category: rag
  subcategory: vector-search
  companies:
  - Cohere
  related: /ai-system-design/genai-system-design/vector-databases
  source: outcome-school
- id: compare-hnsw-ivf-pq-and-flat-indexes-how-do-you-pick-and-wha
  q: Compare HNSW, IVF-PQ and flat indexes. How do you pick, and what does recall@k cost in latency?
  a: |
    Flat search compares the query with every vector: exact, simple, fine up to roughly a million vectors or for building ground truth. HNSW is a layered proximity graph with high recall and low latency but large memory use and slower builds. IVF-PQ clusters vectors and compresses them with product quantization, so it scales to billions cheaply at some recall loss.

    Pick by size, memory budget and recall target. Higher recall costs latency: in HNSW, raising efSearch explores more of the graph; in IVF, raising nprobe searches more clusters. Measure recall at k against exact search alongside p95 latency and choose the cheapest setting that meets the recall target.
  level: Mid
  category: rag
  subcategory: vector-search
  related: /ai-system-design/genai-system-design/vector-databases
  refs:
