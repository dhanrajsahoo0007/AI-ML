- id: how-do-you-attribute-every-claim-in-a-generated-answer-to-a
  q: How do you attribute every claim in a generated answer to a specific retrieved span?
  a: |
    Give every retrieved passage an id, ask the model to cite ids for each sentence or claim, and ideally have it quote the supporting span. Then verify after generation: split the answer into claims, check each cited span exists and entails the claim with an NLI model or LLM judge, and remove or flag claims that fail.

    Render citations as links to the exact span in the source. Measure citation precision (cited spans support the claim) and recall (claims that have a citation) on a test set, and treat uncited factual claims as defects.
  level: Senior
  category: rag
  subcategory: advanced-rag
