- id: what-causes-semantic-drift-in-embedding-search-and-how-do-yo
  q: What causes semantic drift in embedding search and how do you detect it?
  a: >
    Semantic drift is when retrieval quality degrades because queries, documents or the embedding
    space change: new product names and jargon the model never saw, a shift in what users ask, a mix
    of vectors from different embedding model versions, or growing corpora where near-duplicates
    crowd out the right results.


    Detect it by monitoring retrieval scores and the share of low-similarity or "no relevant
    context" queries, tracking query topic distributions, sampling queries for human or LLM-judge
    relevance checks, and re-running a fixed evaluation set regularly. Fix with re-embedding
    everything when changing models, hybrid search for new terms, and fine-tuning embeddings on
    fresh data.
  topic: rag
  level: Senior
  companies:
    - Cohere
  related: /ai-system-design/genai-system-design/vector-databases
  source: outcome-school
- id: design-permission-aware-retrieval-users-must-never-see-conte
  q: >-
    Design permission-aware retrieval: users must never see content they can't access in the source
    system.
  a: >
    Ingest permissions with the content: connectors sync each document's access-control list,
    including group memberships, and store them as metadata on every chunk. At query time, resolve
    the user's identity and groups and apply them as a filter inside the search, so unauthorized
    chunks are never retrieved, rather than filtering after generation.


    Keep permissions fresh with change notifications and periodic full syncs, fail closed when
    permission data is stale or missing, apply the same filters to caches and memory, and run
    automated tests with users of different roles. For highly sensitive sources, check permissions
    again against the source system just before returning content.
  topic: rag
