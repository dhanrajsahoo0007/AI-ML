- id: you-have-an-embedding-model-and-a-reranker-why-sell-both-des
  q: >-
    You have an embedding model and a reranker. Why sell both? Design the two-stage retrieval
    pipeline and tell me when the reranker earns its latency.
  a: >
    They solve different stages. The embedding model makes first-stage retrieval fast and scalable,
    because document vectors are precomputed; the re-ranker makes final ordering accurate, because
    it reads query and passage together. Together they beat either alone at a reasonable cost.


    The pipeline: embed and index documents, retrieve the top 50–200 candidates with vector or
    hybrid search, re-rank them, and pass the best 5–10 to the LLM. The re-ranker earns its latency
    when first-stage results contain the answer but rank it too low, when the prompt budget is
    small, or when precision matters more than a few hundred milliseconds.
  topic: rag
