- id: how-does-agentic-rag-differ-from-standard-rag-and-when-is-th
  q: How does agentic RAG differ from standard RAG, and when is the extra complexity justified?
  a: >
    Standard RAG runs one fixed pipeline: retrieve once, then generate. Agentic RAG gives an LLM
    search tools and lets it decide whether to search, which sources to query, how to rewrite
    queries and when it has enough, looping over several retrievals and possibly structured lookups.


    The extra latency, cost and unpredictability are justified for complex, multi-hop or
    research-style questions across several sources, where one retrieval cannot gather the evidence.
    For high-volume, predictable questions, a fixed pipeline with good ranking is cheaper, faster
    and easier to evaluate.
