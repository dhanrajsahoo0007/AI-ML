- id: why-is-rag-the-right-architecture-for-an-enterprise-assistan
  q: Why is RAG the right architecture for an enterprise assistant instead of fine-tuning on the company's data? Where does RAG break?
  a: |
    Enterprise knowledge changes constantly, is spread across permissioned systems, and answers must be traceable. RAG reads current content at query time, enforces each user's permissions, cites sources, and updates by re-indexing, while fine-tuning bakes in a snapshot, cannot enforce per-user access, does not cite, and memorizes facts unreliably.

    RAG breaks on questions needing aggregation or computation over many records, which need structured queries; on poor parsing and chunking; when the right document is not retrieved; on contradictory or stale content; and on multi-hop questions without iterative retrieval. Fine-tuning can still help with style or domain language on top of RAG.
  level: Mid
  category: rag
