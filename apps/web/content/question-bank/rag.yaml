- id: what-is-a-reranker-when-should-you-use-one-and-what-does-a-c
  q: What is a reranker, when should you use one, and what does a cross-encoder cost you?
  a: >
    A re-ranker rescores a candidate list from the first-stage retriever with a more accurate model.
    A cross-encoder reads the query and each passage together, so it captures fine-grained relevance
    that separate embeddings miss.


    Use one when the right passage is usually retrieved but not ranked near the top, or when you can
    only fit a few passages in the prompt. The cost is latency and compute that grow with the number
    of candidates, since every pair needs a forward pass: typically tens to hundreds of milliseconds
    for 50–100 candidates. Limit candidates, use a smaller model, or batch on GPU.
