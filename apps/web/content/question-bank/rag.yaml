- id: the-agent-answers-from-a-customer-s-knowledge-base-which-con
  q: The agent answers from a customer's knowledge base, which contains outdated and contradictory articles. How do you prevent confidently wrong answers?
  a: |
    Clean and govern the source: deduplicate, mark articles with owners and effective dates, retire outdated ones, and flag conflicts for the customer to resolve. At retrieval time, prefer the most recent and authoritative articles using metadata, and filter by product, region and plan.

    At generation time, instruct the agent to cite its source, notice contradictions and say so rather than pick one silently, and escalate or ask a clarifying question when sources disagree on something consequential. Monitor answers that customers or agents flag as wrong and feed them back to content owners.
  level: Senior
  category: rag
  subcategory: advanced-rag
  companies:
  - Sierra
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: how-do-you-handle-conversational-follow-up-questions-in-rag
  q: How do you handle conversational follow-up questions in RAG?
  a: |
    Rewrite the follow-up into a standalone query using the conversation history, for example turning "what about the premium plan?" into "what is the refund policy for the premium plan?", then retrieve with that. Keep the history in the generation prompt so the answer stays coherent.
  level: Mid
  category: rag
  subcategory: advanced-rag
- id: how-would-you-add-multimodal-inputs-to-a-rag-system
  q: How would you add multimodal inputs to a RAG system?
  a: |
    Use multimodal embedding models that place images and text in a shared space, or convert images to text descriptions and captions with a vision-language model and index those. At query time, retrieve across modalities and pass images or their descriptions to a multimodal generator. Evaluate retrieval separately for each modality.
  level: Senior
  category: rag
  subcategory: advanced-rag
- id: what-is-reciprocal-rank-fusion
  q: What is reciprocal rank fusion?
  a: |
    A simple way to merge ranked lists from different retrievers: each document scores the sum of 1 divided by a constant plus its rank in each list. It needs no score calibration between systems, rewards documents ranked well by several retrievers, and is the common default for hybrid search.
  level: Mid
  category: rag
  subcategory: advanced-rag
- id: what-is-the-lost-in-the-middle-problem
  q: What is the 'lost in the middle' problem?
  a: |
    Models tend to use information at the beginning and end of a long context more reliably than information in the middle. In RAG this means stuffing many chunks can bury the relevant one. Re-ranking, keeping fewer chunks, and placing the most relevant ones at the start or end help.
  level: Mid
  category: rag
  subcategory: advanced-rag
- id: how-does-agentic-rag-differ-from-standard-rag-and-when-is-th
  q: How does agentic RAG differ from standard RAG, and when is the extra complexity justified?
  a: |
    Standard RAG runs one fixed pipeline: retrieve once, then generate. Agentic RAG gives an LLM search tools and lets it decide whether to search, which sources to query, how to rewrite queries and when it has enough, looping over several retrievals and possibly structured lookups.

    The extra latency, cost and unpredictability are justified for complex, multi-hop or research-style questions across several sources, where one retrieval cannot gather the evidence. For high-volume, predictable questions, a fixed pipeline with good ranking is cheaper, faster and easier to evaluate.
  level: Mid
  category: rag
  subcategory: agentic-rag
  related: /ai-system-design/genai-system-design/advanced-rag
  refs:
  - title: Agentic RAG
    url: https://outcomeschool.com/blog/agentic-rag
  source: outcome-school
- id: a-lawyer-asks-about-a-200-page-credit-agreement-where-the-op
  q: A lawyer asks about a 200-page credit agreement where the operative clause on page 140 depends on a defined term on page 8. How do you build retrieval that gets this right?
  a: |
    Parse the agreement structurally: sections, clause numbers, cross-references and the definitions article. Build an index of defined terms, and when a retrieved clause uses a capitalized defined term, automatically pull that term's definition, and any clauses it references, into the context alongside it.

    Retrieval becomes clause retrieval plus expansion over the document's internal reference graph, with the whole relevant chain cited. Given the document is only 200 pages, it can also fit in a long context window, so a hybrid works well: retrieve and expand to highlight the key clauses, and verify with full-document context for completeness.
  level: Senior
  category: rag
  subcategory: agentic-rag
  companies:
  - Harvey
  related: /ai-system-design/genai-system-design/knowledge-graph-systems
  refs:
  - title: Chunking Strategies for RAG
    url: https://outcomeschool.com/blog/chunking-strategies-for-rag
  - title: How does Contextual Retrieval work?
    url: https://outcomeschool.com/blog/how-does-contextual-retrieval-work
  source: outcome-school
- id: users-ask-how-many-open-orders-are-blocked-on-a-supplier-iss
  q: Users ask “how many open orders are blocked on a supplier issue?” Plain RAG gets this wrong. Why, and what's the right architecture?
  a: |
    It is an aggregation over structured, live operational data. Plain RAG retrieves a few text chunks and asks the model to count, so it sees only a sample, uses stale indexed copies, and cannot join orders with supplier issues reliably.

    The right architecture routes such questions to structured querying: an LLM translates the question into a query against a semantic layer or ontology over the operational systems (orders, suppliers, issues and their links), the query is validated and run with the user's permissions, and the model explains the exact result. RAG remains useful for the unstructured parts, such as explaining the supplier issue from documents.
  level: Senior
  category: rag
  subcategory: agentic-rag
  companies:
  - Palantir
  related: /ai-system-design/genai-system-design/knowledge-graph-systems
  source: outcome-school
- id: what-is-graphrag-and-when-is-it-useful
  q: What is GraphRAG and when is it useful?
  a: |
    GraphRAG builds a knowledge graph of entities and relationships from the corpus and uses it to retrieve connected facts, and in Microsoft's version, summaries of graph communities. It helps multi-hop questions and corpus-wide questions such as "what are the main themes?", which chunk retrieval answers poorly, at a high indexing cost.
  level: Senior
  category: rag
  subcategory: graph-rag
- id: how-do-you-detect-and-measure-hallucinations-in-a-production
  q: How do you detect and measure hallucinations in a production RAG system?
  a: |
    Offline, use a test set with source documents and break answers into claims; check each claim against the retrieved context with an NLI model or calibrated LLM judge, and report the unsupported-claim rate and correct abstentions on unanswerable questions.

    In production, run the same faithfulness check on a sample of live answers, track citation validity and the share of answers with uncited claims, monitor user feedback and corrections, and send flagged answers to human review. Trend the rate by source, topic and model version.
  level: Mid
  category: rag
  subcategory: rag-evaluation
  companies:
  - Anthropic
  - Cursor
  - OpenAI
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: how-would-you-evaluate-the-quality-of-a-rag-pipeline-retriev
  q: 'How would you evaluate the quality of a RAG pipeline: retrieval and generation separately?'
  a: |
    Build a test set of real questions with reference answers and the passages that support them. Evaluate retrieval on its own with recall at k, MRR and nDCG: did the right evidence reach the prompt, and how high was it ranked?

    Evaluate generation separately on faithfulness (every claim supported by the retrieved context), answer relevance and correctness against references, using LLM judges calibrated against human labels, as in RAGAS. Include unanswerable questions to test abstention, track results per question type, and run the suite on every change.
  level: Mid
  category: rag
  subcategory: rag-evaluation
  companies:
  - Cohere
  related: /ai-system-design/genai-system-design/rag-fundamentals
  refs:
  - title: LLM Evaluation
    url: https://outcomeschool.com/blog/llm-evaluation
  source: outcome-school
- id: how-would-you-evaluate-multilingual-retrieval-quality-when-e
  q: How would you evaluate multilingual retrieval quality when employees query in French and Korean over mostly-English documents?
  a: |
    Build test sets of real French and Korean queries written by native speakers, each labeled with the relevant English documents, rather than machine-translating English queries. Measure recall at k and nDCG per language against an English-query baseline on the same documents, so you can see the cross-lingual gap.

    Check failure patterns by language, such as named entities, acronyms and domain terms, and test mixed-language queries. Compare options such as multilingual embeddings, query translation before retrieval, and cross-lingual re-rankers, and include generation checks that answers come back in the user's language.
  level: Senior
  category: rag
  subcategory: rag-evaluation
  companies:
  - Cohere
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: a-customer-10x-d-their-indexed-documents-and-reports-answer
  q: A customer 10x'd their indexed documents and reports answer quality “got noticeably worse.” Drive the investigation.
  a: |
    First reproduce it with a fixed set of questions answered before and after, and check whether the right passages are still retrieved. With 10x more documents, likely causes are near-duplicates and outdated versions crowding the top results, new low-quality or off-topic sources, an index whose recall dropped at the larger size, metadata filters missing on new content, or permission sync gaps.

    Fix by deduplicating and preferring the latest versions, adding metadata filters and source weighting, retuning index parameters for the new scale, adding or strengthening re-ranking, and re-evaluating recall at k on the bigger corpus.
  level: Senior
  category: rag
  subcategory: rag-evaluation
  companies:
  - Cohere
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: what-are-faithfulness-and-answer-relevance-in-rag-evaluation
  q: What are faithfulness and answer relevance in RAG evaluation?
  a: |
    Faithfulness measures whether every claim in the answer is supported by the retrieved context, catching hallucinations. Answer relevance measures whether the answer actually addresses the question. Tools such as RAGAS estimate both with LLM graders, alongside context precision and recall.
  level: Mid
  category: rag
  subcategory: rag-evaluation
- id: rag-answers-are-often-wrong-how-do-you-find-the-cause
  q: A RAG answer is wrong even though the right document is in the index. How do you find where it broke?
  a: |
    Sample failures and check whether the correct passage was retrieved. If not, it is retrieval: look at parsing, chunking, query rewriting, hybrid search and metadata filters. If retrieved but ranked low, add or tune re-ranking. If present in the prompt but answered wrongly, fix the prompt, context ordering or model choice. Categorize failures and fix the biggest bucket first.
  level: Senior
  category: rag
  subcategory: rag-evaluation
- id: what-does-a-production-rag-monitoring-dashboard-show
  q: What does a production RAG monitoring dashboard show?
  a: |
    Query volume and latency per stage, the share of queries with no relevant context, retrieval scores, citation rates, user feedback, sampled faithfulness scores from an LLM judge, cost per query, and index freshness. Breaking these down by source and user group helps find problems quickly.
  level: Mid
  category: rag
  subcategory: rag-evaluation
- id: what-is-agentic-rag
  q: What is agentic RAG, and what does the agent decide that a fixed RAG pipeline does not?
  a: |
    In a fixed pipeline every query runs the same steps: embed, retrieve top-k, generate. In agentic RAG an LLM agent controls retrieval as a tool: it decides whether retrieval is needed at all, which source or index to query, how to phrase or split the query, whether the results are good enough, and when to stop and answer.

    That makes it better at multi-hop and ambiguous questions, and at choosing between sources such as documents, SQL tables and APIs, at the cost of more latency, more tokens and less predictable behavior.
  level: Junior
  category: rag
  subcategory: agentic-rag
  related: /ai-system-design/genai-system-design/advanced-rag
- id: when-is-agentic-rag-not-worth-it
  q: When is agentic RAG not worth the extra cost and latency?
  a: |
    When most questions are single-hop lookups that one well-tuned retrieval step already answers, when strict latency budgets rule out several model calls, when behavior must be predictable and auditable step by step, or when the corpus is small and clean enough that hybrid search plus a reranker hits high recall.

    A good pattern is routing: send simple queries down a fast fixed pipeline and only escalate complex or low-confidence ones to the agentic path, then measure whether the agentic path actually improves answer quality on those queries.
  level: Mid
  category: rag
  subcategory: agentic-rag
  related: /ai-system-design/genai-system-design/advanced-rag
- id: how-does-an-agent-judge-retrieval-quality
  q: How can a RAG agent tell that what it retrieved is not good enough, and what does it do next?
  a: |
    It can grade results with a lightweight relevance check (an LLM or cross-encoder scoring each passage against the question), check coverage of every part of a multi-part question, notice contradictions between passages, or see low retrieval scores. Corrective RAG patterns formalize this as a grade-then-act step.

    Next steps include rewriting or decomposing the query, switching to a different index or to web search, retrieving neighbors or parent sections of good chunks, or answering with an explicit statement of what could not be found. A step and cost budget stops the loop.
  level: Mid
  category: rag
  subcategory: agentic-rag
  related: /ai-system-design/genai-system-design/advanced-rag
- id: design-agentic-rag-over-docs-and-sql
  q: Design an agentic RAG assistant that answers questions using both a document store and a SQL warehouse.
  a: |
    Give the agent separate tools: a document search tool with hybrid retrieval and permission filters, and a SQL tool that exposes a curated semantic layer (approved tables, column descriptions, example queries) rather than the raw warehouse. A router or the agent's own planning decides which tool each sub-question needs, for example definitions from documents and numbers from SQL.

    Validate generated SQL (read-only, row limits, schema checks), show the query and citations with the answer, cap the number of steps, log every tool call for debugging, and evaluate on a set of questions labeled with the right source and answer.
  level: Senior
  category: rag
  subcategory: agentic-rag
  related: /ai-system-design/genai-system-design/advanced-rag
- id: how-do-you-evaluate-agentic-rag
  q: How do you evaluate an agentic RAG system differently from a single-step RAG pipeline?
  a: |
    Besides final-answer correctness and faithfulness, evaluate the trajectory: did the agent retrieve when it should, choose the right sources, reformulate sensibly, and stop at the right time? Measure steps, tokens and latency per question, since agentic loops can be accurate but too slow or expensive.

    Build test sets that include single-hop, multi-hop and unanswerable questions, compare against a fixed-pipeline baseline on the same set, and inspect traces of failures to see whether errors come from retrieval, planning or generation.
  level: Senior
  category: rag
  subcategory: agentic-rag
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation

# Original questions from web research, reviewed in "AI Interview Question Expansion: Review Draft" (2026-11).
- id: when-is-retrieval-the-wrong-tool-for-a-question
  q: When is retrieval the wrong tool for a question?
  a: |
    Retrieval finds a few relevant passages. It fails when the answer is not in any few passages:

    - **Aggregations** ("how many contracts renew in Q3") need a database or SQL query.
    - **Whole-document reasoning** ("summarize the themes across this report") needs the full document or map-reduce summarization.
    - **Exact, live data** ("current stock level") needs an API call.
    - **Reasoning tasks** where the needed knowledge is already in the model and retrieved text would only distract.

    A good design routes by query type: retrieval for lookups, tools or SQL for structured and live data, and long-context or map-reduce for whole-document tasks.
  level: Mid
  category: rag
  subcategory: rag-fundamentals
  related: /ai-system-design/genai-system-design/rag-fundamentals
- id: can-mcp-replace-rag-or-do-they-solve-different-problems
  q: Can MCP replace RAG, or do they solve different problems?
  a: |
    They solve different problems. RAG is a retrieval pattern: index content ahead of time, then find the most relevant pieces for a query by semantic or keyword search. MCP is a protocol for connecting a model to tools and data sources at run time through a standard interface.

    They combine well. An MCP server can expose a search tool that runs a RAG pipeline underneath, and an agent can call it alongside live tools such as a CRM lookup. MCP alone does not do ranking over millions of documents. Calling a source system's own search through MCP works for small or well-indexed sources, but it is usually weaker than a dedicated index with good chunking, embeddings and reranking.
  level: Mid
  category: rag
  subcategory: rag-fundamentals
  related: /ai-system-design/genai-system-design/rag-fundamentals
- id: how-do-you-choose-the-chunk-size-for-a-rag-system
  q: How do you choose the chunk size for a RAG system?
  a: |
    Chunk size trades precision against context:

    - **Small chunks** (100–300 tokens) match specific questions precisely, but split explanations and lose surrounding context.
    - **Large chunks** (800–1,500 tokens) keep context, but dilute the embedding with mixed topics and fill the prompt faster.

    What drives the choice is how long a self-contained answer is in your documents, how specific the queries are, the embedding model's effective length, and the context budget.

    Do not pick 512 by default. Chunk along document structure, such as headings, sections and paragraphs, add a small overlap, then run your retrieval eval with two or three sizes and pick the one with the best recall@k at the context budget you can afford. Different document types often need different sizes.
  level: Mid
  category: rag
  subcategory: chunking-ingestion
  related: /ai-system-design/genai-system-design/rag-fundamentals
- id: your-documents-are-deeply-structured-with-long-manuals-neste
  q: Your documents are deeply structured, with long manuals, nested headings and numbered lists. How do you chunk them so answers keep their context?
  a: |
    Preserve the hierarchy instead of cutting by token count:

    - Split on headings.
    - Keep lists and their lead-in sentence together.
    - Prefix each chunk with its breadcrumb ("Manual > Installation > Network setup").

    Use small-to-big retrieval: index small chunks for precise matching, but return the parent section to the model so it sees the full procedure. Keep a map from chunk to parent so you can expand context on demand. Store section ids and document versions as metadata, so answers can cite the exact step and stale versions can be filtered out.
  level: Mid
  category: rag
  subcategory: chunking-ingestion
  related: /ai-system-design/genai-system-design/rag-fundamentals
- id: a-key-data-source-is-a-spreadsheet-with-10-000-rows-how-do-y
  q: A key data source is a spreadsheet with 10,000 rows. How do you make it answerable in a RAG assistant?
  a: |
    Do not embed the table as text chunks. Embeddings of rows are poor at filters and aggregates. Load it into a SQL table or dataframe, and give the assistant a text-to-SQL or query tool with the schema, column descriptions and a few sample values. Questions like "top five suppliers by delay" then become exact queries.

    For fuzzy lookups such as product descriptions, also embed a natural-language rendering of each row ("Supplier X, region EU, average delay 4 days") with the row id as metadata, then fetch the full row by id. Route between the two by question type, and validate generated SQL with read-only access and row limits.
  level: Senior
  category: rag
  subcategory: chunking-ingestion
  related: /ai-system-design/genai-system-design/rag-fundamentals
- id: what-is-contextual-chunk-enrichment-and-why-does-it-improve-
  q: What is contextual chunk enrichment, and why does it improve retrieval?
  a: |
    A chunk cut from a document often lacks the context that makes it findable. "Revenue grew 3%" does not say which company or quarter. Contextual enrichment prepends a short description to each chunk before embedding and indexing it: the document title and section path, or an LLM-generated sentence situating the chunk in the whole document. It is applied to both the dense and the BM25 index.

    It measurably cuts retrieval failures on ambiguous chunks. The cost is one cheap LLM call per chunk at ingestion, which prompt caching of the parent document makes affordable. Re-run it whenever the document changes.
  level: Mid
  category: rag
  subcategory: chunking-ingestion
  related: /ai-system-design/genai-system-design/rag-fundamentals
- id: how-do-you-benchmark-embedding-models-on-your-own-data-rathe
  q: How do you benchmark embedding models on your own data rather than trusting a public leaderboard?
  a: |
    Build a labelled set of a few hundred real queries, each mapped to the passages that answer it. Use logged queries and expert labels where possible, or LLM-generated questions per passage that you then spot-check. Include hard negatives, jargon and multilingual queries if users send them.

    Index the same chunks with each candidate model, and compare recall@k, MRR or nDCG at the k you will actually use, plus latency, embedding dimension (storage cost) and price. Public leaderboards are a shortlist only. Domain vocabulary, query style and document length change rankings a lot.
  level: Mid
  category: rag
  subcategory: vector-search
  related: /ai-system-design/genai-system-design/vector-databases
- id: retrieval-quality-with-your-hosted-embedding-model-is-too-lo
  q: Retrieval quality with your hosted embedding model is too low for your domain. What can you do short of switching providers?
  a: |
    Work through the levers in order of cost:

    1. Check the data pipeline, because bad parsing and chunking are the usual culprits.
    2. Add BM25 hybrid search for exact terms, codes and names.
    3. Add a reranker.
    4. Enrich chunks with context and rewrite queries.

    If the gap is domain vocabulary, train a small adapter: a linear transform applied to query embeddings, learned from query–passage pairs, which works even when the base model is a closed API. With more data, fine-tune an open embedding model with contrastive loss on in-domain pairs and mined hard negatives. Re-embedding the corpus is then required. Measure each step on the same retrieval eval set.
  level: Senior
  category: rag
  subcategory: vector-search
  related: /ai-system-design/genai-system-design/vector-databases
- id: how-does-metadata-filtering-work-in-a-vector-database-and-wh
  q: How does metadata filtering work in a vector database, and why can it break recall?
  a: |
    Filters such as tenant, permissions, date or document type can be applied after the vector search (post-filtering) or during it (pre-filtering or filtered search).

    - **Post-filtering** is simple, but if the filter is selective, most of the top-k results get thrown away, and you return too few or none.
    - **Naive pre-filtering on HNSW** breaks graph connectivity, so search walks into dead ends and recall drops.

    Production systems handle this in several ways: indexes that support filtered traversal, a fall back to brute-force search when the filtered set is small, a separate partition or index per tenant, and an over-fetched k when post-filtering. Test recall under your most selective realistic filters, not just unfiltered queries.
  level: Senior
  category: rag
  subcategory: vector-search
  related: /ai-system-design/genai-system-design/vector-databases
- id: when-is-postgres-with-pgvector-enough-and-when-do-you-need-a
  q: When is Postgres with pgvector enough, and when do you need a dedicated vector database?
  a: |
    pgvector is a strong default up to a few million vectors. It keeps embeddings next to your relational data, so permissions, joins and transactions come for free, and it adds no new system to operate.

    A dedicated vector database earns its place when the following matter more than one fewer system:

    - hundreds of millions of vectors or high QPS that needs horizontal sharding
    - heavy filtered search
    - built-in hybrid search, quantization and tiered storage
    - very fast index rebuilds

    Decide with a load test on your own data at the scale you expect in a year.
  level: Mid
  category: rag
  subcategory: vector-search
  related: /ai-system-design/genai-system-design/vector-databases
- id: why-do-short-queries-and-long-documents-embed-differently-an
  q: Why do short queries and long documents embed differently, and how do embedding models deal with that?
  a: |
    A five-word question and a 400-token passage live in different parts of the embedding space even when the passage answers the question. One is a request for information and the other is a statement of it. Long passages also average many topics into one vector, which blurs them.

    Retrieval-tuned models handle the asymmetry with separate query and document prefixes or encoders, trained on query–passage pairs. Use the prefixes the model expects. Mismatched or missing prefixes are a common silent bug. For long documents, chunk to a size the model represents well rather than embedding whole files.
  level: Mid
  category: rag
  subcategory: vector-search
  related: /ai-system-design/genai-system-design/vector-databases
- id: a-question-needs-facts-from-three-different-documents-how-do
  q: A question needs facts from three different documents. How does your RAG system answer it?
  a: |
    Single-shot retrieval usually finds only the document closest to the whole question. Decompose instead: have the model break the question into sub-questions, retrieve for each, and answer each before combining them. For chained questions, where the second lookup depends on the first answer, run retrieval iteratively in an agent loop.

    Alternatives are retrieving more candidates with a reranker, and graph-style retrieval when entities link documents. Cap the number of hops and track which sub-question each passage supports, so the final answer can cite all three sources.
  level: Mid
  category: rag
  subcategory: advanced-rag
  related: /ai-system-design/genai-system-design/advanced-rag
- id: when-and-how-would-you-fine-tune-a-reranker
  q: When and how would you fine-tune a reranker?
  a: |
    Fine-tune when an off-the-shelf reranker misorders domain results and you have relevance data. That data can come from clicks, citations users kept, expert labels, or LLM-judged pairs you have spot-checked.

    Train a cross-encoder on query–passage pairs with positive labels and hard negatives mined from your own retriever's top results, because those are the confusions it must learn. Evaluate nDCG@10 on a held-out set of queries, not passages, so it generalizes to new questions. Watch for position and click bias in logged data, and keep the base model as a fallback.
  level: Senior
  category: rag
  subcategory: advanced-rag
  related: /ai-system-design/genai-system-design/advanced-rag
- id: users-type-two-word-queries-such-as-vpn-broken-how-do-you-im
  q: Users type two-word queries such as "vpn broken". How do you improve retrieval for short, vague queries?
  a: |
    Rewrite the query before retrieval. Use an LLM to expand it into a fuller question using conversation history and user context (role, product, OS). Generate a few alternative phrasings, retrieve for each, and fuse the results. Hybrid search helps because short queries often contain exact terms.

    If the query is genuinely ambiguous, ask one clarifying question or show results grouped by interpretation. Log rewritten queries next to the originals so you can evaluate whether rewriting helps. It can also drift from what the user meant.
  level: Mid
  category: rag
  subcategory: advanced-rag
  related: /ai-system-design/genai-system-design/advanced-rag
- id: compare-recall-k-precision-k-mrr-and-ndcg-when-does-each-mis
  q: Compare recall@k, precision@k, MRR and nDCG. When does each mislead you?
  a: |
    - **Recall@k:** the share of relevant passages found in the top k. This is the main RAG metric, because the generator can only use what was retrieved. It misleads when only one passage is needed, or when k is larger than the context you actually send.
    - **Precision@k:** how much of the top k is relevant. This matters when context is tight or irrelevant text distracts the model.
    - **MRR:** how high the first relevant result ranks. Good for single-answer lookups, blind to the rest of the list.
    - **nDCG:** rewards putting the most relevant results first, with graded relevance. Good for reranking, but it needs graded labels.

    All of them need labelled relevance, and all ignore whether the final answer was right. Pair them with answer-level faithfulness and correctness checks.
  level: Mid
  category: rag
  subcategory: rag-evaluation
  related: /ai-system-design/genai-system-design/rag-fundamentals
