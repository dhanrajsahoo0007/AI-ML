- id: what-is-hyde-hypothetical-document-embeddings-and-when-does
  q: >-
    What is HyDE (hypothetical document embeddings) and when does it outperform standard dense
    retrieval?
  a: >
    HyDE asks an LLM to write a hypothetical answer to the query, embeds that answer and searches
    with it. A full fake answer often looks more like the real relevant documents than a short
    question does, so it lands closer in embedding space.


    It helps most for short, vague or abstract queries, zero-shot domains without a tuned retriever,
    and questions phrased very differently from the documents. It hurts when the generated answer is
    confidently wrong and steers retrieval astray, and it adds an LLM call of latency, so test it on
    your own queries.
