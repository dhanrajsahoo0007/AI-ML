- id: the-agent-answers-from-a-customer-s-knowledge-base-which-con
  q: >-
    The agent answers from a customer's knowledge base, which contains outdated and contradictory
    articles. How do you prevent confidently wrong answers?
  a: >
    Clean and govern the source: deduplicate, mark articles with owners and effective dates, retire
    outdated ones, and flag conflicts for the customer to resolve. At retrieval time, prefer the
    most recent and authoritative articles using metadata, and filter by product, region and plan.


    At generation time, instruct the agent to cite its source, notice contradictions and say so
    rather than pick one silently, and escalate or ask a clarifying question when sources disagree
    on something consequential. Monitor answers that customers or agents flag as wrong and feed them
    back to content owners.
  topic: rag
  level: Senior
  companies:
    - Sierra
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: a-lawyer-asks-about-a-200-page-credit-agreement-where-the-op
  q: >-
    A lawyer asks about a 200-page credit agreement where the operative clause on page 140 depends
    on a defined term on page 8. How do you build retrieval that gets this right?
  a: >
    Parse the agreement structurally: sections, clause numbers, cross-references and the definitions
    article. Build an index of defined terms, and when a retrieved clause uses a capitalized defined
    term, automatically pull that term's definition, and any clauses it references, into the context
    alongside it.


    Retrieval becomes clause retrieval plus expansion over the document's internal reference graph,
    with the whole relevant chain cited. Given the document is only 200 pages, it can also fit in a
    long context window, so a hybrid works well: retrieve and expand to highlight the key clauses,
    and verify with full-document context for completeness.
  topic: rag
  level: Senior
  companies:
    - Harvey
  related: /ai-system-design/genai-system-design/knowledge-graph-systems
