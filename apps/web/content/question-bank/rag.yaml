- id: you-retrieved-50-candidate-passages-but-the-model-s-useful-c
  q: >-
    You retrieved 50 candidate passages but the model's useful context budget is ~10. How do you
    choose, and how do you know your choices are good?
  a: >
    Re-rank the 50 with a cross-encoder or LLM re-ranker, then select for coverage, not just score:
    drop near-duplicates, prefer passages from different sources or sub-topics the question needs,
    compress long passages to their relevant sentences, and order the strongest evidence first.


    Know the choices are good by measuring: on a labeled set, check that the supporting passages
    survive selection, measure answer faithfulness and correctness at different budgets, and run
    ablations such as top-10 by score versus diversity-aware selection. Production signals such as
    citation clicks and user feedback confirm it.
  topic: rag
