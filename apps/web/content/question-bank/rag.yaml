- id: users-ask-how-many-open-orders-are-blocked-on-a-supplier-iss
  q: >-
    Users ask “how many open orders are blocked on a supplier issue?” Plain RAG gets this wrong.
    Why, and what's the right architecture?
  a: >
    It is an aggregation over structured, live operational data. Plain RAG retrieves a few text
    chunks and asks the model to count, so it sees only a sample, uses stale indexed copies, and
    cannot join orders with supplier issues reliably.


    The right architecture routes such questions to structured querying: an LLM translates the
    question into a query against a semantic layer or ontology over the operational systems (orders,
    suppliers, issues and their links), the query is validated and run with the user's permissions,
    and the model explains the exact result. RAG remains useful for the unstructured parts, such as
    explaining the supplier issue from documents.
  topic: rag
  level: Senior
  companies:
    - Palantir
