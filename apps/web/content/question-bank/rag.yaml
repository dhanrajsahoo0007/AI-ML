- id: how-do-you-choose-between-a-sparse-retriever-bm25-and-a-dens
  q: >-
    How do you choose between a sparse retriever (BM25) and a dense retriever? When do you need
    both?
  a: >
    BM25 matches exact terms and excels at identifiers, error codes, product names and rare jargon,
    needs no training and is explainable. Dense retrieval matches meaning, handles paraphrases and
    natural-language questions, and works across wording differences, but can miss exact tokens and
    needs a good embedding model for the domain.


    You need both when queries mix the two, which is most enterprise and technical search. Run them
    in parallel and merge with reciprocal rank fusion, then re-rank. Measure each alone and combined
    on your query set to confirm the gain.
