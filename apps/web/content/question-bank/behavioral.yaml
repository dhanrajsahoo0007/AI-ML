# Interview questions for this category. Entries with `source: outcome-school` are adapted from
# Outcome School (Apache 2.0); see NOTICE.md. All answers are written by TokensToScale.
- id: tell-me-about-a-model-you-shipped-that-made-a-measurable-bus
  q: Tell me about a model you shipped that made a measurable business difference, and one that did not.
  level: Mid
  category: behavioral
  subcategory: project-deep-dive
  companies:
    - Consumer-Scale ML
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
    - /behavioral/foundations/quantifying-engineering-impact
  a: |-
    **What it tests.** Whether you measure your own work honestly. The interviewer wants two short stories: one model that moved a business number, and one that did not, with the reason. At mid level the hard part is the second story: you must explain the miss without blaming the data or the product team.

    **How to shape the answer.**

    - **Situation and task.** For each model, give the business problem and your part in one or two sentences.
    - **Action.** Say how you measured the effect: the experiment, the business metric and how long it ran.
    - **Result.** Give both results as numbers, including the one that was flat.
    - **Learning.** Say what the miss changed in how you start a project.

    **A strong answer sounds like this.** "The one that worked was a ranking model for our search page. I owned training and the A/B test. Over three weeks, orders from search rose 2.1 percent, and we kept it. The one that did not was a churn model. It reached 0.86 AUC offline, and I was pleased with it. Then the retention team told me they could only make 500 calls a month and already knew who those customers were. Nobody used the scores. Now I ask who will act on a prediction, and how often, before I train anything."

    **Watch out for.** Giving only the success, reporting an offline metric as business impact, and a failure story where the cause was someone else's fault.
  followUps:
    - q: How did you know the lift came from your model and not from something else that changed?
      level: Mid
      a: |-
        Describe the control. Say the test was randomised, both groups ran in the same weeks, and what else shipped in that period. If you could not rule something out, say so and give the range you trust. A careful "between 1 and 3 percent" beats a confident single number.
    - q: When did you first suspect the second model would not be used?
      level: Mid
      a: |-
        Be honest about the signal you missed, for example that nobody from the retention team came to your reviews. Then say what you check now in the first week of a project. The interviewer is testing whether the lesson became a habit.
    - q: Would you build the second model again, in a different way?
      level: Mid
      a: |-
        Give a clear yes or no. If yes, say what you would change: a different target, a smaller list or a different user for the scores. If no, say what the team should have done with those weeks.
  source: outcome-school
- id: tell-me-about-an-ml-project-you-are-most-proud-of
  q: Tell me about an ML project you are most proud of.
  level: Junior
  category: behavioral
  subcategory: project-deep-dive
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/competencies/project-deep-dive-walkthrough
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you can explain your own work clearly and say why you made each choice. For a junior candidate the project can be small: a course project, an internship task or a thesis. The interviewer will ask about details, so the hard part is knowing every step you describe.

    **How to shape the answer.**

    - **Situation and task.** Say what the problem was, who needed it solved and what your part was.
    - **Action.** Give two or three choices you made, with the reason for each: the baseline, the data, the model.
    - **Result.** Give the metric before and after, and how you tested it.
    - **Learning.** Say one thing you would do differently.

    **A strong answer sounds like this.** "In my internship I built a classifier that sends support tickets to the right team. Agents sorted about 900 tickets a day by hand. I started with a keyword baseline, which got 71 percent right. Then I trained a small text model on 12,000 labelled tickets and reached 84 percent on a held-out month. I checked the errors by team and found that billing and refunds were often confused, so we merged them into one queue. It ran for my last three weeks. Next time I would label a test set first: I built mine late."

    **Watch out for.** A project where you cannot say which parts were yours, a list of tools with no problem behind it, and a result with no baseline to compare with.
  followUps:
    - q: Why did you choose that model over a simpler one?
      level: Junior
      a: |-
        Start with the baseline and what it scored. Then say what the next model added and what it cost in training time or complexity. If the simple model was nearly as good, say so. Interviewers like a candidate who tried the simple thing first.
    - q: How did you make sure your test set was fair?
      level: Junior
      a: |-
        Explain how you split the data: by time, by user or at random, and why. Mention one leak you checked for, such as the same ticket appearing in both sets. If you did not check, say what you would do now.
    - q: What part of the project was hardest for you?
      level: Junior
      a: |-
        Name one real difficulty and how you got past it, including who you asked for help. Asking after a reasonable try is a good sign at junior level. Keep it to one problem with a clear end.
- id: describe-a-model-that-failed-in-production-what-happened
  q: Describe a model that failed in production. What happened?
  level: Mid
  category: behavioral
  subcategory: incidents-failures
  signals:
    - failure
  topics:
    - /behavioral/competencies/production-incidents-and-mistakes
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Ownership after a failure. The interviewer listens for how the problem was found, how fast you limited the harm, and what you changed so that the same kind of failure is caught earlier. At mid level a fix to one model is expected. The stronger answer also changes the process.

    **How to shape the answer.**

    - **Situation and task.** Say what the model did, how it failed and how you found out.
    - **Action.** Say what you did first to limit the harm, then how you found the root cause.
    - **Result.** Give the cost of the failure and the time to recover, as numbers.
    - **Learning.** Name the check or monitor you added and what it has caught since.

    **A strong answer sounds like this.** "I owned a demand forecast for 300 stores. One Monday the orders it suggested were about 30 percent too low. A store manager reported it. Our monitoring did not. I switched the stores to last year's numbers within two hours, then traced the cause. An upstream job had changed a price column from cents to dollars, so one feature was 100 times too small. About 40 stores ran short for two days. I added range checks on every input feature and an alert on the size of the output. Those checks have stopped two bad loads since."

    **Watch out for.** Blaming the upstream team, a failure with no cost attached, and stopping the story at the fix without the monitoring that would catch it next time.
  followUps:
    - q: Why did your monitoring miss it?
      level: Mid
      a: |-
        Answer plainly: say what you monitored and what you did not. For example, you tracked job success and latency, with nothing on the inputs or outputs of the model. Then say what you watch now. Do not defend the old setup.
    - q: How did you tell the people who were affected?
      level: Mid
      a: |-
        Say who you told, when and in what words. A good update gives the impact, what you had done so far and when the next update would come. Telling people before you knew the root cause is a strength.
    - q: How would you catch this kind of problem before launch?
      level: Mid
      a: |-
        Describe checks that run before a model serves traffic: compare feature distributions in training and serving, replay a recent day of data, and release to a small share of traffic first. Tie each check to the failure you described.
- id: how-do-you-prioritize-when-you-have-more-ideas-than-time
  q: How do you prioritize when you have more ideas than time?
  level: Mid
  category: behavioral
  subcategory: deadlines-tradeoffs
  signals:
    - prioritisation
    - delivery
  topics:
    - /behavioral/competencies/tight-deadlines-and-tech-debt
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you have a method for choosing work, and whether you can say no. The interviewer wants a simple rule and one real example of it in use. It gets harder from mid level up, where other people bring the ideas and you must explain your choice to them.

    **How to shape the answer.**

    - **Your method first.** Say how you compare ideas: the expected effect, how sure you are, and the cost in days.
    - **Cheap tests.** Say how you reduce doubt before a big build, for example with a two-day offline check.
    - **An example.** Give one list you cut down, with numbers.
    - **Review.** Say when you look at the list again and what would change it.

    **A strong answer sounds like this.** "I score each idea on three things: the effect on our goal, how sure I am, and the days it needs. Last quarter I had nine ideas for our recommendation model and time for three. I spent two days on quick offline checks for the four I was least sure about. Two showed no gain and I dropped them. I picked a freshness feature, a fix for new users and a cheaper retraining job. Two of the three shipped, and click-through rose 1.4 percent. I sent the dropped ideas to my manager with one line each on why."

    **Watch out for.** A method with no example, choosing the most interesting idea over the most useful one, and dropping ideas silently so that the people who proposed them never hear why.
  followUps:
    - q: Tell me about an idea you dropped that you still think was good.
      level: Mid
      a: |-
        Pick a real one. Say what it might have gained, why it lost to the others, and what would make you pick it up again. This shows that you can let go of work you like when the numbers say so.
    - q: What do you do when your manager's priority differs from yours?
      level: Mid
      a: |-
        Say that you show your reasoning and ask for theirs, since they may know something you do not. If they still disagree, you follow their order and say what you will watch. Give a short example if you have one.
    - q: How do you estimate impact before you have any data?
      level: Mid
      a: |-
        Describe a rough estimate: how many users the change touches, times a realistic size of effect taken from past launches. Say that it is a guess, and that you test the biggest assumption first with the cheapest check you can find.
- id: tell-me-about-a-time-you-had-to-deliver-under-a-tight-deadli
  q: Tell me about a time you had to deliver under a tight deadline.
  level: Junior
  category: behavioral
  subcategory: deadlines-tradeoffs
  signals:
    - prioritisation
    - delivery
  topics:
    - /behavioral/competencies/tight-deadlines-and-tech-debt
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/how-behavioral-interviews-work
  a: |-
    **What it tests.** How you behave when time is short. The interviewer wants to hear that you found out what mattered most, asked for help early and told people where things stood. For a junior candidate the task is small. What counts is that you did not go quiet or cut testing in secret.

    **How to shape the answer.**

    - **Situation and task.** Say what was due, when, and why the date could not move.
    - **Action.** Say what you asked to learn the must-haves, what you left out and who agreed to that.
    - **Result.** Say what shipped on the day and what came later.
    - **Learning.** Say what you would do earlier next time.

    **A strong answer sounds like this.** "In my first job as a data engineer I had four days to build a data feed for a partner whose contract started on Monday. My plan had six tables and needed about eight days. On day two I asked my lead which tables the partner would read in the first week. The answer was two. I built those two with row-count checks and listed the other four as a follow-up with a date. I sent a short update each afternoon. The feed went live on Sunday evening, and the other tables followed nine days later. Next time I would ask on day one."

    **Watch out for.** A story about working all night with no choices in it, cutting tests without telling anyone, and leaving out what happened to the work you postponed.
  followUps:
    - q: What did you cut, and who agreed to it?
      level: Junior
      a: |-
        Name the items and the person who approved the cut. If you decided alone, say why that was within your task. The interviewer checks that nobody was surprised on the due date.
    - q: What would you have done if you saw on day three that you would miss the date?
      level: Junior
      a: |-
        Say you would tell your lead that same day, with what is done, what is left and two options: a smaller delivery on time or the full one later. Raising it early is the answer they want.
    - q: Did the rushed work cause any problems later?
      level: Junior
      a: |-
        Be honest. If something broke or needed rework, say what and how long the repair took. If nothing did, say which check protected you. Then give the one thing you would do differently.
- id: how-do-you-stay-current-in-a-fast-moving-field-like-ai
  q: How do you stay current in a fast-moving field like AI?
  level: Junior
  category: behavioral
  subcategory: openers-motivation
  signals:
    - growth
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you learn on purpose and can separate what is useful from what is only new. The interviewer wants real habits and one recent thing you learned and used. A list of famous sources with no example is weak at any level.

    **How to shape the answer.**

    - **Your habits.** Give two or three, with how often: what you read and what you build.
    - **Your filter.** Say how you decide what is worth your time.
    - **A recent example.** Name one thing you learned in the last few months and what you did with it.
    - **Sharing.** Say how you pass it on to your team, if you do.

    **A strong answer sounds like this.** "I keep it small. I read two papers a month in full, chosen because they relate to my work, and I skim one weekly newsletter. Each month I try to reproduce one result on my own data, because reading alone does not stay with me. In March I read about a reranking step for search and tried it on our help-centre search over a weekend. The share of queries with a correct answer in the top five went from 62 to 68 percent. I showed it at our team meeting and we added it in the next sprint."

    **Watch out for.** Claiming to read everything, naming sources with nothing you applied, and an example that is more than a year old.
  followUps:
    - q: Tell me about something new you tried that did not work.
      level: Junior
      a: |-
        Give a real case, what you expected and what you saw. Say how much time you spent before you stopped. A short failed test shows that you check claims for yourself, which is the point of the question.
    - q: How do you decide that a new method is worth using at work?
      level: Junior
      a: |-
        Say you compare it with the current approach on your own data, count the cost to run and maintain it, and want a clear gain before you propose it. Give the size of gain you would ask for.
    - q: What is one thing you changed your mind about recently?
      level: Junior
      a: |-
        Name a belief, the evidence that changed it and what you do differently now. Keep it technical and specific. The interviewer is looking for someone who updates when the facts change.
- id: why-do-you-want-to-work-on-ai-or-ml-here
  q: Why do you want to work on AI or ML here?
  level: Junior
  category: behavioral
  subcategory: openers-motivation
  signals:
    - motivation
  topics:
    - /behavioral/foundations/why-this-company-and-why-leaving
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Motivation, and whether you did your reading. The interviewer wants a reason that connects your past work to this team's problems, with something you could only say about this company. For a junior candidate, honest interest with one specific detail is enough.

    **How to shape the answer.**

    - **Your reason first.** Say in one sentence what draws you to this work.
    - **Evidence from your past.** Give one project that shows the interest is real.
    - **Why here.** Name one thing about this team's product or published work, and why it matters to you.
    - **What you bring and want to learn.** One sentence each.

    **A strong answer sounds like this.** "I like ML work where I can see the user. In my final-year project I built a model that flags unclear photos before a patient uploads them to a clinic app. In a trial with 200 users, rejected uploads fell from 18 percent to 11 percent. Your team builds models that run on the phone, and I read your post about shrinking a vision model to 20 megabytes. I had the same problem at a smaller size and solved only half of it. I bring care with evaluation, and I want to learn how you ship models to millions of devices."

    **Watch out for.** An answer that would fit any company, praise for the brand with no detail, and talking only about what you will gain.
  followUps:
    - q: What do you know about how we use ML in our product?
      level: Junior
      a: |-
        Give two or three facts from public sources, such as a product feature, an engineering post or a talk, and one question each raised for you. If you know little, say what you read and ask. Do not guess.
    - q: Which of our problems would you most like to work on, and why?
      level: Junior
      a: |-
        Pick one and link it to something you have done. Say what you think is hard about it. It is fine to add that you would be glad to start elsewhere and learn the system first.
    - q: What would make you leave an ML job?
      level: Junior
      a: |-
        Answer honestly and without attacking anyone: for example, work with no way to measure results, or no chance to learn from senior people. It tells the interviewer what you need in order to do well.
- id: describe-a-project-where-requirements-were-ambiguous
  q: Describe a project where requirements were ambiguous.
  level: Mid
  category: behavioral
  subcategory: ambiguity-scoping
  signals:
    - ambiguity
  topics:
    - /behavioral/competencies/ambiguity-and-shifting-priorities
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you can turn an unclear request into a goal you can measure. The interviewer listens for the questions you asked, the first small thing you built and how you changed course. At mid level you are expected to do this for your own project without waiting for a full specification.

    **How to shape the answer.**

    - **Situation and task.** Give the request as you received it and say what was unclear.
    - **Action.** Say who you asked, the success measure you proposed and the first baseline or prototype.
    - **Result.** Give the outcome as a number, and what stayed unsolved.
    - **Learning.** Say what you now do in the first week of a vague project.

    **A strong answer sounds like this.** "My manager asked me to 'make the recommendations feel less repetitive'. Nobody had a number for that. I talked to the product manager and two support agents, then proposed a measure: the share of sessions where a user saw the same item three times or more. It was 34 percent. In four days I built a simple rule that hid items already shown twice. Repeats fell to 12 percent and clicks dropped 1 percent, which the product manager accepted. A proper diversity model took six more weeks and reached 9 percent. The simple rule had given most of the gain."

    **Watch out for.** Waiting for someone to write the requirements, building for weeks before anyone agrees on the measure, and a story where the ambiguity was only one missing detail.
  followUps:
    - q: How did you get people to agree on the success measure?
      level: Mid
      a: |-
        Say you wrote the proposal down in a few lines, showed the current value and asked each person what it missed. Name one change you made because of their answer. Agreement in writing lasts longer than agreement in a meeting.
    - q: What did you decide not to do?
      level: Mid
      a: |-
        Name one or two things you left out and why. For example, you did not change the ranking model itself in the first month. Clear limits show that you scoped the work as well as started it.
    - q: What if the stakeholders had disagreed about the goal?
      level: Mid
      a: |-
        Say you would show each side what their goal means in the data, then ask the person who owns the product to choose. You do not pick a winner alone, and you do not build two versions.
- id: tell-me-about-a-time-you-made-a-mistake-in-an-analysis
  q: Tell me about a time you made a mistake in an analysis.
  level: Mid
  category: behavioral
  subcategory: incidents-failures
  signals:
    - failure
  topics:
    - /behavioral/competencies/production-incidents-and-mistakes
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Honesty and care. The interviewer wants to know that you tell people fast when your numbers were wrong, and that you fix the cause. At mid level, other people make decisions on your analysis, so the cost of the mistake and how you corrected the record both matter.

    **How to shape the answer.**

    - **Situation and task.** Say what the analysis was for and who used it.
    - **Action.** Say how the mistake was found, how you checked its size and who you told.
    - **Result.** Give the wrong number, the right number and what the mistake cost.
    - **Learning.** Name the check you now run every time.

    **A strong answer sounds like this.** "I analysed an experiment on a new onboarding flow and reported a 12 percent lift in sign-ups. The team started planning a full launch. Two days later I was building a follow-up chart and the totals did not match. My join to the devices table counted users with two devices twice, and the new flow had more of them. The true lift was 3 percent. I told the product manager within the hour and sent a correction, with the cause, to everyone who got the first report. The launch went ahead at a smaller size. Now I check row counts before and after every join."

    **Watch out for.** A mistake that someone else made, a correction sent quietly to one person, and a lesson that is only "I am more careful now".
  followUps:
    - q: Who found the mistake?
      level: Mid
      a: |-
        Say the truth. If you found it, say what made you look. If a colleague did, say so, and say what you changed so that you would catch it yourself next time. Do not make the story neater than it was.
    - q: How did people react when you sent the correction?
      level: Mid
      a: |-
        Describe the reaction plainly, including any frustration. Say what you gave them to keep their trust: the cause, the size of the error and the new check. A fast and complete correction usually raises trust, and you can say whether you saw that.
    - q: How do you check an analysis before you share it now?
      level: Mid
      a: |-
        List two or three fixed steps: row counts around joins, a comparison with a known total, and a second person reading the query for anything that drives a decision. Say how long these steps take.
- id: describe-a-time-you-used-an-llm-or-ai-tool-to-solve-a-real-p
  q: Describe a time you used an LLM or AI tool to solve a real problem.
  level: Mid
  category: behavioral
  subcategory: ai-tools-at-work
  signals:
    - judgment
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Judgment about where an AI tool fits, and how you checked its output. The interviewer listens for a real problem, a test set and the limits you found. Enthusiasm without measurement is the common weak answer at every level.

    **How to shape the answer.**

    - **Situation and task.** Give the problem and why a language model was a reasonable fit.
    - **Action.** Say what you built: the prompt, any retrieval or tools, and how you tested quality.
    - **Result.** Give the quality number, the time or cost saved, and where a person still checks.
    - **Learning.** Name one limit you found.

    **A strong answer sounds like this.** "Our operations team typed supplier invoices into a system by hand, about 1,400 a month. I tested a language model that reads the invoice text and returns eight fields. First I built a test set of 300 invoices with the correct values. My first prompt got 88 percent of fields right. Three examples and a rule to return 'unknown' when unsure brought it to 96 percent. Anything marked unknown, or with a total over 10,000 dollars, goes to a person. Manual entry fell by about 70 percent. It still fails on handwritten scans, so those skip the model."

    **Watch out for.** No test set, no word on wrong outputs or private data, and a story where the tool did the thinking and you cannot explain the result.
  followUps:
    - q: How did you know the output was good enough to use?
      level: Mid
      a: |-
        Describe the test set, the pass mark and who agreed to it. Say what an error costs in this task, since that cost sets the mark. If a person reviews some outputs, say which ones and why.
    - q: What did you do about wrong or made-up outputs?
      level: Mid
      a: |-
        Name the controls: letting the model answer "unknown", checking outputs against rules such as totals that must add up, and sending risky cases to a person. Give the error rate that remained after these controls.
    - q: Did you consider a simpler approach without an LLM?
      level: Mid
      a: |-
        Say what you compared, for example fixed templates or regular expressions, and why it fell short on your data. If the simpler method would have worked for part of the task, say that you used it there.
- id: what-is-your-biggest-weakness-as-an-ml-practitioner
  q: What is your biggest weakness as an ML practitioner?
  level: Junior
  category: behavioral
  subcategory: openers-motivation
  signals:
    - growth
  topics:
    - /behavioral/foundations/strengths-and-weaknesses
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Self-awareness. The interviewer wants a real weakness that affects your work, with proof that you are improving. For a junior candidate, a weakness common to people early in their career is fine, as long as it is yours and comes with an example.

    **How to shape the answer.**

    - **Name it plainly.** One sentence, with no strength hidden inside it.
    - **Give an example.** A time it cost you something, and how much.
    - **Say what you do about it.** A habit you already follow.
    - **Show progress.** One recent case where the habit worked.

    **A strong answer sounds like this.** "I tend to start tuning a model before I have checked that the problem is set up well. In my thesis I spent two weeks improving a classifier from 81 to 83 percent. Then my supervisor asked for a simple baseline, and logistic regression scored 80. My two weeks had bought very little. Now I write down a baseline and a target before I train anything, and I ask what a gain is worth. In my internship this year the baseline was good enough for the first release, so I spent the saved time on cleaning labels."

    **Watch out for.** A strength dressed as a weakness, a weakness that would stop you doing the job, and no example of the fix working.
  followUps:
    - q: How would a teammate or supervisor describe this weakness?
      level: Junior
      a: |-
        Give their words if you have had the feedback, for example "you go deep before you check the direction". It shows you have heard it from others. If nobody has said it, say how you noticed it yourself.
    - q: When did it last show up?
      level: Junior
      a: |-
        Give a recent, small case and how fast you caught it. Saying that it never happens now is hard to believe. The interviewer wants to see that you notice it sooner than you did before.
    - q: What is a second weakness?
      level: Junior
      a: |-
        Have one ready, shorter than the first: the weakness and one habit you use against it. Choose something different in kind, for example speaking up late in meetings, so the two answers do not sound like the same story.
- id: how-do-you-handle-a-project-that-is-not-working
  q: How do you handle a project that is not working?
  level: Mid
  category: behavioral
  subcategory: incidents-failures
  signals:
    - failure
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
    - /behavioral/competencies/production-incidents-and-mistakes
  a: |-
    **What it tests.** Whether you can see that work is failing and act on it early. The interviewer wants checkpoints set in advance, a clear diagnosis and an honest message to the people waiting. At mid level, the hard part is saying "stop" about your own project.

    **How to shape the answer.**

    - **Your approach.** Say that you set checkpoints and a stopping rule at the start.
    - **Diagnosis.** Say how you find out why it is stuck: the data, the method or the goal.
    - **Communication.** Say who you tell and when.
    - **An example.** Give one project you changed or stopped, and what the team kept from it.

    **A strong answer sounds like this.** "I set a checkpoint before I start, with a number that says whether to go on. Last year I worked on a model to predict late deliveries. The target was 80 percent precision by week four. I was at 61. I spent three days on error analysis and found that half the late deliveries came from weather and road closures, which we had no data for. I told my manager that week and gave two options: buy the data or stop. We stopped after five weeks. I wrote up the findings, and two other teams now use the delivery table I had cleaned."

    **Watch out for.** Carrying on in silence and hoping, blaming the data without showing the analysis, and a story where the project recovered so easily that it was never in trouble.
  followUps:
    - q: How did you decide between changing the approach and stopping?
      level: Mid
      a: |-
        Say what evidence you used. A change makes sense when you can name a cause that you are able to fix. Stopping makes sense when the cause is outside your reach, or the fix costs more than the result is worth.
    - q: How did your manager or stakeholders react?
      level: Mid
      a: |-
        Describe it honestly. Say what you gave them: the numbers, the cause and options with costs. People accept bad news better when it comes early and with a choice. Mention anything you would say differently now.
    - q: What would you have needed to see to continue?
      level: Mid
      a: |-
        Give a number or an event, for example precision above 75 percent on the cases you had data for. It shows that the stopping rule was real and that you were not simply tired of the project.
- id: tell-me-about-a-time-you-improved-a-metric-significantly
  q: Tell me about a time you improved a metric significantly.
  level: Mid
  category: behavioral
  subcategory: project-deep-dive
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/foundations/quantifying-engineering-impact
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
    - /behavioral/foundations/how-behavioral-interviews-work
  a: |-
    **What it tests.** Whether you can connect your actions to a number and prove the link. The interviewer wants the baseline, the idea, the test and the trade-off. At mid level they expect that you found the cause yourself and know what the gain was worth to the business.

    **How to shape the answer.**

    - **Situation and task.** Name the metric, its starting value and why it mattered.
    - **Action.** Give your idea of the cause and the two or three things you did.
    - **Result.** Give the new value, how you tested it and what it meant for users or cost.
    - **Learning.** Say what got worse, if anything, and how you handled it.

    **A strong answer sounds like this.** "Our spam filter for seller messages had 88 percent precision, so about one flagged message in eight came from a real customer. Support handled 400 complaints a month about it. I read 200 of the false positives and saw that most were short messages with a phone number. I added features for conversation history and retrained with those examples labelled correctly. In a two-week test on 10 percent of traffic, precision rose to 93 percent and recall stayed at 90. Complaints fell to about 250 a month. Scoring got 15 milliseconds slower, which was inside our limit."

    **Watch out for.** A percentage with no baseline, a gain measured only offline, and silence about what the change cost.
  followUps:
    - q: How do you know the change was real and not noise?
      level: Mid
      a: |-
        Give the size of the test, how long it ran and the confidence interval or a repeat run. If the result was close to the edge, say so. Admitting a limit makes the rest of your numbers easier to believe.
    - q: What trade-off did you accept?
      level: Mid
      a: |-
        Name what got worse or more expensive: latency, compute cost or another metric. Say who agreed that it was acceptable. An improvement with no cost at all makes interviewers suspect that nobody looked.
    - q: Did the improvement last?
      level: Mid
      a: |-
        Say what the metric was a few months later and how you tracked it. If it fell back, explain why and what you did. Results over the long term are rare in answers, so they stand out.
- id: tell-me-about-a-technical-decision-you-would-make-differentl
  q: Tell me about a technical decision you would make differently today.
  level: Senior
  category: behavioral
  subcategory: incidents-failures
  signals:
    - failure
  topics:
    - /behavioral/competencies/project-deep-dive-walkthrough
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
    - /behavioral/leveling-and-tracks/red-flags-and-recovery
  a: |-
    **What it tests.** Reflection without excuses. The interviewer wants a decision that mattered, the reasoning you had then and what you know now. At senior level the decision should have affected other people, and you should be able to separate a bad decision from a good one that had bad luck.

    **How to shape the answer.**

    - **Situation and task.** Give the decision, when you made it and what you knew.
    - **Action.** Explain your reasoning then, including the option you rejected.
    - **Result.** Say what it cost over time, in numbers.
    - **Learning.** Say what you would choose today and the rule you took from it.

    **A strong answer sounds like this.** "Three years ago I chose to build our own feature store. We had four ML engineers, and I wanted full control over how features were computed. I looked at two open-source options for one day and judged them immature. Our store worked, and it also took about 30 percent of one engineer's time to maintain. When the team grew to eleven, new joiners needed two weeks to learn it. Last year we moved to an open-source store, which took four months. Today I would adopt the open-source option and accept its limits. I now price three years of maintenance before I build anything."

    **Watch out for.** A trivial decision, a story where you were right and other people caused the problem, and hindsight with no rule that you apply now.
  followUps:
    - q: With the information you had then, was it a bad decision?
      level: Senior
      a: |-
        Take a position. Say what you could have known with a little more effort, such as a week of testing the alternative, and what nobody could have known. Interviewers respect a candidate who separates the process from the outcome.
    - q: What did you do once you saw it was the wrong call?
      level: Senior
      a: |-
        Describe how you raised it, the cost you gave for changing course and how you ran the change. Reversing your own decision in public is the senior behaviour the interviewer hopes to hear about.
    - q: How has this changed a later decision?
      level: Senior
      a: |-
        Give one specific later case where you applied the rule and what you chose. Without this, the lesson is only words. A case where the rule led you to buy or reuse something works well.
- id: how-do-you-balance-research-exploration-with-delivery
  q: How do you balance research exploration with delivery?
  level: Senior
  category: behavioral
  subcategory: deadlines-tradeoffs
  signals:
    - prioritisation
    - delivery
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
    - /behavioral/competencies/tight-deadlines-and-tech-debt
  a: |-
    **What it tests.** Whether you can protect time for uncertain work without missing commitments. The interviewer wants a rule for how much to explore, a limit on each exploration and a way to stop. At senior level you set this balance for a team and defend it to people who want only delivery.

    **How to shape the answer.**

    - **Your rule.** Say how you split time and why.
    - **Limits.** Say how you time-box an exploration and what result would justify more time.
    - **Baseline first.** Say how you ship something simple while the research runs.
    - **An example.** Give one exploration that paid off or one you stopped.

    **A strong answer sounds like this.** "On my team of six I keep about 20 percent of our time for exploration. Each exploration gets a written question, a three-week limit and a number that would justify continuing. We ship a baseline first, so delivery never waits for research. Last year we explored a new model for search ranking while the old one kept running. After three weeks it showed a 4 percent offline gain, so we gave it six more weeks and shipped it. In the same quarter I stopped a second project at its limit, because the gain was under 1 percent. Both results went into our monthly review."

    **Watch out for.** Saying you do both with no rule, research with no end date, and treating a stopped exploration as wasted when it answered a question.
  followUps:
    - q: Tell me about an exploration you stopped. Was that hard?
      level: Senior
      a: |-
        Describe the limit, the result and the conversation with the person who ran it. Say what you kept, such as a write-up or a dataset. If the person was unhappy, admit it and say how you handled that.
    - q: How do you justify exploration time to a manager who wants features?
      level: Senior
      a: |-
        Use past results: what earlier explorations returned for the time spent. Offer a fixed budget and a regular report. If the business is in a hard quarter, say that you would reduce the share for a while and name the date to review it.
    - q: How do you decide what is worth exploring?
      level: Senior
      a: |-
        Say you look for a question whose answer would change the roadmap, with a test that fits in a few weeks. Ideas that are only interesting wait. Mention how people on the team propose ideas.
- id: what-questions-should-you-ask-the-interviewer
  q: What questions should you ask the interviewer?
  level: Junior
  category: behavioral
  subcategory: behavioral
  signals:
    - communication
  topics:
    - /behavioral/foundations/questions-to-ask-interviewers
  a: |-
    **What it tests.** Interest and judgment. Your questions show what you care about and how well you listened. For a junior candidate, two or three specific questions about the work, the team and how you would learn are enough. Having none reads as low interest.

    **How to shape the answer.**

    - **Prepare five, ask two or three.** Some will be answered during the interview.
    - **Match the person.** Ask an engineer about daily work, and a manager about goals and growth.
    - **Ask about the work.** How models reach production, how results are measured, and what the first three months look like.
    - **Listen and follow up.** One follow-up question shows that you heard the answer.

    **A strong answer sounds like this.** "I have three questions. First, you said the team retrains the ranking model every week. What happens when a new version scores worse than the old one? Second, what would you expect me to have finished after my first 90 days? Third, when the last junior engineer joined, what helped them most in the first month? I ask the last one because I learn fastest with regular code review, and I would like to know how that works here."

    **Watch out for.** Asking something the company website answers, asking about pay or leave in a technical round, and reading from a list without reacting to the answers.
  followUps:
    - q: What if the interviewer already answered all your prepared questions?
      level: Junior
      a: |-
        Say so, and build on something they told you: "You mentioned the move to a new feature pipeline. What has been the hardest part?" A question that comes from the conversation is stronger than one from a list.
    - q: Which questions should you avoid?
      level: Junior
      a: |-
        Avoid questions with answers on the careers page, questions that sound like doubts about working hard, and pay questions outside the recruiter or offer stage. Also avoid any question where you could not explain your interest if the interviewer asked why.
    - q: How do you change your questions for a hiring manager?
      level: Junior
      a: |-
        Ask a manager about goals and people: what the team must deliver this year, how they give feedback and what separates a good first year from a great one. Keep the detailed tooling questions for the engineers.
- id: how-do-you-prepare-your-project-stories-for-interviews
  q: How do you prepare your project stories for interviews?
  level: Junior
  category: behavioral
  subcategory: behavioral
  signals:
    - communication
  topics:
    - /behavioral/foundations/building-your-story-matrix
    - /behavioral/foundations/star-plus-l-framework
  a: |-
    **What it tests.** This is a preparation question. In an interview, the result shows as stories that are specific, short and well matched to the prompt. For a junior candidate, five to seven stories from study, internships and first jobs can cover almost every common question.

    **How to shape the answer.**

    - **List your stories.** Write five to seven that cover impact, failure, conflict, unclear goals, learning and helping others.
    - **Write each one down.** Situation and task, action, result and learning, with numbers and your own part.
    - **Map stories to questions.** Make a grid of stories against themes so that each theme has two choices.
    - **Practise aloud.** Aim for two minutes each, with detail ready for follow-ups.

    **A strong answer sounds like this.** "I wrote down seven stories: three from my internship, two from my thesis and two from a student club. For each one I wrote four short parts and checked that every result had a number. Then I made a grid of seven stories against eight themes, such as failure and conflict. Two themes had only one story, so I added an eighth. I recorded myself telling each story. My first tries ran over four minutes, so I cut the background until each took about two. I also wrote three likely follow-up questions for each story."

    **Watch out for.** Memorising scripts word for word, using one story for every question in the same loop, and stories told as "we" where your own part is unclear.
  followUps:
    - q: What do you do if you have very little work experience?
      level: Junior
      a: |-
        Use course projects, a thesis, open-source work, part-time jobs and clubs. The interviewer grades the behaviour: what you did, why and what happened. A small story with a clear action and result beats a large one where your role is unclear.
    - q: How do you answer a question that none of your stories fits?
      level: Junior
      a: |-
        Take a few seconds, pick the closest story and say which part of it applies. If nothing fits, say so and explain what you would do in that situation. An honest near match is better than an invented story.
    - q: How long should a story be?
      level: Junior
      a: |-
        About two minutes for the first telling: roughly 20 seconds of background, a minute on what you did and the rest on the result and the learning. Leave detail for the follow-up questions, which the interviewer will ask.
- id: what-do-you-see-as-the-most-pressing-unsolved-problem-in-ai
  q: What do you see as the most pressing unsolved problem in AI alignment?
  level: Senior
  category: behavioral
  subcategory: ai-views
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  companies:
    - Anthropic
  signals:
    - judgment
    - motivation
  topics:
    - /behavioral/company-playbooks/frontier-ai-labs-values
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you have thought about the problem yourself and can reason about it with care. The interviewer listens for a clear position, real reasons, honest doubt and a link to work you have done. At senior level a list of research areas is too little: say which problem you would put first and why.

    **How to shape the answer.**

    - **Your position first.** Name one problem in one sentence.
    - **The reasons.** Give two, and say why other problems depend on this one.
    - **What would change your mind.** Name the evidence that would move you.
    - **One example from your work.** Show where you met a small version of the problem.

    **A strong answer sounds like this.** "I would put scalable oversight first: checking a model's work when people cannot easily verify it themselves. Training and evaluation both depend on someone judging the output, and that gets harder as tasks get longer. I am unsure how much a model's written reasoning tells us about what it did. I would change my view if interpretability tools could reliably confirm that reasoning. I met a small version at work. We used a model to grade 2,000 support answers, and it agreed with human graders 81 percent of the time. On long technical answers it fell to 64 percent, exactly where we needed it most."

    **Watch out for.** Reciting a list of topics with no position, certainty about questions that researchers still disagree on, and a view with no link to anything you have built or measured.
  followUps:
    - q: What is the strongest argument against your view?
      level: Senior
      a: |-
        State the other side as its supporters would, for example that misuse by people is the nearer risk. Say what you find convincing in it and why you still hold your position. Arguing the other side fairly is the signal.
    - q: Which approach to this problem do you find most promising, and what is missing from it?
      level: Senior
      a: |-
        Name one approach, such as interpretability or better evaluations, and say what it can show today. Then name a gap honestly. It is fine to say that you do not know whether the gap can be closed.
    - q: How does this view affect how you build systems today?
      level: Senior
      a: |-
        Give a concrete practice: you keep human review on the outputs that are hardest to check, you measure where automated grading fails, and you report those limits. A view that changes nothing in your work sounds borrowed.
  source: outcome-school
- id: what-are-your-thoughts-on-ai-safety-and-the-risks-of-advance
  q: What are your thoughts on AI safety and the risks of advanced AI systems?
  level: Mid
  category: behavioral
  subcategory: ai-views
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  companies:
    - Anthropic
  signals:
    - judgment
    - motivation
  topics:
    - /behavioral/company-playbooks/frontier-ai-labs-values
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you hold a view of your own and can connect it to engineering. The interviewer listens for specific risks, reasons, honest uncertainty and what you do about it in your work. Slogans in either direction, all fear or all dismissal, are the weak answers.

    **How to shape the answer.**

    - **Your position first.** Say in one or two sentences which risks you take seriously.
    - **The reasons.** Give one near-term risk and one longer-term risk, and why each matters.
    - **What would change your mind.** Say what evidence would make you more or less worried.
    - **One example from your work.** A safeguard you built or a risk you found.

    **A strong answer sounds like this.** "I take two kinds of risk seriously. Today, models can be misused or tricked, and they fail in ways users do not expect. Later, more capable systems may act with less supervision, and we lack good ways to verify what they will do. I am uncertain about timing, and I would worry less if evaluations predicted real behaviour more reliably. I saw the first kind at work. I tested our support assistant with 200 prompt-injection attempts, and 23 made it reveal internal notes. We removed the notes from its context and added an output filter. Three attempts still worked, and we logged them as open issues."

    **Watch out for.** Repeating a company's public statements back to it, claiming certainty about timelines, and a view with no effect on how you build or test.
  followUps:
    - q: Where do you disagree with common views on AI safety?
      level: Mid
      a: |-
        Pick one point and explain it with reasons, for example that a certain risk gets too much or too little attention. Say what would change your mind. Agreeing with everything you have read sounds unconsidered.
    - q: How do you weigh the benefits of shipping against the risks?
      level: Mid
      a: |-
        Describe a method: name the harm, how likely it is, whether it can be reversed, and what a safeguard costs. Give one case where you delayed or limited a release, or chose to ship with monitoring, and why.
    - q: What would you do if you found a safety problem just before a launch?
      level: Mid
      a: |-
        Say you would report it at once with evidence and propose the smallest safe option, such as limiting the feature. The launch decision stays with its owner, who now has full information. You would not hide it, and you would not decide alone.
  source: outcome-school
- id: behavioral-ownership-fix-broken-handoff
  q: Tell me about a time you noticed a gap between two teams or systems where nobody was clearly responsible, and you stepped in to own the outcome.
  level: Senior
  category: behavioral
  subcategory: ownership-accountability
  signals:
    - ownership
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
    - /behavioral/competencies/cross-functional-collaboration
  a: |-
    **What it tests.** Ownership past the edge of your own team. The interviewer wants to see that you acted on a problem nobody was assigned to, and then made sure it had a lasting owner. At senior level, fixing it yourself is half the answer. The other half is the agreement that stops it coming back.

    **How to shape the answer.**

    - **Situation and task.** Describe the gap, the two sides and the harm to users.
    - **Action.** Say what you did first to stop the harm, then how you got both teams to agree on an owner.
    - **Result.** Give the user effect as a number and name the owner now.
    - **Learning.** Say how you now look for gaps of this kind.

    **A strong answer sounds like this.** "I work on our mobile app. About 9 percent of push notifications were failing, delivery reminders among them. The app team said the tokens were sent correctly. The notifications team said their service sent whatever it received. Nobody owned expired tokens. I traced 500 failures and found that the backend never removed a token after a user reinstalled the app. I wrote a cleanup job in a week, and failures fell to 2 percent. Then I took a one-page proposal to both managers. The notifications team now owns the token table, with an alert at 4 percent. It has fired once."

    **Watch out for.** Complaining about the other teams, a fix you still maintain alone a year later, and stepping in without telling the people whose area it touched.
  followUps:
    - q: Why did you act when it was not your job?
      level: Senior
      a: |-
        Give the reason in user terms: who was harmed and how you knew. Add that you told both teams before you changed anything. The interviewer wants initiative together with respect for other people's areas.
    - q: How did you make sure the gap stayed closed?
      level: Senior
      a: |-
        Describe the lasting part: a named owner, an alert with a threshold, a test or a line in the runbook. Say who agreed to it and when you last checked that it still works.
    - q: What did you put aside to do this?
      level: Senior
      a: |-
        Name the work that slipped and who agreed to the delay. Senior engineers make this trade in the open. If your manager did not know, say that you would tell them sooner next time.
- id: behavioral-ambiguity-one-line-goal-to-roadmap
  q: Describe a time you were handed a vague, one-sentence problem with no clear technical spec and turned it into a shipped system.
  level: Senior
  category: behavioral
  subcategory: ambiguity-scoping
  signals:
    - ambiguity
  topics:
    - /behavioral/competencies/ambiguity-and-shifting-priorities
    - /behavioral/foundations/star-plus-l-framework
  a: |-
    **What it tests.** Whether you can take a goal with no specification and bring it to production. The interviewer listens for how you set limits on the problem, tested the riskiest part early and showed working software fast. This prompt separates senior from mid level, because nobody breaks the work down for you.

    **How to shape the answer.**

    - **Situation and task.** Quote the one-line request and say what was missing.
    - **Action.** Describe the short framing document with goals, non-goals and one success measure, the early test of the main risk, and the first thin version.
    - **Result.** Say what shipped, when, and the measure.
    - **Learning.** Say what you now settle in the first two weeks.

    **A strong answer sounds like this.** "Our finance director gave me one sentence: 'I need to trust the revenue numbers.' I interviewed five people and found three dashboards with three totals, up to 4 percent apart. I wrote one page: one revenue definition as the goal, forecasting as a non-goal, and a daily match with billing within 0.1 percent as the measure. I spent three days proving that refunds caused most of the gap. In week three I shipped one table with one dashboard on it. Finance used it for month-end in week nine. Two old dashboards are retired. The third team still keeps theirs."

    **Watch out for.** Asking for a full specification before starting, months of design with nothing running, and a success measure chosen after the result was known.
  followUps:
    - q: What did you list as non-goals, and did anyone object?
      level: Senior
      a: |-
        Name two non-goals and one person who objected. Say how you settled it, for example by putting their item on a later milestone with a date. Non-goals that nobody objected to were probably too easy.
    - q: What was the riskiest assumption, and how did you test it?
      level: Senior
      a: |-
        State the assumption and the cheapest test you could run on real data. Give how long it took and what you found. Then say what you would have done if the test had failed.
    - q: How did you keep stakeholders with you while things were unclear?
      level: Senior
      a: |-
        Describe a rhythm: a short weekly note, and something working to look at every two weeks. People stay patient with open questions when they can see progress. Mention one piece of feedback that changed the plan.
- id: behavioral-deadlines-scope-cut-vs-quality
  q: Tell me about a time you hit a hard external deadline by deliberately cutting scope without compromising production reliability.
  level: Mid
  category: behavioral
  subcategory: deadlines-tradeoffs
  signals:
    - prioritisation
    - delivery
  topics:
    - /behavioral/competencies/tight-deadlines-and-tech-debt
  a: |-
    **What it tests.** Judgment about what can be cut and what cannot. The interviewer wants to hear that you separated the parts that protect users, such as data safety, tests and rollback, from the parts that could wait. At mid level you propose the cut yourself and get agreement before the date.

    **How to shape the answer.**

    - **Situation and task.** Give the deadline, why it was fixed and the gap between the plan and the time.
    - **Action.** Say what you kept, what you cut, how you chose and who agreed.
    - **Result.** Say what shipped, how it behaved in production and when the rest followed.
    - **Learning.** Say how you now plan for fixed dates.

    **A strong answer sounds like this.** "I am a frontend engineer. We had to ship a new checkout before a sale that marketing had already announced, and my estimate ran ten days past the date. I listed every item and marked those that protected payments: validation, error states, the fallback to the old checkout and the test suite. All of those stayed. I proposed cutting saved carts and address autocomplete, and the product manager agreed in writing. We shipped two days early behind a flag, first to 5 percent of users. Checkout errors stayed under 0.3 percent through the sale. Saved carts shipped three weeks later. Autocomplete was dropped."

    **Watch out for.** A story where the cut was tests or monitoring, heroic overtime presented as the plan, and deferred items that never got a date.
  followUps:
    - q: How did you decide what was safe to cut?
      level: Mid
      a: |-
        Give your rule. Anything that protects data, money, security or the ability to roll back stays. Features a user can live without for a few weeks can move. Then give one item that was hard to place and how you decided.
    - q: Did anyone push back on the cuts?
      level: Mid
      a: |-
        Name who and why. Say how you answered, for example with the choice between a smaller release on time and a full one late. If you changed the plan because of their point, say so.
    - q: What happened to the deferred work?
      level: Mid
      a: |-
        Give dates. Say what shipped, what was dropped and why. If something was never done, be direct about it. Interviewers check whether "later" was a real plan or a polite way of saying never.
- id: behavioral-incidents-production-outage-postmortem
  q: Tell me about the worst production incident or bug you personally caused or led the response to. How did you handle it in the moment and afterward?
  level: Senior
  category: behavioral
  subcategory: incidents-failures
  signals:
    - failure
  topics:
    - /behavioral/competencies/production-incidents-and-mistakes
    - /behavioral/foundations/handling-follow-up-probes
  a: |-
    **What it tests.** How you act under pressure and what you do afterwards. The interviewer listens for fast mitigation, clear updates, plain ownership and a fix to the system, with nobody blamed. At senior level they expect a guardrail that protects every engineer, since "be more careful" protects no one.

    **How to shape the answer.**

    - **Situation and task.** Say what broke, your role and the impact in numbers.
    - **Action.** First the mitigation and the updates you sent, then the root-cause work.
    - **Result.** Give the time to recover, the cost and what the review found.
    - **Learning.** Name the guardrail you built and what it has caught.

    **A strong answer sounds like this.** "I caused it. I pushed a rate-limit change to all regions at once, with a limit ten times too low. About 18 percent of API requests were rejected for 40 minutes. I saw the error graph within five minutes and rolled back, but the rollback took 30 minutes because the config cache was slow to refresh. I posted an update every ten minutes. In the review I wrote that I made the change, and that the system let one person push to every region with no canary. I built a staged rollout that stops when errors rise. It has halted four bad changes in a year."

    **Watch out for.** Hunting the root cause while users are still affected, "human error" as the conclusion, and a small incident chosen to look safe.
  followUps:
    - q: What were you doing in the first 15 minutes?
      level: Senior
      a: |-
        Go minute by minute: when you noticed, what you checked, when you chose to roll back and who you told. Interviewers want mitigation before diagnosis, and a calm order of steps.
    - q: How did you communicate during the incident?
      level: Senior
      a: |-
        Say where you posted, how often and what each update held: the impact, the current action and the time of the next update. Mention how support or customers were told. Regular updates, even with no news, are the expected practice.
    - q: What did the review change beyond your own team?
      level: Senior
      a: |-
        Name the wider change, such as a rollout tool or a rule that all teams adopted, and how you got them to adopt it. A senior answer shows that the fix spread past the place where the incident happened.
- id: behavioral-project-deep-dive-most-complex-system
  q: Walk me through the most technically complex project you have led. What were the hardest trade-offs, and what would you redesign if you started over today?
  level: Senior
  category: behavioral
  subcategory: project-deep-dive
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/competencies/project-deep-dive-walkthrough
    - /behavioral/foundations/quantifying-engineering-impact
    - /behavioral/foundations/handling-follow-up-probes
  a: |-
    **What it tests.** Whether you drove the project or only took part in it, and how you reason about design choices. The interviewer will change a constraint and ask what you would do. At senior level they expect rejected options with reasons and a clear view of what aged badly.

    **How to shape the answer.**

    - **Context and constraint.** In about a minute: what the system does and the single hardest constraint.
    - **Design and rejected options.** The main parts, and why you turned down the alternatives.
    - **Your own part.** The hardest problem you solved yourself.
    - **Impact and hindsight.** Numbers before and after, and one choice you would redo.

    **A strong answer sounds like this.** "I led the rebuild of our job scheduler, with five engineers over eight months. It ran 2 million jobs a day, and the hard constraint was that a job must never run twice, because some jobs send payments. We rejected at-least-once delivery with deduplication inside every job, since 300 job types would each need changes. We chose a central lease table. My own part was the lease-expiry logic, where I found a clock-skew bug that could double-run about 1 job in 50,000. Missed jobs fell from 120 a day to under 5. I would redo the single lease database: it is now our scaling limit."

    **Watch out for.** A tour of every component with no decisions, "we" throughout with no part that was yours, and no weakness in your own design.
  followUps:
    - q: What would you change if traffic were ten times higher?
      level: Senior
      a: |-
        Name the first part that would break and why, then the change you would make and what it costs. Use numbers from the real system. The interviewer checks that you know where the limits of your design are.
    - q: Which decision did you personally make that others disagreed with?
      level: Senior
      a: |-
        Give the decision, who disagreed and their reason. Say how it was settled and whether time proved you right. If they were partly right, say so. It shows the choices were really yours.
    - q: What would you build if you had half the team?
      level: Senior
      a: |-
        Say what you would cut or buy, and what risk that adds. A strong answer keeps the hard constraint and gives up breadth, such as supporting fewer job types at first.
- id: story-made-something-measurably-better
  q: Tell me about a time you made something measurably better. What did you do, and how do you know it worked?
  level: Mid
  category: behavioral
  subcategory: behavioral
  signals:
    - delivery
  topics:
    - /behavioral/foundations/star-plus-l-framework
    - /behavioral/foundations/quantifying-engineering-impact
    - /behavioral/foundations/building-your-story-matrix
  a: |-
    **What it tests.** Whether you can connect your own actions to a result with a number. Many answers describe work and stop before the result, or give a result that could have happened without them.

    **How to shape the answer.**

    - **Situation and task, about 20 seconds.** Name the system, the number that was wrong and the limit you worked under.
    - **Action, about 70 seconds.** Give three things you did, in the first person, and say why you chose each one. Include one option you rejected.
    - **Result, about 20 seconds.** Give the number before and after, how you measured it, and one thing that did not get worse.
    - **Learning, about 10 seconds.** Say what you changed afterwards so the gain lasts.

    **A strong answer sounds like this.** "Invoice generation took 9 hours and missed our 6 am deadline most weeks. I had three weeks. I profiled the job and found 80 percent of the time in one query per customer, so I batched it. I looked at adding workers first and rejected it, because the database was the limit. Run time fell to 40 minutes, measured over 30 nightly runs, and the invoice totals matched the old job exactly. I added a run-time alert at 60 minutes so a slow drift is caught."

    **Watch out for.** A result with no starting point ("it got much faster"), a result measured once, and "we" in every action sentence.
  followUps:
    - q: How did you measure that, and how do you know the change caused it?
      level: Mid
      a: |-
        Say where the number came from: a dashboard, a query or a test run, and over what period. Then rule out the easy other causes. For example, traffic was the same in both weeks, or you compared servers with the change against servers without it. If you could not isolate it fully, say so and say what makes you believe it anyway. An honest "mostly" is stronger than a claim you cannot defend.
    - q: What would have happened if you had done nothing?
      level: Senior
      a: |-
        This checks that the problem was worth solving. Give the cost of doing nothing as a trend: the job would have crossed the deadline every night within two months, or the on-call load would have doubled. If the honest answer is "not much", say what you learned about choosing problems.

- id: story-decision-between-two-reasonable-options
  q: Walk me through a decision where you had two reasonable options. Why did you choose the one you did?
  level: Mid
  category: behavioral
  subcategory: behavioral
  signals:
    - judgment
  topics:
    - /behavioral/foundations/star-plus-l-framework
    - /behavioral/foundations/handling-follow-up-probes
    - /behavioral/foundations/building-your-story-matrix
  a: |-
    **What it tests.** Judgment. An interviewer can only see judgment when you show the option you did not take. A story with one obvious path sounds like you followed instructions.

    **How to shape the answer.**

    - **Situation and task.** State the goal and the limit that made the choice hard: time, cost, risk or people.
    - **Action.** Name both options in one line each. Say what you compared them on, what you measured or tested, and who you asked. Then say what you chose and the one reason that decided it.
    - **Result.** Give the outcome with a number, and say whether the cost you accepted showed up.
    - **Learning.** Say when you would choose the other option.

    **A strong answer sounds like this.** "We needed search over 40 million records in six weeks. I could add a search cluster or use the full-text index in the database we already ran. I tested both on a copy of production data. The cluster was faster, 30 ms against 90 ms, but our limit was 200 ms and nobody on the team had run one. I chose the database index. We shipped in four weeks and stayed under 120 ms. I wrote down the point where we would move: more than 200 million records."

    **Watch out for.** Describing the rejected option as foolish, deciding by opinion with no test, and leaving out the cost of your choice.
  followUps:
    - q: What did the other option have going for it?
      level: Mid
      a: |-
        Give its real strengths, as the person who argued for it would. If you cannot, the interviewer will doubt that there was a decision at all. Two honest strengths and the reason they did not outweigh your limit is enough.
    - q: What would make you choose differently today?
      level: Senior
      a: |-
        Name the condition, not a feeling. For example: a team that already runs the other system, ten times the data, or a tighter response-time limit. This shows that you treat the decision as right for its conditions, not right for all time.

- id: story-what-you-learned-from-hardest-project
  q: What did you learn from your hardest project in the last year, and what do you do differently now?
  level: Senior
  category: behavioral
  subcategory: behavioral
  signals:
    - growth
  topics:
    - /behavioral/foundations/star-plus-l-framework
    - /behavioral/foundations/building-your-story-matrix
  a: |-
    **What it tests.** Whether a hard project changed how you work. Senior candidates are expected to leave a team or a system stronger, and to know what they misjudged.

    **How to shape the answer.**

    - **Situation and task.** Say in two sentences what the project was and why it was hard.
    - **Action.** Describe the point where your first plan stopped working, and what you did then. Say what you got wrong at the start.
    - **Result.** Give the outcome, including the part that fell short.
    - **Learning.** Name one change you can point at: a check in the build, a step in a review, a rule for estimates. Then give one time you used it since.

    **A strong answer sounds like this.** "I led a move of our job queue to a new system. I planned it as one cutover. Two weeks before the date, a load test showed that retries behaved differently and would have sent some jobs twice. I had tested throughput but not failure. I split the move into four stages and ran both systems side by side for each. We finished five weeks late with no job sent twice. Now I write the failure tests before the load tests, and I did that on the next migration, where they caught a timeout problem in the first week."

    **Watch out for.** A lesson that is a feeling ("communication matters"), a lesson that blames someone else, and no example of using it since.
  followUps:
    - q: Give me an example of using that lesson since.
      level: Senior
      a: |-
        Have one ready. Name the later project, what you did differently because of the lesson, and what it caught or saved. If you have not had the chance yet, say what you have put in place so that you will, such as a checklist item or a template.
    - q: What would the people you worked with say you still need to learn from it?
      level: Senior
      a: |-
        Give one thing a teammate or your manager actually said, in their words. Say whether you agree and what you have done about it since. An answer with nothing left to learn sounds unaware.
- id: company-meta-jedi-google-gnl-comparison
  q: Tell me about a time you navigated severe ambiguity to ship rapid impact, and how you made sure every voice on the team was heard along the way.
  level: Senior
  category: behavioral
  subcategory: ambiguity-scoping
  signals:
    - ambiguity
    - communication
  topics:
    - /behavioral/competencies/ambiguity-and-shifting-priorities
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Two things at once: whether you can make a plan when nobody has given you one, and whether you move fast without shutting out quieter teammates. At senior level the hard part is showing both in one story.

    **How to shape the answer.**

    - **Situation and task.** Say what was unclear: the goal, the owner or the constraints. Give the deadline and the team size.
    - **Action.** Show how you reduced the unknowns, for example with a short prototype. Then say how you collected views from quieter people, and name one view that changed the plan.
    - **Result.** Say what shipped and when, with one number.
    - **Learning.** Say what you now do in the first week of unclear work.

    **A strong answer sounds like this.** "Our mobile team was told to cut checkout drop-off before the holiday season, with no agreed cause and six weeks to do it. I spent two days on a prototype that logged where users left, and shared a one-page plan with three options. Two engineers rarely spoke in meetings, so I asked everyone to comment on the plan in writing first. A junior engineer wrote that address entry failed on small screens. Her point became our first fix. We shipped in five weeks and drop-off fell from 31 to 26 percent."

    **Watch out for.** Speed with no sign that anyone else shaped the plan, a claim that everyone was heard with no method behind it, and ambiguity that was only a missing ticket.
  followUps:
    - q: Whose input changed the plan the most, and what would have happened without it?
      level: Senior
      a: |-
        Name the person's role and their point, then the cost you avoided, with a number if you have one. The interviewer checks that listening changed the work. If no input changed anything, say so and explain how you tested the plan another way.
    - q: How did you decide you knew enough to start building?
      level: Senior
      a: |-
        Give the rule you used: the two or three unknowns that could sink the plan, and what you did to close each one. Say which unknowns you chose to carry and how you would have noticed if they turned out badly.
    - q: What did you do when two people on the team wanted different things?
      level: Senior
      a: |-
        Describe one real case. State both views fairly, say who made the decision and on what basis, and how the person who lost was told. The interviewer wants a decision made in the open, with the reasons written down.
- id: opener-tell-me-about-yourself
  q: Tell me about yourself.
  level: Mid
  category: behavioral
  subcategory: openers-motivation
  signals:
    - motivation
    - communication
  topics:
    - /behavioral/foundations/tell-me-about-yourself
  a: |-
    **What it tests.** Whether you can give a clear, ordered summary of your work in a minute or two, and what you choose to put first. The interviewer often picks the next question from what you say. At senior level the hard part is cutting ten years down to three points.

    **How to shape the answer.**

    - **Now.** Start with your current role: the team, what you own, and one result with a number.
    - **Before.** Give one or two earlier steps that explain how you got here. Skip the rest.
    - **Next.** Say what you want to do next and why this role fits it.
    - **Stop.** End on a line the interviewer can pick up, then stop talking.

    **A strong answer sounds like this.** "I am a backend engineer with four years of experience. Today I work on the orders service for a food delivery app, in a team of six. I own the retry and refund paths. Last year I rewrote the retry logic, and duplicate charges fell from about 30 a week to 2. Before that I spent two years on internal tools, which is where I learned to talk to users directly. I am now looking for a role with more design work on payment systems, and that is what caught my eye about this team."

    **Watch out for.** Reading your resume from the first job forward, personal history that has nothing to do with the role, and an answer with no number and no clear end.
  followUps:
    - q: Which piece of that work are you most proud of?
      level: Mid
      a: |-
        Pick one item you already mentioned, so the answer connects. Give the problem, your own part and one number in under a minute. The interviewer is choosing what to go deeper on, so pick a story you can discuss in detail for ten minutes.
    - q: What do you do day to day in your current role?
      level: Mid
      a: |-
        Describe a normal week with rough proportions: for example 60 percent coding, 20 percent review and design, 20 percent on-call and support. This tells the interviewer your real level of responsibility. Keep it factual and do not inflate the parts you do rarely.
    - q: Where do you see your career heading from here?
      level: Mid
      a: |-
        Give a direction and one reason, then tie it to this role. For example, you want deeper design work on payment systems because that is where your best results came from. One or two sentences are enough. Avoid naming a title as the goal.
- id: opener-walk-me-through-your-resume
  q: Walk me through your resume, and tell me why this role fits.
  level: Mid
  category: behavioral
  subcategory: openers-motivation
  signals:
    - motivation
    - communication
  topics:
    - /behavioral/foundations/tell-me-about-yourself
    - /behavioral/leveling-and-tracks/career-gaps-layoffs-and-switches
  a: |-
    **What it tests.** Whether your career reads as a set of choices with reasons. The interviewer listens for why you moved each time, how your scope grew, and whether this role is a logical next step. With a longer history, the test is what you leave out.

    **How to shape the answer.**

    - **One line per role.** Go in time order. Give the role, the team and one thing you delivered.
    - **The reason for each move.** Say what you wanted that the next job gave you.
    - **The thread.** Name the one theme that runs through the moves.
    - **The fit.** End with why this role continues that theme.

    **A strong answer sounds like this.** "I started as an analyst at a logistics firm and found I liked building the pipelines more than the reports. So I moved into data engineering at a retailer, where I ran the nightly sales load for three years and cut its run time from five hours to two. I moved to my current company to work with streaming data, and I now own event ingestion for 40 internal teams. The thread is making data arrive on time and correct. Your role adds data quality tooling, which is the part I want to go deeper on."

    **Watch out for.** Listing duties in place of results, skipping a gap or a short job and hoping nobody asks, and blaming a past employer for a move.
  followUps:
    - q: Which parts of that project did you do yourself?
      level: Mid
      a: |-
        Separate your work from the team's work plainly. Say "I designed the schema and wrote the loader, and a colleague built the alerting." Interviewers ask this when an answer has too much "we" in it. A smaller, clear share is more convincing than a large, vague one.
    - q: You stayed less than a year in one of these roles. What happened?
      level: Mid
      a: |-
        Answer in two or three calm sentences: what happened, what you learned, and what you checked before taking the next job. If it was a layoff or a poor fit, say so directly. A short, honest reason ends the topic. A long defence makes it look bigger.
    - q: Which recent project should we talk about in more depth?
      level: Mid
      a: |-
        Offer the project that best matches the role and that you know in detail, and say why in one line. Have its numbers ready: team size, duration, the result. This is your chance to steer the interview toward your strongest material.
- id: opener-why-this-company-and-this-role
  q: Why do you want to work at this company, and why this role?
  level: Junior
  category: behavioral
  subcategory: openers-motivation
  signals:
    - motivation
  topics:
    - /behavioral/foundations/why-this-company-and-why-leaving
  a: |-
    **What it tests.** Whether you have done real research, and whether your reasons will still hold after six months in the job. The interviewer wants a link between something specific about the company and something you have already shown you care about. The common failure is an answer that would fit any employer.

    **How to shape the answer.**

    - **Company.** Give one or two specific things: a product you use, an engineering choice you read about, a problem they work on.
    - **Role.** Say what the daily work is and why you want that work.
    - **Evidence.** Tie each reason to something you have done.
    - **Open point.** If you are unsure about something, say you plan to ask about it.

    **A strong answer sounds like this.** "Two reasons. First, I use your booking app every week, and I noticed that the search page stays usable on a slow connection. I read your engineering post about setting a size limit for each page, and that is how I like to work. On my current team I cut our main page from 900 kilobytes to 400, and mobile bounce rate dropped by 3 percent. Second, this role sits in the design system team. I maintain 12 shared components today as a side task, and I want that work to be my whole job."

    **Watch out for.** Praise for the brand or the pay, facts about the company you cannot back up when asked, and reasons about what you will get with nothing about what you will do.
  followUps:
    - q: What do you expect to find here that your current job does not give you?
      level: Junior
      a: |-
        Name one or two concrete things, such as a dedicated design system team or users at a larger scale, and say how you know this company has them. Keep it about the work. Do not turn the answer into a list of complaints about your current employer.
    - q: Suppose the work turns out to be mostly maintenance and on-call, with few new features. How would you feel?
      level: Mid
      a: |-
        Be honest about your limits and show that you value the work. Say what share of maintenance is fine for you, give an example of maintenance work you did well, and ask what the real split is on this team. Claiming to love everything is not believable.
    - q: What would make you leave a team?
      level: Mid
      a: |-
        Give one or two real conditions, such as no chance to learn for a long period, or problems that are raised and never acted on. Then say what you would try before leaving. The interviewer is checking that you do not walk away at the first difficulty.
- id: opener-why-are-you-leaving-current-company
  q: Why are you leaving your current company?
  level: Mid
  category: behavioral
  subcategory: openers-motivation
  signals:
    - motivation
    - judgment
  topics:
    - /behavioral/foundations/why-this-company-and-why-leaving
    - /behavioral/leveling-and-tracks/career-gaps-layoffs-and-switches
  a: |-
    **What it tests.** Whether you are moving toward something or only away from something, and how you talk about people who are not in the room. The interviewer also checks for risk: a problem that would follow you here. It gets harder when you have had several short jobs, or when you are leaving after a conflict or a layoff.

    **How to shape the answer.**

    - **The pull first.** Say what you want next in one sentence.
    - **The honest push.** Give the true reason your current job cannot offer it, as a fact with no blame.
    - **What you tried.** Say what you did to get it where you are.
    - **The link.** Close with why this role has it.

    **A strong answer sounds like this.** "I want to work on a product where mobile is the main surface. At my current company the app is a companion to the website, so the mobile team is three people and most roadmap decisions are made for web first. I raised this with my manager last year, and we got offline support onto the plan, which I led. Crash-free sessions went from 98.9 to 99.6 percent. The team size is not going to change, though, and I have learned most of what that setup can teach me. Here, most of your users are on mobile."

    **Watch out for.** Criticising your manager or team, a reason that is only about money, and a story that changes between the recruiter call and the onsite.
  followUps:
    - q: You sound happy where you are. Why change at all?
      level: Mid
      a: |-
        Agree that things are fine, then name the specific thing this role offers that your current one cannot. Being content and still choosing to move is a strong position. Do not invent a complaint to justify the move, and do not say you are only looking around.
    - q: You have moved three times in five years. What made you move each time?
      level: Mid
      a: |-
        Give one honest sentence per move, each with a reason that points forward: a new skill, a larger scope, a company closing. Then say what would keep you somewhere for longer and why this role has it. The interviewer is judging the risk that you leave in a year.
    - q: What would have made you stay?
      level: Mid
      a: |-
        Name the one change that would have kept you, and say whether you asked for it. If you asked and the answer was no, say so without bitterness. This shows you try to fix things before you leave, and it tells the interviewer what you need here.
- id: opener-what-are-your-strengths
  q: What are your strengths?
  level: Junior
  category: behavioral
  subcategory: openers-motivation
  signals:
    - growth
    - communication
  topics:
    - /behavioral/foundations/strengths-and-weaknesses
  a: |-
    **What it tests.** Self-awareness, and whether your strengths match the job. A strength with no proof is only a claim, so the interviewer listens for evidence and for a strength that someone else has noticed. Senior candidates are expected to name strengths that help other people, such as making a team's decisions faster.

    **How to shape the answer.**

    - **Pick two.** Choose strengths the role needs. Two is enough.
    - **Prove each one.** Give a short example with a number or a named outcome.
    - **Add an outside view.** Say who noticed it: a review, a manager, a teammate.
    - **Name the cost.** Say in one sentence where the strength can go too far.

    **A strong answer sounds like this.** "Two things. First, I write things down. When I joined, our deploy steps lived in people's heads. I wrote a runbook of 14 steps, and the next two new joiners deployed in their first week without help. My manager put that in my review. Second, I stay calm when systems fail. In my first on-call week a disk filled at night. I followed the checklist, cleared the logs and wrote up the cause by morning. The risk with the first strength is that I document too early, before a process has settled, so now I ask first."

    **Watch out for.** A list of five adjectives, strengths that everyone claims such as "hard worker" with no proof, and a strength that does not matter for this role.
  followUps:
    - q: Of the strengths you named, which is the least developed today, and what are you doing about it?
      level: Junior
      a: |-
        Choose one and be specific about the gap. Then give the action you are taking now and how you measure progress, for example asking for one piece of feedback after each incident. The interviewer wants proof that you can judge yourself accurately.
    - q: Tell me about a time that strength caused a problem.
      level: Mid
      a: |-
        Every strength has a cost, so have one example ready. Say what happened, who was affected and what limit you now set. For example, careful documentation delayed a small fix by a day. Refusing to name a downside makes you sound less self-aware.
    - q: Which of those strengths will matter most in this role?
      level: Junior
      a: |-
        Link one strength to something specific in the job description or something the interviewer said earlier. Explain how it would help in the first three months. This shows you understand the role and did not prepare a general answer.
- id: opener-where-do-you-see-yourself-in-five-years
  q: Where do you see yourself in five years?
  level: Junior
  category: behavioral
  subcategory: openers-motivation
  signals:
    - growth
    - motivation
  topics:
    - /behavioral/foundations/strengths-and-weaknesses
  a: |-
    **What it tests.** Whether you have thought about your direction, and whether this job is a sensible step on it. Nobody expects an exact plan. The interviewer checks that your goals fit what the role can offer, and that you understand what growth takes and do not expect a promotion every year.

    **How to shape the answer.**

    - **Direction.** Name the kind of work and the kind of problems you want.
    - **Skills.** Say two things you need to learn to get there.
    - **This role.** Explain how the job gives you those two things.
    - **Flexibility.** Say what would make you change the plan.

    **A strong answer sounds like this.** "In five years I want to be the person a team trusts to take a model from an idea to production and keep it healthy. Today I am strong at training and evaluation. I have shipped two ranking models, and the second one raised click-through by 1.5 percent. I am weaker at serving and monitoring: I have never been on call for a model. This role owns both halves, which is why I applied. I am not fixed on a title. If I find that I enjoy the infrastructure side more, I will follow that."

    **Watch out for.** Naming a title with no reason, saying you want the interviewer's job or your own startup, and "I have not thought about it".
  followUps:
    - q: What is your goal for your first year here?
      level: Junior
      a: |-
        Give a goal that fits the role: for example, own one service end to end, including on-call, and ship two changes that users notice. Add what you need from the team to get there. A concrete first-year goal makes the five-year answer more believable.
    - q: Do you want to manage people at some point?
      level: Mid
      a: |-
        Any honest answer is fine: yes, no, or not sure yet. Give your reason and what you would need to see first. If you are early in your career, it is reasonable to say you want to become strong technically before deciding.
    - q: What would make you change that plan?
      level: Junior
      a: |-
        Name a real possibility, such as finding that you enjoy infrastructure more than modelling, and say how you would notice it. The interviewer wants to see a plan you hold loosely. Fixed plans this early in a career sound unrealistic.
- id: opener-looking-for-in-your-next-role
  q: What are you looking for in your next role?
  level: Senior
  category: behavioral
  subcategory: openers-motivation
  signals:
    - motivation
    - prioritisation
  topics:
    - /behavioral/foundations/why-this-company-and-why-leaving
    - /behavioral/leveling-and-tracks/career-gaps-layoffs-and-switches
  a: |-
    **What it tests.** Whether you know what you want well enough to rank it, and whether this job can give it to you. Recruiters and hiring managers both ask it, so your answers should match. At senior level the interviewer also listens for what you want to give: the problems you want to own, and for whom.

    **How to shape the answer.**

    - **Rank two or three things.** For example scope, the type of problem, and the people you want to learn from.
    - **Say why now.** Tie each one to where you are in your career.
    - **Name one trade-off.** Say what you would give up to get the top item.
    - **Check the fit.** Ask how the role matches your first item.

    **A strong answer sounds like this.** "Three things, in order. First, scope across teams. For two years I have run reliability for one product group of 30 engineers, and we brought paging alerts down from about 45 a week to 12. I want to do that work for a whole organisation. Second, a manager who has grown staff engineers before, because that is my next step. Third, a product where downtime costs users something real. I would accept a narrower technical area to get the first one. How many teams would this role work across in its first year?"

    **Watch out for.** A list where everything is equally important, an answer that is only about pay, title or remote work, and wants that this role plainly cannot meet.
  followUps:
    - q: If you could have only one of those, which would it be?
      level: Senior
      a: |-
        Choose one without hedging and give the reason. Then say what you would do about the missing items, such as finding a mentor outside your team. The interviewer is testing whether your ranking is real. Changing the order under pressure suggests it was not.
    - q: What did your last role lack?
      level: Senior
      a: |-
        State one gap as a fact about the role, with no blame on people. Say what you did to close it while you were there. Then link it to the first item on your list. Keep it short: this question invites complaints, and you should not give any.
    - q: What would make you turn this job down?
      level: Senior
      a: |-
        Be direct and reasonable. Name one or two conditions, for example a scope limited to one team, or no clear owner for reliability goals. Saying nothing would stop you sounds either desperate or untrue. A clear limit helps both sides decide sooner.
- id: opener-what-would-your-manager-say-about-you
  q: What would your manager or your teammates say about you?
  level: Mid
  category: behavioral
  subcategory: openers-motivation
  signals:
    - growth
    - feedback
  topics:
    - /behavioral/foundations/strengths-and-weaknesses
  a: |-
    **What it tests.** Whether you ask for feedback and remember it, and whether your view of yourself matches what others see. Your answer may be compared with what your references say later, so it must be true. It gets harder at senior level, where a good answer includes how you affect other people's work.

    **How to shape the answer.**

    - **One strength, in their words.** Quote a review or a real comment if you can.
    - **The evidence.** Give the event that made them say it.
    - **One thing to improve, in their words.** Choose a real one.
    - **What you did about it.** Give the change and how you know it worked.

    **A strong answer sounds like this.** "My manager would say I am the person who finishes things. In my last review she wrote that I close the last 10 percent, like empty states and error messages, without being asked. She would also say I take on too much alone. Last spring I spent three weeks rewriting our table component before I showed anyone, and half of it had to change after design review. Since then I post a draft within two days of starting. My last two projects each had a design review in the first week, and neither needed a restart."

    **Watch out for.** Guessing because you have never asked, an answer with only praise, and a "weakness" that is a strength in disguise, such as working too hard.
  followUps:
    - q: Would your teammates say the same thing as your manager?
      level: Mid
      a: |-
        Point out a real difference if there is one. Peers see how you review code and share work, and managers see results. Give one thing a teammate has told you directly, with the occasion. If the two views match, say what evidence you have for that.
    - q: When did you last ask for feedback, and how did you ask?
      level: Mid
      a: |-
        Give a recent date and the exact request you made, for example asking a peer for one thing to do differently in design reviews. Then say what you heard and what you changed. Waiting for the yearly review is a weak answer at any level.
    - q: What would the person who least enjoys working with you say?
      level: Senior
      a: |-
        Answer it straight. Describe the friction from their side, for example that you push for decisions before they are ready. Say what you have changed and what you have not. An answer with no critic at all is hard to believe.
- id: opener-what-questions-do-you-have-for-us
  q: What questions do you have for us?
  level: Mid
  category: behavioral
  subcategory: openers-motivation
  signals:
    - motivation
    - communication
  topics:
    - /behavioral/foundations/questions-to-ask-interviewers
  a: |-
    **What it tests.** Whether you are choosing this job with care. How much weight this part carries differs between companies and is rarely stated, so treat it as part of the interview. It is also your best chance to learn what the work is really like. Good questions show what you care about.

    **How to shape the answer.**

    - **Prepare five, ask two or three.** Time is short, so put the most important first.
    - **Match the person.** Ask an engineer about daily work, a manager about expectations and growth, a recruiter about process.
    - **Ask for facts.** Ask about the last incident, the last launch, or how the last disagreement was settled.
    - **Listen and follow up.** One follow-up on their answer is worth more than a fourth question.

    **A strong answer sounds like this.** "Yes, three if we have time. First, you said the team took over the billing service this year. What has been the hardest part of that so far? Second, think of the last engineer who joined your team. What did their first 90 days look like, and what would you change about it? Third, when this team and its product manager last disagreed about a deadline, how was it settled? I ask because on my current team those calls go to a director, and that adds about a week each time."

    **Watch out for.** "No, I think you covered everything", questions whose answers are on the careers page, and asking an engineer about pay or leave, which belongs with the recruiter.
  followUps:
    - q: Is there anything that would stop you from accepting an offer from us?
      level: Mid
      a: |-
        Answer honestly and briefly. If something is open, such as on-call load or the level, name it and ask about it now. If nothing is, say so and say what you still want to learn. Hiding a real concern until the offer wastes time on both sides.
    - q: We have time for one more. What do you most want to know?
      level: Mid
      a: |-
        Have your most important question marked in advance, so you can go straight to it. Usually this is the one about daily work or about how success is judged in the first six months. Do not spend the last question on something a search would answer.
    - q: Is there anything we did not ask that you wanted to talk about?
      level: Mid
      a: |-
        Use it to add one piece of evidence the interview missed, in under a minute. For example, a project that shows a skill the role needs. Say what it shows and offer to go deeper. If the interview covered everything, say so and thank them.
- id: newgrad-project-you-are-most-proud-of
  q: Walk me through the project you are most proud of, from a course, an internship or your own time.
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - ownership
    - communication
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
    - /behavioral/leveling-and-tracks/junior-to-senior-leveling
  a: |-
    **What it tests.** Depth and ownership. With little work history, a project is your best evidence, and the interviewer will ask for technical detail on anything you name. At junior level, a small project that you understand fully beats a large one where your part was minor.

    **How to shape the answer.**

    - **Situation and task.** Say what the project was for, who used it and why you picked it.
    - **Action.** Give two or three decisions you made yourself, with the reason for each.
    - **Result.** Give a number, even a small one: users, speed, a grade.
    - **Learning.** Say what broke, or what you would build differently.

    **A strong answer sounds like this.** "My proudest project is a study room finder I built in my third year. Students at my university had to check four web pages to find a free room. I wrote a scraper that pulled the room data every 15 minutes, and a small web page that showed free rooms by building. I chose a plain SQL database over a document store because the data was one fixed table. About 300 students used it in exam week. The scraper broke twice when the university changed its page layout, so I added a check that emails me when a field comes back empty."

    **Watch out for.** Choosing the project that sounds most impressive over the one you know best, saying "we" for a group project so that your own part is unclear, and listing a technology you cannot explain.
  followUps:
    - q: Why did you choose that technology?
      level: Junior
      a: |-
        Give the real reason, including the simple ones: you knew it already, or the course required it. Then name one alternative and what it would have changed. The interviewer checks that you made a choice and did more than follow a tutorial.
    - q: What was the hardest technical problem, in detail?
      level: Junior
      a: |-
        Go one level deeper than feels natural. Say what broke, what you tried first, why that failed and what fixed it. Use exact terms and numbers. If you do not know why the fix worked, say so. Depth on one problem is better than a list of five.
    - q: What would you improve if you had another month?
      level: Junior
      a: |-
        Name two concrete items in order of value, for example tests for the scraper and a cache for the room list. Say why they come first. This shows you can see the weak points in your own work, which matters more than the project's size.
- id: newgrad-team-project-and-your-part
  q: Tell me about a team project. What was your part, and how did you help the team succeed?
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - ownership
    - communication
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
    - /behavioral/leveling-and-tracks/junior-to-senior-leveling
  a: |-
    **What it tests.** Teamwork, and whether you can describe your own part honestly inside a group result. The interviewer listens for what you owned, how you helped others, and how the team made decisions. Course projects are normal at this level, so a clear role matters more than a big project.

    **How to shape the answer.**

    - **Situation and task.** Give the project, the team size, the time you had and your role.
    - **Action.** Say what you built, and one thing you did that helped a teammate or the whole team.
    - **Result.** Say what was delivered and who used or graded it.
    - **Learning.** Name one thing the team did poorly and what you would change.

    **A strong answer sounds like this.** "In my final year, four of us built an inventory system for a campus food bank over 12 weeks. I owned the backend API and the database. In week five our frontend teammate was stuck because my endpoints kept changing. I wrote a one-page contract for all 9 endpoints and agreed not to change it without telling her first. I also set up a 15-minute check-in twice a week. We delivered on time, and the food bank used it to track about 400 items. Our testing was weak, though: we had 20 tests, all on my API, and none on the frontend."

    **Watch out for.** Taking credit for the whole project, a story where you did your part alone and never spoke to the others, and complaints about a teammate who did less.
  followUps:
    - q: What would a teammate say was your weakest contribution?
      level: Junior
      a: |-
        Name a real one, such as late code reviews or thin tests, and say what it cost the team. Then say what you do now. The interviewer is checking that you can see your work from another person's side. Do not answer with a hidden strength.
    - q: What did each of the other people do?
      level: Junior
      a: |-
        Give one line per teammate with their main piece of work. Being able to do this shows you paid attention to the whole project. Give credit by role and be fair. Then restate your own part, so the split is clear.
    - q: If you ran the same project today, what would go differently?
      level: Junior
      a: |-
        Pick one change in how the team worked and one technical change. For example, agree the API contract in week one and add frontend tests. Explain what you have learned since that makes you say this. Avoid "nothing", and avoid blaming a teammate.
- id: newgrad-disagreement-with-classmate-or-teammate
  q: Tell me about a disagreement with a classmate or teammate on a project. How did you resolve it?
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - conflict
    - communication
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
  a: |-
    **What it tests.** How you behave when a peer disagrees with you and nobody has the authority to decide. The interviewer listens for whether you understood the other view, whether you used evidence, and whether you could still work together afterwards. At junior level a small, real disagreement is enough. It does not need drama.

    **How to shape the answer.**

    - **Situation and task.** State the disagreement and give the other person's reason fairly.
    - **Action.** Say how you moved it forward: a call, an example, a small test.
    - **Result.** Say what was decided, what each of you gave up, and how the project went.
    - **Learning.** Say what you now do earlier in a disagreement.

    **A strong answer sounds like this.** "In a group project for a databases course, my teammate wanted to store everything in one wide table to save time. I thought our required reports would come out wrong, because the same customer appeared with three spellings. We argued in the group chat for a day and got nowhere. So I asked for 20 minutes on a call and brought five sample rows that showed the duplicates. He reminded me that we had six days left. We agreed on two tables, which was fewer than the five I had drawn. The reports were correct, and we submitted a day early."

    **Watch out for.** A story where the other person was simply lazy or wrong, asking the professor or a manager to settle it before you talked directly, and "we never disagreed".
  followUps:
    - q: What would you have done if they had refused to change their mind?
      level: Junior
      a: |-
        Describe a fair next step: test both options on a small case, set a time limit, or ask the course tutor or team lead to decide. Say you would then follow the decision fully. Going over someone's head first, or giving in silently, are both weak answers.
    - q: How did the project turn out, and how do you two work together now?
      level: Junior
      a: |-
        Give the result briefly, with a grade or a delivery date. Then say something true about the relationship: for example, you chose to work together again the next term. The interviewer wants to know the disagreement did not leave lasting damage.
    - q: What did you learn about how you handle disagreement?
      level: Junior
      a: |-
        Give one specific habit you changed. For example, you now move from chat to a call after two rounds of messages, and you bring an example. A lesson about your own behaviour is stronger than a lesson about the other person.
- id: newgrad-failure-in-course-project-or-internship
  q: Tell me about a failure or a mistake in a course, a project or an internship. What was your part, and what did you change afterwards?
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - failure
    - growth
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
  a: |-
    **What it tests.** Whether you can own a mistake without excuses and change how you work because of it. The interviewer listens for your exact part, how fast you told people, and proof that the lesson stayed with you. A small mistake with a clear change is a better answer than a large one with a vague lesson.

    **How to shape the answer.**

    - **Situation and task.** Say what you were asked to do and what was at risk.
    - **Action.** State the mistake in one plain sentence, then what you did in the first hour.
    - **Result.** Give the cost: time lost, people blocked, marks dropped.
    - **Learning.** Name the habit you changed, and one later time you used it.

    **A strong answer sounds like this.** "During my internship I was asked to add a column to a reporting table. I tested my migration script on my laptop with 200 rows. On the shared test database, with 2 million rows, it locked the table for 25 minutes, and two other interns could not run their tests. That was my mistake: I had not asked how big the real table was. I told the team channel at once, my mentor helped me stop the script, and I rewrote it to run in batches of 10,000. Now I ask about data size before I write any migration, and I test on a copy first."

    **Watch out for.** Blaming unclear instructions or a teammate, a "failure" that is really a success, and a lesson so general that it could follow any story.
  followUps:
    - q: Have you been in a similar situation since? What did you do that time?
      level: Junior
      a: |-
        This checks that the lesson changed your behaviour. Give a later case, even a small one, where you used the new habit, and say what happened. If you have not had one yet, say so and describe exactly what you would do.
    - q: How did you know your fix worked?
      level: Junior
      a: |-
        Say what you measured. For example, the batched script ran in 12 minutes with no lock longer than two seconds, and you watched the other interns' tests pass. "It seemed fine" is not enough. Even a small check shows that you verify your own work.
    - q: How did you tell the people it affected?
      level: Junior
      a: |-
        Give the order: who you told first, how fast, and what you said. A good message has what happened, what you are doing now and when you will update again. The interviewer is looking for speed and honesty, with no attempt to hide the mistake.
- id: newgrad-feedback-received-and-what-you-did
  q: Tell me about feedback you received from a professor, a mentor or a code reviewer. What did you do with it?
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - feedback
    - growth
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
    - /behavioral/leveling-and-tracks/junior-to-senior-leveling
  a: |-
    **What it tests.** Whether you can hear criticism, act on it and show the change. New graduates get a lot of feedback in their first year, so the interviewer wants evidence that you take it well and learn fast. The detail matters: what was said, what you did that week, and how your next piece of work was different.

    **How to shape the answer.**

    - **Situation and task.** Say who gave the feedback and on what work. Quote it if you can.
    - **Action.** Say how you reacted and the specific steps you took.
    - **Result.** Show the difference in your next piece of work, with a number.
    - **Learning.** Say what you now do before someone has to tell you.

    **A strong answer sounds like this.** "In the second week of my internship, my mentor left 31 comments on my first pull request. Most said the same two things: my functions were too long, and my names did not say what the code did. I felt embarrassed, and I asked him for 20 minutes to go through the top three comments with me. I split the change into three smaller pull requests and wrote his rules down as a short checklist. My fourth pull request had 4 comments. At the end of the summer he asked to keep the checklist for the next intern."

    **Watch out for.** Feedback so mild that it is praise, using the answer to argue that the feedback was unfair, and no evidence that anything changed.
  followUps:
    - q: What do you do when you think the feedback is wrong?
      level: Junior
      a: |-
        Say that you first make sure you understand it, by repeating it back or asking for an example. Then you give your view with evidence and accept the decision of the person who owns the grade or the code. Give a real case if you have one.
    - q: What was your first reaction, honestly?
      level: Junior
      a: |-
        It is fine to say you felt defensive or embarrassed. Then say what you did in the next hour, for example reading all the comments twice before replying. The interviewer wants to see that the feeling did not decide your response.
    - q: What feedback are you working on right now?
      level: Junior
      a: |-
        Name one current item, who gave it and what you are doing about it this month. For example, speaking up earlier in meetings, with a goal of one question per meeting. An answer in the present tense shows that taking feedback is a habit.
- id: newgrad-learned-something-new-quickly
  q: Tell me about a time you had to learn something new quickly for a course, a project or an internship.
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - growth
    - delivery
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
  a: |-
    **What it tests.** How you learn when there is a deadline. The interviewer cares about your method more than the topic: where you started, how you checked your understanding, and when you asked for help. A clear method is strong evidence for a junior role.

    **How to shape the answer.**

    - **Situation and task.** Say what you had to learn, why, and how much time you had.
    - **Action.** Give your steps in order, including who you asked and what you built to practise.
    - **Result.** Say what you delivered with the new skill and by when.
    - **Learning.** Say what you still did not know, and how you handle that now.

    **A strong answer sounds like this.** "At the start of my internship I found that my team's service was written in Go. I had only used Python and Java, and I had one week before my first task. I did the official tour in two evenings. Then I read three recent pull requests from the team and asked my mentor why they handled errors the way they did. For practice I rewrote one of my own Python scripts in Go. My first change, a new health check endpoint, went out on day nine after two rounds of review. I was still slow with concurrency, and I said so when my second task needed it."

    **Watch out for.** "I am a fast learner" with no method, a topic you in fact studied for months, and a claim that you mastered something in a week.
  followUps:
    - q: How do you usually go about learning a new skill?
      level: Junior
      a: |-
        Describe your real method in three steps, for example: an official guide first, then reading working code, then a small project of your own with a deadline. Add how you check yourself. A method you have used twice is more convincing than a general statement.
    - q: How did you know you had learned enough to start?
      level: Junior
      a: |-
        Give your test. For example, you could read a teammate's pull request and explain every line, or you could finish a small task without looking things up. Say that you started before you felt fully ready and used code review as a safety net.
    - q: What did you still not understand at the end?
      level: Junior
      a: |-
        Name it plainly, for example concurrency patterns or the build system. Say how it limited you and what you did about it later. Knowing the edge of your own knowledge is a good sign in a junior engineer. Claiming full mastery in two weeks is a bad one.
- id: newgrad-recent-internship-and-hardest-part
  q: Tell me about your most recent internship or project. What did you build, what did you use, and what was the hardest part?
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - communication
    - ownership
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
  a: |-
    **What it tests.** Whether you can explain your own work clearly to someone who was not there, and whether you understand why it was built that way. Expect the interviewer to pick one detail and go deep. The hardest-part question checks that you met a real problem and worked through it.

    **How to shape the answer.**

    - **Situation and task.** Give the team, its size, and the task you were given.
    - **Action.** Say what you built and with what. Then describe the hardest part and what you tried first.
    - **Result.** Say whether it shipped and who used it, with a number.
    - **Learning.** Say what you would do differently on the same task.

    **A strong answer sounds like this.** "Last summer I interned on the mobile team of a fitness app, a team of five. I built the screen where users export their workout history as a file. I wrote it in Kotlin and used the app's existing background job library. The hardest part was large accounts: an export with 3,000 workouts ran out of memory on older phones. I first tried raising the memory limit, and my mentor rejected that. Then I changed the export to write 100 workouts at a time. It shipped in week ten, and about 2 percent of weekly users tried it in the first month."

    **Watch out for.** A list of tools with no problem in it, describing the team's product when the question is about your task, and a "hardest part" that you did not solve or cannot explain.
  followUps:
    - q: What alternative did you consider, and why did you not choose it?
      level: Junior
      a: |-
        Name one real alternative and one or two reasons you rejected it: memory, time, risk or team convention. If your mentor made the call, say so and explain their reasoning. The interviewer checks that you understand the decision and did more than type the code.
    - q: What did you like most and least about that internship?
      level: Junior
      a: |-
        Be specific and fair on both. For example, most: a mentor who reviewed code within a day. Least: three weeks waiting for access to a test environment. Say what you learned from the bad part. Your answer tells the interviewer what kind of team suits you.
    - q: If you had four more weeks, what would you add or change?
      level: Junior
      a: |-
        Give one item for users and one for code quality, in priority order. For example, a progress bar for long exports, then tests for the batching code. Say how you would know each one worked. It shows that you see your work as something to improve.
- id: newgrad-more-work-than-you-could-finish
  q: Tell me about a time you had more work than you could finish. What did you do?
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - prioritisation
    - delivery
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
  a: |-
    **What it tests.** Prioritisation and honesty about limits. The interviewer wants to see that you noticed the problem early, chose on purpose what to drop, and told the people affected. Working all night is a weak answer. At junior level, asking for help at the right time is a positive signal.

    **How to shape the answer.**

    - **Situation and task.** List the commitments and show that they did not fit, with hours or dates.
    - **Action.** Say how you ranked them, what you cut or moved, and who you told.
    - **Result.** Say what was finished, what was not, and what it cost.
    - **Learning.** Say what you now do at the start to avoid the squeeze.

    **A strong answer sounds like this.** "In my final semester I had a compiler project due, two exams, and 12 hours a week as a teaching assistant, all inside ten days. I listed everything and estimated 85 hours of work for about 60 free hours. I asked the course lead which labs I had to grade that week, and she moved half of them to the week after. For the compiler I dropped the optional optimisation stage, worth 10 percent of the mark, and told my project partner on day one. I scored 82 on the project and passed both exams. I should have raised it two weeks earlier, when I first saw the dates."

    **Watch out for.** A story where you slept less and finished everything, dropping something without telling anyone, and blaming whoever set the deadlines.
  followUps:
    - q: What was the hardest thing to drop, and did anyone disagree?
      level: Junior
      a: |-
        Name the item and what you lost by dropping it, such as marks or a feature. If someone disagreed, say how you explained your choice and what you agreed. The interviewer wants to see a real trade-off with a cost, made openly.
    - q: How did you tell the people who were waiting on you?
      level: Junior
      a: |-
        Say you told them early, before the deadline, with a new date and a reason. Give the actual words if you can. Telling people late, or letting them find out for themselves, is the main mistake this follow-up looks for.
    - q: What would you do differently today?
      level: Junior
      a: |-
        Give one planning change and one communication change. For example, map all deadlines at the start of term, and raise a clash as soon as you see it. Keep it concrete. "Better time management" with no detail is too vague to count.
- id: newgrad-why-software-engineering
  q: Why did you choose software engineering?
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - motivation
    - growth
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
  a: |-
    **What it tests.** Motivation that will last past the first hard month. The interviewer listens for a real starting point and for proof since then, such as projects you chose to do. There is no single right reason. A specific, honest reason is better than a grand one.

    **How to shape the answer.**

    - **The start.** Give the moment or the problem that got you interested.
    - **The proof.** Say what you have done since by choice: courses, projects, an internship.
    - **The part you enjoy.** Name the kind of work you like most.
    - **The link.** Tie that to the role you are applying for.

    **A strong answer sounds like this.** "I started in a physics degree. In my second year, one lab needed 40 data files cleaned by hand, about six hours of work each week. I wrote a 60-line Python script that did it in two minutes, and three other lab groups asked for a copy. I enjoyed that more than the physics, so I switched degrees the next term. Since then I have taken every systems course I could, and last winter I built a small key-value store for fun. The part I enjoy most is making a slow thing fast, which is why backend roles interest me."

    **Watch out for.** "I have loved computers since I was a child" with nothing after it, pay as the only reason, and a reason that points to a different job, such as research or product management.
  followUps:
    - q: Which part of the stack do you enjoy most, and why?
      level: Junior
      a: |-
        Pick one and give a reason from experience, such as the day you made a slow query ten times faster. Say you are open to other areas this early in your career. The interviewer is matching you to a team, so an honest preference helps.
    - q: What do you want to be doing two years after you graduate?
      level: Junior
      a: |-
        Describe the work more than the title: for example, owning a small service and being trusted on call. Say what you need to learn to get there. Keep it realistic for two years. This checks direction, and nobody will hold you to the details.
    - q: What part of the work do you like least?
      level: Junior
      a: |-
        Give a real one, such as writing documentation or configuring build tools, and say how you make yourself do it well anyway. Do not name a core part of the job you are applying for. Honesty here makes your other answers easier to trust.
- id: newgrad-internship-lessons-beyond-technical
  q: Apart from technical skills, what did you learn from your internship?
  level: Junior
  category: behavioral
  subcategory: new-grad-intern
  signals:
    - growth
    - communication
  topics:
    - /behavioral/leveling-and-tracks/new-grad-and-intern-interviews
    - /behavioral/foundations/star-plus-l-framework
  a: |-
    **What it tests.** Whether you noticed how professional work differs from coursework: communication, asking for help, estimates, working in other people's code. The interviewer is judging how quickly you will become useful on a real team. One lesson with a story is stronger than a list of five.

    **How to shape the answer.**

    - **The lesson.** State one or two lessons in a sentence each.
    - **The event.** Tell the short story that taught you each one.
    - **The change.** Say what you did differently for the rest of the internship.
    - **The proof.** Give a sign that it worked, such as a comment from your manager.

    **A strong answer sounds like this.** "The main thing I learned was to ask early. In my first month on a data team, I spent four days trying to work out why my query totals did not match the finance dashboard. When I finally asked, an analyst explained in ten minutes that refunds were stored in a separate table. After that I set myself a rule: if I am stuck for more than an hour, I write down what I tried and then ask. I also learned to send a short written update every Friday. My manager said those updates were why she could give me a larger task in the second half."

    **Watch out for.** General words like "teamwork" and "communication" with no story, a lesson that turns out to be technical, and criticism of the company that hosted you.
  followUps:
    - q: How do you decide when to ask for help and when to keep trying?
      level: Junior
      a: |-
        Give your rule and where it came from. For example, one hour alone, then a written note of what you tried, then ask. Add that the limit is shorter when other people are blocked. A clear rule shows you respect both your own learning and the team's time.
    - q: What surprised you most about working with full-time engineers?
      level: Junior
      a: |-
        Give one honest observation, such as how much time goes into reading and reviewing code, or how small most changes are. Say how you adjusted. The interviewer is checking that you noticed how professional work differs from coursework.
    - q: What would your internship manager say you still need to work on?
      level: Junior
      a: |-
        Use real feedback from your final review if you had one. Name the item, give an example, and say what you have done since. For example, estimating tasks: your first estimate was two days and the work took six. Now you add a buffer and report progress daily.
- id: ai-tools-day-to-day-use
  q: How do you use AI coding tools in your day-to-day work?
  level: Mid
  category: behavioral
  subcategory: ai-tools-at-work
  signals:
    - judgment
    - growth
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Judgment. These tools are now common, so the interviewer listens for where you draw lines: which tasks you hand over, which you keep, and how you check the output. A candidate who uses them for everything raises doubts, and so does one who refuses to use them at all.

    **How to shape the answer.**

    - **Where they help.** Name two or three types of task, with an example.
    - **Where you do not use them.** Name the areas you keep for yourself, and the reason.
    - **How you check.** Describe your review and test steps before anything is merged.
    - **The effect.** Give one honest measure of the gain, and one thing that did not get faster.

    **A strong answer sounds like this.** "I use an assistant in my editor every day, mainly for three things: writing unit tests for code I have already written, converting old class components to the newer style, and explaining unfamiliar code when I join a new area. I do not use it for accessibility markup or for anything that touches login, because it has given me confident wrong answers there. I read every line before I commit, and I run the tests myself. My rough measure is that writing tests takes me about half the time it did. Design decisions take as long as they ever did."

    **Watch out for.** Naming tools with no account of how you check them, claiming large speed gains you cannot support, and saying you do not read generated code closely.
  followUps:
    - q: What do you still write by hand, and why?
      level: Mid
      a: |-
        Name two or three areas and the reason for each: code where a small error is costly, code you need to understand deeply, or areas where the tool has been wrong for you before. The interviewer wants a boundary based on experience, with examples.
    - q: How do you make sure you still understand code you did not type yourself?
      level: Mid
      a: |-
        Give your habits. For example, you read every line before committing, you can explain each block in review, and you sometimes write a first version yourself before asking for one. Say that if you cannot explain it, you do not ship it.
    - q: How has your use of these tools changed over the last year?
      level: Mid
      a: |-
        Give one thing you started doing and one you stopped, each with a reason. For example, you now ask for tests more often, and you stopped accepting long changes across many files. This shows you adjust from evidence and do not follow hype or habit.
- id: ai-tools-wrong-result-and-how-you-caught-it
  q: Tell me about a time an AI tool gave you an answer that looked right and was subtly wrong. How did you catch it?
  level: Mid
  category: behavioral
  subcategory: ai-tools-at-work
  signals:
    - judgment
    - failure
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you verify output that looks plausible. The interviewer wants the exact check that caught the error, and wants to hear that the check was a habit and not luck. If a user or a teammate found the error first, say so honestly.

    **How to shape the answer.**

    - **Situation and task.** Say what you asked the tool for and why it mattered.
    - **Action.** Describe the check that exposed the error, and how you found the cause.
    - **Result.** Say what the error would have cost and what you shipped.
    - **Learning.** Name the check you now run every time.

    **A strong answer sounds like this.** "I asked an assistant to write a query that removed duplicate events from a table of about 80 million rows. The query ran, and the counts looked sensible. Before I shipped it, I compared one day of output with a count I did by hand, and the new table was 0.4 percent short. The query kept one row for each user and timestamp, and two real events can share a timestamp. I changed the key to the event ID and added that one-day comparison as a test. Since then I check any generated query against a small case where I already know the answer."

    **Watch out for.** Blaming the tool as if you had no part in it, a story where you caught the error by chance, and the conclusion that you now avoid these tools completely.
  followUps:
    - q: What did you change in how you work after that?
      level: Mid
      a: |-
        Give one personal habit and, if you can, one team change. For example, you test generated queries against a case with a known answer, and you added that check to the review list. A lesson that is written down for the team is stronger than one you keep in your head.
    - q: What would have happened if you had not caught it?
      level: Mid
      a: |-
        Size the damage honestly: who would have seen wrong numbers, for how long, and how hard it would have been to trace. This shows you understand why the check mattered. Do not exaggerate, and do not dismiss it as minor either.
    - q: Did you tell your team about it?
      level: Mid
      a: |-
        The good answer is yes, with the method: a short note in the team channel with the example and the check you now use. Sharing a near miss helps others avoid it. Keeping quiet because you were embarrassed is the thing to avoid.
- id: ai-tools-reviewing-ai-written-code
  q: How do you review a pull request when most of the code was written by an AI tool, whether the author is you or a teammate?
  level: Senior
  category: behavioral
  subcategory: ai-tools-at-work
  signals:
    - judgment
    - feedback
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether your quality bar stays the same when code is cheap to produce. The interviewer listens for what you check first, what you ask the author, and when you refuse to merge. At senior level they also expect a view on team rules.

    **How to shape the answer.**

    - **Your position first.** The bar is the same as for any code, and the author owns every line.
    - **What you check.** Tests first, then code nobody asked for, then error paths and security.
    - **What you ask the author.** How they tested it, and to explain any block you find unclear.
    - **The team rule.** Say what rule you have set, or would set.

    **A strong answer sounds like this.** "I hold it to the same bar as any other code, and I ask the author to own it. On my platform team I added two lines to our pull request template: which parts were generated, and how the author tested them. In review I start with the tests, because generated tests often check what the code does and miss what it should do. Then I look for things nobody asked for, like an extra retry loop. If the author cannot explain a block, it does not merge. Over one quarter our reverted changes went from 9 to 5, with about the same number of merges."

    **Watch out for.** A different standard for generated code in either direction, reviewing the code and skipping the tests, and policing which tool was used while ignoring the result.
  followUps:
    - q: Would you ever merge generated code without a review? Where is your line?
      level: Mid
      a: |-
        State your line clearly. A common one: nothing reaches the main branch without a human review, and throwaway scripts on your own machine are your own risk. Explain the reason, which is that a person must be accountable for every change that ships.
    - q: How would you tell whether a teammate's heavy use of AI is helping or hurting quality?
      level: Senior
      a: |-
        Look at results more than at tool use: reverted changes, bugs found after merge, review time, and whether the person can explain their code. If the numbers are fine, there is no problem. If they are poor, talk to the person privately first, with examples.
    - q: The author says the pull request is too large to explain line by line. What do you do?
      level: Senior
      a: |-
        Ask them to split it into smaller changes that can each be reviewed in under half an hour, and offer to help decide the split. Size is a review problem whoever wrote the code. Approving code that nobody has read is the outcome to refuse.
- id: ai-tools-chose-not-to-use-one
  q: Tell me about a time you chose not to use an AI tool, or stopped using one partway through a task.
  level: Mid
  category: behavioral
  subcategory: ai-tools-at-work
  signals:
    - judgment
    - ownership
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you can tell when a tool is the wrong choice, and whether you will accept a cost, such as time, to do the work properly. The interviewer wants a specific reason tied to risk. A general distrust of these tools is as weak an answer as a general trust.

    **How to shape the answer.**

    - **Situation and task.** Give the task, the deadline, and what the tool offered.
    - **Action.** Say why you stopped, what you did by hand, and who you told.
    - **Result.** Give the cost in time, and what you found.
    - **Learning.** State the rule you now use to decide.

    **A strong answer sounds like this.** "A fix for a rounding bug in our invoice service was due the same day. The assistant suggested a change that made the failing test pass, and I could not explain why it worked. Invoices are money, so I stopped and traced the calculation by hand. It took 90 minutes. The suggestion had hidden the bug by rounding twice, which would have been wrong for currencies with no decimal places. At 3 pm I told my lead that the fix would land the next morning, and why. It shipped at 10 am with four new test cases. My rule now: if I cannot explain it, I do not merge it."

    **Watch out for.** A reason of principle with no risk behind it, hiding the delay from your team, and a story where the manual route found nothing and taught you nothing.
  followUps:
    - q: How did you tell the team you would miss the deadline?
      level: Mid
      a: |-
        Say you told them as soon as you knew, with the reason, the risk of shipping now and a new time. Give the actual message if you can. The interviewer wants early, plain communication and a new date that you then met.
    - q: If the deadline could not move, would you have merged the suggestion?
      level: Mid
      a: |-
        Give your position and its condition. A reasonable one: no, you would ship a smaller safe change, such as turning the feature off for the affected cases, and say so openly. If you would merge, say what guard you would add and who would agree to the risk.
    - q: How do you decide when a task is a poor fit for these tools?
      level: Mid
      a: |-
        Give two or three signals from experience: an error would be costly, you cannot easily test the result, or the task depends on context the tool does not have. Add a short example. A rule based on risk is better than a general dislike or a general trust.
- id: ai-tools-private-or-sensitive-data
  q: Tell me about a time you used AI tools on work that involved private or sensitive data. What did you do to use them responsibly?
  level: Mid
  category: behavioral
  subcategory: ai-tools-at-work
  signals:
    - judgment
    - customer-focus
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What it tests.** Whether you think about where data goes before you paste it. The interviewer listens for three things: that you knew your company's rules, that you cut the data down to what the task needed, and that you still got the work done. Ignoring the rules is a weak answer, and so is giving up on the task.

    **How to shape the answer.**

    - **Situation and task.** Say what the data was, why a tool would help, and what the rules allowed.
    - **Action.** Say how you removed or masked the sensitive parts, and how you checked that it worked.
    - **Result.** Give the outcome of the task with a number.
    - **Learning.** Say what you made reusable for the team.

    **A strong answer sounds like this.** "I was debugging a support ticket classifier, and the failing examples contained customer names, emails and order numbers. Our policy allowed only the company-approved assistant, and no customer data in prompts. I wanted help finding a pattern in about 200 misclassified tickets. So I wrote a small script that replaced names, emails and numbers with placeholders, checked 30 results by eye, and used the masked set. The pattern was tickets written in two languages. Fixing the language detection step raised accuracy on that group from 71 to 84 percent. I added the script to our team repository, because two colleagues had the same need."

    **Watch out for.** Not knowing whether your company had a policy, saying the data "was probably fine", and treating responsible use as a reason to do nothing.
  followUps:
    - q: What would you never paste into an external AI service?
      level: Mid
      a: |-
        List the categories: customer personal data, passwords and keys, unreleased financial numbers, and source code your employer has not approved for that tool. Say you check the policy when you are unsure. A fast, specific list shows the habit is already in place.
    - q: How would you decide whether proprietary source code can be shared with an AI tool?
      level: Senior
      a: |-
        Say the decision is not yours alone. You would check the company policy and the list of approved tools, and ask the security or legal team if the case is unclear. Mention what you would look at: where the data goes, and whether it is stored or used for training.
    - q: What would you do if you saw a teammate paste customer data into a tool that is not approved?
      level: Mid
      a: |-
        Say you would tell them directly and at once, because it may need to be reported quickly. Then you would follow the company's process for a possible data exposure, together with them if they are willing. Staying silent to protect a colleague is the wrong answer.
- id: offer-compensation-expectations
  q: What are your compensation expectations?
  level: Mid
  category: behavioral
  subcategory: recruiter-offer
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/foundations/recruiter-and-hiring-manager-screens
  a: |-
    **What it tests.** The recruiter is planning more than testing you. They want to learn early whether your expectations and the budget for the role can meet. Your aim is to stay in the process without fixing a number before you know the level and the full package.

    **How to shape the answer.**

    - **Say first.** You are flexible, and you want to understand the role and level before you name a figure.
    - **Ask back.** Ask for the range for the role. Rules on pay ranges and on salary history questions differ by country and region.
    - **If pressed.** Give a researched range for that level and location, as a total package.
    - **Never say.** A number below what you would accept, or a false current salary.

    **A strong answer sounds like this.** "Thanks for raising it early. I would like to learn more about the level and the scope before I give a number, because that changes the answer a lot. Could you share the range you have for this role? If it helps to have something now: from what I have read about this level in this city, I would expect a total package of around 150,000 to 170,000 a year. Please treat that as a starting range."

    **Watch out for.** Naming a number before you have researched the level, lying about current pay or other offers, and treating the first call as the final negotiation. The figures in the sample are an invented example, not market data. This is not legal or financial advice.
  followUps:
    - q: Here is our range for the role. How do you feel about it?
      level: Mid
      a: |-
        Thank them for sharing it. If it works, say it is in the area you expected and that you will look at the whole package at offer stage. If it is low, say so calmly and ask whether the level or other parts of the package can change.
    - q: How much unvested equity would you leave behind if you joined us?
      level: Senior
      a: |-
        This can be a way to learn your current pay. Decide in advance what you will share. You can give an approximate figure, or say you will discuss it at offer stage. Whatever you say must be true. Rules on questions like this differ by country.
    - q: Your number is higher than the one you gave me on our first call. Why?
      level: Mid
      a: |-
        Give the real reason without apology: you now know the level and the scope, or you have learned more about pay for this kind of role. Say the first figure was an early estimate. Stay friendly. A change with a clear reason is normal in these talks.
- id: offer-what-level-are-you-targeting
  q: What level are you targeting?
  level: Senior
  category: behavioral
  subcategory: recruiter-offer
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/foundations/recruiter-and-hiring-manager-screens
  a: |-
    **What it tests.** Whether your view of your own scope is realistic, and whether it matches the opening. The company usually sets the level from the interview evidence. The recruiter wants to avoid running a loop for a level you would turn down.

    **How to shape the answer.**

    - **Say first.** Describe your current scope in one sentence: team size, and how many teams your work touches.
    - **Name the level as a view.** Say which level you think that maps to, and that you know titles differ between companies.
    - **Ask back.** Ask which level the role is opened at, and whether the loop can assess for more than one.
    - **Never say.** A title demand with no evidence, or "whatever you think is right".

    **A strong answer sounds like this.** "Today I am a senior engineer. For the last 18 months I have led the design of our notification platform across three teams, about 20 engineers. From your public level guide, that reads closest to your staff level, though I know titles do not map cleanly between companies. I would like to be assessed at that level. If the interviews place me at the top of senior, I am open to that, if the gap is explained clearly. Which level is this role opened at, and can the loop assess for both?"

    **Watch out for.** Asking for a level because of years of experience alone, accepting a lower level on the call before any interview, and forgetting that level and pay are linked.
  followUps:
    - q: This role is opened one level below that. Do you still want to continue?
      level: Senior
      a: |-
        Do not answer yes or no at once. Ask what the scope is at that level, whether the level can be reviewed after the interviews, and how the pay bands compare. Then decide. Say plainly if a lower level would be a reason for you to stop.
    - q: What makes you say your current work is at that level?
      level: Senior
      a: |-
        Give evidence of scope, with numbers: how many teams your decisions affect, the size of the projects you lead, and who you mentor. Compare it with the company's public level guide if there is one. Years of experience alone do not show a level.
    - q: How does your current company's ladder compare with ours?
      level: Senior
      a: |-
        Say what your current level means in practice: what you are expected to own and decide. Admit that titles do not map exactly. Ask the recruiter how they usually map your company's levels. This is a fact-finding exchange, so stay curious and avoid defending a title.
- id: offer-where-else-are-you-interviewing
  q: Where else are you interviewing, and how far along are you?
  level: Mid
  category: behavioral
  subcategory: recruiter-offer
  signals:
    - communication
    - motivation
  topics:
    - /behavioral/foundations/recruiter-and-hiring-manager-screens
  a: |-
    **What it tests.** Nothing about your skills. The recruiter is planning: how fast they need to move, and how likely you are to accept. It is often asked on the first call and again later. A short, honest answer helps you, because a recruiter who knows your dates can plan the schedule around them.

    **How to shape the answer.**

    - **Say first.** Whether you are actively looking, and roughly how many processes you are in and at what stage.
    - **Keep back.** You may decline to name the companies. Say so politely.
    - **Ask back.** Ask how long their process usually takes, and give your date if you have one.
    - **Never say.** An invented process or offer. Recruiters follow up, and a false claim is hard to keep straight.

    **A strong answer sounds like this.** "I am actively looking, and I am in process with three other companies. One has its final round next week, and the other two are at the first technical screen. I would prefer not to name them. They are all similar product engineering roles. I am telling you so that we can plan the timing: I expect an answer from the first one by the 20th. This role is my first choice so far, because of the data platform work. How long does your process usually take from here, and is there anything I can do to help it move quickly?"

    **Watch out for.** Saying "nowhere else" when that is untrue, exaggerating how far along you are, and sharing another company's confidential interview details.
  followUps:
    - q: Have you reached team matching at the other company?
      level: Mid
      a: |-
        Answer with the true stage in one sentence, and add the date you expect the next step. You do not need to explain the other company's process. The recruiter is estimating how much time they have, so a date is the most useful thing to give.
    - q: Have you heard back from the other company yet?
      level: Mid
      a: |-
        Recruiters may check in like this later in the process. Give the current status truthfully, even if there is no news. If you now have an offer, say so and give its deadline. Keeping the recruiter up to date lets them plan their own steps.
    - q: If all of them made an offer, which would you choose?
      level: Mid
      a: |-
        If this company is your first choice, say so and give a reason about the work. If you do not know yet, say what you still need to learn to decide. Do not promise to accept. A specific reason for your interest is more useful than a strong adjective.
- id: offer-do-you-have-competing-offers
  q: Do you have competing offers, and can you share the details?
  level: Mid
  category: behavioral
  subcategory: recruiter-offer
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/foundations/offer-and-level-negotiation
    - /behavioral/foundations/recruiter-and-hiring-manager-screens
  a: |-
    **What it tests.** The recruiter is planning, and the negotiation starts here. They want to know what they are being compared with, and by when. Some companies ask to see the written offer. What you share is your choice, so read the other offer's terms first.

    **How to shape the answer.**

    - **Say first.** A plain yes or no. If yes, give the date it expires.
    - **Share what you choose.** You can give the level and a rough total without sending the letter.
    - **Ask back.** Ask what they need to make their best offer, and by when.
    - **Never say.** An offer you do not have, or a number higher than the real one.

    **A strong answer sounds like this.** "Yes, I have one written offer. It is for a senior role, and I need to answer by Friday the 14th. I would prefer not to send the letter itself, because I have not checked whether its terms allow that. I can tell you that the total is a little above the top of the range you shared with me. I would still prefer to join your team, because of the scope of the role. What would you need from me to put your best offer together, and can it reach me by Wednesday?"

    **Watch out for.** Bluffing, using the other offer as a threat, and letting a short deadline rush you: you can ask for more time. Rules on what an employer may ask differ by country. This is not legal advice.
  followUps:
    - q: If your current employer makes a counter-offer, would you consider it?
      level: Mid
      a: |-
        Go back to your reason for leaving. If it was scope or the type of work, say that more pay would not change it. If you would truly consider one, say what it would have to include. The recruiter is judging the risk that you withdraw late.
    - q: When will you decide?
      level: Mid
      a: |-
        Give a date and keep it. If you need information first, such as the written offer or a call with the manager, say what and by when. If their deadline is too short for a careful choice, ask politely for more time and give your reason.
    - q: If we match the other offer, will you sign today?
      level: Mid
      a: |-
        You can say that a match would make you very likely to accept, and that you will read the written terms first. Promise only what you will do. If pay was not the only gap, name the other point now, so the new offer can cover it.
- id: offer-timeline-and-notice-period
  q: What is your timeline, and what is your notice period?
  level: Junior
  category: behavioral
  subcategory: recruiter-offer
  signals:
    - communication
  topics:
    - /behavioral/foundations/recruiter-and-hiring-manager-screens
  a: |-
    **What it tests.** Logistics. The recruiter needs to know when you could start, and whether any deadline, yours or theirs, will shape the process. Notice periods come from your contract and from local rules, and they differ a lot by country, so check your own before the call.

    **How to shape the answer.**

    - **Say first.** Your notice period as your contract states it, and the earliest realistic start date.
    - **Add your dates.** Other deadlines, planned leave, exams, or a visa step.
    - **Ask back.** Ask when they want the person to start, and how long the remaining steps take.
    - **Never say.** That you can leave sooner than your contract allows, or that you will drop your handover.

    **A strong answer sounds like this.** "My contract has a one-month notice period. If I had an offer by the end of this month, I could start in the first week of March. I want a few days to hand over my on-call duties and one open project properly, and that fits inside the month. I am in two other processes, and I expect both to finish in about three weeks. I have no fixed deadline yet, and I will tell you the same day if that changes. When would you like someone to start, and how long do your remaining steps usually take?"

    **Watch out for.** Guessing your notice period, promising to skip your handover, and hiding a planned holiday or a visa wait until after the offer. This is not legal advice: check your contract.
  followUps:
    - q: Could you start sooner if we needed you to?
      level: Junior
      a: |-
        Say what is possible within your contract. You can offer to ask your employer for an earlier release, with no promise of the result. Say you want to leave your current team in good order. A new employer has reason to respect that, since it is how you would treat them too.
    - q: We want to move fast. Can you come in for the final round this week?
      level: Junior
      a: |-
        Offer real dates. If you need preparation time or cannot take leave at short notice, say so and give the nearest days that work. Being flexible helps. Agreeing to a day you cannot prepare for will hurt your result.
    - q: Do you need relocation or a work permit, and does that change your start date?
      level: Mid
      a: |-
        State the facts you know: your current status, what you would need, and any dates. Then ask how the company handles it and how long it normally takes them. Do not guess at immigration timelines. Raising it early avoids a surprise after the offer.
- id: offer-what-do-you-think-of-the-offer
  q: What do you think of the offer?
  level: Mid
  category: behavioral
  subcategory: recruiter-offer
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/foundations/offer-and-level-negotiation
    - /behavioral/foundations/recruiter-and-hiring-manager-screens
  a: |-
    **What it tests.** Whether you can respond to an offer calmly and clearly. The recruiter is listening for how close you are to yes, and what stands in the way. You do not have to give a full answer on the call.

    **How to shape the answer.**

    - **Say first.** Thank them, and say what you like about the role.
    - **Ask for it in writing.** Ask for the full details and the date by which they need your answer.
    - **Raise one or two points.** Give each as a specific request with a reason.
    - **Never say.** A rushed yes or no, an ultimatum, or a request you would not sign if they agreed.

    **A strong answer sounds like this.** "Thank you. I am glad to get this, and I enjoyed meeting the team. I would like to read the full offer in writing before I answer. Could you send it today, and tell me when you need a decision? From what you have said, two things matter to me. The base is about 8,000 a year below what I had in mind for this level, and I would like to understand how the equity vests. If we can close the gap on base, I am ready to sign this week."

    **Watch out for.** Accepting on the call and trying to negotiate afterwards, a long list of small requests, and silence after the call. The figure in the sample is an invented example, not market data. For contract, tax or legal questions, ask a qualified adviser.
  followUps:
    - q: Do you accept?
      level: Mid
      a: |-
        If you are ready and have the terms in writing, say yes clearly. If you are not, say you are very interested, that you want to read the written offer, and give a date for your answer. A short delay with a firm date is a normal request.
    - q: What would it take for you to say yes today?
      level: Mid
      a: |-
        Answer only if you know. Name the one or two changes that would close it, and mean it: if they agree, you sign. If you are not sure yet, say what you need to review first and when you will come back with a clear answer.
    - q: This is our best offer, and we need an answer by tomorrow. What do you say?
      level: Mid
      a: |-
        Stay calm and polite. Thank them, say you want to decide carefully, and ask whether a few more days are possible, with your reason. If the deadline is fixed, decide on what you know. Do not let pressure push you into words you would take back.
- id: core-owned-a-shared-result-that-missed
  q: Tell me about a result that fell short when several people or teams shared the work and nobody clearly owned the outcome. Which part did you take responsibility for?
  level: Senior
  category: behavioral
  subcategory: ownership-accountability
  signals:
    - ownership
  topics:
    - /behavioral/competencies/production-incidents-and-mistakes
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What it tests.** Ownership when blame is easy to spread. The interviewer listens for the moment you said "this part is mine" without being pushed, and for what you did next. At senior level the hard part is owning a result that depended on other teams without blaming them.

    **How to shape the answer.**

    - **Situation and task.** Name the shared goal and how far the result fell short. Say why no single person owned it.
    - **Action.** Say what you claimed as yours and when, then what you did to find and fix the real causes.
    - **Result.** Give the number after your changes and who owns the outcome now.
    - **Learning.** Say how you set up shared goals now.

    **A strong answer sounds like this.** "I work on a platform team. Four teams shared a goal to cut cloud spend by 15 percent in a quarter. We reached 6 percent. The goal had been my proposal, so in the review I said the miss was mine to explain. I found that two teams could not see their own costs, and I had never checked that. I built a weekly cost report per team and asked each lead to name one person for it. Next quarter we reached 13 percent. I no longer propose a shared target until every team can see its own number."

    **Watch out for.** Saying "we all failed" and stopping there, taking the blame in words while the story shows others at fault, and no change in how the work is set up afterwards.
  followUps:
    - q: What would have happened if you had said nothing?
      level: Senior
      a: |-
        Be honest and specific. Usually the review would have ended with a list of small causes and no owner, and the same miss would have repeated. Say what evidence you have for that, such as an earlier shared goal that ended the same way.
    - q: How did the other teams react when you took it on?
      level: Senior
      a: |-
        Describe the real reaction, including any relief or any doubt. Then say how you kept them involved, for example by asking each lead to name one person. The interviewer checks that owning the result did not turn into working around people.
    - q: Which part of the miss was not yours, and how did you handle that part?
      level: Senior
      a: |-
        Name it plainly and without blame. Say you raised it with the person who owned it and what you asked them for. Owning a result still leaves other people's gaps visible: you make sure each gap has a name next to it.
- id: core-problem-everyone-had-learned-to-live-with
  q: Tell me about a problem that everyone on your team knew about and had learned to live with. What made you decide to deal with it?
  level: Junior
  category: behavioral
  subcategory: ownership-accountability
  signals:
    - ownership
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What it tests.** Ownership of small, shared problems. Every team has a slow script or a flaky test that people work around. The interviewer wants to hear that you measured the cost, asked before spending time on it, and finished the job. For a junior candidate a small fix with a clear number is enough.

    **How to shape the answer.**

    - **Situation and task.** Describe the problem and how people worked around it. Say how long it had been there.
    - **Action.** Say how you measured what it cost, who you asked for time, and what you fixed. Include the part you could not fix.
    - **Result.** Give the before and after numbers.
    - **Learning.** Say what you do now when you see people working around something.

    **A strong answer sounds like this.** "I had joined a frontend team three months earlier. Our test run failed about one time in five because of three flaky tests, and everyone just clicked re-run. I counted for two weeks: 46 re-runs at about 8 minutes each, so around 6 hours of waiting. I showed my lead the count and asked for one day. I fixed two tests that had timing problems. I could not fix the third, so I moved it out of the main run and opened a ticket with my notes. Failed runs dropped from 20 percent to 4 percent."

    **Watch out for.** Calling teammates lazy for living with it, fixing it in secret on project time, and a claim of a fix with no number before and after.
  followUps:
    - q: Why had nobody fixed it before you?
      level: Junior
      a: |-
        Give a fair reason: each person lost only a few minutes, so nobody saw the total. Avoid any hint that the team did not care. The interviewer is checking how you talk about colleagues as much as what you fixed.
    - q: What did you put aside to do it?
      level: Junior
      a: |-
        Name the task that waited and say who agreed to the delay. One day with your lead's approval is a good answer. Time taken quietly from planned work is a weak one, even when the fix was useful.
    - q: What happened to the part you could not fix?
      level: Junior
      a: |-
        Say where it stands today: who picked up the ticket, or that it is still open. An honest "still open, and here is why" is better than a tidy ending the interviewer does not believe.
- id: core-inherited-half-finished-work
  q: Tell me about a time you took over half-finished work from someone who had left the team. How did you get it finished?
  level: Mid
  category: behavioral
  subcategory: ownership-accountability
  signals:
    - ownership
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What it tests.** Ownership of work you did not start. The interviewer listens for how you found out the true state of the work, how you chose between continuing and restarting, and whether you treated the result as fully yours. Blaming the previous owner is the fastest way to fail it.

    **How to shape the answer.**

    - **Situation and task.** Say what the work was, how far it had got, and what was missing: notes, tests or context.
    - **Action.** Say how you learned the real state, what you decided to keep or redo, and how you reset the date with the people waiting.
    - **Result.** Give the outcome and how it compared with the original plan.
    - **Learning.** Say what you leave behind now for the next person.

    **A strong answer sounds like this.** "I am a data engineer. I took over a move of 40 pipelines to a new scheduler after the owner changed teams. Fourteen were moved and there were no notes. I booked 30 minutes with him, read his commits, and ran every moved pipeline against the old one. Five of the 14 had no alerts and one wrote duplicate rows. I fixed those first, then told the analytics lead the real date: two weeks later than planned. I finished all 40 in six weeks and wrote the runbook I had wanted on day one."

    **Watch out for.** Criticising the person who left, restarting from zero because reading their work felt slow, and keeping the old date when you already knew it was wrong.
  followUps:
    - q: How did you decide between continuing their approach and starting again?
      level: Mid
      a: |-
        Give the test you used: you checked whether the finished parts worked and how long a restart would take. Say what you kept and what you redid. A decision based on evidence from the code is stronger than one based on your own taste.
    - q: What was your first question for the previous owner, and what did the answer tell you?
      level: Mid
      a: |-
        Name the question, for example which pipelines he trusted least. Then say what it showed about the handover: the risk lived in his head and nowhere else. Finish with what you now write down for whoever follows you.
    - q: Who did you tell about the new date, and how did they take it?
      level: Mid
      a: |-
        Say who was waiting, what you told them and when. Give the evidence you brought, such as the five pipelines with no alerts. Telling people early with a reason usually keeps their trust, and you can say so plainly.
- id: core-task-was-done-but-result-was-not
  q: Tell me about a time your task was marked as done, and you kept going because it was not yet working for the people who needed it.
  level: Junior
  category: behavioral
  subcategory: ownership-accountability
  signals:
    - ownership
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
    - /behavioral/foundations/how-behavioral-interviews-work
  a: |-
    **What it tests.** Whether you care about the outcome or only about closing the ticket. The interviewer wants to hear how you found out the work was not really finished, and that you told someone before you spent more time. At junior level, checking with one real user is already a strong signal.

    **How to shape the answer.**

    - **Situation and task.** Say what you were asked to build and for whom. Say when it was accepted as done.
    - **Action.** Say how you found the gap, who you told, and what you did about it.
    - **Result.** Give the effect on the person who used it, with a number.
    - **Learning.** Say how you decide now that something is finished.

    **A strong answer sounds like this.** "As an intern I built a file export for our support team. It passed review and the ticket was closed. Two days later I asked one support agent to show me how she used it. Names with accents came out broken in her spreadsheet, and she was fixing about 30 rows by hand every morning. That was not in the ticket. I told my mentor, fixed the text encoding in half a day and added a test with real names. Her clean-up went from 20 minutes a day to zero. Now I watch one real user before I call anything done."

    **Watch out for.** Reopening work without telling anyone, polishing things nobody asked for and calling it ownership, and a story where the only proof is that you worked late.
  followUps:
    - q: How did you know the extra work was worth doing?
      level: Junior
      a: |-
        Give the cost you saw: 20 minutes a day for one agent, and more across the team. Compare it with the half day the fix took. This shows you weighed it and did not simply add work you liked.
    - q: Did you ask anyone before you spent more time on it?
      level: Junior
      a: |-
        Say yes, and say who. A short message to your mentor with the problem and your estimate is enough. Interviewers like initiative at junior level, and they also want to know your planned work did not slip without warning.
    - q: Where do you stop? You cannot follow every task forever.
      level: Junior
      a: |-
        Give your rule. For example, you check once with a real user after release and fix what blocks the main use. Larger ideas go into a ticket for the team to rank. This shows judgment about your own time.
- id: core-priorities-changed-halfway-through-project
  q: Tell me about a time the business changed priorities halfway through a project your team was building. How did you decide what to stop, what to finish and what to tell people?
  level: Senior
  category: behavioral
  subcategory: ambiguity-scoping
  signals:
    - ambiguity
  topics:
    - /behavioral/competencies/ambiguity-and-shifting-priorities
  a: |-
    **What it tests.** Handling a change of direction without waste or drama. The interviewer listens for how you sorted the work in progress, how you told the team and the people waiting, and what state you left things in. At senior level the test is whether someone else could pick up the paused work later.

    **How to shape the answer.**

    - **Situation and task.** Say what you were building, how far along it was, and what the new priority was.
    - **Action.** Say how you sorted the open work into finish, pause and drop, and what you told the team and other groups.
    - **Result.** Say whether the new priority landed, and what happened to the paused work.
    - **Learning.** Say what you do now so that a pause costs less.

    **A strong answer sounds like this.** "I was tech lead for five mobile engineers. We were seven weeks into a 12-week rebuild of checkout when leadership moved us to a compliance deadline. I listed three pieces in flight. One was nearly done and safe alone, so we shipped it in four days. I paused the other two behind a flag and wrote a two-page note on their state and open questions. I told design and support the same day. We met the compliance date. Three months later the note saved us about a week, but one branch was too old and we rewrote it."

    **Watch out for.** Complaining about the decision, dropping everything on the day with nothing written down, and quietly continuing the old project on the side.
  followUps:
    - q: How did you bring the team through the change?
      level: Senior
      a: |-
        Say what you told them and what you gave them: the reason for the change in plain words, a clear first task, and credit for the paused work. Mention one person who took it badly and what you did for them.
    - q: How did you feel about the change yourself?
      level: Senior
      a: |-
        Be honest in one sentence, for example that it was frustrating to stop at week seven. Then move to what you did. The interviewer wants to see that you can be annoyed and still act well.
    - q: What would you do differently with the paused work?
      level: Senior
      a: |-
        Name one concrete thing. In the sample, the old branch should have been merged behind the flag before the pause, so it kept building with the main code. A specific regret shows you studied the cost of the pause.
- id: core-requirements-kept-changing-after-you-started
  q: Tell me about a project where the requirements changed several times after you had started building. How did you keep making progress?
  level: Mid
  category: behavioral
  subcategory: ambiguity-scoping
  signals:
    - ambiguity
  topics:
    - /behavioral/competencies/ambiguity-and-shifting-priorities
  a: |-
    **What it tests.** Working with change you cannot stop. The interviewer wants to hear that you found out why the requirements kept moving, built so that a change was cheap, and agreed a point where changes had to stop. Complaining about the product manager is a common failure here.

    **How to shape the answer.**

    - **Situation and task.** Say what you were building and how many times the requirements changed, with one example.
    - **Action.** Say how you separated the stable parts from the moving parts, what you built to absorb change, and what you agreed with the requester.
    - **Result.** Compare the cost of an early change with a late one.
    - **Learning.** Say what you ask at the start of a project now.

    **A strong answer sounds like this.** "I am a backend engineer. I built discount rules for our checkout, and the rules changed four times in six weeks because marketing was still testing offers. The first change cost me three days of rework. I asked the product manager which parts were settled. The discount types were fixed and only the conditions moved. So I put the conditions in a config file with tests, set a 20-minute check with her each week, and we agreed a freeze date ten days before launch. The last two changes took about an hour each. We launched on the planned date."

    **Watch out for.** Treating every change as someone's mistake, waiting for final requirements before building anything, and absorbing changes silently until the date slips.
  followUps:
    - q: Why did the requirements keep changing?
      level: Mid
      a: |-
        Give the real cause from the requester's side, such as offers still being tested with customers. If you never found out, say so and say you would ask earlier now. Knowing the reason is what lets you predict the next change.
    - q: How do you decide when to stop exploring and commit to a design?
      level: Mid
      a: |-
        Give your rule. For example, you commit when the stable parts are clear and the cost of a wrong guess is small enough to fix in a day. Mention the freeze date as the point where new changes move to the next release.
    - q: What did you say when a change arrived after the freeze?
      level: Mid
      a: |-
        Say you gave a choice with costs: this change now and a later launch, or the planned launch and this change in the next release. Let the requester pick. This shows you can hold a line without refusing people.
- id: core-two-people-gave-opposite-instructions
  q: Tell me about a time two people you worked for gave you opposite instructions. What did you do?
  level: Junior
  category: behavioral
  subcategory: ambiguity-scoping
  signals:
    - ambiguity
  topics:
    - /behavioral/competencies/ambiguity-and-shifting-priorities
  a: |-
    **What it tests.** What you do when you cannot follow both instructions. The interviewer wants to see that you noticed the conflict early, did not quietly pick the side you liked, and brought both people a clear choice. For a junior candidate, raising it quickly and politely is the whole skill.

    **How to shape the answer.**

    - **Situation and task.** Say who the two people were and what each one asked for. Say why you could not do both.
    - **Action.** Say how you sized each option and how you put the choice to both people together.
    - **Result.** Say what was decided, by whom, and how long it took.
    - **Learning.** Say what you do now when instructions clash.

    **A strong answer sounds like this.** "In my first job on an ML team, my mentor told me to rewrite our data loading script properly. The project lead told me to patch it and have evaluation numbers by Friday. I wrote down both requests and my estimates: half a day for the patch, four days for the rewrite. Then I posted in one thread with both of them and suggested the patch now and the rewrite the week after. They agreed within ten minutes. The numbers went out on Friday, and I finished the rewrite eight days later. I no longer choose silently between two instructions."

    **Watch out for.** Picking one person and hoping the other does not notice, complaining to one about the other, and carrying messages back and forth when one shared thread would settle it.
  followUps:
    - q: What would you have done if they had not agreed with each other?
      level: Junior
      a: |-
        Say you would ask them who should decide, or ask your manager to set the priority. Make clear you would keep working on the part both wanted while you waited. Settling a disagreement between two senior people is their job, and yours is to make it visible.
    - q: Why did you not simply follow the more senior person?
      level: Junior
      a: |-
        Explain that rank does not tell you which task matters more this week, and that the other person would have been surprised later. Raising it took ten minutes. Guessing wrong could have cost four days.
    - q: How did you raise it without making either person look bad?
      level: Junior
      a: |-
        Say you described two requests and a limit on your time, with no comment on who was right. You offered a plan and asked them to correct it. Keeping the message about the work makes it easy for both to answer.
- id: core-explain-your-project-to-an-outsider
  q: Pick a project you built and explain it to me as if I worked in another part of the company, such as finance or sales. Then tell me what you would change about it.
  level: Mid
  category: behavioral
  subcategory: project-deep-dive
  signals:
    - communication
  topics:
    - /behavioral/competencies/project-deep-dive-walkthrough
  a: |-
    **What it tests.** Communication. The interviewer wants to know whether you can explain your own work without jargon, starting from the problem and the people affected. The second half tests self-awareness: a real fault in your own design, with its cost. At mid level you should manage both in about two minutes.

    **How to shape the answer.**

    - **The problem first.** One or two sentences in the listener's terms: who had the problem and what it cost them.
    - **How it works.** Three steps at most. Use an everyday comparison and leave the tool names out.
    - **The result.** One number the listener would care about, such as time or money.
    - **What you would change.** One design choice you would make differently, and why.

    **A strong answer sounds like this.** "Think of our support inbox. About 3,000 messages a day arrived in one queue, and a person read each one to decide which team should get it. I built a sorter. It reads a message, picks one of 12 teams, and says how sure it is. When it is less than 80 percent sure, a person still decides. Messages now reach the right team in about 4 minutes, down from 50. What I would change: I trained it on last year's messages, so it was weak on new product names. I would refresh it every week from the start."

    **Watch out for.** Starting with the architecture, using terms the listener has to ask about, and a "what I would change" that is really a compliment to yourself.
  followUps:
    - q: Now explain the hardest technical part to me as an engineer.
      level: Mid
      a: |-
        Change register cleanly: name the real technique, the alternative you rejected and the reason. The interviewer is checking that the simple version was a choice and that the depth is there. Keep it to one part of the system and skip the full tour.
    - q: Why that approach and not another?
      level: Mid
      a: |-
        Name one alternative you seriously considered and the reason you rejected it, with a number if you have one. For example, fixed keyword rules were faster to build and handled only 60 percent of messages. One real alternative is enough.
    - q: If you would change it, why have you not changed it yet?
      level: Mid
      a: |-
        Give the honest reason: it works well enough, and other work ranked higher. Say what would make you do it, such as accuracy falling below a set level. This shows you rank improvements by value.
- id: core-took-on-tech-debt-on-purpose-and-repaid-it
  q: Tell me about technical debt you took on deliberately. How did you make sure it would be paid back, and was it?
  level: Senior
  category: behavioral
  subcategory: deadlines-tradeoffs
  signals:
    - prioritisation
  topics:
    - /behavioral/competencies/tight-deadlines-and-tech-debt
  a: |-
    **What it tests.** Prioritisation and honesty about trade-offs. The interviewer wants to hear that you chose the shortcut knowingly, wrote down its cost and agreed the payback before launch. Then they want the truth about whether it was paid. At senior level, describe a way of tracking debt that your team still uses.

    **How to shape the answer.**

    - **Situation and task.** Say what the deadline was and what the clean design would have cost in time.
    - **Action.** Name the shortcut, the cost you expected, and the payback you agreed: who and when.
    - **Result.** Say whether you met the date, when the debt was paid, and what it cost in between.
    - **Learning.** Say how your team records debt now.

    **A strong answer sounds like this.** "I led the backend for a partner invoicing launch with five weeks to go. I chose to copy the tax logic from our orders service, because a shared library would have added three weeks. I wrote the cost in the design note: every tax change must now be made twice. Before launch, the product manager agreed that the two sprints after it were for the shared library. We launched on time. The payback took five weeks, and in between one rule drifted and 11 invoices were wrong. We now keep a debt list with an owner and a date for each item."

    **Watch out for.** Debt that was really an accident you noticed later, "we planned to fix it" with no date or owner, and hiding the cost the shortcut caused.
  followUps:
    - q: Which corner should never have been cut?
      level: Senior
      a: |-
        Name one, even a small one. In the sample it could be skipping a daily check that compares the two copies of the tax logic. This shows you can tell cheap debt from debt that puts customers at risk.
    - q: How did you protect the payback time when new feature requests arrived?
      level: Senior
      a: |-
        Say the agreement was made before launch and written down, and that you brought the 11 wrong invoices as evidence when it was challenged. If you lost some of the time, say how much. Agreements made after launch rarely hold.
    - q: How do you decide whether a shortcut is acceptable debt?
      level: Senior
      a: |-
        Give your test: you can state the cost, the damage stays small if it goes wrong, and someone has agreed when it will be paid. Debt that touches money, security or data loss needs a much higher bar.
- id: core-how-ai-will-change-your-own-work
  q: How do you expect AI to change your own job over the next three years, and what are you doing about it now?
  level: Mid
  category: behavioral
  subcategory: ai-views
  signals:
    - judgment
    - motivation
  topics:
    - /behavioral/company-playbooks/frontier-ai-labs-values
  a: |-
    **What it tests.** Judgment and motivation. This is an opinion question with no single right answer. The interviewer wants a clear position about your own work, based on what you have seen, and a sign that you are acting on it. Hype, dismissal and a general speech about the industry all score badly.

    **How to shape the answer.**

    - **Your position.** One sentence on what will change in your own job and what will stay.
    - **Your reasons.** Two things from your own work: one where AI tools helped and one where they failed.
    - **What would change your mind.** Name the evidence that would make you revise your view.
    - **What you are doing.** One concrete skill you are building because of it.

    **A strong answer sounds like this.** "I am an SRE. I think AI will take over the first pass of incident diagnosis within three years, and my job will shift towards deciding what is safe to automate. My reason is the last year. An assistant now drafts our incident timelines, which cut my write-up time from about two hours to 30 minutes. But twice it suggested a restart that would have dropped jobs in progress. So I am spending my learning time on safety checks and on testing automated actions. I would change my view if the tools stopped improving on long tasks for a year or two."

    **Watch out for.** Predictions with no example from your own work, saying your job will not change at all, and repeating a headline you cannot defend in detail.
  followUps:
    - q: Which tasks have you stopped giving to AI tools, and why?
      level: Mid
      a: |-
        Name one or two with the reason, such as changes to production configuration, where a wrong suggestion looks correct and costs a lot. This shows your view comes from use. An answer of "none" suggests you have not looked closely at the results.
    - q: Does that change worry you?
      level: Mid
      a: |-
        Answer honestly and briefly. It is fine to say that part of it does. Then say what you control: the skills you are building and the checks you keep. The interviewer is looking for a steady view, with neither fear nor sales talk.
    - q: What would you tell a new graduate who is starting in your role today?
      level: Mid
      a: |-
        Give one piece of advice that follows from your position. For example, learn to read and test code that you did not write, because that skill grows in value. Keep it consistent with what you said earlier.
- id: core-sceptical-of-an-ai-result-others-celebrated
  q: Tell me about a time people around you were excited about an AI or ML result and you were not convinced. What made you doubt it, and what did you do?
  level: Mid
  category: behavioral
  subcategory: ai-views
  signals:
    - judgment
    - motivation
  topics:
    - /behavioral/company-playbooks/frontier-ai-labs-values
  a: |-
    **What it tests.** Judgment under social pressure, and whether you care more about a true result than a popular one. The interviewer wants to hear what made you doubt the result, what evidence would have removed the doubt, and how you raised it without a fight. It is harder when the excited person is senior.

    **How to shape the answer.**

    - **Your position.** Say what the result was and what you doubted, in one or two sentences.
    - **Your reasons.** Give the specific sign that made you suspicious.
    - **What would have changed your mind.** Name the check you proposed and the outcome that would have satisfied you.
    - **What happened.** Say what the check showed and what the team did, even if you were partly wrong.

    **A strong answer sounds like this.** "A teammate's new churn model scored 0.94 on our test set, up from 0.81, and the team wanted to announce it. I thought a jump that large usually means the model can see the answer. I told him privately that I would be convinced if the score held on customers from a later month, and I asked for two days. One feature, days since last support contact, was filled in after a customer had cancelled. Without it the score was 0.83. We shipped the smaller gain and added a time-based check to our training template."

    **Watch out for.** Doubt with no stated reason, raising it first in a large meeting, and a story where you enjoy being the only clever person in the room.
  followUps:
    - q: What if the check had shown that the result was real?
      level: Mid
      a: |-
        Say you would have told the team so, plainly, and backed the announcement. The check was worth two days either way. Being willing to lose the argument is what makes your doubt useful to a team, and stops it becoming a habit of blocking.
    - q: How did your teammate take it?
      level: Mid
      a: |-
        Describe the real reaction, including any discomfort. Say what you did to keep it about the result: you went to him first and let him present the corrected number. If the relationship got cooler for a while, say so.
    - q: How do you tell healthy doubt from being negative about everything?
      level: Mid
      a: |-
        Give your rule. You doubt a result when you can name a specific way it could be wrong and a cheap test for it. If you cannot name both, you say you have no objection. Mention a result you accepted quickly.
- id: core-responsible-ai-in-a-product-you-worked-on
  q: What does responsible use of AI mean to you in practice? Use a product you have worked on as your example.
  level: Senior
  category: behavioral
  subcategory: ai-views
  signals:
    - judgment
    - motivation
  topics:
    - /behavioral/company-playbooks/frontier-ai-labs-values
  a: |-
    **What it tests.** Judgment and values, shown through decisions. Principles from a poster score low. The interviewer wants the limits you set in a real product, what those limits cost, and what evidence would make you loosen or tighten them. At senior level you should show rules that other people now follow.

    **How to shape the answer.**

    - **Your position.** Define responsible use in one or two sentences of your own.
    - **Your reasons.** Tie the definition to who could be harmed in your product and how.
    - **An example.** Give two or three decisions you made, with what each one cost.
    - **What would change your mind.** Name the evidence that would make you relax or tighten a rule.

    **A strong answer sounds like this.** "For me it means a person stays answerable for what the system does, and we measure harm as carefully as benefit. I led a feature that drafts replies for support agents. We set three rules. The agent always sends, never the model. We do not draft for billing disputes, about 9 percent of tickets. And we review 200 drafts a week for wrong facts. That review found 3 percent of drafts stated the refund policy wrongly, so we tied drafts to the policy pages. The rules cost about five weeks. I would relax the first rule if errors stayed under half a percent for a quarter."

    **Watch out for.** Abstract words such as fairness and transparency with no decision behind them, rules that cost nothing, and treating legal review as your whole responsibility.
  followUps:
    - q: Who pushed back on those limits, and what did you say?
      level: Senior
      a: |-
        Name the role, for example a product manager who wanted drafts on every ticket. Give their reason fairly, then the evidence you used, such as the 3 percent error rate. Say what you conceded. Rules that nobody argued with were probably too easy.
    - q: What harm did you fail to predict?
      level: Senior
      a: |-
        Give one real example and how you found it. For instance, agents began to send drafts without reading them, which your review caught three weeks in. Say what you changed. Admitting a miss makes the rest of the answer believable.
    - q: Who is accountable when the AI output is wrong?
      level: Senior
      a: |-
        Give a direct answer: the team that ships the feature, and in the moment the person who sends the output. Then say how your design supports that, with review samples and a clear way to report a bad draft.
