- id: how-do-vision-language-models-get-images-into-an-llm-project
  q: "How do vision-language models get images into an LLM: projector, cross-attention, or native tokens?"
  a: |
    A vision encoder, usually a ViT, turns the image into patch embeddings. Three common ways connect them to the LLM. A projector, a small MLP, maps patch embeddings into the LLM's embedding space and inserts them as tokens, as in LLaVA: simple and strong, but image tokens consume context. Cross-attention layers inside the LLM attend to image features, often after a resampler compresses them to a few dozen tokens, as in Flamingo: keeps context short but needs more training. Native multimodal models tokenize images and train on interleaved data from the start, so one model reads, and can produce, both modalities.

    For video, the same encoders run on sampled frames, tokens are compressed over time by pooling or merging, and temporal positions are added so the model can reason about order and motion.
