- id: explain-streaming-tts-chunking-and-jitter-buffer-sizing
  q: Explain streaming TTS chunking and jitter-buffer sizing.
  a: |
    Chunking: split the LLM's streamed text at natural boundaries such as clauses or sentences, with a minimum length so prosody sounds natural, and send each chunk to TTS as soon as it is ready; smaller chunks reduce time to first audio but can sound choppy.

    The jitter buffer holds a little audio before playback so network or generation delays do not cause gaps. Size it from the variance of chunk arrival times: too small and audio stutters, too large and latency grows. Adaptive buffers that grow when jitter rises and shrink when it is stable balance the two.
