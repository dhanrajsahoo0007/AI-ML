- id: how-do-you-evaluate-asr-quality-beyond-wer-and-tts-quality-w
  q: >-
    How do you evaluate ASR quality beyond WER, and TTS quality when there is no single correct
    output?
  a: >
    For ASR, go beyond WER with entity and keyword error rates for critical terms such as names,
    numbers and medications, error rates by accent, noise level and domain, punctuation and
    formatting accuracy, streaming latency and stability of partial results, and task-level impact,
    such as whether the downstream answer or note was correct.


    For TTS, use human listening tests, such as mean opinion scores or side-by-side preferences with
    clear criteria, plus automatic proxies: intelligibility by transcribing the output with ASR,
    speaker similarity, prosody and pronunciation checks on hard text such as numbers and names, and
    latency. Targeted test sets catch normalization errors.
  topic: multimodal
  level: Senior
  companies:
    - ElevenLabs
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: how-do-you-handle-code-switching-and-accents-in-a-production
  q: How do you handle code-switching and accents in a production ASR system?
  a: >
    Train or fine-tune on audio that matches real users: many accents, recording conditions and
    natural code-switched speech, with transcription conventions that allow mixed languages and
    scripts in one utterance. Avoid forcing a single language per utterance; use multilingual
    tokenizers and models that can switch mid-sentence.


    Add language-aware decoding and contextual biasing for domain terms, test separately on each
    accent and code-mixing pattern, collect failure examples from production with consent, and
    retrain regularly. Measure WER and critical-term accuracy per segment, not just overall.
  topic: multimodal
  level: Senior
  companies:
    - Abridge
    - Sarvam AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: explain-streaming-tts-chunking-and-jitter-buffer-sizing
  q: Explain streaming TTS chunking and jitter-buffer sizing.
  a: >
    Chunking: split the LLM's streamed text at natural boundaries such as clauses or sentences, with
    a minimum length so prosody sounds natural, and send each chunk to TTS as soon as it is ready;
    smaller chunks reduce time to first audio but can sound choppy.


    The jitter buffer holds a little audio before playback so network or generation delays do not
    cause gaps. Size it from the variance of chunk arrival times: too small and audio stutters, too
    large and latency grows. Adaptive buffers that grow when jitter rises and shrink when it is
    stable balance the two.
  topic: multimodal
  level: Senior
  companies:
