- id: bulbul-style-tts-has-to-speak-code-mixed-mixed-script-text-n
  q: Bulbul-style TTS has to speak code-mixed, mixed-script text naturally. What are the hard parts of text normalization and prosody for Indian-language TTS?
  a: |
    Text normalization must detect which language each word belongs to, even when English words are written in Devanagari or Hindi words in Latin script, then expand numbers, dates, currency, abbreviations and units in the right language and convention, such as lakh and crore. Transliteration and pronunciation for out-of-vocabulary names is hard.

    Prosody must sound like a natural bilingual speaker: consistent voice across language switches, correct stress and intonation for each language, and natural rhythm at switch points, rather than switching to a different-sounding voice mid-sentence. Training on real code-mixed speech and evaluating with native listeners are essential.
