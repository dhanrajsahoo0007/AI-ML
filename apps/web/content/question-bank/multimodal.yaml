- id: our-audio-is-a-clinic-room-two-or-three-speakers-background
  q: "Our audio is a clinic room: two or three speakers, background noise, accents, and a vocabulary full of drug names. How would you build and improve the ASR for that?"
  a: |
    Start with a strong multilingual ASR model and fine-tune it on de-identified clinic recordings with accurate transcripts covering many accents, specialties and room conditions. Add diarization tuned for clinical conversations, noise-robust front-end processing, and contextual biasing with medical vocabularies and the patient's chart, used carefully.

    Improve continuously: measure WER and, more importantly, error rates on medications, doses and clinical terms by specialty and accent, mine clinician corrections as training signal with consent, and evaluate downstream note accuracy rather than transcription alone.
