- id: what-changes-when-you-move-from-images-to-video
  q: What changes when you move from images to video?
  a: >
    Token counts explode: even a few frames per second over a minute yields thousands of frames, so
    you need frame sampling, temporal pooling, token merging and smaller per-frame budgets. The
    model must understand time: order, motion, cause and effect, so temporal position encodings and
    training on video-text data matter.


    Practical issues grow too: long-context cost, audio and transcript alignment, choosing which
    moments to look at closely, and evaluation of temporal reasoning rather than single-frame
    recognition.
  topic: multimodal
  level: Mid
  companies:
    - Meta
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: budget-the-latency-for-a-real-time-voice-agent-vad-asr-llm-t
  q: >-
    Budget the latency for a real-time voice agent: VAD, ASR, LLM, TTS, network. Where does the time
    go?
  a: >
    A typical budget: endpointing after the user stops, 200–500 ms; streaming ASR finalization,
    50–200 ms; LLM time to first token, 200–600 ms; TTS time to first audio, 100–300 ms; network and
    audio buffering, 50–150 ms each way. That totals about 0.7–1.5 seconds, and good systems aim for
    under a second.


    Most time goes to endpointing and the LLM. Cut it with semantic turn detection instead of fixed
    silence timeouts, streaming everything, a fast model for the first response, speakable chunking
    so TTS starts on the first clause, co-located services, and pre-generated filler or
    acknowledgments for long operations.


    Time to first audio is a different problem from an LLM's time to first token: speech needs at
    least a phrase of text to sound natural, the TTS model needs context for prosody, and playback
    can only start once audio can keep streaming faster than real time without gaps. So text
    chunking, TTS start-up latency and buffering matter as much as LLM speed.
  topic: multimodal
