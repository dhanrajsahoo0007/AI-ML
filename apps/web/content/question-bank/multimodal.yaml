- id: how-would-you-design-the-neural-network-architecture-for-mul
  q: How would you design the neural network architecture for multi-camera 3D object detection without lidar?
  a: |
    Encode each camera image with a shared backbone, then lift image features into a unified 3D or bird's-eye-view representation, either by predicting depth distributions and projecting features, or with transformer queries in BEV space that attend to image features using camera geometry. Fuse across time by aligning previous BEV features with ego-motion.

    Detection heads then predict 3D boxes, velocities and attributes in BEV. Train with lidar-derived or auto-labeled 3D ground truth, and evaluate depth accuracy especially at long range, since camera-only depth is the main weakness.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Tesla
