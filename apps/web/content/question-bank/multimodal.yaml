- id: you-ship-a-policy-to-300-robots-it-works-in-the-lab-and-degr
  q: You ship a policy to 300 robots. It works in the lab and degrades in the field. Debug it.
  a: |
    It is likely distribution shift between lab and field: lighting, backgrounds, object variety, wear and calibration differences between robots, latency and compute differences, or people and clutter not seen in the lab. Use fleet telemetry to find where failures cluster: specific robots, sites, times, tasks or objects.

    Replay field logs in simulation or offline evaluation, compare sensor and action statistics with lab data, and check calibration and firmware versions. Fix by collecting targeted field data and retraining, adding domain randomization, recalibrating, and rolling out fixes gradually with monitoring per site.
