- id: qwen2-5-vl-uses-a-native-dynamic-resolution-vit-with-window
  q: Qwen2.5-VL uses a native dynamic-resolution ViT with window attention and multimodal RoPE. Why native resolution instead of fixed tiling, and what does MRoPE encode?
  a: |
    Fixed tiling resizes or cuts images into fixed-size tiles, which distorts aspect ratios, wastes tokens on small images and loses detail on large or text-heavy ones. Native dynamic resolution processes images at roughly their real size and aspect ratio, so token count scales with content, and window attention in the ViT keeps the cost of large images manageable.

    Multimodal RoPE splits rotary position encoding into components for time, height and width, so each visual token carries its 2D position in the image, and, for video, its time step aligned to real time. This helps with spatial grounding, reading layouts and temporal reasoning.
