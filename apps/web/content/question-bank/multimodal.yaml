- id: whisper-transcribes-hinglish-poorly-often-forcing-output-int
  q: >-
    Whisper transcribes Hinglish poorly, often forcing output into one language or hallucinating.
    Why, and how would you build an ASR that handles code-mixed speech?
  a: >
    Whisper's training data has relatively little natural code-mixed Hindi-English, and its decoding
    conditions on a single language token per segment, so it tends to force output into one language
    or translate. When uncertain, its autoregressive decoder can hallucinate fluent text that was
    never spoken, especially on noisy or low-resource audio.


    Build a code-mixed ASR by collecting and transcribing real Hinglish speech with consistent
    conventions (for example English words in Latin script and Hindi in Devanagari, or a chosen
    romanization), fine-tuning a multilingual model with mixed-language targets, using a tokenizer
    that covers both scripts, adding language-model or contextual biasing for common mixed phrases,
    and suppressing hallucination with VAD and confidence checks.
  topic: multimodal
  level: Senior
  companies:
    - Sarvam AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: bulbul-style-tts-has-to-speak-code-mixed-mixed-script-text-n
  q: >-
    Bulbul-style TTS has to speak code-mixed, mixed-script text naturally. What are the hard parts
    of text normalization and prosody for Indian-language TTS?
  a: >
    Text normalization must detect which language each word belongs to, even when English words are
    written in Devanagari or Hindi words in Latin script, then expand numbers, dates, currency,
    abbreviations and units in the right language and convention, such as lakh and crore.
    Transliteration and pronunciation for out-of-vocabulary names is hard.


    Prosody must sound like a natural bilingual speaker: consistent voice across language switches,
    correct stress and intonation for each language, and natural rhythm at switch points, rather
    than switching to a different-sounding voice mid-sentence. Training on real code-mixed speech
    and evaluating with native listeners are essential.
  topic: multimodal
  level: Senior
  companies:
    - Sarvam AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: how-would-you-fuse-camera-radar-and-imu-inputs-into-a-single
  q: >-
    How would you fuse camera, radar and IMU inputs into a single perception stack, and where would
    you fuse them?
  a: >
    The IMU feeds ego-motion estimation and time alignment of all sensors, so other measurements are
    compensated for the vehicle's movement. Cameras give rich semantics, radar gives direct range
    and velocity robust to weather, and fusion can be early (raw data combined), mid (learned
    features combined, often in a bird's-eye-view space) or late (separate detections combined).


    Mid-level fusion in a shared bird's-eye-view representation is common for learned perception,
    because it keeps rich information while handling different sensor geometries. Add temporal
    fusion across frames, careful calibration and time synchronization, and graceful degradation
    when a sensor fails.
  topic: multimodal
  level: Senior
  companies:
    - Tesla
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: your-chat-agent-is-moving-to-the-phone-what-actually-changes
  q: Your chat agent is moving to the phone. What actually changes?
  a: >
    Latency becomes critical, because silence on a call feels broken, so every stage needs streaming
    and a sub-second budget. Turn-taking, interruptions, background noise, accents and phone-quality
    audio all affect understanding, and ASR errors flow into the LLM.


    Responses must be short and spoken-friendly, with no markdown, lists or links, and spelled-out
    numbers and confirmations for important details such as dates and amounts. Authentication,
    transfers to humans, call recording consent and telephony integration add new requirements, and
    evaluation needs simulated calls with audio, not just text.
  topic: multimodal
  level: Mid
  companies:
    - Sierra
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
