- id: budget-the-latency-for-a-real-time-voice-agent-vad-asr-llm-t
  q: "Budget the latency for a real-time voice agent: VAD, ASR, LLM, TTS, network. Where does the time go?"
  a: |
    A typical budget: endpointing after the user stops, 200–500 ms; streaming ASR finalization, 50–200 ms; LLM time to first token, 200–600 ms; TTS time to first audio, 100–300 ms; network and audio buffering, 50–150 ms each way. That totals about 0.7–1.5 seconds, and good systems aim for under a second.

    Most time goes to endpointing and the LLM. Cut it with semantic turn detection instead of fixed silence timeouts, streaming everything, a fast model for the first response, speakable chunking so TTS starts on the first clause, co-located services, and pre-generated filler or acknowledgments for long operations.

    Time to first audio is a different problem from an LLM's time to first token: speech needs at least a phrase of text to sound natural, the TTS model needs context for prosody, and playback can only start once audio can keep streaming faster than real time without gaps. So text chunking, TTS start-up latency and buffering matter as much as LLM speed.
