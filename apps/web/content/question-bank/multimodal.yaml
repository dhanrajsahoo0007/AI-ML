- id: text-normalisation-is-where-tts-quality-actually-dies-in-pro
  q: Text normalisation is where TTS quality actually dies in production. Walk me through it.
  a: |
    Real text is full of things that must be expanded before speaking: numbers that can be years, amounts, phone numbers or ordinals; dates and times in many formats; currencies and units; abbreviations and acronyms that may be spelled out or pronounced as words; URLs, emails and symbols; and names and foreign words. Each depends on context and locale, and a wrong guess is very audible.

    Production systems combine rule-based normalizers with learned models for ambiguous cases, use an LLM to rewrite text into a speakable form for complex inputs, maintain custom pronunciation dictionaries per customer, and test with large suites of tricky inputs per language.
