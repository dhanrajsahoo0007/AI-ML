- id: build-a-voice-activity-detector-from-scratch-how-do-you-make
  q: Build a Voice Activity Detector from scratch. How do you make it robust for phone-quality Indian-language audio?
  a: |
    Compute short-frame features such as log-mel spectrograms, train a small neural classifier (a compact CNN or recurrent network) to label each frame as speech or not, and smooth decisions with hangover and minimum-duration rules to avoid flicker. Keep it tiny so it runs in real time on cheap hardware.

    For phone-quality Indian-language audio, train on narrowband 8 kHz telephone audio, many languages and dialects, and realistic noise such as traffic, crowds, TV and fans, with augmentation for codecs, packet loss and low volume. Tune thresholds on held-out real calls, and measure missed speech and false triggers separately.
