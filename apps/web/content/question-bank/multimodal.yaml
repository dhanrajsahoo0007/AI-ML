- id: how-would-you-build-multimodal-retrieval-over-images-video-a
  q: How would you build multimodal retrieval over images, video and text in one index?
  a: |
    Use a shared embedding space, such as a CLIP-style model for images and text, applied to video keyframes, plus text derived from media: captions from a vision-language model, OCR and speech transcripts. Index every item, image, video segment and text chunk, in one vector index with metadata for type, source, timestamps and permissions.

    At query time, embed the text or image query, search the index with hybrid text search over captions and transcripts, and re-rank with a multimodal model. Return video results as timestamped segments, and evaluate recall per modality and query type.
