- id: text-normalisation-is-where-tts-quality-actually-dies-in-pro
  q: Text normalisation is where TTS quality actually dies in production. Walk me through it.
  a: >
    Real text is full of things that must be expanded before speaking: numbers that can be years,
    amounts, phone numbers or ordinals; dates and times in many formats; currencies and units;
    abbreviations and acronyms that may be spelled out or pronounced as words; URLs, emails and
    symbols; and names and foreign words. Each depends on context and locale, and a wrong guess is
    very audible.


    Production systems combine rule-based normalizers with learned models for ambiguous cases, use
    an LLM to rewrite text into a speakable form for complex inputs, maintain custom pronunciation
    dictionaries per customer, and test with large suites of tricky inputs per language.
  topic: multimodal
  level: Senior
  companies:
    - ElevenLabs
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-the-dubbing-pipeline-an-english-video-becomes-spanish
  q: "Design the dubbing pipeline: an English video becomes Spanish, same speakers, same timing."
  a: >
    Separate the dialogue from music and effects, transcribe with timestamps and diarize speakers,
    and translate with timing constraints so each Spanish line fits the original segment length,
    adjusting phrasing rather than only speed. Clone each speaker's voice, with consent, and
    synthesize Spanish speech that matches their emotion and pacing.


    Align timing to the original segments, optionally adjust lip sync, then remix with the
    background track. Add human review for translation quality and timing, and evaluate naturalness,
    speaker similarity, sync and translation accuracy.
  topic: multimodal
  level: Senior
  companies:
    - ElevenLabs
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: our-audio-is-a-clinic-room-two-or-three-speakers-background
  q: >-
    Our audio is a clinic room: two or three speakers, background noise, accents, and a vocabulary
    full of drug names. How would you build and improve the ASR for that?
  a: >
    Start with a strong multilingual ASR model and fine-tune it on de-identified clinic recordings
    with accurate transcripts covering many accents, specialties and room conditions. Add
    diarization tuned for clinical conversations, noise-robust front-end processing, and contextual
    biasing with medical vocabularies and the patient's chart, used carefully.


    Improve continuously: measure WER and, more importantly, error rates on medications, doses and
    clinical terms by specialty and accent, mine clinician corrections as training signal with
    consent, and evaluate downstream note accuracy rather than transcription alone.
  topic: multimodal
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: what-is-a-vision-language-action-model-and-how-is-it-differe
  q: What is a vision-language-action model, and how is it different from an LLM with tools?
  a: >
    A vision-language-action model takes camera images and a language instruction and directly
    outputs robot actions, such as joint or end-effector commands, often at high frequency. It is
    trained on robot demonstrations, usually starting from a pre-trained vision-language model so it
    inherits visual and semantic knowledge.


    An LLM with tools plans in language and calls predefined skills or APIs, such as "pick up the
    cup", relying on separate controllers to execute them. A VLA learns the low-level control
    itself, which handles continuous, contact-rich manipulation and novel objects better, but needs
    large amounts of robot data and careful safety layers.
  topic: multimodal
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: helix-splits-into-a-large-slow-model-and-a-small-fast-one-wh
  q: >-
    Helix splits into a large slow model and a small fast one. Why not run a single end-to-end
    network?
  a: >
    A large vision-language model provides scene understanding and language grounding but can only
    run a few times per second on onboard compute. Whole-body control needs much faster updates for
    balance, contact and smooth motion. Splitting lets the slow model produce a high-level latent
    plan or goal, and a small fast policy turns it, together with current sensor data, into actions
    at high frequency.


    A single end-to-end network would have to be either small enough to run fast, losing
    understanding, or large and too slow for control. The split mirrors fast and slow thinking:
    deliberate understanding at low rate, reflexive control at high rate.
  topic: multimodal
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: explain-action-chunking-why-predict-a-sequence-of-future-act
  q: Explain action chunking. Why predict a sequence of future actions instead of the next one?
  a: >
    Action chunking has the policy predict the next several actions at once and execute them, often
    re-predicting frequently and blending overlapping chunks, as in ACT. Predicting single actions
    makes errors compound step by step and produces jittery motion, and human demonstrations contain
    pauses and multi-step patterns that single-step prediction models poorly.


    Chunks capture temporally consistent motions, reduce the effective decision horizon, cope better
    with non-Markovian demonstration behavior, and let a slower model drive a fast controller. The
    trade-off is slower reaction to surprises within a chunk, which frequent re-planning and
    blending mitigate.
  topic: multimodal
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: why-carry-lidar-radar-and-cameras-rather-than-cameras-alone
  q: Why carry lidar, radar and cameras rather than cameras alone? Where would you fuse them?
  a: >
    Each sensor fails differently. Cameras give rich color and semantics but estimate depth
    indirectly and struggle in glare, darkness and bad weather. Lidar gives precise 3D geometry day
    and night. Radar measures range and relative velocity directly and works through rain, fog and
    dust. Redundancy across different physics makes the system robust to any single sensor's failure
    modes, which is central to a safety case.


    Fuse them at the learned feature level in a shared bird's-eye-view or 3D representation so the
    model can combine strengths, with late-fusion checks as an independent safety layer, careful
    calibration and time sync, and the ability to keep driving safely, or stop, when one sensor
    degrades.
  topic: multimodal
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
