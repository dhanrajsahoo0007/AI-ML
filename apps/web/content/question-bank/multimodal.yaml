- id: how-do-you-handle-extreme-class-imbalance-in-rare-event-dete
  q: How do you handle extreme class imbalance in rare-event detection (e.g. a child running into the road)?
  a: |
    Mine and upweight the rare cases: fleet triggers and similarity search to find more examples, targeted data collection, simulation and synthetic data for dangerous scenarios, and oversampling or loss weighting such as focal loss during training.

    Evaluate on curated rare-event test sets with recall at very low false-positive rates, never on overall accuracy, set thresholds by safety requirements, and add redundancy with other sensors or models. Safety-critical recall matters more than average metrics.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Tesla
  source: outcome-school
- id: explain-how-you-would-auto-label-a-fleet-dataset-and-what-qu
  q: Explain how you would auto-label a fleet dataset and what quality controls you would put on it.
  a: |
    Use large offline models that would be too slow for the car, with access to the full clip including the future, multiple sensors and multiple passes, to produce high-quality labels such as 3D boxes and tracks. Combine model ensembles, temporal consistency and geometric constraints to refine labels.

    Quality controls: compare against human-labeled audit samples, measure label accuracy by class and distance, flag low-confidence or inconsistent labels for human review, monitor how label changes affect trained models, and version labeling pipelines so issues can be traced and fixed.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Tesla
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: how-would-you-detect-and-handle-distribution-shift-between-f
  q: How would you detect and handle distribution shift between fleet data and your training set?
  a: |
    Detect: compare feature and embedding distributions between fleet data and the training set, monitor model confidence and disagreement between models on fleet data, and track performance on freshly labeled samples by region, weather, time and vehicle type.

    Handle: collect and label data from under-represented conditions, rebalance training sets, use domain adaptation or augmentation for known shifts such as weather or camera changes, and add the new conditions to evaluation suites so regressions are caught.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Tesla
  related: /ai-system-design/genai-system-design/drift-detection
  source: outcome-school
- id: behaviour-cloning-on-teleoperation-data-has-a-well-known-fai
  q: Behaviour cloning on teleoperation data has a well-known failure mode. What is it, and what do you do about it on a real humanoid?
  a: |
    Compounding errors from covariate shift: the policy only saw states along expert trajectories, so small mistakes take it into states never seen in training, where it makes bigger mistakes and drifts further off.

    On a real humanoid, collect demonstrations that include recoveries from perturbed states, use interactive corrections such as DAgger-style data where operators take over when the policy drifts, use action chunking and diverse data to make policies more robust, and add RL fine-tuning or safety controllers to handle deviations.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: a-whole-body-controller-trained-entirely-in-simulation-has-t
  q: A whole-body controller trained entirely in simulation has to run on real hardware. What transfers, what does not, and how do you close the gap?
  a: |
    Gross dynamics and learned behaviors such as balance strategies often transfer if simulation is reasonably accurate. What does not transfer well: exact friction and contact behavior, actuator dynamics and delays, sensor noise, latency, and mass and calibration differences between the model and the real robot.

    Close the gap with domain randomization of physics parameters, accurate actuator models learned from real data, system identification, adding real latency and noise in simulation, observation designs that avoid simulator-specific signals, and fine-tuning or adaptation on real hardware with safety limits.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: where-does-reinforcement-learning-fit-on-top-of-imitation-le
  q: Where does reinforcement learning fit on top of imitation learning for manipulation, and what makes the reward the hard part?
  a: |
    Imitation learning gets a policy to roughly competent behavior from demonstrations; RL then improves it beyond the demonstrations: higher success rates, faster or more robust execution, and recovery from situations demonstrations did not cover, usually in simulation or with careful real-world fine-tuning.

    The reward is hard because manipulation success is hard to measure automatically in the real world (did the object end up correctly placed?), sparse rewards make learning slow, and dense shaped rewards are easy for the policy to exploit. Solutions include learned reward models from success labels, vision-based success detectors, and simulation where success can be computed exactly.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  source: outcome-school
- id: modular-perception-prediction-and-planning-or-end-to-end-lea
  q: Modular perception, prediction and planning, or end-to-end learned driving? Make the case, then tell me what you would actually build.
  a: |
    Modular stacks are interpretable, testable component by component and easier to validate for safety, but errors compound across interfaces and hand-designed intermediate representations lose information. End-to-end learning optimizes the whole system toward driving outcomes and can exploit richer signals, but is harder to debug, verify and validate for safety cases.

    A practical build is a hybrid: learned components with rich learned interfaces between perception, prediction and planning, trained jointly where possible, plus explicit safety layers, interpretable intermediate outputs for validation and rule-based checks on the final plan.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-the-output-representation-for-a-behaviour-prediction
  q: Design the output representation for a behaviour prediction model. What metrics would you gate it on?
  a: |
    Predict multiple possible future trajectories per agent over a time horizon, each with a probability, to capture multimodal intentions such as turning or going straight, possibly with uncertainty per waypoint, plus interactions between agents through joint predictions for key pairs.

    Gate on metrics such as minimum average and final displacement error across the top-k trajectories, miss rate, probability calibration, and performance on safety-relevant slices such as pedestrians and cut-ins, and finally on closed-loop planning metrics, since prediction quality matters only through how it affects driving.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: where-do-vision-language-models-and-foundation-models-genuin
  q: Where do vision-language models and foundation models genuinely help in an autonomy stack, and where are they a liability?
  a: |
    They help offline and at the edges: auto-labeling and data mining of rare scenarios, semantic understanding of unusual situations such as construction zones or hand signals, scene descriptions for search, simulation generation and long-tail reasoning, and as teachers for smaller onboard models.

    They are a liability in the real-time safety loop if used directly: high latency, heavy compute, non-deterministic outputs, possible hallucinations and difficulty verifying behavior for a safety case. Using them with strict bounds, monitoring and fallbacks, or distilling their knowledge into verifiable onboard models, keeps the benefits.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: how-would-you-fuse-camera-radar-and-imu-inputs-into-a-single
  q: How would you fuse camera, radar and IMU inputs into a single perception stack, and where would you fuse them?
  a: |
    The IMU feeds ego-motion estimation and time alignment of all sensors, so other measurements are compensated for the vehicle's movement. Cameras give rich semantics, radar gives direct range and velocity robust to weather, and fusion can be early (raw data combined), mid (learned features combined, often in a bird's-eye-view space) or late (separate detections combined).

    Mid-level fusion in a shared bird's-eye-view representation is common for learned perception, because it keeps rich information while handling different sensor geometries. Add temporal fusion across frames, careful calibration and time synchronization, and graceful degradation when a sensor fails.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Tesla
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: what-is-a-vision-language-action-model-and-how-is-it-differe
  q: What is a vision-language-action model, and how is it different from an LLM with tools?
  a: |
    A vision-language-action model takes camera images and a language instruction and directly outputs robot actions, such as joint or end-effector commands, often at high frequency. It is trained on robot demonstrations, usually starting from a pre-trained vision-language model so it inherits visual and semantic knowledge.

    An LLM with tools plans in language and calls predefined skills or APIs, such as "pick up the cup", relying on separate controllers to execute them. A VLA learns the low-level control itself, which handles continuous, contact-rich manipulation and novel objects better, but needs large amounts of robot data and careful safety layers.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: helix-splits-into-a-large-slow-model-and-a-small-fast-one-wh
  q: Helix splits into a large slow model and a small fast one. Why not run a single end-to-end network?
  a: |
    A large vision-language model provides scene understanding and language grounding but can only run a few times per second on onboard compute. Whole-body control needs much faster updates for balance, contact and smooth motion. Splitting lets the slow model produce a high-level latent plan or goal, and a small fast policy turns it, together with current sensor data, into actions at high frequency.

    A single end-to-end network would have to be either small enough to run fast, losing understanding, or large and too slow for control. The split mirrors fast and slow thinking: deliberate understanding at low rate, reflexive control at high rate.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: explain-action-chunking-why-predict-a-sequence-of-future-act
  q: Explain action chunking. Why predict a sequence of future actions instead of the next one?
  a: |
    Action chunking has the policy predict the next several actions at once and execute them, often re-predicting frequently and blending overlapping chunks, as in ACT. Predicting single actions makes errors compound step by step and produces jittery motion, and human demonstrations contain pauses and multi-step patterns that single-step prediction models poorly.

    Chunks capture temporally consistent motions, reduce the effective decision horizon, cope better with non-Markovian demonstration behavior, and let a slower model drive a fast controller. The trade-off is slower reaction to surprises within a chunk, which frequent re-planning and blending mitigate.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: why-carry-lidar-radar-and-cameras-rather-than-cameras-alone
  q: Why carry lidar, radar and cameras rather than cameras alone? Where would you fuse them?
  a: |
    Each sensor fails differently. Cameras give rich color and semantics but estimate depth indirectly and struggle in glare, darkness and bad weather. Lidar gives precise 3D geometry day and night. Radar measures range and relative velocity directly and works through rain, fog and dust. Redundancy across different physics makes the system robust to any single sensor's failure modes, which is central to a safety case.

    Fuse them at the learned feature level in a shared bird's-eye-view or 3D representation so the model can combine strengths, with late-fusion checks as an independent safety layer, careful calibration and time sync, and the ability to keep driving safely, or stop, when one sensor degrades.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-the-safety-architecture-for-a-learned-whole-body-poli
  q: Design the safety architecture for a learned whole-body policy operating near people.
  a: |
    Never rely on the learned policy alone. Wrap it with independent safety layers: hardware limits on force, speed and torque; a certified safety controller that monitors joint states and can trigger protective stops; perception-based separation monitoring that slows or stops the robot when people come close; and safe-state behaviors when the policy is uncertain or sensors fail.

    Validate in simulation and controlled tests before deployment near people, follow relevant safety standards, log everything for incident analysis, and limit the policy's operating envelope until evidence supports expanding it.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-the-data-engine-fleet-triggers-upload-labelling-retra
  q: "Design the data engine: fleet triggers → upload → labelling → retraining → shadow-mode validation → release."
  a: |
    Vehicles run triggers that detect interesting situations: model uncertainty, disagreement between models, driver interventions, rare object classes, specific scenario queries. Matching clips are uploaded under bandwidth budgets, auto-labeled with large offline models and human review for hard cases, and added to curated training sets, balanced toward weak areas.

    Retrained models are evaluated on regression suites and scenario sets, run in shadow mode in the fleet to compare predictions without controlling the car, and released gradually when metrics improve. The loop repeats, targeting the next weakness.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Tesla
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-the-teleoperation-data-pipeline-why-is-data-collectio
  q: Design the teleoperation data pipeline. Why is data collection the bottleneck in robotics rather than compute?
  a: |
    Operators control robots through teleoperation rigs, recording synchronized camera streams, joint states, actions and task metadata. Data flows through upload, validation of synchronization and completeness, quality scoring, annotation of success and segments, and into versioned datasets for training.

    Data is the bottleneck because, unlike text and images, there is no internet-scale corpus of robot actions: every demonstration costs real robot time and human operator time, scales linearly with effort, and must cover many objects, environments and failure recoveries. Compute is comparatively easy to buy.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: you-have-10-hours-of-demonstrations-for-a-new-task-and-budge
  q: You have 10 hours of demonstrations for a new task and budget for 50 more. How do you decide what to collect, and what return do you expect?
  a: |
    Train on the existing 10 hours and evaluate to find where the policy fails: specific object variations, positions, lighting or recovery situations. Collect the next 50 hours targeted at those failure modes and at diversity, rather than more of what already works, including recovery demonstrations from imperfect states.

    Expect diminishing returns: success rate typically rises steeply at first and then flattens, so measure after each batch and stop or redirect collection when gains slow.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: you-have-hundreds-of-millions-of-fleet-miles-how-do-you-find
  q: You have hundreds of millions of fleet miles. How do you find and use the rare scenarios that matter?
  a: |
    Mine logs with automated triggers and queries: model uncertainty and disagreement, interventions, hard braking, near-misses, rare object classes, and embedding-based similarity search for scenarios like a known rare case. Index scenarios by structured attributes and learned embeddings so they can be searched.

    Use found scenarios to build targeted training sets, evaluation suites and simulation variants that multiply each rare case into many perturbations. Track coverage of the scenario taxonomy over time.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-a-system-that-finds-driving-segments-similar-to-a-giv
  q: Design a system that finds driving segments similar to a given one across the entire fleet archive.
  a: |
    Encode each driving segment into embeddings from sensor data and scene representations, such as agent trajectories, map context and camera features, using a model trained so similar scenarios are close. Store embeddings in a large-scale ANN index with metadata such as location, time, weather and road type.

    Queries embed the given segment and search the index with metadata filters, then re-rank with finer-grained comparisons of trajectories and interactions. Evaluate with labeled scenario pairs and user feedback from engineers.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/vector-databases
  source: outcome-school
- id: you-are-opening-in-a-new-city-structure-the-safety-case
  q: You are opening in a new city. Structure the safety case.
  a: |
    Define the operational design domain for the city: roads, speeds, weather, traffic rules and unique features. Show the system handles it: map and validate the area, collect data on local behaviors, run simulation with city-specific scenarios, do closed-course and supervised testing, and compare safety metrics against human-driver baselines for that area.

    Structure the argument: hazards identified, mitigations, evidence for each, residual risks and monitoring after launch, with staged rollout from supervised driving to limited driverless service, and engagement with local regulators and first responders.
  level: Senior
  category: multimodal
  subcategory: robotics-av
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
