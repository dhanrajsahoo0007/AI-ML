- id: design-the-dubbing-pipeline-an-english-video-becomes-spanish
  q: "Design the dubbing pipeline: an English video becomes Spanish, same speakers, same timing."
  a: |
    Separate the dialogue from music and effects, transcribe with timestamps and diarize speakers, and translate with timing constraints so each Spanish line fits the original segment length, adjusting phrasing rather than only speed. Clone each speaker's voice, with consent, and synthesize Spanish speech that matches their emotion and pacing.

    Align timing to the original segments, optionally adjust lip sync, then remix with the background track. Add human review for translation quality and timing, and evaluate naturalness, speaker similarity, sync and translation accuracy.
