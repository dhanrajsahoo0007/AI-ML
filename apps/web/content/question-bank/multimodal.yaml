- id: disengagement-rate-is-a-weak-safety-proxy-how-would-you-actu
  q: Disengagement rate is a weak safety proxy. How would you actually measure whether the Driver is safe enough to ship?
  a: |
    Disengagement rate depends on driver behavior, routes and policies, and does not capture how severe events would have been. Measure safety through a combination: collisions and near-misses by severity per mile, compared with human-driver baselines in the same areas and conditions; counterfactual simulation of disengagement events to see whether a crash would have occurred; and large scenario-based simulation suites covering rare dangerous situations.

    Add structured scenario testing on closed courses, analysis by operating domain (weather, road type, time of day), and statistical confidence about rare events, which needs very large mileage or strong simulation. Combine it all into a safety case argued before release.
