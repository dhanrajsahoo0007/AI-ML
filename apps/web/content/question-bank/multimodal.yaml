- id: cascaded-asr-llm-tts-versus-native-speech-to-speech-argue-bo
  q: "Cascaded ASR+LLM+TTS versus native speech-to-speech: argue both sides."
  a: >
    Cascaded: each component can be chosen, upgraded and evaluated separately; transcripts give
    logs, compliance records and easy debugging; any text LLM with tools and retrieval can be used;
    text normalization and safety filters are straightforward. Downsides are added latency from
    three stages and loss of tone, emotion and timing in the text bottleneck.


    Native speech-to-speech: lower latency, natural turn-taking, and preserved prosody, emotion and
    non-verbal cues, which makes conversations feel human. Downsides are less control and
    transparency, harder evaluation and safety filtering, weaker tool use in some models, and fewer
    choices of model. Enterprises with compliance needs lean cascaded; expressive consumer
    companions lean native, and hybrids are common.
  topic: multimodal
  level: Senior
  companies:
