- id: how-do-you-evaluate-a-manipulation-policy-when-every-trial-c
  q: How do you evaluate a manipulation policy when every trial costs robot time and every failure has physical consequences?
  a: |
    Do most evaluation in simulation and on offline data first: validate on held-out demonstrations, use simulation with domain randomization to screen candidates, and only promote promising policies to real robots. Choose a fixed, representative set of physical test scenarios with clear success criteria.

    For real trials, use safety-limited settings (speed, force limits, protective setups), allocate trials efficiently with statistical stopping rules, record everything for analysis, and track failure modes, not just success rate. Correlate simulation results with real results over time to learn how far simulation can be trusted.
