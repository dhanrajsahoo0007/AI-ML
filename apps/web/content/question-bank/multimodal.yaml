- id: how-do-you-evaluate-asr-quality-beyond-wer-and-tts-quality-w
  q: How do you evaluate ASR quality beyond WER, and TTS quality when there is no single correct output?
  a: |
    For ASR, go beyond WER with entity and keyword error rates for critical terms such as names, numbers and medications, error rates by accent, noise level and domain, punctuation and formatting accuracy, streaming latency and stability of partial results, and task-level impact, such as whether the downstream answer or note was correct.

    For TTS, use human listening tests, such as mean opinion scores or side-by-side preferences with clear criteria, plus automatic proxies: intelligibility by transcribing the output with ASR, speaker similarity, prosody and pronunciation checks on hard text such as numbers and names, and latency. Targeted test sets catch normalization errors.
