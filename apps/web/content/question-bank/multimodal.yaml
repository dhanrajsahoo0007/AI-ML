- id: what-changes-when-you-move-from-images-to-video
  q: What changes when you move from images to video?
  a: |
    Token counts explode: even a few frames per second over a minute yields thousands of frames, so you need frame sampling, temporal pooling, token merging and smaller per-frame budgets. The model must understand time: order, motion, cause and effect, so temporal position encodings and training on video-text data matter.

    Practical issues grow too: long-context cost, audio and transcript alignment, choosing which moments to look at closely, and evaluation of temporal reasoning rather than single-frame recognition.
