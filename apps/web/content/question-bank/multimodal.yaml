- id: how-do-you-build-a-simulator-you-would-trust-to-gate-a-relea
  q: How do you build a simulator you would trust to gate a release?
  a: |
    Validate it against reality: replay logged real-world drives and check that the simulated sensors, other agents and vehicle dynamics reproduce what actually happened, and measure how well simulated outcomes predict real outcomes for past releases. Model other road users realistically with learned behavior models, including reactive responses.

    Cover the scenario space with logged scenarios, mutations of them and synthetic rare events, track the simulator's known gaps, and use it as one of several gates alongside closed-course and limited road testing. Trust grows when simulation results consistently predict real-world performance.
