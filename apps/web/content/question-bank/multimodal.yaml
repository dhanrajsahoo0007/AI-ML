- id: two-days-before-a-release-decision-simulation-shows-a-15-inc
  q: Two days before a release decision, simulation shows a 15% increase in hard-braking events in one scenario cluster. Walk me through what you do.
  a: |
    Treat it as real until shown otherwise. Inspect the scenarios: are the hard brakes justified responses to genuine hazards, or unnecessary braking that creates rear-end risk? Check whether the change is statistically significant and whether that cluster matters for the operating domain.

    Trace it to the code or model change responsible, reproduce on logged real-world data, and assess risk with safety engineers. If the cause is understood and benign, document it; if not, delay the release or ship without that change, rather than letting the deadline decide.
