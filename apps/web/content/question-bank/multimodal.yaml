- id: your-chat-agent-is-moving-to-the-phone-what-actually-changes
  q: Your chat agent is moving to the phone. What actually changes?
  a: |
    Latency becomes critical, because silence on a call feels broken, so every stage needs streaming and a sub-second budget. Turn-taking, interruptions, background noise, accents and phone-quality audio all affect understanding, and ASR errors flow into the LLM.

    Responses must be short and spoken-friendly, with no markdown, lists or links, and spelled-out numbers and confirmations for important details such as dates and amounts. Authentication, transfers to humans, call recording consent and telephony integration add new requirements, and evaluation needs simulated calls with audio, not just text.
