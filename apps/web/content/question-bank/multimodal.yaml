- id: design-barge-in-interruption-handling-for-a-voice-agent
  q: Design barge-in / interruption handling for a voice agent.
  a: |
    Keep listening while the agent speaks, with echo cancellation so the agent's own voice is not detected as the user. When VAD detects user speech above a threshold for a short window, stop audio playback immediately, cancel in-flight LLM generation and TTS, and start transcribing the new input.

    Handle false triggers such as coughs, background noise and short acknowledgments like "mm-hmm" with a classifier that distinguishes backchannels from real interruptions. Keep track of what the user actually heard before the interruption, so the conversation history reflects only the delivered part of the response.
