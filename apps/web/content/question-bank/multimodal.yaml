- id: how-do-you-handle-code-switching-and-accents-in-a-production
  q: How do you handle code-switching and accents in a production ASR system?
  a: |
    Train or fine-tune on audio that matches real users: many accents, recording conditions and natural code-switched speech, with transcription conventions that allow mixed languages and scripts in one utterance. Avoid forcing a single language per utterance; use multilingual tokenizers and models that can switch mid-sentence.

    Add language-aware decoding and contextual biasing for domain terms, test separately on each accent and code-mixing pattern, collect failure examples from production with consent, and retrain regularly. Measure WER and critical-term accuracy per segment, not just overall.
