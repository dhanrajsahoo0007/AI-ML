- id: whisper-transcribes-hinglish-poorly-often-forcing-output-int
  q: Whisper transcribes Hinglish poorly, often forcing output into one language or hallucinating. Why, and how would you build an ASR that handles code-mixed speech?
  a: |
    Whisper's training data has relatively little natural code-mixed Hindi-English, and its decoding conditions on a single language token per segment, so it tends to force output into one language or translate. When uncertain, its autoregressive decoder can hallucinate fluent text that was never spoken, especially on noisy or low-resource audio.

    Build a code-mixed ASR by collecting and transcribing real Hinglish speech with consistent conventions (for example English words in Latin script and Hindi in Devanagari, or a chosen romanization), fine-tuning a multilingual model with mixed-language targets, using a tokenizer that covers both scripts, adding language-model or contextual biasing for common mixed phrases, and suppressing hallucination with VAD and confidence checks.
