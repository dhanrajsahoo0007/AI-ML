- id: design-a-diarisation-system-and-explain-how-you-attribute-ro
  q: Design a diarisation system and explain how you attribute roles, not just clusters.
  a: >
    Segment speech with VAD, extract speaker embeddings for short windows, and cluster them into
    speakers, handling overlapping speech with models that detect it. End-to-end neural diarization
    models can replace or refine the clustering. Align speaker segments with the ASR words.


    Roles, such as clinician versus patient or agent versus customer, need extra signals: enrolled
    voice profiles for known speakers like the clinician, conversational cues such as who asks
    questions or uses medical terms, channel information in calls, and an LLM pass over the
    transcript to assign roles. Evaluate diarization error rate and role-attribution accuracy
    separately.
  topic: multimodal
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: how-would-you-build-multimodal-retrieval-over-images-video-a
  q: How would you build multimodal retrieval over images, video and text in one index?
  a: >
    Use a shared embedding space, such as a CLIP-style model for images and text, applied to video
    keyframes, plus text derived from media: captions from a vision-language model, OCR and speech
    transcripts. Index every item, image, video segment and text chunk, in one vector index with
    metadata for type, source, timestamps and permissions.


    At query time, embed the text or image query, search the index with hybrid text search over
    captions and transcripts, and re-rank with a multimodal model. Return video results as
    timestamped segments, and evaluate recall per modality and query type.
  topic: multimodal
  level: Senior
