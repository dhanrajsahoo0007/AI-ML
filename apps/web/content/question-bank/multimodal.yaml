- id: design-a-diarisation-system-and-explain-how-you-attribute-ro
  q: Design a diarisation system and explain how you attribute roles, not just clusters.
  a: |
    Segment speech with VAD, extract speaker embeddings for short windows, and cluster them into speakers, handling overlapping speech with models that detect it. End-to-end neural diarization models can replace or refine the clustering. Align speaker segments with the ASR words.

    Roles, such as clinician versus patient or agent versus customer, need extra signals: enrolled voice profiles for known speakers like the clinician, conversational cues such as who asks questions or uses medical terms, channel information in calls, and an LLM pass over the transcript to assign roles. Evaluate diarization error rate and role-attribution accuracy separately.
