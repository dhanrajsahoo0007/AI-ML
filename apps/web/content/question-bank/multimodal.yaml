- id: the-patient-s-chart-already-lists-their-medications-how-woul
  q: The patient's chart already lists their medications. How would you use that to improve transcription of drug names, and how would you keep it from backfiring?
  a: |
    Use contextual biasing: give the speech recognizer, or a post-correction step, the patient's medication list as a boosted vocabulary, so drug names that sound alike are resolved toward medications the patient actually takes, which improves accuracy on hard pharmaceutical terms.

    Keep it from backfiring: only boost, never force a substitution; require acoustic confidence before mapping to a listed drug; flag when the clinician mentions a new or changed medication rather than snapping to the existing list; keep the audio and original transcript as evidence; and measure errors where the bias introduced a wrong drug, since that is a patient-safety risk.
