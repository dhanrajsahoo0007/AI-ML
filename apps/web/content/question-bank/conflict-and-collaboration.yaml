# Conflict resolution, influence without authority, and cross-functional collaboration questions. All answers are written by TokensToScale.
- id: conflict-peer-architectural-deadlock
  q: Tell me about a time you and another senior engineer reached a deadlock over a system design or architectural choice. How did you resolve it?
  level: Senior
  category: conflict-and-collaboration
  subcategory: peer-technical-conflict
  signals:
    - conflict
  topics:
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What interviewers are testing.** Technical disagreements happen every week in healthy engineering teams. Interviewers want to see whether you treat design debates as ego battles ("winning the argument") or as collaborative search problems ("finding which constraint we are weighting differently").

    <KeyIdea>
    Almost every engineering deadlock comes down to one of two things: **unshared facts** (you disagree on how the system will behave under load) or **unranked priorities** (one engineer is optimizing for 6-month extensibility while the other is optimizing for 3-week delivery or operational simplicity).
    </KeyIdea>

    **Four-step resolution pattern:**

    1. **Steelman their proposal first:** State the strongest case for the other engineer's design in writing so they know you understood it.
    2. **Separate facts from values:** If you disagree on a fact (e.g., whether Postgres can handle the write rate), run a 4-hour benchmark instead of arguing for 4 days.
    3. **Make the trade-off matrix explicit:** Put both options in a table scored against agreed criteria (p99 latency, operational toil, migration risk, time to ship).
    4. **Update your own view where they were right:** Point out at least one element of their design that improved the final hybrid solution.
  followUps:
    - q: In hindsight, what part of the other engineer's argument did you initially underestimate?
      level: Senior
      a: |-
        Answering this honestly is a top self-awareness signal. Name a specific operational or edge-case point they raised that proved valid once the system hit production.

- id: conflict-pushback-pm-unrealistic-scope
  q: Tell me about a time you had to push back on a product manager or engineering manager who wanted to ship a feature without essential reliability or security work.
  level: Mid
  category: conflict-and-collaboration
  subcategory: manager-pm-pushback
  signals:
    - conflict
    - influence
  topics:
    - /behavioral/competencies/technical-conflict-and-alignment
    - /behavioral/competencies/tight-deadlines-and-tech-debt
  a: |-
    **What interviewers are testing.** Saying a flat "no, that's unsafe" makes you look obstructive; saying "yes" and shipping an outage shows weak engineering backbone. Strong candidates translate engineering risks into product terms and offer **tiered options**.

    | Approach | How it lands | Result |
    | --- | --- | --- |
    | Flat refusal ("We can't ship without 2 weeks of load testing") | Adversarial; forces an escalation | PM escalates or loses trust |
    | Silent compliance ("Okay, we'll skip idempotency") | Avoids conflict today, creates an outage tomorrow | Production incident + blame |
    | Tiered menu with risk bounds ("We can launch to 5% internal beta on Friday, and 100% GA 4 days later once retry safety lands") | Collaborative problem-solving | Hits the milestone safely |

- id: conflict-influence-without-authority-rfc
  q: Describe a time you convinced another team (who did not report to your manager) to adopt a technical standard, migration, or API change that wasn't on their roadmap.
  level: Senior
  category: conflict-and-collaboration
  subcategory: influence-without-authority
  signals:
    - influence
  topics:
    - /behavioral/competencies/influence-without-authority
  a: |-
    **What interviewers are testing.** Influencing without authority is the primary gating signal between Mid-level (L4) and Senior/Staff (L5/L6) engineers. Another team says "no" not because they dislike clean architecture, but because their sprint is already 110% full and your migration looks like unrewarded risk.

    **How to win adoption without authority:**

    - **Align with their local pain:** Show how your proposal solves a problem *they* already care about (e.g., cutting their on-call page volume or shaving 40 ms off their SLA).
    - **Pay the migration tax yourself:** Build codemods, compatibility adapters, or draft PRs in their repository so their cost is a 20-minute code review rather than a 2-week rewrite.
    - **Share the credit:** Highlight their engineers in the launch announcement and leadership review.

- id: conflict-giving-receiving-critical-feedback
  q: Tell me about a time you gave constructive criticism to a peer, and a time you received tough feedback that was hard to hear.
  level: Mid
  category: conflict-and-collaboration
  subcategory: feedback-communication
  signals:
    - feedback
  topics:
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What interviewers are testing.** Whether you practice candid, low-ego communication (Situation-Behavior-Impact) when giving feedback, and whether you exhibit genuine behavioral change, not disguised self-praise ("I care too much"), when receiving feedback.

    - **Giving feedback:** Anchor on observable behavior and concrete team impact in a private 1:1 (e.g., PRs merged without waiting for on-call review causing two rollbacks), ask for their context first, and co-create a specific working agreement.
    - **Receiving feedback:** Pick a real blind spot (such as jumping to code before aligning stakeholders, or writing overly terse code review comments), describe your initial reaction honestly, and show the measurable habit you built to fix it.

- id: conflict-cross-functional-alignment
  q: Tell me about a project where you had to align engineering, product, design, or legal/security stakeholders who had conflicting definitions of success.
  level: Senior
  category: conflict-and-collaboration
  subcategory: cross-functional
  signals:
    - communication
  topics:
    - /behavioral/competencies/cross-functional-collaboration
  a: |-
    **What interviewers are testing.** Cross-functional maturity: can you speak the native language of each function (user journeys for Design, conversion and retention for Product, threat models and auditability for Security/Legal, latency and operability for Engineering) and synthesize a single architecture that satisfies all non-negotiable constraints?
- id: how-do-you-explain-a-complex-model-to-non-technical-stakehol
  q: How do you explain a complex model to non-technical stakeholders?
  a: |
    Lead with the decision it supports and its impact, use plain language and analogies, show a few concrete examples and the key drivers, state accuracy and limitations honestly, and confirm understanding by inviting questions. Give a story where this changed a decision.
  level: Junior
  category: conflict-and-collaboration
  subcategory: cross-functional
  signals:
    - communication
- id: tell-me-about-a-disagreement-with-a-product-manager-or-stake
  q: Tell me about a disagreement with a product manager or stakeholder.
  a: |
    Show that you understood their goal, used data or a small experiment to resolve the disagreement, proposed alternatives, and committed to the final decision even if it was not yours. Avoid stories where you were simply right and they were wrong.
  level: Mid
  category: conflict-and-collaboration
  subcategory: manager-pm-pushback
  signals:
    - conflict
    - influence
- id: tell-me-about-collaborating-with-engineers-to-productionize
  q: Tell me about collaborating with engineers to productionize a model.
  a: |
    Describe how you aligned on interfaces, latency budgets and feature pipelines early, shared responsibility for monitoring, and handled issues such as training-serving skew. Emphasize clear communication and shared ownership.
  level: Mid
  category: conflict-and-collaboration
  subcategory: cross-functional
  signals:
    - communication
- id: tell-me-about-a-time-you-had-to-say-no-to-a-request
  q: Tell me about a time you had to say no to a request.
  a: |
    Explain the request, why it was not the right priority or approach, how you used data to explain your reasoning, what alternative you offered, and how the relationship stayed positive.
  level: Senior
  category: conflict-and-collaboration
  subcategory: manager-pm-pushback
  signals:
    - conflict
    - influence
- id: describe-a-time-you-influenced-a-decision-without-authority
  q: Describe a time you influenced a decision without authority.
  a: |
    Explain the decision, the stakeholders, how you built a case with data and prototypes, how you addressed concerns, and the outcome. Show persuasion through evidence and empathy.
  level: Senior
  category: conflict-and-collaboration
  subcategory: influence-without-authority
  signals:
    - influence
- id: describe-working-with-a-cross-functional-team-on-an-ai-featu
  q: Describe working with a cross-functional team on an AI feature.
  a: |
    Explain the roles involved, such as product, design, engineering, legal or safety, how you aligned on goals and evaluation criteria, how you handled differing priorities, and what the feature achieved.
  level: Mid
  category: conflict-and-collaboration
  subcategory: cross-functional
