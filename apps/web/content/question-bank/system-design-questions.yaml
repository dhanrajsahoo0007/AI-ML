# System design questions ("Design X") with the follow-ups interviewers ask next. All answers are written by
# TokensToScale. Company tags mean "reported by candidates", see content/system-design/COMPONENTS.md section 5.2.
- id: design-a-chat-app
  q: Design a chat app like Messenger or WhatsApp, with one-to-one and group chat.
  level: Mid
  category: system-design-questions
  subcategory: messaging-realtime
  topics:
    - /system-design/case-studies/facebook-messenger
    - /system-design/case-studies/whatsapp
    - /system-design/fundamentals/websockets
  companies: [Meta, Microsoft, Uber, Lyft, Airbnb, X]
  a: |-
    **Short answer.** Every online phone keeps one open WebSocket to a chat server. A message is saved first, then pushed down the recipient's open connection, or sent as a mobile push if they are offline.

    **What to clarify.** One-to-one only or groups too, and how large a group can be. Whether history is kept on the server. Which extras are in scope: receipts, presence, media, several devices per user. Agreeing on these first is worth two minutes, because a 100,000-member group is a different design from a 200-member one.

    **The numbers that drive the design.**

    - Open connections. With 500 million daily users and a third online at the busy hour, that is about 170 million open sockets. At roughly 100,000 sockets per server, the chat tier needs about 1,700 servers.
    - Message rate. 500 million users sending 40 messages a day is 20 billion a day, about 230,000 a second on average and perhaps 3 times that at peak.
    - Storage. At about 200 bytes a message, that is 4 TB of new text a day. The store must be write-heavy and split across many machines.

    **Core design.**

    1. The client opens a WebSocket through a load balancer to any chat server. The server records "user 42 is on chat server 17" in a session registry (an in-memory store with a short expiry).
    2. To send, the client attaches its own unique id to the message. The chat server writes the message to the message store, partitioned by conversation id, and only then confirms "sent" to the sender.
    3. The server looks up the recipient in the session registry and forwards the message to the chat server that holds their connection, which pushes it down the socket.
    4. If the recipient has no connection, the message stays in the store and a push notification goes out through APNs or FCM. On reconnect the client asks for everything after the last message it has.
    5. Group messages are written once. A fan-out worker reads the member list and delivers to each online member.

    <AnimatedDiagram name="messenger/architecture" highlight={["chat", "session", "store", "push"]} caption="Save the message, find the recipient's chat server in the session registry, push it down the socket, or fall back to a mobile push." />

    **The hardest part.** Delivery without loss or duplicates while servers and phones fail. The rule that makes it work: save before you confirm, let the client retry with the same id, and let the receiving client report the last message it holds so the server can resend the gap.

    **Main trade-off.** Stateful chat servers make delivery fast but make deploys and failures harder, because a restart drops 100,000 connections that all reconnect at once. Plan for slow connection draining and reconnects with random delay.

    **What a senior answer adds.** Per-conversation ordering with a server-assigned sequence number, not client clocks. A separate path for very large groups. Multi-region placement, so two users on different continents each connect nearby. End-to-end encryption and what it removes from the server (search, server-side previews).

    **Watch out for.** Polling the database for new messages, or using the database row as the delivery mechanism. Neither holds up past a few thousand users.
  followUps:
    - q: Would you use WebSockets or long polling for chat, and why?
      level: Mid
      topics:
        [
          /system-design/fundamentals/choosing-realtime,
          /system-design/fundamentals/websockets,
          /system-design/fundamentals/long-polling,
        ]
      companies: [Microsoft, Uber]
      a: |-
        **Short answer.** WebSockets, with long polling kept as a fallback for networks that block them.

        **Why.** Chat traffic goes both ways and messages are small and frequent. A WebSocket is one long-lived connection that either side can write to at any time, with only a few bytes of framing per message. Long polling sends a full HTTP request for every delivery and has to reconnect after each one, so at 230,000 messages a second you pay for headers and connection handling many times over. Typing indicators and receipts make this worse, because they multiply the number of small messages.

        Long polling still earns its place. Some company proxies and old mobile networks break WebSocket upgrades. A client that fails to upgrade can fall back to long polling against the same backend and lose only some efficiency.

        **Watch out for.** Saying "WebSockets" and stopping. The interviewer usually wants the cost too: the connection is stateful, so you need a registry of which server holds which user, heartbeats to detect dead connections, and a plan for the reconnect storm when a server restarts.
    - q: What happens to a message when the recipient is offline?
      level: Mid
      topics: [/system-design/fundamentals/push-notifications, /system-design/patterns/message-queues]
      companies: [Meta, Lyft]
      a: |-
        **Short answer.** The message is already saved, so the server only has to wake the device with a push notification and let the app fetch what it missed when it reconnects.

        **Why.** Storing before delivering means "offline" is not a special storage case. The chat server finds no entry for the recipient in the session registry, so it puts a job on a queue for the push service, which calls APNs for iPhones and FCM for Android. When the app opens, it connects and sends the id of the last message it holds for each conversation. The server returns everything newer.

        Push providers do not promise delivery or order, and they may drop older notifications for a device that has been off for days. So a push is only a hint to come and sync. It is never the copy of the message that counts.

        **Watch out for.** Sending the push from the chat server inside the send request. A slow push provider would then slow down every sender. Put a queue between them, and collapse many pending messages into one notification such as "5 new messages".
    - q: The same user is signed in on a phone, a tablet and a laptop. How do you keep all three in sync?
      level: Senior
      topics: [/system-design/case-studies/facebook-messenger]
      a: |-
        **Short answer.** Treat each device as its own connection with its own position in each conversation, and deliver every message to every device of every member, including the sender's other devices.

        **Why.** The session registry maps a user to a list of connections, not one. When a message arrives, the server pushes it to all of the recipient's online devices and also to the sender's other devices, so the laptop shows what was typed on the phone. Each device remembers the sequence number of the last message it has per conversation. A device that was closed for a week reconnects, reports its position and pulls the gap, with no effect on the others.

        Read state is shared, not per device. Reading on the phone writes "user 42 has read up to message 870" on the server, and that update is pushed to the other devices so their unread badges clear.

        **Watch out for.** Deleting a message from the server once one device confirms it. That works for a single phone and breaks as soon as a second device exists. With end-to-end encryption this gets harder still, because each device has its own key and the sender must encrypt once per device.
    - q: How do you store chat history so a user can scroll back through years of messages?
      level: Mid
      topics: [/system-design/databases/wide-column-stores, /system-design/fundamentals/api-design]
      a: |-
        **Short answer.** Keep messages in a store partitioned by conversation id and sorted by a sequence number inside each conversation, and page backwards with a cursor.

        **Why.** Almost every read is "the latest 50 messages of conversation X" or "the 50 before message N". If one conversation's messages sit together on disk in order, each of those is one short range read. A wide-column store such as Cassandra or HBase fits: the partition key is the conversation id and the sort key is the sequence number. It also handles the write rate, because writes are appends.

        The API returns a page plus a cursor, for example `before=8841&limit=50`. A cursor based on the sequence number stays correct while new messages arrive. Page numbers would shift under the reader.

        A conversation that runs for years can outgrow one partition. Add a time bucket to the key, such as conversation id plus month, so no partition grows without limit.

        **Watch out for.** Partitioning by user id. A group message would then be written once per member, and a 500-member group turns one write into 500.
    - q: The server confirms "sent" to the sender, then crashes before the message reaches the group. How do you make sure it is not lost?
      level: Senior
      topics: [/system-design/patterns/message-queues, /system-design/patterns/idempotency]
      a: |-
        **Short answer.** Confirm to the sender only after the message is saved in durable storage, and make delivery a separate step that reads from that storage and can be run again.

        **Why.** The confirmation is a promise. If it is sent while the message is only in one server's memory, a crash breaks the promise. So the order is: write the message to the replicated store, then confirm. Delivery to members is driven by a log or queue that records "message 870 in conversation X needs fan-out". A worker takes the job, delivers, and marks it done. If the worker dies half way, another worker picks the job up after a timeout and runs it again.

        Running it again means some members get the message twice from the server. That is fine, because each message has a stable id and the client ignores an id it already holds.

        To keep the save and the "needs fan-out" record in step, write both in one place: either the message store itself is the log that workers follow, or the two are written in one transaction.

        **Watch out for.** Writing to the database and then publishing to a queue as two separate calls. A crash between them leaves a saved message that nobody is ever told about.
    - q: How does the design change for a group with 100,000 members?
      level: Senior
      topics: [/system-design/patterns/fan-out, /system-design/case-studies/facebook-messenger]
      companies: [Microsoft, Airbnb]
      a: |-
        **Short answer.** Stop pushing every message to every member. Store the message once, push it only to members who have the conversation open, and let everyone else pull when they open it.

        **Why.** For a 200-member group, delivering to each member costs 200 small pushes and is fine. At 100,000 members, one busy channel with 10 messages a second would mean a million deliveries a second from a single conversation. Most of those members are not looking at it.

        So large groups switch to a different path. Chat servers subscribe to a channel topic only while one of their connected users has that conversation on screen. A new message is published once to the topic and reaches a few hundred chat servers, and each pushes it to its viewers. Other members get an updated unread marker at most, and often that is batched every few seconds.

        Per-member features must be cut back as well. Read receipts become a count, not a list of names. Typing indicators are switched off. Push notifications go out only for mentions.

        **Watch out for.** Using one design for all sizes. State the threshold, for example 1,000 members, and say the product behaves differently above it.
    - q: A member is removed from a group while a message is on its way. Should they receive it, and how do you enforce the answer?
      level: Senior
      topics: [/system-design/patterns/consistency-models]
      a: |-
        **Short answer.** Decide by order, not by clock time. Membership changes and messages share one sequence in the conversation. A member receives a message only if it comes before their removal in that sequence.

        **Why.** "At the same time" has no meaning across servers, so the system needs one place that orders events. If "remove user 42" is written to the conversation as event 871, then message 870 is delivered to them and message 872 is not. Everyone sees the same answer and it can be explained to a user.

        Checking the member list in the database for every recipient of every message would be too slow. Give the member list a version number that goes up on every change, and keep it in a cache. The fan-out worker stamps each message with the membership version it used. Chat servers holding an older version reload the list before delivering.

        The second check is on read. When a client pages through history, the server returns only messages inside the ranges where that user was a member.

        **Watch out for.** Relying on the client to hide messages. A removed member with a modified client would still receive them.
    - q: How do you keep unread counts correct for every user?
      level: Senior
      topics: [/system-design/patterns/caching]
      a: |-
        **Short answer.** Do not keep a counter that goes up and down. Store one number per user per conversation, the sequence number of the last message they have read, and work out the unread count as the conversation's latest sequence number minus that.

        **Why.** A counter that is increased on every new message and reset on read has two writers that race. A retry adds one twice, a read on one device arrives late, and the badge is wrong until the user opens the chat. A "last read" position cannot drift in that way. Writing it twice gives the same result, and it only moves forward, so the server keeps the larger value when two devices disagree.

        It is also cheap for groups. A message to a 500-member group updates one number on the conversation, not 500 counters.

        The total badge on the app icon is the sum over conversations. Cache it per user and recompute it when a conversation's latest number or the user's read position changes.

        **Watch out for.** Deleted messages and messages the user sent themselves. Both make "latest minus last read" slightly too high, so either count only other people's messages or accept "at least one unread" as the thing that must be right.
    - q: How would you show which contacts are online?
      level: Mid
      topics: [/system-design/case-studies/facebook-messenger, /system-design/fundamentals/websockets]
      a: |-
        **Short answer.** Each connected client sends a small heartbeat every few seconds. A presence service keeps "user 42 was last seen at 10:15:05" in an in-memory store with a short expiry, and a user is shown as online while that entry is alive.

        **Why.** A clean disconnect is rare on mobile. Phones go into tunnels and apps are killed, so the server often never sees the connection close. A heartbeat with an expiry of about 30 seconds turns "we have heard nothing" into "offline" without any special case.

        Telling other people is the expensive part. If every status change were pushed to every contact, a user with 1,000 contacts who walks through patchy signal would cause thousands of updates a minute. Send presence only to people who can see it right now: those with the chat list or that conversation open. Everyone else asks for it when they open the screen.

        **Watch out for.** Promising exact presence. It is acceptable for "online" to be 30 seconds out of date, and saying so early lets you choose the cheap design.
- id: design-notification-system
  q: Design a notification system that sends push, email, SMS and in-app messages to millions of users.
  level: Mid
  category: system-design-questions
  subcategory: social-feeds
  topics:
    - /system-design/fundamentals/push-notifications
    - /system-design/patterns/message-queues
    - /system-design/patterns/fan-out
    - /system-design/patterns/idempotency
  companies: [Airbnb, Amazon, Apple, DoorDash, Pinterest, Salesforce]
  a: |-
    **Short answer.** Product services publish events to one notification service. It decides who should be told and on which channel, puts one job per recipient and channel on a queue, and channel workers hand each job to an outside provider such as APNs, FCM, an email service or an SMS carrier.

    **What to clarify.** Which channels are in scope. Whether messages are transactional (an order shipped), marketing, or both, because they need different priority. How fast a message must arrive: a login code within seconds, a weekly digest within hours. Whether one event can target millions of people. Whether users can set preferences and quiet hours.

    **The numbers that drive the design.**

    - Volume. 100 million users receiving 10 notifications a day is 1 billion a day, about 11,600 a second on average. Campaigns make traffic uneven, so plan for 5 times that, about 60,000 a second.
    - In-app inbox. 1 billion rows a day at about 500 bytes each is 500 GB a day. Keeping 30 days means 15 TB, so the inbox store must be split across machines and old rows must expire.
    - Device tokens. 100 million users with 1.5 devices each is 150 million tokens. At about 200 bytes a row that is 30 GB, small enough to cache the busy part.

    **Core design.**

    1. A product service calls the notification API or publishes an event with an event id, a template name, the recipients and a priority.
    2. The notification service loads each recipient's preferences and picks the channels. It drops what the user has switched off and delays what falls inside quiet hours.
    3. It fills the template in the user's language and writes one job per recipient and channel to a queue. Each channel has its own queue, and urgent messages have their own lane.
    4. Channel workers pull jobs, check a deduplication key, call the provider and record the result: sent, failed for now, or failed for good.
    5. A job that failed for now is retried with growing delays. After the last attempt it moves to a dead-letter queue, a holding area for jobs that need a human or a later replay.
    6. In-app notifications are also written to an inbox store keyed by user id, so the app can show a list and an unread count.

    <AnimatedDiagram name="fundamentals/push-notifications" highlight={["notify", "queue", "workers", "apns"]} caption="The notify service turns one event into one queued job per device, and workers send each job to the push provider." />

    **The hardest part.** Promising delivery when the last step belongs to someone else. Providers slow down, reject requests and sometimes accept a message that never arrives. The system can promise "at least one attempt, retried until a clear answer", and it must make retries safe so that a retry does not become a second message on the user's phone.

    **Main trade-off.** Queues add a little delay to every message and in return let the system absorb bursts and survive provider outages. For a login code, keep the path short: a high-priority lane with its own workers and almost no queue depth.

    **What a senior answer adds.** Separate lanes so a marketing blast of 50 million emails cannot delay a password reset. Per-provider rate limits, since carriers and email services cap how fast you may send. A second provider per channel for failover. Delivery tracking (sent, delivered, opened) fed back as events. Cleaning out dead device tokens when the provider reports them.

    **Watch out for.** Calling the provider directly inside the request that triggered the event. A slow SMS carrier would then slow down checkout.
  followUps:
    - q: A campaign creates 50 million notifications in a few minutes. How do you take the burst without delaying urgent messages?
      level: Senior
      topics: [/system-design/patterns/message-queues, /system-design/patterns/back-pressure]
      companies: [Amazon, DoorDash, Pinterest]
      a: |-
        **Short answer.** Accept the burst into a queue quickly, drain it at a controlled rate, and keep urgent messages on a separate lane with reserved workers.

        **Why.** Accepting and sending are two different speeds. Writing 50 million small jobs to a partitioned log is cheap. Sending them is limited by the providers. If workers send 20,000 a second, the campaign takes about 42 minutes, which is fine for marketing.

        The damage comes when a login code sits behind those 50 million jobs. So use at least two lanes: one for transactional messages and one for bulk. Each lane has its own queue and its own worker pool. The bulk lane can grow a long backlog while the urgent lane stays near empty.

        Expand large audiences lazily. Store the campaign as one record, then let a fan-out worker read the audience in pages of a few thousand users and create jobs as it goes. That lets you pause or cancel a campaign half way.

        Scale workers on queue depth and on the age of the oldest job, since CPU stays low while workers wait on providers.

        **Watch out for.** One shared queue with a priority field. Many queue systems do not reorder messages already written, so the urgent job still waits.
    - q: The same event arrives twice from an upstream service. How do you stop the user getting two notifications?
      level: Mid
      topics: [/system-design/patterns/idempotency]
      companies: [DoorDash]
      a: |-
        **Short answer.** Give every send a deduplication key built from the event id, the user id and the channel, and let a worker send only if it is the first to claim that key.

        **Why.** Duplicates are normal. Queues redeliver a job when a worker dies before confirming it, and upstream services retry on timeouts. The system cannot prevent a job from running twice, so it makes the second run do nothing.

        Before calling the provider, the worker writes the key to a fast store with a "set only if absent" operation and an expiry of a day or two. If the write succeeds, it sends. If the key exists, it skips. An expiry of 48 hours at 1 billion keys a day and about 50 bytes a key is about 100 GB.

        The key must come from the producer's event, for example "order 981 shipped". A key generated inside the notification service would be different on each arrival and would catch nothing.

        One gap remains. If a worker claims the key and crashes before sending, the message is lost. Mark the key "in progress" first with a short expiry, then "done" after the provider answers.

        **Watch out for.** Deduplicating on message text. Two real events can produce the same text, and one of them would be dropped.
    - q: The SMS provider is down for 20 minutes. How do you keep push and email working, and what happens to the SMS messages?
      level: Senior
      topics: [/system-design/patterns/circuit-breaker-and-retries, /system-design/patterns/message-queues]
      companies: [DoorDash, Airbnb, Pinterest]
      a: |-
        **Short answer.** Each channel has its own queue and workers, so a dead provider only backs up its own queue. SMS jobs wait, retry with growing delays, and switch to a second provider if the outage lasts.

        **Why.** With one shared worker pool, every worker would end up stuck waiting on SMS timeouts, and push and email would stop too. Separate pools turn a provider failure into a local problem.

        Inside the SMS path, a circuit breaker watches the error rate. A circuit breaker is a switch that stops calls to a failing dependency for a short time. Once it opens, workers stop calling the provider and either leave jobs in the queue or send them to a backup provider. Every 30 seconds it lets a few test calls through to see if the provider is back.

        Each job carries an expiry time. A login code that is 10 minutes old is useless, so it is dropped and counted. A delivery update may still be worth sending an hour later. When the provider returns, drain the backlog at a limited rate so it is not knocked over again.

        **Watch out for.** Retrying immediately and without limit. 100 workers retrying in a tight loop add load to a provider that is trying to recover.
    - q: How do you respect user preferences, quiet hours and message priority?
      level: Mid
      topics: [/system-design/patterns/caching]
      companies: [Pinterest]
      a: |-
        **Short answer.** Check preferences in one place, before a job is queued, using a small cached record per user. Hold messages that hit quiet hours in a delayed queue. Let only a short list of critical message types skip the rules.

        **Why.** A preference record is tiny: the channels the user allows for each category, their time zone and their quiet hours. It is read on every notification and changed rarely, so it fits a cache well. At 60,000 lookups a second the database should not be asked each time.

        Quiet hours need the user's local time. If it is 11 pm for the user and quiet hours end at 7 am, the job is stored with a "send after" time and released then. If several messages pile up overnight, merge them into one summary at release time.

        Priority has two uses. It chooses the lane, and it decides whether rules apply. A security alert goes out at night. A "someone liked your post" does not. Add a daily cap per user for low-priority types, for example 5 pushes a day, since people who feel spammed turn notifications off completely.

        **Watch out for.** A long cache lifetime for opt-outs. If someone unsubscribes, the next message should respect it, so update or delete the cached record on every change.
    - q: A post goes viral and gets 10,000 comments in an hour. How do you avoid sending the owner 10,000 notifications?
      level: Senior
      topics: [/system-design/patterns/fan-out, /system-design/fundamentals/push-notifications]
      companies: [Pinterest]
      a: |-
        **Short answer.** Group events by recipient and subject inside a time window, and send one summary such as "Asha and 240 others commented on your post".

        **Why.** The first comment should arrive quickly. After that, each extra push adds nothing for the owner. So the first event for a key (owner id, post id, event type) is sent at once and opens a window, for example 5 minutes. Events that arrive during the window only update a small record: a count and the last two or three names. When the window closes, one summary is sent if the count grew.

        Let the window grow while the activity continues: 5 minutes, then 30, then a few hours. A post with 10,000 comments in an hour then produces about 5 pushes instead of 10,000.

        Push providers also support replacing a notification already on the screen. Sending the summary with the same collapse identifier updates the existing banner, so the phone shows one entry.

        The in-app inbox uses the same idea. Store one row per group and update its count and time, so the list stays readable.

        **Watch out for.** Aggregating before deduplicating. A retried event would be counted twice and the summary would show the wrong number.
    - q: Many internal teams will send through this system. How do you make it multi-tenant so that one team cannot hurt the others?
      level: Senior
      topics: [/system-design/patterns/rate-limiting, /system-design/fundamentals/abuse-protection]
      companies: [DoorDash]
      a: |-
        **Short answer.** Treat each sending team as a tenant with its own credentials, templates, quotas and metrics, and enforce a rate limit per tenant at the front door and again at the workers.

        **Why.** Shared infrastructure fails in a predictable way: one team ships a bug that sends 10 million messages in a loop, and everyone's notifications are late. Isolation needs three things.

        - **Quotas.** Each tenant has a rate, for example 2,000 a second, and a daily budget. Requests above the limit are rejected with a clear error, or queued in that tenant's own backlog.
        - **Fair scheduling.** Workers take jobs from tenants in turn, so a tenant with a backlog of 5 million jobs gets its share and no more. Very large tenants can have a dedicated queue.
        - **Ownership.** Every job carries the tenant id. Dashboards, delivery rates and provider cost are reported per tenant, so a problem has an owner.

        Also apply a cap per end user across all tenants. Each team may think 2 pushes a day is modest, but 10 teams doing that means 20 pushes a day for one person.

        **Watch out for.** Limiting only at the API. A tenant can stay under its request limit and still target a huge audience with one call, so count recipients, not requests.
- id: design-news-feed
  q: Design the home feed of a social network, where each user sees recent posts from the accounts they follow.
  level: Senior
  category: system-design-questions
  subcategory: social-feeds
  topics:
    - /system-design/patterns/fan-out
    - /system-design/case-studies/twitter
    - /system-design/case-studies/instagram
    - /system-design/patterns/caching
  companies: [Amazon, Apple, LinkedIn, Meta, Pinterest]
  a: |-
    **Short answer.** When someone posts, copy the post id into a ready-made list for each follower, so that opening the feed is one fast read. For accounts with millions of followers, skip the copying and merge their posts in at read time.

    **What to clarify.** Whether the feed is newest-first or ranked. Whether follows are one-way (follow) or two-way (friend), and the largest follower count. What a post contains: text only, or photos and video. How fresh the feed must be: a new post showing up within 5 seconds, or within a minute.

    **The numbers that drive the design.**

    - Reads. 300 million daily users opening the feed 10 times a day is 3 billion feed loads a day, about 35,000 a second.
    - Writes. 100 million posts a day is about 1,200 a second. With an average of 200 followers, copying each post to every follower is 20 billion list inserts a day, about 230,000 a second. Reads are 30 times more frequent than posts, which is why work is moved to write time.
    - Feed cache. 800 post ids of 8 bytes each is about 6.4 KB per user. For 300 million active users that is about 2 TB of memory, a cluster of a few dozen cache machines.

    **Core design.**

    1. The post service saves the post in a store partitioned by post id, puts media in object storage behind a CDN, and publishes a "new post" event.
    2. Fan-out workers read the event, load the author's follower list in pages, and add the post id to the front of each follower's feed list in an in-memory cache. Each list is trimmed to about 800 entries.
    3. To read, the feed service takes one page of ids from the user's list, fetches the post bodies and author details from caches in one batched call, removes posts that were deleted or come from blocked accounts, and returns the page with a cursor.
    4. Authors above a threshold, for example 100,000 followers, are not fanned out. The feed service keeps a short list of the big accounts each user follows, fetches their recent posts at read time, and merges them into the page.
    5. Users who have not opened the app for 30 days have no cached list. Their feed is rebuilt from the database the next time they log in.

    **The hardest part.** The skew in follower counts. One post from an account with 50 million followers would mean 50 million inserts, would take minutes, and would delay everyone else's fan-out behind it. The hybrid of push for normal accounts and pull for big ones exists for this reason, and the interviewer will expect you to reach it.

    **Main trade-off.** Push at write time gives cheap, fast reads and spends storage and write work on feeds nobody may open. Pull at read time wastes nothing and makes every read expensive: a user following 500 accounts would need 500 lookups and a merge.

    **What a senior answer adds.** Ranking as a separate stage: the cached list is a candidate set, and a ranking service scores the top few hundred before the page is built. A clear answer to how deletes and privacy changes reach feeds that already hold the id. Graceful degradation, such as serving the cached list without ranking when the ranker is slow. A plan for rebuilding feeds after a cache node is lost.

    **Watch out for.** Storing full post bodies in every follower's list. An edit or delete would then need 200 updates, and the cache would be hundreds of times larger.
  followUps:
    - q: Would you build the feed with push, pull or a hybrid, and where do you draw the line?
      level: Mid
      topics: [/system-design/patterns/fan-out, /system-design/case-studies/twitter]
      companies: [LinkedIn]
      a: |-
        **Short answer.** A hybrid. Push post ids to followers for ordinary accounts, pull at read time for accounts above a follower threshold, and skip the push for followers who are inactive.

        **Why.** The cost of each model depends on which side has the big number.

        | Model | Cost of a post | Cost of a feed read | Fails when |
        |---|---|---|---|
        | Push | One insert per follower | One list read | The author has millions of followers |
        | Pull | One write | One lookup per followed account | The reader follows many accounts |
        | Hybrid | Inserts for normal authors only | One list read plus a few lookups | Rarely, the threshold needs tuning |

        The threshold is a cost decision. At 100,000 followers a post costs 100,000 inserts, which a worker pool finishes in a second or two. At 50 million it does not. On the read side, a user usually follows only a handful of very large accounts, so the pull adds a few cache lookups to each feed load.

        Skipping inactive followers saves more than it seems. If only a third of accounts are active in a month, two thirds of the inserts are wasted.

        **Watch out for.** A hard cut-over with no memory. An account that crosses the threshold must have a clear rule for its older posts, or followers see gaps.
    - q: Why does the feed API use a cursor for pagination and not a page number or offset?
      level: Mid
      topics: [/system-design/fundamentals/api-design, /system-design/fundamentals/rest]
      companies: [Meta]
      a: |-
        **Short answer.** A feed changes while the user scrolls. A cursor says "continue after this exact item", so new posts at the top do not shift the pages below. An offset says "skip 20 items", and that breaks as soon as the list moves.

        **Why.** Suppose the client has loaded items 1 to 20 and asks for offset 20. In the meantime 3 new posts arrived at the top. The old items 18, 19 and 20 are now at positions 21, 22 and 23, so the user sees them a second time. With deletions the opposite happens and items are skipped.

        A cursor is an opaque string the server returns with each page. Inside it holds the position of the last item sent, for example its sort key and post id. The next request sends the cursor back and the server returns items strictly after that position.

        Cursors are also cheaper. An offset of 10,000 makes most stores walk and throw away 10,000 rows. A cursor is a direct seek on an index.

        **Watch out for.** A ranked feed. The order can change between requests, so keep the ranked list of ids for the session on the server for a few minutes and let the cursor point into that saved list.
    - q: A user publishes a post and opens their feed one second later. Fan-out has not finished. How do they see their own post?
      level: Mid
      topics: [/system-design/patterns/consistency-models, /system-design/databases/sync-vs-async-replication]
      companies: [LinkedIn]
      a: |-
        **Short answer.** Treat the author as a special case. Put the post into the author's own view directly, without waiting for the fan-out pipeline.

        **Why.** Fan-out is asynchronous, so followers may see the post a few seconds late and nobody notices. The author does notice. A post that seems to vanish makes people post it again. This guarantee is called read-your-own-writes: a user always sees their own changes, even if others see them a little later.

        There are three layers, and a good answer uses more than one.

        - The client inserts the post at the top of the feed as soon as the server confirms the save. This costs nothing on the server.
        - The post service writes the id into the author's own feed list as part of handling the request, before fan-out starts.
        - Reads of the author's own profile go to the primary database, or to a replica known to be caught up, for a few seconds after a write. A lagging replica might not have the post yet.

        The client-side insert alone is not enough. If the user refreshes or opens a second device, the post must come from the server.

        **Watch out for.** Making the whole fan-out synchronous to solve this. The post request would then take as long as the slowest follower insert.
    - q: New posts arrive while someone is reading. How do you show them without moving the reader's scroll position, and how do you handle posts that were edited or deleted?
      level: Senior
      topics: [/system-design/fundamentals/choosing-realtime, /system-design/fundamentals/api-design]
      companies: [Meta]
      a: |-
        **Short answer.** Never insert above what the user is reading. Show a "new posts" button, and load the new items only when the user taps it or returns to the top. Deletes and edits are applied by id in place.

        **Why.** Content that jumps under the thumb causes wrong taps and lost reading position. So the client keeps its list stable and treats new posts as a separate, pending set.

        To know that new posts exist, the client asks a cheap question every 30 to 60 seconds: "is there anything newer than this cursor". The answer is a count or a yes, a few bytes.

        Each item is keyed by post id on the client. When a new page arrives, the client drops ids it already holds, which removes duplicates across pages. For edits and deletes, the server filters deleted posts when it builds a page, and returns "gone" when the client fetches a deleted post. The client then removes that item. An edited post replaces the old content under the same id.

        **Watch out for.** Trusting the cached feed list on the server as truth. It holds ids only, and each read must still check that the post exists and that the reader may see it.
    - q: The feed is ranked by a machine learning model. Why not run the full model over every candidate post?
      level: Senior
      topics: [/system-design/case-studies/instagram, /system-design/patterns/caching]
      companies: [Pinterest]
      a: |-
        **Short answer.** Cost and time. Ranking runs in stages: a cheap step cuts thousands of candidates to a few hundred, and the expensive model scores only those.

        **Why.** Take a latency budget of 200 ms for the feed. A heavy model might need 1 ms per post even with batching. Scoring 5,000 candidates would take seconds, and at 35,000 feed loads a second it would need a very large fleet. Scoring 300 fits the budget.

        A typical funnel has three steps:

        1. **Candidate generation.** Collect a few thousand post ids from cheap sources: the precomputed feed list, recent posts from close contacts, and popular posts.
        2. **Light ranking.** A small model or a simple score using a few stored features cuts the set to about 300.
        3. **Heavy ranking.** The full model scores those 300 using fresh features, including what the user did in this session.

        Precomputing every user's final ranked feed is not the answer either. Most of that work would be for users who never open the app, and it would ignore what the user did a minute ago. The usual mix is precomputed candidates plus ranking at request time.

        **Watch out for.** Fetching features one post at a time. 300 separate lookups cost more than the model itself, so fetch them in one batch.
    - q: A user taps like on a weak mobile network and the app retries. How do you avoid counting the like twice, and can liking work offline?
      level: Mid
      topics: [/system-design/patterns/idempotency, /system-design/fundamentals/api-design]
      companies: [Meta]
      a: |-
        **Short answer.** Make the like a statement about state, "user 42 likes post 9", and store it once per user and post. Sending it again changes nothing. Offline, the app records the action locally and sends it when the network returns.

        **Why.** On a weak network the client often cannot tell whether a request failed or only the reply was lost, so it has to retry. If the API meant "add one to the like count", every retry would add another. If it means "set my like to on", the server writes a row keyed by (post id, user id). A second write finds the row already there and the count is increased only when a row is actually created.

        For offline use, the client shows the like at once, writes the action to a small local queue on the device, and replays the queue in order when it reconnects. If the server rejects an action, for example because the post was deleted, the client undoes it on screen.

        **Watch out for.** A like followed quickly by an unlike. If the two requests arrive out of order the final state is wrong, so send them in sequence or attach a client counter so the server keeps the latest.
- id: design-reviews-ratings
  q: Design reviews and ratings for menu items in a food delivery app. Buyers post a star rating and a review, other users vote reviews up or down, and each item page shows the average rating.
  level: Mid
  category: system-design-questions
  subcategory: social-feeds
  topics:
    - /system-design/databases/relational-databases
    - /system-design/patterns/caching
    - /system-design/patterns/idempotency
  companies: [DoorDash]
  a: |-
    **Short answer.** Keep reviews and votes as rows in a relational database, with unique keys that enforce one review per buyer and one vote per user. Keep the average rating and the vote counts as stored totals that are updated on each write, and serve item pages from a cache.

    **What to clarify.** Whether only people who ordered the item may review it. Whether a user can edit a review or change a vote. How reviews are sorted: newest or most helpful. One country or global. Whether the average may be a few seconds behind.

    **The numbers that drive the design.**

    - Reads. 30 million daily users viewing 20 item pages each is 600 million reads a day, about 7,000 a second.
    - Writes. 2 million orders a day with 5 percent leaving a review is 100,000 reviews a day, about 1 a second. Votes are perhaps 1 million a day, about 12 a second. Reads outnumber writes by roughly 500 to 1.
    - Storage. 100,000 reviews a day at 1 KB each is 100 MB a day, about 36 GB a year. One relational database with read replicas holds this for years.

    **Core design.**

    1. Tables: `reviews` (review id, item id, user id, order id, stars, text, created time, upvote count, downvote count) with a unique key on (item id, user id). `votes` with primary key (review id, user id) and a value of up or down. `item_ratings` (item id, sum of stars, number of ratings).
    2. To post a review, the service checks with the order service that this user has a delivered order containing the item. In one transaction it inserts the review and adds the stars to the item's sum and count.
    3. The average is the sum divided by the count, worked out on read. It is never recalculated by scanning all reviews.
    4. To vote, the service writes the vote row and adjusts the counts on the review in the same transaction.
    5. To read, the item page takes the rating summary and the first page of reviews from a cache, with the database behind it. Further pages use a cursor on an index of (item id, sort key).

    **The hardest part.** Counters that stay correct under concurrent writes and retries. Two votes at the same moment must both be counted, a retried vote must be counted once, and a changed vote must move both counts. The rule is that the vote row is the truth and the counts are derived from changes to it inside the same transaction.

    **Main trade-off.** Updating totals inside the write transaction gives exact numbers and puts a small lock on a hot row. That is fine at 12 votes a second. For a product with thousands of votes a second on one review, buffer the increments and apply them in batches, and accept counts that are a second or two behind.

    **What a senior answer adds.** A statement that the scale here is modest, so there is no need to shard on day one. A fairer score than the plain average for items with 2 or 3 ratings, such as blending in the average of the whole restaurant. Moderation and spam checks as an asynchronous step after posting. Monitoring that compares stored totals with a nightly recount to catch drift.

    **Watch out for.** Computing the average with a query over all reviews on every page view. It works with 10 reviews and falls over on a popular item with 50,000.
  followUps:
    - q: How do you make sure a user can vote only once on a review, while still letting them change or remove the vote?
      level: Mid
      topics: [/system-design/databases/relational-databases, /system-design/patterns/idempotency]
      companies: [DoorDash]
      a: |-
        **Short answer.** A separate votes table whose primary key is (review id, user id). The database then refuses a second row for the same pair, and a change of mind is an update of that one row.

        **Why.** The review row only holds totals. It cannot say who voted, so the system needs one record per voter, and that is the reason the votes table exists.

        A vote request is handled in one transaction:

        1. Read the current vote for (review id, user id), if any.
        2. Write the new value, or delete the row to remove the vote.
        3. Adjust the totals by the difference. No vote to up: upvotes plus 1. Up to down: upvotes minus 1 and downvotes plus 1. Same value again: no change.

        Because the adjustment comes from the old and new state of one row, a retried request finds the row already in the new state and changes nothing.

        The primary key also serves the two lookups that matter. "Has this user voted on this review" is a single key read. "All votes on this review" is a range scan on the first part of the key.

        **Watch out for.** Checking in application code and then inserting. Two requests can both pass the check, so the database constraint must be the final guard.
    - q: Where do vote counts live so that pages load fast, and do you write the cache or the database first?
      level: Senior
      topics: [/system-design/patterns/caching, /system-design/databases/key-value-stores]
      companies: [DoorDash]
      a: |-
        **Short answer.** The database is written first and is the source of truth. The cache holds a copy of the counts for reads and is updated or cleared after the database commit.

        **Why.** The options for storing a counter are these.

        | Option | Good | Bad |
        |---|---|---|
        | Count the vote rows on each read | Always exact | Slow on popular reviews |
        | Count columns on the review row | Exact, one row read | Many writers contend on a hot row |
        | Counter in an in-memory store, saved to the database in batches | Very fast writes | Recent increments can be lost |

        At about 12 votes a second, count columns in the database are enough. Reads go to the cache, and on a miss they load from the database and fill the cache.

        After a vote commits, either delete the cached entry or apply an atomic increment to it. In Redis that is the `INCRBY` command on a plain key, or `HINCRBY` on a hash field. It changes the number in one step on the server, so two concurrent votes are both applied. Reading the value, adding one in the application and writing it back would lose one of them.

        **Watch out for.** Writing the cache first. If the database write then fails, readers see a vote that does not exist.
    - q: If a counter is evicted from the cache before it reaches the database, is the vote lost?
      level: Senior
      topics: [/system-design/patterns/caching]
      companies: [DoorDash]
      a: |-
        **Short answer.** Only if the cache was the single place holding it. In a design where the vote row is committed to the database first, eviction loses nothing: the next read reloads the count.

        **Why.** A cache under memory pressure removes entries, usually the least recently used ones. That is safe when every entry can be rebuilt from another store. It is unsafe for a counter that lives only in memory and is copied to the database every few seconds, because the increments since the last copy disappear with the entry.

        If the write rate ever forces buffered counters, protect them in one of these ways:

        - Keep them in a separate cache instance that is set to refuse new writes when full and never evict, and that saves to disk and has a replica.
        - Write each vote to a durable log first, and let a consumer update the counters. After a loss, the log is replayed.
        - Keep the vote rows in the database as the record and run a periodic recount for reviews that changed recently.

        The third is the simplest here, because the vote rows are needed anyway to enforce one vote per user.

        **Watch out for.** Mixing data that can be rebuilt and data that cannot in one cache with one eviction policy.
    - q: A review that reaches 100 upvotes earns its author a reward. How do you pay it exactly once?
      level: Senior
      topics: [/system-design/patterns/idempotency, /system-design/patterns/message-queues]
      companies: [DoorDash]
      a: |-
        **Short answer.** Record the reward as a row with a unique key on (review id, reward type), created in the same transaction as the vote that crosses the line. Pay it from a separate worker that uses the reward id as an idempotency key.

        **Why.** Two votes can cross 100 at the same moment, and the count can fall to 99 and reach 100 again later. The unique key handles both cases. The first transaction to insert the reward row wins, and any later attempt gets a constraint error and carries on.

        Paying is a call to another service, so it must not sit inside the vote transaction. The reward row starts as "pending". A worker picks up pending rows, calls the payment or credits service with the reward id as the idempotency key, and marks the row "paid". An idempotency key is an id the receiver remembers, so a repeated call returns the first result and does nothing more. If the worker crashes after the call and before the update, it calls again and no second credit is issued.

        **Watch out for.** Triggering on "count equals 100" in a background scan. A count that jumps from 99 to 101 between scans is missed, so test for "at least 100 and no reward row".
    - q: Only people who ordered an item may review it. How do you check that?
      level: Mid
      topics: [/system-design/fundamentals/api-design, /system-design/fundamentals/api-auth]
      companies: [DoorDash]
      a: |-
        **Short answer.** The review service checks on the server, at write time, that the user has a delivered order containing that item, and stores the order id on the review.

        **Why.** The client cannot be trusted to say "I bought this". The request carries the user's identity from their login token, and the server looks up the rest. There are two ways to do the lookup.

        - Call the order service: "does user 42 have a delivered order with item 9". This is simple and always current. It makes posting a review depend on the order service being up.
        - Keep a small local table of (user id, item id, order id) filled from "order delivered" events. The check is then a local key read. It can be a few seconds behind, which is harmless because nobody reviews a meal in the first seconds after delivery.

        Either way, the unique key on (item id, user id) stops a second review, and the stored order id lets the page show a "verified order" label and lets support trace a disputed review.

        **Watch out for.** Running the check only when showing the form. The post request must be checked again, because it can be sent without the form.
    - q: How do you sort and paginate the reviews on an item page?
      level: Junior
      topics: [/system-design/databases/b-trees, /system-design/fundamentals/api-design]
      companies: [DoorDash]
      a: |-
        **Short answer.** Return a small first page, for example 10 reviews, sorted by an indexed key, and return a cursor that the client sends back to get the next page.

        **Why.** Sending 5,000 reviews for a popular item would be slow and wasteful, so the first page is small and is the only one worth caching.

        Two sort orders are common. For "newest", an index on (item id, created time, review id) lets the database jump straight to the item's reviews in order. The cursor holds the created time and id of the last review shown, and the next query asks for rows after that point.

        For "most helpful", sort by a stored score such as upvotes minus downvotes, with an index on (item id, score, review id). The score changes as votes arrive, so a review can move between pages while someone scrolls. The client drops any review id it has already shown.

        Skipping by offset, as in "skip 5,000 rows, return 10", forces the database to read and discard the 5,000 rows. A cursor seeks directly to the right place in the index.

        **Watch out for.** Sorting in the application after loading all reviews for the item. It hides the cost until one item becomes popular.
- id: design-friend-suggestions
  q: Design a "people you may know" feature that suggests new connections to each member of a social network.
  level: Senior
  category: system-design-questions
  subcategory: social-feeds
  topics:
    - /system-design/databases/graph-databases
    - /system-design/patterns/sharding
    - /system-design/patterns/caching
  a: |-
    **Short answer.** Most good suggestions are friends of friends. Compute candidates and scores for every member in an offline batch job, store the top 100 per member in a key-value store, and serve them with one read. A small real-time path refreshes the list when the member's connections change.

    **What to clarify.** Whether connections are two-way (friends) or one-way (follows). How many members and the average number of connections. How fresh suggestions must be: daily, or within minutes of a new connection. Which signals may be used besides the graph, such as shared school, employer or imported contacts, and what privacy rules apply to them.

    **The numbers that drive the design.**

    - Graph size. 1 billion members with 300 connections each is 300 billion links. Each link is stored from both sides, so 600 billion entries of 8 bytes is about 4.8 TB. The graph has to be split across many machines.
    - Candidates. A member with 300 connections, each with 300 of their own, has up to 90,000 friends of friends before removing repeats. Doing that on every page view for millions of members is too slow, so the work moves offline.
    - Output. 1 billion members times 100 suggestions times about 16 bytes (id and score) is 1.6 TB. This is a plain lookup table.

    **Core design.**

    1. Store the graph as adjacency lists: for each member, the list of ids they are connected to, partitioned by member id.
    2. A daily batch job produces candidates. For each member M, it emits every pair of M's connections as "these two share M". Summing the pairs gives the number of mutual connections for every pair of members who are two steps apart.
    3. Remove pairs who are already connected, have blocked each other, or where the member dismissed the suggestion before.
    4. A ranking model scores the remaining candidates using mutual count plus other signals, and the job keeps the top 100 per member.
    5. The serving API reads the stored list, filters out anyone connected or dismissed since the job ran, and returns a page.
    6. When a member adds a connection, an event triggers a small job that recomputes candidates for that member only.

    **The hardest part.** The batch computation is skewed. A member with 5,000 connections produces about 12.5 million pairs, and an account with millions of connections would produce trillions. The job must cap or sample very large lists, or a few accounts take most of the cluster's time.

    **Main trade-off.** Precomputing gives fast reads and stale results. Computing at request time is fresh and expensive. A daily batch plus an event-driven refresh for members whose graph just changed gets most of the freshness for a small part of the cost.

    **What a senior answer adds.** A stated success measure, such as connections accepted per suggestion shown, since click-through alone rewards curiosity. Skipping the batch for members inactive for months. Privacy review of every signal: a suggestion can reveal that someone looked at a profile or uploaded a contact list. Mixing in a few candidates from outside the friend-of-friend set so new members with no connections still get suggestions.

    **Watch out for.** Walking the graph three steps out at request time. 300 times 300 times 300 is 27 million members for one page view.
  followUps:
    - q: A member accepts a new connection. How do their suggestions update within a minute and not the next day?
      level: Senior
      topics: [/system-design/patterns/message-queues, /system-design/patterns/cqrs-event-sourcing]
      a: |-
        **Short answer.** Publish a "connection added" event and let a stream consumer recompute suggestions for the two members involved, using the live graph, then overwrite their stored lists.

        **Why.** A new connection is the moment when suggestions are most useful.

        The incremental job is small. For member A who just connected to B, the new candidates are mostly B's connections. The job loads B's list, about 300 ids, removes those A already knows, counts mutual connections for each by intersecting lists, scores them with a lighter version of the ranking model, and merges the result with A's stored top 100. That is a few hundred reads and takes well under a second.

        Three guards keep it cheap. Collect events per member for a few seconds, so someone who accepts 20 invitations in a row triggers one recompute. Cap the size of lists that are expanded. And refresh only the two members in the event. Their other connections also gain candidates, but those can wait for the batch.

        The serving path helps too. It filters out current connections and dismissed profiles at read time, so the member never sees someone they just added.

        **Watch out for.** Letting the nightly batch overwrite fresher real-time results. Store a computed-at time with each list and keep the newer one.
    - q: How do you rank the candidates so that the suggestions feel personal to each member?
      level: Senior
      topics: [/system-design/databases/graph-databases]
      a: |-
        **Short answer.** Score each candidate with a model that predicts "will this member send a request and will it be accepted", using graph signals, profile overlap and the member's own past behaviour.

        **Why.** Counting mutual connections is a good start and a weak finish. A candidate who shares 40 connections through one very large group may matter less than one who shares 5 close contacts. Useful signals include:

        - **Graph.** The number of mutual connections, weighted so that a mutual contact with 100 connections counts more than one with 10,000.
        - **Profile.** Same employer, school, city or time period.
        - **Behaviour.** Profile views, messages, and the kinds of people this member accepted or ignored before.
        - **Recency.** New members and recently active members are more likely to respond.

        The model is trained on past suggestions that were shown and their outcomes. Scoring runs in two steps: a cheap filter reduces thousands of candidates to a few hundred, and the full model orders those.

        Personal also means remembering what the member rejected. A dismissed suggestion should not return, and one shown 5 times with no action should be lowered so the list changes between visits.

        **Watch out for.** Optimising only for requests sent. That favours popular people who never accept. Use accepted connections as the target.
    - q: A profile page must show whether the viewer and the profile owner are 1st, 2nd or 3rd degree connections. How do you compute that quickly?
      level: Senior
      topics: [/system-design/databases/graph-databases, /system-design/patterns/caching]
      a: |-
        **Short answer.** Search from both ends and meet in the middle. First degree is a set lookup, second degree is an intersection of two connection lists, and third degree checks the viewer's friends-of-friends against the owner's direct connections.

        **Why.** With about 300 connections each, a search from one side to depth 3 touches 300 times 300 times 300, or 27 million members. Starting from both sides keeps every step small.

        | Degree | Check | Work |
        |---|---|---|
        | 1st | Is the owner in the viewer's list | 1 lookup |
        | 2nd | Do the two lists share any member | Compare 2 lists of 300 |
        | 3rd | Does any connection of the viewer's connections appear in the owner's list | Up to 300 list reads, 90,000 ids |

        The third check is the expensive one. Two things make it fast. Keep each active member's second-degree set precomputed and cached, so the check becomes one comparison of a cached set against the owner's 300 connections. And stop at the first match, since the page needs only the degree, not every path.

        The search stops at 3. Beyond that the answer is "out of network", which bounds the cost.

        **Watch out for.** Caching the answer per pair of members. There are far too many pairs. Cache per member.
    - q: Some accounts have millions of connections or followers. How do they affect the design?
      level: Mid
      topics: [/system-design/patterns/fan-out, /system-design/patterns/sharding]
      a: |-
        **Short answer.** They break any step that expands a full connection list, so the system caps or samples large lists and treats very large accounts as weak evidence of a real relationship.

        **Why.** Friend-of-friend logic assumes that a shared connection means something. Two people who both know the same colleague probably know each other. Two people who both follow a famous singer probably do not. So a huge account is both expensive and uninformative.

        The cost is quadratic. Generating all pairs from a list of 300 gives about 45,000 pairs. A list of 1 million gives about 500 billion pairs, from one account. In a batch job this shows up as one task that runs for hours while the rest finish in minutes.

        Common fixes:

        - Skip accounts above a threshold, for example 10,000 connections, when generating pairs.
        - Or sample a fixed number of their connections, for example 1,000, chosen by recency or interaction.
        - Weight each mutual connection by the inverse of its size, so small shared circles count most.

        Storage needs care too. One member's list of millions of ids should be split into chunks, so a read does not load 8 MB to check one membership.

        **Watch out for.** Applying the cap only in the batch job. The real-time refresh path expands lists too and needs the same limit.
    - q: Would you keep the social graph in a graph database or as adjacency lists in a key-value store?
      level: Mid
      topics:
        [
          /system-design/databases/graph-databases,
          /system-design/databases/key-value-stores,
          /system-design/databases/choosing-a-database,
        ]
      a: |-
        **Short answer.** At this scale, adjacency lists in a partitioned key-value store, usually with a thin graph service on top. A graph database fits smaller graphs with varied, deep queries.

        **Why.** The queries here are few and simple: get a member's connections, check whether two members are connected, intersect two lists. Each is one or two key reads. A key-value store partitioned by member id serves them in a few milliseconds and scales by adding machines.

        | Choice | Fits when | Costs |
        |---|---|---|
        | Graph database | Many query shapes, paths of varying depth, graph fits on one machine or a small cluster | Harder to split across machines, since any cut separates connected members |
        | Adjacency lists in a key-value store | A few fixed query shapes, hundreds of billions of links | Multi-step queries are written by hand in the service |

        Splitting is the deciding point. A two-step query touches the lists of 300 different members, which sit on many partitions whatever the storage engine. The service sends those reads in parallel and merges the results.

        Each connection is stored twice, once under each member. Write both entries through a log or a transaction so they cannot disagree.

        **Watch out for.** Choosing a graph database only because the data is called a graph. Choose from the queries.
- id: design-live-price-feed
  q: Design a live price page that shows thousands of assets to millions of users, with prices collected from several exchanges.
  level: Senior
  category: system-design-questions
  subcategory: messaging-realtime
  topics:
    - /system-design/fundamentals/server-sent-events
    - /system-design/patterns/fan-out
    - /system-design/fundamentals/choosing-realtime
    - /system-design/databases/time-series-databases
  companies: [Bloomberg, Coinbase, Robinhood]
  a: |-
    **Short answer.** Collect ticks from each exchange over streaming connections, combine them into one price per asset about once a second, and push that to browsers over long-lived connections. Each user receives one small batch a second with only the assets on their screen.

    **What to clarify.** Whether this page is for display only or also feeds trading decisions, since display can tolerate a second of delay. How many assets and how many users are online at once. How the price is defined when exchanges disagree: last trade, an average, or one main exchange. Whether history and charts are in scope.

    **The numbers that drive the design.**

    - Input. 5 exchanges, 5,000 assets and one tick every 2 seconds per asset is 12,500 ticks a second. That is small. One machine could process it, and you run several for safety.
    - Output. 5 million users online, each viewing 20 assets that update once a second, is 100 million price updates a second if sent one by one. Packed as one frame per user per second it is 5 million frames a second. The output side is the real problem.
    - Fleet. At about 50,000 open connections per server, 5 million users need about 100 stream servers. A frame of 20 prices is about 400 bytes, so total outbound traffic is about 2 GB a second, or 16 gigabits a second.

    **Core design.**

    1. One ingest connector per exchange holds a streaming connection and converts each tick to a common shape: asset, exchange, price, volume, exchange time and sequence number.
    2. Ticks go to a partitioned log keyed by asset, so all ticks for one asset stay in order.
    3. An aggregator keeps the latest tick per exchange for every asset. Once a second it emits one combined price per asset that changed, with a version number.
    4. Combined prices are published to a pub/sub layer, written to a time-series store for charts, and saved in a "latest price" cache.
    5. Every stream server subscribes to all assets. At most 5,000 updates a second arrive, so each server can hold the full latest-price table in memory.
    6. A browser opens a Server-Sent Events stream and names the assets it is showing. The server sends a snapshot from its table, then one frame a second with the prices that changed.

    <AnimatedDiagram name="fundamentals/server-sent-events-fleet" highlight={["pubsub", "live", "proxy", "fans"]} caption="The same shape as a live match feed: one publisher, a pub/sub layer, and many stream servers that each hold thousands of open connections." />

    **The hardest part.** Keeping the output bounded. Without care, traffic grows as users times assets times tick rate. Three limits hold it down: send only assets on screen, send at most once per interval, and always send the latest value in place of a backlog of old ones. A price is state, so a skipped intermediate value costs the viewer nothing.

    **Main trade-off.** Freshness against cost. A one-second interval is fine for a browsing page. Sending every tick would multiply traffic several times for a difference no person can read. A trading screen for one asset can use a faster tier with fewer users.

    **What a senior answer adds.** Two connectors per exchange with duplicates removed by sequence number. Marking a price as stale when its source goes quiet, so an old number is never shown as live. A plan for the market open, when every asset moves at once and users arrive together. Serving users from regional stream servers so the last hop is short.

    **Watch out for.** Having each browser poll an API for each asset. 5 million users times 20 assets is 100 million requests a second.
  followUps:
    - q: How often should you fetch prices from each exchange, and should you poll or stream?
      level: Mid
      topics:
        [
          /system-design/fundamentals/websockets,
          /system-design/fundamentals/ajax-polling,
          /system-design/fundamentals/choosing-realtime,
        ]
      companies: [Coinbase]
      a: |-
        **Short answer.** Stream where the exchange offers a streaming feed. Where it only offers a request API, poll at the rate the data changes and within the exchange's rate limit, and no faster than you publish.

        **Why.** A streaming feed, usually a WebSocket or a dedicated market data line, delivers each trade as it happens over one connection. There is no wasted request and no delay from waiting for the next poll.

        Polling has two limits. The exchange caps requests, for example 10 a second per key. And the product only publishes once a second. If the exchange refreshes its own number every 2 seconds, polling every 200 ms returns the same value 10 times. Ask for all assets in one call if the API allows it, so 5,000 assets cost 1 request and not 5,000.

        Each source should run independently. One connector per exchange, with its own schedule, timeouts and reconnect logic, so a slow exchange delays only its own data. Stamp every tick with both the exchange's time and your receive time.

        **Watch out for.** Treating "no new tick" as "price unchanged". A silent source may be broken, so track the time of the last message and mark the source stale after a few missed intervals.
    - q: Each exchange sends a price every 2 seconds and users should see one average that refreshes every 10 seconds. How do you compute it, and what if one exchange is late or wrong?
      level: Senior
      topics: [/system-design/databases/time-series-databases, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** Group ticks into fixed 10-second windows by the exchange's timestamp, combine them with an average weighted by traded volume, and leave out sources that are stale or far from the rest.

        **Why.** In one window each exchange contributes about 5 ticks. A plain mean treats an exchange that traded 3 units the same as one that traded 30,000. Weighting by volume gives the large market more say: multiply each price by its volume, add them up, and divide by the total volume.

        Two failure cases need rules.

        - **Late data.** Ticks can arrive a second or two after their window ends. Wait a short grace period, for example 2 seconds, before publishing the window. Anything later is dropped from the live number and still stored for history.
        - **Bad data.** One exchange may freeze or send a wrong value. Ignore a source with no tick in the last 3 intervals. Ignore a price more than a few percent from the median of the others, and raise an alert.

        If too few sources remain, for example fewer than 2, publish the last good value with a stale flag.

        **Watch out for.** Windowing by arrival time. A network delay would move ticks into the wrong window and the average would jump for no market reason.
    - q: Would you push prices to the browser with Server-Sent Events, WebSockets or polling, and how do you keep the display delay low?
      level: Mid
      topics:
        [
          /system-design/fundamentals/server-sent-events,
          /system-design/fundamentals/websockets,
          /system-design/fundamentals/choosing-realtime,
        ]
      companies: [Coinbase]
      a: |-
        **Short answer.** Server-Sent Events for a page that only displays prices. The data flows one way, and the browser handles reconnects for you. Use WebSockets if the same connection must also carry frequent client messages.

        **Why.**

        | Option | Fit for a price page |
        |---|---|
        | Polling every second | 5 million requests a second, most returning little. Simple, costly |
        | Server-Sent Events | One open HTTP response per user, server writes when prices change, automatic reconnect |
        | WebSockets | Two-way. Useful when subscriptions change many times a minute or orders use the same socket |

        The delay budget for a tick might be: 50 ms from exchange to connector, up to 1,000 ms waiting for the next publish interval, 20 ms through pub/sub, and 50 to 100 ms over the network. The interval dominates, so that is the setting to tune. Shortening it to 250 ms cuts the average wait from 500 ms to 125 ms and quadruples the frames.

        The first paint matters as much. Send a full snapshot as the first event, so the page never shows blanks while waiting for each asset to tick.

        **Watch out for.** A proxy or load balancer that buffers responses or closes idle connections. Switch buffering off for the stream and send a short keep-alive comment every 15 to 30 seconds.
    - q: A user on a slow connection cannot keep up with the updates. What does the stream server do?
      level: Senior
      topics: [/system-design/patterns/back-pressure, /system-design/fundamentals/tcp-udp]
      a: |-
        **Short answer.** It keeps only the newest price per asset for that client and overwrites older ones that were not sent yet. If the client stays behind for too long, the server closes the connection and lets it reconnect with a fresh snapshot.

        **Why.** When a client reads slowly, TCP stops accepting more data for that connection and the unsent bytes pile up in the server's memory. With 50,000 connections per server, a few thousand slow clients holding 1 MB each use several gigabytes and can take the whole server down. One slow reader must not be allowed to hurt the others.

        Prices allow a clean answer because only the latest value matters. Each connection has a small table of "pending price per asset", not a queue. A new price for an asset replaces the pending one. When the socket can accept data again, the server sends whatever is in the table. The memory per client is bounded by the number of assets on screen, about 20 entries.

        This merging of updates is called conflation. A slow client sees fewer updates, each one current.

        **Watch out for.** An unbounded send queue per connection. It works in testing and fails on the first busy market day.
    - q: The exchange sends the same trade feed over two redundant lines. How do you use both without counting trades twice?
      level: Senior
      topics: [/system-design/patterns/idempotency, /system-design/fundamentals/availability]
      a: |-
        **Short answer.** Read both lines all the time and keep, for each channel, the highest sequence number already processed. A message is accepted the first time its sequence number is seen and ignored the second time.

        **Why.** Exchanges number their messages. Line A and line B carry the same numbers, so the first copy to arrive wins and the other is dropped with one comparison. If line A drops message 501, line B has usually delivered it already.

        The merge step keeps a small state per channel: the next expected number and a short buffer for messages that arrived early. If 502 arrives before 501, it waits a few milliseconds. If 501 never comes on either line, the gap is real. The connector then asks the exchange's replay service for the missing range, or reloads a snapshot, and marks affected prices as possibly stale in the meantime.

        Downstream steps should also tolerate repeats. If the merge process restarts and replays the last second of input, a trade that is stored under its exchange sequence number is written once, and totals such as traded volume are updated only for numbers above the last one applied.

        **Watch out for.** Removing duplicates by comparing price and time. Two different trades can share both, and one would be thrown away.
    - q: The page also shows a price chart for the last day, month and year. How do you store and serve the history?
      level: Mid
      topics:
        [
          /system-design/databases/time-series-databases,
          /system-design/fundamentals/cdn,
          /system-design/patterns/caching,
        ]
      a: |-
        **Short answer.** Store prices in a time-series store as fixed-interval summaries called candles, keep several interval sizes, and serve chart requests from a cache or CDN because every user asks for the same data.

        **Why.** A candle summarises one interval for one asset: the opening price, the highest, the lowest, the closing price and the volume. A chart cannot draw more points than it has pixels, so a one-year chart needs daily candles, about 365 points, and never the raw ticks.

        The sizes are modest. One-minute candles for 5,000 assets are 7.2 million rows a day. At about 50 bytes a row that is 360 MB a day, about 130 GB a year. Larger intervals (5 minutes, 1 hour, 1 day) are built from the smaller ones by a rollup job.

        A time-series store fits because rows arrive in time order, queries are "one asset, one time range", and old data compresses well.

        Serving is cheap because the data is shared. A finished candle never changes, so the response for "asset X, daily candles, last year" can be cached for a long time. Only the newest, still-open candle changes, and the live stream already delivers it.

        **Watch out for.** Building charts by querying raw ticks. A one-year range would scan billions of rows to draw 365 points.
- id: design-collab-editor
  q: Design a collaborative document editor like Google Docs, where several people type in the same document and see each other's changes within a second.
  level: Senior
  category: system-design-questions
  subcategory: messaging-realtime
  topics:
    - /system-design/databases/automatic-conflict-resolution
    - /system-design/fundamentals/websockets
    - /system-design/patterns/cqrs-event-sourcing
  companies: [Microsoft]
  a: |-
    **Short answer.** Each edit is sent as a small operation such as "insert the letter a at position 12". One server process per document puts all operations in a single order, adjusts each one for the edits it did not know about, saves it to a log, and sends it to the other editors over WebSockets.

    **What to clarify.** Plain text or rich text with formatting, tables and comments. How many people edit one document at once: 10 or 1,000. Whether offline editing is needed. Whether version history is in scope. Sharing and permissions.

    **The numbers that drive the design.**

    - Connections. 20 million open editor sessions at the busy hour, at 50,000 WebSockets per server, is about 400 connection servers.
    - Edit rate per document. A fast typist produces about 5 characters a second. Ten people typing at once is 50 operations a second for that document. One process can order that easily, so a single ordering point per document is safe.
    - Storage. An operation is about 50 bytes. One hour of steady typing at 3 characters a second is 10,800 operations, about 540 KB. The log grows without limit, so a full copy of the document, called a snapshot, is saved every 1,000 operations or so.

    **Core design.**

    1. To open a document, the client loads the latest snapshot plus the operations after it, then opens a WebSocket that is routed by document id to the one server that owns that document.
    2. The user types. The client applies the edit to its local copy at once, so typing never waits for the network, and sends the operation with the revision number it was based on.
    3. The document server handles one operation at a time. If other operations were committed after the client's base revision, it transforms the new one against them, for example by shifting its position. This technique is called operational transformation.
    4. The server gives the operation the next revision number, appends it to a durable log, confirms to the sender and broadcasts it to the other editors.
    5. Each receiving client transforms the incoming operation against its own edits that the server has not confirmed yet, then applies it.
    6. A background job writes snapshots. Cursor positions travel on the same socket and are never stored.

    **The hardest part.** Convergence, which means every editor ends with exactly the same text even though each one applied the edits in a different order. Two people typing at the same spot at the same moment must not produce two different documents. The transformation rules have to be right for every pair of operation types, and rich text makes that list long.

    **Main trade-off.** A central server that orders everything keeps the algorithm simpler and makes that server a required stop for every edit. The alternative, a data type that merges without a central order (a CRDT), supports offline and peer-to-peer editing and carries more data per character.

    **What a senior answer adds.** Batching keystrokes, for example every 100 ms, to cut message count. Moving a document to another server when its owner crashes, with the log as the source of truth. Limits for huge documents, such as 100 editors and the rest view-only with a delayed feed. Permission checks on every operation, since access can be removed while the socket is open.

    **Watch out for.** Saving the whole document on each keystroke and letting the last save win. Two people typing together would erase each other's work.
  followUps:
    - q: Two people type at the same position at the same moment. Walk through how both screens end up identical.
      level: Senior
      topics: [/system-design/databases/automatic-conflict-resolution, /system-design/patterns/consistency-models]
      a: |-
        **Short answer.** The server picks one order for the two edits. Each side then shifts the other person's edit to account for its own, and both arrive at the same text.

        **Why.** Take a document at revision 4 containing "cat". Asha inserts "s" at position 3 to make "cats". At the same moment Ben inserts "the " at position 0 to make "the cat". Both edits say "based on revision 4".

        1. Ben's edit reaches the server first. It becomes revision 5. The server's text is "the cat".
        2. Asha's edit arrives, still based on revision 4. The server sees that revision 5 inserted 4 characters before her position, so it moves her insert from position 3 to position 7. It becomes revision 6: "the cats".
        3. Ben's client receives Asha's transformed edit, insert at 7, and applies it: "the cats".
        4. Asha's client receives Ben's edit, insert 4 characters at 0. Her own edit sits after that point, so nothing else moves: "the cats".

        If both insert at exactly the same position, a fixed tie-break decides who goes first, usually the order the server received them. Every client applies the same rule, so they agree.

        **Watch out for.** Using client clocks to decide the order. Clocks on laptops can differ by seconds.
    - q: Operational transformation or CRDTs? How do you choose?
      level: Senior
      topics:
        [/system-design/databases/automatic-conflict-resolution, /system-design/databases/multi-leader-replication]
      a: |-
        **Short answer.** With a central server and users who are mostly online, operational transformation is the simpler fit. Choose a CRDT when editing must work offline for long periods or without a central server.

        **Why.** Both make all copies converge. They differ in where the work is done.

        | | Operational transformation | CRDT |
        |---|---|---|
        | Idea | Adjust each operation against concurrent ones | Give every character a unique, ordered identity so merges always agree |
        | Needs a central order | Yes, in the common design | No |
        | Data per character | Small, positions are plain numbers | Larger, each character carries an id, and deleted ones often leave a marker |
        | Long offline edits | Hard, many operations to transform | Natural, merge when back |

        A CRDT (conflict-free replicated data type) is a structure where any two copies that have seen the same set of changes are equal, whatever order the changes arrived in. Deleted characters usually stay as hidden markers so that later inserts can still find their neighbours. A document with a long history can then use several times the memory of its visible text unless old markers are cleaned up.

        **Watch out for.** Saying CRDTs remove the need for a server. You still need one for storage, permissions and connecting clients.
    - q: Why not use last-write-wins, or lock the paragraph that someone is editing?
      level: Junior
      topics: [/system-design/databases/last-write-wins]
      a: |-
        **Short answer.** Last-write-wins silently throws away one person's typing. Locks keep the text safe and stop people working together, which is the point of the product.

        **Why.** Last-write-wins means that when two versions conflict, the one with the later timestamp replaces the other. Suppose two people have the same paragraph open. One fixes a typo in the first line and the other adds a sentence at the end. Their saves arrive 200 ms apart. The second save replaces the whole paragraph, and the typo fix is gone with no warning. With edits arriving several times a second, this would happen constantly.

        Locking avoids lost work. The first person to click into a paragraph holds it and others must wait. It has three problems. Two people often do want to work on the same paragraph. A lock held by someone who closed their laptop has to time out, and until then everyone is blocked. And for a long list or a table, it is not clear what unit to lock.

        Sending small operations solves both. An insert of one character at one position does not conflict with an insert somewhere else, so almost all concurrent edits merge cleanly.

        **Watch out for.** Hidden last-write-wins. An autosave that uploads the full document every few seconds is exactly that.
    - q: A user edits on a plane for three hours and then reconnects. How do their changes get merged?
      level: Senior
      topics: [/system-design/databases/automatic-conflict-resolution, /system-design/patterns/idempotency]
      a: |-
        **Short answer.** The client stores its operations on the device along with the revision they started from. On reconnect it fetches everything the server committed since then, rebases its own operations on top, and uploads them with ids so that a retry cannot apply them twice.

        **Why.** The offline client is in the same position as an online one, only with a much longer gap. It has a base revision, say 120, and a local queue of perhaps 5,000 operations. The server is now at revision 900.

        1. The client downloads operations 121 to 900.
        2. It transforms its queued operations against those 780 server operations, and applies the server operations to its local copy.
        3. It uploads the rebased operations in batches. Each batch carries a client id and a counter, and the server skips a batch it has already applied.

        Some conflicts have no good automatic answer. If the paragraph the user rewrote was deleted by someone else, the merged result may place their text in an odd spot. Keep the offline version in history and tell the user when their edits touched deleted content.

        **Watch out for.** Keeping the pending queue only in memory. If the app closes before reconnecting, three hours of work are lost.
    - q: How do you show each collaborator's cursor and selection to the others?
      level: Mid
      topics: [/system-design/fundamentals/websockets, /system-design/fundamentals/choosing-realtime]
      a: |-
        **Short answer.** Send cursor positions as small, short-lived messages on the same WebSocket as the edits. Do not save them. Limit how often they are sent, and adjust each remote cursor as edits arrive.

        **Why.** Presence data is different from document data. If a cursor update is lost, the next one replaces it a moment later. So it skips the log and the database: the document server keeps the latest cursor per connected user in memory and relays changes to the others.

        Cursors move far more often than text changes, with every arrow key and mouse drag. Sending each movement to 20 collaborators would outnumber real edits. The client sends at most about 10 updates a second and only when the position changed.

        A cursor is a position in the text, so it must be transformed like an operation. If Asha's cursor is at position 50 and Ben inserts 4 characters at position 10, her cursor should be drawn at 54 on Ben's screen. Each cursor message carries the revision it refers to, so the receiver can shift it correctly.

        When a user disconnects, the server tells the others to remove the cursor.

        **Watch out for.** Writing presence to the main database. It creates a large write load for data that is useless seconds later.
    - q: All editors of one document must reach the same server. How do you route them, and what happens when that server dies?
      level: Senior
      topics:
        [
          /system-design/patterns/consistent-hashing,
          /system-design/patterns/leader-election,
          /system-design/patterns/load-balancing,
        ]
      a: |-
        **Short answer.** Route by document id. A routing layer maps each document to one owner server, using consistent hashing or a lookup table with leases. When the owner dies, another server takes over and rebuilds the document from the snapshot and the log.

        **Why.** Ordering works because one process sees every operation for a document. If two servers both believed they owned it, each would hand out revision 501 to a different edit and the copies would split.

        To prevent two owners, ownership is a lease: a time-limited claim recorded in a coordination service. The log write also includes the expected next revision number, and the store rejects a write whose number is already taken. A server that lost its lease and has not noticed yet then cannot commit anything.

        Recovery is quick because the in-memory state can be rebuilt. The new owner loads the last snapshot and replays up to 1,000 operations. Clients reconnect and resend any operation that was never confirmed. Those carry ids, so one that had in fact been saved is not applied twice.

        **Watch out for.** Confirming an operation before it is in the durable log. A crash would then lose an edit that the user was told was saved.
- id: design-live-comments
  q: Design live comments for a live video, where a popular stream has millions of viewers and each comment should appear for everyone within a couple of seconds.
  level: Senior
  category: system-design-questions
  subcategory: messaging-realtime
  topics:
    - /system-design/fundamentals/choosing-realtime
    - /system-design/patterns/fan-out
    - /system-design/fundamentals/server-sent-events
    - /system-design/patterns/message-queues
  companies: [Meta]
  a: |-
    **Short answer.** A comment is posted with a normal HTTP request, saved, and published once to a topic for that broadcast. Stream servers that hold viewers of the broadcast subscribe to the topic and push comments down each viewer's open connection in small batches.

    **What to clarify.** The size of the largest broadcast and how many run at once. Whether every viewer must see every comment, or a readable sample is acceptable on huge streams. How late a comment may appear. Whether comments are kept for replay after the stream ends. Moderation needs.

    **The numbers that drive the design.**

    - Connections. A top broadcast with 2 million viewers, at 50,000 connections per server, needs 40 stream servers for that broadcast alone.
    - Comment rate. If 1 percent of viewers comment each minute, that is 20,000 comments a minute, about 330 a second. Nobody can read 330 comments a second. A screen shows perhaps 5 to 10.
    - Fan-out. Delivering all 330 to 2 million viewers one by one would be 660 million messages a second. Sending each viewer one batch a second is 2 million frames a second, which 40 servers can do.

    **Core design.**

    1. A viewer opens the video and a Server-Sent Events stream for that broadcast id. Reading comments is one-way, so a one-way stream is enough.
    2. Posting is an HTTP request to the comment service. It checks the rate limit for that user, runs a quick spam check, assigns an id and a sequence number within the broadcast, and writes the comment to a store partitioned by broadcast id.
    3. The comment is published to a pub/sub topic named after the broadcast.
    4. A stream server subscribes to a broadcast's topic while it has at least one viewer of that broadcast, and unsubscribes when the last one leaves.
    5. Each stream server keeps a short buffer per broadcast. Every second, or sooner on quiet streams, it writes the buffered comments to each viewer's connection as one frame.
    6. A new viewer first receives the last 20 or so comments from a cache, then the live flow.

    **The hardest part.** The cost of one broadcast grows as comments times viewers, and both grow together when a stream becomes popular. The answer has two parts: publish once per stream server and never once per viewer, and cap how many comments a second are shown on very large streams.

    **Main trade-off.** Completeness against cost and readability. On a stream with 500 viewers, everyone sees every comment. On a stream with 2 million, each viewer sees a sample. All comments are still saved, and the author always sees their own.

    **What a senior answer adds.** Different treatment for small and huge broadcasts, with a stated threshold. Regional stream servers with one relay per region. What happens when a stream ends and 2 million connections close together. Removing a comment after delivery when moderation rejects it, by sending a "remove id" event on the same stream.

    **Watch out for.** Having each viewer poll for new comments every second. On one large stream that is 2 million requests a second, most of them for data the server could have pushed.
  followUps:
    - q: Do all viewers see the same comments in the same order? What consistency do you promise?
      level: Senior
      topics: [/system-design/patterns/consistency-models, /system-design/patterns/unique-id-generation]
      companies: [Meta]
      a: |-
        **Short answer.** Promise a stable order within one broadcast and that a user always sees their own comment. Do not promise that every viewer sees an identical list at the same instant.

        **Why.** Live comments are a light stream of reactions. A comment appearing half a second earlier for one viewer than another harms nobody. What does look broken is comments changing places on one screen, or a reply appearing before the comment it answers.

        So the comment service assigns each comment a sequence number within its broadcast, from one counter per broadcast. Clients insert comments by that number. If two comments arrive out of order in separate batches, the client places them correctly.

        The author's own comment is drawn on their screen as soon as they post, before the server confirms. When the same comment returns on the stream, the client matches it by a client-made id and does not show it twice.

        On huge streams with sampling, two viewers may see different subsets. Sampling the same comments for everyone makes the experience more shared and also allows one batch to be built once per stream server and reused for all its viewers.

        **Watch out for.** Ordering by the phone's clock. A viewer with a wrong clock would place comments in the past or the future.
    - q: One stream has viewers on dozens of servers in several regions. How does a comment reach all of them in under a second?
      level: Senior
      topics: [/system-design/patterns/fan-out, /system-design/fundamentals/websockets]
      companies: [Meta]
      a: |-
        **Short answer.** Fan out in levels. The comment is published once, relayed once to each region, delivered once to each stream server with viewers, and written by that server to its local connections.

        **Why.** Each level multiplies by a modest number, so no single component does 2 million sends.

        1. The comment service publishes 1 message to the broadcast topic.
        2. A relay in each region subscribes for that region. With 4 regions that is 4 messages across long-distance links.
        3. Within a region, each stream server holding viewers of this broadcast receives 1 copy. With 40 servers that is 40 messages.
        4. Each server writes to about 50,000 local connections. This is a loop over memory, with no network lookups.

        A rough time budget: 20 ms to save and publish, 100 ms between regions, 10 ms inside a region, then up to the batch interval on the stream server. With a 500 ms interval, most viewers have the comment well inside one second.

        Subscriptions are per broadcast, so a server with no viewers of a stream receives nothing for it.

        **Watch out for.** Looking up each viewer's server in a central registry, as a chat system does. Here the servers subscribe to topics, and nobody needs a list of viewers.
    - q: Would you deliver comments with Server-Sent Events, WebSockets or polling?
      level: Mid
      topics:
        [
          /system-design/fundamentals/choosing-realtime,
          /system-design/fundamentals/server-sent-events,
          /system-design/fundamentals/long-polling,
        ]
      a: |-
        **Short answer.** Server-Sent Events for reading, plus ordinary HTTP requests for posting. Most viewers never post, so the connection only needs to carry data one way.

        **Why.**

        | Option | For live comments |
        |---|---|
        | Polling every 1 to 2 seconds | Simple and works with a CDN. Costs a request per viewer per interval |
        | Server-Sent Events | One open response per viewer, built-in reconnect and resume with the last event id |
        | WebSockets | Two-way. Worth it if the app already keeps one open for other features |

        With 1 percent of viewers commenting per minute, a viewer posts about once in 100 minutes. Opening a two-way channel for that is not needed.

        Resume matters at this scale. When a stream server restarts, 50,000 viewers reconnect. With Server-Sent Events each one sends the id of the last event it saw, and the new server replays the few missed comments from its recent buffer.

        Polling deserves a fair mention for the very largest streams. If every viewer sees the same sampled batch, the response for "comments after sequence N" is identical for all of them and can be cached at the edge for a second.

        **Watch out for.** Reconnect storms. Add a random delay of a few seconds to reconnects so 50,000 clients do not arrive in the same instant.
    - q: A stream produces hundreds of comments a second. Which ones do viewers see?
      level: Mid
      topics: [/system-design/patterns/back-pressure, /system-design/fundamentals/abuse-protection]
      a: |-
        **Short answer.** Save every comment, and show a capped sample, for example 10 a second, chosen with a bias toward comments that are more useful to the viewer.

        **Why.** At 330 comments a second the list would scroll too fast to read, and delivering all of them costs bandwidth for no benefit. A cap fixes both problems. Above the cap, a sampler in front of the publish step decides which comments go out live.

        A simple sampler picks at random at the rate needed, for example 10 of every 330. A better one gives priority to some comments:

        - Comments from the broadcaster and moderators always pass.
        - Comments from people the viewer follows are shown to that viewer. This needs a small per-viewer step on the stream server.
        - Comments that passed spam and quality checks are preferred over repeated text and strings of symbols.

        The author must still see their own comment, or people think posting is broken and post again. The client shows it locally whatever the sampler decides.

        The cap should adjust itself. A stream with 3 comments a second shows all of them. The sampler only engages when the measured rate passes the limit.

        **Watch out for.** Dropping comments before saving them. Moderation, replay and the author's own history all need the full record.
    - q: The stream ends and people watch the recording. How do comments replay at the right moments?
      level: Mid
      topics: [/system-design/databases/wide-column-stores, /system-design/fundamentals/cdn]
      a: |-
        **Short answer.** Store each comment with its offset into the video, meaning the number of seconds since the broadcast began. During replay the player fetches comments in chunks by offset range and shows each one when playback reaches its offset.

        **Why.** During the live stream, comments are ordered by wall-clock time. In replay the viewer can pause, skip and change speed, so the only useful clock is the position in the video. The comment service records the offset when the comment is posted: the server time minus the broadcast start time, corrected for the few seconds that video delivery lags behind real time.

        The store is partitioned by broadcast id and sorted by offset. "Give me the comments between minute 10 and minute 11" is then one range read on one partition. A two-hour stream with 330 comments a second holds about 2.4 million comments, so the replay uses the same sampled set that live viewers saw, about 10 a second.

        Replay data never changes after the stream ends, apart from moderation removals. Each one-minute chunk can be served through a CDN and cached for a long time.

        **Watch out for.** Using the commenter's video position as the offset. Viewers are at slightly different points in the live stream, so use the server's clock and one fixed correction.
    - q: The same stream shows a live count of likes that can rise by thousands a second. How do you count and display it?
      level: Senior
      topics: [/system-design/patterns/sharding, /system-design/patterns/caching]
      a: |-
        **Short answer.** Count in memory on many servers, combine the partial counts about once a second, and push the total to viewers on the stream they already have open. Do not write one database row update for each like.

        **Why.** Suppose a stream receives 20,000 likes a second. If each like updated one counter row, 20,000 writers a second would queue on a single row. Each API server adds likes to a local number for the broadcast and, once a second, sends its partial sum to a counter service. The counter service adds the partial sums to the total with one atomic increment each. With 50 API servers that is 50 small writes a second in place of 20,000.

        The counter service publishes the new total once a second to the broadcast topic, and the stream servers include it in the next batch.

        A crashed API server loses up to one second of likes. If each user may like only once, the record of who liked is written to a log or store asynchronously, and the exact total can be rebuilt from it later.

        **Watch out for.** Showing exact digits at large values. "1.2M" hides small corrections that would otherwise make the number appear to jump backwards.
- id: design-llm-chat
  q: Design the serving system for an LLM chat assistant, where users send messages and see the reply appear word by word.
  level: Senior
  category: system-design-questions
  subcategory: messaging-realtime
  topics:
    - /system-design/case-studies/chatgpt
    - /system-design/fundamentals/server-sent-events
    - /system-design/patterns/back-pressure
    - /system-design/patterns/rate-limiting
  a: |-
    **Short answer.** A chat service builds the prompt from the saved conversation and sends it to a pool of GPU inference servers. The model produces the reply a token at a time (a token is a word or a piece of a word), and each token is streamed to the browser as it is produced. In front of the GPUs sit rate limits and a short queue.

    **What to clarify.** Whether we train the model or only serve it. One model or several sizes. Free and paid tiers with different limits. Whether conversation history is saved and for how long. Text only, or also files, images and tools. The target for time to first token, meaning how long the user waits before the reply starts.

    **The numbers that drive the design.**

    - Requests. 10 million daily users sending 10 messages each is 100 million a day, about 1,200 a second, and about 3,500 a second at 3 times peak.
    - Concurrency. A reply of 500 tokens at 50 tokens a second takes 10 seconds. So 3,500 new requests a second means about 35,000 replies being generated at the same moment. If one GPU server can run 50 at once (an assumption that depends on the model and hardware), that is 700 servers.
    - Storage. 100 million messages a day with their replies at about 2 KB each is 200 GB a day of conversation text.

    **Core design.**

    1. The client posts a message with a conversation id and a message id it made itself. The gateway authenticates the user and checks rate limits and quota.
    2. The chat service loads the conversation from its store, partitioned by user id, and builds the prompt: system instructions, earlier turns trimmed to fit the model's context window, and the new message. A safety check runs on the input.
    3. A router chooses a model pool and an inference server with free capacity. If none is free, the request waits in a short queue with a deadline.
    4. The inference server runs many requests together on one GPU and emits tokens for each.
    5. The chat service relays tokens to the client over a Server-Sent Events stream.
    6. When generation ends, the service saves the full reply and the token counts for billing and limits.

    **The hardest part.** GPU capacity is expensive, limited and slow to add, and a request holds it for seconds where a normal web request needs milliseconds. Request sizes also vary by a factor of 100. The system cannot absorb a spike by starting more servers in a minute. It has to control admission: limit by tokens, queue briefly, serve paid users first, and refuse the rest quickly with a clear message.

    **Main trade-off.** Throughput against speed for each user. Running more requests together on a GPU serves more people per server and slows every stream a little. Choose the batch size from the targets, for example first token within 1 second and at least 30 tokens a second.

    **What a senior answer adds.** Time to first token as the main metric, tracked separately from total time. Reusing computed state for a repeated prompt prefix, with routing that sends a conversation back to the same server. Falling back to a smaller model under load. Cost per request as a design input. Stopping generation when the user leaves, to free the GPU.

    **Watch out for.** Waiting for the full reply before sending anything. The user stares at a blank screen for 10 seconds, and any proxy with a shorter timeout cuts the request.
  followUps:
    - q: Why stream tokens with Server-Sent Events and not WebSockets or a plain response?
      level: Mid
      topics:
        [
          /system-design/fundamentals/server-sent-events,
          /system-design/fundamentals/choosing-realtime,
          /system-design/fundamentals/websockets,
        ]
      a: |-
        **Short answer.** The traffic is one request followed by a long, one-way stream of small pieces. Server-Sent Events fit that shape and stay plain HTTP, so existing gateways, authentication and load balancers work without changes.

        **Why.**

        | Option | For token streaming |
        |---|---|
        | Plain response | Nothing appears until the whole reply is ready, about 10 seconds |
        | Server-Sent Events | The server writes each token into an open response. One-way and simple |
        | WebSockets | Two-way and long-lived. Useful for voice or live collaboration, more than text chat needs |

        A user sends one message and then waits. The only thing the client may need to say during generation is "stop", and that can be a separate small request or simply closing the connection.

        Each reply is its own HTTP request, so the serving tier holds no long-lived connection state between messages. Any server can take the next message, and deploys only need to let streams in progress finish, at most a minute or two. A WebSocket held open for a whole session would pin the user to one server.

        **Watch out for.** Buffering between the server and the browser. A proxy or compression step that collects output before forwarding makes the tokens arrive in bursts, so switch buffering off for these responses.
    - q: The user's connection drops half way through a reply. What should happen?
      level: Senior
      topics: [/system-design/patterns/idempotency, /system-design/fundamentals/server-sent-events]
      a: |-
        **Short answer.** Separate generation from the connection. Generation writes tokens to a short-lived buffer keyed by message id, and the client can reconnect and continue from the last token it received. If nobody reconnects within a short time, generation is cancelled to free the GPU.

        **Why.** If the server stops and discards the work the moment the socket closes, a user going through a tunnel loses a reply that was 90 percent finished. If the server always generates to the end, GPUs spend time on replies for people who closed the tab.

        Tokens go to a buffer in a fast store, with an expiry of a few minutes, as well as to the open stream. Every stream event has an index. When the client reconnects it sends the message id and the last index it has. The server replays the rest from the buffer and then continues live.

        The client-made message id also makes the send safe to retry. If the first request did reach the server and only the reply was lost, the retry attaches to the generation already running and does not start a second one.

        **Watch out for.** Saving the reply only when the stream completes successfully. A reply that was generated but never saved disappears on refresh.
    - q: Every GPU is busy and more requests keep arriving. How does the system behave?
      level: Senior
      topics:
        [
          /system-design/patterns/back-pressure,
          /system-design/patterns/load-balancing,
          /system-design/patterns/message-queues,
        ]
      a: |-
        **Short answer.** Queue briefly, in priority order, with a deadline. Beyond that, reject quickly with a clear "busy, try again" answer, and reduce the cost of each request before reducing the number of users served.

        **Why.** Adding GPU servers takes many minutes at best, because machines must start and load a model of many gigabytes. Autoscaling cannot handle a spike that lasts 5 minutes, so the system needs back pressure. Back pressure means a busy component tells the callers to slow down, so work does not pile up without limit.

        - **Bounded queue.** A request waits for a free slot for a few seconds at most. A queue without a limit only turns overload into long waits, and users retry, which adds more load.
        - **Priority.** Paid or interactive traffic is taken first. Batch and background jobs wait or are paused.
        - **Degrade.** Under pressure, send free-tier traffic to a smaller, faster model, shorten the maximum reply length, or switch off optional extra steps.
        - **Shed.** When the queue is full, return an error at once with a suggested wait time.

        **Watch out for.** Client retries without delay. Add growing, randomised waits, or the retries keep the system overloaded after the spike has passed.
    - q: How do you rate limit users when one request can be 100 times more expensive than another?
      level: Mid
      topics: [/system-design/patterns/rate-limiting, /system-design/case-studies/rate-limiter]
      a: |-
        **Short answer.** Limit by tokens as well as by requests. Each user or organisation has a token budget per minute and per day, and a cap on how many replies may be generating at once.

        **Why.** A request limit alone treats "hi" and a 50,000-token document summary as equal. The second uses hundreds of times more GPU time. Tokens track cost closely, so they are the fair unit.

        A token bucket works well. The bucket refills at a steady rate, for example 40,000 tokens a minute, and each request takes tokens out. The difficulty is that the output length is unknown when the request starts. The usual approach is to charge the input tokens plus the requested maximum output at the start, then return the unused part when generation ends.

        Three limits together cover the cases:

        - Requests per minute, to stop floods of tiny calls.
        - Tokens per minute, to match cost.
        - Concurrent generations, to stop one user holding many GPU slots with long replies.

        Counters live in a shared in-memory store so that every gateway server sees the same numbers.

        **Watch out for.** Counting only after generation finishes. A user could start 100 large requests at once before any of them is charged.
    - q: A conversation has grown longer than the model's context window. How do you store history and decide what the model sees?
      level: Mid
      topics:
        [
          /system-design/databases/document-databases,
          /system-design/databases/choosing-a-database,
          /system-design/patterns/caching,
        ]
      a: |-
        **Short answer.** Store every message permanently in a conversation store. For each request, build a prompt that fits a token budget: the system instructions, a summary of older turns, and the most recent turns in full.

        **Why.** The stored conversation and the prompt are different things. The store is the user's record. It is written once per message and read as "all messages of conversation X in order". A store partitioned by user id with messages sorted by conversation and time fits that.

        The context window is the maximum number of tokens the model can read in one request. Say the limit is 100,000 tokens and the conversation holds 300,000. Sending everything is impossible, and even near the limit it is slow and costly, since every input token is processed on every turn.

        Common ways to fit the budget:

        - Keep the newest turns that fit in, say, 20,000 tokens.
        - Replace older turns with a summary, written by a cheaper model call and saved, so it is not recomputed each time.
        - Fetch only the older passages that relate to the new question, using a search over the conversation.

        **Watch out for.** Trimming from the front without care. Dropping the system instructions or the user's first message, which often states the task, changes how the model behaves.
    - q: How should requests be routed to inference servers? Why is round robin a poor choice?
      level: Senior
      topics:
        [
          /system-design/patterns/load-balancing,
          /system-design/patterns/consistent-hashing,
          /system-design/patterns/caching,
        ]
      a: |-
        **Short answer.** Route on real load, measured as streams or tokens in progress on each server, and prefer the server that already holds the computed state for this conversation's prefix.

        **Why.** Round robin gives each server the same number of requests. Here one request may produce 20 tokens and the next 4,000, so equal counts lead to very unequal work. Sending each request to the server with the least work in progress evens this out.

        The second concern is reuse. To continue a conversation, the model must process the whole prompt again, and most of it is the same as on the previous turn. Inference servers can keep the internal state for a prefix they processed recently and skip that work. For a 10,000-token history this can remove most of the wait before the first token. It only helps if the next turn reaches the same server.

        So the router hashes the conversation id to a preferred server, using consistent hashing so the mapping survives servers joining and leaving. It uses that server unless it is overloaded, and otherwise falls back to the least loaded one.

        **Watch out for.** Strict stickiness. If the preferred server is full, waiting for it is slower than recomputing the prefix elsewhere.
- id: design-photo-storage
  q: Design a photo storage and sharing service like Google Photos or iCloud Photos, where users upload from their phones, see the library on every device and share albums.
  level: Mid
  category: system-design-questions
  subcategory: media-streaming
  topics:
    - /system-design/case-studies/instagram
    - /system-design/patterns/blob-storage-and-chunking
    - /system-design/databases/object-storage
    - /system-design/fundamentals/cdn
  companies: [Apple, Google, Meta, Pinterest]
  a: |-
    **Short answer.** Keep the image bytes in object storage and a small record about each photo in a database. Phones upload straight to object storage, background workers make thumbnails, and a CDN serves the images.

    **What to clarify.** Whether this is a private library, a public feed, or both. Whether originals must be kept at full quality. Whether video is in scope. Whether several devices per user must stay in sync. Here the scope is a private library with shared albums and photos only.

    **The numbers that drive the design.**

    - Upload rate. 100 million daily users adding 5 photos each is 500 million photos a day, about 5,800 a second on average and perhaps 3 times that in the evening.
    - Storage. At 2 MB a photo, 500 million photos is 1,000 TB, so about 1 PB of new data every day. Storage cost is the largest bill, and nothing is ever deleted by default.
    - Reads. A library screen shows about 50 thumbnails of 20 KB each, so one screen is 1 MB. Reads of thumbnails far outnumber reads of originals.

    **Core design.**

    1. The app asks the upload service for permission to upload. The service creates a photo record with status "pending" and returns a pre-signed URL, which is a short-lived link that lets the phone write one object directly to object storage.
    2. The phone uploads the file to object storage in chunks of a few MB. If the network drops, it resumes from the last finished chunk.
    3. Object storage emits an event when the upload completes. The event goes onto a queue. Workers read it, check the file is a real image, create two or three smaller sizes, read the capture time and location from the file, and mark the record "ready".
    4. The metadata database holds one row per photo: photo id, owner id, capture time, storage key, sizes, status. It is split across machines by owner id, because almost every query is "this user's photos, newest first".
    5. To view, the app fetches a page of rows, then loads thumbnails from a CDN using signed links that expire. The original is fetched only when the user zooms or downloads.
    6. An album is a list of photo ids plus a list of people allowed to see it. Sharing adds a permission row. It never copies the image.

    <AnimatedDiagram name="fundamentals/storage-types" highlight={["db", "bucket", "cdn"]} caption="Small photo records live in the database, image bytes live in an object storage bucket, and the CDN serves them to readers." />

    **The hardest part.** Keeping the two stores in step. An upload can finish without the record being updated, or a record can point at a file that never arrived. The "pending" status handles both. Readers see only "ready" photos, and a cleanup job removes pending records and stray objects older than a day.

    **Main trade-off.** Making every thumbnail size at upload time costs compute and storage for photos nobody opens again. Making them on first request saves that but makes the first view slow. A common middle path is to create the one or two sizes the library screen needs at upload and the rest on demand, cached at the CDN.

    **What a senior answer adds.** Moving old originals to cheaper storage tiers. Duplicate detection by content hash. A per-user change log so devices sync without rescanning the library. Real deletion, which must remove the object, all thumbnails and the CDN copies within a stated time.

    **Watch out for.** Sending image bytes through your own application servers, or storing them in the database. Both tie up expensive machines doing work that object storage does better and cheaper.
  followUps:
    - q: Why do you store the photo metadata and the image bytes in separate systems?
      level: Junior
      topics: [/system-design/databases/object-storage, /system-design/fundamentals/storage-types]
      companies: [Apple]
      a: |-
        **Short answer.** They are different shapes of data with different needs. Metadata is small and must be searched and updated. Image bytes are large, written once and only ever read whole.

        **Why.** A photo record is about 500 bytes. The photo is about 2 MB, which is 4,000 times larger. A database is built for small rows, indexes and transactions, and its storage is the most expensive kind you run. Filling it with image bytes makes backups slow, makes replicas lag and pushes useful rows out of memory.

        | | Metadata | Image bytes |
        | --- | --- | --- |
        | Size per item | Hundreds of bytes | Megabytes |
        | Changes after write | Often (albums, captions) | Never |
        | Access | Query by owner, date, album | Fetch by key |
        | Best home | Database | Object storage plus CDN |

        The split also lets each side grow on its own. Storage grows by 1 PB a day while the metadata grows by about 250 GB a day.

        **Watch out for.** Forgetting that two stores can disagree. Say which one is the source of truth (the database record) and how orphan objects get cleaned up.
    - q: A user has a phone, a tablet and a laptop. How does each device learn about new, edited and deleted photos?
      level: Senior
      topics: [/system-design/case-studies/dropbox, /system-design/fundamentals/push-notifications]
      companies: [Apple]
      a: |-
        **Short answer.** Keep a change log per user with an ever-increasing number on each entry. Each device remembers the last number it has seen and asks for everything after it.

        **Why.** Comparing the whole library on every sync does not scale. A user with 50,000 photos would send 50,000 ids just to learn that nothing changed. With a change log, every add, edit or delete appends one entry such as "change 9,214: photo X deleted". A device that holds change 9,200 asks for changes after 9,200 and gets 14 small entries.

        To make sync feel instant, the server sends a silent push or a message on an open connection saying "you have changes". The device then pulls. The push is only a hint, so a missed push costs nothing: the next pull catches up.

        Devices download metadata and thumbnails first and fetch originals on demand, so a phone with 64 GB can browse a 500 GB library.

        Deletes need a marker that stays in the log, often called a tombstone. Without it, a device that was offline for a month would upload the "missing" photo again.

        **Watch out for.** Two devices editing the same photo offline. Choose a rule and state it, for example the later edit wins for captions, while the original image is never overwritten.
    - q: The service receives about 1,000 uploads a second. How do you detect that an uploaded image is a duplicate of one already stored?
      level: Senior
      topics: [/system-design/patterns/blob-storage-and-chunking, /system-design/fundamentals/encryption-and-hashing]
      a: |-
        **Short answer.** Compute a cryptographic hash of the file bytes, such as SHA-256, and look it up in an index from hash to stored object. If it exists, point the new photo record at the existing object and skip the storage.

        **Why.** Two files with the same SHA-256 hash are the same file for every practical purpose, so the hash works as a content address. 1,000 uploads a second is about 86 million a day. An index entry of about 50 bytes gives roughly 4 GB of new index a day, which a sharded key-value store handles easily.

        The phone can compute the hash before uploading and ask "do you already have this". A yes saves the whole 2 MB transfer.

        Each stored object needs a reference count. Deleting a photo lowers the count, and the bytes are removed only at zero.

        Exact hashing misses the same picture saved at a different size or quality. For that you need a perceptual hash, which gives similar images similar values, and a nearest-match search.

        **Watch out for.** The check-then-write race. Two uploads of the same new image at the same moment must not both create the object, so make the index insert conditional on the hash being absent.
    - q: Would you keep the photo metadata in a relational database or a key-value store?
      level: Mid
      topics:
        [
          /system-design/databases/choosing-a-database,
          /system-design/databases/relational-databases,
          /system-design/databases/key-value-stores,
        ]
      companies: [Meta]
      a: |-
        **Short answer.** Start with a relational database split by owner id. Move the photo rows to a key-value or wide-column store only if a single query pattern at very large size demands it.

        **Why.** The product has relationships: users, photos, albums, album members, share permissions. Adding a photo to a shared album touches several of these and should either fully happen or not happen. A relational database gives transactions and secondary indexes for this.

        | | Relational, sharded by owner | Key-value or wide-column |
        | --- | --- | --- |
        | "My photos, newest first" | Index on owner and time | Natural fit as a sorted partition |
        | Albums and permissions | Joins and transactions | You build them yourself |
        | Growth to trillions of rows | Needs careful sharding | Built for it |

        At 500 million new rows a day, the photo table reaches hundreds of billions of rows within two years. Because nearly every query carries the owner id, sharding by owner keeps each query on one shard, and both choices work. Many large products end up mixed: albums and permissions stay relational, and the huge append-only photo index moves to a wide-column store.

        **Watch out for.** Choosing by fashion. Name the queries first, then pick the store that answers them.
    - q: Most photos are never opened again after the first few weeks. How do you store hot and cold photos differently?
      level: Senior
      topics:
        [
          /system-design/databases/object-storage,
          /system-design/fundamentals/storage-types,
          /system-design/patterns/caching,
        ]
      companies: [Apple]
      a: |-
        **Short answer.** Keep thumbnails and recent originals on fast storage, and move old originals to a cheaper, slower tier with a rule based on age and last access.

        **Why.** Views drop sharply with age. A photo is opened many times in its first week and then perhaps once a year. Object stores offer colder tiers that cost a fraction per GB, in return for a higher price per read and sometimes a wait before the first byte.

        A workable split:

        - Thumbnails for all photos stay hot. They are about 1% of the bytes and almost all of the reads.
        - Originals stay hot for 30 to 90 days, then move to an infrequent-access tier that still reads in milliseconds.
        - Very old originals can use erasure coding, which stores data as fragments plus parity pieces and uses about 1.5 times the raw size, compared with 3 times for three full copies.

        The metadata row records the tier, so the app can show the thumbnail at once and a progress ring while a cold original loads.

        **Watch out for.** Archive tiers that take minutes or hours to restore. A user who opens a wedding photo from 2015 will not wait an hour, so keep those tiers for backups only.
    - q: How does the design change if machine learning models must run on every uploaded image, for example to label faces and objects for search?
      level: Senior
      topics:
        [
          /system-design/patterns/message-queues,
          /system-design/patterns/back-pressure,
          /system-design/databases/vector-databases,
        ]
      companies: [Google]
      a: |-
        **Short answer.** Add the models as more consumers of the "upload complete" event. They run after the upload is confirmed, never inside it, and write their results to separate indexes.

        **Why.** Model inference is slow and costly compared with the rest of the pipeline. A thumbnail takes a few milliseconds of CPU. A vision model may take 50 to 200 milliseconds on a GPU. At 5,800 uploads a second, even 100 milliseconds per image is 580 GPU-seconds of work every second, so a fleet of several hundred GPUs. That fleet should be sized for the daily average, with the queue absorbing the evening peak.

        Results go to two places. Labels such as "beach" go into a search index keyed by owner. Embeddings, which are lists of numbers that describe an image, go into a vector index for "find similar" queries.

        Run the models on a mid-sized copy, for example 512 pixels wide. It is much cheaper to load than the 2 MB original and accurate enough.

        Plan for reprocessing. When a better model ships, you will want to rerun it over old photos, so keep a low-priority backfill queue that uses spare capacity.

        **Watch out for.** Privacy. Face grouping is regulated in several regions, so it needs a per-user opt-in and results that are deleted when the photo is.
- id: design-video-streaming
  q: Design a video streaming service like YouTube or Netflix, covering upload, processing and smooth playback around the world.
  level: Senior
  category: system-design-questions
  subcategory: media-streaming
  topics:
    - /system-design/case-studies/youtube
    - /system-design/case-studies/netflix
    - /system-design/fundamentals/cdn
    - /system-design/patterns/blob-storage-and-chunking
  companies: [Datadog, Meta]
  a: |-
    **Short answer.** Split the system into two paths. The upload path stores the original file and converts it into many small segments at several quality levels. The playback path serves those segments from a CDN, and the player picks the quality that fits its network, segment by segment.

    **What to clarify.** User uploads like YouTube, or a studio catalogue like Netflix. Whether live streaming is in scope. Which devices must play. Whether content needs copy protection. Here the scope is user uploads and on-demand playback, with no live video.

    **The numbers that drive the design.**

    - Ingest. Assume 500 hours of video are uploaded every minute. That is 720,000 hours a day. If all the stored quality levels together take about 3 GB per hour of video, storage grows by about 2 PB a day.
    - Delivery. 10 million people watching at once at an average of 4 megabits a second is 40 terabits a second. No single site can send that, so nearly all bytes must come from CDN servers close to viewers.
    - Processing. Encoding one hour of video into five quality levels can take several CPU-hours. 720,000 hours a day needs a large, elastic worker fleet.

    **Core design.**

    1. The client asks the upload service for an upload session and sends the file to object storage in chunks, so a failed chunk can be retried alone.
    2. When the upload completes, a job is placed on a queue. The video's record in the metadata database is marked "processing".
    3. A splitter cuts the original into short pieces at safe cut points. Many workers encode the pieces in parallel into a ladder of quality levels, for example 240p, 480p, 720p and 1080p.
    4. A packager turns the output into segments of 2 to 6 seconds each and writes a manifest, which is a small text file that lists every quality level and the address of every segment.
    5. Segments and manifests go to object storage, which is the origin for the CDN. The record is marked "ready" and the video becomes visible.
    6. To play, the app calls the playback API, which checks permission and returns a manifest link. The player downloads the manifest, then fetches segments from the nearest CDN server.
    7. The player measures how fast each segment arrives and moves up or down the ladder for the next one. This is called adaptive bitrate streaming.

    **The hardest part.** The processing pipeline. It is a long chain of steps over large files, and any worker can die half way. Each step must be safe to run again, write its output under a predictable name, and report progress so that a retry redoes one piece and not the whole film.

    **Main trade-off.** Encoding every upload into every quality level right away gives instant, smooth playback but spends compute and storage on videos that get ten views. Encoding only a basic ladder first and adding higher levels once a video proves popular saves a lot, at the cost of lower quality for early viewers.

    **What a senior answer adds.** Placing popular titles on edge servers ahead of demand. Using more than one CDN and switching per viewer on measured quality. Separate metadata, search and recommendation services so that playback survives when they fail. Playback metrics from the player (start time, stalls) as the real health signal.

    **Watch out for.** Serving the video as one big file through the application servers. Seeking, quality switching and caching all depend on small segments served from the edge.
  followUps:
    - q: Where are the single points of failure in this design, and how do you remove them?
      level: Senior
      topics:
        [/system-design/fundamentals/availability, /system-design/fundamentals/cdn, /system-design/fundamentals/dns]
      companies: [Datadog]
      a: |-
        **Short answer.** Walk the playback path from the viewer inwards and ask at each hop what happens if it disappears. The risky ones are DNS, a single CDN, the playback API with its database, and the origin storage region.

        **Why.**

        | Component | If it fails | Fix |
        | --- | --- | --- |
        | DNS | Nobody can find the service | Two DNS providers, long enough cache times |
        | One CDN | Segments stop for a region | A second CDN, the player retries on the other |
        | Playback API | New plays cannot start | Stateless servers in several zones behind load balancers |
        | Metadata database | No manifests can be issued | Replicas with automatic failover, cached manifests |
        | Origin storage | Cache misses fail | Copy segments to a second region |

        A helpful property of segmented video is that a player already holding a manifest needs only the CDN. A 5 minute API outage stops new plays but lets current viewers finish.

        **Watch out for.** Hidden shared parts. The login service, the configuration system and the certificate renewal job are single points of failure that never appear on the whiteboard, and they cause many real outages.
    - q: How does the player choose which quality to show, and what happens when the network gets worse in the middle of a video?
      level: Mid
      topics: [/system-design/case-studies/netflix, /system-design/fundamentals/http]
      a: |-
        **Short answer.** The player decides, one segment at a time. It watches how fast recent segments downloaded and how many seconds of video it has buffered, then requests the next segment at the highest quality it can fetch in time.

        **Why.** The server offers the same content at several bitrates, cut at the same time points. Because every segment starts at the same instant in every quality level, the player can switch levels at any segment border with no visible jump.

        A simple rule: if the last segments arrived at 6 megabits a second, pick the highest level below about 80% of that, so 4 megabits. If the buffer falls under 10 seconds, step down one level at once. If the buffer is above 30 seconds, try stepping up.

        Putting the logic in the player keeps servers simple. They only serve static files over HTTP, which any CDN can cache.

        Playback starts at a low level on purpose. A small first segment arrives in well under a second, and the picture sharpens a few seconds later.

        **Watch out for.** Switching too eagerly. A player that changes quality every few seconds looks worse to the viewer than one that stays one level lower. Require a steady trend before moving up.
    - q: A two hour film takes many CPU-hours to encode. How do you make processing fast, and what happens when a worker dies half way?
      level: Senior
      topics:
        [
          /system-design/patterns/message-queues,
          /system-design/patterns/idempotency,
          /system-design/patterns/blob-storage-and-chunking,
        ]
      a: |-
        **Short answer.** Cut the film into many short pieces, encode the pieces in parallel on separate workers, and track each piece as its own retryable task.

        **Why.** Encoding is slow but it divides well. A two hour film cut into 1 minute pieces gives 120 pieces. With five quality levels that is 600 small tasks. On 200 workers they finish in minutes, where one machine would take most of a day.

        Each task is a message on a queue: "encode piece 37 of video V at 720p". A worker takes the message, which hides it from others for a set time, writes the result to object storage under a name built from the video id, piece number and quality, and then deletes the message. If the worker dies, the message becomes visible again and another worker redoes that one piece. Because the output name is fixed, a second run overwrites the first with the same bytes and causes no harm.

        A coordinator records which tasks are done. When all 600 are complete it starts the packaging step.

        **Watch out for.** A piece that fails every time, for example because the source file is damaged. Cap retries at 3 or so, move the task to a dead-letter queue, and mark the video "failed" with a reason the uploader can see.
    - q: Most videos get very few views and a small number get millions. How does that change what you encode, store and cache?
      level: Senior
      topics:
        [/system-design/fundamentals/cdn, /system-design/patterns/caching, /system-design/databases/object-storage]
      a: |-
        **Short answer.** Treat popularity as an input to every cost decision. Spend encoding effort, fast storage and edge cache space on the small set of videos that carry most of the viewing.

        **Why.** Viewing follows a long tail. A rough but useful picture is that 10% of videos collect 90% of watch time. A design that treats every video the same pays top price for the other 90%.

        - Encoding. Give every upload a quick, basic ladder. When a video passes a view threshold, re-encode it with a slower and more efficient setting. A 20% smaller file for a video with 50 million views saves far more bandwidth than the encode costs.
        - Storage. Keep rarely watched videos in fewer quality levels on a cheaper tier, and rebuild a missing level on demand.
        - Edge cache. An edge server has limited disk. Let popular segments fill it and serve the tail from a regional cache or the origin.

        For a planned release, copy the first minutes of the title to edge servers ahead of time, so the first wave of viewers hits a warm cache.

        **Watch out for.** Sudden popularity. A video can go from 10 views to 1 million in an hour, so the promotion step must react within minutes and must not need a human.
    - q: How do you let a viewer stop a video on the TV and continue from the same point on the phone?
      level: Mid
      topics: [/system-design/databases/key-value-stores, /system-design/databases/last-write-wins]
      a: |-
        **Short answer.** The player sends a small progress update every few seconds. The server stores one record per user and video holding the position and the time of the update. Any device reads that record before it starts playing.

        **Why.** The data is tiny and the access is by exact key, so a key-value store fits. The key is user id plus video id. The value is a position in seconds and a timestamp.

        The write rate decides the design. 10 million viewers reporting every 10 seconds is 1 million writes a second. Three measures bring that down. Report every 30 seconds instead. Always report on pause, on exit and at the end. Have the server keep updates in memory and save them in batches. Losing the last 30 seconds of progress after a crash is acceptable.

        If two devices report for the same video, keep the update with the later timestamp. This is last-write-wins, and it is safe here because the worst outcome is resuming a minute off.

        The "continue watching" row needs a second lookup, by user, sorted by last update. Store that as a small list per user, capped at 50 or so entries.

        **Watch out for.** Writing progress into the main relational database on every heartbeat. This write volume would crowd out the queries that matter.
- id: design-cdn
  q: Design a content delivery network that serves static files such as images, scripts and video segments to users around the world with low latency.
  level: Senior
  category: system-design-questions
  subcategory: media-streaming
  topics:
    - /system-design/fundamentals/cdn
    - /system-design/patterns/caching
    - /system-design/fundamentals/dns
    - /system-design/patterns/consistent-hashing
  a: |-
    **Short answer.** Place cache servers in many locations close to users, send each user to a nearby healthy location, serve files from the local cache, and go back to the customer's origin server only on a miss.

    **What to clarify.** Static content only, or dynamic responses too. Whether customers upload content or the CDN pulls it from their origin. How fast a customer must be able to remove a file everywhere. Here the scope is a pull CDN for static content with purge in seconds.

    **The numbers that drive the design.**

    - Origin offload. With 1 million requests a second worldwide and a 95% cache hit rate, the origins see 50,000 requests a second. Raising the hit rate to 99% cuts that to 10,000. The hit rate is the number the whole design serves.
    - Latency. Light in fibre covers about 200 km per millisecond. A user 8,000 km from the origin pays about 80 ms for each round trip, and a new secure connection needs two or three round trips. A server 200 km away brings each round trip down to a few milliseconds.
    - Edge capacity. A location with 20 cache servers of 20 TB each holds 400 TB. The full catalogue of all customers is far larger, so each location keeps only what its local users ask for.

    **Core design.**

    1. A location, often called a point of presence or PoP, holds a load balancer and a group of cache servers. Build 100 or more of them near large groups of users.
    2. Route users to a PoP. One way is DNS: the CDN's name servers answer each lookup with the address of a nearby, healthy PoP. The other is anycast, where every PoP announces the same IP address and the internet's own routing carries each user to the closest one.
    3. Inside the PoP, the load balancer hashes the URL with consistent hashing to choose a cache server. The same file always lands on the same server, so the PoP stores one copy and not twenty.
    4. The cache server builds a cache key from the host name, path and selected headers. On a hit it replies from memory or disk.
    5. On a miss it fetches from a regional parent cache, and the parent fetches from the origin if it also misses. The response is stored with the lifetime the origin set in its cache headers.
    6. When an object's lifetime ends, the edge asks the origin "has this changed" with a conditional request and refreshes the lifetime if it has not.
    7. A control plane holds customer configuration, sends purge commands to every PoP, and collects logs for billing and monitoring.

    <AnimatedDiagram name="fundamentals/cdn" highlight={["edge", "origin"]} caption="Readers are served by a nearby edge cache, and only a miss travels back to the origin." />

    **The hardest part.** Changing things everywhere at once. A purge or a configuration change must reach thousands of servers in seconds, must be applied even by servers that were offline at the time, and a bad change must be stopped before it reaches every PoP.

    **Main trade-off.** Long lifetimes give a high hit rate and a calm origin, but users may see old content. Short lifetimes are fresher and send more traffic home. The usual answer is long lifetimes on files whose names include a version, and short lifetimes with revalidation on everything else.

    **What a senior answer adds.** A parent cache tier that shields the origin. Collapsing many identical misses into one origin fetch. Serving stale content when the origin is down. Shifting traffic away from an overloaded PoP.

    **Watch out for.** Describing the CDN as "a cache" and stopping. Most of the engineering is in routing, purging and the control plane.
  followUps:
    - q: How do you send each user to the best edge location? Compare DNS-based routing with anycast.
      level: Senior
      topics: [/system-design/fundamentals/dns, /system-design/fundamentals/networking, /system-design/fundamentals/cdn]
      a: |-
        **Short answer.** DNS routing gives the CDN control over which location each user gets, but it reacts slowly. Anycast reacts quickly and needs no decision per user, but the network chooses the path, not you. Many CDNs use both.

        **Why.**

        | | DNS-based | Anycast |
        | --- | --- | --- |
        | How it works | Name server returns a different IP per lookup | Every location announces the same IP |
        | Who decides | The CDN, using location, load and health | Internet routing, by network path |
        | Failover speed | Limited by the DNS record lifetime, often 30 to 60 seconds | Seconds, when a location withdraws its route |
        | Weak point | Sees the DNS resolver's location, not the user's | A route change can move a long download to another location |

        With DNS, a user in Mumbai using a resolver in Singapore may be sent to Singapore. With anycast, "closest" means fewest network hops, which is not always the lowest latency, and you cannot easily move 10% of traffic away from a busy location.

        **Watch out for.** Routing only by geography. The nearest location may be overloaded or have a poor link to that user's network, so feed real latency and health measurements into the decision.
    - q: A customer publishes a wrong price image and needs it removed from every edge server within a few seconds. How do you build purge?
      level: Senior
      topics: [/system-design/patterns/caching, /system-design/patterns/fan-out, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** Send the purge as a small message through a fan-out system to every location, have each cache server mark the object invalid, and keep a log of purges so servers that missed one can catch up.

        **Why.** A purge is a tiny message that must reach thousands of servers quickly and reliably. The control plane accepts the request, gives it a sequence number and writes it to a durable log. Regional relays push it to each location, and each cache server applies it.

        The server does not need to delete bytes from disk at once. It records "this key is invalid as of purge 88,412" and treats the next request as a miss.

        The hard cases are servers that were down or cut off. On reconnect, a server reports the last purge number it applied and replays the rest from the log.

        Purging many files at once works better with tags. The origin labels responses, for example "product-1234", and one purge of the tag invalidates every object carrying it.

        **Watch out for.** The parent tier. If the edge is purged first and refills from a parent that still holds the old copy, the wrong image comes straight back. Purge parents first, or stamp objects with a version the edge can check.
    - q: A popular file expires and thousands of users request it in the same second. How do you stop all of those requests from reaching the origin?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/patterns/back-pressure]
      a: |-
        **Short answer.** Let one request go to the origin and make the others wait for its result. This is called request collapsing. While the fetch runs, you can also keep serving the old copy.

        **Why.** Without protection, every request that arrives during the miss starts its own origin fetch. If the file gets 5,000 requests a second and the origin takes 400 ms to answer, about 2,000 identical fetches pile onto the origin, at the exact moment it is doing its slowest work.

        Three techniques, usually combined:

        1. **Collapse.** The cache server keeps a table of fetches in progress, keyed by cache key. The first miss starts the fetch. Later requests for the same key join a waiting list and all get the same response.
        2. **Serve stale while revalidating.** Hand out the expired copy for a few more seconds while one background request refreshes it. Users see no delay at all.
        3. **Spread expiry.** Add a small random amount to each lifetime, so that copies in many locations do not all expire in the same second.

        **Watch out for.** A waiting list with no limit. If the origin hangs, thousands of requests hang with it. Put a timeout on the fetch and decide what waiting requests get when it fires.
    - q: What should an edge server do when the customer's origin is down or very slow?
      level: Mid
      topics:
        [
          /system-design/fundamentals/availability,
          /system-design/patterns/circuit-breaker-and-retries,
          /system-design/patterns/caching,
        ]
      a: |-
        **Short answer.** Keep serving what it has, even if the copy is past its lifetime, stop sending the origin more traffic than it can take, and return a clear error only for content it has never seen.

        **Why.** For most static content, an image that is an hour old is far better than an error page. So the edge keeps expired objects on disk for a grace period, often hours or days, and serves them when a refresh fails. The origin can allow or forbid this per response with cache headers.

        The edge also has to protect a struggling origin. If fetches start timing out, a circuit breaker opens: the edge stops trying for, say, 10 seconds, then lets a single test request through. Without this, every miss retries and the origin never recovers.

        Other useful measures: keep a short timeout on origin fetches, try a second origin address if the customer has configured one, and cache error responses for a few seconds so that one broken URL does not cause a fetch for every request.

        **Watch out for.** Serving stale private or fast-changing data. A stale stock price or another user's account page is worse than an error, so this behaviour must follow what the origin allows.
    - q: How would you adapt this design to distribute machine learning model files of 100 GB each to a fleet of thousands of serving machines?
      level: Senior
      topics:
        [
          /system-design/patterns/blob-storage-and-chunking,
          /system-design/fundamentals/compression,
          /system-design/patterns/rate-limiting,
        ]
      a: |-
        **Short answer.** Split each file into fixed-size chunks named by their hash, cache the chunks in every data centre, and roll the new version out to machines in waves, with a checksum check before any machine uses it.

        **Why.** The shape of the load differs from web content. There are few objects, each is huge, the readers are your own machines, and they all want the file at once.

        - Chunking. A 100 GB file in 64 MB chunks is about 1,600 chunks. A failed download retries one chunk.
        - Reuse. A new model version often shares many chunks with the old one. Machines download only the chunks they lack.
        - Local tier. One cache group per data centre pulls from central storage once. 2,000 machines then copy from inside the building.
        - Bandwidth. 2,000 machines pulling 100 GB is 200 TB. Limit the rate per machine and the number of machines updating at once, or the transfer will starve live traffic.

        The switch to the new version must be atomic for each machine: download to a new directory, verify every hash, then change one pointer.

        **Watch out for.** Updating the whole fleet together. Start with 1% of machines, check model quality and error rates, then widen. Keep the previous version on disk for a fast rollback.
    - q: What is the difference between a push CDN and a pull CDN, and when would you pick each?
      level: Junior
      topics: [/system-design/fundamentals/cdn]
      a: |-
        **Short answer.** In a pull CDN, the edge fetches a file from your origin the first time someone asks for it. In a push CDN, you upload files to the CDN ahead of time. Pull is the default. Push suits large files you know will be needed.

        **Why.**

        | | Pull | Push |
        | --- | --- | --- |
        | Setup | Point the CDN at your origin | Upload each file to CDN storage |
        | First request | Slow, it goes to the origin | Fast, the file is already there |
        | Storage used | Only files people ask for | Everything you uploaded |
        | Who manages freshness | Cache headers and lifetimes | You, on every release |

        Pull needs almost no work. A site with 1 million images of which 50,000 are popular stores only those 50,000 at the edge.

        Push fits a game studio releasing a 40 GB update at a set hour, or a film going live on a known date. Placing the files in advance means that the first wave of users does not all miss at once.

        **Watch out for.** Thinking the CDN holds the only copy. Edge caches evict files when space runs low, so the origin must always be able to serve everything.
- id: design-food-delivery
  q: Design a food delivery service like Uber Eats or DoorDash, where customers browse nearby restaurants, place an order and track the courier live.
  level: Senior
  category: system-design-questions
  subcategory: marketplace-location
  topics:
    - /system-design/case-studies/uber-eats
    - /system-design/patterns/geospatial-indexing
    - /system-design/patterns/saga
  companies: [Uber]
  a: |-
    **Short answer.** Three apps (customer, restaurant, courier) meet at one order service that owns a strict order state machine. Search finds restaurants that deliver to the address, dispatch picks a courier using live locations, and every state change is pushed to all three sides.

    **What to clarify.** Whether to cover the whole flow or one part such as search, cart or dispatch. One city or many countries. Whether couriers are your own fleet. Whether payment is in scope. Here the scope is browse, order, dispatch and tracking, with payment handled by an outside provider.

    **The numbers that drive the design.**

    - Orders. 10 million orders a day is about 115 a second on average. Meals bunch up at lunch and dinner, so plan for about 10 times that, roughly 1,200 a second.
    - Browsing. People open many restaurant pages per order. At 100 reads per order, the peak is about 120,000 reads a second. Browse is the high-volume path and can be served from caches and a search index.
    - Locations. 300,000 couriers online, each sending a position every 5 seconds, is 60,000 writes a second. These are short-lived values and belong in memory.

    **Core design.**

    1. Restaurants and menus live in a database and are copied into a search index that includes each restaurant's delivery area.
    2. When the customer opens the app, the search service turns the delivery address into a map cell, finds restaurants that serve that cell and are open, and ranks them. Menu pages come from a cache.
    3. The cart is kept on the server per customer and restaurant, so it survives app restarts.
    4. At checkout, the order service rechecks prices and item availability, creates the order as "created", and asks the payment service to hold the money. On success the order becomes "placed".
    5. The restaurant's tablet receives the order over an open connection and accepts it with a preparation time. The order becomes "accepted".
    6. The dispatch service asks the location service for nearby free couriers, estimates arrival times and offers the job to the best one. The courier accepts and the order becomes "courier assigned", then "picked up", then "delivered".
    7. Each state change is published to an event bus. A notifier pushes it to the customer, and the customer's map shows courier positions relayed from the location service.

    <AnimatedDiagram name="uber-eats/architecture" highlight={["order", "dispatch", "location", "bus"]} caption="The order service owns the state, dispatch picks a courier from live locations, and the bus carries each state change to everyone who needs it." />

    **The hardest part.** The order is a long-running process across three parties who can each say no or go silent. The restaurant may reject, the courier may cancel, the payment may fail. Model the order as a state machine with a fixed set of allowed moves, a timeout on every waiting state, and a defined undo for each failure, such as releasing the payment hold.

    **Main trade-off.** Assigning a courier the moment the order is placed is simple but leaves couriers waiting at restaurants. Assigning late, so the courier arrives as the food is ready, uses the fleet better but risks cold food when no courier is free. The answer depends on good preparation time estimates.

    **What a senior answer adds.** One courier carrying two orders from nearby restaurants. Running each city as a mostly independent unit, so a failure stays local. Falling back to simple distance-based estimates when the prediction service is down. Slowing new orders for a restaurant that is overloaded.

    **Watch out for.** Putting browse traffic and order writes on the same database. They differ by a factor of 100 in volume and have opposite needs.
  followUps:
    - q: "Suppose the interviewer says there are 10 million orders in progress at the same time. How do you turn that into requests per second?"
      level: Mid
      topics: [/system-design/fundamentals/estimation, /system-design/fundamentals/capacity-planning]
      companies: [Uber]
      a: |-
        **Short answer.** Divide the number in progress by how long one order lasts to get new orders per second, then add the repeating traffic that every open order produces.

        **Why.** "In progress" is a count at one moment. It becomes a rate once you know the lifetime. If an order takes about 40 minutes from placement to delivery, that is 2,400 seconds. 10 million divided by 2,400 is about 4,200 new orders a second.

        Each order also creates steady background load while it is open:

        - State changes. About 6 per order, so 6 times 4,200 is roughly 25,000 writes a second.
        - Courier pings. If half the orders have a courier on the road reporting every 4 seconds, that is 5 million divided by 4, about 1.25 million location writes a second.
        - Tracking. If 20% of customers have the map open and get an update every 5 seconds, that is 2 million divided by 5, about 400,000 pushes a second.

        So the order database sees tens of thousands of writes a second, while the location and tracking path sees over a million small messages. That gap tells you to build them as separate systems.

        **Watch out for.** Treating 10 million as the requests per second, or dividing by 86,400 as if it were a daily total.
    - q: Walk through what is read and written from the moment a customer opens the app with a delivery address until the restaurant list appears.
      level: Mid
      topics:
        [
          /system-design/patterns/geospatial-indexing,
          /system-design/databases/search-engines,
          /system-design/patterns/caching,
        ]
      companies: [Uber]
      a: |-
        **Short answer.** The request is almost all reads. The address becomes a map cell, the cell gives a list of restaurants that deliver there, live facts such as "open now" filter that list, and a ranker orders it.

        **Why.** Step by step:

        1. The app sends the saved address id. The server reads its latitude and longitude from the customer's profile.
        2. The point is converted to a map cell id.
        3. The search index is read with that cell id. Each restaurant was indexed in advance under every cell inside its delivery area, so the lookup returns a few hundred candidates in a few milliseconds.
        4. Live state is read from a fast store for those candidates: open or closed, paused, current preparation time.
        5. Delivery time and fee are estimated for the top candidates from distance and courier supply in that cell.
        6. The list is ranked and the first page of about 20 is returned.

        The only write is an analytics event recording what was shown. Because many customers share a cell, the candidate list for a cell can be cached for a minute or so.

        **Watch out for.** Searching by a circle around the customer. Delivery areas are irregular shapes drawn around rivers and highways, so index the restaurant's area, not its distance.
    - q: A customer has the same cart open on a phone and a laptop and edits it on both at once. How do you handle that?
      level: Senior
      topics:
        [
          /system-design/databases/automatic-conflict-resolution,
          /system-design/patterns/consistency-models,
          /system-design/patterns/idempotency,
        ]
      companies: [Uber]
      a: |-
        **Short answer.** Send changes as small operations on single items, not as a whole new cart. Edits to different items then never conflict, and edits to the same item are settled by a version check.

        **Why.** If each device uploads the full cart, the last upload wins and silently removes what the other device added. If the phone sends "add 1 burger" and the laptop sends "remove the fries", the server can apply both in either order and get the same cart.

        Store the cart as one row per item with a quantity and a version number. An operation names the item, the change and the version the device last saw.

        | Case | Result |
        | --- | --- |
        | Different items edited | Both applied, no conflict |
        | Same item, relative change (plus 1 and plus 1) | Both applied, quantity rises by 2 |
        | Same item, set to 3 and set to 5 | Version check fails for the later one, device reloads and asks again |

        Each operation carries a unique id, so a retry after a timeout is not applied twice.

        **Watch out for.** Trusting the cart at checkout. Prices and availability may have changed since the items were added, so checkout must validate again against the menu.
    - q: How do you keep checkout consistent, so the customer is never charged without an order and an order never exists without payment?
      level: Senior
      topics:
        [/system-design/patterns/saga, /system-design/patterns/idempotency, /system-design/case-studies/kindle-payments]
      companies: [Uber]
      a: |-
        **Short answer.** Run checkout as a saga: a sequence of local steps, each with an undo step, driven by the order's saved state. Use an idempotency key so that retries never charge twice.

        **Why.** The order database and the payment provider are separate systems, so one transaction cannot cover both. A saga accepts that and makes each step recoverable.

        1. Save the order as "created" with a copy of the items and prices at this moment. The order id doubles as the idempotency key.
        2. Ask the payment provider to authorise the amount, which holds the money without taking it. Pass the key.
        3. On success, mark the order "placed" and send it to the restaurant.
        4. If the restaurant rejects or does not answer within a few minutes, release the hold and mark the order "cancelled".
        5. Take the money only at pickup or delivery.

        If the server crashes after step 2, a recovery job finds orders stuck in "created" for more than a minute and asks the provider about that key. It then either moves the order forward or releases the hold.

        **Watch out for.** A double tap on the pay button. The client must send the same key for the same checkout attempt, and the server must return the first result for a repeated key.
    - q: How would you model the order's states so that the customer, the restaurant and the courier always agree on where the order is?
      level: Mid
      topics:
        [
          /system-design/case-studies/uber-eats,
          /system-design/patterns/cqrs-event-sourcing,
          /system-design/patterns/message-queues,
        ]
      a: |-
        **Short answer.** One service owns the order and is the only writer of its state. The state can change only along a fixed list of allowed moves, and each change is saved together with an event that is then sent to all three apps.

        **Why.** A typical path is created, placed, accepted, courier assigned, picked up, delivered. Side exits are rejected, cancelled and failed. The order service keeps a table of legal moves. "Delivered" can follow only "picked up", so a late or repeated message from a courier app cannot move an order backwards.

        Each change is a conditional update: set the state to "picked up" only if it is currently "courier assigned". If two messages race, one wins and the other is refused cleanly.

        The state change and its event are written in one database transaction, and a relay publishes the event to the bus afterwards. Every consumer therefore sees the same ordered history. Events carry a version number per order, so an app that receives version 5 after version 3 knows it missed one and refetches.

        **Watch out for.** Letting each app keep its own idea of the status and update it locally. The apps should display what the order service says and nothing else.
    - q: How does the design change when you add grocery orders, where one order can hold 40 items from more than one store?
      level: Senior
      topics: [/system-design/case-studies/uber-eats, /system-design/patterns/saga]
      companies: [Uber]
      a: |-
        **Short answer.** The order stops being one unit from one place. Split it into a parent order the customer sees and one child order per store, and add item-level states for out-of-stock items and substitutions.

        **Why.** A grocery order is picked item by item from shelves whose stock data is often wrong. Several things change:

        - Catalogue. A restaurant has about 100 menu items. A supermarket has 30,000 or more products with stock that changes all day. This needs a real product catalogue, an inventory feed per store and product search.
        - Fulfilment. Each child order has its own picker, its own ready time and possibly its own courier. The parent tracks the set.
        - Partial success. If 3 of 40 items are missing, the order continues. Each item has a state: found, replaced, or refunded.
        - Payment. The final amount is known only after picking, because of missing items and products sold by weight. Authorise a little above the estimate and take the true total at the end.
        - Dispatch. Either one courier visits two stores, or two couriers deliver separately.

        **Watch out for.** Forcing grocery into the restaurant model with a few extra flags. Keep a shared core (order, payment, dispatch) and give each business line its own fulfilment workflow.
- id: design-ride-hailing
  q: Design a ride-hailing service like Uber or Lyft, covering ride requests, matching a rider with a nearby driver and tracking the trip from pickup to drop-off.
  level: Senior
  category: system-design-questions
  subcategory: marketplace-location
  topics:
    - /system-design/patterns/geospatial-indexing
    - /system-design/fundamentals/websockets
    - /system-design/patterns/consistency-models
  companies: [Meta, Oracle, Uber]
  a: |-
    **Short answer.** Drivers stream their position to an in-memory location index. A ride request creates a trip record, a matching service picks the best nearby free driver and offers the trip, and a trip service moves the trip through a fixed set of states in a durable database.

    **What to clarify.** Whether pricing, payments and shared rides are in scope. One city or worldwide. How long a rider may wait for a match. Here the scope is request, match, live tracking and the trip lifecycle, with a simple price estimate.

    **The numbers that drive the design.**

    - Location writes. 1 million drivers online, each reporting every 4 seconds, is 250,000 writes a second. Each value is replaced 4 seconds later, so this data belongs in memory.
    - Trips. 20 million trips a day is about 230 a second on average and perhaps 1,000 a second at peak. That is small for a database, and every one of them matters.
    - Matching. Each request looks at perhaps 20 nearby drivers and needs an arrival estimate for each. 1,000 requests a second is 20,000 route estimates a second.

    **Core design.**

    1. The driver app keeps an open WebSocket to a gateway and sends its position and status every few seconds. The location service stores the latest position per driver in an in-memory index grouped by map cell.
    2. The rider asks for a price. The pricing service estimates distance and time for the route and applies the current demand multiplier for the pickup area.
    3. The rider confirms. The trip service writes a trip row with state "requested" and hands the request to the matching service.
    4. Matching asks the location index for free drivers in the rider's cell and the cells around it, estimates each driver's arrival time by road, and picks the best one.
    5. The chosen driver is reserved with a conditional update: set this driver to "offered" only if they are still "free". The offer is pushed to the driver's phone with a timer of about 15 seconds.
    6. If the driver accepts, the trip becomes "driver assigned" and the rider is told. If the driver declines or the timer ends, the reservation is released and matching tries the next driver.
    7. The trip then moves through "arriving", "in progress" and "completed". During the trip, driver positions are pushed to the rider's phone and also appended to a log used for the final fare and for support.

    **The hardest part.** Making sure one driver is given to exactly one rider. Two requests near each other will often choose the same closest driver at the same moment. The reservation step must be atomic, and all decisions about one driver should pass through one place.

    **Main trade-off.** Matching each request at once to the closest driver gives the fastest reply. Collecting requests for a few seconds and solving them together gives a lower total waiting time across the city, because the closest driver for one rider may be the only option for another. Busy cities gain the most from batching.

    **What a senior answer adds.** Running each city or region as its own unit, because drivers and riders in different cities never match. A fallback to straight-line distance when route estimates are slow. Keeping trip state safe through a data centre failure, since a lost trip means a rider in a car with no record.

    **Watch out for.** Writing every location ping to the main database. Keep the live position in memory, and send the history through a log to cheap storage.
  followUps:
    - q: When part of the system is cut off or slow, should matching prefer availability or consistency?
      level: Senior
      topics: [/system-design/patterns/consistency-models, /system-design/fundamentals/availability]
      companies: [Uber]
      a: |-
        **Short answer.** Split the answer by data. Driver locations and the list of candidates can be slightly wrong and should stay available. The assignment of a driver to a trip must be consistent, even if that means a few requests fail and retry.

        **Why.** Different parts of matching carry different costs when they are wrong.

        | Data | If slightly stale | Choice |
        | --- | --- | --- |
        | Driver position | Driver is 100 metres from where we think | Favour availability |
        | Candidate list | We miss one driver or include a busy one | Favour availability |
        | Driver reservation | Two riders get the same driver | Favour consistency |
        | Trip state | Rider charged for a trip that never started | Favour consistency |

        So the location index can be a set of in-memory replicas that accept writes freely and drop old data. The reservation is a conditional write against a store with a single writer per driver, or a quorum write. If that store cannot be reached, the request fails fast and the matcher tries another driver or asks the rider to retry.

        **Watch out for.** Answering with one word for the whole system. The strong answer names which pieces need which guarantee.
    - q: How does the design hold up when the service runs in hundreds of cities on several continents?
      level: Senior
      topics:
        [/system-design/patterns/sharding, /system-design/patterns/geospatial-indexing, /system-design/fundamentals/dns]
      companies: [Uber]
      a: |-
        **Short answer.** Use geography as the partition key. A ride is a local event, so each city's live data can be served from a nearby region, and only slow-changing data such as accounts needs to be global.

        **Why.** A driver in Paris is never matched with a rider in Lima. Location data, matching and active trips for a city can therefore live entirely in the closest data centre. This keeps the round trip from phone to server under about 50 ms and means a failure in one region leaves other continents untouched.

        Inside a region, shard the location index by map cell at city scale, and the trip store by city or trip id. Large cities get shards to themselves.

        Some data must follow the user. A rider from Berlin who lands in Tokyo needs their account, payment method and rating there. Keep this in a globally replicated store. It changes rarely, so replication lag of a second is fine.

        Each city's active trips should be copied to a second region. If the home region fails, phones reconnect to the backup and trips continue.

        **Watch out for.** Cell borders between shards. A rider at the edge of one shard's area needs drivers from the neighbour, so the matcher must be able to query two shards and merge the results.
    - q: The chosen driver does not answer the offer, or loses network in the middle of a trip. What does the system do?
      level: Mid
      topics:
        [
          /system-design/fundamentals/websockets,
          /system-design/patterns/circuit-breaker-and-retries,
          /system-design/fundamentals/push-notifications,
        ]
      a: |-
        **Short answer.** Every wait has a timer owned by the server. An unanswered offer expires and goes to the next driver. A trip in progress keeps its state on the server and continues when the phone reconnects.

        **Why.** Phones lose signal all the time, so silence is a normal input.

        For an offer, the matching service stores "offered to driver D, expires at 10:15:20". If no reply arrives by then, the driver's reservation is released and the next candidate gets the offer. After three or four failed offers, widen the search area. A driver who misses several offers in a row is marked unavailable until they act again.

        A late "accept" that arrives after expiry must be refused. The accept message carries the offer id, and the server accepts it only if that offer is still open.

        During a trip, the server does not end anything because pings stop. It marks the driver's connection as lost and keeps the trip "in progress". The driver app stores positions locally and uploads them on reconnect, so the route and fare can still be computed. If nothing arrives for many minutes, support is alerted.

        **Watch out for.** Using the WebSocket alone for offers. If the app is in the background the socket may be closed, so send a push notification as well.
    - q: At an airport, drivers wait in a holding area and must get rides in the order they arrived. How do you design that queue?
      level: Senior
      topics:
        [
          /system-design/patterns/geospatial-indexing,
          /system-design/patterns/message-queues,
          /system-design/patterns/leader-election,
        ]
      a: |-
        **Short answer.** Replace nearest-driver matching inside the airport zone with a first-in, first-out queue per zone. Drivers join when they enter the marked area, and each new request goes to the driver at the head.

        **Why.** In a waiting lot every driver is about the same distance from the terminal, so "closest" would be random and unfair.

        The zone is a polygon on the map. When a free driver's position falls inside it, the system appends them to that zone's queue with an entry time. The driver app shows "you are number 37".

        A ride request with a pickup inside the airport takes the head of the queue. A driver who does not answer drops out or moves back, by policy.

        Rules that need care:

        - A driver whose position jitters across the edge of the polygon should keep their place for a grace period of a few minutes.

        - Separate queues per vehicle type, since a request for a large car must skip smaller ones.

        All changes to one zone's queue should go through a single writer, so two requests cannot take the same head.

        **Watch out for.** Fake locations. Drivers have a strong reason to appear inside the zone while sitting elsewhere, so check for impossible jumps between pings.
    - q: How would you compute the price of a ride, including higher prices when demand is high?
      level: Mid
      topics: [/system-design/patterns/geospatial-indexing, /system-design/patterns/caching]
      a: |-
        **Short answer.** Price is a base formula on the route's distance and time, multiplied by a demand factor for the pickup area. The factor is recalculated every minute or two per map cell from the ratio of open requests to free drivers.

        **Why.** The base fare is simple: a fixed start fee, plus a rate per km, plus a rate per minute, using the routing service's estimate. The rider sees this price up front and it is stored on the trip, so the amount cannot change later unless the route changes a lot.

        The demand factor needs a small streaming job. Ride requests and driver status changes flow into a stream. Every minute the job counts, for each cell, the requests waiting and the drivers free. A ratio near 1 gives a factor of 1.0. If there are 3 requests per free driver, the factor might be 1.8. The result is written to a cache keyed by cell.

        Smooth the factor over neighbouring cells and over time. Otherwise the price jumps when a rider walks across a street, or swings each minute.

        **Watch out for.** Quoting one price and charging another. Give the quote an id and an expiry of a few minutes, and honour it when the rider confirms.
- id: design-parking
  q: Design a parking garage system for a multi-floor garage, covering entry, spot assignment, payment at exit, and then growth to a chain of garages.
  level: Mid
  category: system-design-questions
  subcategory: marketplace-location
  topics:
    - /system-design/case-studies/parking-garage
    - /system-design/databases/relational-databases
    - /system-design/fundamentals/functional-requirements
  companies: [Amazon, Salesforce]
  a: |-
    **Short answer.** This is a small-scale problem where correctness matters more than volume. A relational database holds spots and tickets, a transaction assigns a free spot at entry, and the exit computes the fee from the ticket and frees the spot.

    **What to clarify.** Spend the first minutes here, because the scope changes the design. Which vehicle sizes exist. Whether the system assigns an exact spot or only counts free spaces. Whether drivers can reserve ahead. How payment works. One garage or many. Whether the interviewer wants classes or services. Here the scope is exact spot assignment for three sizes, pay at exit, then a chain.

    **The numbers that drive the design.**

    - One garage. 2,000 spots, each used by about 4 cars a day, is 8,000 entries and 8,000 exits a day. The peak may be 10 cars a minute per gate.
    - A chain. 5,000 garages produce 80 million gate events a day, about 900 a second. One well-indexed database could take that load. You split by garage for isolation, since garages share nothing.
    - Gate speed. A barrier should open within about 1 second, so the entry decision must not depend on a slow remote call.

    **Core design.**

    1. Data model. A garage has floors, a floor has spots. Each spot has a size (motorcycle, compact, large) and a status (free, occupied, out of service). A ticket links a vehicle's plate, a spot, an entry time, an exit time and a fee.
    2. Entry. A camera or the driver's button starts the request. The service finds a free spot of the right size, marks it occupied and creates the ticket in one transaction. The gate display shows the floor and spot number.
    3. Spot choice. Pick the smallest spot type that fits, on the lowest floor with space. A compact car takes a large spot only when no compact spot is free.
    4. Exit. The driver scans the ticket or the camera reads the plate. The service computes the fee from the parked time and the price rules, takes payment, sets the exit time, frees the spot and opens the gate.
    5. Displays. Free counts per floor and size are kept as counters, updated in the same transaction, and shown on signs.
    6. Chain. Add a garage id to every table. A central service handles accounts, price rules and reports. Each garage's live operations run against its own partition.

    **The hardest part.** Two cars arriving at two gates in the same second must not get the same spot. The assignment has to be an atomic "claim one free spot", done with row locking or a conditional update, not a read followed by a separate write.

    **Main trade-off.** Assigning an exact spot lets you guide drivers and know which spots are taken, but drivers often park somewhere else, so the data drifts unless sensors correct it. Counting free spaces per floor is simpler and never wrong about the total, but cannot guide anyone.

    **What a senior answer adds.** A local controller in each garage that keeps the gates working when the internet link fails. Gate events with unique ids so a retry does not create two tickets. Handling of lost tickets and unreadable plates. Reservations with a held share of spots.

    **Watch out for.** Adding queues, caches and shards to a system that handles a few events a second. State the real load, then put the effort into the data model and the concurrency.
  followUps:
    - q: Two cars reach two different entry gates at the same moment and only one compact spot is left. How do you make sure they are not both given it?
      level: Mid
      topics: [/system-design/databases/relational-databases, /system-design/case-studies/parking-garage]
      a: |-
        **Short answer.** Make "find a free spot and mark it occupied" a single atomic step in the database, so that only one of the two requests can succeed.

        **Why.** The bug appears when the code reads a free spot and then updates it in a second step. Both gates read spot 214 as free, both write "occupied", and both print a ticket for 214.

        Two standard fixes:

        - **Lock the row.** Inside a transaction, select one free compact spot with a row lock, using the database's option to skip rows that another transaction has locked. Gate A locks spot 214. Gate B skips it and finds nothing, or takes another spot. Each then updates and commits.
        - **Conditional update.** Read a candidate spot, then run an update that sets it to occupied only where the id matches and the status is still free. The database reports how many rows changed. One gate sees 1 and the other sees 0 and tries the next candidate.

        The second gate then falls back to a large spot, or shows "full".

        **Watch out for.** A lock held in the application's memory. It works with one server and fails as soon as a second server is added. Let the database enforce the rule.
    - q: The interviewer asks for the low-level design. What classes would you create and how do they work together?
      level: Mid
      topics: [/system-design/case-studies/parking-garage, /system-design/case-studies/vending-machine]
      a: |-
        **Short answer.** Model the real things as classes, and put the rules that are likely to change (spot choice, pricing) behind small interfaces so they can be swapped.

        **Why.**

        | Class | Holds | Main job |
        | --- | --- | --- |
        | ParkingGarage | Floors, gates | Entry point for park and leave |
        | Floor | Spots | Report free spots by size |
        | ParkingSpot | Id, size, status | Assign and release a vehicle |
        | Vehicle | Plate, size | Tell which spot sizes fit |
        | Ticket | Vehicle, spot, entry and exit time | Record of one stay |
        | SpotAllocator (interface) | | Choose a spot for a vehicle |
        | PricingPolicy (interface) | | Turn a ticket into a fee |

        The entry flow: the gate calls the garage's park method with a vehicle. The garage asks the allocator for a spot, the spot is assigned, and a ticket is returned. The exit flow: the garage's leave method takes a ticket, asks the pricing policy for the fee, calls the payment processor, releases the spot and closes the ticket.

        **Watch out for.** A deep class tree such as Car, Truck and Motorcycle with no different behaviour. A size field on Vehicle is enough until behaviour really differs.
    - q: The garage loses its internet connection for an hour. How do cars keep getting in and out?
      level: Senior
      topics:
        [
          /system-design/fundamentals/availability,
          /system-design/patterns/idempotency,
          /system-design/databases/multi-leader-replication,
        ]
      a: |-
        **Short answer.** Put a small controller with its own database inside each garage and make it the source of truth for that garage's spots and open tickets. The cloud gets a copy when the link is up.

        **Why.** A barrier that will not open traps people, so the gates cannot depend on a remote data centre. Everything needed to admit a car and let one out is local data: the garage's own spots and tickets. So the local controller makes those decisions alone, in a few milliseconds.

        Each event the controller creates (ticket opened, ticket closed, payment taken) gets a unique id and goes into a local outbox table. When the link returns, the controller uploads the events in order. The cloud ignores ids it already has, so a retry after a half-finished upload is harmless.

        Some things do need the network: card payment approval, new reservations made in the mobile app, and price changes. For each, pick an offline rule. Examples: accept cards in offline mode up to a small amount, hold back a fixed share of spots for reservations already synced, and keep using the last known prices.

        **Watch out for.** The controller itself failing. Give the gates a manual mode, and back up the controller's disk, or open tickets are lost and nobody can be charged correctly.
    - q: A variant of this question is a package locker such as Amazon Locker. How do you choose which locker a package goes into?
      level: Mid
      topics: [/system-design/case-studies/parking-garage, /system-design/databases/relational-databases]
      companies: [Amazon]
      a: |-
        **Short answer.** Choose the smallest free compartment that fits the package at the locker site the customer picked, reserve it when the order is placed, and release it after pickup or when the pickup window ends.

        **Why.** It is the parking problem with one change: the reservation happens days before the item arrives. Compartments come in a few sizes, say small, medium and large. Sorting sizes from small to large and taking the first one with a free unit keeps large compartments for packages that need them.

        The steps:

        1. At checkout, the service shows only sites with a free compartment of a fitting size for the expected delivery day.
        2. Placing the order reserves capacity at that site, with the same atomic claim used for parking spots.
        3. When the courier scans the package at the site, the system picks the exact door and opens it.
        4. The customer gets a one-time code, valid for about 3 days. Entering it opens the door and frees the compartment.
        5. If the code expires, the package is returned and the compartment is freed.

        **Watch out for.** Codes that can be guessed. A 6 digit code has 1 million values, so limit attempts per site and lock the keypad after a few failures.
    - q: Drivers can now reserve a spot in advance for a time window. How do you prevent overbooking?
      level: Senior
      topics:
        [
          /system-design/case-studies/hotel-booking,
          /system-design/case-studies/ticketmaster,
          /system-design/databases/relational-databases,
        ]
      a: |-
        **Short answer.** Reserve capacity, not a named spot. Keep a count of reserved spots per garage, size and time slot, and accept a booking only if every slot it covers stays within the limit, checked in one transaction.

        **Why.** A named spot is fragile, because the car parked there before may overstay. A count is enough to promise "you will have a space".

        Divide time into slots of 15 or 30 minutes. A table holds one row per garage, size and slot with the number reserved. A booking from 9:00 to 11:00 touches four 30 minute rows. In one transaction, the service adds 1 to each row on the condition that the result does not pass the limit. If any row fails, the whole booking is rolled back.

        Set the limit below the real capacity. If 20% of spots are for reservations, walk-in drivers still find space. The entry gate must also count promised spots: with 5 free spots and 5 reservations starting in the next 15 minutes, a walk-in sees "full".

        **Watch out for.** Overstays. A car that stays past its window uses capacity that was promised to someone else, so keep a small buffer and charge more for extra time.
    - q: How would you calculate the parking fee so that the pricing rules are easy to change?
      level: Junior
      topics: [/system-design/case-studies/parking-garage]
      a: |-
        **Short answer.** Store the rules as data, not as code, and compute the fee at exit from the ticket's entry time, exit time and vehicle type. Save the result and the rule version on the ticket.

        **Why.** Pricing changes often: a new hourly rate, a daily cap, a free first 15 minutes, a weekend price. If these numbers live in code, every change needs a release. If they live in a table, an operator can change them and choose the date they take effect.

        A simple rule set for one garage and vehicle type: first 15 minutes free, then 3 dollars for each started hour, with a cap of 20 dollars per day. A car parked for 2 hours 20 minutes has started 3 hours, so it pays 9 dollars.

        Three details make it correct. Use the server's clock for both times, never the driver's phone. Store money as whole cents in an integer, because decimal fractions in floating point numbers round badly. Record which version of the rules was used, so a disputed fee can be explained a month later.

        **Watch out for.** Stays that cross a rule change or midnight. Decide whether the rules at entry time apply to the whole stay, which is the simplest choice, and write that down.
- id: design-proximity
  q: Design a nearby search service that finds the closest available drivers around a rider while the drivers' locations keep changing.
  level: Senior
  category: system-design-questions
  subcategory: marketplace-location
  topics:
    - /system-design/patterns/geospatial-indexing
    - /system-design/databases/r-tree
    - /system-design/patterns/sharding
  companies: [Uber]
  a: |-
    **Short answer.** Divide the map into cells, keep an in-memory table from each cell to the drivers currently inside it, and answer a search by reading the rider's cell and its neighbours. Each location update moves a driver between cells when needed.

    **What to clarify.** Whether the things being searched move (drivers) or stay still (restaurants), because that decides everything else. The search radius. How fresh a position must be. Whether results must be filtered, for example by "free" or by vehicle type. Here the scope is moving drivers, a radius of a few km, and positions at most a few seconds old.

    **The numbers that drive the design.**

    - Writes. 5 million drivers online, each reporting every 4 seconds, is 1.25 million updates a second. Writes dominate.
    - Memory. One entry per driver with id, position, status and time is about 100 bytes. 5 million entries is 500 MB. The data is tiny. The update rate is what forces many machines.
    - Reads. If 50,000 riders a second open the app or request a ride, each search reads 9 cells. Reads are 25 times rarer than writes.

    **Core design.**

    1. Choose a cell system. A geohash is a short string that names a rectangle on the map, and a longer string names a smaller rectangle inside it. Pick a cell size close to the search radius, for example about 1 km across.
    2. Keep two in-memory tables. The first maps a driver id to the latest position, cell, status and timestamp. The second maps a cell id to the set of driver ids inside it.
    3. On an update, look up the driver's old cell. If the cell is the same, overwrite the position. If it changed, remove the id from the old set and add it to the new one. Most updates stay in the same cell.
    4. On a search, compute the rider's cell, take that cell and its 8 neighbours, collect the driver ids, drop the ones that are not free, compute the true distance to each, and return the closest 10 or 20.
    5. Expire entries. A driver with no update for about 20 seconds is removed, so a phone that died does not stay on the map.
    6. Spread the tables over many servers by region, so each update and each search touches one server or a few.

    **The hardest part.** Uneven density. A city-centre cell at rush hour may hold 2,000 drivers while a rural cell holds none. A fixed cell size is too coarse for the first and too fine for the second, and the busy cell's server takes far more load. Handle this with smaller cells where density is high and by splitting busy regions across more servers.

    **Main trade-off.** Small cells mean fewer candidates to check per search but more cell changes per update and more cells to read. Large cells make updates cheap and searches expensive. Cells about the size of the search radius keep a search to 9 cell reads.

    **What a senior answer adds.** The index gives candidates only. The final order should use driving time, not straight-line distance. The index does not need to be durable, since it rebuilds itself from pings within seconds. A replica per shard keeps searches working when a server dies. For places that do not move, a disk-based index and heavy caching fit better.

    **Watch out for.** Storing live positions in a disk-based database with a spatial index. A million index updates a second on disk is the wrong tool for values that live for 4 seconds.
  followUps:
    - q: A rider is standing right at the edge of a geohash cell. How do you avoid missing a driver who is 50 metres away in the next cell?
      level: Mid
      topics: [/system-design/patterns/geospatial-indexing]
      companies: [Uber]
      a: |-
        **Short answer.** Never search one cell alone. Search the rider's cell plus the 8 cells around it, then compute the real distance to every candidate and keep those inside the radius.

        **Why.** Cells are a way to narrow the search. They say nothing exact about distance. Two points on either side of a cell edge can be 50 metres apart, and two points in opposite corners of one cell can be 1.4 km apart in a 1 km cell.

        Reading the 3 by 3 block of cells guarantees that everything within one cell width of the rider is a candidate, wherever in the cell the rider stands. That is why the cell size is chosen to be about the search radius.

        With geohashes there is a second trap. Cells that are neighbours on the map do not always share a string prefix. Two cells on either side of the equator or of a major grid line have completely different names. So compute the neighbours with the library's neighbour function, never by trimming the last character.

        **Watch out for.** Returning everything in the 9 cells as "nearby". The block is a square about 3 km wide, so its corners are over 2 km from the centre. Always finish with a true distance filter.
    - q: Drivers report their location every 4 seconds. Do you need to save every one of those updates, and how do you absorb the load?
      level: Mid
      topics:
        [
          /system-design/patterns/message-queues,
          /system-design/patterns/back-pressure,
          /system-design/fundamentals/websockets,
        ]
      companies: [Uber]
      a: |-
        **Short answer.** The live index keeps only the latest position per driver, in memory. The full history goes to a log for other uses and is never written to the index's storage.

        **Why.** At 1.25 million updates a second, each value is useful for 4 seconds and then replaced. Writing each one to a durable database would cost a great deal and gain nothing for search.

        Ways to reduce the load:

        - Send over a connection that is already open, with a compact binary message of about 30 bytes.
        - Let the phone adapt. A driver who has not moved 10 metres can report every 15 seconds. A driver on a trip keeps the fast rate.
        - Skip index work when the cell has not changed. A car at 40 km per hour takes about 90 seconds to cross a 1 km cell, so more than 9 in 10 updates only overwrite one small record.

        History still matters for fares, disputes and training arrival-time models. The gateway also appends each ping to a log such as Kafka, and batch jobs move it to cheap storage.

        **Watch out for.** Overload on the index. If a server falls behind, drop the older ping for a driver and keep the newest. A queue of old positions is worse than a gap.
    - q: How do you partition the location data across servers?
      level: Senior
      topics:
        [
          /system-design/patterns/sharding,
          /system-design/patterns/consistent-hashing,
          /system-design/patterns/geospatial-indexing,
        ]
      companies: [Uber]
      a: |-
        **Short answer.** Partition by geography, using a coarse map cell as the shard key. Nearby drivers then sit on the same server and a search touches one shard, or two at a border.

        **Why.** The key choice decides how many servers a search must ask.

        | Shard key | Update | Search | Problem |
        | --- | --- | --- | --- |
        | Driver id | One shard | Every shard | A search fans out to all servers |
        | Coarse cell (city-sized) | One shard | One or two shards | Load is uneven between cities |

        Sharding by a coarse cell, perhaps 50 to 100 km across, keeps a city together.

        The cost is skew. Do not map cells to servers with a fixed formula. Keep a routing table from coarse cell to shard, and let a control service split a hot cell into its four children on separate servers, or merge quiet cells onto one server.

        When a driver crosses a shard border, the update is routed to the new shard, and the old entry expires by itself after 20 seconds.

        **Watch out for.** Load that moves with the clock. Evening peak travels around the world, and a stadium event can triple one cell's traffic for two hours. Rebalancing must be automatic.
    - q: The index returns 200 drivers near the rider. How do you turn those candidates into the few you actually show or offer the ride to?
      level: Senior
      topics: [/system-design/patterns/geospatial-indexing, /system-design/case-studies/google-maps]
      companies: [Uber]
      a: |-
        **Short answer.** Work in two stages. A cheap stage filters and trims the candidates using data already in memory. An expensive stage computes driving time for the short list and ranks on that.

        **Why.** Straight-line distance is fast but misleading. A driver 300 metres away across a river with no bridge may be 10 minutes away by road, while one 1 km behind on the same street is 2 minutes away.

        Stage one, under a millisecond: drop drivers who are not free, whose vehicle type does not match, or whose last ping is older than about 10 seconds. Keep status and vehicle type in the index entry so no second lookup is needed. Sort the rest by straight-line distance and keep the top 20.

        Stage two, tens of milliseconds: ask the routing service for the driving time from each of the 20 to the pickup point, in one batched call. Rank by that time, and include other signals if the product wants them.

        At 50,000 searches a second, routing all 200 candidates would be 10 million route estimates a second. Routing 20 is 1 million.

        **Watch out for.** Filtering after the trim. If you take the closest 20 first and then drop the busy ones, you may end up with 2. Filter first, then trim.
    - q: The rider keeps the app open and watches cars move on the map. Do you recompute and resend the nearby list on every location update?
      level: Senior
      topics: [/system-design/fundamentals/choosing-realtime, /system-design/patterns/rate-limiting]
      companies: [Uber]
      a: |-
        **Short answer.** No. Refresh the rider's view on a fixed interval of a few seconds, send only what changed, and avoid swapping drivers in and out when the difference between them is tiny. This damping is often called debouncing.

        **Why.** There are two reasons, one about cost and one about the user.

        Cost: with 20 cars on screen each reporting every 4 seconds, pushing every ping means 5 messages a second to each open app. With 2 million apps open, that is 10 million messages a second, mostly moving a car icon by a few metres. One combined update every 3 to 5 seconds cuts this by more than 10 times, and the app can animate the cars smoothly between updates.

        User experience: the "nearest" set changes all the time at its edge. The driver ranked 8th and the driver ranked 9th swap places as they move, and icons blink in and out. Add hysteresis, which means requiring a clear margin before changing. Replace a shown driver only if another is better by, say, 15%.

        **Watch out for.** Applying the same damping to matching. The map can be a few seconds behind. The decision about which driver gets the trip must use the freshest data.
    - q: How would the design differ if you were searching for places that do not move, such as restaurants? Compare geohash, quadtree and R-tree.
      level: Mid
      topics:
        [/system-design/databases/r-tree, /system-design/patterns/geospatial-indexing, /system-design/patterns/caching]
      a: |-
        **Short answer.** Static places flip the workload: reads are constant and writes are rare. A disk-based spatial index in a normal database, plus caching, is then the simpler and better choice.

        **Why.** A city gains a few restaurants a day, while millions of people search.

        | Index | Idea | Good at | Weak at |
        | --- | --- | --- | --- |
        | Geohash | Fixed grid, cell name is a string prefix | Simple, works in any key-value store or ordinary index | Same cell size for dense and empty areas |
        | Quadtree | Split a square into 4 whenever it holds too many points | Adapts to density, good in memory | Rebalancing as data changes |
        | R-tree | Tree of bounding rectangles around groups of nearby objects | Shapes and areas, built into many databases | Slower writes, since rectangles must be adjusted |

        For points only, a geohash column with an ordinary index is often enough. For shapes such as delivery areas, use the database's R-tree based spatial index.

        Results for a cell change rarely, so cache them for minutes, keyed by cell and filters.

        **Watch out for.** Using the moving-object design for static data. An in-memory index with 20 second expiry gives you nothing here and loses durability.
- id: design-tinder
  q: Design a dating app like Tinder, where users see nearby profiles, swipe left or right, and get a match when two people swipe right on each other.
  level: Senior
  category: system-design-questions
  subcategory: marketplace-location
  topics:
    - /system-design/case-studies/tinder
    - /system-design/patterns/geospatial-indexing
    - /system-design/patterns/bloom-filter
  a: |-
    **Short answer.** A recommendation service builds each user a stack of nearby profiles that fit their preferences and that they have not seen. A swipe service records every swipe at high volume. A match is created when a right swipe finds that the other person already swiped right.

    **What to clarify.** Whether chat after a match is in scope. How distance and preferences are set. Whether the order of profiles must be smart or simply nearby. Whether a left swipe is final. Here the scope is profiles, the stack, swipes and match detection, with chat treated as a separate system.

    **The numbers that drive the design.**

    - Swipes. 50 million daily users making 100 swipes each is 5 billion swipes a day, about 58,000 a second on average and perhaps 150,000 a second on a Sunday evening.
    - Storage. A swipe is two user ids, a direction and a time, about 30 bytes. 5 billion a day is 150 GB a day and about 55 TB a year.
    - Photos. Each profile shown loads one or two photos of about 200 KB. 5 billion profile views a day makes this a CDN problem, the same as any photo app.

    **Core design.**

    1. Profiles and preferences (age range, distance, who they want to see) are stored in a database. Photos go to object storage behind a CDN.
    2. When the app opens, it sends the user's location. The user is placed in a map cell, and a geo index maps each cell to the active users inside it.
    3. The recommendation service builds the stack. It collects users from the cells within the chosen distance, filters by both people's preferences, removes profiles this user has already swiped, ranks the rest, and returns about 50 at a time.
    4. Each swipe goes to the swipe service, which appends a record keyed by swiper and target. Writes are acknowledged quickly, and the app sends them in small batches.
    5. On a right swipe, the service checks whether the reverse record (target swiped right on swiper) exists. If it does, it creates a match record for the pair.
    6. A match triggers a push notification to both users and opens a conversation in the chat system.

    **The hardest part.** Detecting a match exactly once when both people swipe right within the same moment. If each request checks for the other's swipe before either is saved, both see nothing and the match is lost. Both swipes for a pair must pass through one ordering point, for example a single row or partition keyed by the pair.

    **Main trade-off.** Building stacks ahead of time and caching them makes the app feel instant, but the stack goes stale: people move, change preferences or get swiped by many others. Building on request is fresh but costs a geo query and several filters each time. A common middle path is to build on request, cache the next 100 or so profiles for a few minutes, and recheck the cheap filters when serving.

    **What a senior answer adds.** Putting people who already liked the user near the top, which raises the match rate. Giving new users fair exposure. A compact "already seen" check per user. Splitting data by region, since almost all activity is local. Controls against bots and fake profiles.

    **Watch out for.** Treating the swipe as a simple row update in the main profile database. It is the highest-volume write in the system and needs its own store.
  followUps:
    - q: Two users swipe right on each other within the same second. How do you make sure a match is created, and created only once?
      level: Senior
      topics:
        [
          /system-design/patterns/consistency-models,
          /system-design/patterns/idempotency,
          /system-design/patterns/sharding,
        ]
      a: |-
        **Short answer.** Route both swipes to the same place by using a key built from the pair of user ids in sorted order, and make "record my like and check for theirs" a single atomic step there.

        **Why.** Suppose swipes are stored under the swiper's id. A's swipe lands on shard 3 and B's on shard 9. Each request writes its own record and reads the other's. If both read before the other's write is visible, both find nothing and no match is made, even though both people said yes.

        Build a pair key from the smaller id followed by the larger id. Both A to B and B to A produce the same key and reach the same shard and row. The row has two flags: "lower id liked" and "higher id liked". A swipe is one atomic operation that sets its own flag and returns the row. Whichever request runs second sees both flags set and creates the match.

        To create it only once, write the match with the pair key as its primary key and insert only if absent. A retry or a duplicate message then changes nothing.

        **Watch out for.** Doing the check in a cache without atomic operations. A read followed by a separate write in the cache brings the same race back.
    - q: How do you make sure a user is never shown a profile they have already swiped on?
      level: Mid
      topics: [/system-design/patterns/bloom-filter, /system-design/patterns/caching]
      a: |-
        **Short answer.** Keep a compact "seen" set per user and filter candidates against it when building the stack. A Bloom filter is a good fit because it is small and its only kind of mistake is harmless here.

        **Why.** An active user may have swiped on 100,000 profiles over the years. Checking 500 candidates against the swipe store means 500 lookups per stack, at tens of thousands of stacks a second.

        A Bloom filter is a bit array that answers "definitely not seen" or "probably seen". It uses about 10 bits per item for a 1% error rate. For 100,000 swipes that is 1 million bits, about 125 KB per user.

        The error goes in the safe direction. A false "probably seen" hides a profile the user never saw, so they miss 1 in 100 candidates and never notice. The filter never says "not seen" for a profile that was swiped, so repeats do not appear.

        New swipes are added to the filter as they happen. The swipe store remains the source of truth, and the filter can be rebuilt from it.

        **Watch out for.** Bloom filters cannot remove items. If the product lets users undo a swipe or resets old left swipes after a year, rebuild the filter from the store on a schedule.
    - q: How do you build the stack of recommended profiles quickly when a user opens the app?
      level: Senior
      topics:
        [
          /system-design/patterns/geospatial-indexing,
          /system-design/databases/search-engines,
          /system-design/patterns/caching,
        ]
      a: |-
        **Short answer.** Treat it as a search query with a location filter, run in stages: a geo lookup for candidates, cheap filters, the "seen" check, then ranking of a small remainder.

        **Why.** In a dense city, a 10 km radius can hold several hundred thousand users. Ranking all of them per request is too slow, so each stage must cut the set sharply.

        1. **Geo and hard filters.** Query an index that holds each active user's cell, age, gender and what they are looking for. A search engine with a geo field does this in one query and returns, say, 2,000 candidates, favouring people who were active recently.
        2. **Two-way check.** Keep only candidates whose own preferences include this user.
        3. **Seen filter.** Drop profiles already swiped.
        4. **Rank.** Score the few hundred left. Put people who already liked this user high in the list. Then order by activity, distance and profile completeness.
        5. **Return 50** and cache the next 100 for a few minutes.

        The whole path should take under about 200 ms.

        **Watch out for.** Popular profiles. Without a limit, the same few people appear at the top of every stack, collect thousands of likes they cannot answer, and everyone else gets none. Cap how often one profile is shown per hour.
    - q: How would you store 5 billion swipes a day?
      level: Mid
      topics:
        [
          /system-design/databases/wide-column-stores,
          /system-design/databases/lsm-trees,
          /system-design/databases/choosing-a-database,
        ]
      a: |-
        **Short answer.** Use a store built for heavy appends, partitioned by the swiper's id, such as a wide-column store. Treat left and right swipes differently, because their value is very different.

        **Why.** The load is about 58,000 small writes a second on average, almost never updated, and read in two simple ways: "everything user A has swiped" and "did A like B". A wide-column store based on LSM trees suits this. An LSM tree collects writes in memory and writes them to disk in sorted batches, which makes appends cheap. The partition key is the swiper id and the sort key is the target id, so both reads are a single-partition lookup.

        Not all swipes are equal. Roughly 8 in 10 are left swipes. They are needed only to avoid showing the profile again. Right swipes are needed for matching and for "who liked me". So:

        - Keep right swipes for as long as the account exists.
        - Keep left swipes compactly, or expire them after some months. This also lets people meet again later.

        **Watch out for.** Very active accounts. One user with millions of swipes makes an oversized partition, so add a time bucket to the key or cap the daily swipe count, which products usually do anyway.
    - q: A user flies to another city and opens the app. What has to change so they see local profiles and locals see them?
      level: Mid
      topics: [/system-design/patterns/geospatial-indexing, /system-design/patterns/sharding]
      a: |-
        **Short answer.** The location update moves the user from the old cell to the new one in the geo index, and the cached stack is thrown away. If data is split by region, the request is served by the new region using a copy of the profile.

        **Why.** Location is the main filter, so a stale location makes the product look broken: a visitor in Madrid sees profiles from Toronto.

        On app open, the phone sends its position. The server compares it with the stored one. A large move triggers three actions:

        1. Remove the user from the old cell's set and add them to the new one, so locals can now see them and people at home stop seeing them.
        2. Delete the cached stack, which is full of profiles from home.
        3. Build a new stack from the new cells.

        With regional data centres, the profile is replicated everywhere because it is small and changes rarely. The "seen" set and swipe history stay keyed by user id and are fetched from the home region or replicated lazily.

        **Watch out for.** Trusting the location from the phone without checks. Faked positions are common, so flag jumps that are impossible, such as 5,000 km in ten minutes.
- id: design-maps
  q: Design a maps and navigation service like Google Maps, with a map you can pan and zoom, route planning and live traffic.
  level: Senior
  category: system-design-questions
  subcategory: marketplace-location
  topics:
    - /system-design/case-studies/google-maps
    - /system-design/patterns/geospatial-indexing
    - /system-design/fundamentals/cdn
  a: |-
    **Short answer.** Split the product into three systems that share little: map tiles served from a CDN, a routing service that searches a preprocessed road graph, and a traffic pipeline that turns phone location pings into current road speeds.

    **What to clarify.** Which features are in scope: map display, routing, live traffic, place search. Driving only, or walking and transit too. Whether routes must change while the user is driving. How fresh traffic must be. Whether offline maps are needed.

    **The numbers that drive the design.**

    - Tiles. A tile is one small square piece of the map. Each zoom level has 4 times as many tiles as the one before, so zoom level 20 has 4 to the power 20, about 1 trillion tiles. Most of them are empty ocean or desert, so you store only tiles that have content.
    - Location pings. With 10 million people navigating at the same moment and one ping every 5 seconds, the traffic pipeline receives 2 million pings a second.
    - Road graph. The world's roads form a graph with hundreds of millions of intersections and road segments. A plain shortest-path search across a continent would visit millions of nodes, which is too slow for a request that must return in under a second.

    **Core design.**

    1. **Tiles.** A batch job builds tiles from the map data and stores them in object storage, keyed by zoom level, column and row. Phones fetch them through a CDN. Vector tiles (shapes and labels that the phone draws itself) are smaller than images and can be restyled on the device.
    2. **Routing.** An offline job turns the road data into a graph and precomputes shortcuts between important roads, so a query can skip most small streets. Routing servers hold the graph in memory. The graph is split by region, with precomputed border points for long trips that cross regions.
    3. **Traffic.** Phones send pings to an ingest tier that writes to a message queue. Stream workers match each ping to a road segment (map matching), then compute a moving average speed per segment over the last few minutes. The result goes to an in-memory store that routing servers read.
    4. **ETA.** The routing service sums the travel time of each segment on the route, using live speed for nearby segments and the usual speed for that hour and weekday for segments far ahead.
    5. **Place search.** Places sit in a geospatial index, so "coffee near me" becomes a search over a few nearby cells.

    <AnimatedDiagram name="fundamentals/cdn" highlight={["edge", "origin", "store"]} caption="Map tiles are static files, so almost every tile request ends at a CDN edge and never reaches the origin." />

    **The hardest part.** Fast routing on a graph whose edge weights change every minute. Heavy precomputation gives millisecond queries but assumes fixed travel times. The usual answer is to precompute on the road layout only, and apply live speeds as a cheap second step, or to re-run only the weight step of the precomputation every few minutes.

    **Main trade-off.** Precomputation against freshness. More precomputed shortcuts mean faster queries and slower reaction to a closed road. Tiles have the same tension: long CDN cache times are cheap but delay map corrections.

    **What a senior answer adds.** Rerouting during a trip without recomputing from zero. Privacy for location pings: drop user ids early and keep only segment speeds. Sending many drivers down the same side street creates a new jam, so spread suggested routes. A versioned map data pipeline, so a bad map build can be rolled back.

    **Watch out for.** Storing the map as rows in a database and drawing it per request. Also running plain Dijkstra over the whole planet and calling it done.
  followUps:
    - q: Why is the map cut into tiles, and how do you serve them cheaply?
      level: Junior
      topics: [/system-design/fundamentals/cdn, /system-design/databases/object-storage]
      a: |-
        **Short answer.** Tiles turn an endless map into a fixed set of small static files, and static files can sit on a CDN close to every user.

        **Why.** A phone screen shows only a small area at one zoom level. With tiles, the app works out which 10 to 20 squares cover the screen and asks for exactly those. Each tile has a stable address made of zoom level, column and row, so two users looking at the same city ask for the same files. That makes the cache hit rate very high for busy places.

        The files live in object storage and the CDN pulls them on first request. Vector tiles are often 20 to 50 KB each, so a full screen costs about 1 MB or less. The tile address includes a map version, so a new map build uses new addresses and old cached tiles never need to be purged.

        **Watch out for.** Building all tiles at all zoom levels for the whole planet. Build the low zoom levels fully, and at high zoom build only tiles that contain something. Rarely viewed tiles can be built on first request and then cached.
    - q: A route from Lisbon to Warsaw must come back in under a second. How does the routing service search such a large graph?
      level: Senior
      topics: [/system-design/case-studies/google-maps, /system-design/databases/graph-databases]
      a: |-
        **Short answer.** It does most of the work before the query arrives, by adding precomputed shortcut edges that let the search jump along major roads.

        **Why.** Dijkstra's algorithm explores outward from the start in all directions. For a 3,000 km trip it would touch tens of millions of nodes. Long trips have a pattern, though: a few local streets, then major roads for almost the whole distance, then a few local streets again.

        Preprocessing ranks nodes by importance and adds shortcuts that stand in for whole chains of smaller roads. This technique is called contraction hierarchies. At query time the search runs from both ends and only moves "up" to more important nodes, so it touches a few hundred or a few thousand nodes and finishes in milliseconds.

        | Approach | Query time on a continent | Preprocessing |
        |---|---|---|
        | Plain Dijkstra | seconds | none |
        | A* with a distance estimate | hundreds of ms | none |
        | Shortcut hierarchy | a few ms | minutes to hours |

        **Watch out for.** Putting the road graph in a general graph database and running the search there. Routing needs the graph in memory in a compact array layout, and a general store is far too slow for it.
    - q: How do you turn raw GPS pings from phones into live traffic speeds?
      level: Senior
      topics: [/system-design/patterns/message-queues, /system-design/patterns/geospatial-indexing]
      a: |-
        **Short answer.** Snap each ping to a road segment, compute the speed between consecutive pings, and keep a moving average per segment over the last few minutes.

        **Why.** A raw GPS point can be 10 to 30 meters off, which is enough to land on the wrong road. Map matching fixes this by looking at a short series of points from one trip and picking the path through the road graph that best fits all of them.

        The pipeline is a stream. Pings go into a message queue partitioned by region, so workers for one area hold only that area's road data. Each worker emits one record per segment and trip, with the measured speed. An aggregator keeps a window of about 2 to 5 minutes per segment and publishes the median speed. The median ignores a single driver who stopped for coffee.

        Segments with too few samples fall back to the historical speed for that hour and weekday.

        **Watch out for.** Trusting every ping. A bus on a bus lane, a cyclist with the app open and a parked car all look like traffic. Filter by travel mode and require several different devices before changing a segment's speed.
    - q: How do you find the places near a user, such as the closest fuel stations?
      level: Mid
      topics: [/system-design/patterns/geospatial-indexing, /system-design/databases/r-tree]
      a: |-
        **Short answer.** Index every place by a grid cell id, look up the user's cell and its neighbours, then sort the candidates by real distance.

        **Why.** A normal index on latitude and a separate one on longitude cannot answer "near" well, because each one alone matches a band that goes around the whole planet. A geospatial index maps two dimensions to one key. A geohash or a similar cell scheme gives each small square a short id, and nearby squares mostly share a prefix.

        The query computes the user's cell, reads that cell and the 8 around it, and gets perhaps a few hundred places. It then computes the exact distance to each and returns the top 10. If there are too few results, it widens to bigger cells.

        An R-tree is the other common choice. It groups nearby shapes into bounding boxes, and it suits shapes such as parks and building outlines better than points.

        **Watch out for.** Fixed cell sizes everywhere. A cell that holds 5 places in a village holds 5,000 in a city centre. Use smaller cells where places are dense.
    - q: How does the estimated arrival time stay accurate during a two-hour drive?
      level: Mid
      topics: [/system-design/case-studies/google-maps]
      a: |-
        **Short answer.** Use live speeds for the road just ahead, predicted speeds for the road further away, and recompute as the trip goes on.

        **Why.** Live traffic describes this minute. A jam 150 km away will probably be gone when the driver gets there, and a clear road may be full at rush hour. So the ETA for each segment should use the speed expected at the time the driver reaches it. For the next 15 to 20 minutes of road, live speed is the best guess. Beyond that, the service blends toward the historical speed for that segment, hour and weekday.

        The phone reports its position during the trip, so the server can recompute the remaining time every minute or two with fresh data. If a clearly faster route appears, for example one that saves more than 5 minutes, the app offers it.

        **Watch out for.** Recomputing the whole route from the start on every ping. Only the remaining part matters, and most recomputations change nothing. Check the current route's segments for new delays first, and run a full search only when one appears.
- id: design-distributed-cache
  q: Design a distributed in-memory cache. Start from a single-node LRU cache and make it work across many machines.
  level: Senior
  category: system-design-questions
  subcategory: storage-files
  topics:
    - /system-design/patterns/caching
    - /system-design/patterns/consistent-hashing
    - /system-design/databases/key-value-stores
  companies: [DoorDash, Meta, Microsoft]
  a: |-
    **Short answer.** Each node is a plain LRU cache (a hash map plus a recency list, which evicts the least recently used entry when full). A consistent-hashing ring decides which node owns each key, and a replica per node keeps a failure from emptying part of the cache.

    **What to clarify.** Whether the cache is the only copy of anything or sits in front of a database. Value sizes and total data size. The read to write ratio. Whether a stale read is acceptable and for how long. Whether lost entries after a crash are acceptable, since they can be reloaded from the database.

    **The numbers that drive the design.**

    - Memory. 400 GB of hot data on nodes with 64 GB of RAM, of which about 50 GB is usable for entries, needs 8 nodes. Add a replica of each and it is 16.
    - Throughput. One node can serve around 100,000 simple operations a second. A target of 1 million a second needs 10 or more nodes, so throughput and memory both ask for about the same fleet.
    - Remapping. With a "hash modulo node count" scheme, going from 8 to 9 nodes moves about 8 of every 9 keys. With consistent hashing it moves about 1 in 9.

    **Core design.**

    1. **Single node.** A hash map from key to entry, and a doubly linked list in recency order. Get and set are constant time. Each entry has an optional expiry time (TTL).
    2. **Partitioning.** Place each node at many points on a hash ring, for example 100 to 200 virtual nodes each. A key belongs to the first node clockwise from its hash. Virtual nodes even out the load and spread a departed node's keys over all the others.
    3. **Routing.** A smart client library holds the ring and calls the right node directly, which saves a network hop. A proxy tier is the alternative when you cannot control the clients.
    4. **Membership.** A small coordination service holds the list of live nodes. Nodes send heartbeats, and clients watch the list for changes.
    5. **Replication.** Each primary copies writes to one replica without waiting for it. If the primary dies, the replica takes over its ranges.
    6. **Usage pattern.** Applications use cache-aside: read the cache, on a miss read the database and fill the cache. On a database write, delete the cache key.

    **The hardest part.** Keeping the cache and the database in agreement. A reader can load an old value from the database, a writer can then update the database and delete the key, and the reader can then store the old value. Short TTLs limit the damage. Deleting the key again after a short delay, or filling the cache from the database's change stream, closes most of the gap.

    **Main trade-off.** Replication against memory. A replica halves the data you can hold for the same cost. For a pure cache in front of a database, many teams skip replicas and accept a short period of extra misses after a node dies. Replicas are worth it when a cold cache would overload the database.

    **What a senior answer adds.** Protection for the database when many nodes restart at once: warm new nodes before they take traffic. Hot key handling. Memory fragmentation and large values. Multi-region: keep one cache per region and send invalidations across regions.

    **Watch out for.** Calling the cache a source of truth. Also forgetting that a node which rejoins after a network problem may hold old values, so it should start empty.
  followUps:
    - q: How are keys mapped to nodes, and what changes when a node joins or leaves?
      level: Mid
      topics: [/system-design/patterns/consistent-hashing, /system-design/patterns/sharding]
      companies: [DoorDash]
      a: |-
        **Short answer.** Hash both keys and nodes onto the same ring. A key belongs to the next node clockwise, so a membership change only moves the keys next to the node that changed.

        **Why.** With `hash(key) mod N`, changing N changes the answer for almost every key. Going from 10 to 11 nodes remaps about 91 percent of keys, and the cache is nearly empty for a while. On a ring, a new node takes over only the ranges just before its points, about 1/11 of the keys, or 9 percent.

        Each physical node gets 100 or more points on the ring, called virtual nodes. Without them, 10 random points give very uneven ranges, and a node that leaves hands its whole load to one neighbour. With them, the load of a departed node is split among all the others.

        When a node joins, the keys it now owns are simply missing on it. For a cache that is fine: they are misses and get refilled. The old owner still holds the old copies until they expire or are evicted.

        **Watch out for.** Clients with different views of the ring. During a change, two clients can read and write the same key on different nodes. Version the ring and roll it out fast, and keep TTLs so stray copies die.
    - q: A cache node dies during peak traffic. What happens, and how do you limit the damage?
      level: Senior
      topics:
        [
          /system-design/patterns/caching,
          /system-design/fundamentals/availability,
          /system-design/patterns/circuit-breaker-and-retries,
        ]
      companies: [Meta]
      a: |-
        **Short answer.** Its share of keys turns into misses, so the database behind the cache gets that share of read traffic at once. The design must make sure the database survives it.

        **Why.** With 10 nodes and a 95 percent hit rate, the database normally sees 5 percent of reads. Lose one node and 10 percent of keys miss every time until refilled, so database load roughly triples for a short period. Lose three nodes in one rack and it can be six times normal.

        Steps that limit the damage:

        - Clients detect the failure with a short timeout, mark the node dead and move on. They must not wait a full second on every request.
        - The ring sends the dead node's keys to the remaining nodes, which refill on demand.
        - A replica, if you have one, takes over with warm data.
        - The application limits concurrent database loads, so extra requests wait or get a stale or default answer.

        **Watch out for.** A node that is slow, not dead. It passes health checks and holds every request for its keys until the timeout. Use tight timeouts and a circuit breaker per node, which stops calling a node after repeated failures.
    - q: Would you replicate cache data, and if so how?
      level: Mid
      topics: [/system-design/databases/sync-vs-async-replication, /system-design/patterns/caching]
      companies: [DoorDash]
      a: |-
        **Short answer.** Replicate only when losing a node's data would hurt the system behind the cache, and then use one asynchronous replica per primary.

        **Why.** A cache entry can be rebuilt from the database, so losing it costs latency, never data. That makes replication a capacity choice.

        | Option | Memory cost | After a node fails |
        |---|---|---|
        | No replica | 1x | misses for that node's keys until refilled |
        | One async replica | 2x | replica takes over, a few last writes lost |
        | Sync replica | 2x and slower writes | nothing lost |

        Asynchronous copying keeps writes fast, since the primary answers before the replica confirms. The cost is that the replica can be a few milliseconds behind. For a cache with TTLs this is almost always acceptable. Synchronous copying makes sense only when the "cache" holds data with no other home, such as sessions or rate-limit counters, and then it is really a small database.

        **Watch out for.** Reading from replicas to gain throughput and then being surprised by stale reads after a delete. If a delete has not reached the replica, a reader gets the old value back.
    - q: One very popular key expires and thousands of requests miss at the same moment. How do you protect the database?
      level: Senior
      topics: [/system-design/patterns/caching, /system-design/patterns/back-pressure]
      a: |-
        **Short answer.** Let only one request rebuild the value, and make the others wait for it or serve the old value in the meantime.

        **Why.** This problem is called a cache stampede or thundering herd. Suppose a product page key gets 5,000 reads a second and its database query takes 200 ms. When the key expires, about 1,000 requests miss before the first one finishes, and each runs the same expensive query.

        Common fixes, often combined:

        - **Single flight.** The first request that misses takes a short lock for that key. Others wait for the result or retry after a few milliseconds.
        - **Serve stale while refreshing.** Keep the value a little longer than its logical expiry. The first request after expiry starts a refresh, and everyone else still gets the old value.
        - **Jitter.** Add a random amount to each TTL, so keys written together do not all expire in the same second.
        - **Early refresh.** A background job refreshes the hottest keys before they expire.

        **Watch out for.** A lock with no timeout. If the request that holds it crashes, nobody rebuilds the key. Give the lock an expiry of a few seconds.
    - q: How do you keep cached values from going stale when the database changes?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/patterns/consistency-models]
      a: |-
        **Short answer.** Delete the cache key after every database write, and keep a TTL on every entry as a safety net for the deletes that get lost.

        **Why.** There are three main tools.

        - **TTL only.** Simple. Data can be stale for up to the TTL. Good for content where a minute of delay is harmless.
        - **Delete on write.** The application writes the database, then deletes the key. The next read reloads it. Deleting is safer than updating the cache in place, because two writers updating in place can finish in the opposite order and leave the older value.
        - **Change stream.** A service reads the database's log of changes and deletes or updates keys. This catches writes from every application, including batch jobs and manual fixes.

        Version numbers help too. If each value carries the row version, the cache can refuse to replace a newer value with an older one.

        **Watch out for.** Deleting the key before the database write. A reader in between reloads the old value and it stays until the TTL ends. Write first, then delete.
    - q: Why LRU, and when would you pick a different eviction policy?
      level: Junior
      topics: [/system-design/patterns/caching]
      a: |-
        **Short answer.** LRU is a good default because recently used data tends to be used again soon. Pick another policy when access patterns break that assumption.

        **Why.** LRU evicts the entry that has gone longest without a read or write. It needs only a hash map and a linked list, and each operation takes constant time.

        | Policy | Evicts | Fits |
        |---|---|---|
        | LRU | least recently used | general workloads |
        | LFU | least frequently used | a stable set of popular keys |
        | FIFO | oldest inserted | very simple caches |
        | TTL based | soonest to expire | data with a natural lifetime |

        LRU has one known weakness. A one-time scan, such as a batch job reading 1 million cold keys, pushes out the truly hot keys. LFU resists this because one read does not make a key popular. Many production caches use a mix: a small area for new entries and a main area that an entry reaches only after a second access.

        **Watch out for.** Exact LRU with one global lock on a busy node. Every read updates the list, so the lock becomes the bottleneck. Split the cache into segments with separate locks, or sample a few entries and evict the oldest of the sample.
- id: design-file-sync
  q: Design a file sync service like Dropbox or iCloud Drive, where files in a folder stay in sync across all of a user's devices.
  level: Senior
  category: system-design-questions
  subcategory: storage-files
  topics:
    - /system-design/case-studies/dropbox
    - /system-design/patterns/blob-storage-and-chunking
    - /system-design/databases/object-storage
  companies: [Amazon, Apple, Dropbox, Meta]
  a: |-
    **Short answer.** Split every file into blocks, store the blocks in object storage under the hash of their content, and keep a separate metadata database that says which blocks make up each version of each file. Devices sync by exchanging metadata changes and moving only the blocks they lack.

    **What to clarify.** Maximum file size. Whether sharing between users is in scope. Whether old versions must be kept and for how long. What happens when two devices edit the same file. Which clients exist: desktop with a watched folder, mobile, web.

    **The numbers that drive the design.**

    - Storage. 100 million users with 5 GB each is 500 PB before removing duplicates. That rules out anything except object storage.
    - Block savings. With 4 MB blocks, a 1 GB file is 256 blocks. Changing a few bytes re-uploads one 4 MB block, which is 0.4 percent of the file.
    - Metadata. 100 million users with 2,000 files each is 200 billion file records. The metadata database must be sharded.

    **Core design.**

    1. **Client watcher.** A desktop agent listens to file system events and keeps a small local database of each file's size, modified time and block hashes.
    2. **Chunking.** When a file changes, the client splits it into blocks, hashes each block (SHA-256) and compares with the hashes it had before.
    3. **Upload.** The client asks the server which hashes are missing, then uploads only those blocks straight to object storage through short-lived signed URLs.
    4. **Commit.** The client sends the new block list to the metadata service with the version it started from. The service checks that all blocks exist and writes the new version in one transaction.
    5. **Notify.** Each commit appends to a per-user change log with an increasing sequence number. Other devices hold a long-poll or WebSocket connection, learn that something changed, and ask for "all changes after sequence 8841".
    6. **Download.** The other device compares the new block list with what it has and fetches only the missing blocks.

    **The hardest part.** Correct sync when devices are offline or fail halfway. The commit is the single point where a new version becomes real. Blocks uploaded without a commit are harmless and get cleaned up later. Each device keeps a cursor into the change log, so it can resume after any crash.

    **Main trade-off.** Block size. Small blocks save more bandwidth on edits and find more duplicates, but they multiply metadata and request counts. A 1 GB file at 4 MB is 256 records. At 64 KB it would be 16,384.

    **What a senior answer adds.** Conflict handling that never loses data. Metadata sharded by user or by shared folder, so one transaction stays on one shard. Garbage collection of blocks with no remaining references. Encryption at rest and per-user keys. Bandwidth limits and LAN sync between devices on the same network.

    **Watch out for.** Sending file bytes through the application servers. Also polling the server every few seconds from every device, which at 100 million devices is tens of millions of mostly empty requests a second.
  followUps:
    - q: How does the desktop client notice local changes and upload only the blocks that changed?
      level: Mid
      topics: [/system-design/patterns/blob-storage-and-chunking, /system-design/case-studies/dropbox]
      companies: [Dropbox]
      a: |-
        **Short answer.** The operating system reports which files changed, and the client compares the new block hashes with the stored ones and uploads only blocks whose hash is new.

        **Why.** Every desktop system has an API that reports events in a watched folder. The client waits a second or two after the last event, because programs often save in several steps. It then checks size and modified time against its local database. If they differ, it re-reads the file, splits it into blocks and hashes them.

        With fixed 4 MB blocks, an edit in the middle of a 1 GB file changes one hash out of 256. The client sends the list of hashes, the server answers with the ones it does not have, and the client uploads those.

        Fixed blocks have a weakness. Inserting one byte at the start shifts every boundary, so every block looks new. Content-defined chunking fixes this by placing boundaries where a rolling hash of the content hits a pattern, so boundaries move with the content.

        **Watch out for.** Trusting events alone. Events are lost when the client is not running or the event buffer overflows. Run a full scan at startup and from time to time.
    - q: Two devices edit the same file while both are offline. What happens when they reconnect?
      level: Senior
      topics:
        [
          /system-design/databases/automatic-conflict-resolution,
          /system-design/databases/last-write-wins,
          /system-design/case-studies/dropbox,
        ]
      companies: [Dropbox, Amazon]
      a: |-
        **Short answer.** The first commit to reach the server wins the file name. The second is detected as a conflict and saved next to it as a separate "conflicted copy", so no edit is lost.

        **Why.** Every commit says which version it was based on. Device A and device B both start from version 7. A reconnects first and commits: base 7, the current version is 7, accepted as version 8. B then commits with base 7, but the current version is now 8, so the server rejects it.

        For general files the server cannot merge the two. It has no idea how to combine two edited spreadsheets or images. So B's client keeps its content under a new name such as "report (conflicted copy from laptop)" and downloads version 8 under the original name. A person decides what to keep.

        Last write wins, which silently keeps whichever commit has the later timestamp, is simpler and throws away somebody's work. Device clocks can also be wrong by minutes.

        **Watch out for.** Comparing timestamps to detect conflicts. Use the base version number. A conflict is "my base is no longer the latest", whatever the clocks say.
    - q: How does the metadata service record which blocks belong to which version of a file?
      level: Senior
      topics:
        [
          /system-design/databases/relational-databases,
          /system-design/patterns/sharding,
          /system-design/patterns/blob-storage-and-chunking,
        ]
      companies: [Dropbox]
      a: |-
        **Short answer.** Each file version is a row holding an ordered list of block hashes. Blocks never change, so a new version is a new list that reuses most of the old hashes.

        **Why.** A workable schema has three parts:

        - **File.** File id, owning namespace (a user's root or a shared folder), path, pointer to the latest version.
        - **Version.** File id, version number, size, ordered block hash list, device, time.
        - **Block.** Hash, size, storage location, reference count.

        A commit must update the latest pointer, insert the version and add to the change log together. That is a transaction, so a relational database is a natural fit. Shard by namespace id, so that everything a commit touches is on one shard.

        A 1 GB file has 256 hashes of 32 bytes, about 8 KB per version, which fits in one row. Keeping 30 days of versions costs only metadata plus the blocks that really changed.

        Deleting a version lowers the reference count of its blocks. A background job removes blocks at zero after a waiting period.

        **Watch out for.** Deleting a block the moment its count reaches zero. An upload in progress may be about to reference it. Wait a day or more, and recheck before deleting.
    - q: "Variant: sync reading progress in an e-book app across a user's devices. How do you stop devices from overwriting each other's position?"
      level: Mid
      topics: [/system-design/databases/last-write-wins, /system-design/patterns/consistency-models]
      companies: [Amazon]
      a: |-
        **Short answer.** Store one small record per user and book, and resolve conflicts with a rule that fits reading: keep the furthest position, and ask the user when the gap is large.

        **Why.** The data is tiny, a position number per book. Each device saves progress locally at once, then sends it to the server when online. The record carries the position, the device and a server-assigned version.

        The problem case is a tablet that was offline for a week at page 40 while the phone moved on to page 200. With plain last write wins, the tablet reconnects, sends page 40 with a fresh timestamp, and the phone jumps backwards. A "furthest position wins" rule avoids that. Since users sometimes go back on purpose, apps commonly show a prompt such as "Go to page 200, the furthest read on your phone" when positions differ a lot.

        Two devices reading at the same time each keep their own local position and only receive suggestions. Neither is forced to jump.

        **Watch out for.** Sending an update on every page turn. Batch them, for example every 30 seconds or when the app goes to the background. Updates must also be idempotent: sending the same position twice changes nothing.
    - q: How do other devices learn that a file has changed?
      level: Mid
      topics:
        [
          /system-design/fundamentals/long-polling,
          /system-design/fundamentals/choosing-realtime,
          /system-design/fundamentals/push-notifications,
        ]
      a: |-
        **Short answer.** Each device keeps one cheap open connection that only says "you have changes". The device then pulls the changes from the metadata service with its cursor.

        **Why.** Splitting the signal from the data keeps both parts simple. The notification service holds millions of idle connections and knows nothing about files. When a commit lands in a namespace, the metadata service publishes the namespace id. The notification servers wake the devices subscribed to it.

        The device then calls "list changes after sequence N". This call is the source of truth. If a notification is lost, the next one, or a periodic check every few minutes, picks up the same changes, because the cursor has not moved.

        Long polling is enough here. Traffic flows one way and events are rare, perhaps a few per device per hour. A request that waits up to 60 seconds for news costs little. Mobile apps in the background cannot hold a connection, so they get a silent push notification and sync when woken.

        **Watch out for.** Putting file data or change lists inside the notification. Then a lost or reordered notification means lost data. Keep it a hint.
    - q: Requests arrive at ten times what the service can handle. What do you do?
      level: Senior
      topics:
        [
          /system-design/patterns/back-pressure,
          /system-design/patterns/rate-limiting,
          /system-design/fundamentals/abuse-protection,
        ]
      companies: [Amazon]
      a: |-
        **Short answer.** Reject the excess early and cheaply, keep the most important requests working, and make clients back off so the overload does not feed itself.

        **Why.** A server that accepts everything gets slower for everyone until nothing completes. It is better to serve 10 percent well and tell 90 percent to come back later.

        - **Shed load at the edge.** The gateway returns status 429 or 503 with a Retry-After header once queues pass a limit. A rejection costs far less than a real request.
        - **Prioritise.** A commit from a user who is saving work matters more than a background scan. Give classes of requests separate limits.
        - **Client backoff.** Sync clients retry with exponential delay and random jitter. Without jitter, a million clients retry in the same second.
        - **Limit per user and per device.** One broken client in a loop must not take capacity from others.
        - **Scale out.** Add stateless servers, but check that the database behind them is not the real limit.

        A sync service has one advantage: most work can wait. A file that syncs 5 minutes late is rarely a disaster.

        **Watch out for.** Retries that multiply load. If three layers each retry three times, one user action becomes 27 requests. Retry at one layer only.
- id: design-key-value-store
  q: Design a distributed key-value store that offers get, put and delete, replicates data across nodes and stays available when nodes fail.
  level: Senior
  category: system-design-questions
  subcategory: storage-files
  topics:
    - /system-design/case-studies/key-value-store
    - /system-design/databases/key-value-stores
    - /system-design/patterns/consistent-hashing
    - /system-design/databases/replication-quorums
  companies: [Airbnb, Apple, LinkedIn, Lyft, Microsoft, Snowflake]
  a: |-
    **Short answer.** Partition keys across nodes with consistent hashing, store each key on 3 nodes, and use quorums (a minimum number of replicas that must answer) for reads and writes. Each node stores its data in a log-structured engine on disk.

    **What to clarify.** Key and value sizes. Whether range scans are needed or only point lookups. Whether the caller wants the latest value always, or accepts a slightly old one in exchange for availability. Expected request rate and data size. Single region or several.

    **The numbers that drive the design.**

    - Storage. 10 TB of data with 3 copies is 30 TB. At 1 TB of data per node, that is 30 nodes.
    - Throughput. 1 million requests a second over 30 nodes is about 33,000 per node, which one machine with SSDs can serve.
    - Quorum. With N = 3 copies, W = 2 write confirmations and R = 2 read answers, W + R is 4, which is more than N. So every read overlaps at least one node that has the latest write, and one node can be down with no loss of service.

    **Core design.**

    1. **Partitioning.** Nodes sit on a hash ring with many virtual nodes each. A key's hash picks a position, and the next 3 distinct nodes clockwise hold its replicas.
    2. **Routing.** Any node can accept a request and act as coordinator. It forwards the request to the 3 replicas. Clients that know the ring can go to a replica directly.
    3. **Write.** The coordinator sends the write to all 3 replicas and answers the client when 2 confirm. Each replica appends to a write-ahead log on disk, then updates an in-memory table.
    4. **Read.** The coordinator asks the replicas, waits for 2 answers and returns the newest version. If one replica was behind, it sends that replica the newer value (read repair).
    5. **Storage engine.** An LSM tree: writes go to memory and are flushed as sorted files, which are merged in the background. This gives fast writes on SSDs.
    6. **Membership and failure detection.** Nodes exchange state by gossip, which means each node regularly tells a few random others what it knows.

    <AnimatedDiagram name="databases/lsm-write-path" highlight={["wal", "memtable", "l0", "compact"]} caption="On each replica a write is appended to the log, placed in the memory table, and later flushed and merged into sorted files." />

    **The hardest part.** Repairing replicas that missed writes. Three mechanisms cover it: hinted handoff (another node keeps the write for a node that is down and delivers it later), read repair, and a background comparison of replicas using hash trees, so only the ranges that differ are copied.

    **Main trade-off.** Consistency against availability. The leaderless quorum design above keeps accepting writes during failures, but two clients can write the same key at once and the store must resolve it. The alternative is a leader per partition chosen by a consensus protocol, which gives a single order of writes and refuses writes on the minority side of a network split.

    **What a senior answer adds.** Tunable W and R per request. Deletes as tombstones (markers that say "deleted") which are removed only after all replicas have seen them. Replicas placed in different racks or zones. Hot key and large value handling. A plan for adding nodes without a traffic drop.

    **Watch out for.** Saying "consistent hashing" and "quorum" without explaining what a client sees when replicas disagree.
  followUps:
    - q: How do read and write quorums work, and how would you choose N, W and R?
      level: Mid
      topics: [/system-design/databases/replication-quorums, /system-design/databases/leaderless-replication]
      companies: [Microsoft]
      a: |-
        **Short answer.** N is the number of copies, W is how many must confirm a write and R is how many must answer a read. If W plus R is greater than N, every read reaches at least one copy that has the latest confirmed write.

        **Why.** With N = 3, W = 2, R = 2, a write lands on at least 2 nodes and a read asks at least 2. Two groups of 2 out of 3 must share a node.

        | Setting (N = 3) | Tolerates | Fits |
        |---|---|---|
        | W = 2, R = 2 | 1 node down for reads and writes | balanced default |
        | W = 3, R = 1 | no node down for writes | read-heavy, fast reads |
        | W = 1, R = 3 | no node down for reads | write-heavy, fast writes |

        Lower numbers mean lower latency, because the coordinator waits for fewer and therefore faster answers.

        **Watch out for.** Treating the overlap rule as a full consistency guarantee. Concurrent writes, a write that reached only 1 node and then failed, and hinted writes held on other nodes can all still give a stale or surprising read.
    - q: Two clients write the same key at the same time. What does a later read return?
      level: Senior
      topics:
        [
          /system-design/databases/last-write-wins,
          /system-design/databases/storage-siblings,
          /system-design/databases/automatic-conflict-resolution,
        ]
      companies: [LinkedIn]
      a: |-
        **Short answer.** It depends on the conflict rule you chose. With last write wins, the read returns the write with the higher timestamp and the other is silently dropped. With version vectors, it returns both values and the application merges them.

        **Why.** In a leaderless store the two writes can reach the replicas in different orders, and nobody decides which came first.

        - **Last write wins.** Each write carries a timestamp and replicas keep the highest. It is simple and all replicas end up the same. The cost is lost data: both clients were told "success", and one write disappears.
        - **Version vectors.** Each value carries a small counter per node. The store can tell "B replaces A" from "A and B were written without knowing of each other". In the second case it keeps both, called siblings, and returns both on read.
        - **A leader per partition.** All writes for a key go through one node, which orders them. The second write then knowingly replaces the first, or fails a version check.

        **Watch out for.** Choosing last write wins for data like a shopping cart or a counter, where both writes matter. Use it for values where replacing is the real meaning, such as a profile photo.
    - q: A new node is added while writes continue. How does data move, and what do clients see?
      level: Senior
      topics: [/system-design/patterns/consistent-hashing, /system-design/patterns/sharding]
      companies: [LinkedIn]
      a: |-
        **Short answer.** The new node takes over some hash ranges, receives new writes for them from the start, and copies the existing data for them in the background. It serves reads for a range only after that range's copy is complete.

        **Why.** With virtual nodes, a new node in a 30-node cluster picks up about 1/31 of the data, taken in small slices from many nodes. So no single node carries the whole streaming load.

        The safe order is:

        1. The node announces itself as "joining". Coordinators start sending it writes for its future ranges, in addition to the current owners.
        2. Current owners stream the existing data for those ranges as sorted files.
        3. When streaming finishes, the node becomes a normal replica and reads may use it.
        4. Old owners delete the ranges they no longer hold.

        Clients see no errors. They may see slightly higher latency, since streaming uses disk and network. Limit the streaming rate, for example to a fixed number of megabytes a second per node.

        **Watch out for.** Serving reads from the new node too early. It would answer "not found" for keys it has not copied yet, and with R = 2 that wrong answer can be part of a quorum.
    - q: One key receives most of the traffic. How do you handle it when the load is reads, and when it is writes?
      level: Senior
      topics:
        [/system-design/patterns/caching, /system-design/patterns/sharding, /system-design/databases/key-value-stores]
      companies: [LinkedIn]
      a: |-
        **Short answer.** Hashing spreads keys, but it cannot spread one key. For hot reads, add caches and read from all replicas. For hot writes, split the key or batch the writes.

        **Why.** A single key always maps to the same 3 replicas, however many nodes the cluster has.

        **Read-heavy hot key.**

        - Cache it in the client or in a cache tier, with a TTL of a second or so. At 100,000 reads a second, a 1 second cache turns that into about 1 read a second per client process.
        - Spread reads over all 3 replicas with R = 1 if a slightly stale answer is fine.

        **Write-heavy hot key.**

        - Split it into sub-keys, for example `counter:0` to `counter:15`, chosen at random per write. A read sums the 16 parts. This suits counters and append-only data.
        - Buffer and combine writes in the application, and flush one combined write every 100 ms.
        - Ask whether the data model is wrong. A single key that everyone writes is often a global counter or a queue, and a different system may fit it better.

        Detection matters as well: track the top keys per node by sampling requests.

        **Watch out for.** Adding nodes. It lowers the average load and does nothing for the three machines that hold the hot key.
    - q: A replica is down for an hour and then comes back. How does it catch up?
      level: Mid
      topics: [/system-design/databases/leaderless-replication, /system-design/databases/replication-quorums]
      companies: [Microsoft]
      a: |-
        **Short answer.** Other nodes replay the writes they saved for it, reads repair any key that is found to be behind, and a background job compares whole ranges and copies what still differs.

        **Why.** While the node is down, writes still succeed because 2 of 3 replicas confirm. Three mechanisms then close the gap.

        - **Hinted handoff.** The coordinator stores each missed write as a "hint" on another node. When the failed node returns, the hints are sent to it. Hints are kept for a limited time, often a few hours, so that a long outage does not fill disks.
        - **Read repair.** When a read sees that one replica has an older version, the coordinator writes the newer value back to it. This fixes only keys that are read.
        - **Anti-entropy.** Each replica builds a hash tree over a key range: leaves hash small groups of keys and parents hash their children. Two replicas compare the roots and walk down only where hashes differ, so they exchange a few kilobytes to find a handful of differing keys among millions.

        **Watch out for.** Deletes. If tombstones are removed before the returning node has seen them, it brings the deleted data back. Keep tombstones longer than the longest outage you repair from.
    - q: How would the design change if the store must also support range scans, or return the value of a key as of an older version?
      level: Senior
      topics:
        [
          /system-design/databases/lsm-trees,
          /system-design/databases/wide-column-stores,
          /system-design/patterns/sharding,
        ]
      a: |-
        **Short answer.** Range scans need keys partitioned by sorted key range, not by hash. Versioned reads need every write stored under the key plus a version number, so old values stay readable.

        **Why.** Hashing puts neighbouring keys on unrelated nodes, so a scan from `user:100` to `user:200` would have to ask every node. With range partitioning, each partition owns a continuous slice of the key space, and a scan reads one or a few partitions in order. The cost is uneven load: keys that sort together, such as timestamps, all hit the last partition. Partitions must split when they grow and move between nodes, which needs a metadata service that maps ranges to nodes.

        For versions, store each write as `(key, version)` with the version sorted newest first. An LSM engine already keeps sorted data, so "value of key K at version 17" is a short seek to the first entry at or below 17. Old versions are removed by a retention rule, such as "keep 7 days" or "keep the last 10".

        **Watch out for.** Using wall-clock time as the version across nodes. Clocks disagree. Use a counter per key from the partition leader, or a hybrid clock that combines time with a counter.
- id: design-object-store
  q: Design an object storage service like S3, where clients put and get objects of any size in named buckets.
  level: Senior
  category: system-design-questions
  subcategory: storage-files
  topics:
    - /system-design/case-studies/s3
    - /system-design/databases/object-storage
    - /system-design/patterns/blob-storage-and-chunking
  companies: [Dropbox, Oracle]
  a: |-
    **Short answer.** Keep two systems apart: a metadata store that maps bucket and key to where the bytes are, and a data store that spreads the bytes over many disks with erasure coding. Objects never change in place, which keeps both parts simple.

    **What to clarify.** Object size range, from a few bytes to several terabytes. The durability target, often stated as eleven nines (99.999999999 percent a year). Whether versioning, listing by prefix and multipart upload are in scope. One region or several. Whether a read right after a write must see the new object.

    **The numbers that drive the design.**

    - Data. 1 exabyte of user data. With three full copies that is 3 EB of raw disk. With erasure coding that splits data into 10 pieces and adds 4 parity pieces, it is 1.4 EB. The difference is 1.6 EB of disks.
    - Metadata. 100 billion objects at about 1 KB of metadata each is 100 TB. That is far too big for one database and tiny next to the data.
    - Failures. In a fleet of 1 million disks with a 2 percent yearly failure rate, about 55 disks die every day. Repair is normal work that runs all the time.

    **Core design.**

    1. **API tier.** Stateless servers handle authentication, bucket policy checks and request routing. The API is HTTP: put, get, delete, list by prefix, and multipart upload calls.
    2. **Metadata store.** A sharded, strongly consistent key-value database. The key is bucket plus object key, kept in sorted order so listing by prefix is a range scan. The value holds size, checksum, version and the locations of the data pieces.
    3. **Data nodes.** Each node manages many disks. Small objects are packed together into large append-only files, since billions of tiny files would overwhelm a file system. Large objects are split into chunks.
    4. **Placement service.** It knows every disk's free space and health, and picks 14 disks in different racks and zones for each chunk.
    5. **Write path.** The API server streams the bytes, computes a checksum, encodes the pieces, writes them to data nodes, and only then writes the metadata record. The object exists from the moment that record is committed.
    6. **Read path.** Look up metadata, fetch any 10 of the 14 pieces, decode, verify the checksum and stream to the client.
    7. **Background work.** Repair lost pieces, scan disks for silent corruption, delete pieces that no metadata points to, and move data to balance disks.

    **The hardest part.** Durability over years. Disks fail, bits flip without any error, and software bugs delete things. The design needs checksums verified on every read and by regular scans, fast repair so a second failure rarely meets the first, copies in separate failure zones, and soft delete so a bug can be undone.

    **Main trade-off.** Replication against erasure coding: disk cost on one side, read and repair cost on the other. Many systems replicate small or very hot objects and erasure code the rest.

    **What a senior answer adds.** Metadata hot spots when keys share a prefix such as a date. Storage classes that move cold data to cheaper media. Cross-region replication as an asynchronous stream. Per-tenant rate limits. Costs per request against costs per stored gigabyte.

    **Watch out for.** Writing metadata before the data is safely stored. A crash in between leaves a record that points to nothing.
  followUps:
    - q: Why are metadata and object data stored in separate systems?
      level: Mid
      topics: [/system-design/databases/object-storage, /system-design/case-studies/s3]
      companies: [Dropbox]
      a: |-
        **Short answer.** They have opposite needs. Metadata is small, must be found by key, listed in order and updated atomically. Data is huge, never changes and only needs to be written once and read back.

        **Why.** Compare the two:

        | | Metadata | Data |
        |---|---|---|
        | Size per object | about 1 KB | bytes to terabytes |
        | Access | lookups, range scans, conditional updates | sequential streaming |
        | Needs | transactions, sorted index | cheap disks, erasure coding |
        | Total at 1 EB | about 100 TB | 1 EB |

        A database is good at the first column and expensive for the second. Raw disks with a simple chunk format are good at the second and cannot list keys.

        The split also defines when an object exists. The data pieces are written first, and the metadata record is the single atomic commit. Overwriting a key writes new pieces and then swaps the record, so readers see either the old object or the new one, never a mix.

        **Watch out for.** Losing the link between the two. Pieces without metadata are wasted space, so a cleanup job must find them. Metadata without pieces is data loss, so the write order matters.
    - q: Replication or erasure coding for durability? How does each behave when a disk fails?
      level: Senior
      topics: [/system-design/databases/object-storage, /system-design/fundamentals/availability]
      companies: [Dropbox]
      a: |-
        **Short answer.** Erasure coding gives the same or better durability for about half the disk space, and pays for it with more work on reads and repairs. Replication is simpler and faster to rebuild.

        **Why.** Erasure coding splits a chunk into k data pieces and adds m parity pieces computed from them. Any k of the k + m pieces can rebuild the chunk.

        | | 3 copies | 10 + 4 coding |
        |---|---|---|
        | Raw space per 1 GB | 3 GB | 1.4 GB |
        | Failures survived | 2 | 4 |
        | Read | 1 disk | 10 disks |
        | Repair of 1 lost piece | copy 1 piece from 1 disk | read 10 pieces, recompute |

        When a 16 TB disk dies under replication, the system copies 16 TB from other disks. Under 10 + 4 coding it must read about 160 TB across the fleet to recompute the same 16 TB. Slow repair hurts durability, because more pieces of the same chunk can be lost before it finishes.

        **Watch out for.** Erasure coding tiny objects. A 4 KB object in 14 pieces means 14 disk reads and writes for almost no data. Replicate small objects, or pack them into large files and code those.
    - q: How do you upload a 50 GB object reliably, and what happens to uploads that never finish?
      level: Mid
      topics: [/system-design/patterns/blob-storage-and-chunking, /system-design/patterns/idempotency]
      a: |-
        **Short answer.** Use multipart upload: the client sends the object as numbered parts that can be retried one by one, then sends a final "complete" call that makes the object visible in one step.

        **Why.** A single 50 GB request fails on any network break, and the client must start again from zero. With 100 MB parts there are 500 parts. A failure costs one part, and parts can be sent 5 or 10 at a time in parallel.

        The flow has three calls. "Start" returns an upload id. "Upload part" takes the upload id, a part number and the bytes, and returns a checksum. Sending the same part number again replaces the earlier attempt, so retries are safe. "Complete" lists the part numbers and checksums. The server verifies them and writes one metadata record that points to all the parts. Before that call, a get for the key returns the old object or "not found".

        Parts from uploads that never complete use space and are invisible. A lifecycle rule aborts uploads older than, say, 7 days and frees their parts.

        **Watch out for.** Skipping the cleanup rule. Abandoned parts pile up silently and appear only on the bill.
    - q: "Variant: the store must deduplicate identical content. How do you detect duplicates, and when is it safe to delete shared data?"
      level: Senior
      topics: [/system-design/patterns/blob-storage-and-chunking, /system-design/fundamentals/encryption-and-hashing]
      a: |-
        **Short answer.** Address chunks by a cryptographic hash of their content, so identical chunks get the same address and are stored once. Delete a chunk only when no object refers to it, checked by a delayed garbage collector.

        **Why.** On upload, the server computes SHA-256 of each chunk and looks the hash up in a chunk index. If it exists, the new object's metadata points to the existing chunk and no data is written. If not, the chunk is stored and indexed.

        Deletion is harder. Each chunk needs a reference count. The race to fear: object A is deleted and the count reaches zero, while at the same moment an upload of object B finds the chunk in the index and plans to reuse it. If the collector removes the chunk now, B points to nothing.

        The usual protection is two-phase deletion. Mark the chunk as a candidate, wait for a period longer than any upload can last, such as 24 hours, then recheck references before removing it. An upload that reuses a candidate chunk clears the mark.

        **Watch out for.** Deduplicating across tenants without thought. An attacker can learn whether a file already exists by observing that an upload was skipped. Deduplicate within one tenant, or hide the effect from the client.
    - q: What API would you expose, and what metadata does each call need?
      level: Junior
      topics: [/system-design/fundamentals/api-design, /system-design/fundamentals/rest, /system-design/case-studies/s3]
      companies: [Oracle]
      a: |-
        **Short answer.** A small HTTP API over buckets and objects: create bucket, put, get, head, delete, list, and the multipart calls. Each object carries system metadata that makes those calls cheap.

        **Why.** The object key maps naturally to a URL path, and the HTTP verbs match the operations.

        | Call | Metadata it uses |
        |---|---|
        | `PUT /bucket/key` | writes size, checksum, content type, time, version id, piece locations |
        | `GET /bucket/key` | reads piece locations and checksum, supports a byte range |
        | `HEAD /bucket/key` | returns size, checksum and time without the body |
        | `DELETE /bucket/key` | writes a delete marker or removes the record |
        | `GET /bucket?prefix=logs/` | scans keys in sorted order, returns a page and a cursor |

        The checksum, returned as an ETag header, lets a client do conditional requests such as "put only if the object has not changed". List must be paginated, for example 1,000 keys per page with a continuation token, because a bucket can hold billions of keys.

        **Watch out for.** Promising folder operations. There are no real folders, only keys with a shared prefix. "Rename a folder" with 1 million keys is 1 million copies and deletes.
    - q: Users in Europe and the United States read and write the same bucket. How do you handle consistency across regions?
      level: Senior
      topics:
        [
          /system-design/databases/sync-vs-async-replication,
          /system-design/patterns/consistency-models,
          /system-design/databases/multi-leader-replication,
        ]
      a: |-
        **Short answer.** Keep strong consistency inside one region, replicate to the other region asynchronously, and be explicit that a cross-region read can be seconds behind.

        **Why.** A round trip across the Atlantic takes about 80 to 100 ms. If every write waited for both regions to confirm, each put would gain that delay, and a broken link would stop writes everywhere. So the common design gives each bucket a home region. Writes commit there and a replication stream ships new objects to the other region.

        Options and their costs:

        | Design | Write latency | Risk |
        |---|---|---|
        | Home region, async copy | local | remote reads lag, recent writes lost if the home region is destroyed |
        | Synchronous to both | plus about 100 ms | writes stop when the link fails |
        | Writable in both regions | local | two writes to one key conflict |

        If both regions accept writes, the same key can be written on both sides. Objects are replaced as a whole, so last write wins by timestamp is the usual rule, with versioning turned on so the losing write is still kept as an older version.

        **Watch out for.** Data residency rules. Some data must stay in the EU by law, so replication must be a per-bucket choice.
- id: design-activity-store
  q: Design a store for timestamped user activity events that takes fast inserts and answers queries such as activity per minute, hour and day.
  level: Senior
  category: system-design-questions
  subcategory: storage-files
  topics:
    - /system-design/databases/time-series-databases
    - /system-design/patterns/sharding
    - /system-design/databases/analytical-databases
  a: |-
    **Short answer.** Append events to a durable log, then feed two stores from it: a time-partitioned columnar store that keeps raw events for flexible queries, and small pre-aggregated tables per minute, hour and day for dashboards.

    **What to clarify.** What a query looks like: one user's recent activity, or counts across all users. How fresh results must be, seconds or minutes. How long raw events are kept. Whether events can arrive late or twice. Which fields queries filter on, such as event type, country or location.

    **The numbers that drive the design.**

    - Ingest. 100 million daily users with 50 events each is 5 billion events a day. That is about 58,000 a second on average and perhaps 175,000 at peak.
    - Storage. At 200 bytes an event, one day is 1 TB raw. 90 days is 90 TB. Columnar compression of 5 to 10 times brings that to roughly 10 to 20 TB.
    - Rollups. Counting by minute for 100 event types gives 144,000 rows a day. That table stays tiny however many events arrive.

    **Core design.**

    1. **Collect.** Clients batch events and send them to an ingest API. Each event has a unique id, a user id, an event type, the time it happened and a few attributes.
    2. **Log.** The API appends to a partitioned message log (such as Kafka), keyed by user id. The log absorbs peaks and lets consumers replay.
    3. **Raw store.** A consumer writes events to a columnar store partitioned by day or hour and sorted by time inside each partition. Queries with a time range skip every partition outside it.
    4. **Rollups.** A stream job counts events per minute and dimension and writes them to a small table. Hour and day tables are built from the minute table.
    5. **Per-user view.** If "recent activity of user X" is needed in milliseconds, also write to a wide-column store with user id as partition key and time as sort key.
    6. **Retention.** Drop whole partitions when they age out. Keep raw data for 90 days, minute rollups for a month, day rollups for years.

    **The hardest part.** Counts that are both fresh and correct. Phones deliver events late and retries deliver them twice. The design needs a rule for which time an event belongs to, a way to remove duplicates, and a way to correct a published minute when late data arrives.

    **Main trade-off.** Write speed against query flexibility. Each extra index or rollup makes one query fast and every insert slower. Append-only partitions with one sort order keep inserts cheap and serve time-range queries well. Other filters fall back to scanning columns, which is acceptable for analytics and too slow for user-facing pages.

    **What a senior answer adds.** Skew: a few very active users or one huge tenant overloading a shard. Schema changes for event attributes. Approximate distinct counts, such as daily active users, with sketches that merge across time windows. Cost tiers: recent data on SSD, older data in object storage. Deleting one user's events on request.

    **Watch out for.** One relational table with an index on timestamp. It works for the first million rows and fails at billions, because every insert updates large indexes and deleting old rows is slow.
  followUps:
    - q: Why partition by time, and how do you spread writes when every new event has the newest timestamp?
      level: Mid
      topics: [/system-design/patterns/sharding, /system-design/databases/time-series-databases]
      a: |-
        **Short answer.** Time partitions make range queries and retention cheap. To avoid one hot shard, partition by time and also by a hash of something else, such as user id.

        **Why.** Nearly every query has a time range. If data for each hour or day lives in its own partition, a query for "last 24 hours" opens a handful of partitions and ignores the other 89 days. Removing old data is a metadata change: drop the partition.

        The problem is that all inserts carry "now". If time alone picks the shard, one shard takes 100 percent of writes and the rest sit idle. The fix is a two-part key. The hash of the user id picks one of, say, 64 shards, and inside each shard data is split by day. Writes spread evenly over 64 machines, and each still benefits from time partitions.

        The cost shows up in queries across all users. They must ask all 64 shards and merge the results. For aggregates this fan-out is fine, and rollup tables cover the common cases.

        **Watch out for.** Partitions that are too small. One partition per minute per shard creates millions of small files and slow planning. Aim for partitions of roughly hundreds of megabytes to a few gigabytes.
    - q: The same event is delivered twice because a client retried. How do you avoid counting it twice?
      level: Mid
      topics:
        [
          /system-design/patterns/idempotency,
          /system-design/patterns/message-queues,
          /system-design/patterns/bloom-filter,
        ]
      a: |-
        **Short answer.** Give each event a unique id on the client, and make every stage safe to repeat by removing duplicates on that id.

        **Why.** Duplicates are normal. A phone sends a batch, the response is lost, and the phone sends it again. A stream worker crashes after writing and before recording its position, then reprocesses the same messages. Message logs usually promise "at least once" delivery for this reason.

        Places to remove duplicates:

        - **Stream job.** Keep the ids seen in the last hour or day in keyed state, and drop repeats. Most duplicates arrive within minutes, so a bounded window catches nearly all. A Bloom filter (a compact structure that can say "definitely new" or "probably seen") keeps the memory small.
        - **Raw store.** Make the event id part of the row key, so a second insert replaces the first, or let the store merge rows with the same key in the background.
        - **Rollups.** A simple counter cannot forget a duplicate. Either remove duplicates before counting, or rebuild rollups for a window from the cleaned raw data.

        **Watch out for.** Ids generated on the server at ingest. A retried event then gets two different ids and can never be matched. The id must be created once, where the event happens.
    - q: A phone was offline and sends events that happened three hours ago. How do you handle late events?
      level: Senior
      topics: [/system-design/databases/time-series-databases, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** Store every event under the time it happened, keep recent aggregation windows open for a fixed lateness period, and correct older windows with a later batch pass.

        **Why.** Each event has two times: event time, when the user acted, and processing time, when the server received it. Reports need event time. Otherwise a train passing through a tunnel moves an evening's activity to the wrong hour.

        The stream job uses a watermark, which is its estimate that "all events up to time T have arrived". A minute window stays open until the watermark passes its end plus an allowed lateness, for example 10 minutes. Events inside that limit update the window, and the rollup row is written again with the new count.

        Events later than the limit still go to the raw store, in the partition for their event time. A batch job recomputes rollups for the last day or two from raw data and replaces the stream results. So numbers for the last few minutes are approximate, and numbers older than a day are final.

        **Watch out for.** Trusting device clocks. A phone set to the wrong year sends events into the far past or future. Record the server receive time too, and reject or clamp event times that are more than a few days off.
    - q: What freshness can you promise, and what decides it?
      level: Mid
      topics: [/system-design/fundamentals/non-functional-requirements, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** A few seconds for rollup dashboards and about a minute for raw queries is a realistic promise. The delay is the sum of batching at each stage.

        **Why.** Follow one event from start to end:

        | Stage | Typical delay |
        |---|---|
        | Client batching | 5 to 30 seconds, by choice |
        | Ingest and log append | a few ms |
        | Stream job to rollup table | 1 to 5 seconds |
        | Raw store write batch | 10 to 60 seconds |

        Columnar stores want large batches, because many tiny writes create many tiny files that slow queries. So the raw store trades freshness for efficiency.

        State the promise as a number with a percentile, such as "99 percent of events are queryable within 60 seconds of arriving at the server". Then measure it: the stream job reports its lag, which is how far its position is behind the end of the log.

        Client batching is outside the server's control, and an offline phone can add hours. That is why the promise starts at server receive time.

        **Watch out for.** Promising "real time" without a number. Each step from one minute down to one second costs more, and most dashboards do not need it.
    - q: Which storage engine would you choose for the raw events, and what do you give up?
      level: Senior
      topics:
        [
          /system-design/databases/analytical-databases,
          /system-design/databases/lsm-trees,
          /system-design/databases/wide-column-stores,
          /system-design/databases/choosing-a-database,
        ]
      a: |-
        **Short answer.** A columnar analytical store for queries across many users, and an LSM-based wide-column store if the main query is one user's timeline. Both are append-friendly, and each is weak where the other is strong.

        **Why.**

        | | Columnar store | Wide-column (LSM) store | Relational with B-tree |
        |---|---|---|---|
        | Insert rate | very high in batches | very high per row | moderate |
        | One user's last 50 events | slow to fair | a few ms | fast with an index |
        | Count by type over 30 days | fast | very slow | slow |
        | Updates and deletes | costly | fine | fine |

        Columnar storage keeps each field together, so a count by event type reads 1 or 2 columns out of 20 and compresses well, since similar values sit side by side. It gives up fast single-row lookups and cheap updates.

        An LSM store turns random writes into sequential appends and keeps each user's events sorted together. It gives up ad hoc analytics, because it has no efficient way to scan one field across all users.

        **Watch out for.** Choosing by product name. State the two or three queries that matter and their latency targets first, then pick the engine that serves them.
- id: design-large-file-upload
  q: Design a system where merchants upload large files, such as a catalog of a million products with images, and the server processes them in the background.
  level: Senior
  category: system-design-questions
  subcategory: storage-files
  topics:
    - /system-design/patterns/blob-storage-and-chunking
    - /system-design/patterns/message-queues
    - /system-design/patterns/idempotency
  companies: [Pinterest]
  a: |-
    **Short answer.** The client uploads the file in parts straight to object storage. The server records a job, splits the work into small tasks on a queue, and workers process them. The client polls a status endpoint, or receives a webhook, to learn the result.

    **What to clarify.** File sizes and formats. How long processing may take. Whether a file is all-or-nothing, or good rows are applied while bad rows are reported. Whether single edits through the normal API happen at the same time as bulk jobs. How results are delivered.

    **The numbers that drive the design.**

    - Upload. A 5 GB file in 8 MB parts is 640 parts. On a network break the client resends one part, 8 MB, and keeps the rest.
    - Row processing. 1 million rows at 500 rows a second per worker takes 2,000 seconds, about 33 minutes. Ten workers finish in under 4 minutes. No HTTP request should stay open that long.
    - Images. 1 million images at half a second of CPU each is 500,000 CPU seconds, about 139 CPU hours. With 100 workers that is roughly 1.4 hours.

    **Core design.**

    1. **Start.** The client calls "create upload". The server creates a job record in state `uploading` and returns a job id plus signed URLs for the parts.
    2. **Upload.** The client sends parts directly to object storage, several at a time, and retries failed parts. The bytes never pass through the application servers.
    3. **Submit.** The client calls "complete". The server checks the file's size and checksum, sets the job to `queued` and puts one message on a queue.
    4. **Split.** A splitter worker reads the file as a stream, validates the header, and creates tasks of about 1,000 rows each. A task holds a byte range of the file. Tasks are stored in the database and put on a work queue.
    5. **Process.** Workers take tasks, validate and apply each row, and write one result per row: success, or an error with the row number and reason. Image downloads and resizing go to a separate queue and worker pool.
    6. **Finish.** When all tasks are done, the job becomes `completed` or `completed_with_errors`, a result file is written to object storage, and the client is notified.
    7. **Status.** "Get job" returns the state, counts of rows processed and failed, and a link to the result file.

    **The hardest part.** Doing each piece of work exactly once in effect, while queues deliver at least once and workers crash. Every task and every row write must be safe to repeat.

    **Main trade-off.** All-or-nothing against partial success. Applying a million rows in one transaction is not practical, so most systems apply rows separately and report failures. If the business needs all-or-nothing, validate the whole file first, write to a staging area, and switch over in one step.

    **What a senior answer adds.** Fairness, so one merchant's huge job does not delay everyone else's small ones. Limits on file size, row count and concurrent jobs per merchant. Virus and content scanning before processing. Cancelling a job. Cleanup of abandoned uploads.

    **Watch out for.** Accepting the file in one request to the application server and processing it inside that request.
  followUps:
    - q: What endpoints does the client use to submit a job, check its status and fetch results?
      level: Mid
      topics:
        [
          /system-design/fundamentals/api-design,
          /system-design/fundamentals/webhooks,
          /system-design/fundamentals/ajax-polling,
        ]
      a: |-
        **Short answer.** Three calls: one to create the job, which returns at once with a job id, one to read its status, and one to get the results. A webhook can replace most polling.

        **Why.** A long task does not fit a single request, since proxies and clients time out after 30 to 60 seconds. So the API hands back a reference to the work.

        | Call | Returns |
        |---|---|
        | `POST /jobs` | status 202 Accepted, job id, status URL |
        | `GET /jobs/id` | state, progress counts, timestamps, result link when done |
        | `GET /jobs/id/results` | per-row outcomes, paginated, or a link to a result file |
        | `DELETE /jobs/id` | asks to cancel |

        Status 202 means "received, not finished". The job states form a small state machine: uploading, queued, running, then completed, completed with errors, failed or cancelled.

        Polling every few seconds is simple and works everywhere. The response can suggest how long to wait before the next poll. For server-to-server clients, a webhook on completion removes the polling, but the status endpoint must stay, because webhooks can be lost.

        **Watch out for.** Holding the first request open "just for small files". Two code paths behave differently under load. Use the asynchronous flow for every size.
    - q: The client's submit call times out and it tries again. How do you avoid creating two jobs?
      level: Mid
      topics: [/system-design/patterns/idempotency, /system-design/fundamentals/api-design]
      a: |-
        **Short answer.** The client sends a unique idempotency key with the submit call. The server stores the key with the job and returns the same job when it sees the key again.

        **Why.** After a timeout the client cannot know if the job was created. Without protection, a retry runs the same million-row file twice. That doubles the work and, for updates such as "add 10 to stock", the damage too.

        The client creates a random key once per intended job and sends it in a header. The server inserts the job with a unique constraint on merchant id plus key. If the insert fails because the key exists, the server reads the existing job and returns it with the same response as the first time. Check and create happen in one database statement, so two retries arriving together cannot both succeed.

        Keys are kept for a limited time, such as 24 hours or the life of the job.

        A second layer helps: store a checksum of the file. If the same merchant submits identical content under a different key within a short time, warn or ask for confirmation.

        **Watch out for.** Checking for the key with a read and then inserting in a separate step. Two concurrent requests both see "not found". The unique constraint must do the work.
    - q: A worker crashes halfway through a task. How does the job still finish correctly?
      level: Senior
      topics:
        [
          /system-design/patterns/message-queues,
          /system-design/patterns/idempotency,
          /system-design/patterns/circuit-breaker-and-retries,
        ]
      a: |-
        **Short answer.** The queue gives the task to another worker after a timeout, and because each row write is idempotent, repeating the task causes no harm.

        **Why.** A worker does not delete a message when it receives it. The message becomes invisible for a period, called a visibility timeout, for example 5 minutes. The worker deletes it only after the task is done. If the worker dies, the timeout ends and another worker gets the same task.

        So a task can run twice. Three things make that safe:

        - Each row's change is an upsert keyed by product id (insert, or update if it exists), so applying it again gives the same state.
        - Each row result is keyed by job id and row number, so a second attempt replaces the first.
        - Tasks are small, about 1,000 rows, so a crash repeats seconds of work.

        Job state lives in the database, never in worker memory. A task that fails 3 to 5 times goes to a dead-letter queue (a holding area for messages that keep failing).

        **Watch out for.** A visibility timeout shorter than the task. The task is then handed to a second worker while the first is still running. Extend the timeout with a heartbeat during long tasks.
    - q: A merchant edits one product by hand while a bulk job is updating the same product. Which change wins?
      level: Senior
      topics:
        [
          /system-design/databases/last-write-wins,
          /system-design/patterns/consistency-models,
          /system-design/databases/relational-databases,
        ]
      companies: [Pinterest]
      a: |-
        **Short answer.** Decide the rule on purpose. A sensible default is that the change made later by intent wins, where a bulk row counts as made when the file was submitted, and it is enforced with a version check on the product row.

        **Why.** A bulk job submitted at 10:00 may reach row 800,000 at 10:25. If the merchant fixes that product's price by hand at 10:10, the file's value is older information, even though the worker writes later. Plain "last write wins by write time" lets the stale bulk row overwrite the fresh edit.

        A workable design: each product row has a version number and an "updated as of" time. A bulk row carries the job's submit time. The worker's update includes a condition: apply only if the row's "updated as of" is earlier than the job's submit time. Otherwise the worker skips the row and reports "skipped, edited after upload" in the results.

        Field-level merging lowers the number of conflicts further. If the file changes only stock and the manual edit changed only the title, both can apply.

        **Watch out for.** Locking products for the length of the job. A merchant blocked from editing for 30 minutes is worse than a clear rule and a clear report.
    - q: How do you report results when some rows succeed and others fail?
      level: Mid
      topics: [/system-design/fundamentals/api-design, /system-design/databases/object-storage]
      companies: [Pinterest]
      a: |-
        **Short answer.** Record an outcome for every row, show summary counts in the job status, and offer a downloadable file that contains only the failed rows with reasons, in the same format as the upload.

        **Why.** In a million-row file, a few thousand bad rows are normal: a missing price, a broken image link, an unknown category. Failing the whole job forces the merchant to fix and resend everything. Applying good rows and reporting bad ones lets them fix only what broke.

        The job status carries totals such as 996,400 succeeded, 3,100 failed and 500 skipped. The detail goes into an error file in object storage: original row number, original columns and an error code with a readable message. Since it has the same columns as the input, the merchant can correct those rows and upload the file again as a new job.

        Error codes should be stable and specific, such as `INVALID_PRICE` or `IMAGE_FETCH_FAILED`, so integrations can react to them.

        Some failures are worth stopping for. If the first 1,000 rows all fail the same check, the file is probably the wrong format. Stop early and say so.

        **Watch out for.** Returning a million row results inline in the status response. Keep the status small and put the detail behind a link or a paginated endpoint.
    - q: How do you split the processing so it scales out, and where are the bottlenecks?
      level: Senior
      topics:
        [
          /system-design/patterns/message-queues,
          /system-design/patterns/back-pressure,
          /system-design/patterns/rate-limiting,
        ]
      companies: [Pinterest]
      a: |-
        **Short answer.** Split each file into small independent tasks, run them on worker pools that scale with queue length, and limit how much each merchant can run at once. The limits are usually the database and outside image hosts, well before the workers.

        **Why.** Tasks of 1,000 rows let 100 workers share one file and let a small job slip in between the pieces of a large one.

        Where it slows down:

        - **Database writes.** 100 workers at 500 rows a second is 50,000 writes a second, which can starve the live site. Limit bulk write rate, batch rows per statement and write through a separate connection pool.
        - **Image fetching.** Downloading 1 million images from one merchant's server can take that server down. Limit concurrent fetches per host.
        - **Image resizing.** It is CPU-bound, so it gets its own pool and queue, and row processing does not wait for it.

        For fairness, give each merchant a concurrency cap, or keep per-merchant queues and take from them in turn.

        **Watch out for.** Splitting so that the same product appears in two tasks running in parallel. If a file has duplicate product ids, route rows by a hash of product id so one product is handled in order.
- id: design-ticket-booking
  q: Design a ticket booking system like Ticketmaster or BookMyShow, where users pick seats for an event, hold them while paying and never get a double-booked seat.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/case-studies/ticketmaster
    - /system-design/patterns/idempotency
    - /system-design/databases/relational-databases
  companies: [Amazon, Meta, Microsoft, Salesforce]
  a: |-
    **Short answer.** Browsing is a read-heavy system served from caches and a search index. Booking is a small, strongly consistent core: one database transaction moves a seat from available to held with an expiry time, and a second moves it to sold after payment.

    **What to clarify.** Assigned seats or general admission. How long a hold lasts. The size of the largest on-sale event. Whether search and discovery are in scope. Payment through an outside provider. Limits per user, such as 4 tickets.

    **The numbers that drive the design.**

    - Skew. A 50,000-seat stadium show can draw 2 million users in the first minutes. At most 50,000 seats can be sold, so over 97 percent of those users cannot get one whatever the system does.
    - Reads against writes. Those users refresh the seat map. At one refresh every 10 seconds each, that is 200,000 reads a second. Successful bookings are at most a few thousand a second.
    - Hold length. A 5 minute hold means abandoned seats return to sale within 5 minutes. Too long, and an event looks sold out while seats sit in abandoned carts.

    **Core design.**

    1. **Catalog and search.** Events, venues and seat layouts live in a relational database, are copied to a search index, and are cached on a CDN. They change rarely.
    2. **Inventory.** One row per seat per event, with a status (available, held or sold), a holder, a hold expiry time and a version number.
    3. **Hold.** The booking service runs one transaction: set the seats to held, only if each is available or its hold has expired. If any seat fails the condition, nothing is held and the user picks again.
    4. **Pay.** The service creates an order and sends the user to the payment provider, passing an idempotency key (a unique id that makes a retried request count once).
    5. **Confirm.** On the provider's webhook, a transaction marks the order paid and the seats sold, only if the hold is still valid for that order. Then it issues the tickets.
    6. **Expire.** No job is needed for correctness, because the hold condition checks the expiry time. A sweeper only cleans rows up and refreshes the seat map.
    7. **On-sale protection.** A virtual waiting room in front of the booking flow admits users at a rate the core can handle.

    <AnimatedDiagram name="fundamentals/api-design" highlight={["gateway", "idem", "db"]} caption="A booking request carries an idempotency key, so a retry after a timeout returns the first result and never books or charges twice." />

    **The hardest part.** The seconds around payment. A payment can succeed just after the hold expired and the seat went to someone else. The confirm step must check the hold inside its transaction, and the losing case must end in an automatic refund.

    **Main trade-off.** Fairness and correctness against speed. A strict conditional write per seat never double-books, but it concentrates load on a few hot rows. The waiting room accepts slower entry in exchange for a system that stays up.

    **What a senior answer adds.** Bot and scalper controls. A seat map that is slightly stale by design, with the hold as the real check. Inventory sharded by event. Reconciliation between orders and payment provider records. Best-available seat selection, which reduces fights over single seats.

    **Watch out for.** Checking availability with a read and then writing in a separate step. Two users both pass the check.
  followUps:
    - q: Two users click the same seat at the same moment. How do you guarantee only one of them gets it?
      level: Mid
      topics:
        [
          /system-design/databases/relational-databases,
          /system-design/case-studies/ticketmaster,
          /system-design/patterns/consistency-models,
        ]
      a: |-
        **Short answer.** Make the check and the change one atomic operation in the database: an update that succeeds only if the seat is still available.

        **Why.** The bug is "read, then decide, then write". Both users read "available", both decide to proceed, both write. The fix is to put the condition inside the write.

        The update says: set status to held, holder to this user and expiry to now plus 5 minutes, where seat id matches and status is available or the expiry has passed. The database applies row updates one at a time. The first request changes 1 row. The second finds the condition false, changes 0 rows, and the service tells that user the seat is taken.

        | Method | How it works | Note |
        |---|---|---|
        | Conditional update | condition in the write | simple, no lock held |
        | Row lock | select for update, then write | holds a lock during the transaction |

        For several seats in one order, update them in one transaction and roll back unless all succeed.

        **Watch out for.** A lock held in a cache as the only guard. If the cache node fails over or the lock expires early, two users hold the seat. The database constraint must be the final judge.
    - q: A seat is held for 5 minutes while the user pays. How do holds expire, and what if the payment arrives after the hold has ended?
      level: Senior
      topics: [/system-design/patterns/saga, /system-design/patterns/idempotency, /system-design/fundamentals/webhooks]
      companies: [Meta]
      a: |-
        **Short answer.** Store an expiry time on the hold and treat an expired hold as available in every write. If payment lands after expiry, confirm only when the seat is still free, and otherwise refund automatically.

        **Why.** Expiry by timestamp needs no timer to be correct. The hold condition "available, or hold expired" lets the next buyer take the seat the moment the time passes. A background sweeper resets expired rows only so the seat map and counts look right.

        The late payment case is real. The user approves the payment at 4 minutes 58 seconds, and the provider's webhook arrives at 5 minutes 6 seconds. The confirm transaction checks that the seat is still held by this order, or is free. If so, it marks the seat sold. A small grace period on the server, such as 30 seconds beyond what the user sees, removes most of these cases. If another user already holds the seat, the order moves to a "refund" state and the service calls the provider to reverse the charge.

        Webhooks can arrive twice, so confirm is keyed by order id and runs once in effect.

        **Watch out for.** Showing the user the true server deadline. Show a slightly shorter countdown than the real hold, so clock differences and slow networks work in the user's favour.
    - q: Tickets for a major concert go on sale at 10:00 and two million people arrive. How do you keep the system up?
      level: Senior
      topics:
        [
          /system-design/patterns/back-pressure,
          /system-design/patterns/rate-limiting,
          /system-design/fundamentals/abuse-protection,
          /system-design/fundamentals/cdn,
        ]
      a: |-
        **Short answer.** Put a virtual waiting room in front of the booking flow. It gives each user a place in line and admits them at a fixed rate, so the core never sees more traffic than it can serve.

        **Why.** The booking core might handle 2,000 hold requests a second. Two million users arriving in one minute is over 30,000 a second before retries. Without control, everyone gets errors, including the people who would have bought.

        The waiting room is a simple, cheap service. The page itself is static and served from a CDN. On arrival each user gets a signed token with a queue position. A small service raises the "now serving" number at the admission rate. Only requests with an admitted token reach the booking service, and the gateway rejects the rest cheaply.

        Other measures: precompute and cache the seat map, and push availability changes in batches every second or two. Sell "best available" by default, so buyers are not all fighting for the same front-row seats. Limit tickets per account and per payment card, and challenge traffic that looks automated.

        **Watch out for.** Scaling the web tier and forgetting the inventory database. One event's seats are a small set of hot rows. More application servers only bring more contention to those rows.
    - q: Would you connect the booking, payment and ticket-delivery services with direct calls or with a message queue?
      level: Mid
      topics: [/system-design/patterns/message-queues, /system-design/fundamentals/rpc, /system-design/patterns/saga]
      a: |-
        **Short answer.** Direct calls where the user is waiting for a yes or no, and a queue for everything that can happen a few seconds later.

        **Why.** The hold must be synchronous. The user clicked a seat and needs to know right away if they have it, and the answer comes from one database transaction.

        Steps after payment are different. Creating a PDF ticket, sending an email, updating search availability and feeding analytics do not need to finish before the user sees "booking confirmed". With a queue, the booking service publishes an "order paid" event, each consumer works at its own pace, and failed work is retried.

        | | Direct call | Queue |
        |---|---|---|
        | Caller learns result | immediately | later |
        | If the receiver is down | caller fails or waits | work waits in the queue |

        To avoid losing the event when the service crashes between commit and publish, write the event to an outbox table in the same transaction as the order, and let a relay publish it.

        **Watch out for.** Putting the seat hold itself on a queue to "handle the load". The user then waits with no answer, and ordering and timeouts get harder.
    - q: How does event search work inside? Explain the inverted index.
      level: Mid
      topics: [/system-design/databases/inverted-index, /system-design/databases/search-engines]
      companies: [Salesforce]
      a: |-
        **Short answer.** An inverted index maps each word to the list of documents that contain it. A search looks up the query words and intersects their lists, without scanning every event.

        **Why.** A database query with a "contains" pattern must read every row. With 5 million events that is far too slow for search-as-you-type. A search engine does the work when the document is written.

        Each event document, with title, artist, venue and city, is split into words. Words are lowercased and reduced to a base form, so "concerts" matches "concert". For each word the index stores a sorted list of document ids. A search for "jazz berlin" fetches the two lists and walks them together to find ids present in both. Results are ranked by how well the words match, then adjusted by date, distance and popularity. Filters such as date range and city use the same lists.

        The index is a copy. The relational database stays the source of truth, and changes flow to the index through a change stream within seconds.

        **Watch out for.** Showing seat availability from the search index as if it were exact. It can be seconds behind. Show a rough signal such as "few left", and let the inventory database decide at hold time.
    - q: How does the design change for hotel rooms, where users search availability by date range?
      level: Senior
      topics: [/system-design/case-studies/hotel-booking, /system-design/databases/relational-databases]
      companies: [Meta]
      a: |-
        **Short answer.** Inventory becomes a count per room type per night. A booking must reserve every night of the stay in one transaction.

        **Why.** A concert seat is one unique item for one event. A hotel sells interchangeable rooms: 20 "double rooms" are the same product, and the guest gets a specific room only at check-in. So the row is hotel, room type, date, total rooms and reserved rooms.

        A stay from the 3rd to the 6th covers 3 nights. The booking transaction adds 1 to the reserved count on each of the 3 rows, with the condition that reserved stays at or below total. If any night is full, the whole transaction rolls back.

        Search is "hotels in Lisbon with a room free for all 3 nights". That is a filter by location, then a check that the minimum free count across the nights is at least 1. Search can run on a cached copy that is slightly stale. The booking transaction is the real check.

        Demand is also spread out. There is no single on-sale moment, so a waiting room is rarely needed.

        **Watch out for.** Modelling each stay as a date range row and checking for overlaps at booking time. Overlap checks are slow and easy to get wrong under concurrency. Per-night counters are simpler.
- id: design-trading-orders
  q: Design the order system of a stock trading app. Users place and cancel market and limit orders, and the app forwards them to an outside exchange.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/idempotency
    - /system-design/patterns/saga
    - /system-design/patterns/consistency-models
    - /system-design/patterns/message-queues
  companies: [Bloomberg, Coinbase, Robinhood]
  a: |-
    **Short answer.** Treat every order as a small state machine stored in a database. Reserve the money before the order leaves, send it to the exchange with a unique id, and move the state only when the exchange reports what happened.

    **What to clarify.** Whether we match orders ourselves or forward them to an exchange (here we forward). Which order types: market (buy now at the current price) and limit (buy only at this price or better). Whether partial fills are in scope. Whether price charts and portfolio screens are part of the question or only the order path.

    **The numbers that drive the design.**

    - Order rate. 10 million active users placing 2 orders a day is 20 million orders. A trading day is 6.5 hours, about 23,400 seconds, so the average is about 850 orders a second. The first minutes after the market opens can run at 10 times that, about 8,500 a second.
    - Storage. Each order produces about 5 records (the order, a hold, and a few exchange reports) of roughly 200 bytes each, so 1 KB an order and 20 GB a day. Over 250 trading days that is 5 TB a year, and regulators expect it to be kept for years.
    - Money at risk. One duplicated order can cost thousands of dollars. Correctness matters more than raw speed here.

    **Core design.**

    1. The app sends the order with a client order id that it generated. The same id is sent again on every retry.
    2. The order service checks the request: the symbol can be traded, the market is open, the account is allowed to trade it.
    3. In one database transaction it places a hold on the buying power (cash for a buy, shares for a sell), inserts the order in state `new`, and inserts an outbox row that says "send this order".
    4. A relay reads the outbox and passes the order to the exchange gateway, a service that keeps the long-lived session with the exchange. The order moves to `sent`.
    5. The exchange answers with execution reports: accepted, partly filled, filled, cancelled, rejected. The gateway appends each report to a durable log. The order service applies them in order, and skips any report id it has already applied.
    6. A fill turns the hold into real ledger entries and updates the position. A cancel or reject releases what is left of the hold.

    **The hardest part.** The exchange owns the truth about the order, and our copy is always slightly behind. If a send times out, we do not know whether the exchange has the order. Never guess. Keep the order in `sent`, ask the exchange for its status by client order id, and resend only with the same id so the exchange can reject the duplicate.

    **Main trade-off.** Placing the hold synchronously in the account's database adds a few milliseconds to every order, and it limits one account to one database partition. In return, an account can never spend the same cash twice. That is the right side of the trade for a broker.

    **What a senior answer adds.** Partition the report log by account id so one account's events are applied in order. Reconcile every evening against the exchange's end-of-day file and alert on any difference. Plan for the market open spike with pre-scaled capacity, because autoscaling takes minutes and the spike takes seconds.

    **Watch out for.** Marking an order as failed because a call timed out. The order may be live on the exchange, and the user will place it again.
  followUps:
    - q: A user cancels an order at the same moment the exchange fills it. What happens?
      level: Senior
      topics: [/system-design/patterns/consistency-models, /system-design/patterns/idempotency]
      companies: [Coinbase]
      a: |-
        **Short answer.** The exchange decides. A cancel is a request, so the order moves to `cancel requested` and takes its final state only from the exchange's reply.

        **Why.** The fill and the cancel travel in opposite directions and can cross on the wire. If our service marked the order `cancelled` and released the hold as soon as the user pressed the button, a fill arriving 20 ms later would have no money behind it. So the cancel changes nothing about money. It writes `cancel requested`, sends the cancel to the exchange, and waits.

        Three replies are possible:

        | Exchange reply | Final state | Hold |
        |---|---|---|
        | Cancel confirmed | Cancelled | Released in full |
        | Too late, already filled | Filled | Converted to a trade |
        | Partly filled, rest cancelled | Partly filled, closed | Part converted, rest released |

        All reports for one order are applied one at a time, in exchange order, with a version check on the order row. A report that does not fit the current state is logged and checked, never dropped.

        The trade-off is honesty in the app. The user sees "cancel pending" for a moment, which is less pleasant than an instant "cancelled" but is true.

        **Watch out for.** Releasing the hold when the cancel is requested. That lets the user spend cash that a late fill still needs.
    - q: Two orders from the same account arrive at the same time and together cost more than the cash in the account. How do you stop both going through?
      level: Mid
      topics: [/system-design/patterns/consistency-models, /system-design/databases/relational-databases]
      companies: [Robinhood]
      a: |-
        **Short answer.** Make the hold a single conditional write on the account row: reduce available cash by the order cost only if enough is available. The database lets one order win and the other fail.

        **Why.** The bug appears when the service reads the balance, compares it in application code, and then writes. With 1,000 dollars available and two 800-dollar orders, both requests read 1,000, both pass the check, and the account ends at minus 600.

        The fix is to push the check into the write. One statement says: subtract 800 from available cash where the account id matches and available cash is at least 800. The database locks the row for the first statement. The second waits, then sees 200 and changes zero rows, and the service rejects that order with "not enough buying power".

        All data for one account sits on one partition, so this is a local transaction that takes a few milliseconds. The hold row and the order row are inserted in the same transaction.

        The trade-off is that one very active account processes its orders one after another. At a few orders a second per account this is never a problem.

        **Watch out for.** Keeping buying power in a cache and checking it there. A cache can be stale by a few milliseconds, and that is enough for a double spend.
    - q: A server crashes half way through placing an order. How do you make sure money is not held twice and the order is not lost or sent twice?
      level: Senior
      topics: [/system-design/patterns/idempotency, /system-design/patterns/message-queues]
      companies: [Robinhood]
      a: |-
        **Short answer.** Put every step that must happen together in one database transaction, and make every step that crosses a network safe to repeat by tagging it with the client order id.

        **Why.** Look at each point where the crash can land.

        - Before the transaction commits. Nothing was saved. The app retries with the same client order id and the order is created once.
        - After the commit, before the reply. The order, the hold and the outbox row all exist. The retry hits a unique index on the client order id, and the service returns the stored order.
        - After the commit, before the send to the exchange. The outbox row is still marked unsent. Another relay instance picks it up a few seconds later.
        - After the send, before the outbox row is marked sent. The relay sends again. The exchange sees the same client order id and rejects the duplicate.

        The outbox is the key piece. Writing to the database and then calling the exchange as two separate actions leaves a gap where a hold exists with no order behind it. Writing the intent in the same transaction closes that gap.

        The trade-off is a small delay, often under 100 ms, between commit and send.

        **Watch out for.** Generating the order id on the server for each request. A retry then looks like a new order and the user buys twice.
    - q: Compliance needs to block trading in chosen stocks within seconds, and sometimes only for retail investors. How do you build that?
      level: Senior
      topics: [/system-design/patterns/caching, /system-design/fundamentals/abuse-protection]
      companies: [Robinhood]
      a: |-
        **Short answer.** Keep a small rules table of restrictions, push it to every order service instance in memory, and check it during order validation before any money is held.

        **Why.** A rule holds a symbol, the action it blocks (buy, sell or both), the account types it applies to (for example retail only), a start time and an optional end time. There are perhaps a few hundred rules at once, so the whole set fits in memory on each instance. A check against a local map costs microseconds, which matters at 8,500 orders a second.

        The hard requirement is speed of change. When a rule is saved, the rules service publishes it on a broadcast channel and instances apply it within about a second. Each instance also reloads the full set every 30 seconds, in case it missed a message. Every rule set has a version number, and each order records the version it was checked against, so an audit can show why an order was accepted.

        Decide what happens to orders that are already open. The usual choice is to block new buys, still allow sells so users are not trapped, and leave resting orders to a separate compliance decision.

        **Watch out for.** Checking the rule only in the mobile app or at the API gateway. Scheduled orders and internal callers skip those paths. The check belongs in the order service.
    - q: Add orders that are scheduled for a future time, such as "buy at the open next Monday". What changes?
      level: Mid
      topics: [/system-design/patterns/message-queues, /system-design/patterns/idempotency]
      companies: [Coinbase]
      a: |-
        **Short answer.** Store the scheduled order as its own record with a due time, and let a scheduler turn it into a normal order at that time through the same entry point every other order uses.

        **Why.** A scheduled order is an intent, so it should not hold money for days. It sits in a table indexed by due time. A scheduler asks every second for rows that are due and still pending, claims each row by changing its state to `triggering` with a conditional update, and then calls the order service. The client order id is derived from the scheduled order id, so if the scheduler crashes and another instance repeats the call, only one real order exists.

        All checks run at trigger time, because the world has changed since the user set it up: buying power, trading restrictions, market hours. If a check fails, the scheduled order moves to `failed` and the user gets a notification with the reason.

        Many schedules share the same moment. If 500,000 orders are due at the opening bell, spread the claims across many scheduler workers and start preparing a few seconds early, so they are ready to send at the open and not minutes later.

        **Watch out for.** Holding the cash when the schedule is created. The money is locked for days and the user cannot use it for anything else.
- id: design-payment-system
  q: Design a payment system that charges customers through an outside payment provider and never charges anyone twice.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/idempotency
    - /system-design/patterns/saga
    - /system-design/case-studies/kindle-payments
    - /system-design/fundamentals/webhooks
  companies: [Airbnb, Coinbase, DoorDash, Lyft]
  a: |-
    **Short answer.** Record every payment as a state machine in your own database before calling the provider. Send the provider a unique key with each charge so a retry cannot charge again, and accept the result from both the direct reply and the provider's webhook.

    **What to clarify.** Who we are: a business that takes payments through a provider, not a card network. One-time payments only, or recurring too. Whether we pay money out as well (to sellers, drivers or a charity). Which currencies. Whether refunds are in scope.

    **The numbers that drive the design.**

    - Payment rate. 10 million payments a day is about 115 a second on average. A peak of 10 times that is about 1,200 a second. This is a small load for modern databases, so the design effort goes into correctness.
    - Calls in flight. A provider call takes about 2 seconds. At 1,200 payments a second that is 2,400 open calls at once, so the callers must not hold a database transaction open while they wait.
    - Storage. Each payment writes about 5 rows of 500 bytes (the payment, its attempts, ledger entries, an outbox event). That is 2.5 KB a payment and 25 GB a day.

    **Core design.**

    1. The client asks our server to start a payment. The server inserts a payment row in state `created` with the amount, the currency and an idempotency key (a unique id that marks retries as the same request).
    2. Card details go from the client straight to the provider's form. Our servers only ever see a token, a stand-in value that is useless outside the provider.
    3. The payment service moves the row to `processing` and calls the provider with the token, the amount and the payment id as the provider-side idempotency key.
    4. The result arrives twice: in the direct reply, and later as a webhook (an HTTP call from the provider to us). Both feed the same state machine, and whichever comes second changes nothing.
    5. On success, one transaction marks the payment `succeeded`, writes the ledger entries and writes an outbox event. Other services (orders, receipts) react to that event.
    6. A daily job compares the provider's settlement report with our ledger, line by line.

    <AnimatedDiagram name="fundamentals/api-design" highlight={["app", "api", "idem", "db"]} caption="A retry carries the same idempotency key, so the API returns the stored result and does not charge again." />

    **The hardest part.** The unknown outcome. A call to the provider times out, and the charge may or may not have happened. The payment stays in `processing`. A retry with the same key, a status query or the webhook settles it later.

    **Main trade-off.** You can keep the user waiting a few seconds for a definite answer, or show "payment pending" at once and confirm later. Waiting is simpler for the user. Pending survives a slow provider. Most systems wait up to a limit, such as 10 seconds, and then fall back to pending.

    **What a senior answer adds.** A double-entry ledger as the source of truth for money. Reconciliation as a permanent feature, since two companies' records always drift. A second provider to fail over to. Refunds and chargebacks as new linked records, never as edits to the old payment.

    **Watch out for.** Storing amounts as floating point numbers. Store whole minor units (cents) as integers, next to a currency code.
  followUps:
    - q: A user double-clicks Pay, or the app retries after a network error. How exactly does the idempotency key stop a second charge?
      level: Mid
      topics: [/system-design/patterns/idempotency, /system-design/fundamentals/api-design]
      companies: [DoorDash]
      a: |-
        **Short answer.** The client creates one key per purchase attempt and sends it on every retry. The server stores the key under a unique index, so only the first request can create the payment, and later requests get the stored result back.

        **Why.** The key must be created before the first click, for example when the checkout page loads, and reused for each retry of that purchase. The server inserts the key and the payment row in one transaction. Three cases follow:

        - New key. The insert succeeds and the payment proceeds.
        - Known key, payment finished. The server returns the saved response. No provider call is made.
        - Known key, payment still running. The server answers "in progress" and the client waits and asks again.

        The server also stores a hash of the request body with the key. If the same key arrives with a different amount, it returns an error, because that is a client bug and silently picking one of the two amounts would be wrong.

        The same idea is repeated one level down: our payment id is the key we send to the provider. Keys can be deleted after a day or two, once no retry can still be on its way.

        **Watch out for.** Checking for the key with a read and then inserting. Two requests 5 ms apart both pass the read. Let the unique index reject the second one.
    - q: The call to the payment provider fails or times out. What does your system do?
      level: Senior
      topics: [/system-design/patterns/circuit-breaker-and-retries, /system-design/patterns/idempotency]
      companies: [Lyft]
      a: |-
        **Short answer.** Sort the failure into one of three kinds, declined, temporary error or unknown, and treat each differently. Only a clear decline is final.

        **Why.**

        | What came back | Meaning | Action |
        |---|---|---|
        | Declined (no funds, bad card) | The provider said no | Mark `failed`, tell the user, do not retry |
        | Temporary error (rate limited, provider overloaded) | Nothing was charged | Retry with the same key after a growing delay |
        | Timeout or dropped connection | Unknown | Keep `processing`, then query or retry with the same key |

        The third row is the dangerous one. The provider may have charged the card and the reply was lost. Because every call carries our payment id as its key, a retry is safe: the provider returns the first result. A background job picks up payments stuck in `processing` for more than a minute and asks the provider for their status.

        Retries need limits. Use delays of 1, 2, 4 and 8 seconds with some random variation, then stop and leave the payment for the background job. If half of all calls are failing, a circuit breaker stops calling for a short time, so we do not pile load on a provider that is already struggling.

        **Watch out for.** Showing "payment failed, try again" on a timeout. The user pays again with a new key, and the first charge succeeds as well.
    - q: The provider reports results through webhooks that can arrive late, twice or out of order. How do you process them safely?
      level: Senior
      topics:
        [
          /system-design/fundamentals/webhooks,
          /system-design/patterns/idempotency,
          /system-design/patterns/message-queues,
        ]
      companies: [DoorDash]
      a: |-
        **Short answer.** Verify the signature, save the raw event, answer 200 at once, and process it later from a queue. Processing ignores event ids already seen and only allows state changes that move forward.

        **Why.** The provider resends a webhook until it gets a success reply, often for up to several days. If our handler does slow work before answering, the provider times out and sends again, and the load grows. So the handler does three cheap things: checks the signature with the shared secret, inserts the event into an inbox table keyed by the provider's event id, and replies. A duplicate hits the unique key and is dropped.

        A worker then applies each event to the payment's state machine. Order is handled by rules, since delivery order is not guaranteed. `succeeded` after `processing` is allowed. `processing` after `succeeded` is ignored, because it is an old event. `refunded` arriving before we have seen `succeeded` means we missed something, so the worker fetches the current payment from the provider and uses that.

        Webhooks can also be lost for good. A sweep every few minutes queries the provider for payments that have been waiting too long.

        **Watch out for.** Treating the webhook body as the truth without checking the signature. Anyone who finds the URL could mark payments as paid.
    - q: A marketplace wants to place a hold on the buyer's card at booking time and take the money later. How do holds get captured or released?
      level: Mid
      topics: [/system-design/patterns/saga, /system-design/case-studies/kindle-payments]
      companies: [Airbnb]
      a: |-
        **Short answer.** Split the charge into two steps. An authorization reserves the amount on the card. A later capture takes it, and a void releases it. Each step is its own state with its own idempotency key.

        **Why.** The payment gains states: `authorized`, then `captured`, `voided` or `expired`. In the ledger the hold is recorded as pending, so it reduces what is available without counting as revenue yet.

        Three details matter in practice:

        - Authorizations expire. Card networks keep a hold for a limited time, often about a week. For a stay that starts in 3 months, do not hold for 3 months. Save the card token and charge at the agreed time.
        - Capture can be for less than the hold. If the final price is 180 on a 200 hold, capture 180 and the bank frees the other 20.
        - Release must be explicit. When a booking is cancelled, send the void. Leaving the hold to expire keeps the buyer's money blocked for days and brings support tickets.

        A scheduled job finds holds close to expiry and either captures them or voids them according to the booking state.

        The trade-off against charging at once: holds avoid refunds, which cost fees and take days, but they add states and a deadline.

        **Watch out for.** Capturing twice after a retry. Use a key built from the payment id and the word "capture".
    - q: A three-day fundraiser wants a live total on the home page. How do you serve a running total in near real time without slowing payments?
      level: Mid
      topics:
        [
          /system-design/patterns/cqrs-event-sourcing,
          /system-design/patterns/caching,
          /system-design/patterns/message-queues,
        ]
      companies: [DoorDash]
      a: |-
        **Short answer.** Keep the total out of the payment path. Publish an event for each successful payment, let a consumer add it to a counter, and serve the counter from a cache that refreshes every second or two.

        **Why.** A fundraiser that collects 100 million dollars at an average of 50 dollars is 2 million donations. Over 3 days, about 259,000 seconds, that is 8 a second on average, with bursts of perhaps 800 a second after a TV mention. The page with the total may get 50,000 views a second in the same burst. Summing the payments table for each view would hurt the database that takes the money.

        So the write side and the read side are separated. The payment transaction writes an outbox event. A consumer reads the events and adds each amount to per-minute buckets, and remembers processed event ids so a redelivered event is not counted twice. The page reads one cached number, which is the sum of the buckets inside the window. A rolling three-day window is then easy: drop buckets older than 72 hours.

        The displayed total can be a couple of seconds late, and nobody is harmed. The exact figure for accounting comes from the ledger.

        **Watch out for.** Using the live counter for payouts or receipts. It is a display value, and it must be rebuildable from the ledger at any time.
    - q: In a crypto custody system, a user asks to withdraw more than the hot wallet holds. What happens?
      level: Senior
      topics: [/system-design/patterns/saga, /system-design/patterns/message-queues]
      companies: [Coinbase]
      a: |-
        **Short answer.** Accept the request, debit the user's balance in the ledger right away, and queue the withdrawal as pending. It is paid when the hot wallet is refilled from cold storage. Never fail it and never pay part of it without telling the user.

        **Why.** A hot wallet has its keys online so it can sign at once, and it is kept small, perhaps 2 percent of all funds, to limit what a theft could take. Cold storage keeps its keys offline, and moving funds out needs several people to approve and can take hours. So a large withdrawal can exceed the hot balance while the company is fully solvent.

        The withdrawal is a saga with clear states: `requested`, `funds reserved`, `waiting for liquidity`, `signed`, `broadcast`, `confirmed`. The ledger debit happens first, so the user cannot spend the same coins elsewhere while waiting. A treasury service watches the hot balance against the pending queue and requests a refill when the balance falls below a threshold, before the queue grows. Small withdrawals can go ahead of a large one so one request does not block everyone.

        The trade-off is security against speed. A bigger hot wallet pays faster and risks more.

        **Watch out for.** Signing and broadcasting before the ledger debit is committed. A crash between the two pays out coins that the user's balance still shows.
- id: design-price-alerts
  q: Design a price drop alert system for a shopping site. Users set a target price on a product and get a notification when the price falls to it.
  level: Mid
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/message-queues
    - /system-design/fundamentals/push-notifications
    - /system-design/patterns/fan-out
  companies: [Airbnb, Meta]
  a: |-
    **Short answer.** Store alerts indexed by product and target price. Each time a product's price changes, look up only the alerts that the new price has just crossed, and hand them to a notification queue.

    **What to clarify.** Whether prices come from our own catalog (we get an event on every change) or from other sites (we must fetch them). How fast an alert must arrive: seconds or minutes. Which channels: push, email or both. Whether an alert fires once or every time the price drops again.

    **The numbers that drive the design.**

    - Alerts. 50 million users with 10 alerts each is 500 million alerts. At about 50 bytes each that is 25 GB, small enough for a modest sharded database.
    - Price changes. If 5 percent of 100 million products change price each day, that is 5 million changes, about 58 a second. The input is small.
    - Skew. Most products have no alerts at all. A popular phone may have 2 million. So the cost is in the fan-out (one event turning into many deliveries) of a few hot products.

    **Core design.**

    1. An alert is a row with the product id, the target price, the user id and a state (`armed` or `fired`). The table is sharded by product id and indexed by product id plus target price.
    2. When an alert is created, compare it with the current price. If the price is already at or below the target, tell the user now and do not arm it.
    3. The pricing service publishes every change to a durable log as an event with the product id, the old price and the new price.
    4. A matcher consumes the log. It ignores price rises. For a drop, it runs one range query: armed alerts for this product with a target at or above the new price and below the old price. Those are exactly the alerts crossed by this change.
    5. Each matched alert becomes a job on a notification queue, and its state changes to `fired`.
    6. Notification workers apply the user's settings (channel, quiet hours, daily cap), then send through the push or email provider.

    <AnimatedDiagram name="fundamentals/push-notifications" highlight={["notify", "queue", "workers", "apns"]} caption="Matched alerts wait on a queue, and workers send them through the push provider at a rate it accepts." />

    **The hardest part.** One event that matches millions of alerts. The matcher must page through them in batches and keep its place, so a crash at alert 900,000 does not restart from zero or skip the rest. The queue absorbs the burst while the push provider's rate limit sets the pace.

    **Main trade-off.** Matching on every change gives alerts within seconds but does work for prices that move up and down all day. Matching on a schedule, such as every 15 minutes, is cheaper and merges noise, but a short sale can be missed. Use events for our own catalog and a schedule for outside sources.

    **What a senior answer adds.** A dedupe key per alert and price event, so a replayed event does not notify twice. Checking the price again just before sending, because a queued alert can be minutes old. Metrics on the time from price change to delivery. A cap on notifications per user per day.

    **Watch out for.** Looping over all 500 million alerts on a timer and fetching each product's price. Almost all of that work finds nothing.
  followUps:
    - q: Why put a queue between the matcher and the code that sends notifications?
      level: Junior
      topics: [/system-design/patterns/message-queues, /system-design/patterns/back-pressure]
      a: |-
        **Short answer.** The two sides work at very different speeds. The queue lets the matcher finish quickly and lets the senders work at the pace the push and email providers allow.

        **Why.** A matcher can find 2 million alerts in under a minute, because it only reads an index. Sending is much slower. Each push is a network call to an outside provider that limits how fast we may send, say 5,000 a second. Without a queue the matcher would have to wait for each send, and price events for every other product would back up behind one popular item.

        With a queue, the matcher writes 2 million small jobs and moves on. The workers take about 400 seconds to drain them at 5,000 a second. If the provider has an outage, jobs wait in the queue and are retried, and no alert is lost.

        The queue also gives a clean place to add workers when the backlog grows, and one number to watch: the age of the oldest job.

        The trade-off is delay. A user at the back of that burst hears about the drop 6 or 7 minutes late. For a price alert that is acceptable.

        **Watch out for.** A queue that keeps jobs only in memory. A restart during a big sale would silently drop alerts that users were promised.
    - q: A price moves up and down around a user's target all day. How do you avoid sending the same alert again and again?
      level: Mid
      topics: [/system-design/patterns/idempotency, /system-design/fundamentals/push-notifications]
      a: |-
        **Short answer.** Give each alert a state. It fires once when the price crosses the target, then stays quiet until it is armed again under a clear rule.

        **Why.** Suppose the target is 100 and the price goes 101, 99, 101, 99 within a day. A matcher with no state sends two notifications, and a seller testing prices could cause twenty. Users turn off notifications after that, and the feature is dead for them.

        The alert row moves from `armed` to `fired` when it matches, and the matcher's range query only reads armed rows. Then choose the rule for arming again:

        | Rule | Behaviour |
        |---|---|
        | One shot | The alert is finished after it fires. The user sets a new one. |
        | Cool-down | It arms again after a fixed time, such as 7 days. |
        | Gap | It arms again only after the price rises well above the target, for example by 5 percent. |

        One shot is the simplest and is a good default. The gap rule (often called hysteresis) suits users who want to keep tracking a product.

        A per-user daily cap is a second safety net, for example at most 5 alert notifications a day, with the rest folded into one summary.

        **Watch out for.** Deduplicating only in the notification worker with a short memory window. A crossing two hours later looks new and is sent again.
    - q: A product with 2 million watchers drops in price. Walk through what the system does.
      level: Senior
      topics:
        [/system-design/patterns/fan-out, /system-design/patterns/back-pressure, /system-design/patterns/rate-limiting]
      companies: [Meta]
      a: |-
        **Short answer.** Turn the one event into many small batch jobs, process them in parallel with a saved position, and send at a controlled rate with the most useful alerts first.

        **Why.** A single consumer that reads 2 million rows and queues 2 million jobs inside one event handler will run past its time limit. The log then redelivers the event and the work starts again.

        So the matcher does not do the fan-out itself. It writes one fan-out task: product id, old price, new price. Fan-out workers page through the matching alerts 5,000 at a time using the index, and save the last key after each page. A crash resumes from the saved key. Each alert's dedupe key is the alert id plus the price event id, so a repeated page causes no second notification.

        Sending is the slow step. At 5,000 pushes a second, 2 million alerts take about 7 minutes. Order matters if stock is limited, so decide the order on purpose, for example alerts created earliest go first. Hot products get their own queue, so a small product's 3 alerts are not stuck behind 2 million.

        Also think about the load you create. 2 million people opening the product page within minutes is a traffic spike on the product service, and spreading the sends protects it.

        **Watch out for.** Sending all alerts when only 500 units are in stock. Check stock during the fan-out and stop when the item is gone.
    - q: How does the design change if the prices are on a competitor's website that offers no API?
      level: Senior
      topics:
        [
          /system-design/case-studies/web-crawler,
          /system-design/patterns/rate-limiting,
          /system-design/patterns/message-queues,
        ]
      a: |-
        **Short answer.** The matching and notification halves stay the same. What changes is the input: a polite crawler fetches the pages on a schedule, extracts the price, and publishes a change event only when the price differs from the last one stored.

        **Why.** Without an API nobody tells us about a change, so we must go and look. How often we look sets how fresh the alerts are, and it costs requests. Fetching 10 million pages every hour is about 2,800 requests a second, and no single site will accept that from us.

        So the schedule is adaptive. Products with many watchers, or with prices that change often, are fetched every 15 minutes. Quiet products are fetched once a day. A per-site rate limit, such as 1 request a second, is enforced in one shared place, and the site's published crawling rules are respected.

        Extraction is the fragile part. Page layouts change, and a broken parser can read a price of 0 or the price of an accessory. Guard against that: reject a price that moved more than, say, 70 percent until a second fetch confirms it, and alert the team when a site's parse failures jump.

        The trade-off is cost against freshness. Minutes of delay are normal here, and the product should say so.

        **Watch out for.** Publishing an event on every fetch. Compare with the stored price first, or the matcher handles millions of events where nothing changed.
    - q: How would you change the design for stock price alerts, where one symbol's price can change thousands of times a second?
      level: Senior
      topics:
        [/system-design/patterns/sharding, /system-design/patterns/message-queues, /system-design/databases/skip-list]
      a: |-
        **Short answer.** Move the alerts into memory, grouped by symbol and sorted by threshold, and check each price tick against only the nearest threshold on each side.

        **Why.** A shopping price changes a few times a day, so one database query per change is fine. A busy stock produces thousands of ticks a second, and a query per tick would flood the database while finding nothing almost every time.

        For each symbol, keep two sorted structures in memory: "notify when above" alerts ordered from lowest target up, and "notify when below" alerts ordered from highest target down. On each tick, compare the price with the first item of each. If neither is crossed, the work is done after two comparisons. If one is crossed, pop items until the next is not crossed, and queue those alerts.

        Memory is manageable. 100 million alerts at about 40 bytes is 4 GB, spread over several matcher nodes by hashing the symbol. The database stays the source of truth: nodes load their symbols at start and follow a stream of alert creates and deletes.

        You can also reduce the input. Keep only the high and low of each 100 ms window per symbol, since a threshold crossed inside the window is crossed by one of those two values.

        **Watch out for.** Comparing only the latest price each second. A price that touches the target and bounces back inside that second is missed, and the user notices.
- id: design-checkout
  q: Design checkout for an e-commerce platform that hosts many merchants. It takes a cart to a paid order and must survive a sale-day spike of 10 to 100 times normal traffic.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/saga
    - /system-design/patterns/idempotency
    - /system-design/patterns/back-pressure
    - /system-design/patterns/rate-limiting
  companies: [Salesforce, Shopify]
  a: |-
    **Short answer.** Run checkout as a short chain of steps: reserve stock, take payment, create the order. Each step can be retried and undone. In front of the chain, admit only as many shoppers as the slowest step can serve, and make everyone else wait in a fair line.

    **What to clarify.** Where checkout starts and ends: here, from a filled cart to a confirmed, paid order. Whether one cart can hold items from several merchants (assume one merchant per cart). What must be exact (stock, money) and what can lag (emails, analytics, search). How big the spike is and how concentrated: the whole platform, or one merchant's product launch.

    **The numbers that drive the design.**

    - Order rate. Say a normal peak is 500 orders a second across the platform. A sale day at 10 times that is 5,000 a second.
    - Payment calls. A payment provider call takes about 2 seconds, so 5,000 orders a second means about 10,000 payment calls open at once. Checkout servers must wait without blocking a thread or a database connection per call.
    - One hot shop. A launch with 5,000 units can draw 100,000 buyers in the first minute. That is about 1,700 checkout attempts a second on one merchant, and 95 percent of them must be told "sold out" cheaply.

    **Core design.**

    1. The cart lives in a fast key-value store under a cart id. Losing a cart is annoying but not a money problem, so it does not need transactions.
    2. Starting checkout creates a checkout session: a snapshot of items, prices, tax and shipping, with a unique checkout id.
    3. The checkout service asks inventory to reserve the items for about 10 minutes.
    4. It asks the payment service to charge, using the checkout id as the idempotency key (the id that makes a retry count as the same request).
    5. On success it creates the order and an outbox event in one database transaction, and confirms the reservation.
    6. Email, fulfilment, analytics and search updates all consume the order event later.
    7. If payment fails, the reservation is released. If order creation fails after payment, the step is retried, and the payment is refunded only if it can never succeed.

    <AnimatedDiagram name="databases/polyglot-ecommerce" highlight={["cart", "redis", "orders", "pg", "kafka"]} caption="The cart sits in a key-value store, the order is written to the relational database, and everything else follows from the event stream." />

    **The hardest part.** Staying correct while saying no. During the spike the system must reject or delay most requests, and still never lose a paid order. A waiting room in front of checkout hands out a limited number of entry tokens a second, sized to what inventory and payments can take. Shoppers inside finish at normal speed. Shoppers outside see their place in line.

    **Main trade-off.** Reserving stock early, at checkout start, gives the buyer certainty but lets abandoned checkouts hold stock for 10 minutes. Reserving late, at payment, sells faster but tells some buyers "sold out" after they typed their card number. Early with a short expiry is the usual choice.

    **What a senior answer adds.** Limits per merchant, so one launch cannot use the capacity of 100,000 other shops. A plan to switch off optional features under load, such as recommendations and live shipping quotes. Load tests at the expected peak weeks before the sale, since capacity added during the spike arrives too late.

    **Watch out for.** Doing every step inside one long database transaction that also waits on the payment provider. Connections run out within seconds at peak.
  followUps:
    - q: One merchant's product launch brings 100 times its normal traffic. How do you keep the other merchants on the platform unaffected?
      level: Senior
      topics:
        [/system-design/patterns/rate-limiting, /system-design/patterns/sharding, /system-design/patterns/back-pressure]
      companies: [Shopify]
      a: |-
        **Short answer.** Give every shared resource a limit per merchant, and place merchants in groups of servers and databases so that a failure in one group cannot spread.

        **Why.** On a shared platform the danger is the noisy neighbour: one tenant (one merchant) using up something everyone needs. The typical resources are web workers, database connections, queue capacity and payment provider quota.

        Isolation works in layers:

        - At the edge. A rate limit and a waiting room per shop. The launch shop's shoppers line up, and other shops' shoppers never see a line.
        - In the application. A cap on how many requests one shop may have in progress at once, such as 20 percent of a server group. Past the cap its requests are refused quickly.
        - In the data. Shops are grouped into units, each with its own database and caches. A unit that is overloaded or broken affects only the shops inside it. A merchant known to run huge launches can be moved to a quieter unit ahead of time.
        - In background work. Queues per shop, or fair scheduling, so one shop's 200,000 order emails do not delay everyone else's.

        The trade-off is efficiency. Hard limits leave some capacity unused while one shop is being refused. That cost is worth paying for predictable behaviour.

        **Watch out for.** One global rate limit. It protects the platform, but the hot shop fills it and every other shop gets refused too.
    - q: Payment succeeded, and then creating the order failed. What now?
      level: Senior
      topics: [/system-design/patterns/saga, /system-design/patterns/idempotency]
      companies: [Shopify]
      a: |-
        **Short answer.** Keep going forward. The checkout record already says "paid", so a recovery worker retries order creation until it works. A refund is the last resort, used only when the order can never be created.

        **Why.** This is a saga: a chain of local steps where each one has an undo action. For most steps undo is cheap, for example releasing a reservation. For payment, undo is a refund. That costs fees, takes days to reach the buyer and loses the sale. Retrying the next step is nearly always the better move.

        This works because the checkout session records each finished step durably: `reserved`, `paid` with the payment reference, `ordered`. If the server dies after payment, a worker finds sessions that have been in `paid` for more than 30 seconds and resumes them. Order creation uses the checkout id as a unique key, so two workers resuming the same session still create one order.

        Tell the buyer the truth meanwhile. The page shows "payment received, confirming your order", and the email goes out when the order exists.

        Refund only on a permanent fault. One example is a reservation that expired during a slow payment, with the stock sold to someone else. Even then, try to reserve again first.

        **Watch out for.** Keeping progress only in the server's memory. After a crash nobody knows that a paid checkout is waiting for its order.
    - q: Which parts of checkout need strong consistency, and which parts can be eventually consistent?
      level: Mid
      topics: [/system-design/patterns/consistency-models, /system-design/fundamentals/availability]
      companies: [Shopify]
      a: |-
        **Short answer.** Stock reservations, payment state and order creation need strong consistency. Carts, displayed stock, search, recommendations and analytics can lag by seconds.

        **Why.** The test is what a stale read costs. If stale data can make you sell something you do not have, or take money twice, that step must read and write the latest value in one place. If a stale read only shows a slightly old number, favour speed and availability.

        | Part | Model | Reason |
        |---|---|---|
        | Stock reservation | Strong | A stale count oversells |
        | Payment and order state | Strong | Duplicates cost money |
        | Cart contents | Eventual | Worst case a shopper adds an item again |
        | "Only 3 left" label | Eventual | Advice only, checked again at reservation |
        | Search and catalog | Eventual | A price is confirmed at checkout start |
        | Analytics, emails | Eventual | A minute late is fine |

        This split is what lets the system survive a spike. The strongly consistent core is small: a few rows per order. Everything around it can be cached, replicated and served even when the core is slow.

        **Watch out for.** Calling the whole system "eventually consistent" or "strongly consistent". Interviewers want the answer part by part.
    - q: How would you make checkout keep working when a whole region goes down?
      level: Senior
      topics:
        [
          /system-design/fundamentals/availability,
          /system-design/databases/single-leader-replication,
          /system-design/databases/sync-vs-async-replication,
        ]
      companies: [Shopify]
      a: |-
        **Short answer.** Give each merchant's data a home region with a replica in a second region. On failure, move that merchant's traffic to the replica and promote it, with a clear rule for the few seconds of writes that may not have arrived.

        **Why.** Letting two regions accept writes for the same stock at the same time invites overselling, because each could sell the last unit. So each group of shops has one writing region at a time. Other regions hold copies and serve reads.

        The main decision is how the copy is kept:

        | Replication | Checkout latency | Data lost on failover |
        |---|---|---|
        | Synchronous to region 2 | Adds one cross-region round trip, perhaps 30 to 70 ms | None |
        | Asynchronous | No extra | The last second or so of writes |

        A common middle path is synchronous replication for the small set of money rows (orders, payments, reservations) and asynchronous for the rest.

        After failover, some checkouts were in flight. Idempotency keys make the client's retries safe in the new region, and reconciliation with the payment provider finds charges whose orders did not survive, so they can be recreated or refunded.

        Practice the failover on normal days. A procedure that has never been run will not work on the busiest day of the year.

        **Watch out for.** Forgetting capacity. The surviving region must carry both regions' peak load, so it needs that headroom before the failure.
    - q: Checkout is split into cart, checkout, inventory, payment and shipping services. What do the API contracts between them look like?
      level: Mid
      topics:
        [/system-design/fundamentals/api-design, /system-design/patterns/idempotency, /system-design/fundamentals/rpc]
      companies: [Salesforce]
      a: |-
        **Short answer.** Each service offers a few commands that name a business action, take an idempotency key and return a clear state. Services share ids and events, never database tables.

        **Why.** The checkout service is the coordinator, and it calls the others. A workable set:

        | Service | Call | Returns |
        |---|---|---|
        | Cart | Get cart by id | Items and quantities |
        | Inventory | Reserve items for a checkout id, with an expiry | Reservation id, or which items are short |
        | Inventory | Confirm or release a reservation | Final state |
        | Payment | Charge an amount for a checkout id | Succeeded, declined or pending |
        | Shipping | Quote for items and address | Options with price and delivery days |
        | Orders | Create order from a checkout id | Order id |

        Three rules keep this stable under failure. Every call that changes something accepts the checkout id as its key, so the coordinator can repeat any call after a timeout. Every reply separates "no" (declined, out of stock) from "try later" (overloaded), because the coordinator handles them differently. Slow outcomes are reported as events, such as "payment succeeded", so nobody has to hold a connection open.

        **Watch out for.** A generic "update inventory" call that sets a new quantity. Two callers overwrite each other. Offer reserve, confirm and release.
- id: design-inventory
  q: Design an inventory system for an online shop that never sells more units than it has, including during a flash sale.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/consistency-models
    - /system-design/patterns/idempotency
    - /system-design/databases/relational-databases
    - /system-design/patterns/caching
  companies: [Amazon, Shopify]
  a: |-
    **Short answer.** Keep one authoritative stock record per product and location, and change it only with atomic conditional writes: "reserve 1 if at least 1 is available". Reservations expire, so stock that buyers abandon returns to sale.

    **What to clarify.** Whether "never oversell" is absolute (limited launch items) or a small error is acceptable. How many warehouses or shops hold stock. Whether stock is held when an item is added to the cart or at checkout. How large the worst spike on a single product is.

    **The numbers that drive the design.**

    - Size. 10 million products in 10 locations is 100 million stock rows. At about 100 bytes each that is 10 GB, which fits on one machine. Data size is not the problem.
    - Contention. A flash sale of 10,000 units can attract 1 million buyers in the first minute, about 17,000 attempts a second on one row. Updates to one row run one after another. At roughly 1 ms per committed update, that row takes about 1,000 updates a second, so the database alone falls 16,000 requests further behind every second.
    - Read to write ratio. Product pages show stock perhaps 100 times for every purchase, so the displayed number must come from a cache.

    **Core design.**

    1. Each stock row holds the product id, the location, units on hand and units reserved. Available is on hand minus reserved.
    2. To reserve, run one statement: add the quantity to reserved, only where on hand minus reserved is at least the quantity. One row changed means success. Zero rows means sold out.
    3. In the same transaction, insert a reservation row with the checkout id as a unique key and an expiry about 10 minutes away. A retry with the same checkout id finds the existing reservation.
    4. When payment succeeds, confirm: subtract the quantity from both on hand and reserved. When checkout is cancelled, release: subtract from reserved only.
    5. A sweeper finds expired reservations every few seconds and releases them.
    6. Every change publishes an event. Caches, search and other sales channels update their displayed stock from the events.
    7. For a known hot product, a gate in front of the database lets through only about as many requests as there are units.

    **The hardest part.** The single hot row. Correctness comes from doing updates one at a time, and that same property caps throughput. The answer is to stop most requests before they reach the row, since 990,000 of the 1 million buyers must hear "sold out" anyway and that answer does not need a transaction.

    **Main trade-off.** Reserving at add-to-cart feels good to buyers but lets carts and bots lock up all stock without paying. Reserving at checkout start with a short expiry is the common choice. Reserving at payment gives the highest sell-through and the worst experience.

    **What a senior answer adds.** A background check that reserved always equals the sum of open reservations, with an alert when it drifts. Every stock change recorded as an append-only movement (received, reserved, sold, returned, adjusted) so the count can be explained. Per-buyer purchase limits and bot defence, since fairness is part of a flash sale.

    **Watch out for.** Trusting the cached "in stock" number when selling. The cache is for display. The conditional write is the only check that counts.
  followUps:
    - q: Why is it wrong to read the stock, check that it is above zero, and then write the new value?
      level: Junior
      topics: [/system-design/patterns/consistency-models, /system-design/databases/relational-databases]
      a: |-
        **Short answer.** Two buyers can both read the same number before either writes. Both see "1 left", both pass the check, and both buy the last unit.

        **Why.** Reading and writing are separate steps, and other requests run between them. Follow two requests on a product with 1 unit:

        1. Request A reads stock: 1.
        2. Request B reads stock: 1.
        3. A checks that 1 is above 0 and writes 0.
        4. B checks that 1 is above 0 and writes 0.

        Two orders exist for one unit, and the database shows 0, so nothing looks wrong. This is called a lost update.

        There are three standard fixes:

        | Fix | How it works |
        |---|---|
        | Atomic conditional update | One statement: reduce stock by 1 where stock is at least 1. The database checks and writes as a single step. |
        | Pessimistic lock | Lock the row while reading, so B waits until A finishes. |
        | Optimistic check | Each row has a version. Write only if the version is unchanged, and retry if it changed. |

        The first is the simplest and the fastest for a counter, because it needs one round trip and holds the lock for the shortest time.

        **Watch out for.** Believing a transaction alone fixes this. At the default isolation level of most databases, both transactions can still read 1.
    - q: Would you store inventory in a SQL or a NoSQL database, and why?
      level: Mid
      topics:
        [
          /system-design/databases/choosing-a-database,
          /system-design/databases/relational-databases,
          /system-design/databases/key-value-stores,
        ]
      companies: [Amazon]
      a: |-
        **Short answer.** A relational (SQL) database is the default choice, because a reservation changes several rows that must succeed or fail together. A key-value store with conditional writes also works if you design around single-item updates.

        **Why.** Start from what the workload needs. The data is small, about 10 GB, so the scale-out strength of NoSQL is not required. The need is correctness on writes.

        | Need | Relational | Key-value with conditional writes |
        |---|---|---|
        | "Reduce only if enough" on one row | Yes | Yes |
        | Stock row and reservation row changed together | Yes, one transaction | Only if the store offers multi-item transactions, usually with limits |
        | A cart with 5 products reserved all or nothing | Yes | Harder: reserve one by one and undo on failure |
        | Very high write rate over many keys | Needs sharding | Built in |

        So the honest answer is that both can be correct, and the relational database gives you correctness with less code.

        The flash sale does not change the choice. Neither kind of database handles 17,000 writes a second to one key well, and the fix for that sits in front of the database.

        **Watch out for.** Choosing a store whose default is eventual consistency and reading stock from a replica. Two replicas can each sell the last unit.
    - q: One product gets 17,000 purchase attempts a second and the stock row handles about 1,000. How do you scale without overselling?
      level: Senior
      topics:
        [/system-design/patterns/back-pressure, /system-design/patterns/caching, /system-design/patterns/rate-limiting]
      a: |-
        **Short answer.** Put a fast in-memory counter in front of the database as a gate. Only requests that win a unit at the gate continue to the real reservation, and everyone else gets "sold out" immediately.

        **Why.** With 10,000 units and 1 million buyers, 99 percent of requests end in "no". Those should cost microseconds and never touch the database.

        The gate is a counter in an in-memory store that runs commands one at a time, loaded with 10,000 before the sale. Each request does an atomic "subtract 1 if above 0". Such a store handles 100,000 or more simple commands a second on one node, so 17,000 is comfortable. The 10,000 winners get a short-lived token and go on to the database reservation, which now sees a load it can handle. The database stays the source of truth.

        The gate and the database can disagree in one safe direction. If a winner abandons checkout, the unit is released in the database, and a small job adds it back to the gate. The gate must never show more than the database, so units are added back only after the release is committed.

        **Watch out for.** Using the in-memory counter as the only record. If that node restarts, the count is gone, or it reloads a stale number and oversells.
    - q: A buyer's reservation expires while their payment is still being processed. The payment then succeeds. What do you do?
      level: Senior
      topics: [/system-design/patterns/saga, /system-design/patterns/idempotency]
      a: |-
        **Short answer.** Stop the sweeper from releasing reservations that have a payment in progress. If the case still happens, try to reserve again, and refund only if the stock is really gone.

        **Why.** Expiry exists for abandoned checkouts. A buyer whose payment is with the provider has not abandoned anything. So the reservation has a state as well as a timer. When checkout starts the payment, it moves the reservation to `payment pending` and pushes the expiry out by a fixed margin, for example 5 more minutes, which covers slow card checks. The sweeper releases only reservations that are still `held` and past their time.

        The extension is a conditional update: it succeeds only if the reservation is still held. If it fails because the reservation has expired, checkout does not start the payment at all and asks the buyer to begin again. This order of steps removes most of the race.

        A small window remains, for example a payment result that arrives 20 minutes late through a webhook. Then confirm fails because the reservation is gone. Checkout tries a fresh reservation. If stock exists, the order goes ahead. If not, it issues a refund and tells the buyer plainly what happened.

        **Watch out for.** Treating confirm as a blind decrement. A confirm that does not find a live reservation must fail loudly, or stock goes negative.
    - q: The same stock is sold on the web shop, on a marketplace and in physical stores whose tills sometimes go offline. How do you keep one correct count?
      level: Senior
      topics:
        [
          /system-design/patterns/consistency-models,
          /system-design/databases/automatic-conflict-resolution,
          /system-design/patterns/cqrs-event-sourcing,
        ]
      a: |-
        **Short answer.** One central service owns the count, and every channel reserves through it. For channels that cannot ask in real time, set aside a fixed allocation or a safety buffer, so a late-arriving sale never takes a unit that was already sold online.

        **Why.** Channels differ in how they can connect:

        | Channel | Connection | Approach |
        |---|---|---|
        | Own web shop | Always online | Reserves directly, strong consistency |
        | Marketplace | We push stock, orders arrive seconds or minutes later | Publish a lower number than the true count |
        | Store till | Can be offline for hours | The store owns its own shelf stock |

        The store case is the clearest. A unit on a shelf can be picked up and paid for with no network, so the central system cannot veto that sale. Treat each store as a location with its own stock rows. Online orders draw from warehouse stock, or from store stock minus a buffer. When the till reconnects, it uploads its sales as movements, each with a unique id so a repeated upload is counted once.

        For the marketplace, the buffer covers the delay. With 5 units left, show the marketplace 3.

        **Watch out for.** Letting channels send absolute counts ("stock is now 7"). Two channels overwrite each other. Send changes ("sold 1") with ids.
- id: design-ledger
  q: Design a ledger service that records every movement of money for a payments company and can always explain every balance.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/cqrs-event-sourcing
    - /system-design/patterns/idempotency
    - /system-design/databases/relational-databases
    - /system-design/patterns/consistency-models
  companies: [Coinbase, Stripe]
  a: |-
    **Short answer.** Use double-entry bookkeeping in an append-only store. Every transaction is a set of entries that add up to zero, entries are never edited, and a balance is the sum of an account's entries, kept up to date in the same database transaction.

    **What to clarify.** Who calls the ledger: internal services only. Whether it must block overdrafts or only record what happened. How many currencies. How fresh a balance read must be. How long records are kept, which is usually seven years or more.

    **The numbers that drive the design.**

    - Write rate. 10 million money movements a day with about 3 entries each is 30 million entries, roughly 350 a second on average and 3,500 a second at a 10 times peak.
    - Storage. 30 million entries of 200 bytes is 6 GB a day, about 2.2 TB a year, and about 15 TB over seven years. That is large enough to need partitioning by time and small enough to keep online.
    - Hot accounts. A user account sees a few entries a day. The company's fee account is touched by nearly every transaction, so it sees hundreds of writes a second.

    **Core design.**

    1. Three tables. Accounts (id, owner, currency, type). Transactions (id, idempotency key, time, description, a reference to the business event). Entries (transaction id, account id, signed amount in whole minor units such as cents).
    2. The write API accepts one transaction with all its entries and an idempotency key (a unique id that marks retries as the same request). It rejects the request unless the entries sum to zero in each currency.
    3. One database transaction inserts the transaction row, inserts the entries, and updates a balance row for each account. If an account is not allowed to go negative, the balance update carries that condition and the whole write fails when it is not met.
    4. Nothing is updated or deleted afterwards. A mistake is fixed by a new transaction that reverses the old one and points to it.
    5. Holds are modelled with a pending balance next to the posted balance, so reserved money cannot be spent twice.
    6. A change stream copies entries to a reporting store, where finance runs heavy queries without touching the write path.

    **The hardest part.** Keeping the balance and the entries in agreement while a few accounts take most of the writes. The balance row is a convenience copy. The entries are the truth, and a job regularly recomputes balances from entries and raises an alarm on any difference.

    **Main trade-off.** Strong consistency in a single-writer relational database gives simple, provable correctness and limits write throughput per account. Spreading writes across many nodes raises throughput and turns a transfer between two accounts into a distributed transaction. Start with the first, and shard by account only when the numbers require it.

    **What a senior answer adds.** A check that the sum of all entries in each currency is zero at all times. A sequence number per account, so statements and audits have a stable order. Reconciliation against bank and provider statements as a daily process. Access control and encryption for sensitive fields, since the ledger shows who paid whom.

    **Watch out for.** A design with a single `balance` column that services add to and subtract from. When it is wrong, nothing can tell you why.
  followUps:
    - q: Why record two entries for every movement of money? Why not keep one balance per account and update it?
      level: Junior
      topics: [/system-design/patterns/cqrs-event-sourcing, /system-design/databases/relational-databases]
      a: |-
        **Short answer.** Two entries that cancel out show that money moved from one place to another and was never created or lost. A lone balance column keeps only the latest number and no history of how it got there.

        **Why.** Take a 100 dollar payment with a 3 dollar fee. In a double-entry ledger it is one transaction with three entries: minus 100 on the buyer's account, plus 97 on the seller's account, plus 3 on the fee account. The total is zero.

        That simple rule gives several things:

        - Error detection. If a bug credits the seller and forgets to debit the buyer, the entries do not sum to zero and the write is refused.
        - Explanation. Any balance is the sum of its entries, and each entry points to a transaction with a reason. "Why is my balance 412.50" always has an answer.
        - Safe correction. A wrong transaction is reversed by a new one. The history shows both the mistake and the fix.
        - A global check. Across all accounts, the entries in each currency must sum to zero at any moment.

        The cost is more rows and more thought when modelling. For anything that holds money, it is the standard that accountants and auditors expect.

        **Watch out for.** Entries that touch only one account, such as "add 50 bonus". The 50 has to come from some account, for example a marketing expense account.
    - q: A client sends the same ledger write twice, perhaps at the same instant. How do idempotency keys handle it?
      level: Mid
      topics: [/system-design/patterns/idempotency, /system-design/fundamentals/api-design]
      companies: [Stripe]
      a: |-
        **Short answer.** The key is stored under a unique index in the same database transaction as the entries. The first request writes. A duplicate fails on the index and gets the original result back.

        **Why.** Storing the key in the same transaction as the money is the important detail. If the key lived in a separate cache, a crash could save the entries and lose the key, and the retry would post the money a second time.

        The cases to handle:

        | Situation | Response |
        |---|---|
        | New key | Write the entries and return the new transaction |
        | Key seen, same request body | Return the stored transaction, change nothing |
        | Key seen, different body | Reject with an error, because the caller has a bug |
        | Two identical requests at once | One insert wins. The other waits on the index, fails, then reads the winner's result |

        Ledger keys should be kept much longer than the 24 hours common in public APIs. Internal jobs replay events from days ago during recovery. A good key is derived from the business event, such as "payment 8812 capture", and it stays unique for the life of the ledger.

        **Watch out for.** Clients that create a fresh random key for each retry. The key must be chosen once per business action.
    - q: Where does this ledger break first as volume grows, and what do you do about it?
      level: Senior
      topics:
        [
          /system-design/patterns/sharding,
          /system-design/patterns/back-pressure,
          /system-design/databases/relational-databases,
        ]
      companies: [Stripe]
      a: |-
        **Short answer.** The first limit is the hot account: one balance row, such as the company's fee account, that almost every transaction updates. Writes to it line up one behind another long before the database as a whole is full.

        **Why.** Each update holds the lock on that row for about a millisecond, so the row takes roughly 1,000 updates a second. The peak is 3,500 transactions a second, so requests pile up behind the row and latency climbs for everyone.

        Ways to remove the hot spot, in order of preference:

        - Do not keep a live balance for accounts that never need a limit check. A fee account cannot be overdrawn, so just append its entries, with no row lock, and compute the balance in the background.
        - Batch. Collect fee entries for a second and post them as one entry, or post per-merchant fee accounts that are swept to the main account each hour.
        - Split the account into sub-accounts, for example 64 of them chosen by hash, and sum them when the balance is read.

        The next limits arrive later. The entries table becomes huge, so partition it by month and move old partitions to cheaper storage.

        **Watch out for.** Sharding first. It is the most expensive fix, and it does nothing for one hot row, which still lives on a single shard.
    - q: A caller of your "create transaction" endpoint could misuse it. What mistakes do you design the API to prevent?
      level: Senior
      topics:
        [
          /system-design/fundamentals/api-design,
          /system-design/fundamentals/api-auth,
          /system-design/patterns/idempotency,
        ]
      companies: [Stripe]
      a: |-
        **Short answer.** Make wrong requests impossible to express or certain to be rejected: unbalanced entries, edits to history, direct balance changes, reused keys and writes to accounts the caller does not own.

        **Why.** The ledger is shared by many teams, and one careless client can corrupt money for all of them. So the endpoint is narrow and strict.

        | Misuse | Defence |
        |---|---|
        | Entries that do not sum to zero | Validate on the server and reject |
        | Mixed currencies in one sum | Require a zero sum per currency, with conversion as explicit entries through an exchange account |
        | "Set the balance to X" | No such endpoint exists. Balances change only through entries |
        | Editing or deleting a posted transaction | Not offered. Only a reversal that references the original |
        | A new key for each retry | Require a key, and document that it comes from the business event |
        | Backdated timestamps | The server sets the posting time. The caller may add a separate "effective date" |
        | Writing to another team's accounts | Each caller has permissions per account type |

        Amounts are integers in minor units, so no caller can send 10.005 dollars.

        **Watch out for.** A flexible "adjustment" endpoint added for convenience. It turns into the path every team uses to skip the rules.
    - q: Defend your consistency model. Why does the ledger need strong consistency, and where can it relax?
      level: Senior
      topics: [/system-design/patterns/consistency-models, /system-design/databases/single-leader-replication]
      companies: [Coinbase]
      a: |-
        **Short answer.** Any decision that spends money must see every earlier write to that account, so writes and balance checks go to one leader with serializable behaviour per account. Reads for display and reporting can use replicas that are a little behind.

        **Why.** Consider a withdrawal check on an account with 100 dollars. If two requests for 80 each can both read 100 from different replicas, both pass and 60 dollars is created from nothing. No later repair is clean, because the money has left. So the check and the debit happen as one atomic step on the leader, and the second request sees 20 and fails.

        A stale read is harmless in other places:

        | Use | Consistency | Staleness allowed |
        |---|---|---|
        | Debit with a limit check | Strong, on the leader | None |
        | Balance on a user's screen after their own action | Read your own writes | None for that user |
        | Statements, exports, dashboards | Eventual, from replicas | Seconds |
        | Finance reports | Eventual, from the reporting store | Minutes |

        The price of strong consistency is availability. If the leader for an account cannot be reached, debits for that account are refused until failover completes, perhaps 30 seconds. For money, a short refusal is better than a wrong yes.

        **Watch out for.** Saying "eventual consistency with reconciliation" for spend decisions. Reconciliation finds the loss afterwards. It does not prevent it.
    - q: The company operates in three regions. How does the ledger work across them?
      level: Senior
      topics:
        [
          /system-design/databases/single-leader-replication,
          /system-design/databases/sync-vs-async-replication,
          /system-design/databases/newsql-databases,
        ]
      companies: [Stripe]
      a: |-
        **Short answer.** Each account has one home region that accepts its writes. Other regions keep copies for reading and for disaster recovery. A transfer between accounts in two regions runs as two linked local transactions through a transit account.

        **Why.** Letting any region write to any account and merging later does not work for money. Two regions could each approve a spend against the same balance, and no merge rule can undo a payout.

        Users are placed in the region near them, which keeps most writes local and fast, and often satisfies rules that data must stay in a country.

        A cross-region transfer has two steps. Step 1, in the sender's region, moves the money from the sender to a transit account and records an outgoing message in the same transaction. Step 2, in the receiver's region, moves it from the mirror transit account to the receiver, using the transfer id as the idempotency key. If step 2 can never complete, a reversal returns the money.

        For durability, commit each write to a second region synchronously before confirming. This adds one cross-region round trip, perhaps 50 ms or more between continents, and it means losing a region loses no committed money. A distributed SQL database can do this for you, with the same latency cost.

        **Watch out for.** Multi-leader replication with last-write-wins on balances. It silently discards one side's update.
- id: design-stock-exchange
  q: Design the matching engine of a stock exchange. It accepts buy and sell orders, matches them fairly, and publishes trades and prices.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/cqrs-event-sourcing
    - /system-design/patterns/message-queues
    - /system-design/patterns/fan-out
    - /system-design/patterns/back-pressure
  a: |-
    **Short answer.** Put every incoming order into one numbered, durable sequence. A single-threaded engine per symbol reads that sequence and matches orders in memory. Everything else, including recovery and market data, is derived from the input sequence and the engine's output.

    **What to clarify.** Which order types: limit, market and cancel are enough to start. The fairness rule: best price first, and the earliest order first at the same price. The latency target, for example under 1 ms inside the exchange. Whether clearing and settlement (moving the money and shares after a trade) are in scope. Usually they are a separate system.

    **The numbers that drive the design.**

    - Input rate. Say 100,000 orders and cancels a second at peak across 5,000 symbols, with one busy symbol taking 10,000 a second.
    - Engine speed. Matching one order against an in-memory book takes a few microseconds. At 5 microseconds each, one thread handles 200,000 a second, so a single core is enough even for the busiest symbol.
    - Log size. At about 100 bytes a message and an average of 20,000 a second over a 23,400 second trading day, the input log grows by about 47 GB a day.

    **Core design.**

    1. Gateways hold the connections to member firms. They authenticate, check the message format, and apply risk limits such as maximum order size.
    2. A sequencer gives each accepted message the next sequence number and appends it to a log that is replicated to at least two other machines. An order counts as received once it is in the log.
    3. Symbols are divided among matching engines. Each engine is one thread that owns the order books of its symbols in memory. No locks are needed, because nothing else touches that memory.
    4. For each symbol the book has two sides. Buys are sorted from the highest price down and sells from the lowest price up. Each price level is a first-in, first-out queue.
    5. A new order matches against the opposite side while the prices cross. Any remainder rests in the book. The engine emits events: accepted, traded, cancelled, rejected.
    6. The output events go to a second log. Gateways send confirmations from it, a market data service publishes prices from it, and clearing reads trades from it.

    **The hardest part.** Being fast and never losing an order at the same time. Writing each order to a database before matching would cost milliseconds. The design avoids this by making the replicated input log the only durable write on the hot path. The engine's memory can always be rebuilt by replaying the log from the last snapshot.

    **Main trade-off.** A single thread per symbol gives a strict order and simple, testable logic, and it caps one symbol's throughput at one core. That limit is far above real demand, so the simplicity wins. Parallel matching inside one symbol would give up the fairness rule.

    **What a senior answer adds.** A hot standby engine that reads the same log and can take over within seconds. Circuit breakers that pause trading in a symbol when its price moves too far too fast. Opening and closing auctions as a separate matching mode. Equal treatment of members, so nobody sees market data before anyone else.

    **Watch out for.** A design where several application servers match orders against a shared database. It cannot give a strict order, and it is about a thousand times too slow.
  followUps:
    - q: What data structure would you use for the order book, and what does each operation cost?
      level: Mid
      topics: [/system-design/databases/skip-list, /system-design/databases/b-trees]
      a: |-
        **Short answer.** For each side of the book, keep a sorted map from price to a queue of orders, plus a hash map from order id to the order's position. Matching reads the best price, and cancels go through the hash map.

        **Why.** The engine needs four operations to be fast:

        | Operation | Structure used | Cost |
        |---|---|---|
        | Find the best price | First entry of the sorted map | Constant with a cached pointer |
        | Add an order at a price | Sorted map lookup, then append to that level's queue | Logarithmic in the number of price levels |
        | Match | Take from the front of the best level's queue | Constant per fill |
        | Cancel by order id | Hash map to the order, then unlink it | Constant if the queue is a doubly linked list |

        Cancels deserve attention, because on real markets most orders are cancelled before they trade. The hash map plus a linked list makes it a few pointer changes.

        The sorted map can be a balanced tree or a skip list. A book rarely has more than a few thousand active price levels, so the lookup is about 12 steps.

        **Watch out for.** One big list of orders sorted by price and time. Insertion is linear, and one busy symbol slows the whole engine.
    - q: How do you make matching deterministic, and why does that matter?
      level: Senior
      topics: [/system-design/patterns/cqrs-event-sourcing, /system-design/patterns/consistency-models]
      a: |-
        **Short answer.** Make the engine a pure function of its input log: the same messages in the same order always produce the same trades. Then recovery, standby engines and audits all work by replaying the log.

        **Why.** Determinism is what lets a standby machine reach exactly the same book as the primary without copying memory between them. Both read message 1 to message N and must end in identical states.

        To get it, remove every source of difference between two runs:

        - One ordered input. The sequencer decides the order once. Engines never read from two sources and merge by arrival time.
        - No wall clock inside the engine. Timestamps are stamped by the sequencer and travel in the message.
        - One thread per book, so thread scheduling cannot change the result.
        - No random numbers, and no iteration over containers whose order can vary between runs.
        - Integer prices and quantities, never floating point.
        - Configuration changes, such as a new tick size or a trading halt, enter through the same log as messages.

        Check it constantly. The primary and the standby each compute a hash of their state every few thousand messages and compare. A mismatch is treated as a serious incident.

        **Watch out for.** Calling an outside service from the matching loop. The reply time and content differ on replay.
    - q: How is market data sent to a very large number of subscribers without slowing the engine?
      level: Senior
      topics:
        [/system-design/patterns/fan-out, /system-design/fundamentals/websockets, /system-design/patterns/back-pressure]
      a: |-
        **Short answer.** The engine writes its events once to an output log and never waits for readers. A separate market data tier turns the events into feeds and fans them out through layers of relay servers, and each subscriber gets its own bounded buffer.

        **Why.** If the engine sent data to subscribers itself, one slow connection could delay matching. Decoupling through the log means the engine's cost is the same for zero subscribers or one million.

        The tier produces a few feed types from the same events: every book change for professional users, a snapshot of the top price levels a few times a second, and trades only.

        Fan-out goes in layers. A handful of publishers feed a few hundred relay servers, and each relay holds tens of thousands of client connections. One million subscribers at 50,000 per relay needs about 20 relays per feed, plus spares.

        Slow consumers are the main risk. For snapshot feeds, merge updates: if a client has not read the last price for a symbol, replace it with the newer one, since only the latest matters. For full feeds, every message carries a sequence number. A client that sees a gap asks for a fresh snapshot and continues from there. A client whose buffer stays full is disconnected.

        **Watch out for.** Unbounded buffers per subscriber. A few stuck clients during a busy hour can use all the memory of a relay.
    - q: Orders arrive faster than the matching engine can process them during a market shock. What gives?
      level: Senior
      topics: [/system-design/patterns/back-pressure, /system-design/patterns/rate-limiting]
      a: |-
        **Short answer.** Push back at the gateways, where load can be refused cheaply and fairly. Protect the matching path, let market data be thinned out, and as a last step halt trading in the affected symbol under published rules.

        **Why.** An exchange cannot silently drop an accepted order, and it cannot let the queue in front of the engine grow without limit. A long queue means members trade on prices that are seconds old, which is worse than a clear rejection.

        The responses, mildest first:

        1. Per-member rate limits at the gateway, such as 1,000 messages a second per session. A member that goes over gets explicit "throttled" rejections.
        2. A bounded queue between the sequencer and each engine. When it reaches a set depth, gateways slow down their reads from member connections, and the pressure travels back to the senders.
        3. Cancels are always accepted. In a shock, members most need to remove their orders, and refusing cancels traps them in risk.
        4. Market data is reduced first. Snapshot feeds drop to a lower rate, because data is easier to merge than orders.
        5. A symbol-level circuit breaker pauses matching for a few minutes when the price moves beyond a set band, and the symbol reopens with an auction.

        **Watch out for.** Autoscaling as the answer. One symbol's book lives on one thread, so extra machines do not make that symbol faster.
    - q: The primary matching engine crashes in the middle of the trading day. How do you fail over without losing or repeating a trade?
      level: Senior
      topics:
        [
          /system-design/patterns/leader-election,
          /system-design/patterns/cqrs-event-sourcing,
          /system-design/patterns/idempotency,
        ]
      a: |-
        **Short answer.** A standby engine has been applying the same input log all day. On failure it is promoted, finishes any messages the primary had not handled, and carries on. The log, with its sequence numbers, decides what happened.

        **Why.** No order is lost, because an order is acknowledged only after it sits in the replicated input log. The primary's memory is gone, but the standby holds the same book, built from the same messages.

        The delicate part is output. Suppose the primary crashed after processing input 5,000,010, and its last published output came from input 5,000,007. The standby processes up to 5,000,010 and produces the same events, since the engine is deterministic. Each output event carries the input sequence number that caused it, so the output log and all downstream readers discard any event they already have. Trades are neither missing nor doubled.

        Two engines must never act as primary at once. A leader election service with fencing gives each new primary a higher epoch number, and the output log refuses writes that carry an old epoch. A primary that was only slow, and is still running, is therefore harmless.

        **Watch out for.** Promoting on a single missed heartbeat. A short pause would cause needless failovers, so require several missed beats.
- id: design-hotel-booking
  q: Design a booking system for stays, like a hotel or home rental site. Guests search by place and dates, then reserve and pay, and the same dates are never booked twice.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/case-studies/hotel-booking
    - /system-design/patterns/idempotency
    - /system-design/patterns/saga
    - /system-design/databases/relational-databases
  companies: [Airbnb]
  a: |-
    **Short answer.** Split the system in two. Search is a fast, slightly stale read path. Booking is a small, strict write path where one database transaction claims every night of the stay, or none of them.

    **What to clarify.** Homes (one unit per listing) or hotels (many identical rooms of one type). Whether a booking is confirmed at once or the host must approve. Whether payment is taken at booking time. Whether cancellation and date changes are in scope.

    **The numbers that drive the design.**

    - Calendar size. 7 million listings with one row per night for a year ahead is about 2.5 billion rows. At 50 bytes each that is about 130 GB, which is fine for a sharded relational database.
    - Bookings. 1.5 million bookings a day is about 17 a second. The write path is tiny.
    - Searches. If there are 1,000 searches for each booking, that is 17,000 searches a second, each filtering by location, dates, price and guest count. Search needs its own index and its own scaling.

    **Core design.**

    1. The calendar table has one row per listing per night, with a state (`free`, `held`, `booked`), a price and the booking id. It is sharded by listing id, so every night of one listing sits on the same shard.
    2. A search index holds listings with their location, attributes and free date ranges. It is updated from the calendar's change stream and may lag by a few seconds.
    3. Opening a listing page reads the calendar itself, so the guest sees current availability before deciding.
    4. To book, the client sends the listing, the dates and an idempotency key (a unique id that marks retries as the same request). In one transaction, the booking service updates the calendar rows for those nights from `free` to `held`, but only rows that are still free. If the number of rows changed is lower than the number of nights, it rolls back and answers "no longer available".
    5. The same transaction inserts a booking in state `pending payment` with an expiry about 10 minutes away.
    6. The payment service authorizes the card. On success the nights become `booked` and the booking becomes `confirmed`. On failure or expiry the nights go back to `free`.
    7. An event tells the host, sends the guest an email and updates the search index.

    **The hardest part.** Two guests who want overlapping dates at the same moment. The answer is to make the database the judge: the conditional update on the night rows lets exactly one transaction claim each night. No lock service and no check in application code is needed for a single listing.

    **Main trade-off.** Holding the nights before payment protects the guest who is typing card details, and blocks those dates for up to 10 minutes if they walk away. Taking payment first and claiming the nights afterwards never blocks dates, but it sometimes charges a guest for a stay they cannot have. Hold first.

    **What a senior answer adds.** Time zones: a night belongs to the listing's local date. Syncing with calendars on other booking sites, which can still create conflicts. Search ranking that hides listings with a hold in progress. A daily check that every booked night has a confirmed booking.

    **Watch out for.** Using the search index to decide whether dates are free. It is a few seconds old, and that is long enough for a double booking.
  followUps:
    - q: A search result shows a home as available, but when the guest tries to book it, it is gone. Is that a bug?
      level: Junior
      topics: [/system-design/patterns/consistency-models, /system-design/databases/search-engines]
      a: |-
        **Short answer.** No. Search results are allowed to be a few seconds old. The booking step checks the real calendar, so the guest gets a clear "no longer available" and never a double booking.

        **Why.** Search and booking have opposite needs. Search must answer 17,000 complex queries a second in well under a second, so it uses a separate index built for filtering and ranking. That index is updated after the booking database changes, usually within a few seconds. In the gap, a listing that was just booked can still appear.

        Making search exactly current would mean every search asks the booking database about every candidate listing. That would be far slower and would put the read load on the system that must stay healthy for bookings.

        The design accepts a small, visible cost: now and then a guest clicks a listing and finds the dates taken. Two things keep it rare and gentle. The listing page reads the live calendar, so most stale results are caught before checkout. And the index update is fast, so the window is short.

        The rule to remember is that a stale read may disappoint a user, but it must never be used to make the final decision.

        **Watch out for.** Fixing this by caching search results for minutes to save cost. The stale window grows, and failed clicks become common in busy markets.
    - q: Two guests press Book for overlapping dates on the same home in the same millisecond. Walk through exactly what happens.
      level: Mid
      topics: [/system-design/databases/relational-databases, /system-design/patterns/consistency-models]
      companies: [Airbnb]
      a: |-
        **Short answer.** Both transactions try to change the same calendar rows. The database lets one go first. The second waits, then finds that the rows are no longer free, changes fewer rows than it needs, and rolls back.

        **Why.** Say guest A wants 10 to 13 June (three nights) and guest B wants 12 to 15 June (three nights). They share the night of 12 June.

        1. A's transaction runs: set state to `held` for this listing where the night is 10, 11 or 12 June and the state is `free`. The database locks those three rows.
        2. B's transaction runs the same statement for 12, 13 and 14 June. It can lock 13 and 14 but must wait for the row of 12 June.
        3. A checks that 3 rows changed, inserts its booking and commits. The locks are released.
        4. B's statement continues. It sees the row for 12 June again, now `held`, so the condition fails for that row. B changed 2 rows, not 3.
        5. B's service sees 2 is less than 3, rolls back, which frees 13 and 14 June, and tells guest B the dates are taken.

        The count check in step 5 is the essential part. Without it, B would keep two nights of a three-night stay.

        **Watch out for.** A separate "is it free" query before the update. Both guests pass it, and the update is then the only real check anyway.
    - q: What consistency model do you use across the booking step and the payment step, since they are separate services?
      level: Senior
      topics:
        [/system-design/patterns/saga, /system-design/patterns/consistency-models, /system-design/patterns/idempotency]
      companies: [Airbnb]
      a: |-
        **Short answer.** Strong consistency inside the booking database, and a saga across booking and payment. The hold with an expiry is the step that makes the two-service flow safe.

        **Why.** A single transaction cannot cover our database and an outside payment provider. So the flow is a chain of local steps, each with an undo:

        | Step | Where | Undo |
        |---|---|---|
        | Hold the nights, create a pending booking | Booking database, one transaction | Release the nights |
        | Authorize the card | Payment provider | Void the authorization |
        | Confirm the booking, mark the nights booked | Booking database, one transaction | Cancel and refund |

        Between steps the system is in a visible middle state, `pending payment`, and not in an inconsistent one. No other guest can take the nights, and no money has been captured.

        Each failure has a defined path. If payment is declined, the nights are released. If the service crashes after the authorization, a recovery job finds pending bookings with a successful authorization and confirms them, using the booking id as the idempotency key on both sides. If the hold expires first, the authorization is voided.

        **Watch out for.** Capturing the money before the nights are held. If the hold then fails, every such case needs a refund and a support conversation.
    - q: Popular listings sell out for peak dates. How would you add a waitlist that offers the dates to the next guest when a booking is cancelled?
      level: Senior
      topics:
        [
          /system-design/patterns/message-queues,
          /system-design/fundamentals/push-notifications,
          /system-design/patterns/idempotency,
        ]
      a: |-
        **Short answer.** Store waitlist entries per listing with their date range and join time. When nights are freed, find the earliest entry whose dates now fit, give that guest a short exclusive hold, and notify them. If they do not book in time, move to the next entry.

        **Why.** The simple alternative is to notify everyone on the list at once and let the fastest win. It is easy to build, but it is unfair to people who are asleep, and it sends a burst of traffic to one listing where all but one guest fail.

        The offer-based flow works like this. A cancellation publishes a "nights freed" event. A waitlist worker loads the entries for that listing in join order and checks each one against the live calendar, because a freed night helps only if the entry's whole date range is now free. For the first match, it places a normal hold on the nights under the waitlist entry's id, with an expiry such as 30 minutes, and sends a push and an email.

        A timer event fires at expiry. If the offer was not used, the hold is released and the worker offers to the next match. Offers are keyed by entry id and cancellation event id, so a replayed event does not create a second offer.

        **Watch out for.** Checking the waitlist only on cancellations. Nights also free up when holds expire and when hosts open new dates.
    - q: "Add an API that returns split stays: for a date range with no single listing free for all nights, return pairs of listings that cover it between them. How would you design it?"
      level: Senior
      topics:
        [
          /system-design/case-studies/hotel-booking,
          /system-design/databases/search-engines,
          /system-design/patterns/caching,
        ]
      a: |-
        **Short answer.** Choose a small set of split points in the date range. For each one, search for listings free for the first part and listings free for the second part, then pair results that are close to each other and rank the pairs.

        **Why.** The naive approach compares every listing with every other. In a city with 20,000 listings that is 200 million pairs for each search, far too slow.

        Limit the work in three ways:

        - Few splits. A 10-night stay has 9 possible split points, but guests do not want a 1-night part. Requiring at least 2 or 3 nights per part and trying the splits near the middle first leaves about 3 to 5 options.
        - Reuse the existing search. Each half is a normal availability query on the search index: this area, these dates, this guest count. Take the top 50 results per half, not all of them.
        - Pair by distance. Combine only listings within a few kilometres of each other, so the guest does not cross the city with luggage. That leaves at most 2,500 candidate pairs per split, which is trivial to score.

        Booking a split stay is two bookings. Hold both sets of nights first, pay once, then confirm both, and release the first hold if the second one fails.

        **Watch out for.** Promising availability from this API. Like any search, it is slightly stale, and the holds at booking time are what count.
- id: design-fraud-detection
  q: Design a fraud detection system that scores every card payment before it is approved.
  level: Senior
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/message-queues
    - /system-design/patterns/rate-limiting
    - /system-design/patterns/caching
    - /system-design/fundamentals/security
  companies: [Stripe]
  a: |-
    **Short answer.** A risk service sits inside the payment path. It reads precomputed facts about the card, device and merchant from a fast store, runs rules and a model, and answers allow, block or challenge in well under 100 ms. A stream pipeline keeps those facts fresh after every payment.

    **What to clarify.** Whether the decision must happen before the payment is approved or may happen after. Which outcomes exist: allow, block, ask the buyer for an extra check, send to a human reviewer. How much of the payment latency budget fraud may use. Who pays for fraud, the platform or the merchant, because that sets how strict to be.

    **The numbers that drive the design.**

    - Rate. 1 billion payments a day is about 11,600 a second on average. Plan for 3 times that at peak, about 35,000 a second.
    - Latency. A card payment should finish in a second or two, and most of that goes to the card network. Give the fraud check 100 ms at the 99th percentile.
    - Errors in both directions. If 0.1 percent of payments are fraud, that is 1 million bad payments a day. Wrongly blocking 1 percent of good payments would turn away 10 million honest buyers a day, which costs more than the fraud.

    **Core design.**

    1. The payment service calls the risk service with the payment details: amount, merchant, a token for the card, device fingerprint, IP address.
    2. The risk service reads **features** (precomputed facts used for scoring) from an in-memory key-value store. Examples: payments on this card in the last 10 minutes, number of cards seen on this device today, the merchant's usual order size.
    3. It runs hard rules first (blocked card lists, country limits), then a machine-learning model that returns a score from 0 to 1. A per-merchant threshold maps the score to allow, block or challenge.
    4. It returns the decision and writes the decision, score and feature values to an event log. The write is asynchronous so it does not slow the payment.
    5. A stream processor reads the log and updates the counters in the feature store within a second or two.
    6. The same log lands in a data warehouse. Confirmed fraud reports and chargebacks (a buyer disputing a charge with their bank) are joined to past decisions to make training labels. Models are retrained and released behind a small traffic share first.
    7. Borderline cases go to a review queue for human analysts.

    **The hardest part.** Keeping features fresh inside the latency budget. A thief testing stolen cards sends hundreds of payments in a minute, so a counter that updates hourly is useless. The counters must reflect a payment made two seconds ago, and the read must still take a few milliseconds.

    **Main trade-off.** Blocked fraud against blocked customers. A lower threshold stops more fraud and rejects more honest buyers. With the challenge outcome, a doubtful payment gets an extra bank verification step, which costs some conversions but far fewer than a block.

    **What a senior answer adds.** A stated policy for when the risk service is slow or down. Logging the exact feature values used at decision time, so training sees the same data as serving did. Shadow mode for new models, where the model scores live traffic but its answer is ignored. A graph of shared devices, addresses and cards to catch rings of accounts.

    **Watch out for.** Computing features with queries against the payments database during the request. At 35,000 payments a second those queries will miss the budget and load the database that takes the money.
  followUps:
    - q: How do you handle card numbers and other sensitive data inside the fraud system?
      level: Senior
      topics: [/system-design/fundamentals/encryption-and-hashing, /system-design/fundamentals/security]
      companies: [Stripe]
      a: |-
        **Short answer.** The fraud system never stores the real card number. It works with a token, and it keeps personal data to the minimum the model needs, encrypted and with a fixed retention period.

        **Why.** A card number is replaced by a **token** (a random id that means nothing outside the company) in a small, locked-down vault service. Everything downstream, including the feature store, the event log and the warehouse, sees only the token. Counters such as "payments on this card in the last hour" work just as well with a token as the key.

        Other identifiers get similar care. Email and IP address can be stored as a keyed hash (a hash mixed with a secret key), so two payments from the same email still match but an analyst cannot read the address. Training data should use these hashed forms. Access to raw values is limited to the review tool, with every lookup logged.

        The trade-off is investigation speed. Analysts sometimes need the real email or address to judge a case, so the review tool reveals fields one at a time, with a reason recorded.

        **Watch out for.** Sensitive values leaking into debug logs and feature snapshots. One log line with a full card number puts the whole logging system inside the card-data audit scope.
    - q: How does the scoring path stay under 100 ms at 35,000 payments a second?
      level: Senior
      topics: [/system-design/patterns/caching, /system-design/patterns/sharding]
      companies: [Stripe]
      a: |-
        **Short answer.** Do all the heavy work before the request arrives. The request path is one batched read from memory plus one model call, and both scale by adding machines.

        **Why.** A budget of 100 ms splits roughly like this:

        | Step | Budget |
        |---|---|
        | Network and request parsing | 10 ms |
        | Feature read (one batched lookup) | 10 ms |
        | Rules and model | 30 ms |
        | Spare for slow cases | 50 ms |

        The feature store is partitioned by key (card token, device id, merchant id), so each lookup goes to one shard and the fleet grows with traffic. The risk service asks for all keys in one parallel batch. The model runs in the same process or on a nearby machine, and is kept small enough to score in a few milliseconds on a CPU. Risk servers hold no state, so 35,000 requests a second at 500 per server is 70 servers plus spare.

        Slow or heavy signals, such as a graph search across linked accounts, are computed in the background and stored as a feature for the next payment.

        **Watch out for.** Averages. One slow shard in a batched read sets the latency for the whole request, so give each lookup a short timeout and score with a default value when it fires.
    - q: The fraud service times out. Does the payment go through?
      level: Mid
      topics: [/system-design/patterns/circuit-breaker-and-retries, /system-design/fundamentals/availability]
      a: |-
        **Short answer.** Usually yes, with limits. The payment service falls back to a small set of local rules and lets low-risk payments through, and holds or challenges the high-risk ones.

        **Why.** There are two simple policies. **Fail open** approves when the check is missing, so payments keep flowing but fraud passes during the outage. **Fail closed** rejects, so no fraud passes but every merchant stops selling. For most merchants an hour of blocked sales costs far more than an hour of slightly higher fraud.

        A middle path works better. The payment service keeps a short timeout, for example 150 ms, and a **circuit breaker** (a switch that stops calling a failing service for a while). When the breaker is open, a local fallback applies cheap rules: approve small amounts from cards seen before, send large amounts or new cards to a challenge. Every payment approved this way is marked and scored again once the service recovers, so refunds or reviews can follow.

        **Watch out for.** Attackers who notice the outage. Fraud attempts rise when checks are weak, so the fallback needs its own amount limits and alerting.
    - q: How would you compute "payments on this card in the last 10 minutes" for every payment?
      level: Mid
      topics: [/system-design/patterns/rate-limiting, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** Keep small time-bucketed counters per card in an in-memory store, updated by a stream processor, and sum the recent buckets on read.

        **Why.** This is the same problem as a sliding-window rate limiter. For each card token, store one counter per minute with an expiry a little longer than the longest window. A stream processor reads each payment event from the log and increments the current minute's bucket. To answer "last 10 minutes", the risk service reads the last 10 buckets and adds them. That is one small read, and old buckets delete themselves.

        Buckets trade accuracy for memory. One-minute buckets make a 10-minute window wrong by up to one minute at the edge, which is fine for fraud. Longer windows use larger buckets: hourly buckets for a 7-day count.

        The stream path adds a delay of a second or two. For the fastest attacks, the risk service can also increment the counter itself during the request, so the next payment sees it at once.

        **Watch out for.** Counting retries twice. The processor should remember recent payment ids and skip one it has already counted, or a network retry makes an honest buyer look like an attacker.
    - q: Would you use hand-written rules or a machine-learning model to make the decision?
      level: Junior
      a: |-
        **Short answer.** Both. Rules handle the clear cases and urgent fixes. The model handles the large grey area between them.

        **Why.** Each one is good at a different job.

        | | Rules | Model |
        |---|---|---|
        | Example | Block cards on the stolen list | Score from 200 features |
        | Time to change | Minutes | Days, needs retraining |
        | Easy to explain | Yes | Harder |
        | Finds new patterns | No | Yes, if they appear in the data |

        When a new attack starts at 2 a.m., an analyst can add a rule in minutes, long before a model can be retrained. Rules are also needed for legal limits, which must be applied exactly. A model weighs many weak signals together, which catches fraud that no single rule describes, and it produces fewer wrong blocks than a long list of strict rules.

        The usual order is rules first, then the model, then a threshold. Rules that stay useful become features for the next model.

        **Watch out for.** Rule lists that only grow. Hundreds of old rules interact in ways nobody can predict, so each rule needs an owner, a hit count and an expiry date.
    - q: Fraud is often confirmed weeks after the payment. How do you know a new model is better before then?
      level: Senior
      topics: [/system-design/databases/analytical-databases]
      a: |-
        **Short answer.** Test it on old payments whose outcome is already known, then run it silently on live traffic, then release it to a small share of payments while watching fast signals.

        **Why.** A chargeback can arrive one to three months after the payment, so the true fraud rate of this week's traffic is unknown this week. Three steps reduce the wait.

        1. **Replay.** Score payments from three months ago using the feature values logged at that time. The labels for those payments are mostly complete, so precision and recall can be measured.
        2. **Shadow mode.** The new model scores live payments but the old model still decides. Inspect a sample of the cases where they disagree.
        3. **Small rollout.** Give the new model 1 percent of traffic. Watch signals that arrive quickly: block rate, challenge pass rate, early fraud reports from banks, merchant complaints.

        There is a bias to manage. Blocked payments never produce a label, so the system only learns from payments it allowed. Letting a tiny random share of would-be blocks through, with a low amount cap, gives honest labels at a known cost.

        **Watch out for.** Training on features computed today for payments from the past. The model would see information that did not exist at decision time and look better than it is.
- id: design-auction
  q: Design an online auction where many people bid on an item in real time and the highest bid at closing time wins.
  level: Mid
  category: system-design-questions
  subcategory: payments-commerce
  topics:
    - /system-design/patterns/consistency-models
    - /system-design/fundamentals/choosing-realtime
    - /system-design/databases/relational-databases
    - /system-design/fundamentals/websockets
  companies: [Meta]
  a: |-
    **Short answer.** One strongly consistent record per auction decides every bid with a conditional write. Accepted bids are then published to a stream, and real-time gateways push the new price to everyone watching.

    **What to clarify.** The auction type: open ascending bids with a fixed end time is the usual one. Whether bids are binding or can be withdrawn. Whether a late bid extends the auction. How many people watch one auction. Whether payment is in scope, or only finding the winner.

    **The numbers that drive the design.**

    - Average load is small. 10 million auctions a week with 20 bids each is 200 million bids in 604,800 seconds, about 330 bids a second.
    - Load is very uneven. Most bids on an auction arrive in its last minute. A popular item can take 1,000 bids a second for a few seconds while millions of other auctions are silent.
    - Reads dominate. One accepted bid on an auction with 100,000 watchers means 100,000 pushes. Bids are cheap. Telling the audience is the expensive part.

    **Core design.**

    1. An auction row holds the item, start and end time, minimum increment, status, current highest bid and bidder, and a version number.
    2. To bid, the client sends the auction id, an amount and a unique request id. The bid service checks the user and their payment method.
    3. The service makes one conditional update: set the new highest bid only if the auction is open, the server time is before the end time, and the amount is at least the current bid plus the increment. In the same transaction it appends a row to a bids table.
    4. If the update changed nothing, the bid lost a race or was too low. The service returns the current price so the user can bid again.
    5. After commit, the service publishes a "new high bid" event to a stream. Real-time gateways subscribed to that auction push the price to watchers over WebSocket or server-sent events.
    6. At the end time a closing job marks the auction closed with the same conditional style, records the winner, and starts payment as a separate step.

    **The hardest part.** Two bids arriving at the same millisecond, and bids arriving at the closing second. Both are solved by making one database row the single judge. The conditional write lets exactly one of two equal bids win, and the end-time check happens inside the same write using the server's clock.

    **Main trade-off.** Strong consistency for writes, eventual consistency for viewers. A bid is accepted or rejected against the true state. The price on a watcher's screen may be half a second old, so a bid that looked high enough can be rejected. That is acceptable as long as the rejection is fast and shows the new price.

    **What a senior answer adds.** Idempotent bids, so a retry with the same request id is not a second bid. A rule for last-second bids, such as extending the end by two minutes. Partitioning auctions by id so one hot auction cannot slow the rest. A hold on the bidder's payment method before a bid counts.

    **Watch out for.** Reading the current price, comparing in application code, and then writing. Two servers doing that at once will both think they won.
  followUps:
    - q: How do you track the winning bid if a cache is not allowed to be the source of truth?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/patterns/consistency-models]
      a: |-
        **Short answer.** The database row for the auction is the only place a bid is decided. A cache holds a copy of the current price for display, and it is updated after the database commits.

        **Why.** The accept-or-reject decision is a conditional update such as `UPDATE auctions SET high_bid = 120, version = 8 WHERE id = 7 AND version = 7 AND status = 'open'`. The database applies it atomically, so two bids against version 7 cannot both succeed. One updates the row, the other changes zero rows and is rejected.

        The cache serves the read traffic: the item page, the list of live auctions, the first price a watcher sees. After each commit, the bid service writes the new price and version to the cache, and only replaces a cached value with a higher version. If the cache is lost, it is rebuilt from the database and no bid is affected.

        A cache can also reject hopeless bids early. A bid of 50 when the cached price is 120 can be refused without touching the database, because prices only go up. A bid that looks high enough must still go to the database.

        **Watch out for.** Accepting a bid in an in-memory store and writing to the database later. A crash between the two loses a bid the user was told had won.
    - q: Walk me through the database schema for auctions and bids.
      level: Mid
      topics: [/system-design/databases/relational-databases, /system-design/patterns/sharding]
      a: |-
        **Short answer.** Two main tables. `auctions` has one row per auction with the current state. `bids` is an append-only history with one row per accepted bid.

        **Why.** A relational database fits because the bid decision needs a transaction across both tables.

        | Table | Key columns |
        |---|---|
        | `auctions` | id, seller_id, item_id, start_time, end_time, min_increment, status, high_bid, high_bidder_id, version |
        | `bids` | id, auction_id, bidder_id, amount, request_id, created_at |

        Indexes: `bids` on (auction_id, amount descending) for the bid history, and a unique index on (bidder_id, request_id) so a retried request cannot insert twice. `auctions` needs an index on (status, end_time) so the closing job can find auctions that are due.

        Keeping `high_bid` on the auction row repeats data that could be computed from `bids`. It is worth it: the hot path locks and reads one small row and never scans the history.

        When one database is too small, split both tables by auction id so an auction and its bids stay on the same shard and the transaction stays local.

        **Watch out for.** Storing money as a floating-point number. Use an integer count of the smallest currency unit, plus a currency code.
    - q: A bidder wants to change a bid they already placed. How do you support that?
      level: Mid
      topics: [/system-design/patterns/cqrs-event-sourcing, /system-design/patterns/idempotency]
      a: |-
        **Short answer.** Never edit a bid row. Raising a bid is a new bid. Withdrawing a bid, if the product allows it at all, is a new "retraction" record that goes through the same conditional write as a bid.

        **Why.** The bid history is evidence. Sellers, losing bidders and support staff must be able to see who offered what and when, so rows are only ever added.

        Raising is simple. The bidder submits a higher amount and it follows the normal path. If they are already the leader, the system can treat it as raising their own maximum.

        Lowering or cancelling is a product decision first. Many auction sites refuse it, or allow it only in the first hour or for a clear typing mistake, because other people bid in response to that price. When it is allowed, the retraction is appended, and inside the same transaction the auction row's highest bid is recomputed from the remaining valid bids. The version number goes up, so any bid racing with the retraction is rechecked against the new state.

        **Watch out for.** Retractions near closing time. A bidder could push the price up to scare others away, then withdraw in the last second. Block retractions in the final part of the auction.
    - q: How would you show watchers a near real-time list of the top bids?
      level: Mid
      topics:
        [
          /system-design/fundamentals/server-sent-events,
          /system-design/patterns/fan-out,
          /system-design/fundamentals/choosing-realtime,
        ]
      a: |-
        **Short answer.** Push it. Each accepted bid is published once to a topic for that auction, gateway servers subscribed to the topic forward it to their connected watchers, and a new watcher first loads the current top bids from a cache.

        **Why.** Watchers only receive data, so server-sent events (one long HTTP response that the server keeps writing to) are enough. Bids go up through the normal API. WebSockets also work and are a fair choice if the page has chat too.

        A gateway server holds tens of thousands of connections and subscribes only to auctions its users are viewing. One bid on an auction with 100,000 watchers is published once, reaches perhaps 10 gateways, and each writes to its own sockets.

        In the last seconds of a hot auction there can be hundreds of accepted bids a second. Screens cannot show that. The gateway sends at most a few updates a second for each auction, each carrying the latest top five and a version number. Clients ignore any update with an older version than the one they hold.

        **Watch out for.** Polling the database from every watcher. 100,000 watchers polling once a second is 100,000 queries a second on the same row that bids need to lock.
    - q: Many bids arrive in the final second. How do you close the auction fairly?
      level: Senior
      topics: [/system-design/patterns/consistency-models, /system-design/patterns/idempotency]
      a: |-
        **Short answer.** The server clock and the commit order decide, never the client. A bid counts if its conditional write commits while the auction row is still open, and closing is itself a conditional write on that row.

        **Why.** Phone clocks are wrong and networks add delay, so "I clicked before the end" cannot be checked. The bid write includes the condition that the database time is before `end_time` and the status is open. The closing job runs a similar write: set status to closed where the status is open and the end time has passed. The row lock puts these in one order. A bid that commits before the close counts. One that arrives after changes zero rows and is rejected.

        Last-second bidding is a product choice. A common answer is a soft close: any bid in the final two minutes moves the end time out by two minutes, within the same transaction. This also flattens the traffic spike, because waiting for the last second gains nothing.

        **Watch out for.** Closing from a timer in application memory. If that server restarts, the auction never closes. Find due auctions by querying for open ones past their end time.
    - q: One auction becomes very popular and gets thousands of bids a second. What changes?
      level: Senior
      topics:
        [
          /system-design/patterns/message-queues,
          /system-design/patterns/back-pressure,
          /system-design/patterns/sharding,
        ]
      a: |-
        **Short answer.** Protect the one hot row. Reject hopeless bids before they reach the database, and send the rest for that auction through a single ordered queue with one consumer.

        **Why.** Every bid on an auction updates the same row, so adding database machines does not help. A single row can take perhaps a few hundred to a thousand short transactions a second before lock waits pile up.

        Two steps reduce the load.

        1. **Filter early.** The bid service compares the amount with the cached price. Prices only rise, so anything at or below it is rejected at once. In a rush this removes most bids.
        2. **Serialise the rest.** Bids for the hot auction go to a queue partition chosen by auction id. One consumer reads them in order and applies them in small batches. Only the highest valid bid in a batch needs to update the price, and the others are recorded as outbid. The bidder receives the result over their real-time connection a fraction of a second later.

        The cost is an asynchronous answer for hot auctions, which the client must handle.

        **Watch out for.** Letting the hot auction share database connections with everything else. Give it a bounded pool so millions of quiet auctions keep working.
- id: design-web-crawler
  q: Design a web crawler that starts from a set of seed URLs, downloads about 10 billion pages and revisits them every month.
  level: Senior
  category: system-design-questions
  subcategory: search-discovery
  topics:
    - /system-design/case-studies/web-crawler
    - /system-design/patterns/bloom-filter
    - /system-design/patterns/message-queues
    - /system-design/databases/object-storage
  companies: [Atlassian, Dropbox, Lyft]
  a: |-
    **Short answer.** A crawler is a loop: take a URL from a queue, download the page, store it, extract its links, and add the new ones to the queue. The design work is in the queue, called the **URL frontier**, which must be polite to each website, avoid repeats and survive machine failures.

    **What to clarify.** What the pages are for: a search index, model training, or finding one kind of content such as images. HTML only or also files and pages that need JavaScript to render. How fresh the copy must be. How many pages and how many machines.

    **The numbers that drive the design.**

    - Rate. 10 billion pages every 30 days is 10 billion divided by 2.6 million seconds, about 3,900 pages a second.
    - Bandwidth and storage. At 100 KB of HTML a page, that is about 390 MB a second, roughly 3 gigabits a second, and 1 petabyte for one full copy before compression.
    - Duplicate check. 10 billion URLs at an 8-byte hash each is 80 GB. A Bloom filter at 10 bits a URL needs 12.5 GB with about 1 percent false positives.

    With 1,000 machines each one fetches only 4 pages a second. Raw speed is easy. The limit is how fast each website may be visited.

    **Core design.**

    1. **Frontier.** Seed URLs go in first. The frontier keeps one queue per host and a schedule of when each host may be contacted next.
    2. **Fetchers** take a URL whose host is ready, resolve the name through a local DNS cache, check the cached `robots.txt` rules for that site, and download the page with a timeout and a size limit.
    3. The raw page goes to object storage. A metadata row records the URL, fetch time, status code and a hash of the content.
    4. **Parsers** read the stored page and extract links. They are a separate stage behind a queue, so slow parsing never blocks fetching.
    5. Each link is normalised (lower-case host, fragment removed, relative paths resolved) and checked against the set of URLs already seen. New ones enter the frontier.
    6. A scheduler puts known URLs back into the frontier when they are due for a revisit.

    **The hardest part.** The frontier. It must hold billions of URLs, mostly on disk, and still hand out work at 3,900 a second while obeying a different delay for each of millions of hosts. A plain first-in-first-out queue fails at once, because one page with 500 links to the same site would send 500 requests to that site in a second.

    **Main trade-off.** Freshness against coverage and politeness. The page budget is fixed, so every revisit of a known page is a new page not fetched. Spend it by value: revisit a news front page every few minutes and a ten-year-old forum thread once a quarter.

    **What a senior answer adds.** Assigning hosts to machines with consistent hashing, so each site's politeness state lives in one place. Detecting duplicate content, since many URLs return the same page. Defences against crawler traps. Checkpointing the frontier so a crash loses minutes of work.

    **Watch out for.** Treating it as a pure throughput problem. A crawler that ignores per-site limits gets blocked, and then no amount of machines helps.
  followUps:
    - q: How do you make sure the crawler never overloads a single website?
      level: Mid
      topics: [/system-design/case-studies/web-crawler, /system-design/patterns/rate-limiting]
      a: |-
        **Short answer.** Group URLs by host, allow one request at a time per host, and wait a set delay between requests to the same host. Follow the site's `robots.txt` file.

        **Why.** The frontier has two layers. The front layer orders URLs by priority. The back layer has one queue per host, plus a small heap of hosts ordered by "next allowed time". A fetcher pops the host that is ready soonest, takes one URL from that host's queue, fetches it, and puts the host back with a new time, for example now plus one second, or now plus ten times the last response time. A slow site is then visited less often without any manual tuning.

        `robots.txt` is a file at the root of a site that lists paths crawlers should not fetch, and some sites state a crawl delay in it. Fetch it once per host, cache it for a day, and check every URL against it before fetching.

        Error responses need care too. A 429 or 503 status means "slow down", so double the delay for that host each time and reduce it slowly afterwards.

        **Watch out for.** Limiting by host name only. Thousands of small sites can share one server address, so add a second limit per IP address.
    - q: How do you avoid crawling the same page twice?
      level: Mid
      topics: [/system-design/patterns/bloom-filter, /system-design/databases/key-value-stores]
      a: |-
        **Short answer.** Two checks. Before fetching, test the normalised URL against a "seen" set. After fetching, compare a hash of the content with hashes of pages already stored.

        **Why.** The same page hides behind many URLs: with or without `www`, with tracking parameters, with a session id. Normalising removes the cheap differences. The seen set then answers "have we queued this URL before".

        | Option | Memory for 10 billion URLs | Wrong answers |
        |---|---|---|
        | Exact set of 8-byte hashes | 80 GB | Almost none |
        | Bloom filter, 10 bits each | 12.5 GB | About 1 percent "seen" when it is new |

        A Bloom filter never says "new" for a URL it has seen, so it never causes a repeat fetch. Its error goes the other way: about 1 in 100 new URLs is skipped. For a broad crawl that is acceptable. For a crawl that must be complete, put the filter in front of an exact on-disk store and confirm every "seen" answer there.

        Content hashes catch mirrors and copies. If the hash matches a stored page, keep one copy and do not follow the links again. A similarity hash can catch pages that differ only in an advert or a date.

        **Watch out for.** The revisit cycle. "Seen" must mean "already scheduled", or the monthly recrawl would be filtered out.
    - q: The crawl runs on 1,000 machines. One of them is reliable and the others can fail at any time. How do you coordinate the work?
      level: Senior
      topics: [/system-design/patterns/leader-election, /system-design/patterns/consistent-hashing]
      companies: [Lyft]
      a: |-
        **Short answer.** Make the reliable machine the coordinator. It decides which worker owns which group of hosts and watches heartbeats. It does not sit in the path of every URL.

        **Why.** Hosts are split into, say, 10,000 buckets by a hash of the host name. The coordinator keeps a small table from bucket to worker and gives each worker a lease on its buckets that must be renewed every few seconds. A worker crawls only hosts in its own buckets, so the politeness state for a site lives on one machine. Links to other hosts are sent to the owning worker in batches.

        When a worker misses several heartbeats, the coordinator gives its buckets to others. Each worker writes its frontier and progress to shared storage every minute, so the new owner resumes from the last checkpoint. A few pages are fetched twice, which is harmless because storing a page is idempotent.

        Because the coordinator is reliable, no election is needed. Without that guarantee, the assignment table would live in a consensus store and a few machines would elect a leader.

        **Watch out for.** Routing every URL through the coordinator. At 3,900 pages a second with dozens of links each, it would become the bottleneck and the single point of slowdown.
    - q: The same idea is used to walk a huge file system from a root folder as a job a user starts. What API and data model would you give it?
      level: Mid
      topics:
        [
          /system-design/fundamentals/api-design,
          /system-design/patterns/idempotency,
          /system-design/patterns/message-queues,
        ]
      companies: [Dropbox]
      a: |-
        **Short answer.** Starting a crawl creates a **job** and returns its id at once. The work is split into **tasks**, one per folder. A worker that lists a folder records the files it finds and creates a child task for each subfolder.

        **Why.** A crawl of a billion files takes hours, so the API must be asynchronous: `POST /crawls` with the root path returns a job id, `GET /crawls/id` returns status and counters, and a paged endpoint returns results.

        | Table | Main fields |
        |---|---|
        | jobs | id, root_path, status, tasks_created, tasks_done, files_found |
        | tasks | id, job_id, path, status, attempt, lease_expires_at |
        | files | job_id, path, size, modified_at |

        A worker claims a task with a lease, lists the folder, writes file rows, inserts child tasks, then marks its own task done. If it crashes, the lease expires and another worker repeats the task. A unique key on (job_id, path) in both tasks and files makes the repeat harmless. The job is finished when tasks done equals tasks created and no task is in progress.

        A folder with 10 million entries must be listed in pages, with the page position saved in the task.

        **Watch out for.** Recursing inside one worker. A deep tree then belongs to one machine and is lost when it fails.
    - q: A user submits up to 100 URLs and wants every image on those pages. How would you design the service behind that API?
      level: Mid
      topics:
        [
          /system-design/fundamentals/api-design,
          /system-design/patterns/message-queues,
          /system-design/fundamentals/webhooks,
        ]
      companies: [Atlassian]
      a: |-
        **Short answer.** Three endpoints around an asynchronous job: submit the URL list, check status, read results. Workers behind a queue fetch each page, parse it and store the image addresses found.

        **Why.** Fetching 100 pages can take a minute, and some sites will be slow or down, so the submit call must return quickly.

        - `POST /jobs` takes the URL list, validates it (at most 100, well-formed, no private network addresses) and returns a job id.
        - `GET /jobs/id` returns counts: pages pending, done, failed.
        - `GET /jobs/id/images` returns a paged list of image URLs with the page each came from.

        The service writes one row per page and puts one message per page on a queue. A worker downloads the page, reads the `img` tags and other image references such as `srcset` and CSS backgrounds, resolves relative addresses, removes duplicates and saves them. Per-host limits still apply, because 100 submitted URLs may all point at one site.

        Pages that build their content with JavaScript need a headless browser, which costs seconds of CPU per page. Offer it as an option and run it on a separate worker pool.

        **Watch out for.** Server-side request forgery. A user can submit an address inside your own network, so resolve the name and refuse internal ranges before fetching, and again after any redirect.
    - q: What is a crawler trap, and how do you stop the crawler getting stuck in one?
      level: Junior
      topics: [/system-design/case-studies/web-crawler]
      a: |-
        **Short answer.** A crawler trap is a site that produces an endless supply of URLs. The crawler protects itself with limits per site: a maximum depth, a maximum page count and a check for repeating patterns.

        **Why.** Some traps are accidents. A calendar page has a "next month" link for ever. A shop lets you combine filters in millions of ways, and each combination is a new URL with nearly the same content. Others are deliberate, built to waste a crawler's time.

        No single rule catches them all, so several simple ones are combined.

        - Limit link depth from the seed, for example 15 hops.
        - Limit URL length, and limit how many pages are taken from one host per cycle.
        - Give each host a budget based on its value. A site whose pages are mostly duplicates of each other gets a smaller budget next time.
        - Remove known session and tracking parameters during normalisation.

        With per-host queues, a trap can only fill its own queue. Every other site keeps moving, which limits the damage even before the trap is noticed.

        **Watch out for.** A fixed page limit applied to every host equally. It stops traps, and it also cuts off large real sites such as an encyclopedia.
- id: design-post-search
  q: Design keyword search over the posts of a large social network, where a new post becomes searchable within a few seconds.
  level: Senior
  category: system-design-questions
  subcategory: search-discovery
  topics:
    - /system-design/databases/inverted-index
    - /system-design/databases/search-engines
    - /system-design/patterns/sharding
    - /system-design/patterns/caching
  companies: [Amazon, Meta, Uber]
  a: |-
    **Short answer.** Posts flow from the main database through a change stream into an **inverted index** (a map from each word to the list of posts that contain it). The index is split into shards by time. A query goes to the newest shards first, each shard returns its best matches, and a coordinator merges them.

    **What to clarify.** Exact keyword match with AND and OR, or relevance ranking. Newest first or best first. How soon a new post must appear. Whether private posts are searchable. How far back search must reach.

    **The numbers that drive the design.**

    - Writes. 500 million posts a day is about 5,800 a second to index.
    - Size. Two years of posts is 365 billion. At 300 bytes of text each that is about 110 TB, and the index is of a similar size. At 50 GB a shard that is about 2,200 shards, each with replicas.
    - Queries. 10,000 searches a second. If every search asked all 2,200 shards, that would be 22 million shard requests a second. The design must avoid that.

    **Core design.**

    1. The post service writes to its own database. That database stays the source of truth.
    2. A change-data-capture connector reads the database log and publishes every create, edit and delete to a stream.
    3. Indexers consume the stream, split the text into tokens (lower-cased words, with hashtags and mentions kept whole), and write to the current index shards.
    4. New documents first sit in a small in-memory segment that is made searchable about once a second. Segments are later written to disk as immutable files and merged in the background.
    5. Shards are grouped by time: today, this week, older months. Within a time range, posts are spread by a hash of the post id.
    6. A query coordinator parses the query and asks the newest time range first. Each shard intersects the posting lists and returns its top 20 post ids. The coordinator merges them and only asks older ranges if the page is not full.
    7. The API loads the post bodies from the post store by id and applies visibility checks.

    <AnimatedDiagram name="databases/cdc-to-search" highlight={["pg", "connector", "kafka", "indexer", "es"]} caption="The post database stays the source of truth, and a change stream feeds the indexers that keep the search index a second or two behind." />

    **The hardest part.** Indexing 5,800 posts a second while serving queries on the same shards with low latency. Immutable segments are what make this possible: readers never wait for writers, and the cost moves to background merging, which must be throttled.

    **Main trade-off.** Freshness against query cost. Making new posts visible every second creates many small segments, and every query has to check each one. Old shards are merged into a few large segments and never change, so they are cheap to query and to cache.

    **What a senior answer adds.** Stopping early on time-ordered results. Rebuilding an index from the stream or from a snapshot when the tokeniser changes. Handling very common words without scanning millions of entries. Deletes and privacy changes that take effect at once, before the index catches up.

    **Watch out for.** Writing to the database and the index from the application in two separate calls. One of them will fail some day, and the two will disagree with no way to repair it.
  followUps:
    - q: How do you trade index freshness against query latency?
      level: Senior
      topics: [/system-design/databases/search-engines, /system-design/databases/lsm-trees]
      companies: [Uber]
      a: |-
        **Short answer.** Choose a refresh interval, the time between making new documents searchable, and limit fast refreshes to the small set of shards that receive new posts.

        **Why.** A search index writes documents into a buffer and turns that buffer into a new searchable segment on each refresh. A refresh every second gives one-second freshness and up to 60 new small segments a minute on each shard. A query must look in every segment, so many small segments mean slower queries, and merging them uses disk and CPU that queries also need.

        | Refresh interval | Freshness | Cost |
        |---|---|---|
        | 1 second | Near real time | Many small segments, constant merging |
        | 30 seconds | Half a minute behind | Few segments, faster queries |

        Time-based shards remove most of the conflict. Only today's shards take writes, so only they pay for fast refresh. They are small and kept in memory. Older shards are merged down to one segment and are read-only.

        The right interval depends on the product. Live news search needs seconds. A restaurant menu search can lag by minutes with no harm, and gains cheaper and faster queries in return.

        **Watch out for.** A user who posts and searches for their own post at once. Show the user's own recent posts from the write path, so the index delay is not visible to the author.
    - q: How would you add phrase search, such as "world cup final" as an exact phrase?
      level: Mid
      topics: [/system-design/databases/inverted-index]
      a: |-
        **Short answer.** Store the position of each word inside each post, next to the post id. A phrase matches when the words appear in the same post at positions that follow one another.

        **Why.** A basic posting list says "the word final appears in posts 12, 40 and 97". That answers AND queries, but it cannot tell whether the words are next to each other. With positions, the entry becomes "post 40, positions 3 and 17".

        To run the phrase query, the engine first intersects the three posting lists to find posts that contain all three words. For each of those posts it checks for a position p where "world" is at p, "cup" at p plus 1 and "final" at p plus 2.

        The cost is index size. Positions add one number for every word occurrence, so the index often grows to two or three times its size, and phrase queries read more data than plain keyword queries.

        One optimisation for frequent pairs is to index two-word units as terms of their own, so "world cup" becomes a single lookup. That uses still more space, so apply it only to common pairs.

        **Watch out for.** Tokeniser differences. If indexing removes punctuation or very common words and the query side does not, positions stop lining up and phrases never match.
    - q: A keyword appears in a large share of all posts. How do you keep that query fast?
      level: Senior
      topics: [/system-design/databases/inverted-index, /system-design/databases/skip-list]
      a: |-
        **Short answer.** Never read the whole posting list. Keep lists sorted so the best results come first, stop as soon as the page is full, and start every intersection from the rarest word.

        **Why.** A word such as "the" or a hashtag for a global event can match billions of posts. The user wants 20 results.

        - **Order for early exit.** If results are newest first and posting lists are sorted by post id, which grows with time, the engine reads from the newest end and stops after 20 matches. Time-based shards help in the same way: today's shard alone usually fills the page.
        - **Rarest first.** For "the eclipse", start with the list for "eclipse", then check each candidate against "the" using skip pointers, which let a reader jump ahead in a long list without reading every entry.
        - **Limit the work.** Give each shard a time budget, for example 50 ms, and return the best results found so far.
        - **Skip counting.** Show "many results" for huge matches. An exact total would force a full scan.

        **Watch out for.** Deep pagination. Page 5,000 of a common word forces every shard to collect 100,000 results, so cap the depth or use a cursor based on the last post id seen.
    - q: A user deletes a post. How do you make sure it never appears in results while the index catches up?
      level: Senior
      topics: [/system-design/patterns/consistency-models, /system-design/databases/search-engines]
      a: |-
        **Short answer.** Filter at read time. Search returns post ids only, and the API loads each post from the source-of-truth store before showing it. A deleted post fails that load and is dropped.

        **Why.** The index trails the database by a second or more, and in a bad hour by minutes. Without a second check, a deleted post could be shown during that gap.

        The search flow already has a hydration step, where post bodies are fetched by id from the post store or its cache. The delete path removes the post there synchronously, so a deleted post disappears from results at once even though its entry is still in the index. The index entry is removed later, when the delete event arrives on the stream.

        Inside the index, a delete only marks the document as dead. The space is recovered when segments merge.

        To keep pages full, the coordinator asks for a few more results than it needs, for example 30 for a page of 20, so dropping a handful leaves no gaps.

        **Watch out for.** Text stored in the index for snippets and highlights. If results are drawn from that stored copy without checking the post store, deleted text can still reach the screen.
    - q: Where do you enforce who is allowed to see a post in search results?
      level: Senior
      topics: [/system-design/fundamentals/security, /system-design/databases/search-engines]
      a: |-
        **Short answer.** In two places. A coarse filter runs inside the index so private posts do not use up result slots, and an exact check runs on the final page before anything is returned.

        **Why.** Filtering only after search fails for a simple reason. If the top 20 matches are all private posts from strangers, the user gets an empty page while valid matches exist further down.

        So each indexed post carries visibility fields: public or not, author id, group id. The query adds a filter such as "public, or author is in my follow list, or group is one of mine". For a user with 500 connections this is a list of 500 ids, which the index handles well as a filter.

        The index can be stale, so it is not the final judge. A user may have been blocked, or a post changed from public to private, one second ago. The API therefore runs the same permission check that the normal post page uses on each of the 20 results before returning them.

        **Watch out for.** Leaks through side channels. Result counts, autocomplete suggestions and highlighted snippets must all pass through the same filter, or they reveal that a private post contains a given word.
    - q: Where does caching help in a search system, and where does it not?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/databases/search-engines]
      a: |-
        **Short answer.** Cache the stable parts: results for popular queries for a few seconds, filter results inside old shards, and post bodies for hydration. Do not expect a high hit rate on full results for rare or personal queries.

        **Why.** Search traffic is skewed. A small set of trending queries makes up a large share of traffic, so a result cache keyed by the normalised query with a time to live of 5 to 30 seconds removes much of the load during a big event. The short lifetime is the price of freshness.

        Most distinct queries are rare, though. A cache for them fills memory and seldom hits.

        Caches lower in the stack work for every query:

        - **Filter cache.** The set of documents matching a common filter, such as "language is English", is stored as a bitmap per segment. Segments are immutable, so it never goes stale.
        - **File cache.** The operating system keeps hot index files in memory. This is why search machines are given much more memory than the search process itself uses.
        - **Post cache.** Bodies fetched by id are cached like any other read.

        **Watch out for.** Caching results that depend on the viewer. If visibility differs per user, the cache key must include the user or the cached part must be limited to public posts.
- id: design-recommendation-system
  q: Design a recommendation system that fills a personalised home page for every user of a large shopping or streaming site.
  level: Senior
  category: system-design-questions
  subcategory: search-discovery
  topics:
    - /system-design/databases/vector-databases
    - /system-design/patterns/caching
    - /system-design/patterns/message-queues
  companies: [Amazon, Netflix]
  a: |-
    **Short answer.** Work in stages. Cheap methods pick about a thousand candidates out of millions of items, a heavier model ranks them, and business rules shape the final list. Models are trained offline from logged behaviour and served online in under 200 ms.

    **What to clarify.** What is recommended and where: a home page, "similar items", an email. What success means: clicks, purchases, watch time, or long-term retention. How fast a new action should change the page. Catalogue size and how often items are added.

    **The numbers that drive the design.**

    - Requests. 200 million daily users opening the home page 5 times is 1 billion requests a day, about 11,600 a second and perhaps 30,000 at peak.
    - Why stages are needed. A ranking model that costs 0.1 ms an item would need 1,000 seconds to score 10 million items. It can score 1,000 candidates in 100 ms.
    - Memory. An item **embedding** (a list of numbers that places similar items close together) of 128 values at 4 bytes each is 512 bytes. 10 million items need about 5 GB, which fits in memory on one machine. 200 million user embeddings need about 100 GB in a key-value store.

    **Core design.**

    1. **Log everything.** Views, clicks, purchases, watch time, and which items were shown but ignored go to an event stream and on to a warehouse.
    2. **Train offline.** A batch job learns embeddings for users and items, and a ranking model that predicts the chance of a click or purchase.
    3. **Candidate generation.** For a request, several sources each return a few hundred items: nearest neighbours of the user embedding in a vector index, items often bought together with recent purchases, popular items in the user's region, and new releases.
    4. **Filter.** Remove items already bought or watched, out of stock, or not allowed in the user's country.
    5. **Rank.** Fetch user and item features from a feature store and score every candidate with the ranking model.
    6. **Re-rank.** Apply diversity rules so the page does not show ten near-identical items, and build the rows.
    7. **Serve and cache.** Return the page, cache it briefly, and log what was shown so the next training run knows.

    **The hardest part.** The feedback loop. The system only learns about items it chose to show, so popular items collect more clicks and become even more popular, while good new items never get a chance. A small share of slots must go to exploration, meaning items shown to gather data and not because the model is confident.

    **Main trade-off.** Freshness against cost. Precomputing every user's page overnight is cheap and fast to serve, but it ignores what the user did five minutes ago. Computing on every request reacts at once and needs a fleet of model servers.

    **What a senior answer adds.** Consistent features between training and serving. A/B tests judged on a long-term measure, with short-term clicks as a guard only. Fallbacks at every stage so the page always loads. Separate handling of new users and new items.

    **Watch out for.** Describing only the model. Interviewers want the system around it: where data comes from, what is computed when, and what happens when a part fails.
  followUps:
    - q: Which kind of vector index would you use for candidate retrieval, and what does it cost in memory, recall and latency?
      level: Senior
      topics: [/system-design/databases/vector-databases]
      a: |-
        **Short answer.** For 10 million items, a graph index held in memory. For billions of vectors, a clustered index with compressed vectors, which gives up some accuracy to use far less memory.

        **Why.** Exact search compares the query with every vector, which is too slow at this request rate. Approximate indexes return most of the true nearest items. The share they find is called **recall**.

        | Index type | Memory | Recall | Query time |
        |---|---|---|---|
        | Exact scan | Vectors only | 100 percent | Slowest, grows with item count |
        | Graph (HNSW) | Vectors plus links, about 25 percent more here | 95 percent or more | About a millisecond |
        | Clusters with compression (IVF with product quantisation) | 10 to 20 times smaller | 80 to 95 percent, tunable | A few milliseconds |

        With 512-byte vectors, 10 million items take about 5 GB plus roughly 1.3 GB of graph links. That is cheap, so the graph index wins. At 1 billion vectors the raw data is 512 GB, and compressing each vector to about 32 bytes brings it down to 32 GB.

        Lower recall matters less here than in search, because retrieval only feeds the ranker and other candidate sources fill gaps.

        **Watch out for.** Filters. If most neighbours are removed afterwards for being out of stock, too few candidates remain, so fetch extra or use an index that filters during the search.
    - q: What do you recommend to a brand-new user, and how does a brand-new item ever get shown?
      level: Mid
      topics: [/system-design/databases/vector-databases]
      a: |-
        **Short answer.** Fall back from behaviour to whatever is known. A new user gets popular items for their context and is updated quickly from their first clicks. A new item gets an embedding from its content and a small guaranteed amount of exposure.

        **Why.** Models that learn from history have nothing to say about a user or an item with no history. This is called the cold start problem.

        **New user.** Use the signals that exist at the first request: country, language, device, time of day, and the page or advert they arrived from. Show what is popular for that group, mixed across categories. Each click then says a lot, so update a session profile in real time and let it steer the next page.

        **New item.** Build its embedding from the title, description, image and category with a content model, so it sits near similar items from the first minute. Then reserve a small share of slots, for example 2 percent, for items with few impressions. Once an item has a few thousand impressions, its measured click rate takes over.

        **Watch out for.** Judging new items by early click rate alone. With 50 impressions the number is mostly noise, so wait for enough data or use a confidence range before dropping an item.
    - q: Would you compute recommendations ahead of time or at request time?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/databases/key-value-stores]
      a: |-
        **Short answer.** Both. Precompute the slow-moving parts in batch, and run a light final ranking at request time that takes recent activity into account.

        **Why.** The two extremes compare like this.

        | | Precomputed nightly | Computed per request |
        |---|---|---|
        | Serving cost | One key-value read | Retrieval plus model scoring |
        | Latency | A few milliseconds | 100 to 200 ms |
        | Reacts to the last click | No, up to a day late | Yes |
        | Wasted work | Pages for users who never visit | None |

        A common split: a nightly or hourly job stores a few hundred candidates per active user in a key-value store. At request time the service reads that list, adds candidates based on the current session, removes items that are now out of stock or already seen, and ranks the result. The page can be cached for a minute or two to absorb reloads.

        Users who have not visited in months are not precomputed. They are served by the request-time path, or by a popular list, on their return.

        **Watch out for.** Caching a personalised page for too long. If a user buys an item and it is still recommended ten minutes later, the system looks broken, so clear that user's cached page when they buy.
    - q: A user watches three cooking videos in a row. How does the home page reflect that within the same session?
      level: Senior
      topics: [/system-design/patterns/message-queues, /system-design/patterns/caching]
      a: |-
        **Short answer.** Stream the events into a short-term profile for the session, and use that profile at request time for both candidate retrieval and ranking. No model is retrained.

        **Why.** The trained models change daily, but their inputs can change in seconds. The path looks like this.

        1. Each view event goes to the event stream.
        2. A stream processor updates a per-user record in an in-memory store: the last 50 items, and a session embedding computed as a weighted average of those items' embeddings, with the newest weighted most.
        3. On the next home page request, the session embedding is used to query the vector index, which brings in cooking content. The ranker also receives features such as "category share in the last 10 views".

        The whole loop takes a second or two, limited by stream delay. The cached page for that user is discarded when the session profile changes by a meaningful amount.

        The trade-off is over-reaction. Three videos do not mean the user now wants only cooking. Mix session-based candidates with long-term ones, for example a few rows of each, and let the short-term signal fade over hours.

        **Watch out for.** Accidental signals. A video that auto-played for two seconds is not interest, so count a view only after a minimum watch time.
    - q: How do you know a new recommendation model is better than the current one?
      level: Mid
      topics: [/system-design/databases/analytical-databases]
      a: |-
        **Short answer.** Check it offline on held-back historical data first, then run an A/B test on a small share of real users and judge it on the business measure, not on clicks alone.

        **Why.** Offline evaluation is cheap. Train on data up to last week, then check how highly the model ranks the items that users went on to choose this week. It filters out bad models, but it is biased, because the logs only contain reactions to what the old model showed.

        The real test is online. Assign users at random, for example 5 percent to the new model, and keep each user in the same group for the whole test. Run it for at least one or two full weeks to cover weekday and weekend behaviour. Compare the goal measure, such as purchases per user or hours watched, and guard measures such as returns, complaints, page latency and catalogue coverage.

        Clicks are easy to raise in harmful ways. A model that promotes eye-catching thumbnails gets more clicks and shorter sessions afterwards.

        **Watch out for.** Stopping a test the moment the result looks good. Early differences are often noise, so fix the length and sample size before starting.
    - q: The ranking service is down. What does the user see?
      level: Junior
      topics: [/system-design/patterns/circuit-breaker-and-retries, /system-design/fundamentals/availability]
      a: |-
        **Short answer.** A slightly less personal page, never an empty one. Each stage has a simpler fallback, and the last fallback is a precomputed list of popular items.

        **Why.** A recommendation is a best guess, so a worse guess is still a working product. An empty home page is an outage. The fallbacks form a ladder.

        1. Ranker slow or down: show the candidates in the order the retrieval stage returned them.
        2. Retrieval down: show the user's last cached page, or the list from the nightly batch.
        3. Nothing personal available: show the most popular items for the user's country, stored as a small static list that is refreshed hourly and can even be served from a CDN.

        The page service gives each stage a strict time limit, for example 150 ms for ranking, and moves down the ladder when the limit passes. A circuit breaker stops calls to a failing stage for a short time so it is not flooded with retries while it recovers.

        Filters that protect the user, such as "not available in your country", must still run in every fallback.

        **Watch out for.** Fallbacks that are never tested. Switch each one on deliberately for a small share of traffic from time to time, so the first real use is not during an incident.
- id: design-typeahead
  q: Design search typeahead that suggests up to ten completed queries as the user types each letter.
  level: Mid
  category: system-design-questions
  subcategory: search-discovery
  topics:
    - /system-design/case-studies/typeahead
    - /system-design/patterns/caching
    - /system-design/fundamentals/cdn
  a: |-
    **Short answer.** Count past queries offline, and for each prefix store its ten best completions. Serving a keystroke is then a single in-memory lookup, with caching at the client and the edge in front of it.

    **What to clarify.** Whether suggestions are past queries or entities such as people and products. Whether they are the same for everyone or personalised. How fast a new trending query must appear. Which languages are supported, and whether spelling mistakes should be tolerated.

    **The numbers that drive the design.**

    - Requests. 5 billion searches a day, with about 6 suggestion requests each after the client skips fast keystrokes, is 30 billion requests a day. That is about 350,000 a second on average and more at peak.
    - Latency. Suggestions must feel instant, so aim for 100 ms from keystroke to display. After network time, the server has about 20 ms.
    - Data. Queries seen only once are not worth suggesting. Keeping the 100 million most frequent queries at about 30 bytes each is 3 GB of text. The whole structure fits in memory on one machine, so every server can hold a full copy.

    **Core design.**

    1. **Collect.** The search service logs each submitted query with a timestamp and coarse region. Logs go to a stream and then to batch storage.
    2. **Aggregate.** A job counts queries over time windows and computes a score for each, with recent days weighted higher. It removes rare queries and anything on a block list.
    3. **Build.** A builder creates a **trie** (a tree where each node is one more character of a prefix). Every node stores the top ten completions under it, so no searching is needed at request time.
    4. **Ship.** The finished structure is written as an immutable file. Serving nodes download it, load it beside the old one, and switch over.
    5. **Serve.** A stateless service takes a prefix, normalises it (lower case, trimmed spaces), walks the trie and returns the stored list.
    6. **Client.** The app waits about 100 ms after the last keystroke before asking, cancels requests that are no longer needed, and keeps recent answers in memory.
    7. **Edge.** Answers for short prefixes are the same for everyone in a region, so a CDN can cache them for a few minutes.

    **The hardest part.** Freshness. A full rebuild of the trie takes hours, yet a breaking news query should appear in minutes. This needs a second, small structure built from the last hour of the stream and merged with the main one at query time.

    **Main trade-off.** Precomputation against flexibility. Storing the top ten at every node makes reads trivial, but any change in ranking means a rebuild, and personal results cannot be stored for every user. Personalisation is added as a light re-ordering step on top of the shared list.

    **What a senior answer adds.** Filtering of offensive and private queries before anything is suggested. Sharding by prefix once the data outgrows one machine. Measuring quality by how many characters users type before they pick a suggestion.

    **Watch out for.** Running a database query with a "starts with" filter on every keystroke. It cannot meet 20 ms at 350,000 requests a second.
  followUps:
    - q: Which data structure would you use for prefix lookup, and why not a plain map from prefix to suggestions?
      level: Mid
      topics: [/system-design/case-studies/typeahead, /system-design/databases/key-value-stores]
      a: |-
        **Short answer.** Either works, and many real systems use the plain map. A trie shares common prefixes and saves memory. A map from each prefix to its top ten is simpler and easy to spread across a key-value store.

        **Why.** The two compare like this.

        | | Trie with top ten at each node | Map from prefix to top ten |
        |---|---|---|
        | Lookup | Walk one node per character | One hash lookup |
        | Memory | Prefixes stored once, shared | Every prefix stored in full |
        | Updating one query's score | Touch the nodes on one path | Rewrite an entry for every prefix of it |
        | Sharding and replication | Custom | Any key-value store does it |

        A 20-character query has 20 prefixes, so the map holds up to 20 entries for each query, and each entry repeats ten full strings. Storing query ids in place of full strings keeps this under control.

        The trie is compact and supports extras such as tolerating a typo by exploring neighbouring branches. It is harder to split across machines.

        With a daily rebuild and data of a few gigabytes, choose the simpler one for the team. Say which you chose and what it costs.

        **Watch out for.** A trie that stores only words, with no precomputed lists. Finding the best ten under the prefix "s" would mean visiting millions of nodes.
    - q: How do you rank the suggestions for a prefix?
      level: Mid
      topics: [/system-design/case-studies/typeahead]
      a: |-
        **Short answer.** Start with how often each query was searched, weighted towards recent days. Then adjust for quality, and re-order lightly for the user's own context.

        **Why.** Raw all-time counts go stale. A query about an event from two years ago can outrank this week's event for ever. A common fix is a decayed count: each day's count is multiplied by a factor such as 0.9 for every day of age, so last week counts about half as much as today.

        Popularity alone also promotes poor queries. Useful extra signals, computed offline, are:

        - Whether searches for the query led to a click on a result. A common misspelling has a high count and a low click rate.
        - Whether the query was picked when it was shown as a suggestion before.
        - Region and language, so the same prefix can complete differently in two countries.

        These combine into one score, and the top ten for each prefix are stored. At request time a small step can move the user's own past searches to the top, which needs no change to the shared structure.

        **Watch out for.** Self-reinforcement. Suggested queries get searched more because they were suggested, so use counts of typed queries, or discount selections, when computing popularity.
    - q: What should run on the device and what on the server?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/case-studies/typeahead]
      a: |-
        **Short answer.** The device handles timing, short-lived caching and the user's own history. The server holds the global suggestion data, which is too large and changes too often to ship to every device.

        **Why.** Work done on the device removes requests and feels faster.

        - **Debounce.** Wait about 100 ms after the last keystroke before sending. Someone typing 8 characters quickly sends 2 or 3 requests in place of 8.
        - **Local cache.** Keep the answers for recent prefixes, so pressing backspace needs no request.
        - **Stale answers.** Tag each request with a counter and ignore a response that is older than the one already shown.
        - **Personal history.** The user's own recent searches can be stored and matched on the device. They then appear instantly and work offline. If history is kept only on the device, it also stays private.

        The server is needed for global popularity, trends and spelling tolerance, which depend on everyone's queries.

        A middle option is to send a small pack of the most common few thousand completions to the app, so the first one or two characters are answered locally.

        **Watch out for.** Filtering locally and stopping there. If the device holds ten results for "ca" and filters them for "cat", it will miss better completions for "cat" that were never in the top ten for "ca".
    - q: Which query data do you log to build suggestions, and how do you keep it private?
      level: Senior
      topics: [/system-design/fundamentals/security, /system-design/fundamentals/encryption-and-hashing]
      a: |-
        **Short answer.** Log only submitted queries with coarse context, separate them from user identity before aggregation, and suggest a query only after many different people have searched it.

        **Why.** The suggestion pipeline needs counts: this query, this hour, this region. It does not need to know who typed it. So the log record that feeds it carries the query text, a time bucket and a country, with no account id and no full IP address. If duplicate removal needs a per-user signal, use an identifier that changes daily and is deleted after counting.

        People type private things into search boxes: phone numbers, addresses, names with medical terms. The main protection is a threshold. A query becomes a candidate only if at least, say, 1,000 distinct users searched it in the window. Text typed by one person can then never be shown to another.

        Further steps: do not store unfinished keystrokes, only completed searches. Encrypt logs at rest. Keep raw logs for a short, fixed period and keep only the aggregated counts after that. Give the raw logs stricter access than the counts.

        **Watch out for.** Thresholds based on search count instead of distinct users. One person or one script repeating a query 1,000 times would push private or abusive text into everyone's suggestions.
    - q: A news event makes a new query popular within minutes. How does it reach suggestions before the next full rebuild?
      level: Senior
      topics: [/system-design/patterns/message-queues, /system-design/case-studies/typeahead]
      a: |-
        **Short answer.** Run a small real-time layer next to the main index. A stream job counts queries over the last few minutes, and the serving layer merges those trending entries with the stored top ten.

        **Why.** The main structure is rebuilt from days of logs and may be refreshed every few hours. Rebuilding it faster is expensive and does not get down to minutes.

        The fast path is small by design. A stream processor reads the query log and keeps counts in short windows, for example 5 minutes. It compares each query's current rate with its usual rate. A query that normally gets 10 searches a minute and now gets 5,000 is marked as trending. Only the few thousand such queries are published, with their prefixes, to a small in-memory table on every serving node.

        At request time the server reads the stored top ten for the prefix and the trending entries for the same prefix, merges them by score and returns ten. The trending entry expires once a full build includes the query.

        **Watch out for.** Organised spam. A burst from a small set of accounts or addresses should not count as a trend, so require a wide spread of distinct users.
- id: design-top-k
  q: Design a system that shows the top K most played songs over the last hour, updated about once a minute.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/message-queues
    - /system-design/databases/skip-list
    - /system-design/patterns/sharding
    - /system-design/patterns/caching
  companies: [Amazon, Apple, Atlassian, Google, LinkedIn, Meta, Pinterest, Uber]
  a: |-
    **Short answer.** Play events go into a log partitioned by song id. Stream workers count plays per song in one-minute buckets, and each worker keeps the top K of its own partition. A small merger combines those short lists into the global top K and writes it to a cache that every reader shares.

    **What to clarify.** The size of K and the window: top 100 over one hour is very different from top 100 of all time. Whether the window slides or resets on the hour. Whether counts must be exact, for example when they drive payments to artists, or may be approximate. How stale the list may be. Whether there are separate lists per country or genre.

    **The numbers that drive the design.**

    - Events. 1 billion plays a day is about 11,600 a second, and about 35,000 at peak.
    - State. If 10 million different songs are played in an hour and each appears in about 10 of the 60 minute buckets, that is 100 million counters. At 20 bytes each this is 2 GB, spread over all partitions.
    - Reads. The answer is the same for every user and is about 100 rows. A million readers a second can be served from a cache and a CDN. All the difficulty is on the write side.

    **Core design.**

    1. The player sends a play event with a unique event id, song id and timestamp after 30 seconds of listening. An ingest service appends it to a log, partitioned by song id.
    2. Each stream worker owns some partitions. It keeps a table from (song, minute) to count, skips event ids it has already seen, and saves its state to durable storage every few seconds.
    3. A song's count for the last hour is the sum of its last 60 minute buckets. Each minute the worker adds the newest bucket, drops the one that has aged out, and recomputes the top K of its partition.
    4. All events for one song land in one partition, so every song's count is complete in one place. The true global top K must therefore be inside the union of the per-partition lists.
    5. A merger reads the partition lists, for example 64 lists of 100, sorts 6,400 rows and writes the top 100 to a cache.
    6. The API reads the cache. Minute counts also go to a store for history and for longer windows built from hourly sums.

    **The hardest part.** The sliding window. Adding to a count is easy. A window also has to forget, so every song's count must drop when its old plays age out, including songs that nobody is playing now. Time buckets turn this into dropping one bucket a minute, at the cost of a window edge that is accurate to one minute.

    **Main trade-off.** Exact counts against memory and speed. Exact counting keeps a counter for every song, including millions played once. Approximate structures use fixed memory and can misplace items near the cut-off. With 10 million keys, exact is affordable. With billions of keys, such as URLs, it may not be.

    **What a senior answer adds.** Handling duplicate and late events by event time. Spreading a hot key across workers. Rebuilding state by replaying the log after a bug. Longer windows computed from coarser buckets.

    **Watch out for.** Partitioning events at random and merging local top K lists. A song that is 150th on every partition can be 10th overall, and it would be missed.
  followUps:
    - q: When would you accept approximate counts, and what would you use to get them?
      level: Senior
      topics: [/system-design/patterns/bloom-filter, /system-design/patterns/message-queues]
      companies: [Meta]
      a: |-
        **Short answer.** Approximate is fine when the list is for display, such as trending items, and the number of distinct keys is too large to count one by one. Stay exact when money or fairness depends on the number.

        **Why.** The usual tool is a **count-min sketch**: a few rows of counters, with a different hash function for each row. Each event adds 1 to one counter in every row. The estimate for a key is the smallest of its counters. Collisions with other keys only push counters up, so the estimate is never too low.

        The size is fixed. Four rows of 1 million 4-byte counters use 16 MB however many keys exist. With 42 million events in an hour, the typical overcount is on the order of 42 million divided by 1 million, so a few dozen to about a hundred. Songs around rank 100 with a few thousand plays may swap places.

        The sketch only answers "how many for this key", so a small heap of the current top K candidates is kept beside it.

        | | Exact table | Sketch plus heap |
        |---|---|---|
        | Memory | Grows with distinct keys | Fixed |
        | Error | None | Small overcount |

        **Watch out for.** Using a sketch for royalty payments or for a competitive leaderboard, where one wrong position leads to a dispute.
    - q: Events can arrive twice or arrive late. What guarantee do the counts give?
      level: Senior
      topics:
        [
          /system-design/patterns/idempotency,
          /system-design/patterns/message-queues,
          /system-design/patterns/consistency-models,
        ]
      companies: [Uber]
      a: |-
        **Short answer.** The counts converge to the right value. They are not exact at every instant. Duplicates are removed by event id, and events are counted in the minute they happened, with a short grace period for late ones.

        **Why.** Clients retry and logs deliver at least once, so the same play can arrive two or three times. Each event carries an id made on the device. The worker keeps recently seen ids per partition for a period longer than any retry, for example 10 minutes, and ignores repeats. Counts, seen ids and log position are saved in one checkpoint, so a restart neither loses nor double counts.

        Lateness comes from phones that were offline. The worker places each event in the bucket for its own timestamp, not its arrival time. A bucket stays open for a grace period, for example 2 minutes after the minute ends. Anything later is left out of the live list and goes to a batch job that produces the exact daily numbers.

        So the live list is a close estimate that settles within the grace period, and the batch result is the record.

        **Watch out for.** Trusting device clocks fully. Reject timestamps far in the future or the past, or a phone with a wrong clock writes counts into the wrong hour.
    - q: One song suddenly gets a large share of all plays. Where is the hot spot and how do you spread it?
      level: Senior
      topics: [/system-design/patterns/sharding, /system-design/patterns/back-pressure]
      companies: [Meta, LinkedIn]
      a: |-
        **Short answer.** The hot spot is the single partition that owns that song id, and its worker falls behind. Fix it by counting in two stages: spread the hot key over many workers for partial counts, then combine the partial counts on one.

        **Why.** Partitioning by key sends every event for a song to one place. If one release makes up 20 percent of 35,000 events a second, one worker gets 7,000 extra events a second while the others are idle. Its lag grows and the whole list goes stale, because the merger waits for every partition.

        The two-stage fix works like this.

        1. Stage one partitions by song id plus a random number from 0 to 15. The hot song is now spread over 16 workers. Each emits a partial count per song every second.
        2. Stage two partitions by song id alone and adds the partials. It receives at most 16 small messages a second for that song, not 7,000 events.

        Addition gives the same total in any order, so the result is unchanged. The cost is one more hop and about a second of extra delay.

        **Watch out for.** Fixing it by adding partitions. More partitions do not help, because a single key still maps to exactly one of them.
    - q: "For a game leaderboard, how do you return one player's rank and the players just above and below them, including ties?"
      level: Mid
      topics: [/system-design/databases/skip-list, /system-design/databases/key-value-stores]
      companies: [Meta]
      a: |-
        **Short answer.** Keep the scores in an in-memory sorted set, a structure commonly built on a skip list. It can update a score, return a member's rank and return a range of ranks, each in logarithmic time.

        **Why.** A skip list is a sorted linked list with extra layers of shortcut links. If each shortcut also records how many entries it jumps over, the rank of an entry is the sum of the jumps taken to reach it. With 100 million players that is about 27 steps.

        "Players near me" is two operations: get my rank, for example 48,213, then read ranks 48,208 to 48,218.

        Ties need a rule that everyone can understand. A common one is that the player who reached the score first is ranked higher. Encode that in the sort key: sort by score descending, then by the time the score was reached ascending. Every position is then unique and stable between requests.

        At about 100 bytes an entry, 100 million players need roughly 10 GB, which fits on one large machine with a replica.

        **Watch out for.** Showing an exact rank to millions of low-ranked players. "Top 40 percent" from score ranges is cheaper and just as useful to them.
    - q: How would you show a leaderboard of only the player's friends?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/databases/key-value-stores]
      companies: [Meta]
      a: |-
        **Short answer.** Compute it when it is requested. Fetch the friend list, read each friend's score in one batched lookup, and sort the small result in memory.

        **Why.** The global leaderboard is one shared structure. A friends leaderboard is different for every player, so storing one for each player would mean rewriting many of them on every score change. A player with 500 friends who scores once would trigger 500 updates.

        Reading on demand is cheap because friend lists are small. For 500 friends the steps are: one read of the friend ids, one batched read of 500 scores from a key-value store, and a sort of 500 numbers, which takes microseconds. The whole request can finish in about 10 ms. The result can be cached for the player for 30 seconds, because friends' scores change slowly compared with how often the screen is opened.

        The player's own score should come from the write path or be updated in the cached result, so they see their new score at once.

        **Watch out for.** Accounts with huge follower lists. If "friends" can mean 5 million followers, cap the list at the people the player follows, or at a fixed size, before doing a read-time merge.
    - q: Traffic grows ten times. What breaks first, ingesting events or serving the list to viewers?
      level: Senior
      topics:
        [
          /system-design/patterns/back-pressure,
          /system-design/fundamentals/capacity-planning,
          /system-design/patterns/caching,
        ]
      companies: [Uber, LinkedIn]
      a: |-
        **Short answer.** Ingestion and aggregation break first. Serving is one small cached answer that is the same for everyone, so it is the easiest part to scale.

        **Why.** At ten times the load there are 350,000 events a second at peak. The log itself scales by adding partitions. The weak points appear in this order.

        1. **Hot partitions.** Skew grows with volume, so a popular key overloads one worker long before the average worker is busy.
        2. **Worker state.** More distinct keys per window means larger tables, slower checkpoints and slower recovery after a crash.
        3. **Duplicate tracking.** Remembering ten times as many event ids takes real memory.

        The signal to watch is consumer lag, the gap between the newest event in the log and the last one processed. When lag grows, the system should degrade on purpose: publish the list with a visible "as of" time, and sample events for the live estimate while the full stream is kept for the exact batch count.

        Serving changes only if viewers get live pushes over open connections. That needs more gateway servers, with one publish per update.

        **Watch out for.** Scaling on CPU averages. Lag per partition shows the problem. The fleet average hides it.
- id: design-job-scheduler
  q: Design a distributed job scheduler that runs one-time and recurring (cron-style) jobs for many teams.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/leader-election
    - /system-design/patterns/message-queues
    - /system-design/patterns/idempotency
    - /system-design/patterns/sharding
  companies: [Airbnb, Amazon, Atlassian, DoorDash, Google, LinkedIn, Robinhood, Snowflake]
  a: |-
    **Short answer.** Separate deciding when a job is due from doing the work. A durable store holds every job and its next run time. Scheduler nodes find due jobs and record a run for each one. A queue carries runs to a pool of workers, which execute them at least once and record the outcome.

    **What to clarify.** Run once at a set time, on a repeating schedule, or both. How precise timing must be: within a second or within a minute. Whether a job is a call to a team's service or code the platform runs itself. The guarantee wanted: at least once is the usual one. How long jobs run, and whether jobs depend on each other.

    **The numbers that drive the design.**

    - Volume. 10 million job definitions producing 100 million runs a day is about 1,160 runs a second on average.
    - Spikes. Cron schedules pile up on round times. If 1 million jobs are set for midnight, firing them within one minute means about 17,000 a second. Size for that.
    - History. 100 million run records a day at 500 bytes each is 50 GB a day, so run history needs a retention period and its own storage plan.

    **Core design.**

    1. **API.** Teams create, pause, resume and cancel jobs. A job has an owner, a schedule or a run time, a target, a retry policy and a timeout.
    2. **Job store.** A database table holds each job with a `next_run_at` column, indexed by shard and time. Jobs are placed in a shard by a hash of the job id.
    3. **Schedulers.** Several scheduler nodes run. Each holds a lease on a set of shards, so every shard has exactly one owner at a time. Every second, a node selects the jobs in its shards whose `next_run_at` has passed.
    4. **Trigger.** For each due job, one transaction inserts a run record, with a unique key on job id plus scheduled time, and moves `next_run_at` to the next occurrence. A relay then puts the run on a queue.
    5. **Workers.** A worker takes a run from the queue, marks it as running with a lease, executes it and sends heartbeats. It records success or failure. Failures are retried after a growing delay, up to a limit.
    6. **Recovery.** A sweeper finds runs whose lease has expired and queues them again. Status, history and logs are available through the API.

    **The hardest part.** Firing each occurrence once when scheduler nodes crash, restart and overlap. The unique key on job id plus scheduled time is the anchor. However many nodes believe they own a shard, the database accepts only one run record for the 09:00 occurrence.

    **Main trade-off.** At-least-once execution against duplicates. A worker can finish the job and die before recording success, and the run is then repeated. Promising at most one execution would mean never retrying, which loses work. Most platforms choose at least once and pass a run id to the job, so the job can make its own effect idempotent.

    **What a senior answer adds.** Fairness between teams through per-tenant quotas and queues. A policy for runs missed during an outage: catch up, or skip. Monitoring the scheduler itself through the delay between scheduled and actual start. Spreading load with a small random offset when the owner allows it.

    **Watch out for.** One server with an in-memory timer for every job. It is a single point of failure, and a restart forgets every pending trigger.
  followUps:
    - q: A scheduler node crashes after it records a run but before it puts the run on the queue. How do you avoid a lost or doubled trigger?
      level: Senior
      topics:
        [
          /system-design/patterns/idempotency,
          /system-design/patterns/message-queues,
          /system-design/patterns/cqrs-event-sourcing,
        ]
      companies: [Snowflake]
      a: |-
        **Short answer.** Treat the run record in the database as the trigger itself and the queue message as a hint. A relay keeps publishing every run that is still in the "pending" state until it is marked as queued.

        **Why.** The database and the queue are two systems, and no single transaction covers both. Whichever is written first, a crash can fall between the two writes. Writing the queue first risks a message with no record. Writing the record first risks a record that never reaches the queue.

        The fix is the outbox pattern. The trigger transaction inserts the run with status "pending". A separate relay loop reads pending runs, publishes them, then updates the status to "queued". After a crash, the next owner of the shard finds the pending row and publishes it. Nothing is lost.

        The relay can also crash after publishing and before updating the status, so a run may be published twice. That is safe, because a worker must claim the run with a conditional update from "queued" to "running" before it starts. Only one claim succeeds and the second message is dropped.

        **Watch out for.** Detecting duplicates with the queue's own features alone. Most queues only remember message ids for a short period, and a recovery an hour later would get past that.
    - q: How does a worker claim a run so that it stays claimed, and what happens if that worker dies?
      level: Senior
      topics: [/system-design/patterns/leader-election, /system-design/patterns/idempotency]
      companies: [Airbnb, Robinhood]
      a: |-
        **Short answer.** The worker writes a lease on the run record with a conditional update and renews it with heartbeats. If the heartbeats stop, the lease expires and a sweeper queues the run again for another worker.

        **Why.** The claim is one statement: set status to running, owner to this worker, attempt to attempt plus 1 and `lease_expires_at` to now plus 30 seconds, only where the status is queued. The database lets exactly one worker succeed.

        While the job runs, the worker extends the lease every 10 seconds. A sweeper looks for running rows whose lease has passed and sets them back to queued. A dead worker is therefore noticed within about 30 seconds.

        The dangerous case is a worker that is slow, not dead. It pauses for a minute, its lease expires, a second worker starts the same run, and then the first one wakes up. To deal with this, every result write includes the attempt number and is accepted only if it matches the current attempt. The late result from the first worker is rejected.

        **Watch out for.** A lease shorter than a normal pause. Long garbage collection pauses or a slow network then cause false expiries and repeated work.
    - q: A user cancels a job at the same moment it is about to start. How do you handle the race?
      level: Senior
      topics: [/system-design/patterns/consistency-models, /system-design/patterns/idempotency]
      companies: [Airbnb, LinkedIn]
      a: |-
        **Short answer.** Make the run's status the single arbiter. Cancel and claim are both conditional updates on the same row, so exactly one wins, and the API tells the user which one.

        **Why.** A run moves through states: pending, queued, running, then succeeded, failed or cancelled. The cancel request sets status to cancelled only where the status is pending or queued. The worker's claim sets status to running only where the status is queued. The database applies them one after the other.

        - If the cancel is first, the claim changes zero rows and the worker drops the message.
        - If the claim is first, the cancel changes zero rows. The run has started.

        In the second case the API should answer honestly: "already running, cancellation requested". The service sets a `cancel_requested` flag. The worker sees it on its next heartbeat and stops the job at a safe point if the job supports that. A payment job should check the flag one last time just before it calls the payment provider.

        For a recurring job, cancelling also clears `next_run_at` in the job row, so no later occurrence is created.

        **Watch out for.** Returning "cancelled" just because the request was received. If the run had already started, the user believes a payment was stopped when it was not.
    - q: A job is scheduled every minute but each run takes five minutes. What should the scheduler do?
      level: Mid
      topics: [/system-design/patterns/back-pressure, /system-design/patterns/message-queues]
      companies: [Snowflake]
      a: |-
        **Short answer.** Make it a per-job setting with a safe default. The default is to skip a new run while the previous one is still going.

        **Why.** There are three possible policies.

        | Policy | What happens | Good for |
        |---|---|---|
        | Skip | A due run is recorded as skipped if one is active | Sync and refresh jobs, where the next run covers the gap |
        | Queue | Due runs wait and execute one after another | Jobs where each run handles its own time slice |
        | Overlap | Runs start regardless | Independent, idempotent work only |

        Queueing looks safe but can never catch up here. Each minute adds one run and each five minutes removes one, so the backlog grows by four runs every five minutes. A queued policy therefore needs a limit, for example at most one waiting run, with older ones dropped.

        Overlap multiplies load. Five copies run at once, often against the same data, which usually makes each one slower.

        To apply the skip policy, the trigger transaction checks whether the job has an active run before it inserts a new one. A skipped occurrence is still written to the history so the owner can see it.

        **Watch out for.** Skipping silently. A job that has skipped 80 percent of its runs for a week is broken, so raise an alert when the skip rate is high.
    - q: You guarantee at-least-once execution. What changes if a team needs at-most-once?
      level: Mid
      topics: [/system-design/patterns/idempotency, /system-design/patterns/circuit-breaker-and-retries]
      companies: [Robinhood]
      a: |-
        **Short answer.** The order of two steps changes. At least once records completion after the work and retries when in doubt. At most once records the attempt before the work and never retries when in doubt.

        **Why.** The difference shows when a worker dies in the middle of a run and nobody knows whether the work happened.

        | | At least once | At most once |
        |---|---|---|
        | When the outcome is unknown | Run it again | Do not run it again |
        | Risk | The effect happens twice | The effect never happens |
        | Example fit | Rebuilding a report | Sending a one-time text message |

        For at most once, the worker marks the run as "attempted" before it starts. The sweeper never requeues such runs. It marks them "unknown" and alerts the owner.

        Most teams that ask for at most once want something else: the effect should happen exactly once. The scheduler cannot promise that alone. The practical answer is at-least-once delivery plus an idempotent job. The scheduler passes the same run id on every attempt, and the job or the service it calls stores that id and ignores a repeat.

        **Watch out for.** Promising exactly-once execution. Only delivery and effect together can give that result, and the effect belongs to the job owner.
    - q: "Jobs have their own time zones. How do you handle a schedule like 02:30 every day when the clocks change?"
      level: Mid
      topics: [/system-design/fundamentals/api-design]
      companies: [Snowflake]
      a: |-
        **Short answer.** Store the schedule as the owner wrote it, with a named time zone such as Europe/Paris. Store the next run as an absolute UTC instant. Compute each next run from the previous one with a time zone library, and document one rule for the missing hour and one for the repeated hour.

        **Why.** The scheduler compares instants, so `next_run_at` must be in UTC. The schedule itself cannot be converted to UTC once and kept, because "09:00 in Paris" is 08:00 UTC in winter and 07:00 UTC in summer.

        Twice a year the local clock misbehaves.

        - **Clocks go forward.** 02:30 does not exist that night. A common rule is to run at the first valid moment after the gap, 03:00, so the daily job is not missed.
        - **Clocks go back.** 02:30 happens twice. Run on the first occurrence only. The unique key on job id plus scheduled local time blocks the second.

        Time zone rules change when governments change them, so the time zone data on scheduler nodes must be kept up to date.

        **Watch out for.** Every scheduler node using its own local time zone. Run all nodes in UTC and convert only when computing a schedule.
- id: design-rate-limiter
  q: Design a rate limiter that protects a public API served by many gateway servers.
  level: Mid
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/case-studies/rate-limiter
    - /system-design/patterns/rate-limiting
    - /system-design/fundamentals/abuse-protection
    - /system-design/fundamentals/api-gateway
  companies: [Apple, Atlassian, Google, Microsoft, Pinterest, Snowflake, Stripe]
  a: |-
    **Short answer.** Check every request at the API gateway. The gateway turns the request into a key, such as an API key plus a route, and runs a token bucket for that key in a shared in-memory store. When the bucket is empty the gateway answers with HTTP 429 and never calls the backend.

    **What to clarify.** Who is limited: a user, an API key, an IP address or a whole tenant. Whether a limit may be exceeded by a few percent or must be exact. One region or several. Whether rules change while the system runs. What should happen to traffic when the limiter itself is broken.

    **The numbers that drive the design.**

    - Request rate. 1 million requests a second over 200 gateway servers is 5,000 checks a second per server, and every one of them needs a decision.
    - Latency budget. If the API answers in 50 ms, the check should add about 1 ms. A round trip to an in-memory store in the same data centre takes roughly half a millisecond, so one call fits and two calls do not.
    - Memory. A bucket is a token count and a timestamp, about 100 bytes with its key. 10 million active keys need about 1 GB, which is small.

    **Core design.**

    1. Rules live in a small config store, for example "free plan, 100 requests a minute per API key on the search route". Each gateway keeps the rules in memory and reloads them every few seconds.
    2. For each request the gateway finds the matching rules and builds one key per rule, such as `search:key_8841`.
    3. The gateway sends one script to the counter store, a cluster of in-memory nodes with keys spread by hash. The script adds the tokens earned since the last visit, takes one token if any is left, and returns "allowed" or "denied" with the tokens remaining. The store runs the whole script as a single step.
    4. An allowed request goes to the backend. A denied request gets a 429 with a `Retry-After` header that says how many seconds to wait.
    5. Each key carries an expiry a little longer than the time to refill a full bucket, so idle keys delete themselves.

    <AnimatedDiagram name="fundamentals/abuse-protection" highlight={["gateway", "limiter", "counters"]} caption="The gateway asks the limiter before it forwards a request, and the limiter keeps its counts in one shared store." />

    **The hardest part.** Keeping one correct count when 200 servers update it at once. If a gateway reads the count, decides, and then writes it back, two gateways can both read "1 token left" and both allow a request. The read, the decision and the write must happen as one atomic step inside the store.

    **Main trade-off.** Accuracy against latency. A call to the shared store on every request is exact but adds a network hop and a dependency. A local bucket in each gateway that syncs with the store every second is faster and survives a store outage, but a client can overshoot by up to one sync period of traffic on each server.

    **What a senior answer adds.** A stated failure policy: allow traffic when the store is down for normal limits, deny for costly actions such as login attempts. Separate limits per tenant, so one large customer cannot use up capacity that others need. Metrics on denied requests per rule, so a wrong rule is noticed in minutes.

    **Watch out for.** Limiting only by IP address. Thousands of users in one office or behind one mobile carrier share an address, and an attacker can rotate through many addresses.
  followUps:
    - q: How does a token bucket differ from a fixed window counter?
      level: Junior
      topics: [/system-design/patterns/rate-limiting]
      companies: [Microsoft]
      a: |-
        **Short answer.** A fixed window counts requests in clock periods, such as each minute, and resets to zero at the boundary. A token bucket refills at a steady rate and lets a client spend saved tokens in a short burst.

        **Why.** Take a limit of 100 requests a minute. With a fixed window, a client can send 100 requests at 10:00:59 and 100 more at 10:01:00. That is 200 requests in two seconds, twice the intended rate, and the backend sees it as a spike.

        A token bucket for the same limit holds at most 100 tokens and gains one token every 0.6 seconds. A client that was quiet can send 100 at once, then is held to the refill rate. You control the two things separately: bucket size sets the burst, refill rate sets the long-run average.

        | | Fixed window | Token bucket |
        | --- | --- | --- |
        | State per key | One counter | Token count and last refill time |
        | Burst at window edge | Up to 2 times the limit | Never above bucket size |
        | Easy to explain to customers | Yes | Slightly harder |

        **Watch out for.** Calling the fixed window useless. For a monthly quota of 1 million calls, a simple counter per calendar month is the right tool, because the edge effect does not matter at that scale.
    - q: How do you update the token count atomically when many gateway servers share it?
      level: Senior
      topics: [/system-design/patterns/rate-limiting, /system-design/databases/key-value-stores]
      companies: [Apple]
      a: |-
        **Short answer.** Move the whole read, compute and write sequence into the store, as a script the store runs without interleaving any other command for that key.

        **Why.** The unsafe pattern is three steps from the gateway: read the bucket, work out the new token count, write it back. Two gateways can do the read at the same moment, both see one token, and both allow. With 200 gateways and a busy key this happens many times a second.

        An in-memory store such as Redis runs each server-side script from start to finish on one thread. The script receives the key, the bucket size, the refill rate and the cost of this request. It reads the stored tokens and timestamp, adds the tokens earned since then up to the bucket size, subtracts the cost if enough tokens exist, saves the result with an expiry, and returns the decision.

        Use the store's clock inside the script, or pass a time and never let the saved timestamp move backwards. A gateway clock that jumps back would otherwise hand out extra tokens.

        **Watch out for.** A lock taken by the gateway around the three steps. It works, but it costs at least two extra round trips and a crashed gateway can leave the lock held until it expires.
    - q: The counter store becomes unreachable. Do you let requests through or block them?
      level: Senior
      topics:
        [
          /system-design/patterns/rate-limiting,
          /system-design/patterns/circuit-breaker-and-retries,
          /system-design/fundamentals/availability,
        ]
      companies: [Pinterest, Stripe]
      a: |-
        **Short answer.** For most limits, let requests through and fall back to a rough local limit in each gateway. For a small set of sensitive actions, block.

        **Why.** A rate limiter exists to protect the service. If a limiter outage rejects every request, the protection has caused the outage it was meant to prevent. So the default is to "fail open": treat a timeout from the store as "allowed".

        Failing open with no limit at all is risky during an attack, so keep a second line. Each gateway holds a local token bucket per key sized at the global limit divided by the number of gateways, with some slack. With 200 gateways and a limit of 1,000 a second, each allows about 5 to 10 a second for that key.

        Some rules should "fail closed": password attempts, one-time code checks, sending paid text messages.

        Set a tight timeout on the store call, around 2 to 5 ms, and stop calling the store for a few seconds after repeated failures so that gateway threads do not pile up waiting.

        **Watch out for.** Deciding this during the incident. The policy belongs in each rule's definition, and it should be tested by switching the store off in a staging environment.
    - q: How do you support limits per user, per tenant, per route and one global limit at the same time?
      level: Mid
      topics: [/system-design/patterns/rate-limiting, /system-design/fundamentals/api-gateway]
      companies: [Pinterest, Stripe]
      a: |-
        **Short answer.** Treat each limit as its own rule with its own key, check all matching rules for a request, and allow the request only if every one of them allows it.

        **Why.** A rule has three parts: what it matches (route, plan, method), what it counts by (user id, tenant id, nothing for a global limit) and the bucket settings. One request can match four rules and produce four keys: user 7, tenant 3, the search route, and the whole API.

        Check them in a single script call so the cost stays at one round trip. The script should first test all the buckets and only then take a token from each. If it took tokens one by one, a request denied by the tenant rule would still have used up a user token.

        The limits protect different things. Per-user limits stop one script from hurting a team. Per-tenant limits keep one customer inside the plan they pay for. Route limits protect an expensive endpoint. The global limit protects the backend's real capacity.

        **Watch out for.** A global key that every request in the system updates. At 1 million requests a second that single key becomes the bottleneck. Split the global budget into a share per gateway and rebalance the shares every few seconds.
    - q: How would you make the limiter work across several regions?
      level: Senior
      topics: [/system-design/patterns/rate-limiting, /system-design/patterns/consistency-models]
      companies: [Pinterest]
      a: |-
        **Short answer.** Keep counting local to each region and give each region a share of the global limit, then adjust the shares in the background.

        **Why.** A cross-region call takes 50 to 150 ms. Checking one global counter on every request would add that to every API call, and a network split between regions would stop the limiter. So each region runs its own counter store and enforces a regional budget.

        There are two ways to set that budget:

        - **Static split.** A limit of 1,000 a second over three regions becomes about 333 each. It is simple, but a customer whose traffic all enters through one region gets a third of what they pay for.
        - **Dynamic split.** Each region reports its recent use per key every few seconds. A coordinator gives more of the budget to the regions where the key is active.

        Between two syncs a client can exceed the global limit, by at most the amount the regions handed out before they learned of each other's use. With a 5 second sync that is a small, known overshoot.

        **Watch out for.** Promising an exact global limit with low latency in every region. You can have two of exact, fast and available during a network split.
    - q: "Change the problem: one per-user quota is shared by several products and must never be overdrawn. How does the design change?"
      level: Senior
      topics:
        [
          /system-design/patterns/idempotency,
          /system-design/databases/relational-databases,
          /system-design/case-studies/rate-limiter,
        ]
      companies: [Snowflake]
      a: |-
        **Short answer.** This is now closer to an account balance than to a rate limiter. Keep the quota in a database with transactions, and use reserve, confirm and release calls that each carry an idempotency key.

        **Why.** A rate limiter may be off by a few percent. A quota that maps to money or storage may not, so approximate local counters are out. Each user has a row with `total`, `used` and `reserved`.

        - **Reserve** adds the amount to `reserved` only if `used + reserved + amount` stays within `total`. The check and the update run in one transaction, or as one conditional update, so two products asking at the same moment cannot both pass.
        - **Confirm** moves the amount from `reserved` to `used` when the work succeeds.
        - **Release** gives it back when the work fails.

        Every call carries a unique request id that is stored with the reservation. A retry with the same id returns the first result and changes nothing.

        A reservation has an expiry, for example 15 minutes. A sweeper job releases expired ones, so a product that crashed half way does not hold quota forever.

        **Watch out for.** Serving the reserve decision from a cache. A cached balance can be shown on a dashboard, but the decision to spend must read and write the source of truth.
- id: design-metrics-monitoring
  q: Design a metrics and monitoring system that collects metrics from 100,000 servers, draws dashboards and raises alerts.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/case-studies/metrics-and-logging
    - /system-design/databases/time-series-databases
    - /system-design/patterns/message-queues
  companies: [Amazon, Google, LinkedIn, Stripe]
  a: |-
    **Short answer.** Agents on each server send numeric samples to an ingestion tier, which buffers them in a message queue. Writers move them into a time-series database, a store built for values that arrive in time order. A query service reads that store for dashboards, and an alert evaluator runs saved queries every minute and notifies people when a result crosses a threshold.

    **What to clarify.** Metrics only, or logs and traces as well. How often samples are taken. How long data is kept and at what detail. How fresh a dashboard must be. Whether many teams or customers share the system. How quickly an alert must fire after a problem starts.

    **The numbers that drive the design.**

    - Write rate. A time series is one metric name plus one set of labels, such as `cpu_usage` for host 17. 100,000 servers with 500 series each is 50 million active series. One sample every 10 seconds gives 5 million samples a second.
    - Storage. 5 million a second is about 430 billion samples a day. A raw sample is 16 bytes, a timestamp and a value. Time-series compression brings that to about 2 bytes, so a day is close to 0.9 TB.
    - Retention. Keeping 10 second detail for 15 days costs about 13 TB. Keeping one point per minute after that costs a sixth as much per day.

    **Core design.**

    1. An agent on each server gathers samples and sends them in batches every 10 seconds.
    2. Stateless ingestion servers check each batch, apply per-tenant limits, and append it to a message queue partitioned by a hash of the series id.
    3. Writer nodes read the queue. Each keeps the last two hours in memory, with a write-ahead log (a file of recent writes used for recovery after a crash), then writes compressed blocks to disk and later to object storage.
    4. An index maps each label, such as `service=checkout`, to the series ids that carry it, so a query finds its series without a scan.
    5. A background job downsamples old data into one-minute and one-hour points that keep the minimum, maximum, sum and count.
    6. The query service fans a query out to the nodes that hold the series, merges the results, and picks the coarsest resolution that still fills the chart.
    7. The alert evaluator runs each rule on a schedule and sends state changes to a notification service, which groups and routes them to the on-call person.

    **The hardest part.** Cardinality, which means the number of distinct series. Every new label value creates a new series. Adding a label with 1,000 values to a metric that already has 1,000 series produces 1 million. Memory, index size and query cost all grow with the series count, so the system must measure and limit it per tenant.

    **Main trade-off.** Detail against cost. Full resolution for a year answers every question and costs about 320 TB. Downsampling cuts that many times over, but a 20 second spike from three months ago becomes invisible inside a one-minute average. Keeping the maximum next to the average recovers most of the value.

    **What a senior answer adds.** An alerting path that keeps working when the dashboards are down. A clear statement that samples can be lost for a few seconds in a crash, which is acceptable for metrics and would not be for billing data.

    **Watch out for.** Storing samples as rows in a general relational table with an index on time. It works for one team and fails at millions of inserts a second.
  followUps:
    - q: One team adds a label and the number of time series jumps tenfold. How does the system cope?
      level: Senior
      topics: [/system-design/databases/time-series-databases, /system-design/case-studies/metrics-and-logging]
      companies: [LinkedIn]
      a: |-
        **Short answer.** Enforce a series limit per tenant and per metric at ingestion, reject or strip the new series beyond the limit, and tell the owner right away which label caused it.

        **Why.** The usual cause is a label whose values have no bound: a user id, a request id, a full URL path. A metric with 50 series per host gains a label with 10,000 values and now asks for 500,000 series per host. Each active series costs a few kilobytes of memory in the writer and an entry in the index, so the writers run out of memory long before the disks fill.

        The defence has three parts:

        - **Count.** The ingestion tier keeps an approximate count of distinct series per tenant and per metric name.
        - **Limit.** Above the limit, new series are refused while existing ones keep flowing. The team loses the new detail and keeps its dashboards.
        - **Explain.** Show the top metrics and labels by series count, so the owner can find the cause in a minute.

        For labels that are useful but large, offer aggregation at ingestion: drop the label and store the sum over it.

        **Watch out for.** Dropping the whole tenant's data when the limit is hit. The monitoring then fails at the moment the team is debugging a release.
    - q: How are alert rules defined and evaluated?
      level: Mid
      topics: [/system-design/case-studies/metrics-and-logging]
      companies: [Amazon]
      a: |-
        **Short answer.** A rule is a saved query, a condition, a duration and a destination. An evaluator runs the query on a fixed schedule and tracks a small state machine per rule.

        **Why.** An example rule: "error rate of the checkout service, averaged over 5 minutes, is above 2 percent, for 10 minutes, page the payments team". The duration matters. Without it, one bad sample pages someone at night. With it, the rule moves from "ok" to "pending" when the condition first holds, and to "firing" only if it still holds 10 minutes later.

        Evaluators run each rule every 30 or 60 seconds. With 200,000 rules, that is a few thousand queries a second, so rules are spread over many evaluator nodes by a hash of the rule id. Each query is small because it reads only the last few minutes.

        The evaluator sends state changes, not every result, to a notification service. That service removes duplicates, groups related alerts (100 hosts in one rack become one message), applies silences and schedules, and calls the pager or chat tool.

        **Watch out for.** Rules on averages alone. An average latency of 80 ms can hide 5 percent of requests taking 3 seconds, so alert on a high percentile or on the share of slow requests.
    - q: How do you keep alerting reliable when parts of the monitoring system fail?
      level: Senior
      topics: [/system-design/fundamentals/availability, /system-design/case-studies/metrics-and-logging]
      companies: [LinkedIn]
      a: |-
        **Short answer.** Give alerts the shortest path with the fewest dependencies, run it in more than one place, and monitor the monitoring from outside.

        **Why.** Alerts matter most during an incident, and an incident is when shared systems are overloaded. So the alert path should not depend on the dashboard query tier, the long-term storage or the downsampling jobs. Evaluators read recent data directly from the writers' in-memory window, which covers the last two hours and needs no object storage.

        Run each rule on two evaluators in different zones. Losing one alert is far worse than sending two.

        Handle "no data" as a result of its own. If a rule's query returns nothing for three rounds, raise a "data missing" alert. A dead agent or a stalled queue would otherwise look the same as a healthy quiet system.

        Add a heartbeat: one rule that always fires and sends a signal every minute to an external service. If the signal stops, that outside service pages the team.

        **Watch out for.** Sending notifications through infrastructure that the alert is about. If the alert says the company's network is down, a chat message on that network will not arrive. Keep a second channel such as phone calls.
    - q: Ingestion spikes to three times normal, or the message queue has an outage. How do you apply backpressure without losing the important data?
      level: Senior
      topics:
        [
          /system-design/patterns/back-pressure,
          /system-design/patterns/message-queues,
          /system-design/case-studies/metrics-and-logging,
        ]
      companies: [LinkedIn]
      a: |-
        **Short answer.** Buffer at the edges, slow senders down with explicit signals, and shed load by priority when the buffers fill.

        **Why.** Backpressure means a slow stage tells the stage before it to send less. There are three buffers in this design, and each buys time:

        | Buffer | Typical size | What it covers |
        | --- | --- | --- |
        | Agent, local disk | 5 to 30 minutes | Network or ingestion outage |
        | Message queue | Hours | Slow or restarting writers |
        | Writer memory and log | Minutes | Slow disk flush |

        When writers fall behind, the queue grows and nothing is lost. When the queue itself is down, ingestion servers answer agents with "try later" and a delay. Agents keep samples on disk and retry with random spacing, so that 100,000 agents do not all return in the same second.

        If the outage outlasts the buffers, drop by plan. Each tenant has a rate limit, so the one that tripled its volume is throttled first. Metrics marked as used by alerts are kept, and debug-level metrics are dropped. An agent with a full buffer discards its oldest samples, because recent data is worth more during an incident.

        **Watch out for.** Letting ingestion servers hold data in memory while the queue is down. They run out of memory and crash, and a short outage becomes a full one.
    - q: Where would you add caching to keep dashboard queries fast?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/databases/time-series-databases]
      companies: [Stripe]
      a: |-
        **Short answer.** Cache query results split into fixed time blocks, so that a dashboard refresh recomputes only the newest block.

        **Why.** A dashboard showing the last 24 hours refreshes every 30 seconds. Between two refreshes, more than 99 percent of the answer is the same, because data from an hour ago no longer changes. Cut the query range into aligned blocks, for example one hour each, and store each block's result under a key made from the query text, the step size and the block start. A refresh then reads 23 cached blocks and computes one.

        Two more layers help:

        - **Precomputed series.** For a popular but expensive query, such as error rate summed over 5,000 hosts, a rule computes it every minute and stores the answer as a new series. The dashboard reads one series in place of 5,000.
        - **Downsampled data.** A 30 day chart 1,000 pixels wide cannot show 10 second detail. Reading one-hour points cuts the samples scanned by 360 times.

        Many people open the same dashboard during an incident. Merge identical queries that are in flight, so that 200 viewers cause one computation.

        **Watch out for.** Caching the newest block for long. Samples arrive late by seconds or minutes, so the last few minutes should be recomputed on every refresh.
    - q: Should servers push their metrics to the system, or should the system pull them?
      level: Junior
      topics: [/system-design/case-studies/metrics-and-logging, /system-design/fundamentals/http]
      a: |-
        **Short answer.** Both work. Pull is simpler to operate inside one network you control. Push is the better fit for short-lived jobs, devices behind firewalls and a service used by many customers.

        **Why.** With pull, a collector asks each server for its current values over HTTP every 10 seconds. The collector knows the full list of targets, so a server that does not answer is noticed at once. Load is controlled from the centre, because the collector chooses how often to ask.

        With push, an agent on each server sends batches to an ingestion address. Nothing needs to reach into the server, so it works for phones, customer networks and jobs that live for 20 seconds and would be gone before the next pull.

        | | Pull | Push |
        | --- | --- | --- |
        | Detecting a dead server | Built in | Needs a "no data" rule |
        | Short-lived jobs | Often missed | Works |
        | Crossing firewalls | Hard | Easy |
        | Protecting the system from overload | Collector sets the pace | Needs rate limits |

        **Watch out for.** Treating this as the main design decision. The storage, cardinality and alerting questions matter more, so give the choice in one sentence with its reason and move on.
- id: design-url-shortener
  q: Design a URL shortener that turns a long link into a short one and redirects visitors quickly.
  level: Mid
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/case-studies/url-shortener
    - /system-design/patterns/unique-id-generation
    - /system-design/patterns/caching
    - /system-design/databases/key-value-stores
  companies: [Amazon, Microsoft, Oracle]
  a: |-
    **Short answer.** Give every new link a unique number, write that number in base 62 to get a short code, and store "code to long URL" in a key-value store. A redirect is one lookup by key, served mostly from a cache.

    **What to clarify.** Whether users may choose their own code. Whether links expire. Whether click counts are needed and how exact they must be. How long a code may be. Whether the same long URL should always give the same short link.

    **The numbers that drive the design.**

    - Writes. 100 million new links a month is about 40 a second. That is small, and one database could take it.
    - Reads. With 100 redirects for each new link, the average is 4,000 a second and a busy hour may be several times that. Reads decide the design.
    - Storage. A record with the code, the long URL and some metadata is about 500 bytes. Five years of links is 6 billion records, or 3 TB.
    - Code length. Base 62 uses digits and both cases of letters. Seven characters give 62 to the power 7, about 3.5 trillion codes, which is far more than 6 billion.

    **Core design.**

    1. The create call receives a long URL, checks that it is a valid web address and is not on a blocklist of known harmful sites.
    2. The service takes the next id. Each app server holds a block of ids, for example 1,000 at a time, that it claimed from a small coordination store, so creating a link needs no shared counter call.
    3. It encodes the id in base 62 and writes the record with the code as the key.
    4. A visitor requests the short link. The redirect service looks the code up in an in-memory cache, and on a miss reads the database and fills the cache.
    5. It answers with an HTTP redirect to the long URL, and puts a click event on a queue for the analytics pipeline.

    <AnimatedDiagram name="databases/read-scaling" highlight={["app", "cache", "replicas", "primary"]} caption="Redirects read from the cache first and from replicas on a miss, while the few writes go to the primary." />

    **The hardest part.** Creating codes that never collide while many servers create links at the same moment, without a slow shared step. Handing out id ranges solves it: two servers can never hold the same number, so they never produce the same code.

    **Main trade-off.** Counter-based codes against random codes. Codes from a counter are unique by construction and short, but they are guessable: someone can walk through neighbouring codes and read other people's links. Random codes are hard to guess but need a uniqueness check on every write. A middle path is to scramble the counter with a reversible mixing function before encoding.

    **What a senior answer adds.** Counting clicks away from the redirect path, so analytics can never slow a redirect. Abuse handling, because short links hide where they lead: scanning new links and a fast way to disable one. A plan for hot links, where one viral code takes a large share of all reads. Serving redirects from several regions with the data replicated to each.

    **Watch out for.** Spending the interview on the hash function. The write path is tiny. The read path, the cache and the redirect type are where the design is decided.
  followUps:
    - q: Which technique would you use to generate the short code, and what did you reject?
      level: Mid
      topics: [/system-design/patterns/unique-id-generation, /system-design/case-studies/url-shortener]
      companies: [Microsoft]
      a: |-
        **Short answer.** A unique counter value encoded in base 62. I would reject hashing the long URL and reject purely random codes as the default.

        **Why.** The three options compare like this:

        | Method | Unique without a check | Guessable | Notes |
        | --- | --- | --- | --- |
        | Hash of the URL, first 7 characters | No | No | Collisions grow as the table fills |
        | Random 7 characters | No | No | Needs "insert if absent" and a retry |
        | Counter in base 62 | Yes | Yes, unless scrambled | Needs an id source |

        A hash such as MD5 gives 128 bits, and cutting it to 7 characters keeps about 42 bits. With 6 billion links, new codes would often collide with existing ones, and every collision needs a second attempt with a changed input.

        Random codes have the same check, though collisions are rare while the code space is mostly empty: at 6 billion used out of 3.5 trillion, about 1 write in 600 retries.

        The counter never collides. Servers claim ranges of ids from a coordination store, so they do not contact it for each link. To hide the sequence, pass the number through a reversible scramble before encoding it.

        **Watch out for.** Encoding with base 64. Two of its characters, plus and slash, have a special meaning inside a URL.
    - q: Should a redirect use HTTP status 301 or 302?
      level: Junior
      topics: [/system-design/fundamentals/http, /system-design/case-studies/url-shortener]
      a: |-
        **Short answer.** Use 302 if you need click counts or may change or disable a link later. Use 301 only when lower server load matters more than either of those.

        **Why.** Status 301 means "moved permanently". A browser may remember the answer and go straight to the long URL next time, without asking the shortener again. That saves a request, but the service never sees the repeat visit, so the click count is too low. If the link is later disabled because it points to a harmful site, browsers that remembered it still go there.

        Status 302 means "found, for now". The browser asks the shortener on every visit. Each click is counted, and a change to the link takes effect at once. The cost is more requests, and with a cache in front of the database each one is cheap, well under a millisecond of server work.

        A middle choice is a 301 or 302 with a short cache lifetime in the response headers, for example 60 seconds. Repeat visits inside that minute skip the server, and a disabled link stops working within a minute.

        **Watch out for.** Saying one of the two is always correct. The right answer names the product need: analytics and control point to 302.
    - q: How do you make sure the same long URL always returns the same short link?
      level: Mid
      topics: [/system-design/case-studies/url-shortener, /system-design/databases/hash-index]
      a: |-
        **Short answer.** Keep a second lookup from a hash of the long URL to its code, and consult it before creating a new code.

        **Why.** The main table is keyed by code, so it cannot answer "does this URL already have a code" without a full scan. Add a second table, or a secondary index, keyed by a fixed-size hash of the normalised URL. On create, look up the hash. If it exists, return the stored code. If not, create the code and insert both records.

        Two requests for the same new URL can arrive together. Make the insert into the hash table conditional, "insert only if absent". The loser of the race reads the winner's code and returns it.

        Normalise before hashing: lower-case the host name, remove the default port, and decide whether a trailing slash matters.

        First ask whether the product wants this at all. If each user has their own analytics for a link, the same URL shortened by two users must give two codes, and the lookup key becomes user id plus URL hash.

        **Watch out for.** Using the URL hash itself as the short code to get this for free. A 7 character slice of a hash collides between different URLs, which breaks the mapping in the other direction.
    - q: How do links expire, and how is the expired data removed?
      level: Mid
      topics: [/system-design/case-studies/url-shortener, /system-design/databases/key-value-stores]
      a: |-
        **Short answer.** Store an expiry time on each record, refuse expired links at read time, and delete the rows later in the background.

        **Why.** Correctness comes from the read path. The redirect service compares the record's expiry with the current time and answers "gone" (HTTP 410) if it has passed. The link stops working at the right second even if the row still exists.

        Removal is a storage matter and can be slow. Many key-value stores support a time-to-live per record and delete expired records during their normal background work. Without that feature, a daily job scans by expiry date and deletes in small batches so that it does not compete with live traffic.

        The cache needs the same care. Set each cache entry's lifetime to the smaller of the normal cache lifetime and the time left until the link expires. Otherwise a cached entry can keep an expired link alive for hours.

        Decide whether an expired code can be given to a new link. Reuse saves code space, but an old printed link would then lead somewhere unexpected. With 3.5 trillion codes there is no need, so never reuse.

        **Watch out for.** One large delete of everything that expired at midnight. Millions of deletes at once can stall the database. Spread the work out.
    - q: How is the data partitioned, and what happens when a database node fails?
      level: Senior
      topics:
        [
          /system-design/patterns/sharding,
          /system-design/patterns/consistent-hashing,
          /system-design/databases/single-leader-replication,
        ]
      a: |-
        **Short answer.** Partition by a hash of the short code, keep three copies of each partition in different zones, and promote a replica when a leader fails.

        **Why.** Every read is a lookup by code, so the code is the natural partition key. Hashing it spreads links evenly, and no query ever needs more than one partition. 3 TB over 16 partitions is under 200 GB each, which is easy to back up and to rebuild. Consistent hashing, or a fixed number of logical partitions mapped onto nodes, lets you add nodes while moving only a small share of the keys.

        Each partition has a leader that takes writes and two followers. A failed leader triggers a promotion, which takes some seconds. During that time new links for that partition fail or are retried, but redirects continue, because any replica can serve a read and the cache holds the popular codes.

        Replication is usually asynchronous, so a promoted follower may miss the last few writes. For this product that means a handful of links created in the final second return "not found".

        **Watch out for.** Forgetting the id range source. If it is a single node, link creation stops when it fails. Run it as a small replicated group.
    - q: How does the design change for a text sharing service, where each short link points to a stored document of up to 10 MB?
      level: Mid
      topics:
        [
          /system-design/databases/object-storage,
          /system-design/fundamentals/cdn,
          /system-design/patterns/blob-storage-and-chunking,
        ]
      a: |-
        **Short answer.** The code generation stays the same. The content moves to object storage, the database keeps only metadata, and reads are served through a CDN.

        **Why.** A URL record is about 500 bytes. A text document may be 10 MB, which is 20,000 times larger. Storing documents as database values would make backups, replication and caching slow and costly. Object storage is built for large values at low cost, so the record becomes: code, owner, size, expiry, visibility, and the object's location.

        The flows change in three ways:

        - **Upload.** The service returns a short-lived signed upload address, and the client sends the body straight to object storage. App servers never carry the 10 MB.
        - **Read.** Public documents are served through a CDN (a network of caches near users), so popular documents never reach the origin. Private documents need a permission check first and then a signed download address with a short lifetime.
        - **Limits.** Size caps, a rate limit per user, and a scan for harmful content now matter much more, because storage costs real money.

        **Watch out for.** Deleting only the database record on expiry. The object must be removed too, usually with a lifecycle rule in the object store.
- id: design-message-queue
  q: Design a distributed message queue in the style of Kafka, where producers append messages and many consumers read them later.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/case-studies/distributed-message-queue
    - /system-design/patterns/message-queues
    - /system-design/databases/single-leader-replication
    - /system-design/patterns/back-pressure
  companies: [Oracle]
  a: |-
    **Short answer.** Store each topic as several partitions. A partition is an append-only log on disk, copied to three brokers (the queue's servers). Producers append to the end, and each consumer keeps a position in the log, called an offset, and reads forward from it.

    **What to clarify.** Whether messages must be kept after they are read, so they can be replayed. What ordering is needed. Whether losing a message is acceptable, and whether duplicates are. Message size and rate. How long data is retained.

    **The numbers that drive the design.**

    - Throughput. 100,000 messages a second at 1 KB each is 100 MB a second.
    - Storage. That is 8.6 TB a day. Seven days of retention is about 60 TB, and three copies make it 180 TB. At 10 TB of usable disk per broker, the cluster needs at least 18 brokers for storage alone.
    - Partitions. If one partition handles about 10 MB a second comfortably, the topic needs at least 10. Choose more, such as 30, so that 30 consumers can read in parallel.

    **Core design.**

    1. A topic has N partitions. The producer picks a partition by hashing the message key, so all messages with the same key land in the same partition.
    2. Each partition has one leader broker and two followers. The leader appends the message to a segment file on disk and gives it the next offset.
    3. Followers fetch new messages from the leader and append them in the same order. The leader tracks which followers are caught up, the "in-sync" set.
    4. The leader confirms a write to the producer once every in-sync replica has it. Consumers only see messages up to that point.
    5. Consumers join a consumer group. The group shares the partitions among its members, one owner per partition, and each owner saves its offset in the cluster after it has processed a batch.
    6. A small controller group, which uses a consensus protocol to agree, stores the metadata: which brokers are alive, who leads each partition, and the in-sync sets.
    7. Old segment files are deleted when they pass the retention time or size.

    **The hardest part.** Failover without losing confirmed messages. When a leader dies, the controller must pick a new leader from the in-sync set only, because those are the replicas known to hold every confirmed message. A follower that was behind would silently drop data that producers were told is safe.

    **Main trade-off.** Durability against latency and availability. Waiting for all in-sync replicas makes a write survive a broker loss but adds the slowest replica's delay to each write. Confirming after the leader alone is faster and loses the last messages if that leader fails.

    **What a senior answer adds.** Why sequential disk writes and batching make this fast: a disk appends hundreds of megabytes a second, and one network call can carry hundreds of messages. Quotas per producer, so one client cannot fill the disks. Moving partitions between brokers when one is added. A second tier in object storage for old segments, so retention is not bound by broker disks.

    **Watch out for.** Promising one global order for a topic. That needs a single partition, and a single partition has the throughput of one machine.
  followUps:
    - q: What ordering can the queue guarantee, and what does a stronger guarantee cost?
      level: Mid
      topics: [/system-design/patterns/message-queues, /system-design/case-studies/distributed-message-queue]
      a: |-
        **Short answer.** Messages are ordered inside one partition and not across partitions. Send everything that must stay in order with the same key, so it all goes to one partition.

        **Why.** A partition is a single log with one leader, so every message gets an offset and readers see them in offset order. Across partitions there is no shared clock or counter, so two messages in different partitions have no defined order.

        Most systems need order per entity, not across the whole topic. All events for order 5512 must arrive in sequence: created, paid, shipped. Using the order id as the message key gives this.

        The costs of asking for more:

        - **Total order** means one partition, so one broker's write rate and one consumer at a time.
        - **Per-key order** breaks when the partition count changes, because the hash sends a key to a new partition while old messages are still unread in the old one. Plan the count ahead.
        - **Producer retries** can reorder messages if two batches are in flight and the first fails. Give each producer a sequence number per partition, so the broker rejects a batch that arrives out of turn.

        **Watch out for.** A very active key. One customer producing 30 percent of all messages overloads a single partition, and adding partitions does not help.
    - q: How would you let a consumer replay messages from an earlier point?
      level: Mid
      topics: [/system-design/case-studies/distributed-message-queue, /system-design/patterns/cqrs-event-sourcing]
      a: |-
        **Short answer.** Reading never deletes anything. A consumer's position is only a number it owns, so replay means setting that number back and reading forward again.

        **Why.** In a log-based queue the broker keeps messages until retention removes them, whether or not anyone has read them. Each consumer group stores an offset per partition. To replay, the group resets its offset to an older value and continues.

        People usually ask for a time, "replay from 09:00 yesterday", not for an offset. The broker keeps a small index per segment file that maps timestamps to offsets, so it can answer "first offset at or after this time" quickly.

        Replay has limits and side effects:

        - It reaches back only as far as retention. With 7 days kept, day 8 is gone, unless old segments were moved to object storage.
        - Every message in the range is processed again. A consumer that sends emails or charges cards must recognise messages it has handled before, usually by storing processed message ids.
        - A replay reads old data from disk, not from memory, and competes with live traffic. Limit its rate.

        **Watch out for.** Replaying into the live consumer group during business hours. Start a separate group for the replay so the live one does not fall behind.
    - q: Can the queue deliver each message exactly once?
      level: Senior
      topics: [/system-design/patterns/idempotency, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** The network cannot promise exactly-once delivery. What you can build is at-least-once delivery plus duplicate removal, so that each message takes effect once.

        **Why.** There are two places where duplicates or losses appear.

        **Producer to broker.** The producer sends a batch and the reply is lost. If it does not retry, the message may be lost. If it retries, the message may be stored twice. The fix: the broker gives each producer an id, the producer numbers its batches per partition, and the broker drops a batch whose number it has already stored.

        **Broker to consumer.** The consumer processes a message and then saves its offset. A crash between the two means the message is processed again after restart.

        | Order of steps | Result after a crash |
        | --- | --- |
        | Save offset, then process | At most once, may lose |
        | Process, then save offset | At least once, may repeat |
        | Process and save offset in one transaction | Effectively once |

        The third row works when the result and the offset go to the same database in one transaction. When the effect is outside any database, such as an email, use an idempotency key so the receiver ignores the repeat.

        **Watch out for.** Claiming the queue alone solves it. The guarantee always depends on how the consumer writes its results.
    - q: The leader of a partition crashes. Which messages can be lost, and how do you limit that?
      level: Senior
      topics:
        [
          /system-design/databases/single-leader-replication,
          /system-design/databases/sync-vs-async-replication,
          /system-design/patterns/leader-election,
        ]
      a: |-
        **Short answer.** Only messages that the leader had not yet copied to the new leader can be lost. If producers wait for all in-sync replicas before treating a write as done, no confirmed message is lost.

        **Why.** It depends on what the producer asked for:

        | Producer waits for | Loss when the leader crashes | Added latency |
        | --- | --- | --- |
        | Nothing | Anything still in flight | None |
        | Leader only | Messages not yet fetched by followers | Small |
        | All in-sync replicas | No confirmed message | Slowest in-sync replica |

        The in-sync set can shrink. If both followers fall behind, the leader removes them from the set, and "all in-sync replicas" then means the leader alone. So add a second setting: a minimum in-sync count of 2. With fewer than 2, the partition refuses writes. That trades availability for safety, and it should be a choice per topic.

        On failover the controller picks the new leader from the in-sync set. The other replicas cut their logs back to the last confirmed offset and then follow the new leader, so all copies agree again.

        **Watch out for.** Assuming a write to disk is on disk. Brokers often leave flushing to the operating system, so durability comes from having copies on several machines in different zones.
    - q: One consumer is much slower than the producers. What happens, and how does a consumer group cope?
      level: Mid
      topics: [/system-design/patterns/back-pressure, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** Nothing breaks at first, because the log absorbs the difference. The consumer's lag grows, and if it grows past the retention window, unread messages are deleted. The fix is more consumers in the group, up to the number of partitions.

        **Why.** Consumers pull. They ask for the next batch when they are ready, so a slow consumer is never flooded. The gap between the newest offset and the consumer's offset is called lag, and it is the main health number for a consumer. Producing 10,000 a second and consuming 8,000 adds 2,000 a second of lag, which is 7.2 million messages an hour.

        A consumer group shares the work. Each partition is owned by exactly one member. With 30 partitions, up to 30 members can work in parallel, and a 31st would sit idle.

        When a member joins, leaves or stops sending heartbeats, the group reassigns partitions. This is a rebalance. During it, the affected partitions pause, and the new owner resumes from the last saved offset, so a few messages may be processed twice.

        **Watch out for.** A consumer that takes longer to process one batch than the heartbeat timeout. The group thinks it is dead, reassigns its partitions, and the next owner hits the same slow batch. Keep batches small or raise the timeout.
    - q: How would the design differ for a job queue in the style of SQS, where each message goes to one worker and is deleted after it is handled?
      level: Mid
      topics: [/system-design/patterns/message-queues, /system-design/case-studies/distributed-message-queue]
      a: |-
        **Short answer.** The broker tracks the state of each message, not one offset per consumer. A worker receives a message, the message becomes invisible for a set time, and the worker deletes it when done. If no delete arrives, the message becomes visible again.

        **Why.** A log suits many readers that each want the full stream. A job queue suits a pool of identical workers that each want the next free task.

        | | Log style | Job queue style |
        | --- | --- | --- |
        | State kept | One offset per group and partition | Status per message |
        | After processing | Message stays until retention | Message is deleted |
        | Order | Per partition | Best effort, or per group at lower throughput |
        | Parallel workers | Limited by partitions | Any number |
        | One slow message | Blocks its partition | Blocks nothing |

        The invisibility period is called a visibility timeout. If it is 30 seconds and a job takes 45, the message reappears and a second worker starts the same job. Workers must extend the timeout for long jobs, and jobs must be safe to run twice.

        A message that fails again and again is moved to a dead-letter queue after a set number of receives, for example 5.

        **Watch out for.** Picking one style for every need. Many systems run both: a log for events and a job queue for tasks.
- id: design-logging
  q: Design a system that collects logs from thousands of services and lets engineers search them within seconds.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/case-studies/metrics-and-logging
    - /system-design/databases/inverted-index
    - /system-design/databases/search-engines
    - /system-design/databases/object-storage
  companies: [Datadog, Microsoft]
  a: |-
    **Short answer.** An agent on each host follows the log files and ships lines in batches to an ingestion tier. A message queue buffers them. Indexers parse each line, add it to a searchable index for recent days, and write compressed copies to object storage for long retention. A query service searches the index and streams back matches.

    **What to clarify.** Volume per day and the size of a line. How soon a line must be searchable. How long logs are kept, and whether old logs need the same search speed. Free-text search or only filters on fields. Whether some logs are audit records that must never be lost or changed. How many teams share the system.

    **The numbers that drive the design.**

    - Ingest. 5 billion lines a day at 300 bytes is 1.5 TB of raw text a day. The average is about 58,000 lines a second, and a peak of three times that is about 175,000.
    - Hot storage. A full-text index is roughly the size of the raw text. Seven searchable days with one replica is about 1.5 TB times 7 times 2, so 21 TB of fast disk.
    - Cold storage. Log text compresses about 10 times. A year in object storage is about 55 TB, far cheaper per TB than the hot tier.

    **Core design.**

    1. The agent reads new lines from each file and remembers its position in a small local file, so a restart continues where it stopped. It adds host, service and environment fields and sends compressed batches.
    2. Ingestion servers authenticate the sender, apply a quota per tenant, and append the batch to a message queue partitioned by tenant and service.
    3. Indexers read the queue. They parse each line into a timestamp, a level, a message and named fields, and remove secrets such as card numbers by pattern.
    4. Each line goes into the index for its time bucket, for example one index per tenant per day. The index is an inverted index: for every word, a list of the lines that contain it.
    5. A second consumer writes the same lines to object storage as compressed files grouped by tenant, service and hour.
    6. A query names a time range and a filter. The query service picks only the buckets inside the range, sends the search to those shards in parallel, and merges the newest matches first.
    7. Daily indexes older than the hot period are dropped whole. Older searches run as slower scans over the object storage files.

    **The hardest part.** Cost. Indexing every word of every line makes search fast and makes the index as large as the data. Most lines are never searched. The design has to decide what gets a full index, what gets only field labels, and what is merely kept.

    **Main trade-off.** Search speed against storage cost. A full index answers "find this request id" in under a second and needs fast disks for everything. Indexing only a few labels and scanning the compressed text at query time cuts storage many times over, but a search with no good label over a day of data can take a minute.

    **What a senior answer adds.** Isolation, so one team's logging loop cannot delay everyone else. Sampling rules for high-volume debug lines. Access control, because logs contain personal data. A separate, stricter path for audit logs. Measuring the pipeline's own delay from "line written" to "line searchable".

    **Watch out for.** Having services send logs straight to the search cluster. A slow cluster would then slow or block the services that are trying to log.
  followUps:
    - q: Volume grows to tens of billions of lines a day and the index is too expensive. What do you change?
      level: Senior
      topics:
        [
          /system-design/databases/inverted-index,
          /system-design/databases/object-storage,
          /system-design/case-studies/metrics-and-logging,
        ]
      companies: [Datadog]
      a: |-
        **Short answer.** Stop indexing every word. Index a small set of labels, store the text in compressed chunks in object storage, and scan only the chunks that the labels and time range select.

        **Why.** At 50 billion lines a day the raw text is 15 TB a day, and a full index of similar size on replicated fast disks for a week is over 200 TB.

        The cheaper layout has two parts:

        - A small index over labels such as tenant, service, environment and level. It maps each label combination and time window to a list of chunk files.
        - Chunks of a few megabytes of compressed lines for one label combination, kept in object storage.

        A query such as "checkout service, errors, last hour, containing timeout" uses the index to find perhaps 200 chunks and scans them in parallel across many workers. A narrow query still returns in seconds.

        One addition recovers speed for common searches. A Bloom filter per chunk for values like request ids lets the scan skip chunks that cannot contain the value.

        **Watch out for.** Putting a field with unbounded values, such as user id, into the labels. Each value creates its own tiny chunks and the label index becomes the new cost problem.
    - q: How would you support live tail, where an engineer watches new log lines appear as they are written?
      level: Mid
      topics:
        [
          /system-design/fundamentals/server-sent-events,
          /system-design/fundamentals/choosing-realtime,
          /system-design/patterns/message-queues,
        ]
      a: |-
        **Short answer.** Serve live tail from the stream, not from the index. A tail service reads the message queue, applies the user's filter in memory, and pushes matching lines to the browser over a long-lived connection.

        **Why.** Indexed search has a delay of several seconds, because indexes are made searchable in small batches. Tail wants a line on screen within about a second of being written, and it never needs old data. So the two paths split after the queue.

        The tail service is one more consumer of the queue. When an engineer opens a tail with a filter such as "service is checkout and level is error", the service registers the filter against the partitions for that tenant and service. Each arriving line is tested against the active filters for its partition. Matches go to the browser over server-sent events, a one-way stream from server to browser over plain HTTP.

        Protect the viewer and the service. A filter that matches 20,000 lines a second cannot be read by a person. Cap the stream at a few hundred lines a second and send a "lines skipped" count.

        **Watch out for.** Implementing tail as a search repeated every second. It doubles the load on the index and still shows lines late.
    - q: "A stream job must keep a count of error logs per service over the last 5 minutes and alert when it crosses a threshold. How do you implement the sliding window?"
      level: Mid
      topics: [/system-design/case-studies/metrics-and-logging, /system-design/patterns/rate-limiting]
      companies: [Microsoft]
      a: |-
        **Short answer.** Keep small time buckets per service, for example one counter per 10 seconds, and report the sum of the buckets that fall inside the last 5 minutes.

        **Why.** Storing every error's timestamp is exact, but its memory grows with the error rate. A 5 minute window with 10 second buckets is 30 counters per service, whatever the traffic.

        The steps for each error line:

        1. Work out the bucket from the line's own timestamp: the time in seconds divided by 10, rounded down.
        2. Add one to that bucket for the line's service.
        3. Keep a running total per service. Add one to it now, and subtract a bucket's count when that bucket becomes older than 5 minutes.

        A ring of 30 slots per service makes step 3 cheap: the slot for a new bucket replaces the oldest one. The moving average over several windows is the running total divided by the number of buckets.

        The count is off by at most one bucket of data at the window's edge. Lines arrive late, so accept them up to a set lateness, such as 30 seconds.

        **Watch out for.** Using the arrival time in place of the time in the log line. After a queue delay, an old burst of errors would be counted as happening now.
    - q: Some of these logs are audit records of who accessed what. How do you detect tampering?
      level: Senior
      topics:
        [
          /system-design/fundamentals/encryption-and-hashing,
          /system-design/fundamentals/security,
          /system-design/databases/object-storage,
        ]
      a: |-
        **Short answer.** Make the log append-only, link each record to the one before it with a hash, and store regular checkpoints of that chain somewhere the log's own operators cannot write.

        **Why.** A hash function turns any data into a short fixed-size fingerprint that changes completely if one byte changes. Each audit record stores the hash of the previous record. The hash of record 1,000 therefore depends on all 999 records before it. Editing or removing an old record changes every later hash, so the chain no longer matches.

        An attacker with full write access could rebuild the whole chain after an edit. Two measures block that:

        - **External checkpoints.** Every few minutes, sign the latest chain hash with a key held in a separate key service and copy it to a different account or system. A rebuilt chain will not match the stored checkpoints.
        - **Write-once storage.** Keep the records in object storage with a retention lock, a setting that refuses deletes and overwrites until a date, even from administrators.

        A verifier job walks the chain daily and compares it with the checkpoints.

        **Watch out for.** Calling this prevention. It is detection. It proves that a change happened, and it must be paired with tight access control on who can write at all.
    - q: How do you handle retention so that queries stay fast and old data is cheap to remove?
      level: Mid
      topics:
        [
          /system-design/case-studies/metrics-and-logging,
          /system-design/patterns/sharding,
          /system-design/fundamentals/storage-types,
        ]
      a: |-
        **Short answer.** Partition everything by time. A query touches only the time buckets in its range, and retention deletes whole buckets.

        **Why.** Nearly every log query has a time range, and most ask for the last hour. If each day, or each hour for large tenants, is its own index or folder, a query for the last hour opens one bucket out of hundreds.

        Time buckets also make deletion nearly free. Removing one line at a time from an index is slow and leaves holes that need later clean-up. Dropping a whole day's index is a single cheap operation. For 30 day retention, a daily job drops the bucket from 31 days ago.

        Tiers keep the cost down:

        | Age | Where | Query speed |
        | --- | --- | --- |
        | 0 to 7 days | Indexed, fast disks | Seconds |
        | 7 to 30 days | Indexed, cheaper disks, no replica | Tens of seconds |
        | Over 30 days | Compressed files in object storage | Minutes, on request |

        Different tenants and log types have different rules. Debug logs may live 3 days and audit logs 7 years, so retention is a setting per tenant and stream.

        **Watch out for.** A legal request to delete one person's data. Bucket deletion does not cover it, so know which fields hold personal data and keep them out of logs or tokenised.
    - q: How do you monitor the logging system itself?
      level: Senior
      topics: [/system-design/case-studies/metrics-and-logging, /system-design/fundamentals/availability]
      companies: [Datadog]
      a: |-
        **Short answer.** Measure the delay and the loss between each pair of stages, send those measurements to a separate small monitoring stack, and test the whole path with synthetic log lines.

        **Why.** If the logging system reports its own health only through itself, the report disappears when it fails. So its metrics go to a metrics system that shares as little as possible with it.

        The numbers worth watching:

        - **End-to-end delay.** The time from a line's own timestamp to the moment it is searchable. A target might be under 15 seconds for 99 percent of lines.
        - **Queue lag** per partition. Growing lag means the indexers are too slow, and it is the earliest warning.
        - **Loss.** Agents count lines sent and indexers count lines stored, per tenant and per minute. The two counts should match.
        - **Rejections.** Batches refused by quotas or by parse errors, per tenant.
        - **Query latency** and the share of queries that time out.

        Add a canary: a small job that writes a line with a unique id every minute, then searches for it. This checks the full path as a user sees it.

        **Watch out for.** Logging the pipeline's errors into the pipeline. One failure then produces more logs, which produce more failures.
- id: design-authorization
  q: Design an authorization service that other services call to ask "may this user do this action on this resource".
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/fundamentals/api-auth
    - /system-design/patterns/caching
    - /system-design/fundamentals/security
    - /system-design/patterns/consistency-models
  companies: [Snowflake]
  a: |-
    **Short answer.** Split the system in two. A management side stores roles, grants and policies in a database and changes rarely. An enforcement side answers checks from an in-memory copy of that data, close to the calling services, and receives changes as a stream within seconds.

    **What to clarify.** Authentication proves who the caller is. Authorization decides what they may do, and only the second is in scope. Then ask about the permission model: roles only, or grants on single resources too. Whether deny rules exist. How fast a removed permission must stop working. The check rate and the latency allowed. What should happen when the service is down.

    **The numbers that drive the design.**

    - Check rate. 30,000 API requests a second with about 3 checks each is roughly 100,000 checks a second. Policy changes are perhaps 100 a second. Reads outnumber writes 1,000 to 1.
    - Latency. A check sits inside every request, so it must take a few milliseconds at most. A database query per check is too slow, so decisions come from memory.
    - Data size. 10 million users with 20 grants each is 200 million records. At about 100 bytes each that is 20 GB, which fits in the memory of one large node.

    **Core design.**

    1. The policy store is a relational database, the source of truth. It holds role definitions (role "editor" allows "document.edit"), grants ("user 42 has role editor on folder 9") and the resource hierarchy ("document 77 is in folder 9").
    2. Every change goes through a management API that checks whether the caller may grant that permission, writes the change in a transaction, and records it in an audit log.
    3. Each committed change gets a version number that only goes up, and is published to a change stream.
    4. Decision nodes load a snapshot, then follow the stream. They hold the grants in memory, indexed by user and by resource.
    5. A check call carries the user, the action and the resource. The node collects the user's grants on the resource and on its parents, applies the rules, and returns allow or deny with the policy version it used.
    6. Calling services reach decision nodes through a client library that caches answers for a few seconds.

    **The hardest part.** Fast checks and fast revocation pull in opposite directions. Every cache makes checks faster and makes a removed permission live longer. The design needs a stated bound, such as "a revoked grant stops working within 10 seconds", and every cache lifetime and replication delay must fit inside it.

    **Main trade-off.** A central service against checks embedded in each service. Central gives one model, one audit trail and one place to fix a bug, at the price of a network call and a shared dependency. Embedding policy data in each service removes the call but spreads the logic over many codebases and versions.

    **What a senior answer adds.** A way to read your own change: after a grant, the caller passes the new version number and the decision node waits until it has caught up. Decision logs for audits. A dry-run mode that evaluates a new policy beside the old one and reports differences before it is enforced. A defined answer for failure, which is usually deny.

    **Watch out for.** Putting the full permission list inside a login token that lives for hours. The token cannot be changed after it is issued, so a revoked permission keeps working until it expires.
  followUps:
    - q: What is the difference between role-based and resource-based permissions, and how do you support both?
      level: Junior
      topics: [/system-design/fundamentals/api-auth, /system-design/fundamentals/security]
      a: |-
        **Short answer.** A role-based permission gives a user a named set of actions, such as "editor". A resource-based permission attaches a grant to one specific object, such as "user 42 may edit document 77". Support both by making every grant a triple of who, which role, and on what scope.

        **Why.** Roles keep administration simple. A company with 5,000 employees might need 30 roles, and changing what "editor" means updates everyone at once. Roles alone are too coarse for sharing: an editor of everything is not the same as an editor of one document.

        Resource-based grants give the fine control, but there are many of them. 10 million documents shared with 5 people each is 50 million grants.

        One model covers both. A grant says "subject S has role R on scope X". The subject is a user or a group. The scope is the whole organisation, a folder, or one document. A role granted on the organisation behaves like classic role-based access. A role granted on one document is a resource-based permission.

        **Watch out for.** Creating a new role for every exception, such as "editor except billing". The role list grows until nobody understands it. Use a narrower scope in place of a new role.
    - q: Decisions are cached for speed. How do you guarantee that a revoked permission stops working within a fixed time?
      level: Senior
      topics:
        [
          /system-design/patterns/caching,
          /system-design/patterns/consistency-models,
          /system-design/fundamentals/api-auth,
        ]
      a: |-
        **Short answer.** Set a revocation bound, give every cache a lifetime shorter than that bound, and push invalidations so that the typical case is much faster than the worst case.

        **Why.** Add up the path of a revocation. The write commits, the change stream delivers it to decision nodes, and client-side caches expire. If the bound is 10 seconds, a possible budget is 2 seconds for the stream, 5 seconds of client cache lifetime, and 3 seconds spare.

        Expiry alone gives the worst case. To do better, decision nodes send an invalidation message for the affected user to connected clients, which drop cached answers for that user at once.

        A decision node that has lost its stream is the dangerous case. It keeps answering from old data and does not know. Each node tracks the time of the last stream message, including regular heartbeats. If nothing has arrived for longer than the budget, the node stops answering and callers move to another node.

        For the few actions where even seconds are too long, such as deleting an account's data, skip the caches and check against the primary store.

        **Watch out for.** Caching deny answers longer than allow answers. A user who was just granted access keeps being refused and reports a bug.
    - q: A user gets permissions through several roles and groups, and deny rules must win over allow rules. How do you evaluate a check?
      level: Mid
      topics: [/system-design/databases/graph-databases, /system-design/fundamentals/security]
      a: |-
        **Short answer.** Collect every rule that applies to the user through any group or role, then decide in a fixed order: any matching deny means deny, otherwise any matching allow means allow, otherwise deny.

        **Why.** Group and role membership form a graph. A user belongs to groups, groups sit inside other groups, and roles may include other roles. To find what applies, start at the user and walk outwards, keeping a set of visited nodes so that a cycle (group A contains B, B contains A) cannot loop forever.

        Do the same for the resource: the document, its folder, the parent folder, the organisation. The rules that matter are those where a subject from the first walk meets a scope from the second walk for the requested action.

        A fixed order makes the result independent of the order in which rules were found or written. "Deny wins" also means an administrator can block something with one rule and be certain it holds.

        Walking the graph on each check is slow for a user in 200 groups. Precompute each user's flattened set of groups when membership changes, so that a check becomes a few hash lookups.

        **Watch out for.** Default allow. If no rule matches, the answer must be deny, or a missing rule turns into open access.
    - q: The authorization service is slow or unreachable. What do the calling services do?
      level: Senior
      topics:
        [
          /system-design/fundamentals/availability,
          /system-design/patterns/circuit-breaker-and-retries,
          /system-design/patterns/caching,
        ]
      a: |-
        **Short answer.** Deny by default, but design the service so that this is rare: many decision nodes in every zone, a short timeout with one retry on another node, and a limited period of serving recent cached answers.

        **Why.** A rate limiter can let traffic through when it fails. An authorization service cannot, because "allow when unsure" means anyone can read anything during an outage. So the failure answer is deny, and a full outage of this service is an outage of everything behind it.

        The measures that keep it up:

        - Decision nodes answer from memory, so they keep working when the policy database is down. Only changes stop.
        - Checks are read-only, so a retry on a second node is safe. Use a timeout of about 10 ms and then retry once.
        - Run nodes in every zone and region where callers run, so that a network problem between zones does not cut callers off.

        As a last layer, the client library may serve an answer it cached within the last few minutes while the service is unreachable. Offer it per action, on for reading a dashboard and off for moving money.

        **Watch out for.** Retries without a limit. Every caller retrying three times turns a slow service into one receiving three times the load.
    - q: How would you roll this service out across a fleet of existing services that each have their own permission code?
      level: Senior
      topics: [/system-design/fundamentals/security, /system-design/fundamentals/api-auth]
      a: |-
        **Short answer.** Run the new check beside the old one in shadow mode, compare the two answers on real traffic, fix the differences, and only then switch enforcement, one service and one small share of traffic at a time.

        **Why.** A wrong deny breaks a product and a wrong allow is a security incident. Neither is acceptable to discover in production, so the rollout is built to find differences before they matter.

        1. **Import.** Copy each service's existing roles and grants into the new model and keep them in sync while both systems live.
        2. **Shadow.** The service still enforces its old code. It also calls the new service and logs both answers.
        3. **Compare.** A report lists every mismatch by service, action and rule.
        4. **Enforce.** Switch to the new answer behind a flag: 1 percent of requests, then 10, then all. Keep the old code path so the flag can be turned back in seconds.
        5. **Remove.** Delete the old code after a quiet period.

        Teams adopt faster when it costs them little: a client library with a one-line check, a dashboard of their own mismatches, and a named owner for questions.

        **Watch out for.** Leaving both systems in place for a year. Two sources of truth drift apart, so every stage needs a deadline.
- id: design-ad-frequency-capping
  q: Design an ad frequency capping service that limits how many times one user sees the same ad or campaign in a time window.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/rate-limiting
    - /system-design/patterns/caching
    - /system-design/databases/key-value-stores
    - /system-design/patterns/idempotency
  companies: [Netflix]
  a: |-
    **Short answer.** Keep a counter per user and campaign in a fast in-memory store. The ad server reads all of a user's counters in one call, removes the ads that have reached their cap, and picks from the rest. When the ad is really shown, an impression event increments the counter.

    **What to clarify.** What is capped: an ad, a campaign or an advertiser. Which windows exist, such as 3 per day and 10 per week. Whether a cap may be exceeded by one now and then or is a hard rule. Whether a user is one profile across devices. How much time the ad decision allows. Whether a count happens when the ad is chosen or when it is displayed.

    **The numbers that drive the design.**

    - Decisions. 50 million daily users with 20 ad breaks each is 1 billion decisions a day, about 12,000 a second on average and perhaps 35,000 at the evening peak.
    - Reads. Each decision weighs around 20 candidate ads. Reading 20 counters one by one would be 700,000 reads a second, so all of a user's counters must come back in one call.
    - Memory. 50 million users with 30 active counters of about 50 bytes each is 75 GB. That fits in a small cluster of in-memory nodes.
    - Latency. The whole ad decision often has 100 ms or less. The cap lookup can take a few milliseconds of that.

    **Core design.**

    1. Cap rules are part of campaign settings: "campaign 7, at most 3 per user per day". Ad servers hold all rules in memory.
    2. Counters live in an in-memory key-value cluster, split by user id. One user's counters sit together in one hash structure, so a single read returns them all.
    3. At decision time the ad server fetches the user's counters, drops each candidate whose count has reached its cap, and runs the auction on the rest.
    4. When the player reports that the ad started, an impression event with a unique id goes to the capping service, which increments the counter for each window and sets its expiry.
    5. The same event goes onto a message queue for the offline path: billing, reporting, and a durable store that can rebuild the counters after a failure.

    **The hardest part.** The gap between the check and the increment. A user with two devices, or two ad slots in one break, can cause two decisions that both read "2 of 3" and both choose the ad. The count ends at 4. Closing that gap needs either a reservation at decision time or an atomic check-and-increment.

    **Main trade-off.** Strictness against speed and revenue. Counting when the ad is selected is strict but counts ads that never played, so the campaign is shown less than it paid for. Counting on the impression is accurate for billing but allows a small overshoot. Most caps accept one extra view. A few contractual ones do not.

    **What a senior answer adds.** Duplicate-safe increments, because players retry impression events. A choice for failures: if the counter store is down, serve only campaigns without caps. Privacy rules about how long per-user history is kept. Handling of users who are not signed in.

    **Watch out for.** Keeping counters in the main campaign database. It cannot take tens of thousands of small updates a second next to its normal work.
  followUps:
    - q: How would you design the counter key?
      level: Mid
      topics: [/system-design/databases/key-value-stores, /system-design/patterns/rate-limiting]
      companies: [Netflix]
      a: |-
        **Short answer.** One top-level key per user, holding a small map. Each entry in the map is named by the capped thing, the window type and the window start, and its value is the count.

        **Why.** The read pattern decides the key. At decision time the ad server wants every counter for one user, so they should come back in one call. A top-level key such as `fc:user:42` with a hash map inside does that. Entries look like `c7:d:20261110` for campaign 7, daily window, 10 November, and `c7:w:2026w46` for the weekly window.

        Putting the window start into the entry name means a new day starts a new entry at zero, with no reset job. Old entries need removal. Some stores expire only whole keys, so either use a store with expiry per field, or split into one key per user per day and let the whole key expire a little after the window ends.

        Keep names short. With 1.5 billion entries, each extra 10 bytes of key text costs 15 GB of memory.

        **Watch out for.** A key per campaign with users inside. A popular campaign would hold tens of millions of entries under one key, on one node, updated by every impression.
    - q: Why must the check and the increment be atomic, and how do you make them so?
      level: Senior
      topics: [/system-design/patterns/rate-limiting, /system-design/databases/key-value-stores]
      companies: [Netflix]
      a: |-
        **Short answer.** Without atomicity two requests can both read a count below the cap and both proceed. Run "increment only if below the cap" as one script inside the store, so no other command for that user runs in between.

        **Why.** Take a cap of 3 with the count at 2. A phone and a TV on the same account request an ad within the same 10 ms. Both read 2, both see room, both serve, and both add 1. The user has seen the ad 4 times.

        Atomic means the read, the comparison and the write happen as one step. An in-memory store that runs commands on one thread per shard can run a short server-side script that way. The script reads the entry, compares it with the cap passed in, increments and returns "granted" if there is room, and returns "refused" otherwise.

        At decision time this acts as a reservation. If the ad never plays, release the reservation, or give it a short expiry such as 2 minutes so that it clears itself.

        **Watch out for.** Using this strict path for every cap. It adds a write to the decision path for each chosen ad. Keep it for caps that need it.
    - q: What changes if the cap is a rolling 24 hours and not a calendar day?
      level: Mid
      topics: [/system-design/patterns/rate-limiting]
      companies: [Netflix]
      a: |-
        **Short answer.** A calendar-day cap needs one counter that starts again at midnight. A rolling cap needs to know when the views happened, so you store either the timestamps or a set of small time buckets.

        **Why.** With a fixed day, a user can see an ad 3 times at 23:50 and 3 more at 00:05. That is 6 views in 15 minutes under a "3 per day" cap. A rolling window asks "how many in the 24 hours before now" and has no such edge.

        | Approach | Storage per user and campaign | Accuracy |
        | --- | --- | --- |
        | Fixed window counter | 1 number | Edge effect at reset |
        | List of timestamps | 1 entry per view, up to the cap | Exact |
        | Hourly buckets | Up to 24 small counters | Off by up to 1 hour |

        Frequency caps are small numbers, usually 1 to 10. Storing at most that many timestamps per user and campaign is cheap, so the exact method is practical here. To check, drop timestamps older than 24 hours and count the rest.

        A fixed window also has a time zone question: whose midnight. Use the user's local day or state clearly that the day is in UTC.

        **Watch out for.** Assuming advertisers always want rolling windows. Reports are by calendar day, and a cap that matches the report is easier to explain.
    - q: How do caps work when one user watches on several devices?
      level: Mid
      topics: [/system-design/patterns/consistency-models, /system-design/databases/key-value-stores]
      companies: [Netflix]
      a: |-
        **Short answer.** Key the counters by the account or profile id, not the device id, and keep one shared counter store that all devices' requests reach.

        **Why.** If the counter is per device, a user with a TV, a phone and a tablet can see a "3 per day" ad 9 times. A signed-in service has a stable identity, so the counter key uses it.

        Requests from different devices can land in different regions. Two choices exist:

        - **Home region.** Each user's counters live in one region and all decisions for that user read them there. It is exact, but a cross-region read may add tens of milliseconds.
        - **Replicated counters.** Each region keeps a copy and the regions exchange increments within a second or two. Reads are local and fast, and a cap can be exceeded by one in the rare case of two devices in two regions at the same moment.

        For users who are not signed in, only a device id exists. Cap per device there and accept that it is weaker.

        **Watch out for.** Merging replicated counters by keeping the latest value. Two regions that each added one would end up with one increment lost. Keep a count per region and sum them.
    - q: An advertiser's contract says a user must see an ad at most once per day, with no exceptions. How do you enforce that strictly?
      level: Senior
      topics:
        [
          /system-design/patterns/idempotency,
          /system-design/patterns/consistency-models,
          /system-design/patterns/rate-limiting,
        ]
      companies: [Netflix]
      a: |-
        **Short answer.** Reserve the view at decision time with an atomic "set if absent" in a single authoritative place for that user, and fail closed: if the reservation cannot be confirmed, do not serve that ad.

        **Why.** A hard cap of one is a uniqueness problem. The key is user, campaign and day. The ad server tries to create it with a conditional write that succeeds only if the key does not exist. Exactly one request can win.

        Strictness adds three requirements:

        - **One authority.** The write must go to the user's home region or to a store with strong consistency. Replicated copies that sync later could each accept one write.
        - **Fail closed.** On a timeout the server does not know whether the write happened. It must treat the ad as used and pick another.
        - **Durability.** If the node loses its memory and restarts empty, every user looks new. The reservation must be replicated to a second node before it counts, or rebuilt from the impression log before serving resumes.

        Reserving at decision time means an ad that failed to play still uses up the single allowed view.

        **Watch out for.** Applying this to all campaigns. It adds a strongly consistent write to the decision path, so keep it for the campaigns that pay for the guarantee.
    - q: The same system must also pace each campaign's budget over its flight dates. How do pacing and frequency capping work together?
      level: Senior
      topics: [/system-design/patterns/rate-limiting, /system-design/patterns/sharding, /system-design/patterns/caching]
      companies: [Netflix]
      a: |-
        **Short answer.** They are two separate filters on the same candidate list. Pacing answers "may this campaign spend now", using one counter per campaign. Capping answers "may this user see it", using one counter per user. An ad must pass both.

        **Why.** A frequency counter is touched by one user, so it is never busy. A campaign budget counter is touched by every impression of that campaign, so for a large campaign it is a hot key with thousands of updates a second.

        Do not update the budget on a central counter per impression. A pacing controller runs every minute or so. It compares actual spend with the planned curve and hands each ad server a small allowance for the next interval, or a serving probability. Ad servers spend their allowance locally and report back. The possible overspend is bounded by the allowances currently handed out.

        Order of checks: apply targeting and the pacing filter first, because both use data already in the ad server's memory. Then fetch the user's frequency counters once and filter.

        **Watch out for.** A traffic spike such as a live event. A fixed serving probability at five times the traffic spends five times as fast, so give out budget as amounts of money or impressions, not as rates.
- id: design-migration
  q: A live service stores 2 TB in a relational database. Plan a migration to a new datastore with no downtime and no lost writes.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/databases/choosing-a-database
    - /system-design/databases/single-leader-replication
    - /system-design/patterns/idempotency
    - /system-design/databases/sync-vs-async-replication
  companies: [Apple, Oracle]
  a: |-
    **Short answer.** Copy a snapshot of the old store into the new one, then replay every change made since the snapshot from the old store's change log until the new store is seconds behind. Compare the two, move reads over gradually, then move writes in one short controlled step, and keep a way back.

    **What to clarify.** Why the migration is happening, because that sets the target data model. Whether a pause in writes of a few seconds is acceptable. Whether the data model changes or only the engine. Which other systems read the old database directly. How long both stores can be paid for. What counts as proof that the data matches.

    **The numbers that drive the design.**

    - Copy time. 2 TB at a steady 50 MB a second takes 40,000 seconds, about 11 hours. Throttled to protect live traffic, plan for a day or more.
    - Changes during the copy. At 2,000 writes a second, 11 hours produce about 80 million changes. The new store must replay them faster than new ones arrive, or it never catches up.
    - Rows to verify. At 500 bytes a row, 2 TB is about 4 billion rows. Comparing row by row over the network is slow, so compare checksums of ranges.

    **Core design.**

    1. **Prepare.** Put all data access behind one module or service, so that the switch happens in one place. Create the schema in the new store.
    2. **Snapshot.** Note the position in the old store's change log, then copy all rows in key-range chunks from a replica. Each chunk can be retried.
    3. **Catch up.** A change data capture process reads the log from the noted position and applies every insert, update and delete to the new store in order. Applying a change twice must give the same result.
    4. **Verify.** A job compares checksums per key range and repairs differences. Run it until it reports zero.
    5. **Shadow reads.** The service reads from both stores, returns the old answer, and logs any mismatch and the new store's latency.
    6. **Move reads.** Send 1 percent of reads to the new store, then 10, then all, behind a flag.
    7. **Move writes.** Stop writes to the old store for a few seconds, wait for the replay to reach the end of the log, and switch the write flag to the new store.
    8. **Reverse sync.** Start replicating from new to old, so the old store stays usable as a fallback for a week or two. Then retire it.

    **The hardest part.** The write cutover. At any instant exactly one store must be the source of truth. If both accept writes for the same record, the copies diverge and there is no automatic way to tell which is right.

    **Main trade-off.** A brief write pause against complexity. Pausing writes for a few seconds makes the switch simple and provably correct. Avoiding even that pause needs dual writes or two-way sync with conflict rules, which is far harder to get right. Most services can queue or retry writes for 10 seconds.

    **What a senior answer adds.** A rehearsal on a production-sized copy. Go and no-go numbers written down before the day. Load testing the new store with real read traffic through shadow reads. A list of every hidden consumer of the old database, such as reports and batch jobs.

    **Watch out for.** Treating the copy as the project. The copy is the easy part, and the proof and the way back are most of the work.
  followUps:
    - q: Why not have the application write to both stores during the migration?
      level: Senior
      topics:
        [
          /system-design/patterns/idempotency,
          /system-design/patterns/saga,
          /system-design/databases/single-leader-replication,
        ]
      a: |-
        **Short answer.** Dual writes from the application have no shared transaction, so the two stores drift apart on failures and on races. Reading the old store's change log gives the same changes in the same order with neither problem.

        **Why.** Two things go wrong with writing twice.

        **Partial failure.** The write to the old store succeeds and the write to the new one times out. The stores now differ. You can retry, but if the process crashes first, nobody remembers that a retry is owed.

        **Ordering.** Two requests update the same row at almost the same time. Request A reaches the old store first and the new store second. Request B does the opposite. The old store ends with B's value and the new store with A's.

        Change data capture avoids both. The old store's log is a single ordered record of what was committed. A process tails it and applies each change to the new store. If it crashes, it resumes from its saved position.

        | | Dual writes | Change data capture |
        | --- | --- | --- |
        | Application changes | Every write path | None |
        | Order preserved | No | Yes |
        | Recovers after a crash | Needs repair jobs | Resumes from position |
        | Lag | None | Seconds |

        **Watch out for.** Assuming capture handles everything. Schema changes and bulk operations may need special handling, so test them before the real run.
    - q: How do both systems run in parallel during the cutover, and how do you move traffic?
      level: Senior
      topics: [/system-design/databases/single-leader-replication, /system-design/fundamentals/availability]
      companies: [Apple]
      a: |-
        **Short answer.** Both stores stay live and in sync for weeks, but only one accepts writes at a time. Reads move first and gradually. Writes move last, in one short step.

        **Why.** The parallel period has four states, each controlled by a flag that can be changed without a deploy:

        | State | Writes go to | Reads come from | Sync direction |
        | --- | --- | --- | --- |
        | 1. Shadow | Old | Old, new compared in background | Old to new |
        | 2. Read ramp | Old | New for 1, 10, 50, 100 percent | Old to new |
        | 3. Write switch | New | New | New to old |
        | 4. Done | New | New | None |

        In state 2 the new store is a few seconds behind. A user who saves and reloads at once may see old data. Send a user's reads to the old store for a few seconds after their own write.

        The move from state 2 to 3 is the delicate step. Block writes, or let them wait in the service, for a few seconds. Confirm that the replay has applied the final log position. Flip the flag. Start the reverse sync. Unblock.

        **Watch out for.** Service instances with different flag values. During the write switch every instance must change together, so the store should also reject writes from instances that hold the old setting.
    - q: How do you prove that the new store holds the same data as the old one?
      level: Mid
      topics: [/system-design/fundamentals/encryption-and-hashing, /system-design/databases/choosing-a-database]
      a: |-
        **Short answer.** Compare in layers: row counts, then checksums per key range, then full row comparison only for the ranges that differ. Add shadow reads to compare the answers that real requests receive.

        **Why.** Comparing 4 billion rows one at a time over the network would take days. A checksum is a short fingerprint computed from data. Split the key space into ranges of, say, 100,000 rows. Each store computes one checksum per range from the same normalised form of the rows. Equal checksums mean the range matches. For a range that differs, split it again or compare its rows directly.

        The data keeps changing while you compare. A row written a second ago may be in the old store and not yet in the new one. So a mismatch is not final until it is checked again after the replay lag has passed. Only differences that persist are real.

        Normalise before hashing. The two stores may format timestamps, decimal numbers or empty values differently, and those must not count as mismatches.

        Shadow reads check a different thing: that the queries the service runs return the same results, including sort order and paging.

        **Watch out for.** Stopping at row counts. Two stores can hold the same number of rows with different contents.
    - q: A week after the cutover, the new store starts misbehaving. How do you roll back?
      level: Senior
      topics:
        [
          /system-design/databases/single-leader-replication,
          /system-design/fundamentals/availability,
          /system-design/databases/sync-vs-async-replication,
        ]
      a: |-
        **Short answer.** Rolling back is possible only if the old store has been receiving every write since the cutover. So start a reverse sync from new to old at the moment of the switch, and rolling back becomes the same cutover procedure run in the other direction.

        **Why.** Without a reverse sync, the old store is frozen at the cutover instant. Going back to it after a week would throw away a week of writes.

        With a reverse sync, the old store lags the new one by seconds. A rollback then means: pause writes, wait for the reverse sync to drain, flip the flags to the old store, resume.

        The reverse path has a condition. If the new data model holds things that the old schema cannot store, such as a new field, the reverse sync loses them. Either delay new features that need the new model until the fallback period ends, or accept and document the loss.

        Decide beforehand what triggers a rollback, for example error rate above 1 percent for 10 minutes or 99th percentile latency doubled, and who has the authority to call it.

        **Watch out for.** Deleting the old store early to save cost. A few weeks of double spend is cheap next to a failure with no way back.
    - q: The schema changes during the migration. How do you keep old and new versions of the service working at the same time?
      level: Mid
      topics: [/system-design/fundamentals/serialization, /system-design/fundamentals/api-design]
      companies: [Apple]
      a: |-
        **Short answer.** Make every change in small steps where the old and new code can both read and write the data. The usual order is expand, migrate, contract.

        **Why.** During a rolling deploy, and during the weeks of the migration, two versions of the code run together. A change that only the new version understands breaks the old one.

        Take the rename of a column from `name` to `full_name`:

        1. **Expand.** Add `full_name` and leave `name` in place.
        2. **Write both.** Deploy code that writes both columns and still reads `name`.
        3. **Backfill.** Copy `name` into `full_name` for existing rows, in small batches.
        4. **Switch reads.** Deploy code that reads `full_name`.
        5. **Contract.** Stop writing `name`, then drop it, once no running version uses it.

        Each step can be undone alone, and at no point does a running version meet data it cannot handle.

        The same rule applies to the API that clients see. Keep the request and response shapes stable while the storage moves. New fields are optional with defaults, and readers ignore fields they do not know.

        **Watch out for.** Doing the engine move and a large data model redesign in one step. When something is wrong you cannot tell which change caused it. Move first with a model close to the old one, then reshape.
    - q: How does the plan change when the system being migrated is the authentication system?
      level: Senior
      topics:
        [
          /system-design/fundamentals/api-auth,
          /system-design/fundamentals/encryption-and-hashing,
          /system-design/fundamentals/security,
        ]
      companies: [Apple]
      a: |-
        **Short answer.** The staged plan stays, with two additions: stored password hashes can be moved only as they are and upgraded when each user next signs in, and tokens issued by the old system must keep working until they expire.

        **Why.** A password is stored as a one-way hash, so the old system cannot hand over the passwords themselves. If the new system uses a different hash method, copy the old hashes with a marker of their method. When a user signs in, verify against the old hash, then save a fresh hash in the new method.

        Tokens are the second problem. Millions of sessions signed by the old system are in use, and forcing everyone to sign in again is a visible outage. So during the overlap every service accepts both token formats:

        - Publish the old and the new signing keys, and let services pick the right one by the key id in the token.
        - Issue new-format tokens from the new system only. The old ones run out on their own.
        - Refresh tokens live for weeks, so let the new system accept an old refresh token once and return a new-format one.

        **Watch out for.** Revocation gaps. A session ended in one system must be rejected by the other, or a signed-out user is still signed in somewhere.
- id: design-ad-click-aggregator
  q: Design an ad click aggregator that counts clicks per ad and shows advertisers fresh numbers within about 30 seconds.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/message-queues
    - /system-design/databases/analytical-databases
    - /system-design/patterns/idempotency
  companies: [Meta, Netflix]
  a: |-
    **Short answer.** Write every click to a durable log first. A stream processor reads the log, removes duplicates and adds clicks up per ad per minute, and stores those small totals in an analytical database that dashboards query. The raw clicks are kept so any total can be rebuilt later.

    **What to clarify.** Which questions the system answers: clicks per ad per minute, per hour, over a year, top ads. How fresh the numbers must be. Whether the counts feed billing, because billing needs exact numbers and a dashboard can accept small temporary errors. How long raw clicks are kept. Whether fraud filtering is in scope.

    **The numbers that drive the design.**

    - Click rate. 1 billion clicks a day is about 11,600 a second on average. Plan for 5 times that at peak, about 60,000 a second.
    - Raw storage. At about 500 bytes per click, one day is 500 GB and one year is about 180 TB. That belongs in cheap object storage.
    - Aggregate storage. With 5 million active ads, hourly totals are at most 5 million times 24, so 120 million rows a day. At 50 bytes a row that is 6 GB a day, about 80 times smaller than the raw data.

    **Core design.**

    1. The click goes to a small click service. It gives the click a unique id, appends an event (click id, ad id, user id, time) to a partitioned log such as Kafka, and redirects the browser to the advertiser's page.
    2. The log is partitioned by ad id, so all clicks for one ad arrive at one worker in order.
    3. A stream processor reads the log. It drops click ids it has already seen, then groups clicks by ad id and by one-minute window, using the time the click happened.
    4. Every few seconds it writes the current total for each open window to a column-oriented analytical database, keyed by ad id and minute. The write replaces the old value, so writing it twice is harmless.
    5. Background jobs roll minutes up into hours and hours into days. Queries for a long range read the coarse tables.
    6. A second consumer copies raw events to object storage. A nightly batch job recomputes the day from the raw data and overwrites the stream's totals.
    7. A query service reads the aggregate tables and caches popular dashboard queries for a few seconds.

    **The hardest part.** Counting each click exactly once while machines crash and input arrives late or twice. Three things together give that: a stable click id, a processor that saves its position in the log together with its window state, and writes that replace a row and never add to it.

    **Main trade-off.** Speed against exactness. The stream path is fast but can miss very late clicks. The batch path is exact but hours behind. Running both means the dashboard is right within seconds for most cases and the bill is right by the next day, at the price of two code paths that must agree.

    **What a senior answer adds.** A plan for one very popular ad that overloads its partition: add a random suffix to the key, count in parts, then sum the parts. Reprocessing history from raw events without downtime. Monitoring the gap between stream and batch totals as the main health signal.

    **Watch out for.** Writing one database row per click and running a count query at read time. At 60,000 clicks a second the writes alone are costly, and every dashboard load would scan millions of rows.
  followUps:
    - q: The dashboard must show counts that are at most 30 seconds old. Where does that time go, and how do you keep inside it?
      level: Mid
      topics: [/system-design/patterns/message-queues, /system-design/databases/analytical-databases]
      companies: [Meta]
      a: |-
        **Short answer.** Give each stage a share of the 30 seconds, and have the stream processor publish partial totals for the current minute every few seconds without waiting for the minute to end.

        **Why.** A click passes four stages. A rough budget looks like this:

        | Stage | Budget |
        | --- | --- |
        | Click service to log | under 1 second |
        | Waiting in the log | 1 to 2 seconds |
        | Stream processor flush | 5 seconds |
        | Database write and query cache | 5 to 10 seconds |

        That leaves about 10 seconds spare. The key choice is the flush. If the processor only wrote a minute's total when the minute closed, a click at 10:00:01 would not show until after 10:01:00. So it writes the running total for open windows every 5 seconds, and each write replaces the previous one.

        The measure to alarm on is consumer lag: how far the processor is behind the newest event in the log. If lag grows past 10 seconds, add processor instances, up to the number of partitions.

        **Watch out for.** A query cache with a long expiry. A 60-second cache in front of a 10-second pipeline breaks the promise on its own.
    - q: How do you stop the same click from being counted twice?
      level: Mid
      topics: [/system-design/patterns/idempotency, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** Give each click one stable id when it is first recorded, drop repeated ids in the stream processor, and write totals as "set to this value" so a replay cannot add twice.

        **Why.** Duplicates come from three places. The browser retries the click request. The click service retries its write to the log. The processor crashes and re-reads events it had already counted.

        For the first two, the id must be created once and survive retries. A common way is to put a signed impression id in the ad link when the ad is shown, so two requests for the same click carry the same id. The processor keeps recently seen ids per ad for a window such as 10 minutes and ignores repeats. For 60,000 clicks a second that is 36 million ids, which fits in memory across the workers.

        For the third, the processor saves its log position and its window totals in one atomic checkpoint. After a crash it restarts from the checkpoint and rebuilds the same totals. Because the database write replaces the row for (ad id, minute), sending it again changes nothing.

        **Watch out for.** Using increments such as "add 17 to the row". After a crash and replay the 17 is added again and the count is wrong forever.
    - q: With tens of thousands of clicks a second, how do you keep the database from being overwhelmed by writes?
      level: Senior
      topics: [/system-design/databases/analytical-databases, /system-design/patterns/back-pressure]
      companies: [Meta]
      a: |-
        **Short answer.** Aggregate before the database, so the write rate depends on the number of active ads and windows, not on the number of clicks. Then batch what is left.

        **Why.** 60,000 clicks a second spread over, say, 500,000 ads that are active in a given minute become at most 500,000 rows per minute. If the processor flushes every 5 seconds, that is at most 100,000 row updates a second in the worst case, and far fewer in practice because most ads get no click in a given 5 seconds. Each flush sends rows in batches of thousands. Column-oriented stores are built for large batch inserts and handle these well. They handle single-row inserts badly.

        The log in front protects the database too. If the database slows down, the processor slows its reading and events wait safely in the log. Nothing is lost. Freshness suffers for a while and recovers.

        One ad can still be hot. A viral ad may take 20 percent of all traffic and overload the worker that owns its partition. Split the key into several sub-keys with a random suffix, count each part, and sum the parts in a second step.

        **Watch out for.** Scaling the database to take raw clicks. It works in a demo and costs many times more than aggregating first.
    - q: The system that sends you click logs is down for three hours and then replays its backlog. What happens to the counts?
      level: Senior
      topics: [/system-design/patterns/message-queues, /system-design/patterns/back-pressure]
      a: |-
        **Short answer.** The clicks must land in the minutes when they happened, not the minutes when they arrived. That needs event-time windows and a way to accept late data.

        **Why.** Every event carries the time of the click. The processor groups by that time. A watermark is the processor's estimate of "I have now seen everything up to time T". While the source is down, the watermark stops moving, windows stay open and the dashboard shows a gap. When the backlog arrives, the old windows fill in and close in order.

        A real pipeline cannot keep windows open for ever, so it sets an allowed lateness, for example 10 minutes. A three-hour outage is beyond that. Two things cover it. First, late events are not dropped. They go to a side output that updates the stored totals for old minutes directly. Second, the nightly batch job recomputes from raw events and repairs anything the stream missed.

        The replay itself is a burst, perhaps three hours of data in 20 minutes, which is 9 times the normal rate. The log absorbs it and the processor works through it at its own speed.

        **Watch out for.** Windows based on arrival time. Three hours of clicks would all be counted in the minutes of the replay, and hourly charts would show a false spike after a false gap.
    - q: "Months later you find that a bug counted every click twice for two weeks. How do you fix the history?"
      level: Senior
      topics:
        [
          /system-design/patterns/cqrs-event-sourcing,
          /system-design/databases/analytical-databases,
          /system-design/databases/object-storage,
        ]
      a: |-
        **Short answer.** Recompute those two weeks from the raw click events with the fixed code, write the results to a new version of the affected partitions, check them, and then swap the new version in.

        **Why.** The aggregates are a derived view. The raw events in object storage are the source of truth, and this is the reason to keep them. Two weeks at 1 billion clicks a day is 14 billion events, about 7 TB. A batch job on 100 machines can process that in a few hours.

        The steps are:

        1. Run the fixed job over the raw data for the 14 days and write per-minute, per-hour and per-day totals to shadow tables.
        2. Compare shadow against live. Here the live totals should be close to double.
        3. Replace the live partitions with the shadow ones in one atomic step per day.
        4. Rebuild anything derived from them, such as monthly and yearly roll-ups and cached top lists.
        5. Tell billing, because advertisers were charged for the wrong numbers and need credits.

        Keep the old partitions for a while so the swap can be undone.

        **Watch out for.** Fixing the totals by dividing by two in place. It hides the evidence, it is wrong for any ad the bug did not touch, and it leaves no way to prove the result.
    - q: How would you answer "top 100 ads by clicks this year" quickly?
      level: Senior
      topics: [/system-design/databases/analytical-databases, /system-design/patterns/caching]
      a: |-
        **Short answer.** Never scan a year of minute rows. Keep coarse roll-ups, sum the few rows each ad has at the coarsest level, and cache the answer, because a yearly top list changes slowly.

        **Why.** Compare the work for 5 million ads over one year:

        | Table read | Rows scanned at most |
        | --- | --- |
        | Per minute | 2.6 trillion |
        | Per day | 1.8 billion |
        | Per month | 60 million |

        The query uses monthly rows for complete months and daily rows for the current month. Summing 60 million short rows and keeping the largest 100 takes a column store about a second. Then cache the list and refresh it every few minutes.

        A top list cannot be built from smaller top lists exactly. An ad that is 150th every month can still be in the yearly top 100. So the roll-up must keep a total for every ad, and the ranking is done on those totals.

        If the question is asked with many filters, such as by country or by advertiser, store the roll-ups with those columns and let the database group at query time.

        **Watch out for.** Merging the top 100 of each day to get the top 100 of the year. It looks reasonable and gives wrong answers.
- id: design-calendar
  q: Design a calendar service like Google Calendar, with events, invitations, recurring events, reminders and time zones.
  level: Mid
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/databases/relational-databases
    - /system-design/fundamentals/push-notifications
    - /system-design/patterns/sharding
  companies: [Amazon, LinkedIn]
  a: |-
    **Short answer.** Store each event once, plus one small row per attendee that places the event on that person's calendar. Index those rows by user and start time so a week view is one short range read. Store a recurring event as a rule and expand it when read. A separate scheduler sends reminders.

    **What to clarify.** Personal calendars only, or shared calendars and meeting rooms too. How many attendees one event can have. Whether free and busy lookup across people is needed. Which reminder channels are in scope. Whether offline editing on mobile matters.

    **The numbers that drive the design.**

    - Reads. 100 million daily users who each load a calendar view 10 times a day make 1 billion reads a day, about 11,600 a second.
    - Writes. If each user creates or edits 2 events a day, that is 200 million writes a day, about 2,300 a second. Reads are 5 times the writes, and both are modest.
    - Reminders. 200 million reminders a day would be 2,300 a second if spread evenly, but meetings start on the hour. If 5 percent of a day's reminders fire at 9:00 in one busy time zone, that is 10 million in one minute.

    **Core design.**

    1. An `events` table holds the event id, organiser, title, start and end as UTC instants, the time zone it was created in, an optional recurrence rule and a version number.
    2. An `attendees` table holds one row per person per event: user id, event id, start time and reply (yes, no, maybe, no reply). It is indexed by user id and start time.
    3. A relational database fits, because one edit must update the event and its attendee rows together. Split the data by user id once one machine is not enough.
    4. To show a week, the service reads the user's attendee rows in that time range, loads the events, and expands any recurring rules that touch the range.
    5. Creating an event with guests writes the event and the attendee rows, then publishes an "event changed" message. Consumers send invitation emails and pushes, and update other open clients.
    6. Every edit sends the version the client last saw. The update succeeds only if the version still matches.
    7. A reminder scheduler keeps "send at" entries in time buckets. Workers pick up the bucket for the coming minute and hand jobs to the push and email senders.

    **The hardest part.** Recurring events. "Every Monday at 10:00 with no end date" cannot be stored as rows for ever, and users edit one occurrence, or "this and all later ones". The design needs a rule, a list of exceptions and a clear way to split a series.

    **Main trade-off.** Expanding recurring events at read time keeps storage small and edits cheap, but makes each read do some work. Writing out every occurrence makes reads trivial, but an edit to a series then rewrites hundreds of rows per attendee. Most designs expand on read and cache a window of a few months.

    **What a senior answer adds.** Free and busy lookup served from a compact per-user summary. Sync for clients using a change token, so a phone downloads only what changed. Meeting rooms as a resource that must never be double booked. Spreading reminder load so the top of the hour does not arrive as one spike.

    **Watch out for.** Storing local times with no time zone. The first clock change moves every meeting by an hour for someone.
  followUps:
    - q: How do you serve "show me this week" quickly for any user?
      level: Mid
      topics:
        [
          /system-design/databases/relational-databases,
          /system-design/databases/b-trees,
          /system-design/patterns/caching,
        ]
      companies: [LinkedIn]
      a: |-
        **Short answer.** Keep a per-user index ordered by start time, so the week is one range scan over a few dozen rows, and cache the result for the views people open most.

        **Why.** The query is always "rows for user U that overlap the range from A to B". A B-tree index on (user id, start time) stores each user's rows next to each other in time order. The database jumps to (U, A) and reads forward until B. A busy person has perhaps 40 events in a week, so this is a handful of pages from disk.

        Two details matter. An event overlaps the range if it starts before B and ends after A, so a long event that began last week must still be found. A simple way is to also scan back by the longest allowed event length, or to keep long events in a small separate list. Recurring events are kept in their own short list per user, because their rule has to be checked against any range.

        Because the partition key is the user id, one week view touches one shard.

        Cache the current week and the next one per user, and delete the cache entry when any of that user's attendee rows change.

        **Watch out for.** Indexing only by event id and filtering by user afterwards. That scans far more than it returns.
    - q: Two people edit the same event at the same moment. What happens?
      level: Mid
      topics: [/system-design/patterns/consistency-models, /system-design/databases/relational-databases]
      companies: [LinkedIn]
      a: |-
        **Short answer.** Use a version number on the event. The first save wins and raises the version. The second save is rejected because its version is old, and that client reloads and tries again.

        **Why.** This is optimistic concurrency control: assume conflicts are rare, and check for them only at save time. The update statement says "set the new values where event id is E and version is 7". If someone else already moved the version to 8, no row matches, and the service returns a conflict. The client fetches version 8, shows the user what changed, and reapplies the edit if it still makes sense.

        Events are edited rarely, usually by one organiser, so conflicts are uncommon and a lock held while someone types would be wasted.

        Not every change needs the event's version. A guest's reply lives in that guest's own attendee row. 200 guests can all answer at once without conflict, because each writes a different row.

        A friendlier client merges where it can. If one person changed the room and another changed the description, the second save can be retried on top of the first without asking the user.

        **Watch out for.** Last write wins with no check. The second save silently removes the first person's change, and nobody finds out until people go to the wrong room.
    - q: How do you store a weekly meeting with no end date, and what happens when someone changes "this and all following" meetings?
      level: Senior
      topics: [/system-design/databases/relational-databases]
      companies: [LinkedIn]
      a: |-
        **Short answer.** Store one row with a recurrence rule, plus a small list of exceptions. Occurrences are computed when a time range is read. A "this and following" edit ends the old series and starts a new one.

        **Why.** The rule says something like "weekly on Monday at 10:00 in the Paris time zone, starting 6 January". To show March, the service works out which Mondays fall in March. Nothing is stored per occurrence, so a series with no end costs one row.

        Edits come in three kinds:

        | Edit | What is stored |
        | --- | --- |
        | Only this one | An exception row: series id, original date, the new values or "cancelled" |
        | This and following | Old rule gets an end date. A new series starts on that date with the new values |
        | All | The rule row is updated. Exceptions are kept or dropped by product choice |

        When expanding, the service generates dates from the rule, then applies exceptions by matching on the original date.

        The rule must be evaluated in the event's own time zone. "10:00 every Monday in Paris" stays at 10:00 in Paris when clocks change, which means the UTC time moves by an hour.

        **Watch out for.** Generating a row for every occurrence up front. A daily event with no end has no last row, and every edit to the series becomes a mass rewrite.
    - q: Millions of reminders are due at exactly 9:00. How do you send them on time?
      level: Senior
      topics:
        [
          /system-design/fundamentals/push-notifications,
          /system-design/patterns/message-queues,
          /system-design/patterns/back-pressure,
        ]
      a: |-
        **Short answer.** Store reminders in buckets by the minute they are due, load each bucket a little early, spread the jobs over many queue partitions and workers, and accept a small, bounded delay at the busiest minute.

        **Why.** The schedule is known long before, so the system can prepare. Each reminder is a row keyed by its due minute plus a shard number. Shortly before 8:59, scheduler workers read the 9:00 bucket, each one owning some shards, and push jobs to a queue. Sender workers call the push and email providers.

        With 10 million reminders in one minute, sending them all inside that minute needs about 170,000 sends a second. Push providers and email services limit send rates, so plan the capacity and decide what may slip. A reminder that says "in 10 minutes" can arrive 20 seconds late with no harm, so the system can start sending 30 seconds early and finish 30 seconds late.

        For recurring events, do not create reminders for ever. A daily job creates the reminder rows for the next day or two from the rules.

        Each job carries a key made of event id, user id and occurrence time, so a retried job does not buzz the phone twice.

        **Watch out for.** A single process that polls the database every minute for due rows. It works at small scale and falls behind at exactly the moment it matters.
    - q: How do you handle time zones and daylight saving time?
      level: Junior
      topics: [/system-design/databases/relational-databases, /system-design/fundamentals/api-design]
      a: |-
        **Short answer.** Store a single event as an exact instant in UTC, together with the name of the time zone it was created in. Convert to the viewer's time zone only when showing it. Store recurring events as a local time plus a zone name.

        **Why.** A call at 15:00 in London is one moment in time. Saving it as a UTC instant means a guest in Tokyo and a guest in New York both see the right local time, and range queries compare plain numbers.

        The zone must be a name such as "Europe/London". A fixed offset such as "plus one hour" is wrong for half the year, because the offset changes when clocks move.

        Recurring events are the exception to "store UTC". A weekly meeting at 10:00 in Paris should stay at 10:00 on Paris clocks all year. In UTC that is 09:00 in winter and 08:00 in summer. So the rule keeps the local time and zone, and each occurrence is converted to UTC when it is expanded.

        Governments change clock rules, sometimes at short notice. Keep the time zone database up to date on servers and compute future occurrences from the rule each time.

        **Watch out for.** All-day events. A birthday is a date, not an instant. Stored as midnight UTC, it shows on the wrong day for users west of Greenwich.
    - q: "Add meeting rooms. How do you guarantee that a room is never booked twice for the same time?"
      level: Senior
      topics:
        [
          /system-design/databases/relational-databases,
          /system-design/patterns/consistency-models,
          /system-design/case-studies/hotel-booking,
        ]
      a: |-
        **Short answer.** Make the database refuse overlapping bookings for the same room, inside the same transaction that saves the booking. Do not rely on a check in application code.

        **Why.** Two people can ask for the same room for the same hour within a few milliseconds. If the service reads "is it free", sees yes in both requests, and then writes both, the room is double booked. The check and the write must be one atomic step.

        Three ways to do it:

        | Method | How it works | Cost |
        | --- | --- | --- |
        | Slot rows | One row per room per 15-minute slot, with a unique key | Simple. Many rows for long meetings |
        | Lock the room row | Transaction locks the room, checks for overlap, inserts | Bookings for one room run one at a time |
        | Range constraint | The database rejects overlapping time ranges per room | Needs a database that supports it |

        All three are fine at this load. One room gets a few bookings a day, so running them one at a time costs nothing.

        Keep all of one room's bookings on one shard, by using the room id as the partition key for room data. The check then stays a local transaction.

        **Watch out for.** Using a cache to answer "is the room free" at booking time. Use it for browsing, and let the database give the final answer.
- id: design-safe-rollout
  q: You need to roll out a new software version to a fleet of 5,000 servers. Design the system that does it safely.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/fundamentals/availability
    - /system-design/patterns/circuit-breaker-and-retries
    - /system-design/fundamentals/load-balancing-basics
  a: |-
    **Short answer.** Change a small part of the fleet first, watch its health, and widen in stages only while the numbers stay good. Take each server out of traffic before touching it, never take out more than the fleet can spare, and make going back a single fast action.

    **What to clarify.** What is changing: a binary, a configuration value or an operating system patch. Whether the servers hold state or open connections. How much spare capacity the fleet has. Whether old and new versions can run side by side. How many regions and zones there are.

    **The numbers that drive the design.**

    - Capacity. If peak traffic needs 70 percent of the fleet, at most 30 percent can be out. Keep a margin for ordinary failures and cap the rollout at 10 percent out at once, which is 500 servers.
    - Stages. 1 server, then 50 (1 percent), 500, 1,250, 2,500, then all 5,000. That is 6 stages.
    - Time. With about 15 minutes to update a stage and 15 minutes of watching after it, the rollout takes about 3 hours. Updating one server at a time at 2 minutes each would take 10,000 minutes, about a week.

    **Core design.**

    1. Build one versioned artifact that never changes after it is built. The same file goes to every server, and the previous version stays available.
    2. A rollout record in a durable store holds the target version, the list of stages, the current stage and the state: running, paused or rolling back.
    3. An orchestrator reads the record and picks the next batch. It spreads each batch over zones and regions without ever taking one whole zone out.
    4. For each server, it tells the load balancer to stop sending new requests, waits for requests in progress to finish, installs the version, and restarts.
    5. The server returns to traffic only after its health check passes.
    6. After each stage the orchestrator waits and compares the updated servers with the rest on error rate, latency and crashes.
    7. If a gate fails, the orchestrator stops and reinstalls the previous version on the servers it changed.

    <AnimatedDiagram name="fundamentals/availability" highlight={["lb", "appA", "appB"]} caption="The load balancer stops sending traffic to one server while it restarts, and the other servers keep serving." />

    **The hardest part.** Deciding that a stage is healthy without a human. Some failures appear in seconds, such as a crash on start. Others take an hour, such as a slow memory leak. The gates must compare like with like and must wait long enough.

    **Main trade-off.** Speed against the size of the damage. Small stages and long waits limit how many users a bad version can hurt, but an urgent security fix then takes hours. Keep a second, faster plan for emergencies, with the same gates and shorter waits.

    **What a senior answer adds.** Old and new versions must work together, including data formats and calls between services, because the fleet is mixed for hours. Configuration changes get the same staged treatment as code. A fleet-wide safety limit stops the rollout if too many servers are unhealthy for any reason. A record of who rolled out what and when.

    **Watch out for.** Treating a restart as free. Caches start empty and connections are rebuilt, so restarting 500 servers at once can overload the other 4,500 and the databases behind them.
  followUps:
    - q: What is the difference between a rolling update, a blue-green deployment and a canary release?
      level: Junior
      topics: [/system-design/fundamentals/availability, /system-design/fundamentals/load-balancing-basics]
      a: |-
        **Short answer.** All three replace an old version with a new one without downtime. They differ in how many servers run the new version at once and how you go back.

        **Why.**

        | Method | How it works | Going back | Extra cost |
        | --- | --- | --- | --- |
        | Rolling update | Replace servers batch by batch in the same fleet | Roll the batches again with the old version | None. Capacity dips by one batch |
        | Blue-green | Build a full second fleet on the new version, then switch all traffic | Switch traffic back, in seconds | Double the servers for a while |
        | Canary | Send a small share of traffic, such as 1 percent, to the new version and compare | Remove the canary | Needs good metrics |

        They combine well. A common plan for 5,000 servers is a canary first, then a rolling update in growing stages. Blue-green suits smaller fleets, because 5,000 extra servers are expensive.

        A canary limits damage in size: if the version is bad, about 1 percent of requests see it. Blue-green limits damage in time: everyone sees the bad version, but only until the switch back.

        **Watch out for.** Thinking blue-green removes all risk. Both fleets usually share one database, so a change that writes bad data is not undone by switching traffic back.
    - q: How does the system decide automatically that a canary is healthy enough to continue?
      level: Senior
      topics: [/system-design/fundamentals/availability, /system-design/case-studies/metrics-and-logging]
      a: |-
        **Short answer.** Compare the canary servers with a control group of old-version servers of the same size, over the same minutes, on a short list of metrics, and continue only if the canary is not clearly worse.

        **Why.** Comparing against fixed limits fails because traffic changes through the day. An error rate of 0.3 percent may be normal at noon and alarming at night. A control group sees the same traffic at the same time, so any difference comes from the version.

        A workable set of gates:

        - The process starts and passes health checks. This catches the worst bugs in the first minute.
        - Error rate, for example the canary's rate must not exceed the control's by more than 0.1 percentage points.
        - Latency at the 99th percentile, within 10 percent of the control.
        - Resource use: CPU, memory growth, restarts.
        - One or two business numbers, such as completed checkouts per request.

        The canary needs enough traffic for the comparison to mean something. One server that handled 200 requests cannot show a change in a 0.1 percent error rate. So the single-server stage tests "does it start and serve", and the 1 percent stage with 50 servers tests the rates.

        **Watch out for.** Health checks that only say "the process is up". A server can answer its health check and still fail every real request because of a bad configuration value.
    - q: How do you restart a server without dropping the requests it is handling?
      level: Mid
      topics: [/system-design/fundamentals/load-balancing-basics, /system-design/fundamentals/websockets]
      a: |-
        **Short answer.** Drain it first. Tell the load balancer to stop sending new requests, let the requests already in progress finish, and only then stop the process.

        **Why.** The order of the steps is what protects users:

        1. The server marks itself "not ready", for example by failing its readiness check. It keeps serving.
        2. The load balancer notices within a few seconds and stops choosing it.
        3. The server waits for open requests to finish, up to a limit such as 30 seconds.
        4. The process stops, the new version starts, warms up, and reports "ready".
        5. The load balancer sends it traffic again.

        Step 2 takes time. If the server stops accepting connections the instant it is told to shut down, requests sent in those few seconds fail. So it must keep accepting for a short while after marking itself not ready.

        Long-lived connections need more care. A server holding 50,000 WebSockets cannot wait for them to end. It sends each client a "please reconnect" message and closes them gradually over a minute or two. Clients reconnect with a random delay so the other servers do not get 50,000 new connections in one second.

        **Watch out for.** Background work. A server in the middle of a queue job should finish it or return it to the queue before it exits.
    - q: The orchestrator crashes when 40 percent of the fleet has been updated. How does the rollout recover?
      level: Senior
      topics: [/system-design/patterns/leader-election, /system-design/patterns/idempotency]
      a: |-
        **Short answer.** Keep the rollout's progress in a durable store and make every step safe to repeat. A new orchestrator reads the record and continues from where the old one stopped.

        **Why.** The design works on desired state. The record says "servers in stages 1 to 4 should run version 42". Each server runs a small agent that reports the version it runs. The orchestrator's job is to find servers where the two differ and fix them. After a crash, a replacement compares the same two lists and carries on. No in-memory progress is lost.

        Each step is idempotent, which means doing it twice has the same effect as doing it once. "Install version 42" on a server that already has it does nothing. "Drain" on a drained server does nothing.

        Two orchestrators must never act at once, or together they could take out 20 percent of the fleet when the limit is 10. Run several copies and use leader election, so only the copy that holds a lease may act. The limit on servers out of service is also enforced in the shared store: an orchestrator reserves a slot before it drains a server.

        **Watch out for.** A rollout script that keeps its list of finished servers in memory. A crash leaves a mixed fleet and nobody knows which servers were done.
    - q: The new version needs a database schema change. How do you keep the rollout and a possible rollback safe?
      level: Senior
      topics: [/system-design/databases/relational-databases, /system-design/fundamentals/serialization]
      a: |-
        **Short answer.** Split the change into steps where each step works with both the version before it and the version after it. Add first, switch over, and remove only at the end.

        **Why.** During a staged rollout, old and new code run against the same database for hours. After a rollback, old code runs against whatever the new code wrote. So no single step may break either version.

        To rename a column from `name` to `full_name`:

        1. Add `full_name` as an optional column. Old code ignores it.
        2. Roll out code that writes both columns and still reads `name`.
        3. Copy old rows into `full_name` in small batches.
        4. Roll out code that reads `full_name`.
        5. Roll out code that stops writing `name`.
        6. Drop `name` after a waiting period.

        Each step is its own rollout with its own gates, and each can be rolled back by one step. The same rule applies to messages on queues and to calls between services: add fields as optional, and never change the meaning of an existing field.

        This is slower. One rename becomes several rollouts over days. In return, no step has a moment where a rollback is impossible.

        **Watch out for.** Shipping the schema change and the code that needs it in one release. If the code must be rolled back, the old code meets a schema it does not understand.
    - q: Product teams want version 2 of a feature for employees first, then for 5 percent of users. How do you support that?
      level: Mid
      topics: [/system-design/fundamentals/api-gateway, /system-design/patterns/caching]
      a: |-
        **Short answer.** Separate deploying code from releasing a feature. Ship the new code to every server switched off, and control who sees it with feature flags that are evaluated per request.

        **Why.** Server rollouts choose machines. They cannot choose people, because any user can land on any server. A feature flag is a named switch with rules, such as "on for staff, on for 5 percent of other users". Each server holds a copy of the rules in memory and refreshes it every few seconds from a flag service. A check costs microseconds and needs no network call.

        The percentage rule hashes the flag name with the user id and maps the result to a number from 0 to 99. Users with a number below 5 get the feature. The same user always gets the same answer, on every server.

        This gives two separate safety layers. The staged server rollout catches crashes and performance problems. The flag rollout catches product problems, and turning a flag off takes seconds with no deploy.

        If whole app versions must be assigned to groups, the same idea applies one level up: a routing rule at the gateway sends a group's requests to a pool of servers running that version.

        **Watch out for.** Flags that live for ever. Each one doubles the paths to test. Remove a flag once its feature is fully on.
- id: design-online-judge
  q: Design an online coding judge like LeetCode, where users submit code and get a verdict within a few seconds.
  level: Mid
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/message-queues
    - /system-design/patterns/back-pressure
    - /system-design/fundamentals/security
  companies: [Meta]
  a: |-
    **Short answer.** Accept the submission, save it and put a job on a queue. Worker machines take jobs, run the code in a locked-down sandbox against hidden test cases with time and memory limits, and write the verdict. The browser asks for the result until it is ready.

    **What to clarify.** Which languages are supported. Whether timed contests with a live ranking are in scope, since they change the load shape. How fast a verdict must come back. Whether test cases are secret. How large submissions and test files can be.

    **The numbers that drive the design.**

    - Normal load. 1 million submissions a day is about 12 a second.
    - Contest load. 20,000 people in a contest tend to submit together near the start and near the end. Plan for 200 submissions a second for several minutes.
    - Compute. If judging one submission takes about 5 seconds of CPU across its test cases, 200 a second needs 1,000 busy cores. Normal load needs about 60. The peak is 17 times the normal level, which is why a queue sits in the middle.

    **Core design.**

    1. The submit API checks the user's rate limit and the code size, saves the code with status "queued", puts a job with the submission id on a queue, and returns the id at once.
    2. Judge workers pull jobs. A worker fetches the code and the problem's test files. Test files live in object storage and are cached on the worker's disk.
    3. The worker compiles the code inside a sandbox with no network, a read-only file system, and limits on CPU time, memory, processes and output size.
    4. It runs the program on each test case, compares the output with the expected output, and stops at the first failure.
    5. It writes the verdict (accepted, wrong answer, time limit exceeded, runtime error, compile error) with time and memory used, then acknowledges the job.
    6. The browser polls a status endpoint about once a second until the verdict appears.
    7. For contests, each accepted verdict updates a score in a sorted ranking store.

    <AnimatedDiagram name="fundamentals/scaling-journey" highlight={["app1", "queue", "workers", "db"]} caption="The web tier saves the submission and queues a job, and workers pull jobs at their own pace and write the verdict back." />

    **The hardest part.** Running code written by strangers. Some of it is hostile and much of it is broken: endless loops, programs that fill memory, attempts to read the test answers or reach the internal network. The sandbox must contain all of that, and one bad submission must not slow its neighbours.

    **Main trade-off.** Isolation strength against speed and cost. A small virtual machine per run gives a strong wall but takes longer to start and uses more memory. A container starts in well under a second but shares the host kernel, so it needs extra hardening. Many systems keep a pool of sandboxes already started to hide the start time.

    **What a senior answer adds.** Fair timing, so the same code gets the same verdict on any worker. Scaling workers on queue length and on the age of the oldest job. Separate queues so a contest cannot starve practice users and the reverse. Rejudging every submission for a problem when a test case turns out to be wrong.

    **Watch out for.** Running the code inside the API request. One slow submission then holds a web server thread, and 200 a second exhausts the web tier.
  followUps:
    - q: How do you run untrusted code safely?
      level: Senior
      topics: [/system-design/fundamentals/security, /system-design/fundamentals/common-attacks]
      a: |-
        **Short answer.** Assume every submission is an attack. Run each one in a fresh, disposable sandbox that has no network, no secrets, almost no file system and hard limits on every resource, on machines that hold nothing valuable.

        **Why.** Use several layers, so that one failure does not expose the system:

        | Threat | Control |
        | --- | --- |
        | Endless loop | CPU time limit and a wall-clock limit, then kill |
        | Memory bomb | Memory limit enforced by the kernel |
        | Starting thousands of processes | Limit on process count |
        | Filling the disk or the logs | Read-only file system, small scratch space, output size limit |
        | Calling internal services | No network interface in the sandbox |
        | Reading expected answers | The checker and the answers stay outside the sandbox |
        | Breaking out of the sandbox | Unprivileged user, a small allowed set of system calls, or a virtual machine per run |

        The judge workers sit in their own network segment with no credentials for the main database. A worker hands its result to a small internal API that accepts only verdicts. If someone does break out, they hold a machine that can reach almost nothing.

        Throw the sandbox away after each run, so one submission cannot leave files for the next.

        **Watch out for.** The compiler. Compilation also runs user-controlled input and can be made to use huge memory or time, so compile inside the sandbox with limits as well.
    - q: A contest starts and submissions jump from 12 a second to 200 a second. What do you do?
      level: Senior
      topics:
        [
          /system-design/patterns/back-pressure,
          /system-design/patterns/message-queues,
          /system-design/patterns/rate-limiting,
        ]
      a: |-
        **Short answer.** Let the queue absorb the burst, add workers before the contest starts because the time is known, and keep the wait bounded with per-user limits and separate queues.

        **Why.** A contest is a scheduled spike. With 20,000 people signed up, the system can start extra workers 15 minutes early. Reacting only after the queue grows is too slow, because new machines take minutes to become useful and contestants are waiting.

        While the spike lasts, the number to watch is the age of the oldest job in the queue. If workers judge 150 a second and 200 a second arrive, the backlog grows by 50 a second, so after one minute the newest job waits about 20 seconds. That may be acceptable for a few minutes. If the wait would grow past the target, apply back-pressure in this order:

        1. Limit each user to one submission being judged at a time and, for example, one new submission every 10 seconds.
        2. Give contest submissions their own queue and worker pool, and shrink the practice pool for a while.
        3. Show the queue position in the page, so people do not resubmit and make the queue longer.

        The submit API itself stays fast throughout, because it only saves and queues.

        **Watch out for.** Dropping jobs when the queue is long. In a contest a lost submission is far worse than a slow one.
    - q: After submitting, how does the user's browser find out the verdict?
      level: Mid
      topics:
        [
          /system-design/fundamentals/choosing-realtime,
          /system-design/fundamentals/ajax-polling,
          /system-design/fundamentals/server-sent-events,
        ]
      a: |-
        **Short answer.** Simple polling is enough. The submit call returns a submission id, and the page asks a status endpoint every second or so until the state is final.

        **Why.** A verdict takes a few seconds and each user waits for one result at a time. With 200 submissions a second and about 5 seconds each, around 1,000 users are waiting at any moment, which means about 1,000 status requests a second. Each one is a key lookup that can be served from a cache. That is a small load, and polling needs no long-lived connections.

        | Option | Fits when | Cost |
        | --- | --- | --- |
        | Polling | Short waits, one result | A few wasted requests |
        | Server-sent events | Progress such as "test 14 of 50 passed" | Open connections to manage |
        | WebSocket | Two-way live features on the same page | Stateful servers |

        If the product shows progress per test case, server-sent events are a good step up: the server pushes each update over one open response.

        Whatever the transport, the verdict is stored first and shown second. If the user closes the tab and returns, the submission page reads the same stored result.

        **Watch out for.** Holding the original submit request open until judging ends. A queue delay during a contest would turn into thousands of timed-out requests.
    - q: The same code is accepted on one run and gets "time limit exceeded" on the next. How do you make timing fair?
      level: Senior
      topics: [/system-design/fundamentals/latency-numbers]
      a: |-
        **Short answer.** Measure the CPU time used by the program itself, run it on workers with the same hardware and no noisy neighbours, and set limits with a wide margin over the reference solution.

        **Why.** Wall-clock time includes waiting for the machine. If two sandboxes share a core, each seems to take twice as long. CPU time counts only the time the program was running, so it is much steadier. Keep a wall-clock limit too, at 2 or 3 times the CPU limit, to stop programs that sleep.

        Reduce the noise at its source:

        - Give each run its own core, and do not run more sandboxes than cores.
        - Use one machine type for a contest. If types differ, scale the limit by a factor measured with a benchmark.
        - Read input from memory, so disk speed does not count.
        - Allow extra time for slower languages, for example 2 times for Java and 5 times for Python.

        Set the limit from the reference solution with margin, for example 3 times its time. A correct solution with the right algorithm then passes easily, and a solution with the wrong complexity fails by a factor of 10 or more.

        For a verdict within 10 percent of the limit, run it again once and take the better time.

        **Watch out for.** Packing as many sandboxes per machine as memory allows. It saves money and makes verdicts depend on luck.
    - q: A judge worker dies half way through a submission. How do you make sure the user still gets exactly one verdict?
      level: Mid
      topics: [/system-design/patterns/message-queues, /system-design/patterns/idempotency]
      a: |-
        **Short answer.** The job stays on the queue until the worker confirms it. If the worker dies, the job becomes visible again and another worker judges it from the start. The verdict write is made safe to repeat.

        **Why.** A worker that takes a job gets it under a visibility timeout: the queue hides the job from others for a set time, such as 60 seconds, and the worker extends that while it is still working. Only after the verdict is saved does the worker acknowledge the job, which removes it. A dead worker never acknowledges, so the job returns.

        This gives at-least-once processing, which means a job may run twice. That happens when a worker is slow but alive and the timeout passes. Judging is deterministic, so two runs give the same verdict. The write is conditional: "set the verdict where the submission's status is still queued or running". The second writer changes nothing.

        Count the attempts. A submission that has crashed three workers is probably the cause. Move it to a dead-letter queue, which is a holding area for jobs that need a person, and show the user an internal error.

        **Watch out for.** Acknowledging the job when it is received. A crash after that loses the submission, and the page shows "judging" for ever.
    - q: "Now add live comments to each problem page, so everyone viewing a problem sees new comments as they are posted."
      level: Mid
      topics:
        [
          /system-design/fundamentals/server-sent-events,
          /system-design/patterns/fan-out,
          /system-design/fundamentals/choosing-realtime,
        ]
      companies: [Meta]
      a: |-
        **Short answer.** Save each comment in a database, then publish it to a channel named after the problem. Gateway servers that hold open connections for viewers of that problem push it to them.

        **Why.** This is a separate, read-heavy feature and should not touch the judging path. Posting a comment is a normal API call that writes a row keyed by problem id and time. After the write, the service publishes a small message on a publish and subscribe system under the problem's channel.

        Viewers hold a server-sent events connection, which is one long HTTP response that the server keeps writing to. It fits because data flows one way, and posting uses an ordinary request. Each gateway subscribes only to the channels of problems its own viewers have open. A message for a popular problem reaches a few gateways, and each writes it to its local viewers.

        A page that opens late first loads the latest 50 comments from the database, then listens for new ones. On reconnect, the client sends the id of the last comment it has and the server fills the gap from the database.

        During a contest, comments on contest problems are usually switched off, because they would leak solutions.

        **Watch out for.** Pushing the comment before it is saved. Viewers would see a comment that is gone after a refresh if the save fails.
- id: design-unique-id
  q: Design a service that generates unique 64-bit ids across many servers, at high speed, with ids that sort roughly by creation time.
  level: Mid
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/unique-id-generation
    - /system-design/patterns/leader-election
  companies: [Microsoft]
  a: |-
    **Short answer.** Let every machine build ids on its own from three parts packed into 64 bits: the current time in milliseconds, a machine number that no other machine shares, and a counter that restarts each millisecond. No machine talks to another to make an id, so it is fast and has no central bottleneck.

    **What to clarify.** How many bits the id may use: 64 fits a database integer column, 128 allows random ids. Whether ids must sort by time, and how strictly. Whether ids may reveal information, such as how many orders were made today. The peak rate. How many machines generate ids and in how many data centers.

    **The numbers that drive the design.**

    - Time. 41 bits of milliseconds cover 2 to the power 41 milliseconds, about 2.2 trillion, which is about 69 years from a start date you choose.
    - Machines. 10 bits give 1,024 generator ids.
    - Rate. 12 bits of counter give 4,096 ids per millisecond per machine, about 4 million a second each. A system that needs 100,000 ids a second uses a small part of one machine's range.

    The sign bit stays 0, so 1 plus 41 plus 10 plus 12 is 64.

    **Core design.**

    1. Layout, from the highest bits down: timestamp, machine id, counter. Time is at the top, so sorting ids as numbers sorts them by creation time to the millisecond.
    2. The timestamp counts from a custom start date, such as the day the system launched. Counting from 1970 would waste about 50 of the 69 years.
    3. Each generator gets its machine id at start-up from a coordination service, which leases each number to one live process at a time.
    4. To make an id, read the clock. If the millisecond is the same as for the last id, add one to the counter. If it is a new millisecond, reset the counter to 0.
    5. If the counter reaches 4,096 inside one millisecond, wait for the next millisecond.
    6. Run the generator as a library inside each service, or as a small id service that hands out ids in batches. The library has no network hop. The service keeps machine ids in one small fleet.

    **The hardest part.** Clocks. The scheme is unique only if a machine's clock never repeats a millisecond. Clock synchronisation can step a clock backwards, and a restarted process forgets the last time it used. Both can produce the same id twice.

    **Main trade-off.** Ids that are ordered by time and need no coordination, in exchange for depending on clocks and on a correct machine id. Random 128-bit ids need neither, but they are twice the size and spread inserts across the whole index. A central counter gives perfect order but is one more service that every write waits for.

    **What a senior answer adds.** The order is only approximate: two machines in the same millisecond produce ids in no meaningful order, and clocks differ by some milliseconds. Different bit splits for different needs, for example more counter bits and fewer machine bits. A plan for the day the 69 years run out. The fact that these ids leak creation time and rough volume, which matters for public identifiers.

    **Watch out for.** Using part of the IP address or the process id as the machine id. Two containers can share those, and then duplicates appear only under load, when they are hardest to trace.
  followUps:
    - q: Why not use a database auto-increment column or a random UUID?
      level: Junior
      topics: [/system-design/patterns/unique-id-generation, /system-design/databases/b-trees]
      a: |-
        **Short answer.** Both work, and both are good choices for small systems. Auto-increment stops fitting once writes go to more than one database. Random UUIDs cost space and slow down index inserts at very large sizes.

        **Why.**

        | Option | Size | Sorted by time | Needs coordination | Main problem |
        | --- | --- | --- | --- | --- |
        | Auto-increment | 64 bits | Yes, exactly | Yes, one database | One writer for everything, and it reveals counts |
        | Random UUID | 128 bits | No | No | Twice the size, inserts land all over the index |
        | Time plus machine plus counter | 64 bits | Roughly | Only for the machine id | Depends on clocks |

        A B-tree index keeps keys in order. Ids that grow over time are always added at the right-hand edge, so the same few pages stay in memory. Random ids land on a random page each time. Once the index is larger than memory, most inserts need a disk read.

        Auto-increment needs every insert to pass through one database. With 16 shards you can give each shard its own range or step, but then ids no longer sort by time across shards.

        Time-ordered UUID variants put a timestamp in the top bits and random bits below. They remove the insert problem and need no machine id, at the price of 128 bits.

        **Watch out for.** Dismissing auto-increment in an interview without a reason. For one database at a few thousand writes a second it is the simplest correct answer.
    - q: A generator's clock jumps backwards by 50 milliseconds. What does the generator do?
      level: Senior
      topics: [/system-design/patterns/unique-id-generation]
      a: |-
        **Short answer.** It must never issue an id with a timestamp lower than the last one it used. For a small jump it waits until the clock catches up. For a large jump it refuses to issue ids and raises an alarm.

        **Why.** If the clock returns to a millisecond the generator has already used, the counter may restart at 0 and repeat ids that already exist. So the generator remembers the last timestamp it used and compares it on every call.

        | Jump back | Response |
        | --- | --- |
        | A few milliseconds | Wait until the clock passes the last timestamp |
        | Tens of milliseconds | Keep using the last timestamp and keep counting up, until the clock catches up |
        | Seconds or more | Stop, fail health checks, let other generators serve |

        Restarts are the hidden case, because the last timestamp lived in memory. Two fixes are common. Save the last timestamp to disk every second and, on start, wait until the clock passes the saved value plus a margin. Or take a new machine id on every start, so old and new ids can never collide.

        Set the time service to slew, which means it speeds up or slows down the clock gradually and avoids steps.

        **Watch out for.** Leap seconds and virtual machine pauses. Both can move a clock in ways a test on a laptop never shows.
    - q: How does each generator get a machine id that no other generator is using?
      level: Mid
      topics: [/system-design/patterns/leader-election, /system-design/patterns/unique-id-generation]
      a: |-
        **Short answer.** At start-up it claims a free number from a coordination service and holds it with a lease that it must keep renewing. If the lease is lost, the generator stops issuing ids.

        **Why.** With 10 bits there are only 1,024 numbers, and container platforms create and destroy instances all day. Fixed numbers in configuration files drift into duplicates. A coordination service such as ZooKeeper or etcd gives a safe claim: "create entry 417 only if it does not exist", tied to the process's session. When the process dies, the entry expires and the number becomes free.

        The risk is a process that is paused, loses its lease without knowing, and wakes up still using number 417 while a new process holds it too. Two guards help. The generator checks its lease expiry time before issuing and stops well before it runs out. And a freed number is kept unused for a quiet period longer than any likely pause, such as a few minutes.

        The coordination service is needed only at start-up and for renewals. If it is down for a minute, running generators continue until their leases get close to expiry.

        **Watch out for.** Deriving the number by hashing the hostname into 1,024 slots. With only 40 machines, the chance that two share a slot is already more than half.
    - q: "The business now says ids must be strictly increasing across the whole system, with no exceptions. What changes?"
      level: Senior
      topics:
        [
          /system-design/patterns/unique-id-generation,
          /system-design/patterns/consistency-models,
          /system-design/patterns/leader-election,
        ]
      a: |-
        **Short answer.** Strict global order needs one place that decides the order. That means a single sequencer with a standby, and it means giving up some speed and some availability.

        **Why.** Independent machines with clocks that differ by a few milliseconds cannot agree on which of two events came first. Only a single authority can. The sequencer keeps a counter and makes it durable, usually by replicating through a consensus log, so a failover never hands out a number twice or goes backwards.

        The cost is a network round trip for each id, or for each batch. Batches bring a catch. If server A takes numbers 1,000 to 1,999 and server B takes 2,000 to 2,999, B may use 2,000 before A uses 1,001. The ids are unique and each server's ids increase, but the global order is gone. So truly strict order rules out batching across servers.

        Before building it, ask what the order is for. Often the real need is narrower:

        - Order within one account or one conversation: use a counter per entity, stored with that entity.
        - Order of committed transactions: use the database's own commit sequence.
        - Sorting a list by time: rough order is enough.

        **Watch out for.** Agreeing to strict global order without naming the price. One sequencer in one region adds a cross-region round trip to every write made elsewhere.
    - q: "A different allocator hands out ids from a fixed range of 1 billion and takes them back when they are released. How do you track which ids are free without storing an entry per id?"
      level: Senior
      a: |-
        **Short answer.** Use a bitmap, one bit per id, with summary levels above it so a free id is found in a few steps. If ids are used in long runs, store ranges and not single ids.

        **Why.** Compare the memory for 1 billion ids:

        | Structure | Memory | Find a free id |
        | --- | --- | --- |
        | Free list of 64-bit numbers | up to 8 GB | Instant |
        | Bitmap, 1 bit per id | 125 MB | A scan, unless helped |
        | Bitmap plus summary levels | about 127 MB | About 5 steps |
        | List of free ranges | Depends on fragmentation | Instant when ranges are few |

        In the bitmap, bit 1 means "in use". The summary level has one bit per 64-bit word of the level below, set when that word is completely full. Stack these levels until the top fits in one word. With a branching factor of 64, five levels cover 64 to the power 5, about 1.07 billion ids. To allocate, go down from the top, taking at each level the first bit that is not full. To release, clear the bit and clear the summary bits above it.

        **Watch out for.** Durability. An allocator that restarts with an empty bitmap hands out ids that are still in use. Save changes to a log, or rebuild the bitmap from the owners of the ids at start-up.
- id: design-webhook-delivery
  q: Design a webhook delivery system that sends events, such as "payment succeeded", to HTTP endpoints registered by thousands of customers.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/fundamentals/webhooks
    - /system-design/patterns/circuit-breaker-and-retries
    - /system-design/patterns/message-queues
    - /system-design/patterns/idempotency
  a: |-
    **Short answer.** Record every event durably, create one delivery job per subscribed endpoint, and let a pool of sender workers make signed HTTP calls. A failed call is retried with growing delays for a few days. Each endpoint is isolated, so one broken customer cannot slow the rest.

    **What to clarify.** The delivery promise: at least once is the realistic one. Whether order matters to customers. How long to keep retrying. How large payloads can be. Whether customers need a log of deliveries and a way to replay. How many endpoints one event can go to.

    **The numbers that drive the design.**

    - Volume. 100 million deliveries a day is about 1,160 a second on average. Plan for 5 times that, about 6,000 a second.
    - Open calls. A healthy endpoint answers in about 200 ms, so 6,000 a second means about 1,200 calls in progress. If 5 percent of calls hang until a 10 second timeout, those 300 a second hold 3,000 more. Slow endpoints, not volume, decide the size of the sender pool.
    - Storage. Keeping 30 days of events at 2 KB each is 200 GB a day, 6 TB in total.

    **Core design.**

    1. The service that produces an event writes it to an event table in the same database transaction as the business change. A relay then publishes it, so no event is lost between "payment saved" and "event sent".
    2. A fan-out step looks up which endpoints subscribe to that event type and creates one delivery job per endpoint, with its own state and attempt count.
    3. Jobs go on a queue. Sender workers take a job, build the body, add an event id header and a signature, and send an HTTP POST with a timeout of about 10 seconds.
    4. Any 2xx response marks the job delivered. A timeout, a connection error or a 5xx response schedules a retry.
    5. Retries use exponential backoff with random jitter: about 1 minute, 5 minutes, 30 minutes, 2 hours, then every few hours for up to 3 days.
    6. After the last attempt the job moves to a dead-letter store. The customer is emailed, and an endpoint that keeps failing is disabled.
    7. Every attempt is logged with status code and duration. Customers can see the log and ask for a replay.

    <AnimatedDiagram name="fundamentals/webhooks-pipeline" highlight={["eventlog", "queue", "senders", "retry", "dlq", "endpoint"]} caption="Events are logged, queued and sent by workers. Failed calls go to a retry schedule and, in the end, to a dead-letter queue." />

    **The hardest part.** The receivers are thousands of servers you do not control. Some are slow, some are down for hours, some return errors for ever. The system must keep its promise to the healthy ones while it waits for the broken ones.

    **Main trade-off.** Delivery guarantee against order and speed. Retrying for days means an old event can arrive after a newer one. Strict order per endpoint would mean that one failed event blocks everything behind it. Most systems choose at-least-once without ordering, and tell receivers how to cope.

    **What a senior answer adds.** Per-endpoint concurrency limits and circuit breakers. Protection against customers registering internal addresses. Signing with a timestamp to stop replayed requests, and secret rotation. A fair scheduler so that one customer's bulk import of a million events does not delay everyone else.

    **Watch out for.** Sending the HTTP call from inside the code path that created the event. A slow customer server would then slow down your own payments.
  followUps:
    - q: One customer's endpoint starts failing or taking 10 seconds on every call. How do you stop it from hurting delivery to everyone else?
      level: Senior
      topics:
        [
          /system-design/patterns/circuit-breaker-and-retries,
          /system-design/patterns/back-pressure,
          /system-design/patterns/rate-limiting,
        ]
      a: |-
        **Short answer.** Isolate endpoints from each other. Cap how many calls can be in progress per endpoint, and open a circuit breaker for an endpoint that keeps failing so its jobs wait without using workers.

        **Why.** Sender workers are a shared pool. An endpoint that receives 100 events a second and hangs for 10 seconds on each would hold 1,000 workers by itself. Healthy customers then wait behind it.

        Three controls work together:

        | Control | What it does |
        | --- | --- |
        | Concurrency cap | At most, say, 20 calls in progress per endpoint. Further jobs wait in that endpoint's own backlog |
        | Circuit breaker | After, for example, 10 failures in a row, stop calling for a minute. Then send one test call. Success closes the breaker |
        | Slow lane | Endpoints with poor recent history are served by a separate, smaller worker pool |

        While a breaker is open, jobs for that endpoint are rescheduled without an HTTP attempt, which costs almost nothing. The retry schedule still counts down, so an endpoint that stays broken for 3 days ends in the dead-letter store and is disabled, with emails to the owner along the way.

        Short timeouts help everyone. Publish a rule such as "answer within 10 seconds, and do slow work after replying".

        **Watch out for.** One queue served strictly in arrival order. The failing endpoint's retries keep returning to the front, and healthy deliveries queue behind them.
    - q: Can you promise that each event is delivered exactly once?
      level: Senior
      topics: [/system-design/patterns/idempotency, /system-design/fundamentals/webhooks]
      a: |-
        **Short answer.** No. Over a network you can only promise at least once. The receiver gets the effect of exactly once by remembering event ids and ignoring repeats.

        **Why.** Consider one call. The receiver processes the event and sends a 200 response, and the response is lost on the way back. The sender sees a timeout. It cannot tell this apart from "the request never arrived". If it retries, the receiver sees the event twice. If it does not, a real loss would go unrepaired. A system that must not lose events has to retry, so duplicates are certain to happen sometimes.

        The answer is to make duplicates harmless, with work on both sides:

        - The sender gives each event one stable id and sends the same id on every attempt.
        - The receiver stores each id it has handled, in the same transaction as the work the event triggers. When an id is already stored, it replies 200 and does nothing.
        - The receiver keeps ids at least as long as the sender retries, here 3 days, plus a margin.

        **Watch out for.** Writing "exactly once" in public documentation. Say "at least once, with a unique event id for deduplication", which is true and tells customers what to build.
    - q: Customers choose the URL you call. How do you stop someone from using your senders to reach your internal network?
      level: Senior
      topics:
        [
          /system-design/fundamentals/common-attacks,
          /system-design/fundamentals/security,
          /system-design/fundamentals/dns,
        ]
      a: |-
        **Short answer.** Treat every URL as hostile. Allow only HTTPS to public addresses, check the address at the moment of connecting, and run the senders in a network zone that cannot reach anything internal.

        **Why.** This attack is called server-side request forgery. A customer registers a URL that points at a private address, for example an internal admin page or a cloud metadata address that returns credentials. Your sender, which sits inside your network, makes the call for them. The delivery log may even show them the response.

        The defences, in layers:

        1. Validate at registration: HTTPS only, standard ports, no IP literals in private, loopback or link-local ranges.
        2. Validate again at send time. A hostname can point to a public address when registered and to 10.0.0.5 a minute later. Resolve the name, check the resolved address, and connect to that exact address, so a second lookup cannot give a different answer.
        3. Do not follow redirects, or check each redirect target in the same way.
        4. Put the senders in an isolated network segment whose outbound traffic passes through a proxy that blocks private ranges. If a check is missed in code, the network still says no.
        5. Show customers only the status code and a short, size-limited part of the response.

        **Watch out for.** Checking the URL only once, when it is registered. The DNS trick in step 2 defeats that completely.
    - q: How does a receiver know that a webhook really came from you and was not changed on the way?
      level: Mid
      topics:
        [
          /system-design/fundamentals/webhooks,
          /system-design/fundamentals/encryption-and-hashing,
          /system-design/fundamentals/api-auth,
        ]
      a: |-
        **Short answer.** Sign each request. Each endpoint has a secret that only you and that customer know. You compute a keyed hash of the timestamp and the body, and send it in a header. The receiver computes the same hash and compares.

        **Why.** The endpoint URL is public, so anyone can post a fake "payment succeeded" to it. A keyed hash, called an HMAC, can only be produced by someone who holds the secret. If one byte of the body changes, the hash no longer matches.

        The timestamp stops replay attacks. Without it, an attacker who captured one real request could send it again next week with a valid signature. The receiver rejects any request whose signed timestamp is more than about 5 minutes old.

        Details that make it work in practice:

        - Sign the raw bytes of the body. If the receiver parses the JSON and writes it out again, spacing changes and the hash fails.
        - Support two active secrets per endpoint during rotation, and send a signature for each. The customer can then change secrets with no failed deliveries.
        - Sign a retry again with a fresh timestamp. The event id stays the same.

        **Watch out for.** Relying on a list of your sending IP addresses as the only check. Addresses change, and a list proves little when traffic passes through shared infrastructure.
    - q: What ordering can you promise for events sent to one endpoint?
      level: Senior
      topics:
        [
          /system-design/fundamentals/webhooks,
          /system-design/patterns/message-queues,
          /system-design/patterns/consistency-models,
        ]
      a: |-
        **Short answer.** Promise no order by default, and give receivers what they need to work without it: a sequence number or version on each event, and an API to fetch the current state.

        **Why.** Order breaks in two ways. Workers send in parallel, so two events created 5 ms apart can arrive either way round. And retries reorder by hours: "invoice created" fails and is retried in 30 minutes, while "invoice paid" succeeds at once.

        Strict order is possible. Send one event at a time per endpoint, and do not send the next until the last is confirmed. Then a single failing event blocks all later ones, for up to 3 days. For most customers that is worse than events out of order.

        | Promise | Cost |
        | --- | --- |
        | No order, with a version on each event | Receiver must compare versions |
        | Order per object, such as per invoice | One stuck event blocks only that object |
        | Order per endpoint | One stuck event blocks the customer |

        With a version on each event, the receiver keeps the highest version it has applied per object and ignores anything older. A simpler pattern treats the webhook as a hint: on any event for invoice 77, fetch invoice 77 from the API and store what comes back.

        **Watch out for.** Using the event's creation timestamp to order. Two events in the same millisecond, or from servers with slightly different clocks, will be put in the wrong order.
    - q: A customer's server is offline for six hours and then comes back. What happens to their events?
      level: Mid
      topics:
        [
          /system-design/patterns/circuit-breaker-and-retries,
          /system-design/patterns/back-pressure,
          /system-design/fundamentals/webhooks,
        ]
      a: |-
        **Short answer.** Nothing is lost. Their events wait in the retry schedule, and when the endpoint answers again the backlog is delivered at a controlled rate.

        **Why.** Six hours is well inside a 3 day retry window. During the outage each event fails a few times and moves to longer delays. The circuit breaker for that endpoint is open, so most of the waiting costs no HTTP calls. A test call every minute or so checks whether the endpoint is back.

        The return is the risky moment. A customer who gets 50 events a second has built a backlog of about 1 million. Sending them all as fast as possible would knock over a server that has only just restarted. So the backlog drains under the endpoint's concurrency cap, and the rate rises step by step while calls keep succeeding.

        Because of backoff, some events are not due for another hour or two when the endpoint returns. A good system notices the first success and brings the waiting retries for that endpoint forward.

        If the outage lasts longer than 3 days, events move to the dead-letter store and the endpoint is disabled. Events stay stored for 30 days, so the customer can replay a time range, or list events from the API and catch up.

        **Watch out for.** Leaving recovery to the retry timers alone. The customer is back at 14:00 and still receives 09:00 events at 16:00.
- id: design-ab-testing
  q: Design an A/B testing platform where teams define experiments, users are assigned to variants consistently, and results are reported per variant.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/consistent-hashing
    - /system-design/databases/analytical-databases
    - /system-design/patterns/message-queues
  a: |-
    **Short answer.** Keep experiment definitions in a small configuration service. Each application server holds a copy and assigns a user to a variant by hashing the user id, with no network call and no stored assignment. Servers log which user saw which variant, and a data pipeline joins those logs with business events to compare the variants.

    **What to clarify.** What is tested: user interface, backend logic or both. Whether users are logged in, since that decides the id to hash. How many experiments run at once. How fast results are needed: daily is normal, and safety metrics may need minutes. Who reads the results, and how much statistics help they need.

    **The numbers that drive the design.**

    - Assignment checks. 100 million daily users making 200 requests each, with about 10 experiment checks per request, is 200 billion checks a day, about 2.3 million a second. This rules out a network call per check. Assignment must run in memory.
    - Exposure logs. If each user enters 20 experiments a day and each exposure is logged once per user per experiment per day, that is 2 billion rows a day, about 23,000 a second.
    - Storage. At 100 bytes a row, exposures are 200 GB a day. The business events they join with are much larger and already live in the data warehouse.

    **Core design.**

    1. An experiment definition holds a name, a salt (a random string unique to the experiment), the variants with their traffic shares, targeting rules such as country or app version, start and end dates, and the metrics to judge it by.
    2. A configuration service stores definitions and publishes a versioned snapshot. An SDK inside each server and each app downloads the snapshot and refreshes it about every 30 seconds.
    3. To assign, the SDK computes `hash(salt + user id) mod 10000` to get a bucket. Each variant owns a range of buckets. The same user always lands in the same bucket.
    4. At the moment the user actually meets the changed experience, the SDK logs an exposure event: user id, experiment, variant, time. Events go through a queue into the warehouse.
    5. A scheduled job joins exposures with business events, such as orders, and computes each metric per variant with a confidence interval.
    6. A dashboard shows the results, along with health checks on the experiment itself.
    7. Guardrail metrics such as error rate and latency are computed every few minutes and can stop an experiment automatically.

    **The hardest part.** Trust. The mechanics are simple. The hard work is making sure a reported gain of 2 percent is real: assignment is truly random, exposure logging is complete in every variant, and experiments do not disturb each other.

    **Main trade-off.** Assignment by hash needs no storage and no lookups, but any change to the traffic split must be planned so that users do not switch variants. Stored assignments allow any change at the cost of a read on every check and a very large table.

    **What a senior answer adds.** Layers, so that hundreds of experiments share the same users safely. A check on the sample ratio as a standard alarm. A fixed analysis plan to stop people from reading results too early. A holdout group that receives no new features, to measure the long-term effect of everything shipped.

    **Watch out for.** Logging exposure when the assignment is computed. If the code computes variants for every user on every request, most logged users never saw the change, and the real effect is diluted until it cannot be seen.
  followUps:
    - q: Why assign users with a hash when you could store each user's variant in a database?
      level: Mid
      topics: [/system-design/patterns/consistent-hashing, /system-design/patterns/caching]
      a: |-
        **Short answer.** A hash gives the same answer everywhere with no storage, no network call and nothing to keep in sync. A stored assignment gives flexibility that is rarely needed, and costs a lookup on the busiest path.

        **Why.** The hash is a pure function of the experiment's salt and the user id.

        | | Hash | Stored assignment |
        | --- | --- | --- |
        | Cost per check | A microsecond of CPU | A cache or database read |
        | Storage | None | Users times experiments: 100 million users in 20 experiments is 2 billion rows |
        | Works offline in an app | Yes | No |
        | Arbitrary changes later | Only planned ones | Yes |
        | Hand-picked users | Needs an override list | Natural |

        The salt matters. If every experiment hashed the user id alone, the same users would be in the first variant of every experiment, and the results of one experiment would be mixed with the others. A different salt per experiment makes each split independent.

        **Watch out for.** Using `user id mod 2` with numeric ids. Ids are often handed out in patterns, such as even numbers from one data center, and the groups are then not random.
    - q: An experiment runs at 5 percent and looks safe. How do you raise it to 50 percent without moving users who are already in it?
      level: Senior
      topics: [/system-design/patterns/consistent-hashing]
      a: |-
        **Short answer.** Assign by fixed buckets and only ever add buckets to a variant. A user's bucket never changes, so users who had the treatment keep it and new users join.

        **Why.** With 10,000 buckets, a split of 5 percent treatment and 5 percent control might give treatment buckets 0 to 499 and control buckets 500 to 999. The other 9,000 buckets are not in the experiment. To grow to 50 percent each, give treatment 4,500 more buckets and control 4,500 more, all from the unused pool. No existing user changes side.

        The naive way is to compare the hash with a threshold and move the threshold. That breaks when the boundary between variants moves. If treatment was "below 5 percent" and control was "5 to 10 percent", a change to "below 50 percent" turns every control user into a treatment user. Their past behaviour is now counted on the wrong side.

        Analysis needs care after a ramp. Users who joined in week one differ from users who joined in week three: they have had more time to buy, and the first days of a new feature bring a novelty effect. Compare treatment and control users who entered in the same period, or analyse only from the last ramp step.

        **Watch out for.** Changing the salt to "restart" an experiment while keeping its name. Every user is assigned again at random, and old and new data cannot be combined.
    - q: Hundreds of experiments run at once. How do you stop them from interfering with each other?
      level: Senior
      topics: [/system-design/patterns/consistent-hashing, /system-design/patterns/sharding]
      a: |-
        **Short answer.** Group experiments into layers. Experiments that could conflict share a layer and split its users between them. Experiments in different layers overlap freely, because independent hashing spreads each one evenly across the others.

        **Why.** There are not enough users to give each experiment its own slice. 300 experiments that each need 10 percent of traffic would need 30 times the user base. So users must be in many experiments at once.

        Overlap is safe when the splits are independent. Each layer has its own salt. A user in the treatment of a checkout experiment is equally likely to be in either arm of a search ranking experiment. The search change therefore adds the same amount to both checkout arms, and the difference between them still measures the checkout change.

        Overlap is unsafe when two experiments touch the same thing. One changes the buy button to green and the other changes the page background to green. The combination is a page no one designed. Those two go in the same layer, where a user's bucket can belong to only one experiment at a time.

        | Relationship | Placement |
        | --- | --- |
        | Same screen or same parameter | Same layer, users split between them |
        | Unrelated areas | Different layers, full overlap |

        **Watch out for.** Assuming that independent assignment means no interaction. Two unrelated changes can still combine badly, so for large launches check the metric for users who were in both treatments.
    - q: How do you keep a user in the same variant before and after they log in, and across their devices?
      level: Mid
      topics: [/system-design/fundamentals/api-auth]
      a: |-
        **Short answer.** Choose the id to hash according to where the experiment runs. Use the account id for experiences behind login and a device or browser id for experiences before login, and accept that no single id is perfect across that boundary.

        **Why.** The hash is only as stable as its input.

        | Unit | Stable across devices | Works when logged out | Typical use |
        | --- | --- | --- | --- |
        | Account id | Yes | No | Features inside the product |
        | Device or cookie id | No | Yes | Landing pages, sign-up flow |

        The hard case is an experiment that covers both sides, such as a new sign-up flow whose success is measured by purchases made after login. Assign by device id and keep doing so after login for that experiment. Then record the link between the device id and the account at login, so that the analysis can connect later purchases to the variant the person saw.

        A person with a phone and a laptop may see different variants before logging in. This weakens the measured effect a little, and it applies equally to both variants, so the comparison stays fair.

        **Watch out for.** Switching from device id to account id at login inside one experiment. About half of the users change variant at that moment, and both arms now hold people who saw both versions.
    - q: The dashboard shows the new variant is 2 percent better. What do you check before you believe it?
      level: Senior
      topics: [/system-design/databases/analytical-databases]
      a: |-
        **Short answer.** Check that the experiment itself is healthy before reading its result: that the groups have the sizes they should have, that the test ran for its planned time, and that the difference is larger than chance would give.

        **Why.** Four checks catch most false results.

        1. Sample ratio. A 50 to 50 split with 100,000 users should give close to 50,000 each. Random variation is about 160 users either way. Seeing 50,900 against 49,100 is far outside that, and means users are being lost or miscounted in one variant, often because one variant crashes or logs exposures differently.
        2. Peeking. If someone looks every day and stops as soon as the result looks significant, the chance of a false win rises from the planned 5 percent to 20 percent or more over a few weeks. Fix the duration in advance, or use a statistical method designed for repeated looks.
        3. Duration. Run for whole weeks, because weekday and weekend users behave differently,.
        4. Many metrics. With 20 metrics on a dashboard, one will look significant by chance alone. Decide on one primary metric before the test starts.

        Then look at the confidence interval. A gain of 2 percent with a range from minus 1 to plus 5 is not a result yet.

        **Watch out for.** Searching through segments after the test until one shows a win. Some segment always does.
- id: design-blocklist
  q: Design a distributed blocklist that lets gateways in several data centers refuse traffic from millions of banned IP addresses.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/bloom-filter
    - /system-design/fundamentals/abuse-protection
    - /system-design/fundamentals/api-gateway
    - /system-design/patterns/caching
  companies: [Google]
  a: |-
    **Short answer.** Split the system in two. A control plane owns the list of rules and every change to it. A data plane puts a full copy of the list in the memory of every gateway, so each request is checked locally in well under a millisecond. Changes flow from the control plane to all gateways within seconds as a stream of small updates.

    **What to clarify.** How many entries, and whether they are single addresses, ranges, or other keys such as user ids or tokens. How fast a new block must take effect. Who adds rules: people, automatic detectors or outside feeds. Whether to allow or deny traffic when the list cannot be read. Whether a wrongly blocked user is worse than a missed attacker.

    **The numbers that drive the design.**

    - Lookups. 500,000 requests a second across all gateways, each needing a check. A remote call of even 1 ms per request would add delay and a dependency to every request. The check must be local.
    - Memory. 10 million entries in a hash set at about 50 bytes each is 500 MB per gateway process. A Bloom filter at 10 bits per entry is 100 million bits, about 12.5 MB, with about 1 percent false positives.
    - Change rate. Even 100 new rules a second is tiny next to the lookup rate. Reads and writes differ by a factor of 5,000, so the design optimises reads.

    **Core design.**

    1. A rules database is the source of truth. Each rule has an id, the address or range, a reason, who created it, a creation time, an expiry time and a version.
    2. Every change is appended to an ordered change log with a sequence number that only goes up.
    3. A distributor in each data center follows the log and pushes changes to the gateways there over long-lived connections.
    4. Each gateway keeps the list in memory in a structure built for fast lookup: a hash set for exact addresses and a prefix tree for ranges.
    5. A gateway that starts or falls far behind downloads a recent full snapshot from object storage, then applies log entries after the snapshot's sequence number.
    6. On each request the gateway checks the client address. A hit is refused with a 403 response, or the connection is dropped, and the rule id is logged.
    7. Each gateway reports the sequence number it has reached, so the control plane can see who is behind.

    **The hardest part.** Changing the list safely. The lookup is easy. The danger is a wrong rule, such as a range that covers a whole mobile carrier, reaching every gateway in 5 seconds and blocking real customers everywhere at once.

    **Main trade-off.** Speed of propagation against safety. An attacker should be blocked everywhere within seconds, but the same speed spreads mistakes. Automatic narrow rules can go out at once. Wide or manual rules go through checks and a staged release.

    **What a senior answer adds.** A decision on failure: when the control plane is down, gateways keep enforcing the last list they have. Short default expiry times, because IP addresses are reassigned. An allowlist that always wins, to protect partners and internal systems. Blocking as close to the edge as possible, so banned traffic costs little.

    **Watch out for.** Calling a central blocklist service on every request. It adds latency to all traffic and turns the blocklist into a way to take the whole site down.
  followUps:
    - q: Where does a Bloom filter help in this design, and what do you do about its false positives?
      level: Mid
      topics: [/system-design/patterns/bloom-filter, /system-design/patterns/caching]
      a: |-
        **Short answer.** A Bloom filter is a small first check that can say "certainly not on the list" from memory. It helps when the full list is too large to hold locally or the exact check is costly. A "maybe" from the filter must always be confirmed against the exact list before blocking.

        **Why.** A Bloom filter is a bit array plus a few hash functions. It never misses an entry that was added, and it sometimes says "maybe" for an entry that was not. At 10 bits per entry, about 1 in 100 clean addresses gets a "maybe".

        Blocking on the filter alone would refuse 1 percent of real users, which is not acceptable. So the flow is:

        | Filter says | Share of clean traffic | Action |
        | --- | --- | --- |
        | Not present | 99 percent | Allow at once |
        | Maybe present | 1 percent, plus all truly banned traffic | Check the exact store, then decide |

        This matters most when the exact store is remote, as with an outside lookup API. The filter removes 99 percent of calls.

        A standard Bloom filter cannot delete. Expired rules are removed by rebuilding the filter from the list on a schedule, or by using a counting variant.

        **Watch out for.** A filter that fills up. If the list grows to 5 times the size the filter was built for, most answers become "maybe" and it stops saving anything.
    - q: A rule is added in one data center. How does it reach gateways in the others, and what happens if the link between data centers breaks?
      level: Senior
      topics:
        [
          /system-design/databases/single-leader-replication,
          /system-design/databases/sync-vs-async-replication,
          /system-design/patterns/consistency-models,
        ]
      a: |-
        **Short answer.** Rules are written in one home region and copied asynchronously to every data center as an ordered log. Each data center serves its gateways from its local copy. If a link breaks, that data center keeps enforcing what it has and catches up when the link returns.

        **Why.** A single writer gives every rule change one global sequence number, so all data centers apply changes in the same order.

        Copying is asynchronous, so a write is confirmed as soon as the home region stores it. Remote data centers usually follow within a second or two. This means that for a few seconds a banned address is blocked in one place and not in another.

        Detection often happens locally. A gateway in Frankfurt sees an attack and must wait for the round trip through the home region. To avoid that, allow a local fast path: the detecting data center applies a short-lived block at once and also submits it to the control plane, which makes it global.

        During a break, the cut-off data center cannot receive new rules. Its gateways report a growing lag, an alarm fires, and local fast-path blocks still work.

        **Watch out for.** Letting every data center accept writes to the main list. Conflicting edits to the same rule, such as an unblock in one place and an extension in another, then need merge rules that are hard to reason about.
    - q: How do rules expire, and why give each rule a version?
      level: Mid
      topics: [/system-design/patterns/caching, /system-design/fundamentals/abuse-protection]
      a: |-
        **Short answer.** Every rule carries an expiry time that each gateway enforces on its own, and a version number that lets a gateway ignore an update that is older than what it already holds.

        **Why.** IP addresses change hands. A home connection gets a new address within days, and a cloud address may belong to a different company next week. A block with no end date will, in time, punish someone innocent. So every rule gets a time to live.

        The gateway enforces expiry locally by comparing the rule's expiry time with its own clock when the rule matches. A sweep removes dead entries every minute. If the "remove this rule" message is lost or late, the rule still dies on time.

        Versions solve reordering. Suppose rule 88 is extended (version 3) and then removed (version 4), and a gateway receives the two messages in the wrong order. Without versions it would remove the rule and then bring it back. With versions it sees that 3 is lower than 4 and drops the old message. For this to work, a removed rule stays for a while as a small marker that holds its last version.

        **Watch out for.** Gateways with wrong clocks. Use expiry times with a margin of a minute, and monitor clock drift.
    - q: Someone adds a rule that blocks real customers. How do you limit the damage and undo it quickly?
      level: Senior
      topics: [/system-design/fundamentals/abuse-protection, /system-design/fundamentals/availability]
      a: |-
        **Short answer.** Check a rule's likely effect before it goes live, release wide rules in stages, and make removal a single action that travels on the same fast path as a block.

        **Why.** Prevention comes first, because a bad wide rule does harm within seconds.

        - Dry run. Before enforcing, test the rule against the last hour of traffic logs. "This range matched 2.1 million requests from 40,000 logged-in users" is a clear warning.
        - Size limits. Reject any range above a set size, for example more than 65,536 addresses, unless a second person approves it.
        - Allowlist. Addresses of partners, payment providers, health checkers and your own offices can never be blocked. The allowlist is checked first.
        - Staged release. Wide rules go to 1 percent of gateways, then to all, with a watch on the share of requests refused.

        Then recovery. Every rule has an id and every refusal logs that id, so a sudden rise in refusals points to one rule. Disabling it is one call that reaches gateways in seconds. A kill switch turns off a whole category, such as all rules from one detector. Because the list is versioned, the control plane can also publish the list as it was 10 minutes ago.

        **Watch out for.** An undo path that is slower than the block path. If removal waits for a cache to expire, a five-second mistake becomes an hour-long outage.
    - q: "Suppose the banned list sits behind an external lookup API that takes 50 ms per call. How do you use it without slowing every connection?"
      level: Senior
      topics:
        [
          /system-design/patterns/caching,
          /system-design/patterns/circuit-breaker-and-retries,
          /system-design/patterns/bloom-filter,
        ]
      a: |-
        **Short answer.** Keep the API off the request path. Sync the list in bulk if the provider allows it. If it does not, cache every answer locally with a time limit, look up unknown addresses in the background, and decide in advance what to do when the API is slow or down.

        **Why.** Adding 50 ms to every new connection is a visible delay.

        In order of preference:

        1. Bulk sync. Download the whole list and its changes on a schedule, and serve it from memory as in the main design.
        2. Cache per address. Store both "banned" and "clean" answers, each with an expiry such as 10 minutes. Most traffic comes from addresses seen recently, so the hit rate is high.
        3. First contact. For an address never seen before, either wait up to a strict limit such as 20 ms, or allow the request and look the address up in the background, so that the next request is decided correctly.

        Then the failure policy. When the API times out, a circuit breaker stops calling it for a short time. During that time gateways use cached answers, even slightly expired ones, and allow unknown addresses. This is called failing open. Failing closed would refuse everyone and turn the provider's outage into yours.

        **Watch out for.** Caching only "banned" answers. Clean addresses are the large majority, and each of them would then call the API on every request.
    - q: How do you record why each request was blocked, so that a decision can be explained later?
      level: Mid
      topics: [/system-design/case-studies/metrics-and-logging, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** Keep two records. An audit trail of every rule change says who did what and why. A decision log of refusals says which request met which rule and which version of the list.

        **Why.** The two answer different questions and differ greatly in size.

        | Record | Holds | Volume | Kept for |
        | --- | --- | --- | --- |
        | Rule audit trail | Rule id, old and new value, author or detector, reason, time | Small: every change | Years |
        | Decision log | Time, client address, rule id, list version, gateway, action taken | Large: every refusal | Weeks, in full or sampled |

        The audit trail is append-only and lives with the rules database. Nobody edits or deletes entries, and that includes administrators.

        Refusals are logged without blocking the request. The gateway writes a compact record to a local buffer, and an agent ships batches through a queue to a log store. During an attack one address may be refused 100,000 times a second. Writing each one would flood the pipeline, so the gateway logs the first few refusals per rule and address in full, then keeps a count per minute.

        The rule id plus the list version make a decision reproducible. Support can say: "At 14:02 you were refused under rule 88, created by the login abuse detector at 13:55 after 300 failed logins."

        **Watch out for.** Logging only the fact of a block. Without the rule id, finding the cause of a wrong block means guessing.
- id: design-distributed-tracing
  q: Design a distributed tracing system that follows one request across hundreds of services, with sampling to keep the cost under control.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/case-studies/metrics-and-logging
    - /system-design/patterns/message-queues
    - /system-design/patterns/back-pressure
    - /system-design/databases/wide-column-stores
  companies: [Datadog]
  a: |-
    **Short answer.** Every service records a span, a small timed record of one piece of work, and passes a shared trace id to the next service in the request headers. Spans flow through local agents and a collector tier, a sampler keeps a small share of whole traces, and the kept traces go to a store that can fetch a trace by id and search by service, error and latency.

    **What to clarify.** How many services and requests a second. Whether the goal is debugging single slow requests, a service dependency map, or both. How long traces are kept.

    **The numbers that drive the design.**

    - Span rate. 500,000 requests a second at the edge, each touching about 20 services, gives 10 million spans a second.
    - Raw volume. At about 500 bytes a span that is 5 GB a second, or roughly 430 TB a day. Nobody stores that, so sampling is part of the core design.
    - Kept volume. Keeping 1% of traces is about 4.3 TB a day. With 15 days of retention the store holds about 65 TB before compression.

    **Core design.**

    1. A tracing library in each service starts a span for each incoming request and each outgoing call.
    2. The library adds the trace id, the current span id and a sampling flag to outgoing request headers. The next service reads them and continues the same trace.
    3. Finished spans go into a small in-memory buffer and are sent in batches to an agent on the same host. The request never waits for this.
    4. Agents forward spans to a collector tier. Spans are routed by a hash of the trace id, so all spans of one trace reach the same collector.
    5. The collector holds each trace for about 30 seconds, then decides whether to keep it. It keeps all traces with errors or high latency and a small random share of the rest.
    6. Kept traces are written to a durable log such as Kafka. One consumer writes spans to a store keyed by trace id. A second consumer builds the search index and the service dependency map.
    7. The query service answers "show trace X" with one key lookup, and "find slow checkout traces from the last hour" from the index.

    **The hardest part.** Deciding what to keep. The traces engineers want are the rare failed and slow ones, and those cannot be known when the request starts. Deciding at the end means buffering every span for a short time: 30 seconds at 5 GB a second is about 150 GB of memory spread over the collector fleet.

    **Main trade-off.** Sampling at the start of a request (head sampling) is cheap, because unsampled services record nothing, and it misses most rare errors. Sampling at the end (tail sampling) keeps the interesting traces and pays for buffering and for routing by trace id.

    **What a senior answer adds.** Request counts, error counts and latency histograms computed from all spans before sampling, so dashboards stay exact when only 1% of traces are stored. A sampling rate per service and per endpoint, so a low-traffic service is not sampled down to nothing. Tracing overhead held under about 1% of CPU.

    **Watch out for.** Sampling span by span. Each service then keeps a different random 1%, and almost no trace is complete. The decision must be made once per trace and followed by every service.
  followUps:
    - q: How does the trace context travel from one service to the next, including through a message queue?
      level: Junior
      topics: [/system-design/fundamentals/http, /system-design/patterns/message-queues]
      a: |-
        **Short answer.** The calling service puts the trace id, its own span id and a sampling flag into a request header. The receiving service reads the header and uses those values as the parent of its own span. For a queue, the same values travel as message headers.

        **Why.** Services share no memory, so the only way to link their work is to send the link with the request. The common format is the W3C `traceparent` header. It carries a 16-byte trace id, an 8-byte span id for the caller and one byte of flags, about 55 characters as text.

        Inside one service, the library must also carry the context from the incoming request to every outgoing call.

        A queue breaks the simple parent and child timing, because the consumer may run minutes later. The producer writes the context into the message headers. The consumer starts a new span that points back to the producer's span, so the trace shows the wait in the queue as its own gap.

        **Watch out for.** One service in the middle that drops the header, for example an old proxy or a hand-written HTTP client. Everything after it becomes a separate trace, and the first trace looks as if it ended early.
    - q: With sampling at 1%, how do you make sure the traces you keep are the interesting ones?
      level: Senior
      topics: [/system-design/case-studies/metrics-and-logging, /system-design/patterns/consistent-hashing]
      companies: [Datadog]
      a: |-
        **Short answer.** Decide after the trace is complete. Buffer all spans of a trace in one collector, then apply rules: keep every trace with an error, keep the slowest traces for each endpoint, and keep a small random share of the normal ones.

        **Why.** If 0.1% of requests fail and you keep a random 1%, you store one failed trace in every 100,000 requests.

        Three things make this work:

        - **Routing.** All spans of a trace must meet in one place. Agents pick the collector by consistent hashing on the trace id, so adding a collector moves only a small share of traces.
        - **A wait window.** The collector waits about 30 seconds after the first span, then decides. Spans that arrive later follow a short-lived record of the decision.
        - **A budget.** Rules are ordered and each has a rate cap, for example at most 500 error traces a second per service. During an outage every trace has an error, and an uncapped rule would keep 100% of traffic.

        **Watch out for.** Keeping only errors and slow requests. Engineers need normal traces too, to see what "healthy" looks like and to compare against.
    - q: How do you check that the sampling is working correctly?
      level: Senior
      topics: [/system-design/case-studies/metrics-and-logging]
      companies: [Datadog]
      a: |-
        **Short answer.** Compare what the sampler kept against numbers that were never sampled. Count every span before the decision, then check that the kept traces, scaled up by their keep rate, match those counts.

        **Why.** A broken sampler fails silently. Four checks catch most problems:

        | Check | What it shows |
        | --- | --- |
        | Estimated count against real count | Each kept trace stores its keep probability. A trace kept at 1 in 100 counts as 100. The sum per endpoint should be within a few percent of the exact request counter. |
        | Kept rate per rule | Error traces kept, divided by error requests seen. This should be near 100% until the cap is reached. |
        | Complete traces | Share of stored traces where every span has its parent. A drop means spans are split across collectors or arrive after the window. |
        | Coverage | Every service and endpoint with traffic has at least a few traces an hour. |

        Alert on these as on any other service metric.

        **Watch out for.** Checking only the total volume. The total can match the target of 1% while one busy endpoint supplies nearly all of it and 200 quiet endpoints supply nothing.
    - q: How would you store traces so that "get trace by id" is fast and "find slow checkout traces from the last hour" also works?
      level: Mid
      topics:
        [
          /system-design/databases/wide-column-stores,
          /system-design/databases/object-storage,
          /system-design/databases/inverted-index,
        ]
      a: |-
        **Short answer.** Use two structures. Store spans grouped by trace id for the direct lookup, and keep a separate, much smaller index of trace summaries for search.

        **Why.** The two queries have different shapes. A lookup by id wants all spans of one trace next to each other on disk. A wide-column store with the trace id as the partition key does that in one read, and it handles the write rate because writes are appends.

        Search does not need the spans. It needs one summary row per trace: root service, endpoint, start time, duration, error flag and a few chosen tags. With 5,000 kept traces a second and about 300 bytes a row, that is roughly 130 GB a day. Put it in a store that filters by time range and tags, such as a search engine or a column store, partitioned by hour. The search returns trace ids, and the UI then fetches the full trace.

        After a few days, pack traces into compressed blocks in object storage and keep only a small lookup table from trace id to block.

        **Watch out for.** Indexing every tag. A tag such as user id or request id has millions of distinct values and can make the index larger than the data. Let teams choose a short list of searchable tags.
    - q: A service's traffic jumps to ten times normal. How do you stop tracing from slowing down or crashing the service?
      level: Mid
      topics: [/system-design/patterns/back-pressure, /system-design/patterns/rate-limiting]
      a: |-
        **Short answer.** Tracing must drop data before it slows a request. Use a fixed-size buffer in the library, send in the background, and discard spans when the buffer is full.

        **Why.** Tracing is a helper. Adding latency to checkout because the tracing pipeline is busy is a failure of the design.

        The protection is layered:

        - **Library.** Finished spans go into a bounded queue, for example 2,000 spans. A background thread sends batches. A full queue means new spans are dropped and a counter goes up. The request thread never waits on the network.
        - **Agent.** A memory cap and a rate cap per service. Above the cap it lowers the sampling rate for that service, so whole traces are dropped and kept traces stay complete.
        - **Collectors.** A durable log in front of storage absorbs short bursts. If the tail-sampling buffer fills, the collector shortens its wait window or falls back to a random sample.

        **Watch out for.** An unbounded buffer "so no data is lost". During a spike or a collector outage it grows until the service runs out of memory, and tracing has then caused the outage it was meant to explain.
- id: design-api-gateway
  q: Design an API gateway that sits in front of a company's microservices, including a "bootstrap" endpoint that returns everything a mobile app's first screen needs in one call.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/fundamentals/api-gateway
    - /system-design/patterns/rate-limiting
    - /system-design/fundamentals/api-auth
    - /system-design/patterns/circuit-breaker-and-retries
  companies: [DoorDash]
  a: |-
    **Short answer.** The gateway is a fleet of stateless proxies that every outside request passes through. It ends TLS, checks who the caller is, applies rate limits, routes the request to the right service and records what happened. Endpoints that combine several services, such as the bootstrap call, run in a thin aggregation layer behind it.

    **What to clarify.** Who the callers are: our own apps, partners, or both. Peak requests a second. How much latency the gateway may add. Which jobs belong in it: authentication, rate limiting, request shaping, aggregation.

    **The numbers that drive the design.**

    - Fleet size. 50,000 requests a second at peak, with one node handling about 5,000, needs 10 nodes. Run 20 across three zones, so the loss of one zone still leaves spare capacity.
    - Added latency. The budget is about 5 ms at the 99th percentile. A network call to an auth service costs 1 to 2 ms each time, so token checks must happen locally, by verifying a signature in well under a millisecond.
    - Limiter state. 10 million active clients with about 100 bytes of counters each is 1 GB, which fits in a small in-memory store cluster.

    **Core design.**

    1. DNS and a network load balancer spread connections over the gateway nodes.
    2. Each request passes through a fixed chain of filters: TLS, request id, authentication, rate limit, routing, then response filters.
    3. Authentication verifies a signed token using keys held in memory, and passes the user id to backends in a trusted header.
    4. The rate limiter checks counters per client and per route in a shared in-memory store, and answers 429 when a limit is passed.
    5. The router matches path and method against a route table, picks a healthy instance from service discovery, and forwards with a timeout.
    6. A control plane stores routes and policies with version numbers and pushes changes to every node. A node keeps serving with its last good configuration if the control plane is down.
    7. The bootstrap endpoint lives in an aggregation service per client type. It calls profile, cart, store list, promotions and the others in parallel, and merges the results into one response.

    <AnimatedDiagram name="fundamentals/api-gateway" highlight={["gateway", "auth", "limits", "mbff"]} caption="Every request goes through authentication and rate limiting at the gateway, then to a backend service or to a per-client aggregation layer." />

    **The hardest part.** The gateway is shared by everyone, so one slow backend can hurt all the others. If the orders service stops answering, requests to it hold connections and memory until the node has none left for anyone. Each backend needs its own timeout, its own cap on concurrent requests and a circuit breaker, which is a switch that fails calls fast once a dependency keeps failing.

    **Main trade-off.** Each feature moved into the gateway removes repeated code from 200 services and adds latency and risk to every request. Keep the shared path small and generic.

    **What a senior answer adds.** Config rollout as a deploy: validation, a canary node, automatic rollback. Limits per client and per route, plus load shedding by priority so checkout outlives recommendations. A request id and deadline passed to every backend.

    **Watch out for.** Business rules in the gateway. Once it knows how to price an order, every product change needs a gateway release, and the gateway team becomes a bottleneck.
  followUps:
    - q: The bootstrap endpoint calls six services in parallel. How do you set timeouts, deadlines and retries?
      level: Senior
      topics: [/system-design/patterns/circuit-breaker-and-retries, /system-design/fundamentals/api-gateway]
      companies: [DoorDash]
      a: |-
        **Short answer.** Give the whole request one deadline, pass the time remaining to every call, and allow at most one retry, only for safe reads and only while there is still time left.

        **Why.** With six parallel calls, the slowest one sets the response time. If each service is slower than 200 ms in 1% of calls, about 6% of bootstrap requests hit one slow call, since 1 minus 0.99 to the power 6 is about 0.06.

        A workable setup for a 400 ms budget:

        - **Deadline.** The aggregator stamps the request with "must finish by" and sends the remaining time in a header. A backend that receives 30 ms of budget for a 100 ms job can refuse at once.
        - **Per-call timeout.** About 250 ms, leaving time to merge and send.
        - **Retry.** One extra attempt, on a different instance, for reads only. A second request sent when the first has not answered by the usual 95th percentile time, say 80 ms, cuts the tail at a cost of about 5% more calls.
        - **Retry budget.** Retries may add at most 10% to a backend's traffic.

        **Watch out for.** Retries at several layers. Three attempts at the app, the gateway and the aggregator turn one request into 27 calls against a service that is already struggling.
    - q: One of the six services behind the bootstrap call fails. What do you return to the app?
      level: Mid
      topics: [/system-design/fundamentals/api-design, /system-design/fundamentals/availability]
      companies: [DoorDash]
      a: |-
        **Short answer.** Return what you have. Mark each section of the response as required or optional. A failed optional section comes back empty with a status, and only a failed required section fails the whole call.

        **Why.** If all six must succeed and each is up 99.9% of the time, the endpoint is up only about 99.4% of the time. Partial responses break that link.

        Decide the class of each section with the product team:

        | Section | Class | If it fails |
        | --- | --- | --- |
        | User profile, session | Required | Fail the call with a 5xx, app shows retry |
        | Store list | Required | Serve a recent cached copy if one exists |
        | Cart | Optional | Empty section with status "unavailable", app loads it later |
        | Promotions, recommendations | Optional | Leave out, app hides the banner |

        The response carries a status per section, so the app can tell "no promotions" from "promotions failed" and retry that section alone through its own endpoint.

        **Watch out for.** Caching the partial response as if it were complete, or showing a failed cart as an empty cart. The user then believes their items are gone.
    - q: What observability would you build into the gateway?
      level: Mid
      topics: [/system-design/case-studies/metrics-and-logging, /system-design/fundamentals/api-gateway]
      companies: [DoorDash]
      a: |-
        **Short answer.** Metrics per route and per backend, a request id and trace started at the gateway, structured access logs, and alerts based on error rate and latency as the user sees them.

        **Why.** The gateway sees every request, so it is the best single place to measure the whole system.

        - **Metrics.** For each route and backend: request rate, error rate split into 4xx and 5xx, and latency at the 50th, 95th and 99th percentile. Record gateway time and backend time separately, so "the gateway is slow" can be proved or ruled out.
        - **Protection signals.** Rate-limited requests, open circuit breakers, timeouts and shed requests, each by route and client.
        - **Tracing.** The gateway creates the request id and trace context and passes them on. For the bootstrap call, one span per downstream call shows which of the six was slow.
        - **Logs.** One structured line per request: route, client, status, duration, backend instance. Sample successful requests, keep all errors.
        - **Config.** The config version each node runs, shown on the same dashboard, since many gateway incidents start with a config change.

        **Watch out for.** Using the raw path as a metric label. Paths with ids in them create millions of series. Label by route template, such as `/orders/:id`.
    - q: The gateway runs on 20 nodes. Where do the rate limit counters live, and what happens if that store is down?
      level: Mid
      topics: [/system-design/patterns/rate-limiting, /system-design/case-studies/rate-limiter]
      a: |-
        **Short answer.** Keep the counters in a shared in-memory store that all nodes update with one atomic call. If the store is unreachable, fall back to a local limit on each node and let traffic through.

        **Why.** A limit of 100 requests a minute per client means little if each node counts alone. With 20 nodes, a client spread evenly across them could send 2,000. The cost is a round trip of about 1 ms on each request, which takes a real share of a 5 ms budget.

        | Option | Accuracy | Added latency |
        | --- | --- | --- |
        | Shared store, checked on every request | Exact | About 1 ms |
        | Local counters, synced to the store a few times a second | Slightly over the limit for a moment | Near zero |
        | Local only, limit divided by node count | Poor when traffic is uneven | Zero |

        When the store is down, blocking all traffic turns a helper's outage into a full outage. So the limiter fails open, and each node applies a rough local cap to stop the worst abuse.

        **Watch out for.** Read, then write as two calls. Two nodes read 99, both allow, both write 100. Use one atomic increment or a small server-side script.
    - q: How do you change routes and policies on a live gateway without downtime or a bad config taking everything down?
      level: Senior
      topics: [/system-design/fundamentals/api-gateway, /system-design/fundamentals/availability]
      a: |-
        **Short answer.** Split the system into a control plane that owns configuration and a data plane that serves traffic. Treat each config change as a release: validate it, give it a version, send it to a few nodes first, watch, then send it to the rest.

        **Why.** A gateway config error has the widest reach of any change in the company, because one bad route table breaks every API at once.

        The steps:

        1. Teams change routes in a reviewed repository or through an API. The control plane checks the schema, looks for conflicting routes and replays a set of test requests against the new table.
        2. The change gets a version number and goes to one canary node, then 10% of nodes, then all, one region at a time.
        3. Each node builds the new route table in memory beside the old one and switches with a single pointer swap.
        4. If error rates rise on the canary, the control plane puts back the previous version automatically.

        Nodes store the last good config on disk. With the control plane down, they keep serving and can restart.

        **Watch out for.** A node that needs the control plane in order to start. During a wide outage, new nodes then cannot come up when they are needed most.
    - q: What should you keep out of an API gateway?
      level: Junior
      topics: [/system-design/fundamentals/api-gateway]
      a: |-
        **Short answer.** Anything that knows about the product. The gateway should handle concerns that are the same for every API, and leave business rules, data joins and per-feature logic to the services.

        **Why.** The gateway is shared by all teams and sits on every request. Logic placed there is paid for by everyone, in latency and in risk.

        Good fits are generic: TLS, checking a token, rate limits, routing, request ids, access logs, compression, and blocking oversized requests.

        Poor fits include:

        - Business rules, such as "orders above 500 dollars need a second approval".
        - Fine-grained permission checks, such as "may this user edit this document". The gateway can prove who the caller is. Only the owning service knows what they may touch.
        - Database queries or calls that join data from several services. That belongs in an aggregation layer behind the gateway.
        - Heavy work on the request body, such as resizing an image.

        A simple test: if a product manager's request would need a gateway release, the logic is in the wrong place.

        **Watch out for.** Services that trust any request because "the gateway already checked". Inside the network, each service should still verify the identity passed to it and enforce its own permissions, or one misrouted internal call bypasses all security.
- id: design-workflow-engine
  q: Design a durable workflow engine that runs multi-step business processes, such as driver onboarding or an order refund, and survives crashes, long waits and retries.
  level: Senior
  category: system-design-questions
  subcategory: infrastructure-building-blocks
  topics:
    - /system-design/patterns/saga
    - /system-design/patterns/idempotency
    - /system-design/patterns/message-queues
    - /system-design/patterns/cqrs-event-sourcing
  companies: [DoorDash]
  a: |-
    **Short answer.** Store every workflow as a durable record: its definition, its current state and an append-only history of what has happened. Stateless workers pull step tasks from a queue, run them and report results. The engine records each result and schedules the next steps in one transaction, so a crash at any point can be repaired by reading the history.

    **What to clarify.** Whether steps form a fixed sequence, a graph with parallel branches, or free-form code. How long a workflow can stay open: seconds for a refund, days for a background check. How many start each day. Whether steps call outside vendors that answer later by webhook.

    **The numbers that drive the design.**

    - Step rate. 1 million workflows a day with 10 steps each is 10 million step runs a day, about 120 a second on average and perhaps 600 at peak.
    - History size. Each step writes about 3 events of 1 KB, so one workflow is about 30 KB and a day is 30 GB. Keeping 90 days is about 2.7 TB.
    - Open workflows. If onboarding stays open 2 days on average, about 2 million workflows are waiting at any moment. Their timers must live in the database. No process can hold them in memory.

    **Core design.**

    1. A workflow definition is a versioned graph of steps. Each step names a task type, its inputs, a retry policy and a timeout.
    2. The start API takes a workflow id chosen by the caller. It writes the instance row, the first history event and the first task in one transaction. A second start with the same id returns the existing instance.
    3. Each instance has a state row with a version number, plus its history. Every change is "append events and update state, only if the version is still N".
    4. Tasks go to queues by task type. A worker takes a task under a lease, a claim that expires after a set time, runs the step and reports success or failure.
    5. The engine applies the result: it appends the event, moves the state forward and writes the next tasks, all in the same transaction.
    6. A timer table, indexed by fire time, holds step timeouts and waits. Scanners turn due timers into events on the instance.
    7. Outside callbacks, such as a background check result, arrive as signals. A signal is one more event on the instance.
    8. When a step fails for good, the engine runs the compensation steps of the completed steps in reverse order, as a saga does.

    **The hardest part.** A step is a call to another system, and the engine cannot commit its own database and that other system together. A worker can charge a card and die before reporting. The engine can only promise that a step runs at least once, so each step must be safe to run twice.

    **Main trade-off.** Writing every transition to a database costs several writes per step and limits throughput per instance. In return, any worker or engine node can die at any moment with no lost work.

    **What a senior answer adds.** Instances pinned to the definition version they started with. Sharding by workflow id, with one owner per shard. A search view of instances by state and age for support staff. Rate limits per task type, so a retry storm does not flood a vendor.

    **Watch out for.** Keeping workflow progress in a worker's memory, or in a chain of queue messages with no state record. After a crash nobody can say which steps ran.
  followUps:
    - q: A step's result and its timeout arrive at almost the same moment. How does the engine pick exactly one?
      level: Senior
      topics: [/system-design/patterns/consistency-models, /system-design/databases/relational-databases]
      companies: [DoorDash]
      a: |-
        **Short answer.** Treat both as events that try to move the same step out of the "running" state, and guard the move with a conditional write. The first write succeeds. The second sees that the state has changed and becomes a no-op.

        **Why.** The completion comes from a worker and the timeout comes from the timer scanner.

        Each instance row carries a version number. Both handlers do the same thing in one transaction: read the row, check that step 4 is still running at version 17, append their event, set the new state and write version 18. The update includes the condition "where version is 17". Only one of the two can match. The loser gets zero rows updated, reloads, sees the step is already closed and drops its event.

        Whatever follows is written in the winner's transaction. If completion wins, the next step's task is created. If the timeout wins, the retry or the compensation is created.

        The late result still matters. If the timeout won and the worker did charge the card, the timeout path must check the real state of the side effect or reverse it.

        **Watch out for.** Deciding by comparing timestamps from two machines. Clocks differ by milliseconds or more, and the two handlers can each believe they were first.
    - q: Steps can be retried and can run in parallel. How do you keep their side effects from happening twice?
      level: Senior
      topics: [/system-design/patterns/idempotency, /system-design/patterns/saga]
      companies: [DoorDash]
      a: |-
        **Short answer.** Give every step a stable idempotency key built from the workflow id and the step id, send it with every call to the outside system, and have that system remember the key and return the first result for any repeat.

        **Why.** The engine delivers each task at least once. A lease can expire while a slow worker is still running, so two workers may run the same step at the same moment.

        The key must be the same for every attempt of the same step, so do not include the attempt number. For a refund step in workflow `refund-8841`, the key could be `refund-8841/issue-refund`. The payment service stores the key with the outcome under a unique constraint. The first call inserts and does the work. A parallel second call hits the constraint, waits for or reads the stored result, and returns it.

        When the engine receives two reports for one step, the conditional write on the instance version accepts the first and ignores the second.

        For a target with no support for keys, such as an old vendor API, use "check, then act": query whether the effect exists, then perform it.

        **Watch out for.** Generating a new random key inside the step code. Every retry then looks like a new request.
    - q: An order workflow allows partial refunds. How do you make sure the refunds never add up to more than the customer paid?
      level: Senior
      topics:
        [
          /system-design/databases/relational-databases,
          /system-design/patterns/idempotency,
          /system-design/case-studies/kindle-payments,
        ]
      companies: [DoorDash]
      a: |-
        **Short answer.** Enforce the limit in the one service that owns the money record, inside a single transaction on the order's payment row. The workflow asks for a refund, and that service is the only place that can say yes.

        **Why.** The rule is "total refunded is at most the amount captured". Two refund workflows for the same order can run at once, for example a support agent's and an automatic one for a missing item. If each reads "USD 0 refunded of USD 40" and then issues USD 25, the customer gets USD 50.

        So the check and the change must be one atomic step. The payment service runs an update of the form: add 25 to the refunded amount where the order id matches and refunded plus 25 is at most captured. The first request moves the total to 25. The second matches zero rows, because 50 is more than 40, and is rejected with a clear error.

        Each refund is also stored as its own ledger row with the step's idempotency key, so a retried step returns the first result and does not count twice.

        **Watch out for.** Checking the limit in an early "validate" step and issuing the refund in a later one. The balance can change between the two steps.
    - q: An engine node or a worker crashes in the middle of a workflow. How does the system recover?
      level: Mid
      topics: [/system-design/patterns/message-queues, /system-design/patterns/leader-election]
      companies: [DoorDash]
      a: |-
        **Short answer.** Nothing important lives in memory. A crashed worker's task comes back when its lease expires, and a crashed engine node is replaced by another that reads the instance state and history from the database and continues.

        **Why.** There are three cases:

        - **Worker dies during a step.** It held the task under a lease of, say, 60 seconds. When the lease runs out, the task is visible again and another worker runs it.
        - **Engine dies between recording a result and scheduling the next step.** This must not be possible. The result event, the new state and the next task are written in one database transaction. A relay process then copies new task rows to the queue and repeats until the queue confirms. This is the outbox pattern.
        - **Engine node that owns a shard dies.** Each shard of instances has one owner chosen through a lock with an expiry. Another node takes the lock, loads the open timers and pending tasks for that shard and carries on.

        A sweeper also looks for instances with no pending task, no timer and no final state, and raises an alert.

        **Watch out for.** Setting the lease shorter than the step's real run time. The task is then handed to a second worker while the first is still working, on every run.
    - q: How would you model driver onboarding, with document upload, an identity check and a background check, as a state machine?
      level: Mid
      topics: [/system-design/patterns/saga, /system-design/fundamentals/webhooks]
      a: |-
        **Short answer.** List the states an application can be in, the events that move it between them, and the action each move triggers. Store the current state per applicant and accept an event only if it is valid for that state.

        **Why.** Onboarding is mostly waiting: for the applicant to upload, for a vendor to answer.

        | State | Event | Next state |
        | --- | --- | --- |
        | Documents pending | All documents uploaded | Identity check running |
        | Identity check running | Vendor says match | Background check running |
        | Identity check running | Vendor says no match | Documents pending, with a retry count |
        | Background check running | Clear result by webhook | Approved |
        | Background check running | Flagged result | Manual review |
        | Any waiting state | Timer, such as 30 days of no activity | Expired |

        Vendor results arrive by webhook days later, so each request carries the applicant id and step id, and a repeated webhook is ignored if that step is already closed.

        **Watch out for.** A set of boolean columns such as `docs_ok` and `bg_ok` in place of one state field. They allow combinations that should not exist, such as approved with no identity check.
    - q: You need to change a workflow definition while thousands of instances of the old one are still running. How do you do it safely?
      level: Senior
      topics: [/system-design/patterns/saga]
      a: |-
        **Short answer.** Never edit a definition in place. Publish the change as a new version, start new instances on it, and let running instances finish on the version they started with.

        **Why.** A running instance's history describes steps of the old graph. If step 3 is removed or reordered under it, the engine may not know what comes next, or may skip a check the business requires. With onboarding open for days, about 2 million instances could be half way through at the moment of the change.

        Pinning is simple: the instance row stores the definition version, and the engine keeps old versions until no instance uses them.

        Some changes cannot wait, for example a new legal check that everyone must pass. For those, write an explicit migration: a rule that maps each old state to a state in the new version, applied instance by instance with the same conditional write as any other transition.

        Keep changes compatible where you can. Adding an optional step at the end is safe. Changing the meaning of an existing step's input is not.

        **Watch out for.** Removing a worker's handler for an old task type on the day the new version ships. Old instances then fail on a step that nobody can run.
