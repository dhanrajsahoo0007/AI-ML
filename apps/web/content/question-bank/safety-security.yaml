- id: walk-me-through-the-owasp-top-10-for-llm-applications-and-wh
  q: Walk me through the OWASP Top 10 for LLM applications and which ones actually bite in practice.
  a: |
    The list covers risks such as prompt injection, sensitive information disclosure, supply-chain risks in models and data, data and model poisoning, improper handling of model outputs passed to other systems, excessive agency, system prompt leakage, weaknesses in vector stores and embeddings, misinformation, and unbounded consumption of resources.

    The ones that bite most in practice: prompt injection, especially indirect injection in agents; excessive agency, meaning tools with too much permission; sensitive data leaking across users through retrieval or logs; insecure output handling, where model output is executed or rendered without validation; and unbounded consumption, where costs or loops run away.
  level: Mid
  category: safety-security
  subcategory: prompt-injection
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: what-is-the-difference-between-jailbreaking-and-adversarial
  q: What is the difference between jailbreaking and adversarial prompting?
  a: |
    Jailbreaking is a user crafting prompts, such as role-play, hypotheticals or obfuscation, to make a model violate its own safety policies and produce content it should refuse. Adversarial prompting is broader: any input designed to make a model misbehave, including attacks optimized automatically, such as appended token strings that transfer across models, and attacks aimed at an application rather than the model's policies, such as prompt injection.

    Jailbreaks target the model's alignment; adversarial prompting includes jailbreaks plus attacks on reliability and on the surrounding system.
