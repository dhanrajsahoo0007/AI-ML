- id: how-do-you-prevent-an-agent-with-tool-access-from-exfiltrati
  q: How do you prevent an agent with tool access from exfiltrating data via a malicious web page?
  a: |
    Assume the page will contain injected instructions. Limit what the agent can reach: least-privilege credentials, an allow-list of destinations for network and email tools, and no access to secrets it does not need. Block common exfiltration channels, such as rendering images or links whose URLs carry data, and require confirmation before sending data anywhere external.

    Separate trust levels: after the agent reads untrusted content, restrict which tools it may call or require approval, and keep sensitive data out of the same context when possible. Monitor outbound requests for sensitive data and test with planted malicious pages.
