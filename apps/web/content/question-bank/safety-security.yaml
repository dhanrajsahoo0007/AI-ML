  source: outcome-school
- id: what-are-hallucinations-and-why-do-llms-produce-them
  q: What are hallucinations and why do LLMs produce them?
  a: |
    Hallucinations are fluent but false or unsupported statements. Models are trained to produce plausible continuations, not to verify facts, and they have no built-in signal for what they do not know, so gaps get filled with likely-sounding text. Outdated training data and ambiguous prompts make it worse.
  level: Junior
  category: safety-security
  subcategory: hallucination
  companies:
    - Anthropic
- id: how-do-you-reduce-hallucinations-in-a-production-system
  q: How do you reduce hallucinations in a production system?
  a: |
    Ground answers in retrieved sources and require citations, instruct the model to say when it does not know, lower the temperature for factual tasks, constrain outputs with schemas, and add verification steps such as checking claims against sources or tools. Measure the hallucination rate on an evaluation set and monitor it in production.
  level: Mid
  category: safety-security
  subcategory: hallucination
- id: how-do-scaling-laws-influence-the-safety-evaluation-of-large
  q: How do scaling laws influence the safety evaluation of large models?
  a: |
    Scaling laws predict that loss improves smoothly with compute, which lets labs forecast how capable a larger model will be before training it. But specific capabilities, including risky ones, can appear abruptly, so smooth loss curves do not guarantee no surprises.

    In practice that means evaluating dangerous capabilities on smaller models and intermediate checkpoints to extrapolate trends, setting capability thresholds that trigger stronger safeguards before deployment, as in responsible scaling policies, investing in strong elicitation so evaluations do not underestimate a model, and re-evaluating as scale or post-training changes.
  level: Senior
  category: safety-security
  subcategory: responsible-ai
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: what-is-constitutional-ai-and-how-does-it-differ-from-rlhf-w
  q: What is Constitutional AI and how does it differ from RLHF? What is RLAIF?
  a: |
    Constitutional AI trains a model to follow a written set of principles. In a supervised phase, the model critiques and revises its own responses against the principles and is fine-tuned on the revisions. In a reinforcement phase, an AI model compares responses using the principles to produce preference labels, and the policy is trained on them.

    That second step is RLAIF, reinforcement learning from AI feedback, instead of RLHF's human preference labels. It needs far fewer human labels, especially for harmful content, makes the values explicit and editable, and produces models that explain refusals. It does not solve choosing the right principles, ambiguous cases, or blind spots of the AI labeler, and models can still be jailbroken.
  level: Mid
  category: safety-security
  subcategory: responsible-ai
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: what-is-mechanistic-interpretability-and-why-do-labs-invest
  q: What is mechanistic interpretability and why do labs invest in it?
  a: |
    Mechanistic interpretability tries to reverse-engineer how a neural network computes, identifying the features it represents and the circuits that combine them, rather than only looking at inputs and outputs. Techniques include probing, activation patching and sparse autoencoders that decompose activations into more interpretable features.

    Labs invest because understanding internal mechanisms could let them detect deception, hidden goals or dangerous knowledge, verify that safety training worked, debug failures and steer behavior, which matters more as models become more capable and their outputs harder to check from the outside.
  level: Mid
  category: safety-security
  subcategory: responsible-ai
  related: /ai-system-design/genai-system-design/transformer-architecture
  source: outcome-school
- id: how-would-you-audit-a-deployed-model-for-differential-perfor
  q: How would you audit a deployed model for differential performance across user groups?
  a: |
    Define the groups and harms that matter with domain, legal and affected-community input. Build or collect evaluation data with group information, or use counterfactual tests that swap group-related details in otherwise identical inputs, and measure quality, error types and outcome rates per group with confidence intervals.

    Choose fairness criteria suited to the decision, such as equal error rates or equal opportunity, investigate causes of gaps (data coverage, labels, proxies), mitigate through data, model or decision-threshold changes, and monitor continuously after deployment. Document findings and decisions.
  level: Senior
  category: safety-security
  subcategory: responsible-ai
  companies:
    - Microsoft
  source: outcome-school
- id: design-a-red-teaming-programme-for-a-model-you-are-about-to
  q: Design a red-teaming programme for a model you are about to release.
  a: |
    Define the threat model and risk areas: harmful content categories, dangerous capabilities, privacy, bias, jailbreaks, prompt injection and agentic misuse. Combine internal red-teamers, external domain experts for high-risk areas, and automated attack generation that scales known techniques.

    Record every finding with severity, feed fixes into training data, classifiers and system safeguards, and turn successful attacks into regression tests. Measure attack success rates before and after mitigations, set launch thresholds, run it again on each significant model update, and keep a bug-bounty or reporting channel after release.
  level: Senior
  category: safety-security
  subcategory: responsible-ai
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  refs:
    - title: LLM Evaluation
      url: https://outcomeschool.com/blog/llm-evaluation
  source: outcome-school
- id: how-would-you-balance-performance-optimisation-with-model-in
  q: How would you balance performance optimisation with model interpretability?
  a: |
    Treat them as compatible goals with explicit trade-offs: keep a reference model and reproducible evaluations so any optimization, such as quantization, distillation or architecture changes, is checked for behavior changes, not just speed. Preserve the ability to inspect activations and attributions in the optimized model, and avoid changes that make debugging impossible without a large gain.

    Where interpretability matters most, in safety-critical decisions, accept some cost; where it matters less, optimize more aggressively but monitor behavior. Document what each optimization changes.
  level: Senior
  category: safety-security
  subcategory: responsible-ai
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: how-would-you-approach-designing-a-system-to-ensure-the-safe
  q: How would you approach designing a system to ensure the safe deployment of AI models in production?
  a: |
    Before deployment: risk assessment of the use case, capability and safety evaluations with release thresholds, red-teaming, and documented policies. In the system: layered guardrails on inputs, outputs and actions, least-privilege access, human approval for high-impact actions, abuse detection and rate limits.

    After deployment: staged rollout, monitoring of safety metrics and incidents, user reporting, sampled review, rapid rollback and kill switches, an incident response process, and regular re-evaluation as models, users and threats change.
  level: Senior
  category: safety-security
  subcategory: responsible-ai
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: a-shipped-copilot-feature-that-summarises-job-applicants-for
  q: A shipped Copilot feature that summarises job applicants for recruiters is accused of working worse for some groups. How do you establish whether that's true, and what do you do about it?
  a: |
    Establish facts with counterfactual tests: create matched applicant profiles that differ only in group-related signals, such as names, schools or gaps that correlate with gender or ethnicity, and compare summary content, tone and emphasis. Audit real outputs with reviewers and measure whether summaries omit or downplay qualifications more for some groups.

    If disparities exist, pause or restrict the feature as appropriate, remove unnecessary sensitive signals from inputs, adjust prompts or fine-tune, add consistency checks, and re-audit. Involve legal and responsible-AI teams, since hiring is high-risk and regulated, and communicate transparently.
  level: Senior
  category: safety-security
  subcategory: responsible-ai
  companies:
    - Microsoft
  source: outcome-school
- id: phi-is-in-every-audio-file-transcript-and-note-you-touch-how
  q: PHI is in every audio file, transcript and note you touch. How does that shape the architecture, and what can you send to a third-party model API?
  a: |
    Protected health information shapes everything: encryption in transit and at rest, strict access controls and audit logs, minimal retention, de-identification for analytics and model development, separation of environments, and incident response. Every vendor that processes PHI needs a business associate agreement and must meet your security requirements.

    A third-party model API may receive PHI only under such an agreement with appropriate data-handling terms, such as no training on your data and limited retention; otherwise send only de-identified data or run models in your own controlled environment. Document data flows and verify them in security reviews.
  level: Senior
  category: safety-security
