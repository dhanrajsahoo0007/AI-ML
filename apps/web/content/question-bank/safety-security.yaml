- id: an-autonomous-agent-has-write-access-to-a-customer-s-reposit
  q: An autonomous agent has write access to a customer's repository, CI credentials and network access. What is your threat model?
  a: |
    Threats: prompt injection from issues, comments, dependencies or web content steering the agent; leaking secrets such as CI credentials through outputs, commits or network requests; malicious code inserted into the repository or pipeline; destructive actions such as deleting branches; supply-chain attacks through installed packages; and lateral movement using the credentials.

    Mitigate with sandboxed execution, scoped short-lived credentials, no direct access to secrets or production, egress allow-lists, changes made through pull requests that humans review, branch protections, secret scanning, logging of every command and network call, and red-team testing.
  level: Senior
  category: safety-security
