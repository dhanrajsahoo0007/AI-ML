- id: how-do-you-handle-pii-in-prompts-logs-and-training-data
  q: How do you handle PII in prompts, logs and training data?
  a: |
    Prompts: send only what the task needs, detect and redact or tokenize PII where the model does not need it, and use providers and deployments whose retention terms fit your obligations. Logs: redact or encrypt sensitive fields, restrict access, set retention limits, and avoid logging full prompts by default where data is sensitive.

    Training data: get consent or a legal basis, filter or de-identify PII, deduplicate to reduce memorization, honor deletion requests, and test models for memorized personal data. Document data flows for privacy review and audits.
  level: Mid
