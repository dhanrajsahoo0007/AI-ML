- id: how-do-you-test-a-rag-system-for-prompt-injection-through-do
  q: How do you test a RAG system for prompt injection through documents?
  a: |
    Plant documents containing instructions, such as requests to ignore rules or reveal data, in a test index, and check that answers do not follow them. Defend by delimiting retrieved content as untrusted data, restricting tools available after retrieval, and filtering outputs. Include these cases in the regression suite.
  level: Senior
  category: safety-security
  subcategory: prompt-injection
- id: design-guardrails-for-a-consumer-facing-assistant-input-filt
  q: Design guardrails for a consumer-facing assistant. Input filters, output filters, or both?
  a: |
    Both, because they catch different things. Input filters stop clearly harmful requests and injection attempts early and cheaply, detect self-harm or crisis signals to route to supportive responses, and handle age-appropriate rules. Output filters catch harmful content the model produced anyway, leaked personal data and policy violations, including in streamed responses checked chunk by chunk.

    Add a safety-tuned model with a clear policy prompt, rate limits and abuse detection per account, user reporting, and monitoring with human review. Tune thresholds to balance harm against over-refusal, and measure both attack success and false refusals on test sets.
