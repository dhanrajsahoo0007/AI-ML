- id: design-the-harmful-content-detection-system-for-facebook-and
  q: Design the harmful-content detection system for Facebook and Instagram uploads.
  a: |
    Use a cascade: fast hash matching against known bad content, lightweight classifiers on every upload, and heavier multimodal models (image, video, text, audio, plus account and behavior signals) for borderline cases, with policy-specific heads. Scores map to actions: auto-remove at high confidence, downrank or limit distribution in the middle, human review queues prioritized by severity and reach.

    Train with reviewer labels and appeals as feedback, handle adversarial adaptation with frequent retraining and robustness to obfuscation, cover many languages, and measure precision and recall per policy, prevalence of harmful content viewed, review latency and appeal reversal rates.
  level: Senior
  category: safety-security
  subcategory: guardrails
  companies:
    - Meta
  related: /ai-system-design/ml-system-design
  source: outcome-school
- id: two-partners-at-the-same-firm-are-on-opposite-sides-of-a-dea
  q: Two partners at the same firm are on opposite sides of a deal. Design the data isolation for that, on top of normal multi-tenancy.
  a: |
    Model ethical walls explicitly: matters and workspaces with membership, and conflict rules that bar specific people from specific matters, synced from the firm's conflicts system. Every document, chunk, embedding, cache entry, memory and log is tagged with its matter and enforced at retrieval and access time, so a user's queries can only touch matters they are cleared for.

    Keep separate indexes or strict partition filters per matter, never share caches or fine-tuned behavior across walled matters, audit access, and test walls with users on both sides. Breaches here are professional-responsibility issues, so fail closed.
  level: Senior
  category: safety-security
  subcategory: guardrails
  companies:
    - Harvey
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: design-the-safety-system-for-open-ended-character-chat
  q: Design the safety system for open-ended character chat.
  a: |
    Layer it: policies for content and behavior by age group, character creation review and classifiers for character definitions, input and output classifiers for harmful content, self-harm and grooming signals, and a safety-tuned model that stays in character without crossing lines.

    Add crisis detection with supportive responses and resources, stricter settings and models for minors, rate limits and abuse detection, user reporting with fast human review, and monitoring of long conversations where drift happens. Measure both harmful-content rates and over-blocking, and red-team continuously with role-play attacks.
