- id: your-agent-reads-inbound-email-and-can-send-replies-and-sear
  q: Your agent reads inbound email and can send replies and search internal docs. Walk me through the prompt-injection attack surface and your defences.
  a: |
    The attack surface is every email body, attachment and quoted thread, since anyone can email the user. A malicious email can instruct the agent to search internal documents and send them to the attacker, forward threads, change settings, or insert harmful content into replies. Even summarization can be manipulated to mislead the user.

    Defenses: treat email content strictly as data, require user confirmation for every send with a clear preview of recipients and content, restrict sending to known contacts or flag new external recipients, limit which documents the agent can search on behalf of an email, strip or neutralize links and hidden content, scan outputs for sensitive data, log everything, and test with planted malicious emails.
