# Amazon Leadership Principles interview questions and Bar Raiser follow-up probes. All answers are written by TokensToScale.
- id: lp-customer-obsession-pushback-internal-convenience
  q: Tell me about a time you pushed back on a technically convenient shortcut because it would have hurt the end user or customer.
  level: Senior
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
    - /behavioral/amazon-leadership-principles/how-amazon-evaluates-lps
  a: |-
    **What the Bar Raiser is testing.** Amazon's first Leadership Principle (*Customer Obsession*) is easy to claim when customer needs and engineering convenience align. Interviewers test whether you still advocate for the customer when doing so costs your team extra engineering effort or delays an internal milestone.

    <KeyIdea>
    Strong *Customer Obsession* stories start with a quantified customer pain point (latency, silent data loss, confusing failure modes, or billing surprises), show the tempting internal shortcut, and prove how you found a third path that protected the user without derailing delivery.
    </KeyIdea>

    **How to structure your answer (STAR+L):**

    - **Situation & Task:** Name the service, the user segment affected, and the pressure that created the shortcut (e.g., migrating an API before a quarterly freeze by breaking backward compatibility for 4% of long-tail SDK callers).
    - **Action:** Show how you quantified the user impact using telemetry or support tickets, brought that evidence to the team, and designed a lightweight compatibility shim or phased deprecation so the team still hit its core deadline without breaking customer integrations.
    - **Result:** State the measurable customer outcome (zero migration pages/escalations, retention of the affected cohort) alongside the engineering cost.
    - **Learning:** What guardrail or design-review checklist item you added so user-facing regressions are surfaced before implementation starts.

    **Red flags to avoid.** Painting your teammates or PM as "not caring about customers." Frame the tension around competing constraints, not villains.
  followUps:
    - q: How did you quantify the customer impact before raising the objection?
      level: Senior
      companies: [Amazon]
      a: |-
        Explain the exact query or trace you ran (such as grouping 30 days of gateway logs by client SDK version and mapping those callers to revenue or critical workflows) so the trade-off was debated with numbers rather than opinions.
    - q: What would you have done if your manager still overruled you because of the deadline?
      level: Senior
      companies: [Amazon]
      a: |-
        Show the transition from *Customer Obsession* to *Have Backbone; Disagree and Commit*: once the risk is documented in writing and the decision owner explicitly accepts it, commit fully to executing the chosen path while adding monitoring and a fast rollback runbook to bound customer blast radius.

- id: lp-ownership-outside-service-boundary
  q: Describe a time you diagnosed and fixed a problem that lived outside your team's codebase or charter because it was blocking a larger outcome.
  level: Mid
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What the Bar Raiser is testing.** *Ownership* ("never say 'that's not my job'") tests whether you treat your service boundary as an API contract or as an excuse to ignore systemic failures.

    | Signal | Weak Ownership ("My boundary") | Strong Ownership ("End-to-end outcome") |
    | --- | --- | --- |
    | Diagnosis | Stops at "the upstream service returned HTTP 500" | Traces the request ID into the upstream repo, identifies the N+1 query or connection pool exhaustion |
    | Action | Files a ticket and waits two sprints | Opens a draft PR with reproduction tests in the upstream repo and pairs with their on-call to land it safely |
    | Follow-through | Closes the incident once the immediate fire stops | Adds contract tests and synthetic alerts across the boundary |

    **Watch out for.** "Cowboy ownership", deploying changes to another team's system without their review. True ownership pairs initiative (doing the legwork and writing the patch) with respect for the owning team's review and operational norms.
  followUps:
    - q: How did you get the other team to review your fix when their sprint was already full?
      level: Mid
      companies: [Amazon]
      a: |-
        Explain how you lowered their cognitive load to near zero: isolating a minimal diff, attaching benchmark before/after numbers, writing the unit and integration tests yourself, and offering to shadow the deployment window.

- id: lp-bias-for-action-two-way-door
  q: Tell me about a time you had to make an important technical decision quickly with less than 70% of the data you wished you had.
  level: Senior
  category: amazon-leadership-principles
  subcategory: action-results-standards
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/bias-for-action-and-deliver-results
    - /behavioral/amazon-leadership-principles/highest-standards-vs-speed
  a: |-
    **What the Bar Raiser is testing.** Amazon distinguishes between **one-way doors** (irreversible or very expensive to undo, such as public API schemas, cryptographic key hierarchies, or cross-region data partitioning) and **two-way doors** (reversible within minutes or days behind a feature flag or shadow queue). *Bias for Action* tests whether you recognize two-way doors (or convert a one-way door into a two-way door) and move instead of falling into analysis paralysis.

    **Key elements of a strong answer:**

    1. **The uncertainty and the cost of waiting:** Explain what data was missing and why waiting two weeks to gather it carried a real cost.
    2. **Making the decision reversible:** Show the engineering mechanism (feature flag, dual-write with dark reads, canary cohort, or adapter interface) that bounded the downside if your hypothesis proved wrong.
    3. **The trigger metric:** Name the exact threshold you watched in production that would trigger an automatic rollback or pivot.
  followUps:
    - q: What was the worst-case blast radius if your assumption turned out to be wrong?
      level: Senior
      companies: [Amazon]
      a: |-
        State the concrete cap, for example, "at most 1% of non-mutating read traffic for 15 minutes, with automatic circuit-breaking back to the legacy path if p99 exceeded 120 ms."

- id: lp-dive-deep-metric-anomaly
  q: Tell me about a time when high-level dashboards looked healthy, but you noticed an anomaly in the details that uncovered a serious bug or architectural flaw.
  level: Senior
  category: amazon-leadership-principles
  subcategory: dive-deep-judgment
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/dive-deep-and-are-right-a-lot
  a: |-
    **What the Bar Raiser is testing.** *Dive Deep* requires leaders to stay connected to the details and be skeptical when metrics and anecdotes disagree. Averages and p50s hide localized failures.

    **How to walk through the investigation:**

    - **The discrepancy:** Contrast the green top-line metric (e.g., 99.95% overall HTTP 200 rate) with the faint signal that caught your eye (a customer anecdote, a slight dip in retry-adjusted conversion, or an unusual p99.9 tail on one availability zone).
    - **Peeling the layers:** Walk through the exact diagnostic chain (slicing histograms by tenant/region/payload size, inspecting raw structured logs, reproducing with a flamegraph or packet capture) until you hit the root cause in code or state.
    - **Systemic fix:** Show both the code fix and the observability change (replacing averaged gauges with sliced SLO burn-rate alerts) so no one needs heroics next time.
  followUps:
    - q: Why didn't your existing alerts catch that failure mode?
      level: Mid
      companies: [Amazon]
      a: |-
        Explain the structural blind spot in the alert, such as aggregating success rates across high-volume health checks and low-volume checkout calls, or measuring HTTP status codes when the response body returned a soft error.

- id: lp-have-backbone-disagree-and-commit
  q: Tell me about a time you strongly disagreed with a technical or product decision made by your manager or a senior engineer. How did you handle it, and what happened?
  level: Senior
  category: amazon-leadership-principles
  subcategory: backbone-trust
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/have-backbone-and-earn-trust
  a: |-
    **What the Bar Raiser is testing.** *Have Backbone; Disagree and Commit* has two halves, and candidates often only prepare the first. Interviewers want to see **principled, evidence-backed dissent** before the decision is finalized, and **genuine, ungrudging ownership** once the call is made, especially in a story where the final decision did *not* go your way.

    <Tabs title="Both halves of Disagree and Commit">
    <Tab label="When you convinced them">
    Show how you moved the debate from opinions to a 1-page trade-off doc or benchmark spike, addressed the other person's core constraint directly, and gave them an easy off-ramp without public embarrassment.
    </Tab>
    <Tab label="When you were overruled (strongest signal)">
    Show that you stated your concern clearly with data, listened to why leadership weighed another constraint higher (such as time-to-market or contractual commitments), and then took ownership of making their chosen architecture succeed, without saying "I told you so" when friction appeared.
    </Tab>
    </Tabs>
  followUps:
    - q: Give me an example where you disagreed, were overruled, and had to commit to a plan you still thought was suboptimal.
      level: Senior
      companies: [Amazon]
      a: |-
        Walk through a real decision where you lost the vote, explain the concrete engineering steps you took to mitigate the risks of the chosen path (extra load tests, runbooks, or feature flags), and describe how you explained the decision to junior teammates as "our decision" rather than "management's decision."

- id: lp-invent-and-simplify-frugality
  q: Describe a time you replaced a complex, expensive, or over-engineered design with a significantly simpler one under tight resource constraints.
  level: Senior
  category: amazon-leadership-principles
  subcategory: invent-think-big-frugality
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
    - /behavioral/amazon-leadership-principles/frugality-and-curiosity
  a: |-
    **What the Bar Raiser is testing.** *Invent and Simplify* and *Frugality* ("constraints breed resourcefulness, self-sufficiency, and invention") test whether your instinct when facing a new problem is to add infrastructure (new microservice, new distributed cache, new queue) or to question the problem assumptions and remove moving parts.

    **Structure of a high-signal answer:**

    - **The proposed complexity:** Describe the initial multi-service or high-cost proposal and why it seemed necessary at first glance.
    - **The constraint & insight:** Identify the invariant or workload property (e.g., read-to-write ratio, bounded cardinality, idempotency window, or pre-computation during off-peak hours) that let you collapse three moving parts into one.
    - **Quantified savings:** State the reduction in monthly cloud spend, on-call pages, p99 latency, and lines of code maintained.

- id: lp-hire-develop-broad-responsibility
  q: Tell me about a time you raised the engineering bar on your team through mentorship, hiring calibration, or fixing a systemic operational risk.
  level: Senior
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/hire-develop-and-best-employer
    - /behavioral/amazon-leadership-principles/broad-responsibility-at-scale
  a: |-
    **What the Bar Raiser is testing.** At L5 (Senior SDE) and L6 (Principal SDE / SDM), individual code output is no longer enough. *Hire and Develop the Best*, *Strive to be Earth's Best Employer*, and *Success and Scale Bring Broad Responsibility* test whether your presence makes the surrounding engineers sharper, safer, and more autonomous.

    Focus on **mechanisms over good intentions**: Amazon culture distrusts "we tried to be more careful" and rewards repeatable mechanisms (shadow-to-reverse-shadow mentorship plans, PR review rubrics, automated chaos/canary gates, and accessibility/privacy budgets).

- id: lp-customer-obsession-unasked-need
  q: Tell me about a time you anticipated a customer or developer pain point they hadn't explicitly asked for yet, and built a solution for it.
  level: Senior
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What the Bar Raiser is testing.** Amazon's *Customer Obsession* note explicitly says: *" Leaders start with the customer and work backwards... they don't just listen to customers, they also invent on their behalf."* Customers rarely ask for a better retry-after header or a deterministic dry-run mode; they just complain that integrations feel brittle.

    - **How you spotted the latent pain:** Show the forensic signal (e.g., inspecting failed API onboarding logs, shadowing developer support channels, or noticing that 35% of tenants wrote custom polling loops around your webhook).
    - **The invention:** Explain the small, high-leverage primitive you built (such as an idempotency replay endpoint or an interactive webhook debugger) and its adoption curve.
  followUps:
    - q: How did you validate that your invention solved the real problem rather than becoming unused scope creep?
      level: Senior
      companies: [Amazon]
      a: |-
        State the adoption and support-deflection metrics you tracked in the first 30 days, for example, 62% of new tenant integrations adopting the dry-run flag and onboarding ticket volume falling by half.

- id: lp-ownership-long-term-value-over-short-term
  q: Describe a time you sacrificed a short-term team win or easy metric boost to protect long-term system health or company value.
  level: Senior
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What the Bar Raiser is testing.** *Ownership* states: *"They think long term and don't sacrifice long-term value for short-term results."*

    Pick an episode where shipping a quick hack would have made your current quarter look green while creating a ticking time bomb (such as hardcoding tenant-specific routing rules in the hot path, or training a recommender on clickbait engagement that eroded 30-day retention). Show how you quantified the 6-month cost of the shortcut and got buy-in for the durable path.

- id: lp-deliver-results-major-midflight-blocker
  q: Tell me about a time when a key dependency, partner team, or technical assumption failed halfway through a critical project, and you still delivered results.
  level: Mid
  category: amazon-leadership-principles
  subcategory: action-results-standards
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/bias-for-action-and-deliver-results
  a: |-
    **What the Bar Raiser is testing.** *Deliver Results* (*"rise to the occasion and never settle"*) tests whether you treat an external blocker as an excuse to miss your milestone or as an engineering constraint to route around.

    1. **The blocker:** Name the exact dependency failure (e.g., the platform team's new streaming bus slipped by 6 weeks, or a third-party LLM API hit rate-limit ceilings).
    2. **The decoupling shim:** Show how you built a thin interface/adapter backed by an existing boring technology (e.g., Postgres `SKIP LOCKED` queue or local batching) so your launch stayed on schedule and could swap in the upstream dependency later with a 50-line config change.

- id: lp-highest-standards-refusing-to-ship-defect
  q: Tell me about a time you insisted on holding a launch or rejecting a design because the quality, reliability, or operational readiness was not high enough.
  level: Senior
  category: amazon-leadership-principles
  subcategory: action-results-standards
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/highest-standards-vs-speed
  a: |-
    **What the Bar Raiser is testing.** *Insist on the Highest Standards* tests whether you can spot when a flaw is not "cosmetic tech debt" but an unacceptable defect (silent data corruption, missing rollback path, unthrottled fan-out, or missing audit logs), and whether you fix it constructively rather than acting as a gatekeeper who only says no.
  followUps:
    - q: How did you make sure you weren't just letting perfectionism block a reversible two-way door launch?
      level: Senior
      companies: [Amazon]
      a: |-
        Distinguish between **surface polish** (which can iterate post-launch) and **state invariants** (data integrity, security, and rollback safety, which are one-way doors once production data is corrupted).

- id: lp-are-right-a-lot-disconfirming-evidence
  q: Tell me about a time you actively sought out data or perspectives that proved your own initial technical hypothesis wrong.
  level: Senior
  category: amazon-leadership-principles
  subcategory: dive-deep-judgment
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/dive-deep-and-are-right-a-lot
  a: |-
    **What the Bar Raiser is testing.** Amazon's definition of *Are Right, A Lot* is counterintuitive: it does **not** mean you are born with infallible intuition. The official text says: *"They seek diverse perspectives and work to disconfirm their beliefs."*

    **Strongest story arc:**
    - State the architectural belief you held strongly at the start of a project.
    - Explain the specific experiment, shadow test, or dissenting engineer you consulted specifically to try to **break** your own hypothesis.
    - Show the data that proved your initial instinct wrong, how fast you pivoted without ego, and the superior result that followed.

- id: lp-earn-trust-admitting-blind-spot-early
  q: Tell me about a time you made an architectural or estimation error that affected another team, and how you communicated it to maintain their trust.
  level: Mid
  category: amazon-leadership-principles
  subcategory: backbone-trust
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/have-backbone-and-earn-trust
  a: |-
    **What the Bar Raiser is testing.** *Earn Trust* requires leaders to be *"vocally self-critical, even when doing so is awkward or embarrassing."*

    1. **Speed of disclosure:** Show that you alerted the partner team the moment you verified the bug or slip, not three days later when their integration tests broke.
    2. **Zero deflection:** State your mistake plainly in first person without blaming ambiguous docs or code reviewers.
    3. **Remediation + visibility:** Show how you handed them a workaround or compatibility shim plus a live dashboard so they didn't have to chase you for status updates.

- id: lp-think-big-platform-from-point-requests
  q: Describe a time when you noticed multiple teams solving the same narrow problem and proposed a larger, unified vision.
  level: Senior
  category: amazon-leadership-principles
  subcategory: invent-think-big-frugality
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
  a: |-
    **What the Bar Raiser is testing.** At L6 (Senior SDE / SDM), *Think Big* is the primary differentiator from L5. L5 engineers build great point solutions inside their team; L6 engineers notice horizontal duplication across 3–5 teams and author a 6-page narrative or PR/FAQ that solves the problem once at the platform layer.

    Always pair your **3-year North Star** with a **4-week Tenant #0 wedge** so the interviewer sees pragmatic execution alongside vision.

- id: lp-learn-and-be-curious-outside-comfort-zone
  q: Tell me about a time you stepped far outside your primary technical stack or domain to debug a problem or ship a feature.
  level: Mid
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/frugality-and-curiosity
  a: |-
    **What the Bar Raiser is testing.** *Learn and Be Curious* (*"never done learning and always seek to improve themselves"*) tests learning velocity under real constraints. Walk through:
    - What made the domain unfamiliar (e.g., kernel networking, GPU memory layout, mobile JNI, or double-entry accounting).
    - How you compressed a 3-month learning curve into 3 days by reading source code, setting up a fast feedback benchmark, and interviewing domain experts.
    - How you documented what you learned so the next engineer on your team ramped in 30 minutes.

- id: lp-earths-best-employer-fixing-toxic-toil
  q: Tell me about a time you noticed your team's operational load, on-call rotation, or developer experience was hurting morale, and what mechanism you built to fix it.
  level: Senior
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  companies:
    - Amazon
  topics:
    - /behavioral/amazon-leadership-principles/hire-develop-and-best-employer
  a: |-
    **What the Bar Raiser is testing.** *Strive to be Earth's Best Employer* tests whether you treat engineer burnout and alert fatigue as **engineering systems problems** that can be measured and solved (via Pareto analysis of pager alerts, SLO burn-rate windows, and automated runbooks) rather than offering empty pep talks.
- id: lp-customer-obsession-different-from-request
  q: Tell me about a time you delivered something different from what the customer asked for.
  level: Junior
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  signals:
    - lp-customer-obsession
    - customer-focus
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What it tests.** Customer Obsession. The principle asks you to start from what the customer needs and work back to the solution, and to keep earning their trust. Here the interviewer checks that you understood the need behind a request, and that you told the customer before you changed anything. At junior level the hard part is showing that you asked first and did not guess.

    **How to shape the answer.**

    - **Situation and task.** Say who the customer was and what they asked for, in their words.
    - **Action.** Say what you asked to find the real need, what you proposed, and how you got their agreement.
    - **Result.** Say what they got and how you know it served them better.
    - **Learning.** Say what you now ask before you start on a request.

    **A strong answer sounds like this.** "In my internship the support team asked me for an export button on the orders page. I asked two agents what they did with the file. They opened it only to find orders stuck for more than 3 days. I showed them a sketch of a 'stuck orders' filter, and the team lead agreed to try it. I built it in 4 days. Their morning check went from about 25 minutes to 5. I still added the export a sprint later, because the finance team needed it."

    **Watch out for.** Changing the request without telling the customer, a story where the customer was simply wrong, and no evidence that your version served them better.
  followUps:
    - q: How did the customer react when you proposed something else?
      level: Junior
      a: |-
        Say what they said, including any doubt. Then say how you settled it: a sketch, a small trial, or a promise to build the original if yours failed. The interviewer wants to hear that the customer agreed before you built anything different.
    - q: Who was the real customer here?
      level: Junior
      companies: [Amazon]
      a: |-
        Name the person who feels the result. That may be someone other than the person who filed the request. If an internal team asked on behalf of end users, say so, and say how you checked what those end users needed.
- id: lp-customer-obsession-unreasonable-request
  q: Tell me about a time a customer asked for something you thought was unreasonable. What did you do?
  level: Mid
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  signals:
    - lp-customer-obsession
    - customer-focus
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
    - /behavioral/competencies/cross-functional-collaboration
  a: |-
    **What it tests.** Customer Obsession. The principle asks you to treat the customer's problem as your starting point, even when the request itself is hard to meet. The interviewer listens for whether you found the need behind the demand, and whether you could refuse the method and still solve the problem. At mid level it gets hard when the request conflicts with other customers or with your team's plan.

    **How to shape the answer.**

    - **Situation and task.** State the request and why it looked unreasonable.
    - **Action.** Say how you found the real goal and what options you offered.
    - **Result.** Say what the customer got and when, with a number. Say what you declined.
    - **Learning.** Say what you changed so the request does not come back.

    **A strong answer sounds like this.** "A partner team that used our reporting API asked for direct access to our database so they could run any query. That would have exposed other customers' data. I sat with their analyst for an hour and listed the 9 queries they needed. Six were possible with two new filters, which I shipped in a week. I wrote a nightly export for the other three. We refused the database access and explained why. Their report time fell from 2 days to about 3 hours. One query still needs a manual step, and they know the reason."

    **Watch out for.** Describing the customer as foolish, saying yes to everything and calling it customer focus, and a refusal with nothing offered in its place.
  followUps:
    - q: What did the customer say when you refused part of the request?
      level: Mid
      a: |-
        Report their reaction honestly, including any frustration. Then say what you did next: the reason you gave, the option you offered, and when you checked back. The interviewer wants to see that the relationship survived the refusal.
    - q: Would you have handled it differently for your largest customer?
      level: Mid
      a: |-
        Take a position. A good answer keeps the same limits on safety and on other customers' data, and changes only the effort you spend on finding another way. Say who you would involve, such as your manager or the account owner, and at what point.
- id: lp-customer-obsession-above-and-beyond
  q: Tell me about a time you went well beyond what was expected of you for a customer.
  level: Senior
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  signals:
    - lp-customer-obsession
    - ownership
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What it tests.** Customer Obsession. The principle asks you to care about the customer's result more than about the edge of your task. The interviewer checks that the extra effort met a real need, and that you can say what it cost. At senior level a late night for one customer is a weak story. A stronger one also removes the cause.

    **How to shape the answer.**

    - **Situation and task.** Say who the customer was and what "expected" would have looked like.
    - **Action.** Say what you did beyond that, and what you delayed to do it.
    - **Result.** Give the effect on the customer as a number, and what you changed so that it lasts.
    - **Learning.** Say where you now draw the line on extra work.

    **A strong answer sounds like this.** "After a release, our mobile app crashed on launch for about 2 percent of users on older phones. The expected fix was a rollback, which I did within an hour. I then found that 1,400 of those users had lost saved drafts. Nobody had asked us to recover them. Another engineer and I spent 3 days on a recovery tool and restored drafts for 1,150 users. I delayed a planned feature by a week and told the product manager first. We added old-device tests to the release checklist, and that kind of crash has not returned in 8 months."

    **Watch out for.** Heroics with no customer result, extra work that nobody needed, and hiding what the effort cost the team.
  followUps:
    - q: What would you do differently?
      level: Senior
      companies: [Amazon]
      a: |-
        Name one specific thing, such as catching the problem before release or telling the customer sooner. Give the cost of that gap. The interviewer wants a real fault in a story you are proud of, and proof that your process changed.
    - q: How did you know the extra effort was worth it?
      level: Senior
      a: |-
        Give the comparison you made at the time: the number of customers affected and the harm to them, against the days spent and the work delayed. If you would make a different trade today, say so and explain why.
    - q: What unintended effect could your fix have had on those customers?
      level: Senior
      companies: [Amazon]
      a: |-
        Think past the benefit. A recovery tool can bring back something a user deleted on purpose, for example. Name one such risk, say whether you checked for it, and what guard you added. The interviewer wants to see that you think about harm as well as help.
- id: lp-ownership-handing-over-your-work
  q: Tell me about a time you handed over work you owned to someone else. How did you make sure it went well?
  level: Junior
  category: amazon-leadership-principles
  subcategory: customer-ownership
  signals:
    - lp-ownership
    - communication
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What it tests.** Ownership. The principle asks you to act for the long-term good of the whole company and never to treat a problem as someone else's job. A handover shows whether you cared about the work after it left your hands. At junior level the test is simple and hard to fake: could the next person run it without calling you.

    **How to shape the answer.**

    - **Situation and task.** Say what you owned, why it moved, and who took it.
    - **Action.** Say what you wrote down, what you showed them in person, and which open problems you listed.
    - **Result.** Say how the new owner did in the first weeks, with a number.
    - **Learning.** Say what was missing from your notes and what you add now.

    **A strong answer sounds like this.** "At the end of my 12-week internship I handed a data-cleaning job to a full-time engineer. I wrote a 2-page guide: how to run it, the 3 known failure cases and the one bug I had not fixed. We ran it together twice in my last week. Her first question was where the input files came from, which I had left out, so I added a section. She sent me 2 questions in the first month and shipped her first change in week two. I now write the guide while I build."

    **Watch out for.** "I sent them the repository link" as the whole handover, hiding known bugs, and no check on the new owner afterward.
  followUps:
    - q: What was the new owner's first question, and what does that tell you about your documentation?
      level: Junior
      a: |-
        Answer honestly. The first question shows the largest gap in your notes. Name it, say how you fixed the document, and say what you now include from the start. Claiming there were no questions at all is hard to believe.
    - q: Who owns that work today, and is it still running?
      level: Junior
      a: |-
        Say what you know and how you know it. If you checked in after a month, say so. If the work was later retired or rewritten, say that plainly. The interviewer is checking that your interest did not stop on your last day.
- id: lp-ownership-production-break-on-your-watch
  q: Tell me about a time something you were responsible for broke in production. How did you handle it?
  level: Mid
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  signals:
    - lp-ownership
    - failure
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
    - /behavioral/competencies/production-incidents-and-mistakes
  a: |-
    **What it tests.** Ownership. The principle asks you to stay responsible for an outcome from start to finish, including the parts that go wrong. The interviewer listens for who noticed, what you did in the first minutes, and whether you stayed until the cause was removed. At mid level it gets hard when the fault crosses into another team's system.

    **How to shape the answer.**

    - **Situation and task.** Say what broke, who was affected and for how long. Say how it was detected.
    - **Action.** Give your steps in order: stop the harm first, then find the cause. Say who you told and when.
    - **Result.** Give the time to recover, the size of the impact, and what you changed.
    - **Learning.** Name the gap in detection or testing that let it through.

    **A strong answer sounds like this.** "A config change I deployed made our checkout service reject about 8 percent of orders for 40 minutes. A support agent told us, which was the first problem: we had no alert on the error rate. I rolled back within 10 minutes of hearing and posted updates every 15 minutes in the incident channel. The cause was a missing default for a new setting. I added a validation step to the deploy and an alert at a 1 percent error rate. I wrote the review myself and gave support the list of 310 failed orders."

    **Watch out for.** Saying "we" throughout, stopping the story at the rollback, and blaming the reviewer or the tooling.
  followUps:
    - q: How was it detected, and how did you mitigate it?
      level: Mid
      companies: [Amazon]
      a: |-
        Give the exact signal and the minutes: who saw what, and when. Then give the first action that reduced harm, such as a rollback or a feature switch. If a customer found it before your monitoring did, say so and say what alert you added.
    - q: What would have caught this before it reached production?
      level: Mid
      a: |-
        Name one concrete check: a test, a staged rollout or a config validation. Say whether it exists now and who built it. Avoid a general promise to be more careful. The interviewer wants a mechanism that works when you are away.
- id: lp-ownership-took-the-lead-on-a-project
  q: Tell me about a time you took the lead on a project. What did you do that a team member would not have done?
  level: Senior
  category: amazon-leadership-principles
  subcategory: customer-ownership
  companies:
    - Amazon
  signals:
    - lp-ownership
    - delivery
  topics:
    - /behavioral/amazon-leadership-principles/customer-obsession-and-ownership
  a: |-
    **What it tests.** Ownership. The principle asks you to behave like an owner of the whole result: think long term, and take on what falls between teams. The interviewer wants the difference between leading and taking part. At senior level they look for decisions you made for other people, risks you carried, and what you did when the project was in trouble.

    **How to shape the answer.**

    - **Situation and task.** Say what the project was, how many people it involved, and how you came to lead it.
    - **Action.** Give two or three decisions only the lead could make, such as scope or what to stop.
    - **Result.** Give the outcome with numbers, including what slipped.
    - **Learning.** Say what you would set up earlier next time.

    **A strong answer sounds like this.** "We had to move 140 data pipelines off an old scheduler before its support ended. Nobody owned the move, so I asked my manager for it. I split the pipelines into 3 groups by risk and wrote the migration guide. I got 2 other teams to move their own jobs by pairing with each of them for a day. I chose to switch off 12 low-value pipelines, with their owners' agreement. We finished 9 days late, because I had underestimated one team's testing needs. No data was lost. I now ask each team for a test plan in week one."

    **Watch out for.** A list of tasks you did alone, no decision that affected other people, and a perfect outcome with nothing that slipped.
  followUps:
    - q: What did you decide not to do, and who disagreed?
      level: Senior
      a: |-
        Name one thing you cut or delayed and the person who wanted it. Say how you explained the choice and whether they accepted it. Leading shows most clearly in what you refused, so have one clear example ready.
    - q: What would have happened if you had not taken it on?
      level: Senior
      companies: [Amazon]
      a: |-
        Give a concrete estimate and the evidence behind it: a deadline that would have passed, or work that two teams would have done twice. Do not claim the project would have failed completely unless you can show it.
- id: lp-invent-simplify-automated-team-process
  q: Tell me about a time you automated a task to save your team time.
  level: Junior
  category: amazon-leadership-principles
  subcategory: invent-think-big-frugality
  companies:
    - Amazon
  signals:
    - lp-invent-and-simplify
  topics:
    - /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
  a: |-
    **What it tests.** Invent and Simplify. The principle asks you to look for better and simpler ways of working. The interviewer checks that you saw the waste yourself, measured it, and built something other people kept using. At junior level the hard part is proving the time saved with a number.

    **How to shape the answer.**

    - **Situation and task.** Say what the manual task was, who did it, how often, and how long it took.
    - **Action.** Say what you built, how long you spent on it, and how you got the team to trust it.
    - **Result.** Give the time saved, and say whether people still use it.
    - **Learning.** Say what you would do to make it easier to maintain.

    **A strong answer sounds like this.** "Before every release, someone on our frontend team spent about 90 minutes checking 30 pages by hand for layout breaks. I was three months into the job and had done it twice. I wrote a script that took a screenshot of each page and compared it with the last release. It took me 3 working days. The first version flagged too many false changes, so I added a 2 percent tolerance. The check now takes about 15 minutes of reading a report. The team has used it for 11 releases, and it caught a broken menu in the second one."

    **Watch out for.** Automating something that ran twice a year, no before and after numbers, and a tool that only you can run.
  followUps:
    - q: How did you decide it was worth automating?
      level: Junior
      a: |-
        Do the sum aloud: minutes per run, runs per month and people affected, against the days needed to build it. Mention any errors the manual way caused. The interviewer wants to see that you compared cost and benefit before you started.
    - q: Who maintains it now?
      level: Junior
      a: |-
        Name the owner and where the code and instructions live. If it broke after you built it, say what happened and who fixed it. A small tool that the team owns is a better answer than a clever one that depends on you.
- id: lp-invent-simplify-genai-for-team-work
  q: How have you used generative AI to improve your own work or your team's work? Give me one specific example.
  level: Mid
  category: amazon-leadership-principles
  subcategory: invent-think-big-frugality
  companies:
    - Amazon
  signals:
    - lp-invent-and-simplify
    - judgment
  topics:
    - /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
  a: |-
    **What it tests.** Invent and Simplify. The principle asks you to keep finding simpler and better ways to work. The interviewer wants one real case with a measured gain, and proof that you checked the output. At mid level it gets hard when they ask where the tool made things worse.

    **How to shape the answer.**

    - **Situation and task.** Name the task, how long it took before, and why you tried an AI tool on it.
    - **Action.** Say exactly how you used the tool and how you checked what it produced.
    - **Result.** Give the gain as a number, and one case where the tool was wrong.
    - **Learning.** Say which tasks you now give it and which you keep.

    **A strong answer sounds like this.** "Our team writes unit tests for data transforms, and it was slow work. I began asking an AI assistant to draft tests from the function and three sample rows. I read every test and ran it against a copy of the function with a planted bug. If the test still passed, I threw it away. Over 6 weeks my test-writing time dropped by about a third. It also hurt once: a generated test asserted the wrong rounding rule and I merged it. A reviewer caught it. I shared the planted-bug check, and four of our seven engineers use it now."

    **Watch out for.** General praise for AI with no example, no account of how you verified the output, and no care about what data you gave to an outside tool.
  followUps:
    - q: When did an AI tool make you slower or introduce a bug, and what did you change?
      level: Mid
      companies: [Amazon]
      a: |-
        Give one real case with its cost in hours or in a bug that shipped. Then give the rule you added, such as a check for generated tests or a kind of change you no longer give to the tool. Saying it never happened is hard to believe.
    - q: How would you measure whether AI tools make the team faster without lowering quality?
      level: Mid
      companies: [Amazon]
      a: |-
        Pick two measures and track them together. Use one for speed, such as time from first commit to merge, and one for quality, such as bugs found after release or rework asked for in review. Compare the same team before and after for at least a month.
- id: lp-invent-simplify-improve-a-feature-you-ran
  q: Pick a product or feature you know well. If you ran it, what would you improve?
  level: Senior
  category: amazon-leadership-principles
  subcategory: invent-think-big-frugality
  companies:
    - Amazon
  signals:
    - lp-invent-and-simplify
    - customer-focus
  topics:
    - /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
  a: |-
    **What it tests.** Invent and Simplify. The principle asks you to keep looking for new ideas and for ways to make things simpler. The interviewer tests how many good ideas you have, and whether any of them remove something. Expect to hear "what else" several times. At senior level the hard part is ranking ideas by customer value and saying how you would test them.

    **How to shape the answer.**

    - **Start with the customer.** Name the product, who uses it, and the one problem you would fix first.
    - **Give ideas in order.** Offer three or four, ranked, with a reason for the order.
    - **Include a removal.** Name one thing you would take out or simplify.
    - **Say what you would check.** Give the data or small test you would want before you commit.

    **A strong answer sounds like this.** "I would pick the paging tool my last team used for on-call. First, I would group alerts by cause. In one bad week we got 212 pages, and 160 traced to 3 causes. Second, I would remove the custom severity levels. We had 7 and people used 2. Third, I would add a required one-line field: what to do first. Before any of this, I would read 3 months of pages to confirm the pattern. If you ask what else, I would let the engineer on call silence a known alert for 2 hours."

    **Watch out for.** Only additions and nothing removed, running out of ideas after two, and ideas with no user named.
  followUps:
    - q: What else?
      level: Senior
      companies: [Amazon]
      a: |-
        Have a second list ready, and expect the question more than once. Give each new idea in one sentence and say who it helps. When you truly run out, say so and say which idea you would do first. Do not pad the list with weak ideas.
    - q: What would you remove or simplify?
      level: Senior
      companies: [Amazon]
      a: |-
        Name a feature, option or step that few people use and that adds cost. Say how you would confirm the low use, who would object, and how you would retire it safely. Removing something well shows more judgment than adding one more feature.
- id: lp-think-big-ambitious-goal-you-set
  q: Tell me about an ambitious goal you set for yourself. Did you reach it?
  level: Junior
  category: amazon-leadership-principles
  subcategory: invent-think-big-frugality
  companies:
    - Amazon
  signals:
    - lp-think-big
    - delivery
  topics:
    - /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
  a: |-
    **What it tests.** Think Big. The principle asks you to set a direction that is larger than the safe option and to look for ways to reach it. At junior level nobody expects a company strategy. The interviewer wants a goal above what was asked, a reason why it was a stretch, and a plan with steps. A goal you partly missed is fine if you learned from it.

    **How to shape the answer.**

    - **Situation and task.** State the normal expectation and the larger goal you set. Say why the larger one mattered.
    - **Action.** Give the plan: the steps, and what you had to learn.
    - **Result.** Say how far you got, with a number. Be exact about any shortfall.
    - **Learning.** Say how you size goals now.

    **A strong answer sounds like this.** "The brief for my final-year project was a prototype that recommended courses to students. I set a goal of 200 real students using it before the deadline, because a demo on fake data would teach me little. I split it into 3 steps: a working version by week 6, a pilot with one class of 40, then a wider launch. The pilot showed that login was too slow, and fixing it cost me 2 weeks. I ended with 126 users, short of 200. Their feedback changed my ranking logic twice, which test data would never have done."

    **Watch out for.** A goal that was simply your assigned task, a big goal with no plan, and calling a missed goal a success.
  followUps:
    - q: Why was that goal ambitious for you at the time?
      level: Junior
      a: |-
        Compare it with what was expected and with what you had done before. Use a number if you can: twice the users, half the time, or a skill you did not yet have. The interviewer is checking that the stretch was real.
    - q: What did you give up to chase the larger goal?
      level: Junior
      a: |-
        Name the cost: features you left out, polish you skipped, or time taken from other courses or tasks. Say whether you would make the same trade again. Big goals always cost something, and the interviewer wants to see that you noticed.
- id: lp-think-big-pushed-team-to-take-a-risk
  q: Tell me about a time you pushed your team to take a bigger risk than they were comfortable with.
  level: Mid
  category: amazon-leadership-principles
  subcategory: invent-think-big-frugality
  companies:
    - Amazon
  signals:
    - lp-think-big
    - influence
  topics:
    - /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
  a: |-
    **What it tests.** Think Big. The principle asks you to propose bold directions and bring other people along. The interviewer checks that the risk was real, that you understood what could go wrong, and that you limited the damage if it did. At mid level the hard part is persuading people who had good reasons to be careful.

    **How to shape the answer.**

    - **Situation and task.** Say what the safe plan was, what you proposed, and what was at stake.
    - **Action.** Say how you made the case, what objections you heard, and what limits you put on the risk.
    - **Result.** Give the outcome with a number, good or bad.
    - **Learning.** Say how you now judge when a larger bet is worth it.

    **A strong answer sounds like this.** "Our mobile team planned to patch a slow checkout screen for the fourth time in a year. I proposed rebuilding it in 6 weeks, which meant pausing two planned features. The lead worried that we would miss the holiday period. I offered a rule: if the new screen was not in testing by week 4, we would stop and patch. I also kept the old screen behind a switch. We reached testing in week 4 and shipped in week 7, one week late. Checkout time fell from 9 seconds to 5, and completed orders rose by about 3 percent."

    **Watch out for.** A risk with no downside described, forcing the decision through over objections, and taking sole credit for a shared bet.
  followUps:
    - q: What would you have done if it had failed?
      level: Mid
      a: |-
        Describe the fallback you had agreed in advance: the stop point, the switch back, and who would decide. Then say what you would have told the team. A bold plan with no exit sounds careless to the interviewer.
    - q: Who was hardest to convince, and what changed their mind?
      level: Mid
      a: |-
        Name the role and state their concern fairly. Say what evidence or limit answered it. If they never fully agreed and you went ahead with their consent, say that. The interviewer wants to hear that you listened.
- id: lp-think-big-long-term-plan-you-proposed
  q: Tell me about a long-term plan or vision you proposed. How did you get it started?
  level: Senior
  category: amazon-leadership-principles
  subcategory: invent-think-big-frugality
  companies:
    - Amazon
  signals:
    - lp-think-big
    - strategy
  topics:
    - /behavioral/amazon-leadership-principles/invent-simplify-and-think-big
    - /behavioral/leveling-and-tracks/staff-and-principal-behavioral
  a: |-
    **What it tests.** Think Big. The principle asks you to describe a future that is clearly better than today and to get people moving toward it. The interviewer wants a plan that reached beyond your own team and the next quarter, and proof that you took the first step yourself. At senior level the hard part is how you won support without authority and kept the plan alive when priorities changed.

    **How to shape the answer.**

    - **Situation and task.** Describe today's state, the future you proposed, and why the gap mattered.
    - **Action.** Say who you took it to and what first step you delivered.
    - **Result.** Say how far it has gone, with numbers, and what is still open.
    - **Learning.** Say how you would make the case differently.

    **A strong answer sounds like this.** "Each of our 5 ML teams trained and served models in its own way, and a new model took about 10 weeks to reach production. I wrote a 6-page proposal for one shared path, with a target of 3 weeks. Two directors liked it and gave no staff. So I moved my own team's 2 models first and published the result: 10 weeks down to 4. That won us 3 engineers for two quarters. Eighteen months later, 4 of the 5 teams use it. The fifth has special hardware needs, and I have not solved that yet."

    **Watch out for.** A vision with no first step, a plan that is only a longer backlog, and claiming the full result when adoption is partial.
  followUps:
    - q: How did you get support from people who did not report to you?
      level: Senior
      a: |-
        Name the people and what each one cared about. Say what you showed them: a small result, a cost figure or a customer problem. Say what you gave up to get agreement. Support won with a working example is the strongest answer.
    - q: What part of the plan turned out to be wrong?
      level: Senior
      a: |-
        Give one assumption that failed and when you found out. Say how you changed the plan and how you told the people who had backed it. A long-term plan that never changed sounds like one that was never tested.
- id: lp-are-right-a-lot-goal-wrong-midway
  q: Tell me about a project where you found out partway through that the goal was wrong. What did you do?
  level: Junior
  category: amazon-leadership-principles
  subcategory: dive-deep-judgment
  signals:
    - lp-are-right-a-lot
    - ambiguity
  topics:
    - /behavioral/amazon-leadership-principles/dive-deep-and-are-right-a-lot
    - /behavioral/competencies/ambiguity-and-shifting-priorities
  a: |-
    **What it tests.** Are Right, A Lot. The principle asks for good judgment: check your beliefs against evidence and against people who see things differently, and change your mind when the facts change. The interviewer listens for what told you the goal was wrong and how fast you raised it. At junior level the hard part is speaking up with evidence when someone more senior set the goal.

    **How to shape the answer.**

    - **Situation and task.** State the original goal, who set it, and how far along you were.
    - **Action.** Say what evidence showed the problem, who you took it to, and what options you offered.
    - **Result.** Say what changed and what it cost in time.
    - **Learning.** Say what you now check before you start.

    **A strong answer sounds like this.** "I was asked to make our signup form load in under 1 second. In week two I opened the funnel data to measure my progress. Load time was fine. The real loss was at the phone number field, where 22 percent of people left. I wrote half a page with the numbers and showed my lead the same day. I offered two options: finish the speed work in 3 more days, or switch. She chose to switch. Making the phone field optional cut the loss to 9 percent. About a week of my speed work went unused."

    **Watch out for.** Quietly changing the goal on your own, carrying on because it was the assignment, and a feeling with no evidence behind it.
  followUps:
    - q: What would you have done if your manager had told you to carry on as planned?
      level: Junior
      a: |-
        Say you would ask what they know that you do not, and then do the work well if the answer holds. Add how you would keep the evidence visible, such as a short note with the numbers and a date to look at them again.
    - q: Could you have found this out earlier?
      level: Junior
      a: |-
        The honest answer is usually yes. Name the check you skipped, such as reading the data before you started or asking how success would be measured. Then say that you do it now, with one example from a later task.
- id: lp-are-right-a-lot-judgment-call-was-wrong
  q: Tell me about a time your judgment was wrong. How did you find out, and what did you do?
  level: Mid
  category: amazon-leadership-principles
  subcategory: dive-deep-judgment
  companies:
    - Amazon
  signals:
    - lp-are-right-a-lot
    - failure
  topics:
    - /behavioral/amazon-leadership-principles/dive-deep-and-are-right-a-lot
  a: |-
    **What it tests.** Are Right, A Lot. The principle asks you to have sound judgment, and that depends on noticing quickly when you are wrong. The interviewer watches how you reason and how you react to evidence against you. At mid level it gets hard in the follow-ups: why the call looked right, and how long you took to admit it.

    **How to shape the answer.**

    - **Situation and task.** State the decision and why you chose as you did.
    - **Action.** Say what signal showed you were wrong and what you did next.
    - **Result.** Give the cost of the wrong call and the outcome after you corrected it.
    - **Learning.** Name the specific check you added to how you decide.

    **A strong answer sounds like this.** "I chose to rebuild a slow nightly job as a streaming pipeline. I judged from two complaints that the analysts wanted fresh data. Three weeks in, I asked five analysts how they would use it. Four said they looked at the numbers once each morning. The real problem was that the job finished at 10 am, after their meeting. I told my manager that my call was wrong. I stopped the streaming work and fixed two slow joins, so the job now ends by 6 am. I lost three weeks. Now I talk to five users before I size a solution."

    **Watch out for.** A mistake so small that it cost nothing, blaming information you could have asked for, and a lesson stated as "be more careful".
  followUps:
    - q: Why did you make that call in the first place?
      level: Mid
      companies: [Amazon]
      a: |-
        Give your reasoning as it was then, without defending it. Name the evidence you had and the assumption you did not test. The interviewer is judging how you think, so a clear account of a wrong call scores better than a vague one.
    - q: What signal showed you that you were wrong?
      level: Mid
      companies: [Amazon]
      a: |-
        Name the exact data point or conversation, and the date. Say whether you went looking for it or it found you. Looking for evidence against your own plan is the habit this principle rewards.
    - q: How long did it take you to admit it and change course?
      level: Mid
      companies: [Amazon]
      a: |-
        Give the real time in days. If you delayed, say why: the work already done, pride, or hope that things would improve. Then say who you told first and what you said. A fast and plain admission is the signal.
- id: lp-are-right-a-lot-design-you-defended
  q: Tell me about a time a colleague disagreed with your design. How did you know your design was the right one?
  level: Senior
  category: amazon-leadership-principles
  subcategory: dive-deep-judgment
  companies:
    - Amazon
  signals:
    - lp-are-right-a-lot
    - conflict
  topics:
    - /behavioral/amazon-leadership-principles/dive-deep-and-are-right-a-lot
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Are Right, A Lot. The principle asks you to test your views against other views and against evidence before you trust them. The trap in this prompt is the word "know". The interviewer wants to hear how you checked, and whether you considered that your colleague was right. At senior level, "I had more experience" fails. A test you both agreed on in advance passes.

    **How to shape the answer.**

    - **Situation and task.** Describe both designs fairly, and say what each of you was trying to protect.
    - **Action.** Say how you turned the disagreement into a question that data could answer.
    - **Result.** Give the result of the test, the decision, and what you took from their design.
    - **Learning.** Say how you settle design disputes now.

    **A strong answer sounds like this.** "I designed a queue between our order service and our billing service. A colleague wanted a direct call, because it was simpler to debug. I believed the queue was right and could not prove it. We agreed on one question: what happens when billing is down for 10 minutes. We replayed a day of real traffic against both designs with a forced outage. The direct call failed 1,900 orders and the queue failed none. Her review also showed that my design hid stuck messages, so I added the dashboard she suggested. We presented the result together."

    **Watch out for.** Winning by rank or by persistence, giving a weak version of the colleague's view, and certainty with no test behind it.
  followUps:
    - q: How did you establish that your colleague was wrong?
      level: Senior
      companies: [Amazon]
      a: |-
        Be careful with the framing. Say what test or data settled the specific point, and what they were right about. If nothing objective settled it and someone senior chose, say so. Claiming the other person was simply wrong is the trap.
    - q: Tell me about a time the other person turned out to be right.
      level: Senior
      a: |-
        Have a second, short story ready. Say what you believed, what showed you otherwise, and how fast you changed. The interviewer is checking that your record includes losses, since nobody's judgment is right every time.
- id: lp-learn-be-curious-new-technology-for-a-task
  q: Tell me about a time you had to learn a new technology quickly to finish a task.
  level: Junior
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  companies:
    - Amazon
  signals:
    - lp-learn-and-be-curious
    - growth
  topics:
    - /behavioral/amazon-leadership-principles/frugality-and-curiosity
  a: |-
    **What it tests.** Learn and Be Curious. The principle asks you to keep learning and to explore what you do not yet know. The interviewer wants your method: where you started, how you practised, and how you checked that you understood enough to ship. At junior level the common weakness is stopping at "I read the documentation".

    **How to shape the answer.**

    - **Situation and task.** Name the technology, why the task needed it, and how much time you had.
    - **Action.** Give your learning steps in order: sources, a practice build, and who you asked.
    - **Result.** Say what you shipped and how it performed. Give one thing you got wrong while learning.
    - **Learning.** Say what you would do faster next time.

    **A strong answer sounds like this.** "In my first month I got a ticket to add caching to a slow product API. I had never used a cache server, and I had 2 weeks. I spent 2 days on the official tutorial and built a small demo that cached one endpoint. Then I asked a senior engineer to review my plan for 30 minutes. She pointed out that I had no rule for removing stale prices. I added a 5-minute expiry and a test for it. Response time went from 800 milliseconds to 120. Now I ask for a design review before I write the real code."

    **Watch out for.** A list of courses with nothing shipped, claiming you mastered the tool in a weekend, and no mention of anyone you asked.
  followUps:
    - q: How did you know you understood it well enough to ship?
      level: Junior
      companies: [Amazon]
      a: |-
        Name your checks: tests for the failure cases, a review by someone who knew the tool, and a small rollout first. Say what you still did not understand and how you limited that risk. Confidence with no check behind it is the wrong answer.
    - q: What did you get wrong while you were learning it?
      level: Junior
      a: |-
        Give one concrete mistake and how you found it, such as a wrong setting caught in review. Then say what it taught you about the tool. An account with no mistakes in it sounds like shallow learning.
- id: lp-learn-be-curious-risk-that-did-not-pay-off
  q: Tell me about a time you took a risk and it did not work out. What did you learn?
  level: Mid
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  companies:
    - Amazon
  signals:
    - lp-learn-and-be-curious
    - failure
  topics:
    - /behavioral/amazon-leadership-principles/frugality-and-curiosity
    - /behavioral/competencies/production-incidents-and-mistakes
  a: |-
    **What it tests.** Learn and Be Curious. The principle asks you to treat every result, good or bad, as something to learn from, and to keep trying new things. The interviewer wants a risk you chose, a real failure, and a change in how you work. At mid level it gets hard when they ask what you would do with the same choice today.

    **How to shape the answer.**

    - **Situation and task.** Say what the risk was and why you took it.
    - **Action.** Say when you saw it failing and how you limited the damage.
    - **Result.** State the failure plainly, with its cost.
    - **Learning.** Give one specific change in your practice, and one time you have applied it since.

    **A strong answer sounds like this.** "I pushed to move our web app's forms to a validation library I had only tried in a side project. I expected to halve our form code. I converted 6 of 22 forms in two weeks. Then we found it did not support our date picker, and screen reader users lost error messages on 2 forms. I reverted those 2 the same day and told the team I had misjudged it. We dropped the plan. It cost about 3 weeks. Now I test any new library on our 3 hardest screens first. Last quarter that check rejected a charting library in 2 days."

    **Watch out for.** A "failure" that was really a success, a risk that someone else chose, and a lesson you cannot show you have used.
  followUps:
    - q: What did you learn from it?
      level: Mid
      companies: [Amazon]
      a: |-
        Give one lesson that changed a habit, and one later case where you used it. Keep it specific to how you work. "Communicate more" or "plan better" is too general to count as a lesson.
    - q: Knowing what you know now, would you take that risk again?
      level: Mid
      a: |-
        Take a position. If yes, say what you would do to make failure cheaper. If no, say which signal should have stopped you. The interviewer wants proof that one failure did not make you avoid all risk.
- id: lp-learn-be-curious-taught-yourself-recently
  q: What have you taught yourself recently, and why did you choose it?
  level: Senior
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  companies:
    - Amazon
  signals:
    - lp-learn-and-be-curious
    - growth
  topics:
    - /behavioral/amazon-leadership-principles/frugality-and-curiosity
  a: |-
    **What it tests.** Learn and Be Curious. The principle asks you to stay a learner however senior you are. The interviewer wants something recent, chosen by you, and learned to a depth you can prove. At senior level the hard part is the reason: a strong one connects to a problem you saw coming, and the learning changes other people's work too.

    **How to shape the answer.**

    - **Name it and date it.** Say what you learned and when. Pick something from the last 6 months.
    - **Give the reason.** Say what problem made you choose it.
    - **Show the depth.** Say how you learned it and what you built with it.
    - **Say what it changed.** Give the effect on your team's work, and what you still do not know.

    **A strong answer sounds like this.** "Over the last 4 months I taught myself basic time-series forecasting. I run capacity planning for our platform, and we sized clusters by adding 30 percent to last year's peak. I suspected we were overpaying. I worked through 8 chapters of a textbook and rebuilt the forecast for one service. My first model was worse than the old rule, because I had ignored weekly cycles. The second cut spare capacity on that service by about 12 percent. I ran two sessions for the team, and three engineers now own forecasts for their services. I still cannot explain confidence intervals well."

    **Watch out for.** Something you learned years ago, a course with nothing built from it, and a topic chosen only for fashion.
  followUps:
    - q: How do you keep up with changes in technology?
      level: Senior
      companies: [Amazon]
      a: |-
        Give your actual routine with numbers: what you read, how often, and how you decide what to ignore. Then give one thing you picked up this way and used at work. A long list of sources with no result is weak.
    - q: What is the area where you most need to improve?
      level: Senior
      companies: [Amazon]
      a: |-
        Name a real gap that matters for the role, with a recent example of what it cost you. Then say what you are doing about it and how you measure progress. Avoid a strength dressed up as a weakness.
- id: lp-hire-develop-helped-a-teammate-learn
  q: Tell me about a time you taught a teammate something or helped them get better at their work.
  level: Junior
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  companies:
    - Amazon
  signals:
    - lp-hire-and-develop-the-best
    - mentoring
  topics:
    - /behavioral/amazon-leadership-principles/hire-develop-and-best-employer
  a: |-
    **What it tests.** Hire and Develop the Best. The principle asks everyone to raise the level of the people around them. You do not need to be a manager to answer this. The interviewer wants one person, one skill, and proof that they could do it without you afterward. At junior level the hard part is showing that you did not simply do the work for them.

    **How to shape the answer.**

    - **Situation and task.** Say who the person was, what they struggled with, and how you noticed.
    - **Action.** Say how you taught: what you explained and what you let them try.
    - **Result.** Say what they could do alone afterward, with an example.
    - **Learning.** Say what you learned about teaching.

    **A strong answer sounds like this.** "A new intern joined our team a month after me and was stuck on our test setup for two days. I had fought the same setup, so I offered an hour. I did not fix it for him. I asked him to share his screen and read the error aloud, and I pointed to where the config lived. He fixed it in 40 minutes. We then wrote a one-page setup note together, and he added two steps I had missed. A week later he helped the next intern with it. Her setup took 2 hours. Mine had taken two days."

    **Watch out for.** Taking over the keyboard and calling it teaching, a group training with no single person in it, and no evidence that the person improved.
  followUps:
    - q: How did you know they had really learned it?
      level: Junior
      a: |-
        Give the evidence: they did the task alone later, explained it to someone else, or caught a mistake of yours. Say when you checked. If they still needed help, say what you tried next.
    - q: What did you learn from teaching them?
      level: Junior
      a: |-
        Name one thing, such as a gap in your own understanding that their question exposed, or that asking questions works better than giving answers. Tie it to what you did the next time you helped someone.
- id: lp-hire-develop-got-a-group-working-together
  q: Tell me about a time you got a group to work well together on a project. What did you do?
  level: Mid
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  signals:
    - lp-hire-and-develop-the-best
    - influence
  topics:
    - /behavioral/amazon-leadership-principles/hire-develop-and-best-employer
    - /behavioral/competencies/influence-without-authority
  a: |-
    **What it tests.** Hire and Develop the Best. The principle asks you to bring out the best in the people you work with and to help them grow, with or without a manager title. The interviewer wants to hear what was stopping the group, what you did, and how individual people did better. At mid level it gets hard when the group includes people senior to you or from other teams.

    **How to shape the answer.**

    - **Situation and task.** Say who was in the group and what was getting in the way.
    - **Action.** Say what you changed, and what you did for one person in particular.
    - **Result.** Give the outcome and one sign that the group worked better.
    - **Learning.** Say what you would do sooner.

    **A strong answer sounds like this.** "Five of us from three teams had 8 weeks to build a fraud model. After two weeks we had three separate notebooks and no shared data set, and two people had stopped coming to the sync. I asked each person privately what they wanted from the project. One wanted to learn feature engineering and had been given only cleanup work. I proposed one shared data set and swapped two tasks so that she owned the features. We delivered in week 9, one week late. The model caught 6 percent more fraud than the old rules, and she presented the feature work."

    **Watch out for.** A team social event as the answer, no reason why the group was struggling, and no named action of yours.
  followUps:
    - q: Was anyone not doing their share, and what did you do about it?
      level: Mid
      a: |-
        Say what you saw, and that you spoke to the person first, in private. Say what you learned, since the cause is often unclear tasks or other deadlines. Say what changed. Going to their manager first is a weak answer.
    - q: What did each person get out of the project?
      level: Mid
      a: |-
        Pick two people and say what each one learned or was recognised for. This shows that you thought about their growth as well as the deadline, which is the part of the principle this prompt tests.
- id: lp-hire-develop-hire-who-did-not-work-out
  q: Tell me about a hire who did not work out. How did you handle the low performance?
  level: Senior
  category: amazon-leadership-principles
  subcategory: people-curiosity-responsibility
  companies:
    - Amazon
  signals:
    - lp-hire-and-develop-the-best
    - people-management
  topics:
    - /behavioral/amazon-leadership-principles/hire-develop-and-best-employer
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Hire and Develop the Best. The principle asks leaders to raise the standard with every hire, to spot strong people, and to take coaching seriously. It checks whether you can see your own hiring mistake, and whether you act on low performance early and fairly. The hard part is being honest about a decision that went badly while showing respect for the person.

    **How to shape the answer.**

    - **Situation and task.** Say what role you hired for, what you saw in the interview, and when the problems started.
    - **Action.** Say what feedback you gave and when, and what support and time you offered.
    - **Result.** Say how it ended and what it cost the team.
    - **Learning.** Say what you changed in how you hire.

    **A strong answer sounds like this.** "I hired a senior engineer for my team of 7 after a strong design interview. I had skipped the coding round because we were in a hurry. Within 6 weeks his changes needed heavy rework, and two reviews turned tense. I told him directly in week 7, with three examples. We agreed a 60-day plan with weekly check-ins and a pairing partner. His communication improved and his code quality stayed below our bar. He moved to a support engineering role that suited him better. The team lost about a quarter of one person's output. I no longer skip a round."

    **Watch out for.** Blaming the recruiter or the candidate, waiting months before giving clear feedback, and describing the person with contempt.
  followUps:
    - q: What did you miss in the interview?
      level: Senior
      a: |-
        Name the specific signal you skipped or misread, and why: time pressure, a strong first impression, or a missing interview round. Then give the change you made to the process. The interviewer wants a hiring lesson you can state in one sentence.
    - q: How do you manage your strongest people differently?
      level: Senior
      companies: [Amazon]
      a: |-
        Say what you give them: harder problems, more freedom, and honest feedback about their next level. Give one example of a stretch task you set and how it went. Leaving top performers alone because they cause no trouble is the mistake to avoid.
    - q: Have you ever had to manage someone out of the company?
      level: Senior
      companies: [Amazon]
      a: |-
        Answer yes or no first. If yes, give the timeline: when you first raised it, the support you offered, and the final decision. Show that the outcome did not surprise the person. If no, describe the closest case and what you would do.
- id: lp-highest-standards-should-have-done-more
  q: Tell me about a time you finished a piece of work and felt you should have done more.
  level: Junior
  category: amazon-leadership-principles
  subcategory: action-results-standards
  companies:
    - Amazon
  signals:
    - lp-highest-standards
    - growth
  topics:
    - /behavioral/amazon-leadership-principles/highest-standards-vs-speed
  a: |-
    **What it tests.** Insist on the Highest Standards. The principle asks you to hold a bar that other people may find too high, and to fix problems so that they stay fixed. This prompt checks whether your own standard is higher than "it passed review". At junior level the interviewer wants to hear that you noticed the gap yourself, said so, and closed it.

    **How to shape the answer.**

    - **Situation and task.** Say what the work was and what "done" meant to the team.
    - **Action.** Say what was missing, when you noticed, and what you did about it.
    - **Result.** Say what the gap cost or could have cost, and what you fixed.
    - **Learning.** Say what you now check before you call work finished.

    **A strong answer sounds like this.** "In my first job I built the photo upload screen in our mobile app. It passed review and worked in the demo. I had tested only small images. A week after release I saw in the logs that uploads over 5 megabytes failed with a blank error, about 40 times a day. Nobody had reported it. I told my lead that I should have tested large files. I fixed it in a day with a size check and a clear message, and I added three large-file cases to our tests. Now I write down the worst inputs before I start coding."

    **Watch out for.** A false shortfall such as "I worked too hard", a gap that someone else found, and regret with no action.
  followUps:
    - q: Why did you not do it at the time?
      level: Junior
      a: |-
        Give the honest reason: time pressure, not knowing the risk, or wanting to close the ticket. Avoid blaming the deadline alone. Then say what would make you choose differently now, such as a checklist or asking for one more day.
    - q: How do you decide when work is good enough to stop?
      level: Junior
      a: |-
        Give your rule. For example: it meets the stated need, the main failure cases are tested, and someone else can maintain it. Say that you list known gaps in writing when you stop, so the team can choose with full information.
- id: lp-highest-standards-checking-ai-output
  q: How do you make sure that what an AI tool generates for you is correct before you use it?
  level: Mid
  category: amazon-leadership-principles
  subcategory: action-results-standards
  companies:
    - Amazon
  signals:
    - lp-highest-standards
    - judgment
  topics:
    - /behavioral/amazon-leadership-principles/highest-standards-vs-speed
  a: |-
    **What it tests.** Insist on the Highest Standards. The principle asks you to keep the quality bar high for everything you deliver, whoever or whatever produced the first draft. The interviewer wants a method you really follow, with an example of an error you caught. At mid level it gets hard when they ask where you stopped using the tool.

    **How to shape the answer.**

    - **State your rule.** Say that you own the output as if you wrote it.
    - **Give your checks.** List two or three, such as reading every line and writing the tests yourself.
    - **Give an example.** Describe one error you caught or missed, and its cost.
    - **Say where you draw the line.** Name tasks you keep from the tool and data you never paste into it.

    **A strong answer sounds like this.** "I treat generated code as a draft from a stranger. I read every line, and I write the tests myself so that the tool does not mark its own work. For SQL, I run the query on a small table where I know the right answer. Last month an assistant wrote me a join that looked fine and doubled revenue for customers with two addresses. My 20-row test table caught it in a minute. I do not use these tools for access control changes, and I never paste customer records or credentials into an outside tool."

    **Watch out for.** "I review it carefully" with no method, trusting output because it runs, and no limits on what you share.
  followUps:
    - q: Which tasks have you stopped giving to AI tools, and why?
      level: Mid
      companies: [Amazon]
      a: |-
        Name one or two, each with the incident or reason behind it. For example, security-sensitive code after a subtle flaw, or long refactors where review took longer than writing. This shows that your trust is based on results.
    - q: What would you never paste into an external AI tool?
      level: Mid
      companies: [Amazon]
      a: |-
        List the categories: customer data, credentials and keys, unreleased plans, and code your employer restricts. Say that you follow your company's policy and ask when unsure. Mention how you still get help, for example by replacing real values with made-up ones.
- id: lp-highest-standards-challenged-status-quo
  q: Tell me about a time you refused to accept the way something had always been done.
  level: Senior
  category: amazon-leadership-principles
  subcategory: action-results-standards
  companies:
    - Amazon
  signals:
    - lp-highest-standards
    - influence
  topics:
    - /behavioral/amazon-leadership-principles/highest-standards-vs-speed
  a: |-
    **What it tests.** Insist on the Highest Standards. The principle asks you to keep raising the bar and to stop known defects from passing down the line. The interviewer wants a standard that everyone had accepted, your evidence that it was too low, and a lasting change. At senior level the change must reach beyond your own work to how a team or several teams operate.

    **How to shape the answer.**

    - **Situation and task.** Describe the accepted practice, how long it had stood, and what it was costing.
    - **Action.** Say what evidence you gathered, who you had to persuade, and what you changed.
    - **Result.** Give the before and after numbers, and say whether the new standard held.
    - **Learning.** Say what the resistance taught you.

    **A strong answer sounds like this.** "Our web teams had always fixed accessibility bugs after release, when a customer complained. We had 64 open, and the list grew by about 5 a month. I audited our 10 most used pages and showed that 7 could not be completed by keyboard alone. I proposed that no page ships with a keyboard or contrast failure, added an automated check to the build, and ran two short workshops. Two teams objected to the extra time, so we agreed a 6-week grace period. After 5 months the open list was 19, and new bugs fell to about 1 a month."

    **Watch out for.** Complaining about a practice without changing it, a standard that only you follow, and no account of the people who disagreed.
  followUps:
    - q: How did you respond to people who said the old way was good enough?
      level: Senior
      a: |-
        State their reason fairly. It is often speed or cost. Say what evidence you showed and where you gave way, such as a grace period. The interviewer wants a high bar that people accepted, since a bar forced on a team rarely lasts.
    - q: How do you know the higher standard is still in place today?
      level: Senior
      a: |-
        Point to a mechanism: an automated check, a review step, or a number that someone reports each month. Say who owns it. A standard that depends on you reminding people has not really changed anything.
