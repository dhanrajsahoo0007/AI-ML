- id: when-would-you-use-a-multi-agent-system
  q: When would you use a multi-agent system?
  a: |
    When a task splits naturally into parts that benefit from separate contexts, tools or instructions, such as parallel research on several sub-questions, or a writer and reviewer pair. Multi-agent systems add coordination overhead, cost and new failure modes, so a single well-tooled agent should be the default until evaluation shows a clear benefit.
  level: Senior
  category: agents
  subcategory: multi-agent
- id: how-do-you-make-an-agent-s-actions-reversible-or-at-least-au
  q: How do you make an agent's actions reversible, or at least auditable, in a production system?
  a: |
    Prefer reversible designs: drafts instead of sends, soft deletes, staging environments, feature branches and pull requests instead of direct commits, and transactions that can be rolled back. For each action, record the inverse operation where one exists.

    Make everything auditable: log every tool call with the user, agent version, inputs, outputs, approvals and timestamps in append-only storage, linked to the full trace. Use idempotency keys so retries are safe, require approval for irreversible actions, and give operators tools to review and undo an agent's recent actions.
  level: Senior
  category: agents
  subcategory: agent-reliability
  companies:
  - Palantir
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: design-human-in-the-loop-approval-for-an-agent-that-takes-co
  q: Design human-in-the-loop approval for an agent that takes consequential actions.
  a: |
    Classify actions by risk in code: read-only and reversible actions run automatically; consequential ones such as payments, deletions, external messages, production changes or amounts above a threshold require approval. The agent proposes the action with a clear summary, the exact parameters, its reasoning and the expected effect, and pauses.

    The approver sees a concise review screen, can approve, edit or reject, and the decision is logged. Handle timeouts, approvals from the right role, and expiry if the world changed. Track approval rates and edits to find actions that can safely be automated later, and never let the model itself decide that approval is unnecessary.
  level: Senior
  category: agents
  subcategory: agent-reliability
  companies:
  - OpenAI
  - Palantir
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: design-a-customer-facing-agent-for-an-airline-that-can-cance
  q: Design a customer-facing agent for an airline that can cancel and rebook flights. How do you keep it from violating fare policy?
  a: |
    Put fare policy in code, not in the prompt. The agent can only act through tools such as get_booking, get_eligible_options and rebook_flight that call the airline's systems, and those tools compute eligibility, fees and refund amounts from the fare rules; the model never calculates or approves money on its own.

    The agent explains options, collects the customer's choice and confirms before executing. Add authentication, limits, human handoff for exceptions, logging, and an evaluation suite of policy scenarios, including customers pushing for exceptions, measured on final booking state and policy compliance across repeated runs.
  level: Senior
  category: agents
  subcategory: agent-reliability
  companies:
  - Sierra
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  refs:
