- id: what-matters-more-for-an-agentic-coding-tool-like-claude-cod
  q: 'What matters more for an agentic coding tool like Claude Code: the model or the harness? Design the loop.'
  a: |
    Both matter, but given a capable model, the harness often decides whether the product is reliable. The model supplies reasoning and code; the harness supplies the right context, well-designed tools, an execution environment, feedback from tests and linters, permissions and stopping rules.

    The loop: gather context (task, repo conventions, relevant files via search), plan, act with tools to read, edit and run commands, observe results such as test failures, and iterate until checks pass or the budget runs out, then summarize changes for review. Strong models with poor harnesses flail; good harnesses make the same model far more dependable.
  level: Senior
