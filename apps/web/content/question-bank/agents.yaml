- id: design-the-human-handoff-path-for-a-customer-service-agent-w
  q: >-
    Design the human-handoff path for a customer-service agent. When should it escalate, and what
    does a good handoff look like?
  a: >
    Escalate when the customer asks for a human, when the request is outside policy or the agent's
    tools, when confidence is low or the agent is going in circles, when the customer is upset, and
    for sensitive matters such as safety, legal or large financial issues. Some triggers are rules
    in code; others come from classifiers.


    A good handoff routes to the right queue, passes a concise summary with the customer's goal,
    steps already taken, relevant account data and why it escalated, so the customer never repeats
    themselves, sets expectations about wait time, and logs the case to improve the agent.
  topic: agents
  level: Mid
  companies:
    - Sierra
  related: /ai-system-design/genai-system-design/conversational-assistant-design
  source: outcome-school
- id: design-an-agent-that-takes-a-draft-nda-and-returns-a-redline
  q: >-
    Design an agent that takes a draft NDA and returns a redlined Word document reflecting the
    firm's playbook, not a chat response.
  a: >
    Parse the Word document into clauses while preserving structure and formatting. Classify each
    clause against the firm's playbook (preferred positions, fallbacks, unacceptable terms),
    retrieve the relevant playbook rules and precedent language, and have the model propose specific
    edits with reasons.


    Apply edits as real tracked changes and comments through a document library, not as regenerated
    text, so lawyers see exact insertions and deletions. Validate that only intended text changed,
    flag clauses that need attorney judgment, and evaluate against redlines lawyers made on past
    NDAs, measuring missed issues and unnecessary changes.
  topic: agents
  level: Senior
  companies:
    - Harvey
  related: /ai-system-design/genai-system-design/agent-architectures
  source: outcome-school
- id: design-an-agent-that-takes-actions-in-enterprise-tools-file
  q: >-
    Design an agent that takes actions in enterprise tools (file a Jira ticket, draft an email) on a
    user's behalf. How do you handle permissions and evaluate it?
  a: >
    Execute every action with the user's own delegated credentials through OAuth, so the agent can
    never do more than the user could. Scope tools narrowly, show a preview and require confirmation
    for writes such as filing tickets or sending email, and log everything.


    Evaluate with a suite of realistic requests in sandbox instances of each tool, checking the
    resulting tickets or drafts against expectations, plus permission tests with users who lack
    access. Track production completion, edit and undo rates as quality signals.
  topic: agents
  level: Senior
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/tool-use-and-mcp
  source: outcome-school
- id: design-agent-orchestration-across-dozens-of-connected-saas-s
  q: >-
    Design agent orchestration across dozens of connected SaaS systems. Where is authorization
    enforced, and why can it not live in the model?
  a: >
    Use a tool layer, often MCP servers or connectors per system, behind an orchestration service
    that selects relevant tools per request, manages state and calls them on the user's behalf.
    Authorization is enforced in that layer and in each target system: every call uses the user's
    delegated token and is checked against policies before execution.


    It cannot live in the model because the model can be wrong, manipulated by prompt injection, or
    confused about who the user is; it has no reliable notion of identity. Permissions must be
    deterministic and auditable, so the model only proposes actions, and code decides whether they
    are allowed.
  topic: agents
  level: Senior
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/tool-use-and-mcp
