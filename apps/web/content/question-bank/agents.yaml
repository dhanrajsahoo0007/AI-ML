- id: how-do-you-make-an-agent-s-actions-reversible-or-at-least-au
  q: How do you make an agent's actions reversible, or at least auditable, in a production system?
  a: >
    Prefer reversible designs: drafts instead of sends, soft deletes, staging environments, feature
    branches and pull requests instead of direct commits, and transactions that can be rolled back.
    For each action, record the inverse operation where one exists.


    Make everything auditable: log every tool call with the user, agent version, inputs, outputs,
    approvals and timestamps in append-only storage, linked to the full trace. Use idempotency keys
    so retries are safe, require approval for irreversible actions, and give operators tools to
    review and undo an agent's recent actions.
  topic: agents
  level: Senior
  companies:
    - Palantir
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: design-human-in-the-loop-approval-for-an-agent-that-takes-co
  q: Design human-in-the-loop approval for an agent that takes consequential actions.
  a: >
    Classify actions by risk in code: read-only and reversible actions run automatically;
    consequential ones such as payments, deletions, external messages, production changes or amounts
    above a threshold require approval. The agent proposes the action with a clear summary, the
    exact parameters, its reasoning and the expected effect, and pauses.


    The approver sees a concise review screen, can approve, edit or reject, and the decision is
    logged. Handle timeouts, approvals from the right role, and expiry if the world changed. Track
    approval rates and edits to find actions that can safely be automated later, and never let the
    model itself decide that approval is unnecessary.
