- id: design-a-customer-facing-agent-for-an-airline-that-can-cance
  q: >-
    Design a customer-facing agent for an airline that can cancel and rebook flights. How do you
    keep it from violating fare policy?
  a: >
    Put fare policy in code, not in the prompt. The agent can only act through tools such as
    get_booking, get_eligible_options and rebook_flight that call the airline's systems, and those
    tools compute eligibility, fees and refund amounts from the fare rules; the model never
    calculates or approves money on its own.


    The agent explains options, collects the customer's choice and confirms before executing. Add
    authentication, limits, human handoff for exceptions, logging, and an evaluation suite of policy
    scenarios, including customers pushing for exceptions, measured on final booking state and
    policy compliance across repeated runs.
