- id: design-an-agent-that-takes-actions-in-enterprise-tools-file
  q: Design an agent that takes actions in enterprise tools (file a Jira ticket, draft an email) on a user's behalf. How do you handle permissions and evaluate it?
  a: |
    Execute every action with the user's own delegated credentials through OAuth, so the agent can never do more than the user could. Scope tools narrowly, show a preview and require confirmation for writes such as filing tickets or sending email, and log everything.

    Evaluate with a suite of realistic requests in sandbox instances of each tool, checking the resulting tickets or drafts against expectations, plus permission tests with users who lack access. Track production completion, edit and undo rates as quality signals.
  level: Senior
  category: agents
  subcategory: harness-engineering
  companies:
  - Glean
  related: /ai-system-design/genai-system-design/tool-use-and-mcp
  source: outcome-school
- id: describe-the-basic-agent-loop
  q: Describe the basic agent loop.
  a: |
    The model receives the goal and context, reasons about the next step, either calls a tool or produces a final answer, and if it called a tool, the result is added to the context and the loop repeats. The harness enforces stopping rules such as a step limit, a budget or a success condition.
  level: Junior
  category: agents
  subcategory: harness-engineering
- id: how-would-you-give-an-agent-access-to-a-company-database-saf
  q: How would you give an agent access to a company database safely?
  a: |
    Expose a narrow tool rather than raw SQL where possible, such as parameterized queries or views for specific questions. If text-to-SQL is needed, use a read-only role limited to approved tables, validate and limit generated queries, mask sensitive columns, and log every query. Writes should go through specific, permission-checked API actions.
  level: Senior
  category: agents
  subcategory: harness-engineering
- id: design-memory-for-a-long-running-agent-what-do-you-store-whe
  q: 'Design memory for a long-running agent: what do you store, where, and how do you retrieve it?'
  a: |
    Keep three layers. Working memory in the context: the goal, the current plan, recent steps and key observations, with older steps summarized. Task state outside the context: a structured scratchpad or files with progress, decisions and artifacts, referenced by id instead of pasted in. Long-term memory in a database or vector store: facts, preferences and lessons from past runs, each with timestamps and source.

    Retrieve long-term memories by relevance, recency and importance at the start of each task or step, and keep write rules explicit: store confirmed facts and outcomes, not guesses; replace conflicting old facts; and let users inspect and delete memory.
  level: Senior
  category: agents
  subcategory: memory-context
  companies:
  - Anthropic
