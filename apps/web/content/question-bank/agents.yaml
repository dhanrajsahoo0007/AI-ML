- id: design-an-agent-that-automates-an-enterprise-workflow-say-dr
  q: Design an agent that automates an enterprise workflow, say, drafting RFP responses from internal documents and a CRM. What does “enter-prise-grade” add?
  a: |
    Break the workflow down: parse the RFP into questions, retrieve answers from approved content libraries, past responses and product docs with permission-aware RAG, pull customer context from the CRM, draft each answer with citations, flag gaps and low-confidence items for subject-matter experts, and assemble the response in the required format for review.

    Enterprise-grade adds: per-user permissions and data residency, audit trails, approval workflows before anything is sent, consistent tone and compliance rules, evaluation on past RFPs with expert ratings, reliability on long documents, monitoring and cost controls, and integration with existing tools rather than a separate chat window.
  level: Senior
  category: agents
  subcategory: agent-architectures
