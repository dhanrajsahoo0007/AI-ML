- id: you-re-dropped-into-an-unfamiliar-multi-file-codebase-with-a
  q: >-
    You're dropped into an unfamiliar multi-file codebase with a failing behaviour and an LLM
    assistant available. Walk me through how you'd fix it.
  a: >
    Reproduce the failing behavior first with a test or command. Use the assistant to orient: ask it
    to summarize the architecture and find where the behavior is implemented, but verify by reading
    the code and running it. Narrow down with logging, a debugger or by bisecting recent changes.


    Form a hypothesis, make the smallest fix, and let the assistant help write it and a regression
    test, reviewing every line. Run the full test suite, check for side effects, and explain the
    root cause. The skill being tested is directing and verifying the assistant, not accepting its
    output blindly.
