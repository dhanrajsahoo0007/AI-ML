  source: outcome-school
- id: what-is-an-ontology-in-the-palantir-sense-and-why-put-llm-ag
  q: What is an ontology in the Palantir sense, and why put LLM agents on top of one instead of on raw tables and documents?
  a: |
    In Palantir's sense, an ontology is an operational semantic layer that maps an organization's data into business objects (orders, suppliers, assets), their properties and links, plus governed actions that change them, all with permissions attached.

    Agents on top of an ontology work with meaningful objects and approved actions instead of guessing at raw table schemas and document text. That makes queries more accurate, actions safer because they go through validated, permissioned operations, and results explainable in business terms.
