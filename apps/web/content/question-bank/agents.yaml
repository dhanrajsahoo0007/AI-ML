- id: your-agent-spends-over-half-its-first-turn-just-finding-the
  q: Your agent spends over half its first turn just finding the relevant code. How do you fix that?
  a: |
    Give it better context up front: a fast code-search tool and a precomputed index with embeddings, symbol graphs and file summaries, plus a repository map of key modules and conventions. Retrieve likely relevant files from the task text before the first model call and include them, so the agent starts close to the answer.

    Also parallelize exploration, for example several searches or a fast helper that returns file candidates, cache repo knowledge across sessions, and measure time-to-relevant-file as a metric. Fine-tuning a small retrieval or ranking model on past tasks and the files they touched can help further.
  level: Senior
