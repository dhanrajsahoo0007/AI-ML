- id: how-does-an-agent-decide-when-to-call-a-tool-versus-answer-f
  q: How does an agent decide when to call a tool versus answer from its own knowledge?
  a: |
    The model decides based on its instructions, the tool descriptions and its training: if the question needs fresh, private, exact or computed information, a well-described tool should be chosen; if it is general knowledge, it answers directly.

    You shape that decision: describe in the system prompt and tool descriptions when tools are required, such as always checking order status with the tool and never guessing, force a tool call for certain intents, and evaluate tool-use precision and recall on labeled examples. Over-calling wastes latency and cost; under-calling produces hallucinated answers.
  level: Mid
