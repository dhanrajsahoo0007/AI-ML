- id: what-makes-an-agent-loop-terminate-correctly-how-do-you-boun
  q: What makes an agent loop terminate correctly? How do you bound cost and steps?
  a: >
    Give the agent explicit success criteria and a way to finish, such as a final-answer tool, plus
    checks in code that confirm completion when possible, like tests passing. Detect lack of
    progress: repeated identical calls, cycling between states, or no new information after several
    steps.


    Bound everything in the harness, not the prompt: maximum steps, tokens, wall-clock time and
    dollars per task, and per-tool call limits. When a limit is hit, stop cleanly with a partial
    result and an explanation, or escalate to a human, and log these cases for evaluation.
