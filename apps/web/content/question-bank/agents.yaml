- id: design-a-service-that-turns-the-conversation-into-draft-orde
  q: >-
    Design a service that turns the conversation into draft orders: labs, imaging, referrals,
    prescriptions, via tool calls against the EHR.
  a: >
    From the visit transcript, extract candidate orders (labs, imaging, referrals, prescriptions)
    with structured fields, map them to standard codes and the hospital's order catalog through EHR
    APIs such as FHIR, and check the patient's chart for allergies, interactions and duplicates with
    deterministic rules.


    Create orders only as drafts or pending orders that the clinician reviews, edits and signs;
    nothing is placed automatically. Show the transcript evidence for each suggestion, log
    everything, and evaluate precision and recall of extracted orders against clinician-signed
    orders, with special attention to dangerous errors such as wrong dose or wrong patient.
  topic: agents
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/kg-healthcare-case-study
