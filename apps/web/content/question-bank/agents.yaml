- id: design-an-llm-agent-that-files-and-updates-work-orders-in-a
  q: 'Design an LLM agent that files and updates work orders in a customer''s ERP: real writes to a production system. How do you make that safe?'
  a: |
    Expose only specific, validated actions such as create_work_order and update_status through the ERP's API, with schemas, business-rule validation in code and the acting user's permissions. Use idempotency keys and transactions, start with drafts that a person approves, and allow auto-execution only for low-risk updates once trust is established.

    Make it safe to operate: run against a test instance first, rate-limit writes, log every change with before and after values so it can be reverted, monitor for anomalies, and evaluate on historical requests with known correct outcomes before production rollout.
