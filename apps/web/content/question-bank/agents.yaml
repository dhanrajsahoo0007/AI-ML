- id: your-agent-drifts-after-a-long-run-and-confidently-works-on
  q: Your agent drifts after a long run and confidently works on the wrong thing. Diagnose it.
  a: |
    Read the trace to find where the goal was lost. Typical causes: the original task scrolled out of or got buried in a long context, a summarization step dropped key constraints, a misleading tool result or injected content redirected it, an early wrong assumption was never re-checked, or the plan was never updated after new information.

    Fixes: pin the goal and constraints at the top of every step's context, keep an explicit plan and progress file that is re-read and updated, summarize carefully and test summaries, add periodic self-checks against the original task, verify with external signals such as tests, and split long work into sub-tasks with fresh contexts.
  level: Senior
  category: agents
  subcategory: memory-context
  companies:
  - Cognition
  related: /ai-system-design/genai-system-design/agent-memory
  source: outcome-school
- id: how-do-you-prevent-the-context-from-growing-without-bound-in
  q: How do you prevent the context from growing without bound in long agent runs?
  a: |
    Summarize or compress older steps, keep only essential tool outputs, store large artifacts outside the context and pass references, and retrieve details when needed. Sub-agents can handle subtasks in their own context and return short results. Track tokens per step to catch growth early.
  level: Senior
  category: agents
  subcategory: memory-context
- id: what-is-the-difference-between-agent-memory-and-rag
  q: What is the difference between agent memory and RAG?
  a: |
    RAG retrieves from a curated, mostly static knowledge base to answer questions. Agent memory is written by the agent itself from its interactions, such as user preferences or results of past tasks, and must handle updates, conflicts and forgetting. Both use retrieval, but memory adds a write path and correctness concerns.
  level: Mid
  category: agents
  subcategory: memory-context
- id: how-does-multi-agent-orchestration-work-and-when-does-it-bre
  q: How does multi-agent orchestration work, and when does it break down?
  a: |
    Usually a lead agent decomposes the task and delegates sub-tasks to worker agents with focused prompts, tools and contexts, then combines their structured results; other patterns are sequential pipelines, parallel fan-out, hand-offs between specialists, and critic or debate loops.

    It breaks down when agents make conflicting decisions without shared context, when hand-offs lose important details, when roles overlap and work is duplicated, when errors propagate through a pipeline, when agents loop talking to each other, and when nobody verifies the final result. It also multiplies token cost, so it should beat a single-agent baseline on evaluation before being adopted.
  level: Senior
  category: agents
  subcategory: multi-agent
  companies:
  - Cognition
