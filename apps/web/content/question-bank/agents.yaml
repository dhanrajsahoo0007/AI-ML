- id: your-on-device-model-must-emit-valid-schema-conforming-tool
  q: >-
    Your on-device model must emit valid, schema-conforming tool calls. How do you guarantee
    validity rather than hope for it?
  a: >
    Use constrained decoding: compile the JSON schema into a grammar or state machine, and at each
    step mask out tokens that would make the output invalid, so the model can only produce
    schema-conforming calls. That guarantees validity by construction rather than hoping the model
    complies.


    Pair it with fine-tuning on tool-call examples so the model's preferred tokens rarely hit the
    mask, which keeps quality high, and keep schemas simple, since complex grammars slow decoding.
    Semantic correctness, such as a valid but wrong date, still needs validation in code.
