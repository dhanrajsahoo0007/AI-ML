- id: how-does-multi-agent-orchestration-work-and-when-does-it-bre
  q: How does multi-agent orchestration work, and when does it break down?
  a: >
    Usually a lead agent decomposes the task and delegates sub-tasks to worker agents with focused
    prompts, tools and contexts, then combines their structured results; other patterns are
    sequential pipelines, parallel fan-out, hand-offs between specialists, and critic or debate
    loops.


    It breaks down when agents make conflicting decisions without shared context, when hand-offs
    lose important details, when roles overlap and work is duplicated, when errors propagate through
    a pipeline, when agents loop talking to each other, and when nobody verifies the final result.
    It also multiplies token cost, so it should beat a single-agent baseline on evaluation before
    being adopted.
