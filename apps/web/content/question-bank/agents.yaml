- id: what-is-mcp-model-context-protocol-and-how-does-it-differ-fr
  q: What is MCP (Model Context Protocol) and how does it differ from traditional function calling?
  a: >
    MCP is an open protocol for connecting AI applications to tools and data. MCP servers expose
    tools, resources and prompts through a standard interface; clients inside host applications
    discover them at runtime and relay calls.


    Traditional function calling is the model-level mechanism: the application hard-codes tool
    schemas into each request and executes calls itself. MCP sits above it as an integration
    standard, so a tool written once as an MCP server can be used by any compatible application
    without custom glue. The model still uses function calling; MCP standardizes where tools come
    from and how they are invoked.
