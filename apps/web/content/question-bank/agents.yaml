- id: cognition-published-an-argument-against-multi-agent-systems
  q: >-
    Cognition published an argument against multi-agent systems and later published what actually
    works. Reconcile those two positions.
  a: >
    The argument against multi-agent systems was about context: when several agents act in parallel
    without sharing full context, they make conflicting implicit decisions and the combined result
    is incoherent, so a single agent with continuous context is more reliable.


    Approaches that work keep that principle: one agent owns decisions and holds the full context,
    while helpers do narrow, well-scoped jobs, such as searching or summarizing, that return
    information rather than making independent changes, or run in sequence with full context passed
    along. The two positions agree that the danger is fragmented context and conflicting decisions,
    not multiple model calls as such.
