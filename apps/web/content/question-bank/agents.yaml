- id: design-an-agentic-ai-system-that-can-autonomously-adapt-to-n
  q: Design an agentic AI system that can autonomously adapt to new tasks.
  a: >
    Combine a general agent loop with ways to acquire new capability: tool and skill discovery
    (searching a catalog of tools or documentation), procedural memory that stores successful
    approaches and instructions for reuse, retrieval of similar past tasks, and the ability to write
    and test small helper scripts.


    Adaptation must be measured and bounded: evaluate new skills on test tasks before trusting them,
    keep a human approval step for new tools or permissions, version learned procedures so bad ones
    can be rolled back, and track success rates on new task types over time.
