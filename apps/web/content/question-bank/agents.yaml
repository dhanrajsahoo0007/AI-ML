- id: how-does-function-calling-actually-work-with-an-llm-and-how
  q: >-
    How does function calling actually work with an LLM, and how do you make it reliable enough for
    production agents?
  a: >
    You send tool names, descriptions and JSON schemas with the request. The model was trained to
    emit a structured tool call when appropriate; many APIs constrain decoding so arguments match
    the schema. Your code parses the call, executes it and sends the result back as a tool message,
    and the model continues or answers.


    For production reliability: keep tools few and well described, validate arguments and return
    actionable errors, retry transient failures in code, make writes idempotent, bound steps and
    cost, require approval for consequential actions, log full traces, and measure tool-selection
    and argument accuracy plus end-to-end task success on an evaluation set before shipping.
  topic: agents
  level: Mid
