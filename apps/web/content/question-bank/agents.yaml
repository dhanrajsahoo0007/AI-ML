# Company-reported questions adapted from Outcome School (Apache 2.0); see NOTICE.md. Answers are our own.
- id: explain-the-react-pattern-and-what-it-solves-over-chain-of-t
  q: Explain the ReAct pattern and what it solves over chain-of-thought alone.
  a: >
    ReAct interleaves reasoning steps with actions: the model thinks about what it needs, calls a
    tool such as search or a calculator, reads the observation, and continues until it can answer.


    Chain-of-thought alone reasons entirely from the model's internal knowledge, so errors and
    missing or outdated facts compound with no way to check them. ReAct grounds each step in real
    observations, reduces hallucination on knowledge-heavy tasks, lets the model gather information
    it does not have, and leaves an inspectable trace of what it did.
