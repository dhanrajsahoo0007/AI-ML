- id: design-the-human-handoff-path-for-a-customer-service-agent-w
  q: Design the human-handoff path for a customer-service agent. When should it escalate, and what does a good handoff look like?
  a: |
    Escalate when the customer asks for a human, when the request is outside policy or the agent's tools, when confidence is low or the agent is going in circles, when the customer is upset, and for sensitive matters such as safety, legal or large financial issues. Some triggers are rules in code; others come from classifiers.

    A good handoff routes to the right queue, passes a concise summary with the customer's goal, steps already taken, relevant account data and why it escalated, so the customer never repeats themselves, sets expectations about wait time, and logs the case to improve the agent.
  level: Mid
  category: agents
  subcategory: agent-reliability
  companies:
  - Sierra
  related: /ai-system-design/genai-system-design/conversational-assistant-design
  source: outcome-school
- id: how-do-you-make-agents-reliable
  q: How do you make agents reliable?
  a: |
    Give them focused context and good tools, validate every tool call, verify results with tests or checks and feed errors back, set step and cost budgets, add human approval for risky actions, and keep detailed traces. Then measure success on an evaluation suite and iterate on the failures.
  level: Mid
  category: agents
  subcategory: agent-reliability
- id: what-are-the-main-failure-modes-of-agents
  q: What are the main failure modes of agents?
  a: |
    Looping or repeating actions, choosing the wrong tool or arguments, losing track of the goal in long contexts, stopping too early or never stopping, hallucinating tool results, being hijacked by injected instructions in tool outputs, and taking harmful actions. Each maps to a harness control: budgets, validation, summaries, stop criteria, sandboxing and permissions.
  level: Mid
  category: agents
  subcategory: agent-reliability
- id: how-do-you-control-the-cost-of-agents
  q: How do you control the cost of agents?
  a: |
    Set per-task budgets for steps, tokens and time, use smaller models for routine steps and larger ones for planning or hard reasoning, keep contexts compact, cache tool results, avoid unnecessary multi-agent overhead, and stop early when success criteria are met. Track cost per successful task, since failed runs also cost money.
  level: Senior
  category: agents
  subcategory: agent-reliability
- id: how-do-you-decide-how-much-autonomy-to-give-an-agent
  q: How do you decide how much autonomy to give an agent?
  a: |
    Match autonomy to the cost of mistakes and how verifiable the outcome is. Start with read-only tools and human approval, measure success and error types, then automate the action classes that prove reliable. Irreversible, external or expensive actions should keep a checkpoint.
  level: Mid
  category: agents
  subcategory: agent-reliability
