- id: llms-are-non-deterministic-but-a-refund-over-200-must-never
  q: >-
    LLMs are non-deterministic, but a refund over $200 must never be auto-approved. Where's the line
    between prompting and code?
  a: >
    Anything that must always hold is enforced in code. The refund tool itself checks the amount
    and, above 200 dollars, cannot complete without a human approval token, whatever the model says.
    The prompt explains the policy so the model behaves helpfully, but the guarantee comes from the
    tool.


    The line: prompts guide judgment, tone and conversation flow; code enforces invariants,
    permissions, limits and calculations. Test the invariant directly, including adversarial
    conversations that try to talk the agent into approving.
