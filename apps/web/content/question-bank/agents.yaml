- id: what-is-an-ontology-in-the-palantir-sense-and-why-put-llm-ag
  q: >-
    What is an ontology in the Palantir sense, and why put LLM agents on top of one instead of on
    raw tables and documents?
  a: >
    In Palantir's sense, an ontology is an operational semantic layer that maps an organization's
    data into business objects (orders, suppliers, assets), their properties and links, plus
    governed actions that change them, all with permissions attached.


    Agents on top of an ontology work with meaningful objects and approved actions instead of
    guessing at raw table schemas and document text. That makes queries more accurate, actions safer
    because they go through validated, permissioned operations, and results explainable in business
    terms.
  topic: agents
  level: Senior
  companies:
    - Palantir
  related: /ai-system-design/genai-system-design/knowledge-graph-systems
  source: outcome-school
- id: design-an-llm-agent-that-files-and-updates-work-orders-in-a
  q: >-
    Design an LLM agent that files and updates work orders in a customer's ERP: real writes to a
    production system. How do you make that safe?
  a: >
    Expose only specific, validated actions such as create_work_order and update_status through the
    ERP's API, with schemas, business-rule validation in code and the acting user's permissions. Use
    idempotency keys and transactions, start with drafts that a person approves, and allow
    auto-execution only for low-risk updates once trust is established.


    Make it safe to operate: run against a test instance first, rate-limit writes, log every change
    with before and after values so it can be reverted, monitor for anomalies, and evaluate on
    historical requests with known correct outcomes before production rollout.
  topic: agents
  level: Senior
  companies:
    - Palantir
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
