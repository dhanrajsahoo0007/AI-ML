- id: your-agent-drifts-after-a-long-run-and-confidently-works-on
  q: Your agent drifts after a long run and confidently works on the wrong thing. Diagnose it.
  a: >
    Read the trace to find where the goal was lost. Typical causes: the original task scrolled out
    of or got buried in a long context, a summarization step dropped key constraints, a misleading
    tool result or injected content redirected it, an early wrong assumption was never re-checked,
    or the plan was never updated after new information.


    Fixes: pin the goal and constraints at the top of every step's context, keep an explicit plan
    and progress file that is re-read and updated, summarize carefully and test summaries, add
    periodic self-checks against the original task, verify with external signals such as tests, and
    split long work into sub-tasks with fresh contexts.
  topic: agents
  level: Senior
  companies:
    - Cognition
  related: /ai-system-design/genai-system-design/agent-memory
  source: outcome-school
- id: what-matters-more-for-an-agentic-coding-tool-like-claude-cod
  q: >-
    What matters more for an agentic coding tool like Claude Code: the model or the harness? Design
    the loop.
  a: >
    Both matter, but given a capable model, the harness often decides whether the product is
    reliable. The model supplies reasoning and code; the harness supplies the right context,
    well-designed tools, an execution environment, feedback from tests and linters, permissions and
    stopping rules.


    The loop: gather context (task, repo conventions, relevant files via search), plan, act with
    tools to read, edit and run commands, observe results such as test failures, and iterate until
    checks pass or the budget runs out, then summarize changes for review. Strong models with poor
    harnesses flail; good harnesses make the same model far more dependable.
