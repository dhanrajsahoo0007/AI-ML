- id: design-memory-for-a-long-running-agent-what-do-you-store-whe
  q: "Design memory for a long-running agent: what do you store, where, and how do you retrieve it?"
  a: >
    Keep three layers. Working memory in the context: the goal, the current plan, recent steps and
    key observations, with older steps summarized. Task state outside the context: a structured
    scratchpad or files with progress, decisions and artifacts, referenced by id instead of pasted
    in. Long-term memory in a database or vector store: facts, preferences and lessons from past
    runs, each with timestamps and source.


    Retrieve long-term memories by relevance, recency and importance at the start of each task or
    step, and keep write rules explicit: store confirmed facts and outcomes, not guesses; replace
    conflicting old facts; and let users inspect and delete memory.
