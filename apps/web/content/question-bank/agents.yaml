  source: outcome-school
- id: design-an-agent-that-takes-a-draft-nda-and-returns-a-redline
  q: Design an agent that takes a draft NDA and returns a redlined Word document reflecting the firm's playbook, not a chat response.
  a: |
    Parse the Word document into clauses while preserving structure and formatting. Classify each clause against the firm's playbook (preferred positions, fallbacks, unacceptable terms), retrieve the relevant playbook rules and precedent language, and have the model propose specific edits with reasons.

    Apply edits as real tracked changes and comments through a document library, not as regenerated text, so lawyers see exact insertions and deletions. Validate that only intended text changed, flag clauses that need attorney judgment, and evaluate against redlines lawyers made on past NDAs, measuring missed issues and unnecessary changes.
  level: Senior
  category: agents
  subcategory: agent-architectures
  companies:
  - Harvey
