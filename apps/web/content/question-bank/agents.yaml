- id: design-an-agent-that-automates-an-enterprise-workflow-say-dr
  q: >-
    Design an agent that automates an enterprise workflow, say, drafting RFP responses from internal
    documents and a CRM. What does “enter-prise-grade” add?
  a: >
    Break the workflow down: parse the RFP into questions, retrieve answers from approved content
    libraries, past responses and product docs with permission-aware RAG, pull customer context from
    the CRM, draft each answer with citations, flag gaps and low-confidence items for subject-matter
    experts, and assemble the response in the required format for review.


    Enterprise-grade adds: per-user permissions and data residency, audit trails, approval workflows
    before anything is sent, consistent tone and compliance rules, evaluation on past RFPs with
    expert ratings, reliability on long documents, monitoring and cost controls, and integration
    with existing tools rather than a separate chat window.
  topic: agents
  level: Senior
  companies:
    - Cohere
  related: /ai-system-design/genai-system-design/conversational-assistant-design
  source: outcome-school
- id: autoglm-and-cogagent-operate-real-guis-from-screenshots-over
  q: >-
    AutoGLM and CogAgent operate real GUIs from screenshots over tens of steps. Design the agent:
    perception, action space, and error recovery for a 50-step task.
  a: >
    Perception: a vision-language model reads screenshots, ideally at high resolution, plus the
    accessibility tree or DOM when available, and grounds elements to coordinates or element ids.
    Action space: a small set such as click, type, scroll, select, go back and wait, with targets
    referenced by element ids where possible rather than raw pixels.


    For a 50-step task, keep an explicit plan and progress state, verify each action's effect from
    the next screenshot, detect being stuck or on an unexpected screen, and recover by backtracking,
    retrying or re-planning. Checkpoint progress, require confirmation before irreversible steps,
    and train or evaluate on many recorded trajectories with success measured on the final state.
