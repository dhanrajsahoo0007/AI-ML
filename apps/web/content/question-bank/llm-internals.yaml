- id: why-is-tokenization-the-first-bottleneck-for-indian-language
  q: >-
    Why is tokenization the first bottleneck for Indian-language LLMs, and how does a low-fertility
    tokenizer change the economics?
  a: >
    Tokenizers trained mostly on English split Indian-language text into many tiny pieces, a high
    fertility of tokens per word. The same sentence then costs several times more tokens, which
    multiplies inference cost and latency, uses up the context window faster, and gives the model
    weaker units to learn from.


    A low-fertility tokenizer trained with good coverage of Indic scripts brings tokens per word
    close to English, which directly cuts serving cost, fits more content in context, and improves
    training efficiency. That is why it is the first thing to fix before scaling a model for these
    languages.
