- id: explain-rope-and-how-position-interpolation-yarn-extend-cont
  q: Explain RoPE and how position interpolation / YaRN extend context beyond the trained length.
  a: >
    RoPE splits query and key vectors into pairs of dimensions and rotates each pair by an angle
    equal to the position times a pair-specific frequency. The dot product of a rotated query and
    key then depends only on their position difference, so attention sees relative distance.


    Beyond the trained length the model meets rotation angles it never saw. Position interpolation
    rescales positions so a longer sequence maps into the trained range. NTK-aware scaling and YaRN
    rescale frequencies unevenly, stretching low frequencies more than high ones so fine local
    detail survives, and YaRN also adjusts attention temperature. A short fine-tune on long
    documents then adapts the model, followed by long-context retrieval tests at many depths.
  topic: llm-internals
