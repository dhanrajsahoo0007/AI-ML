- id: what-is-the-kv-cache-and-what-are-its-memory-implications-at
  q: What is the KV cache, and what are its memory implications at scale? Derive the formula.
  a: >
    During generation each new token attends to all previous tokens, which needs their keys and
    values in every layer. The KV cache stores them once so each decode step only computes the
    newest token's projections, turning repeated quadratic work into a cheap append.


    Memory per sequence is 2 (keys and values) × layers × KV heads × head dimension × sequence
    length × bytes per value. For 32 layers, 32 heads of size 128 and 16-bit values that is about
    0.5 MB per token, or roughly 4.3 GB for one 8K-token sequence. Multiply by batch size and it
    often exceeds the model weights, which is why GQA, MLA, paging and cache quantization exist.
  topic: llm-internals
