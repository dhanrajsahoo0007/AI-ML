- id: what-problem-do-chat-templates-solve-and-what-goes-wrong-whe
  q: What problem do chat templates solve, and what goes wrong when they're ignored?
  a: >
    Chat models are trained on conversations serialized in a specific format, with special tokens
    marking system, user and assistant turns and the end of each message. The chat template
    reproduces exactly that format when you send a list of messages.


    Ignoring it, for example by concatenating plain text or using another model's format, puts the
    input out of distribution: the model may ignore the system prompt, continue the user's message,
    never emit the end-of-turn token, or degrade noticeably. Fine-tuning with the wrong template
    bakes in these problems.
  topic: llm-internals
  level: Mid
  companies:
    - Hugging Face
  related: /ai-system-design/genai-system-design/tokenization
  source: outcome-school
- id: a-community-contributor-opens-a-pr-adding-a-new-model-archit
  q: >-
    A community contributor opens a PR adding a new model architecture to `transformers`. You're the
    reviewing maintainer: what do you check, and how do you handle the interaction?
  a: >
    Technically, check that outputs match the reference implementation numerically on the same
    weights and inputs, that the code follows the library's conventions and reuses existing
    components, that tests cover forward passes, generation, saving and loading, and different
    dtypes and devices, and that the configuration, tokenizer and documentation are complete with
    weights hosted correctly.


    On the human side, thank them, review promptly, explain the reasons behind requested changes,
    point to examples, help with failing tests, and keep the tone welcoming so they stay involved as
    a contributor.
  topic: llm-internals
  level: Mid
  companies:
    - Hugging Face
  related: /ai-system-design/genai-system-design/transformer-architecture
