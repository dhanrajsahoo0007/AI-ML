- id: compare-greedy-beam-search-top-k-top-p-and-temperature-sampl
  q: Compare greedy, beam search, top-k, top-p and temperature sampling. When does each fail?
  a: >
    Greedy decoding always takes the most likely token; it is fast and deterministic but can be
    repetitive and miss better overall sequences. Beam search keeps several candidate sequences and
    suits tasks with one right answer such as translation, but in open-ended generation it produces
    bland, repetitive text.


    Sampling methods add diversity. Temperature rescales logits: low values become near-greedy, high
    values become random and incoherent. Top-k samples from the k most likely tokens, which fails
    when the distribution is very flat or very peaked because k is fixed. Top-p samples from the
    smallest set whose probability exceeds p, adapting to the distribution, but very high p still
    admits unlikely tokens. Factual tasks favor low temperature; creative tasks favor moderate
    temperature with top-p.
  topic: llm-internals
