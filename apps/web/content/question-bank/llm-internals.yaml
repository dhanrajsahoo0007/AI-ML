- id: a-conversation-runs-past-the-context-window-what-do-you-keep
  q: A conversation runs past the context window. What do you keep, and how do you decide?
  a: >
    Always keep the system prompt and the most recent turns verbatim, because they carry the
    instructions and immediate context. Older turns are summarized into a running summary, and
    important facts such as names, preferences or decisions are extracted into a memory store and
    retrieved when relevant.


    Decide by measured importance rather than recency alone: keep content the user refers back to,
    drop filler, and test summarization quality on long conversations. If a character or persona
    definition exists, keep it fixed so the voice stays consistent.
