- id: explain-flashattention-it-does-not-reduce-flops-so-why-is-it
  q: Explain FlashAttention. It does not reduce FLOPs, so why is it faster?
  a: >
    Attention on modern GPUs is limited by memory traffic, not arithmetic. The standard
    implementation writes the full n×n score matrix to slow high-bandwidth memory, reads it back for
    the softmax, writes the probabilities and reads them again to multiply by V.


    FlashAttention tiles Q, K and V into blocks that fit in fast on-chip SRAM, computes the softmax
    incrementally with running maximum and sum statistics, and accumulates the output without ever
    storing the full matrix. The math and FLOPs are the same and the result is exact, but far fewer
    bytes move through slow memory, so it runs faster and uses memory linear in sequence length. In
    the backward pass it recomputes attention from saved statistics instead of storing the matrix.
  topic: llm-internals
  level: Mid
  companies:
    - Together AI
  related: /ai-system-design/genai-system-design/efficient-attention
  refs:
