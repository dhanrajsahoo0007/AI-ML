- id: qwen3-unifies-a-thinking-mode-and-a-non-thinking-mode-in-one
  q: >-
    Qwen3 unifies a thinking mode and a non-thinking mode in one model with a caller-settable
    thinking budget. How would you train that, and how would you serve it?
  a: >
    Training: first build strong long reasoning through supervised data and reinforcement learning
    on verifiable tasks, then fine-tune on a mix of examples with and without reasoning traces, each
    marked by a control flag in the prompt, so one model learns both behaviors. A thinking budget
    can be supported by training with truncated reasoning that still ends in a good answer.


    Serving: expose the mode and budget as request parameters, stop reasoning when the budget is
    reached and force the answer, route simple requests to non-thinking mode for latency, and bill
    and rate-limit by total tokens, since thinking requests have long and variable outputs.
