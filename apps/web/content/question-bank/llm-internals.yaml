- id: what-is-the-relationship-between-cross-entropy-kl-divergence
  q: >-
    What is the relationship between cross-entropy, KL divergence and perplexity, and why is
    cross-entropy the training loss for language models?
  a: >
    Cross-entropy between the true data distribution and the model equals the data's own entropy
    plus the KL divergence from data to model. Since the data entropy is fixed, minimizing
    cross-entropy is the same as minimizing KL divergence, which is the same as maximizing the
    likelihood of the training text.


    Perplexity is the exponential of the average cross-entropy per token, roughly how many equally
    likely choices the model is torn between. Cross-entropy is the training loss because it is the
    negative log-likelihood of next-token prediction: it is smooth, has simple gradients with a
    softmax, and directly rewards putting probability on what actually comes next.
  topic: llm-internals
  level: Mid
  companies:
    - OpenAI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  refs:
    - title: Math Behind Cross-Entropy Loss
      url: https://outcomeschool.com/blog/math-behind-cross-entropy-loss
  source: outcome-school
- id: what-is-the-effect-of-adjusting-an-llm-s-context-window-size
  q: What is the effect of adjusting an LLM's context window size?
  a: >
    A larger window lets the model use more history, documents or code in one request, but attention
    compute grows roughly with the square of the length, the KV cache grows linearly, and time to
    first token rises with longer prompts. Costs per request go up accordingly.


    Quality does not automatically improve: models often use the middle of long contexts poorly, and
    extending a model beyond its trained length needs position-encoding rescaling and fine-tuning.
    Shrinking the window cuts cost and latency but forces truncation, summarization or retrieval to
    fit what matters.
  topic: llm-internals
