- id: what-are-multi-query-attention-mqa-and-grouped-query-attenti
  q: >-
    What are Multi-Query Attention (MQA) and Grouped-Query Attention (GQA), and what do they trade
    away?
  a: >
    Multi-query attention shares a single key head and value head across all query heads;
    grouped-query attention shares one key and value head per group of query heads. Both shrink the
    KV cache by the ratio of query heads to KV heads, which speeds up memory-bound decoding and
    allows larger batches and longer contexts.


    What they trade away is some expressiveness: fewer distinct key and value projections. MQA loses
    more quality and can train less stably; GQA keeps quality close to full multi-head attention,
    which is why most large open models use it. Existing multi-head checkpoints can be converted by
    averaging heads and briefly uptraining.
  topic: llm-internals
  level: Mid
  companies:
    - Meta
    - Mistral AI
  related: /ai-system-design/genai-system-design/efficient-attention
