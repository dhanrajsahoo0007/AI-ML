- id: implement-top-k-moe-routing-with-a-shared-expert-in-pytorch
  q: >-
    Implement top-k MoE routing with a shared expert in PyTorch, and point out the efficiency and
    correctness traps.
  a: >
    Compute router logits with a linear layer over the token's hidden state, take a softmax (or
    sigmoid) over experts, pick the top-k with torch.topk and renormalize their weights. Group
    tokens by chosen expert, run each expert's feed-forward network on its tokens in a batch,
    scatter the weighted outputs back, and add the shared expert's output, which runs on every
    token.


    The traps: looping over tokens instead of batching by expert; ignoring capacity limits so one
    expert gets most tokens; forgetting to renormalize top-k weights; computing the softmax in low
    precision, which causes instability; losing gradients to the router; and silently dropping
    tokens on overflow. Add a balancing mechanism and check expert load statistics.
  topic: llm-internals
