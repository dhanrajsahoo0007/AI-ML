- id: what-is-positional-encoding-in-transformers-and-how-has-it-e
  q: >-
    What is positional encoding in transformers, and how has it evolved (sinusoidal → learned → RoPE
    → ALiBi)?
  a: >
    Self-attention is order-blind, so position must be injected. The original Transformer added
    fixed sinusoidal vectors of different frequencies to the embeddings. BERT and GPT-2 learned one
    embedding per position, which is simple but cannot handle positions beyond the table.


    Later work moved to relative positions. RoPE rotates queries and keys by a position-dependent
    angle so attention scores depend on relative distance, and it is the default in most modern
    LLMs. ALiBi adds no embeddings at all and instead penalizes attention scores in proportion to
    distance, which extrapolates well to longer inputs than seen in training.
  topic: llm-internals
  level: Junior
  companies: []
  related: /ai-system-design/genai-system-design/positional-encodings
