- id: explain-the-difference-between-pre-training-supervised-fine
  q: Explain the difference between pre-training, supervised fine-tuning and preference optimisation.
  a: >
    Pre-training teaches language and world knowledge through next-token prediction on trillions of
    tokens, producing a base model that continues text but does not reliably follow instructions.
    Supervised fine-tuning trains on curated prompt and response pairs so the model follows
    instructions and adopts a format.


    Preference optimization then aligns outputs with what people prefer, using comparisons between
    responses: RLHF trains a reward model and optimizes against it with reinforcement learning,
    while DPO optimizes directly on preference pairs. Each stage uses far less data than the one
    before but shapes behavior strongly.
