- id: glm-s-original-pre-training-objective-is-autoregressive-blan
  q: >-
    GLM's original pre-training objective is autoregressive blank infilling. How does it differ from
    BERT and GPT, and why did the team argue it unifies understanding and generation?
  a: >
    GLM masks random spans of the input and trains the model to regenerate each span
    autoregressively, while the unmasked context is visible bidirectionally. Two-dimensional
    position encodings tell the model where a span sits in the original text and the position within
    the span.


    BERT fills single masked tokens independently and cannot generate fluently; GPT generates left
    to right but sees only past context. By varying span lengths, from short blanks to whole
    document endings, one objective trains both understanding (bidirectional context) and generation
    (autoregressive spans), which is why the team argued it unifies the two.
  topic: llm-internals
