- id: glm-4-5-is-an-moe-with-355b-total-but-32b-active-parameters
  q: >-
    GLM-4.5 is an MoE with 355B total but 32B active parameters. Explain the economics: what does
    that split buy you and what does it cost?
  a: >
    The 355B total gives the model large capacity for knowledge and skills, while the 32B active
    parameters set compute per token, so it runs roughly at the cost of a 32B dense model in FLOPs
    and approaches the quality of much larger dense models.


    The cost is memory and systems complexity: all 355B parameters must be stored, needing multiple
    GPUs even for inference, plus expert parallelism, all-to-all communication and load balancing.
    It is attractive for high-throughput serving where memory is available, less so for small or
    on-device deployments.
