- id: what-breaks-when-you-scale-llm-training-from-8-gpus-to-thous
  q: >-
    What breaks when you scale LLM training from 8 GPUs to thousands, and how do modern stacks deal
    with it?
  a: >
    At 8 GPUs, data parallelism over one fast node works. At thousands, the model and optimizer no
    longer fit per GPU, communication across nodes becomes a bottleneck, hardware failures happen
    daily, and very large global batches change optimization behavior. Small numerical issues such
    as loss spikes become run-killers.


    Modern stacks combine sharded data parallelism (ZeRO or FSDP), tensor parallelism within a node,
    pipeline parallelism across nodes and, for MoE, expert parallelism, overlapping communication
    with compute. They add frequent asynchronous checkpointing and automatic restart, careful
    learning-rate and batch-size schedules, bf16 or FP8 with stability tricks, and monitoring to
    catch spikes and bad nodes early.
  topic: llm-internals
  level: Senior
  companies:
    - Meta
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: mistral-7b-shipped-with-grouped-query-attention-and-sliding
  q: >-
    Mistral 7B shipped with grouped-query attention and sliding-window attention. What does each buy
    you, and what does each cost?
  a: >
    Grouped-query attention shares key and value heads across groups of query heads, shrinking the
    KV cache and speeding up decoding at little quality cost. Sliding-window attention lets each
    token attend only to a fixed window of recent tokens (4,096 in Mistral 7B), so attention cost
    and cache size stop growing with sequence length, and a rolling buffer can store just the
    window.


    The cost of GQA is a small loss of expressiveness. The cost of sliding windows is that distant
    tokens are reachable only indirectly through stacked layers, so precise recall of far-away
    details can suffer compared with full attention.
