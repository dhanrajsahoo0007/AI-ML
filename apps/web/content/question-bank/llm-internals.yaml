- id: walk-me-through-deepseekmoe-how-is-it-different-from-a-stand
  q: Walk me through DeepSeekMoE. How is it different from a standard top-2 MoE like Mixtral?
  a: >
    DeepSeekMoE makes two changes. Fine-grained expert segmentation splits each expert into several
    smaller ones and routes each token to more of them, so the same compute buys far more possible
    combinations and experts can specialize more narrowly. Shared expert isolation adds one or more
    always-active experts that capture common knowledge, so routed experts do not all relearn it.


    Mixtral routes each token to 2 of 8 large experts with no shared expert. DeepSeekMoE routes to
    many small experts plus shared ones, which their papers report gives better quality for the same
    active compute.
