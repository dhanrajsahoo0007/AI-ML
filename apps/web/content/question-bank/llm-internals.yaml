- id: walk-me-through-what-happens-tensor-by-tensor-in-one-forward
  q: >-
    Walk me through what happens, tensor by tensor, in one forward pass of a decoder-only
    transformer.
  a: >
    Token ids of shape (batch, seq) are looked up in the embedding table to give (batch, seq,
    d_model). In each layer, the hidden states are normalized, projected into Q, K and V, reshaped
    to (batch, heads, seq, head_dim), and rotary position embeddings are applied to Q and K. Scores
    QKᵀ/√d have shape (batch, heads, seq, seq); the causal mask sets future positions to minus
    infinity, a softmax gives weights, and multiplying by V gives (batch, heads, seq, head_dim),
    which is merged back to d_model and projected by the output matrix.


    That result is added to the residual stream, normalized again, passed through the feed-forward
    block that expands to the hidden size and back, and added to the residual again. After the last
    layer a final norm is applied and the vectors are projected to vocabulary size, giving logits of
    shape (batch, seq, vocab); training applies cross-entropy at every position, while generation
    takes the last position's logits.
  topic: llm-internals
  level: Senior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/transformer-architecture
  refs:
    - title: Decoding Transformer Architecture
      url: https://outcomeschool.com/blog/decoding-transformer-architecture
  source: outcome-school
- id: what-are-the-key-components-of-a-transformer-model-and-why-d
  q: What are the key components of a Transformer model and why does each matter?
  a: >
    Token embeddings turn ids into vectors, and positional information gives order. Each block has
    self-attention, which lets tokens exchange information, and a feed-forward network, which
    transforms each token on its own and holds most of the parameters. Residual connections and
    normalization wrap both sub-layers so deep stacks train stably.


    Masks control what each token may attend to, and a final projection with softmax turns vectors
    into next-token probabilities. Every piece has a job: remove positions and order is lost, remove
    residuals and depth becomes untrainable, remove attention and tokens cannot use context.
  topic: llm-internals
  level: Junior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/transformer-architecture
  refs:
