- id: why-is-layernorm-placed-pre-block-in-modern-transformers-and
  q: Why is LayerNorm placed pre-block in modern transformers, and what is RMSNorm?
  a: >
    The original Transformer normalized after adding the residual (Post-LN). Modern LLMs normalize
    the input to each sub-layer before it runs (Pre-LN), which leaves a clean identity path through
    the residual stream. Gradients then flow well through very deep stacks and training needs less
    delicate learning-rate warm-up.


    RMSNorm is a simpler normalization that divides each vector by its root mean square and applies
    a learned gain, without subtracting the mean or adding a bias. It is cheaper and works about as
    well as LayerNorm, so models such as Llama use it.
  topic: llm-internals
  level: Mid
