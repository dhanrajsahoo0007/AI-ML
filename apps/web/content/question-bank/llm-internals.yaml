- id: what-do-the-chinchilla-scaling-laws-say-and-how-do-they-diff
  q: What do the Chinchilla scaling laws say, and how do they differ from earlier scaling intuitions?
  a: >
    Chinchilla found that for a fixed training compute budget, model size and training tokens should
    grow in roughly equal proportion, at about 20 tokens per parameter. A 70B model trained on 1.4
    trillion tokens beat the 280B Gopher trained with the same compute.


    Earlier work by Kaplan and colleagues suggested putting most extra compute into bigger models
    with relatively little extra data, so many large models were undertrained. In practice, teams
    now often train past the Chinchilla ratio on purpose, because a smaller model trained longer is
    cheaper to serve over its lifetime.
  topic: llm-internals
  level: Mid
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: what-is-a-mixture-of-experts-architecture-and-how-does-it-sc
  q: What is a mixture-of-experts architecture and how does it scale capacity without scaling FLOPs?
  a: >
    An MoE layer replaces the single feed-forward network in a transformer block with many expert
    networks plus a small router. For each token the router picks the top-k experts, often one or
    two, runs only those and mixes their outputs by the router weights.


    Total parameters, and therefore capacity, grow with the number of experts, but compute per token
    depends only on the experts actually used. The costs are memory, since every expert must be
    loaded, load balancing so experts get used evenly, and all-to-all communication when experts sit
    on different GPUs.
  topic: llm-internals
