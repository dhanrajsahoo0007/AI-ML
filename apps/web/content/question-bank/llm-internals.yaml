- id: walk-me-through-what-actually-happens-when-someone-calls-aut
  q: >-
    Walk me through what actually happens when someone calls AutoModelForCausalLM.from_pretrained(…,
    device_map=“auto”, torch_dtype=“auto”).
  a: >
    The library resolves the model id, downloads or reads the config, which names the architecture
    class, and the weight files, usually sharded safetensors with an index. torch_dtype="auto" picks
    the dtype stored in the config so weights load in, say, bf16 rather than fp32. With
    device_map="auto", the model is first created with empty weights, then Accelerate measures
    available GPU, CPU and disk memory and assigns layers to devices to fit.


    Each weight shard is then loaded directly onto its assigned device, and hooks are added so
    activations move between devices during the forward pass. Layers offloaded to CPU or disk work
    but are slow, so placement is worth checking after loading.
  topic: llm-internals
  level: Senior
  companies:
    - Hugging Face
  related: /ai-system-design/genai-system-design/llm-serving-inference
