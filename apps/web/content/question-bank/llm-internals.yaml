- id: qwen2-5-extends-context-to-128k-and-1m-for-turbo-using-yarn
  q: >-
    Qwen2.5 extends context to 128K (and ~1M for Turbo) using YaRN plus Dual Chunk Attention, mostly
    training-free. Explain how, and why post-hoc extension is attractive.
  a: >
    YaRN rescales RoPE frequencies so positions beyond the trained length map onto angles the model
    has seen, preserving high-frequency local detail. Dual Chunk Attention splits a long sequence
    into chunks and remaps relative positions between chunks so no query-key distance exceeds what
    the model saw in training.


    Together they let a model trained at shorter lengths work at much longer contexts with little or
    no extra training. Post-hoc extension is attractive because long-context pre-training is
    expensive, and it keeps short-context quality intact.
