- id: compare-bpe-wordpiece-and-unigram-tokenization-why-is-tokeni
  q: >-
    Compare BPE, WordPiece and Unigram tokenization. Why is `tokenizers` written in Rust, and what
    tokenizer bugs bite people in practice?
  a: >
    BPE merges the most frequent adjacent pair repeatedly. WordPiece merges the pair that most
    increases training-data likelihood and marks word-internal pieces. Unigram starts from a large
    vocabulary and prunes tokens that matter least to a unigram language model, and can sample
    alternative segmentations.


    The tokenizers library is written in Rust for speed: tokenizing large datasets is a real
    bottleneck, and Rust gives fast, parallel, memory-safe code with Python bindings. Common bugs
    include mismatched tokenizer and model versions, missing or doubled special tokens, wrong chat
    templates, whitespace and normalization differences between training and inference, and offset
    mappings breaking on unusual Unicode.
