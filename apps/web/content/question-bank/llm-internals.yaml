- id: explain-attention-free-transformer-architectures-and-their-t
  q: Explain attention-free transformer architectures and their trade-offs.
  a: >
    Attention-free designs replace quadratic attention with mechanisms whose cost grows linearly
    with sequence length: state-space models such as Mamba with input-dependent selective state
    updates, linear-attention and recurrent variants such as RWKV and RetNet, and long convolutions
    such as Hyena. They process tokens with a fixed-size state, so inference memory does not grow
    with context and generation is constant time per token.


    The trade-off is recall: compressing history into a fixed state makes exact retrieval of
    arbitrary earlier tokens, copying and in-context lookup harder than with attention. Hybrids that
    mix a few attention layers with many linear or state-space layers are a popular compromise,
    getting most of the efficiency while keeping strong recall.
  topic: llm-internals
  level: Senior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/efficient-attention
  source: outcome-school
- id: walk-me-through-matrix-manipulations-relevant-to-llm-archite
  q: Walk me through matrix manipulations relevant to LLM architectures.
  a: >
    Almost everything is matrix multiplication. Projections multiply hidden states (tokens ×
    d_model) by weight matrices to produce Q, K and V. Multi-head attention reshapes and transposes
    those to (heads × tokens × head_dim) so each head runs as a batched matrix multiply: QKᵀ gives a
    tokens × tokens score matrix per head, and multiplying the softmaxed scores by V gives the head
    outputs, which are concatenated and multiplied by an output matrix.


    The feed-forward block is two or three more large multiplications. Knowing shapes lets you
    reason about cost: a matmul of (m×k)(k×n) costs about 2mkn FLOPs, which is why parameters times
    tokens drives compute, and why the tokens × tokens attention matrix dominates at long context.
  topic: llm-internals
  level: Mid
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/self-attention-explained
