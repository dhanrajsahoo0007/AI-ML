- id: kimi-s-headline-feature-is-very-long-context-when-you-push-f
  q: >-
    Kimi's headline feature is very long context. When you push from 8K to hundreds of thousands of
    tokens, what actually breaks first, and why?
  a: >
    Memory breaks first: the KV cache grows linearly with length and at hundreds of thousands of
    tokens one sequence can need tens of gigabytes, which limits batch size and throughput. Prefill
    compute grows quadratically, so time to first token balloons.


    Quality is the next problem: positions beyond the trained length are out of distribution for
    RoPE until rescaled, and models degrade at using information in the middle of very long inputs.
    Fixes include cache compression such as MLA or GQA, FlashAttention and context-parallel prefill,
    sparse or windowed attention, RoPE rescaling with long-context training, and evaluation at many
    depths.
  topic: llm-internals
