- id: what-is-multi-token-prediction-mtp-and-why-train-with-it
  q: What is multi-token prediction (MTP) and why train with it?
  a: >
    Multi-token prediction trains the model to predict several future tokens at each position, not
    just the next one. In DeepSeek-V3's version, small extra modules sequentially predict the
    following tokens while sharing the embedding and output head with the main model.


    It densifies the training signal and encourages representations that plan ahead, which was
    reported to improve quality. At inference the extra modules can be dropped, or reused as a
    built-in draft model for speculative decoding, letting the model propose several tokens per step
    and verify them, which speeds up generation.
