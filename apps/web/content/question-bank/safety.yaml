- id: when-is-intervening-during-decoding-better-than-filtering-th
  q: When is intervening during decoding better than filtering the finished reply?
  a: >
    Filtering the finished reply is simple but wastes the whole generation, adds latency, and leaves
    only blocking or regenerating. Intervening during decoding, by checking partial output as it
    streams, stopping early, steering with constrained decoding or logit adjustments, or switching
    to a safe continuation, catches problems before they are shown in streaming interfaces and saves
    compute.


    It is better when responses stream to users in real time, when unsafe continuations can be
    steered rather than fully rejected, and when latency matters. Full-reply filtering is still
    useful as a final check for issues that only appear in the complete text.
  topic: safety
  level: Senior
  companies:
    - Character.AI
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: design-age-assurance-for-a-platform-where-the-under-18-exper
  q: Design age assurance for a platform where the under-18 experience is fundamentally different.
  a: >
    Combine signals in layers proportional to risk: self-declared age at signup, age-estimation
    models on behavioral and content signals, and stronger verification such as ID or facial age
    estimation through privacy-preserving providers when signals suggest a minor is in the adult
    experience or when users try to access adult features.


    Default uncertain users to the safer under-18 experience, apply different models, content
    policies and features for minors, minimize and protect the data used for assurance, provide
    appeals, and measure misclassification in both directions. Comply with regional laws.
  topic: safety
  level: Senior
  companies:
    - Character.AI
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: design-the-safety-stack-for-voice-cloning-consent-watermarki
  q: "Design the safety stack for voice cloning: consent, watermarking and abuse response."
  a: >
    Consent: verify that the voice belongs to the person creating the clone, for example by having
    them read a randomized consent phrase that is matched to the training audio, and block cloning
    of known public figures without authorization. Watermarking: embed inaudible, robust watermarks
    in all generated audio, and offer a public classifier to detect AI-generated speech from the
    platform.


    Abuse response: content policies, classifiers on text prompts for fraud or impersonation,
    account verification for higher-risk features, rate limits, logging that ties every generation
    to an account, fast takedown and reporting channels, and cooperation with platforms and
    authorities.
  topic: safety
  level: Senior
  companies:
    - ElevenLabs
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: a-generated-note-contains-a-medication-the-patient-never-men
  q: >-
    A generated note contains a medication the patient never mentioned. Treat that as a safety
    incident: how do you detect it before a clinician sees it?
  a: >
    Before the clinician sees the note, run automated grounding checks: every medication, dose,
    diagnosis and order in the note must link to supporting spans in the transcript or the chart,
    and anything without support is flagged or removed. Cross-check medications against what was
    said and the medication list, and treat unsupported clinical entities as high-severity errors.


    Treat confirmed cases as safety incidents: trace whether the error came from ASR mishearing,
    chart context leaking in, or generation, fix the cause, add the case to regression tests, and
    monitor the rate of unsupported clinical entities as a key safety metric.
  topic: safety
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/kg-healthcare-case-study
  source: outcome-school
- id: clinicians-will-not-sign-what-they-cannot-verify-how-would-y
  q: >-
    Clinicians will not sign what they cannot verify. How would you build span-level provenance from
    every line of the note back to the conversation?
  a: >
    Keep word-level timestamps and speaker labels from ASR, generate the note with the model citing
    transcript segment ids for each sentence or fact, then verify each link with an alignment or
    entailment check and store sentence-to-span mappings with the note.


    In the interface, clinicians click any line to see and hear the exact supporting moment, and
    lines without strong support are highlighted for review. Measure provenance coverage and
    accuracy, and treat unsupported lines as defects.
  topic: safety
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: phi-is-in-every-audio-file-transcript-and-note-you-touch-how
  q: >-
    PHI is in every audio file, transcript and note you touch. How does that shape the architecture,
    and what can you send to a third-party model API?
  a: >
    Protected health information shapes everything: encryption in transit and at rest, strict access
    controls and audit logs, minimal retention, de-identification for analytics and model
    development, separation of environments, and incident response. Every vendor that processes PHI
    needs a business associate agreement and must meet your security requirements.


    A third-party model API may receive PHI only under such an agreement with appropriate
    data-handling terms, such as no training on your data and limited retention; otherwise send only
    de-identified data or run models in your own controlled environment. Document data flows and
    verify them in security reviews.
