- id: how-would-you-design-safeguards-for-an-ai-system-that-can-ta
  q: How would you design safeguards for an AI system that can take actions on behalf of a user?
  a: >
    Act with the user's delegated, least-privilege permissions; classify actions by risk in code;
    require explicit confirmation for consequential or irreversible actions; and enforce limits such
    as spending caps and allowed destinations in the tools themselves, not in prompts.


    Protect against manipulation by treating external content as untrusted, monitor and log every
    action for audit and undo, make actions reversible where possible, rate-limit, and test with
    adversarial scenarios. Expand autonomy gradually as evidence shows it is safe.
  topic: safety
