- id: what-is-the-difference-between-jailbreaking-and-adversarial
  q: What is the difference between jailbreaking and adversarial prompting?
  a: >
    Jailbreaking is a user crafting prompts, such as role-play, hypotheticals or obfuscation, to
    make a model violate its own safety policies and produce content it should refuse. Adversarial
    prompting is broader: any input designed to make a model misbehave, including attacks optimized
    automatically, such as appended token strings that transfer across models, and attacks aimed at
    an application rather than the model's policies, such as prompt injection.


    Jailbreaks target the model's alignment; adversarial prompting includes jailbreaks plus attacks
    on reliability and on the surrounding system.
