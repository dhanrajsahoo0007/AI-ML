- id: how-would-you-audit-a-deployed-model-for-differential-perfor
  q: How would you audit a deployed model for differential performance across user groups?
  a: >
    Define the groups and harms that matter with domain, legal and affected-community input. Build
    or collect evaluation data with group information, or use counterfactual tests that swap
    group-related details in otherwise identical inputs, and measure quality, error types and
    outcome rates per group with confidence intervals.


    Choose fairness criteria suited to the decision, such as equal error rates or equal opportunity,
    investigate causes of gaps (data coverage, labels, proxies), mitigate through data, model or
    decision-threshold changes, and monitor continuously after deployment. Document findings and
    decisions.
  topic: safety
