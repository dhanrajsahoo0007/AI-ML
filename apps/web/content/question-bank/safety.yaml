# Company-reported questions adapted from Outcome School (Apache 2.0); see NOTICE.md. Answers are our own.
- id: what-is-prompt-injection-direct-and-indirect-and-what-is-you
  q: What is prompt injection (direct and indirect), and what is your layered defence?
  a: >
    Prompt injection is untrusted text that tries to override an application's instructions. Direct
    injection comes in the user's own message; indirect injection hides in content the model reads
    during a task, such as web pages, emails, documents or tool outputs, so a third party can hijack
    the system.


    Layered defense: mark untrusted content clearly and instruct the model to treat it as data; give
    tools least privilege and scope; require human confirmation for sensitive or external actions;
    block exfiltration channels such as auto-loaded links that embed data; run injection classifiers
    on inputs and checks on outputs; log everything; and red-team continuously. No prompt alone is a
    complete fix, so assume some injections succeed and limit what they can do.
