- id: walk-me-through-the-owasp-top-10-for-llm-applications-and-wh
  q: Walk me through the OWASP Top 10 for LLM applications and which ones actually bite in practice.
  a: >
    The list covers risks such as prompt injection, sensitive information disclosure, supply-chain
    risks in models and data, data and model poisoning, improper handling of model outputs passed to
    other systems, excessive agency, system prompt leakage, weaknesses in vector stores and
    embeddings, misinformation, and unbounded consumption of resources.


    The ones that bite most in practice: prompt injection, especially indirect injection in agents;
    excessive agency, meaning tools with too much permission; sensitive data leaking across users
    through retrieval or logs; insecure output handling, where model output is executed or rendered
    without validation; and unbounded consumption, where costs or loops run away.
