- id: how-would-you-balance-performance-optimisation-with-model-in
  q: How would you balance performance optimisation with model interpretability?
  a: >
    Treat them as compatible goals with explicit trade-offs: keep a reference model and reproducible
    evaluations so any optimization, such as quantization, distillation or architecture changes, is
    checked for behavior changes, not just speed. Preserve the ability to inspect activations and
    attributions in the optimized model, and avoid changes that make debugging impossible without a
    large gain.


    Where interpretability matters most, in safety-critical decisions, accept some cost; where it
    matters less, optimize more aggressively but monitor behavior. Document what each optimization
    changes.
  topic: safety
  level: Senior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: how-would-you-approach-designing-a-system-to-ensure-the-safe
  q: >-
    How would you approach designing a system to ensure the safe deployment of AI models in
    production?
  a: >
    Before deployment: risk assessment of the use case, capability and safety evaluations with
    release thresholds, red-teaming, and documented policies. In the system: layered guardrails on
    inputs, outputs and actions, least-privilege access, human approval for high-impact actions,
    abuse detection and rate limits.


    After deployment: staged rollout, monitoring of safety metrics and incidents, user reporting,
    sampled review, rapid rollback and kill switches, an incident response process, and regular
    re-evaluation as models, users and threats change.
  topic: safety
  level: Senior
  companies:
    - Anthropic
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: what-are-your-thoughts-on-ai-safety-and-the-risks-of-advance
  q: What are your thoughts on AI safety and the risks of advanced AI systems?
  a: >
    Give an honest, specific view rather than slogans. You might discuss near-term risks such as
    misuse, misinformation, privacy and security, and longer-term risks from increasingly capable,
    autonomous systems whose goals or behavior are hard to verify, along with why you take them
    seriously.


    Connect it to concrete work: evaluations, interpretability, safeguards, careful deployment and
    how your own engineering would contribute. Acknowledge uncertainty and disagreement, and show
    you have thought about trade-offs between benefits and risks.
