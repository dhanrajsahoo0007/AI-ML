- id: design-guardrails-for-a-consumer-facing-assistant-input-filt
  q: Design guardrails for a consumer-facing assistant. Input filters, output filters, or both?
  a: >
    Both, because they catch different things. Input filters stop clearly harmful requests and
    injection attempts early and cheaply, detect self-harm or crisis signals to route to supportive
    responses, and handle age-appropriate rules. Output filters catch harmful content the model
    produced anyway, leaked personal data and policy violations, including in streamed responses
    checked chunk by chunk.


    Add a safety-tuned model with a clear policy prompt, rate limits and abuse detection per
    account, user reporting, and monitoring with human review. Tune thresholds to balance harm
    against over-refusal, and measure both attack success and false refusals on test sets.
