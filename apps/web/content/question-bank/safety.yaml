- id: what-is-constitutional-ai-and-how-does-it-differ-from-rlhf-w
  q: What is Constitutional AI and how does it differ from RLHF? What is RLAIF?
  a: >
    Constitutional AI trains a model to follow a written set of principles. In a supervised phase,
    the model critiques and revises its own responses against the principles and is fine-tuned on
    the revisions. In a reinforcement phase, an AI model compares responses using the principles to
    produce preference labels, and the policy is trained on them.


    That second step is RLAIF, reinforcement learning from AI feedback, instead of RLHF's human
    preference labels. It needs far fewer human labels, especially for harmful content, makes the
    values explicit and editable, and produces models that explain refusals. It does not solve
    choosing the right principles, ambiguous cases, or blind spots of the AI labeler, and models can
    still be jailbroken.
  topic: safety
