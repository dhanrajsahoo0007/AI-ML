- id: design-the-safety-architecture-for-a-learned-whole-body-poli
  q: Design the safety architecture for a learned whole-body policy operating near people.
  a: >
    Never rely on the learned policy alone. Wrap it with independent safety layers: hardware limits
    on force, speed and torque; a certified safety controller that monitors joint states and can
    trigger protective stops; perception-based separation monitoring that slows or stops the robot
    when people come close; and safe-state behaviors when the policy is uncertain or sensors fail.


    Validate in simulation and controlled tests before deployment near people, follow relevant
    safety standards, log everything for incident analysis, and limit the policy's operating
    envelope until evidence supports expanding it.
