- id: design-a-red-teaming-programme-for-a-model-you-are-about-to
  q: Design a red-teaming programme for a model you are about to release.
  a: >
    Define the threat model and risk areas: harmful content categories, dangerous capabilities,
    privacy, bias, jailbreaks, prompt injection and agentic misuse. Combine internal red-teamers,
    external domain experts for high-risk areas, and automated attack generation that scales known
    techniques.


    Record every finding with severity, feed fixes into training data, classifiers and system
    safeguards, and turn successful attacks into regression tests. Measure attack success rates
    before and after mitigations, set launch thresholds, run it again on each significant model
    update, and keep a bug-bounty or reporting channel after release.
