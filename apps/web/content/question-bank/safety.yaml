- id: design-the-harmful-content-detection-system-for-facebook-and
  q: Design the harmful-content detection system for Facebook and Instagram uploads.
  a: >
    Use a cascade: fast hash matching against known bad content, lightweight classifiers on every
    upload, and heavier multimodal models (image, video, text, audio, plus account and behavior
    signals) for borderline cases, with policy-specific heads. Scores map to actions: auto-remove at
    high confidence, downrank or limit distribution in the middle, human review queues prioritized
    by severity and reach.


    Train with reviewer labels and appeals as feedback, handle adversarial adaptation with frequent
    retraining and robustness to obfuscation, cover many languages, and measure precision and recall
    per policy, prevalence of harmful content viewed, review latency and appeal reversal rates.
  topic: safety
  level: Senior
  companies:
    - Meta
  related: /interviews/ml-system-design-interview
  source: outcome-school
- id: a-shipped-copilot-feature-that-summarises-job-applicants-for
  q: >-
    A shipped Copilot feature that summarises job applicants for recruiters is accused of working
    worse for some groups. How do you establish whether that's true, and what do you do about it?
  a: >
    Establish facts with counterfactual tests: create matched applicant profiles that differ only in
    group-related signals, such as names, schools or gaps that correlate with gender or ethnicity,
    and compare summary content, tone and emphasis. Audit real outputs with reviewers and measure
    whether summaries omit or downplay qualifications more for some groups.


    If disparities exist, pause or restrict the feature as appropriate, remove unnecessary sensitive
    signals from inputs, adjust prompts or fine-tune, add consistency checks, and re-audit. Involve
    legal and responsible-AI teams, since hiring is high-risk and regulated, and communicate
    transparently.
  topic: safety
  level: Senior
