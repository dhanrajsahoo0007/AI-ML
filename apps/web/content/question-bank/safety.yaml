- id: what-do-you-see-as-the-most-pressing-unsolved-problem-in-ai
  q: What do you see as the most pressing unsolved problem in AI alignment?
  a: >
    Give a considered personal view with reasons. A strong example: scalable oversight, meaning how
    to reliably supervise and evaluate models whose work is hard for humans to check, combined with
    knowing whether a model's stated reasoning reflects what it actually does. Without it, we cannot
    be confident that training produces the behavior we intended as capabilities grow.


    Explain why it matters, what approaches exist (interpretability, debate and other oversight
    methods, better evaluations), and what you think is missing. Interviewers value depth and honest
    uncertainty over a memorized answer.
  topic: safety
