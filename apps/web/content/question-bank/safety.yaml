- id: an-agentic-research-query-returns-a-memo-citing-a-case-that
  q: >-
    An agentic research query returns a memo citing a case that was overruled. Where does that get
    caught?
  a: >
    It should be caught by a verification step that checks each cited authority against a citator
    service for its current treatment, such as overruled, reversed or distinguished, and flags or
    removes bad law before the memo reaches the user. Retrieval should also prefer good-law sources
    and carry treatment metadata.


    If it slipped through, trace where: retrieval lacked treatment data, the verification step was
    missing or failed, or the agent cited from memory rather than retrieved sources. Add the case to
    the regression suite, and require every citation to come from verified retrieved documents.
  topic: safety
  level: Senior
  companies:
    - Harvey
  related: /ai-system-design/genai-system-design/hallucination-mitigation
  source: outcome-school
- id: two-partners-at-the-same-firm-are-on-opposite-sides-of-a-dea
  q: >-
    Two partners at the same firm are on opposite sides of a deal. Design the data isolation for
    that, on top of normal multi-tenancy.
  a: >
    Model ethical walls explicitly: matters and workspaces with membership, and conflict rules that
    bar specific people from specific matters, synced from the firm's conflicts system. Every
    document, chunk, embedding, cache entry, memory and log is tagged with its matter and enforced
    at retrieval and access time, so a user's queries can only touch matters they are cleared for.


    Keep separate indexes or strict partition filters per matter, never share caches or fine-tuned
    behavior across walled matters, audit access, and test walls with users on both sides. Breaches
    here are professional-responsibility issues, so fail closed.
  topic: safety
  level: Senior
  companies:
    - Harvey
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: design-the-safety-system-for-open-ended-character-chat
  q: Design the safety system for open-ended character chat.
  a: >
    Layer it: policies for content and behavior by age group, character creation review and
    classifiers for character definitions, input and output classifiers for harmful content,
    self-harm and grooming signals, and a safety-tuned model that stays in character without
    crossing lines.


    Add crisis detection with supportive responses and resources, stricter settings and models for
    minors, rate limits and abuse detection, user reporting with fast human review, and monitoring
    of long conversations where drift happens. Measure both harmful-content rates and over-blocking,
    and red-team continuously with role-play attacks.
  topic: safety
  level: Senior
