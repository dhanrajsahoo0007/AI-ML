- id: what-is-mechanistic-interpretability-and-why-do-labs-invest
  q: What is mechanistic interpretability and why do labs invest in it?
  a: >
    Mechanistic interpretability tries to reverse-engineer how a neural network computes,
    identifying the features it represents and the circuits that combine them, rather than only
    looking at inputs and outputs. Techniques include probing, activation patching and sparse
    autoencoders that decompose activations into more interpretable features.


    Labs invest because understanding internal mechanisms could let them detect deception, hidden
    goals or dangerous knowledge, verify that safety training worked, debug failures and steer
    behavior, which matters more as models become more capable and their outputs harder to check
    from the outside.
