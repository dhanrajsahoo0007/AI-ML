- id: walk-me-through-the-latency-budget-of-a-query-query-understa
  q: "Walk me through the latency budget of a query: query understanding → retrieval → rerank → LLM answer. Where do you spend and where do you cut?"
  a: |
    A typical budget: query understanding and rewriting 50–150 ms (or near zero with a small classifier), retrieval across indexes 50–200 ms with permission filtering, re-ranking 50–300 ms depending on candidates and model, then the LLM's time to first token, often 300 ms to over a second depending on prompt length, followed by streaming.

    Spend where quality comes from, usually retrieval recall and re-ranking. Cut by running rewriting and retrieval in parallel, caching popular queries and permission lookups, re-ranking fewer candidates with a smaller model, sending fewer and shorter passages to the LLM, and streaming the answer immediately with citations attached as they are known.
  level: Mid
  category: inference-gpu
  subcategory: serving-batching
  companies:
    - Glean
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: serving-real-time-tts-is-a-different-capacity-problem-from-s
  q: Serving real-time TTS is a different capacity problem from serving a text LLM. Why, and how do you plan capacity?
  a: |
    Text LLM users tolerate some delay and read at their own pace, but audio must be generated faster than real time continuously, or playback stutters. The key metrics are time to first audio and the real-time factor (generation time divided by audio duration), and every active stream needs a steady share of compute for its whole duration.

    Plan capacity in concurrent streams rather than requests: measure how many streams one GPU sustains at a safe real-time factor for each voice model, keep headroom for peaks because you cannot queue audio mid-sentence, separate low-latency conversational traffic from batch narration, and autoscale ahead of traffic patterns.
