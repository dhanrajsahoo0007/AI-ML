- id: explain-the-prefill-and-decode-phases-why-is-prefill-compute
  q: Explain the prefill and decode phases. Why is prefill compute-bound and decode memory-bandwidth-bound?
  a: |
    Prefill processes the whole prompt in one forward pass to build the KV cache and produce the first token. Many tokens share each weight read, so the work is large matrix-matrix multiplication with high arithmetic intensity, and the GPU's compute units are the limit.

    Decode then generates one token per step per sequence. Each step re-reads all weights and the growing KV cache but does only about two FLOPs per parameter per sequence, so arithmetic intensity is low and memory bandwidth is the limit. That is why prefill sets time to first token and decode sets tokens per second, and why batching helps decode most.
