- id: your-p99-latency-doubled-after-a-deploy-with-no-model-change
  q: Your p99 latency doubled after a deploy with no model change. Walk through the diagnosis.
  a: |
    First split the latency: queue time, time to first token and decode time, by route and replica. Compare traffic before and after the deploy, since prompt lengths or output lengths may have changed; a longer system prompt or missing prefix-cache hits inflate prefill.

    Then check engine configuration changes such as max batch size, chunked prefill, scheduler policy, KV cache memory fraction or a disabled CUDA graph, plus dependency versions (drivers, kernels, tokenizer). Look for capacity issues such as fewer replicas, uneven load balancing or autoscaling limits, and for preemption or recomputation when KV memory fills. Roll back if it is severe, reproduce with a replay benchmark, and bisect the deploy diff.
