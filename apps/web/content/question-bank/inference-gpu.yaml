- id: explain-post-training-quantization-versus-quantization-aware
  q: Explain post-training quantization versus quantization-aware training. What breaks when you push weights to 2–4 bits, and how do you recover quality?
  a: |
    Post-training quantization converts a trained model's weights, and sometimes activations, to lower precision using a small calibration set, with methods such as GPTQ or AWQ that minimize the error layer by layer. It is cheap and fast. Quantization-aware training simulates low precision during training or fine-tuning so the model learns weights that tolerate it, recovering more quality at extra training cost.

    At 2–4 bits, outlier weights and activations dominate the error, small models and fine-grained skills such as math, code and multilingual text degrade first, and errors accumulate over long generations. Recover quality with group-wise scales, keeping sensitive layers in higher precision, outlier handling, QAT or LoRA fine-tuning on the quantized model, and distillation from the full-precision model.
  level: Senior
