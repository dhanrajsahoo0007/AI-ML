  source: outcome-school
- id: price-a-dedicated-endpoint-estimate-cost-per-million-output
  q: "Price a dedicated endpoint: estimate cost per million output tokens for a 70B model, and explain the throughput-latency trade."
  a: |
    Suppose a 70B model on 4 GPUs at an illustrative 2 dollars per GPU-hour, 8 dollars an hour in total. If the endpoint sustains 2,000 output tokens per second across many concurrent users at high batch, it produces 7.2 million tokens an hour, about 1.1 dollars per million output tokens before input-processing cost and margin. At 400 tokens per second, the same hardware costs about 5.6 dollars per million.

    That is the trade-off: higher batch and concurrency lower cost per token but slow each user's stream and raise latency. A dedicated endpoint should be priced by the hour or by guaranteed throughput, with utilization assumptions explicit, because idle hours still cost money.
  level: Senior
  category: inference-gpu
  subcategory: cost-optimization
  companies:
    - Together AI
  related: /ai-system-design/genai-system-design/cost-latency-optimization
  source: outcome-school
- id: serving-a-custom-completion-model-to-millions-of-dau-walk-me
  q: "Serving a custom completion model to millions of DAU: walk me through the inference-cost model and your top three levers."
  a: |
    Code completion fires on keystrokes, so requests are many, prompts are long (surrounding code) and outputs short, and latency must be very low. Cost is dominated by prefill of large contexts and by the number of requests. Model it as requests per user per day × prompt tokens × prefill cost plus short decode, on GPUs sized for peak typing hours.

    Top three levers: cut requests with debouncing, client-side caching and cancelling stale requests; cut prefill with prefix caching of file context across consecutive requests and smarter context selection; and use a small, specialized model with speculative decoding for edits. Measure acceptance rate per dollar, not just cost per request.
  level: Senior
