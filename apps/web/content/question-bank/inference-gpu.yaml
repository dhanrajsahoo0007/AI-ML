- id: time-to-first-token-for-your-on-device-feature-is-1-8-s-walk
  q: Time-to-first-token for your on-device feature is 1.8 s. Walk me through diagnosing and fixing it.
  a: |
    Profile the timeline: model loading or warm-up, tokenization, prompt assembly, prefill of the prompt and the first decode step. On device, slow TTFT usually comes from loading weights from storage on first use, a long prompt that makes prefill expensive, running on the wrong compute unit, or thermal throttling.

    Fixes: keep the model resident or preload it before the user needs it, shorten the prompt and cache the prefill of the fixed system prompt, make sure prefill runs on the neural engine or GPU with efficient kernels, use a smaller model for the first response, and stream the first tokens immediately.
