- id: you-want-to-serve-a-70b-parameter-model-on-a-single-80-gb-gp
  q: You want to serve a 70B-parameter model on a single 80 GB GPU. Walk me through whether it fits and what single-stream tokens/sec you'd expect.
  a: |
    In BF16 the weights alone are 140 GB, so it does not fit. In 8-bit they are about 70 GB, leaving about 10 GB for KV cache and runtime, so it fits for short contexts and small batches. In 4-bit they are about 35–40 GB, leaving room for a reasonable KV cache.

    Single-stream decode is bandwidth-bound: about 3.35 TB/s ÷ 70 GB ≈ 48 tokens per second at 8-bit, roughly double at 4-bit, before overheads that typically cost 20–40%. Quality should be checked after quantization, and two GPUs in BF16 give similar speed with no quantization loss.
