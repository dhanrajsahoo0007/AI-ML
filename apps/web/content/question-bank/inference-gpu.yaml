- id: estimate-the-gpu-memory-needed-to-serve-a-70b-model-weights
  q: "Estimate the GPU memory needed to serve a 70B model: weights, KV cache, activations, fragmentation."
  a: |
    Weights: 70B parameters × 2 bytes = 140 GB in BF16, 70 GB in 8-bit, about 35–40 GB in 4-bit. KV cache for a Llama-style 70B with GQA (80 layers, 8 KV heads of size 128, 2 bytes): about 0.33 MB per token, so 64 concurrent sequences averaging 4K tokens is about 85 GB.

    Activations during decode are small, a few GB, while prefill of long prompts needs more. Add framework overhead, CUDA graphs and fragmentation of roughly 10–20%. So BF16 serving at moderate concurrency needs around 240–260 GB, for example four 80 GB GPUs with tensor parallelism, while 4-bit weights can serve modest loads on one or two GPUs.
