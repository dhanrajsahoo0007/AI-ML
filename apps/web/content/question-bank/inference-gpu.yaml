- id: estimate-the-kv-cache-memory-for-a-3b-on-device-model-at-4k
  q: Estimate the KV-cache memory for a 3B on-device model at 4k context, and name the levers that shrink it.
  a: |
    Take a typical 3B design with 28 layers, 8 KV heads of dimension 128 and 16-bit values: 2 × 28 × 8 × 128 × 2 bytes ≈ 115 KB per token, so 4K tokens is about 470 MB per sequence, significant next to 1.5 GB of 4-bit weights on a phone.

    Levers: fewer KV heads through GQA or MQA, quantizing the cache to 8 or 4 bits, sharing KV across layers, a shorter context or sliding-window attention, keeping only one active sequence, and summarizing or retrieving instead of holding long histories.
