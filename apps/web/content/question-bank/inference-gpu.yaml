- id: explain-prefix-caching-prompt-caching-when-should-you-use-it
  q: Explain prefix caching / prompt caching. When should you use it, and what invalidates a cached prefix?
  a: |
    Requests that start with the same tokens, such as a long system prompt, tool definitions, a shared document or earlier conversation turns, can reuse the KV cache computed for that prefix instead of recomputing it. That cuts time to first token and cost, often dramatically for long shared prefixes.

    Use it when large stable prefixes repeat across requests, and structure prompts so stable content comes first and variable content last. Any change to an earlier token invalidates everything after it, including a different system prompt, reordered tools, a timestamp near the top, or a different model or tokenizer version. Cached entries are also evicted under memory pressure or expire after a time limit.
