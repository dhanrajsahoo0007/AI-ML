- id: a-chat-assistant-re-sends-a-long-conversation-history-on-eve
  q: A chat assistant re-sends a long conversation history on every turn. How do you avoid recomputing all of it, and what are the pitfalls?
  a: |
    Use prefix caching: keep each conversation's KV cache after a turn, and when the next request arrives with the same history plus a new message, reuse the cached prefix and only prefill the new tokens. Route follow-up turns to the replica that holds the cache, and spill cold caches to CPU memory or SSD instead of discarding them.

    Pitfalls: any change to earlier tokens (an edited system prompt, timestamps, reordered tools, a different template) invalidates the cache; memory pressure evicts caches unpredictably; sticky routing can unbalance load; and very long histories should still be summarized or truncated, because caching saves compute but not context-window space.
