- id: design-a-batched-inference-system-where-100-requests-take-th
  q: Design a batched inference system where 100 requests take the same time as 1.
  a: |
    Decode at small batch is memory-bound: each step reads all weights regardless of how many sequences use them, so going from 1 to 100 sequences barely changes step time until the batch approaches the compute roof. The design exploits that.

    Use continuous batching so requests join and leave each step, a paged KV cache with enough memory for 100 concurrent contexts, prefix caching for shared prompts, chunked prefill so arrivals do not stall the batch, and kernels that keep efficiency high at batch 100. Measure that per-step latency stays flat as batch grows, and cap batch size where latency targets would break.
