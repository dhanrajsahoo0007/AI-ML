  source: outcome-school
- id: we-pair-lpx-decode-accelerators-with-nvidia-gpus-doing-prefi
  q: We pair LPX decode accelerators with NVIDIA GPUs doing prefill and attention. Design the serving path across those two machines.
  a: |
    Disaggregate the phases: GPUs handle prefill and attention-heavy work, where their compute and memory capacity shine, and decode accelerators handle the per-token feed-forward or full decode work at high speed. The serving path moves KV cache or intermediate activations between the two over a fast interconnect, with a scheduler that pairs requests to devices.

    Design concerns: transfer bandwidth and latency per token, which can erase the gains if too large; batching and pipelining across both machines so neither idles; failure handling when one side is unavailable; and capacity planning for the ratio of prefill to decode load. Measure end-to-end tokens per second and tail latency against GPU-only serving.
