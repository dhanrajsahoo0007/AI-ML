- id: explain-disaggregated-prefill-decode-serving-and-when-it-pay
  q: Explain disaggregated prefill/decode serving and when it pays for itself.
  a: |
    Disaggregation runs prefill and decode on separate GPU pools. Prefill nodes process prompts and transfer the resulting KV cache to decode nodes over a fast interconnect, and decode nodes generate tokens. Each pool can be sized, batched and even built on different hardware for its own bottleneck: compute for prefill, memory bandwidth and capacity for decode.

    It pays off at large scale with long prompts and strict latency targets, where prefill interference hurts decode latency and utilization. It costs network bandwidth for KV transfer, more complex scheduling and capacity planning, and adds latency for short prompts, so smaller deployments usually do better with chunked prefill on a shared pool.
