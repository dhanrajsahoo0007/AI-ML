- id: estimate-the-kv-cache-memory-to-serve-a-70b-class-model-at-1
  q: Estimate the KV-cache memory to serve a 70B-class model at 128k context. What do you do when it doesn't fit?
  a: |
    For a Llama-style 70B with GQA (80 layers, 8 KV heads, head dimension 128, 2 bytes): 2 × 80 × 8 × 128 × 2 bytes ≈ 0.33 MB per token, so 128K tokens is about 42 GB for a single sequence, more than half of an 80 GB GPU and on top of 140 GB of BF16 weights. Without GQA it would be 8x larger.

    When it does not fit: shard across more GPUs with tensor or context parallelism, quantize the cache to 8 or 4 bits, use paged memory so only used blocks are allocated, offload cold blocks to CPU memory, limit concurrency of long requests, and consider architectures such as MLA or sliding windows for future models. Retrieval to shorten prompts is often the cheapest fix.
