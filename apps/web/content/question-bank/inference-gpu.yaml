- id: when-would-you-choose-vllm-vs-sglang-vs-tensorrt-llm-vs-a-cu
  q: When would you choose vLLM vs SGLang vs TensorRT-LLM vs a custom stack?
  a: |
    vLLM is a strong default: broad model support, PagedAttention, continuous batching, many quantization formats and an active community, good for most open-model serving. SGLang adds RadixAttention for aggressive prefix sharing and a structured-generation runtime, which shines for agentic, multi-call and constrained-output workloads with lots of shared context.

    TensorRT-LLM gives the best raw performance on NVIDIA GPUs through compiled, fused kernels and FP8 support, at the cost of build steps and less flexibility. A custom stack is justified only at very large scale or with unusual hardware or architectures, where a few percent efficiency is worth a team's full-time effort. Benchmark candidates on your real prompt and output lengths before choosing.
