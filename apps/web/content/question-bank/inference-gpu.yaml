- id: compare-fp16-bf16-fp8-int8-int4-and-fp4-for-serving-what-bre
  q: Compare FP16, BF16, FP8, INT8, INT4 and FP4 for serving. What breaks at each step down?
  a: |
    FP16 and BF16 use 2 bytes; BF16 has FP32's range, so it avoids overflow and is the default reference. FP8 halves memory and doubles compute on supporting GPUs, with small accuracy loss given per-tensor or per-block scaling; the main risk is outliers and range. INT8 weight or weight-and-activation quantization is mature and nearly lossless with good calibration, though activation outliers need handling such as SmoothQuant.

    INT4 weight-only (GPTQ, AWQ) cuts memory 4x and speeds up memory-bound decode, but loses more accuracy, especially on reasoning, long context and small models, and needs group-wise scales. FP4 on newest hardware pushes further with micro-scaled blocks, and quality becomes sensitive to calibration and model. Each step down shrinks memory and raises speed while increasing the risk to rare-token behavior, math and multilingual quality, so evaluate per task.
