- id: how-does-pagedattention-work-and-what-problem-of-kv-cache-fr
  q: How does PagedAttention work, and what problem of KV-cache fragmentation does it solve?
  a: |
    Without paging, servers reserve a contiguous KV cache region sized for each request's maximum length. Most of it goes unused, and free memory fragments into gaps too small to use, so far fewer requests fit.

    PagedAttention stores each sequence's cache in small fixed-size blocks allocated on demand, tracked by a block table like virtual memory pages, and the attention kernel reads through that table. Waste drops to the last partial block, memory can be shared between sequences with the same prefix through copy-on-write, and many more sequences fit, which raises batch size and throughput.
  level: Mid
  category: inference-gpu
  subcategory: kv-cache-attention
