- id: a-customer-s-bedrock-hosted-workload-costs-too-much-cut-infe
  q: A customer's Bedrock-hosted workload costs too much. Cut inference cost dramatically without unacceptable quality loss.
  a: |
    Start by measuring cost per request type: input versus output tokens, which models, and how often prompts repeat. Then apply levers in order: trim prompts and cap outputs, enable prompt caching for repeated prefixes, route simple requests to smaller or cheaper models, and use batch inference for non-interactive work.

    If volume is high and the task is stable, fine-tune or distill a smaller model, or move to provisioned throughput if utilization is predictable. Validate every change with the customer's evaluation set and agree on the acceptable quality threshold before switching models.
  level: Mid
  category: inference-gpu
  subcategory: cost-optimization
