- id: what-are-ttft-tpot-itl-and-throughput-and-how-do-they-trade
  q: What are TTFT, TPOT, ITL and throughput, and how do they trade against each other?
  a: |
    Time to first token is how long until output starts, driven by queueing and prefill. Time per output token and inter-token latency measure the gap between subsequent tokens, driven by decode speed. Throughput is total tokens per second across all users.

    They trade against each other through batching: larger batches raise throughput and lower cost per token but slow each user's decode and can delay new requests' prefill. Long prompts admitted mid-batch stall other users' token streams unless chunked prefill or prefill-decode disaggregation is used. Operators set targets for each and tune batch size and scheduling to meet them.
