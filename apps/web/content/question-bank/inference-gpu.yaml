- id: a-70b-dense-model-at-8-bit-weights-chips-with-230-mb-of-sram
  q: A 70B dense model at 8-bit weights, chips with ~230 MB of SRAM each. Walk me through the deployment and the unit economics.
  a: |
    70B parameters at 8 bits is 70 GB; with about 230 MB of SRAM per chip, that needs over 300 chips just for weights, plus more for KV cache and activations, so a deployment is a pipeline of hundreds of chips across many racks, each holding a slice of layers.

    Unit economics depend on keeping that fixed hardware busy: the capital cost is spread over tokens served, so high utilization, many concurrent streams flowing through the pipeline, and very fast per-stream speed are what make cost per million tokens competitive. Low traffic makes it expensive, because all those chips are needed regardless of load.
