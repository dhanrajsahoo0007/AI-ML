- id: estimate-the-annual-serving-cost-of-adding-an-llm-summary-fe
  q: Estimate the annual serving cost of adding an LLM summary feature for 100 million weekly active users, and how you'd cut it by 10x.
  a: |
    Assume 100M weekly users each request 5 summaries a week, 500M per week or about 26B per year. With 2,000 input tokens and 200 output tokens each, that is 52 trillion input and 5.2 trillion output tokens a year. At illustrative prices of 0.50 dollars per million input and 1.50 per million output tokens, that is about 26 million plus 8 million, roughly 34 million dollars a year; recompute with real prices and usage.

    To cut 10x: generate summaries once per document and cache them for all viewers, which may remove most calls; use a small distilled model; trim inputs to the relevant sections; batch generation off-peak at discounted rates; and only summarize on demand when users open the feature.
  level: Senior
  category: inference-gpu
  subcategory: cost-optimization
  companies:
    - Microsoft
  related: /ai-system-design/genai-system-design/cost-latency-optimization
