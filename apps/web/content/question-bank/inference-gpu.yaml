- id: design-the-training-setup-for-a-model-that-doesn-t-fit-on-on
  q: Design the training setup for a model that doesn't fit on one accelerator, say 70B parameters on a pod.
  a: |
    A 70B model with Adam needs over 1 TB of weight, gradient and optimizer state, so shard it. Use fully sharded data parallelism (ZeRO-3 or FSDP) across the pod, add tensor parallelism inside each fast-interconnect group to split large matrices, and pipeline parallelism if per-device memory is still too tight. Use bf16 with fp32 master weights, activation checkpointing and fused kernels.

    Size the global batch for stable training, overlap communication with computation, checkpoint frequently with fast restarts for hardware failures, and monitor throughput (model FLOPs utilization), loss and gradient norms. On TPU pods the same ideas map onto sharding annotations over a device mesh.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - Google DeepMind
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: you-re-training-on-tens-of-thousands-of-gpus-and-hardware-fa
  q: You're training on tens of thousands of GPUs and hardware fails constantly. How do you keep goodput high?
  a: |
    At that scale something fails every few hours, so goodput, the share of time spent on useful training, depends on recovering fast. Checkpoint frequently with asynchronous saves to fast storage, detect failures quickly with health checks and heartbeats, keep hot spare nodes to swap in, and restart automatically from the latest checkpoint.

    Prevent failures where possible with burn-in tests, monitoring of thermals, ECC errors and link errors, and draining suspicious nodes. Detect silent data corruption and stragglers, and design parallelism so a single failure only requires restarting the job, not rebuilding data pipelines. Track goodput as a first-class metric.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - xAI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: dualpipe-overlaps-computation-and-communication-in-training
  q: DualPipe overlaps computation and communication in training. Why is that overlap the whole game at this scale, and what is the trade-off?
  a: |
    In large MoE training with expert parallelism, every layer needs all-to-all communication to send tokens to experts on other GPUs, and across nodes that communication can take as long as the computation. If GPUs wait for communication, a large share of expensive hardware sits idle.

    DualPipe is a bidirectional pipeline schedule that feeds micro-batches from both ends and pairs the forward and backward chunks so one chunk's computation runs while another's communication is in flight, which hides most communication and shrinks pipeline bubbles. The trade-off is extra memory, including keeping additional parameter copies, and a more complex schedule to implement and debug.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - DeepSeek
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: a-customer-s-distributed-training-job-on-your-gpu-cluster-ge
  q: A customer's distributed training job on your GPU cluster gets 55% scaling efficiency at 64 nodes. Debug it.
  a: |
    Profile one step at 8, 16 and 64 nodes to see what grows. Usual suspects: communication not overlapped with compute (check NCCL settings, gradient bucket sizes and whether all-reduce runs during backward), the network itself (InfiniBand or RoCE misconfiguration, wrong topology mapping, a slow link or switch), per-GPU batch too small at scale so compute is too short to hide communication, and data loading or storage that cannot keep up.

    Also look for stragglers (one slow node holds back all), synchronization points such as logging or checkpointing, and CPU bottlenecks. Run NCCL bandwidth tests across all nodes, fix topology and bucket sizes, increase per-GPU work or use sharded or hybrid parallelism, and re-measure scaling efficiency.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - Together AI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: compare-tensor-pipeline-data-sequence-and-expert-parallelism
  q: Compare tensor, pipeline, data, sequence and expert parallelism. When do you combine them?
  a: |
    Data parallelism replicates the model and splits requests or batches; it scales throughput but needs the model to fit per replica. Tensor parallelism splits each layer's matrices across GPUs, cutting memory and latency per GPU but requiring all-reduces every layer, so it stays inside a fast NVLink node. Pipeline parallelism assigns layer ranges to different GPUs and passes activations between them, tolerating slower links but adding bubbles and latency.

    Sequence or context parallelism splits long sequences across GPUs for attention and activations. Expert parallelism places MoE experts on different GPUs and routes tokens with all-to-all communication. Large deployments combine them: tensor parallelism within a node, pipeline or expert parallelism across nodes, and data parallel replicas for throughput.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - Amazon
    - Google DeepMind
    - Meta
    - NVIDIA
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: sketch-how-you-would-serve-a-671b-parameter-moe-model-with-l
  q: Sketch how you would serve a 671B-parameter MoE model with low latency under GPU-memory constraints.
  a: |
    A 671B MoE with about 37B active per token needs memory for all weights, roughly 671 GB in FP8, so it spans multiple 8-GPU nodes. Use expert parallelism to spread experts across GPUs, tensor or data parallelism for the attention layers, MLA to keep the KV cache small, and FP8 weights to cut memory and bandwidth.

    For low latency, place hot experts redundantly to avoid stragglers, overlap all-to-all communication with compute, use prefill and decode disaggregation so long prompts do not stall decoding, and add speculative decoding through multi-token prediction heads. Batch enough tokens per step to keep experts busy, and monitor per-expert load.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - DeepSeek
  related: /ai-system-design/genai-system-design/mixture-of-experts
  refs:
