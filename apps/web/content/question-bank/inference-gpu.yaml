      url: https://outcomeschool.com/blog/llm-inference-optimization
  source: outcome-school
- id: design-the-parallelism-strategy-for-serving-a-405b-parameter
  q: "Design the parallelism strategy for serving a 405B-parameter dense model. TP, PP, EP: what goes where and why?"
  a: |
    A 405B dense model is about 810 GB in BF16 or 405 GB in FP8, so it needs at least one 8-GPU node of 80 GB GPUs in FP8, or two nodes in BF16. Use tensor parallelism across the 8 GPUs in a node, where NVLink handles the per-layer all-reduces, and pipeline parallelism across nodes if needed, since pipeline traffic tolerates slower links.

    Expert parallelism does not apply to a dense model. Add data-parallel replicas for throughput, keep KV cache headroom per replica for the target concurrency, and use FP8 to fit in one node where quality allows, because avoiding cross-node pipeline stages cuts latency.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - NVIDIA
  related: /ai-system-design/genai-system-design/gpu-performance-for-llms
  source: outcome-school
- id: how-would-you-serve-a-large-mixture-of-experts-model-on-a-st
  q: How would you serve a large mixture-of-experts model on a statically scheduled fabric when expert selection is data-dependent?
  a: |
    Static schedules dislike data-dependent routing, so make routing fit a fixed plan: place every expert on dedicated chips, compute routing at each layer, and send tokens through a fixed-size exchange with capacity limits so communication volume is known in advance. Overflow tokens are dropped to a fallback path or rerouted within bounded slots.

    Alternatives are to replicate popular experts, batch tokens per expert in fixed-size tiles, or run all experts on every token for the small parts of the model where sparsity does not pay. The trade-off is some wasted compute and capacity padding in exchange for predictable latency.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - Groq
  related: /ai-system-design/genai-system-design/mixture-of-experts
  source: outcome-school
- id: what-breaks-when-you-scale-llm-training-from-8-gpus-to-thous
  q: What breaks when you scale LLM training from 8 GPUs to thousands, and how do modern stacks deal with it?
  a: |
    At 8 GPUs, data parallelism over one fast node works. At thousands, the model and optimizer no longer fit per GPU, communication across nodes becomes a bottleneck, hardware failures happen daily, and very large global batches change optimization behavior. Small numerical issues such as loss spikes become run-killers.

    Modern stacks combine sharded data parallelism (ZeRO or FSDP), tensor parallelism within a node, pipeline parallelism across nodes and, for MoE, expert parallelism, overlapping communication with compute. They add frequent asynchronous checkpointing and automatic restart, careful learning-rate and batch-size schedules, bf16 or FP8 with stability tricks, and monitoring to catch spikes and bad nodes early.
  level: Senior
  category: inference-gpu
  subcategory: distributed
  companies:
    - Meta
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: explain-data-tensor-and-pipeline-parallelism
  q: Explain data, tensor and pipeline parallelism.
  a: |
    Data parallelism replicates the model and splits batches, averaging gradients, with ZeRO or FSDP sharding the states to save memory. Tensor parallelism splits individual weight matrices across GPUs, usually inside one server because it needs fast links. Pipeline parallelism places groups of layers on different GPUs and streams micro-batches through them. Large training runs combine all three.
  level: Senior
  category: inference-gpu
  subcategory: distributed
- id: how-would-you-cut-llm-serving-cost-by-10x-enumerate-every-le
  q: How would you cut LLM serving cost by 10x? Enumerate every lever and rank them.
  a: |
    Rank levers by impact per effort. First, avoid work: cache responses and prompt prefixes, trim prompts and outputs, and route easy requests to smaller models. Second, use a smaller model: distill or fine-tune a small model for high-volume tasks, often the single biggest win. Third, squeeze the serving engine: continuous batching at higher batch sizes, paged KV cache, quantization to FP8 or INT4, and speculative decoding.

    Then optimize the platform: right-size and autoscale GPUs, use cheaper hardware or spot capacity for offline work, batch APIs for non-interactive jobs, and MoE models for better quality per FLOP. Measure cost per successful task with quality evaluations at each step, because several of these levers trade quality for cost.
  level: Senior
  category: inference-gpu
  subcategory: cost-optimization
  companies:
    - Amazon
    - Cursor
    - Microsoft
    - NVIDIA
  related: /ai-system-design/genai-system-design/cost-latency-optimization
