- id: what-is-speculative-decoding-why-is-output-quality-preserved
  q: What is speculative decoding? Why is output quality preserved, and when does it not help?
  a: |
    A cheap draft model, or extra heads on the main model, proposes several tokens. The large target model scores all of them in one forward pass and accepts drafted tokens according to a rejection-sampling rule; at the first rejection it samples a corrected token. Because acceptance uses the target model's probabilities, the output distribution is mathematically the same as sampling from the target alone.

    It helps when decoding is memory-bound and the draft is often right, giving several tokens per expensive pass. It helps little or hurts at high batch sizes, where the GPU is already compute-bound, when the draft rarely agrees with the target (for example creative, high-temperature text), or when the draft itself is too slow.
  level: Senior
