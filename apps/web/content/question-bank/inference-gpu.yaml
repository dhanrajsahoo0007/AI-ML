- id: the-onboard-compute-budget-is-fixed-walk-me-through-quantizi
  q: The onboard compute budget is fixed. Walk me through quantizing and pruning a vision model without losing recall on small objects.
  a: |
    Start with a per-slice evaluation that tracks recall on small and distant objects separately, since aggregate metrics hide their degradation. Quantize with calibration data that includes many small-object scenes, keep the early high-resolution layers and detection heads in higher precision where they are most sensitive, and use quantization-aware training to recover accuracy.

    Prune structurally (channels or blocks) so the hardware actually speeds up, prefer pruning from later, redundant layers, and fine-tune after pruning, ideally with distillation from the full model. Measure latency on the real onboard chip and stop at the point where small-object recall drops below the safety threshold.
