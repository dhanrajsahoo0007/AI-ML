- id: do-the-roofline-maths-how-many-tokens-sec-can-one-h100-produ
  q: "Do the roofline maths: how many tokens/sec can one H100 produce for a 70B model at batch size 1?"
  a: |
    At batch 1, decode reads every weight once per token and does about 2 FLOPs per parameter, far below the H100's ridge point of roughly 300 FLOPs per byte, so it is bandwidth-bound. A 70B model in BF16 is 140 GB and does not fit in 80 GB, so on one H100 it must be quantized: at 8-bit (70 GB), the ceiling is 3.35 TB/s ÷ 70 GB ≈ 48 tokens per second; at 4-bit (about 35 GB), about 95.

    Real numbers land at perhaps 60–80% of these bounds after KV cache reads, dequantization and kernel overheads. Compute is not the constraint: 48 tokens per second × 140 GFLOPs is only about 7 TFLOPS, under 1% of peak.
