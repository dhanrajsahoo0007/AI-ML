- id: an-lpu-has-no-hbm-at-all-just-on-die-sram-redo-the-decode-ro
  q: An LPU has no HBM at all, just on-die SRAM. Redo the decode roofline argument for that machine and tell me what changes.
  a: |
    On a GPU, decode is bound by reading weights from HBM at a few TB/s. With weights resident in on-chip SRAM, each chip reads its share of weights at far higher bandwidth, so the memory roof rises dramatically and single-stream decode can be much faster, especially at small batch sizes where GPUs struggle.

    The new constraint is capacity: each chip holds only hundreds of megabytes, so a large model is spread across hundreds of chips, and performance depends on the interconnect passing activations between chips and on the compiler's static schedule. KV cache also has to live in SRAM or be limited, which constrains context length and concurrency.
