- id: estimate-the-kv-cache-memory-for-serving-mistral-7b-and-desi
  q: Estimate the KV-cache memory for serving Mistral 7B, and design the rolling-buffer cache that sliding-window attention enables.
  a: |
    Mistral 7B has 32 layers and 8 KV heads of dimension 128, so at 2 bytes the cache is 2 × 32 × 8 × 128 × 2 ≈ 128 KB per token. With a 4,096-token sliding window, a sequence never needs more than about 512 MB of cache, however long it gets.

    Because each layer only attends to the last 4,096 positions, the cache can be a fixed-size circular buffer per sequence: position i is written to slot i mod 4096, overwriting the entry that just fell out of the window. Memory per sequence becomes constant, and the attention kernel reads the buffer with positions reconstructed from the write index.
