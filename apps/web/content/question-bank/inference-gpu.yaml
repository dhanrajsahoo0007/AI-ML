- id: dialogues-here-average-around-180-messages-design-the-cache
  q: Dialogues here average around 180 messages. Design the cache that sits between turns.
  a: |
    Keep each active conversation's KV cache between turns so the next turn only prefills the new message. Use a tiered store: GPU memory for active chats, host memory and then SSD for idle ones, with eviction by recency and expected return time, and route each user back to the server that holds their cache.

    Because conversations are long, keep the cache compact (small KV architecture, quantized cache), cache the shared character definition prefix once for all users of that character, and periodically summarize or trim very old turns. Measure cache hit rate, prefill saved and the latency cost of restoring caches from slower tiers.
  level: Senior
  category: inference-gpu
  subcategory: cost-optimization
  companies:
