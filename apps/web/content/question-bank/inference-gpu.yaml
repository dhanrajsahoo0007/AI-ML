- id: explain-speculative-decoding-when-does-it-help-when-does-it
  q: Explain speculative decoding. When does it help, when does it hurt, and why adapt the speculator to live traffic?
  a: |
    A draft model proposes several tokens; the target model verifies them in one pass and keeps the accepted prefix, preserving the target's output distribution. It helps at low and moderate batch sizes where decoding is memory-bound and the draft agrees with the target often.

    It hurts at high batch sizes, where verification work competes with compute that is already saturated, and when acceptance rates are low, for example with off-domain prompts or high temperature. Adapting the speculator to live traffic, by training or tuning the draft on recent production prompts, keeps acceptance high as usage shifts, which is where most of the speedup comes from.
