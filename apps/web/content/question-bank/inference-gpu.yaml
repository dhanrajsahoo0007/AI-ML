- id: what-is-continuous-in-flight-batching-and-why-did-it-replace
  q: What is continuous (in-flight) batching and why did it replace static batching?
  a: |
    Static batching groups requests, runs them together, and waits for the longest one to finish before starting the next batch, so slots sit idle as short responses finish and new requests queue.

    Continuous batching schedules at the level of each decode iteration: finished sequences leave immediately and waiting ones join the running batch on the next step. GPUs stay full despite very different output lengths, which raises throughput several-fold and cuts queueing delay, so every major serving engine uses it.
