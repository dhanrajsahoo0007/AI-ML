- id: the-note-should-be-ready-before-the-clinician-leaves-the-roo
  q: The note should be ready before the clinician leaves the room. Build me the latency budget, and tell me where the money goes.
  a: |
    Stream audio to speech recognition during the visit, so transcription is nearly done when the conversation ends. Then the remaining budget, perhaps 30–60 seconds, covers finalizing the transcript, speaker roles, extracting clinical facts and generating the structured note with an LLM, plus validation checks.

    Most money goes to long-audio ASR and to LLM processing of long transcripts. Save by streaming ASR on efficient models, incremental summarization during the visit so the final step processes less, smaller fine-tuned models for extraction, and reserving the largest model for the final note.
