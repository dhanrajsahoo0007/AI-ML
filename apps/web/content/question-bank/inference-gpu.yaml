- id: determinism-is-the-headline-claim-what-does-it-actually-buy
  q: Determinism is the headline claim. What does it actually buy at p99, and why does it matter especially for agentic workloads?
  a: |
    A statically scheduled machine executes the same program with the same timing every time, without dynamic scheduling, cache misses or contention, so latency per token is nearly constant. That shrinks the gap between median and p99 latency, which is what users and SLAs feel.

    Agentic workloads chain many model calls in sequence, so the end-to-end time is roughly the sum of each call's latency, and tail latencies compound across steps. Predictable per-call latency makes multi-step agents faster at the tail and easier to budget, and deterministic outputs also help reproducibility and debugging.
