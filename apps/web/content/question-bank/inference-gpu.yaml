- id: what-is-chunked-prefill-and-why-does-it-improve-tail-latency
  q: What is chunked prefill, and why does it improve tail latency under mixed traffic?
  a: |
    Chunked prefill splits a long prompt's prefill into fixed-size chunks and schedules them alongside ongoing decode steps, instead of running the whole prefill at once.

    Without it, a single long prompt arriving in a busy batch stalls every other sequence's decode for the duration of its prefill, creating big latency spikes for other users. Mixing chunks of prefill with decode keeps per-step time bounded and predictable, which tightens p99 inter-token latency and improves GPU utilization, at the cost of a slightly longer time to first token for the long request.
