- id: design-the-serving-stack-for-a-claude-scale-llm-api-maximise
  q: Design the serving stack for a Claude-scale LLM API. Maximise GPU utilisation without wrecking p99 latency.
  a: |
    Put an API gateway in front for authentication, token-based rate limits and quotas, then a router that is aware of models, tenants and cached prefixes. Run inference engines with continuous batching, paged KV cache, prefix caching and speculative decoding, using tensor parallelism inside nodes and disaggregated prefill and decode pools at scale. Separate interactive and batch traffic into priority classes.

    To protect p99 while keeping GPUs busy, cap per-replica batch size and KV memory by latency SLOs, use chunked prefill, admission control and load shedding for low-priority traffic, and autoscale on queue depth and tokens per second. Track TTFT, inter-token latency, utilization and cost per token by model and tenant, with fast rollback for engine changes.
