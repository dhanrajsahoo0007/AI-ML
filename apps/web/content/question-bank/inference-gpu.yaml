- id: on-a-gpu-you-batch-to-amortise-weight-reads-what-is-the-batc
  q: On a GPU you batch to amortise weight reads. What is the batching calculus on an SRAM-only machine, and how should that change how we price?
  a: |
    On a GPU, batching amortizes slow HBM weight reads across many sequences, so cost per token falls steeply with batch size while per-user speed falls slowly. On an SRAM-only, pipelined machine, weight reads are already cheap, so per-stream speed is high even at small batch; throughput comes from keeping many sequences in flight through the pipeline stages rather than from large batches on one chip.

    Pricing should therefore reward what the machine is good at: premium pricing for low-latency, high-speed streams, and capacity-based pricing that keeps the pipeline full, rather than discounts tied to big batch sizes. Context length and KV memory are the scarce resources and may deserve their own pricing.
