- id: design-a-rate-limiter-for-an-llm-api-where-cost-scales-with
  q: Design a rate limiter for an LLM API where cost scales with tokens, not requests.
  a: |
    Limit tokens, not requests: use a token bucket per tenant and model that is debited by estimated input tokens plus requested maximum output tokens on admission, then corrected with actual usage when the response finishes. Keep separate limits for input and output tokens and for concurrent requests, since long generations hold GPU capacity.

    Store counters in a fast shared store such as Redis with atomic operations, return clear headers with remaining budget and retry-after on 429s, and add priority tiers and burst allowances. Protect the backend with a global admission controller that sheds low-priority load when queues grow, independent of per-tenant limits.
  level: Mid
  category: inference-gpu
  subcategory: cost-optimization
  companies:
