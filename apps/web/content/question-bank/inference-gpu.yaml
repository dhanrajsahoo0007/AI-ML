- id: how-do-you-deploy-a-capable-assistant-on-cost-sensitive-or-o
  q: How do you deploy a capable assistant on cost-sensitive or on-device hardware without a datacentre GPU? Walk through the efficiency toolkit.
  a: |
    Start with a small, strong model, often distilled from a larger one for your tasks. Quantize to 8 or 4 bits with good calibration, use efficient runtimes such as llama.cpp, ONNX Runtime, Core ML or TensorRT for the target chip, and keep context short with retrieval instead of huge prompts.

    Add speculative decoding with a tiny draft model, cache prompts, and route only hard requests to a cloud model if connectivity allows. Measure on the real device for latency, memory, battery and heat, and evaluate quality on your own tasks, because quantization and small models degrade unevenly.
