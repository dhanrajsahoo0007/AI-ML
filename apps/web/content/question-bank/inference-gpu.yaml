- id: what-does-tensorrt-tensorrt-llm-actually-do-to-a-model-to-ma
  q: What does TensorRT / TensorRT-LLM actually do to a model to make it faster, and when will it not help?
  a: |
    It compiles the model into an optimized engine for a specific GPU: fusing layers and element-wise operations into fewer kernels, choosing the fastest kernel implementations for each shape, using lower precision such as FP8 or INT8 with calibrated scales, and optimizing memory layout. TensorRT-LLM adds LLM-specific pieces: in-flight batching, paged KV cache, optimized attention kernels, multi-GPU parallelism and speculative decoding.

    It will not help much when the bottleneck is elsewhere, such as tokenization, network, retrieval or CPU-side orchestration, when shapes are highly dynamic, when the model uses unsupported custom operations, or when you are already bandwidth-limited on a well-optimized engine. It also costs build time and flexibility.
