- id: tell-me-about-a-performance-optimisation-you-shipped-give-me
  q: Tell me about a performance optimisation you shipped. Give me the numbers, and tell me why I should believe them.
  a: |
    Use a real story with numbers: the metric (p99 latency, tokens per second, cost per million tokens), the baseline, the bottleneck you found and how (profiler traces, roofline analysis), the change, and the measured result. For example, a fused attention kernel or a scheduler change that moved a metric by a stated percentage.

    Make it believable by explaining the measurement: representative workload and traffic mix, repeated runs with variance, both median and tail, verification that quality did not change, and how the result held in production after rollout. Admit what did not work and what limits remained.
