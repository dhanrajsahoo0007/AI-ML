- id: you-train-natively-in-int8-rather-than-doing-post-training-q
  q: You train natively in int8 rather than doing post-training quantization. Defend that.
  a: |
    If the model will be served in int8 anyway, training in int8 means the weights are learned to work at that precision, so there is no gap between the model you evaluated and the model you serve, and no quality lost to post-hoc rounding. It also speeds up training and cuts memory, which lowers cost at scale.

    The risks are training instability and the engineering effort of low-precision kernels, scaling and optimizer handling. The defense is that, for a product where serving cost dominates, matching training and serving precision gives the best quality per serving dollar.
