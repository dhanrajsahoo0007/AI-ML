  source: outcome-school
- id: budget-the-compute-and-latency-for-the-onboard-stack-what-br
  q: Budget the compute and latency for the onboard stack. What breaks when a model gets bigger?
  a: |
    The onboard stack runs sensor preprocessing, perception, prediction and planning in a loop that must finish within a fixed cycle, for example around 100 ms end to end, within a fixed power and compute envelope shared by all models. Each stage gets a latency budget with headroom for worst-case scenes such as dense traffic.

    When a model grows, it eats into other stages' budgets, worst-case latency rises in crowded scenes, memory and power limits are hit, and thermal throttling can make latency unpredictable. Bigger models must be paired with quantization, pruning or distillation, and validated against worst-case timing, not averages, before they ship.
  level: Senior
  category: inference-gpu
  subcategory: gpu-performance
  companies:
