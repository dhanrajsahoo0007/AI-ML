- id: a-copilot-chat-feature-has-a-p95-budget-of-3-seconds-to-firs
  q: A Copilot chat feature has a p95 budget of 3 seconds to first useful content. Where does the time go, and how do you cut it?
  a: |
    Break the path down: client and network, authentication, context gathering (retrieval, permissions, document fetching), prompt assembly, safety checks, queueing at the model, prefill, and first tokens. Instrument each span at p95, not averages; retrieval and long prompts are usually the biggest items.

    Cut it by running retrieval and safety checks in parallel, caching user and tenant context, shrinking the prompt with better retrieval and prefix caching of the stable system prompt, using a smaller or faster model for the first response, streaming immediately, and reserving capacity or priority for interactive traffic. Show useful partial content, such as a plan or citation list, while the answer generates.
