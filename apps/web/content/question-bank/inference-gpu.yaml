- id: you-need-to-serve-a-llama-class-70b-model-to-hundreds-of-mil
  q: You need to serve a Llama-class 70B+ model to hundreds of millions of assistant users. What does the serving stack look like and where does the money go?
  a: |
    The stack is a global API layer with routing to regional GPU clusters, each running many replicas of an optimized engine (continuous batching, paged KV cache, FP8 or INT8 weights, prefix caching, speculative decoding) with tensor parallelism inside 8-GPU nodes. Conversation state, safety filters, retrieval and tool calls run as separate services around the model.

    Most money goes to GPU hours for decode, which is memory-bandwidth-bound, then prefill of long conversation histories, then idle headroom kept for peak traffic. Biggest savings come from routing simple turns to smaller models, prefix caching of history, quantization, high batch occupancy, and shifting non-urgent work to off-peak capacity.
