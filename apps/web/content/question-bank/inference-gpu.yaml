- id: our-serving-cost-is-dominated-by-kv-cache-not-weights-get-it
  q: Our serving cost is dominated by KV cache, not weights. Get it down by an order of magnitude and tell me what you give up.
  a: |
    Attack bytes per token of cache: move to MQA or fewer KV heads, share KV across adjacent layers, interleave local sliding-window attention layers with a few global layers so most layers cache only a short window, and quantize the cache to 8 bits. Combined, these can cut cache memory by well over an order of magnitude, and Character.AI has publicly described using this kind of combination.

    You give up some quality on long-range recall and exact retrieval from early in the conversation, some training work to adopt the new architecture, and a little precision. Validate on long-dialogue evaluations to make sure persona consistency and recall hold.
