- id: you-need-to-run-a-3b-parameter-language-model-on-a-phone-wit
  q: You need to run a ~3B-parameter language model on a phone with tight memory and power budgets. What changes versus serving the same model in a datacenter?
  a: |
    Memory and power, not peak FLOPs, become the limits. A 3B model in 16-bit is 6 GB, too much for a phone sharing memory with apps, so weights are quantized to 4 bits or less (about 1.5 GB) with careful calibration and sometimes quantization-aware training. Decode is bound by the phone's much lower memory bandwidth, so tokens per second is low and must be planned for.

    Other changes: use the phone's neural engine or GPU through its native runtime, keep context short and the KV cache small or quantized, avoid sustained bursts that cause thermal throttling, load the model lazily and share it across features with adapters, and fall back to a server model for heavy requests.
