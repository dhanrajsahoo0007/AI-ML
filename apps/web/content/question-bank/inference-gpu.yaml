- id: you-need-to-quantize-a-model-for-a-customer-s-hardware-how-d
  q: You need to quantize a model for a customer's hardware. How do you choose a scheme, and how do you prove quality hasn't regressed?
  a: |
    Start from the hardware: which formats it accelerates (FP8, INT8, INT4), memory capacity and whether the workload is memory-bound decode or compute-bound prefill. Pick candidates accordingly, for example FP8 on newest GPUs, INT8 weight-and-activation for broad support, or 4-bit weight-only with AWQ or GPTQ when memory is tight, and calibrate on data that matches the customer's domain.

    Prove quality with the customer's own evaluation set plus general benchmarks, comparing against the full-precision model on task metrics, long-context and multilingual behavior, and output agreement. Check speed and memory gains on the real hardware, and keep the unquantized model as a fallback for any task that regresses.
