- id: design-the-scheduler-for-a-continuous-batching-inference-eng
  q: Design the scheduler for a continuous-batching inference engine.
  a: |
    Each iteration, the scheduler chooses which sequences run: all running decodes plus as many waiting requests' prefill chunks as fit within a token budget per step and the available KV cache blocks. It admits requests by priority and arrival time, reserves or allocates cache blocks on demand, and preempts low-priority sequences when memory runs out, either swapping their cache to CPU or recomputing later.

    Key policies: a per-step token budget to bound latency, chunked prefill to mix prefill with decode, prefix-cache-aware admission, fairness across tenants, and SLO-aware ordering so interactive requests meet time-to-first-token targets. Expose metrics on queue time, preemptions and cache utilization to tune it.
