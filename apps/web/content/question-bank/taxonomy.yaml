- slug: inference-gpu
  title: Inference & GPU
  group: Generative AI & LLMs
  icon: cpu
  description: Serving LLMs fast and cheaply, from KV cache and batching to quantization and GPU performance.
  study:
    - /ai-system-design/genai-system-design/llm-serving-inference
    - /ai-system-design/genai-system-design/gpu-performance-for-llms
    - /ai-system-design/genai-system-design/efficient-attention
  subsections:
    - { slug: serving-batching, title: Serving & Batching, description: Inference engines, continuous batching, latency metrics and throughput. }
    - { slug: kv-cache-attention, title: KV Cache & Efficient Attention, description: KV cache sizing, paged attention, FlashAttention and GQA. }
    - { slug: quantization, title: Quantization & Compression, description: INT8, FP8 and 4-bit quantization, pruning and distillation for speed. }
    - { slug: decoding-speedups, title: Decoding Speedups, description: Speculative decoding, prefix caching and other decoding optimizations. }
    - { slug: gpu-performance, title: GPU Performance, description: Roofline, memory bandwidth, kernels and hardware choices. }
    - { slug: distributed, title: Distributed Training & Inference, description: Data, tensor, pipeline and expert parallelism and multi-GPU communication. }
    - { slug: cost-optimization, title: Cost & Capacity, description: Cost per token, capacity planning, routing and caching. }

