# Interview question categories and their subsections.
# Every question in this folder has `category` and `subcategory` keys that match a slug here.
# `group` places the category on the /interviews index; `study` links are shown on the category page.

- slug: llm-foundations
  title: LLM Foundations
  group: Generative AI & LLMs
  icon: brain
  description: How transformers and LLMs work inside, from attention and positions to tokenizers, architectures and pretraining.
  study:
    - /ai-system-design/genai-system-design/transformer-architecture
    - /ai-system-design/genai-system-design/self-attention-explained
    - /ai-system-design/genai-system-design/scaling-laws-and-training
  subsections:
    - { slug: attention, title: Attention & Transformers, description: Self-attention, multi-head attention, the transformer block and its variants. }
    - { slug: positional-encoding, title: Positional Encoding, description: Sinusoidal, learned, RoPE and ALiBi positions and long-context extension. }
    - { slug: tokenization-embeddings, title: Tokenization & Embeddings, description: BPE, WordPiece, vocabularies and token and sentence embeddings. }
    - { slug: architectures, title: Model Architectures, description: Encoder, decoder and encoder-decoder families, mixture of experts and state-space models. }
    - { slug: pretraining-scaling, title: Pretraining & Scaling, description: Pretraining objectives, scaling laws, data mixtures and training at scale. }
    - { slug: llm-behaviour, title: LLM Behaviour & Decoding, description: Sampling, temperature, emergent abilities, reasoning and context limits. }

- slug: prompt-engineering
  title: Prompt Engineering
  group: Generative AI & LLMs
  icon: message-square
  description: Prompting techniques, structured output and managing prompts as production artifacts.
  study:
    - /ai-system-design/genai-system-design/prompt-engineering-types
    - /ai-system-design/ml-system-design/structured-output-generation
  subsections:
    - { slug: techniques, title: Prompting Techniques, description: Zero-shot, few-shot, chain-of-thought, self-consistency and role prompting. }
    - { slug: structured-output, title: Structured Output, description: JSON schemas, constrained decoding and reliable parsing. }
    - { slug: prompt-ops, title: Prompt Management, description: Versioning, testing and optimizing prompts in production. }
    - { slug: context-engineering, title: Context Engineering, description: "Choosing, ordering, compressing and budgeting everything the model sees: instructions, retrieved data, tools, memory and history." }

- slug: rag
  title: RAG
  group: Generative AI & LLMs
  icon: search
  description: Retrieval-augmented generation from basic pipelines to agentic and graph-based retrieval.
  study:
    - /ai-system-design/genai-system-design/rag-fundamentals
    - /ai-system-design/genai-system-design/advanced-rag
    - /ai-system-design/genai-system-design/knowledge-graph-systems
  subsections:
    - { slug: rag-fundamentals, title: RAG Fundamentals, description: The retrieve-then-generate pipeline, when to use RAG and how it compares with fine-tuning. }
    - { slug: chunking-ingestion, title: Chunking & Ingestion, description: Document parsing, chunking strategies and embedding pipelines. }
    - { slug: vector-search, title: Vector Search & Databases, description: Embedding models, ANN indexes, hybrid search and vector databases. }
    - { slug: advanced-rag, title: Advanced RAG, description: Query rewriting, re-ranking, multi-hop retrieval and context compression. }
    - { slug: agentic-rag, title: Agentic RAG, description: Agents that decide when, where and how to retrieve, and iterate on results. }
    - { slug: graph-rag, title: Graph RAG, description: Knowledge graphs, entity extraction and graph-based retrieval. }
    - { slug: rag-evaluation, title: RAG Evaluation, description: Retrieval metrics, faithfulness, answer quality and debugging RAG failures. }

