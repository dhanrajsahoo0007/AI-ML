# Company-specific culture/values rounds (Meta, Google, Apple, Netflix, Stripe, Airbnb, Uber, Palantir) and Frontier AI Lab values questions. All answers are written by TokensToScale.
- id: company-meta-jedi-google-gnl-comparison
  q: Tell me about a time you navigated severe ambiguity to ship rapid impact, and how you made sure every voice on the team was heard along the way.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
    - Google
    - Apple
    - Netflix
    - Microsoft
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/company-playbooks/google-googleyness-and-leadership
  a: |-
    **What interviewers are testing.** Meta's **Jedi** behavioral round and Google's **Googleyness & Leadership (G&L)** round both probe how you operate when there is no playbook, without steamrolling quieter teammates or cutting ethical corners.

    | Dimension | Meta Jedi Focus | Google G&L Focus |
    | --- | --- | --- |
    | Speed & Ambiguity | *Move Fast* & *Focus on Long-Term Impact*: prototyping to create clarity | Thriving in ambiguity: synthesizing conflicting inputs into a clear technical plan |
    | Collaboration | *Be Direct and Respect Your Colleagues*: candid code/design reviews | Psychological safety: actively drawing out dissenting or junior perspectives |
    | Self-awareness | *Be Open*: owning mistakes publicly and iterating fast | Intellectual humility: changing your mind rapidly when shown better data |

- id: company-stripe-airbnb-uber-palantir-rigor
  q: Walk me through a system or feature where you had to balance extreme correctness and user trust (such as billing, safety, or messy field data) against delivery speed.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: stripe-airbnb-uber-enterprise
  companies:
    - Stripe
    - Airbnb
    - Uber
    - DoorDash
    - Palantir
  topics:
    - /behavioral/company-playbooks/stripe-airbnb-and-fintech
    - /behavioral/company-playbooks/uber-doordash-and-palantir
  a: |-
    **What interviewers are testing.** High-bar product and infrastructure companies (Stripe *Users First* & *Exothermic*, Airbnb *Host* & *Champion the Mission*, Uber/DoorDash Bar Raiser, Palantir Decomposition) test **micro-pessimism paired with macro-optimism**: assuming every network call, webhook, and data feed will fail or duplicate in production, and designing idempotent, auditable systems that protect the user's money and trust.

- id: company-ai-ml-offline-online-gap-story
  q: Tell me about a time an ML model or LLM pipeline you built looked great on offline benchmarks but underperformed or failed in production. How did you diagnose and fix it?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
  companies:
    - OpenAI
    - Anthropic
    - Google DeepMind
    - Meta
    - Consumer-Scale ML
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
    - /behavioral/company-playbooks/frontier-ai-labs-values
  a: |-
    **What interviewers are testing.** Real-world AI/ML maturity. Anyone can recite textbook definitions of data leakage or distribution shift; interviewers probe for the **exact forensic workflow** you used when offline metrics (AUC, NDCG, or LLM-as-judge win rate) diverged from online business metrics or human user satisfaction.

    **Four failure modes to anchor your story:**

    1. **Train-serve or prompt-context skew:** Feature pipelines or RAG chunking behaving differently in real-time serving vs. batch evaluation.
    2. **Proxy metric Goodharting:** Optimizing click-through rate or judge verbosity at the expense of downstream task completion.
    3. **Latency eating quality:** A 3x larger model improving offline accuracy by 2% while adding 900 ms of p95 latency that caused user abandonment.
    4. **Unrepresentative eval golden sets:** Eval sets missing adversarial, multi-turn, or long-tail production queries.

- id: company-frontier-ai-safety-vs-capability-tension
  q: Tell me about a time you discovered a safety, reliability, privacy, or alignment risk right before a high-visibility launch. How did you handle the tension between shipping speed and safety?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: ai-views
  companies:
    - Anthropic
    - OpenAI
    - Google DeepMind
  topics:
    - /behavioral/company-playbooks/frontier-ai-labs-values
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What interviewers are testing.** Frontier AI labs (Anthropic, OpenAI, DeepMind) explicitly evaluate **epistemic honesty** and **calibrated safety judgment**. They reject two extremes: reckless shipping ("we'll fix jailbreaks or PII leaks if users complain") and unquantified alarmism ("we must halt the launch indefinitely without measuring the failure rate").

    **How to demonstrate frontier-lab judgment:**

    - **Quantify the failure rate and severity:** Run a red-team or automated evaluation harness to measure exact prevalence and worst-case harm.
    - **Engineer layered mitigations:** Combine input/output classifiers, constitutional/system-prompt constraints, tool-permission sandboxing, or staged rollout gates so capability and safety advance together.
    - **State uncertainties plainly:** Distinguish between risks your mitigation provably bounds and residual risks that require active production telemetry and kill switches.

- id: company-apple-quality-bar-across-boundaries
  q: Tell me about a time you held a high quality bar on work that crossed team, platform or hardware and software boundaries.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Apple
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
  a: |-
    **What interviewers are testing.** Apple organises engineers by function, so most features need several specialist teams. The interviewer wants to see that you cared about the finished experience, including the parts outside your own code, and that you kept the bar without damaging the working relationship.

    **How to structure your answer (STAR+L):**

    - **Situation & Task:** Name the feature, the teams involved and the quality gap you noticed. Give a number: a memory budget, a frame time, a battery cost or an error rate.
    - **Action:** Show how you measured the gap, how you raised it with the other team as a shared problem, and what you built or changed yourself to close it. Name one option you rejected and why.
    - **Result:** State the before and after numbers and what the user would have noticed.
    - **Learning:** Say what check or budget you added so the gap is caught earlier next time.

    **Red flags to avoid.** Blaming the other team, describing polish with no measurement, or sharing details your current employer would treat as confidential. Respecting confidentiality is itself a good signal here.

- id: company-netflix-decision-after-seeking-dissent
  q: Tell me about a decision you owned where you asked for opposing views before you made the call.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Netflix
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
  a: |-
    **What interviewers are testing.** Netflix's culture memo describes one person owning a decision after gathering disagreement from others. The interviewer checks three things: that you sought out people likely to disagree, that their input changed something, and that you then decided without waiting for a vote.

    **How to structure your answer (STAR+L):**

    - **Situation & Task:** Describe the decision, why it was yours to make and what was at stake.
    - **Action:** Say who you asked and why you chose them. Give the strongest objection you heard in their words. Explain what you changed because of it and what you kept. Then state the decision and how you told the people who disagreed.
    - **Result:** Give the outcome with a number, and say whether the objection turned out to be right in part.
    - **Learning:** Say how you now collect disagreement on decisions of this size.

    **Red flags to avoid.** Asking only people who agree with you, describing a group vote as your decision, or telling a story where nobody's feedback changed anything.

- id: company-microsoft-changed-approach-after-learning
  q: Tell me about a time you were wrong about a technical approach and changed course after learning from someone else.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Microsoft
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
  a: |-
    **What interviewers are testing.** Microsoft describes its culture as a growth mindset: learning matters more than already knowing. Interviewers also look for work that builds on other teams and helps them in return. They want a real case where you held a view, met evidence against it and changed.

    **How to structure your answer (STAR+L):**

    - **Situation & Task:** State the approach you first believed in and why it seemed right.
    - **Action:** Describe the evidence or the person that showed you were wrong. Explain how you tested it, what you changed, and how you gave credit. If you reused another team's platform instead of building your own, say so.
    - **Result:** Give the outcome with a number, and name what the other team gained as well.
    - **Learning:** Say which habit changed, for example testing your own assumption first or asking the owning team earlier.

    **Red flags to avoid.** A story where you were right all along, a vague "I learned to listen", or taking credit for work that another team did.

- id: company-meta-most-proud-of-building
  q: What are you most proud of building, and what was your part in it?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Motivation and ownership. Meta lists this among the questions to expect. The interviewer wants to hear what you care about, what you personally did, and how large the work was, because the size of the story is used to judge your level.

    **How to shape the answer.**

    - **Situation and task.** Say what the product or system was, who used it and why it mattered to you.
    - **Action.** Give the three decisions that were yours. Say how many people worked on it and what you owned.
    - **Result.** Give the effect on users or on the system as a number.
    - **Learning.** Say what you would do better. Meta lists that as a question too.

    **A strong answer sounds like this.** "I am proudest of the offline mode in our field app. Technicians lost a morning of work each week when the signal dropped. I proposed it, wrote the sync design and led four engineers for a quarter. I chose to merge changes field by field, because whole-record merges would have lost notes. Lost-work reports fell from about 60 a week to 2. I would test on real devices earlier: we found a storage limit late."

    **Watch out for.** A project you only helped on, pride in the technology with no user in the story, and a story sized for a lower level than the one you are interviewing for.
  followUps:
    - q: Why did that problem matter to you?
      level: Mid
      companies: [Meta]
      a: |-
        Give a reason that is about users or the team, and make it specific: who was hurt and how you found out. Avoid "it was interesting technically" as the whole answer. The interviewer is listening for what will keep you going when the work is hard.
    - q: What would you do better if you did it again?
      level: Mid
      companies: [Meta]
      a: |-
        Name one real mistake and its cost, then the change. For example, you tested on simulators for too long and lost two weeks. A candidate who cannot find a fault in their best work sounds unaware, not strong.

- id: company-meta-pushed-idea-despite-disagreement
  q: Tell me about a time you pushed an idea forward when other people disagreed with it.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Being proactive, and handling disagreement directly. Meta lists a question of this kind. The interviewer checks that you started something, that you dealt with the people who disagreed yourself, and that you used evidence.

    **How to shape the answer.**

    - **Situation and task.** State the idea and who disagreed. Give their reason fairly.
    - **Action.** Say how you tested the idea cheaply, who you spoke to one to one, and what you changed because of what they said.
    - **Result.** Give the outcome with a number, and say what happened to the working relationship.
    - **Learning.** Say how you now raise ideas that cut across other people's work.

    **A strong answer sounds like this.** "I wanted to drop a nightly rebuild of our search index and update it as records changed. The team lead disagreed: the rebuild was simple and had never failed. I asked what would change his mind, and he said proof that updates would not drift. I ran both for two weeks and compared them each night. They matched, and results were fresh in 30 seconds, not a day. He asked for a weekly check to stay, which I added. We shipped it together."

    **Watch out for.** Going to a manager before talking to the person, a story where the others were simply wrong, and pushing an idea through without changing anything in it.
  followUps:
    - q: What was their strongest point?
      level: Senior
      companies: [Meta]
      a: |-
        State it as they would, and say what you did about it. If their point changed your design, say how. Being able to argue the other side well is the signal here.
    - q: Did you involve your manager? Why, or why not?
      level: Senior
      companies: [Meta]
      a: |-
        If you did not, say that you wanted to settle it directly and explain how. If you did, say what you had tried first and what you asked the manager for: a decision, not a rescue. Raising everything upward reads as a lower level.

- id: company-meta-conflict-with-colleague
  q: Tell me about a conflict with a colleague. How did you handle it?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Conflict resolution and empathy. Meta lists "how do you handle conflict" among its example questions, and its guide says that talking about a real conflict will not count against you. The interviewer wants a real disagreement between people, what you did about it yourself, and whether you understood the other person.

    **How to shape the answer.**

    - **Situation and task.** Describe the disagreement and what was at stake. Keep it to behaviour, not character.
    - **Action.** Say what you did to understand their side, what you said to them directly, and what you both agreed to change.
    - **Result.** Give the outcome for the work and for the relationship.
    - **Learning.** Say what you do earlier now.

    **A strong answer sounds like this.** "A designer and I disagreed about an animation that made our feed feel slow on older phones. She felt I was cutting her work without asking. I asked for half an hour, showed her the frame times on a three-year-old phone and asked what the animation was for. It was meant to show that new items had arrived. We kept that and replaced the animation with a lighter one. Scroll stutter fell by half. We now review motion on an old phone together before build."

    **Watch out for.** Describing the other person as difficult, a conflict that was really a small difference of opinion, and an ending where you won and they lost.
  followUps:
    - q: What would they say about how it went?
      level: Mid
      companies: [Meta]
      a: |-
        Answer from their side, including what they would say you got wrong. If you asked them afterwards, say so. This checks whether your account is fair.
    - q: What is your working relationship like now?
      level: Mid
      companies: [Meta]
      a: |-
        Give one concrete sign: you still work together, they asked you to review something, or you set up a shared habit. If it stayed cool, say so plainly and say what you learned.

- id: company-meta-feedback-hard-to-hear
  q: Tell me about feedback that was hard to hear. What did you change?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Growth. Meta asks how you like to give and receive feedback and says it looks for how you learned and improved. The interviewer wants a real weakness, not a strength in disguise, and a change that other people could see.

    **How to shape the answer.**

    - **Situation and task.** Say who gave the feedback and what it was, in their words.
    - **Action.** Say how you reacted at first, what you did to check whether it was true, and the habit you changed.
    - **Result.** Give a sign that the change worked, ideally from someone else.
    - **Learning.** Say how you ask for feedback now.

    **A strong answer sounds like this.** "My manager told me that my design documents arrived finished, so nobody could shape them. I did not like hearing it, because I thought finished was good. I asked two teammates and both agreed. I started sharing a one-page outline in the first week and asking for objections. On the next project a teammate caught a wrong assumption on day three that would have cost weeks. I now ask at the end of each project what I should have shared earlier."

    **Watch out for.** A fake weakness such as "I work too hard", feedback you still think was wrong, and a change nobody else would have noticed.
  followUps:
    - q: How do you know the change stuck?
      level: Mid
      companies: [Meta]
      a: |-
        Give evidence from after the first month: a later project where you did the same thing, or a comment from the person who gave the feedback. One example of slipping back and noticing is believable and fine.

- id: company-meta-no-clear-owner-or-plan
  q: Tell me about a time there was no clear owner or plan, and you had to work out what to do.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Working in an unstructured environment. A former Meta interviewer lists this as one of the areas the behavioral round covers. The interviewer wants to see that you found the problem, decided what to do without being told, and brought other people along.

    **How to shape the answer.**

    - **Situation and task.** Describe the gap: what was going wrong and why nobody owned it.
    - **Action.** Say how you sized the problem, what you chose to do first and what you chose not to do, and who you got agreement from.
    - **Result.** Give the outcome with a number, and say who owns it now.
    - **Learning.** Say what tells you early that something has no owner.

    **A strong answer sounds like this.** "Our sign-up emails were landing in spam for one mail provider. Three teams touched email and none owned delivery. I pulled a week of delivery logs and found 18 percent of sign-ups never saw the confirmation. I did not try to fix all email. I fixed the sender records, set up a daily delivery report and proposed that the platform team own it, with the numbers attached. They agreed. Confirmed sign-ups rose by 11 percent. I now check for an owner whenever a number sits between teams."

    **Watch out for.** Waiting to be asked, a problem that was really just a vague ticket, and fixing it alone so that it still has no owner afterwards.
  followUps:
    - q: How did you decide what not to do?
      level: Senior
      a: |-
        Name the things you left out and the reason for each: too large, not yours to change, or low value. Choosing a small first step that proves the problem is a strong signal.
    - q: How many people did it take in the end?
      level: Senior
      a: |-
        Answer plainly. The interviewer is sizing the story to judge level. If it was you alone inside your own area, say so and offer a larger example if you have one.

- id: company-meta-project-got-blocked
  q: Tell me about a project that got blocked. What did you do to get it moving?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Perseverance. A former Meta interviewer lists it as one of the areas the round covers. The interviewer wants a real blocker, several attempts, and a sign that you did not just wait or hand the problem to someone else.

    **How to shape the answer.**

    - **Situation and task.** Say what the project was and exactly what blocked it.
    - **Action.** Give the attempts in order, including the ones that failed, and why you tried the next one.
    - **Result.** Say how it was unblocked and what it cost in time.
    - **Learning.** Say what you do now to find blockers earlier.

    **A strong answer sounds like this.** "Our release was blocked because a partner team's test environment failed one run in five. I first retried the tests, which hid the problem. Then I logged every failure for a week and found they all happened when two test suites shared one account. The partner team had no time, so I sent them a small change that gave each suite its own account, with the failure log. They merged it in a day. Failures went to zero and we shipped nine days late. I now ask about shared test data at project start."

    **Watch out for.** A blocker that solved itself, a story where you only asked someone else to fix it, and leaving out the attempts that failed.
  followUps:
    - q: At what point would you have stopped and changed the plan?
      level: Senior
      a: |-
        Give the limit you had in mind: a date, a cost, or a number of failed attempts, and what the other plan was. This shows that persistence was a choice and not a habit.
- id: tell-me-about-a-time-your-offline-results-didn-t-match-onlin
  q: Tell me about a time your offline results didn't match online results.
  a: |
    Describe the gap, how you investigated it, for example metric misalignment, exposure bias, feature skew or novelty effects, what you changed in evaluation or the model, and how it improved later decisions. This shows mature understanding of experimentation.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
- id: describe-a-time-you-had-to-work-with-messy-or-incomplete-dat
  q: Describe a time you had to work with messy or incomplete data.
  a: |
    Explain how you assessed the data quality, what you fixed, what assumptions you documented, how you validated that conclusions were robust, and how you improved the data source for the future. Interviewers look for rigor and pragmatism.
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
- id: tell-me-about-a-time-you-chose-a-simpler-model-over-a-more-c
  q: Tell me about a time you chose a simpler model over a more complex one.
  a: |
    Describe the requirements, such as latency, interpretability or data size, how you compared options, why the simpler model won on overall value, and the outcome. This shows judgment over novelty.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
- id: describe-a-time-you-raised-an-ethical-or-fairness-concern-ab
  q: Describe a time you raised an ethical or fairness concern about a model.
  a: |
    Explain the concern, how you measured it, for example performance gaps across groups, how you raised it constructively, the changes made, and the result. Show that you balance responsibility with business goals and bring evidence.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
- id: how-do-you-decide-when-a-model-is-good-enough-to-ship
  q: How do you decide when a model is good enough to ship?
  a: |
    Tie it to agreed success criteria: improvement over baseline on the right metrics and segments, acceptable latency and cost, safety and fairness checks, monitoring and rollback readiness, and a plan for online validation. Give an example of making this call.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
