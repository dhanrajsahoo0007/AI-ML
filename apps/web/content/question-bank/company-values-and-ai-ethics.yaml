# Company-specific culture/values rounds (Meta, Google, Apple, Netflix, Stripe, Airbnb, Uber, Palantir) and Frontier AI Lab values questions. All answers are written by TokensToScale.
- id: company-stripe-airbnb-uber-palantir-rigor
  q: Walk me through a system or feature where you had to balance extreme correctness and user trust (such as billing, safety, or messy field data) against delivery speed.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: stripe-airbnb-uber-enterprise
  signals:
    - customer-focus
  topics:
    - /behavioral/company-playbooks/stripe-airbnb-and-fintech
    - /behavioral/company-playbooks/uber-doordash-and-palantir
  a: |-
    **What interviewers are testing.** High-bar product and infrastructure companies (Stripe *Users First* & *Exothermic*, Airbnb *Host* & *Champion the Mission*, Uber/DoorDash Bar Raiser, Palantir Decomposition) test **micro-pessimism paired with macro-optimism**: assuming every network call, webhook, and data feed will fail or duplicate in production, and designing idempotent, auditable systems that protect the user's money and trust.

- id: company-ai-ml-offline-online-gap-story
  q: Tell me about a time an ML model or LLM pipeline you built looked great on offline benchmarks but underperformed or failed in production. How did you diagnose and fix it?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
  signals:
    - judgment
  topics:
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
    - /behavioral/company-playbooks/frontier-ai-labs-values
  a: |-
    **What interviewers are testing.** Real-world AI/ML maturity. Anyone can recite textbook definitions of data leakage or distribution shift; interviewers probe for the **exact forensic workflow** you used when offline metrics (AUC, NDCG, or LLM-as-judge win rate) diverged from online business metrics or human user satisfaction.

    **Four failure modes to anchor your story:**

    1. **Train-serve or prompt-context skew:** Feature pipelines or RAG chunking behaving differently in real-time serving vs. batch evaluation.
    2. **Proxy metric Goodharting:** Optimizing click-through rate or judge verbosity at the expense of downstream task completion.
    3. **Latency eating quality:** A 3x larger model improving offline accuracy by 2% while adding 900 ms of p95 latency that caused user abandonment.
    4. **Unrepresentative eval golden sets:** Eval sets missing adversarial, multi-turn, or long-tail production queries.

- id: company-frontier-ai-safety-vs-capability-tension
  q: Tell me about a time you discovered a safety, reliability, privacy, or alignment risk right before a high-visibility launch. How did you handle the tension between shipping speed and safety?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: ai-views
  signals:
    - judgment
    - motivation
  topics:
    - /behavioral/company-playbooks/frontier-ai-labs-values
    - /behavioral/leveling-and-tracks/ai-and-ml-engineer-behavioral
  a: |-
    **What interviewers are testing.** Frontier AI labs (Anthropic, OpenAI, DeepMind) explicitly evaluate **epistemic honesty** and **calibrated safety judgment**. They reject two extremes: reckless shipping ("we'll fix jailbreaks or PII leaks if users complain") and unquantified alarmism ("we must halt the launch indefinitely without measuring the failure rate").

    **How to demonstrate frontier-lab judgment:**

    - **Quantify the failure rate and severity:** Run a red-team or automated evaluation harness to measure exact prevalence and worst-case harm.
    - **Engineer layered mitigations:** Combine input/output classifiers, constitutional/system-prompt constraints, tool-permission sandboxing, or staged rollout gates so capability and safety advance together.
    - **State uncertainties plainly:** Distinguish between risks your mitigation provably bounds and residual risks that require active production telemetry and kill switches.

- id: company-apple-quality-bar-across-boundaries
  q: Tell me about a time you held a high quality bar on work that crossed team, platform or hardware and software boundaries.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  signals:
    - judgment
  companies:
    - Apple
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
  a: |-
    **What interviewers are testing.** Apple organises engineers by function, so most features need several specialist teams. The interviewer wants to see that you cared about the finished experience, including the parts outside your own code, and that you kept the bar without damaging the working relationship.

    **How to structure your answer (STAR+L):**

    - **Situation & Task:** Name the feature, the teams involved and the quality gap you noticed. Give a number: a memory budget, a frame time, a battery cost or an error rate.
    - **Action:** Show how you measured the gap, how you raised it with the other team as a shared problem, and what you built or changed yourself to close it. Name one option you rejected and why.
    - **Result:** State the before and after numbers and what the user would have noticed.
    - **Learning:** Say what check or budget you added so the gap is caught earlier next time.

    **Red flags to avoid.** Blaming the other team, describing polish with no measurement, or sharing details your current employer would treat as confidential. Respecting confidentiality is itself a good signal here.

- id: company-netflix-decision-after-seeking-dissent
  q: Tell me about a decision you owned where you asked for opposing views before you made the call.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  signals:
    - judgment
  companies:
    - Netflix
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
  a: |-
    **What interviewers are testing.** Netflix's culture memo describes one person owning a decision after gathering disagreement from others. The interviewer checks three things: that you sought out people likely to disagree, that their input changed something, and that you then decided without waiting for a vote.

    **How to structure your answer (STAR+L):**

    - **Situation & Task:** Describe the decision, why it was yours to make and what was at stake.
    - **Action:** Say who you asked and why you chose them. Give the strongest objection you heard in their words. Explain what you changed because of it and what you kept. Then state the decision and how you told the people who disagreed.
    - **Result:** Give the outcome with a number, and say whether the objection turned out to be right in part.
    - **Learning:** Say how you now collect disagreement on decisions of this size.

    **Red flags to avoid.** Asking only people who agree with you, describing a group vote as your decision, or telling a story where nobody's feedback changed anything.

- id: company-microsoft-changed-approach-after-learning
  q: Tell me about a time you were wrong about a technical approach and changed course after learning from someone else.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  signals:
    - growth
  companies:
    - Microsoft
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
  a: |-
    **What interviewers are testing.** Microsoft describes its culture as a growth mindset: learning matters more than already knowing. Interviewers also look for work that builds on other teams and helps them in return. They want a real case where you held a view, met evidence against it and changed.

    **How to structure your answer (STAR+L):**

    - **Situation & Task:** State the approach you first believed in and why it seemed right.
    - **Action:** Describe the evidence or the person that showed you were wrong. Explain how you tested it, what you changed, and how you gave credit. If you reused another team's platform instead of building your own, say so.
    - **Result:** Give the outcome with a number, and name what the other team gained as well.
    - **Learning:** Say which habit changed, for example testing your own assumption first or asking the owning team earlier.

    **Red flags to avoid.** A story where you were right all along, a vague "I learned to listen", or taking credit for work that another team did.

- id: company-meta-most-proud-of-building
  q: What are you most proud of building, and what was your part in it?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-motivation
  companies:
    - Meta
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Motivation and ownership. Meta lists this among the questions to expect. The interviewer wants to hear what you care about, what you personally did, and how large the work was, because the size of the story is used to judge your level.

    **How to shape the answer.**

    - **Situation and task.** Say what the product or system was, who used it and why it mattered to you.
    - **Action.** Give the three decisions that were yours. Say how many people worked on it and what you owned.
    - **Result.** Give the effect on users or on the system as a number.
    - **Learning.** Say what you would do better. Meta lists that as a question too.

    **A strong answer sounds like this.** "I am proudest of the offline mode in our field app. Technicians lost a morning of work each week when the signal dropped. I proposed it, wrote the sync design and led four engineers for a quarter. I chose to merge changes field by field, because whole-record merges would have lost notes. Lost-work reports fell from about 60 a week to 2. I would test on real devices earlier: we found a storage limit late."

    **Watch out for.** A project you only helped on, pride in the technology with no user in the story, and a story sized for a lower level than the one you are interviewing for.
  followUps:
    - q: Why did that problem matter to you?
      level: Mid
      companies: [Meta]
      a: |-
        Give a reason that is about users or the team, and make it specific: who was hurt and how you found out. Avoid "it was interesting technically" as the whole answer. The interviewer is listening for what will keep you going when the work is hard.
    - q: What would you do better if you did it again?
      level: Mid
      companies: [Meta]
      a: |-
        Name one real mistake and its cost, then the change. For example, you tested on simulators for too long and lost two weeks. A candidate who cannot find a fault in their best work sounds unaware, not strong.

- id: company-meta-pushed-idea-despite-disagreement
  q: Tell me about a time you pushed an idea forward when other people disagreed with it.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-proactive
  companies:
    - Meta
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Being proactive, and handling disagreement directly. Meta lists a question of this kind. The interviewer checks that you started something, that you dealt with the people who disagreed yourself, and that you used evidence.

    **How to shape the answer.**

    - **Situation and task.** State the idea and who disagreed. Give their reason fairly.
    - **Action.** Say how you tested the idea cheaply, who you spoke to one to one, and what you changed because of what they said.
    - **Result.** Give the outcome with a number, and say what happened to the working relationship.
    - **Learning.** Say how you now raise ideas that cut across other people's work.

    **A strong answer sounds like this.** "I wanted to drop a nightly rebuild of our search index and update it as records changed. The team lead disagreed: the rebuild was simple and had never failed. I asked what would change his mind, and he said proof that updates would not drift. I ran both for two weeks and compared them each night. They matched, and results were fresh in 30 seconds, not a day. He asked for a weekly check to stay, which I added. We shipped it together."

    **Watch out for.** Going to a manager before talking to the person, a story where the others were simply wrong, and pushing an idea through without changing anything in it.
  followUps:
    - q: What was their strongest point?
      level: Senior
      companies: [Meta]
      a: |-
        State it as they would, and say what you did about it. If their point changed your design, say how. Being able to argue the other side well is the signal here.
    - q: Did you involve your manager? Why, or why not?
      level: Senior
      companies: [Meta]
      a: |-
        If you did not, say that you wanted to settle it directly and explain how. If you did, say what you had tried first and what you asked the manager for: a decision, not a rescue. Raising everything upward reads as a lower level.

- id: company-meta-conflict-with-colleague
  q: Tell me about a conflict with a colleague. How did you handle it?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-conflict
  companies:
    - Meta
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Conflict resolution and empathy. Meta lists "how do you handle conflict" among its example questions, and its guide says that talking about a real conflict will not count against you. The interviewer wants a real disagreement between people, what you did about it yourself, and whether you understood the other person.

    **How to shape the answer.**

    - **Situation and task.** Describe the disagreement and what was at stake. Keep it to behaviour, not character.
    - **Action.** Say what you did to understand their side, what you said to them directly, and what you both agreed to change.
    - **Result.** Give the outcome for the work and for the relationship.
    - **Learning.** Say what you do earlier now.

    **A strong answer sounds like this.** "A designer and I disagreed about an animation that made our feed feel slow on older phones. She felt I was cutting her work without asking. I asked for half an hour, showed her the frame times on a three-year-old phone and asked what the animation was for. It was meant to show that new items had arrived. We kept that and replaced the animation with a lighter one. Scroll stutter fell by half. We now review motion on an old phone together before build."

    **Watch out for.** Describing the other person as difficult, a conflict that was really a small difference of opinion, and an ending where you won and they lost.
  followUps:
    - q: What would they say about how it went?
      level: Mid
      companies: [Meta]
      a: |-
        Answer from their side, including what they would say you got wrong. If you asked them afterwards, say so. This checks whether your account is fair.
    - q: What is your working relationship like now?
      level: Mid
      companies: [Meta]
      a: |-
        Give one concrete sign: you still work together, they asked you to review something, or you set up a shared habit. If it stayed cool, say so plainly and say what you learned.

- id: company-meta-feedback-hard-to-hear
  q: Tell me about feedback that was hard to hear. What did you change?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-growth
  companies:
    - Meta
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Growth. Meta asks how you like to give and receive feedback and says it looks for how you learned and improved. The interviewer wants a real weakness, not a strength in disguise, and a change that other people could see.

    **How to shape the answer.**

    - **Situation and task.** Say who gave the feedback and what it was, in their words.
    - **Action.** Say how you reacted at first, what you did to check whether it was true, and the habit you changed.
    - **Result.** Give a sign that the change worked, ideally from someone else.
    - **Learning.** Say how you ask for feedback now.

    **A strong answer sounds like this.** "My manager told me that my design documents arrived finished, so nobody could shape them. I did not like hearing it, because I thought finished was good. I asked two teammates and both agreed. I started sharing a one-page outline in the first week and asking for objections. On the next project a teammate caught a wrong assumption on day three that would have cost weeks. I now ask at the end of each project what I should have shared earlier."

    **Watch out for.** A fake weakness such as "I work too hard", feedback you still think was wrong, and a change nobody else would have noticed.
  followUps:
    - q: How do you know the change stuck?
      level: Mid
      companies: [Meta]
      a: |-
        Give evidence from after the first month: a later project where you did the same thing, or a comment from the person who gave the feedback. One example of slipping back and noticing is believable and fine.

- id: company-meta-no-clear-owner-or-plan
  q: Tell me about a time there was no clear owner or plan, and you had to work out what to do.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-unstructured
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Working in an unstructured environment. A former Meta interviewer lists this as one of the areas the behavioral round covers. The interviewer wants to see that you found the problem, decided what to do without being told, and brought other people along.

    **How to shape the answer.**

    - **Situation and task.** Describe the gap: what was going wrong and why nobody owned it.
    - **Action.** Say how you sized the problem, what you chose to do first and what you chose not to do, and who you got agreement from.
    - **Result.** Give the outcome with a number, and say who owns it now.
    - **Learning.** Say what tells you early that something has no owner.

    **A strong answer sounds like this.** "Our sign-up emails were landing in spam for one mail provider. Three teams touched email and none owned delivery. I pulled a week of delivery logs and found 18 percent of sign-ups never saw the confirmation. I did not try to fix all email. I fixed the sender records, set up a daily delivery report and proposed that the platform team own it, with the numbers attached. They agreed. Confirmed sign-ups rose by 11 percent. I now check for an owner whenever a number sits between teams."

    **Watch out for.** Waiting to be asked, a problem that was really just a vague ticket, and fixing it alone so that it still has no owner afterwards.
  followUps:
    - q: How did you decide what not to do?
      level: Senior
      a: |-
        Name the things you left out and the reason for each: too large, not yours to change, or low value. Choosing a small first step that proves the problem is a strong signal.
    - q: How many people did it take in the end?
      level: Senior
      a: |-
        Answer plainly. The interviewer is sizing the story to judge level. If it was you alone inside your own area, say so and offer a larger example if you have one.

- id: company-meta-project-got-blocked
  q: Tell me about a project that got blocked. What did you do to get it moving?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-perseverance
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Perseverance. A former Meta interviewer lists it as one of the areas the round covers. The interviewer wants a real blocker, several attempts, and a sign that you did not just wait or hand the problem to someone else.

    **How to shape the answer.**

    - **Situation and task.** Say what the project was and exactly what blocked it.
    - **Action.** Give the attempts in order, including the ones that failed, and why you tried the next one.
    - **Result.** Say how it was unblocked and what it cost in time.
    - **Learning.** Say what you do now to find blockers earlier.

    **A strong answer sounds like this.** "Our release was blocked because a partner team's test environment failed one run in five. I first retried the tests, which hid the problem. Then I logged every failure for a week and found they all happened when two test suites shared one account. The partner team had no time, so I sent them a small change that gave each suite its own account, with the failure log. They merged it in a day. Failures went to zero and we shipped nine days late. I now ask about shared test data at project start."

    **Watch out for.** A blocker that solved itself, a story where you only asked someone else to fix it, and leaving out the attempts that failed.
  followUps:
    - q: At what point would you have stopped and changed the plan?
      level: Senior
      a: |-
        Give the limit you had in mind: a date, a cost, or a number of failed attempts, and what the other plan was. This shows that persistence was a choice and not a habit.
- id: tell-me-about-a-time-your-offline-results-didn-t-match-onlin
  q: Tell me about a time your offline results didn't match online results.
  a: |
    Describe the gap, how you investigated it, for example metric misalignment, exposure bias, feature skew or novelty effects, what you changed in evaluation or the model, and how it improved later decisions. This shows mature understanding of experimentation.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
  signals:
    - judgment
- id: describe-a-time-you-had-to-work-with-messy-or-incomplete-dat
  q: Describe a time you had to work with messy or incomplete data.
  a: |
    Explain how you assessed the data quality, what you fixed, what assumptions you documented, how you validated that conclusions were robust, and how you improved the data source for the future. Interviewers look for rigor and pragmatism.
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
  signals:
    - judgment
- id: tell-me-about-a-time-you-chose-a-simpler-model-over-a-more-c
  q: Tell me about a time you chose a simpler model over a more complex one.
  a: |
    Describe the requirements, such as latency, interpretability or data size, how you compared options, why the simpler model won on overall value, and the outcome. This shows judgment over novelty.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
  signals:
    - judgment
- id: describe-a-time-you-raised-an-ethical-or-fairness-concern-ab
  q: Describe a time you raised an ethical or fairness concern about a model.
  a: |
    Explain the concern, how you measured it, for example performance gaps across groups, how you raised it constructively, the changes made, and the result. Show that you balance responsibility with business goals and bring evidence.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
  signals:
    - judgment
- id: how-do-you-decide-when-a-model-is-good-enough-to-ship
  q: How do you decide when a model is good enough to ship?
  a: |
    Tie it to agreed success criteria: improvement over baseline on the right metrics and segments, acceptable latency and cost, safety and fairness checks, monitoring and rollback readiness, and a plan for online validation. Give an example of making this call.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: ai-ml-project-stories
  signals:
    - judgment
- id: company-meta-why-meta
  q: Why Meta?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-motivation
    - motivation
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
  a: |-
    **What it tests.** Motivation. Candidates report this opener in Meta behavioural and hiring-manager conversations. The interviewer listens for a reason that is specific to the company and that connects to work you have already done. It gets harder at senior level, where a good answer also says what kind of problems you want to own.

    **How to shape the answer.**

    - **Your reason first.** Give one or two reasons in the first sentence. Do not start with your career history.
    - **Evidence from your past.** Link each reason to something you did, so that it sounds true.
    - **Something specific to the company.** Use a published value, a product you use, or an engineering practice the company has written about.
    - **What you want to do.** End with the kind of work you hope to pick up in the first year.

    **A strong answer sounds like this.** "Two reasons. First, scale. I build mobile features for about 300,000 users, and I want to learn what breaks at a thousand times that. Second, speed. Your published values include moving fast, and that matches how I like to work. Last year I moved my team from monthly releases to weekly ones, and crash reports fell by 9 percent because each release was smaller. I would like to work on mobile performance, where a small gain reaches a lot of people on old phones."

    **Watch out for.** Praise that fits any large company, reasons that are only about pay or prestige, and a long career summary before the answer.
  followUps:
    - q: Why should we hire you?
      level: Mid
      companies: [Meta]
      a: |-
        Give two strengths that match the role, each with one piece of evidence and a number. Then name the kind of problem you solve faster than most people. Keep it under a minute. Do not compare yourself with candidates you have never met.
    - q: What would you do in your first three months on the team?
      level: Mid
      companies: [Meta]
      a: |-
        Give a plan in stages: learn the system and the people in the first weeks, ship one small change early, then pick one problem to own. Say whom you would ask about what. The interviewer wants a person who starts without waiting for instructions.
    - q: What would make you leave a team?
      level: Mid
      a: |-
        Answer honestly and keep it about the work: no room to learn, no say in decisions, or slow feedback. Then say what you do before leaving, such as raising it with your manager. The interviewer checks that your stated motivation matches what keeps you in a job.
- id: company-meta-most-difficult-person
  q: Who is the most difficult person you have had to work with, and what did you do about it?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-conflict
    - meta-empathy
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** Conflict and empathy. Candidates report this question in Meta loops. The interviewer wants a real person who was hard to work with over weeks, your attempt to understand why, and what you changed in your own behaviour. At senior level they also expect you to protect the project while you work on the relationship.

    **How to shape the answer.**

    - **Situation and task.** Describe what the person did, in facts. Say what work depended on the two of you.
    - **Action.** Say how you found out what they cared about, what you said to them directly, and what you changed on your side.
    - **Result.** Give the outcome for the project and for the relationship.
    - **Learning.** Say what you now do in the first week with a new partner.

    **A strong answer sounds like this.** "A staff engineer on a partner team rejected my reviews with one-line comments and skipped our meetings. Our storage migration needed his approval on 14 changes. I asked him what worried him. He had been paged twice that year by migrations like mine. I offered to write the rollback plan first and to join his on-call rotation for the cutover week. He approved 11 changes in the next two weeks. We never became friendly, and his reviews are still short. I now ask reviewers about past incidents before my first change."

    **Watch out for.** Calling the person toxic or lazy, a story where your manager fixed it for you, and an ending where the person simply left the team.
  followUps:
    - q: Why do you think they behaved that way?
      level: Senior
      a: |-
        Give the cause from their side: a past incident, pressure from their own manager, or a goal that clashed with yours. Say how you found out, ideally by asking them. A guess about their character is a weak answer.
    - q: What part of the problem was yours?
      level: Senior
      a: |-
        Name one thing you did that made it worse, such as sending large changes with no warning, and what you changed. The interviewer checks self-awareness here. Saying you did nothing wrong makes the whole story less believable.
    - q: If you started working with them again tomorrow, what would you do first?
      level: Senior
      a: |-
        Give one early action: agree how you will review each other's work, or ask about their worries before the first change. Show that the lesson became a habit you now use with other people too.
- id: company-meta-shipped-a-bug-to-production
  q: Tell me about a time you shipped a bug to production, or something went wrong because of you.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-growth
    - failure
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/competencies/production-incidents-and-mistakes
  a: |-
    **What it tests.** Growth. Candidates report this question in Meta loops. The interviewer wants a real mistake that was yours, a calm account of what you did in the first hour, and a change that stops the same mistake for other people. At senior level a personal lesson is too small: they expect a fix to the process.

    **How to shape the answer.**

    - **Situation and task.** Say what you shipped, what broke and who was affected. Give the size in numbers.
    - **Action.** Say how you found out, what you did first and whom you told. Then give the cause in one sentence.
    - **Result.** Say how long the problem lasted and what it cost.
    - **Learning.** Name the check or habit you added, and say whether the team uses it too.

    **A strong answer sounds like this.** "I shipped a change to our checkout page that hid the pay button for people on one older browser. I had tested on two browsers only. Support noticed after about three hours, and in that time roughly 400 customers could not pay. I rolled the change back in ten minutes, sent the support lead the affected time window, and found the cause: a layout feature that browser did not support. I added that browser to our automated tests. Two teammates have since caught similar problems with the same test."

    **Watch out for.** A mistake so small that nothing was at risk, blaming the reviewer or the test team, and a lesson that is only "I will be more careful".
  followUps:
    - q: What did you learn from it?
      level: Mid
      companies: [Meta]
      a: |-
        Give one lesson about your own habits and one about the system. For example, you now test on the oldest supported browser, and the pipeline now does it for everyone. A lesson that depends only on your memory is weak.
    - q: How did you tell the people who were affected?
      level: Mid
      a: |-
        Say who you told, how soon, and what you included: what broke, for how long, and what you were doing about it. Telling people before they find out themselves is the behaviour the interviewer wants to hear.
    - q: Could the same kind of bug get through today?
      level: Mid
      a: |-
        Answer honestly. Say what the new check covers and what it does not cover. If a similar bug could still get through another way, name that way and say what you would add next.
- id: company-meta-used-data-to-convince-someone
  q: Tell me about a time you used data to convince someone.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-communication
    - influence
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/competencies/influence-without-authority
  a: |-
    **What it tests.** Communication. The interviewer wants to see that you can turn numbers into a clear case for a person who started with a different view. They listen for how you chose what to measure, how you presented it, and whether you were open to the data proving you wrong. At senior level the person you convince is usually outside your team.

    **How to shape the answer.**

    - **Situation and task.** Say who held the other view and why it was reasonable.
    - **Action.** Say what you measured, how long it took and how you showed it. One chart or one number works better than ten.
    - **Result.** Say what they decided and what changed afterwards.
    - **Learning.** Say what you learned about presenting data to that kind of audience.

    **A strong answer sounds like this.** "Our analytics lead wanted to keep a nightly job that rebuilt all 240 reporting tables. I thought many were unused. He believed finance read them all. I logged queries for 30 days and found that 61 tables had no reads. I did not send him the full log. I sent one page: the 61 names, their owners and the compute hours each cost per night. He checked with finance, kept 9 and agreed to drop 52. The nightly run went from 5 hours 40 minutes to about 4 hours."

    **Watch out for.** Data you collected after the decision was already made, a wall of numbers with no single message, and a story where the other person had no real reason for their view.
  followUps:
    - q: What did the data not show?
      level: Mid
      a: |-
        Name the limit: a short time window, a missing user group, or a number that could be read two ways. Say how you told the other person about it. Admitting the limit makes the rest of your case stronger.
    - q: What would you have done if the numbers had supported their view?
      level: Mid
      a: |-
        Say that you would have dropped your proposal and told them so. If you can, give a real case where your own data changed your mind. The interviewer is checking that you measure in order to learn.
- id: company-meta-project-across-many-teams
  q: Describe a project where you worked with teams across the organisation. How did you keep everyone informed and moving?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-communication
    - influence
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/competencies/cross-functional-collaboration
  a: |-
    **What it tests.** Communication across teams. The interviewer wants to hear how many teams were involved, how you kept them informed, and what you did when two of them wanted different things. The size of the group and the way you ran it show the scope you can handle.

    **How to shape the answer.**

    - **Situation and task.** Name the goal, the number of teams and your role. Say why no single team could do it alone.
    - **Action.** Describe how you communicated: the written plan, the regular update and the record of decisions. Give one moment where teams disagreed and what you did.
    - **Result.** Give the outcome and the date against the plan.
    - **Learning.** Say what you would set up earlier next time.

    **A strong answer sounds like this.** "I led the move of our login service to a new token format. It touched 7 teams and about 40 engineers, and none of them reported to me. I wrote a two-page plan with one named owner per team and sent a short update every Friday: done, next, blocked. In week five the mobile and payments teams wanted different cutover dates. I put both on a call, showed the risk of each date, and we chose the later one. We finished three weeks later than my first plan, with no login outage. Next time I would agree dates before coding starts."

    **Watch out for.** Listing meetings without saying what they decided, a project where the other teams only received your work, and hiding the delay.
  followUps:
    - q: How did you handle conflicts between people or teams along the way?
      level: Senior
      companies: [Meta]
      a: |-
        Pick one real conflict. Say what each side wanted and why, how you got them to one decision, and who made the final call. Show that you dealt with it directly and early, before it reached a director.
    - q: How did people who missed the meetings know what was decided?
      level: Senior
      a: |-
        Describe the written record: one page or thread that lists each decision, its owner and its date. Say how often you updated it. The interviewer is checking that your communication works for people who were not in the room.
    - q: Which team was hardest to bring along, and why?
      level: Senior
      a: |-
        Name the team and give their reason fairly, such as a full roadmap or a bad migration in the past. Say what you offered them: engineering time, a later date or a smaller change. Then say whether it worked.
- id: company-meta-team-with-different-opinions-and-skills
  q: Describe a time you worked in a team where people had very different opinions and skills. How did you make it work?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-empathy
    - communication
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/competencies/cross-functional-collaboration
  a: |-
    **What it tests.** Empathy. The interviewer wants to see that you noticed how other people think and work, and that you changed your own approach to fit them. A strong answer uses the differences. At senior level they expect you to set up the way the group works, as well as doing your own part.

    **How to shape the answer.**

    - **Situation and task.** Say who was in the team, what each person was good at, and where their views split.
    - **Action.** Say what you did to understand each view and what working method you agreed on.
    - **Result.** Give the outcome for the product and one sign that the team worked better.
    - **Learning.** Say what you now ask a new team at the start.

    **A strong answer sounds like this.** "I led a five-person group building a ranking model for our help search. Two researchers wanted three more weeks of offline tests. Two product engineers wanted to ship and measure live. Our analyst said quietly that the offline metric did not match what users clicked. I asked each person to write half a page on what would prove them wrong. That showed the analyst's point was the real issue. We spent one week fixing the metric, then shipped to 5 percent of users. Successful searches rose by 3 percent. We kept the half-page habit for later decisions."

    **Watch out for.** Describing colleagues by stereotype, a story where you simply chose a side, and leaving out the quiet person whose view you had to ask for.
  followUps:
    - q: How did you keep the team working efficiently with so many views?
      level: Senior
      companies: [Meta]
      a: |-
        Describe the method: written views before meetings, a time limit on debate, and one named person who decides. Give the time it saved if you can. The interviewer wants a process, because good intentions alone do not last.
    - q: How did you make sure the outcome was a good one?
      level: Senior
      companies: [Meta]
      a: |-
        Say what test the final decision had to pass: a metric, a user check or a review by someone outside the group. A decision that pleases everyone and helps no user is the failure the interviewer is probing for.
    - q: Whose view did you find hardest to understand?
      level: Senior
      a: |-
        Name the view and say honestly why it was hard for you, for example it came from a field you did not know. Then say what you did to understand it: you asked for an example, or sat with the person for an hour.
- id: company-meta-project-grew-beyond-scope
  q: Tell me about a time a project grew well beyond its original scope. What did you do?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-unstructured
    - prioritisation
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/competencies/ambiguity-and-shifting-priorities
  a: |-
    **What it tests.** Working without a fixed structure. The interviewer wants to know when you noticed the growth, how you decided what stayed in, and whom you told. Keeping quiet and working longer hours is a weak answer. At senior level the interviewer expects you to reset the plan with the people who asked for the work.

    **How to shape the answer.**

    - **Situation and task.** Give the original scope and estimate, then what it grew to.
    - **Action.** Say when you noticed, how you sized the new work, and what choice you put to the people who asked for the project.
    - **Result.** Say what shipped, when, and what moved to later.
    - **Learning.** Say what early sign you watch for now.

    **A strong answer sounds like this.** "I was asked to add dark mode to one settings screen of our mobile app, a one-week task. In the first two days I found that colours were hard-coded in 46 screens, so one dark screen would look broken next to the rest. I listed the screens, estimated five weeks for all of them, and gave my manager and the designer three options. We chose the middle one: a shared colour file plus the 12 most used screens in three weeks. The other 34 followed over the next two releases. I now spend the first day of any task checking what it touches."

    **Watch out for.** Blaming the person who wrote the first request, absorbing the extra work without telling anyone, and a story with no decision in it.
  followUps:
    - q: When did you first know the scope had changed, and how long was it before you said so?
      level: Mid
      a: |-
        Give both dates. A gap of a day or two is fine. If you waited longer, say so and say what it cost. The interviewer wants to hear that you raise the size of a problem early.
    - q: What did you leave out, and who agreed to that?
      level: Mid
      a: |-
        Name the items you moved to later and the person who accepted each one. Show that the cut was a shared decision with a written record. A silent cut that surprises people later is a mistake.
- id: company-meta-missed-a-deadline
  q: Tell me about a time you could not meet a deadline or a commitment you had made.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-perseverance
    - delivery
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/competencies/tight-deadlines-and-tech-debt
  a: |-
    **What it tests.** Perseverance, and honesty about a miss. Candidates report this question in Meta loops. The interviewer wants a commitment you really missed, the effort you made to save it, and how early you warned the people who were waiting. At senior level they also want to hear how you changed the plan for others who depended on you.

    **How to shape the answer.**

    - **Situation and task.** Say what you promised, to whom and by when.
    - **Action.** Give the attempts you made to recover, in order. Say when you told people the date was at risk and what options you offered.
    - **Result.** Say how late it was and what the delay cost.
    - **Learning.** Say how you estimate or report progress differently now.

    **A strong answer sounds like this.** "I promised our operations team an alerting upgrade by the end of March. Two weeks before the date, load tests showed that the new rules engine dropped about 2 percent of alerts. I tried a larger queue, then a second worker, and neither fixed it. Ten days before the deadline I told the operations lead we would miss it. I offered two choices: ship on time for low-priority alerts only, or wait. She chose to wait. We shipped 16 days late with no dropped alerts. I now run load tests in the first third of a project."

    **Watch out for.** A deadline you met in the end by working weekends, a miss that was entirely someone else's fault, and warning people only on the due date.
  followUps:
    - q: What stopped you from meeting it?
      level: Mid
      companies: [Meta]
      a: |-
        Give the real cause in one or two sentences, and include your own part: an estimate with no margin, or a test you ran too late. Keep outside causes short. The interviewer is checking whether you can see your own share.
    - q: What was the outcome for the people who were waiting?
      level: Mid
      companies: [Meta]
      a: |-
        Say what the delay meant for them in plain terms: a launch moved, two more weeks of manual work, or a customer told to wait. Then say what you did to reduce that cost while they waited.
    - q: What did you learn?
      level: Mid
      companies: [Meta]
      a: |-
        Name one change to how you plan, and give a later project where you used it. For example, you now test the riskiest part first, and your next project found its main problem in week two.
- id: company-meta-fixed-a-problem-without-being-asked
  q: Tell me about a time you fixed a problem or improved something without being asked.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-proactive
    - ownership
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/foundations/quantifying-engineering-impact
  a: |-
    **What it tests.** Being proactive. The interviewer wants to hear that you saw a problem other people had accepted, measured it, and acted without waiting for a ticket. They also check that you kept your own work on track and told the right people. At senior level the problem should affect more than your own team.

    **How to shape the answer.**

    - **Situation and task.** Describe the problem, how long people had lived with it, and what it cost.
    - **Action.** Say how you made time, what you built or changed, and how you got others to accept it.
    - **Result.** Give the numbers before and after, and say who uses the fix now.
    - **Learning.** Say how you choose which unasked problems are worth your time.

    **A strong answer sounds like this.** "Our team of eight ML engineers waited 14 minutes for the test suite on every change, about 60 runs a day. Nobody owned it. I spent two Friday afternoons timing each step and found that every test file downloaded the same sample dataset again. I added a local cache and posted the timings in the team channel. The suite fell to 9 minutes. One teammate hit a stale cache in the first week, so I added a clear command and a note in the readme. My own sprint work still shipped on time."

    **Watch out for.** A fix that was really part of your assigned work, an improvement with no number, and a story where your own tasks slipped and you do not mention it.
  followUps:
    - q: How did you approach it at the start?
      level: Mid
      companies: [Meta]
      a: |-
        Describe the first hour: what you measured and why you picked that part. Starting with data and a small first change is the signal. Rewriting everything because you disliked the old design is a weaker story.
    - q: What was the outcome, and is the fix still in use?
      level: Mid
      companies: [Meta]
      a: |-
        Give the number, then say who maintains the fix today. If nobody does, admit it and say what you would hand over differently. An improvement that died when you moved on counts for less.
    - q: Did you tell anyone before you started?
      level: Mid
      a: |-
        Say whether you told your manager, and why. A short message such as "I am spending two afternoons on the test suite" is enough. The interviewer wants initiative with openness, so that nobody is surprised by your change.
- id: company-meta-disagreed-and-was-wrong
  q: Tell me about a time you disagreed with a teammate or your manager, and it turned out that you were wrong.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  companies:
    - Meta
  signals:
    - meta-growth
    - meta-conflict
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Growth inside a conflict. The interviewer wants a disagreement where you argued your side with conviction, then saw evidence against it and changed your mind in the open. Prepare one example in advance, because this story is hard to find on the spot. At senior level they also listen for how you repaired trust with the person you argued against.

    **How to shape the answer.**

    - **Situation and task.** State both positions and why you believed yours.
    - **Action.** Say how hard you pushed, what evidence changed your mind, and what you said to the other person when it did.
    - **Result.** Give the outcome with a number.
    - **Learning.** Say what you check now before you argue a strong position.

    **A strong answer sounds like this.** "A teammate wanted a queue between our order service and the email service. I argued for a direct call: it was simpler, and we sent only 2,000 emails a day. I pushed hard in the design review and the team went with my option. Six weeks later the email provider was slow for 40 minutes, order requests timed out, and about 300 orders failed. I told the team that her design would have prevented it, and I paired with her to add the queue in four days. I now ask what happens when the service I call is slow."

    **Watch out for.** A story where you were only slightly wrong, saying the other person was right by luck, and changing your mind quietly without telling them.
  followUps:
    - q: How did you tell them you had been wrong?
      level: Mid
      a: |-
        Say what words you used and where you said them: ideally in the same meeting or channel where you had argued. A public argument followed by a private apology is weaker. Give their reaction if you remember it.
    - q: What would you do differently now?
      level: Mid
      companies: [Meta]
      a: |-
        Name the one check you skipped, such as asking what would happen under failure, and say when you would do it next time. Keep it specific to this decision. A general answer like "listen more" tells the interviewer nothing.
    - q: How do you now decide how hard to push for your view?
      level: Mid
      a: |-
        Give your rule. For example, you push hard when the cost of being wrong is small and easy to undo, and you ask for a test when the cost is large. Tie the rule back to this story.
- id: company-meta-em-managing-an-underperformer
  q: Tell me about a time you managed someone who was not performing well. What did you do, and how did it end?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-empathy
    - people-management
    - feedback
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Empathy together with a clear standard, for engineering managers. The interviewer wants to see that you found the cause before you judged the person, that you said plainly what had to change, and that you followed through whichever way it went. They also listen for the cost to the rest of the team.

    **How to shape the answer.**

    - **Situation and task.** Describe the gap in facts: what the person was expected to deliver and what they delivered.
    - **Action.** Say how you found the cause, what you told them, what support you gave and what dates you set.
    - **Result.** Say how it ended, including an ending that was not happy.
    - **Learning.** Say what you now do sooner.

    **A strong answer sounds like this.** "An engineer on my team of seven had missed three sprint goals, and two teammates were redoing his reviews. I asked him what was getting in the way. He had moved from frontend work to our data pipeline and was afraid to ask basic questions. I told him clearly that his output was below what the role needed. We agreed a six-week plan with a pairing partner and one small delivery each week. He met four of the six. Pipeline work still did not suit him, so I helped him move to a frontend team, where he is doing well. I started two months too late."

    **Watch out for.** Calling the person lazy, a rescue with no hard conversation in it, and ignoring the teammates who carried the extra work.
  followUps:
    - q: What exactly did you say in the first hard conversation?
      level: Senior
      a: |-
        Give the sentence you used, with the facts and the expectation in it. Say how the person reacted and what you agreed before the meeting ended. The interviewer wants proof that you can be direct and kind in the same conversation.
    - q: At what point would you have decided it was not going to work?
      level: Senior
      a: |-
        Give the test you had in mind: the dates, the deliveries and who else was involved, such as your own manager. Show that the person knew the test too. An ending that surprises the person is a management failure.
    - q: What did the rest of the team see while this was going on?
      level: Senior
      a: |-
        Say how you protected the person's privacy and still dealt with the extra load on others, for example by moving review duties. Teams watch how a manager handles low performance, and the interviewer knows it.
- id: company-meta-em-growing-peoples-careers
  q: How do you help the people on your team grow their careers? Give me a recent example.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-behavioral
  signals:
    - meta-growth
    - people-management
    - mentoring
  topics:
    - /behavioral/company-playbooks/meta-jedi-interview
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Growth, applied to other people. For an engineering manager, the interviewer wants a method and one real case: how you learn what each person wants, how you find work that stretches them, and how you give feedback along the way. They listen for a person who grew because of choices you made.

    **How to shape the answer.**

    - **Your method first.** Say in two sentences how you run career conversations and how often.
    - **One example.** Pick one person. Say what they wanted and what gap stood in the way.
    - **What you did.** Name the project you gave them, the support, and the feedback you gave when it went badly.
    - **Result.** Say where they are now, and what it cost you or the team.

    **A strong answer sounds like this.** "Every quarter I ask each of my eight reports where they want to be in two years. One mid-level backend engineer wanted to reach senior but had never led work across teams. I gave her our rate-limiter replacement, which touched three teams, and I stayed out of her meetings. Her first design review went badly, because she had not spoken to the client teams beforehand. We talked it through the same day, and she met each team before the second review. The project shipped a month late. She was promoted two review cycles later."

    **Watch out for.** Talking only about promotions, taking the credit for the person's work, and an example where you handed over a task with no risk in it.
  followUps:
    - q: How do you keep the people on your team motivated?
      level: Senior
      a: |-
        Tie it to individuals. Say what drives two different people on your team and how you used that when you assigned work. Mention one time morale was low and what you changed. General talk about recognition is not enough.
    - q: How would you support a report who doubts that they belong at their level?
      level: Senior
      a: |-
        Start by listening. Then give specific evidence of their impact in place of general praise, and one task with a clear finish so they can see their own result. Check back in two weeks. Say that you would keep the standard where it is.
    - q: What do you do when someone wants a path your team cannot offer?
      level: Senior
      a: |-
        Say that you tell them honestly, look for nearby work that fits, and help them move if needed. If you have one, give a case where you lost a good engineer to another team for that person's benefit.
- id: company-google-teammate-takes-all-the-credit
  q: Four of you built a project together. In the final presentation, one teammate presents it as their own work. What would you do?
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - conflict
    - communication
    - judgment
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** How you handle an unfair moment without harming the team. Candidates report this scenario in Google loops. The interviewer listens for calm judgment: you correct the record, keep it private where you can, and think about the other teammates too. Each follow-up raises the pressure.

    **How to shape the answer.**

    - **Clarify.** Ask yourself if it was deliberate or careless, and who was in the room.
    - **First action and why.** Say what you would do in the meeting, then what you would say to the teammate in private.
    - **What you would check.** Confirm that the record is correct for all four people.
    - **When you would escalate.** Name the point at which you would involve a manager.

    **A strong answer sounds like this.** "I would not interrupt the presentation. If there were questions, I would add a fact, for example that one teammate built the data pipeline and I wrote the tests. That corrects the record without a fight. The same day I would talk to the presenter alone and ask how they saw it, because nerves or a rushed slide could explain it. I would ask for a follow-up note to the audience that names all four of us and what each did. If they refused, I would tell them that I plan to raise it with our manager, and then do so."

    **Watch out for.** Calling them out in front of the audience, saying that credit does not matter to you, and going to the manager before you have spoken to the person.
  followUps:
    - q: What if they did the same thing at the next presentation?
      level: Junior
      companies: [Google]
      a: |-
        Now it is a pattern, so the answer changes. Say you would speak to them once more, plainly, and then tell your manager with both examples and dates. Also suggest a fix, such as a slide that lists who did what.
    - q: What if this keeps happening across the team?
      level: Junior
      companies: [Google]
      a: |-
        Treat it as a team habit now. Propose a shared practice: every design document and demo lists its contributors, and presenters rotate. Say you would raise it with the lead or in a team meeting, with examples and without making one person the villain.
    - q: What if the teammate who lost the most credit asks you to say nothing?
      level: Junior
      a: |-
        Respect their choice about their own work, and still correct the record for your part. Ask them why. If they fear a bad reaction, that is worth raising with a manager in general terms, with their permission.
- id: company-google-several-people-ask-for-help-at-once
  q: What would you do if several people came to you for help at the same time?
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - prioritisation
    - communication
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
  a: |-
    **What it tests.** Whether you help others without dropping your own work or leaving anyone waiting in silence. The interviewer listens for a simple way to rank the requests and for clear replies to the people who must wait. Saying yes to everyone at once is the weak answer. A senior answer also reduces how often people need to ask.

    **How to shape the answer.**

    - **Clarify.** Ask each person two things: what is blocked, and by when they need it.
    - **First action and why.** Say how you would rank the requests, for example a production problem first, then anyone who cannot work at all.
    - **What you would check.** Check your own deadline, and whether someone else could answer faster.
    - **When you would escalate.** Say when you would ask your lead to help you choose.

    **A strong answer sounds like this.** "I would ask each person what is blocked and by when. Say three people ask: one has a failing release, one cannot set up their environment, and one wants a code review by Friday. I would take the release first, because it affects users. I would send the second person the setup guide and promise 20 minutes after lunch. I would tell the third that Thursday is realistic. If my own task was due that day, I would tell my lead that I am giving an hour to the release problem and ask if that is right."

    **Watch out for.** Helping whoever asked first, ignoring your own deadline, and leaving people with no reply.
  followUps:
    - q: What if two of the requests are equally urgent?
      level: Junior
      a: |-
        Say you would look for a second helper first, then choose by impact: the request that blocks more people or reaches users. Tell the other person your choice and when you will be free. If you cannot choose, ask your lead quickly.
    - q: What if the same person keeps coming back with the same kind of question?
      level: Junior
      a: |-
        Say you would help, then fix the cause: write the answer down, point them to the document, or spend 30 minutes teaching the idea behind it. The interviewer wants help that makes the other person more independent.
- id: company-google-tech-lead-disagrees-with-your-design
  q: Your tech lead disagrees with your design, and you are sure they are wrong. Walk me through what you do.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - conflict
    - influence
    - judgment
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Whether you can hold a view against someone more senior without turning it into a contest. A strong candidate questions their own certainty first, then argues with evidence, and knows when to accept the decision. At senior level they expect you to offer a cheap way to find out who is right.

    **How to shape the answer.**

    - **Clarify.** Make sure you can repeat their objection back to them.
    - **First action and why.** Propose a test: a small prototype, a measurement or a written comparison.
    - **What you would check.** Ask how costly it is to reverse the decision later.
    - **When you would escalate or commit.** Say when you would ask for a third view, and when you would accept their call and build it well.

    **A strong answer sounds like this.** "First I would check that I can state their objection in a way they agree with. Being sure is often a sign that I have missed something. Then I would propose a test we both accept, for example two days building the risky part of each design and comparing latency under load. If we still disagree after that and the choice is hard to reverse, I would ask for a design review with one more senior engineer. If it is easy to reverse, I would build their design and note the risk in the document."

    **Watch out for.** Going over their head as the first step, building your own design quietly anyway, and agreeing in the meeting while complaining afterwards.
  followUps:
    - q: What if the test results are unclear?
      level: Senior
      a: |-
        Say that unclear results favour the option that is easier to undo, and that the tech lead owns the final call. You would write down the open risk and a date to look at it again, then commit fully.
    - q: What if you build their design and it fails in the way you predicted?
      level: Senior
      a: |-
        Say you would fix the problem first and avoid any "I told you so". Afterwards you would share what the data showed and propose the change. The interviewer checks that you care more about the system than about being right.
    - q: Have you been in this situation? What happened?
      level: Senior
      a: |-
        Give a short real story with its outcome, including a case where the lead was right if that is the truth. Interviewers often move from a hypothetical to your own record, so have one example ready.
- id: company-google-stakeholders-set-unreasonable-deadline
  q: What would you do if stakeholders set a deadline that you believe is unreasonable?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - prioritisation
    - communication
    - delivery
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/competencies/tight-deadlines-and-tech-debt
  a: |-
    **What it tests.** Whether you can push back with facts and still help the stakeholders get what they need. The interviewer listens for curiosity about why the date exists, an estimate you can defend, and options in place of a flat no. At senior level they expect you to find the real need behind the date.

    **How to shape the answer.**

    - **Clarify.** Ask what the date is tied to: a customer, a contract, a launch event or a guess.
    - **First action and why.** Break the work down and show what fits by the date and what does not.
    - **What you would check.** Check what can be cut, staged or done by someone else.
    - **When you would escalate.** Say when you would bring in your manager, and what you would bring with you.

    **A strong answer sounds like this.** "I would first ask why that date matters. Then I would break the work into parts with estimates and show it on one page. Suppose it is ten weeks of work and they want it in six. I would offer choices: the core flow in six weeks with reporting in week nine, everything in ten weeks, or everything in seven with two more engineers. If they still wanted all of it in six, I would take the page to my manager with them, so that the trade-off is decided in the open."

    **Watch out for.** Saying yes and hoping, saying no without an estimate, and padding every number in secret so that nobody trusts your estimates.
  followUps:
    - q: What do you do when they keep following up and pushing?
      level: Mid
      companies: [Google]
      a: |-
        Stay consistent and give them something regular: a short weekly update with progress against the agreed plan. Repeat the options once. If the pressure continues, ask your manager to join the next conversation. Changing your estimate under pressure teaches people to push.
    - q: What if the date really cannot move?
      level: Mid
      a: |-
        Then scope or people must change. Say you would agree the smallest version that meets the real need, list in writing what is left out, and name the quality checks you will not skip, such as security review and testing.
- id: company-google-as-manager-team-feels-overwhelmed
  q: Imagine you manage a team, and you learn that people on it feel overwhelmed. How would you approach it?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - people-management
    - judgment
    - prioritisation
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Care for people combined with practical judgment. A candidate for an individual contributor role reported this scenario, so you do not need management experience to answer it. The interviewer listens for whether you find the cause before you act, and whether you remove work.

    **How to shape the answer.**

    - **Clarify.** Find out if it is everyone or two people, and if the cause is volume, unclear priorities or on-call load.
    - **First action and why.** Talk to people one to one, then list all current work in one place.
    - **What you would check.** Check which items have real dates and who set them.
    - **When you would escalate.** Say when you would go to your own manager to drop or delay work.

    **A strong answer sounds like this.** "In the first week I would meet each person for 20 minutes and ask what takes the most time and what worries them. Then I would put every project and support duty on one list with its owner and date. A list like that usually shows two or three items that nobody would miss this quarter. I would pause those and tell the people who asked for them. If the load was still too high, I would take the list to my manager and ask which commitment to move. After a month I would ask the team again."

    **Watch out for.** Jumping to a team event as the fix, promising cuts you have no power to make, and treating overload as a weakness in people.
  followUps:
    - q: What if only one person feels overwhelmed and the rest are fine?
      level: Mid
      a: |-
        Then look at that person's situation: their share of the work, a skill gap, or something outside work. Say you would ask privately, adjust their load for a set period and agree a date to check in. Keep the details private.
    - q: What if your own manager says none of the work can be dropped?
      level: Mid
      a: |-
        Say you would ask them to rank the work, since ranking is still possible when dropping is refused. Then you would put the work in order, cut scope inside each item and show the cost in dates. Tell the team what was decided.
- id: company-google-team-is-not-bonding
  q: What would you do if your team was not bonding well?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  signals:
    - communication
    - judgment
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
  a: |-
    **What it tests.** Whether you notice the health of a team and act on it when it is not your formal job. The interviewer listens for what you would observe first, for small actions inside the normal working week, and for respect for people who work differently from you. A plan made only of social events is a weak answer.

    **How to shape the answer.**

    - **Clarify.** Say what "not bonding" looks like: silent meetings, no questions in chat, people working alone, or open friction.
    - **First action and why.** Start with work habits you can change yourself, such as pairing.
    - **What you would check.** Check whether the cause is structure: time zones, new joiners or unclear ownership.
    - **When you would escalate.** Say when you would raise it with the lead.

    **A strong answer sounds like this.** "First I would look for the cause. If six of us work across three time zones and only meet in status calls, more status calls will not help. I would ask a teammate I rarely work with to pair for an hour on a bug, and I would ask a new joiner to review my next change. I would suggest a 15-minute weekly demo where anyone can show unfinished work. After a month, if people still worked alone, I would tell our lead what I had seen, with two examples, and offer to help."

    **Watch out for.** Assuming everyone wants the same kind of social contact, blaming the quiet people, and waiting for the manager to fix it.
  followUps:
    - q: How would your approach change if you were the team lead?
      level: Mid
      a: |-
        As lead you can change structure, so say that you would. Give examples: shared ownership of one goal, pairing built into the plan, and one to one talks to learn what each person needs. You would also watch your own behaviour in meetings.
    - q: What if one person does not want to take part?
      level: Mid
      a: |-
        Say you would ask them privately what works for them and accept an honest answer. Bonding means trust at work. Someone who reviews carefully and answers questions is part of the team, even if they skip every lunch.
- id: company-google-documentation-that-helped-the-team
  q: Tell me about a time you created or improved documentation that helped your team.
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - ownership
    - communication
    - mentoring
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
  a: |-
    **What it tests.** Whether you help other people do their work, including in ways that win little praise. The interviewer listens for how you noticed the need, how you made sure the document was used, and what changed for the team. At senior level they expect a habit that the whole team keeps.

    **How to shape the answer.**

    - **Situation and task.** Say what was missing or out of date, and how you saw the cost: repeated questions, slow onboarding or repeated mistakes.
    - **Action.** Say what you wrote, how you tested it on a real reader, and where you put it.
    - **Result.** Give a number: time saved, fewer questions or faster setup.
    - **Learning.** Say how the document stays correct after you.

    **A strong answer sounds like this.** "As an intern on a payments team, I needed four days to set up my development environment. The guide was two years old, and I had to ask 11 questions in chat. I wrote down every step that failed and its fix, then rewrote the guide as 14 numbered steps with the three most common errors. I asked the next intern to follow it without my help. She finished in about five hours and found two gaps, which I fixed. My mentor then added a rule that each new joiner updates the guide in their first week."

    **Watch out for.** A document nobody read, a story about the writing with no effect on anyone, and a case where documentation was simply your assigned task.
  followUps:
    - q: What is your general approach to documentation?
      level: Junior
      companies: [Google]
      a: |-
        Give two or three rules you follow. For example: write for the newest person, keep the document next to the code, and test it on a real reader. Add how you decide what is not worth documenting, since time is limited.
    - q: How do you know people used it?
      level: Junior
      a: |-
        Give evidence: page views, fewer repeated questions in chat, or a teammate who edited it later. If you never checked, say so and say how you would check now. The result is the use, and the page is only the means.
- id: company-google-helped-someone-fit-into-the-team
  q: Tell me about a time someone struggled to fit into a team with mixed backgrounds or cultures. How did you help?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - mentoring
    - communication
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/competencies/cross-functional-collaboration
  a: |-
    **What it tests.** Inclusion in practice. The interviewer wants to hear that you noticed a colleague on the edge of the group, found out why without guessing, and changed something real. They also listen for respect: the person should not sound like a project of yours. At senior level they expect a change in how the whole team works.

    **How to shape the answer.**

    - **Situation and task.** Describe what you saw: the facts, with no labels for the person.
    - **Action.** Say how you asked them about it, what you changed in your own behaviour, and what you asked the team to change.
    - **Result.** Give a sign that it worked, ideally something the person did or said.
    - **Learning.** Say what you now watch for when someone joins.

    **A strong answer sounds like this.** "A new engineer joined our team of nine from another country. After a month he had not spoken in any design review, yet his written comments were excellent. I asked him over coffee how the reviews felt. He said the discussion moved too fast in his second language, and that interrupting felt rude to him. I started sending each design document 48 hours early and opened each review by reading out the written comments. He agreed to post his in advance. In the next quarter he led two reviews. Three other quiet teammates began commenting in writing as well."

    **Watch out for.** Guessing the reason from the person's background, speaking for them without asking, and a fix that singles them out.
  followUps:
    - q: Is that for the team to solve, or for the person?
      level: Mid
      companies: [Google]
      a: |-
        Say both, with more weight on the team. The person can say what they need. The team controls the habits that shut people out, such as meeting pace and inside jokes. Give one example of each from your story.
    - q: How did you make sure you were not making assumptions about them?
      level: Mid
      a: |-
        Say that you asked an open question in private and acted on their answer. If your first guess was wrong, say what it was. The interviewer is checking that you treat people as individuals.
- id: company-google-conflicting-or-unclear-information
  q: Tell me about a time you had to make progress when the information you had was conflicting, late or unclear.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - ambiguity
    - judgment
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/competencies/ambiguity-and-shifting-priorities
  a: |-
    **What it tests.** Handling ambiguity. Google's interview preparation page names complexity and ambiguity as an area to prepare. The interviewer listens for how you separated what you knew from what you assumed, how you chose a safe first step, and how you kept others informed. At senior level you are expected to reduce the ambiguity for other people too.

    **How to shape the answer.**

    - **Situation and task.** Say what was unclear and why you could not simply wait.
    - **Action.** List what you knew, what you assumed, and what you did to test the largest assumption. Say what you decided and who you told.
    - **Result.** Say what happened, including any wrong assumption.
    - **Learning.** Say how you now decide when you know enough to act.

    **A strong answer sounds like this.** "I had five weeks to cut the cost of our event pipeline before a contract renewal. Finance said storage was the main cost. Our dashboard said compute. The detailed bill would arrive in three weeks. I wrote down both claims and picked a step that helped either way: removing 30 days of duplicate raw events, which took four days. Then I sampled one day of usage by hand and found compute was about 70 percent of the cost, so I moved two batch jobs to cheaper off-peak machines. Costs fell by 18 percent, short of our 25 percent target."

    **Watch out for.** Waiting for perfect information, acting on a guess without writing it down, and a story where only a ticket detail was missing.
  followUps:
    - q: How did you decide you knew enough to act?
      level: Mid
      a: |-
        Give your test: the step was cheap, easy to undo, and useful under each possible answer. Or say what evidence moved you from guessing to deciding. Avoid saying that you "just had a feeling".
    - q: Which of your assumptions was wrong?
      level: Mid
      a: |-
        Name one and what it cost you. Then say how you found out and how fast you changed course. An answer with no wrong assumption suggests that the situation was not really unclear.
- id: company-google-led-without-being-the-formal-leader
  q: Tell me about a time you got people on other teams to act, or helped a group succeed, when you were not the formal leader.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - influence
    - ownership
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/competencies/influence-without-authority
  a: |-
    **What it tests.** Leadership without a title. Google's interview preparation page asks candidates to think about helping a team succeed when they are not the formal leader. The interviewer listens for what you did to get people moving: a clear goal, an easy first step, and credit shared with others. At senior level the group usually spans several teams.

    **How to shape the answer.**

    - **Situation and task.** Say what the group needed and why nobody was leading it.
    - **Action.** Say how you got agreement on the goal, how you split the work, and how you handled someone who did not want to join.
    - **Result.** Give the outcome and say who got the credit.
    - **Learning.** Say what you learned about leading without a title.

    **A strong answer sounds like this.** "Our web product had 31 open accessibility bugs spread across three teams, and a customer audit was two months away. Nobody owned them. I was a mid-level engineer on one team. I grouped the bugs into five types and showed that 19 came from two shared components. I proposed one hour every Wednesday to fix them together. One engineer said he had no time, so I took his two bugs and asked him only to review. We closed 27 before the audit. In the release notes I listed every person who had fixed one."

    **Watch out for.** A story where you were in fact the appointed lead, saying "we" so often that your own actions are unclear, and doing all the work yourself.
  followUps:
    - q: How did you deal with someone who did not want to take part?
      level: Mid
      a: |-
        Say what their reason was and how you lowered the cost for them: a smaller ask, a later date, or doing part of it yourself. Show that going to their manager was not your first step.
    - q: Why did people follow you?
      level: Mid
      a: |-
        Give a concrete reason: you had done the analysis, you made the first step easy, or you took the dull tasks yourself. You had no title to use, so say what you used in its place.
- id: company-google-went-beyond-your-role
  q: Tell me about a time you did something well outside your role because it needed doing.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - ownership
    - customer-focus
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
  a: |-
    **What it tests.** Ownership beyond a job description. Candidates report this prompt in Google loops. The interviewer listens for why you stepped in, how you avoided stepping on the person whose job it was, and whether your own work suffered. At senior level they expect you to leave a fix behind, so that nobody needs to go beyond their role next time.

    **How to shape the answer.**

    - **Situation and task.** Say what your role was, what the gap was, and who was being hurt.
    - **Action.** Say whom you asked or told first, what you did, and how you protected your own commitments.
    - **Result.** Give the effect with a number.
    - **Learning.** Say who owns that work now.

    **A strong answer sounds like this.** "I am a backend engineer. Our support team answered about 90 tickets a month about failed data exports, and each one waited for an engineer to rerun a job by hand. Support tooling was not my area. I asked the support lead for a week of tickets, sat with two agents for an afternoon, and saw that most failures were time-outs on large files. I told my manager I would spend three days on it. I built a retry button for agents and split large exports into parts. Tickets fell to about 35 a month. The support tools team owns the button now."

    **Watch out for.** Doing someone else's job without telling them, a story that is really overtime on your own tasks, and no mention of what you put on hold.
  followUps:
    - q: Whose job was it, and how did they react?
      level: Mid
      a: |-
        Name the owner and say that you spoke to them before acting, or explain why you could not. Give their reaction honestly. If they were unhappy, say what you learned about asking first.
    - q: What did you stop doing to make time for it?
      level: Mid
      a: |-
        Name the task that slipped, or the agreement you made with your manager. Extra work always costs something. An answer that claims there was no trade-off sounds untrue. Say how you kept the delay small.
- id: company-google-disagreed-with-your-manager
  q: Tell me about a time you disagreed with your manager. What did you do, and how did it end?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - conflict
    - communication
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** Whether you can disagree with someone who has power over you, respectfully and with reasons. Candidates report this prompt in Google loops. The interviewer listens for how you raised it, whether you understood your manager's constraints, and what you did after the decision. A story where you stayed silent or went around your manager is weak.

    **How to shape the answer.**

    - **Situation and task.** State the decision, your view and your manager's view. Give their reason fairly.
    - **Action.** Say where and how you raised it, what evidence you brought, and what you asked for.
    - **Result.** Say who decided and what happened next. If you lost, say how you supported the decision.
    - **Learning.** Say what you learned about your manager's position or your own.

    **A strong answer sounds like this.** "My manager wanted our mobile team of five to pause test automation for a quarter and ship two partner features. I thought our manual release checks, which took two people three days, would slow those features down. I asked for 30 minutes alone with him and showed the last four releases: 24 person-days of manual testing. He explained that both partner dates were in signed contracts. We agreed a middle path. I automated only the login and payment checks, in two weeks. Manual testing fell from three days to two, and both features shipped on time."

    **Watch out for.** Disagreeing in front of the team first, describing your manager as foolish, and an ending where you were simply right.
  followUps:
    - q: What was the outcome, for the work and for your relationship with your manager?
      level: Mid
      companies: [Google]
      a: |-
        Give both. For the work, give a number or a date. For the relationship, give one sign: they asked your view on a later decision, or you now raise concerns earlier. If trust dropped, say so and say what you would change.
    - q: What if your manager had simply said no?
      level: Mid
      a: |-
        Say you would ask what would change their mind, record your concern once in writing, and then do the work properly. Add the limit: a legal, safety or ethical problem is different, and you would raise it further.
- id: company-google-real-failure-with-consequences
  q: Tell me about a real failure of yours that had consequences for other people.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  companies:
    - Google
  signals:
    - failure
    - growth
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/competencies/production-incidents-and-mistakes
  a: |-
    **What it tests.** Humility and learning. Candidates report this prompt in Google loops, sometimes in a blunt form: a time you messed up. The interviewer wants a failure with a real cost, clear ownership, and a change that lasted. At senior level the failure is usually a judgment call, and the lesson should change how a team works.

    **How to shape the answer.**

    - **Situation and task.** Say what you were responsible for and what decision you made.
    - **Action.** Say what went wrong, how you found out, what you did to limit the damage and whom you told.
    - **Result.** Give the cost honestly: time, money, users or trust.
    - **Learning.** Say what you changed in your own practice and in the team's process.

    **A strong answer sounds like this.** "As tech lead I moved our cluster to a new network plugin without a staged rollout, because the test cluster had run clean for two weeks. In production, 3 of our 40 services lost their database connections for 50 minutes. One of them was sign-in. I led the rollback, wrote the incident report and named my decision as the cause. Two teams lost a day each checking their data. I then wrote a rollout rule for platform changes: one service, then five, then all, with a day between steps. Four later changes have followed it, and one was stopped at the first step."

    **Watch out for.** A failure that was secretly a success, spreading the blame across "the team", and a lesson that never left your own head.
  followUps:
    - q: Why do you think it happened?
      level: Senior
      companies: [Google]
      a: |-
        Go one level below the event. Say what belief or pressure led to your decision, such as trust in a clean test run, or a wish to finish before a holiday. The interviewer wants a cause you can act on next time.
    - q: What did you do to rebuild trust with the people affected?
      level: Senior
      a: |-
        Say what you told them and what they saw you do afterwards: the report, the fix, and the next change handled differently. Trust returns through later behaviour, so give one example from the following months.
- id: company-google-why-google
  q: Why do you want to work at Google?
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: google-googleyness
  signals:
    - motivation
  topics:
    - /behavioral/company-playbooks/google-googleyness-and-leadership
    - /behavioral/foundations/how-behavioral-interviews-work
  a: |-
    **What it tests.** Motivation and fit. The interviewer listens for a reason that is yours and that links to things you have done. Google publishes a short list of principles, and the first is to focus on the user. A good answer can connect to one of them if your own experience backs it up. At senior level, also say what problems you want to own.

    **How to shape the answer.**

    - **Your reason first.** Give one or two reasons in the first two sentences.
    - **Evidence.** Link each reason to something you built, studied or used.
    - **Something specific.** Refer to a published principle, a product area or a type of problem.
    - **What you want to learn.** End with the work you hope to do in your first year.

    **A strong answer sounds like this.** "Two reasons. I like problems where a small improvement reaches many people. In my final-year project I cut the load time of a campus timetable site from 6 seconds to 2, and daily visits rose from about 900 to 1,400 within a month. That taught me that speed matters to users. Second, I learn fastest next to people who review code strictly. During my internship my mentor's reviews were hard, and by the end my changes needed half as many review rounds. I would like to start in web performance or developer tools."

    **Watch out for.** Praise that fits any large company, reasons about pay, perks or the name on your CV, and reciting company principles with no link to your own work.
  followUps:
    - q: What do you want to be doing in a few years?
      level: Junior
      a: |-
        Describe a direction and leave the job title out: the kind of problems you want to own and the skills you want to be known for. Link it to the role you are applying for. It is fine to say the plan may change.
    - q: What would you want to work on here, and why?
      level: Junior
      a: |-
        Name one or two areas and connect each to something you have done or studied. Then say that you are open to other areas as well. The interviewer wants real interest without a demand for one specific team.
- id: company-apple-why-apple
  q: Why do you want to work at Apple?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Apple
  signals:
    - motivation
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
  a: |-
    **What it tests.** Motivation, and fit with one team. Candidates report this opener in recruiter screens and hiring-manager rounds, often followed by "why this team" and another "why" on each reason. The interviewer listens for reasons that still hold after two or three follow-ups. At senior level, also name the kind of problem you want to own.

    **How to shape the answer.**

    - **Your reasons first.** Give two reasons in the first sentence, at least one about the work.
    - **Evidence from your past.** Tie each reason to something you have done.
    - **The team.** Say what this team builds, as far as the job post tells you, and why it fits you.
    - **What you want to do.** End with the problem you hope to pick up in the first year.

    **A strong answer sounds like this.** "Two reasons. First, I care about software that works for everyone. Accessibility is one of your published values, and it is my daily work. I own screen reader support in a banking app with 200,000 users. Last year I fixed 31 unlabelled controls, and complaints from blind users fell from about 12 a month to 3. Second, this team builds text input, which every user touches hundreds of times a day. I want to work where a small fix reaches that many people, and to own one input feature within a year."

    **Watch out for.** Praise that fits any large company, a reason about the brand alone, and an answer that falls apart on the second "why".
  followUps:
    - q: Why this team in particular?
      level: Mid
      companies: [Apple]
      a: |-
        Show that you read the job post closely. Name what the team builds, the part you could help with in your first month, and one thing you want to learn there. If you know little about the team's work, say what you do know and ask about the rest.
    - q: Why does that reason matter to you?
      level: Mid
      companies: [Apple]
      a: |-
        The interviewer is checking that the reason is your own. Go one level deeper with a short personal fact: a user you met, an event, or work you chose when you had a choice. Stop after one level. Do not invent a new reason under pressure.
    - q: What motivates you in your work?
      level: Mid
      companies: [Apple]
      a: |-
        Name one or two things that have kept you working hard on a long project, and give that project as proof. Good examples are a user problem, a hard technical limit, or teaching others. Keep pay and job titles out of the answer.
- id: company-apple-proudest-work-moment
  q: What moment in your work are you most proud of, and why that one?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Apple
  signals:
    - ownership
    - motivation
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
    - /behavioral/competencies/project-deep-dive-walkthrough
  a: |-
    **What it tests.** Ownership, and what you count as good work. Candidates report this question in hiring-manager rounds. The interviewer learns your standards from the moment you pick: a launch, a fix, a hard call or a person you helped. At senior level, the moment should show an effect beyond your own tasks.

    **How to shape the answer.**

    - **Situation and task.** Set up the work in two sentences: what it was, who used it and what your part was.
    - **Action.** Describe the moment itself and the two or three choices that were yours.
    - **Result.** Give a number, and say who noticed the change.
    - **Learning.** Say why you chose this moment, and what you would improve.

    **A strong answer sounds like this.** "The moment was the first month-end close after I rebuilt our finance data pipeline. Before, the close took analysts four days, because three source feeds disagreed and people fixed totals by hand. I wrote 40 checks that compare the feeds every night and stop the load when they differ by more than 1 percent. That month the close took two days, and nobody edited a number by hand. I am proud because the analysts stopped keeping their own spreadsheets. Next time I would turn the checks on one feed at a time. All 40 at once blocked the load for three nights."

    **Watch out for.** A team win where your part was small, pride in the technology with no person who gained from it, and saying you would change nothing.
  followUps:
    - q: What would you do differently if you did it today?
      level: Mid
      a: |-
        Name one real fault in the work and what it cost, then the change you would make. Keep it about your own choices. A candidate who finds nothing to improve in their best work sounds unaware of their own standards.
    - q: Why did you take that approach and not another one?
      level: Mid
      a: |-
        Give the one or two other options you considered and the reason each lost: cost, time, risk or effect on users. If you did not consider any other option at the time, say so, and say which one you would compare against now.
    - q: How did the rest of the team react to your decisions?
      level: Mid
      a: |-
        Describe one person who agreed and one who had doubts, and what you did about the doubts. The interviewer is checking that you noticed other people while you worked, and that your account of the project is fair to them.
- id: company-apple-most-difficult-project
  q: What is the most difficult project you have worked on, and how did you get through the hard parts?
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Apple
  signals:
    - delivery
    - growth
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
    - /behavioral/competencies/project-deep-dive-walkthrough
  a: |-
    **What it tests.** Problem solving and persistence. Candidates report this question in hiring-manager rounds. The interviewer wants to know what made the work hard, what you tried, and when you asked for help. At junior level, a defined task with a real obstacle is enough. At senior level, the difficulty should include other people or teams.

    **How to shape the answer.**

    - **Situation and task.** Say what the project was, and name the one or two things that made it hard.
    - **Action.** Go through what you tried in order, including what failed. Say when you asked for help.
    - **Result.** Give the outcome with a number, even if it is partial.
    - **Learning.** Say what you do earlier now.

    **A strong answer sounds like this.** "In my internship I had to move 220 old interface tests to a new framework in ten weeks. About a third of them failed at random, and nobody knew why. For two weeks I fixed them one by one and finished only nine. Then I asked my mentor for an hour. She suggested grouping the failures by cause. I found that 50 tests shared one timing bug in a setup helper, and fixing it passed all 50. I finished 190 of the 220 and left notes on the other 30. Now I look for a shared cause before I fix things one at a time."

    **Watch out for.** Calling a project hard only because it was long, hiding the part that failed, and a story where you never asked anyone for help.
  followUps:
    - q: How do you work in a group?
      level: Junior
      companies: [Apple]
      a: |-
        Give one habit and one example. Skip the list of adjectives. For example, you post a short update each day, or you ask for help after half a day of being stuck. Then add what a teammate would say about working with you.
    - q: Did you ask for help at the right time?
      level: Junior
      a: |-
        Answer honestly. If you waited too long, say how long and what it cost, then give the rule you use now, such as asking after half a day with no progress. Interviewers prefer a person who asks early to one who struggles in silence.
    - q: What did you leave unfinished, and what happened to it?
      level: Junior
      a: |-
        Say exactly what was left, why, and how you handed it over: notes, a ticket, or a short call with the next owner. If you know what happened later, say so. A clean handover of unfinished work is a good sign at any level.
- id: company-apple-collaborating-across-functions
  q: Tell me about a project where you worked closely with people from other functions, such as design or hardware. How did you make it work?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Apple
  signals:
    - communication
    - influence
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
    - /behavioral/competencies/cross-functional-collaboration
  a: |-
    **What it tests.** Collaboration with specialists who measure success differently from you. Apple's interview tips name working as part of a team towards a goal as an example topic, and candidates report collaboration questions inside technical rounds. The interviewer listens for how you learned their limits and what you gave up. At senior level, show a habit that lasted after the project.

    **How to shape the answer.**

    - **Situation and task.** Name the functions and what each needed. Give the constraint as a number.
    - **Action.** Say how you learned their limits, what you changed in your own work, and how decisions were made.
    - **Result.** Give the outcome, and say what each side gave up.
    - **Learning.** Name the habit that stayed after the project.

    **A strong answer sounds like this.** "I led firmware for a wearable sensor. Design wanted a case 2 millimetres thinner. Hardware said the smaller battery would cut battery life from 5 days to under 4. I spent a day with the hardware lead to learn where the power went: the radio woke up every second. I changed the firmware to send messages in batches every 10 seconds, and design accepted a short delay on one status light. We shipped the thin case with 4.6 days of battery life. The three teams now review one shared power budget every two weeks, and four later projects have used it."

    **Watch out for.** Treating design or hardware as a blocker, telling the story only from the engineering side, and sharing confidential details.
  followUps:
    - q: How do you get agreement on a project that spans several functions when the goal is still unclear?
      level: Senior
      a: |-
        Describe a method you have used. For example, write the goal on one page, list what each function needs, and settle the open points one at a time with the person who owns each. Say who made the final call when two needs could not both be met.
    - q: What did you have to learn about their work before you could be useful?
      level: Senior
      a: |-
        Give one specific thing you learned, such as how a battery is sized or why a designer protects a certain spacing. Say how you learned it and how it changed your own work. This shows respect for the other craft.
    - q: What did you give up, and do you still think that was right?
      level: Senior
      a: |-
        Name the thing you wanted and did not get, and say what it cost. Then judge the trade with what you know now. It is fine to say you would argue harder next time, as long as you supported the decision when it was made.
- id: company-apple-disagreed-with-manager-decision
  q: Tell me about a time you disagreed with a decision your manager made. What did you do?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Apple
  signals:
    - conflict
    - judgment
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** How you disagree with someone who has authority over you. Candidates report this prompt with follow-ups on your approach, the outcome, and how that manager would describe you now. The interviewer checks that you raised it directly, with evidence, and kept the relationship. At senior level, the decision should affect other people's work too.

    **How to shape the answer.**

    - **Situation and task.** State the decision and your manager's reason, fairly.
    - **Action.** Say how you raised it: in private, with data, with another option. Then say what you did once it was final.
    - **Result.** Give the outcome, including the case where the decision stood.
    - **Learning.** Say what you now do before you push back.

    **A strong answer sounds like this.** "My manager decided to keep our weekly on-call handover as a live meeting. I wanted a written handover: we have nine engineers in three time zones, and two joined at 11 at night. I showed him four weeks of notes: five open issues had been lost between shifts. He kept the meeting, because he wanted people to talk. He did agree to add a written checklist and to rotate the meeting time. Lost issues went from five a month to one. I still prefer writing only, but I ran the meeting his way. I learned to bring a proposal he could accept in part."

    **Watch out for.** Making the manager sound foolish, going over their head as a first step, and agreeing in the meeting but then doing it your own way.
  followUps:
    - q: How would that manager describe you today?
      level: Mid
      companies: [Apple]
      a: |-
        Answer in their voice, with one strength and one thing they would still want you to work on. If they have given you a reference or asked you back onto a project, say so. This checks whether the disagreement damaged trust.
    - q: What was the final outcome, and who turned out to be right?
      level: Mid
      companies: [Apple]
      a: |-
        Give the facts first, then your honest view. If your manager was right, say so and say what you had missed. If you were right, say it without scoring a point, and add what you learned about making your case earlier.
    - q: Have you ever disagreed with a peer? What happened?
      level: Junior
      companies: [Apple]
      a: |-
        Pick a small, real case. Say what each of you wanted, how you talked it through, and what you agreed on. With a peer there is no one to decide for you, so show how the two of you reached a decision yourselves.
- id: company-apple-detail-users-would-notice
  q: Tell me about a time you spent extra effort on a small detail because users would notice it.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  signals:
    - customer-focus
    - ownership
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
  a: |-
    **What it tests.** Care for the finished product, and judgment about where that care pays off. This is a general question about craft. The interviewer wants to hear how you spotted the detail, why it was worth the time, and what the user gained. At senior level, also show that the extra effort did not delay the team.

    **How to shape the answer.**

    - **Situation and task.** Name the detail and who would notice it. Say how you found it.
    - **Action.** Say what the fix cost in time, why it was worth it, and what you did.
    - **Result.** Give a before and after number, or a user's reaction.
    - **Learning.** Say how you now choose which details to spend time on.

    **A strong answer sounds like this.** "Our search box showed results 400 milliseconds after each key press. Nobody had filed a bug. But I watched five people use it in a usability session, and three of them stopped typing to wait. I spent two days on it outside the planned work, after checking with my lead that the release would not slip. I kept the old list on screen until the new one was ready, and I cached recent results. The delay fell to about 120 milliseconds, and searches per visit rose by 6 percent. I now watch real people use a feature before I call it finished."

    **Watch out for.** Polish that nobody could see or measure, extra work that delayed a release without agreement, and a claim that every detail matters equally.
  followUps:
    - q: How did you decide it was worth the time?
      level: Mid
      a: |-
        Give the reasoning you used then: how many users met the detail, how often, and what the fix would cost. Say who you checked with. The interviewer wants a decision rule, such as "daily use by most users is worth two days".
    - q: Tell me about a time you had to choose between getting something perfect and shipping it on time.
      level: Mid
      a: |-
        Say what "perfect" would have needed and what the date was for. Then explain what you shipped, what you left out, and how you made the gap safe, for example with a follow-up task that had an owner and a date.
    - q: Which details did you decide to leave alone?
      level: Mid
      a: |-
        Name one or two and give the reason: few users saw them, or the fix carried risk. This shows that your care is a choice you make with evidence. A candidate who polishes everything is as worrying as one who polishes nothing.
- id: company-apple-values-in-your-career
  q: Which of Apple's values matter most to you, and where have you shown them in your own work?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Apple
  signals:
    - motivation
    - judgment
  topics:
    - /behavioral/company-playbooks/apple-craft-and-collaboration
  a: |-
    **What it tests.** Whether your interest in the company's values is backed by your own choices. Apple publishes its shared values, among them accessibility, privacy, the environment, and inclusion and diversity. Candidates report being asked how they line up with those values and where they have shown them. Seniority shows in whether your choice changed what a team did.

    **How to shape the answer.**

    - **Pick one or two values.** Choose the ones you can prove. Skip the rest of the list.
    - **Give the proof.** Tell one short story with a decision that cost something: time, a feature or an argument.
    - **Give the result.** Say what changed for users, with a number.
    - **Connect it to the role.** Say how that value would show up in this job.

    **A strong answer sounds like this.** "Privacy is the one I can prove. I led the ranking model for a notes app with 2 million users. The first plan was to send note text to our servers for training. I argued for training on the device and sending only model updates. It cost seven extra weeks, and accuracy was 2 points lower. My team of five built it. No note text leaves the phone now. Our privacy review passed with no changes, and two other teams reused the design within a year. Here I would keep the same rule: collect the least data that does the job."

    **Watch out for.** Reciting the values page, claiming every value at once, and a value that never cost you anything.
  followUps:
    - q: Tell me about a time that value made a project slower or harder. Was it worth it?
      level: Senior
      a: |-
        Give the cost in weeks, features or money, and who was unhappy about it. Then say what the users or the company gained, and whether you would make the same choice again. A value that never cost you anything is hard to believe.
    - q: Pick a product you use often. What one thing would you change, and why?
      level: Mid
      companies: [Apple]
      a: |-
        Choose a product you know well. Name one change, the user it helps, and what it would cost to build. Show that you noticed a real detail and thought about the trade-off. Avoid a long list of complaints.
    - q: Where do you want your career to go from here?
      level: Mid
      companies: [Apple]
      a: |-
        Give a direction for the next three to five years, and connect it to this role: deeper in one technical area, or wider across a product. Say what you want to learn first. Do not name a title as your goal.
- id: company-netflix-what-you-made-of-culture-memo
  q: What did you make of our culture memo?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Netflix
  signals:
    - motivation
    - judgment
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
  a: |-
    **What it tests.** Whether you have read the memo and thought about it. Netflix publishes it on its careers site. Candidates report this question in recruiter screens and again in later rounds. The interviewer wants your own reading: what fits how you work, and what you would find hard. At senior level, speak about judgment and candour from experience.

    **How to shape the answer.**

    - **Your overall view first.** Say in one sentence what the memo asks of people, in your own words.
    - **One part that fits you.** Name it and give a short example from your work.
    - **One part you would find hard.** Be specific, and say how you would handle it.
    - **A question.** End with something you want to know about how the team applies it.

    **A strong answer sounds like this.** "I read it twice. My short version: build a team of strong people, keep process light, and be direct with each other. The part on candour fits me. On my team of six, I started written feedback after each launch, and we have done it for 11 launches. The part I would find hard is People Over Process. I am used to an approval board for database changes. Without one, I would write down my own checks for a risky change and ask a peer to review them. How does this team handle that today?"

    **Watch out for.** Repeating the memo back, saying you agree with all of it, and criticising a part you have not read closely.
  followUps:
    - q: Which part of the memo do you disagree with, or find unclear?
      level: Mid
      companies: [Netflix]
      a: |-
        Pick one real point. Show that you understand why it is there before you question it, and tie your doubt to something you have seen at work. One candidate reports being turned down after voicing disagreement, so explain your reasoning with care and stay curious.
    - q: Tell me about a time you upheld or challenged a written culture or policy at work.
      level: Mid
      a: |-
        Give a case where a written rule met a real situation. Say what the rule was for, what you did, and who you told. Whether you followed it or questioned it, show that you acted in the open and thought about the purpose behind the rule.
    - q: How would working this way differ from your current job?
      level: Mid
      a: |-
        Compare two or three concrete things, such as who approves a change or how feedback is given. Say which difference you would enjoy and which would take effort. A plain comparison shows you have pictured the daily work and not only the ideas.
- id: company-netflix-one-memo-value-story
  q: Pick one of the values in our culture memo and tell me about a time you showed it.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Netflix
  signals:
    - motivation
    - judgment
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
  a: |-
    **What it tests.** Whether you can connect a named value to your own behaviour. The memo lists behaviours it values, among them selflessness, judgment, candor, courage, curiosity and resilience. Candidates report being asked to pick one and give a story. The interviewer checks that the story fits the value and cost you something. At senior level, it should affect other teams.

    **How to shape the answer.**

    - **Situation and task.** Name the value and what it means to you. Then set up a case where it was tested.
    - **Action.** Say what you did and what it cost you.
    - **Result.** Give the outcome with a number.
    - **Learning.** Say where you still fall short on this value.

    **A strong answer sounds like this.** "I will take selflessness. To me it means helping the company win when my own goals lose. Last spring the payments team had a database migration that was three weeks late. I lead our alerting project, and I had the migration experience they lacked. I lent them myself and one engineer for two weeks. They finished four days before a contract deadline. My own project slipped by a month, and I missed my quarterly goal. I told my stakeholders the new date on day one. I still resent that kind of trade for a few days before I accept it."

    **Watch out for.** Choosing a value because it sounds impressive, a story with no cost to you, and a definition the memo would not support.
  followUps:
    - q: What did that cost you?
      level: Senior
      a: |-
        Give the cost plainly: a missed goal, a slower promotion case, or a weaker review. Then say why you would still do it, or where you would draw the line next time. An answer with no cost suggests the story was easy, and easy stories prove little.
    - q: Which of the values is hardest for you, and why?
      level: Senior
      a: |-
        Name one and give a recent moment when you fell short on it. Then say what you are doing about it, with one habit. Avoid a value that is safe to be weak in. The interviewer is checking your self-awareness more than the value itself.
    - q: Tell me about a time you argued for something unpopular.
      level: Senior
      a: |-
        Say what the position was, who disagreed and what you risked by speaking. Give the evidence you brought and what happened. If you did not change the outcome, say so, and say whether you supported the decision that was made afterwards.
- id: company-netflix-why-netflix
  q: Why Netflix?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Netflix
  signals:
    - motivation
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
  a: |-
    **What it tests.** Motivation, and whether you know what kind of workplace you are choosing. Candidates report this in the recruiter screen. The interviewer wants one reason about the work and one about the way of working, both backed by your past. A senior answer also says what you would want to own.

    **How to shape the answer.**

    - **Your reasons first.** Give one reason about the work and one about how the company works.
    - **Evidence from your past.** Show a time you did well with little process.
    - **Honest fit.** Say what you expect to be hard.
    - **What you want to do.** Name the problems you would like to work on.

    **A strong answer sounds like this.** "Two reasons. First, the data problems. I run pipelines that handle 80 million events a day, and I want to work at a size where late and duplicate events are normal. Second, the way you work. The memo puts people over process, and I do my best work that way. For a year I was the only data engineer at my company. I chose our warehouse design, cut the nightly load from 5 hours to 2, and wrote down each choice so others could challenge it. I expect the direct feedback to be hard at first, and I want it."

    **Watch out for.** Stopping at "I love the shows", describing the culture as freedom with no mention of what it asks of you, and not having read the memo.
  followUps:
    - q: Why are you looking for a new role, and what do you want in the next one?
      level: Mid
      companies: [Netflix]
      a: |-
        Give one honest reason for moving that is about the work, such as scope or pace, and two things you want next. Make them match the role. Speak fairly about your current employer: the interviewer notes how you talk about people who are not in the room.
    - q: What do you like about our culture, and what worries you about it?
      level: Mid
      a: |-
        Name one part you like and prove it with your own behaviour. Then name one real worry, such as how new people learn without much process, and ask how the team handles it. A worry stated as a question sounds thoughtful.
    - q: Which level do you think fits you, and why?
      level: Senior
      a: |-
        Argue from scope. Say how large your recent work was: how many people it involved, how unclear the goal was, and who depended on it. Then name the level that matches and one gap you would close first. Avoid arguing from years of experience alone.
- id: company-netflix-recent-critical-feedback
  q: Tell me about critical feedback you received recently. How did you react, and what did you change?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Netflix
  signals:
    - feedback
    - growth
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** How you take direct feedback. Candor is one of the behaviours the culture memo names, and candidates report this question in the recruiter screen and the onsite. The word "recent" matters: pick something from the last year. The interviewer wants your honest first reaction and a change that others could see. At senior level, the feedback should be about how you work with people.

    **How to shape the answer.**

    - **Situation and task.** Say who gave the feedback, when, and what they said.
    - **Action.** Give your first reaction honestly. Then say how you checked the feedback and what you changed.
    - **Result.** Give a sign that it worked, ideally from another person.
    - **Learning.** Say how you ask for feedback now.

    **A strong answer sounds like this.** "Four months ago a product partner told me my experiment reports were hard to act on: 12 pages and no recommendation. My first reaction was defensive, because I thought the detail showed care. I asked two other readers, and both said they read only the charts. I changed the format to one page, with the decision I recommend first, then three numbers, and the detail in an appendix. On the next six reports, a decision came within two days each time. Before, it took over a week. Once a quarter I now ask each reader what they skipped."

    **Watch out for.** Feedback from years ago, a weakness that is really a strength, and leaving out your first reaction as if you felt nothing.
  followUps:
    - q: How did you respond in the moment?
      level: Mid
      companies: [Netflix]
      a: |-
        Say what you felt and what you said, even if it was not your best moment. A good answer is short: you thanked them, asked for one example, and took a day to think. Claiming you felt nothing is less believable than admitting you were defensive.
    - q: What did you change afterwards, and how do you know it lasted?
      level: Mid
      companies: [Netflix]
      a: |-
        Name the habit, then give evidence from at least a month later: a second project where you did the same thing, or a comment from the person who gave the feedback. Mentioning one time you slipped back and noticed makes the answer more believable.
    - q: Give me an example of constructive feedback you gave a teammate or a partner in another function.
      level: Mid
      companies: [Netflix]
      a: |-
        Say what you saw, why you chose to raise it, and how you said it: in private, about behaviour, with one example. Then give the outcome, including how the person reacted. Show that you gave the feedback to help them and not to win a point.
- id: company-netflix-hard-feedback-to-senior-person
  q: What is the hardest feedback you have given to your manager or to someone more senior than you?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  signals:
    - feedback
    - communication
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** Candour upward. The culture memo lists candor and courage among the behaviours it values. The interviewer wants to hear that you told the person directly, prepared with care, and accepted the risk. At senior level, the feedback should concern something that affected a whole team.

    **How to shape the answer.**

    - **Situation and task.** Say who the person was, what you saw, and what it cost the team.
    - **Action.** Say how you decided to raise it, where you did it, and the words you used.
    - **Result.** Say what the person did, including what did not change.
    - **Learning.** Say what you would change in how you gave it.

    **A strong answer sounds like this.** "I told my director that his weekly status review was making teams hide problems. I lead the mobile team, and I had seen three projects reported as on track a week before they slipped. I asked for 30 minutes in private and brought those cases. I said: 'When someone reports a risk, the first question is who is at fault, so people stop reporting.' He disagreed, then asked for a week to watch for it. He changed the first question to 'what do you need'. He kept the meeting, which I had hoped he would drop. Early risk reports rose from one a month to five."

    **Watch out for.** Feedback sent through someone else, a complaint about character instead of behaviour, and a story with nothing at risk for you.
  followUps:
    - q: What exactly did you say?
      level: Senior
      a: |-
        Give the sentence as close to word for word as you can. A good one names the behaviour, its effect and a request, with no judgment of the person. If your first sentence came out badly, say so and say how you recovered in the conversation.
    - q: How did you decide it was worth raising?
      level: Senior
      a: |-
        Explain the test you applied: what the behaviour was costing, whether the person could change it, and whether you had enough examples. Say who you checked your view with, if anyone. Raising everything is as weak a signal as raising nothing.
    - q: What would you have done if nothing had changed?
      level: Senior
      a: |-
        Give a next step that is fair to the person: one more direct conversation with new evidence, then telling them you plan to raise it with their manager. Say where you would stop. The interviewer wants persistence without going behind anyone's back.
- id: company-netflix-decision-without-asking-permission
  q: Tell me about an important decision you made without asking for approval first.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  signals:
    - judgment
    - ownership
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
  a: |-
    **What it tests.** Judgment when nobody checks your work first. The culture memo has a section called People Over Process and lists judgment among the behaviours it values. The interviewer wants to know what you knew, how sure you were, why you did not ask first, and how you told people. At senior level, a wrong call should carry a real cost.

    **How to shape the answer.**

    - **Situation and task.** State the decision, why it was yours, and what a wrong call would have cost.
    - **Action.** Say what information you had, how confident you were, and who you told and when.
    - **Result.** Give the outcome with a number, including what you got wrong.
    - **Learning.** Say where your line now is between deciding alone and asking.

    **A strong answer sounds like this.** "I paused a database migration halfway through, on a Saturday, without asking anyone. I own our order service. Error rates on the new tables had gone from 0.1 percent to 0.9 percent, and my manager was on a flight. I was about 70 percent sure the migration was the cause. Pausing would cost a week, and continuing could corrupt orders. I paused it and wrote to the team within ten minutes, listing what I did not know. The cause was a bad index, so half my theory was wrong. We lost six days and no orders."

    **Watch out for.** A decision too small to matter, acting alone when the right person was easy to reach, and telling nobody until it was over.
  followUps:
    - q: What information did you have, and how confident were you at the time?
      level: Senior
      a: |-
        List the two or three facts you had and the one you most wanted and lacked. Give your confidence as a rough number and say what it rested on. Do not rewrite the past: if you were unsure, say so, and explain why acting was still right.
    - q: Why did you not escalate it?
      level: Senior
      a: |-
        Give the real reason: the decision was inside your area, the cost of waiting was high, or the person was out of reach. Then say what you did to keep others informed. Add one example of a decision you would escalate, to show where your line is.
    - q: What would have made you ask first?
      level: Senior
      a: |-
        Name the conditions: a change that cannot be undone, a cost above a set amount, or an effect on another team's customers. This shows that deciding alone was a choice based on the size of the risk, and that you do not skip people by habit.
- id: company-netflix-manager-project-went-badly
  q: As a manager, tell me about a project on your team that went badly. What was your part in it?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Netflix
  signals:
    - people-management
    - failure
  topics:
    - /behavioral/company-playbooks/netflix-culture-and-judgment
    - /behavioral/leveling-and-tracks/engineering-manager-behavioral
  a: |-
    **What it tests.** Accountability in a leader. Candidates for manager roles report this prompt. The interviewer wants a real failure, the decisions that were yours, and what you changed in how you lead. Cover the project and the people. Blaming the team fails, and so does vague blame of yourself.

    **How to shape the answer.**

    - **Situation and task.** Say what the project was, the size of the team, and what "badly" meant in numbers.
    - **Action.** Name your own decisions that contributed: a goal you set, a risk you ignored, or news you gave late.
    - **Result.** State the cost plainly, and what you did for the team afterwards.
    - **Learning.** Say what you changed in how you manage.

    **A strong answer sounds like this.** "I managed seven engineers on a rewrite of our recommendations service. I told my director it would take four months. It took nine, and we cancelled one of its three goals. My part was clear. I accepted the estimate from my most senior engineer without asking the others, and two of them had doubts they never raised. I also waited until month five to say we were late. Afterwards I ran a review with the team. Now each engineer comments in writing on an estimate before I commit, and I report risk every two weeks. Our next five-month project finished ten days late."

    **Watch out for.** Blaming an engineer or another team, a failure that was really a success, and lessons about the project with none about your own management.
  followUps:
    - q: What did you tell your own manager, and when?
      level: Senior
      a: |-
        Give the date you first knew and the date you said it. If there was a gap, own it and explain what you do now, such as reporting risk on a fixed schedule. Late bad news is often the real failure in a story like this.
    - q: How have you resolved conflict and built bridges between teams?
      level: Senior
      a: |-
        Give one case with two teams, the cause of the friction and what each side wanted. Say what you did in person, what you asked your own team to change first, and one sign that the two teams work better together now.
    - q: How would you handle a team where several people are very unhappy?
      level: Senior
      a: |-
        Start with listening: one to one talks to find the causes, which often differ by person. Then say what you would fix yourself, what you would raise upward, and what you would tell the team openly. Give a time frame, and avoid promising what you cannot deliver.
- id: company-microsoft-conflict-with-teammate
  q: How do you handle conflict inside your team? Tell me about one real conflict with a teammate.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Microsoft
  signals:
    - conflict
    - communication
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** How you work with others when it gets uncomfortable. Microsoft's interview tips say to bring examples of working with others, and this is one of the prompts candidates report most. The interviewer wants a real conflict between two people, what you did yourself, and how it ended. At senior level, the conflict should reach beyond your own team.

    **How to shape the answer.**

    - **Situation and task.** Say what the conflict was about and what it cost. Describe behaviour, not character.
    - **Action.** Say how you raised it, what you learned about their side, and what you each changed.
    - **Result.** Give the outcome for the work and for the relationship.
    - **Learning.** Say what you saw about your own part. Microsoft's guidance adds a reflection step to STAR.

    **A strong answer sounds like this.** "A teammate and I clashed over code reviews. He left 20 or more comments on each change, mostly on naming, and my reviews took three days. I complained to someone else first, which was a mistake. Then I asked him for a call. He said two bugs last year came from unclear names, and he felt nobody else cared. We agreed to move naming rules into the linter and to mark comments as blocking or optional. My review time fell from three days to one. My part was that I had read his care as a personal attack."

    **Watch out for.** Calling the teammate difficult, a conflict your manager solved for you, and an ending with no change on your side.
  followUps:
    - q: How was it resolved in the end, and how do you two work together now?
      level: Mid
      companies: [Microsoft]
      a: |-
        State what you both agreed and whether it held. Then give one concrete sign of the relationship today: they asked you for a review, or you paired on a later project. If it stayed cool, say so plainly and say what you learned.
    - q: Tell me about a difficult coworker you have worked with. What happened?
      level: Mid
      a: |-
        Describe what the person did, without labels, and what it cost the work. Say what you tried, in order, and what changed. Include one thing you learned about why they acted that way. The interviewer listens for respect as much as for the result.
    - q: What would you do if talking to the person directly did not work?
      level: Mid
      a: |-
        Say you would try once more with a specific example and a clear request. If that failed, you would tell the person that you plan to involve your manager, then ask the manager for help with the problem. Involve others openly, never behind the person's back.
- id: company-microsoft-failure-and-what-you-learned
  q: Tell me about a time you failed. What did it cost, and what did you learn?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Microsoft
  signals:
    - failure
    - growth
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
    - /behavioral/competencies/production-incidents-and-mistakes
  a: |-
    **What it tests.** Growth mindset, which Microsoft's careers pages name as something its hiring process looks at. This is one of the most reported Microsoft behavioural prompts. The interviewer wants a failure that was yours, its cost to the company, and learning you have used since. At senior level, the lesson should have changed how a team works.

    **How to shape the answer.**

    - **Situation and task.** Say what you were trying to do and what you were responsible for.
    - **Action.** Say plainly what you did wrong, and what you did once you knew.
    - **Result.** Give the cost in numbers: users, money or days.
    - **Learning.** Name the habit you changed and a later time you used it. This is the reflection step.

    **A strong answer sounds like this.** "I added a cache to our pricing service to cut response time. I set a 30-minute expiry and never tested what happens when a price changes. For most of a day, about 4 percent of customers saw old prices at checkout. Support handled 310 tickets, and we refunded about 9,000 dollars. I found it from a support thread, turned the cache off and wrote the incident review myself. My mistake was testing speed and not correctness. Now every cache I add has a test for stale data. Two months later that test caught the same bug in a teammate's change."

    **Watch out for.** A failure with no cost, a failure that was someone else's fault, and a lesson so general that it could follow any story.
  followUps:
    - q: What was the impact on the company?
      level: Mid
      companies: [Microsoft]
      a: |-
        Give the largest honest number you have: customers affected, money, hours of other people's time. If you never measured it, estimate and say how. Making the impact sound small also makes your learning sound small, so state it at full size.
    - q: Where have you applied that lesson since?
      level: Mid
      companies: [Microsoft]
      a: |-
        Give one later project with a date and what you did differently because of the failure. If the new habit prevented a problem, say what it caught. A lesson with no later use sounds like a sentence written for the interview.
    - q: Tell me about a time things did not turn out as you expected. What did you do?
      level: Mid
      companies: [Microsoft]
      a: |-
        Choose a case where the plan changed and no one was at fault, such as a dependency that arrived late. Say how quickly you noticed, what you told others, and how you changed the plan. The interviewer is listening for calm and for early communication.
- id: company-microsoft-technical-disagreement
  q: Tell me about a technical disagreement with a colleague. How did you handle it, and who decided?
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Microsoft
  signals:
    - conflict
    - judgment
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
    - /behavioral/competencies/technical-conflict-and-alignment
  a: |-
    **What it tests.** Whether you can disagree about a design and stay open to being wrong. One candidate reports that a senior manager's round looked for growth mindset in how they handled technical disagreement. The interviewer checks that you tested the other view fairly, that a decision got made, and that you backed it. At senior level, the disagreement should affect other teams.

    **How to shape the answer.**

    - **Situation and task.** State both positions and the reason behind each, fairly.
    - **Action.** Say how you tested the options: a prototype, a measurement or a written comparison. Say who decided.
    - **Result.** Give the outcome with a number, and say whose view was closer to right.
    - **Learning.** Say what you took from the other person's view.

    **A strong answer sounds like this.** "I wanted to move our daily sales pipeline to streaming. A senior engineer on the reporting team wanted to keep the batch job and run it hourly. My reason was fresh data. Hers was that 14 reports assumed complete days. We agreed to measure for two weeks. I built a streaming version of one table. It was fresh within a minute, but 3 of the 14 reports broke on partial days. We chose hourly batch, plus streaming for one table. She was mostly right. I wrote the decision down, and both teams now run that two-week test before pipeline changes."

    **Watch out for.** A story where the other person was simply wrong, a disagreement with no decision, and agreeing in the room while still arguing afterwards.
  followUps:
    - q: What if the other person had still preferred their approach after hearing you out?
      level: Senior
      companies: [Microsoft]
      a: |-
        Say you would agree on who decides and what evidence would settle it, then accept the result. If the choice is easy to reverse, you would try their way first with a check date. Do not describe winning by repeating your argument or by going around them.
    - q: Did you back the final decision fully?
      level: Senior
      companies: [Microsoft]
      a: |-
        Answer yes or no first. Then give proof: you wrote the decision down, built part of it, or defended it to others. If you still had doubts, say how you raised them once, in the right place, and then stopped.
    - q: Tell me about a time your team could not agree on a design.
      level: Senior
      a: |-
        Describe how the group got from several opinions to one decision. Say what you did to make the options and the criteria clear, who made the final call, and how people who disagreed were treated afterwards. A named decision owner is a good sign.
- id: company-microsoft-critical-feedback-what-changed
  q: Tell me about critical feedback you received. What did you do with it?
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Microsoft
  signals:
    - feedback
    - growth
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
    - /behavioral/competencies/feedback-and-difficult-conversations
  a: |-
    **What it tests.** Growth mindset in practice. Microsoft's interview tips tell candidates to prepare examples of applying feedback. The interviewer wants the feedback in plain words, what you did in the following weeks, and proof that you improved. At junior level, feedback on one skill is fine. At senior level, expect feedback on how you lead or work with other teams.

    **How to shape the answer.**

    - **Situation and task.** Say who gave the feedback and what it was, in their words if you can.
    - **Action.** Say what you did in the first week and what you kept doing after that.
    - **Result.** Give a sign of improvement that someone else could see.
    - **Learning.** Say what you learned about how you work.

    **A strong answer sounds like this.** "In the fourth week of my internship, my mentor told me my pull requests were too large to review. One had 1,400 changed lines and sat for six days. I felt embarrassed, because I thought a big change showed I was productive. I asked her to show me a good one. Then I split my feature into five parts of under 200 lines each and wrote a short plan first. Reviews came back in a day. By the end of the summer I had merged 23 changes, and in my final review she said mine were the easiest on the team to read."

    **Watch out for.** Feedback you still think was unfair, a change that lasted one week, and a story that ends at thank you.
  followUps:
    - q: What exactly did you change?
      level: Junior
      companies: [Microsoft]
      a: |-
        Name the new habit in one sentence, with a number if you can: changes under 200 lines, a plan before code, a draft shared on day two. Then say how long you have kept it. A habit you can describe exactly sounds real.
    - q: What are your top two strengths and your top two weaknesses?
      level: Junior
      companies: [Microsoft]
      a: |-
        Give each one with a short proof. For the weaknesses, choose real ones that matter in the job, and say what you are doing about each. Two honest weaknesses with a plan are stronger than two disguised strengths.
    - q: How do you ask for feedback now?
      level: Junior
      a: |-
        Describe what you do without being asked: you request a review early, or you ask one specific question after each project, such as "what should I have shared sooner". Asking for feedback before it is given is the clearest sign that you learned from it.
- id: company-microsoft-why-microsoft-why-this-role
  q: Why Microsoft, and why this role?
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Microsoft
  signals:
    - motivation
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
  a: |-
    **What it tests.** Motivation, and whether you know the job you are applying for. Candidates report it, including from the senior interviewer in the last conversation of the loop. The interviewer wants a reason for the company, a reason for the role, and past work that links the two. A senior answer also says what you would want to own.

    **How to shape the answer.**

    - **The company.** Give one reason tied to something the company has published, such as its growth mindset.
    - **The role.** Say what the team does and where the job post matches your experience.
    - **Evidence.** Give past work that proves the match, with a number.
    - **What you want.** Say what you hope to learn or own in the first year.

    **A strong answer sounds like this.** "For the company: your culture pages talk about a growth mindset, and I want a place where saying 'I do not know yet' is normal. For the role: this team runs build infrastructure, and that is my work today. I am a platform engineer for 120 developers. Last year I cut our average build from 14 minutes to 9 by caching test results. Your job post mentions builds across many repositories, which I have not done at your size. I want to learn that, and to own one part of the build service within a year."

    **Watch out for.** Not knowing which role the interview is for, reasons that are only about stability or the brand, and criticism of your current employer as the main reason.
  followUps:
    - q: What do you expect to find here that you have not found elsewhere?
      level: Mid
      companies: [Microsoft]
      a: |-
        Name one or two specific things, such as the size of the systems, the range of customers, or a way of working the company has written about. Tie each to something you tried to get in your current job and could not. Avoid general praise.
    - q: Why do you want to leave your current company?
      level: Mid
      companies: [Microsoft]
      a: |-
        Give one reason about the work, such as scope you have outgrown, and say what you did to find it where you are before deciding to move. Stay fair to your employer. Then turn to what you want next, which should match this role.
    - q: Do you see yourself on the individual contributor track or the manager track?
      level: Senior
      companies: [Microsoft]
      a: |-
        Give a clear answer for the next few years and the evidence behind it: what work gives you energy, and what you have already tried. If you are open to both, say which you would choose today. Candidates report being asked whether they would accept the other track.
- id: company-microsoft-resume-project-deep-dive
  q: Pick one project from your resume and take me through it in depth.
  level: Junior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  companies:
    - Microsoft
  signals:
    - ownership
    - communication
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
    - /behavioral/competencies/project-deep-dive-walkthrough
  a: |-
    **What it tests.** Depth and honest ownership. Candidates report this as a common shape of the hiring-manager conversation: one project at length, with behavioural questions mixed in. The interviewer keeps asking "why" until they reach the edge of what you know. At junior level, a course or internship project is fine if you can explain every choice.

    **How to shape the answer.**

    - **Choose well.** Pick the project where you made the most decisions yourself. Depth matters more than size.
    - **Short summary.** Say what it did, who used it and what your part was.
    - **Three decisions.** For each, give the options, your choice and the reason.
    - **Result and limits.** Give a number, then say what was weak.

    **A strong answer sounds like this.** "I will take my final-year project, a bus arrival predictor for our university shuttle. Three of us built it, and I owned the data pipeline and the model. The shuttle sends its position every 30 seconds. I first tried a neural network, but with six weeks of data it was worse than a simple average by time of day. So I used the average plus a correction for the current delay. Median error fell from 4 minutes to 90 seconds, and about 600 students used it each week. Its weak point is rain, when errors double. With more time I would add weather data."

    **Watch out for.** Choosing the biggest project when your part was small, saying "we" for every decision, and guessing when you reach the edge of what you know.
  followUps:
    - q: What was the hardest challenge in that project?
      level: Junior
      companies: [Microsoft]
      a: |-
        Pick one challenge and stay on it. Say why it was hard, what you tried first, what failed and what worked in the end. Include the moment you asked for help or looked something up. One challenge in detail is better than three in a list.
    - q: Why did you make those design choices, and what did you trade away?
      level: Junior
      companies: [Microsoft]
      a: |-
        For one choice, name the other option, the reason you rejected it and what your choice cost you, such as accuracy for speed. If you chose it because it was the only tool you knew, say so and name what you would compare now.
    - q: What exactly was your own contribution?
      level: Junior
      companies: [Microsoft]
      a: |-
        Use "I" and list what you designed, wrote and decided. Give a rough share, such as the pipeline and model while two teammates built the app. Credit the others by name of role. Clear lines make your part more believable.
- id: company-microsoft-customer-wanted-different-direction
  q: Tell me about a time a customer asked for one thing and you believed a different direction would serve them better.
  level: Senior
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  signals:
    - customer-focus
    - influence
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
    - /behavioral/competencies/cross-functional-collaboration
  a: |-
    **What it tests.** Customer focus with judgment. Microsoft's careers pages list customer obsession among the things its hiring process looks at. The interviewer wants to hear how you found the need behind the request, how you made your case, and who made the final choice. At senior level, the account is large and other teams depend on the answer.

    **How to shape the answer.**

    - **Situation and task.** Say who the customer was, what they asked for, and why you doubted it.
    - **Action.** Say how you learned what they needed, what you proposed, and who decided.
    - **Result.** Give the outcome for the customer with a number.
    - **Learning.** Say how you now handle a request that does not match the need.

    **A strong answer sounds like this.** "A logistics customer with 40 warehouses asked for a custom export of every scan event, about 2 million rows a day. I lead the integrations team. I spent two days with their operations staff. They wanted to know which shipments were late, and planned to work it out from the export. I proposed a late-shipment alert and showed a prototype in ten days. They agreed to try it for a month, with the export as a fallback. They never asked for the export. Their late-shipment calls to our support fell by 30 percent. My team now talks to end users before building any custom request."

    **Watch out for.** Deciding for the customer without telling them, a customer who was simply wrong, and no evidence of the need beyond your opinion.
  followUps:
    - q: What would you have done if the customer had insisted on the original request?
      level: Senior
      a: |-
        Say you would state your concern once, clearly, with the evidence, and then respect their choice if the request was safe and theirs to make. Add what you would do to limit the cost, such as building the smallest version first and agreeing a date to review it.
    - q: How do you handle a critical customer issue or a high-pressure escalation?
      level: Mid
      a: |-
        Give your order of work: stop the harm, tell the customer what you know and when the next update will come, then find the cause. Use one real case with times. Regular updates, even with no news, are what customers remember.
    - q: How do you manage competing priorities?
      level: Mid
      a: |-
        Describe your method with one example: list the requests, rank them by effect on customers and by deadline, and tell the people whose work will wait. Say who you asked when two priorities truly conflicted. Quietly doing everything late is the wrong answer.
- id: company-microsoft-made-team-more-inclusive
  q: Tell me about a time you changed how a team or a meeting worked so that more people could contribute.
  level: Mid
  category: company-values-and-ai-ethics
  subcategory: meta-google-apple-netflix
  signals:
    - communication
    - influence
  topics:
    - /behavioral/company-playbooks/microsoft-growth-mindset
  a: |-
    **What it tests.** Whether you notice who is left out and act on it. Microsoft's careers pages say its hiring process looks at being diverse and inclusive. The interviewer wants a specific person or group, a concrete change, and evidence that they contributed more. At senior level, the change should become a team practice that lasts.

    **How to shape the answer.**

    - **Situation and task.** Say who was not being heard and how you noticed. Name the cause: time zone, language, seniority or a tool.
    - **Action.** Say what you changed, and how you checked it with the people affected.
    - **Result.** Give evidence that they contributed more.
    - **Learning.** Say what you now watch for in a new team.

    **A strong answer sounds like this.** "Our design reviews were live calls late in my afternoon. Three of our eight engineers work nine hours ahead, so they watched recordings and commented after decisions were made. None of the last ten design decisions had come from them. I asked each of them what would help. Then I proposed sending every design in writing 48 hours before the call, and alternating the call time each month. My lead agreed to a two-month trial. In that time, four of nine decisions changed because of their comments, and one comment caught a caching bug before we built it. We kept the practice."

    **Watch out for.** A general statement that you value inclusion, speaking for people without asking them, and no change in how the team works.
  followUps:
    - q: How did you know the change helped the people it was meant for?
      level: Mid
      a: |-
        Say that you asked them, and give what they said. Add one thing you could count, such as comments made or decisions changed. If part of the change did not help, say what you adjusted. Evidence from the people affected matters most here.
    - q: Tell me about a time a teammate made you see a problem differently.
      level: Mid
      a: |-
        Give the view you held, what the teammate said, and what you changed because of it. Choose a case where their background or role differed from yours. Give them the credit by describing exactly what they saw that you had missed.
    - q: How do you work with teammates in other regions, or with people who work from home?
      level: Mid
      a: |-
        Describe two or three habits: decisions written down, meeting times that rotate, and questions asked in shared channels where everyone can see the answer. Give one example where a habit prevented a problem. Show that you plan for people who are not in the room.
