- id: a-customer-insists-on-fine-tuning-an-open-model-on-their-sup
  q: A customer insists on fine-tuning an open model on their support tickets because “we want our own model.” You think RAG solves it. What do you do?
  a: |
    Understand why they want their own model: control, privacy, cost, independence from vendors. Then run a fair comparison on their own evaluation set built from real tickets: RAG over their knowledge base and resolved tickets versus a fine-tuned model, measuring accuracy, freshness, cost and maintenance.

    Usually RAG wins for knowledge that changes, while fine-tuning can add tone and format. Often the answer satisfies both: an open model they host and control, with RAG for knowledge and light fine-tuning for style, and evaluation they own.
  level: Senior
  category: forward-deployed
  subcategory: escalations
  companies:
  - Databricks
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  source: outcome-school
- id: an-agent-you-shipped-four-months-ago-runs-on-a-base-model-be
  q: An agent you shipped four months ago runs on a base model being deprecated in 60 days. How do you swap the model without regressing quality, and what had to be in place beforehand?
  a: |
    What needed to be in place: a versioned evaluation suite from real usage, traces of production traffic, prompts and tool definitions separated from the model choice, a model selection layer, and a canary or shadow rollout path with monitoring.

    The swap: run the evaluation suite on candidate models, adjust prompts and tool descriptions where behavior differs, compare quality, cost and latency, shadow the new model on live traffic, roll out gradually with automatic rollback triggers, and complete it well before the deprecation date.
  level: Senior
  category: forward-deployed
  subcategory: escalations
  companies:
  - Databricks
  related: /ai-system-design/genai-system-design/forward-deployed-ai-engineering
  source: outcome-school
- id: a-partner-reports-that-harvey-missed-a-change-of-control-cla
  q: A partner reports that Harvey missed a change-of-control clause in a contract it reviewed. Debug it.
  a: |
    Get the document and the exact question, then trace the run: was the clause parsed correctly (scanned pages, unusual formatting), was it chunked intact, was it retrieved for the question, was it ranked high enough to reach the model, and did the model read it but misjudge it, for example because it used non-standard wording or relied on a defined term elsewhere?

    Fix the identified stage: parsing, chunking around clauses, query expansion for alternative phrasings such as "assignment" or "merger", definition expansion, or prompt and verification changes. Add the document to the evaluation set, check for similar misses across past reviews, and report back to the partner with the cause and fix.
  level: Senior
  category: forward-deployed
  subcategory: escalations
  companies:
  - Harvey
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: a-customer-executive-says-the-ai-keeps-getting-things-wrong
  q: A customer executive says “the AI keeps getting things wrong” and wants to cancel the pilot. Walk me through your next 48 hours.
  a: |
    Listen first and get specific examples, then within a day collect and categorize failures: data issues, retrieval, model errors, workflow fit or mismatched expectations. Quickly fix the largest category, add safeguards such as human review where errors are costly, and communicate what you found and what changed.

    Within 48 hours, return with measured improvement on their cases, an agreed definition of success with an evaluation set they trust, and a short plan with milestones. Be honest about what the AI can and cannot do, and propose narrowing scope to where it reliably adds value if needed.
