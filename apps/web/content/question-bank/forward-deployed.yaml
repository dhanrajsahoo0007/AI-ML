- id: a-freight-rail-operator-loses-tens-of-millions-a-year-to-unp
  q: A freight rail operator loses tens of millions a year to unplanned locomotive downtime. Decompose this into an engineering plan.
  a: |
    Decompose: which failures cause the most downtime and cost (by component and locomotive type), what data exists (sensor telemetry, maintenance logs, inspections, parts records), and what decisions could change (inspection schedules, part replacement, routing around risky units).

    Plan: integrate data into a unified view per locomotive, build failure-prediction models for the top failure modes, deliver ranked maintenance recommendations to planners in their tools, run a pilot on part of the fleet comparing downtime with a control group, and expand once savings are measured. Include data quality work and change management with maintenance teams.
