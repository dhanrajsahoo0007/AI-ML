- id: design-an-application-to-catalog-and-log-species-while-explo
  q: Design an application to catalog and log species while exploring an unfamiliar environment.
  a: |
    A mobile app that works offline: users capture photos or audio, an on-device vision or audio model suggests likely species with confidence, and users confirm or correct. Each observation records location, time and media, stored locally and synced when online.

    Add a larger cloud model and expert review for uncertain identifications, maps of observations, and a feedback loop that uses confirmed observations to improve the models. Handle battery and storage limits, privacy for sensitive species locations, and evaluation of identification accuracy by region.
