- id: an-enterprise-customer-says-claude-hallucinates-too-much-in
  q: An enterprise customer says “Claude hallucinates too much” in their RAG-based knowledge assistant. You're the applied engineer on the account. What happens in the first 48 hours?
  a: |
    Hour 0–4: meet the stakeholders, collect concrete examples of bad answers and the questions behind them, and get access to traces. Hour 4–24: label 50–100 failures by cause: wrong or missing retrieval, stale or conflicting documents, prompt issues, the model ignoring context, or users asking things the knowledge base cannot answer. Usually most "hallucinations" are retrieval and content problems.

    Hour 24–48: fix the biggest category (for example better chunking, hybrid search and re-ranking, or stricter grounding and citation instructions with an "I don't know" path), add a faithfulness check, build an evaluation set with their experts, and present measured before-and-after results with a plan for the next fixes.
  level: Senior
  category: forward-deployed
  subcategory: escalations
  companies:
  - Anthropic
  related: /ai-system-design/genai-system-design/forward-deployed-ai-engineering
  source: outcome-school
- id: a-customer-s-llm-chatbot-on-8-gpus-is-too-slow-and-too-expen
  q: A customer's LLM chatbot on 8 GPUs is “too slow and too expensive.” You have one week with them. What do you do?
  a: |
    Day 1–2: profile real traffic: prompt and output lengths, concurrency, latency breakdown, GPU utilization and the serving engine configuration. Common findings are low batch occupancy, no continuous batching, no prefix caching, an oversized model or unquantized weights, and long prompts.

    Day 3–5: switch to an optimized engine with continuous batching and paged KV cache, enable prefix caching, quantize to FP8 or INT8 with quality checks, shorten prompts, and test a smaller model for common requests. Days 6–7: measure tokens per second, latency and cost per conversation against their evaluation set, and hand over a tuned configuration and recommendations.
  level: Senior
  category: forward-deployed
  subcategory: escalations
  companies:
  - NVIDIA
  related: /ai-system-design/genai-system-design/gpu-performance-for-llms
