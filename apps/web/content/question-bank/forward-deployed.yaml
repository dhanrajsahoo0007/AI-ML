- id: in-our-build-session-you-get-two-hours-and-any-ai-tools-you
  q: In our build session you get two hours and any AI tools you want. How do you decide what to build and how do you spend the time?
  a: |
    Spend the first 10–15 minutes clarifying the problem and choosing a narrow scope with a clear success criterion. Build the core path quickly with AI tools, focusing on the parts that show judgment, such as agent design, guardrails and evaluation, and test with realistic examples including adversarial ones.

    Reserve the last 20 minutes for fixing the worst failures and preparing to explain your choices: what you built, where you put guardrails and why, how you would evaluate it, and what you would do with more time.
