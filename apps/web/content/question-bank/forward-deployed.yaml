- id: how-would-you-make-complex-ai-research-findings-accessible-t
  q: How would you make complex AI research findings accessible to a non-technical audience?
  a: |
    Start with why it matters to the audience: the decision or change it enables. Explain the core idea with a concrete example or analogy, show one clear visual, give the key result in plain numbers, and state honestly what it does not show.

    Avoid jargon or define it immediately, keep one main message, invite questions, and check understanding by asking the audience how they would use the finding.
