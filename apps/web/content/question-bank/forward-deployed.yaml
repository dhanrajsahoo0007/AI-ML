  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - Palantir
  related: /ai-system-design/genai-system-design/forward-deployed-ai-engineering
  source: outcome-school
- id: design-a-system-to-improve-traffic-in-nyc
  q: Design a system to improve traffic in NYC.
  a: |
    Clarify the goal (travel time, safety, emissions, bus reliability) and the levers available (signal timing, lane rules, transit priority, enforcement, information to drivers). Gather data from traffic sensors, cameras, GPS probes, transit feeds and events.

    Build models that predict congestion and simulate interventions, then pilot changes such as adaptive signal timing on a corridor or bus priority at key intersections, measured against comparable control areas. Present results to city stakeholders and scale what works, considering equity across neighborhoods.
