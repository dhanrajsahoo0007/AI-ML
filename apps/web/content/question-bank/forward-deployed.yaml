- id: an-enterprise-customer-says-we-want-ai-to-automate-our-claim
  q: 'An enterprise customer says: “We want AI to automate our claims processing.” You''re the engineer in the room. What do the first two weeks look like?'
  a: |
    Days 1–3: shadow claims handlers, map the workflow end to end (intake, document extraction, validation, coverage checks, decisions, communication), gather volumes, error costs and data access, and agree on metrics such as handling time and accuracy on key fields. Days 4–7: pick the highest-value, lowest-risk step, often document extraction and triage, collect real claims and build an evaluation set with experienced handlers.

    Days 8–14: build a thin slice in their environment, such as extracting fields from real claim documents with human review, measure against the evaluation set, address security and integration needs, and present results with a roadmap toward automating decisions only where accuracy is proven.
  level: Senior
  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - OpenAI
  related: /ai-system-design/genai-system-design/forward-deployed-ai-engineering
  source: outcome-school
- id: a-state-agency-wants-to-move-a-paper-and-call-centre-welfare
  q: A state agency wants to move a paper-and-call-centre welfare-scheme service onto a multilingual assistant, on-prem for data residency. How do you scope and ship it?
  a: |
    Scope with the agency and citizens: which schemes and tasks (eligibility questions, application help, status checks), which languages and channels (phone, WhatsApp, kiosks), volumes, and what must stay with human officers. Agree on metrics such as resolution rate and wait time, and on accessibility for low-literacy users.

    Ship in phases on-premise: start with FAQ and eligibility guidance via RAG over official documents in the main languages with voice support, add status checks through the agency's systems with verification, then guided applications. Keep humans for complex cases, evaluate with native speakers and real citizens, and train agency staff to operate it.
  level: Senior
  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - Sarvam AI
  related: /ai-system-design/genai-system-design/forward-deployed-ai-engineering
  source: outcome-school
- id: a-prospective-customer-runs-their-workload-on-h100s-talk-me
  q: A prospective customer runs their workload on H100s. Talk me through when you would tell them not to move.
  a: |
    Tell them not to move when their workload does not benefit from the new hardware's strengths: if they are throughput-oriented with large batches and do not need very low per-user latency, if they rely on models, sizes or features the platform does not support, if their models are custom or change often, or if they need very long contexts that strain limited on-chip memory.

    Also when migration costs, such as engineering effort, retraining or dependency changes, outweigh the savings. Be honest: recommending the right fit builds trust, and a pilot on their real workload settles the question with numbers.
  level: Senior
  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - Groq
  related: /ai-system-design/genai-system-design/gpu-performance-for-llms
  source: outcome-school
- id: a-customer-wants-to-migrate-from-a-proprietary-frontier-mode
  q: A customer wants to migrate from a proprietary frontier-model API to an open model. How do you run that engagement?
  a: |
    Start with goals (cost, control, privacy, latency) and an evaluation set from their real traffic with their success criteria. Benchmark candidate open models with their prompts, adapt prompts for each model, and consider fine-tuning or distilling from their proprietary model's outputs, if the provider's terms allow it, to close gaps.

    Plan deployment (dedicated endpoints or self-hosting, sizing and cost), run shadow traffic and a staged rollout, keep the proprietary model as a fallback for hard cases, and report quality and cost against the original baseline.
  level: Senior
  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - Together AI
  related: /ai-system-design/genai-system-design/forward-deployed-ai-engineering
  source: outcome-school
- id: an-enterprise-wants-a-document-q-a-assistant-over-2m-interna
  q: An enterprise wants a document-Q&A assistant over 2M internal documents, pilot in four weeks, and their security team forbids data leaving their VPC. Scope and design it.
  a: |
    Deploy everything inside their VPC: an open-weight or VPC-hosted model, ingestion with connectors and permission sync, parsing and chunking, a vector plus keyword index, and the chat application, all on their infrastructure. Week 1: security review, environment setup and a representative document subset. Week 2: ingestion and retrieval with permission filtering, and an evaluation set with their experts.

    Week 3: generation with citations and abstention, faithfulness checks, and a pilot UI for a small user group. Week 4: iterate on failures, scale ingestion toward the full 2M documents, set up monitoring and present measured results with a production plan.
  level: Senior
  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - Scale AI
  related: /ai-system-design/genai-system-design/conversational-assistant-design
  source: outcome-school
- id: a-robotics-customer-asks-for-50-000-hours-of-manipulation-de
  q: A robotics customer asks for 50,000 hours of manipulation demonstrations across 12 tasks and three embodiments. Design the collection pipeline, and tell me what makes one demonstration worth keeping.
  a: |
    Build a collection pipeline with standardized teleoperation rigs per embodiment, task protocols with variation plans (objects, positions, lighting, distractors), operator training and certification, synchronized recording of cameras, proprioception and actions, automated validation, success labeling and segmentation, and versioned delivery with metadata.

    A demonstration is worth keeping when it succeeds or is a labeled useful recovery, is smooth and consistent rather than hesitant, has complete, synchronized sensor data, and adds diversity to the dataset rather than repeating easy cases. Measure value by training policies on subsets and checking which data improves success.
  level: Senior
  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - Scale AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: as-a-deployed-engineer-you-are-rolling-devin-into-a-2-000-en
  q: As a Deployed Engineer, you are rolling Devin into a 2,000-engineer organisation. What do the first ninety days look like?
  a: |
    Days 1–30: meet engineering leadership to agree on goals and metrics (merged pull requests, cycle time, backlog burned down), complete security review and repository access, and pick two or three pilot teams with well-scoped work such as migrations, test coverage, dependency upgrades and small bugs. Set up the playbooks, repository setup and knowledge the agent needs, and review every output closely.

    Days 31–60: measure pilot results such as merge rate, review effort and time saved, refine task selection and prompts, train champions in each team, and integrate with their ticketing and CI. Days 61–90: expand to more teams using the playbooks that worked, run a large batch initiative such as a codebase-wide migration to show scale, and report measured impact with a plan for the next phase.
  level: Senior
  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - Cognition
  related: /ai-system-design/genai-system-design/forward-deployed-ai-engineering
  source: outcome-school
- id: estimate-the-cost-and-turnaround-of-running-your-diligence-w
  q: Estimate the cost and turnaround of running your diligence workflow over a 5,000-document data room, and tell me which lever you'd pull first.
  a: |
    Suppose 5,000 documents averaging 30 pages, about 15,000 tokens each, 75M tokens in total. Answering an 18-question checklist with targeted retrieval might send around 4,000 tokens per question per document, roughly 360M input tokens plus 30M output tokens. At illustrative prices of a few dollars per million input tokens, that is around 1,000–2,000 dollars, and with enough parallelism under rate limits, a few hours of wall-clock time.

    The first lever is retrieval precision: sending only relevant clauses per question cuts tokens several-fold. Then prompt caching of shared instructions, batching questions per document, and a smaller model for simple questions with a stronger model only for complex or low-confidence ones.
  level: Senior
  category: forward-deployed
  subcategory: customer-scoping
  companies:
  - Harvey
  related: /ai-system-design/genai-system-design/cost-latency-optimization
  source: outcome-school
- id: a-hospital-group-schedules-and-confirms-outpatient-appointme
  q: A hospital group schedules and confirms outpatient appointments by phone, manually, with three staff on a rota. Design what we would build for them.
  a: |
    Build a voice agent for outbound confirmation calls and inbound scheduling requests, integrated with their scheduling system through supported APIs. It verifies patient identity, confirms, reschedules or cancels appointments within rules (available slots, provider constraints), sends confirmations by SMS, and hands off to staff for complex cases or clinical questions.

    Address compliance and privacy for health data, multilingual support, accessibility, call recording consent and audit logs. Pilot with one clinic, measure confirmation rates, no-show reduction, staff time saved and patient satisfaction, then expand.
