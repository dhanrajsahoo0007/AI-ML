- id: a-contact-centre-wants-to-replace-its-ivr-with-voice-agents
  q: A contact centre wants to replace its IVR with voice agents. Run the engagement.
  a: |
    Analyze call data to find the top intents by volume and their resolution paths, and define metrics such as containment, resolution, handle time and customer satisfaction. Start with a few high-volume, well-defined intents, integrate with backend systems for account actions, and design clean handoffs to human agents with context.

    Build an evaluation suite of simulated and recorded calls, pilot on a slice of traffic with A/B comparison against the IVR, monitor latency, errors and escalations, and expand intent coverage and languages based on results. Train staff and update operations for the new handoff flow.
  level: Senior
