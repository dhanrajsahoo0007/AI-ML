- id: you-have-four-hours-to-build-and-demo-a-working-ai-powered-p
  q: You have four hours to build and demo a working AI-powered product. How do you spend them?
  a: |
    Spend about 20 minutes choosing a narrow, high-impact use case and defining what a great demo shows. Spend 2.5 hours building the core flow end to end with a hosted model and simple tools: real input, AI step, useful output, using existing libraries and AI coding assistants. Spend 45 minutes testing with real examples and fixing the worst failures, and the last 25 minutes on a clear demo script and a short slide on what is next.

    Cut authentication, scalability, polish and edge features; keep one path that works reliably every time.
  level: Mid
  category: forward-deployed
  subcategory: timed-builds
  companies:
  - xAI
  related: /ai-system-design/genai-system-design/forward-deployed-ai-engineering
  source: outcome-school
- id: you-have-two-days-in-our-codebase-and-no-assigned-task-what
  q: You have two days in our codebase and no assigned task. What do you build, and how do you spend the time?
  a: |
    Spend the first few hours understanding the product and codebase: run it, read the architecture, use AI tools to navigate, and look for real user pain points or rough edges. Pick a scoped feature or improvement that users would notice and that you can finish well in the time, and confirm it is not already being built.

    Build it end to end with tests, use AI assistance effectively but verify everything, keep notes on decisions, and finish with a clean demo and a short write-up of what you built, why, trade-offs and what you would do next. Finishing something solid beats a sprawling half-done project.
