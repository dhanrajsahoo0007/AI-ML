- id: design-a-visual-search-system-user-uploads-an-image-you-retu
  q: 'Design a visual search system: user uploads an image, you return visually similar in-catalogue items.'
  a: |
    Detect and crop the main product in the uploaded image, embed it with a vision model fine-tuned on product images, and search an ANN index of catalog image embeddings filtered by category and availability. Re-rank with a more precise model and business signals such as stock and price.

    Evaluate with recall at k on labeled pairs of user photos and products, handle cluttered photos and different angles with training data that includes them, and measure online engagement and purchases from visual search.
