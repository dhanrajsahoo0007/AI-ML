- id: design-a-serverless-inference-platform-serving-100-open-mode
  q: Design a serverless inference platform serving 100+ open models on a shared GPU fleet.
  a: |
    Keep popular models warm on dedicated replicas with autoscaling, and serve the long tail by loading models on demand into a shared pool: weights in fast storage close to GPUs, caching on local NVMe, and fast loading so cold starts take seconds. A scheduler places models on GPUs by memory needs and traffic, packing small models together and evicting idle ones.

    Bill per token, enforce per-tenant limits, batch requests per model with continuous batching, share base models across LoRA adapters, and monitor cold-start latency, utilization and cost. Cold starts are the main user-facing trade-off.
