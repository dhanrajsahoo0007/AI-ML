- id: design-the-serving-stack-for-a-consumer-chatbot-with-real-ti
  q: Design the serving stack for a consumer chatbot with real-time search over a social-media firehose.
  a: |
    Ingest the firehose into a streaming pipeline that filters spam, deduplicates, extracts entities and embeds posts within seconds, writing to a real-time index with time-decayed ranking. At query time, a router decides when fresh information is needed, retrieves recent posts and authoritative sources, re-ranks for relevance, credibility and recency, and the LLM answers with citations.

    Handle velocity with in-memory indexes for recent hours and tiered storage for older content, guard against misinformation with source-quality signals, and serve with the usual optimized LLM stack and streaming.
