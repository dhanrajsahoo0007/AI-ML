- id: a-bank-wants-the-whole-stack-model-rag-agents-deployed-air-g
  q: A bank wants the whole stack (model, RAG, agents) deployed air-gapped on their own GPUs. What actually changes versus your SaaS?
  a: |
    Everything that relied on the internet changes: model weights, containers and updates must be shipped as signed offline bundles; no hosted evaluation, telemetry or external tools; and observability, evaluation and support must run inside their network. You cannot quickly patch issues, so releases need more testing and simpler upgrade paths.

    Capacity is fixed by their GPUs, so model choice, quantization and batching matter; identity, permissions and audit must integrate with their systems; agents' tools only reach internal systems; and your team needs runbooks and possibly on-site access to debug.
