- id: your-platform-must-support-multiple-llm-providers-including
  q: Your platform must support multiple LLM providers, including deployments in restricted environments where only some models are available. How do you architect model selection?
  a: |
    Put a model abstraction layer between applications and providers, with a capability registry describing each model's features, quality on internal evaluations, cost and which environments it is approved for. Workflows declare required capabilities, and a selection policy picks the best allowed model per deployment.

    Keep prompts and tools portable, validate every workflow against each allowed model with the evaluation suite, and provide fallbacks when the preferred model is unavailable. In restricted environments, only approved models are installed and selectable.
