- id: design-the-eta-prediction-system-for-a-ride-hailing-marketpl
  q: Design the ETA prediction system for a ride-hailing marketplace. What features, what model, how do you serve it in <100 ms?
  a: |
    Combine a routing engine's baseline estimate from road segments and current traffic with an ML correction model trained on actual trip times. Features include route segments, real-time speeds, time of day, weather, events, pickup and drop-off characteristics, and driver behavior; gradient-boosted trees or a neural model predict the residual or the full time, often as quantiles.

    Serve under 100 ms by precomputing segment features, keeping real-time traffic in a fast store and running a compact model, with caching for repeated routes. Evaluate with MAE and lateness by segment, and monitor drift during unusual events.
