- id: you-have-dozens-of-ranking-signals-and-a-brand-new-tenant-wi
  q: You have dozens of ranking signals and a brand-new tenant with zero interaction data. How do you rank, and how do you improve?
  a: |
    Start with a ranker trained across other tenants on signals that transfer, such as text relevance, freshness, authority and graph signals, and avoid tenant-specific features that need interaction data. Use sensible priors and the knowledge graph from the new tenant's own structure.

    As interactions accumulate, add tenant-specific adaptation, such as fine-tuning or reweighting features, with exploration to collect unbiased feedback. Monitor click-through and successful search rates from day one to see when the tenant model beats the generic one.
