- id: design-a-recommendation-system-for-facebook-ads-and-an-evalu
  q: Design a recommendation system for Facebook Ads, and an evaluation framework for ads ranking.
  a: |
    Retrieve eligible ads by targeting and budget, then predict click and conversion probabilities with deep models over user, ad and context features. Ads are ranked by expected value, bid times predicted conversion probability plus a quality score, inside an auction, so calibrated probabilities matter.

    Evaluation: offline log loss, calibration and AUC by segment; online A/B tests on advertiser value, revenue, user experience metrics such as hides, and long-term effects through holdouts. Watch for feedback loops and position bias, and monitor calibration drift after deployment.
