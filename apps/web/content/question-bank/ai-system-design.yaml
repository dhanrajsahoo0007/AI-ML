- id: glean-s-ranking-leans-on-a-knowledge-graph-of-people-content
  q: Glean's ranking leans on a knowledge graph of people, content and activity. How would you build that graph, and how does it improve retrieval beyond embedding similarity?
  a: |
    Build the graph from signals across tools: people and their teams and roles from directories, documents and their authors, editors and viewers, interactions such as views, shares, mentions and meetings. Edges are weighted by recency and strength.

    It improves retrieval by adding personalization and authority: documents from people you work with, recently active content and documents many relevant colleagues use rank higher, which embedding similarity alone cannot capture, especially for ambiguous queries and enterprise jargon.
