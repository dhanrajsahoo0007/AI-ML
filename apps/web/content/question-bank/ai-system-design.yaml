- id: how-would-you-improve-product-search-results-focusing-on-the
  q: How would you improve product search results, focusing on the fraction of relevant documents retrieved (recall)?
  a: |
    Measure recall first with judged queries and analysis of zero-result and low-result queries. Improve candidate retrieval: add dense retrieval alongside keyword search, query expansion with synonyms and spelling correction, attribute extraction to match structured fields, and multilingual handling, then fuse the candidate sets.

    Increase candidate depth before ranking and make sure filters are not too strict. Check that improvements in recall do not hurt precision at the top, which the re-ranker should protect, and confirm with online metrics such as fewer reformulations and zero-result searches.
