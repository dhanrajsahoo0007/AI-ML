- id: design-a-multi-tenant-inference-platform-that-serves-many-fo
  q: Design a multi-tenant inference platform that serves many foundation models to thousands of customers (Bedrock-shaped).
  a: |
    A control plane manages models, versions, quotas, pricing and customer configuration; a data plane runs pools of inference engines per model with continuous batching, autoscaling and placement across GPU types. A gateway handles authentication, per-customer rate limits by tokens, routing and metering.

    Isolation: customer data is never used for training, requests are encrypted, logs are access-controlled, and provisioned throughput gives dedicated capacity to customers who need guarantees. Multi-tenancy needs fairness and noisy-neighbor protection, per-tenant cost attribution, model lifecycle management and region-level deployment for data residency.
