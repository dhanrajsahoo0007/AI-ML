- id: design-the-recommendation-system-for-instagram-reels
  q: Design the recommendation system for Instagram Reels.
  a: |
    Candidate sources include two-tower retrieval on user and video embeddings, follow-graph and creator affinity, trending and fresh content, and exploration pools for new creators. A multi-task ranking model predicts watch time, completion, likes, shares, comments, follows and negative signals such as skips and "not interested", combined into a value score.

    Re-ranking adds diversity, creator fairness, freshness and integrity filters. Real-time features capture the current session, video understanding embeddings handle cold-start content, and evaluation uses online tests on long-term engagement and satisfaction, not just watch time.
