- id: turn-a-conversation-into-billable-diagnosis-codes-what-is-th
  q: Turn a conversation into billable diagnosis codes. What is the accuracy bar, and how do you build to it?
  a: |
    The bar is high: codes drive billing and compliance, so errors cause denied claims or audit risk. Aim for accuracy comparable to professional coders on common codes, with very high precision on what is auto-suggested, and route uncertain cases to coders.

    Build it by extracting documented diagnoses and their supporting evidence from the note, mapping to codes with a model plus coding rules and code hierarchies, checking documentation requirements and specificity, and showing evidence for each code. Evaluate against certified coders' labels, measure per-code precision and recall, and monitor denials after deployment.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Abridge
  related: /ai-system-design/genai-system-design/kg-healthcare-case-study
  source: outcome-school
- id: design-an-enterprise-rag-assistant-over-10m-documents-with-p
  q: Design an enterprise RAG assistant over 10M documents with per-user permissions.
  a: |
    Connectors ingest from each source with permission sync; documents are parsed layout-aware, chunked by structure, embedded and stored in a sharded vector index plus a keyword index, every chunk tagged with source, timestamps and access-control lists. Queries are rewritten into standalone search queries, run through hybrid search filtered by the user's identity and groups, re-ranked, and answered by an LLM with citations and an "I don't know" path.

    Around it: incremental re-indexing from change events, caching of popular queries per permission scope, evaluation sets per department with retrieval and faithfulness metrics, tracing and feedback, and guardrails against prompt injection in documents. Scale the index by sharding and compressing vectors, and keep latency under a few seconds with parallel retrieval and streaming.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Amazon
  - Databricks
  - Microsoft
  - OpenAI
  - Scale AI
  related: /ai-system-design/genai-system-design/conversational-assistant-design
  source: outcome-school
- id: design-a-code-assistant-repo-indexing-context-assembly-edit
  q: 'Design a code assistant: repo indexing, context assembly, edit application, evaluation.'
  a: |
    Indexing: parse the repository into files, symbols and a dependency graph, embed chunks at function or class level, keep a keyword index for identifiers, and update incrementally on file changes. Context assembly: combine the open file and cursor position, recently edited files, symbol definitions and references, retrieved similar code, and repository conventions, ranked and trimmed to a token budget.

    Edit application: have the model output diffs or targeted replacements rather than whole files, apply them with a fast merge that tolerates small mismatches, then run formatters, type checks and tests. Evaluation: offline tasks with hidden tests and edit-match metrics, plus online acceptance and retention rates of suggestions, latency and user undo rates.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Cursor
  related: /ai-system-design/genai-system-design/harness-engineering
