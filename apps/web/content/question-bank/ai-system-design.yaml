- id: design-an-on-prem-deployment-of-an-open-weight-model-for-a-e
  q: Design an on-prem deployment of an open-weight model for a European bank that cannot send data to any external API.
  a: |
    Size hardware for the chosen model and load, deploy an inference engine such as vLLM or TensorRT-LLM on the bank's GPUs behind their identity and network controls, and run RAG with on-premise vector and keyword indexes over bank documents with permission filtering. All logs, prompts and data stay inside the bank's network.

    Address regulation: model risk management documentation, evaluation and validation reports, audit logging, data retention, and access controls. Plan for updates delivered as signed artifacts, monitoring without external telemetry, and on-site support processes.
