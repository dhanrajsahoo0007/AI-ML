- id: design-apis-for-developers-to-access-anthropic-s-models-secu
  q: Design APIs for developers to access Anthropic's models securely and efficiently.
  a: |
    Expose a clear REST API for messages with streaming via server-sent events, tool use and structured outputs, versioned so changes do not break clients, with SDKs in major languages. Authenticate with scoped API keys or workload identity, support organization and workspace separation, and enforce token-based rate limits and spend limits per key.

    For efficiency, offer prompt caching, batch processing for non-urgent work and usage reporting. For security, encrypt traffic, log usage for audit, scan for key leaks, and document data retention. Return clear errors with retry guidance, and publish limits and pricing.
  level: Senior
