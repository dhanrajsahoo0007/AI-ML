- id: design-a-personalised-news-feed-ranking-system-the-next-post
  q: Design a personalised news-feed ranking system / the “next post” logic for Facebook's feed.
  a: |
    Gather candidates from friends, followed pages, groups and recommended content, then filter for eligibility and integrity. A multi-task ranker predicts the probability of meaningful interactions such as comments, shares, likes, and negative actions such as hides, combined with weights that reflect long-term value. The "next post" is chosen with diversity, freshness and integrity re-ranking.

    Two-stage design keeps it efficient: cheap candidate generation, heavy ranking over a few thousand items. Use real-time session features, debias training for position, and evaluate with A/B tests on long-term engagement and user-reported satisfaction.
