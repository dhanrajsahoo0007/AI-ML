- id: design-a-customer-support-agent-that-can-take-real-actions-w
  q: Design a customer-support agent that can take real actions, with escalation to humans.
  a: |
    Route each message: knowledge questions go to RAG over help articles and policies; account requests go to an agent with narrow tools (look up orders, change address, issue refunds within limits) that run with the authenticated customer's permissions, with policy checks and limits enforced inside the tools. Risky or out-of-policy actions require confirmation or human approval.

    Escalate on explicit request, low confidence, repeated failure, policy exceptions or frustration, passing a summary so the customer does not repeat themselves. Evaluate with simulated customers on scenario suites, measuring resolution, policy compliance and consistency, then monitor resolution rate, escalations, satisfaction and errors in production.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Consumer-Scale ML
  - Sierra
  related: /ai-system-design/genai-system-design/conversational-assistant-design
