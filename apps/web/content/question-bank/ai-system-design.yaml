- id: design-a-distributed-search-system-for-1-billion-documents-a
  q: Design a distributed search system for 1 billion documents at 1 million QPS.
  a: |
    Shard the index by document across many machines, with replicas of each shard for throughput and availability: 1M QPS needs many replicas, since every query fans out to all shards of one replica set. Each shard holds an inverted index and, if semantic search is needed, a compressed ANN index in memory.

    A query router fans out to one replica of each shard, gathers top-k results, merges them and re-ranks the top few hundred centrally. Use caching for popular queries, tiered indexes that keep hot documents in memory, incremental indexing pipelines for updates, and tail-latency controls such as hedged requests and timeouts.
