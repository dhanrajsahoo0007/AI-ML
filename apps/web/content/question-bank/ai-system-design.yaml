- id: how-does-an-answer-engine-handle-breaking-news-a-query-about
  q: 'How does an answer engine handle breaking news: a query about something that happened 20 minutes ago?'
  a: |
    Detect time-sensitive queries, then query a real-time index fed by news feeds, social posts and frequently recrawled news sites, plus live search APIs, rather than the main index. Rank by recency and source credibility, and fetch the latest versions of pages.

    The answer should state what is known so far with timestamps, cite multiple credible sources, flag uncertainty and conflicting reports, and avoid speculation. Refresh cached answers quickly as the story develops.
