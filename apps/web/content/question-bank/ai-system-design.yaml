- id: design-the-ranking-system-combining-bm25-dense-retrieval-and
  q: Design the ranking system combining BM25, dense retrieval and LLM reranking across multiple indexes.
  a: |
    Retrieve candidates from each index with BM25 and dense retrieval in parallel, merge with reciprocal rank fusion or a learned fusion model using features such as scores, source quality and freshness, then apply a cross-encoder to the top few hundred and an LLM re-ranker to the top few dozen where precision matters most.

    Calibrate scores across indexes, keep latency budgets per stage, use the LLM re-ranker selectively based on query difficulty, and train fusion and re-ranking on judged and behavioral data. Evaluate with nDCG and answer quality downstream.
