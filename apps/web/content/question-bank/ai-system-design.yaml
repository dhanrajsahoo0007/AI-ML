- id: how-would-you-design-a-recommendation-system-to-suggest-book
  q: How would you design a recommendation system to suggest books to users? How would you model a warehouse inventory problem?
  a: |
    Combine item-to-item collaborative filtering ("readers also bought"), content features from genre, author and text embeddings for new books, and a ranking model using purchase history, ratings and browsing context, with diversity and freshness in re-ranking. Evaluate offline with recall and nDCG on held-out purchases and online with conversion.

    For warehouse inventory, model demand per item and location with forecasting (seasonality, trends, promotions), then decide stock levels with an inventory policy that balances holding costs against stockout costs, often optimizing a service-level target with safety stock based on forecast uncertainty and lead times.
