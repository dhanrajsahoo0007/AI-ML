- id: design-dynamic-pricing-surge-for-a-two-sided-marketplace-and
  q: Design dynamic pricing / surge for a two-sided marketplace and describe the feedback loops that can go wrong.
  a: |
    Forecast short-term demand and supply per area and time window, then set a price multiplier that balances them: enough to bring drivers to busy areas and reduce excess demand, without pricing out riders. Models estimate how riders and drivers respond to price, and a controller adjusts prices frequently with caps and smoothing.

    Feedback loops can go wrong: surge moves drivers away from other areas, creating new shortages; drivers may wait for surge before logging on; oscillations from over-reacting controllers; and fairness and regulatory concerns. Test with switchback experiments and simulation, and monitor reliability and fairness metrics.
