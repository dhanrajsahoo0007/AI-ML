- id: design-a-content-recommendation-system-for-a-streaming-catal
  q: Design a content recommendation system for a streaming catalogue, including cold-start for new titles and new users.
  a: |
    Use a two-stage system: candidates from two-tower retrieval, similar-title lists, trending and continue-watching rows; a ranker trained on long-term signals such as watch completion and return visits. The home page assembles personalized rows and even personalized artwork.

    New titles get content embeddings from metadata, trailers and synopses plus controlled exploration exposure; new users get onboarding preferences, popular and regional titles, and fast adaptation from the first plays. Evaluate with A/B tests on retention and viewing hours.
