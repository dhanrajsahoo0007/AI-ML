- id: design-the-hugging-face-hub-millions-of-git-repos-where-indi
  q: 'Design the Hugging Face Hub: millions of git repos where individual files are tens to hundreds of GB.'
  a: |
    Git handles metadata and small files, while large files are stored in object storage through a large-file system and referenced by pointers in the repository, with content-addressed, chunk-level deduplication so near-identical model versions share storage and uploads are resumable. Downloads go through a CDN with range requests so tools can fetch only needed files.

    Add metadata indexing for search, access control for private and gated repos, rate limiting, and background jobs for security scanning and model cards. Scale storage and bandwidth economics through deduplication and caching.
