- id: how-would-you-index-a-100k-file-monorepo-so-an-ai-editor-can
  q: How would you index a 100k-file monorepo so an AI editor can retrieve relevant context, and keep the index fresh as the user edits?
  a: |
    Chunk code at function and class boundaries, embed chunks, build keyword and symbol indexes (definitions, references, imports) and a dependency graph, stored with file paths and hashes. Use a Merkle tree of file hashes so changes are detected quickly and only changed files are re-indexed.

    As the user edits, update the local view immediately and re-embed changed chunks in the background. Retrieval combines semantic search, symbol lookup and graph expansion from the current file, with ranking by recency of edits and proximity.
