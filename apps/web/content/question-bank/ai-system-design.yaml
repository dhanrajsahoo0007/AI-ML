- id: design-an-end-to-end-classification-pipeline-for-marketplace
  q: Design an end-to-end classification pipeline for Marketplace listings.
  a: |
    Classify listings into categories and policy labels using text from title and description, image embeddings and seller signals, with a multimodal model, possibly starting with zero-shot LLM labels to bootstrap training data. Training data comes from seller-chosen categories, cleaned with human review.

    Serve predictions at listing time to suggest categories and flag violations, route low-confidence or high-risk items to review, and retrain on corrections. Monitor per-category precision and recall, drift as new product types appear, and seller override rates.
