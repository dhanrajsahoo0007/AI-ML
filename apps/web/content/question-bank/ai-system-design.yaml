- id: design-the-retrieval-pipeline-pulling-from-100b-web-pages-wi
  q: Design the retrieval pipeline pulling from 100B web pages with sub-second latency and freshness guarantees.
  a: |
    Crawl continuously with priorities by page importance and change rate, so news and popular pages refresh in minutes while the long tail refreshes slowly. Process pages into text, deduplicate, score quality and build a sharded inverted index plus a dense index over a subset or over chunks, with tiered storage keeping the most useful content in memory.

    Queries fan out to shards in parallel with strict timeouts, results merge and re-rank, and a separate real-time index handles very fresh content. Freshness guarantees are monitored per source tier, and latency is controlled with caching and tail-latency techniques.
