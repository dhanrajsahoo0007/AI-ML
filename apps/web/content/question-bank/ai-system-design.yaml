- id: design-a-content-moderation-system-combining-classifiers-and
  q: Design a content-moderation system combining classifiers and LLMs.
  a: |
    Use a cascade: hash matching against known violating content, fast classifiers on everything, and an LLM for the ambiguous middle band where context and nuance matter, such as sarcasm, satire or policy edge cases. The LLM gets the policy text and examples and returns a decision with reasoning, which is cheaper than human review for borderline cases.

    Map scores to actions by severity and confidence: auto-action for high confidence, human review queues prioritized by reach and severity, appeals that feed back as labels. Monitor precision and recall per policy and language, LLM cost and latency, adversarial trends, and consistency between the LLM and human reviewers.
