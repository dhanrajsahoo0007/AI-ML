- id: design-discovery-and-search-across-millions-of-user-created
  q: Design discovery and search across millions of user-created characters.
  a: |
    Index characters by name, description, greeting and tags, plus embeddings of their definitions and conversation style, with keyword and semantic search. Discovery uses a recommendation system: candidates from user history, similar characters and trending ones, ranked by predicted engagement quality, not just clicks.

    Apply safety filtering and age-appropriate rules to what is shown, handle duplicates and spam, support cold-start for new characters with content embeddings and exploration, and evaluate with search success and retention.
