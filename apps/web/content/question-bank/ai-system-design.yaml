    Ranking of the story tray: predict which accounts' stories the user is most likely to view and engage with, using relationship strength, past viewing, recency and content features. Within stories, models handle content understanding for integrity, sticker and music suggestions, and ranking of replies or reactions.

    Add safety classifiers on uploads, notifications ranking, and creative tools such as background removal or effects. Evaluate tray ranking with view-through and reply rates, and test changes with A/B experiments.
