- id: design-a-document-intelligence-pipeline-scanned-pdfs-in-stru
  q: 'Design a document-intelligence pipeline: scanned PDFs in, structured fields out, at 10M documents.'
  a: |
    Ingest documents to object storage with a queue, classify document type, run OCR and layout analysis for text, tables and key-value regions, then extract fields with a model suited to the type: templates or specialized extractors for common forms, a vision-language model or LLM with a schema for varied documents. Validate fields with business rules, cross-field checks and confidence scores.

    Route low-confidence fields to human review and feed corrections back into training and prompts. At 10M documents, process in parallel batches with autoscaling, cache by document hash, track cost per page, and measure field-level accuracy per document type on labeled samples.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Palantir
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: design-a-text-to-sql-system-over-a-warehouse-with-thousands
  q: Design a Text-to-SQL system over a warehouse with thousands of tables.
  a: |
    The model cannot see thousands of tables at once, so retrieve the relevant schema: index table and column descriptions, comments, sample values, popular joins and past validated queries, and select the few tables relevant to the question. A semantic layer with curated metrics and definitions helps more than raw schemas.

    Generate SQL with the retrieved schema and examples, validate it by parsing, checking tables and permissions, running a dry-run with limits and timeouts on a read-only role, and repair errors in a loop. Show the SQL and results to the user, and evaluate on a set of questions with known correct results, measuring execution accuracy.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Databricks
  - Palantir
  related: /ai-system-design/genai-system-design/knowledge-graph-systems
  source: outcome-school
- id: design-a-meeting-assistant-recording-diarisation-summary-act
  q: 'Design a meeting assistant: recording, diarisation, summary, action items, integrations.'
  a: |
    Capture audio with consent notices, run streaming ASR and diarization, map speakers to participants through calendar data and voice enrollment, then generate a summary, decisions and action items with owners and due dates, each linked to timestamps in the transcript.

    Integrations push action items to task tools and summaries to email or chat, respecting meeting permissions. Evaluate faithfulness of decisions and owners, action-item precision and recall against human notes, and diarization accuracy, with privacy controls for retention and access.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Microsoft
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-a-system-that-enables-a-large-language-model-to-handl
  q: Design a system that enables a large language model to handle multiple questions in a single thread.
  a: |
    Store the thread as structured history with each question and answer, and build context per turn from the system prompt, a running summary of older turns, the most recent turns verbatim and any retrieved documents. Rewrite each new question into a standalone query using history so references like "what about the second one" resolve correctly.

    When one message contains several questions, detect and split them, answer each, possibly in parallel, and combine the results with clear structure. Use prefix caching so the shared history is not recomputed, and test with long multi-question threads.
  level: Mid
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Anthropic
  related: /ai-system-design/genai-system-design/agent-memory
  source: outcome-school
- id: design-a-language-translation-model-service
  q: Design a language translation model / service.
  a: |
    Use a multilingual encoder-decoder or LLM translation model, served with batching and caching of repeated segments, with language detection up front and pivoting through a high-resource language for rare pairs if needed. Handle formatting, placeholders, glossaries and do-not-translate terms through preprocessing and constrained decoding.

    Evaluate with automatic metrics such as COMET plus human evaluation per language pair, monitor quality by domain, collect corrections, and fine-tune for domains with enough data. Route sensitive or high-stakes content to human translators.
  level: Mid
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Meta
  related: /ai-system-design/genai-system-design/encoder-decoder-families
  source: outcome-school
- id: design-a-copilot-feature-that-answers-questions-over-a-user
  q: Design a Copilot feature that answers questions over a user's work email, documents and meetings, without ever leaking content the user can't access.
  a: |
    Retrieve from email, documents and meeting transcripts through the existing graph and search APIs using the user's own delegated permissions, so the system can only see what the user can see. Results are ranked across sources, and the LLM answers with citations to the exact items.

    Guard against leaks: no shared caches across users, permission checks at retrieval time and again at display time, sensitivity labels honored, prompt injection in emails treated as untrusted data, and no training on user content. Test with users of different access levels and audit access.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Microsoft
  related: /ai-system-design/genai-system-design/rag-fundamentals
  source: outcome-school
- id: design-an-agent-that-can-take-actions-in-a-spreadsheet-inser
  q: 'Design an agent that can take actions in a spreadsheet (“insert a pivot table of Q3 sales by region”): orchestration, tools and failure handling.'
  a: |
    Give the agent a structured view of the workbook (sheets, table ranges, headers, data types and sample values) and a set of typed tools: read range, create pivot table, add formula, format, insert chart. The model plans the operations, calls tools with explicit ranges and fields, and the app executes them through the spreadsheet engine's API.

    Handle failures by validating references before execution, previewing changes, applying them as a single undoable transaction, and reporting what changed. Ask clarifying questions when columns are ambiguous, and evaluate on a suite of real spreadsheet tasks by checking the resulting workbook state.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Microsoft
  related: /ai-system-design/genai-system-design/tool-use-and-mcp
  source: outcome-school
- id: a-user-says-send-maya-the-photos-from-saturday-s-hike-design
  q: A user says “send Maya the photos from Saturday's hike.” Design the on-device path from that utterance to a structured app action with resolved parameters.
  a: |
    On-device speech recognition produces text; a small language model parses intent and slots (action send, recipient "Maya", content photos, time "Saturday", event "hike") into a structured action schema. Entity resolution then queries on-device indexes: contacts to resolve Maya, the photo library with dates, locations and image understanding to find hike photos from last Saturday.

    The system presents the resolved action with a preview for confirmation, especially when there are several Mayas or uncertain matches, then calls the messaging app's action API. Everything runs on device for privacy, and evaluation covers intent accuracy, resolution accuracy and confirmation rates.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Apple
  related: /ai-system-design/genai-system-design/tool-use-and-mcp
