- id: design-an-answer-engine-a-user-types-a-question-and-gets-a-c
  q: 'Design an answer engine: a user types a question and gets a cited, streamed answer. Your end-to-end budget is 3 seconds to a complete short answer.'
  a: |
    Budget: query understanding and rewriting about 100 ms, parallel retrieval from web indexes and live search 300–600 ms, fetching and extracting page content about 300 ms, re-ranking 100–200 ms, then LLM generation with streaming starting around 1.2–1.5 seconds and a short answer completing before 3 seconds.

    Stream the answer with citations as it is generated, cache popular queries and fetched pages, use a fast model for short answers and a stronger one for complex queries, and verify citations. Evaluate answer quality and latency percentiles continuously.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Perplexity
  related: /ai-system-design/genai-system-design/advanced-rag
  source: outcome-school
- id: design-comet-s-hybrid-browser-architecture-combining-on-devi
  q: Design Comet's hybrid browser architecture combining on-device privacy with cloud AI assistance.
  a: |
    Keep browsing data, history and page contents local by default, with on-device processing for indexing personal history, simple summaries and privacy-sensitive tasks. Send to the cloud only what a task needs, with user consent, for heavy reasoning and agentic actions, and avoid retaining it.

    The browser agent acts on pages with user-visible actions and confirmations for purchases or form submissions, treats page content as untrusted to resist prompt injection, and isolates credentials. Evaluate privacy flows, injection resistance and task success.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Perplexity
  related: /ai-system-design/genai-system-design/guardrails-and-safety
  source: outcome-school
- id: present-the-architecture-for-a-workflow-reviewing-5-000-cont
  q: Present the architecture for a workflow reviewing 5,000 contracts against an 18-question diligence checklist, returning a review grid.
  a: |
    Ingest and parse all contracts with structure, and run the 18 questions per contract as parallel extraction tasks: retrieve relevant clauses per question with clause-level retrieval and definition expansion, then have an LLM answer with citations to exact passages and a confidence score. Results fill a grid of contracts by questions.

    Scale with batched, parallel processing and rate-limit management, cache repeated templates, and verify citations automatically. Lawyers review low-confidence and high-risk cells, and accuracy is measured against a lawyer-reviewed sample before relying on the results.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Harvey
  related: /ai-system-design/genai-system-design/knowledge-graph-systems
  source: outcome-school
- id: walk-me-through-writing-a-finished-note-back-into-epic-what
  q: Walk me through writing a finished note back into Epic. What goes wrong?
  a: |
    After the clinician signs the note, write it to the correct patient encounter through the EHR's supported integration (FHIR APIs or vendor-specific interfaces), mapping sections to the right note types and fields and keeping formatting the EHR can display.

    Things that go wrong: wrong patient or encounter matching, API rate limits and outages, formatting lost or mangled, duplicate writes on retries, notes edited in the EHR after write-back causing conflicts, and permissions or workflow differences between hospitals. Use idempotent writes, verification after writing, retries with alerts and per-site configuration.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
  companies:
  - Abridge
  related: /ai-system-design/genai-system-design/kg-healthcare-case-study
  source: outcome-school
- id: design-a-customer-support-assistant-powered-by-an-llm-what-a
  q: Design a customer-support assistant powered by an LLM. What are the key components?
  a: |
    A retrieval layer over help articles and policies, tools for account lookups and actions with strict permissions, a conversation manager with memory and handoff to humans, guardrails for safety and PII, and an evaluation and monitoring system with task-specific test sets. Start with retrieval and read-only tools, measure resolution rate and accuracy, then add actions gradually with human approval where needed.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
- id: design-a-rag-based-question-answering-system-key-points
  q: 'Design a RAG-based question answering system: key points?'
  a: |
    Permission-aware ingestion with structure-aware chunking, hybrid retrieval and re-ranking, grounded generation with citations and abstention, evaluation of retrieval recall and answer faithfulness, incremental re-indexing, caching and cost control, and guardrails against prompt injection in retrieved content.
  level: Senior
  category: ai-system-design
  subcategory: genai-products
- id: explain-position-bias-in-ranking-data-and-how-you-would-debi
  q: Explain position bias in ranking data and how you would debias training.
  a: |
    Items shown in higher positions get more clicks regardless of relevance, so training on raw clicks teaches the model to repeat past rankings and underrates good items shown lower.

    Debias by estimating position propensities with randomized experiments such as swapping adjacent results, then weighting training examples by inverse propensity; by adding position as a feature during training and fixing it at serving; by click models that separate examination from relevance; and by using small amounts of exploration traffic for unbiased data.
  level: Senior
  category: ai-system-design
  subcategory: recsys-ranking
  companies:
  - Consumer-Scale ML
  related: /ai-system-design/genai-system-design/recommendation-systems
  source: outcome-school
- id: design-a-personalised-recommendation-system-for-rental-listi
  q: Design a personalised recommendation system for rental listings using demographics, property metadata, amenities, price, reviews and location.
  a: |
    Candidate generation filters by hard constraints such as location, dates, price range and capacity, then retrieves listings with embedding similarity to the user's search and past interactions. A ranking model scores candidates with listing features (price, amenities, reviews, photos quality, location), user features and preferences, context such as trip type, and predicted booking probability.

    Handle cold start for new listings with content features and boosted exploration, avoid using demographics in ways that discriminate, debias for position, and evaluate with offline ranking metrics and online booking conversion and host-side fairness.
  level: Senior
  category: ai-system-design
  subcategory: recsys-ranking
  companies:
