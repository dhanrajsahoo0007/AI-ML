- id: design-the-serving-system-for-a-multimodal-assistant-text-im
  q: Design the serving system for a multimodal assistant (text + image in, streaming text out) at hundreds of millions of users.
  a: |
    Separate image processing from text generation: images are uploaded to object storage, preprocessed and encoded by a vision encoder service on its own GPU pool, and the resulting visual tokens or embeddings are passed to the LLM serving tier, which streams text back. Cache encodings by image hash, since users often ask several questions about the same image.

    Budget tokens by resizing images to the needed resolution, batch vision encoding separately from decoding, route by request type to different model sizes, and apply safety classifiers to images and text. Scale each tier independently based on its own load.
