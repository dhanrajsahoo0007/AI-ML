- id: design-the-routing-layer-that-decides-whether-a-user-request
  q: Design the routing layer that decides whether a user request is handled on-device, by a first-party server model, or by a third-party model.
  a: |
    A small on-device classifier estimates the request's difficulty, privacy sensitivity and required capabilities. Simple, private or latency-critical requests stay on device; harder ones go to first-party server models in a privacy-preserving cloud; requests needing broad world knowledge or capabilities beyond first-party models go to a third-party model only with explicit user consent.

    Keep personal context on device where possible and send the minimum needed, fall back gracefully when offline, and evaluate routing with quality, latency, cost and privacy metrics on labeled requests. Make the routing policy updatable without shipping new models.
  level: Senior
