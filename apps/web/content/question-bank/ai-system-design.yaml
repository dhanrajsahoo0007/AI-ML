- id: design-a-notification-system-that-decides-when-to-send-push
  q: 'Design a notification system that decides when to send push notifications: key points?'
  a: |
    Predict the value of each notification, such as the probability of a meaningful open, against the cost of annoyance, such as disabling notifications or uninstalling. Rank candidates per user, apply frequency caps and quiet hours, and evaluate with long-term A/B tests on retention and opt-out rates, not just opens.
  level: Senior
  category: ai-system-design
  subcategory: recsys-ranking
- id: design-semantic-search-over-a-large-product-catalogue
  q: Design semantic search over a large product catalogue.
  a: |
    Embed products from title, description, attributes and images with a model fine-tuned on query-product engagement, alongside a keyword index for brands, sizes and model numbers. At query time, parse the query for structured filters such as category, price and color, run hybrid retrieval with those filters, and re-rank with a learning-to-rank model using relevance, popularity, availability and personalization.

    Handle typos, synonyms and multilingual queries, cache popular queries, and evaluate with nDCG on judged queries, zero-result rate and online conversion. Keep embeddings fresh as the catalog changes.
