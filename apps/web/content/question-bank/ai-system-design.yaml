  q: Design a classifier that predicts the optimal moment to insert a commercial break in a video.
  a: |
    Frame it as scoring candidate moments: segment the video into shots and scenes, extract features such as audio silence, scene changes, dialogue pauses, visual motion and narrative cues from transcripts, and predict for each candidate point the impact of a break, using labels from editors' chosen break points or from viewer retention data around past breaks.

    Optimize for retention and ad completion, not just plausibility, enforce constraints such as minimum spacing and no breaks mid-sentence, and evaluate with offline agreement with editors and online A/B tests on abandonment and ad performance.
