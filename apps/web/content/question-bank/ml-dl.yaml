- id: write-the-loss-function-for-logistic-regression-and-prove-it
  q: Write the loss function for logistic regression and prove it has a global minimum.
  a: >
    With p_i = σ(wᵀx_i), the loss is L(w) = −Σ_i [y_i log p_i + (1 − y_i) log(1 − p_i)]. Its
    gradient is Xᵀ(p − y) and its Hessian is XᵀSX, where S is diagonal with entries p_i(1 − p_i),
    which are positive.


    For any vector v, vᵀXᵀSXv = Σ_i p_i(1 − p_i)(x_iᵀv)² ≥ 0, so the Hessian is positive
    semi-definite and the loss is convex: any local minimum is global. A unique finite minimum
    exists when the data is not perfectly separable and X has full column rank; if the data is
    separable, the loss keeps decreasing as weights grow, which L2 regularization fixes by making
    the objective strictly convex.
  topic: ml
  level: Senior
  companies:
