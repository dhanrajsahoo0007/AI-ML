- id: how-is-kl-divergence-loss-different-from-cross-entropy-loss
  q: How is KL divergence loss different from cross-entropy loss? And from contrastive loss?
  a: >
    Cross-entropy H(P, Q) equals the entropy of P plus KL(P‖Q). With fixed targets, such as one-hot
    labels, the entropy term is constant, so minimizing cross-entropy and minimizing KL give the
    same gradients; KL is used when the target is itself a distribution, such as in distillation or
    keeping a policy close to a reference model.


    Contrastive losses such as InfoNCE are different: they compare a positive pair against
    negatives, pulling matching embeddings together and pushing others apart, which learns
    representations rather than matching a target distribution, as in CLIP or sentence embeddings.
  topic: ml
