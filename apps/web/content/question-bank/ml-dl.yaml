- id: what-are-the-differences-between-l1-and-l2-regularization-in
  q: What are the differences between L1 and L2 regularization in logistic regression?
  a: >
    L1 adds the sum of absolute weights to the loss, pushing many weights exactly to zero, which
    performs feature selection and gives sparse, interpretable models. L2 adds the sum of squared
    weights, shrinking weights smoothly without zeroing them, handling correlated features more
    gracefully by spreading weight among them.


    In logistic regression both reduce overfitting; L1 suits high-dimensional data with few relevant
    features, L2 is a good default, and elastic net combines them. Both require standardized
    features so the penalty treats features fairly.
  topic: ml
  level: Junior
  companies:
    - Amazon
  related: /interviews/ml-fundamentals
  refs:
