- id: discuss-precision-recall-and-f1-when-would-you-prioritise-on
  q: "Discuss precision, recall and F1: when would you prioritise one over the others?"
  a: >
    Precision is the share of predicted positives that are correct; recall is the share of actual
    positives found; F1 is their harmonic mean, high only when both are high.


    Prioritize precision when false positives are costly, such as flagging legitimate transactions
    or spam filters deleting real email. Prioritize recall when misses are costly, such as disease
    screening or safety-critical detection. Use F1 when both matter similarly, and tune the
    threshold to the business cost of each error.
