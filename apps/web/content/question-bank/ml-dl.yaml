- id: how-do-you-handle-data-imbalance-collinearity-feature-select
  q: How do you handle data imbalance, collinearity, feature selection and regularization?
  a: >
    Imbalance: use appropriate metrics, class weights, resampling such as SMOTE or undersampling,
    and threshold tuning. Collinearity: detect with correlation matrices and variance inflation
    factors, then drop or combine correlated features, use PCA, or use L2 regularization, which
    handles them stably.


    Feature selection: filter methods such as mutual information, wrapper methods such as recursive
    feature elimination, and embedded methods such as L1 or tree importances, validated with
    cross-validation. Regularization: tune L1, L2 or elastic net strength on validation data to
    balance fit and complexity.
  topic: ml
