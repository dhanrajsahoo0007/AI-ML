- id: explain-how-you-would-design-and-evaluate-an-a-b-test-what-i
  q: >-
    Explain how you would design and evaluate an A/B test. What is a p-value and how do you
    interpret it here?
  a: >
    Define the hypothesis and primary metric, guardrail metrics and the randomization unit; size the
    test from the baseline, minimum detectable effect, significance level and power; run it for the
    planned duration covering weekly cycles; check sample ratio and data quality; then analyze the
    effect with confidence intervals.


    The p-value is the probability of seeing a difference at least as large as observed if there
    were truly no effect. A p-value of 0.02 means such a result would be unusual under no effect,
    but it does not say the probability the change works, nor how big the effect is, which is why
    you also report the effect size and interval.
  topic: ml
  level: Mid
  companies:
    - Amazon
  related: /interviews/ab-testing-and-experimentation
  source: outcome-school
- id: what-is-maximum-likelihood-estimation-and-how-does-it-differ
  q: What is Maximum Likelihood Estimation and how does it differ from Bayesian inference?
  a: >
    Maximum likelihood estimation picks the parameter values that make the observed data most
    probable, giving a single point estimate. Bayesian inference treats parameters as random,
    combines a prior with the likelihood to get a full posterior distribution, and reports
    uncertainty through it.


    MAP estimation sits between them: the posterior's mode, equivalent to MLE plus a penalty from
    the prior, such as L2 regularization corresponding to a Gaussian prior. With lots of data, the
    prior matters less and MLE and Bayesian answers converge.
  topic: ml
  level: Mid
  companies:
    - Amazon
  related: /interviews/statistics-and-probability
  source: outcome-school
- id: explain-strategies-to-combat-overfitting-in-tree-based-class
  q: Explain strategies to combat overfitting in tree-based classification models.
  a: >
    For single trees: limit maximum depth, require a minimum number of samples per split or leaf,
    prune after growing using validation data or cost-complexity pruning, and limit the number of
    leaves.


    For ensembles: use bagging and random feature subsets (random forests), and for boosting use a
    small learning rate with early stopping, row and column subsampling, regularization on leaf
    weights and shallow trees. Validate with cross-validation and remove leaky or noisy features.
  topic: ml
  level: Mid
  companies:
    - NVIDIA
  related: /interviews/ml-fundamentals
  source: outcome-school
- id: summarize-the-differences-and-benefits-of-the-adam-optimizer
  q: >-
    Summarize the differences and benefits of the Adam optimizer compared with other methods for
    neural-network image classification.
  a: >
    Plain SGD uses one learning rate for all parameters; momentum adds a moving average of gradients
    to smooth and speed up progress. Adam combines momentum with per-parameter adaptive step sizes
    from a moving average of squared gradients, plus bias correction, so it converges quickly with
    little tuning and handles sparse or differently scaled gradients well.


    For image classification, Adam or AdamW trains fast and is robust, while well-tuned SGD with
    momentum and a learning-rate schedule has historically reached slightly better generalization on
    some benchmarks. AdamW's decoupled weight decay narrows that gap and is the common default for
    transformers.
  topic: dl
  level: Mid
  companies:
    - NVIDIA
  related: /interviews/deep-learning
  source: outcome-school
- id: a-network-confuses-pugs-and-pit-bulls-and-some-training-labe
  q: >-
    A network confuses pugs and pit bulls and some training labels are wrong. How do you modify the
    model and the data?
  a: >
    Data: audit and clean labels for the confused classes, using confident-learning methods or
    disagreement between models to find likely mislabels, collect more varied examples of both
    breeds, and add targeted augmentation. Check the confusion is not driven by background or
    dataset biases.


    Model: use a stronger pretrained backbone and fine-tune, increase input resolution so facial
    features are visible, use loss functions robust to label noise or label smoothing, and evaluate
    with per-class metrics and the confusion matrix on a clean test set.
  topic: dl
  level: Senior
  companies:
    - NVIDIA
  related: /interviews/computer-vision
  source: outcome-school
- id: how-do-you-evaluate-a-clustering-model-s-effectiveness-witho
  q: How do you evaluate a clustering model's effectiveness without pre-labelled groups?
  a: >
    Use internal metrics: silhouette score, Davies-Bouldin index and within-cluster versus
    between-cluster distances, measuring compactness and separation. Check stability by re-running
    on bootstrap samples or with different seeds and measuring how consistent the clusters are.


    Most importantly, judge usefulness: inspect clusters for interpretability with domain experts,
    check that they lead to different actions or outcomes, and if possible validate against
    downstream metrics such as campaign performance per segment.
  topic: ml
  level: Mid
  companies:
    - NVIDIA
  related: /interviews/model-evaluation-metrics
  source: outcome-school
- id: how-would-you-design-the-neural-network-architecture-for-mul
  q: >-
    How would you design the neural network architecture for multi-camera 3D object detection
    without lidar?
  a: >
    Encode each camera image with a shared backbone, then lift image features into a unified 3D or
    bird's-eye-view representation, either by predicting depth distributions and projecting
    features, or with transformer queries in BEV space that attend to image features using camera
    geometry. Fuse across time by aligning previous BEV features with ego-motion.


    Detection heads then predict 3D boxes, velocities and attributes in BEV. Train with
    lidar-derived or auto-labeled 3D ground truth, and evaluate depth accuracy especially at long
    range, since camera-only depth is the main weakness.
  topic: dl
  level: Senior
  companies:
    - Tesla
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: how-do-you-handle-extreme-class-imbalance-in-rare-event-dete
  q: >-
    How do you handle extreme class imbalance in rare-event detection (e.g. a child running into the
    road)?
  a: >
    Mine and upweight the rare cases: fleet triggers and similarity search to find more examples,
    targeted data collection, simulation and synthetic data for dangerous scenarios, and
    oversampling or loss weighting such as focal loss during training.


    Evaluate on curated rare-event test sets with recall at very low false-positive rates, never on
    overall accuracy, set thresholds by safety requirements, and add redundancy with other sensors
    or models. Safety-critical recall matters more than average metrics.
  topic: ml
  level: Senior
  companies:
    - Tesla
  related: /interviews/feature-engineering-and-data-prep
  source: outcome-school
- id: explain-how-you-would-auto-label-a-fleet-dataset-and-what-qu
  q: Explain how you would auto-label a fleet dataset and what quality controls you would put on it.
  a: >
    Use large offline models that would be too slow for the car, with access to the full clip
    including the future, multiple sensors and multiple passes, to produce high-quality labels such
    as 3D boxes and tracks. Combine model ensembles, temporal consistency and geometric constraints
    to refine labels.


    Quality controls: compare against human-labeled audit samples, measure label accuracy by class
    and distance, flag low-confidence or inconsistent labels for human review, monitor how label
    changes affect trained models, and version labeling pipelines so issues can be traced and fixed.
  topic: dl
  level: Senior
  companies:
    - Tesla
