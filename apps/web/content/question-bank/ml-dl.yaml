- id: how-would-you-detect-and-handle-distribution-shift-between-f
  q: How would you detect and handle distribution shift between fleet data and your training set?
  a: >
    Detect: compare feature and embedding distributions between fleet data and the training set,
    monitor model confidence and disagreement between models on fleet data, and track performance on
    freshly labeled samples by region, weather, time and vehicle type.


    Handle: collect and label data from under-represented conditions, rebalance training sets, use
    domain adaptation or augmentation for known shifts such as weather or camera changes, and add
    the new conditions to evaluation suites so regressions are caught.
  topic: ml
  level: Senior
  companies:
    - Tesla
  related: /interviews/mlops-and-deployment
