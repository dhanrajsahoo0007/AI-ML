- id: your-offline-metric-improved-but-the-online-a-b-did-not-enum
  q: >-
    Your offline metric improved but the online A/B did not. Enumerate the reasons this happens and
    how you would tell them apart.
  a: >
    Possible reasons: the offline metric does not match the business goal; offline data reflects the
    old model's exposure (feedback loop and position bias); training-serving skew in features;
    leakage in offline evaluation; the gain is concentrated in segments that matter little; novelty
    or learning effects online; an underpowered or flawed test; or latency changes that hurt
    engagement.


    Tell them apart by checking feature parity between training and serving logs, recomputing
    offline metrics on fresh data collected under the new model, analyzing online results by segment
    and over time, verifying test setup with A/A tests and sample ratio checks, and comparing
    latency.
  topic: ml
  level: Senior
  companies:
    - Consumer-Scale ML
  related: /interviews/ab-testing-and-experimentation
  source: outcome-school
- id: explain-position-bias-in-ranking-data-and-how-you-would-debi
  q: Explain position bias in ranking data and how you would debias training.
  a: >
    Items shown in higher positions get more clicks regardless of relevance, so training on raw
    clicks teaches the model to repeat past rankings and underrates good items shown lower.


    Debias by estimating position propensities with randomized experiments such as swapping adjacent
    results, then weighting training examples by inverse propensity; by adding position as a feature
    during training and fixing it at serving; by click models that separate examination from
    relevance; and by using small amounts of exploration traffic for unbiased data.
  topic: ml
  level: Senior
  companies:
    - Consumer-Scale ML
  related: /ai-system-design/genai-system-design/recommendation-systems
  source: outcome-school
- id: how-do-you-design-a-feature-store-and-what-causes-training-s
  q: How do you design a feature store, and what causes training/serving skew?
  a: >
    Define features once in a registry with transformation code, owners and versions. An offline
    store keeps historical values for building point-in-time-correct training sets, an online store
    serves the latest values with low latency, and a materialization pipeline (batch and streaming)
    keeps both fed from the same definitions.


    Training-serving skew comes from different code paths for training and serving, different data
    freshness, time-zone or default-value differences, leakage of future data into training
    features, and schema changes upstream. Prevent it with shared definitions, point-in-time joins,
    logging served features and comparing them with training data.
  topic: ml
  level: Senior
  companies:
    - Consumer-Scale ML
  related: /interviews/feature-engineering-and-data-prep
  source: outcome-school
- id: turn-a-conversation-into-billable-diagnosis-codes-what-is-th
  q: >-
    Turn a conversation into billable diagnosis codes. What is the accuracy bar, and how do you
    build to it?
  a: >
    The bar is high: codes drive billing and compliance, so errors cause denied claims or audit
    risk. Aim for accuracy comparable to professional coders on common codes, with very high
    precision on what is auto-suggested, and route uncertain cases to coders.


    Build it by extracting documented diagnoses and their supporting evidence from the note, mapping
    to codes with a model plus coding rules and code hierarchies, checking documentation
    requirements and specificity, and showing evidence for each code. Evaluate against certified
    coders' labels, measure per-code precision and recall, and monitor denials after deployment.
  topic: ml
  level: Senior
  companies:
    - Abridge
  related: /ai-system-design/genai-system-design/kg-healthcare-case-study
  source: outcome-school
- id: behaviour-cloning-on-teleoperation-data-has-a-well-known-fai
  q: >-
    Behaviour cloning on teleoperation data has a well-known failure mode. What is it, and what do
    you do about it on a real humanoid?
  a: >
    Compounding errors from covariate shift: the policy only saw states along expert trajectories,
    so small mistakes take it into states never seen in training, where it makes bigger mistakes and
    drifts further off.


    On a real humanoid, collect demonstrations that include recoveries from perturbed states, use
    interactive corrections such as DAgger-style data where operators take over when the policy
    drifts, use action chunking and diverse data to make policies more robust, and add RL
    fine-tuning or safety controllers to handle deviations.
  topic: dl
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: a-whole-body-controller-trained-entirely-in-simulation-has-t
  q: >-
    A whole-body controller trained entirely in simulation has to run on real hardware. What
    transfers, what does not, and how do you close the gap?
  a: >
    Gross dynamics and learned behaviors such as balance strategies often transfer if simulation is
    reasonably accurate. What does not transfer well: exact friction and contact behavior, actuator
    dynamics and delays, sensor noise, latency, and mass and calibration differences between the
    model and the real robot.


    Close the gap with domain randomization of physics parameters, accurate actuator models learned
    from real data, system identification, adding real latency and noise in simulation, observation
    designs that avoid simulator-specific signals, and fine-tuning or adaptation on real hardware
    with safety limits.
  topic: dl
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: where-does-reinforcement-learning-fit-on-top-of-imitation-le
  q: >-
    Where does reinforcement learning fit on top of imitation learning for manipulation, and what
    makes the reward the hard part?
  a: >
    Imitation learning gets a policy to roughly competent behavior from demonstrations; RL then
    improves it beyond the demonstrations: higher success rates, faster or more robust execution,
    and recovery from situations demonstrations did not cover, usually in simulation or with careful
    real-world fine-tuning.


    The reward is hard because manipulation success is hard to measure automatically in the real
    world (did the object end up correctly placed?), sparse rewards make learning slow, and dense
    shaped rewards are easy for the policy to exploit. Solutions include learned reward models from
    success labels, vision-based success detectors, and simulation where success can be computed
    exactly.
  topic: dl
  level: Senior
  companies:
    - Figure AI
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  source: outcome-school
- id: modular-perception-prediction-and-planning-or-end-to-end-lea
  q: >-
    Modular perception, prediction and planning, or end-to-end learned driving? Make the case, then
    tell me what you would actually build.
  a: >
    Modular stacks are interpretable, testable component by component and easier to validate for
    safety, but errors compound across interfaces and hand-designed intermediate representations
    lose information. End-to-end learning optimizes the whole system toward driving outcomes and can
    exploit richer signals, but is harder to debug, verify and validate for safety cases.


    A practical build is a hybrid: learned components with rich learned interfaces between
    perception, prediction and planning, trained jointly where possible, plus explicit safety
    layers, interpretable intermediate outputs for validation and rule-based checks on the final
    plan.
  topic: dl
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: design-the-output-representation-for-a-behaviour-prediction
  q: >-
    Design the output representation for a behaviour prediction model. What metrics would you gate
    it on?
  a: >
    Predict multiple possible future trajectories per agent over a time horizon, each with a
    probability, to capture multimodal intentions such as turning or going straight, possibly with
    uncertainty per waypoint, plus interactions between agents through joint predictions for key
    pairs.


    Gate on metrics such as minimum average and final displacement error across the top-k
    trajectories, miss rate, probability calibration, and performance on safety-relevant slices such
    as pedestrians and cut-ins, and finally on closed-loop planning metrics, since prediction
    quality matters only through how it affects driving.
  topic: dl
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
  source: outcome-school
- id: where-do-vision-language-models-and-foundation-models-genuin
  q: >-
    Where do vision-language models and foundation models genuinely help in an autonomy stack, and
    where are they a liability?
  a: >
    They help offline and at the edges: auto-labeling and data mining of rare scenarios, semantic
    understanding of unusual situations such as construction zones or hand signals, scene
    descriptions for search, simulation generation and long-tail reasoning, and as teachers for
    smaller onboard models.


    They are a liability in the real-time safety loop if used directly: high latency, heavy compute,
    non-deterministic outputs, possible hallucinations and difficulty verifying behavior for a
    safety case. Using them with strict bounds, monitoring and fallbacks, or distilling their
    knowledge into verifiable onboard models, keeps the benefits.
  topic: dl
  level: Senior
  companies:
    - Waymo
  related: /ai-system-design/genai-system-design/multimodal-and-voice-ai
