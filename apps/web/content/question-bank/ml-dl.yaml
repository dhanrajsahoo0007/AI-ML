- id: how-do-bagging-and-boosting-differ-what-is-the-computational
  q: >-
    How do bagging and boosting differ? What is the computational difference between XGBoost and
    Random Forest?
  a: >
    Bagging trains models independently on bootstrap samples and averages them, mainly reducing
    variance; boosting trains models sequentially, each correcting the previous ensemble's errors,
    mainly reducing bias.


    Computationally, a random forest's trees can be built fully in parallel, are deep, and each
    split considers a random subset of features. XGBoost builds shallow trees one after another, so
    trees cannot be parallelized across the ensemble, but each tree's split finding is parallelized
    over features using pre-sorted or histogram-based data, with second-order gradients,
    regularization and handling of missing values. Random forests are easier to tune; XGBoost
    usually reaches higher accuracy with tuning.
  topic: ml
  level: Mid
  companies:
    - Amazon
  related: /interviews/ml-fundamentals
  source: outcome-school
- id: explain-the-bias-variance-trade-off-cross-validation-and-the
  q: Explain the bias-variance trade-off, cross-validation, and the curse of dimensionality.
  a: >
    Bias is error from overly simple assumptions, causing underfitting; variance is error from
    sensitivity to the specific training data, causing overfitting. Expected error decomposes into
    bias squared plus variance plus irreducible noise, and increasing model complexity typically
    lowers bias while raising variance, so you look for the complexity with the lowest total error.


    Cross-validation estimates that error on unseen data by training on k−1 folds and validating on
    the remaining fold, rotating, which guides model selection. The curse of dimensionality means
    that as features grow, data becomes sparse, distances become less meaningful and far more data
    is needed, which increases variance unless you reduce dimensions or regularize.
  topic: ml
  level: Junior
  companies:
    - Amazon
    - Google DeepMind
  related: /interviews/ml-fundamentals
  source: outcome-school
- id: how-do-gru-cells-work-and-how-do-they-address-the-vanishing
  q: >-
    How do GRU cells work, and how do they address the vanishing gradient problem? How does a BiLSTM
    work?
  a: >
    A GRU has an update gate that decides how much of the previous hidden state to keep versus
    replace, and a reset gate that decides how much past state to use when computing the candidate
    new state. The new hidden state is an interpolation between the old state and the candidate,
    controlled by the update gate.


    Because the update gate can keep the state almost unchanged, information and gradients can flow
    across many time steps through that near-identity path, which reduces vanishing gradients
    compared with plain RNNs. A BiLSTM runs one LSTM forward and one backward over the sequence and
    concatenates their states, so each position sees both past and future context.
  topic: dl
  level: Mid
  companies:
    - Amazon
  related: /interviews/deep-learning
  refs:
    - title: Recurrent Neural Network (RNN)
      url: https://outcomeschool.com/blog/recurrent-neural-network
  source: outcome-school
- id: what-is-attention-in-machine-learning-models-what-happens-in
  q: >-
    What is Attention in machine learning models? What happens in a neural network if you remove all
    the hidden layers?
  a: >
    Attention lets a model compute, for each position, a weighted combination of other positions'
    information, with weights based on learned relevance between a query and keys. It lets models
    focus on the relevant parts of the input and connect distant elements directly.


    If you remove all hidden layers, the network becomes a linear model applied to the inputs, such
    as linear or logistic regression, depending on the output layer. It can only learn linear
    decision boundaries, losing the ability to represent complex non-linear functions.
