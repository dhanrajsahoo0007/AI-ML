- id: derive-the-gradient-of-cross-entropy-loss-with-softmax-input
  q: >-
    Derive the gradient of cross-entropy loss with softmax inputs, and explain why we fuse them
    numerically.
  a: >
    With logits z, softmax probabilities p_i = exp(z_i) / Σ_j exp(z_j) and a one-hot target y, the
    loss is L = −Σ_i y_i log p_i. The derivative of p_i with respect to z_k is p_i(δ_ik − p_k), and
    the chain rule gives ∂L/∂z_k = p_k − y_k: predicted probability minus target.


    They are fused because computing softmax and then log separately is numerically unstable:
    exponentials overflow for large logits and log of tiny probabilities underflows. A fused
    log-softmax uses the log-sum-exp trick (subtracting the maximum logit) and yields the simple,
    stable gradient p − y.
  topic: dl
