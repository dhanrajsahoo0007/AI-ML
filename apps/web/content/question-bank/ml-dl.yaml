- id: what-are-the-assumptions-of-linear-regression
  q: What are the assumptions of linear regression?
  a: >
    A linear relationship between features and target; independent errors; constant error variance
    (homoscedasticity); normally distributed errors for valid inference such as confidence
    intervals; and no perfect multicollinearity among features.


    Check them with residual plots against fitted values, Q-Q plots, autocorrelation tests for time
    data and variance inflation factors. Violations do not always ruin predictions, but they make
    coefficients and p-values unreliable.
  topic: ml
  level: Junior
  companies:
    - Google DeepMind
  related: /interviews/statistics-and-probability
  source: outcome-school
- id: distinguish-regularization-from-validation-when-is-each-the
  q: "Distinguish regularization from validation: when is each the right tool?"
  a: >
    Regularization changes how the model is trained, adding a penalty such as L1, L2 or dropout that
    discourages complexity, to reduce overfitting. Validation measures how well a trained model
    generalizes, using held-out data or cross-validation, to choose among models and
    hyperparameters, including the regularization strength itself.


    Use regularization when the model is overfitting and you want a simpler solution; use validation
    always, to detect overfitting and decide how much regularization helps. They work together:
    validation picks the regularization amount.
  topic: ml
