- id: we-have-two-models-85-and-82-accuracy-which-do-you-pick
  q: We have two models, 85% and 82% accuracy. Which do you pick?
  a: >
    It depends. First check whether the 3-point difference is statistically meaningful given the
    test set size, and whether accuracy is the right metric: with class imbalance or unequal error
    costs, precision, recall or business cost may favor the other model.


    Then consider latency, cost, interpretability, robustness across segments, calibration and
    maintenance. Pick the model that best serves the business goal, and confirm with an online test
    if the stakes justify it.
