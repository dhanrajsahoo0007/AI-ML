- id: explain-the-svd-and-give-two-places-it-shows-up-in-modern-de
  q: Explain the SVD and give two places it shows up in modern deep learning.
  a: >
    Singular value decomposition factors any matrix A into U Σ Vᵀ, where U and V have orthonormal
    columns and Σ is diagonal with non-negative singular values in decreasing order. Keeping the top
    k singular values gives the best rank-k approximation of A.


    In deep learning it appears in low-rank adaptation and compression (LoRA's premise that weight
    updates are low rank, and SVD-based initialization or compression of weight matrices), in
    analyzing and pruning layers, in spectral normalization that controls the largest singular value
    for training stability, and in PCA for embeddings.
  topic: dl
  level: Senior
  companies:
    - Google DeepMind
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  source: outcome-school
- id: on-average-how-many-fair-coin-flips-until-you-see-two-heads
  q: On average, how many fair coin flips until you see two heads in a row? Walk me through it.
  a: >
    Six. Let E be the expected number of flips from the start and F the expected number after just
    seeing one head. From the start, one flip leads to F with probability 1/2 or back to the start
    with probability 1/2: E = 1 + F/2 + E/2. After a head, one flip finishes with probability 1/2 or
    resets: F = 1 + E/2.


    Substituting: E = 1 + (1 + E/2)/2 + E/2, so E/4 = 3/2 and E = 6.
  topic: ml
  level: Mid
  companies:
    - Google DeepMind
  related: /interviews/statistics-and-probability
  source: outcome-school
- id: when-would-you-choose-q-learning-over-policy-gradients-and-v
  q: When would you choose Q-learning over policy gradients, and vice versa?
  a: >
    Q-learning learns action values and acts greedily; it is sample-efficient through off-policy
    learning and experience replay and works well with small discrete action spaces, as in classic
    games. It struggles with continuous or huge action spaces and can be unstable with function
    approximation.


    Policy gradients optimize the policy directly, handle continuous and large action spaces and
    stochastic policies naturally, and are what LLM RL uses (PPO, GRPO), at the cost of higher
    variance and lower sample efficiency, usually reduced with baselines or critics. Actor-critic
    methods combine the two.
  topic: ml
  level: Senior
  companies:
    - Google DeepMind
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  source: outcome-school
- id: you-have-a-binary-loan-approval-classifier-and-limited-acces
  q: >-
    You have a binary loan-approval classifier and limited access to feature weights. How do you
    explain a rejection?
  a: >
    Use model-agnostic explanations that only need predictions: SHAP or LIME estimates of which
    features pushed this applicant toward rejection, and counterfactual explanations such as
    "approved if income were X higher or debt Y lower", which are actionable and often required for
    adverse-action notices.


    Make sure explanations are faithful and stable, use features the applicant can understand, avoid
    exposing protected attributes, and check fairness across groups. In regulated lending, an
    inherently interpretable model may be preferable to explaining a black box.
  topic: ml
  level: Senior
  companies:
    - Google DeepMind
  related: /interviews/model-evaluation-metrics
  source: outcome-school
- id: your-ads-ctr-model-shows-a-2-offline-auc-gain-but-the-online
  q: >-
    Your ads CTR model shows a 2% offline AUC gain, but the online A/B is revenue-neutral with worse
    calibration. What is going on, and what do you do?
  a: >
    AUC measures ranking, but ads auctions use predicted click probabilities directly to compute
    bids and prices, so calibration errors distort the auction: overpredicting for some ads shifts
    allocation and pricing even if ranking improved. Offline gains may also come from segments with
    little revenue, or from feature leakage that does not hold online.


    Recalibrate the model (Platt or isotonic calibration, per segment if needed) and check
    calibration by segment and position, compare offline metrics such as log loss and normalized
    entropy that reflect calibration, check for training-serving skew, and rerun the A/B test with
    revenue and advertiser value as the primary metrics.
  topic: ml
  level: Senior
  companies:
    - Meta
  related: /interviews/ab-testing-and-experimentation
  source: outcome-school
- id: what-is-the-closed-form-solution-of-linear-regression-and-wh
  q: >-
    What is the closed-form solution of linear regression, and when do you use gradient descent
    instead?
  a: >
    The normal equation gives w = (XᵀX)⁻¹Xᵀy, which minimizes squared error exactly; with L2
    regularization it becomes (XᵀX + λI)⁻¹Xᵀy.


    Use gradient descent when there are many features, since inverting a d×d matrix costs about d³;
    when data is too large for memory or arrives in streams; or when XᵀX is ill-conditioned. In
    practice, solvers use QR or SVD decompositions rather than explicit inversion for stability.
  topic: ml
  level: Mid
  companies:
    - Amazon
  related: /interviews/ml-fundamentals
