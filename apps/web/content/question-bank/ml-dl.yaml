# Company-reported questions adapted from Outcome School (Apache 2.0); see NOTICE.md. Answers are our own.
- id: compute-the-kl-divergence-given-different-random-variables
  q: Compute the KL divergence given different random variables.
  a: >
    KL divergence from Q to P is the sum over outcomes of P(x) × log(P(x) / Q(x)), or the integral
    for continuous variables. Example: for coins with P(heads) = 0.5 and Q(heads) = 0.9, KL(P‖Q) =
    0.5 log(0.5/0.9) + 0.5 log(0.5/0.1) ≈ 0.51 nats.


    Know its properties: it is always non-negative, zero only when the distributions match, not
    symmetric (KL(P‖Q) differs from KL(Q‖P)), and infinite if Q assigns zero probability where P
    does not. For two Gaussians there is a closed form based on their means and variances.
  topic: ml
  level: Mid
  companies:
    - OpenAI
  related: /interviews/statistics-and-probability
  source: outcome-school
- id: if-the-accuracy-of-a-classifier-is-1-what-is-the-lower-upper
  q: >-
    If the accuracy of a classifier is 1, what is the lower/upper bound on the loss function for a
    single training example?
  a: >
    Accuracy of 1 means the predicted class is always correct, so with cross-entropy the true class
    has the highest probability. For binary classification that probability is above 0.5, so the
    per-example loss is above 0 (approached as the probability nears 1) and below −log(0.5) ≈ 0.69.
    With K classes, the true class's probability can be as low as just above 1/K, so the upper bound
    is just under log K.


    The point is that accuracy and loss measure different things: a perfectly accurate classifier
    can still be poorly calibrated and have meaningful loss.
  topic: ml
  level: Mid
