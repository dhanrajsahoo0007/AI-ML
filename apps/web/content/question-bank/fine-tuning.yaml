- id: training-a-trillion-parameter-model-attention-logits-can-blo
  q: >-
    Training a trillion-parameter model, attention logits can blow up and destabilise the run. What
    is going on, and how does something like MuonClip address it?
  a: >
    If query and key projection weights grow during training, attention logits, the query-key dot
    products, become huge, the softmax saturates and gradients spike, which can destabilize or
    diverge the run. Aggressive optimizers such as Muon make this more likely at large scale.


    MuonClip combines the Muon optimizer with QK-Clip: after each update, if the maximum attention
    logit for a head exceeds a threshold, the query and key weights for that head are rescaled down
    so logits stay bounded. It targets the cause directly without changing the architecture, and
    Moonshot reported training Kimi K2 without loss spikes this way.
  topic: fine-tuning
  level: Senior
  companies:
    - Moonshot AI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: kimi-k1-5-scaled-rl-for-reasoning-without-a-process-reward-m
  q: >-
    Kimi K1.5 scaled RL for reasoning without a process reward model or tree search. Why
    deliberately keep the RL recipe that simple?
  a: >
    Process reward models and tree search are expensive, hard to train well and easy to hack, and
    they complicate scaling. Kimi K1.5's bet was that long-context RL, letting the model produce
    very long chains of thought with outcome-based rewards, lets the model learn planning,
    reflection and correction on its own.


    A simple recipe is easier to scale, debug and make efficient, with fewer components that can
    fail or be exploited. Their results suggested that context length and outcome rewards, rather
    than elaborate search machinery, drive much of the reasoning improvement.
  topic: fine-tuning
  level: Senior
  companies:
    - Moonshot AI
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  source: outcome-school
- id: why-does-long-horizon-agentic-rl-need-a-disaggregated-asynch
  q: >-
    Why does long-horizon agentic RL need a disaggregated, asynchronous design (as in the slime
    framework) rather than colocated-synchronous?
  a: >
    Agentic rollouts are long and vary wildly in length because they involve many tool calls,
    environment waits and multi-turn interaction. In a colocated synchronous design, training waits
    for the slowest rollout in each batch and GPUs sit idle, and generation and training compete for
    the same hardware.


    Disaggregating rollout workers (inference engines interacting with environments) from trainers,
    and running them asynchronously with a buffer of completed trajectories, keeps both busy and
    scales each independently. The costs are slightly off-policy data, which needs correction or
    freshness limits, and more complex orchestration, as frameworks such as slime handle.
  topic: fine-tuning
  level: Senior
  companies:
    - Zhipu AI
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: glm-4-5-s-post-training-trains-expert-models-per-domain-then
  q: >-
    GLM-4.5's post-training trains expert models per domain then unifies with self-distillation.
    Walk through why you would train specialists and then merge them.
  a: >
    Training one model on every skill at once forces trade-offs: data mixtures compete, and RL for
    reasoning, agents and chat need different rewards and hyperparameters. Training separate expert
    models per domain lets each reach its best performance with tailored data and RL.


    Self-distillation then unifies them: the experts generate high-quality responses in their
    domains, and a single general model is fine-tuned on that combined data, possibly followed by
    joint RL. The final model inherits most of each specialist's strength without serving many
    models.
  topic: fine-tuning
