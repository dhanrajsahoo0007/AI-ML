- id: prompting-rag-or-fine-tuning-give-me-your-decision-framework
  q: 'Prompting, RAG or fine-tuning: give me your decision framework with cost and latency attached.'
  a: |
    Start with prompting: lowest cost to build, no training, but long prompts raise per-request cost and latency. Add RAG when the model needs knowledge it lacks, especially private, fresh or citable information: moderate build cost for ingestion and retrieval, added latency of tens to hundreds of milliseconds, and cost grows with retrieved tokens.

    Fine-tune when you need consistent behavior, format or domain style that prompting cannot reach, or to replace a large prompted model with a small tuned one at high volume: upfront data and training cost, but often the lowest cost and latency per request. Use LoRA unless you have large data and need deep changes. Combine them freely: RAG for knowledge, fine-tuning for behavior.
