- id: compare-lora-prefix-tuning-prompt-tuning-and-full-fine-tunin
  q: Compare LoRA, prefix tuning, prompt tuning and full fine-tuning. When would you choose each?
  a: |
    Full fine-tuning updates every weight: highest quality ceiling, most memory and storage, and most forgetting risk; use it with lots of data or large behavior changes. LoRA learns low-rank weight updates: near full-tuning quality on most tasks at a fraction of the cost, with small swappable adapters; it is the default.

    Prefix tuning learns key and value vectors prepended at every layer, and prompt tuning learns soft prompt embeddings only at the input. Both are tiny and cheap to store per task, but less expressive and more sensitive to hyperparameters, working best on large models and simpler tasks.
