- id: why-does-long-horizon-agentic-rl-need-a-disaggregated-asynch
  q: Why does long-horizon agentic RL need a disaggregated, asynchronous design (as in the slime framework) rather than colocated-synchronous?
  a: |
    Agentic rollouts are long and vary wildly in length because they involve many tool calls, environment waits and multi-turn interaction. In a colocated synchronous design, training waits for the slowest rollout in each batch and GPUs sit idle, and generation and training compete for the same hardware.

    Disaggregating rollout workers (inference engines interacting with environments) from trainers, and running them asynchronously with a buffer of completed trajectories, keeps both busy and scales each independently. The costs are slightly off-policy data, which needs correction or freshness limits, and more complex orchestration, as frameworks such as slime handle.
  level: Senior
  category: fine-tuning
  subcategory: preference-rl
  companies:
  - Zhipu AI
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: sarvam-m-ships-hybrid-think-non-think-modes-and-was-post-tra
  q: Sarvam-M ships hybrid think/non-think modes and was post-trained with SFT then RLVR. How would you build that, and why RLVR over vanilla RLHF?
  a: |
    Build it in stages: supervised fine-tuning on a mix of examples with and without reasoning traces, marked by a mode flag, including data in the target languages, then RL with verifiable rewards on math, code and instruction-following tasks where answers can be checked, with mode-specific prompts.

    RLVR is preferred over vanilla RLHF for these skills because rewards are programmatic, cheap and hard to hack, so training can run longer and improve correctness rather than style. Learned preference rewards can still be added for open-ended chat quality.
