- id: walk-me-through-a-post-training-recipe-to-turn-a-pretrained
  q: Walk me through a post-training recipe to turn a pretrained base model into a personalised assistant.
  a: |
    Supervised fine-tuning on high-quality instruction and conversation data teaches format and helpfulness. Preference tuning with RLHF or DPO on comparisons improves quality and tone, and verifiable-reward RL improves reasoning and tool use where checkable. Safety tuning and red-team data shape refusals.

    Personalization then comes mostly from context, not per-user weights: long-term memory of preferences and facts retrieved into the prompt, user-editable custom instructions, and possibly lightweight per-user adapters where privacy and cost allow. Evaluate personalization with multi-session tests and privacy checks.
