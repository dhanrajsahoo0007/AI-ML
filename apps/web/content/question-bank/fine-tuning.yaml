- id: what-is-rlvr-rl-with-verifiable-rewards-and-where-does-it-be
  q: What is RLVR (RL with verifiable rewards) and where does it beat a learned reward model?
  a: |
    Reinforcement learning with verifiable rewards scores outputs with a program instead of a learned model: a math answer matches the reference, code passes unit tests, output matches a format or constraint. The policy is trained with RL, often GRPO, on those rewards.

    It beats a learned reward model where correctness can be checked automatically, such as math, code, logic puzzles and structured tasks, because the reward is cheap, consistent and much harder to hack than a neural reward model, so training can run longer and scale further. Learned reward models are still needed for open-ended qualities such as helpfulness and style.
