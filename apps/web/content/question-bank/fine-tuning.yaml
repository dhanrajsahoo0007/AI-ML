- id: some-annotators-are-pasting-your-tasks-into-chatgpt-and-subm
  q: Some annotators are pasting your tasks into ChatGPT and submitting the output. How do you detect and handle it?
  a: |
    Detect it with several signals: gold tasks with known answers designed so LLM outputs differ from human judgments, timing patterns such as impossibly fast long answers or paste events, stylistic and AI-text signals, unusually high agreement with model outputs, and comparisons with outputs from popular models on the same prompts.

    Handle it with clear policies, warnings and removal for repeat cases, re-labeling of affected data, and task design that requires human judgment or context, such as personal experience or evaluating model outputs against criteria. Also check whether some tasks allow tool use legitimately.
  level: Mid
