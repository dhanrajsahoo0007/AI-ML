- id: you-re-building-a-web-scale-pretraining-corpus-fineweb-style
  q: >-
    You're building a web-scale pretraining corpus (FineWeb-style). Walk me through the pipeline and
    how you decide whether each filter earns its place.
  a: >
    Start from web crawl dumps: URL filtering for spam and adult sites, text extraction from HTML
    with a good extractor, language identification, quality filtering with heuristics (length,
    repetition, punctuation and stop-word ratios) and model-based classifiers, near-duplicate
    removal with MinHash, and removal of personal data.


    Decide whether each filter earns its place empirically: train small ablation models on data with
    and without the filter, at equal token counts, and compare on a fixed set of benchmarks; keep
    filters that improve results, and watch for filters that remove too much useful diversity. This
    is how the FineWeb team made and documented its choices.
  topic: fine-tuning
  level: Senior
  companies:
    - Hugging Face
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: compare-sft-rlhf-dpo-and-rlvr-for-improving-an-instruction-t
  q: >-
    Compare SFT, RLHF, DPO and RLVR for improving an instruction-tuned model. What data does each
    need, and when would you pick which?
  a: >
    SFT needs high-quality prompt and response demonstrations and teaches format and new behaviors
    directly; pick it to add skills or styles. RLHF needs preference comparisons to train a reward
    model plus an online RL setup; pick it for open-ended quality with a reusable reward model and
    the infrastructure to run it.


    DPO needs preference pairs only and is simple and stable offline; pick it for alignment and tone
    improvements with limited infrastructure. RLVR needs prompts with programmatically checkable
    answers and an RL setup; pick it for reasoning, math, code and tool use where correctness can be
    verified. Most modern pipelines combine them in that order.
  topic: fine-tuning
  level: Senior
  companies:
    - Scale AI
  related: /ai-system-design/genai-system-design/fine-tuning-llms
