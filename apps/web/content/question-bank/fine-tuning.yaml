- id: fp8-training-at-671b-scale-is-hard-what-actually-breaks-in-l
  q: >-
    FP8 training at 671B scale is hard. What actually breaks in low precision, and how do you make
    it stable?
  a: >
    FP8 has very little range and precision, so outliers in activations, weights or gradients either
    overflow or get crushed to zero, and accumulating many products in low precision loses accuracy.
    At large scale these errors compound into divergence.


    DeepSeek-V3's approach: fine-grained scaling, with separate scale factors for small tiles of
    activations and blocks of weights so one outlier does not ruin a whole tensor; accumulating
    matmul results in higher precision at regular intervals; keeping sensitive components such as
    embeddings, the output head, normalization and attention in higher precision; and storing
    optimizer state in higher precision. They validated against BF16 training at smaller scale
    first.
  topic: fine-tuning
  level: Senior
  companies:
    - DeepSeek
  related: /ai-system-design/genai-system-design/gpu-performance-for-llms
  source: outcome-school
- id: how-do-you-build-a-training-dataset-without-triggering-model
  q: >-
    How do you build a training dataset without triggering model collapse when much of your data is
    synthetic?
  a: >
    Model collapse happens when models are trained repeatedly on their own outputs, losing the tails
    of the distribution and amplifying errors. Avoid it by always keeping a large share of real
    human data, accumulating data across generations rather than replacing real data with synthetic
    data, and generating synthetic data from strong, diverse sources.


    Filter synthetic data hard: verify correctness with checkers, tests or stronger models,
    deduplicate, and measure diversity. Use synthetic data where it is verifiable or targeted, such
    as math, code and specific skills, track the provenance of every sample, and evaluate on
    real-world held-out data to catch narrowing.
  topic: fine-tuning
  level: Senior
  companies:
    - DeepSeek
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: dualpipe-overlaps-computation-and-communication-in-training
  q: >-
    DualPipe overlaps computation and communication in training. Why is that overlap the whole game
    at this scale, and what is the trade-off?
  a: >
    In large MoE training with expert parallelism, every layer needs all-to-all communication to
    send tokens to experts on other GPUs, and across nodes that communication can take as long as
    the computation. If GPUs wait for communication, a large share of expensive hardware sits idle.


    DualPipe is a bidirectional pipeline schedule that feeds micro-batches from both ends and pairs
    the forward and backward chunks so one chunk's computation runs while another's communication is
    in flight, which hides most communication and shrinks pipeline bubbles. The trade-off is extra
    memory, including keeping additional parameter copies, and a more complex schedule to implement
    and debug.
  topic: fine-tuning
  level: Senior
  companies:
    - DeepSeek
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: deepseek-claims-frontier-class-results-at-a-fraction-of-the
  q: >-
    DeepSeek claims frontier-class results at a fraction of the usual training cost. If an
    interviewer asks “how is that even possible,” what is your structured answer?
  a: >
    Structure it as architecture, numerics, systems and accounting. Architecture: a sparse MoE with
    about 37B active of 671B parameters and multi-head latent attention, so each token costs far
    less compute and memory. Numerics: FP8 training. Systems: DualPipe and custom communication
    kernels that overlap all-to-all traffic with compute, keeping GPU utilization high. Data and
    objectives: high-quality data and multi-token prediction for denser training signal.


    Accounting: the widely quoted figure covers the GPU hours of the final training run, about 2.8
    million H800 hours, not research, ablations, failed runs, data or salaries. So the efficiency is
    real and comes from many compounding engineering choices, but the full cost of developing the
    model is higher than the headline number.
  topic: fine-tuning
  level: Senior
  companies:
    - DeepSeek
  related: /ai-system-design/genai-system-design/mixture-of-experts
