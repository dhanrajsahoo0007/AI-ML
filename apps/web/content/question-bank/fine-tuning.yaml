- id: sarvam-m-ships-hybrid-think-non-think-modes-and-was-post-tra
  q: >-
    Sarvam-M ships hybrid think/non-think modes and was post-trained with SFT then RLVR. How would
    you build that, and why RLVR over vanilla RLHF?
  a: >
    Build it in stages: supervised fine-tuning on a mix of examples with and without reasoning
    traces, marked by a mode flag, including data in the target languages, then RL with verifiable
    rewards on math, code and instruction-following tasks where answers can be checked, with
    mode-specific prompts.


    RLVR is preferred over vanilla RLHF for these skills because rewards are programmatic, cheap and
    hard to hack, so training can run longer and improve correctness rather than style. Learned
    preference rewards can still be added for open-ended chat quality.
  topic: fine-tuning
