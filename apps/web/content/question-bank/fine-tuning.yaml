- id: a-regional-government-wants-an-assistant-in-a-low-resource-l
  q: >-
    A regional government wants an assistant in a low-resource language with only a few thousand
    sentences of clean text. How do you adapt a model to it?
  a: >
    Start from a strong multilingual model, ideally one that has seen related languages, and check
    its tokenizer: if the script splits badly, extend the vocabulary with new tokens initialized
    from their sub-pieces. Do continued pre-training on all available text in the language plus
    related languages, then instruction-tune with a small set of high-quality examples written by
    native speakers.


    Expand data carefully: translate instruction data from a high-resource language and have
    speakers review it, use back-translation, and collect more through the deployment with consent.
    Evaluate with native speakers on tasks the government actually needs, and use retrieval over
    local documents for factual knowledge.
  topic: fine-tuning
  level: Senior
