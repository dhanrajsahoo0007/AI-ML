- id: your-pretraining-loss-suddenly-diverges-at-step-300k-of-a-lo
  q: Your pretraining loss suddenly diverges at step 300k of a long run. Diagnose and fix it.
  a: >
    First rule out data and hardware: inspect the batches just before the spike for corrupted,
    duplicated or unusual data, and check for faulty nodes, NaNs or silent data corruption. Then
    check training dynamics: gradient norm spikes, growing attention logits or activation
    magnitudes, optimizer state issues, a learning-rate schedule event, or low-precision overflow.


    Fix by rolling back to a checkpoint before the spike and skipping the bad data, lowering the
    learning rate, tightening gradient clipping, adding stabilizers such as QK-normalization, z-loss
    on logits or higher precision in sensitive operations, and adjusting Adam's epsilon or beta2.
    Keep monitoring so the next spike is caught early.
  topic: fine-tuning
  level: Senior
  companies:
    - Google DeepMind
    - xAI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
