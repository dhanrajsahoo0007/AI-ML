- id: how-would-you-improve-an-on-device-model-using-signals-from
  q: >-
    How would you improve an on-device model using signals from user devices without collecting user
    content?
  a: >
    Keep raw content on device and only share privacy-protected aggregates. Options include
    federated learning, where devices compute updates locally and send them through secure
    aggregation with differential privacy noise, and differentially private telemetry, where devices
    report noisy signals such as which of several candidate synthetic examples best matches their
    local data.


    Use those aggregate signals to choose or generate better synthetic training data, tune models
    centrally, and evaluate quality, with strict privacy budgets, opt-in consent and review. Measure
    improvements on public and synthetic evaluation sets since real user data is never collected.
  topic: fine-tuning
  level: Senior
  companies:
    - Apple
  related: /ai-system-design/genai-system-design/guardrails-and-safety
