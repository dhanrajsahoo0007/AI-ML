- id: we-sell-rl-environments-design-one-for-book-a-multi-city-tri
  q: We sell RL environments. Design one for “book a multi-city trip in a web travel app”, specify the reward, and tell me how you stop the policy hacking it.
  a: |
    Build a realistic sandboxed travel web app with seeded inventory, prices, randomized layouts and edge cases such as sold-out flights and date conflicts, plus a task generator that creates trips with constraints like cities, dates, budget and preferences. The agent acts through browser actions.

    Reward: check the backend state after the episode, crediting bookings that satisfy every constraint and penalizing extra or wrong bookings, constraint violations and excessive cost or steps. Prevent hacking by grading backend state rather than page text, hiding the checker, randomizing tasks and layouts, blocking shortcuts such as editing the database or reading hidden fields, and reviewing high-reward trajectories for exploits.
  level: Senior
  category: fine-tuning
  subcategory: preference-rl
  companies:
