- id: qwen3-uses-strong-to-weak-distillation-bootstrapping-smaller
  q: Qwen3 uses strong-to-weak distillation, bootstrapping smaller models from flagship ones. How does that work and why is it cheaper?
  a: |
    The flagship model goes through the expensive full pipeline of reasoning SFT and large-scale RL. Smaller models then learn from it: first off-policy, training on the teacher's responses in both thinking and non-thinking modes, then on-policy, where the student generates responses and is trained to match the teacher's output probabilities on them, correcting its own mistakes.

    It is cheaper because the small models skip their own multi-stage RL; matching a strong teacher's distributions transfers the gains with far fewer GPU hours, and Qwen reported better results than running RL directly on the small models.
  level: Senior
