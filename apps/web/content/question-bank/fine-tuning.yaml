- id: r1-zero-was-trained-with-rl-and-essentially-no-sft-first-wha
  q: R1-Zero was trained with RL and essentially no SFT first. What did that show, and why did full R1 add SFT back?
  a: |
    R1-Zero applied large-scale RL with GRPO and simple rule-based rewards for answer correctness and format directly to a base model. Long chains of thought, self-verification and reflection emerged on their own, and reasoning benchmarks improved dramatically, showing that RL alone can elicit strong reasoning from a capable base model.

    But its outputs had poor readability and mixed languages. The full R1 added a small cold-start SFT set of clean reasoning examples before RL, a language-consistency reward, and later SFT and RL stages on broader data, giving readable, general-purpose behavior while keeping the reasoning gains.
