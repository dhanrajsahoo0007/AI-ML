  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: you-are-training-an-agent-model-with-end-to-end-rl-in-your-o
  q: You are training an agent model with end-to-end RL in your own harness. Walk through the environment and reward design.
  a: |
    The environment is your actual harness in sandboxes: real repositories in containers, the same tools the product uses, and tasks drawn from realistic issues with hidden tests or reference solutions. Rollouts run asynchronously at scale because episodes are long and vary in length.

    Rewards come mainly from verifiable outcomes such as hidden tests passing, plus penalties for breaking other tests, excessive steps or cost, and unsafe actions, possibly with a small learned or rubric reward for code quality. Guard against reward hacking such as editing tests or special-casing outputs, and evaluate on held-out task sets before deploying the trained model.
