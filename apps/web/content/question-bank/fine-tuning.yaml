- id: how-do-scaling-laws-influence-the-safety-evaluation-of-large
  q: How do scaling laws influence the safety evaluation of large models?
  a: >
    Scaling laws predict that loss improves smoothly with compute, which lets labs forecast how
    capable a larger model will be before training it. But specific capabilities, including risky
    ones, can appear abruptly, so smooth loss curves do not guarantee no surprises.


    In practice that means evaluating dangerous capabilities on smaller models and intermediate
    checkpoints to extrapolate trends, setting capability thresholds that trigger stronger
    safeguards before deployment, as in responsible scaling policies, investing in strong
    elicitation so evaluations do not underestimate a model, and re-evaluating as scale or
    post-training changes.
  topic: safety
