      url: https://outcomeschool.com/blog/reinforcement-learning-from-human-feedback-rlhf
    - title: Proximal Policy Optimization (PPO)
      url: https://outcomeschool.com/blog/proximal-policy-optimization-ppo
  source: outcome-school
- id: what-is-dpo-and-why-did-it-displace-ppo-based-rlhf-at-many-l
  q: What is DPO and why did it displace PPO-based RLHF at many labs? When is online RL still better?
  a: >
    Direct Preference Optimization shows that the KL-regularized RLHF objective has a closed-form
    optimal policy, which lets you train directly on preference pairs with a simple
    classification-style loss: raise the likelihood of the chosen response relative to the rejected
    one, compared with a frozen reference model. No reward model, no sampling during training and no
    RL loop.


    It displaced PPO in many pipelines because it is simpler, cheaper and more stable. Online RL is
    still better when you can generate fresh samples and score them during training, such as with
    verifiable rewards for math and code, when exploration matters, or when a reusable reward model
    is valuable; DPO is limited to the preference data you already have.
  topic: fine-tuning
  level: Senior
