- id: how-do-you-build-a-training-dataset-without-triggering-model
  q: How do you build a training dataset without triggering model collapse when much of your data is synthetic?
  a: |
    Model collapse happens when models are trained repeatedly on their own outputs, losing the tails of the distribution and amplifying errors. Avoid it by always keeping a large share of real human data, accumulating data across generations rather than replacing real data with synthetic data, and generating synthetic data from strong, diverse sources.

    Filter synthetic data hard: verify correctness with checkers, tests or stronger models, deduplicate, and measure diversity. Use synthetic data where it is verifiable or targeted, such as math, code and specific skills, track the provenance of every sample, and evaluate on real-world held-out data to catch narrowing.
