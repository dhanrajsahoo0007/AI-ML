- id: a-customer-s-distributed-training-job-on-your-gpu-cluster-ge
  q: >-
    A customer's distributed training job on your GPU cluster gets 55% scaling efficiency at 64
    nodes. Debug it.
  a: >
    Profile one step at 8, 16 and 64 nodes to see what grows. Usual suspects: communication not
    overlapped with compute (check NCCL settings, gradient bucket sizes and whether all-reduce runs
    during backward), the network itself (InfiniBand or RoCE misconfiguration, wrong topology
    mapping, a slow link or switch), per-GPU batch too small at scale so compute is too short to
    hide communication, and data loading or storage that cannot keep up.


    Also look for stragglers (one slow node holds back all), synchronization points such as logging
    or checkpointing, and CPU bottlenecks. Run NCCL bandwidth tests across all nodes, fix topology
    and bucket sizes, increase per-GPU work or use sharded or hybrid parallelism, and re-measure
    scaling efficiency.
  topic: fine-tuning
  level: Senior
  companies:
    - Together AI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: fine-tune-an-8b-model-on-a-single-24-gb-gpu-walk-me-through
  q: >-
    Fine-tune an 8B model on a single 24 GB GPU. Walk me through the memory maths and the exact
    stack you'd use.
  a: >
    Full fine-tuning would need about 16 bytes per parameter, roughly 128 GB, so use QLoRA: the 8B
    base in 4-bit NF4 is about 5 GB, LoRA adapters on all linear layers at rank 16 add tens of
    millions of parameters, under 1 GB with gradients and optimizer state, and activations fit with
    gradient checkpointing, a sequence length around 2–4K and a micro-batch of 1–4 with gradient
    accumulation.


    Stack: Hugging Face transformers with PEFT and bitsandbytes (or a faster wrapper such as
    Unsloth), TRL's SFT trainer, FlashAttention, bf16 compute, paged 8-bit AdamW, and the model's
    correct chat template. Evaluate against the base model and merge the adapter into a 16-bit copy
    for serving.
