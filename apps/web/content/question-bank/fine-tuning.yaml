- id: do-the-gpu-memory-maths-for-full-fine-tuning-a-7b-model-in-b
  q: Do the GPU memory maths for full fine-tuning a 7B model in bf16 with Adam. Now with LoRA.
  a: >
    Full fine-tuning with mixed precision and Adam needs about 16 bytes per parameter: 2 for bf16
    weights, 2 for gradients, 4 for fp32 master weights and 8 for Adam's two moments. For 7B that is
    about 112 GB before activations, so it needs multiple GPUs with sharding such as ZeRO or FSDP.


    With LoRA, the frozen bf16 weights take about 14 GB, and adapters of tens of millions of
    parameters need well under 1 GB including gradients and optimizer state. Add activations,
    reduced with gradient checkpointing, and it fits on a single 24–40 GB GPU. QLoRA shrinks the
    base to about 4–5 GB.
  topic: fine-tuning
