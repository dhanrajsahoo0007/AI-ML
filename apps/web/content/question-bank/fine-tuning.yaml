- id: what-is-distillation-and-how-do-you-build-a-strong-small-mod
  q: What is distillation, and how do you build a strong small model from a large one?
  a: >
    Distillation trains a small student to imitate a large teacher. With access to the teacher's
    probabilities, the student matches its full output distribution, which carries more information
    than hard labels; with only generated text, the student is fine-tuned on large amounts of
    teacher outputs.


    To build a strong small model: generate diverse, high-quality prompts covering the target tasks,
    collect teacher responses including reasoning where useful, filter for correctness, train the
    student with SFT and logit matching where possible, and add on-policy distillation, where the
    student generates and the teacher scores or corrects its outputs, to fix the student's own
    mistakes. Evaluate against the teacher on held-out tasks.
  topic: fine-tuning
