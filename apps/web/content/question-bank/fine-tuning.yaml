- id: you-re-training-on-tens-of-thousands-of-gpus-and-hardware-fa
  q: >-
    You're training on tens of thousands of GPUs and hardware fails constantly. How do you keep
    goodput high?
  a: >
    At that scale something fails every few hours, so goodput, the share of time spent on useful
    training, depends on recovering fast. Checkpoint frequently with asynchronous saves to fast
    storage, detect failures quickly with health checks and heartbeats, keep hot spare nodes to swap
    in, and restart automatically from the latest checkpoint.


    Prevent failures where possible with burn-in tests, monitoring of thermals, ECC errors and link
    errors, and draining suspicious nodes. Detect silent data corruption and stragglers, and design
    parallelism so a single failure only requires restarting the job, not rebuilding data pipelines.
    Track goodput as a first-class metric.
  topic: fine-tuning
  level: Senior
  companies:
    - xAI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: design-a-deduplication-pipeline-for-a-web-scale-pretraining
  q: >-
    Design a deduplication pipeline for a web-scale pretraining corpus. It has to run as a streaming
    process.
  a: >
    Normalize text first, then deduplicate at several levels. Exact duplicates are removed by
    hashing normalized documents; near-duplicates are found with MinHash over word shingles and
    locality-sensitive hashing to bucket similar documents; repeated boilerplate lines or paragraphs
    are removed within and across documents.


    As a streaming process, keep the LSH buckets and hash signatures in a sharded key-value store,
    and process documents in order, checking each against existing signatures before inserting.
    Measure the effect by training small ablation models on deduplicated versus raw samples, and
    watch for over-deduplication removing legitimately repeated content such as licenses or common
    code.
  topic: fine-tuning
  level: Senior
  companies:
    - xAI
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: r1-zero-was-trained-with-rl-and-essentially-no-sft-first-wha
  q: >-
    R1-Zero was trained with RL and essentially no SFT first. What did that show, and why did full
    R1 add SFT back?
  a: >
    R1-Zero applied large-scale RL with GRPO and simple rule-based rewards for answer correctness
    and format directly to a base model. Long chains of thought, self-verification and reflection
    emerged on their own, and reasoning benchmarks improved dramatically, showing that RL alone can
    elicit strong reasoning from a capable base model.


    But its outputs had poor readability and mixed languages. The full R1 added a small cold-start
    SFT set of clean reasoning examples before RL, a language-consistency reward, and later SFT and
    RL stages on broader data, giving readable, general-purpose behavior while keeping the reasoning
    gains.
  topic: fine-tuning
  level: Senior
