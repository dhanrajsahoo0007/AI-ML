- id: fine-tune-an-8b-model-on-a-single-24-gb-gpu-walk-me-through
  q: Fine-tune an 8B model on a single 24 GB GPU. Walk me through the memory maths and the exact stack you'd use.
  a: |
    Full fine-tuning would need about 16 bytes per parameter, roughly 128 GB, so use QLoRA: the 8B base in 4-bit NF4 is about 5 GB, LoRA adapters on all linear layers at rank 16 add tens of millions of parameters, under 1 GB with gradients and optimizer state, and activations fit with gradient checkpointing, a sequence length around 2–4K and a micro-batch of 1–4 with gradient accumulation.

    Stack: Hugging Face transformers with PEFT and bitsandbytes (or a faster wrapper such as Unsloth), TRL's SFT trainer, FlashAttention, bf16 compute, paged 8-bit AdamW, and the model's correct chat template. Evaluate against the base model and merge the adapter into a 16-bit copy for serving.
