- id: glm-4-5-s-post-training-trains-expert-models-per-domain-then
  q: GLM-4.5's post-training trains expert models per domain then unifies with self-distillation. Walk through why you would train specialists and then merge them.
  a: |
    Training one model on every skill at once forces trade-offs: data mixtures compete, and RL for reasoning, agents and chat need different rewards and hyperparameters. Training separate expert models per domain lets each reach its best performance with tailored data and RL.

    Self-distillation then unifies them: the experts generate high-quality responses in their domains, and a single general model is fine-tuned on that combined data, possibly followed by joint RL. The final model inherits most of each specialist's strength without serving many models.
  level: Senior
  category: fine-tuning
  subcategory: data-distillation
