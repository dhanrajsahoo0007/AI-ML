- id: explain-grpo-and-why-dropping-the-value-network-matters-at-s
  q: Explain GRPO and why dropping the value network matters at scale.
  a: |
    Group Relative Policy Optimization, introduced in DeepSeekMath, samples a group of responses for each prompt, scores them, and uses each response's reward minus the group mean, divided by the group's standard deviation, as its advantage. The policy update is PPO-like with clipping and a KL term, but there is no learned value function.

    PPO needs a value network roughly the size of the policy, which doubles memory and compute and is hard to train well for long reasoning outputs. Dropping it saves that cost, and the group baseline works well when rewards are verifiable, which made large-scale RL on reasoning practical.
