- id: design-an-end-to-end-pipeline-producing-rlhf-preference-data
  q: 'Design an end-to-end pipeline producing RLHF preference data for a frontier lab: 100k prompt-response comparisons a week, with quality guarantees.'
  a: |
    Source prompts covering target capabilities and edge cases, generate responses from the lab's models, and route comparison tasks to qualified annotators matched by domain. The task UI collects preferences, ratings on rubric dimensions and short rationales.

    Quality guarantees: annotator qualification tests, gold tasks with known answers, agreement monitoring and overlap on a percentage of items, expert review of disagreements, detection of rushed or AI-generated work, and feedback to annotators. Track throughput, cost and quality metrics weekly, and deliver data with provenance and quality scores.
