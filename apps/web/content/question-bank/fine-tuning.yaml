- id: how-does-qlora-achieve-its-memory-reduction-and-what-are-the
  q: How does QLoRA achieve its memory reduction, and what are the quantization trade-offs?
  a: |
    QLoRA stores the frozen base model in 4-bit NormalFloat, a format suited to normally distributed weights, with double quantization of the scaling constants, and dequantizes on the fly in the forward pass. Only small LoRA adapters train in 16-bit, and paged optimizers move optimizer state to CPU memory during spikes. A 65B model became trainable on a single 48 GB GPU.

    Trade-offs: 4-bit weights add a little quantization error, dequantization slows training, and merging adapters back into a 4-bit model for serving needs care, often merging into a higher-precision copy. Quality is usually close to 16-bit LoRA, but check on your task.
