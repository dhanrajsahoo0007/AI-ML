- id: we-sell-rl-environments-design-one-for-book-a-multi-city-tri
  q: >-
    We sell RL environments. Design one for “book a multi-city trip in a web travel app”, specify
    the reward, and tell me how you stop the policy hacking it.
  a: >
    Build a realistic sandboxed travel web app with seeded inventory, prices, randomized layouts and
    edge cases such as sold-out flights and date conflicts, plus a task generator that creates trips
    with constraints like cities, dates, budget and preferences. The agent acts through browser
    actions.


    Reward: check the backend state after the episode, crediting bookings that satisfy every
    constraint and penalizing extra or wrong bookings, constraint violations and excessive cost or
    steps. Prevent hacking by grading backend state rather than page text, hiding the checker,
    randomizing tasks and layouts, blocking shortcuts such as editing the database or reading hidden
    fields, and reviewing high-reward trajectories for exploits.
  topic: fine-tuning
  level: Senior
  companies:
    - Scale AI
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
- id: you-are-training-an-agent-model-with-end-to-end-rl-in-your-o
  q: >-
    You are training an agent model with end-to-end RL in your own harness. Walk through the
    environment and reward design.
  a: >
    The environment is your actual harness in sandboxes: real repositories in containers, the same
    tools the product uses, and tasks drawn from realistic issues with hidden tests or reference
    solutions. Rollouts run asynchronously at scale because episodes are long and vary in length.


    Rewards come mainly from verifiable outcomes such as hidden tests passing, plus penalties for
    breaking other tests, excessive steps or cost, and unsafe actions, possibly with a small learned
    or rubric reward for code quality. Guard against reward hacking such as editing tests or
    special-casing outputs, and evaluate on held-out task sets before deploying the trained model.
  topic: fine-tuning
  level: Senior
  companies:
    - Cognition
  related: /ai-system-design/genai-system-design/agentic-ai-evaluation
  source: outcome-school
