- id: explain-the-lora-decomposition-mathematically-why-does-it-wo
  q: Explain the LoRA decomposition mathematically. Why does it work, and how do you choose the rank r?
  a: |
    LoRA freezes a weight matrix W of size d×k and learns an update ΔW = BA, where B is d×r and A is r×k with rank r much smaller than d and k, scaled by α/r. The forward pass becomes Wx + BAx, B starts at zero so training starts from the base model, and only A and B are trained, r(d+k) parameters instead of dk.

    It works because the weight changes needed to adapt a pre-trained model to a task appear to have low intrinsic rank. Choose r by task: small ranks such as 8–16 suffice for style and format, larger ranks such as 64 or more help when learning new domain knowledge or complex skills; also choose which layers to adapt, since applying LoRA to all linear layers often matters more than raising r. Tune on a validation set.
  level: Senior
  category: fine-tuning
  subcategory: peft
  related: /ai-system-design/genai-system-design/fine-tuning-llms
