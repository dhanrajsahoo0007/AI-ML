- id: design-the-training-setup-for-a-model-that-doesn-t-fit-on-on
  q: >-
    Design the training setup for a model that doesn't fit on one accelerator, say 70B parameters on
    a pod.
  a: >
    A 70B model with Adam needs over 1 TB of weight, gradient and optimizer state, so shard it. Use
    fully sharded data parallelism (ZeRO-3 or FSDP) across the pod, add tensor parallelism inside
    each fast-interconnect group to split large matrices, and pipeline parallelism if per-device
    memory is still too tight. Use bf16 with fp32 master weights, activation checkpointing and fused
    kernels.


    Size the global batch for stable training, overlap communication with computation, checkpoint
    frequently with fast restarts for hardware failures, and monitor throughput (model FLOPs
    utilization), loss and gradient norms. On TPU pods the same ideas map onto sharding annotations
    over a device mesh.
  topic: fine-tuning
  level: Senior
  companies:
    - Google DeepMind
  related: /ai-system-design/genai-system-design/scaling-laws-and-training
  source: outcome-school
- id: walk-me-through-a-post-training-recipe-to-turn-a-pretrained
  q: >-
    Walk me through a post-training recipe to turn a pretrained base model into a personalised
    assistant.
  a: >
    Supervised fine-tuning on high-quality instruction and conversation data teaches format and
    helpfulness. Preference tuning with RLHF or DPO on comparisons improves quality and tone, and
    verifiable-reward RL improves reasoning and tool use where checkable. Safety tuning and red-team
    data shape refusals.


    Personalization then comes mostly from context, not per-user weights: long-term memory of
    preferences and facts retrieved into the prompt, user-editable custom instructions, and possibly
    lightweight per-user adapters where privacy and cost allow. Evaluate personalization with
    multi-session tests and privacy checks.
  topic: fine-tuning
