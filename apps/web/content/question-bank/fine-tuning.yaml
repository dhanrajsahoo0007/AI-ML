- id: compare-sft-rlhf-dpo-and-rlvr-for-improving-an-instruction-t
  q: Compare SFT, RLHF, DPO and RLVR for improving an instruction-tuned model. What data does each need, and when would you pick which?
  a: |
    SFT needs high-quality prompt and response demonstrations and teaches format and new behaviors directly; pick it to add skills or styles. RLHF needs preference comparisons to train a reward model plus an online RL setup; pick it for open-ended quality with a reusable reward model and the infrastructure to run it.

    DPO needs preference pairs only and is simple and stable offline; pick it for alignment and tone improvements with limited infrastructure. RLVR needs prompts with programmatically checkable answers and an RL setup; pick it for reasoning, math, code and tool use where correctness can be verified. Most modern pipelines combine them in that order.
