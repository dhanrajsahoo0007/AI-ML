- id: you-have-one-on-device-base-model-but-a-dozen-features-summa
  q: 'You have one on-device base model but a dozen features: summarization, rewriting, reply suggestions, tone adjustment. How do you specialise without shipping a dozen models?'
  a: |
    Ship one frozen base model and a small LoRA adapter per feature, each fine-tuned for summarization, rewriting, replies or tone. Adapters are a few megabytes, so all of them fit on device, and the runtime loads the right adapter for each request on top of the shared base.

    Train adapters with the quantized base they will run on, evaluate each feature separately plus check the base's general quality, and update adapters independently without re-shipping the base model.
