- id: what-is-catastrophic-forgetting-and-how-do-you-mitigate-it-d
  q: What is catastrophic forgetting and how do you mitigate it during fine-tuning?
  a: |
    Catastrophic forgetting is when fine-tuning on a narrow task overwrites general abilities, so target accuracy rises while performance on everything else, such as instruction following, reasoning or other languages, falls.

    Mitigate with parameter-efficient methods such as LoRA, lower learning rates and fewer epochs, mixing general instruction data into the fine-tuning set (replay), regularizing toward the original weights, and evaluating on a broad benchmark suite alongside the task metric so regressions are caught before release.
