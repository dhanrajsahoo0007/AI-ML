- id: kimi-k1-5-scaled-rl-for-reasoning-without-a-process-reward-m
  q: Kimi K1.5 scaled RL for reasoning without a process reward model or tree search. Why deliberately keep the RL recipe that simple?
  a: |
    Process reward models and tree search are expensive, hard to train well and easy to hack, and they complicate scaling. Kimi K1.5's bet was that long-context RL, letting the model produce very long chains of thought with outcome-based rewards, lets the model learn planning, reflection and correction on its own.

    A simple recipe is easier to scale, debug and make efficient, with fewer components that can fail or be exploited. Their results suggested that context length and outcome rewards, rather than elaborate search machinery, drive much of the reasoning improvement.
