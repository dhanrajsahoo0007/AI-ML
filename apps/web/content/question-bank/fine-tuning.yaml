# Company-reported questions adapted from Outcome School (Apache 2.0); see NOTICE.md. Answers are our own.
- id: walk-me-through-rlhf-end-to-end-reward-model-policy-optimisa
  q: "Walk me through RLHF end to end: reward model, policy optimisation, KL penalty."
  a: >
    Start from a supervised fine-tuned model. Collect prompts, sample several responses, and have
    people rank or compare them. Train a reward model, usually the LLM with a scalar head, to
    predict which response people prefer.


    Then optimize the policy with reinforcement learning, classically PPO: generate responses, score
    them with the reward model, and update the policy to increase reward. A KL penalty against the
    original SFT model is subtracted from the reward so the policy does not drift into odd text that
    exploits the reward model, and a value network estimates expected reward to reduce variance.
  topic: fine-tuning
  level: Mid
  companies: []
  related: /ai-system-design/genai-system-design/fine-tuning-llms
  refs:
